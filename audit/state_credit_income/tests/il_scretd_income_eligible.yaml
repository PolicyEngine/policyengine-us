# Target: policyengine_us/tests/policy/baseline/gov/states/il/idor/scretd/il_scretd_income_eligible.yaml
# Batch F (sweep). Not run. Fails on main (06c0dcbc54), where the test sums
# irs_gross_income, which holds only the taxable part of Social Security.
#
# Law: 320 ILCS 30/2(h): "Household income" has the meaning given in the
# Senior Citizens and Persons with Disabilities Property Tax Relief Act.
# 320 ILCS 25/3.07: "Income" means federal adjusted gross income "modified by
# adding thereto ... (D) An amount equal to the amount of benefits paid under
# the Federal Social Security Act during the taxable year".
# 320 ILCS 30/2(j)(5): maximum household income is $75,000 for tax year 2025.

- name: Batch F IL, all Social Security benefits count in household income.
  period: 2025
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 30_000
        social_security_retirement: 60_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    # Income = AGI + Social Security not in AGI = 30,000 pension + 60,000
    # Social Security = 90,000, whatever part of the benefits is taxable.
    # 90,000 > 75,000, so not eligible.
    # Main: gross income = 30,000 + taxable Social Security (26,600: half of
    # 9,000 plus 85% of 26,000 of provisional income above 34,000) = 56,600,
    # under the limit, so it returns true.
    il_scretd_income_eligible: false
