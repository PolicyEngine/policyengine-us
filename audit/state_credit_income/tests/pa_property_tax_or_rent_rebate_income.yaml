# Target: policyengine_us/tests/policy/baseline/gov/states/pa/tax/property/property_tax_or_rent_rebate/pa_property_tax_or_rent_rebate_income.yaml
# Each case fails on main (06c0dcbc54) and passes once the gap is fixed.
# 53 P.S. 6926.1303, "Income": "All income from whatever source derived,
# including, but not limited to: (1) Salaries, wages, bonuses, commissions,
# income from self-employment, alimony, support money, cash public assistance
# and relief." 2025 PA-1000 booklet, lines 10, 11a, 11c and 11d.
# ssi and pa_ssp are pinned to zero, as in the existing cases, so each case
# isolates its income source.

- name: Alimony from a pre-2019 divorce counts once.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        alimony_income: 6_000
        divorce_year: 2010
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Line 11c: alimony 6,000. It is already in federal adjusted gross income
    # (divorce before 2019), so nothing more is added. Main: 12,000.
    pa_property_tax_or_rent_rebate_income: 6_000

- name: Wages count at their gross amount, before a 401(k) deferral.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        employment_income: 20_000
        traditional_401k_contributions: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Line 11a: "Gross salaries, wages, bonuses, commissions" = 20,000.
    # Main counts federal taxable wages: 18,000.
    pa_property_tax_or_rent_rebate_income: 20_000

- name: The claimant's cash public assistance counts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        taxable_private_pension_income: 10_000
        general_assistance: 2_400
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Line 6: pension 10,000. Line 11d: cash public assistance 2,400.
    # Total 12,400. Main: 10,000.
    pa_property_tax_or_rent_rebate_income: 12_400

- name: A farm loss offsets the same person's business profit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        self_employment_income: 20_000
        farm_operations_income: -5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Line 10: "net income or loss from a business, profession, or farm" =
    # 20,000 - 5,000 = 15,000. Main drops the farm loss: 20,000.
    pa_property_tax_or_rent_rebate_income: 15_000
