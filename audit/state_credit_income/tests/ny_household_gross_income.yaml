# Target: policyengine_us/tests/policy/baseline/gov/states/ny/tax/income/credits/ny_household_gross_income.yaml
# Each case fails on main (06c0dcbc54) and passes once the gap is fixed.
# N.Y. Tax Law 606(e)(1)(C), taxable years before 2025: household gross income
# is "the aggregate adjusted gross income of all members of the household"
# plus, among others, "support money not included in adjusted gross income",
# "the gross amount of any pension or annuity benefits to the extent not
# included in such adjusted gross income (including ... veterans' disability
# pensions)", "workers' compensation", "the gross amount of 'loss-of-time'
# insurance" and "the amount of cash public assistance and relief".
# Every case uses 2024, the last year the credit reads this measure.

- name: Workers' compensation counts in household gross income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    workers_compensation: 4_000
  output:
    # IT-214 line 9 (federal AGI) 5,000 + line 15 (workers' compensation)
    # 4,000 = 9,000. Main: 5,000.
    ny_household_gross_income: 9_000

- name: Child support received counts as support money.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    child_support_received: 3_000
  output:
    # 5,000 + line 15 (support money) 3,000 = 8,000. Main: 5,000.
    ny_household_gross_income: 8_000

- name: Veterans' disability benefits count.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    veterans_benefits: 6_000
  output:
    # 5,000 + line 11 (veterans' disability pensions) 6,000 = 11,000.
    # Main: 5,000.
    ny_household_gross_income: 11_000

- name: A pension left out of federal AGI counts at its gross amount.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    tax_exempt_private_pension_income: 2_000
  output:
    # 5,000 + line 13 (pensions and annuities not on lines 9 to 12) 2,000
    # = 7,000. Main: 5,000.
    ny_household_gross_income: 7_000

- name: Cash public assistance counts.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    general_assistance: 2_400
  output:
    # 5,000 + line 14 (cash public assistance and relief) 2,400 = 7,400.
    # Main: 5,000.
    ny_household_gross_income: 7_400

- name: Tax-exempt disability insurance benefits count at their gross amount.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    disability_benefits: 3_000
    tax_exempt_disability_benefits: 3_000
  output:
    # The benefits are outside federal AGI (IRC 104(a)(3)), so AGI is 5,000.
    # Line 15 (gross amount of loss-of-time insurance) adds 3,000: 8,000.
    # Main: 5,000.
    ny_household_gross_income: 8_000

- name: Foreign earned income excluded under section 911 counts.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: NY
    employment_income: 5_000
    foreign_earned_income_exclusion: 4_000
  output:
    # PolicyEngine income inputs are net of the exclusion, so AGI is 5,000.
    # Line 15 (income earned abroad exempted by section 911) adds 4,000:
    # 9,000. Main: 5,000.
    ny_household_gross_income: 9_000

- name: Another household member's income counts, though they file their own return.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 70
        employment_income: 5_000
      child:
        age: 40
        employment_income: 6_000
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [child]
    households:
      household:
        members: [parent, child]
        state_code: NY
  output:
    # 606(e)(1)(B): the household is the qualified taxpayer "and all other
    # persons, not necessarily related, who have the same residence". A child
    # is a relative under IRC 152(d)(2)(A), so the roomer exception does not
    # apply. Household gross income is 5,000 + 6,000 = 11,000 for each
    # claimant. Main: [5,000, 6,000].
    ny_household_gross_income: [11_000, 11_000]
