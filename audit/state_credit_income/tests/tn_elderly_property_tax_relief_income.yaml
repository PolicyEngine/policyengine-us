# Target: policyengine_us/tests/policy/baseline/gov/states/tn/tax/property/elderly_property_tax_relief/tn_elderly_property_tax_relief_income.yaml (new file)
# and .../tn_elderly_property_tax_relief_eligible.yaml (Case B).
# Batch F (sweep). Not run. Each case fails on main (06c0dcbc54), where
# tn_elderly_property_tax_relief_income = adjusted_gross_income.
#
# Law: T.C.A. 67-5-702(a)(2) "annual income from all sources"; Tenn. Comp. R. &
# Regs. 0600-03-.08(3): "Annual income from all sources shall include, but is
# not limited to, social security payments after the Medicare deduction, ...
# supplemental security income, retirement and pension benefits ..., veteran's
# benefits, worker's compensation, unemployment compensation, salaries and
# wages, alimony, total interest and total dividends. ... When determining the
# income using a tax return, the adjusted gross income amount is used. This
# amount is added to any income sources specified above which may not be
# taxable by IRS standards."

- name: Batch F TN A, nontaxable sources are added to adjusted gross income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 5_000
        veterans_benefits: 12_000
        workers_compensation: 10_000
        tax_exempt_interest_income: 3_000
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # AGI: 5,000 (taxable pension).
    # Added under Rule 0600-03-.08(3): veterans' benefits 12,000 + workers'
    # compensation 10,000 + tax-exempt interest 3,000 ("total interest").
    # 5,000 + 12,000 + 10,000 + 3,000 = 30,000. Main returns 5,000.
    tn_elderly_property_tax_relief_income: 30_000

- name: Batch F TN B, Social Security alone can exceed the income limit.
  period: 2026
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 45_000
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # Federal AGI is 0: provisional income is 22,500 (half of 45,000), under
    # the 25,000 base, so no Social Security is taxable. Main therefore finds
    # income 0 and eligibility true.
    # Rule 0600-03-.08(3) counts "social security payments after the Medicare
    # deduction". A year of standard Part B premiums is under 3,000, so income
    # is over 42,000, above the 38,470 limit for tax year 2026.
    tn_elderly_property_tax_relief_eligible: false
