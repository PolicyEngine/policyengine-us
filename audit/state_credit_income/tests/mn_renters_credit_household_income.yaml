# Target: policyengine_us/tests/policy/baseline/gov/states/mn/tax/income/credits/mn_renters_credit_household_income.yaml
# Batch A audit case. It replaces the existing "Case 3, other adult household
# income counts", which expects [64_800, 70_000]; this case fails on
# upstream/main 06c0dcbc54 and passes once only the claimant's and spouse's
# income counts. mn_renters_credit_household_agi.yaml may need the same change.

- name: Case 3, another adult's income is not the renter's household income.
  # Minn. Stat. 290.0693, subd. 1(g) takes "household" from 290A.03, subd. 4:
  # "a claimant and an individual related to the claimant as the claimant's
  # spouse who are domiciled in the same homestead". Subd. 7: "If a homestead
  # is occupied by two or more renters who are not married to each other ...
  # The income of each renter shall be each renter's household income".
  # 2025 Schedule M1RENT instructions (page 3), "Lived with a roommate":
  # "Include only your income when filing for the credit."
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 66
        employment_income: 10_000
        is_tax_unit_head: true
      person2:
        age: 40
        employment_income: 60_000
        is_tax_unit_head: true
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # person1: 10,000 - 5,200 (age 65 or older, subd. 1(i)(6)) = 4,800.
    # person2: 60,000.
    # Main: [64_800, 70_000].
    mn_renters_credit_household_income: [4_800, 60_000]
