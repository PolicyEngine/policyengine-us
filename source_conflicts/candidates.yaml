- id: us-hi:joint-return-claimable-spouse-exemption
  program: income-tax
  years:
    from: 2023
    type: tax
  question: Does the non-claimable spouse retain a personal exemption under the per-individual statute despite instructions
    to leave both exemption ovals blank?
  sources:
  - kind: statute
    citation: HRS 235-54(a)
    url: https://files.hawaii.gov/tax/legal/hrs/hrs_235.pdf#page=45
  - kind: instructions
    citation: Form N-11 instructions line 6a from 2023
    url: null
  readings:
    statute: Only the claimable individual's exemption becomes zero; the other spouse retains $1,144.
    other: Leaving both ovals blank gives no exemption for the joint return.
  example: The other spouse retains $1,144 under the statute versus $0 under the joint-return instruction reading.
  pe_us:
    follows: statute
    code:
    - policyengine_us/variables/gov/irs/income/taxable_income/exemptions/exemptions_count.py
    - policyengine_us/variables/gov/states/hi/tax/income/exemptions/hi_regular_exemptions.py
