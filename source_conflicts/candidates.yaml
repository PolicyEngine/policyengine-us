- id: us-ny:ssp-spousal-deeming-subtraction
  program: ssi-state-supplement
  years:
    from: 2026
    type: calendar
  question: Under spousal deeming, does New York's state supplement subtract the claimant's SSI plus countable income
    from the standard of need, as Social Services Law 209(4) reads, or the greater of the FBR or countable income
    once, as 18 NYCRR 398-2.1(ac) and 398-4.4(b) are read together?
  sources:
  - kind: statute
    citation: N.Y. Soc. Serv. Law §209(4)
    url: https://www.nysenate.gov/legislation/laws/SOS/209
  - kind: regulation
    citation: 18 NYCRR 398-2.1(ac), (g) and (o)
    url: https://www.law.cornell.edu/regulations/new-york/18-NYCRR-398-2.1
  - kind: regulation
    citation: 18 NYCRR 398-4.4(b)
    url: https://www.law.cornell.edu/regulations/new-york/18-NYCRR-398-4.4
  - kind: manual
    citation: SSA POMS SI 01320.430 D
    url: https://secure.ssa.gov/poms.nsf/lnx/0501320430
  readings:
    statute: The standard of need is reduced by "the sum of such individual's or couple's supplemental security
      income benefit plus countable income".
    other: 398-2.1(ac) sets the State benefit rate at the standard of need minus "the FBR or a recipient's monthly
      Countable Income, whichever is greater", and 398-4.4(b) subtracts the greater of the two from that rate again.
      Read to subtract once, with deemed income counted (398-2.1(g)) against the claimant's own individual FBR,
      the regulation pays the standard less the greater amount. SSA's method for federally administered supplements
      (POMS SI 01320.430 D) is a third reading and uses the couple rate.
  example: 'Integration Case 11: a claimant living with an ineligible spouse has countable income of 650.83, including
    deemed income, and SSI of 840.17 against a 1,017 standard. Subtracting once pays 1,017 - max(994, 650.83) =
    23; the statute subtracts 840.17 + 650.83 = 1,491 and pays 0.'
  pe_us:
    follows: conflicting-source
    code:
    - policyengine_us/variables/gov/states/ny/otda/ssp/ny_ssp.py
    prs:
    - https://github.com/PolicyEngine/policyengine-us/pull/10158
  state: unreviewed
  note: The model follows the regulation read to subtract once (NOTE in ny_ssp.py); integration.yaml Cases 6 and
    11 pin it. Read literally, 398-2.1(ac) and 398-4.4(b) subtract the greater amount twice, which would pay a claimant
    living alone with no income nothing instead of $87. New York has administered its own supplement since October
    1, 2014. Whether a state regulation that departs from the statute's text binds as a Treasury regulation would
    is not yet ruled.
