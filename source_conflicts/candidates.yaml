  readings:
    statute: Current law follows federal Subchapter J for beneficiaries' income and deductions, disabling only IRC
      §642(h), so losses pass through.
    other: The booklet prohibits an irrevocable-trust loss on Schedule E part II using a rule for years before January
      1, 2005.
