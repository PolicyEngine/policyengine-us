# Known conflicts between a statute and a regulation, form, instructions,
# manual, guidance, calculator or agency practice that are not yet entries in
# the shared register (rulespec-us known-source-conflicts.yaml). Each moves to
# the register once its sources are captured and its excerpts verified; delete
# it here in the same change. test_source_conflicts.py checks this file.
#
# pe_us.follows: statute | conflicting-source (against the statute; the
# 2026-10-19 rule calls for a model change) | gap-fill (the statute is silent
# and the code follows the form) | not-modelled | unknown.
# state: ruled (PolicyEngine has picked) | open (asked, not yet decided) |
# unreviewed.
version: 1
candidates:
- id: us-ak:snap-abawd-implementation-date
  program: snap
  years:
    from: 2025
    to: 2025
    type: calendar
  question: Do the amended SNAP ABAWD rules apply in Alaska from July 4, 2025 or the agency's November 1, 2025 implementation
    date?
  sources:
  - kind: statute
    citation: P.L. 119-21 (OBBBA) SNAP ABAWD amendments; 7 U.S.C. 2015(o)
    url: null
  - kind: agency-practice
    citation: Alaska Department of Health "H.R. 1 - AK Impacts"
    url: https://health.alaska.gov/en/education/hr-1-ak-impacts/
  readings:
    statute: The federal effective date is 2025-07-04.
    other: Alaska applies the changes from 2025-11-01.
  example: In August 2025, PR 10299 applies the changes in Alaska as well as Texas.
  pe_us:
    follows: statute
    code:
    - policyengine_us/parameters/gov/states/ak/dpa/snap/work_requirements/abawd/hr1_in_effect.yaml
    - policyengine_us/variables/gov/usda/snap/eligibility/work_requirements/is_snap_abawd_hr1_in_effect.py
    prs:
    - https://github.com/PolicyEngine/policyengine-us/pull/8861
    - https://github.com/PolicyEngine/policyengine-us/pull/10299
  state: unreviewed
  note: PR 10299 adopts the July 4, 2025 enactment date, consistent with FNS; the change is in flight. Section 10102
    has no later effective date. A 7 U.S.C. 2015(o)(7) good-faith exemption requires a state request and a federal
    determination; none covering July through October 2025 was found. Alaska's separately modeled good-faith window
    starts November 1, 2025, and its area waivers and retained exceptions are unchanged.
