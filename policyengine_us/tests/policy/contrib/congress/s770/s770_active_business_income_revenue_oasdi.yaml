- name: Combined rate transfer works with the active option independently enabled
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: false
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.transfer.mode: 1
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    s770_nii_taxable_base: 100_000
    s770_active_taxable_base: 100_000
    s770_nii_addon_tax: 0
    s770_active_business_income_tax: 16_200
    net_investment_income_tax: 20_000
    # No NII add-on means no transfer of the existing 3.8 percent tax.
    s770_existing_niit_revenue_oasdi: 0
    s770_nii_addon_revenue_oasdi: 0
    s770_active_business_income_revenue_oasdi: 12_400
    s770_revenue_oasdi: 12_400

- name: Combined rate transfer with zero addon preserves NII threshold consumption
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.nii_addon.rate: 0
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.transfer.mode: 1
    taxable_interest_income: 20_000
    s_corp_income: 20_000
    niit_magi: 230_000
    filing_status: SINGLE
  output:
    # NII still takes 20,000 of the shared 30,000 MAGI excess first.
    s770_nii_taxable_base: 20_000
    s770_active_taxable_base: 10_000
    s770_nii_addon_tax: 0
    s770_active_business_income_tax: 1_620
    net_investment_income_tax: 2_380
    s770_existing_niit_revenue_oasdi: 0
    s770_nii_addon_revenue_oasdi: 0
    s770_active_business_income_revenue_oasdi: 1_240
    s770_revenue_oasdi: 1_240

- name: Bill transfer has its own start year
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.transfer.mode: 3
    gov.contrib.congress.s770.section_8.transfer.start_year: 2027
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    net_investment_income_tax: 32_400
    s770_existing_niit_revenue_oasdi: 0
    s770_nii_addon_revenue_oasdi: 0
    s770_active_business_income_revenue_oasdi: 0
    s770_revenue_oasdi: 0

