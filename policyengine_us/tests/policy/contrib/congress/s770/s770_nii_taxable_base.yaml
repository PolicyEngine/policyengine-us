- name: Zero addon rate still reserves NII threshold room
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.nii_addon.rate: 0
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    taxable_interest_income: 20_000
    s_corp_income: 20_000
    niit_magi: 230_000
    filing_status: SINGLE
  output:
    s770_nii_taxable_base: 20_000
    s770_active_taxable_base: 10_000
    s770_nii_addon_tax: 0
    s770_active_business_income_tax: 1_620
    # .038 x 20,000 + .162 x 10,000.
    net_investment_income_tax: 2_380

- name: Zero active rate does not change the NII allocation
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.rate: 0
    taxable_interest_income: 20_000
    s_corp_income: 20_000
    niit_magi: 230_000
    filing_status: SINGLE
  output:
    s770_nii_taxable_base: 20_000
    s770_active_taxable_base: 10_000
    s770_nii_addon_tax: 2_480
    s770_active_business_income_tax: 0
    net_investment_income_tax: 3_240

- name: Custom NOL permission preserves the supplied deduction
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.deny_nol: false
    net_investment_income: -10_000
    s770_niit_nol_deduction: 30_000
    s_corp_income: 20_000
    niit_magi: 250_000
    filing_status: SINGLE
  output:
    s770_nii_base: -10_000
    s770_nii_taxable_base: 0
    s770_active_taxable_base: 10_000
    s770_nii_addon_tax: 0
    s770_active_business_income_tax: 1_620
    net_investment_income_tax: 1_620

- name: The active option can start later than the NII addon
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.start_year: 2027
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    s770_nii_addon_tax: 12_400
    s770_active_business_income_tax: 0
    net_investment_income_tax: 16_200

- name: The NII addon can start later than the active option
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.nii_addon.start_year: 2027
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    s770_nii_addon_tax: 0
    s770_active_business_income_tax: 16_200
    net_investment_income_tax: 20_000
