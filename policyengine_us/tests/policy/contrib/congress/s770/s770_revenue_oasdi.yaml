- name: Bill transfer mode sends 62 percent of all resulting NIIT to OASDI
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.transfer.mode: 3
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    net_investment_income_tax: 32_400
    s770_existing_niit_revenue_oasdi: 2_356
    s770_nii_addon_revenue_oasdi: 7_688
    s770_active_business_income_revenue_oasdi: 10_044
    s770_revenue_oasdi: 20_088

- name: Combined rate allocation sends 12.4 of 16.2 percentage points to OASDI
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.congress.s770.section_8.section_8
  input:
    gov.contrib.congress.s770.section_8.nii_addon.in_effect: true
    gov.contrib.congress.s770.section_8.active_business.in_effect: true
    gov.contrib.congress.s770.section_8.transfer.mode: 1
    taxable_interest_income: 100_000
    s_corp_income: 200_000
    niit_magi: 400_000
    filing_status: SINGLE
  output:
    net_investment_income_tax: 32_400
    s770_existing_niit_revenue_oasdi: 3_800 * .124 / .162
