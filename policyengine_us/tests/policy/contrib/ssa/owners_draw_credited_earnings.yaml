# Where overridden, synthetic caps are fixed in both the ordinary tax parameter
# and the captured current-law room parameter.
# Unless overridden, q = 1 - 0.5 * (0.124 + 0.029) = 0.9235.
# Policy cases are grouped to retain at most five cached reform combinations.
- name: Disabling benefit credit leaves draw taxes unchanged
  period: 2036
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.benefit_credit: false
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    s_corp_income: 150_000
  output:
    owners_draw_net_earnings: 138_525
    owners_draw_oasdi_base: 138_525
    owners_draw_oasdi_tax: 17_177.10
    owners_draw_credited_earnings: 0


- name: An explicit zero phase-in share produces no draw
  period: 2027
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 0
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    s_corp_income: 150_000
  output:
    owners_draw_gross: 0
    owners_draw_net_earnings: 0
    owners_draw_oasdi_tax: 0


- name: A configurable linear phase-in starts at one quarter in its new start year
  period: 2030
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_years: 4
    gov.contrib.ssa.owners_draw.start_year: 2030
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    s_corp_income: 100_000
  output:
    owners_draw_gross: 25_000
    owners_draw_net_earnings: 23_087.50
    owners_draw_oasdi_tax: 2_862.85


