# Form 7206 lines 4-13 with the owners' draw reform on. Line 5 counts the
# net profits of every business subject to SE tax, so it includes the draw's
# gross profit, and line 7's deductible SE tax includes the draw's SECA.
# Synthetic caps follow owners_draw.yaml; q = 1 - 0.5 * (0.124 + 0.029) =
# 0.9235, and HI on the draw defaults off. Expected values are hand-computed.

- name: Schedule C plan business with an owners' draw counts the draw in line 5
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    self_employment_income: 40_000
    # 64,970.22 x 0.9235 = 59,999.998 of draw net earnings.
    s_corp_income: 64_970.22
    self_employed_health_insurance_premiums: 8_000
  output:
    owners_draw_gross: 64_970.22
    owners_draw_net_earnings: 59_999.998
    # Schedule C SE tax: 40,000 x 0.9235 x 15.3% = 5,651.82. Draw OASDI:
    # 59,999.998 x 12.4% = 7,440.00. Half of 13,091.82 = 6,545.91.
    self_employment_tax_ald_person: 6_545.91
    # Line 5: 40,000 + 64,970.22 = 104,970.22. Line 6: 0.3810605.
    # Line 7: 6,545.91 x 0.3810605 = 2,494.39. Line 13: 40,000 - 2,494.39.
    # Without the draw in line 5 the share would be 1: 40,000 - 6,545.91 =
    # 33,454.09.
    self_employed_health_insurance_earned_income_limit: 37_505.61
    # The $8,000 of premiums is below either limit.
    self_employed_health_insurance_ald_person: 8_000

- name: Premiums above the old limit show the deduction effect
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    self_employment_income: 40_000
    s_corp_income: 64_970.22
    self_employed_health_insurance_premiums: 36_000
  output:
    self_employed_health_insurance_earned_income_limit: 37_505.61
    # Below 37,505.61 but above the 33,454.09 that omitting the draw gives.
    self_employed_health_insurance_ald_person: 36_000

- name: Without a draw the reform leaves the limit unchanged
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    self_employment_income: 40_000
    farm_operations_income: 10_000
  output:
    owners_draw_gross: 0
    # 50,000 x 0.9235 x 15.3% / 2 = 3,532.39.
    self_employment_tax_ald_person: 3_532.39
    # 40,000 / 50,000 = 0.8; 40,000 - 0.8 x 3,532.39 = 37,174.09, as at
    # baseline.
    self_employed_health_insurance_earned_income_limit: 37_174.09

- name: Without a Schedule C business the limit stays zero
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    s_corp_income: 64_970.22
    self_employed_health_insurance_premiums: 8_000
  output:
    self_employment_tax_ald_person: 3_720
    # Line 4 is zero, so line 13 and the deduction are zero.
    self_employed_health_insurance_earned_income_limit: 0
    self_employed_health_insurance_ald_person: 0
