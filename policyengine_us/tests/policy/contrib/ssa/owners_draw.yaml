- name: Signed entity profits and subsets net before the draw floor
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    # T-Q-K: 100-20-30=50; 100-(-20)-30=90; 50-20=30;
    # -50+20=-30; and (-20-10)-(-10)=-20, all in thousands.
    s_corp_income: [50_000, 50_000, 50_000, -50_000, -20_000]
    partnership_income: [50_000, 50_000, -20_000, 20_000, -10_000]
    passive_partnership_s_corp_income: [20_000, -20_000, 0, 0, 0]
    partnership_self_employment_net_earnings: [30_000, 30_000, 0, 0, -10_000]
    owners_draw_subsets_are_disjoint: true
    self_employment_income: [0, 0, 0, 50_000, 50_000]
  output:
    owners_draw_active_income: [50_000, 90_000, 30_000, -30_000, -20_000]
    owners_draw_gross: [50_000, 90_000, 30_000, 0, 0]
    owners_draw_net_earnings: [46_175, 83_115, 27_705, 0, 0]
    # E1 residual losses do not offset preexisting SE income.
    taxable_self_employment_income: [27_705, 27_705, 0, 46_175, 36_940]


