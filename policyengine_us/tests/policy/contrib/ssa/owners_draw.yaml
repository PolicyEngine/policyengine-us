# Synthetic caps are fixed in both the ordinary tax parameter and the captured
# current-law room parameter, so these examples do not depend on projections.
# Unless overridden, q = 1 - 0.5 * (0.124 + 0.029) = 0.9235.
# Policy cases are grouped to retain at most five cached reform combinations.
- name: Full draw for an S-corporation owner without wages
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    s_corp_income: 150_000
  output:
    owners_draw_active_income: 150_000
    owners_draw_planned_gross: 150_000
    owners_draw_gross: 150_000
    owners_draw_net_earnings: 138_525
    owners_draw_oasdi_room: 200_000
    owners_draw_oasdi_base: 138_525
    # 138,525 * 12.4% = 17,177.10; HI defaults off.
    owners_draw_oasdi_tax: 17_177.10
    owners_draw_hi_tax: 0
    self_employment_social_security_tax: 17_177.10
    self_employment_medicare_tax: 0
    self_employment_tax_ald_person: 8_588.55
    owners_draw_credited_earnings: 138_525
    owners_draw_niit_exclusion: 150_000
    # The source remains in gross income exactly once.
    irs_gross_income: 150_000


- name: Wages leave only 100000 of room for 200000 of S-corporation profits
  period: 2027
  absolute_error_margin: 0.02
  reforms: policyengine_us.reforms.ssa.owners_draw.owners_draw
  input:
    gov.contrib.ssa.owners_draw.current_law_cap: 200_000
    gov.contrib.ssa.owners_draw.in_effect: true
    gov.contrib.ssa.owners_draw.phase_in_share: 1
    gov.irs.payroll.social_security.cap: 200_000
    gov.simulation.aime_lookback_years: 0
    payroll_tax_gross_wages: 100_000
    s_corp_income: 200_000
  output:
    owners_draw_gross: 200_000
    owners_draw_net_earnings: 184_700
    owners_draw_oasdi_room: 100_000
    owners_draw_oasdi_base: 100_000
    owners_draw_oasdi_tax: 12_400
    owners_draw_hi_tax: 0
    self_employment_tax_ald_person: 6_200
    # M7: only profits whose net earnings face OASDI leave active NIIT.
    # 100,000 / 0.9235 = 108,283.7033, rather than the whole draw.
    owners_draw_niit_exclusion: 108_283.7033
    owners_draw_credited_earnings: 184_700


