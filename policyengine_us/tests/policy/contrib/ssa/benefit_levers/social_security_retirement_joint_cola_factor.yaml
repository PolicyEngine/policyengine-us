    gov.contrib.ssa.benefit_levers.cola.pp_change: 0.0015
    social_security_retirement_reported: 12000
  output:
    # This row's inferred eligibility is 2027, first COLA January 2028.
    social_security_retirement_joint_cola_factor: 1
    social_security_retirement: 12000

