- name: CPI-E precision survives the statutory baseline rounding
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 70
    gov.contrib.ssa.benefit_levers.cola.start_year: 2027
    gov.contrib.ssa.benefit_levers.cola.pp_change: 0.0015
    social_security_retirement_reported: 12000
  output:
    # January 2027 baseline is 3.6%; 12000 * 1.0375 / 1.036.
    social_security_retirement_joint_cola_factor: 1.0014478764478765
    social_security_retirement: 12017.374517374517

- name: Newly eligible retirement has no same-year COLA exposure
  period: 2027
  input:
