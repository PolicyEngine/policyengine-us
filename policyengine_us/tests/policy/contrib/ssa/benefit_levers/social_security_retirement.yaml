- name: Reported components retain current-law annual amounts
  period: 2027
  input:
    social_security_retirement_reported: 12000
    social_security_disability_reported: 6000
    social_security_survivors_reported: 3000
    social_security_dependents_reported: 1000
  output:
    social_security_retirement: 12000
    social_security_disability: 6000
    social_security_survivors: 3000
    social_security_dependents: 1000
    social_security: 22000

- name: Independent across-the-board and payable factors multiply once
  period: 2027
  input:
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: 0.1
    gov.contrib.ssa.benefit_levers.payable.share: 0.8
    social_security_retirement_reported: 12000
    social_security_disability_reported: 6000
    social_security_survivors_reported: 3000
    social_security_dependents_reported: 1000
  output:
    social_security_retirement: 10560
    social_security_disability: 5280
    social_security_survivors: 2640
    social_security_dependents: 880
    social_security: 19360

- name: Across-the-board change begins in its payment year
  period: 2026
  input:
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: 0.1
    social_security_retirement_reported: 12000
  output:
    social_security_retirement: 12000

- name: OASI-only payable share preserves disability and dependent DI benefits
  period: 2027
  input:
    gov.contrib.ssa.benefit_levers.payable.share: 0.8
    gov.contrib.ssa.benefit_levers.payable.oasi_only: true
    social_security_dependents_fund: [oasi, di]
    social_security_retirement_reported: [12000, 0]
    social_security_disability_reported: [6000, 0]
    social_security_survivors_reported: [3000, 0]
    social_security_dependents_reported: [1000, 6000]
  output:
    social_security_retirement: [9600, 0]
    social_security_disability: [6000, 0]
    social_security_survivors: [2400, 0]
    social_security_dependents: [800, 6000]

- name: A full across-the-board cut produces zero
  period: 2027
  input:
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: -1
    social_security_retirement_reported: 12000
  output:
    social_security_retirement: 0

- name: Explicit public and aggregate inputs remain final overrides in core YAML
  period: 2027
  input:
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: 0.1
    social_security_retirement_reported: 12000
    social_security_retirement: 0
    social_security: 777
  output:
    social_security_retirement: 0
    social_security: 777

- name: A COLA change composes with across-the-board and payable changes
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 70
    gov.contrib.ssa.benefit_levers.cola.start_year: 2027
    gov.contrib.ssa.benefit_levers.cola.pp_change: 0.0015
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: 0.1
    gov.contrib.ssa.benefit_levers.payable.share: 0.8
    social_security_retirement_reported: 12000
  output:
    social_security_retirement: 10575.289575289577

- name: Complete calculated base bypasses every population benefit factor
  period: 2027
  input:
    age: 70
    gov.contrib.ssa.benefit_levers.cola.start_year: 2027
    gov.contrib.ssa.benefit_levers.cola.pp_change: 0.0015
    gov.contrib.ssa.benefit_levers.across_the_board.start_year: 2027
    gov.contrib.ssa.benefit_levers.across_the_board.rate: 0.1
    gov.contrib.ssa.benefit_levers.payable.share: 0.8
    social_security_retirement_source: supplied_pia
    # This replaces the calculator's complete checks, including its PIA,
    # COLAs, across-the-board change and payable share before the earnings test.
    social_security_retirement_base: 10000
    social_security_retirement_pia_ratio_factor: 1.2
    social_security_retirement_joint_cola_factor: 1.3
  output:
    # The public route returns 10000 * 1. Applying 1.1 * 0.8 again would
    # incorrectly reduce these already calculated checks to 8800.
    social_security_retirement: 10000

- name: Selecting an OASI-only basis before depletion remains neutral
  period: 2027
  input:
    gov.contrib.ssa.benefit_levers.payable.share: 1
    gov.contrib.ssa.benefit_levers.payable.oasi_only: true
    social_security_dependents_reported: 6000
  output:
    social_security_dependents: 6000
