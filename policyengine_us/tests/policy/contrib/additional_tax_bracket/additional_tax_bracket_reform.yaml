- name: Unset added bracket, default 2025 parameters, joint filer.
  period: 2025
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.additional_tax_bracket.additional_tax_bracket_reform.additional_tax_bracket
  input:
    gov.contrib.additional_tax_bracket.in_effect: true
    taxable_income: 1_000_000
    filing_status: JOINT
  output:
    # The reform's 2025 brackets are the enacted 2025 brackets, so this is
    # the 2025 joint rate table (Rev. Proc. 2024-40, section 2.01, Table 1):
    # $202,154.50 plus 37% of the excess over $751,600
    # = 202,154.50 + 0.37 * 248,400 = 294,062.50.
    regular_tax_before_credits: 294_062.5
    income_tax_main_rates: 294_062.5

# 26 U.S.C. 1(h)(1)(A)(ii)(I), "the amount of taxable income taxed at a rate
# below 25 percent", follows the rate schedule in force. From 2026 the
# reform's schedule is 10, 15, 25, 28, 33, 35 and 39.6 percent, so the
# amount ends at the top of its 15 percent bracket ($49,300 single), not at
# the top of the baseline 24 percent bracket ($201,775).
- name: Additional tax bracket reform's own amount taxed below 25 percent
  period: 2026
  reforms: policyengine_us.reforms.additional_tax_bracket.additional_tax_bracket_reform.additional_tax_bracket
  input:
    gov.contrib.additional_tax_bracket.in_effect: true
    filing_status: SINGLE
    taxable_income: 300_000
    long_term_capital_gains: 200_000
    unrecaptured_section_1250_gain: 100_000
  output:
    taxable_income_taxed_below_25_percent: 49_300
    # Schedule D Tax Worksheet: line 13 100,000; line 14 200,000; line 18
    # 100,000; line 19 49,300; line 20 49,300; line 21 100,000.
    dwks19: 100_000
    # Taxed at the regular rates: the greater of 100,000 or the lesser of
    # 49,300 and 200,000.
    capital_gains_excluded_from_taxable_income: 200_000

- name: The same household without the reform
  period: 2026
  input:
    filing_status: SINGLE
    taxable_income: 300_000
    long_term_capital_gains: 200_000
    unrecaptured_section_1250_gain: 100_000
  output:
    taxable_income_taxed_below_25_percent: 201_775
    dwks19: 200_000
    capital_gains_excluded_from_taxable_income: 100_000

# 26 U.S.C. 1(h)(1), "shall not exceed", on the reform's rate schedule. From
# 2026 the schedule taxes $49,300 to $119,400 (single) at 25 percent, below
# the 28 percent of subparagraph (F). Single, taxable income $100,000, all
# $50,000 of net capital gain 28-percent rate gain. Regular rate amount:
# the greater of $50,000 or the lesser of $49,300 and $100,000, $50,000; its
# tax is 10% of $12,150 plus 15% of $37,150 plus 25% of $700 = $6,962.50.
# Subparagraph (F): 28% of the other $50,000 = $14,000. The tax on all
# $100,000 is $6,787.50 plus 25% of $50,700 = $19,462.50, so the capital
# gains tax is $12,500, not $14,000.
- name: Additional tax bracket reform's own limit on the regular tax
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.additional_tax_bracket.additional_tax_bracket_reform.additional_tax_bracket
  input:
    gov.contrib.additional_tax_bracket.in_effect: true
    filing_status: SINGLE
    taxable_income: 100_000
    long_term_capital_gains: 50_000
    capital_gains_28_percent_rate_gain: 50_000
  output:
    capital_gains_excluded_from_taxable_income: 50_000
    income_tax_main_rates: 6_962.50
    tax_on_taxable_income_at_main_rates: 19_462.50
    capital_gains_tax: 12_500
