# With its default parameters the reform's added bracket is unset: brackets 7
# and 8 both have a threshold of infinity for every filing status and year.
# Bracket 8 then runs from infinity to infinity, and the clip form
# clip(x, inf, inf) - inf = inf - inf made every household's tax NaN,
# whatever its income. An unset bracket must add nothing, so the reform's tax
# is the tax at the first seven brackets of its own schedule.
- name: Unset added bracket, default 2026 parameters, joint filer.
  period: 2026
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.additional_tax_bracket.additional_tax_bracket_reform.additional_tax_bracket
  input:
    gov.contrib.additional_tax_bracket.in_effect: true
    taxable_income: 1_000_000
    filing_status: JOINT
  output:
    # The reform's own 2026 joint schedule, bracket tops 24,300, 98,600,
    # 199,000, 303,250, 541,550 and 611,750, rates 10, 15, 25, 28, 33, 35 and
    # 39.6%. Its parameter file sets these from 2026; they are not current
    # law, whose 2026 rates are 10, 12, 22, 24, 32, 35 and 37%:
    # 0.10 * 24,300 + 0.15 * 74,300 + 0.25 * 100,400 + 0.28 * 104,250
    # + 0.33 * 238,300 + 0.35 * 70,200 + 0.396 * (1,000,000 - 611,750)
    # = 2,430 + 11,145 + 25,100 + 29,190 + 78,639 + 24,570 + 153,747
    # = 324,821.
    regular_tax_before_credits: 324_821
    income_tax_main_rates: 324_821

