  input:
    gov.contrib.local.nyc.stc.adjust_income_limit_by_filing_status_and_eligibility_by_children: true
    people:
      person1:
        age: 67
        employment_income: 200_000
        taxable_ira_distributions: 100_000
      person2:
        age: 66
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        in_nyc: true
  output:
    adjusted_gross_income: 300_000
    nyc_school_credit_income: 200_000
    nyc_school_tax_credit_eligible: true
    # 300,000 - 20,000 pension and annuity exclusion - 16,050 standard deduction.
    nyc_taxable_income: 263_950
    nyc_school_tax_credit_fixed_amount: 125
    # 21,600 x 0.171% + (263,950 - 21,600) x 0.228% = 36.936 + 552.558.
    nyc_school_tax_credit_rate_reduction_amount: 589.49
    nyc_school_tax_credit: 714.49

