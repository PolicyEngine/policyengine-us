    people:
      person1:
        age: 45
        employment_income: 260_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        taxable_ira_distributions: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        in_nyc: true
  output:
    adjusted_gross_income: 260_000
    nyc_school_credit_income: 260_000
    nyc_school_tax_credit_eligible: false
    nyc_school_tax_credit: 0

