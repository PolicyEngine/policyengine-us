    nyc_taxable_income: 262_950
    # 36.936 + (262,950 - 21,600) x 0.228% = 36.936 + 550.278.
    nyc_school_tax_credit_rate_reduction_amount: 587.21
    nyc_school_tax_credit: 712.21

