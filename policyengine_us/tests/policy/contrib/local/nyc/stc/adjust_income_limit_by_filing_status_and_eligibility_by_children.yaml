      person1:
        age: 45
        employment_income: 250_001
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
        in_nyc: true
  output:
    nyc_school_credit_income: 250_001
    nyc_school_tax_credit_eligible: false
    nyc_school_tax_credit: 0

- name: Case 4, a dependent's IRA distribution is not in AGI and does not reduce income.
