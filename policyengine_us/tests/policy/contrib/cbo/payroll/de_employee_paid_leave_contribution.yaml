- name: Delaware paid leave retains the federal wage cap under the secondary threshold reform.
  period: 2027
  reforms: policyengine_us.reforms.cbo.payroll.increase_taxable_earnings_for_social_security.increase_taxable_earnings_for_social_security
  absolute_error_margin: 0.01
  input:
    state_code: DE
    employer_headcount: 25
    gov.contrib.cbo.payroll.secondary_earnings_threshold: 250_000
    gov.irs.payroll.social_security.cap: 192_300
    payroll_tax_gross_wages: 400_000
  output:
    # 19 Del. C. 3701(24) and 19 DE Admin. Code 1401, section 5.5 retain the cap.
    taxable_earnings_for_social_security: 342_300
    de_paid_leave_contribution_rate: 0.008
    # Each share is 192,300 * (0.4% + 0.08% + 0.32%) * 50% = 769.20.
    de_employee_paid_leave_contribution: 769.20
    de_employer_paid_leave_contribution: 769.20
