- name: Reform not in effect
  period: 2026
  input:
    people: 
      person1:
        age: 40
        is_tax_unit_head: true
      person2: 
        age: 40
        is_tax_unit_spouse: true
      person3:
        age: 10
        is_tax_unit_dependent: true
