    md_refundable_eitc: 100
    income_tax_refundable_credits: 800
  output:
    md_montgomery_eitc: 56
    household_refundable_state_tax_credits: 100
    household_refundable_local_tax_credits: 56
    household_refundable_tax_credits: 156
