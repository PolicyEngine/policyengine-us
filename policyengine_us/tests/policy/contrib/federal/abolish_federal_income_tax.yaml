- name: Abolishing federal income tax still computes federal credits but leaves them out of net income
  # Texas single parent, one child aged 5, $15,000 of 2025 wages. Values from
  # gov.irs.credits (Rev. Proc. 2024-40 and the 2025 CTC amounts):
  # EITC: 4,328 / 34% = 12,730 phase-in end <= 15,000 < 23,350 phase-out start,
  #   so the one-child maximum, 4,328.
  # ACTC: min(1,700, 15% * (15,000 - 2,500) = 1,875) = 1,700; tax before
  #   credits is 0 (head of household standard deduction 23,625).
  # Federal refundable credits 4,328 + 1,700 = 6,028, none in net income.
  period: 2025
  absolute_error_margin: 1
  input:
    gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax: true
    people:
      parent:
        age: 30
        employment_income: 15_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    eitc: 4_328
    refundable_ctc: 1_700
    income_tax_refundable_credits: 6_028
    income_tax: 0
    income_tax_refundable_credits_in_force: 0
    household_refundable_tax_credits: 0
