# With gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax on,
# income_tax_before_refundable_credits is zero and household refundable tax
# credits leave out federal refundable credits. Every other component of the
# household totals stays. Most cases pin the other components and leave one
# to its own formula, with federal income tax left to its formula.

- name: Abolishing federal income tax drops federal tax and refundable credits
  period: 2022
  input:
    gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax: true
    income_tax_refundable_credits: 800
    co_income_tax_before_refundable_credits: 1_000
    hi_refundable_credits: 600
  output:
    income_tax_before_refundable_credits: 0
    federal_income_tax_in_force: false
    income_tax_refundable_credits_in_force: 0
    household_refundable_tax_credits: 600
    household_state_tax_before_refundable_credits: 1_000
    household_tax_before_refundable_credits: 1_000

- name: Abolishing federal income tax keeps several state refundable credits
  period: 2022
  input:
    gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax: true
    income_tax_refundable_credits: 800
    co_income_tax_before_refundable_credits: 1_000
    hi_refundable_credits: 600
    co_refundable_credits: 900
  output:
    household_refundable_tax_credits: 1_500
    household_state_tax_before_refundable_credits: 1_000
    household_tax_before_refundable_credits: 1_000

- name: Federal income tax and refundable credits count when not abolished
  period: 2022
  input:
    gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax: false
    income_tax_before_refundable_credits: 1_200
    income_tax_refundable_credits: 800
    co_income_tax_before_refundable_credits: 1_000
    hi_refundable_credits: 600
  output:
    federal_income_tax_in_force: true
    income_tax_refundable_credits_in_force: 800
    household_refundable_tax_credits: 1_400  # 800 + 600
    household_state_tax_before_refundable_credits: 1_000
    household_tax_before_refundable_credits: 2_200

- name: Abolishing federal income tax preserves Montgomery County refundable EITC
