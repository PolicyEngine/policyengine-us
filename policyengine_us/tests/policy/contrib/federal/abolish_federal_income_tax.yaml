# The reform's household totals are the baseline totals less the federal
# member, so every other baseline component stays in them. Each case below
# pins the other components and leaves one of them to its own formula or input.
- name: Abolishing federal income tax keeps the Idaho permanent building fund tax
  period: 2025
  reforms: policyengine_us.reforms.federal.abolish_federal_income_tax.abolish_federal_income_tax
  input:
    gov.contrib.ubi_center.flat_tax.abolish_federal_income_tax: true
    state_code: ID
    employment_income: 60_000
    employee_payroll_tax: 4_590
    income_tax_before_refundable_credits: 5_000
    income_tax_refundable_credits: 800
    id_income_tax_before_refundable_credits: 2_000
    id_refundable_credits: 100
    household_market_income: 60_000
    household_benefits: 0
  output:
    id_pbf: 10
    household_state_tax_before_refundable_credits: 2_010
    household_tax_before_refundable_credits: 6_600  # 4,590 + 2,000 + 10
    household_refundable_tax_credits: 100
    household_net_income: 53_500  # 60,000 + 100 - 6,600

