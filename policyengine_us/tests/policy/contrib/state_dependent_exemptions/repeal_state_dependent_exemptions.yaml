    people:
      head:
        age: 22
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units: {tax_unit: {members: [head], filing_status: SINGLE}}
    households: {household: {members: [head], state_code: HI}}
  output:
    hi_regular_exemptions: 0
    hi_exemptions: 0

