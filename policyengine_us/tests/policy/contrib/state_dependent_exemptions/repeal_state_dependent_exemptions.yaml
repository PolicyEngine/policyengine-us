# HRS 235-54(a): the exemption of an individual whom another taxpayer can claim
# is zero, including the additional exemption for age 65 or over. The repeal
# removes dependents only, so it never gives such a filer an exemption.
- name: HI repeal - unclaimed but claimable single filer - baseline
  period: 2025
  input:
    gov.contrib.repeal_state_dependent_exemptions.in_effect: false
    people:
      head:
        age: 22
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units: {tax_unit: {members: [head], filing_status: SINGLE}}
    households: {household: {members: [head], state_code: HI}}
  output:
    hi_regular_exemptions: 0
    hi_exemptions: 0

- name: HI repeal - unclaimed but claimable single filer - reform
  period: 2025
  reforms: policyengine_us.reforms.state_dependent_exemptions.repeal_state_dependent_exemptions.repeal_state_dependent_exemptions
  input:
