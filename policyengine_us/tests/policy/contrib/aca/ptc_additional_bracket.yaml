# Eligibility exclusion regression tests: the reform must reuse the baseline
# coverage/premium gate (gov.aca.ineligible_coverage via pays_aca_premium)
# rather than a narrower hardcoded exclusion list, as the 700% FPL reform
# does (#8937).
- name: Reform excludes Basic Health Program (NY Essential Plan) enrollee
  period: 2026
  reforms: policyengine_us.reforms.aca.aca_ptc_additional_bracket.aca_ptc_additional_bracket
  input:
    gov.contrib.aca.ptc_additional_bracket.in_effect: true
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        medicaid_income_level: 2.3
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_chip_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.3
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    is_basic_health_program_eligible: [true]
    pays_aca_premium: [false]
    is_aca_ptc_eligible: [false]

