- name: AZ dependent credit reform - default reproduces baseline (no-op)
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    people:
      parent: {age: 40, employment_income: 30_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 200}

- name: AZ dependent credit reform - amount zero eliminates the credit
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    gov.contrib.states.az.dependent_credit.amount: 0
    people:
      parent: {age: 40, employment_income: 30_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 0}

- name: AZ dependent credit reform - age limit excludes dependents at or over the age
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 30_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 100}

- name: AZ dependent credit reform - age at limit threshold is excluded
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 30_000}
      child1: {age: 13, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: AZ}}
  # Dependent at the age limit (13 == threshold) is excluded; over-age fallback is nothing.
  output: {az_dependent_tax_credit_potential: 0}

- name: AZ dependent credit reform - age one below threshold is included
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.az.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 30_000}
      child1: {age: 12, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: AZ}}
  # Dependent one year under the limit (12 < 13) receives the credit.
  output: {az_dependent_tax_credit_potential: 100}

# With default settings the reform keeps the baseline's rule for a filer who
# can be claimed as a dependent: such a return has no dependents (A.R.S.
# 43-1001(3), IRC 152(b)(1)).
- name: AZ dependent credit reform - default keeps no dependent credit for a single filer who can be claimed
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    people:
      filer: {age: 19, claimed_as_dependent_on_another_return: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [filer, child], filing_status: SINGLE, adjusted_gross_income: 10_000}}
    households: {household: {members: [filer, child], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 0}

- name: AZ dependent credit reform - default keeps no dependent credit on a joint return with a claimable spouse (the claimable spouse is the head)
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    people:
      person_a: {age: 20, claimed_as_dependent_on_another_return: true, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_b: {age: 22, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [person_a, person_b, child], filing_status: JOINT, adjusted_gross_income: 10_000}}
    households: {household: {members: [person_a, person_b, child], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 0}

- name: AZ dependent credit reform - default keeps no dependent credit on a joint return with a claimable spouse (the claimable spouse is the spouse)
  period: 2025
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform.az_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    people:
      person_b: {age: 22, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_a: {age: 20, claimed_as_dependent_on_another_return: true, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [person_b, person_a, child], filing_status: JOINT, adjusted_gross_income: 10_000}}
    households: {household: {members: [person_b, person_a, child], state_name: AZ}}
  output: {az_dependent_tax_credit_potential: 0}
