- name: The per-period gate pays nothing while the flag is off.
  period: 2026
  absolute_error_margin: 0
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_refundable_dependent_credit_reform
  input:
    people:
      person1:
        age: 35
        is_tax_unit_head: true
      child1:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, child1]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 20_000
        az_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [person1, child1]
        state_code: AZ
  output:
    az_refundable_dependent_tax_credit: 0

- name: Composes with the dependent-credit contrib's flat amount.
  period: 2026
  absolute_error_margin: 1
  reforms:
    - policyengine_us.reforms.states.az.dependent_credit.az_dependent_credit_reform
    - policyengine_us.reforms.states.az.dependent_credit.az_refundable_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.in_effect: true
    gov.contrib.states.az.dependent_credit.amount: 100
    gov.contrib.states.az.dependent_credit.refundable.in_effect: true
    people:
      person1:
        age: 35
        is_tax_unit_head: true
      child1:
        age: 5
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, child1, child2]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 20_000
        az_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [person1, child1, child2]
        state_code: AZ
  output:
    # The contrib's $100 flat amount overrides the age-based $125 schedule.
    az_dependent_tax_credit_potential: 200
    az_refundable_dependent_tax_credit: 200
