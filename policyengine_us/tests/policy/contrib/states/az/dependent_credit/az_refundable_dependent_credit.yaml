- name: Refund pays the credit stranded past the liability cap.
  period: 2026
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.az.dependent_credit.az_refundable_dependent_credit_reform
  input:
    gov.contrib.states.az.dependent_credit.refundable.in_effect: true
    people:
      person1:
        age: 35
        is_tax_unit_head: true
      child1:
        age: 5
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, child1, child2]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 50_000
        az_income_tax_before_non_refundable_credits: 100
    households:
      household:
        members: [person1, child1, child2]
        state_code: AZ
  output:
    # Potential is $125 per dependent under 17 = $250; $100 of liability
    # absorbs the nonrefundable portion, leaving $150 as a refund.
    az_dependent_tax_credit_potential: 250
    az_refundable_dependent_tax_credit: 150

- name: With no liability the whole credit pays out as a refund.
