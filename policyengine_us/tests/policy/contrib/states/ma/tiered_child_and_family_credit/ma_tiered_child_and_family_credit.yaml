# Tests for the Massachusetts tiered Child and Family Tax Credit reform.

- name: Children in the two lower age bands receive $610 each in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.tiered_child_and_family_credit.ma_tiered_child_and_family_credit.ma_tiered_child_and_family_credit
  input:
    gov.contrib.states.ma.tiered_child_and_family_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 35
      child_age_5:
        is_tax_unit_dependent: true
        age: 5
      child_age_12:
        is_tax_unit_dependent: true
        age: 12
    tax_units:
      tax_unit:
        members: [head, child_age_5, child_age_12]
    households:
      household:
        state_code: MA
        members: [head, child_age_5, child_age_12]
  output:
    # 610 (age 0-5 band) + 610 (age 6-12 band) = 1,220.
    ma_child_and_family_credit: 1_220

