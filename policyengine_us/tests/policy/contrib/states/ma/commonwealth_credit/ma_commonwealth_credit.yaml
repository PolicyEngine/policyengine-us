# Tests for the Massachusetts Commonwealth Credit reform.

- name: Childless tax unit keeps the EITC match and gets no Commonwealth Credit in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        eitc: 1_000
        eitc_child_count: 0
    households:
      household:
        state_code: MA
        members: [head]
  output:
    ma_commonwealth_credit: 0
    # 40% match of the federal EITC is retained: 0.4 x 1,000 = 400.
    ma_eitc: 400

- name: One qualifying child at zero income receives the full credit in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc: 0
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 0
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # No phase-in: the full 1,800 is available with no earnings.
    ma_commonwealth_credit: 1_800
    # The match is replaced for units with qualifying children.
    ma_eitc: 0

- name: Two and three qualifying children receive the scheduled maximums in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc_child_count: 2
        eitc_earned_income: 0
        adjusted_gross_income: 0
    households:
      household:
        state_code: MA
        members: [head]
  output:
    ma_commonwealth_credit: 3_000

- name: Five qualifying children add the additional child amount beyond three in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc_child_count: 5
        eitc_earned_income: 0
        adjusted_gross_income: 0
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # 3,300 (three-child maximum) + 2 x 300 = 3,900.
    ma_commonwealth_credit: 3_900

- name: Head of household phase-out at 8 percent above 30,000 in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 40_000
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # 1,800 - 0.08 x (40,000 - 30,000) = 1,000.
    ma_commonwealth_credit: 1_000

- name: Phase-out applies to AGI rather than earnings in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc_child_count: 1
        eitc_earned_income: 40_000
        adjusted_gross_income: 10_000
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # The credit decouples from the federal EITC income measure: only AGI
    # (10,000, below the 30,000 threshold) matters, not the 40,000 of
    # earnings, so the full 1,800 is paid.
    ma_commonwealth_credit: 1_800

