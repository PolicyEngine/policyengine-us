  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
      spouse:
        is_tax_unit_spouse: true
        age: 30
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 40_000
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # 1,800 - 0.08 x (40,000 - 38,000) = 1,640.
    ma_commonwealth_credit: 1_640

