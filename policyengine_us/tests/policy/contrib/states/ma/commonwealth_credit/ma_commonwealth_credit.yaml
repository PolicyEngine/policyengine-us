- name: Married filing separately uses the non-joint threshold in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
        eitc: 500
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 40_000
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # Separate filers are eligible and share the non-joint threshold with
    # single and head-of-household filers:
    # 1,800 - 0.08 x (40,000 - 30,000) = 1,000.
    ma_commonwealth_credit: 1_000
    # The match is still replaced for units with qualifying children.
    ma_eitc: 0

- name: Refundable credits include the Commonwealth Credit and the baseline CFTC in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 30
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc: 0
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 0
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # Commonwealth Credit 1,800 + baseline child and family credit 440
    # (this reform leaves Part A at current law).
    ma_refundable_credits: 2_240

- name: Parent with a dependent full-time college student age 20 receives the one-child credit in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 45
        employment_income: 15_000
      student_20:
        is_tax_unit_dependent: true
        is_full_time_college_student: true
        age: 20
    tax_units:
      tax_unit:
        members: [head, student_20]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        state_code: MA
        members: [head, student_20]
  output:
    # A dependent full-time college student under 24 is an EITC-qualifying
    # child, so eitc_child_count derives to 1 and the Commonwealth Credit
    # pays. Earnings = AGI = 15,000 < 30,000 threshold, so no phase-out and
    # the full one-child maximum applies.
    ma_commonwealth_credit: 1_800

- name: AGI phase-out from real employment income in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
        employment_income: 50_000
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # Employment income is the only income, so AGI is 50,000.
    # 1,800 - 0.08 x (50,000 - 30,000) = 1,800 - 1,600 = 200.
    ma_commonwealth_credit: 200

- name: Reform applied but in_effect omitted keeps the full EITC match and pays no Commonwealth Credit in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    # in_effect is not set (defaults to false), so the formula in_effect
    # gate returns baseline behavior even though the reform is applied.
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc: 1_000
        eitc_child_count: 1
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # Baseline: no Commonwealth Credit and the full 40% EITC match is kept
    # for all filers (0.4 x 1,000 = 400).
    ma_commonwealth_credit: 0
    ma_eitc: 400

- name: Both reforms together pay the Commonwealth Credit and tiered CFTC for a low-income family in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms:
    - policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
    - policyengine_us.reforms.states.ma.tiered_child_and_family_credit.ma_tiered_child_and_family_credit.ma_tiered_child_and_family_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    gov.contrib.states.ma.tiered_child_and_family_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 30
        employment_income: 10_000
      child_age_3:
        is_tax_unit_dependent: true
        age: 3
      child_age_7:
        is_tax_unit_dependent: true
        age: 7
    tax_units:
      tax_unit:
        members: [head, child_age_3, child_age_7]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        state_code: MA
        members: [head, child_age_3, child_age_7]
  output:
    # Commonwealth Credit: eitc_child_count derives to 2; earnings == AGI ==
    # 10,000 < 30,000 threshold, so the full two-child maximum of 3,000 pays.
    ma_commonwealth_credit: 3_000
    # Tiered CFTC: 610 (age 3, 0-5 band) + 610 (age 7, 6-12 band) = 1,220.
    ma_child_and_family_credit: 1_220
    # Refundable credits: 3,000 + 1,220 = 4,220 (EITC match replaced to 0,
    # no other MA refundable credits apply).
    ma_refundable_credits: 4_220

- name: Single filer at exactly the 30,000 threshold receives the full credit in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 30_000
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # AGI equals the threshold, so no phase-out applies:
    # 1,800 - 0.08 x max(30,000 - 30,000, 0) = 1,800.
    ma_commonwealth_credit: 1_800

- name: Single filer phase-out at 8 percent above 30,000 in 2025
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        age: 30
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 35_000
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # Single filers share the non-joint threshold:
    # 1,800 - 0.08 x (35,000 - 30,000) = 1,400.
    ma_commonwealth_credit: 1_400
