- name: Refundable credits include the Commonwealth Credit and the baseline CFTC in 2027
  period: 2027
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ma.commonwealth_credit.ma_commonwealth_credit.ma_commonwealth_credit
  input:
    gov.contrib.states.ma.commonwealth_credit.in_effect: true
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 30
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc: 0
        eitc_child_count: 1
        eitc_earned_income: 0
        adjusted_gross_income: 0
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # Commonwealth Credit 1,800 + baseline child and family credit 440
    # (this reform leaves Part A at current law).
    ma_refundable_credits: 2_240
