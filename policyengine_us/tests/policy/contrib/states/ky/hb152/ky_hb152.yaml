- name: KY HB 152 - end-to-end high earner through ky_income_tax
  period: 2027
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ky.graduated_income_tax.ky_graduated_income_tax_reform.ky_graduated_income_tax
  input:
    gov.contrib.states.ky.hb152.in_effect: true
    people:
      person1:
        age: 45
        # The 0.5% charitable floor leaves $10,000 of itemized deductions:
        # 11,550 - (310,000 x 0.005) = 10,000.
        employment_income: 310_000
        charitable_cash_donations: 11_550
      person2:
        age: 43
        employment_income: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # CLIFF: 300000 * 0.06 = 18000
    ky_income_tax_before_non_refundable_credits_joint:
      - 18000
      - 0
    ky_taxable_income_indiv: [300_000, 0]
    ky_taxable_income_joint: [300_000, 0]
    ky_income_tax_before_non_refundable_credits_unit: 18_000
    # High earner: family size credit rate is 0%, so no credit reduction
    ky_family_size_tax_credit_rate_if_joint: 0
    ky_family_size_tax_credit_rate_if_separate: 0
    # Verify reform flows through to final ky_income_tax
    ky_income_tax: 18000

