# California Proposition 3 (2026) keeps the 10.3%, 11.3% and 12.3% rates after 2030.
#
# The `reforms:` key applies the bypass instance of the reform (`ca_prop3`), which restores
# the rates for 2031-2100 whatever gov.contrib.states.ca.prop3.in_effect says, so these cases
# do not set the toggle. The app path, which reads the dated toggle, is tested in
# test_ca_prop3_reform.py. The reform-off controls are the 2030 and 2031 cases in
# baseline/gov/states/ca/tax/income/ca_income_tax_before_credits.yaml.
#
# Expected values apply the 2031 thresholds by hand: the published FTB 2026 schedules
# uprated by f = 198.360243 / 177.11375, the growth of gov.states.ca.cpi from 2026 to 2031
# (see the 2030-2031 note in ca_income_tax_before_credits.yaml).
# The baseline single and separate 2031 tax is 3,310.88f + .093 x (income - 75,197f);
# Prop 3 adds .01 x (income - t) above each of t = 384,109f, 460,927f and 768,213f.
# Head of household uses 3,739.45f, 102,356f and t = 522,385f, 626,864f and 1,044,771f.
# Joint and surviving spouse tax is twice the single
# tax on half the income (RTC § 17045).

- name: Prop 3 keeps the higher rates for a single filer with $1 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 88,875.815 + .01 x (1,000,000 - 430,186.56)
    # + .01 x (1,000,000 - 516,219.62) + .01 x (1,000,000 - 860,367.52).
    ca_income_tax_before_credits: 100_808.08

- name: Prop 3 keeps the higher rates for a separate filer with $1 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SEPARATE
    state_code: CA
  output:
    # Same schedule as single: 88,875.815 + 11,932.263 = 100,808.08.
    ca_income_tax_before_credits: 100_808.08

- name: Prop 3 keeps the higher rates for joint filers with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: JOINT
    state_code: CA
  output:
    # 2 x 100,808.08, the single tax on $1 million.
    ca_income_tax_before_credits: 201_616.16

- name: Prop 3 keeps the higher rates for a surviving spouse with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: SURVIVING_SPOUSE
    state_code: CA
  output:
    # Treated as a joint return: 2 x 100,808.08.
    ca_income_tax_before_credits: 201_616.16

- name: Prop 3 keeps the higher rates for a head of household with $1.5 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_500_000
    filing_status: HEAD_OF_HOUSEHOLD
    state_code: CA
  output:
    # Baseline 133,027.02 + .01 x (1,500,000 - 585,050.09)
    # + .01 x (1,500,000 - 702,062.35) + .01 x (1,500,000 - 1,170,101.30) = 153,454.88.
    ca_income_tax_before_credits: 153_454.88

- name: Prop 3 applies only the 10.3% rate inside the first surcharge bracket in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 450_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 37,725.815 + .01 x (450,000 - 430,186.56) = 37,923.95.
    ca_income_tax_before_credits: 37_923.95

- name: Prop 3 applies the 10.3% and 11.3% rates inside the second surcharge bracket in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 600_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 51,675.81 + .01 x (600,000 - 430,186.56)
    # + .01 x (600,000 - 516,219.62) = 54,211.75.
    ca_income_tax_before_credits: 54_211.75

- name: Prop 3 does not change tax below the 10.3% threshold in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 300_000
    filing_status: SINGLE
    state_code: CA
  output:
    # 3,310.88f + .093 x (300,000 - 75,197f), the same as the baseline.
    ca_income_tax_before_credits: 23_775.81

- name: Prop 3 does not change 2030 tax, when the higher rates already apply
  period: 2030
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Same as the 2030 baseline, using the 2026 anchors times 194.502345 / 177.11375.
    ca_income_tax_before_credits: 101_239.69

- name: Prop 3 removes the AMT that the 2031 rate expiry exposes
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
    ca_amti: 1_400_000
    ca_amt_exemption: 0
    ca_non_refundable_credits: 0
  output:
    # Tentative minimum tax .07 x 1,400,000 = 98,000 is below the 100,808.08 regular tax,
    # so AMT is 0 (the baseline AMT is 9,124.19; see alternative_minimum_tax/ca_amt.yaml).
    ca_income_tax_before_credits: 100_808.08
    ca_amt: 0
    ca_income_tax_before_refundable_credits: 100_808.08

- name: Prop 3 regular tax and the 1% mental health services tax stack for a single filer with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: SINGLE
    state_code: CA
    ca_non_refundable_credits: 0
    ca_amt: 0
  output:
    # Regular tax 181,875.815 + .01 x (2,000,000 - 430,186.56)
    # + .01 x (2,000,000 - 516,219.62) + .01 x (2,000,000 - 860,367.52) = 223,808.08,
    # plus MHST .01 x 1,000,000 = 10,000.
    ca_income_tax_before_credits: 223_808.08
    ca_income_tax_before_refundable_credits: 233_808.08
