# California Proposition 3 (2026) keeps the 10.3%, 11.3% and 12.3% rates after 2030.
#
# The `reforms:` key applies the bypass instance of the reform (`ca_prop3`), which restores
# the rates for 2031-2100 whatever gov.contrib.states.ca.prop3.in_effect says, so these cases
# do not set the toggle. The app path, which reads the dated toggle, is tested in
# test_ca_prop3_reform.py. The reform-off controls are the 2030 and 2031 cases in
# baseline/gov/states/ca/tax/income/ca_income_tax_before_credits.yaml.
#
# Expected values apply the 2031 thresholds by hand: the FTB 2026 schedules (FTB Tax News,
# October 2026) uprated by f = 196.85 / 176.713083. The baseline single and separate 2031
# tax is 3,310.88f + .093 x (income - 75,197f); Prop 3 adds .01 x (income - t) above each of
# t = 384,109f, 460,927f and 768,213f. Head of household uses 3,739.45f, 102,356f and
# t = 522,385f, 626,864f and 1,044,771f. Joint and surviving spouse tax is twice the single
# tax on half the income (RTC § 17045).

- name: Prop 3 keeps the higher rates for a single filer with $1 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 2031 is 88,897.94; Prop 3 adds 1% on 85,571.61, 2% on 342,302.04 and 3% on 144,247.13.
    ca_income_tax_before_credits: 100_927.11

- name: Prop 3 keeps the higher rates for a separate filer with $1 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SEPARATE
    state_code: CA
  output:
    # Same schedule as single: 88,897.94 + 12,029.17.
    ca_income_tax_before_credits: 100_927.11

- name: Prop 3 keeps the higher rates for joint filers with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: JOINT
    state_code: CA
  output:
    # 2 x 100,927.11, the single tax on $1 million.
    ca_income_tax_before_credits: 201_854.21

- name: Prop 3 keeps the higher rates for a surviving spouse with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: SURVIVING_SPOUSE
    state_code: CA
  output:
    # Treated as a joint return: 2 x 100,927.11.
    ca_income_tax_before_credits: 201_854.21

- name: Prop 3 keeps the higher rates for a head of household with $1.5 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_500_000
    filing_status: HEAD_OF_HOUSEHOLD
    state_code: CA
  output:
    # Baseline 133,061.73 + .01 x (1,500,000 - 581,912.13) + .01 x (1,500,000 - 698,296.79)
    # + .01 x (1,500,000 - 1,163,825.38) = 153,621.39.
    ca_income_tax_before_credits: 153_621.39

- name: Prop 3 applies only the 10.3% rate inside the first surcharge bracket in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 450_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 37,747.94 + .01 x (450,000 - 427,879.22) = 37,969.14.
    ca_income_tax_before_credits: 37_969.14

- name: Prop 3 applies the 10.3% and 11.3% rates inside the second surcharge bracket in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 600_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Baseline 51,697.94 + .01 x (600,000 - 427,879.22) + .01 x (600,000 - 513,450.83) = 54,284.63.
    ca_income_tax_before_credits: 54_284.63

- name: Prop 3 does not change tax below the 10.3% threshold in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 300_000
    filing_status: SINGLE
    state_code: CA
  output:
    # 3,310.88f + .093 x (300,000 - 75,197f), the same as the baseline.
    ca_income_tax_before_credits: 23_797.94

- name: Prop 3 does not change 2030 tax, when the higher rates already apply
  period: 2030
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
  output:
    # Same as the 2030 baseline case.
    ca_income_tax_before_credits: 101_358.81

- name: Prop 3 removes the AMT that the 2031 rate expiry exposes
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 1_000_000
    filing_status: SINGLE
    state_code: CA
    ca_amti: 1_400_000
    ca_amt_exemption: 0
    ca_non_refundable_credits: 0
  output:
    # Tentative minimum tax .07 x 1,400,000 = 98,000 is below the 100,927.11 regular tax,
    # so AMT is 0 (the baseline AMT is 9,102.06; see alternative_minimum_tax/ca_amt.yaml).
    ca_income_tax_before_credits: 100_927.11
    ca_amt: 0
    ca_income_tax_before_refundable_credits: 100_927.11

- name: Prop 3 regular tax and the 1% mental health services tax stack for a single filer with $2 million in 2031
  period: 2031
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ca.prop3.ca_prop3
  input:
    ca_taxable_income: 2_000_000
    filing_status: SINGLE
    state_code: CA
    ca_non_refundable_credits: 0
    ca_amt: 0
  output:
    # Regular tax 181,897.94 + .01 x (2,000,000 - 427,879.22) + .01 x (2,000,000 - 513,450.83)
    # + .01 x (2,000,000 - 855,752.87) = 223,927.11, plus MHST .01 x 1,000,000 = 10,000.
    ca_income_tax_before_credits: 223_927.11
    ca_income_tax_before_refundable_credits: 233_927.11
