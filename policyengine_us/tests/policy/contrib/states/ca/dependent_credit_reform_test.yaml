- name: CA dependent credit reform - default amount reproduces baseline (no-op)
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: CA}}
  output: {ca_exemptions: 1_103}  # 153 personal + 2 * 475 dependent

- name: CA dependent credit reform - amount zero removes only the dependent portion
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    gov.contrib.states.ca.dependent_credit.amount: 0
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: CA}}
  output: {ca_exemptions: 153}  # 153 personal, dependent portion eliminated

- name: CA dependent credit reform - age limit re-prices young and keeps baseline for older
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    gov.contrib.states.ca.dependent_credit.amount: 1_000
    gov.contrib.states.ca.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.ca.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: CA}}
  output: {ca_exemptions: 1_628}  # 153 personal + 1,000 young + 475 baseline older

- name: CA dependent credit reform - childless filer unaffected
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    gov.contrib.states.ca.dependent_credit.amount: 0
    people:
      parent: {age: 40, employment_income: 60_000}
    tax_units: {tax_unit: {members: [parent], filing_status: SINGLE}}
    households: {household: {members: [parent], state_name: CA}}
  output: {ca_exemptions: 153}  # personal only, no dependents

- name: CA dependent credit reform - age at limit threshold is excluded
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    gov.contrib.states.ca.dependent_credit.amount: 1_000
    gov.contrib.states.ca.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.ca.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 13, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: CA}}
  # Dependent at the age limit (13 == threshold) keeps the baseline older amount.
  output: {ca_exemptions: 628}  # 153 personal + 475 baseline older

- name: CA dependent credit reform - age one below threshold is included
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    gov.contrib.states.ca.dependent_credit.amount: 1_000
    gov.contrib.states.ca.dependent_credit.age_limit.in_effect: true
    gov.contrib.states.ca.dependent_credit.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 12, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: CA}}
  # Dependent one year under the limit (12 < 13) is re-priced to the reform amount.
  output: {ca_exemptions: 1_153}  # 153 personal + 1,000 young

# With default settings the reform keeps the baseline's rules for a filer who
# can be claimed as a dependent: no own personal credit for that filer
# (RTC 17054; Form 540 line 7) and no dependent credits (IRC 152(b)(1)).
- name: CA dependent credit reform - default keeps no exemption credits for a single filer who can be claimed
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    people:
      filer: {age: 30, claimed_as_dependent_on_another_return: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [filer, child], filing_status: SINGLE}}
    households: {household: {members: [filer, child], state_name: CA}}
  output: {ca_exemptions: 0}

- name: CA dependent credit reform - default keeps only the other spouse's personal credit on a joint return with a claimable spouse (the claimable spouse is the head)
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    people:
      person_a: {age: 30, claimed_as_dependent_on_another_return: true, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_b: {age: 30, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [person_a, person_b, child], filing_status: JOINT}}
    households: {household: {members: [person_a, person_b, child], state_name: CA}}
  output: {ca_exemptions: 153}

- name: CA dependent credit reform - default keeps only the other spouse's personal credit on a joint return with a claimable spouse (the claimable spouse is the spouse)
  period: 2025
  reforms: policyengine_us.reforms.states.ca.dependent_credit.ca_dependent_credit_reform.ca_dependent_credit_reform
  input:
    gov.contrib.states.ca.dependent_credit.in_effect: true
    people:
      person_b: {age: 30, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_a: {age: 30, claimed_as_dependent_on_another_return: true, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5}
    tax_units: {tax_unit: {members: [person_b, person_a, child], filing_status: JOINT}}
    households: {household: {members: [person_b, person_a, child], state_name: CA}}
  output: {ca_exemptions: 153}
