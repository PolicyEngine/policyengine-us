- name: IL dependent exemption reform - default amount reproduces baseline (no-op)
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: IL}}
  output: {il_dependent_exemption: 5_700}  # 2 * 2,850

- name: IL dependent exemption reform - amount zero eliminates the exemption
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    gov.contrib.states.il.dependent_exemption.amount: 0
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: IL}}
  output: {il_dependent_exemption: 0}

- name: IL dependent exemption reform - age limit excludes dependents at or over the age
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 5, is_tax_unit_dependent: true}
      child2: {age: 15, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1, child2], filing_status: SINGLE}}
    households: {household: {members: [parent, child1, child2], state_name: IL}}
  output: {il_dependent_exemption: 2_850}  # only the under-13 child counts

- name: IL dependent exemption reform - age at limit threshold is excluded
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 13, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: IL}}
  # Dependent at the age limit (13 == threshold) is excluded; over-age fallback is nothing.
  output: {il_dependent_exemption: 0}

- name: IL dependent exemption reform - age one below threshold is included
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  absolute_error_margin: 0.01
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.in_effect: true
    gov.contrib.states.il.dependent_exemption.age_limit.threshold: 13
    people:
      parent: {age: 40, employment_income: 60_000}
      child1: {age: 12, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [parent, child1], filing_status: SINGLE}}
    households: {household: {members: [parent, child1], state_name: IL}}
  # Dependent one year under the limit (12 < 13) receives the exemption.
  output: {il_dependent_exemption: 2_850}

- name: IL dependent exemption reform at its defaults keeps no dependent exemption for a single filer who can be claimed
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    people:
      filer: {age: 20, employment_income: 10_000, claimed_as_dependent_on_another_return: true}
      child: {age: 5, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [filer, child]}}
    households: {household: {members: [filer, child], state_code: IL}}
  # 35 ILCS 5/204(c) and IRC 152(b)(1), as in the baseline formula.
  output:
    il_dependent_exemption: 0

- name: IL dependent exemption reform at its defaults, joint return with one claimable spouse (the claimable spouse is the head)
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    people:
      person_a: {age: 20, employment_income: 5_000, is_tax_unit_head: true, is_tax_unit_spouse: false, claimed_as_dependent_on_another_return: true}
      person_b: {age: 20, employment_income: 5_000, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [person_a, person_b, child], filing_status: JOINT}}
    households: {household: {members: [person_a, person_b, child], state_code: IL}}
  output:
    il_dependent_exemption: 0

- name: IL dependent exemption reform at its defaults, joint return with one claimable spouse (the claimable spouse is the spouse)
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    people:
      person_b: {age: 20, employment_income: 5_000, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_a: {age: 20, employment_income: 5_000, is_tax_unit_head: false, is_tax_unit_spouse: true, claimed_as_dependent_on_another_return: true}
      child: {age: 5, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [person_b, person_a, child], filing_status: JOINT}}
    households: {household: {members: [person_b, person_a, child], state_code: IL}}
  output:
    il_dependent_exemption: 0

- name: IL dependent exemption reform at its defaults matches the baseline when nobody can be claimed
  period: 2025
  reforms: policyengine_us.reforms.states.il.dependent_exemption.il_dependent_exemption_reform.il_dependent_exemption_reform
  input:
    gov.contrib.states.il.dependent_exemption.in_effect: true
    people:
      person_a: {age: 20, employment_income: 5_000, is_tax_unit_head: true, is_tax_unit_spouse: false}
      person_b: {age: 20, employment_income: 5_000, is_tax_unit_head: false, is_tax_unit_spouse: true}
      child: {age: 5, is_tax_unit_dependent: true}
    tax_units: {tax_unit: {members: [person_a, person_b, child], filing_status: JOINT}}
    households: {household: {members: [person_a, person_b, child], state_code: IL}}
  output:
    il_dependent_exemption: 2_850
