- name: Itemized deductions with reform take the Minnesota casualty loss and exempt it from the offset
  absolute_error_margin: 0.5
  period: 2023
  reforms: policyengine_us.reforms.states.mn.walz.mn_walz_hf1938.mn_walz_hf1938
  input:
    gov.contrib.states.mn.walz.hf1938.repeal: true
    filing_status: SINGLE
    adjusted_gross_income: 2_000_000
    interest_deduction: 10_000
    casualty_loss: 250_000
    state_code: MN
  output:
    # Schedule M1CAT: (250,000 - 100) - 10% x 2,000,000 = 49,900
    mn_casualty_loss_deduction: 49_900
    # Offset: the lesser of 80% of the deductions other than the casualty loss
    # (0.8 x 10,000 = 8,000) and 3% of AGI over $220,650 (53,380.50).
    # 10,000 + 49,900 - 8,000
    mn_itemized_deductions: 51_900

- name: Social security subtraction with reform counts tier 1 railroad retirement benefits in provisional income
  absolute_error_margin: 0.01
  period: 2023
  reforms: policyengine_us.reforms.states.mn.walz.mn_walz_hf1938.mn_walz_hf1938
  input:
    gov.contrib.states.mn.walz.hf1938.repeal: true
    filing_status: JOINT
    social_security: 60_000
    taxable_social_security: 51_000
    railroad_social_security_equivalent_benefits: 40_000
    taxable_railroad_social_security_equivalent_benefits: 34_000
    irs_gross_income: 150_000
    adjusted_gross_income: 150_000
    state_code: MN
  output:
    # Minn. Stat. 290.0132, subd. 26(e) (2022), now (i): provisional income is
    # 150,000 - 85,000 + 50% x 85,000 of taxable title II and tier 1 benefits
    # = 107,500. Maximum: 5,840 - 20% x (107,500 - 88,630) = 2,066. Line 12
    # takes min(2,066, 51,000), and line 17 subtracts the 34,000 of taxable
    # tier 1 benefits.
    mn_social_security_subtraction: 2_066
    taxable_railroad_benefits: 34_000
