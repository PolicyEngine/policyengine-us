# Utah Code 59-10-1047(1)(e) counts a child for whom the claimant may claim "a
# tax credit under Section 24". In 2026 a filer without an SSN cannot claim the
# federal child tax credit (IRC 24(h)(7)(A)(i)), but IRC 24(h)(4)(C) gives the
# credit for other dependents for that child, so the child still counts if the
# filer has an SSN or ITIN. A filer without any TIN gets no section 24 credit
# (IRC 24(e)(2)) (issue #9403).
- name: Head of household with an ITIN gets the reform's refundable CTC in 2026.
  period: 2026
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.states.ut.ctc.ut_ctc_reform.ut_ctc_reform
  input:
    gov.contrib.states.ut.ctc.in_effect: true
    people:
      person1:
        age: 35
        ssn_card_type: OTHER_NON_CITIZEN
        tax_exempt_interest_income: 0
      person2:
        age: 3
        is_tax_unit_dependent: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        ut_total_income: 20_000
        ut_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ctc_qualifying_children: 0
    ut_ctc_eligible_children: 1
    ut_ctc_potential: 1_000
    ut_ctc: 0
    ut_refundable_ctc: 800

