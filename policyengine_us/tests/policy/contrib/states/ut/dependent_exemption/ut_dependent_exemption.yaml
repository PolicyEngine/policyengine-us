- name: Under-18 repeal zeroes the young dependent, preserves the older one.
  period: 2026
  absolute_error_margin: 1
  reforms: policyengine_us.reforms.states.ut.dependent_exemption.ut_dependent_exemption_reform
  input:
    gov.contrib.states.ut.dependent_exemption.in_effect: true
    gov.contrib.states.ut.dependent_exemption.amount: 0
    gov.contrib.states.ut.dependent_exemption.age_limit.in_effect: true
    gov.contrib.states.ut.dependent_exemption.age_limit.threshold: 18
    people:
      person1:
        age: 40
        is_tax_unit_head: true
      child1:
        age: 5
        is_tax_unit_dependent: true
      person2:
        age: 19
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, child1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, child1, person2]
        state_code: UT
  output:
    # Only the 19-year-old keeps the uprated baseline per-dependent
    # exemption (about $2,159 in 2026).
    ut_personal_exemption: 2_159

