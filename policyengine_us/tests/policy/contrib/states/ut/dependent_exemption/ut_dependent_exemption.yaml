  input:
    gov.contrib.states.ut.dependent_exemption.in_effect: true
    people:
      person1:
        age: 40
        is_tax_unit_head: true
      child1:
        age: 5
        is_tax_unit_dependent: true
      person2:
        age: 19
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, child1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, child1, person2]
        state_code: UT
  output:
