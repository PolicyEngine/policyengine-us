# The outside-universe amount is an explicit source valuation, not an inferred
# SPM cap or an automatic rule assigning the full HUD benefit to every GQ unit.
- name: Case 1, an included unit retains the canonical cap despite a source value.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 40}
      person2: {age: 40}
      person3: {age: 10}
      person4: {age: 8}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        spm_unit_spm_universe_status: INCLUDED
        spm_unit_ordinary_housing_subsidy_reported: 30_000
        spm_unit_tenure_type: RENTER
        is_eligible_for_housing_assistance: true
        takes_up_housing_assistance_if_eligible: true
        hud_hap: 30_000
        hud_ttp: 10_000
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: CA
        county_fips: "06037"
  output:
    housing_assistance: 30_000
    # Existing canonical county 06037 housing portion less tenant payment.
    spm_unit_ordinary_housing_subsidy: 17_015.922643864185

- name: Case 2, an outside child-only unit retains an explicit partial housing value.
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 12
    is_spm_independent_minor_role: false
    spm_unit_spm_universe_status: OUTSIDE
    spm_unit_ordinary_housing_subsidy_reported: 18_000
    is_eligible_for_housing_assistance: true
    takes_up_housing_assistance_if_eligible: true
    hud_hap: 30_000
    hud_ttp: 1_000
    state_code: CA
  output:
    housing_assistance: 30_000
    spm_unit_ordinary_housing_subsidy: 18_000

- name: Case 3, an outside unit with no assistance requires no housing valuation.
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 12
    is_spm_independent_minor_role: false
    spm_unit_spm_universe_status: OUTSIDE
    is_eligible_for_housing_assistance: true
    takes_up_housing_assistance_if_eligible: true
    hud_hap: 0
    state_code: CA
  output:
    housing_assistance: 0
    spm_unit_ordinary_housing_subsidy: 0
