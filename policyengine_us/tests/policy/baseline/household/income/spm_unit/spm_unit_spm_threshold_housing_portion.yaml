# Canonical spm-calculator 1.0.0 forecast spm-rolling-2026-09-09, 2024:
# County 06037 resolves to Los Angeles metro 31080, with rent index 1.6.
# Two adults and two children have equivalence factor 1. The canonical housing
# amounts below use the published reference threshold * housing share * 1.6,
# before PolicyEngine casts the final amount to its variable storage dtype.
- name: Case 1, renter housing portion uses the canonical county amount.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 40}
      person2: {age: 40}
      person3: {age: 10}
      person4: {age: 8}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        spm_unit_tenure_type: RENTER
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: CA
        county_fips: "06037"
  output:
    # 39_219.893902 * 0.4305200747 * 1.6.
    spm_unit_spm_threshold_housing_portion: 27_015.922643864185

