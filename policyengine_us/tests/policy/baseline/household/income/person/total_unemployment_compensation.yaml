# total_unemployment_compensation uses reported unemployment_compensation when it
# is nonzero and otherwise falls back to the modeled state UI programs. These
# cases follow modeled UI into means tests (SNAP) and the remaining direct
# consumers. PA inputs below give pa_uc = 10,218 per year (see the PA UC
# integration tests); a MONTH test period reports YEAR amounts divided by 12.

- name: Case 1, modeled PA UC counts as SNAP unearned income for a low-income adult.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        pa_uc_highest_quarter_wages: 10_000
        pa_uc_base_year_wages: 28_000
        pa_uc_credit_weeks: 26
        weeks_unemployed: 26
        pa_uc_gross_weekly_earnings: 0
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # No reported UC, so total UC falls back to modeled pa_uc:
    # 10,218 / 12 = 851.50 per month.
    pa_uc: 851.5
    total_unemployment_compensation: 851.5
    # 7 CFR 273.9(b)(2)(ii): unemployment compensation is unearned income.
    snap_unearned_income_person: 851.5
    snap_gross_income: 851.5
    # 851.50 - 204 standard deduction = 647.50; shelter = 758 SUA
    # - 647.50 / 2 = 434.25; net = 647.50 - 434.25 = 213.25 -> 213.
    snap_net_income: 213
    is_snap_work_registration_exempt_non_age: true
    # 292 maximum allotment - ceil(0.3 * 213 = 63.90) = 292 - 64 = 228.
    # Before modeled UI reached the SNAP income list, SNAP paid the full 292.
    snap: 228

- name: Case 2, modeled NJ UI flows into federal unemployment compensation.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        nj_unemployment_insurance_base_period_weeks: 20
        nj_unemployment_insurance_base_period_wages: 5_660
        nj_unemployment_insurance_weeks_claimed: 26
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # Average weekly wage = 5,660 / 20 = 283; weekly benefit rate =
    # floor(0.6 * 283) = 169; weeks = min(26 claimed, 20 base weeks) = 20;
    # annual benefit = 169 * 20 = 3,380.
    nj_unemployment_insurance: 3_380
    modeled_state_unemployment_compensation: 3_380
    total_unemployment_compensation: 3_380
    tax_unit_unemployment_compensation: 3_380
    taxable_unemployment_compensation: 3_380

- name: Case 3, modeled NJ UI counts as SNAP unearned income in a month.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        nj_unemployment_insurance_base_period_weeks: 20
        nj_unemployment_insurance_base_period_wages: 5_660
        nj_unemployment_insurance_weeks_claimed: 26
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # 3,380 / 12 = 281.67 per month.
    total_unemployment_compensation: 281.67
    snap_unearned_income: 281.67
    # 281.67 - 198 standard deduction = 83.67 -> 84 (no utility allowance).
    snap_net_income: 84
    # 291 maximum allotment - ceil(0.3 * 84 = 25.20) = 291 - 26 = 265.
    snap: 265

- name: Case 4, asymmetric couple with reported UC for one spouse and modeled PA UC for the other.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        unemployment_compensation: 6_000
      person2:
        age: 38
        pa_uc_highest_quarter_wages: 10_000
        pa_uc_base_year_wages: 28_000
        pa_uc_credit_weeks: 26
        weeks_unemployed: 26
        pa_uc_gross_weekly_earnings: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_uc: [0, 10_218]
    # Each person resolves separately: person1 keeps reported 6,000,
    # person2 falls back to modeled 10,218.
    total_unemployment_compensation: [6_000, 10_218]
    tax_unit_unemployment_compensation: 16_218
    # TAXSIM splits UC by role: primary (head) and spouse.
    taxsim_pui: 6_000
    taxsim_ui: 10_218

- name: Case 5, asymmetric couple aggregates reported and modeled UC in monthly SNAP income.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        unemployment_compensation: 6_000
      person2:
        age: 38
        pa_uc_highest_quarter_wages: 10_000
        pa_uc_base_year_wages: 28_000
        pa_uc_credit_weeks: 26
        weeks_unemployed: 26
        pa_uc_gross_weekly_earnings: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    # 6,000 / 12 = 500 and 10,218 / 12 = 851.50.
    snap_unearned_income_person: [500, 851.5]
    # 7 CFR 273.7(b)(1)(v) exempts only months of UC receipt. person1 has
    # reported UC and no weeks unemployed, so receives in all 12 months.
    # person2's 26 weeks give ceil(26 * 12 / 52) = 6 months; as the
    # household's second member the block starts in February (February to
    # July), so person2 does not receive UC in January.
    is_receiving_unemployment_compensation: [true, false]
    # Without the exemption, person2 (age 38, no work hours, PA fallback
    # county not waived) is ineligible under the ABAWD time limit, so
    # 7 CFR 273.11(c)(2)(ii) counts the eligible share of person2's income:
    # 1 SNAP unit member / 2 household members = 0.5.
    snap_income_counted_share: [1, 0.5]
    # 500 + 0.5 * 851.50 = 925.75.
    snap_unearned_income: 925.75
    # 925.75 - 204 = 721.75; shelter = 758 - 721.75 / 2 = 397.125;
    # net = 721.75 - 397.125 = 324.625 -> 325.
    snap_net_income: 325
    # 1-person maximum allotment 292 - ceil(0.3 * 325 = 97.50) = 292 - 98 = 194.
    snap: 194

- name: Case 6, explicitly reported zero UC still falls back to modeled PA UC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: PA
    unemployment_compensation: 0
    pa_uc_highest_quarter_wages: 10_000
    pa_uc_base_year_wages: 28_000
    pa_uc_credit_weeks: 26
    weeks_unemployed: 26
    pa_uc_gross_weekly_earnings: 0
  output:
    # A reported 0 is treated as not reported; only a nonzero reported amount
    # overrides modeled UI.
    unemployment_compensation: 0
    total_unemployment_compensation: 10_218

- name: Case 7, modeled UT UI counts in total and taxable UC.
  # Modeled UI is fully taxable, so the
  # ut_homeowner_renter_relief_nontaxable_income: 0 assertion below cannot tell
  # total UC from reported UC; this case covers total and taxable UC only.
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: UT
    ut_ui_base_period_wages: 80_000
    ut_ui_high_quarter_wages: 25_000
    ut_ui_quarters_with_wages: 4
    ut_ui_weeks_unemployed: 26
    ut_ui_gross_weekly_earnings: 0
    ut_ui_weekly_hours_worked: 0
  output:
    ut_ui: 19_396
    total_unemployment_compensation: 19_396
    taxable_unemployment_compensation: 19_396
    # Nontaxable UC = max(0, 19,396 - 19,396) = 0.
    ut_homeowner_renter_relief_nontaxable_income: 0

- name: Case 8, 2020 tuition deduction cap with tax-exempt UC.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 25
        employment_income: 60_000
        unemployment_compensation: 10_000
        qualified_tuition_expenses: 5_000
        is_eligible_for_american_opportunity_credit: false
    tax_units:
      tax_unit:
        members: [person1]
        premium_tax_credit: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # The 2020 exclusion (up to 10,200) makes all 10,000 of UC tax-exempt.
    tax_exempt_unemployment_compensation: 10_000
    taxable_unemployment_compensation: 0
    # ARPA § 9042(b)(7) (Pub. L. 117-2) added § 85(c) to the
    # § 222(b)(2)(C)(i) MAGI definition, so excluded 2020 UC counts:
    # MAGI = 60,000 + 10,000 = 70,000, inside the 65,000-80,000 band, so the
    # statutory cap is 2,000 (same for § 86(b)(2)(A) SS MAGI).
    capped_qualified_tuition_expenses_ald: 2_000

- name: Case 9, tuition deduction is zero after its 2021 repeal.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 25
        employment_income: 60_000
        unemployment_compensation: 10_000
        qualified_tuition_expenses: 5_000
        is_eligible_for_american_opportunity_credit: false
    tax_units:
      tax_unit:
        members: [person1]
        premium_tax_credit: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    capped_qualified_tuition_expenses_ald: 0
    # SS MAGI = 60,000 + 10,000 total UC = 70,000.
    taxable_ss_magi: 70_000

