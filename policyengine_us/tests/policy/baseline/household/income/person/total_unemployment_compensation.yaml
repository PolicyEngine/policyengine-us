- name: Case 14, modeled PA UC counts in Social Security MAGI.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: PA
    social_security_retirement: 20_000
    pa_uc_highest_quarter_wages: 10_000
    pa_uc_base_year_wages: 28_000
    pa_uc_credit_weeks: 26
    weeks_unemployed: 26
    pa_uc_gross_weekly_earnings: 0
  output:
    pa_uc: 10_218
    # 26 U.S.C. 86(b)(2): MAGI = AGI before taxable SS = 10,218 of total UC.
    taxable_ss_magi: 10_218
    # Provisional income = 10,218 + 20,000 / 2 = 20,218, below the 25,000
    # single base amount, so no benefits are taxable.
    taxable_social_security: 0

- name: Case 15, a negative reported UC amount passes through instead of modeled PA UC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: PA
    unemployment_compensation: -1_000
    pa_uc_highest_quarter_wages: 10_000
    pa_uc_base_year_wages: 28_000
    pa_uc_credit_weeks: 26
    weeks_unemployed: 26
    pa_uc_gross_weekly_earnings: 0
  output:
    pa_uc: 10_218
    modeled_state_unemployment_compensation: 10_218
    # Any nonzero reported amount overrides modeled UI unchanged, as before
    # modeled UI was integrated.
    total_unemployment_compensation: -1_000

- name: Case 16, Virginia subtracts only taxable UC, so 2020 tax-exempt UC is not subtracted again.
  period: 2020
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: VA
    employment_income: 50_000
    unemployment_compensation: 5_000
  output:
    # The 2020 federal exclusion (up to 10,200) makes all 5,000 of UC
    # tax-exempt, so federal AGI is 50,000.
    tax_exempt_unemployment_compensation: 5_000
    taxable_unemployment_compensation: 0
    adjusted_gross_income: 50_000
    # Va. Code § 58.1-322.02(17) subtracts UC taxable under IRC 85: 0 here.
    va_subtractions: 0
    va_agi: 50_000
    # Taxable = 50,000 - 4,500 standard deduction - 930 exemption = 44,570.
    # Tax = 60 + 60 + 600 + 0.0575 * 27,570 = 2,305.28, less 250 of
    # nonrefundable credits = 2,055.28 (1,767.78 when all UC was subtracted).
    va_income_tax: 2_055.28

- name: Case 17, Hawaii CCAP counts strike benefits, which are not unemployment compensation.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: HI
    strike_benefits: 12_000
  output:
    # Strike benefits do not enter total UC.
    total_unemployment_compensation: 0
    # HAR 17-798.3-10(b) counts strike benefits: 12,000 / 12 = 1,000 per month.
    hi_ccap_countable_income: 1_000

- name: Case 18, modeled NJ UI computes but does not count as UC before its 2024 start year.
  period: 2023
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: NJ
    nj_unemployment_insurance_base_period_weeks: 20
    nj_unemployment_insurance_base_period_wages: 5_660
    nj_unemployment_insurance_weeks_claimed: 26
  output:
    # Case 2 inputs: 169 weekly * 20 weeks = 3,380.
    nj_unemployment_insurance: 3_380
    # NJ enters the modeled list in 2024.
    modeled_state_unemployment_compensation: 0
    total_unemployment_compensation: 0
