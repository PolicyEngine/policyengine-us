# Gross farm income: Schedule F line 9, before farm expenses. A supplied
# farm_gross_income_reported of zero or more is used as entered; a negative
# amount means not supplied. An entry applies only to the year entered.
# Without it, the person's net farm profit stands in, floored at zero.

- name: Without an input, the net farm profit stands in.
  period: 2025
  input:
    farm_operations_income: 8_000
  output:
    farm_gross_income: 8_000

- name: Without an input, a net farm loss counts as zero.
  period: 2025
  input:
    farm_operations_income: -8_000
  output:
    farm_gross_income: 0

- name: A supplied amount gives Schedule F line 9 directly.
  period: 2025
  input:
    farm_operations_income: 2_000
    farm_gross_income_reported: 16_000
  output:
    farm_gross_income: 16_000

- name: A supplied zero is used, not the net farm profit.
  period: 2025
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported: 0
  output:
    farm_gross_income: 0

- name: A supplied negative amount means not supplied, so the net farm profit stands in.
  period: 2025
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported: -500
  output:
    farm_gross_income: 8_000

- name: One person's supplied amount leaves another person's net farm profit in place.
  period: 2025
  input:
    people:
      retiree:
        age: 45
        farm_operations_income: 35_000
      spouse:
        age: 43
        farm_operations_income: 5_000
        farm_gross_income_reported: 5_000
    tax_units:
      tax_unit:
        members: [retiree, spouse]
    households:
      household:
        members: [retiree, spouse]
  output:
    farm_gross_income: [35_000, 5_000]

- name: An amount supplied only for 2025 does not apply in 2026, so the net farm profit stands in.
  period: 2026
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported:
      2025: 20_000
  output:
    farm_gross_income_reported: -1
    farm_gross_income: 8_000

- name: A zero supplied for 2026 is used in 2026, not the 2025 amount or the net farm profit.
  period: 2026
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported:
      2025: 20_000
      2026: 0
  output:
    farm_gross_income: 0

- name: One person's amount supplied only for 2025 does not apply in 2026 beside another person's 2026 amount.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        farm_operations_income: 8_000
        farm_gross_income_reported:
          2025: 20_000
      spouse:
        age: 43
        farm_operations_income: 1_000
        farm_gross_income_reported:
          2026: 3_000
    tax_units:
      tax_unit:
        members: [retiree, spouse]
    households:
      household:
        members: [retiree, spouse]
  output:
    farm_gross_income_reported: [-1, 3_000]
    farm_gross_income: [8_000, 3_000]
