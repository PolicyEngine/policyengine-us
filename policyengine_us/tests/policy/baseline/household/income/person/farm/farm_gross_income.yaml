# Gross farm income: Schedule F line 9, before farm expenses. A supplied
# farm_gross_income_reported of zero or more is used as entered; a negative
# amount means not supplied. Without it, the person's net farm profit stands
# in, floored at zero.

- name: Without an input, the net farm profit stands in.
  period: 2025
  input:
    farm_operations_income: 8_000
  output:
    farm_gross_income: 8_000

- name: Without an input, a net farm loss counts as zero.
  period: 2025
  input:
    farm_operations_income: -8_000
  output:
    farm_gross_income: 0

- name: A supplied amount gives Schedule F line 9 directly.
  period: 2025
  input:
    farm_operations_income: 2_000
    farm_gross_income_reported: 16_000
  output:
    farm_gross_income: 16_000

- name: A supplied zero is used, not the net farm profit.
  period: 2025
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported: 0
  output:
    farm_gross_income: 0

- name: A supplied negative amount means not supplied, so the net farm profit stands in.
  period: 2025
  input:
    farm_operations_income: 8_000
    farm_gross_income_reported: -500
  output:
    farm_gross_income: 8_000

- name: One person's supplied amount leaves another person's net farm profit in place.
  period: 2025
  input:
    people:
      retiree:
        age: 45
        farm_operations_income: 35_000
      spouse:
        age: 43
        farm_operations_income: 5_000
        farm_gross_income_reported: 5_000
    tax_units:
      tax_unit:
        members: [retiree, spouse]
    households:
      household:
        members: [retiree, spouse]
  output:
    farm_gross_income: [35_000, 5_000]
