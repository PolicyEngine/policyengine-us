        annuity_contract_1_expected_return: 200000
        annuity_contract_1_investment_recovered: 120000
        annuity_contract_1_starting_date_before_1987: true
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_annuity_contract_income: 6000
