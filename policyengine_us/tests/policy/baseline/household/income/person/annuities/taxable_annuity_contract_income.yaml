# IRC 72(b), (e): exclusion ratio and withdrawals from annuity contracts.
- name: Exclusion ratio 100,000 / 200,000
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        annuity_contract_1_annuity_payments: 12000
        annuity_contract_1_investment_in_contract: 100000
        annuity_contract_1_expected_return: 200000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_annuity_contract_income: 6000
- name: Exclusion stops at the unrecovered investment
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        annuity_contract_1_annuity_payments: 12000
        annuity_contract_1_investment_in_contract: 100000
        annuity_contract_1_expected_return: 200000
        annuity_contract_1_investment_recovered: 97000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_annuity_contract_income: 9000
- name: 'Starting date before 1987: exclusion continues'
  period: 2026
  absolute_error_margin: 0.01
