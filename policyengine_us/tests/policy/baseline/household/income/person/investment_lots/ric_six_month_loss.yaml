# IRC 852(b)(4) losses on RIC shares held six months or less.
- name: Exempt-interest dividends disallowed, then capital gain dividends long-term
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        fund_sale_1_loss: 800
        fund_sale_1_held_six_months_or_less: true
        fund_sale_1_exempt_interest_dividends: 200
        fund_sale_1_capital_gain_dividends: 250
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    ric_loss_disallowed_exempt_interest: 200
    investment_lot_long_term_gain: -250
    investment_lot_short_term_gain: -350
- name: 'Held more than six months: no adjustment'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        fund_sale_1_loss: 800
        fund_sale_1_held_six_months_or_less: false
        fund_sale_1_exempt_interest_dividends: 200
        fund_sale_1_capital_gain_dividends: 250
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    ric_loss_disallowed_exempt_interest: 0
    investment_lot_short_term_gain: -800
    investment_lot_long_term_gain: 0
- name: 'Daily-dividend fund: no exempt-interest disallowance'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        fund_sale_1_loss: 800
        fund_sale_1_held_six_months_or_less: true
        fund_sale_1_exempt_interest_dividends: 200
        fund_sale_1_daily_dividend_fund: true
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    ric_loss_disallowed_exempt_interest: 0
    investment_lot_short_term_gain: -800
