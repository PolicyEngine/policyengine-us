# IRC 1091 wash sales.
- name: 'Repurchase 30 days after: 60 of 100 shares disallowed'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        wash_sale_1_loss: 1000
        wash_sale_1_shares_sold: 100
        wash_sale_1_sale_day: 9000
        wash_sale_1_purchase_1_day: 9030
        wash_sale_1_purchase_1_shares: 60
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    wash_sale_disallowed_loss_deferred: 600
    investment_lot_short_term_gain: -400
