# IRC 1272 OID, 1276 market discount, 171 premium.
- name: 'OID: 900 x (1.03^2 - 1) - 20 = 34.81'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        bond_lot_1_adjusted_issue_price_start: 900
        bond_lot_1_yield_per_accrual_period: 0.03
        bond_lot_1_accrual_periods_held: 2
        bond_lot_1_stated_redemption_price: 1000
        bond_lot_1_issue_price: 880
        bond_lot_1_complete_years_to_maturity_at_issue: 5
        bond_lot_1_qualified_stated_interest: 20
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    investment_lot_interest_adjustment: 34.81
