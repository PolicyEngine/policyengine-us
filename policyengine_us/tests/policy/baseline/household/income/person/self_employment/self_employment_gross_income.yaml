- name: Case 1, reconstruct business income without including wages or changing net profit.
  period: 2026
  input:
    employment_income: 36_000
    self_employment_income: 18_000
    self_employment_expense: 6_000
  output:
    self_employment_gross_income: 24_000
    self_employment_income: 18_000

- name: Case 2, business expenses cover regular, SSTB, and farm self-employment together.
  period: 2026
  input:
    self_employment_income: 6_000
    sstb_self_employment_income: 3_000
    farm_operations_income: 5_000
    self_employment_expense: 4_000
  output:
    self_employment_gross_income: 18_000

- name: Case 3, preserve a business loss when adding back its expenses.
  period: 2026
  input:
    self_employment_income: -3_000
    self_employment_expense: 12_000
  output:
    self_employment_gross_income: 9_000
    self_employment_income: -3_000

- name: Case 4, omitted expenses use the ordinary zero default.
  period: 2026
  input:
    self_employment_income: 12_000
  output:
    self_employment_gross_income: 12_000
    self_employment_expense: 0

- name: Case 5, a loss without reported expenses cannot create negative gross income.
  period: 2026
  input:
    self_employment_income: -3_000
  output:
    self_employment_gross_income: 0

- name: Case 6, a farm loss does not offset non-farm profit when expenses are omitted.
  period: 2026
  input:
    self_employment_income: 6_000
    farm_operations_income: -10_000
  output:
    # Non-farm floor 6,000 + farm floor 0; the reconstruction is -4,000.
    self_employment_gross_income: 6_000
    farm_operations_income: -10_000

- name: Case 7, employee work expenses do not belong in this business-cost input, which is added back unconditionally.
  period: 2026
  input:
    employment_income: 36_000
    self_employment_expense: 6_000
  output:
    self_employment_gross_income: 6_000

- name: Case 8, cost of goods sold stays out of the add-back, so the result is gross income after it.
  period: 2026
  input:
    # Receipts 100,000 - cost of goods sold 60,000 = gross income 40,000.
    # Gross income 40,000 - other expenses 25,000 = net profit 15,000.
    self_employment_income: 15_000
    self_employment_expense: 25_000
  output:
    self_employment_gross_income: 40_000

- name: Case 9, fully reported expenses reconstruct a farm loss alongside non-farm profit.
  period: 2026
  input:
    self_employment_income: 6_000
    farm_operations_income: -10_000
    self_employment_expense: 12_000
  output:
    # 6,000 - 10,000 + 12,000 = 8,000, above the 6,000 per-source floor.
    self_employment_gross_income: 8_000

- name: Case 10, partially reported expenses fall back to the per-source floor.
  period: 2026
  input:
    self_employment_income: 6_000
    farm_operations_income: -10_000
    self_employment_expense: 3_000
  output:
    # The reconstruction is -1,000, below the 6,000 per-source floor.
    self_employment_gross_income: 6_000

- name: Case 11, a regular business loss does not offset SSTB profit when expenses are omitted.
  period: 2026
  input:
    self_employment_income: -4_000
    sstb_self_employment_income: 9_000
  output:
    # Regular floor 0 + SSTB floor 9,000; the reconstruction is 5,000.
    self_employment_gross_income: 9_000

- name: Case 12, reconstruct gross from the existing net-income chain without changing wages or the SE tax base.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 36_000
    self_employment_income_before_lsr: 15_000
    self_employment_expense: 25_000
  output:
    self_employment_gross_income: 40_000
    self_employment_income: 15_000
    employment_income: 36_000
    # The tax base still uses net profit: 15,000 * 0.9235.
    taxable_self_employment_income: 13_852.50

- name: Case 13, directly supplied gross income does not infer net profit or expenses.
  period: 2026
  input:
    self_employment_gross_income: 40_000
  output:
    self_employment_gross_income: 40_000
    self_employment_income: 0
    sstb_self_employment_income: 0
    farm_operations_income: 0
    self_employment_expense: 0
    taxable_self_employment_income: 0

- name: Case 14, partnership earnings remain separate from reconstructed sole-proprietor gross income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    self_employment_income_before_lsr: 10_000
    partnership_self_employment_net_earnings: 5_000
    self_employment_expense: 3_000
  output:
    self_employment_gross_income: 13_000
    partnership_self_employment_net_earnings: 5_000
    # Partnership SE earnings remain in the tax base, not in the add-back.
    taxable_self_employment_income: 13_852.50

- name: Case 15, expense reconstruction and loss floors operate independently for each person.
  period: 2026
  input:
    people:
      person1:
        self_employment_income_before_lsr: 15_000
        self_employment_expense: 25_000
      person2:
        sstb_self_employment_income_before_lsr: -3_000
        self_employment_expense: 12_000
      person3:
        self_employment_income_before_lsr: 6_000
        farm_operations_income: -10_000
        self_employment_expense: 3_000
      person4:
        employment_income: 36_000
  output:
    self_employment_gross_income: [40_000, 9_000, 6_000, 0]
    self_employment_income: [15_000, 0, 6_000, 0]
    sstb_self_employment_income: [0, -3_000, 0, 0]
    farm_operations_income: [0, 0, -10_000, 0]
    employment_income: [0, 0, 0, 36_000]

- name: Case 16, annual net income and expenses convert consistently for monthly consumers.
  period: 2026-07
  input:
    self_employment_income_before_lsr:
      2026: 15_000
    self_employment_expense:
      2026: 21_000
  output:
    # Annual gross is 15,000 + 21,000 = 36,000; July receives one twelfth.
    self_employment_gross_income: 3_000
    self_employment_income: 1_250
    self_employment_expense: 1_750
