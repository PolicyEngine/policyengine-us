# qualified_dividend_income follows
# calibration.gov.irs.soi.qualified_dividend_income_per_capita, the IRS SOI
# total divided by population. An input dated in one year and read in a later
# year is multiplied by the ratio of that index between the two years.

- name: A 2017 input read in 2019 grows with SOI qualified dividends per capita, inside the filled years.
  period: 2019
  absolute_error_margin: 0.01
  input:
    qualified_dividend_income:
      2017: 10_000
  output:
    # IRS SOI Publication 1304 Table 1.4, all returns, qualified dividends, over
    # calibration.gov.census.populations.total:
    #   2017: 216,846,966,000 / 331,211,000 = 654.7094
    #         (https://www.irs.gov/pub/irs-soi/17in14ar.xls)
    #   2019: 248,190,601,000 / 335,329,000 = 740.1406
    #         (https://www.irs.gov/pub/irs-soi/19in14ar.xls)
    # 10,000 x 740.1406 / 654.7094 = 11,304.87. With the old values this came to
    # 9,877.20.
    qualified_dividend_income: 11_304.87
