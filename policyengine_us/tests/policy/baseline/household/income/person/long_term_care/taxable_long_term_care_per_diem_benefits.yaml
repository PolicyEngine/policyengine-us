# IRC 7702B(d) per diem limit ($430 in 2026), Form 8853 Section C.
- name: Benefits above $430 x 365
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        long_term_care_per_diem_benefits: 200000
        long_term_care_per_diem_days: 365
        long_term_care_qualified_costs: 120000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_long_term_care_per_diem_benefits: 43050
- name: Actual costs above the per diem limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        long_term_care_per_diem_benefits: 200000
        long_term_care_per_diem_days: 365
        long_term_care_qualified_costs: 180000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_long_term_care_per_diem_benefits: 20000
- name: Reimbursements reduce the exclusion
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        long_term_care_per_diem_benefits: 50000
        long_term_care_per_diem_days: 100
        long_term_care_cost_reimbursements: 10000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    taxable_long_term_care_per_diem_benefits: 17000
    adjusted_gross_income: 17000
