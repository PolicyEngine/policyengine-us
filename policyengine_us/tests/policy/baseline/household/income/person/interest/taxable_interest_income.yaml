# taxable_interest_income follows
# calibration.gov.irs.soi.taxable_interest_income_per_capita, the IRS SOI total
# divided by population. An input dated in one year and read in a later year is
# multiplied by the ratio of that index between the two years.

- name: A 2017 input read in 2019 grows with SOI taxable interest per capita, inside the filled years.
  period: 2019
  absolute_error_margin: 0.01
  input:
    taxable_interest_income:
      2017: 10_000
  output:
    # IRS SOI Publication 1304 Table 1.4, all returns, taxable interest, over
    # calibration.gov.census.populations.total:
    #   2017: 106,055,367,000 / 331,211,000 = 320.2048
    #         (https://www.irs.gov/pub/irs-soi/17in14ar.xls)
    #   2019: 153,253,476,000 / 335,329,000 = 457.0242
    #         (https://www.irs.gov/pub/irs-soi/19in14ar.xls)
    # 10,000 x 457.0242 / 320.2048 = 14,272.87. With the old values this came to
    # 9,877.20.
    taxable_interest_income: 14_272.87
