# IRC 121 exclusion of gain on the sale of a main home.
- name: 'Single: $300,000 gain, $250,000 excluded, $50,000 long-term'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        home_sale_gain: 300000
        home_sale_ownership_months: 36
        home_sale_use_months: 36
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    home_sale_gain_exclusion: 250000
    home_sale_taxable_gain: 50000
    long_term_capital_gains: 50000
- name: 'Married, spouse meets the use test: $500,000'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        home_sale_gain: 300000
        home_sale_ownership_months: 36
        home_sale_use_months: 36
        home_sale_spouse_meets_use_test: true
      person2:
        age: 50
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        filing_status: JOINT
    households:
      household:
        members:
        - person1
        - person2
        state_code: TX
  output:
    home_sale_gain_exclusion:
    - 300000
    - 0
    home_sale_taxable_gain:
    - 0
    - 0
