# IRC 1256 60/40 split.
- name: 'Gain: 60% long-term, 40% short-term'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        section_1256_net_gain: 10000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    section_1256_long_term_gain: 6000
    section_1256_short_term_gain: 4000
    long_term_capital_gains: 6000
    short_term_capital_gain_adjustments: 4000
- name: Loss splits the same way
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        section_1256_net_gain: -5000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    section_1256_long_term_gain: -3000
    section_1256_short_term_gain: -2000
- name: Adds to other long-term gains
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        section_1256_net_gain: 10000
        long_term_capital_gains_before_response: 1000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    long_term_capital_gains: 7000
