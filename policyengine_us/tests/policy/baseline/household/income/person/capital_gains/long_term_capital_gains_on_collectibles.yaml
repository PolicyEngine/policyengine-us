# long_term_capital_gains_on_collectibles follows
# calibration.gov.irs.soi.long_term_capital_gains_per_capita, the IRS SOI total
# divided by population. An input dated in one year and read in a later year is
# multiplied by the ratio of that index between the two years.

- name: A 2021 input read in 2022 grows with SOI net long-term capital gain per capita, inside the filled years.
  period: 2022
  absolute_error_margin: 0.01
  input:
    long_term_capital_gains_on_collectibles:
      2021: 10_000
  output:
    # IRS SOI Publication 1304 Table 1.4A, all returns, net long-term capital
    # gain, over calibration.gov.census.populations.total:
    #   2021: 1,922,391,473,000 / 338,039,000 = 5,686.893
    #         (https://www.irs.gov/pub/irs-soi/21in14acg.xls)
    #   2022: 1,351,166,751,000 / 339,654,000 = 3,978.068
    #         (https://www.irs.gov/pub/irs-soi/22in14acg.xls)
    # 10,000 x 3,978.068 / 5,686.893 = 6,995.15. With the old values this came
    # to 9,952.45.
    long_term_capital_gains_on_collectibles: 6_995.15
