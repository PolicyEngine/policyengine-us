# tip_income follows calibration.gov.irs.soi.employment_income_per_capita, the
# IRS SOI total divided by population. An input dated in one year and read in a
# later year is multiplied by the ratio of that index between the two years.

- name: A 2017 input read in 2020 grows with SOI salaries and wages per capita, inside the filled years.
  period: 2020
  absolute_error_margin: 0.01
  input:
    tip_income:
      2017: 10_000
  output:
    # IRS SOI Publication 1304 Table 1.4, all returns, salaries and wages, over
    # calibration.gov.census.populations.total:
    #   2017: 7,577,563,943,000 / 331,211,000 = 22,878.36
    #         (https://www.irs.gov/pub/irs-soi/17in14ar.xls)
    #   2020: 8,416,495,535,000 / 336,810,000 = 24,988.85
    #         (https://www.irs.gov/pub/irs-soi/20in14ar.xls)
    # 10,000 x 24,988.85 / 22,878.36 = 10,922.49. With the old values this came
    # to 11,637.13.
    tip_income: 10_922.49
