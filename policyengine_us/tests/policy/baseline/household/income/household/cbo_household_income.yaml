- name: CBO market income removes government cash and adds employer-side components
  period: 2025
  input:
    employment_income: 50_000
    gi_cash_assistance: 2_000
    ak_permanent_fund_dividend: 1_000
    employer_sponsored_insurance_premiums: 8_000
    employer_social_security_tax: 3_100
    employer_medicare_tax: 725
    employer_federal_unemployment_tax: 42
  output:
    household_market_income: 53_000
    cbo_household_market_income: 61_867

- name: CBO before-tax income adds social insurance and alias matches
  period: 2025
  input:
    employment_income: 40_000
    employer_sponsored_insurance_premiums: 6_000
    employer_social_security_tax: 2_480
    employer_medicare_tax: 580
    employer_federal_unemployment_tax: 42
    social_security: 12_000
    age: 65
    is_medicare_eligible: true
    medicare_enrolled: true
    medicare_quarters_of_coverage: 40
    adjusted_gross_income:
      2023: 50_000
    tax_exempt_interest_income:
      2023: 0
    unemployment_compensation: 2_000
    workers_compensation: 1_000
  output:
    cbo_household_market_income: 49_102
    # CMS Medicare spending per enrollee, 2025.
    medicare_gross_cost: 17_751
    # CBO counts Medicare net of premiums: $17,751 less the 2025 standard
    # Part B premium of $185 a month ($2,220); Part A is premium-free with
    # 40 quarters of coverage.
    medicare_cost: 15_531
    # $12,000 + $15,531 + $2,000 + $1,000.
    cbo_household_social_insurance_benefits: 30_531
    cbo_household_income_before_transfers_and_taxes: 79_633
    cbo_household_income: 79_633

- name: CBO means-tested transfers include only the listed programs
  period: 2026
  input:
    state_code: WA
    medicaid: 10
    chip: 5
    snap: 7
    housing_assistance: 8
    spm_unit_capped_housing_subsidy: 1
    ssi: 4
    tanf: 3
    free_school_meals: 2
    reduced_price_school_meals: 1
    spm_unit_energy_subsidy: 9
    general_assistance: 6
    # WIC is a child nutrition program (42 U.S.C. 1786).
    wic: 11
    # Medicare Savings Programs pay Medicare premiums and cost sharing for
    # low-income enrollees through Medicaid (42 U.S.C. 1396a(a)(10)(E)).
    msp_cost: 12
    # Washington's SSI state supplement and State Family Assistance.
    wa_ssp: 13
    wa_sfa: 14
    head_start: 100
    early_head_start: 100
    basic_income: 100
    household_state_benefits: 100
    household_health_benefits: 100
    veterans_benefits: 100
    # CBO subtracts the premium tax credit from federal income taxes.
    assigned_aca_ptc: 100
  output:
    # $55 from the federal programs above WIC, plus $11 + $12 + $13 + $14.
    cbo_household_means_tested_transfers: 105

- name: CBO after-tax income uses federal taxes only, keeps negative income tax and subtracts the premium tax credit
  period: 2025
  input:
    age: 40
    is_medicare_eligible: false
    medicare_enrolled: false
    employment_income: 30_000
    employer_social_security_tax: 1_860
    employer_medicare_tax: 435
    employer_federal_unemployment_tax: 42
    social_security: 5_000
    medicaid: 9_000
    snap: 2_000
    income_tax: -1_500
    employee_social_security_tax: 1_860
    employee_medicare_tax: 435
    additional_medicare_tax: 0
    employee_state_payroll_tax: 9_999
    self_employment_tax: 0
    cbo_corporate_income_tax: 100
    cbo_excise_tax: 20
    assigned_aca_ptc: 800
    household_state_tax_before_refundable_credits: 9_999
  output:
    # $30,000 + $1,860 + $435 + $42 + $100 of corporate income tax, which
    # CBO counts in market income as well as in taxes, plus $5,000.
    cbo_household_income_before_transfers_and_taxes: 37_437
    cbo_household_means_tested_transfers: 11_000
    # -$1,500 + $1,860 + $435 + $1,860 + $435 + $42 + $100 + $20 - $800.
    cbo_household_federal_taxes: 2_452
    # $37,437 + $11,000 - $2,452.
    cbo_household_income_after_transfers_and_taxes: 45_985

- name: CBO market income adds retirement income and private transfers but not veterans' benefits or educational assistance
  period: 2026
  input:
    state_code: TX
    age: 40
    employment_income: 100_000
    employer_social_security_tax: 6_200
    employer_medicare_tax: 1_450
    employer_federal_unemployment_tax: 42
    # Income received in retirement for past services.
    railroad_benefits: 1_200
    survivor_benefits: 700
    # Other nongovernmental sources.
    child_support_received: 800
    financial_assistance: 250
    cbo_corporate_income_tax: 100
    # Educational assistance mixes Pell Grants and other government aid with
    # private scholarships, and CBO's other income covers only
    # nongovernmental sources.
    educational_assistance: 900
    # CBO's income categories have not named veterans' benefits since its
    # report on 2014, published in March 2018.
    veterans_benefits: 3_000
  output:
    # $100,000 + $6,200 + $1,450 + $42 + $1,200 + $700 + $800 + $250 + $100.
    cbo_household_market_income: 110_742
    cbo_household_social_insurance_benefits: 0
    cbo_household_means_tested_transfers: 0
    cbo_household_income_before_transfers_and_taxes: 110_742
