- name: CBO market income removes government cash and adds employer-side components
  period: 2025
  input:
    employment_income: 50_000
    gi_cash_assistance: 2_000
    ak_permanent_fund_dividend: 1_000
    employer_sponsored_insurance_premiums: 8_000
    employer_social_security_tax: 3_100
    employer_medicare_tax: 725
    employer_federal_unemployment_tax: 42
  output:
    household_market_income: 53_000
    cbo_household_market_income: 61_867

- name: CBO before-tax income adds social insurance and alias matches
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 40_000
    employer_sponsored_insurance_premiums: 6_000
    employer_social_security_tax: 2_480
    employer_medicare_tax: 580
    employer_federal_unemployment_tax: 42
    social_security: 12_000
    age: 65
    is_medicare_eligible: true
    medicare_enrolled: true
    medicare_quarters_of_coverage: 40
    adjusted_gross_income:
      2023: 50_000
    tax_exempt_interest_income:
      2023: 0
    unemployment_compensation: 2_000
    workers_compensation: 1_000
  output:
    cbo_household_market_income: 49_102
    # CMS Medicare spending per enrollee, 2025.
    medicare_gross_cost: 17_751
    # $17,751 less 2025 premium income per Medicare enrollee ($82.26 Part A,
    # $2,169.44 Part B, $215.04 Part D) and the $251.12 Part D low-income
    # subsidy per Medicare enrollee.
    cbo_medicare_benefit: 15_033.14
    # $12,000 + $15,033.14 + $2,000 + $1,000.
    cbo_household_social_insurance_benefits: 30_033.14
    cbo_household_income_before_transfers_and_taxes: 79_135.14
    cbo_household_income: 79_135.14

