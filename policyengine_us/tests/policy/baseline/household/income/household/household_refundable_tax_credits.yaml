- name: Case 1, the premium tax credit counts as a refundable tax credit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    used_aca_ptc: 1_000
    income_tax_refundable_credits_in_force: 0
    household_refundable_state_tax_credits: 0
    household_refundable_local_tax_credits: 0
  output:
    household_refundable_tax_credits: 1_000

- name: Case 2, it counts once whether or not health benefits count in net income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.simulation.include_health_benefits_in_net_income: true
    used_aca_ptc: 1_000
    medicaid_cost: 500
    snap: 0
    income_tax_refundable_credits_in_force: 0
    household_refundable_state_tax_credits: 0
    household_refundable_local_tax_credits: 0
  output:
    household_refundable_tax_credits: 1_000
    # The health benefits are Medicaid alone.
    household_health_benefits: 500

- name: Case 3, the credit counted is limited to the premium of the plan the household enrolls in.
  # 26 U.S.C. 36B(b)(2): a $1,000 credit against an $800 plan counts $800.
  period: 2026
  absolute_error_margin: 0.01
  input:
    aca_ptc: 1_000
    selected_marketplace_plan_premium_proxy: 800
    income_tax_refundable_credits_in_force: 0
    household_refundable_state_tax_credits: 0
    household_refundable_local_tax_credits: 0
  output:
    used_aca_ptc: 800
    premium_tax_credit_in_force: 800
    household_refundable_tax_credits: 800

- name: Case 4, a marketplace enrollee's credit reaches the household's refundable credits.
  # A single 45-year-old in Lebanon County, PA, earning $40,000 (40,000 /
  # 15,650 = 2.5559 of the 2025 poverty guideline, which 2026 credits use,
  # floored to 255%). The credit is the
  # benchmark premium minus the required contribution; at this income there
  # is no EITC, refundable CTC or Pennsylvania refundable credit.
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 45
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
        county: LEBANON_COUNTY_PA
  output:
    assigned_aca_ptc: 10_086
    household_refundable_tax_credits: 10_086
