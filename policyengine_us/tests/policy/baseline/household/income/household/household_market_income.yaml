- name: UC is not market income
  period: 2026
  input:
    people:
      person:
        unemployment_compensation: 10_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 0

- name: SS is not market income
  period: 2026
  input:
    people:
      person:
        social_security: 15_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 0

- name: Employment income is market income
  period: 2026
  input:
    people:
      person:
        employment_income: 50_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 50_000

- name: SSTB self-employment income is market income
  period: 2026
  input:
    people:
      person:
        sstb_self_employment_income: 50_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 50_000

- name: Farm operations income is market income
  period: 2026
  input:
    people:
      person:
        farm_operations_income: 50_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 50_000

- name: Other Census income leaves are market income.
  period: 2026
  input:
    people:
      person:
        miscellaneous_income: 10_000
        alimony_income: 5_000
        strike_benefits: 1_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 16_000

- name: Employment income plus UC does not double count
  period: 2026
  input:
    people:
      person:
        employment_income: 50_000
        unemployment_compensation: 10_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 50_000

- name: Estate and trust income is market income for every member
  period: 2026
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
        estate_income: 20_000
      child:
        age: 10
        estate_income: 5_000
    households:
      household:
        members: [parent, child]
  output:
    household_market_income: 75_000

- name: Partnership, S corporation and farm rental income are market income, with their signs.
  period: 2026
  input:
    people:
      person:
        partnership_income: 40_000
        s_corp_income: -5_000
        farm_rent_income: 3_000
    households:
      household:
        members: [person]
  output:
    household_market_income: 38_000

- name: Capital gain distributions reported without Schedule D are market income.
  period: 2026
  input:
    people:
      person:
        non_sch_d_capital_gains: 2_500
    households:
      household:
        members: [person]
  output:
    household_market_income: 2_500

- name: Employer disability benefits are market income, taxable or not.
  period: 2026
  input:
    people:
      person:
        disability_benefits: 9_000
        tax_exempt_disability_benefits: 9_000
    households:
      household:
        members: [person]
  output:
    taxable_disability_benefits: 0
    household_market_income: 9_000

- name: Form 4797 gains are market income for the household as a whole.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
      spouse:
        age: 48
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        other_net_gain: 8_000
    households:
      household:
        members: [head, spouse]
  output:
    household_market_income: 8_000
