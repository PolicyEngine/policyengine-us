- name: NC SCCA flows into household state benefits from 2024
  period: 2024
  input:
    people:
      parent:
        age: 30
    spm_units:
      spm_unit:
        members: [parent]
        nc_scca:
          2024-01: 450
    households:
      household:
        members: [parent]
        county_str: ALAMANCE_COUNTY_NC
        state_code: NC
  output:
    household_state_benefits: 450

