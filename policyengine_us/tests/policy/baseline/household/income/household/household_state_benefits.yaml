# The bill reads the person-level input the way childcare_expenses does, so a
# bill set on the child caps the subsidy just as the SPM unit input does.
- name: Vermont's subsidy counts up to a bill set on the child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 52_875
      child:
        age: 3
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 8
        pre_subsidy_childcare_expenses: 10_000
    spm_units:
      spm_unit:
        members: [parent, child]
        meets_ccdf_activity_test: true
    households:
      household:
        members: [parent, child]
        state_code: VT
  output:
    child_care_subsidies: 17_628
    household_child_care_subsidies: 10_000
    household_state_benefits: 10_000

