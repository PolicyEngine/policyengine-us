# Vermont pays the state rate to the provider whatever the provider charges,
# from December 2023, so the payment can exceed the family's bill. Household
# benefits count it up to the bill. childcare_expenses can't show the family's
# own share in this case, because it subtracts the subsidy from the bill and
# stops at zero.
# In each case the subsidy is the $439 weekly state rate less the $100 weekly
# family share, as in vt_ccfap.yaml Case 1: ($439 - $100) * 52 = $17,628.
- name: Vermont's subsidy above a 10,000 bill counts up to the bill
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 52_875
      child:
        age: 3
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 8
    spm_units:
      spm_unit:
        members: [parent, child]
        meets_ccdf_activity_test: true
        spm_unit_pre_subsidy_childcare_expenses: 10_000
    households:
      household:
        members: [parent, child]
        state_code: VT
  output:
    child_care_subsidies: 17_628
    household_child_care_subsidies: 10_000
    household_state_benefits: 10_000

