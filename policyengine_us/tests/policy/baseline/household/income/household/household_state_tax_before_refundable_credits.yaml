  # With the exclusion: line 16 = $48,000; line 7 = $22,250; standard
  #   deduction $25,110; taxable income $0; tax $0.
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 68
        taxable_private_pension_income: 40_250
      person2:
        age: 68
        taxable_private_pension_income: 30_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_income_tax_before_credits: 2_092
    wi_retirement_income_exclusion_elected: true
    wi_income_tax: 0
    state_income_tax: 0
    household_state_tax_before_refundable_credits: 0
    household_refundable_state_tax_credits: 0

- name: Wisconsin retiree who rents claims the exclusion and forgoes the school property tax credit
  # With credits: line 7 = $41,250; standard deduction $10,956; taxable
  #   income $29,344; tax $1,159, less a renter's school property tax credit
  #   of at most $300 (line 16a), so at least $859.
  # With the exclusion: line 7 = $17,250; standard deduction $13,560;
  #   taxable income $2,740; tax $96, with no credit.
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 68
        taxable_private_pension_income: 41_250
        rent: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WI
  output:
    wi_retirement_income_exclusion_elected: true
    wi_income_tax: 96
    state_income_tax: 96
    household_state_tax_before_refundable_credits: 96
    household_refundable_state_tax_credits: 0

