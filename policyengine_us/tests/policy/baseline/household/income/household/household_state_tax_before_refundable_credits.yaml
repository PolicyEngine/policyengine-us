# Wisconsin retirees who claim the Schedule SB Line 16 retirement income
# subtraction owe the tax on the reduced income. For 2025 they may not claim
# any credit on Form 1 lines 13-20 and 30-35. The household totals must
# carry the tax and credits of the return the filer elects.
#
# Expected values come from the 2025 Wisconsin Form 1 instructions:
# https://www.revenue.wi.gov/TaxForms2025/2025-Form1-inst.pdf
#   Standard Deduction Table, pages 35-37 (keyed to line 7, Wisconsin income).
#   Tax Table, pages 38-43 (keyed to line 11, taxable income).
#   Line 10 exemptions, page 15: $700 per filer plus $250 if 65 or older.
# and the 2025 Schedule SB instructions, Line 16 (up to $24,000 per filer
# aged 67 or older, $48,000 on a joint return when both are):
# https://www.revenue.wi.gov/TaxForms2025/2025-ScheduleSB-Inst.pdf#page=7
#
# Social Security is not taxed by Wisconsin, and 30% of a net long-term
# capital gain is excluded, so line 7 below is pension + 70% of the gain.

- name: Wisconsin retiree, $20,250 pension, claims the exclusion and owes no tax
  # With credits: line 7 = $20,250 + $3,500 = $23,750; standard deduction
  #   $13,056; taxable income $23,750 - $13,056 - $950 = $9,744; tax $341.
  # With the exclusion: line 16 = $20,250; line 7 = $3,500; tax $0.
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 68
        taxable_private_pension_income: 20_250
        social_security_retirement: 24_000
        long_term_capital_gains: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WI
  output:
    wi_income_tax_before_credits: 341
    wi_retirement_income_exclusion_elected: true
    wi_income_tax: 0
    state_income_tax: 0
    household_state_tax_before_refundable_credits: 0
    household_refundable_state_tax_credits: 0

- name: Wisconsin retiree, $40,250 pension, claims the exclusion and owes $184
  # With credits: line 7 = $43,750; standard deduction $10,656; taxable
  #   income $43,750 - $10,656 - $950 = $32,144; tax $1,282.
  # With the exclusion: line 16 = $24,000; line 7 = $19,750; standard
  #   deduction $13,536; taxable income $5,264; tax $184.
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 68
        taxable_private_pension_income: 40_250
        social_security_retirement: 24_000
        long_term_capital_gains: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WI
  output:
    wi_income_tax_before_credits: 1_282
    wi_retirement_income_exclusion_elected: true
    wi_income_tax: 184
    state_income_tax: 184
    household_state_tax_before_refundable_credits: 184
    household_refundable_state_tax_credits: 0

