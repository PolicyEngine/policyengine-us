# A single Texas adult aged 40 in 2025 (the 2017 cliffs analysis household,
# PolicyEngine/us-cliffs-2017 scripts/ptc_household.py), with health benefits
# counted. A $1,000 raise cuts the premium tax credit by $94, and net income
# rises by $709.50 with or without health benefits counted (31,840.09 to
# 32,549.59 without): the cut counts once.
- name: With health benefits counted, a Texas adult earning $30,000 in 2025.
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.include_health_benefits_in_net_income: true
    people:
      person1:
        age: 40
        employment_income: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    premium_tax_credit_in_force: 5_606.58
    household_health_costs: 6_194.58
    household_net_income: 25_645.50

- name: With health benefits counted, the same adult earning $31,000.
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.include_health_benefits_in_net_income: true
