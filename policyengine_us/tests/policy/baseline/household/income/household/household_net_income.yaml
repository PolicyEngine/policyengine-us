# With health benefits counted, health costs subtract the whole Marketplace
# premium, so a credit that is $1,000 larger raises net income by $1,000, not
# $2,000 (once as a refundable credit and again through a smaller net premium).
- name: With health benefits counted, a $1,000 premium tax credit against a $5,000 premium.
  period: 2026
  input:
    gov.simulation.include_health_benefits_in_net_income: true
    household_market_income: 30_000
    household_benefits: 0
    income_tax_refundable_credits_in_force: 0
    household_refundable_state_tax_credits: 0
    household_refundable_local_tax_credits: 0
    household_tax_before_refundable_credits: 2_000
    chip_premium: 0
    selected_marketplace_plan_premium_proxy: 5_000
    aca_ptc: 1_000
  output:
    premium_tax_credit_in_force: 1_000
    household_health_costs: 5_000
    household_net_income: 30_000 + 1_000 - 2_000 - 5_000

- name: With health benefits counted, a $2,000 premium tax credit against the same premium.
  period: 2026
  input:
    gov.simulation.include_health_benefits_in_net_income: true
    household_market_income: 30_000
    household_benefits: 0
