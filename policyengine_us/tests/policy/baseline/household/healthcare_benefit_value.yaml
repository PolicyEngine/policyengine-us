    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 2_619.02
    healthcare_benefit_value: 2_619.02

