- name: AZ child
  period: 2023
  absolute_error_margin: 0.1
  input:
    households:
      household:
        state_code: AZ
        members: [person]
    people:
      person:
        is_infant_for_medicaid: true
        is_medicaid_eligible: true
        medicaid_cost_if_enrolled: 3_564.1
  output: 
    healthcare_benefit_value: 3_564.1

- name: Case 2, MSP limited-benefit cost is a healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 2_434.8
  output:
    healthcare_benefit_value: 2_434.8

- name: Case 3, enrolled CHIP value is included in healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 2_619.02
    healthcare_benefit_value: 2_619.02

- name: Case 4, CHIP-eligible non-enroller has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: false
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 5, CHIP-ineligible person has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: false
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 6, annual assigned ACA PTC is the canonical ACA health benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 1_200
    premium_tax_credit: 99
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    healthcare_benefit_value: 1_200

- name: Case 7, Vermont Premium Assistance flows through to the healthcare benefit value.
  # vt_premium_assistance is in the adds list, so a direct 585 state top-up (with
  # all other components zeroed) surfaces as the household healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VT
    medicaid_cost: 0
    msp_cost: 0
    chip: 0
    assigned_aca_ptc: 0
    basic_health_program: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
    vt_premium_assistance: 585
  output:
    healthcare_benefit_value: 585

- name: Case 8, Vermont Premium Assistance derived from a real VT household flows into the benefit value.
  # Gap B. Unlike Case 7 (which injects vt_premium_assistance directly), this case
  # DERIVES vt_premium_assistance end-to-end from employment_income for a 40-year-old
  # single Vermont enrollee (~249% FPL, as in the integration Scenario 1), proving
  # the aca_magi -> VPA -> adds wiring against a computed value. Because
  # healthcare_benefit_value also adds the federal assigned_aca_ptc, the household
  # total is assigned_aca_ptc + vt_premium_assistance; both derived figures are
  # placeholders for the ci-fixer to fill from the model.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 39_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # assigned_aca_ptc (12_310.752) + vt_premium_assistance (585.00) = 12_895.752.
    vt_premium_assistance: 585.00 # derived
    healthcare_benefit_value: 12_895.752 # derived
