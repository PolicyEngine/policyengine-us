- name: AZ child
  period: 2023
  absolute_error_margin: 0.1
  input:
    households:
      household:
        state_code: AZ
        members: [person]
    people:
      person:
        is_infant_for_medicaid: true
        is_medicaid_eligible: true
        medicaid_cost_if_enrolled: 3_564.1
  output: 
    healthcare_benefit_value: 3_564.1

- name: Case 2, MSP limited-benefit cost is a healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 2_434.8
  output:
    healthcare_benefit_value: 2_434.8

- name: Case 3, enrolled CHIP value is included in healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 2_619.02
    healthcare_benefit_value: 2_619.02

- name: Case 4, CHIP-eligible non-enroller has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: false
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 5, CHIP-ineligible person has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: false
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 6, annual assigned ACA PTC is the canonical ACA health benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 1_200
    premium_tax_credit: 99
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    healthcare_benefit_value: 1_200

- name: Case 7, Washington Cascade Care Savings flows into healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
    wa_cascade_care_savings: 660
  output:
    healthcare_benefit_value: 660

- name: Case 8, two tax units each earning CCS sum into one household value.
  # wa_cascade_care_savings is a TaxUnit variable; healthcare_benefit_value is a
  # Household variable that adds it, so a household with two tax units (each with
  # a Group 1 member earning 660) must aggregate to 660 + 660 = 1_320. Guards the
  # TaxUnit -> Household sum, which a single-tax-unit case cannot exercise. All
  # other health-value components are zeroed so the total is purely the CCS sum.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
        medicaid_cost: 0
        msp_cost: 0
        chip: 0
        or_healthier_oregon_cost: 0
      person2:
        age: 38
        is_aca_ptc_eligible: true
        medicaid_cost: 0
        msp_cost: 0
        chip: 0
        or_healthier_oregon_cost: 0
    tax_units:
      tax_unit1:
        members: [person1]
        aca_magi_fraction: 1.4
        slcsp: 6_000
        aca_ptc: 5_000
        assigned_aca_ptc: 0
        basic_health_program: 0
        co_omnisalud: 0
      tax_unit2:
        members: [person2]
        aca_magi_fraction: 1.4
        slcsp: 6_000
        aca_ptc: 5_000
        assigned_aca_ptc: 0
        basic_health_program: 0
        co_omnisalud: 0
    households:
      household:
        members: [person1, person2]
        state_code: WA
  output:
    wa_cascade_care_savings: [660, 660]
    healthcare_benefit_value: 1_320
