- name: AZ child
  period: 2023
  absolute_error_margin: 0.1
  input:
    households:
      household:
        state_code: AZ
        members: [person]
    people:
      person:
        is_infant_for_medicaid: true
        is_medicaid_eligible: true
        medicaid_cost_if_enrolled: 3_564.1
  output: 
    healthcare_benefit_value: 3_564.1

- name: Case 2, MSP limited-benefit cost is a healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 2_434.8
  output:
    healthcare_benefit_value: 2_434.8

- name: Case 3, enrolled CHIP value is included in healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 2_619.02
    healthcare_benefit_value: 2_619.02

- name: Case 4, CHIP-eligible non-enroller has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: true
    takes_up_chip_if_eligible: false
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 5, CHIP-ineligible person has no healthcare benefit value.
  period: 2026
  input:
    state_code: AL
    is_chip_eligible: false
    takes_up_chip_if_eligible: true
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    chip: 0
    healthcare_benefit_value: 0

- name: Case 6, annual assigned ACA PTC is the canonical ACA health benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 1_200
    premium_tax_credit: 99
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    healthcare_benefit_value: 1_200

- name: Case 7, California Premium Subsidy flows into healthcare benefit value.
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 0
    co_omnisalud: 0
    ca_premium_subsidy: 900
    or_healthier_oregon_cost: 0
  output:
    healthcare_benefit_value: 900

- name: Case 8, assigned ACA PTC and CA Premium Subsidy are additive (base + top-up).
  # Both ACA components nonzero: assigned_aca_ptc (federal PTC, take-up-gated) is
  # the base, ca_premium_subsidy (raw state top-up) is the California residual on
  # top. healthcare_benefit_value adds both -> 1_200 + 900 = 2_100. Guards against
  # any future accidental subtraction/overlap between the two ACA layers; they are
  # additive by design (the CA residual formula already nets out aca_ptc, so there
  # is no double-count of the federal subsidy).
  period: 2026
  absolute_error_margin: 0.01
  input:
    medicaid_cost: 0
    msp_cost: 0
    assigned_aca_ptc: 1_200
    ca_premium_subsidy: 900
    co_omnisalud: 0
    or_healthier_oregon_cost: 0
  output:
    healthcare_benefit_value: 2_100
