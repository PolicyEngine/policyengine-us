- name: Combined work and childcare expenses are capped at the lower earner
  period: 2024
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 35
        weeks_worked: 10
        employment_income: 40_000
        is_household_head: true
        is_tax_unit_head: true
      spouse:
        age: 33
        weeks_worked: 20
        employment_income: 2_000
        is_tax_unit_spouse: true
      child:
        age: 8
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    spm_units:
      spm_unit:
        members: [head, spouse, child]
        spm_unit_pre_subsidy_childcare_expenses: 2_000
  output:
    spm_unit_capped_work_childcare_expenses: 2_000

- name: Combined expenses are capped when work expenses already exceed the earnings cap
  period: 2024
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 41
        weeks_worked: 52
        employment_income: 1_500
        is_household_head: true
        is_tax_unit_head: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
    spm_units:
      spm_unit:
        members: [head, child]
        spm_unit_pre_subsidy_childcare_expenses: 3_000
  output:
    spm_unit_capped_work_childcare_expenses: 1_500

- name: Childcare is capped by the remaining lower-earner earnings after work expenses
  period: 2024
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 46
        weeks_worked: 52
        employment_income: 9_098.57
        is_household_head: true
        is_tax_unit_head: true
      spouse:
        age: 46
        weeks_worked: 52
        employment_income: 30_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
        spm_unit_pre_subsidy_childcare_expenses: 21_580
  output:
    spm_unit_capped_work_childcare_expenses: 9_098.57

- name: Unmarried partner counts toward the reference person's remaining childcare cap
  period: 2024
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 35
        weeks_worked: 10
        employment_income: 40_000
        is_household_head: true
        is_tax_unit_head: true
      partner:
        age: 33
        weeks_worked: 20
        employment_income: 2_000
        is_unmarried_partner_of_household_head: true
        is_tax_unit_head: true
      child:
        age: 8
    tax_units:
      reference_unit:
        members: [head, child]
      partner_unit:
        members: [partner]
    spm_units:
      spm_unit:
        members: [head, partner, child]
        spm_unit_pre_subsidy_childcare_expenses: 2_000
  output:
    spm_unit_capped_work_childcare_expenses: 2_000

- name: A child care subsidy lowers the out-of-pocket expense
  period: 2026
  absolute_error_margin: 0.001
  input:
    spm_unit_work_expenses: 1_000
    spm_unit_head_spouse_earned_cap: 30_000
    spm_unit_pre_subsidy_childcare_expenses: 14_000
    child_care_subsidies: 13_916.40
  output:
    # 1,000 + (14,000 - 13,916.40).
    spm_unit_capped_work_childcare_expenses: 1_083.60

- name: A subsidy above the expense leaves only work expenses
  period: 2026
  absolute_error_margin: 0.001
  input:
    spm_unit_work_expenses: 1_000
    spm_unit_head_spouse_earned_cap: 30_000
    spm_unit_pre_subsidy_childcare_expenses: 1_200
    child_care_subsidies: 22_828
  output:
    # The floor keeps the part of the subsidy above the expense out of the
    # SPM, so it cannot offset work expenses.
    spm_unit_capped_work_childcare_expenses: 1_000

- name: The earnings cap applies after the subsidy
  period: 2026
  absolute_error_margin: 0.001
  input:
    spm_unit_work_expenses: 1_000
    spm_unit_head_spouse_earned_cap: 5_000
    spm_unit_pre_subsidy_childcare_expenses: 14_000
    child_care_subsidies: 2_000
  output:
    # 1,000 + 12,000 exceeds the cap, so the subsidy leaves the expense at
    # the cap.
    spm_unit_capped_work_childcare_expenses: 5_000

- name: A subsidy can bring the expense below the earnings cap
  period: 2026
  absolute_error_margin: 0.001
  input:
    spm_unit_work_expenses: 1_000
    spm_unit_head_spouse_earned_cap: 5_000
    spm_unit_pre_subsidy_childcare_expenses: 14_000
    child_care_subsidies: 13_000
  output:
    spm_unit_capped_work_childcare_expenses: 2_000

- name: Expenses in a unit with no child are capped as before and take no subsidy
  period: 2026
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 46
        employment_income: 9_000
        is_household_head: true
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
        spm_unit_work_expenses: 0
        spm_unit_pre_subsidy_childcare_expenses: 4_000
  output:
    child_care_subsidies: 0
    spm_unit_capped_work_childcare_expenses: 4_000
