# Real state programs through the SPM child care expense. New York, Texas and
# Alaska subsidies never reached the SPM before; Colorado, Washington and West
# Virginia reached it as resources, on top of pre-subsidy expenses.
#
# Each family is one working parent and a child aged 3. Unless a case says
# otherwise, the child is in care 8 hours a day, 5 days a week. The 2026 cases
# earn $30,000 and the 2024 cases earn $24,000.
# Without weeks_worked, work expenses are zero, so the SPM expense is the
# out-of-pocket amount.

- name: New York, Manhattan family with a subsidy just below the expense
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 30_000
        weekly_hours_worked_before_lsr: 40
        is_tax_unit_head: true
        is_household_head: true
      child:
        age: 3
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    families:
      family:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 14_000
    households:
      household:
        members: [parent, child]
        state_code: NY
        county_fips: "36061"
  output:
    child_care_subsidies: 13_916.40
    # 14,000 - 13,916.40.
    spm_unit_capped_work_childcare_expenses: 83.60

