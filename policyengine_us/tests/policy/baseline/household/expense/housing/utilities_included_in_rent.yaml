- name: Case 1, by default the tenant pays utilities, so none are included in rent.
  period: 2026
  output:
    tenant_pays_utilities: true
    utilities_included_in_rent: false

- name: Case 2, a tenant who does not pay utilities has them included in rent.
  period: 2026
  input:
    tenant_pays_utilities: false
  output:
    utilities_included_in_rent: true

# A direct input silently takes precedence over the derived value in either
# direction; the two inputs are not checked for consistency.
- name: Case 3, a direct false overrides the derivation when the tenant does not pay utilities.
  period: 2026
  input:
    tenant_pays_utilities: false
    utilities_included_in_rent: false
  output:
    utilities_included_in_rent: false

- name: Case 4, a direct true overrides the default derivation when the tenant pays utilities.
  period: 2026
  input:
    utilities_included_in_rent: true
  output:
    tenant_pays_utilities: true
    utilities_included_in_rent: true
