- name: Case 1, desired deferrals below the elective deferral limit.
  period: 2025
  input:
    age: 35
    traditional_401k_contributions_desired: 12_000
    roth_401k_contributions_desired: 8_000
  output:
    elective_deferral_limit: 23_500
    elective_deferral_contribution_scale: 1
    traditional_401k_contributions: 12_000
    roth_401k_contributions: 8_000

- name: Case 2, desired deferrals above the base elective deferral limit are scaled proportionally.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    traditional_401k_contributions_desired: 20_000
    roth_401k_contributions_desired: 10_000
  output:
    elective_deferral_limit: 23_500
    elective_deferral_contribution_scale: 0.783333
    traditional_401k_contributions: 15_666.67
    roth_401k_contributions: 7_833.33
    pre_tax_contributions: 15_666.67

- name: Case 3, desired deferrals are scaled proportionally across 401(k) and 403(b) deferrals.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 62
    traditional_401k_contributions_desired: 20_000
    roth_401k_contributions_desired: 10_000
    traditional_403b_contributions_desired: 5_000
    roth_403b_contributions_desired: 5_000
  output:
    elective_deferral_limit: 34_750
    elective_deferral_contribution_scale: 0.86875
    traditional_401k_contributions: 17_375
    roth_401k_contributions: 8_687.50
    traditional_403b_contributions: 4_343.75
    roth_403b_contributions: 4_343.75

- name: Case 4, SECURE 2.0 enhanced catch-up applies from ages 60 through 63.
  period: 2025
  input:
    people:
      person1:
        age: 49
      person2:
        age: 50
      person3:
        age: 59
      person4:
        age: 60
      person5:
        age: 63
      person6:
        age: 64
  output:
    elective_deferral_limit: [23_500, 31_000, 31_000, 34_750, 34_750, 31_000]

- name: Case 5, traditional deferrals reduce income tax wages.
  period: 2025
  input:
    age: 40
    employment_income: 100_000
    traditional_401k_contributions_desired: 50_000
  output:
    traditional_401k_contributions: 23_500
    pre_tax_contributions: 23_500
    irs_employment_income: 76_500

- name: Case 6, traditional deferrals do not reduce FICA wages.
  period: 2025
  input:
    age: 40
    employment_income: 100_000
    traditional_401k_contributions_desired: 50_000
  output:
    traditional_401k_contributions: 23_500
    payroll_tax_gross_wages: 100_000

- name: Case 7, Roth deferrals count for the saver's credit.
  period: 2025
  input:
    age: 40
    traditional_401k_contributions_desired: 30_000
    roth_401k_contributions_desired: 17_000
    retirement_distributions: 0
  output:
    traditional_401k_contributions: 15_000
    roth_401k_contributions: 8_500
    savers_credit_qualified_contributions: 23_500

- name: Case 8, the 2026 standard catch-up applies from ages 50 through 59.
  period: 2026
  input:
    age: 55
    traditional_401k_contributions_desired: 32_500
  output:
    elective_deferral_limit: 32_500
    traditional_401k_contributions: 32_500

- name: Case 9, the SECURE 2.0 enhanced catch-up applies in 2026.
  period: 2026
  input:
    age: 62
    traditional_401k_contributions_desired: 35_750
  output:
    elective_deferral_limit: 35_750
    traditional_401k_contributions: 35_750

- name: Case 10, age 64 returns to the standard catch-up in 2026.
  period: 2026
  input:
    age: 64
    traditional_401k_contributions_desired: 35_750
  output:
    elective_deferral_limit: 32_500
    traditional_401k_contributions: 32_500

- name: Case 11, 2017 deferral and catch-up limits follow Notice 2016-62.
  # Notice 2016-62, PDF pages 1-2: $18,000 plus $6,000 from age 50.
  period: 2017
  absolute_error_margin: 0.01
  input:
    employment_income: [100_000, 100_000, 100_000, 100_000]
    age: [49, 50, 60, 64]
    traditional_401k_contributions_desired: [30_000, 30_000, 30_000, 30_000]
  output:
    elective_deferral_limit: [18_000, 24_000, 24_000, 24_000]
    traditional_401k_contributions: [18_000, 24_000, 24_000, 24_000]

- name: Case 12, 2018 deferral limits preserve the next-year increase.
  # Notice 2017-64, $18,500 regular deferrals and $6,000 catch-up.
  period: 2018
  absolute_error_margin: 0.01
  input:
    employment_income: [100_000, 100_000]
    age: [49, 50]
    traditional_401k_contributions_desired: [30_000, 30_000]
  output:
    elective_deferral_limit: [18_500, 24_500]
    traditional_401k_contributions: [18_500, 24_500]

