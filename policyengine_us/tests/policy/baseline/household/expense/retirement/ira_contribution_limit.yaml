# IRS Notice 2025-67, PDF page 4, sections 219(b)(5)(A) and (B).
- name: Case 16, 2026 IRA catch-up uses the newly indexed eleven hundred dollars.
  period: 2026
  input:
    age:
    - 49
    - 50
    ira_compensation:
    - 50_000
    - 50_000
    traditional_ira_contributions_desired:
    - 20_000
    - 20_000
