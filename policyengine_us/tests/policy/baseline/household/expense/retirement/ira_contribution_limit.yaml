- name: Case 1, IRA contributions below the base limit are unchanged.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        traditional_ira_contributions_desired: 4_000
        roth_ira_contributions_desired: 2_000
  output:
    ira_contribution_limit: 7_000
    ira_contribution_scale: 1
    traditional_ira_contributions: 4_000
    roth_ira_contributions: 2_000

- name: Case 2, IRA contributions above the base limit are allocated proportionally.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        traditional_ira_contributions_desired: 9_000
        roth_ira_contributions_desired: 3_000
  output:
    ira_contribution_limit: 7_000
    ira_contribution_scale: 0.583333
    traditional_ira_contributions: 5_250
    roth_ira_contributions: 1_750

- name: Case 3, IRA catch-up contribution raises the combined limit.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 100_000
        traditional_ira_contributions_desired: 9_000
        roth_ira_contributions_desired: 3_000
  output:
    ira_contribution_limit: 8_000
    ira_contribution_scale: 0.666667
    traditional_ira_contributions: 6_000
    roth_ira_contributions: 2_000

- name: Case 4, desired IRA variables are limited proportionally.
  period: 2024
  input:
    people:
      person1:
        age: 45
        employment_income: 100_000
        traditional_ira_contributions_desired: 2_000
        roth_ira_contributions_desired: 8_000
  output:
    ira_contribution_scale: 0.7
    traditional_ira_contributions: 1_400
    roth_ira_contributions: 5_600

- name: Case 5, federal above-the-line deductions use traditional IRA contributions.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        traditional_ira_contributions_desired: 12_000
    tax_units:
      tax_unit:
        members: [person1]
  output:
    above_the_line_deductions: 7_000
    adjusted_gross_income: 93_000

- name: Case 6, Saver's Credit qualified contributions use IRA contributions.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        traditional_ira_contributions_desired: 9_000
        roth_ira_contributions_desired: 3_000
  output:
    savers_credit_qualified_contributions: 7_000

- name: Case 7, Puerto Rico retirement deduction uses IRA contributions.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        pr_agi_person: 10_000
        traditional_ira_contributions_desired: 9_000
        roth_ira_contributions_desired: 3_000
    households:
      household:
        members: [person1]
        state_code: PR
  output:
    pr_retirement_deduction: 5_000

- name: A supplied Roth contribution uses up the spouse's shared compensation
  # 26 U.S.C. 219(c)(1)(B): the nonworking spouse's limit is the other
  # spouse's $10,000 compensation less their $7,000 Roth contribution.
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        roth_ira_contributions: 7_000
        is_tax_unit_head: true
      spouse:
        age: 40
        roth_ira_contributions: 0
        traditional_ira_contributions_desired: 7_500
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    ira_contribution_limit: [7_500, 3_000]
    traditional_ira_contributions: [0, 3_000]

- name: Case 8, 2017 IRA limit includes the age-fifty catch-up.
  # Publication 590-A (2017), PDF page 5: $5,500 or $6,500 at age 50+.
  period: 2017
  input:
    age: [49, 50]
    ira_compensation: [100_000, 100_000]
    traditional_ira_contributions_desired: [10_000, 10_000]
  output:
    ira_contribution_limit: [5_500, 6_500]
    traditional_ira_contributions: [5_500, 6_500]

# IRS retirement COLA table, PDF pages 2 and 3, section 219(b)(5)(A).
# https://www.irs.gov/pub/irs-tege/cola-table.pdf
# Section 219(b)(5)(B) supplies the $1,000 catch-up through 2025.
- name: Case 9, 2018 generated IRA contributions respect the annual and catch-up limits.
  period: 2018
  input:
    age:
    - 49
    - 50
    ira_compensation:
    - 50_000
    - 50_000
    traditional_ira_contributions_desired:
    - 20_000
    - 20_000
  output:
    ira_contribution_limit: &id001
    - 5_500
    - 6_500
    traditional_ira_contributions: *id001
