# Expected values follow the Pub. 560 Deduction Worksheet for Self-Employed
# (2025: https://www.irs.gov/pub/irs-prior/p560--2025.pdf#page=39; 2022:
# https://www.irs.gov/pub/irs-prior/p560--2022.pdf#page=34), with the 25% plan
# rate (step 4 rate 0.2) and, unless the case says otherwise, elective
# deferrals (step 9) and catch-up contributions (step 17) equal to the
# person's remaining section 402(g) room. Step 3 is Schedule C net profit less
# its share of the deductible part of self-employment tax: half of 15.3% (12.4%
# only up to the Social Security wage base less wages) of 92.35% of all net
# profit, split by each business's share of the positive net profits. With more
# than one business, step 2 is that share, as on Form 7206 lines 5 to 8; the
# worksheet as printed enters all of Schedule 1 line 15.

- name: Self-employed pension contributions are limited by the 2026 annual additions dollar limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        self_employment_income: 500_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Step 3: 500,000 - (184,500 x 12.4% + 461,750 x 2.9%) / 2 = 481,865.63.
    # Step 5: 20% x 481,865.63 = 96,373.13; step 6 caps it at 360,000 x 25% =
    # 90,000 (step 7). Steps 13 + 15 stop at the $72,000 dollar limit.
    self_employed_pension_contribution_limit: 72_000
    self_employed_pension_contributions: 72_000
    self_employed_pension_contribution_ald_person: 72_000

- name: Self-employed pension contributions are also limited by self-employment compensation.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        self_employment_income: 50_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Step 3: 50,000 - 46,175 x 15.3% / 2 = 46,467.61. Step 7: 9,293.52.
    # Step 9: 24,500. Step 12: (46,467.61 - 24,500) / 2 = 10,983.81.
    # Steps 13 + 15: 9,293.52 + 24,500 = 33,793.52.
    self_employed_pension_contribution_limit: 33_793.52
    self_employed_pension_contributions: 33_793.52
    self_employed_pension_contribution_ald_person: 33_793.52

- name: Elective deferrals to an employer's 401(k) use up the deferral room, leaving the 20% SEP and profit-sharing rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        employment_income: 100_000
        self_employment_income: 100_000
        traditional_401k_contributions_desired: 50_000
        self_employed_pension_contributions_desired: 72_000
  output:
    elective_deferral_limit: 35_750
    traditional_401k_contributions: 35_750
    # Wages of 100,000 leave 84,500 of the 184,500 wage base. Step 3:
    # 100,000 - (84,500 x 12.4% + 92,350 x 2.9%) / 2 = 93,421.93.
    # No deferral room is left, so the limit is step 7: 20% x 93,421.93.
    self_employed_pension_earned_income: 93_421.93
    self_employed_pension_contribution_limit: 18_684.39
    self_employed_pension_contributions: 18_684.39

- name: Annual additions cap does not apply to IRA contributions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        self_employment_income: 100_000
        traditional_ira_contributions_desired: 9_000
        self_employed_pension_contributions_desired: 72_000
  output:
    ira_contribution_limit: 8_600
    traditional_ira_contributions: 8_600
    # Step 3: 100,000 - 92,350 x 15.3% / 2 = 92,935.23. Steps 13 + 15:
    # 18,587.05 + 24,500 = 43,087.05. Step 18: the 8,000 catch-up.
    self_employed_pension_contribution_limit: 51_087.05
    self_employed_pension_contributions: 51_087.05

- name: Self-employed pension contributions use desired input.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
  output:
    self_employed_pension_contribution_limit: 43_087.05
    self_employed_pension_contributions: 43_087.05

- name: Pub. 560 2025 example net profit, with elective deferrals at the 402(g) limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 200_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Steps 1 to 3 as in the Pub. 560 example: 200,000 - 13,596.35 = 186,403.65.
    self_employment_tax_ald_person: 13_596.35
    self_employed_pension_earned_income: 186_403.65
    # Step 7: 20% x 186,403.65 = 37,280.73. Step 9: 23,500. Step 10: 46,500.
    # Step 12: (186,403.65 - 23,500) / 2 = 81,451.83. Step 13: 37,280.73.
    # Step 15: 23,500. Step 19: 60,780.73.
    self_employed_pension_contribution_limit: 60_780.73
    self_employed_pension_contribution_ald_person: 60_780.73

- name: Pub. 560 2025 example net profit, with no elective deferral room left (SEP and profit-sharing path).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 23_500
        traditional_401k_contributions_desired: 23_500
        self_employment_income: 200_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Wages of 23,500 leave 152,600 of the 176,100 wage base. Step 2:
    # (152,600 x 12.4% + 184,700 x 2.9%) / 2 = 12,139.35.
    self_employed_pension_earned_income: 187_860.65
    # Steps 9 to 20 do not apply: steps 7 and 8 give 20% x 187,860.65.
    self_employed_pension_contribution_limit: 37_572.13

- name: Catch-up contributions at age 55 add to the limit (steps 16 to 18).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 55
        self_employment_income: 200_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Steps 13 and 15 as in the age 40 case (60,780.73). Step 16:
    # 186,403.65 - 37,280.73 - 23,500 = 125,622.92. Step 18: 7,500.
    self_employed_pension_contribution_limit: 68_280.73

- name: The age 60 to 63 catch-up amount applies from 2025.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 61
        self_employment_income: 200_000
        self_employed_pension_contributions_desired: 100_000
  output:
    self_employed_pension_contribution_limit: 72_030.73

- name: Catch-up contributions add to the dollar limit when it binds.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 55
        self_employment_income: 500_000
        self_employed_pension_contributions_desired: 100_000
  output:
    self_employed_pension_contribution_limit: 80_000

- name: Catch-up contributions can't take the limit above earned income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 55
        self_employment_income: 20_000
        self_employed_pension_contributions_desired: 30_000
  output:
    # Step 3: 20,000 - 18,470 x 15.3% / 2 = 18,587.05. Step 9 at 18,587.05
    # leaves steps 11 to 13 at zero, and step 16 is 18,587.05 - 18,587.05 = 0,
    # so step 18 adds none of the 7,500 catch-up: step 19 is 18,587.05
    # (sections 404(a)(8)(C) and 414(v)(2)(A)(ii)).
    self_employed_pension_earned_income: 18_587.05
    self_employed_pension_contribution_limit: 18_587.05
    self_employed_pension_contributions: 18_587.05

- name: With low profit, deferrals can reach all of earned income but no more.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 20_000
        self_employed_pension_contributions_desired: 20_000
  output:
    # Step 3: 20,000 - 18,470 x 15.3% / 2 = 18,587.05. Step 9 at 18,587.05
    # leaves steps 11 to 13 at zero, so step 19 equals step 3.
    self_employed_pension_earned_income: 18_587.05
    self_employed_pension_contribution_limit: 18_587.05
    self_employed_pension_contributions: 18_587.05

- name: The 100%-of-compensation limit binds when deferrals are large relative to profit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 30_000
        self_employed_pension_contributions_desired: 30_000
  output:
    # Step 3: 30,000 - 27,705 x 15.3% / 2 = 27,880.57. Step 7: 5,576.11.
    # Step 12: (27,880.57 - 23,500) / 2 = 2,190.28, the smallest, so step 13
    # is 2,190.28. Step 14: 25,690.28. Step 15: 23,500. Step 19: 25,690.28.
    self_employed_pension_earned_income: 27_880.57
    self_employed_pension_contribution_limit: 25_690.28

- name: Deferrals to an employer's plan use the regular limit first and leave the catch-up room.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 52
        employment_income: 50_000
        traditional_401k_contributions_desired: 20_000
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # 402(g) limit 24,500 + 8,000 catch-up = 32,500, less 20,000 of deferrals:
    # 4,500 of regular room and the 8,000 catch-up. Step 3: 92,935.23.
    # Steps 13 + 15: 18,587.05 + 4,500. Step 18: 8,000.
    self_employed_pension_earned_income: 92_935.23
    self_employed_pension_contribution_limit: 31_087.05

- name: Deferrals to another employer's 403(b) plan use up the deferral room too.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        traditional_403b_contributions_desired: 20_000
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Section 402(g) aggregates 401(k) and 403(b) deferrals: 24,500 - 20,000
    # leaves 4,500 of room. Wages of 60,000 leave 124,500 of the wage base, so
    # step 3 is 100,000 - 92,350 x 15.3% / 2 = 92,935.23. Steps 13 + 15:
    # 18,587.05 + 4,500 = 23,087.05.
    self_employed_pension_earned_income: 92_935.23
    self_employed_pension_contribution_limit: 23_087.05

- name: Designated Roth deferrals to another employer's 403(b) plan use up the deferral room too.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        roth_403b_contributions_desired: 20_000
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Designated Roth contributions are elective deferrals (section
    # 402(g)(3)), so 24,500 - 20,000 leaves 4,500 of room. Step 3:
    # 100,000 - 92,350 x 15.3% / 2 = 92,935.23. Steps 13 + 15: 18,587.05 +
    # 4,500 = 23,087.05. Without the Roth deferrals the room would be 24,500
    # and the limit 43,087.05.
    self_employed_pension_earned_income: 92_935.23
    self_employed_pension_contribution_limit: 23_087.05

- name: Deferrals supplied above the 402(g) limit leave no deferral room and don't cut the 20% rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        traditional_401k_contributions: 30_000
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # The supplied 30,000 exceeds the 24,500 limit, so the room is 0, not
    # -5,500. Step 3: 92,935.23. Step 7: 20% x 92,935.23 = 18,587.05, the
    # SEP and profit-sharing path.
    self_employed_pension_earned_income: 92_935.23
    self_employed_pension_contribution_limit: 18_587.05

- name: With deferral room close to earned income, the limit is step 12, which a SIMPLE IRA can exceed.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        traditional_401k_contributions_desired: 17_500
        self_employment_income: 5_600
        self_employed_pension_contributions_desired: 10_000
  output:
    # 402(g) limit 22,500 less 17,500 deferred leaves 5,000 of room. Schedule
    # SE line 4: 5,600 x 0.9235 = 5,171.60. Line 15: 5,171.60 x 15.3% / 2 =
    # 395.63. Step 3: 5,600 - 395.63 = 5,204.37. Step 7: 1,040.87. Step 12:
    # (5,204.37 - 5,000) / 2 = 102.19, the smallest, so steps 13 + 15 are
    # (5,204.37 + 5,000) / 2 = 5,102.19.
    # A SIMPLE IRA would allow more (Pub. 560 (2025), page 15; section
    # 415(a)(2)): the 5,000 deferral, under its 15,500 limit for 2023, plus a
    # 3% match of Schedule SE line 4 before the contributions (0.03 x
    # 5,171.60 = 155.15), 5,155.15 in all. This limit cuts that by 52.96.
    self_employed_pension_earned_income: 5_204.37
    self_employed_pension_contribution_limit: 5_102.19
    self_employed_pension_contributions: 5_102.19

- name: Farm earnings take part of the self-employment tax deduction, which is split by net profit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 60_000
        farm_operations_income: 40_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Self-employment tax deduction: 92,350 x 15.3% / 2 = 7,064.78, of which
    # 60% (4,238.87) is attributable to the Schedule C business.
    self_employment_tax_ald_person: 7_064.78
    self_employed_pension_earned_income: 55_761.14
    # Steps 13 + 15: 20% x 55,761.14 + 23,500 = 34,652.23.
    self_employed_pension_contribution_limit: 34_652.23

- name: A farm loss adds no profit to the split, so Schedule C takes all of line 15.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 60_000
        farm_operations_income: -20_000
        self_employed_pension_contributions_desired: 70_000
  output:
    # Schedule SE line 4: (60,000 - 20,000) x 0.9235 = 36,940. Line 15:
    # 36,940 x 15.3% / 2 = 2,825.91. Step 3: 60,000 - 2,825.91 = 57,174.09.
    # Step 7: 20% x 57,174.09 = 11,434.82. Steps 13 + 15: 11,434.82 + 23,500
    # of deferral room = 34,934.82.
    self_employed_pension_earned_income: 57_174.09
    self_employed_pension_contribution_limit: 34_934.82

- name: A partnership loss adds no profit to the split, so Schedule C takes all of line 15.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 60_000
        partnership_self_employment_net_earnings: -20_000
        self_employed_pension_contributions_desired: 70_000
  output:
    # Schedule SE line 4: (60,000 - 20,000) x 0.9235 = 36,940. Line 15:
    # 36,940 x 15.3% / 2 = 2,825.91. Form 7206 line 5 leaves out net losses,
    # so Schedule C's share is 1. Step 3: 60,000 - 2,825.91 = 57,174.09.
    # Steps 13 + 15: 20% x 57,174.09 + 23,500 = 34,934.82. Counting the loss
    # would give a share of 1.5, step 3 of 55,761.14 and a 34,652.23 limit.
    self_employment_tax_ald_person: 2_825.91
    self_employed_pension_earned_income: 57_174.09
    self_employed_pension_contribution_limit: 34_934.82

- name: A plan under the Schedule C business counts only that business's earned income, not a partnership's.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 1_000
        partnership_self_employment_net_earnings: 50_000
        self_employed_pension_contributions_desired: 5_000
  output:
    # Schedule 1 line 15: 51,000 x 0.9235 x 0.153 / 2 = 3,603.04, of which
    # 1 / 51 (70.65) is the Schedule C business's. Step 3: 1,000 - 70.65 =
    # 929.35, which elective deferrals can cover in full. Pub. 560 (2025),
    # page 7: with one plan, only that business's earned income counts.
    self_employment_tax_ald_person: 3_603.04
    self_employed_pension_earned_income: 929.35
    self_employed_pension_contribution_limit: 929.35
    self_employed_pension_contributions: 929.35

- name: Net profit under the self-employment tax threshold is all earned income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 400
        self_employed_pension_contributions_desired: 1_000
  output:
    # 92.35% of 400 is under $400, so there is no self-employment tax.
    self_employment_tax_ald_person: 0
    self_employed_pension_earned_income: 400
    self_employed_pension_contribution_limit: 400

- name: Pub. 560 2022 example net profit, with elective deferrals at the 402(g) limit.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 200_000
        self_employed_pension_contributions_desired: 100_000
  output:
    # Step 2: (147,000 x 12.4% + 184,700 x 2.9%) / 2 = 11,792.15. The Pub.
    # 560 (2022) example's step 21, 0.078 x step 3, is 14,680.
    self_employment_tax_ald_person: 11_792.15
    self_employed_pension_earned_income: 188_207.85
    # Step 7: 37,641.57. Step 9: 20,500. Steps 13 + 15: 58,141.57, under the
    # $61,000 dollar limit.
    self_employed_pension_contribution_limit: 58_141.57

- name: A Schedule C loss allows no contribution.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: -5_000
        self_employed_pension_contributions_desired: 5_000
  output:
    self_employed_pension_earned_income: 0
    self_employed_pension_contribution_limit: 0
    self_employed_pension_contributions: 0
    self_employed_pension_contribution_ald_person: 0
