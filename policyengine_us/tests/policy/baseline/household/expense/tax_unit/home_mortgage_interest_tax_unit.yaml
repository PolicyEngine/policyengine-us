- name: Interest on both residences is pooled
  period: 2026
  absolute_error_margin: 0
  input:
    home_mortgage_interest: 10_000
    second_residence_mortgage_interest: 4_000
  output:
    home_mortgage_interest_tax_unit: 14_000

- name: Second-residence interest is pooled when principal-residence interest is omitted
  period: 2026
  absolute_error_margin: 0
  input:
    second_residence_mortgage_interest: 4_000
  output:
    home_mortgage_interest_tax_unit: 4_000

- name: Interest on both residences sums across spouses
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 50
        home_mortgage_interest: 5_000
        second_residence_mortgage_interest: 1_000
      spouse:
        age: 50
        home_mortgage_interest: 3_000
        second_residence_mortgage_interest: 2_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
  output:
    home_mortgage_interest_tax_unit: 11_000
