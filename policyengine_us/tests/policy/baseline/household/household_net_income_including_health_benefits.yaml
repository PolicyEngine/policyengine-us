- name: Household with no income and yes healthcare benefits
  period: 2024
  input:
    household_net_income: 0
    healthcare_benefit_value: 1_000
  output:
    household_net_income_including_health_benefits: 1_000

- name: Household with no income and no healthcare benefits
  period: 2024
  input:
    household_net_income: 0
    healthcare_benefit_value: 0
  output:
    household_net_income_including_health_benefits: 0

- name: Household with yes income and yes healthcare benefits
  period: 2024
  input:
    household_net_income: 2_000
    healthcare_benefit_value: 2_000
  output:
    household_net_income_including_health_benefits: 4_000

- name: The premium tax credit, in both net income and health benefits, counts once
  period: 2026
  input:
    household_net_income: 3_000
    healthcare_benefit_value: 1_500
    premium_tax_credit_in_force: 1_000
  output:
    household_net_income_including_health_benefits: 3_000 + 1_500 - 1_000
