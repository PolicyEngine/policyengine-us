- name: Ohio Works First phase-out enters the marginal tax rate, OH-6000-mtr
  absolute_error_margin: 0.0001
  period: 2026
  input:
    people:
      parent:
        age: 30
        employment_income_before_lsr: 6_000
      child1:
        age: 4
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: OH
  output:
    # 1 - (24_198.07 - 23_317.57) / 1_000
