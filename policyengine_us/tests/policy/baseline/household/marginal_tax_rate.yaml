- name: simple household_net_income test TX-netinc-base
  absolute_error_margin: 0.01
  period: 2021
  input:
    age: 40
    employment_income: 100_000
    taxable_interest_income: 100_000
    state_fips: 48  # TX
  output:
    household_net_income: 151_539.00

- name: simple household_net_income test TX-netinc-alt
  absolute_error_margin: 0.01
  period: 2021
  input:
    age: 40
    employment_income: 101_000
    taxable_interest_income: 100_000
    state_fips: 48  # TX
  output:
    household_net_income: 152_104.50

- name: simple marginal_tax_rate test TX-mtr
  absolute_error_margin: 0.0001
  period: 2021
  input:
    age: 40
    employment_income: 100_000
    taxable_interest_income: 100_000
    state_fips: 48  # TX
  output:  # as expected from above two test results; also same as TAXSIM35
    marginal_tax_rate: 0.4345  # that is, 43.45%

- name: marginal_tax_rate test 1 in a two tax-unit household
  absolute_error_margin: 0.0001
  period: 2021
  input:
    simulation.marginal_tax_rate_adults: 1  # the default value
    people:
      person1:
        age: 43
        employment_income: 100_000
      person2:
        age: 63
        social_security_retirement: 10_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_fips: 48  # TX
  output:
    marginal_tax_rate: [0.3165, 0]

- name: marginal_tax_rate test 2 in a two tax-unit household
  absolute_error_margin: 0.0001
  period: 2021
  input:
    simulation.marginal_tax_rate_adults: 2
    people:
      person1:
        age: 43
        employment_income: 100_000
      person2:
        age: 63
        social_security_retirement: 10_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_fips: 48  # TX
  output:
    marginal_tax_rate: [0.3165, -0.0765]

# A single Ohio parent of children aged 4 and 8. The marginal tax rate must
# equal the change in household net income between the two fresh simulations
# above it: 1 - (alt - base) / 1_000. Ohio Works First counts
# employment_income_before_lsr as earned income, so the rate's branch must
# raise that input, not only the employment_income aggregate.

- name: Ohio parent earning $6,000 while on Ohio Works First, OH-6000-base
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      parent:
        age: 30
        employment_income_before_lsr: 6_000
      child1:
        age: 4
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: OH
  output:
    tanf: 5_974.60
    household_net_income: 23_317.57

