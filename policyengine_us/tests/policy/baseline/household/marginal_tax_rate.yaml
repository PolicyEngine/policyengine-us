  input:
    simulation.marginal_tax_rate_adults: 1  # below the default of 2
    people:
      person1:
        age: 43
        employment_income: 100_000
      person2:
        age: 63
        social_security_retirement: 10_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_fips: 48  # TX
  output:
    marginal_tax_rate: [0.3165, 0]

