# Three single roommates in Texas in 2024, each filing alone. Taxable income is
# earnings less the $14,600 standard deduction, so the $90,000 earner is in the
# 22% bracket and the $60,000 and $30,000 earners are in the 12% bracket; each
# also pays 7.65% employee payroll tax. The federal and FICA components check the
# component helper, which runs the same adult loop (marginal_earnings_change) as
# marginal_tax_rate.
# The same household with the cap raised to 3 is in
# tests/core/test_marginal_tax_rate_coverage.py, which avoids another cached
# tax-benefit system in the batched YAML runner.
- name: Third earner in a household gets a placeholder zero under the default cap
  absolute_error_margin: 0.0001
  period: 2024
  input:
    people:
      # Each has employer coverage, so no premium tax credit phases out
      # with a raise.
      person1:
        age: 40
        employment_income: 90_000
        has_esi: true
      person2:
        age: 35
        employment_income: 60_000
        has_esi: true
      person3:
        age: 30
        employment_income: 30_000
        has_esi: true
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
      tax_unit3:
        members: [person3]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
      spm_unit3:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
  output:
    marginal_tax_rate: [0.2965, 0.1965, 0]
    marginal_tax_rate_computed: [true, true, false]
    federal_marginal_tax_rate: [0.22, 0.12, 0]
    fica_marginal_tax_rate: [0.0765, 0.0765, 0]

- name: A marketplace enrollee's rate includes the premium tax credit's phase-out
  # A single 35-year-old in Texas earning $60,000 in 2024: 411% of the 2023
  # poverty guideline, where the enhanced schedule caps the benchmark plan at
  # 8.5% of income, so the credit falls by 8.5 cents per added dollar.
  # 12% bracket + 7.65% payroll tax + 8.5% = 28.15%.
  absolute_error_margin: 0.0001
  period: 2024
  input:
    people:
      person1:
        age: 35
        employment_income: 60_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    marginal_tax_rate: 0.2815

# A single Ohio parent of children aged 4 and 8. The marginal tax rate must
# equal the change in household net income between the two fresh simulations
# above it: 1 - (alt - base) / 1_000. Ohio Works First counts
# employment_income_before_lsr as earned income, so the rate's branch must
# raise that input, not only the employment_income aggregate.
# BLS CUUR0000SA0 observations through October 2026 give a 4,002.716
# twelve-month index sum (November and December carry October forward).
# The child's WIC value is (33.65 - 8) * 4_002.716 / 247.867 + 26 * 12
# = 726.212725, increasing each prior net-income fixture by 2.484935.

- name: Ohio parent earning $6,000 while on Ohio Works First, OH-6000-base
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      parent:
        age: 30
        employment_income_before_lsr: 6_000
      child1:
        age: 4
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: OH
  output:
    tanf: 5_974.60
    wic: [0, 726.21, 0]
    household_net_income: 23_297.41

