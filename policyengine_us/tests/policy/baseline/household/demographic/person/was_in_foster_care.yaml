- name: Case 1, youth in extended foster care all year was in foster care.
  period: 2025
  input:
    age: 19
    is_in_foster_care: true
  output:
    was_in_foster_care: true

- name: Case 2, youth in foster care from January through June was in foster care.
  period: 2025
  input:
    age: 17
    is_in_foster_care:
      2025-01: true
      2025-02: true
      2025-03: true
      2025-04: true
      2025-05: true
      2025-06: true
      2025-07: false
      2025-08: false
      2025-09: false
      2025-10: false
      2025-11: false
      2025-12: false
  output:
    # Reunified in July: a placement in any month of the year counts, not
    # only December.
    was_in_foster_care: true

- name: Case 3, person never in foster care was not in foster care.
  period: 2025
  input:
    age: 20
    is_in_foster_care: false
  output:
    was_in_foster_care: false
