- name: Default is single.
  period: 2022
  output:
    filing_status: SINGLE

- name: Separated file as SEPARATE.
  period: 2022
  input:
    is_separated: true
  output:
    filing_status: SEPARATE

- name: Married people file as JOINT.
  period: 2022
  input:
    tax_unit_married: true
  output:
    filing_status: JOINT

- name: Surviving spouses file as SURVIVING_SPOUSE.
  period: 2022
  input:
    surviving_spouse_eligible: true
  output:
    filing_status: SURVIVING_SPOUSE

- name: Head of household files as such.
  period: 2022
  input:
    head_of_household_eligible: true
  output:
    filing_status: HEAD_OF_HOUSEHOLD

- name: Single separated parent should count as a head of household
  period: 2022
  input:
    people:
      person1:
        is_separated: true
        age: 40
      person2:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
  output:
    filing_status: HEAD_OF_HOUSEHOLD

- name: Parent with 19-year-old non-student dependent (low income) qualifies for HOH.
  period: 2024
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
      adult_child:
        age: 19
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        # Low income below $5,050 threshold for qualifying relative
        employment_income: 3_000
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    # The 19-year-old non-student is too old to be a qualifying child but
    # can still be a qualifying relative for HOH purposes
    filing_status: HEAD_OF_HOUSEHOLD

- name: Parent with high-income adult child does not qualify for HOH.
  period: 2024
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
      adult_child:
        age: 19
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        # Income over $5,050 threshold - fails qualifying relative test
        employment_income: 10_000
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    # High-income adult child fails qualifying relative income test
    filing_status: SINGLE

- name: Separated filer with only a qualifying relative is not HOH.
  period: 2024
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
        is_separated: true
      adult_child:
        age: 19
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 3_000
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    filing_status: SEPARATE

- name: Separated non-qualifying dependent does not make the filer separate.
  period: 2024
  input:
    people:
      person1:
        age: 45
        employment_income: 50_000
        is_tax_unit_head: true
      person2:
        age: 19
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_related_to_head_or_spouse: false
        is_separated: true
        employment_income: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
  output:
    filing_status: SINGLE

- name: Taxpayer with a dependent parent receiving only Social Security files as head of household.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # The parent's provisional income is 0.5 * 12,000 = 6,000 < 25,000, so
    # their gross income is 0 < 4,400 and they are a qualifying relative.
    filing_status: HEAD_OF_HOUSEHOLD

- name: Taxpayer whose dependent has gross capital gains above the limit files as single.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        long_term_capital_gains: 5_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # Gross income = 5,000 (losses are not netted), not below 4,400.
    filing_status: SINGLE

- name: Taxpayer whose dependent parent's capital losses keep benefits nontaxable files as head of household.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 44_000
        long_term_capital_gains: 4_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 2,000 + 22,000 = 24,000 < 25,000, so the parent's
    # gross income is 4,000 < 4,400.
    filing_status: HEAD_OF_HOUSEHOLD

- name: Taxpayer whose married dependent parents live together files as single.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      mother:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
      father:
        age: 72
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    marital_units:
      head_marital_unit:
        members: [head]
      parents_marital_unit:
        members: [mother, father]
    tax_units:
      tax_unit:
        members: [head, mother, father]
    households:
      household:
        members: [head, mother, father]
  output:
    # Each parent has 5,100 of taxable benefits, not below 4,400.
    filing_status: SINGLE

- name: Widowed parent of a 29-year-old dependent with $6,238 of income files as surviving spouse.
  period: 2025
  input:
    people:
      head:
        age: 67
        is_surviving_spouse: true
        is_tax_unit_head: true
      adult_child:
        age: 29
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        # IRC 2(a)(1)(B) disregards the IRC 152(d)(1)(B) gross income test,
        # so income above the $5,200 limit does not matter.
        employment_income: 6_238
    tax_units:
      tax_unit:
        members: [head, adult_child]
    households:
      household:
        members: [head, adult_child]
  output:
    filing_status: SURVIVING_SPOUSE
    basic_standard_deduction: 31_500

- name: Widowed filer with a dependent parent files as head of household, not surviving spouse.
  period: 2025
  input:
    people:
      head:
        age: 67
        is_surviving_spouse: true
        is_tax_unit_head: true
      parent:
        age: 88
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_parent_of_filer_or_spouse: true
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    filing_status: HEAD_OF_HOUSEHOLD

- name: Widowed grandparent of a dependent grandchild files as head of household, not surviving spouse.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        age: 60
        is_tax_unit_head: true
        is_surviving_spouse: true
      mother:
        person_id: 2
        parent_1_id: 1
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      grandchild:
        person_id: 3
        parent_1_id: 2
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      head_unit:
        members: [head, grandchild]
      mother_unit:
        members: [mother]
    households:
      household:
        members: [head, mother, grandchild]
  output:
    filing_status: [HEAD_OF_HOUSEHOLD, SINGLE]
