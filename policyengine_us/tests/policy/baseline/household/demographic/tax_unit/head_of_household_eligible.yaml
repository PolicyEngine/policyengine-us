- name: Default is single with no dependents.
  period: 2022
  output:
    head_of_household_eligible: false

- name: Unmarried with qualifying child is eligible for HOH.
  period: 2024
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    head_of_household_eligible: true

- name: Unmarried parent with 19-year-old non-student child (low income) qualifies for HOH.
  period: 2024
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      adult_child:
        age: 19
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        # Low income under $5,050 threshold
        employment_income: 3_000
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    # 19-year-old non-student fails qualifying child test but is a qualifying
    # relative with income below $5,050 threshold
    head_of_household_eligible: true

- name: Adult child with income over threshold does not qualify parent for HOH.
  period: 2024
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      adult_child:
        age: 19
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        # Income over $5,050 threshold
        employment_income: 10_000
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    # 19-year-old with income over threshold fails qualifying relative test
    head_of_household_eligible: false

- name: Married person does not qualify for head of household.
  period: 2024
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
      person2:
        age: 38
        is_tax_unit_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, child]
    households:
      household:
        members: [person1, person2, child]
  output:
    head_of_household_eligible: false

- name: Person with no dependents does not qualify for head of household.
  period: 2024
  input:
    people:
      single_person:
        age: 35
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [single_person]
    households:
      household:
        members: [single_person]
  output:
    head_of_household_eligible: false

- name: Unrelated qualifying relative does not qualify for HOH per IRC 2(b)(3).
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      unrelated_person:
        age: 25
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_related_to_head_or_spouse: false
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [head, unrelated_person]
    households:
      household:
        members: [head, unrelated_person]
  output:
    # Unrelated household members are qualifying relatives under IRC 152(d)
    # but do not count for HOH purposes per IRC 2(b)(3)
    head_of_household_eligible: false

- name: Separated married filer with a qualifying child is treated as unmarried per IRC 7703(b).
  period: 2024
  input:
    people:
      parent:
        age: 38
        is_tax_unit_head: true
        is_separated: true
      child:
        age: 6
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        # Filing as married filing separately while living apart from spouse.
    households:
      household:
        members: [parent, child]
  output:
    # IRC 7703(b)(1) "considered unmarried" path: separated filer with a child
    # qualifying-person abode qualifies for HOH.
    head_of_household_eligible: true

- name: Separated married filer with only a qualifying relative does not qualify per IRC 7703(b)(1).
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        is_separated: true
      grandparent:
        age: 78
        is_tax_unit_dependent: true
        is_related_to_head_or_spouse: true
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [head, grandparent]
    households:
      household:
        members: [head, grandparent]
  output:
    # IRC 7703(b)(1) refers to "a child (within the meaning of section 152(f)(1))".
    # A qualifying relative alone is not sufficient for the treated-unmarried path,
    # so the separated filer does not qualify for HOH.
    head_of_household_eligible: false

- name: Surviving spouse takes precedence over the separated-with-qualifying-child HoH path
  period: 2024
  input:
    people:
      head:
        age: 38
        is_tax_unit_head: true
        is_separated: true
      child:
        age: 6
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        surviving_spouse_eligible: true
    households:
      household:
        members: [head, child]
  output:
    # head_of_household_eligible returns false when surviving_spouse_eligible
    # is true, even when the separated-with-qualifying-child path would
    # otherwise grant HoH.
    head_of_household_eligible: false

- name: Separated JOINT filer with qualifying child is NOT eligible for HoH
  # IRC 7703(b)(1) "considered unmarried" path requires filing a separate
  # return. A JOINT filer who happens to be separated forfeits the
  # treated-unmarried route by choosing joint filing status.
  period: 2024
  input:
    people:
      parent:
        age: 38
        is_tax_unit_head: true
        is_separated: true
      spouse:
        age: 36
        is_tax_unit_spouse: true
      child:
        age: 6
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, spouse, child]
        filing_status: JOINT
    households:
      household:
        members: [parent, spouse, child]
  output:
    head_of_household_eligible: false

- name: Dependent parent with nontaxable Social Security qualifies the taxpayer for HOH.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 0.5 * 12,000 = 6,000 < 25,000, so the parent's
    # gross income is 0 < 4,400 and the parent is a qualifying relative.
    head_of_household_eligible: true

- name: Dependent parent with taxable Social Security above the limit does not qualify the taxpayer for HOH.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 44_000
        taxable_interest_income: 4_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 4,000 + 0.5 * 44,000 = 26,000.
    # Taxable benefits = min(22,000, 0.5 * (26,000 - 25,000)) = 500.
    # Gross income = 4,000 + 500 = 4,500, not below 4,400.
    head_of_household_eligible: false

- name: Dependent parent whose capital losses keep benefits nontaxable qualifies the taxpayer for HOH.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 44_000
        long_term_capital_gains: 4_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = (4,000 - 2,000) + 0.5 * 44,000 = 24,000 < 25,000,
    # so the parent's gross income is 4,000 gross gains < 4,400.
    head_of_household_eligible: true

- name: Married dependent parents who live together do not qualify the taxpayer for HOH.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      mother:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
      father:
        age: 72
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    marital_units:
      head_marital_unit:
        members: [head]
      parents_marital_unit:
        members: [mother, father]
    tax_units:
      tax_unit:
        members: [head, mother, father]
    households:
      household:
        members: [head, mother, father]
  output:
    # Zero base amounts give each parent 5,100 of taxable benefits, not
    # below 4,400, so neither is a qualifying relative.
    head_of_household_eligible: false

# A filer who can be claimed as a dependent on another return
# (claimed_as_dependent_on_another_return) is treated as having no
# dependents (IRC 152(b)(1)). IRC 2(b)(1)(A)(i) still counts a qualifying
# child; IRC 2(b)(1)(A)(ii) and (B) and IRC 7703(b)(1) require a section 151
# deduction the filer is not entitled to. Publication 501 (2025) Table 4,
# p.10; considered unmarried test 5, p.8.

- name: 2025 unmarried filer who can be claimed as a dependent still qualifies for HOH through a qualifying child
  period: 2025
  input:
    people:
      parent:
        age: 20
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    head_of_household_eligible: true
    filing_status: HEAD_OF_HOUSEHOLD

- name: 2025 unmarried filer who can be claimed as a dependent does not qualify for HOH through a qualifying relative
  period: 2025
  input:
    people:
      head:
        age: 22
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      sibling:
        age: 25
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_related_to_head_or_spouse: true
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [head, sibling]
    households:
      household:
        members: [head, sibling]
  output:
    # The sibling is a qualifying relative ($1,000 < $5,200), which counts
    # only if the filer is entitled to a section 151 deduction for them.
    head_of_household_eligible: false
    filing_status: SINGLE

- name: 2025 unmarried filer who cannot be claimed qualifies for HOH through the same qualifying relative
  period: 2025
  input:
    people:
      head:
        age: 22
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: false
      sibling:
        age: 25
        is_full_time_student: false
        is_tax_unit_dependent: true
        is_related_to_head_or_spouse: true
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [head, sibling]
    households:
      household:
        members: [head, sibling]
  output:
    head_of_household_eligible: true
    filing_status: HEAD_OF_HOUSEHOLD

- name: 2025 unmarried filer who can be claimed as a dependent does not qualify for HOH through a dependent parent
  period: 2025
  input:
    people:
      head:
        age: 23
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      parent:
        age: 70
        is_tax_unit_dependent: true
        social_security_retirement: 12_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # IRC 2(b)(1)(B): "if the taxpayer is entitled to a deduction for the
    # taxable year for such father or mother under section 151".
    head_of_household_eligible: false
    filing_status: SINGLE

- name: 2025 unmarried filer who can be claimed as a dependent qualifies for HOH through a permanently disabled dependent
  period: 2025
  input:
    people:
      head:
        age: 23
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      sibling:
        age: 30
        is_permanently_and_totally_disabled: true
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, sibling]
    households:
      household:
        members: [head, sibling]
  output:
    # A permanently and totally disabled sibling meets the qualifying child
    # age test at any age (IRC 152(c)(3)(B)).
    head_of_household_eligible: true

- name: 2025 separated filer who can be claimed as a dependent is not considered unmarried and files separately
  period: 2025
  input:
    people:
      parent:
        age: 21
        is_tax_unit_head: true
        is_separated: true
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # IRC 7703(b)(1) requires a child "with respect to whom such individual
    # is entitled to a deduction for the taxable year under section 151".
    head_of_household_eligible: false
    filing_status: SEPARATE

- name: 2025 separated filer who cannot be claimed is considered unmarried and qualifies for HOH
  period: 2025
  input:
    people:
      parent:
        age: 21
        is_tax_unit_head: true
        is_separated: true
        claimed_as_dependent_on_another_return: false
      child:
        age: 3
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    head_of_household_eligible: true
    filing_status: HEAD_OF_HOUSEHOLD

- name: 2025 married couple with one claimable spouse and a child files jointly, not as HOH (claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 1
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
    households:
      household:
        members: [person_a, person_b, child]
  output:
    head_of_household_eligible: false
    filing_status: JOINT

- name: 2025 married couple with one claimable spouse and a child files jointly, not as HOH (claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
      child:
        age: 1
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
    households:
      household:
        members: [person_b, person_a, child]
  output:
    head_of_household_eligible: false
    filing_status: JOINT

- name: 2025 married couple with both spouses claimable and a child files jointly, not as HOH
  period: 2025
  input:
    people:
      person_a:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
      child:
        age: 1
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
    households:
      household:
        members: [person_a, person_b, child]
  output:
    head_of_household_eligible: false
    filing_status: JOINT
