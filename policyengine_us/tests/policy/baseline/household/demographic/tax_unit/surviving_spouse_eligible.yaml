# IRC 2(a)(1)(B)(i) requires a son, stepson, daughter or stepdaughter. A
# dependent parent is a qualifying relative under IRC 152(d)(2)(C), but not a
# child, so the filer does not qualify.
- name: Dependent parent of the filer with income below the exemption amount does not qualify.
  period: 2025
  input:
    people:
      head:
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      parent:
        age: 88
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_parent_of_filer_or_spouse: true
    tax_units:
      tax_unit:
        members: [head, parent]
  output:
    is_qualifying_relative_dependent: [false, true]
    surviving_spouse_eligible: false

- name: Dependent grandparent of the filer does not qualify.
