# Parent ids (natural, adoptive or step) identify the filer's own children.
- name: Adult dependent whose parent id names the widowed head qualifies regardless of income.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      adult_child:
        person_id: 2
        parent_1_id: 1
        age: 29
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        employment_income: 30_000
    tax_units:
      tax_unit:
        members: [head, adult_child]
    households:
      household:
        members: [head, adult_child]
  output:
    surviving_spouse_eligible: true

- name: Dependent grandchild whose parent id names another household member does not qualify.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        age: 60
        is_tax_unit_head: true
        is_surviving_spouse: true
      mother:
        person_id: 2
        parent_1_id: 1
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      grandchild:
        person_id: 3
        parent_1_id: 2
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      head_unit:
        members: [head, grandchild]
      mother_unit:
        members: [mother]
    households:
      household:
        members: [head, mother, grandchild]
  output:
    surviving_spouse_eligible: [false, false]

- name: Dependent parent without parent ids in a household with ids does not qualify.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        # The head's own parent id names the dependent mother.
        parent_1_id: 2
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      mother:
        person_id: 2
        age: 90
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [head, mother]
    households:
      household:
        members: [head, mother]
  output:
    surviving_spouse_eligible: false
