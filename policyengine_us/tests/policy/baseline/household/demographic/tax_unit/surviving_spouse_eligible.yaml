- name: Surviving spouse head without dependents is not eligible to file as surviving spouse.
  period: 2022
  input:
    people:
      head:
        is_surviving_spouse: true
    tax_units:
      tax_unit:
        members: [head]
  output:
    surviving_spouse_eligible: false

- name: surviving spouse head with one dependent is eligible.
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        is_surviving_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [head, child]
        tax_unit_married: false
  output:
    surviving_spouse_eligible: true

# IRC 2(a)(1)(B) determines the son or daughter's dependency "without regard
# to subsections (b)(1), (b)(2), and (d)(1)(B)" of section 152. The 2025 Form
# 1040 instructions (page 15) apply this as a child the filer "could claim as a
# dependent except that ... the child had gross income of $5,200 or more".
- name: Adult dependent child with gross income above the exemption amount still qualifies.
  period: 2025
  input:
    people:
      head:
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      adult_child:
        age: 29
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        # Above the $5,200 2025 qualifying relative gross income limit.
        employment_income: 6_238
    tax_units:
      tax_unit:
        members: [head, adult_child]
  output:
    dependent_gross_income: [0, 6_238]
    is_qualifying_relative_dependent: [false, false]
    surviving_spouse_eligible: true

