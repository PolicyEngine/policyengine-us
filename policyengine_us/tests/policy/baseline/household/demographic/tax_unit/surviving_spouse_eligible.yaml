# Parent ids (natural, adoptive or step) identify the filer's own children.
- name: Adult dependent whose parent id names the widowed head qualifies regardless of income.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      adult_child:
        person_id: 2
        parent_1_id: 1
        age: 29
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        employment_income: 30_000
    tax_units:
      tax_unit:
        members: [head, adult_child]
    households:
      household:
        members: [head, adult_child]
  output:
    surviving_spouse_eligible: true

