# Two parent ids can name both biological parents and leave out a step
# parent, so naming two other parents does not rule a dependent out.
- name: Stepchild whose two parent ids name absent biological parents qualifies.
  period: 2025
  input:
    people:
      head:
        person_id: 1
        age: 67
        is_tax_unit_head: true
        is_surviving_spouse: true
      stepchild:
        person_id: 2
        # The deceased spouse and the child's other biological parent.
        parent_1_id: 91
        parent_2_id: 92
        age: 15
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, stepchild]
    households:
      household:
        members: [head, stepchild]
  output:
    surviving_spouse_eligible: true

