- name: Default should be the tax unit head, and therefore not spouse.
  period: 2022
  output:
    is_tax_unit_spouse: false

- name: Couple should have one head and one spouse.
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse: {}
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    is_tax_unit_spouse: [false, true]

- name: Children and other deps don't count.
  period: 2022
  input:
    people:
      child:
        is_child: true
      head:
        is_tax_unit_head: true
      spouse: {}
      # Based on sequence of members.
      other_dep: {}
    tax_units:
      tax_unit:
        members: [child, head, spouse, other_dep]
  output:
    is_tax_unit_spouse: [false, false, true, false]

- name: An adult child input as a dependent is not the spouse of a single parent.
  period: 2024
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
      adult_child:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    marital_units:
      parent_marital_unit:
        members: [parent]
      child_marital_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    is_tax_unit_head: [true, false]
    is_tax_unit_spouse: [false, false]
    is_tax_unit_dependent: [false, true]
    tax_unit_married: false
    age_spouse: 0
    filing_status: HEAD_OF_HOUSEHOLD

- name: An elderly dependent is not the spouse when only the head is input.
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      spouse:
        age: 38
      parent:
        age: 70
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, parent]
  output:
    is_tax_unit_spouse: [false, true, false]
    age_spouse: 38

- name: Dependents of several ages leave the couple as head and spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
      spouse:
        age: 38
      child:
        age: 10
        is_tax_unit_dependent: true
      grandparent:
        age: 75
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child, grandparent]
  output:
    is_tax_unit_head: [true, false, false, false]
    is_tax_unit_spouse: [false, true, false, false]
    tax_unit_dependents: 2

- name: A separated adult dependent does not remove the filer's spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_dependent: false
      spouse:
        age: 38
        is_tax_unit_dependent: false
      dependent:
        age: 18
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
  output:
    is_tax_unit_head: [true, false, false]
    is_tax_unit_spouse: [false, true, false]
    tax_unit_married: true

- name: A separated elderly dependent older than the couple does not remove the spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
      spouse:
        age: 38
      parent:
        age: 75
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [head, spouse, parent]
  output:
    is_tax_unit_spouse: [false, true, false]

- name: A separated younger adult who is neither head nor spouse does not remove the spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
      spouse:
        age: 38
      other_adult:
        age: 30
        is_separated: true
    tax_units:
      tax_unit:
        members: [head, spouse, other_adult]
  output:
    is_tax_unit_spouse: [false, true, false]

- name: A separated head has no spouse in the tax unit.
  period: 2024
  input:
    people:
      head:
        age: 40
        is_separated: true
      other_adult:
        age: 38
    tax_units:
      tax_unit:
        members: [head, other_adult]
  output:
    is_tax_unit_head: [true, false]
    is_tax_unit_spouse: [false, false]
    tax_unit_married: false

# Which co-resident adult is the filer's spouse is an age-order inference, not a
# rule of law. When the would-be spouse is separated, no younger adult is
# promoted into the role, as before separation was limited to head and spouse.
- name: A separated second-oldest adult is not the spouse, and no younger adult takes the role.
  period: 2024
  input:
    people:
      head:
        age: 40
      separated_adult:
        age: 38
        is_separated: true
      younger_adult:
        age: 30
    tax_units:
      tax_unit:
        members: [head, separated_adult, younger_adult]
  output:
    is_tax_unit_spouse: [false, false, false]
    tax_unit_married: false

- name: Separation only affects the spouse in its own tax unit.
  period: 2024
  input:
    people:
      head_a:
        age: 40
      spouse_a:
        age: 38
      dependent_a:
        age: 20
        is_tax_unit_dependent: true
        is_separated: true
      head_b:
        age: 50
        is_separated: true
      adult_b:
        age: 45
    tax_units:
      tax_unit_a:
        members: [head_a, spouse_a, dependent_a]
      tax_unit_b:
        members: [head_b, adult_b]
    households:
      household:
        members: [head_a, spouse_a, dependent_a, head_b, adult_b]
  output:
    is_tax_unit_head: [true, false, false, true, false]
    is_tax_unit_spouse: [false, true, false, false, false]
    tax_unit_married: [true, false]

- name: A younger separated adult does not stop the next-oldest adult being the spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
      separated_adult:
        age: 25
        is_separated: true
      other_adult:
        age: 30
    tax_units:
      tax_unit:
        members: [head, separated_adult, other_adult]
  output:
    is_tax_unit_spouse: [false, false, true]

- name: A separated dependent does not remove the spouse when the head is an input.
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      spouse:
        age: 38
      dependent:
        age: 19
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
  output:
    is_tax_unit_spouse: [false, true, false]

- name: With every adult input as a dependent, a third adult's separation leaves the spouse.
  period: 2024
  input:
    people:
      oldest:
        age: 40
        is_tax_unit_dependent: true
      second:
        age: 38
        is_tax_unit_dependent: true
      third:
        age: 20
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [oldest, second, third]
  output:
    is_tax_unit_head: [true, false, false]
    is_tax_unit_spouse: [false, true, false]
