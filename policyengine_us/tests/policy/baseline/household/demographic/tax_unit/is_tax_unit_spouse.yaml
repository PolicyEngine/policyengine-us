- name: Default should be the tax unit head, and therefore not spouse.
  period: 2022
  output:
    is_tax_unit_spouse: false

- name: Couple should have one head and one spouse.
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse: {}
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    is_tax_unit_spouse: [false, true]

- name: Children and other deps don't count.
  period: 2022
  input:
    people:
      child:
        is_child: true
      head:
        is_tax_unit_head: true
      spouse: {}
      # Based on sequence of members.
      other_dep: {}
    tax_units:
      tax_unit:
        members: [child, head, spouse, other_dep]
  output:
    is_tax_unit_spouse: [false, false, true, false]

- name: An adult child input as a dependent is not the spouse of a single parent.
  period: 2024
  input:
    people:
      parent:
        age: 45
        employment_income: 50_000
      adult_child:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, adult_child]
    marital_units:
      parent_marital_unit:
        members: [parent]
      child_marital_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
  output:
    is_tax_unit_head: [true, false]
    is_tax_unit_spouse: [false, false]
    is_tax_unit_dependent: [false, true]
    tax_unit_married: false
    age_spouse: 0
    filing_status: HEAD_OF_HOUSEHOLD

- name: An elderly dependent is not the spouse when only the head is input.
  period: 2024
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      spouse:
        age: 38
      parent:
        age: 70
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, parent]
  output:
    is_tax_unit_spouse: [false, true, false]
    age_spouse: 38

- name: Dependents of several ages leave the couple as head and spouse.
  period: 2024
  input:
    people:
      head:
        age: 40
      spouse:
        age: 38
      child:
        age: 10
        is_tax_unit_dependent: true
      grandparent:
        age: 75
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child, grandparent]
  output:
    is_tax_unit_head: [true, false, false, false]
    is_tax_unit_spouse: [false, true, false, false]
    tax_unit_dependents: 2

- name: With marital units omitted, a parent's 18-year-old is a dependent rather than the spouse.
  period: 2025
  input:
    people:
      mother:
        age: 45
        employment_income_before_lsr: 20_000
      son:
        age: 18
    tax_units:
      tax_unit:
        members: [mother, son]
    households:
      household:
        members: [mother, son]
        state_code: TX
  output:
    # The model gives each of them their own marital unit, since the son
    # meets the qualifying child age test (26 USC 152(c)(3)(A)), so the
    # mother files as head of household with her son as a dependent.
    is_tax_unit_spouse: [false, false]
    filing_status: HEAD_OF_HOUSEHOLD
