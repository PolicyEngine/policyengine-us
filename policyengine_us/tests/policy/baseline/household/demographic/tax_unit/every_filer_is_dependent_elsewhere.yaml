- name: Only the head is claimed elsewhere
  period: 2025
  input:
    people:
      head:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      spouse:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    every_filer_is_dependent_elsewhere: false

- name: Only the spouse is claimed elsewhere
  period: 2025
  input:
    people:
      head:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: false
      spouse:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    every_filer_is_dependent_elsewhere: false

- name: Both spouses are claimed elsewhere
  period: 2025
  input:
    people:
      head:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      spouse:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    every_filer_is_dependent_elsewhere: true

- name: Single filer claimed elsewhere
  period: 2025
  input:
    people:
      head:
        age: 19
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
  output:
    every_filer_is_dependent_elsewhere: true

- name: A tax unit with neither a head nor a spouse has no filer claimed elsewhere
  period: 2025
  input:
    people:
      child:
        age: 10
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [child]
  output:
    every_filer_is_dependent_elsewhere: false
