# These component cases stipulate a student who meets all other Pell requirements,
# attends full time for a full academic year, and follows the regular award schedule
# rather than the separate 2015-2016 eligible-career-pathway schedule.
# Each annual model label Y represents award year Y-Y+1, beginning July 1 of Y.
# These tests cover the maximum Scheduled Award, without additional year-round Pell.
# The inputs supply a full nine-month EFC and full-time, full-year COA above the cap.

# Source: GEN-15-02, regular 2015-2016 maximum Scheduled Award.
- name: Case 1, a regular full-time student reaches the AY 2015-2016 cap under model label 2015.
  period: 2015
  absolute_error_margin: 0.01
  input:
    pell_grant_efc: 0
    cost_of_attending_college: 10_000
    pell_grant_months_in_school: 9
  output:
    pell_grant: 5_775

