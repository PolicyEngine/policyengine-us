- name: Case 1, AGI above 150 percent of the guideline, per month.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 40,000 - 1.5 x 15,960 = 16,060 per year; 16,060 / 12 = 1,338.33.
    income_based_repayment_discretionary_income: 1_338.33

- name: Case 2, the annual amount sums twelve months.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    income_based_repayment_discretionary_income: 16_060

- name: Case 3, AGI below 150 percent of the guideline gives zero.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 20_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 1.5 x 15,960 = 23,940 > 20,000.
    income_based_repayment_discretionary_income: 0
