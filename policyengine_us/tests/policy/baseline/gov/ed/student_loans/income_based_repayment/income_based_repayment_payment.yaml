        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Standard payment min(max(0.09, 50), 8) = 8. Income-Based Repayment
    # min(950.75, 8) and Pay As You Earn min(633.83, 8) give 8, which
    # 685.209(g)(1)(iii)(B) raises to 10; the 8 dollar Direct Loan balance
    # caps both at 8.
    income_based_repayment_payment: 8
    pay_as_you_earn_payment: 8

- name: Case 24, a spouse barred by a loan made on or after July 1, 2026 still counts in the proration.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 60_000
        # Set so the case does not depend on the projected 2027 guideline.
        income_driven_repayment_poverty_guideline: 20_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The spouse's Direct Loans stay eligible loans (685.209(b)(5)); (d)(5)
    # only stops the plan from repaying them. (60,000 - 1.5 x 20,000) / 12 =
    # 2,500. Income-Based Repayment: min(15% x 2,500 = 375, 333.0615) x
    # 30,000 / 60,000 = 166.53. Pay As You Earn: min(10% x 2,500 = 250,
    # 333.0615) x 50% = 125. The spouse owes 0. Capping after proration
    # would give IBR min(187.50, 333.06) = 187.50.
    income_based_repayment_payment: [166.53, 0]
    pay_as_you_earn_payment: [125, 0]

