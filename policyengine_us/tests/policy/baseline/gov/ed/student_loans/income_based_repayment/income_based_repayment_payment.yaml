# Monthly payment under 20 U.S.C. 1098e and 34 CFR 685.209(f)(2)-(3), (g)(1):
#   discretionary income = max(AGI - 1.5 x poverty guideline, 0)
#   payment = lesser of
#       15% (new borrowers 10%) x discretionary income / 12
#       and the borrower's own 10-year standard payment on their Direct and
#       FFEL loans ((f)(2)(ii), (f)(3)(ii); 1098e(b)(6)(A))
#     x own Direct balance / couple's Direct and FFEL balance ((g)(1)(i)-(ii)),
#   rounded to the cent; under 5 -> 0; 5 to under 10 -> 10; at most the
#   borrower's Direct balance.
# The cap applies before the proration (#10411, ruled 2026-10-31). For a single
# filer, or a joint filer whose spouse has no eligible loans, the order makes
# no difference.
# 2026 guideline in the 48 states: 15,960 + 5,680 per additional person.
# Standard payment at 6 percent: 30,000 -> 333.06; 20,000 -> 222.04;
# 10,000 -> 111.02. At 0 percent, 30,000 / 120 = 250; at 12 percent,
# 30,000 x 0.01 / (1 - 1.01 ^ -120) = 430.41.

- name: Case 1, single filer who is not a new borrower pays 15 percent.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 15% x (40,000 - 23,940) = 2,409 / 12 = 200.75; below the 333.06 cap.
    income_based_repayment_payment: 200.75

- name: Case 2, a new borrower pays 10 percent.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        is_income_based_repayment_new_borrower: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 10% x 16,060 = 1,606 / 12 = 133.83.
    income_based_repayment_payment: 133.83

- name: Case 3, the standard payment caps a high earner with a small balance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 15% x 76,060 / 12 = 950.75 > 10,000 x 0.005 / (1 - 1.005 ^ -120) = 111.02.
    income_based_repayment_payment: 111.02

- name: Case 4, income below 150 percent of the guideline pays nothing.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
