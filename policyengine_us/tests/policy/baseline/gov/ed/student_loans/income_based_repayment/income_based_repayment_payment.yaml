        age: 38
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # IBR analogue of rulespec-us#1455 C16. 15% x (60,000 - 32,460) / 12 =
    # 344.25, above the borrower's own standard payment of 111.0205. The
    # borrower pays min(344.25, 111.0205) x 10,000 / 40,000 = 27.7551 ->
    # 27.76 (685.209(f)(2)-(3), then (g)(1)(i)-(ii)); the spouse has no Direct
    # Loans and owes nothing under the plan. Capping after proration would
    # give min(86.06, 111.02) = 86.06.
    income_based_repayment_payment: [27.76, 0]

