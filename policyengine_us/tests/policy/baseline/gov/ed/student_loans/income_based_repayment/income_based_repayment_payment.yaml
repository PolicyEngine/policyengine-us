- name: Case 18, spouses with different interest rates are each capped at their own standard payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 80_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Issue #10411 example. 1.5 x 21,640 = 32,460; 15% x 48,000 / 12 = 600,
    # with balance shares of 50% each. Standard payments: 30,000 / 120 = 250
    # and 30,000 x 0.01 / (1 - 1.01 ^ -120) = 430.4128. min(600, 250) x 50% =
    # 125 and min(600, 430.4128) x 50% = 215.2064 -> 215.21 (20 U.S.C.
    # 1098e(b)(6)(A); 685.209(f)(2)-(3), then (g)(1)). Capping after
    # proration would give min(300, 250) = 250 and min(300, 430.41) = 300.
    income_based_repayment_payment: [125, 215.21]

