        state_code: TX
  output:
    # 15% x (96,460 - 32,460) / 12 = 800, above both standard payments.
    # min(800, 250) x 50% = 125 and min(800, 430.4128) x 50% = 215.21.
    # Capping after proration would give 250 and 400.
    income_based_repayment_payment: [125, 215.21]

- name: Case 20, spouses keep their own new-borrower and other-borrower rates.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
