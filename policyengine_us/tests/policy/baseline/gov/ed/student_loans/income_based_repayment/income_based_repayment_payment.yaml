        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        state_code: TX
      household2:
        members: [person2]
        state_code: TX
  output:
    # 685.209(g)(1)(ii): x 10,000 / 40,000 = 25%. Standard payment on all
    # 40,000 of eligible loans: 444.08. No spouse debt, so the order of cap
    # and proration does not matter.
    # person1: min(200.75, 444.08) x 25% = 50.19.
    # person2: min(950.75, 444.08) x 25% = 111.02.
    income_based_repayment_payment: [50.19, 111.02]

- name: Case 23, a Direct Loan balance under 10 dollars caps the 10 dollar minimum payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
