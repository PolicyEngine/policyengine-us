        filing_status: SINGLE
        adjusted_gross_income: 24_339
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 15% x 399 / 12 = 4.9875, which rounds to 4.99 < 5 -> 0
    # (685.209(g)(1)(iii)(A)).
    income_based_repayment_payment: 0

- name: Case 18, spouses with different interest rates are each capped at their own standard payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 80_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Issue #10411 example (ruling table, row 1). 1.5 x 21,640 = 32,460;
    # 15% x 48,000 / 12 = 600. Standard payments 250 and 430.41; shares 50%.
    # min(600, 250) x 50% = 125.
    # min(600, 430.41) x 50% = 215.21.
    # Together 340.21.
    income_based_repayment_payment: [125, 215.21]

- name: Case 19, each spouse's own standard payment caps a high income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 96_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Ruling table, row 2. 15% x (96,460 - 32,460) / 12 = 800.
    # min(800, 250) x 50% = 125.
    # min(800, 430.41) x 50% = 215.21.
    # Together 340.21, as at an income-based amount of 600.
    income_based_repayment_payment: [125, 215.21]

- name: Case 20, spouses keep their own new-borrower and other-borrower rates.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        is_income_based_repayment_new_borrower: true
      person2:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 66_060
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Discretionary income (66,060 - 32,460) / 12 = 2,800. Each spouse's own
    # standard payment is 333.06. The rates differ, and only the 15 percent
    # amount reaches the cap.
    # New borrower: min(10% x 2,800, 333.06) x 50% = min(280, 333.06) x 50%
    # = 140.
    # Other borrower: min(15% x 2,800, 333.06) x 50% = min(420, 333.06) x 50%
    # = 166.53.
    income_based_repayment_payment: [140, 166.53]

- name: Case 21, a spouse's FFEL debt counts in the joint proration.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
      person2:
        # The spouse has only FFEL loans, which this plan does not repay.
        age: 38
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # IBR analogue of rulespec-us#1455 C16. 15% x (60,000 - 32,460) / 12 =
    # 344.25, above the borrower's own standard payment of 111.02 on their
    # 10,000. The borrower pays min(344.25, 111.02) x 10,000 / 40,000 = 27.76
    # (685.209(g)(1)(i)-(ii)); the spouse has no Direct Loans and owes nothing
    # under the plan.
    income_based_repayment_payment: [27.76, 0]

- name: Case 22, a borrower's own FFEL loans reduce the Direct Loan payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 10_000
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 35
        federal_student_loan_balance: 10_000
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
      tax_unit2:
        members: [person2]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        state_code: TX
      household2:
        members: [person2]
        state_code: TX
  output:
    # Standard payment on all 40,000 of eligible loans: 444.08.
    # 685.209(g)(1)(ii): x 10,000 / 40,000 = 25%.
    # person1: min(200.75, 444.08) x 25% = 50.19.
    # person2: min(950.75, 444.08) x 25% = 111.02.
    income_based_repayment_payment: [50.19, 111.02]

- name: Case 23, a Direct Loan balance under 10 dollars caps the 10 dollar minimum payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 8
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Standard payment min(max(0.09, 50), 8) = 8. Income-Based Repayment
    # min(950.75, 8) and Pay As You Earn min(633.83, 8) give 8, which
    # 685.209(g)(1)(iii)(B) raises to 10; the 8 dollar Direct Loan balance
    # caps both at 8.
    income_based_repayment_payment: 8
    pay_as_you_earn_payment: 8

- name: Case 24, a spouse barred by a loan made on or after July 1, 2026 still counts in the proration.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 60_000
        # Set so the case does not depend on the projected 2027 guideline.
        income_driven_repayment_poverty_guideline: 20_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The spouse's Direct Loans stay eligible loans (685.209(b)(5)); (d)(5)
    # only stops the plan from repaying them. (60,000 - 1.5 x 20,000) / 12 =
    # 2,500. Income-Based Repayment 15% = 375 and Pay As You Earn 10% = 250.
    # IBR: min(375, 333.06) x 30,000 / 60,000 = 166.53.
    # PAYE: min(250, 333.06) x 30,000 / 60,000 = 125.
    # The spouse owes 0.
    income_based_repayment_payment: [166.53, 0]
    pay_as_you_earn_payment: [125, 0]

- name: Case 25, joint filers with equal balances and rates under both standard payments.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 80_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Ruling table, row 3. 15% x (80,460 - 32,460) / 12 = 600, above each
    # spouse's own standard payment of 333.06.
    # min(600, 333.06) x 50% = 166.53 each, together 333.06. Prorating first
    # would give min(300, 333.06) = 300 each.
    income_based_repayment_payment: [166.53, 166.53]

- name: Case 26, a higher income does not raise the payment of joint filers capped by both standard payments.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 96_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Ruling table, row 4. 15% x (96,460 - 32,460) / 12 = 800.
    # min(800, 333.06) x 50% = 166.53 each, together 333.06, half the
    # couple's combined standard payment of 666.12. Prorating first would give
    # min(400, 333.06) = 333.06 each.
    income_based_repayment_payment: [166.53, 166.53]
