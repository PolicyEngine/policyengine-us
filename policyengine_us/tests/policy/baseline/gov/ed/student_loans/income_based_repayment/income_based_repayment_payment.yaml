  output:
    # Discretionary income (68,460 - 32,460) / 12 = 3,000. New borrower:
    # min(10% x 3,000 = 300, 333.0615) x 50% = 150, under the cap. Other
    # borrower: min(15% x 3,000 = 450, 333.0615) x 50% = 166.53, at the cap.
    # Capping after proration would give 150 and min(225, 333.06) = 225.
    income_based_repayment_payment: [150, 166.53]

