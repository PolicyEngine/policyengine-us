      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Discretionary income (92,460 - 32,460) / 12 = 5,000. Each spouse's own
    # standard payment is 333.0615. New borrower: min(10% x 5,000 = 500,
    # 333.0615) x 50% = 166.53. Other borrower: min(15% x 5,000 = 750,
    # 333.0615) x 50% = 166.53. Capping after proration would give 250 and
    # 333.06.
    income_based_repayment_payment: [166.53, 166.53]

