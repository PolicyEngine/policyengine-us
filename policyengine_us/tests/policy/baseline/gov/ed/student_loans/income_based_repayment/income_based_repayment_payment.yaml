- name: Case 15, a payment of exactly 5 dollars rises to 10 dollars.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
      person3:
        age: 10
      person4:
        age: 7
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
        filing_status: JOINT
        adjusted_gross_income: 49_900
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    # 1.5 x (15,960 + 3 x 5,680) = 1.5 x 33,000 = 49,500; 15% x 400 / 12 = 5.00
    # exactly, which is not less than 5, so it rises to 10
    # (685.209(g)(1)(iii)(B)). Rounding to the cent before the test keeps
    # float error from reading it as 4.99999.
    income_based_repayment_payment: [10, 0, 0, 0]

- name: Case 16, a new borrower's payment of exactly 5 dollars rises to 10 dollars.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        is_income_based_repayment_new_borrower: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_540
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 1.5 x 15,960 = 23,940; 10% x 600 / 12 = 5.00 exactly -> 10.
    income_based_repayment_payment: 10

- name: Case 17, a payment one dollar of income below 5 dollars is zero.
  period: 2026-01
