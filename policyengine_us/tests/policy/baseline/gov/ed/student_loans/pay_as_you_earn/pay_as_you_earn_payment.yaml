# Monthly payment under 34 CFR 685.209(b)(4)(ii), (f)(2), (g)(1):
#   discretionary income = max(AGI - 1.5 x poverty guideline, 0)
#   payment = lesser of
#     10% x discretionary income / 12
#     and the borrower's own 10-year standard payment on their Direct and FFEL
#       loans ((f)(2)(ii)),
#   times own Direct balance / couple's Direct and FFEL balance
#     ((g)(1)(i)-(ii), applied to the lesser-of amount),
#   rounded to the cent; under 5 -> 0; 5 to under 10 -> 10; at most the
#   borrower's Direct balance.
# 2026 guideline in the 48 states: 15,960 + 5,680 per additional person.
# Standard payment at 6 percent: 30,000 -> 333.06; 40,000 -> 444.08;
# 20,000 -> 222.04; 10,000 -> 111.02.

- name: Case 1, single filer pays 10 percent of discretionary income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 40,000 - 1.5 x 15,960 = 16,060; 10% x 16,060 / 12 = 133.83 < 333.06.
    pay_as_you_earn_payment: 133.83

- name: Case 2, the standard payment caps a high earner with a small balance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 10% x 76,060 / 12 = 633.83 > 10,000 x 0.005 / (1 - 1.005 ^ -120) = 111.02.
    pay_as_you_earn_payment: 111.02

- name: Case 3, joint filers who both borrowed split the payment by balance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 40_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 20_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 80_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 1.5 x 21,640 = 32,460; 10% x 47,540 / 12 = 396.17. Own standard
    # payments 444.0820 and 222.0410. min(396.17, 444.08) x 2/3 = 264.11 and
    # min(396.17, 222.0410) x 1/3 = 74.0137 -> 74.01. Capping after
    # proration would give min(132.06, 222.04) = 132.06 for the spouse.
    pay_as_you_earn_payment: [264.11, 74.01]

- name: Case 4, each spouse's own standard payment caps joint filers who both borrowed.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 40_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 150_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 10% x (150,000 - 32,460) / 12 = 979.50, above each spouse's own
    # standard payment of 444.0820 and 111.0205. Shares 80% and 20%:
    # 444.0820 x 80% = 355.2656 -> 355.27 and 111.0205 x 20% = 22.2041 ->
    # 22.20. Capping after proration would give min(783.60, 444.08) = 444.08
    # and min(195.90, 111.02) = 111.02.
    pay_as_you_earn_payment: [355.27, 22.20]

- name: Case 5, a payment under 5 dollars becomes zero.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_500
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 10% x 560 / 12 = 4.67 < 5 -> 0 (685.209(g)(1)(iii)(A)).
    pay_as_you_earn_payment: 0

- name: Case 6, a payment from 5 to under 10 dollars becomes 10 dollars.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 25_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 10% x 1,060 / 12 = 8.83 -> 10 (685.209(g)(1)(iii)(B)).
    pay_as_you_earn_payment: 10

- name: Case 7, married filing separately excludes the spouse's income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 40
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SEPARATE
        adjusted_gross_income: 40_000
      tax_unit2:
        members: [person2]
        filing_status: SEPARATE
        adjusted_gross_income: 80_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Own AGI and a family of one: 133.83, as in Case 1.
    pay_as_you_earn_payment: [133.83, 0]

- name: Case 8, a borrower with a loan made on or after July 1, 2026 can't use the plan.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 34 CFR 685.209(c)(4)(v), (d)(5); 20 U.S.C. 1087e(d)(6)-(7).
    pay_as_you_earn_payment: 0

- name: Case 9, a payment of exactly 5 dollars rises to 10 dollars.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_540
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 1.5 x 15,960 = 23,940; 10% x 600 / 12 = 5.00 exactly, which is not less
    # than 5, so it rises to 10 (685.209(g)(1)(iii)(B)).
    pay_as_you_earn_payment: 10

- name: Case 10, spouses with different interest rates are each capped at their own standard payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 104_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Issue #10411 example. 1.5 x 21,640 = 32,460; 10% x 72,000 / 12 = 600,
    # with balance shares of 50% each. Standard payments: 30,000 / 120 = 250
    # and 30,000 x 0.01 / (1 - 1.01 ^ -120) = 430.4128. min(600, 250) x 50% =
    # 125 and min(600, 430.4128) x 50% = 215.2064 -> 215.21. Capping after
    # proration would give 250 and 300.
    pay_as_you_earn_payment: [125, 215.21]

- name: Case 11, each spouse's own standard payment caps a high income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 128_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 10% x (128,460 - 32,460) / 12 = 800, above both standard payments.
    # min(800, 250) x 50% = 125 and min(800, 430.4128) x 50% = 215.21.
    # Capping after proration would give 250 and 400.
    pay_as_you_earn_payment: [125, 215.21]

- name: Case 12, a spouse's FFEL debt counts in the joint proration.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
      person2:
        # The spouse has only FFEL loans, which this plan does not repay.
        age: 38
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 61_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 10% x (61,000 - 32,460) / 12 = 237.83, above the borrower's own
    # standard payment of 111.0205. The borrower pays min(237.83, 111.0205) x
    # 10,000 / 40,000 = 27.7551 -> 27.76 (685.209(f)(2), then
    # (g)(1)(i)-(ii)); the spouse owes nothing. Capping after proration would
    # give min(59.46, 111.02) = 59.46.
    pay_as_you_earn_payment: [27.76, 0]

- name: Case 13, a payment within half a cent below 5 dollars rounds to 5 and rises to 10.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 35
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_539.52
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 24,539.52 - 23,940 = 599.52; 10% x 599.52 / 12 = 4.996, which rounds to
    # 5.00 and rises to 10 (the modeling choice in the documentation).
    pay_as_you_earn_payment: 10

- name: Case 14, both spouses' FFEL loans enter the proration of each spouse's capped amount.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 10_000
        federal_ffel_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 20_000
        federal_ffel_loan_balance: 20_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 104_460
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 10% x (104,460 - 32,460) / 12 = 600. Own standard payments 222.0410 and
    # 444.0820; balance shares 1/6 and 1/3 ((g)(1)(i) x (g)(1)(ii)).
    # min(600, 222.0410) / 6 = 37.01 and min(600, 444.0820) / 3 = 148.03.
    pay_as_you_earn_payment: [37.01, 148.03]
