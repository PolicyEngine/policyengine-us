# Monthly discretionary income: max(AGI - 1.5 x poverty guideline, 0) / 12
# (34 CFR 685.209(b)(4)(ii)). 2026 guideline in the 48 states: 15,960 +
# 5,680 per additional person.

- name: Case 1, single filer above 150 percent of the guideline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # (40,000 - 23,940) / 12 = 1,338.33.
    pay_as_you_earn_discretionary_income: 1_338.33

- name: Case 2, income exactly at 150 percent of the guideline is zero.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 23_940
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    pay_as_you_earn_discretionary_income: 0
