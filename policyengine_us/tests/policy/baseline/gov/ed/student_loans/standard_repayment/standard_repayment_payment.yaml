# 10-year level payment: balance x i / (1 - (1 + i) ^ -120), i = rate / 12,
# at least 50 dollars and no more than the balance (34 CFR 685.208(b)(1)).

- name: Case 1, 30,000 dollars at 6 percent.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # 30,000 x 0.005 / (1 - 1.005 ^ -120) = 333.0615.
    standard_repayment_payment: 333.06

- name: Case 2, a zero interest rate spreads the balance evenly.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 12_000
        federal_student_loan_interest_rate: 0
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # 12,000 / 120 = 100.
    standard_repayment_payment: 100

- name: Case 3, a small balance pays the 50 dollar minimum.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 3_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # 3,000 x 0.005 / (1 - 1.005 ^ -120) = 33.31, below the 50 minimum.
    standard_repayment_payment: 50

- name: Case 4, a balance below the minimum is the final payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    standard_repayment_payment: 30

- name: Case 5, no balance means no payment.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    standard_repayment_payment: 0

- name: Case 6, a borrower with a loan made on or after July 1, 2026 uses the tiered plan instead.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # 34 CFR 685.208(b)(1); 20 U.S.C. 1087e(d)(6)-(7). Tiered 15-year
    # payment: 30,000 x 0.005 / (1 - 1.005 ^ -180) = 253.16.
    standard_repayment_payment: 0
    tiered_standard_repayment_payment: 253.16

- name: Case 7, a balance given for 2024 reads unchanged in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        # As in a dataset dated 2024 that a simulation reads in 2026.
        federal_student_loan_balance:
          2024: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # The balance is held at 30,000: no price or income uprating applies
    # (CPI-U would give about 31,626 in 2026). The payment amortizes the
    # unchanged balance: 333.06, as in Case 1.
    federal_student_loan_balance:
      2025: 30_000
      2026: 30_000
    standard_repayment_payment:
      2026-01: 333.06
