# Tiered standard plan (20 U.S.C. 1087e(d)(7)(A)(i); 34 CFR 685.208(b)(8),
# (c)(1)) for a borrower with a Direct Loan made on or after July 1, 2026.
# The balance is federal_student_loan_balance plus
# federal_parent_plus_loan_balance:
#   balance less than 25,000 -> 10 years; 25,000 to less than 50,000 -> 15;
#   50,000 to less than 100,000 -> 20; 100,000 or more -> 25.
#   payment = balance x i / (1 - (1 + i) ^ -n), i = rate / 12, n = 12 x years,
#   at least 50 dollars, or the balance if it is less than 50 dollars.

- name: Case 1, just below 25,000 dollars repays over 10 years.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 24_999
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
  output:
    # 24,999 x 0.005 / (1 - 1.005 ^ -120) = 277.54.
    tiered_standard_repayment_payment: 277.54

- name: Case 2, exactly 25,000 dollars repays over 15 years.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 25_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
  output:
    # 25,000 x 0.005 / (1 - 1.005 ^ -180) = 210.96.
    tiered_standard_repayment_payment: 210.96

