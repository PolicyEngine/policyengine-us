  output:
    # 15-year tier: 30,000 / 180 = 166.67.
    tiered_standard_repayment_payment: 166.67

- name: Case 10, a borrower with no loan made on or after July 1, 2026 uses the 10-year plan instead.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
  output:
    tiered_standard_repayment_payment: 0
    standard_repayment_payment: 333.06

- name: Case 11, several borrowers in different tiers.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 24_999
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
      person2:
        age: 30
        federal_student_loan_balance: 50_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
      person3:
        age: 30
        federal_student_loan_balance: 100_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
      person4:
        age: 30
        federal_student_loan_balance: 100_000
        federal_student_loan_interest_rate: 0.06
  output:
    tiered_standard_repayment_payment: [277.54, 358.22, 644.30, 0]

- name: Case 12, Parent PLUS loans count toward the tier and are repaid under the plan.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        federal_student_loan_balance: 20_000
        federal_parent_plus_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
        has_federal_student_loan_made_on_or_after_2026_07_01: true
  output:
    # 20,000 + 10,000 = 30,000 is in the 15-year tier (20,000 alone would be in
    # the 10-year tier, at 222.04).
    # 30,000 x 0.005 / (1 - 1.005 ^ -180) = 253.16.
    tiered_standard_repayment_payment: 253.16
