- name: Case 1, a tax unit head with eligible loans is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
    tax_units:
      tax_unit:
        members: [person1]
  output:
    income_driven_repayment_eligible: true

- name: Case 2, a borrower with only Parent PLUS loans is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        federal_parent_plus_loan_balance: 20_000
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # Parent PLUS loans are excluded from IBR and SAVE (685.209(d)(1), (d)(2)).
    income_driven_repayment_eligible: false

- name: Case 3, a tax dependent with loans is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person2:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        federal_student_loan_balance: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    income_driven_repayment_eligible: [false, false]
