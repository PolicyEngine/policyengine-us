# Cap on Income-Based Repayment and Pay As You Earn payments (20 U.S.C.
# 1098e(b)(6)(A); 34 CFR 685.209(f)(2)(ii), (f)(3)(ii)): each person's own
# 10-year standard payment on their eligible Direct and FFEL loans ((b)(5)) at
# their own rate, balance x i / (1 - (1 + i) ^ -120) with i = rate / 12, at
# least 50 dollars and no more than the eligible balance (685.208(b)(1)). A
# spouse's loans enter only the (g) proration ((e)(2)(i)), not this amount.

- name: Case 1, a single borrower's cap is their standard payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # 30,000 x 0.005 / (1 - 1.005 ^ -120) = 333.06.
    income_driven_repayment_standard_payment: 333.06

- name: Case 2, each spouse has their own standard payment at their own rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0
      person2:
        age: 38
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.12
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
  output:
    # 30,000 / 120 = 250; 30,000 x 0.01 / (1 - 1.01 ^ -120) = 430.41.
    income_driven_repayment_standard_payment: [250, 430.41]

- name: Case 3, FFEL loans enter the cap at the person's interest rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 10_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_ffel_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
  output:
    # 10,000 x 0.005 / (1 - 1.005 ^ -120) = 111.02 on the borrower's Direct
    # Loans; 333.06 on the spouse's FFEL loans.
    income_driven_repayment_standard_payment: [111.02, 333.06]

- name: Case 4, each person's standard payment is at least the 50 dollar minimum.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
        federal_student_loan_balance: 3_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
  output:
    # 333.06 and max(33.31, 50) = 50.
    income_driven_repayment_standard_payment: [333.06, 50]

- name: Case 5, each person's standard payment covers only their own loans.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        federal_student_loan_balance: 20_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        federal_student_loan_balance: 15_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    # The head's 20,000: 222.04. The dependent's 15,000: 166.53, which does
    # not enter the head's cap; the dependent's own Income-Based Repayment and
    # Pay As You Earn payments are 0 through income_driven_repayment_eligible.
    income_driven_repayment_standard_payment: [222.04, 166.53]

- name: Case 6, an FFEL balance given for 2024 reads unchanged in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_ffel_loan_balance:
          2024: 30_000
        federal_student_loan_interest_rate: 0.06
    tax_units:
      tax_unit:
        members: [person1]
  output:
    # Held at 30,000 with no uprating; the cap amortizes it: 333.06.
    federal_ffel_loan_balance:
      2025: 30_000
      2026: 30_000
    income_driven_repayment_standard_payment:
      2026-01: 333.06

- name: Case 7, joint filers where only one spouse borrowed are capped at that spouse's standard payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        federal_student_loan_balance: 30_000
        federal_student_loan_interest_rate: 0.06
      person2:
        age: 38
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 150_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The spouse has no eligible loans, so their standard payment is
    # min(max(0, 50), 0) = 0, not the 50 dollar minimum. Income-Based
    # Repayment at 15% and Pay As You Earn at 10% of (150,000 - 32,460) / 12
    # are 1,469.25 and 979.50, above 333.06.
    income_driven_repayment_standard_payment: [333.06, 0]
    income_based_repayment_payment: [333.06, 0]
    pay_as_you_earn_payment: [333.06, 0]
