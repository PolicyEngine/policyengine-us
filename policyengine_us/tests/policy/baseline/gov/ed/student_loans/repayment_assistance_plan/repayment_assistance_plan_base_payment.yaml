      tax_unit:
        members: [person1]
        adjusted_gross_income: 20_000
  output:
    # (iv)(II) "not more than $20,000": 1% x 20,000 = 200.
    repayment_assistance_plan_base_payment: 200
    # 200 / 12 = 16 2/3.
    repayment_assistance_plan_applicable_monthly_payment:
      2027-01: 16.67
    repayment_assistance_plan_payment:
      2027-01: 16.67

