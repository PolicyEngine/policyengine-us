# 20 U.S.C. 1087e(q)(4)(B)(iv); 34 CFR 685.209(b)(2). The annual base payment is
# $120 if AGI is not more than $10,000; otherwise the bracket rate times the
# WHOLE AGI, where each bracket runs from "more than" its lower bound to "not
# more than" its upper bound (ED rejected a marginal reading at 91 FR 23838).
#
# Cases labelled rulespec-us#1455 Cn or En are the companion cases for the
# Repayment Assistance Plan payment encoding in TheAxiomFoundation/rulespec-us
# issue 1455. They use an unmarried borrower with a 30,000 dollar balance and no
# dependents, so the applicable monthly payment (A) and the borrower's payment
# (P) both equal B / 12, or the 10 dollar minimum. The E cases test both sides
# of each bracket edge.

- name: Case 1, rulespec-us#1455 C1, AGI exactly 10,000 receives the flat low-income base payment.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
  output:
    # (iv)(I): AGI not more than $10,000 -> $120.
    repayment_assistance_plan_base_payment: 120
    # 120 / 12 = 10.
    repayment_assistance_plan_applicable_monthly_payment:
      2027-01: 10
    repayment_assistance_plan_payment:
      2027-01: 10

- name: Case 2, rulespec-us#1455 C2, AGI one dollar over 10,000 drops below the low-income base payment.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_001
  output:
    # (iv)(II): 1% x 10,001 = 100.01, less than the $120 at AGI 10,000.
    repayment_assistance_plan_base_payment: 100.01
    # max(100.01 / 12, 10) = max(8.334, 10) = 10.
    repayment_assistance_plan_applicable_monthly_payment:
      2027-01: 10
    repayment_assistance_plan_payment:
      2027-01: 10

- name: Case 3, rulespec-us#1455 C3, AGI exactly 20,000 stays in the 1 percent bracket.
  period: 2027
  absolute_error_margin: 0.01
