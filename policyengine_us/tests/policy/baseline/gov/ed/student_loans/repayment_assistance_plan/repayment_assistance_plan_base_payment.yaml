    tax_units:
      tax_unit1:
        members: [person1]
        adjusted_gross_income: 30_000
      tax_unit2:
        members: [person2]
        adjusted_gross_income: 30_001
  output:
    # 2% x 30,000 = 600; 3% x 30,001 = 900.03.
    repayment_assistance_plan_base_payment: [600, 900.03]
    # 600 / 12 = 50; 900.03 / 12 = 75.0025.
    repayment_assistance_plan_applicable_monthly_payment:
      2027-01: [50, 75.0025]
    repayment_assistance_plan_payment:
      2027-01: [50, 75.0025]

