    people:
      person1:
        age: 30
        federal_student_loan_balance: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        # The most recent return shows 20,000; income this year is 60,000.
        income_driven_repayment_adjusted_gross_income: 20_000
        adjusted_gross_income: 60_000
  output:
    # (q)(4)(A) "for the most recent taxable year": 1% x 20,000 = 200, not
    # 5% x 60,000 = 3,000.
    repayment_assistance_plan_base_payment: 200
