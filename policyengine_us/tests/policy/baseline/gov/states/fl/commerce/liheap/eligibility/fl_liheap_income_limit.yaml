# FY2025 matrix footnote and accepted FY2025 plan section 2.1, page 8: the
# limit is the greater of 60% of state median income and 150% of the 2024
# poverty guidelines. State median income: 98_038 x size share x 60%, with
# shares 52%, 68%, 100%, 132% and 138% for sizes 1, 2, 4, 6 and 8, giving
# 30_587.856, 39_999.504, 58_822.8, 77_646.096 and 81_175.464 (printed
# 30_588, 40_000, 58_823, 77_646 and 81_175). Guidelines: 15_060 + 5_380 per
# additional person, times 1.5, give 87_150, 111_360 and 175_920 for sizes 9,
# 12 and 20, above the state median income amounts (82_940.148 at size 9).
- name: Case 3, fiscal year 2025 limits use the greater of state median income and poverty guideline amounts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [FL, FL, FL, FL, FL, FL, FL, FL]
    age: [40, 40, 40, 40, 40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_full_time_student: [false, false, false, false, false, false, false, false]
    ssi: [0, 0, 0, 0, 0, 0, 0, 0]
    fl_tca: [0, 0, 0, 0, 0, 0, 0, 0]
    snap: [0, 0, 0, 0, 0, 0, 0, 0]
    employment_income: [0, 0, 0, 0, 0, 0, 0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_200, 1_200, 1_200, 1_200, 1_200, 1_200, 1_200, 1_200]
    fl_liheap_household_size: [1, 2, 4, 6, 8, 9, 12, 20]
  output:
    fl_liheap_income_limit: [30_587.856, 39_999.504, 58_822.8, 77_646.096, 81_175.464, 87_150, 111_360, 175_920]
