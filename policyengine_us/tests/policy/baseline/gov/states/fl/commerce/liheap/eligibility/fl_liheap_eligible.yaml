# Boundary amounts. FY2025 matrix: the size-1 maximum income value,
# 98_038 x 52% x 60% = 30_587.856, is printed rounded to 30_588. The size-9
# value is 150% of the 2024 guideline, 58_100 x 1.5 = 87_150. Income at each
# printed value qualifies; one more cent does not.
- name: Case 6, fiscal year 2025 income at the printed maximum income value qualifies.
  period: 2025
  input:
    state_code: [FL, FL, FL, FL]
    age: [40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_full_time_student: [false, false, false, false]
    ssi: [0, 0, 0, 0]
    fl_tca: [0, 0, 0, 0]
    snap: [0, 0, 0, 0]
    employment_income: [30_588, 30_588.01, 87_150, 87_150.01]
    fl_liheap_household_size: [1, 1, 9, 9]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_200, 1_200, 1_200, 1_200]
  output:
    fl_liheap_eligible: [true, false, true, false]
