# FY2026 plan pages 6-7: 1_200 SSI + 18_000 Social Security + 2_400 pension +
# 1_200 survivor + 600 workers' compensation + 600 disability + 600 veterans +
# 300 general assistance + 300 strike + 1_200 child support + 600 alimony +
# 120 interest + 240 dividends = 27_360, plus 2_400 of periodic estate income
# = 29_760. Estate receipts exclude inherited principal and separately reported
# interest and dividends; each source counts once.
- name: Case 12, disjoint covered unearned receipts and canonical dividends count once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 1_200
        social_security: 18_000
        pension_income: 2_400
        survivor_benefits: 1_200
        workers_compensation: 600
        disability_benefits: 600
        veterans_benefits: 600
        general_assistance: 300
        strike_benefits: 300
        child_support_received: 1_200
        alimony_income: 600
        interest_income: 120
        ordinary_dividend_income: 240
        estate_income: 2_400
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_liheap_countable_income: 29_760

