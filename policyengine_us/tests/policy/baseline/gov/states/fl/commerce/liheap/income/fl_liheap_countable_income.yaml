# Plan p7 requires net gambling; contract v1.2 preserves only the household floor.
# max(1_200 + 4_000 - losses, 0) = 1_200, 200, 0; no per-source loss floor.
- name: Case 17, net gambling losses offset income before the household floor.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [FL, FL, FL]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    is_full_time_student: [false, false, false]
    ssi: [0, 0, 0]
    fl_tca: [0, 0, 0]
    snap: [0, 0, 0]
    employment_income: [1_200, 1_200, 1_200]
    gambling_winnings: [4_000, 4_000, 4_000]
    gambling_losses: [4_000, 5_000, 10_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200]
  output:
    fl_liheap_countable_income: [1_200, 200, 0]
