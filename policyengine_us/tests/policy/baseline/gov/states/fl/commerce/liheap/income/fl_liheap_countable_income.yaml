# Florida independent household income and categorical-income components; no final program eligibility or award is asserted.

# Manual pages 49-50 and FY2026 plan pages 5-6: 12_000 + 2_400 + 600 + 1_200 +
# 1_200 = 17_400 from the existing net business inputs.
- name: Case 1, adult wages and existing net business income count without a second expense deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_400
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        partnership_s_corp_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_liheap_countable_income: 17_400

# FY2026 plan section 1.8, page 5, counts gross income, and manual 1200.01B,
# page 49, counts "the gross amount of income", so each source is floored at
# zero: 12_000 wages + max(-6_000, 0) + 600 partnership income = 12_600.
- name: Case 2, a self-employment loss does not offset wages or partnership income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: -6_000
        partnership_s_corp_income: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_liheap_countable_income: 12_600

