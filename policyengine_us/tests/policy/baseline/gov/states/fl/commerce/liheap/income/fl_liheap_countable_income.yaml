# Plan section 1.9, page 7, counts net gambling winnings, so losses offset only
# winnings: 1_200 wages + max(4_000 - losses, 0) = 1_200 for losses of 4_000,
# 5_000 and 10_000.
- name: Case 17, gambling losses offset only gambling winnings.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [FL, FL, FL]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    is_full_time_student: [false, false, false]
    ssi: [0, 0, 0]
    fl_tca: [0, 0, 0]
    snap: [0, 0, 0]
    employment_income: [1_200, 1_200, 1_200]
    gambling_winnings: [4_000, 4_000, 4_000]
    gambling_losses: [4_000, 5_000, 10_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200]
  output:
    fl_liheap_countable_income: [1_200, 1_200, 1_200]

