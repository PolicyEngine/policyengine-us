# FY2026 plan section 1.9, page 6, counts TANF received. Florida TCA for a
# family of three with a shelter obligation over $50 is 303 a month, or
# 303 x 12 = 3_636 a year. The take-up-gated tanf total counts it when the
# family takes up TCA (first household) and adds 0 when it does not (second).
- name: Case 20, Florida cash assistance counts only when the family takes it up.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 30, ssi: 0}
      person2: {age: 7, ssi: 0}
      person3: {age: 4, ssi: 0}
      person4: {age: 30, ssi: 0}
      person5: {age: 7, ssi: 0}
      person6: {age: 4, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 3_636
        takes_up_tanf_if_eligible: true
        snap: 0
      spm_unit2:
        members: [person4, person5, person6]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 3_636
        takes_up_tanf_if_eligible: false
        snap: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: FL
      household2:
        members: [person4, person5, person6]
        state_code: FL
  output:
    tanf: [3_636, 0]
    fl_liheap_countable_income: [3_636, 0]
