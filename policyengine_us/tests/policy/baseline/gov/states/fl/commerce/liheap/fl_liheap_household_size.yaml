# Florida independent household income and categorical-income components; no final program eligibility or award is asserted.

# Manual pp41-42 counts citizens and qualified noncitizens, excludes nonqualified people from size; does not import SNAP-specific waiting bars.
- name: Case 1, qualified adults and children count without a SNAP waiting bar.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        is_full_time_student: false
        ssi: 0
      person2:
        age: 8
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
      person3:
        age: 35
        immigration_status: ASYLEE
        is_full_time_student: false
        ssi: 0
      person4:
        age: 22
        immigration_status: DACA
        is_full_time_student: false
        ssi: 0
      person5:
        age: 39
        immigration_status: UNDOCUMENTED
        is_full_time_student: false
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: FL
  output:
    fl_liheap_household_size: 3

# Manual pp41-42 requires at least one qualified member for final program eligibility; this independent size component returns0.
- name: Case 2, only nonqualified members produce a zero household size.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_full_time_student: false
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_liheap_household_size: 0
