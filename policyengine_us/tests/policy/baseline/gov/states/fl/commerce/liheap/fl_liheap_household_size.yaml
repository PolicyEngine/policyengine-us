# Florida LIHEAP household size counts citizens and qualified noncitizens; no final program eligibility or award is asserted.

# Manual pages 41-42 count citizens and qualified noncitizens and exclude
# nonqualified people from the size; SNAP-specific waiting periods do not apply.
- name: Case 1, qualified adults and children count without a SNAP waiting bar.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi: 0
      person2:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
      person3:
        age: 35
        immigration_status: ASYLEE
        ssi: 0
      person4:
        age: 22
        immigration_status: DACA
        ssi: 0
      person5:
        age: 39
        immigration_status: UNDOCUMENTED
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: FL
  output:
    fl_liheap_household_size: 3

# Manual pages 41-42 require at least one qualified member for final program
# eligibility; this size component returns 0, and the income limit is masked to
# 0 (the SMI size factor would otherwise treat size 0 as one person, 32_155).
- name: Case 2, only nonqualified members produce a zero household size.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_liheap_household_size: 0
    fl_liheap_income_limit: 0
