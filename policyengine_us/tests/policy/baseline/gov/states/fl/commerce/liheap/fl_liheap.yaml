# 30_587.856 x 50% = 15_293.928, printed 15_294. Wages of 10_000 fall in the
# first band, which pays 1_000; nobody qualifies for an addition.
- name: Case 13, a one-person household in fiscal year 2025 receives the first band award.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
