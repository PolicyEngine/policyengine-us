# the FY2025 estimates ($400 minimum, $1,350 maximum); the matrix governs.
# FY2025 matrix: bases of 1_000/750/550/400. Both years add 100 for a member
# age 60 or older, 100 for a disabled member and 150 for a child age 5 or
# younger, each once per household. Manual page 23 bases the payment on the
# matrix, not the actual bill. Categorical households, and households of 15 or
# more protected by the federal 110% poverty floor, with income above the table
