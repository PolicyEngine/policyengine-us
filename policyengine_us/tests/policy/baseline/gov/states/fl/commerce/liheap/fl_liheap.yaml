    ssi: [0, 0, 0, 0, 0, 0, 0, 0]
    fl_tca: [0, 0, 0, 0, 0, 0, 0, 0]
    snap: [0, 0, 0, 0, 0, 0, 0, 0]
    employment_income: [15_294, 15_295, 21_411, 21_412, 26_000, 26_001, 30_588, 30_589]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_200, 1_200, 1_200, 1_200, 1_200, 1_200, 1_200, 1_200]
  output:
    fl_liheap: [1_000, 750, 750, 550, 550, 400, 400, 0]

# FY2025 matrix footnote and accepted FY2025 plan section 2.1, page 8: sizes 9
# and above use 150% of the 2024 poverty guidelines when that exceeds 60% of
# state median income. Guideline 15_060 + 8 x 5_380 = 58_100, so the limit is
# 58_100 x 1.5 = 87_150; 60% of state median income is only
# 98_038 x 141% x 60% = 82_940.148. Wages of 50_000 + 35_000 = 85_000 fall in
# the over-125% band (72_626-87_150), which pays 400. No member is 60 or
# older, disabled, or 5 or younger.
- name: Case 15, a nine-person household in fiscal year 2025 qualifies under the poverty guideline limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 44, ssi: 0, employment_income: 50_000}
      person2: {age: 42, ssi: 0, employment_income: 35_000}
      person3: {age: 17, ssi: 0}
      person4: {age: 15, ssi: 0}
      person5: {age: 13, ssi: 0}
      person6: {age: 11, ssi: 0}
      person7: {age: 9, ssi: 0}
      person8: {age: 8, ssi: 0}
      person9: {age: 6, ssi: 0}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        fl_tca: 0
        snap: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        state_code: FL
  output:
    fl_liheap_household_size: 9
    fl_liheap_countable_income: 85_000
    fl_liheap_income_limit: 87_150
    fl_liheap_eligible: true
    fl_liheap: 400

