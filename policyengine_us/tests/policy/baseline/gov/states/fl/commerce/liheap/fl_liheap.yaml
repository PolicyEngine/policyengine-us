# Boundary amounts. FY2025 matrix, size 1, prints the bands 15_294 or less,
# 15_295-21_411, 21_412-26_000 and 26_001-30_588. These round
# 30_587.856 x 50%, 70% and 85% (15_293.928, 21_411.499 and 25_999.678) and
# the maximum income value to the nearest dollar. Each printed top pays its
# band's base; one dollar more moves to the next band, and 30_589 exceeds the
# maximum income value.
