# September 30, 2026 increase, so 20 x (39 x 14 + 13 x 15) = 14_820. That is
# under the FY2026 one-person maximum of 32_155. Heat is not included in rent
# and no heating fuel is reported, so the reported heating cost does not
# qualify: an unspecified fuel counts only when heat is included in rent.
