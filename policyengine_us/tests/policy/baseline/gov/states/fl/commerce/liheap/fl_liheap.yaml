# Accepted FY2026 plan section 1.9, page 7, and the FY2026 matrix: net
# gambling of 40_000 - 30_000 = 10_000 falls in the 350 band; 40_000 of
# periodic estate receipts exceeds the 32_155 limit. No categorical receipts.
- name: Case 11, net gambling and periodic estate income determine ordinary awards.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [FL, FL]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    is_full_time_student: [false, false]
    ssi: [0, 0]
    fl_tca: [0, 0]
    snap: [0, 0]
    gambling_winnings: [40_000, 0]
    gambling_losses: [30_000, 0]
    estate_income: [0, 40_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_200, 1_200]
