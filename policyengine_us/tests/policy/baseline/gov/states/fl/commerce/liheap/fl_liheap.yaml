# 2026 uses the 2025 guideline: size 15 is 15_650 + 14 x 5_500 = 92_650 (floor
# 1.1 x 92_650 = 101_915), size 16 is 98_150 (floor 107_965). The FY2026 limits
# are floor(61_837 x 1.59) = 98_320 and floor(61_837 x 1.62) = 100_175. Incomes
# between each limit and floor stay eligible in band 4 (200). Threshold edge:
# 101_914.99 is protected and exactly 101_915 is not, because the statute says
# "less than" and the floor is compared in cents (1.1 x 92_650 is
