# Tests Florida TCA countable earned income.
# Per DCF ESS Program Policy Manual 2620.0111.01:
#   Step 2 - subtract the $90 standard disregard (always).
#   Step 3 - subtract the remainder of the "$200 and 1/2" disregard "if eligible".
# Per 2420.0315, "the $90 standard earned income disregard is included in the
# first $200 earned income disregard": an eligible member has $90 and then
# another $110 deducted, "for a total of $200", and then half of the rest.
# The $200 and 1/2 disregard is granted (2420.0314-.0315) to a member who
# received TCA in one of the past four months (is_tanf_enrolled) or when income
# after the $90 disregard is below the payment standard for the size of the SFU;
# otherwise only the $90 is deducted.
#
# The disregard-formula cases below use a large filing unit with high shelter so
# the payment standard ($610 for size 8) is high enough that the $200 and 1/2
# disregard applies, exercising the full formula. A dedicated block at the end
# tests the predicate = False path (income after $90 at or above the payment
# standard), where only the $90 is deducted.

# ============================================================
# $200 and 1/2 disregard applies (income after $90 < payment standard).
# Size-8 filing unit, high shelter -> payment standard $610.
# ============================================================

- name: Case 1, zero earned income.
  period: 2024-01
  input:
    people:
      person1:
        employment_income_before_lsr: 0
        pre_subsidy_rent: 24_000
        age: 35
      person2: {age: 10}
      person3: {age: 9}
      person4: {age: 8}
      person5: {age: 7}
      person6: {age: 6}
      person7: {age: 5}
      person8: {age: 4}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        state_code: FL
  output:
    fl_tca_countable_earned_income: 0
    # $0 earned -> $0 countable.

- name: Case 2, earned income $290.
  period: 2024-01
  input:
    people:
      person1:
        employment_income_before_lsr: 3_480  # $290/month
        pre_subsidy_rent: 24_000
        age: 35
      person2: {age: 10}
      person3: {age: 9}
      person4: {age: 8}
      person5: {age: 7}
      person6: {age: 6}
      person7: {age: 5}
      person8: {age: 4}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        state_code: FL
  output:
    fl_tca_countable_earned_income: 45
    # After $90 = $200 (< $610, disregard applies); after the remaining $110 =
    # $90; * 0.5 = $45. ($290 - $200 total disregard) / 2 = $45.

