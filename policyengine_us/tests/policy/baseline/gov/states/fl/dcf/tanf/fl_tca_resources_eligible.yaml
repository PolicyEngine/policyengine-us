# Tests Florida TCA resource eligibility
# Asset limit: $2,000 in countable resources
# Source: FAC 65A-1.716, Florida DCF TCA Page

- name: Case 1, zero assets eligible.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_tca_resources_eligible: true

- name: Case 2, one dollar below limit eligible.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 1_999
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_tca_resources_eligible: true

- name: Case 3, at limit eligible.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 2_000
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_tca_resources_eligible: true

- name: Case 4, one dollar above limit ineligible.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 2_001
    households:
      household:
        members: [person1]
        state_code: FL
  output:
    fl_tca_resources_eligible: false

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: FL
  output:
    fl_tca_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: FL
  output:
    fl_tca_resources_eligible: false
