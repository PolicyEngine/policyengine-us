- name: Case 1, couple SSI recipients in care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        or_ssp_category: COMMUNITY_CARE
      person2:
        age: 65
        or_ssp_category: COMMUNITY_CARE
    marital_units:
      couple:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OR
  output:
    or_ssp: [248.5, 248.5]

- name: Case 2, excess income of spouse offsets other spouse.
  period: 2026-01
  absolute_error_margin: 0.01
