      person2:
        age: 65
        or_ssp_category: COMMUNITY_CARE
        ssi: 700
        or_ssp_countable_income: 700
    marital_units:
      couple:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OR
  output:
