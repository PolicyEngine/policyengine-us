    state_code:
      2026: OR
    age:
      2026: 65
    or_ssp_category: IN_HOME
  output:
    or_ssp: 22

- name: Case 3, Social Security income disqualifies the in-home supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: OR
    age:
      2026: 65
    or_ssp_category: IN_HOME
    # $500 a month.
    social_security_retirement: 6_000
  output:
    # SSI: 994 - (500 - 20) = 514; countable income 514 + 500 = 1,014.
    # 1,014 is not SSI alone, so no in-home supplement.
    or_ssp: 0

- name: Case 4, part-time earnings disqualify the in-home supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: OR
    age:
      2026: 65
    or_ssp_category: IN_HOME
    # 10 hours a week at Oregon's $15.05 standard minimum wage (July 2025):
    # 15.05 * 10 * 52 = 7,826 a year, or 652.17 a month.
    employment_income: 7_826
  output:
    # SSI: 994 - (652.17 - 20 - 65) * 0.5 = 994 - 283.58 = 710.42.
    # Countable income 710.42 + 652.17 = 1,362.58 is not SSI alone, so 0.
    or_ssp: 0

