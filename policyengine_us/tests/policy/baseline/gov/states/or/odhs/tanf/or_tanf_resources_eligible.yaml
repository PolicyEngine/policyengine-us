# Oregon TANF Resources Eligibility (OAR 461-160-0015)
# Resource limit: $10,000

- name: Zero resources is eligible
  period: 2024-01
  input:
    state_code: OR
    spm_unit_cash_assets: 0
  output:
    or_tanf_resources_eligible: true

- name: Resources below limit is eligible
  # Countable resources ($5,000) <= $10,000 limit
  period: 2024-01
  input:
    state_code: OR
    spm_unit_cash_assets: 5_000
  output:
    or_tanf_resources_eligible: true

- name: Resources at limit is eligible
  # Countable resources ($10,000) <= $10,000 limit
  period: 2024-01
  input:
    state_code: OR
    spm_unit_cash_assets: 10_000
  output:
    or_tanf_resources_eligible: true

- name: Resources above limit is not eligible
  # Countable resources ($10,001) > $10,000 limit
  period: 2024-01
  input:
    state_code: OR
    spm_unit_cash_assets: 10_001
  output:
    or_tanf_resources_eligible: false

# 8,688.73 + 9.74 + 1,301.53 = 10,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 10,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.53
    state_code: OR
  output:
    or_tanf_resources_eligible: true

# 8,688.73 + 9.74 + 1,301.54 = 10,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.54
    state_code: OR
  output:
    or_tanf_resources_eligible: false
