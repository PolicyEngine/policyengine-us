# Page numbers in the comments are those of the FY2026 Oregon Energy Assistance
# Intake, Operations and Policy Manual (income and income exclusion chart on
# pages 37-48, proof of income on pages 49-51, private disability insurance
# examples on pages 55-56):
# https://www.oregon.gov/ohcs/energy-weatherization/Documents/2026%20Final%20Energy%20Assistance%20Intake%20Operations%20%26%20Policy%20Manual.pdf#page=50
# General assistance is a checked source in section 1.9 of the FFY2026 state
# plan, page 6:
# https://liheapch.acf.gov/docs/2026/state-plans/OR_Plan_2026.pdf#page=6
- name: Case 1, interest counts only above $200 and every listed unearned source counts.
  period: 2026
  input:
    state_code: [OR, OR]
    or_liheap_countable_earned_income: [0, 0]
    # The only difference between the two households: interest at the $200
    # threshold and one dollar over it.
    interest_income: [200, 201]
    ordinary_dividend_income: [100, 100]
    rental_income: [300, 300]
    social_security: [1_000, 1_000]
    railroad_benefits: [120, 120]
    tanf: [500, 500]
    pension_income: [200, 200]
    unemployment_compensation: [150, 150]
    child_support_received: [250, 250]
    workers_compensation: [100, 100]
    disability_benefits: [75, 75]
    veterans_benefits: [50, 50]
    alimony_income: [25, 25]
    strike_benefits: [10, 10]
    ssi: [600, 600]
    general_assistance: [80, 80]
    estate_income: [40, 40]
    military_retirement_pay: [90, 90]
  output:
    # Each source is marked "Considered Income? Yes" in the chart: dividends
    # 100 (page 39) + rental income 300 (page 44) + Social Security 1,000
    # (page 46) + Railroad Retirement 120 (page 44) + TANF 500 (page 47) +
    # pensions 200 (page 44) + unemployment insurance 150 (page 48) + child
    # support 250 (page 38) + workers compensation 100 (page 49) + private
    # disability insurance 75 (page 39) + veterans benefits 50 (page 48) +
    # alimony 25 (page 37) + strike benefits 10 (page 47) + SSI 600 (page 47)
    # + general assistance 80 (state plan section 1.9) + trust and estate
    # income 40 (page 48) + military retirement pay 90, a retirement payment
    # (page 44) = 3,690.
    # Interest is counted "only if amount is over $200" (pages 43 and 50):
    # $200 adds nothing, $201 is counted in full, 3,690 + 201 = 3,891.
    or_liheap_countable_income: [3_690, 3_891]

- name: Case 2, the manual's private disability insurance examples count the insurer's payment plus Social Security once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OR, OR]
    or_liheap_countable_earned_income: [0, 0]
    # Example A (page 55): net monthly insurer benefit $319.39 x 12 = 3,832.68.
    # Example B (page 55): monthly benefit paid $709.33 x 12 = 8,511.96.
    disability_benefits: [3_832.68, 8_511.96]
    # Example A (page 55): Social Security $847.00 x 12 = 10,164.
    # Example B (page 55): Social Security $825.00 + $414.00 = $1,239.00 x 12
    # = 14,868.
    social_security: [10_164, 14_868]
    ssi: [0, 0]
    tanf: [0, 0]
  output:
    # Example A (page 55): "the maximum the client will ever receive from both
    # sources is $1,166.39" a month, x 12 = 13,996.68.
    # Example B (page 56): "$1,948.33 ($1,786.15 + $162.18)" a month,
    # x 12 = 23,379.96.
    or_liheap_countable_income: [13_996.68, 23_379.96]

- name: Case 3, an Oregon TANF entitlement counts only when it is taken up.
  period: 2026
  input:
    state_code: [OR, OR]
    age: [40, 40]
    or_tanf: [1_200, 1_200]
    takes_up_tanf_if_eligible: [false, true]
    ssi: [0, 0]
  output:
    # TANF is "Considered Income? Yes" (page 47) and the proof of income is
    # documentation "showing amount of assistance", so the model counts TANF
    # actually received: the first household does not take up its $1,200
    # entitlement, 0; the second receives it, 1,200.
    or_liheap_countable_income: [0, 1_200]

- name: Case 4, rental and estate losses are floored at zero like business losses.
  period: 2026
  input:
    state_code: [OR, OR]
    or_liheap_countable_earned_income: [45_000, 45_000]
    rental_income: [-8_000, 2_000]
    estate_income: [-1_000, 500]
    ssi: [0, 0]
    tanf: [0, 0]
  output:
    # Landlords complete the self-employment form (page 35) and a loss in one
    # source does not offset other income, so the first household's $8,000
    # rental loss and $1,000 trust loss count as 0: 45,000. The second
    # household counts both: 45,000 + rental 2,000 (page 44) + trust and
    # estate income 500 (page 48) = 47,500.
    or_liheap_countable_income: [45_000, 47_500]

- name: Case 5, the $200 interest test applies to each member separately.
  period: 2026
  input:
    people:
      person1:
        age: 40
        interest_income: 150
        ssi: 0
      person2:
        age: 38
        interest_income: 150
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    # Each member's $150 of interest is at or below $200 (pages 43 and 50), so
    # neither is counted although the household's interest totals $300: a
    # per-member reading, which the manual does not specify.
    or_liheap_countable_income: 0

- name: Case 6, each member's rental loss is floored before the household sum.
  period: 2026
  input:
    people:
      person1:
        age: 40
        rental_income: 6_000
        ssi: 0
      person2:
        age: 38
        rental_income: -6_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    # Each member's rental income is floored at zero before the household sum
    # (page 35 sends landlords to the self-employment form), so the second
    # member's $6,000 loss does not offset the first member's $6,000 of rent.
    or_liheap_countable_income: 6_000
