- name: Manual disability insurance examples count the insurer payment plus Social Security once
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OR, OR]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    or_liheap_countable_earned_income: [0, 0]
    # Manual pages 55-56: annualize the insurer's payment after its SSA offset.
    disability_benefits: [3832.68, 8511.96]
    social_security: [10164, 14868]
    ssi: [0, 0]
    tanf: [0, 0]
  output:
    or_liheap_countable_income: [13996.68, 23379.96]

- name: State cash entitlement counts only when TANF is taken up
  period: 2026
  input:
    state_code: [OR, OR]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    age: [40, 40]
    or_tanf: [1200, 1200]
    takes_up_tanf_if_eligible: [false, true]
    ssi: [0, 0]
  output:
    or_liheap_countable_income: [0, 1200]
