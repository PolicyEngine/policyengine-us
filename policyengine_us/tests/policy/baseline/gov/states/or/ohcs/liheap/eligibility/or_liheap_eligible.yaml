# Page numbers in the comments are those of the FY2026 Oregon Energy Assistance
# Intake, Operations and Policy Manual (energy burden on page 61 and in the
# table on pages 93-94, income limits on page 77):
# https://www.oregon.gov/ohcs/energy-weatherization/Documents/2026%20Final%20Energy%20Assistance%20Intake%20Operations%20%26%20Policy%20Manual.pdf#page=93
# OAR 813-200-0020(1)(b) makes "a demonstrated energy burden" a condition of
# eligibility:
# https://www.law.cornell.edu/regulations/oregon/Or-Admin-Code-SS-813-200-0020
- name: Case 1, energy burden with heat paid directly, heat included in rent, subsidized housing and public housing.
  period: 2026
  input:
    state_code: [OR, OR, OR, OR, OR, OR, OR]
    age: [38, 38, 38, 38, 38, 38, 38]
    # About 30 hours a week near the Portland-metro minimum wage ($16.80 an
    # hour from July 2026).
    employment_income: [26_000, 26_000, 26_000, 26_000, 26_000, 26_000, 26_000]
    ssi: [0, 0, 0, 0, 0, 0, 0]
    tanf: [0, 0, 0, 0, 0, 0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY]
    # About $125 a month where the household pays its own electric bill.
    pre_subsidy_electricity_expense: [0, 0, 0, 1_500, 1_500, 1_500, 0]
    heat_expense_included_in_rent: [false, true, true, false, false, true, true]
    receives_housing_assistance: [false, false, true, true, false, true, false]
    is_in_public_housing: [false, false, false, false, false, false, true]
  output:
    # Wages of 26,000 are within the size 1 limit of $38,385 (page 77) for
    # every household, so eligibility turns on the energy burden table
    # (page 93) and OAR 813-200-0020(1)(b):
    #   1. no heating bill and heat not in rent: no energy burden to
    #      demonstrate ("All households must demonstrate an energy burden",
    #      page 61), ineligible;
    #   2. "Energy Costs included in rent (non-subsidized)": energy burden
    #      "Yes", eligible;
    #   3. "Applicant lives in Subsidized Housing and heat is included in
    #      rent": energy burden "No", ineligible;
    #   4. "Applicant lives in Subsidized Housing and pays a vendor directly
    #      for utility costs": energy burden "Yes", eligible;
    #   5. "Applicant pays a vendor directly for utilities": energy burden
    #      "Yes", eligible;
    #   6. subsidized housing with heat included in rent stays ineligible
    #      (page 61 and row 3 of page 93) even though the household pays a
    #      separate electric bill: the "pays a vendor directly" row is read
    #      as the heating bill, so a non-heating bill creates no energy burden;
    #   7. public housing is subsidized housing, so heat included in rent is
    #      again "No", ineligible.
    or_liheap_eligible: [false, true, false, true, true, false, false]

- name: Case 2, federal 110% poverty floor above the 60% state median income limit at size 20.
  period: 2026
  input:
    state_code: [OR, OR, OR, OR, OR]
    spm_unit_size: [20, 20, 20, 20, 19]
    or_liheap_countable_income: [128_441, 132_164.99, 132_165, 132_166, 126_227]
    heat_expense_included_in_rent: [true, true, true, true, true]
  output:
    # 42 U.S.C. 8624(b)(2)(B) bars excluding a household on income below 110%
    # of the poverty guideline. PY2026 uses the 2025 guidelines (LIHEAP IM
    # 2025-02): 15,650 + 5,500 x 19 = 120,150 for 20 people, and 110% is
    # 132,165. The 60% SMI limit for 20 people is 128,441 (federal size
    # factors; the manual's table stops at 12 on page 77).
    #   1. at the 60% SMI limit: eligible;
    #   2. one cent below the floor: eligible;
    #   3. exactly at the floor, which is not below 110%: ineligible;
    #   4. above the floor: ineligible;
    #   5. 19 people, whose 126,226 limit exceeds the 126,115 floor (110% of
    #      114,650), so the limit still applies: ineligible.
    or_liheap_eligible: [true, true, false, false, false]

- name: Case 3, the floor uses the poverty guidelines from the year before the model year.
  period: 2026
  input:
    state_code: OR
    spm_unit_size: 20
    or_liheap_countable_income: 134_000
    heat_expense_included_in_rent: true
  output:
    # PY2026 uses the 2025 guidelines, so the floor is 132,165. The 2026
    # guidelines would give 110% x (15,960 + 5,680 x 19) = 136,268.
    or_liheap_eligible: false

- name: Case 4, PY2025 uses the 2024 poverty guidelines for the floor.
  period: 2025
  input:
    state_code: [OR, OR]
    spm_unit_size: [19, 19]
    or_liheap_countable_income: [123_089.99, 123_090]
    heat_expense_included_in_rent: [true, true]
  output:
    # LIHEAP IM 2024-02 makes the 2024 guidelines mandatory in FY2025:
    # 110% x (15,060 + 5,380 x 18) = 123,090 for 19 people, above the 121,051
    # PY2025 60% SMI limit.
    or_liheap_eligible: [true, false]

- name: Case 5, PY2027 uses the 2026 poverty guidelines for the floor.
  period: 2027
  input:
    state_code: [OR, OR]
    spm_unit_size: [20, 20]
    or_liheap_countable_income: [136_267.99, 136_268]
    heat_expense_included_in_rent: [true, true]
  output:
    # LIHEAP IM 2026-01 makes the 2026 guidelines mandatory in FY2027:
    # 110% x (15,960 + 5,680 x 19) = 136,268 for 20 people, above the 134,937
    # PY2027 60% SMI limit.
    or_liheap_eligible: [true, false]
