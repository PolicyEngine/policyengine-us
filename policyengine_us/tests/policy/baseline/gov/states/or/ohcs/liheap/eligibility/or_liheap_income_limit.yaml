# Source for the expected values in this file: FY2026 Oregon Energy Assistance
# Intake, Operations and Policy Manual, page 77, "60% of State Median Income by
# Household Size", Annual Gross Income column:
# https://www.oregon.gov/ohcs/energy-weatherization/Documents/2026%20Final%20Energy%20Assistance%20Intake%20Operations%20%26%20Policy%20Manual.pdf#page=77
- name: Case 1, published annual income limits for the odd household sizes 1 to 11.
  period: 2026
  input:
    state_code: [OR, OR, OR, OR, OR, OR]
    spm_unit_size: [1, 3, 5, 7, 9, 11]
  output:
    # Page 77: size 1 $38,385, size 3 $62,006, size 5 $85,627, size 7 $99,652,
    # size 9 $104,081, size 11 $108,510. The even sizes are exercised through
    # the payment matrix sweeps in or_liheap.yaml.
    or_liheap_income_limit: [38_385, 62_006, 85_627, 99_652, 104_081, 108_510]
