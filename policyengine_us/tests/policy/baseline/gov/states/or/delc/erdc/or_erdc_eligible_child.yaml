- name: Child younger than 13 is eligible.
  period: 2027-01
  input:
    age: 12
    state_code: OR
  output:
    or_erdc_eligible_child: true

- name: Child age 13 without special circumstances is ineligible.
  period: 2027-01
  input:
    age: 13
    state_code: OR
  output:
    or_erdc_eligible_child: false

- name: Child younger than 18 incapable of self-care is eligible.
  period: 2027-01
  input:
    age: 17
    is_incapable_of_self_care: true
    state_code: OR
  output:
    or_erdc_eligible_child: true

- name: Person age 18 is ineligible even with special circumstances.
  period: 2027-01
  input:
    age: 18
    is_incapable_of_self_care: true
    state_code: OR
  output:
    or_erdc_eligible_child: false

- name: Child age 15 with a disability is an eligible child.
  period: 2027-01
  input:
    age: 15
    is_disabled: true
    state_code: OR
  output:
    or_erdc_eligible_child: true

- name: Child age 15 receiving foster care is an eligible child.
  period: 2027-01
  input:
    age: 15
    is_in_foster_care: true
    state_code: OR
  output:
    or_erdc_eligible_child: true

- name: Undocumented child becomes eligible when OAR 414-175-0021 sunsets in May 2024.
  period: 2024
  input:
    age: 5
    immigration_status: UNDOCUMENTED
    state_code: OR
  output:
    or_erdc_eligible_child:
      2024-04: false
      2024-05: true

- name: Undocumented child is eligible under current law.
  period: 2027-01
  input:
    age: 5
    immigration_status: UNDOCUMENTED
    state_code: OR
  output:
    or_erdc_eligible_child: true

- name: Over-age undocumented child stays ineligible after the immigration test sunsets.
  period: 2027-01
  input:
    age: 13
    immigration_status: UNDOCUMENTED
    state_code: OR
  output:
    or_erdc_eligible_child: false
