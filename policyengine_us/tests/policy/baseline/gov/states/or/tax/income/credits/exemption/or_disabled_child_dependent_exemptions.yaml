- name: One disabled child dependent at the income threshold
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 100_000
    is_disabled: true
    is_qualifying_child_dependent: true
  output:
    or_disabled_child_dependent_exemptions: 1

- name: One disabled child dependent disqualified due to income
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 100_001
    is_disabled: true
    is_qualifying_child_dependent: true
  output:
    or_disabled_child_dependent_exemptions: 0


- name: 2025 joint return with one claimable spouse has no disabled child dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 4000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 4000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_disabled: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    # ORS 316.099 requires "a dependent of the taxpayer"; IRC 152(b)(1).
    or_disabled_child_dependent_exemptions: 0

- name: 2025 joint return with one claimable spouse has no disabled child dependent exemption (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        employment_income: 4000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        employment_income: 4000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_disabled: true
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: OR
  output:
    or_disabled_child_dependent_exemptions: 0

- name: 2025 joint return with neither spouse claimable has the disabled child dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 4000
      person_b:
        age: 30
        employment_income: 4000
      child:
        age: 10
        is_disabled: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    or_disabled_child_dependent_exemptions: 1
