- name: Oregon taxable income equals income after subtractions minus deductions
  period: 2021
  input:
    state_code: OR
    or_agi: 1
    or_deductions: 1
  output:
    or_taxable_income: 0

- name: Oregon subtracts tips, overtime and vehicle interest in 2025
  period: 2025
  input:
    state_code: OR
    or_agi: 30_000
    or_deductions: 3_000
    tip_income_deduction: 1_000
    overtime_income_deduction: 2_000
    auto_loan_interest_deduction: 500
    additional_senior_deduction: 6_000
  output:
    or_taxable_income: 23_500

- name: Oregon disconnects from the vehicle interest deduction in 2026
  period: 2026
  input:
    state_code: OR
    or_agi: 30_000
    or_deductions: 3_000
    tip_income_deduction: 1_000
    overtime_income_deduction: 2_000
    auto_loan_interest_deduction: 500
  output:
    or_taxable_income: 24_000

- name: Oregon taxable income floors at zero after its Schedule 1-A subtractions
  period: 2025
  input:
    state_code: OR
    or_agi: 3_000
    or_deductions: 2_900
    tip_income_deduction: 500
  output:
    or_taxable_income: 0
