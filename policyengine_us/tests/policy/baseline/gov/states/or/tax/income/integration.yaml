- name: Zero employment income.
  period: 2021
  input:
    employment_income: 0
    state_code: OR
  output:
    or_income_tax: 0

- name: Elderly OR couple with modest pension, social security, and bond income
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 67
        taxable_interest_income: 9000.0
        taxable_pension_income: 5000.0
        social_security: 1000.0
      person2:
        is_tax_unit_spouse: true
        age: 67
        taxable_interest_income: 9000.0
        taxable_pension_income: 5000.0
        social_security: 1000.0
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_ptc: 0
        # Expected values come from issue #1674 (an externally supplied
        # retirement-credit case) and exclude the 2021 kicker, so the 2020
        # liability is pinned to 0 rather than proxied by the 2021 liability.
        or_tax_before_credits_in_prior_year: 0
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    or_income_tax_before_credits: 1349.75
    or_exemption_credit: 426.00
    or_retirement_credit: 900.00
    or_income_tax: 23.75  # = 1349.75 - 426.00 - 900.00

- name: Tax unit with taxsimid 99570 in j21.its.csv and j21.ots.csv
  absolute_error_margin: 0.1
