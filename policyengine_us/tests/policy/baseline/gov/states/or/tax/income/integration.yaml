        state_fips: 41  # OR
  output:  # expected results from patched TAXSIM35 2024-02-02 version
    # or_agi: 139_803.51
    or_standard_deduction: 4_980.00
    or_itemized_deductions: 0
    or_taxable_income: 127_773.51
    or_income_tax: 9_814.18

- name: 40839-OR.yaml
  absolute_error_margin: 0.1
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 1
        ssi: 0
        wic: 0
        deductible_mortgage_interest: 0
        taxable_interest_income: 4_000
        taxable_pension_income: 18_010
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_childcare_expenses: 0
        premium_tax_credit: 0
        local_income_tax: 0
        state_sales_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        tanf: 0
    households:
      household:
        members: [person1]
        state_fips: 41
  output:
    # Tax calculation with corrected 2024 brackets:
    # OR AGI: $21,464.90 (Federal AGI $22,011 - federal tax subtraction $546.10)
    # Standard deduction: $3,945 ($2,745 base + $1,200 elderly addition)
    # Taxable income: $17,519.90
    # Tax: $4,300 @ 4.75% + $6,450 @ 6.75% + $6,769.90 @ 8.75% = $1,231.99
    # Credits: Exemption $249 + Retirement $44.01 = $293.01
    # Final tax: $1,231.99 - $293.01 = $938.98
    or_retirement_credit: 44
    or_income_tax: 939

# 2025 integration test
- name: 2025 single filer with employment income
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: OR
  output:
    # Federal AGI: $50,000
    # OR AGI: $46,128.50 (after federal tax subtraction of $3,871.50)
    # Standard deduction: $2,835 (single 2025)
    # Taxable income: $43,293.50
    # Tax calculation (2025 corrected brackets: $0, $4,400, $11,100):
    #   - First $4,400 at 4.75% = $209.00
    #   - $4,400 to $11,100 ($6,700) at 6.75% = $452.25
    #   - Above $11,100 ($32,193.50) at 8.75% = $2,816.93
    # Total before credits: $3,478.18
    # Exemption credit: $256 (1 exemption)
    # Tax after credits: $3,222.18
    or_standard_deduction: 2_835
    or_exemption_credit: 256

- name: 2025 joint filers with child eligible for CTC
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      parent1:
        age: 35
        employment_income: 13_000
      parent2:
        age: 33
        employment_income: 12_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: OR
  output:
    # Joint filing with $25,000 combined income (Oregon AGI)
    # Standard deduction: $5,670 (joint 2025)
    # Exemption credit: $256 * 3 = $768
    # OR CTC: $1,050 (full amount, AGI $25,000 is under phase-out start of $26,550)
    or_standard_deduction: 5_670
    or_exemption_credit: 768
    or_ctc: 1_050

- name: 2025 single filer includes the kicker on the 2025 return
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: OR
  output:
    # 2025 Form OR-40 line 32: the kicker is 9.863% of 2024 liability.
    # Tax before credits: $3,478.18 (see the 2025 single filer case above)
    # Exemption credit: $256
    # Tax before refundable credits: $3,478.18 - $256 = $3,222.18
    # 2024 liability not provided, so the 2025 liability is the proxy.
    # Kicker: 9.863% x $3,478.18 = $343.05
    # Final tax: $3,222.18 - $343.05 = $2,879.13
    or_income_tax_before_credits: 3_478.18
    or_income_tax_before_refundable_credits: 3_222.18
    or_tax_before_credits_in_prior_year: 3_478.18
    or_kicker: 343.05
    or_income_tax: 2_879.13

- name: 2025 kicker uses the provided 2024 liability, not the 2025 liability
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        or_tax_before_credits_in_prior_year: 2_000
    households:
      household:
        members: [person1]
        state_code: OR
  output:
    # Tax before credits: $3,478.18; tax before refundable credits: $3,222.18
    # Kicker: 9.863% x $2,000 (2024 liability) = $197.26
    # (not 9.863% x $3,478.18 = $343.05)
    # Final tax: $3,222.18 - $197.26 = $3,024.92
    or_income_tax_before_credits: 3_478.18
    or_kicker: 197.26
    or_income_tax: 3_024.92

- name: 2024 single filer receives no kicker in an even year
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person1:
        age: 35
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        or_tax_before_credits_in_prior_year: 2_000
    households:
      household:
        members: [person1]
        state_code: OR
  output:
    # OR AGI: $50,000 - $4,016 federal tax subtraction = $45,984
    # Standard deduction: $2,745 (single 2024)
    # Taxable income: $45,984 - $2,745 = $43,239
    # Tax: $4,300 @ 4.75% + $6,450 @ 6.75% + $32,489 @ 8.75%
    #   = $204.25 + $435.38 + $2,842.79 = $3,482.41
    # Exemption credit: $249
    # Kicker rate is 0 in 2024, so the kicker is $0 despite a prior-year
    # liability of $2,000.
    # Final tax: $3,482.41 - $249 = $3,233.41
    or_taxable_income: 43_239
    or_income_tax_before_credits: 3_482.41
    or_kicker: 0
    or_income_tax: 3_233.41
