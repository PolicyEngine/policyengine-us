# Paid Leave Oregon contributions begin January 1, 2023 (note to ORS 657B.150,
# 2021 Edition; Oregon DOR 2023 Combined Payroll Tax Report Instructions). The
# rate is 1% of wages in 2023 and 2025 (DOR instructions for each year), paid
# 60% by the employee and 40% by an employer with 25 or more employees
# (ORS 657B.150 (2), (4)). The statewide transit tax is 0.1% of wages in each
# year (DOR instructions, 2021, 2022, 2023 and 2025).

- name: Oregon employee payroll tax in 2021 is the statewide transit tax only.
  period: 2021
  input:
    employment_income: 50_000
    state_code: OR
  output:
    or_employee_paid_leave_contribution: 0
    or_employer_paid_leave_contribution: 0
    # 50,000 * 0.1% = 50
    or_employee_statewide_transit_tax: 50
    or_employee_state_payroll_tax: 50
    employee_state_payroll_tax: 50

- name: Oregon employee payroll tax in 2022 is the statewide transit tax only.
  period: 2022
  input:
    employment_income: 50_000
    state_code: OR
  output:
    or_employee_paid_leave_contribution: 0
    or_employer_paid_leave_contribution: 0
    or_employee_statewide_transit_tax: 50
    or_employee_state_payroll_tax: 50
    employee_state_payroll_tax: 50

- name: Paid Leave Oregon contributions start in 2023.
  period: 2023
  input:
    employment_income: 50_000
    state_code: OR
  output:
    # 50,000 * 1% * 60% = 300
    or_employee_paid_leave_contribution: 300
    # 50,000 * 1% * 40% = 200
    or_employer_paid_leave_contribution: 200
    or_employee_statewide_transit_tax: 50
    or_employee_state_payroll_tax: 350
    employee_state_payroll_tax: 350

- name: Paid Leave Oregon contribution rate is 1% in 2025.
  period: 2025
  input:
    employment_income: 50_000
    state_code: OR
  output:
    or_employee_paid_leave_contribution: 300
    or_employer_paid_leave_contribution: 200
    or_employee_statewide_transit_tax: 50
    or_employee_state_payroll_tax: 350
    employee_state_payroll_tax: 350
