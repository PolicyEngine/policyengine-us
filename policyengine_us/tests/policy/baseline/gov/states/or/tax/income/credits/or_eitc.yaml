- name: Case 15, 2017 Oregon ordinary earned income credit match.
  period: 2017
  absolute_error_margin: 0.01
  input:
    # Independently known annual federal EITC; no federal eligibility calculation.
    # One adult, with no dependent under age three, takes the ordinary match.
    state_code: OR
    age: 35
    is_tax_unit_dependent: false
    eitc: 100
  output:
    # 2013 special-session HB 3601, sections 6d and 7(2): 8% from tax year 2014.
    # https://olis.oregonlegislature.gov/liz/2013S1/Downloads/MeasureDocument/HB3601/Enrolled#page=7
    # 2017 Publication OR-17, page 115, confirms the ordinary 8% match.
    # Known federal credit 100 x 8% = 8. No full entitlement or population claim.
    or_eitc: 8

- name: Case 16, 2015 Oregon earned income credit age and zero controls.
  period: 2015
  absolute_error_margin: 0.01
  input:
    # Known annual federal credits isolate the state match; federal eligibility
    # and full state entitlement are outside these component premises.
    # Rows: dependent age two, dependent age three, no child, zero federal credit.
    people:
      person1:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      person2:
        age: 2
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        claimable_as_dependent_on_another_return: true
      person3:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      person4:
        age: 3
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        claimable_as_dependent_on_another_return: true
      person5:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      person6:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      person7:
        age: 2
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        claimable_as_dependent_on_another_return: true
    tax_units:
      tax_unit1:
        members: [person1, person2]
        eitc: 100
      tax_unit2:
        members: [person3, person4]
        eitc: 100
      tax_unit3:
        members: [person5]
        eitc: 100
      tax_unit4:
        members: [person6, person7]
        eitc: 0
    spm_units:
      spm_unit1: {members: [person1, person2]}
      spm_unit2: {members: [person3, person4]}
      spm_unit3: {members: [person5]}
      spm_unit4: {members: [person6, person7]}
    families:
      family1: {members: [person1, person2]}
      family2: {members: [person3, person4]}
      family3: {members: [person5]}
      family4: {members: [person6, person7]}
    marital_units:
      marital_unit1: {members: [person1]}
      marital_unit2: {members: [person2]}
      marital_unit3: {members: [person3]}
      marital_unit4: {members: [person4]}
      marital_unit5: {members: [person5]}
      marital_unit6: {members: [person6]}
      marital_unit7: {members: [person7]}
    households:
      household1: {members: [person1, person2], state_code: OR}
      household2: {members: [person3, person4], state_code: OR}
      household3: {members: [person5], state_code: OR}
      household4: {members: [person6, person7], state_code: OR}
  output:
    # HB 3601 (2013 special session), sections 6d and 7(2), sets 8% from 2014.
    # HB 4110 (2016), section 2, starts the young-dependent premium in 2017.
    # 100 times 0.08 / 0.08 / 0.08; zero federal credit times 0.08.
    or_eitc: [8, 8, 8, 0]

