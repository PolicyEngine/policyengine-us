- name: No EITC, no matched credit
  period: 2022
  absolute_error_margin: 1
  input:
    state_code: OR
    eitc: 0
  output:
    or_eitc: 0

- name: 9% match
  period: 2022
  absolute_error_margin: 1
  input:
    people: 
      parent: {}
      child: 
        age: 3
    tax_units: 
      tax_unit: 
        members: [parent, child]
        eitc: 100
    households: 
