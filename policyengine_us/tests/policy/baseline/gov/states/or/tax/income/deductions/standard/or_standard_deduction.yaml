    age_spouse: 35
  output:
    or_standard_deduction: 5_670

- name: 2025 head of household standard deduction
  period: 2025
  input:
    state_code: OR
    filing_status: HEAD_OF_HOUSEHOLD
    age_head: 35
  output:
    or_standard_deduction: 4_560

- name: 2025 single elderly filer with aged/blind addition
  period: 2025
  input:
    state_code: OR
    filing_status: SINGLE
    age_head: 65
  output:
    # $2,835 base + $1,200 aged
    or_standard_deduction: 4_035

- name: 2025 joint return limited to the dependent amount when either spouse can be claimed (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 35
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 35
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        tax_unit_earned_income: 3_000
    households:
      household:
        members: [person_a, person_b]
        state_code: OR
  output:
    # max($1,350, $3,000 + $450) = $3,450, below the $5,670 joint amount.
    or_standard_deduction: 3_450

- name: 2025 joint return limited to the dependent amount when either spouse can be claimed (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 35
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 35
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        tax_unit_earned_income: 3_000
    households:
      household:
        members: [person_b, person_a]
        state_code: OR
  output:
    # max($1,350, $3,000 + $450) = $3,450, below the $5,670 joint amount.
    or_standard_deduction: 3_450

- name: 2025 dependent filer with self-employment income uses earned income net of the self-employment tax deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 20
        self_employment_income: 1_500
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: OR
  output:
    # $1,500 - $1,500 x 0.9235 x 15.3% / 2 = $1,394.03; plus $450 = $1,844.03,
    # above the $1,350 minimum and below the $2,835 single amount.
    or_standard_deduction: 1844.03
