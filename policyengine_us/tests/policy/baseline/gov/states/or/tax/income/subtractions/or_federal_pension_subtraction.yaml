- name: Oregon federal pension subtraction applied when user specifies eligible amount
  period: 2024
  input:
    state_code: OR
    taxable_public_pension_income: 15_000
    or_federal_pension_subtraction: 15_000
  output:
    or_federal_pension_subtraction: 15_000
    or_income_subtractions: 15_040  # 15,000 federal pension subtraction + 40 federal tax liability subtraction

- name: Oregon state/local public pension defaults to no federal pension subtraction
  period: 2024
  input:
    state_code: OR
    taxable_public_pension_income: 15_000
  output:
    or_federal_pension_subtraction: 0
    or_income_subtractions: 40  # 40 federal tax liability subtraction only; public pension not subtracted
