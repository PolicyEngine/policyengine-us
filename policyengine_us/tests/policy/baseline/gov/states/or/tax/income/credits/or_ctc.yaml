# Tax year 2026 values are already determined by ORS 315.273(5) and published
# CPI-U: the COLA window (September 2024 - August 2025, averaging 319.205) is
# 9.1031% over the 2022 Q2 base (292.572). The $91.03 amount increase floors
# to $50 (amount $1,050) and the $2,275.76 threshold increase floors to
# $2,250 (phase-out start $27,250).
