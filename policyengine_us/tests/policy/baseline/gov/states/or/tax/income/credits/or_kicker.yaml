# The kicker is booked to the tax year whose liability determines it (the
# even-numbered surplus year), not the odd-numbered return year it is claimed
# on. The 2020 surplus kicker (17.341% of 2020 tax) is booked to 2020, the 2022
# surplus kicker (44.28%) to 2022, and the 2024 surplus kicker (9.863%) to 2024.
- name: 2020 surplus kicker booked to 2020 (17.341% of 2020 tax)
  period: 2020
  input:
    state_code: OR
    or_income_tax_before_credits: 1_000
  output:
    or_kicker: 173.41

- name: 2022 surplus kicker booked to 2022 (44.28% of 2022 tax)
  period: 2022
  input:
    state_code: OR
    or_income_tax_before_credits: 1_000
  output:
    or_kicker: 442.8

- name: 2024 surplus kicker booked to 2024 (9.863% of 2024 tax)
  period: 2024
  input:
    state_code: OR
    or_income_tax_before_credits: 1_000
  output:
    or_kicker: 98.63

- name: No kicker in an odd-numbered return year (2021)
  period: 2021
  input:
    state_code: OR
    or_income_tax_before_credits: 1_000
  output:
    or_kicker: 0

- name: No kicker in an odd-numbered return year (2023)
  period: 2023
  input:
    state_code: OR
    or_income_tax_before_credits: 1_000
  output:
    or_kicker: 0
