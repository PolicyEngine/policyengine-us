- name: Oregon wfhdc expenses for 1 dependent household with qualified expense over max allowed amount
  period: 2022
  input:
    tax_unit_childcare_expenses: 20_000  # > $12,000
    capped_count_cdcc_eligible: 1
    min_head_spouse_earned: 30_000
    state_code: OR
  output:
    or_cdcc_relevant_expenses: 12_000 # min(12000,30000)

- name: Oregon wfhdc expenses for 1 dependent household with qualified expense below max allowed amount
  period: 2022
  input:
    tax_unit_childcare_expenses: 10_000 # < $12,000
    capped_count_cdcc_eligible: 1 
    min_head_spouse_earned: 30_000
    state_code: OR
  output:
    or_cdcc_relevant_expenses: 10_000 # min(10000,30000)

- name: Oregon wfhdc expenses for 3 dependent household with childcare expense over max allowed amount
  period: 2022
  input:
    tax_unit_childcare_expenses: 40_000 # 40,000 > 2 * $12,000 = $24,000
    capped_count_cdcc_eligible: 2
    min_head_spouse_earned: 30_000
    state_code: OR
  output:
    or_cdcc_relevant_expenses: 24_000 # min(24000,30000)

- name: Care expenses for a disabled adult qualifying individual enter the expense base
  period: 2022
  input:
    tax_unit_childcare_expenses: 0
    care_expenses: 5_000
    capped_count_cdcc_eligible: 1
    min_head_spouse_earned: 30_000
    state_code: OR
  output:
    or_cdcc_relevant_expenses: 5_000 # min(5000, 12000, 30000)

# ORS 315.264(1)(a) covers expenses for qualifying individuals. The child of a
# return on which a filer can be claimed as a dependent is not one; the
# incapacitated spouse is, but has no care expenses here.
- name: 2025 childcare for the child of a joint return with one claimable spouse does not count (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 40
        employment_income: 5000
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        employment_income: 5000
        is_disabled: true
        is_incapable_of_self_care: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        tax_unit_childcare_expenses: 1000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    or_cdcc_relevant_expenses: 0

- name: 2025 childcare for the child of a joint return with one claimable spouse does not count (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
