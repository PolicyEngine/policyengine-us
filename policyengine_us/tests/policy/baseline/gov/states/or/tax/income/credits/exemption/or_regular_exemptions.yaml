- name: No income, 3 exemptions.
  period: 2021
  input:
    state_code: OR
    exemptions_count: 3
  output:
    or_regular_exemptions: 3

- name: $200,000 income (threshold), 2 exemptions.
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 200_000
    filing_status: JOINT
    exemptions_count: 2
  output:
    or_regular_exemptions: 2

- name: $200,001 income (threshold), 2 exemptions.
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 200_001
    filing_status: JOINT
    exemptions_count: 2
  output:
    or_regular_exemptions: 0

- name: $100,000 income (threshold), 3 exemptions.
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 100_000
    filing_status: SINGLE
    exemptions_count: 3
  output:
    or_regular_exemptions: 3

- name: $100,001 income (threshold), 3 exemptions.
  period: 2021
  input:
    state_code: OR
    adjusted_gross_income: 100_001
    filing_status: SINGLE
    exemptions_count: 3
  output:
    or_regular_exemptions: 0



- name: 2025 single filer who can be claimed as a dependent has no regular exemption
  period: 2025
  input:
    people:
      filer:
        age: 20
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: OR
  output:
    # ORS 316.085(1)(b); OR-17: "If someone else can claim you as a dependent, you
    # can't claim an exemption for yourself."
    or_regular_exemptions: 0

- name: 2025 joint return with one claimable spouse keeps the other spouse's exemption and no dependents (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 4000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 4000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    # One exemption for the spouse who cannot be claimed; the child is not a
    # dependent of such a return (IRC 152(b)(1)).
    or_regular_exemptions: 1

- name: 2025 joint return with one claimable spouse keeps the other spouse's exemption and no dependents (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        employment_income: 4000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        employment_income: 4000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: OR
  output:
    or_regular_exemptions: 1

- name: 2025 joint return with neither spouse claimable counts both and the child
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 4000
      person_b:
        age: 22
        employment_income: 4000
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    or_regular_exemptions: 3
