- name: Case 19, 2025 additional child tax credit offsets the early-distribution tax.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
        taxable_private_pension_income: 30_000
      person2:
        age: 40
      person3:
        age: 6
      person4:
        age: 9
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
        # 10% additional tax on the 30,000 early distribution.
        qualified_retirement_penalty: 3_000
        # No marketplace coverage, so no premium tax credit.
        aca_ptc: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: OR
  output:
    adjusted_gross_income: 50_000
    # (50,000 - 31,500 standard deduction) x 10%
    income_tax_before_credits: 1_850
    # 2 x 2,200 child tax credit less the 1,850 used against tax, within
    # 2 x 1,700 and 15% x (20,000 - 2,500) = 2,625.
    refundable_ctc: 2_550
    # 1,850 - 1,850 + 3,000
    income_tax_before_refundable_credits: 3_000
    # 3,000 - 2,550, within the 8,500 cap. The EITC does not reduce it.
    or_federal_tax_liability_subtraction: 450

- name: Case 20, 2025 head of household keeps the net investment income tax when credits wipe out the regular tax.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        long_term_capital_gains: 230_000
      person2:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2]
        solar_electric_property_expenditures: 200_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    # (230,000 - 23,625 standard deduction - 64,750 at 0%) x 15%
    income_tax_before_credits: 21_243.75
    # The child tax credit and the 60,000 clean energy credit, capped at tax.
    income_tax_capped_non_refundable_credits: 21_243.75
    # 3.8% x (230,000 - 200,000)
    net_investment_income_tax: 1_140
    # 1,140, within the 8,500 cap at 230,000.
    or_federal_tax_liability_subtraction: 1_140

- name: Case 21, 2025 with no EITC on the federal refundable credit list, the code backs out none.
  period: 2025
  input:
    gov.irs.credits.refundable:
      - refundable_american_opportunity_credit
      - refundable_ctc
      - recovery_rebate_credit
      - refundable_payroll_tax_credit
      - claim_of_right_credit
    state_code: OR
    filing_status: SINGLE
    adjusted_gross_income: 40_000
    income_tax_before_refundable_credits: 3_000
    eitc: 1_000
    assigned_aca_ptc: 0
  output:
    # income_tax_refundable_credits holds no EITC here, so the code backs out
    # none: 3,000 - 0 = 3,000. Without the guard: 3,000 - (0 - 1,000) = 4,000.
    or_federal_tax_liability_subtraction: 3_000

- name: The section 1341 credit reduces the federal tax liability subtraction
  # ORS 316.680(1)(b) and 316.685(1) allow federal taxes accrued and
  # disregard only the EITC. Section 1341 relief reduces accrued tax.
  # Federal (as in the federal claim of right integration case 4): tax on
  # 40,000 - 15,750 = 24,250 is 2,671.50, less the 2,200 prior-year decrease
  # under the credit method: 471.50. No EITC at this income.
  # Oregon: min(max(0, 471.50 + 0), 8,500 cap) = 471.50.
  # (Adding the credit back would give 2,671.50.)
  # aca_ptc is pinned at 0 so the case isolates the section 1341 credit: an
  # Oregon formula that also nets the premium tax credit would otherwise
  # subtract this household's modeled credit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [person]
        claim_of_right_prior_year_tax_decrease: 2_200
        aca_ptc: 0
    households:
      household:
        members: [person]
        state_code: OR
  output:
    claim_of_right_credit_applies: true
    claim_of_right_credit: 2_200
    eitc: 0
    income_tax: 471.5
    or_federal_tax_liability_subtraction: 471.5
