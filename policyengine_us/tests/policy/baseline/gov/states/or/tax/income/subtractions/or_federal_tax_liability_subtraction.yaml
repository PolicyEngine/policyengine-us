# ORS 316.685(1)(b) leaves out only the earned income credit, so every other
# federal refundable credit reduces the subtraction, and so does the premium tax
# credit (2025 Publication OR-17, PDF page 71: "Federal income tax credits,
# except for the EITC, reduce your federal tax subtraction."). The net
# investment income tax, a Subtitle A income tax (26 U.S.C. 1411(a)(1)), stays
# in; the employee payroll tax on unreported tips and wages comes out (ORS
# 316.685(3)(a)). Floor at zero, then apply the AGI cap.
- name: Case 11, 2025 premium tax credit reduces the subtraction.
  period: 2025
  input:
    state_code: OR
    filing_status: SINGLE
    adjusted_gross_income: 45_000
    income_tax_before_refundable_credits: 4_000
    assigned_aca_ptc: 1_500
    eitc: 0
  output:
    # 4,000 - 1,500
    or_federal_tax_liability_subtraction: 2_500

- name: Case 12, 2025 additional child tax credit reduces the subtraction but the EITC does not.
  period: 2025
  input:
    state_code: OR
    filing_status: JOINT
    adjusted_gross_income: 60_000
    # Federal tax after nonrefundable credits is 0; a 1,000 additional tax on
    # an early retirement plan distribution remains.
    income_tax_before_refundable_credits: 1_000
    refundable_ctc: 600
    assigned_aca_ptc: 0
    eitc: 500
  output:
    # 1,000 - 600 = 400. Counting the 500 EITC would give
    # max(0, 1,000 - 600 - 500) = 0, and leaving out the additional child tax
    # credit would give 1,000.
    or_federal_tax_liability_subtraction: 400

- name: Case 13, 2025 credits above the liability floor the subtraction at zero.
  period: 2025
  input:
    state_code: OR
    filing_status: SINGLE
    adjusted_gross_income: 40_000
    income_tax_before_refundable_credits: 2_000
    refundable_american_opportunity_credit: 1_000
    assigned_aca_ptc: 1_500
    eitc: 0
  output:
    # max(0, 2,000 - 1,000 - 1,500)
    or_federal_tax_liability_subtraction: 0

- name: Case 14, 2025 net investment income tax stays in and unreported payroll tax comes out.
  period: 2025
  input:
    state_code: OR
    filing_status: SINGLE
    adjusted_gross_income: 90_000
    # Includes both taxes below.
    income_tax_before_refundable_credits: 5_000
    net_investment_income_tax: 600
    unreported_payroll_tax: 400
    assigned_aca_ptc: 0
    eitc: 0
  output:
    # 5,000 - 400; the 600 net investment income tax is not taken out.
    or_federal_tax_liability_subtraction: 4_600

