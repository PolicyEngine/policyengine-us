# 2026: Publication OR-ESTIMATE (page 3) gives a federal tax subtraction of
# "$0 to $8,750"; the 2026 Withholding Tax Formulas (page 7) give the
# phase-out amounts 8,750 / 7,000 / 5,250 / 3,500 / 1,750 / 0. Married filing
# separately uses 50 percent of these amounts (ORS 316.680(3)(d)).
- name: 2026 single filer, capped at $8,750
  period: 2026
  input:
    state_code: OR
    filing_status: SINGLE
    adjusted_gross_income: 80_000
    income_tax: 10_000
    eitc: 0
  output:
    or_federal_tax_liability_subtraction: 8_750

- name: 2026 joint filer in the first phase-out step, capped at $7,000
  period: 2026
  input:
    state_code: OR
    filing_status: JOINT
    adjusted_gross_income: 255_000
    income_tax: 30_000
    eitc: 0
  output:
    or_federal_tax_liability_subtraction: 7_000

- name: 2026 separate filer, capped at $4,375
  period: 2026
  input:
    state_code: OR
    filing_status: SEPARATE
    adjusted_gross_income: 80_000
    income_tax: 10_000
    eitc: 0
  output:
    # 50% x 8,750
    or_federal_tax_liability_subtraction: 4_375

- name: The section 1341 credit reduces the federal tax liability subtraction
  # ORS 316.680(1)(b) and 316.685(1) allow federal taxes accrued and
  # disregard only the EITC. Section 1341 relief reduces accrued tax.
  # Federal (as in the federal claim of right integration case 4): tax on
  # 40,000 - 15,750 = 24,250 is 2,671.50, less the 2,200 prior-year decrease
  # under the credit method: 471.50. No EITC at this income.
  # Oregon: min(max(0, 471.50 + 0), 8,500 cap) = 471.50.
  # (Adding the credit back would give 2,671.50.)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [person]
        claim_of_right_prior_year_tax_decrease: 2_200
    households:
      household:
        members: [person]
        state_code: OR
  output:
    claim_of_right_credit_applies: true
    claim_of_right_credit: 2_200
    eitc: 0
    income_tax: 471.5
    or_federal_tax_liability_subtraction: 471.5
