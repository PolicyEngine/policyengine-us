- name: Household with no children under 13 without a disability is not eligible.
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_disabled: false
        is_tax_unit_head: true
      person2:
        age: 15
        is_disabled: false
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    or_wfhdc_has_qualified_individual_eligible: false

- name: Household with children under 13 without a disability is eligible.
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_disabled: false
        is_tax_unit_head: true
      person2:
        age: 11
        is_disabled: false
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    or_wfhdc_has_qualified_individual_eligible: true

- name: Household with disabled non-head member is eligible
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_disabled: false
        is_tax_unit_head: true
      person2:
        age: 35
        is_disabled: true
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    or_wfhdc_has_qualified_individual_eligible: true

- name: Disabled spouse labelled head is a qualified individual, as under the other labelling
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        is_tax_unit_head: true
      person2:
        age: 35
        is_disabled: false
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    # person2 is the spouse. A disabled spouse is the other spouse's
    # qualifying individual (IRC 21(b)(1)(C)) whichever spouse is labelled
    # head; Schedule OR-WFHDC: "the word 'you' also refers to your spouse".
    # Before, this couple was eligible only with the labels exchanged (the
    # case above).
    or_wfhdc_has_qualified_individual_eligible: true

- name: Single disabled head with no qualifying member is not eligible
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        is_tax_unit_head: true
      person2:
        age: 15
        is_disabled: false
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OR
  output:
    # A filer is not their own qualifying individual.
    or_wfhdc_has_qualified_individual_eligible: false

- name: 2025 child of a joint return with one claimable spouse is not a qualified individual (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    # The child must be a dependent (ORS 315.264, IRC 21(b)(1)(A)); IRC 152(b)(1).
    or_wfhdc_has_qualified_individual_eligible: false

- name: 2025 child of a joint return with one claimable spouse is not a qualified individual (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: OR
  output:
    or_wfhdc_has_qualified_individual_eligible: false

- name: 2025 child of a joint return with neither spouse claimable is a qualified individual
  period: 2025
  input:
    people:
      person_a:
        age: 20
      person_b:
        age: 22
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: OR
  output:
    or_wfhdc_has_qualified_individual_eligible: true

- name: 2025 disabled spouse who can be claimed is still a qualified individual (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 40
        is_disabled: true
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: OR
  output:
    # IRC 21(b)(1)(C): a disabled spouse, whichever spouse is labelled head.
    or_wfhdc_has_qualified_individual_eligible: true

