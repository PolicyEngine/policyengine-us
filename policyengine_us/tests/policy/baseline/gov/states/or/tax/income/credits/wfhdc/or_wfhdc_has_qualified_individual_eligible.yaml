- name: 2025 disabled dependent of a joint return with one claimable spouse is still a qualified individual (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 40
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      relative:
        age: 30
        is_disabled: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, relative]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, relative]
        state_code: OR
  output:
    # IRC 21(b)(1)(B) determines dependency without regard to 152(b)(1).
    or_wfhdc_has_qualified_individual_eligible: true

- name: 2025 disabled dependent of a joint return with one claimable spouse is still a qualified individual (the claimable spouse is the spouse)
  period: 2025
