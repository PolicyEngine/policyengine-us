  output:
    sd_liheap_income_limit: [105972, 114224, 122472, 130724, 138972]

# Source coverage is SouthDakota fully qualified households; size0 guard supplies no one-person limit, while size1 uses7825quarter*4. This is not a mixed-status eligibility test.
- name: Case 4, zero household size and a different state have no South Dakota income limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [SD, ND, SD]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    spm_unit_size: [0, 1, 1]
  output:
    sd_liheap_income_limit: [0, 0, 31300]
