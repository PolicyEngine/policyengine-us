# FY2026 matrix page 1; current application page 2; 2018 manual physical pages 30-32.
# Vendor cases use the approved eligible-unpaid-expense assumption. Cash-fuel
# payments carry forward the manual method; heat-in-rent assumes seven eligible months.
- name: Case 1, vendor fuels pay the smaller of the schedule and qualifying unpaid seasonal charges.
  period: 2026
  absolute_error_margin: 0.001
  input:
    state_code: [SD, SD, SD, SD, SD, SD, SD, SD]
    age: [40, 40, 40, 40, 40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    heating_type: [NATURAL_GAS, NATURAL_GAS, ELECTRICITY, ELECTRICITY, PROPANE, PROPANE, FUEL_OIL, FUEL_OIL]
    heating_expense: [500, 2000, 500, 2000, 500, 3000, 500, 4000]
    employment_income: [0, 0, 0, 0, 0, 0, 0, 0]
    ssi: [0, 0, 0, 0, 0, 0, 0, 0]
    tanf: [0, 0, 0, 0, 0, 0, 0, 0]
    snap:
      2026-01: [0, 0, 0, 0, 0, 0, 0, 0]
    county_str: [CUSTER_COUNTY_SD, CUSTER_COUNTY_SD, CUSTER_COUNTY_SD, CUSTER_COUNTY_SD, CUSTER_COUNTY_SD,
      CUSTER_COUNTY_SD, CUSTER_COUNTY_SD, CUSTER_COUNTY_SD]
  output:
    sd_liheap_eligible: [true, true, true, true, true, true, true, true]
    sd_liheap: [500, 880, 500, 1331, 500, 2499, 500, 2858]
