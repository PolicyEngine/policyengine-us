# DSS published these maximum hourly rates effective July 1, 2024.
# The family sheet computes $3.80 * 1.25 = $4.75 for a qualifying infant.
# DSS caps ordinary approved special needs care at $6.80 per hour.
# Each case establishes an approved activity; the formulas determine eligibility.
# Unknown county strings use each provider and age band's lowest county rate.

- name: DSS pays the Minnehaha family infant rate.
  period: 2025-01
  absolute_error_margin: 0.0001
  input:
    people:
      child:
        age: 0.5
        sd_cca_provider_type: FAMILY_DAY_CARE
    spm_units:
      unit:
        members: [child]
        meets_ccdf_activity_test: true
    households:
      household:
        members: [child]
        state_code: SD
        county_str: MINNEHAHA_COUNTY_SD
  output:
    sd_cca_hourly_rate: 3.8

