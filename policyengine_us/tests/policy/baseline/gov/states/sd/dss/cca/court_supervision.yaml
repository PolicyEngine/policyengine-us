# Verified court-supervision pathways and independent eligibility requirements.
- name: SD court age boundaries without graduation facts
  period: 2026-09
  input:
    state_code:
      2026: [SD, SD, SD, SD, SD, SD]
    age:
      2026: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision:
      2026: [true, true, true, true, true, true]
    meets_ccdf_activity_test:
      2026: [true, true, true, true, true, true]
  output:
    sd_cca_eligible_child: [true, true, true, false, false, false]

- name: SD age-18 route requires school and expected graduation independently
  period: 2026-09
  input:
    state_code:
      2026: [SD, SD, SD, SD, SD]
    age:
      2026: [18, 18, 18, 18, 19]
    is_under_court_supervision:
      2026: [true, true, true, true, true]
    is_in_k12_school:
      2026: [false, true, false, true, true]
    sd_cca_expected_to_graduate:
      2026: [false, false, true, true, true]
    meets_ccdf_activity_test:
      2026: [true, true, true, true, true]
  output:
    sd_cca_eligible_child: [false, false, false, true, false]

- name: SD age-18 disability route also requires expected graduation
  period: 2026-09
  input:
    state_code:
      2026: [SD, SD]
    age:
      2026: [18, 18]
    is_disabled:
      2026: [true, true]
    is_in_k12_school:
      2026: [true, true]
    sd_cca_expected_to_graduate:
      2026: [false, true]
    meets_ccdf_activity_test:
      2026: [true, true]
  output:
    sd_cca_eligible_child: [false, true]

- name: SD court supervision does not replace reason for care
  period: 2026-09
  input:
    state_code:
      2026: SD
    age:
      2026: 17
    is_under_court_supervision:
      2026: true
    sd_cca_activity_eligible: false
  output:
    sd_cca_eligible_child: false
    receives_or_needs_protective_services: false

- name: SD court supervision does not bypass narrow immigration test
  period: 2026-09
  input:
    state_code:
      2026: [SD, SD, SD]
    age:
      2026: [17, 17, 17]
    is_under_court_supervision:
      2026: [true, true, true]
    meets_ccdf_activity_test:
      2026: [true, true, true]
    immigration_status:
      2026: [CITIZEN, LEGAL_PERMANENT_RESIDENT, REFUGEE]
  output:
    sd_cca_eligible_child: [true, true, false]

- name: SD supervised teenager receives child-care benefit through full pipeline
  period: 2026-09
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 12000
        weekly_hours_worked_before_lsr:
          2026: 25
      child:
        age:
          2026: 17
        is_tax_unit_dependent:
          2026: true
        is_in_k12_school:
          2026: true
        childcare_hours_per_week:
          2026: 30
        childcare_hours_per_day:
          2026: 6
        childcare_days_per_week:
          2026: 5
        childcare_attending_days_per_month:
          2026: 20
        pre_subsidy_childcare_expenses:
          2026: 1200
        is_under_court_supervision:
          2026: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses:
          2026: 1200
    households:
      household:
        members: [parent, child]
        state_code:
          2026: SD
        county_str:
          2026: MINNEHAHA_COUNTY_SD
  output:
    sd_cca_eligible_child: [false, true]
    sd_cca_eligible: true
    sd_cca: 100

