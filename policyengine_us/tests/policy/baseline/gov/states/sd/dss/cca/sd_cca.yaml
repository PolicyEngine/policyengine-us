    households:
      household:
        members: [person1, person2]
        state_code: SD
        county_str: MINNEHAHA_COUNTY_SD
  output:
    # Countable income = $47,500 / 12 * 0.96 = $3,800.
    # Co-payment = ($3,800 - 1.7 * $24,000 / 12) * 0.05 = $20.
    # Benefit = min($653.60, $2,000) - $20 = $633.60.
    sd_cca: 633.6

