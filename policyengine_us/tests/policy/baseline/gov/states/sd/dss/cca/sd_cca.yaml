- name: Case 7, co-payment exceeds capped expenses, benefit floors at zero.
  period: 2027-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 100_000  # 8,333.33/mo gross; countable 8,000
      person2:
        age: 8  # school age
        sd_cca_provider_type: LICENSED_CENTER
        childcare_hours_per_week: 40  # full time
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_fpg: 24_000  # 170% FPL = 3,400/mo
        hhs_smi: 120_000  # 10,000/mo; 85% = 8,500/mo continuing ceiling
        is_sd_cca_enrolled: true  # continuing recipient, 85% SMI tier
        meets_ccdf_activity_test: true
        spm_unit_pre_subsidy_childcare_expenses: 1_200  # 100/mo billed
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county_str: AURORA_COUNTY_SD  # rural
  output:
    sd_cca_eligible: true  # countable 8,000 <= 8,500 (85% SMI, enrolled)
    # copay = (8,000 - 3,400) x 5% = 230.
    sd_cca_copay: 230
    # rural licensed center full-time school age 150/wk x 52/12 = 650 monthly
    # cap; expenses 100 bind, capped at 100; benefit = max(100 - 230, 0) = 0.
    sd_cca: 0

- name: Case 8, child with no care hours, no reimbursement despite billed expenses.
  period: 2027-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # copay 0
      person2:
        age: 0.5  # infant
        sd_cca_provider_type: FAMILY_DAY_CARE
        childcare_hours_per_week: 0  # not in care
    spm_units:
      spm_unit:
        members: [person1, person2]
        meets_ccdf_activity_test: true
        spm_unit_pre_subsidy_childcare_expenses: 24_000  # 2,000/mo billed
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county_str: MINNEHAHA_COUNTY_SD
  output:
    # The limited-time rate tier starts at one hour of care per week, so a
    # child with zero care hours is excluded from the reimbursement cap:
    # capped expenses = min(2,000, 0) = 0 and no benefit is paid.
    sd_cca: 0

- name: Case 9, protective-services child covered, non-protective sibling excluded.
  period: 2027-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked: 0  # not in any activity
      person2:
        age: 0.5  # infant receiving protective services
        receives_or_needs_protective_services: true
        sd_cca_provider_type: FAMILY_DAY_CARE
        childcare_hours_per_week: 40
      person3:
        age: 0.8  # infant sibling without protective services
        sd_cca_provider_type: FAMILY_DAY_CARE
        childcare_hours_per_week: 40
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        meets_ccdf_activity_test: false
        spm_unit_pre_subsidy_childcare_expenses: 36_000  # 3,000/mo billed
    households:
      household:
        members: [person1, person2, person3]
        state_code: SD
        county_str: MINNEHAHA_COUNTY_SD  # urban
  output:
    # With no caretaker activity, only the protective-services infant has a
    # reason for care (ARSD 67:47:01:03): one urban family day care full-time
    # infant rate 180/wk x 52/12 = 780/mo, not 1,560 for both children.
    # Expenses 3,000 exceed the cap; the co-payment is waived for
    # protective-services children. Benefit = 780.
    sd_cca: 780

