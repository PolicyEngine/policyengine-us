# Tests for monthly South Dakota Child Care Assistance.
# DSS caps a family's payment at billed expenses and summed eligible-child
# reimbursement ceilings, subtracts the co-payment, and floors the result at zero.
# Before August 2026, the model multiplies hourly county rates by
# ceil(weekly care hours * 4.3). The hourly schedules start July 1, 2024.
# From August 2026, weekly rates convert to months with 52 / 12.
# sd_child_care_subsidies aggregates monthly payments over the year.

- name: Case 1, rate-limited benefit, co-payment zero.
  period: 2027-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # 2,000/mo; countable 1,920, below 170% FPL
      person2:
        age: 0.5  # infant
        sd_cca_provider_type: FAMILY_DAY_CARE
        childcare_hours_per_week: 40  # full time
    spm_units:
      spm_unit:
        members: [person1, person2]
        meets_ccdf_activity_test: true
        spm_unit_pre_subsidy_childcare_expenses: 24_000  # 2,000/mo, above the rate
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county_str: MINNEHAHA_COUNTY_SD  # urban
  output:
    # rate 780 < expenses 2,000, capped at 780; copay 0. benefit = 780.
    sd_cca: 780
    sd_child_care_subsidies: 780
    # sd_cca is registered as a federal child care subsidy program.
    child_care_subsidies: 780

