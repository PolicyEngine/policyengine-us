  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 63_432
        ssi: 0
      person2:
        age: 38
        immigration_status: CITIZEN
        ssi: 0
      person3:
        age: 10
        immigration_status: CITIZEN
        ssi: 0
      person4:
        age: 7
        immigration_status: CITIZEN
        ssi: 0
      person5:
        age: 40
        immigration_status: CITIZEN
        employment_income: 63_432.01
        ssi: 0
      person6:
        age: 38
        immigration_status: CITIZEN
        ssi: 0
      person7:
        age: 10
        immigration_status: CITIZEN
        ssi: 0
      person8:
        age: 7
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3, person4]
        heating_type: NATURAL_GAS
        heating_expense: 1_000
        tanf: 0
        snap:
          2025-01: 0
      spm_unit2:
        members: [person5, person6, person7, person8]
        heating_type: NATURAL_GAS
        heating_expense: 1_000
        tanf: 0
