# Service 08054 remains $77.16/day: June 30*77.16-994; July 31*77.16-994.
# https://dhs.sd.gov/content/dam/digital/united-states/south-dakota/sdo/pdf/long-term-services-and-supports/provider-portal/fee-schedules/LTSS-Fee-Schedule-Effective-7-1-2026.pdf
