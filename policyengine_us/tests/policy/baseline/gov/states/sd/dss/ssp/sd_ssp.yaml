  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: SD
    age: 65
    sd_ssp_care_certified:
      2026-06: true
      2026-07: true
    sd_ssp_approved_care_cost:
      2026-06: 3_000
      2026-07: 3_000
  output:
    sd_ssp:
      2026-06: 1_320.8
