- name: Case 27, earned income and SSI both count toward the care contribution.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: SD
    age:
      2026: 45
    meets_ssi_disability_criteria: true
    employment_income: 3_600
    sd_ssp_care_certified: true
    sd_ssp_approved_care_cost: 2_200
  output:
    # 3_600 / 12 = 300 per month; countable (300 - 20 - 65) x 0.5 = 107.50;
    # SSI = 994 - 107.50 = 886.50.
    ssi: 886.5
    # min(2_200, 2_391.96) - (300 + 886.50) = 1_013.50.
    sd_ssp: 1_013.5

