- name: Case 1, SSI is the only cash income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: SD
    age:
      2026: 65
  output:
    sd_ssp: 15

- name: Case 2, small Social Security benefit disqualifies despite an SSI payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: SD
    age:
      2026: 65
    social_security_retirement: 6_000
  output:
    # 6_000 / 12 = 500 per month; SSI = 994 - (500 - 20) = 514.
    ssi: 514
    # Other cash income of 500 > 0 disqualifies.
    sd_ssp: 0

