- name: Case 1, eligible SSI couple receives eight and seven dollars.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: SD
  output:
    sd_ssp: [8, 7]

- name: Case 2, annual independent supplement and SNAP income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 65
    state_code: SD
  output:
    sd_ssp: 180
    snap_unearned_income: 12_108
    hud_unearned_income: 12_108

- name: Case 3, other cash income of either eligible spouse excludes the couple.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
        social_security_retirement: 120
    marital_units:
      couple:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: SD
  output:
    sd_ssp: [0, 0]
