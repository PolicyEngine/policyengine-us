# Wholly qualified households: size1Mid19564 puts20000in tier2; size2Mid26436 puts identicalincome in tier1. Region1gas retains792/880; size does not independently multiply the payment.
- name: Case 6, actual household membership changes the tier while leaving the regional fuel schedule shared.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      adult1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
      adult2:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
      child:
        age: 10
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      unit1:
        members: [adult1]
        heating_type: NATURAL_GAS
        sd_liheap_region: 1
        sd_liheap_countable_income: 20000
      unit2:
        members: [adult2, child]
        heating_type: NATURAL_GAS
        sd_liheap_region: 1
        sd_liheap_countable_income: 20000
    households:
      household1:
        members: [adult1]
        state_code: SD
      household2:
        members: [adult2, child]
        state_code: SD
  output:
    sd_liheap_income_threshold: [19564, 26436]
    sd_liheap_base_payment: [792, 880]
