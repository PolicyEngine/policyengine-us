# $10,800, plus 26 weeks of benefits at $600 = $15,600, totals $26,400.
- name: Case 22, workers' compensation counts as unearned income alongside wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 10_800
        workers_compensation: 15_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: SD
        county: CUSTER_COUNTY_SD
  output:
    sd_liheap_countable_income: 26_400

# Plan section 1.9 (page 6) checks "Unemployment insurance" and manual page 28
# says "All UI payments received are countable." South Dakota pays 1/26 of the
# high-quarter wages a week (DLR benefit page, $28-$575 a week): $800 a week x
# 13 weeks = $10,400 / 26 = $400. 26 weeks of wages ($20,800) and 16 weeks of
# benefits ($6,400) = $27,200.
- name: Case 23, unemployment insurance counts alongside wages earned before a layoff.
  period: 2026
  absolute_error_margin: 0.01
