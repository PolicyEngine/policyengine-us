# Rule 67:15:01:18.01; manual page 25. Each source floors at zero: $12,000 wages
# + $0 rental (-$4,000) + $0 farm rent (-$1,000) + $2,400 child support received
# = $14,400, not $12,000 - $4,000 - $1,000 + $2,400 = $9,400.
- name: Case 16, rental and farm rent losses do not offset wages or other unearned income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
        rental_income: -4_000
        farm_rent_income: -1_000
        child_support_received: 2_400
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: SD
        county: CUSTER_COUNTY_SD
  output:
    sd_liheap_countable_income: 14_400

