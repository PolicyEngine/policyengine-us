- name: Case 4, age 18 secondary student follows the precise earned income exception.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 18
        immigration_status: CITIZEN
        is_in_secondary_school: true
        ssi: 0
        is_full_time_student: true
        employment_income: 6_000
        self_employment_income: 1_200
        social_security: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 13_200

