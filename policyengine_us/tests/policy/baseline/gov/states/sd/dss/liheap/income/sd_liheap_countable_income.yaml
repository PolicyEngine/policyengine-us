        social_security: 3_600
        pension_income: 1_200
        railroad_benefits: 600
        unemployment_compensation: 1_200
        veterans_benefits: 600
        child_support_received: 1_200
        alimony_income: 600
        strike_benefits: 300
        general_assistance: 300
    spm_units:
