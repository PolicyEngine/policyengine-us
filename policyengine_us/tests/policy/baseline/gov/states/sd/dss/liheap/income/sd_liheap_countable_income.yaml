# South Dakota supported income region and heat-in-rent components only; no final award is asserted.

# Rule67:15:01:18.01 and approved net-input approximation:12000+600+600+1200+600=15000; no extra business expense deduction.
- name: Case 1, adult wages and existing net business sources count once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 600
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        partnership_s_corp_income: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 15_000

