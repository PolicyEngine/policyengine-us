# South Dakota LIEAP countable income: rules 67:15:01:18 and 67:15:01:18.01, FY2026 plan section 1.9 and the manual's income chart.

# Rule 67:15:01:18.01: existing net business inputs count with no further business
# deduction: $12,000 + $600 + $600 + $1,200 + $600 = $15,000.
- name: Case 1, adult wages and existing net business sources count once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 600
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        partnership_s_corp_income: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 15_000

# Rule 67:15:01:18.01 treats a self-employment loss as zero: $12,000 of wages +
# $600 of partnership income = $12,600.
- name: Case 2, business losses are zero before adding other income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: -6_000
        farm_operations_income: -1_200
        partnership_s_corp_income: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 12_600

# Rule 67:15:01:18(1) excludes the earnings of a member under 18. The
# 17-year-old's $6,000 of wages and $1,200 of self-employment are excluded; their
# $1,200 of Social Security counts: $12,000 + $1,200 = $13,200.
- name: Case 3, age 17 nonstudent follows the precise earned income exception.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 17
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        is_full_time_student: false
        employment_income: 6_000
        self_employment_income: 1_200
        social_security: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 13_200

# Rule 67:15:01:18(1) also excludes the earnings of a high school student under
