        sd_tanf: 3_600
        takes_up_tanf_if_eligible: true
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county: CUSTER_COUNTY_SD
  output:
    tanf: 3_600
    sd_liheap_countable_income: 9_600

