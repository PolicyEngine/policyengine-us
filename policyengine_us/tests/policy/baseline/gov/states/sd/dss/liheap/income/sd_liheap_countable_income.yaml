      household:
        members: [person1]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 13_800

# Rule 67:15:01:18 excludes capital gains (14) and only gifts for recurring
# occasions (17). Plan section 1.9 leaves interest and dividends unchecked and
# manual page 25 excludes bank interest and dividends but counts monthly cash
# gifts; application page 5 lists money from family or friends. SNAP is not
# income: $12,000 wages + $2,400 regular help = $14,400.
- name: Case 8, interest dividends and capital gains are excluded while regular help from family counts.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 0
        employment_income: 12_000
        interest_income: 600
        ordinary_dividend_income: 1_200
        capital_gains: 6_000
        financial_assistance: 2_400
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
        snap: 6_000
    households:
      household:
        members: [person1]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 14_400

# Plan section 1.9 counts SSI and TANF at every age: $6,000 adult wages + $1,200
# adult SSI + $2,400 child SSI + $3,600 TANF = $13,200; annual totals sum once.
- name: Case 9, adult and child SSI and the state TANF grant are annualized once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 1_200
        employment_income: 6_000
      person2:
        age: 8
        immigration_status: CITIZEN
        is_in_secondary_school: false
        ssi: 2_400
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 3_600
    households:
      household:
        members: [person1, person2]
        state_code: SD
        county: AURORA_COUNTY_SD
  output:
    sd_liheap_countable_income: 13_200

