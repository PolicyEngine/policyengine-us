# Unit tests for base New Mexico Premium Assistance eligibility
# (REQ-001/002/003/019). Eligible when: the program is in effect (PY2026-2027),
# the household is in New Mexico, at least one tax-unit member is eligible for
# the federal ACA premium tax credit (which embeds on-Marketplace enrollment,
# the MFS exclusion, and the 100-400% FPL income test), and ACA MAGI is at or
# below the 400% FPL limit. is_aca_ptc_eligible and aca_magi_fraction are
# supplied directly so the gate logic is tested in isolation from the
# premium-data lookup.
# The >400% FPL Middle Income Household (MIH) band is exercised through the
# nm_premium_assistance amount variable and integration.yaml, because
# is_aca_ptc_eligible embeds the <=400% income test and is false above it.

- name: Case 1, NM APTC-eligible unit at 250% FPL in 2026 is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

- name: Case 2, NM unit above 400% FPL is base-ineligible (income cap, REQ-003).
  # is_aca_ptc_eligible is false above 400% FPL in 2026, and the income cap also
  # fails; base NMPA does not apply (MIH handles the >400% band separately).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 4.05
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false

- name: Case 3, exactly 400% FPL is eligible (boundary, at limit not above).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 4.00
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

- name: Case 4, no federal-APTC-eligible member makes the unit ineligible (REQ-002).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false

- name: Case 5, non-New-Mexico state is ineligible (defined_for StateCode.NM).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    nm_premium_assistance_eligible: false

- name: Case 6, program not in effect in 2025 (before PY2026 start, REQ-019).
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false

- name: Case 7, program sunset in 2028 (after PY2027 end, carry-forward window).
  period: 2028
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false

- name: Case 8, one eligible member in a multi-person unit qualifies the unit.
  period: 2026
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: false
      person2:
        age: 43
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi_fraction: 3.00
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

# ---- Edge cases ----

- name: Case 9, zero income (0% FPL) APTC-eligible NM unit is eligible.
  # Lower bound of the income test: 0 <= 4.00 FPL limit holds.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 0
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

- name: Case 10, just below 400% FPL (3.99) is eligible (below the income cap).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 3.99
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

- name: Case 11, PY2027 carry-forward year is still eligible (in_effect true).
  # in_effect: 2026-01-01 -> true, 2028-01-01 -> false, so 2027 is inside the
  # PY2026-2027 window. Same eligibility as 2026 for an APTC-eligible NM unit.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true

- name: Case 12, just above the income cap (4.01) is base-ineligible (REQ-003).
  # Income test is magi_frac <= 4.0; 4.01 fails it. Even with a directly-supplied
  # APTC-eligible member, the base band does not apply above 400% FPL.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 4.01
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
