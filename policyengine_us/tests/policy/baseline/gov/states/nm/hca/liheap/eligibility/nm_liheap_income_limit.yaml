- name: Case 6, a household with no citizen or qualified non-citizen member has size zero and no limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_liheap_household_size: 0
    nm_liheap_income_limit: 0
