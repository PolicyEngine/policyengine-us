# End-to-end integration tests for New Mexico Premium Assistance
# (NMPA base band <=400% FPL + Middle Income Household MIH band >400% FPL), PY2026.
# Scenarios span the sliding scale (with and without the <=200% FPL 1.1 benchmark
# gross-up), the MIH 8.5% cap, a $0-floor case, a non-NM case, and an out-of-window
# (2025) case. The OSI PY2025-2026 subsidy-impact analysis gives order-of-magnitude
# net-premium illustrations for the >400% band (Gold plans / PY2025 premiums), used
# here only as directional anchors, not exact arithmetic.
#
# To keep expected values exactly hand-verifiable and independent of the
# rating-area premium lookup, aca_magi, aca_magi_fraction, slcsp (annual), aca_ptc,
# is_aca_ptc_eligible, pays_aca_premium and filing_status are supplied directly, and
# each scenario asserts the intermediate values so a reviewer can follow the
# arithmetic:
#   target% = NM schedule keyed on aca_magi_fraction (base band only)
#   benchmark = slcsp_annual * (1.1 if aca_magi_fraction <= 2.0 else 1.0)
#   base amount = max(0, benchmark - aca_ptc - target% * aca_magi)
#   MIH amount  = max(0, slcsp_annual - aca_ptc - 0.085 * aca_magi)
#
# NM target schedule (initial per band): 0-150% 0%, 150-200% 0%,
# 200-250% 0%->2%, 250-300% 2%->5%, 300-400% 5%->8.5%; >400% flat 8.5% (MIH).

- name: Scenario 1, single age 40 at 150% FPL (gross-up ON, target 0%).
  # magi_frac 1.50 <= 2.0 -> benchmark = 6_000 * 1.1 = 6_600. target% 0%.
  # amount = max(0, 6_600 - 3_500 - 0*22_500) = 3_100. Gross-up adds 600 over
  # the plain 6_000 - 3_500 = 2_500 residual.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 22_500
        aca_magi_fraction: 1.50
        slcsp: 6_000
        aca_ptc: 3_500
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0
    nm_premium_assistance: 3_100

- name: Scenario 2, single age 40 at 200% FPL boundary (gross-up ON at exactly 2.0).
  # magi_frac 2.00 <= 2.0 -> benchmark = 6_000 * 1.1 = 6_600. target% 0%.
  # amount = max(0, 6_600 - 4_000 - 0*31_300) = 2_600.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 31_300
        aca_magi_fraction: 2.00
        slcsp: 6_000
        aca_ptc: 4_000
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0
    nm_premium_assistance: 2_600

- name: Scenario 3, single age 40 at 250% FPL (no gross-up, target 2%).
  # magi_frac 2.50 > 2.0 -> benchmark = 6_000. target% 0.02.
  # amount = max(0, 6_000 - 2_500 - 0.02*39_125) = 6_000 - 2_500 - 782.50 = 2_717.50.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 39_125
        aca_magi_fraction: 2.50
        slcsp: 6_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0.02
    nm_premium_assistance: 2_717.50

- name: Scenario 4, family of four at 300% FPL (target 5%, no gross-up).
  # ages 45/43/15/13; magi_frac 3.00 -> benchmark = 18_000. target% 0.05.
  # amount = max(0, 18_000 - 8_000 - 0.05*93_900) = 18_000 - 8_000 - 4_695 = 5_305.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
      person3:
        age: 15
        is_aca_ptc_eligible: true
      person4:
        age: 13
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
        tax_unit_is_filer: true
        aca_magi: 93_900
        aca_magi_fraction: 3.00
        slcsp: 18_000
        aca_ptc: 8_000
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0.05
    nm_premium_assistance: 5_305

- name: Scenario 5, single age 40 at 405% FPL (MIH, 8.5% cap, no APTC term).
  # magi_frac 4.05 > 4.0 -> MIH; base band ineligible. is_aca_ptc_eligible false
  # above 400% FPL, so MIH uses pays_aca_premium & non-separate filing.
  # amount = max(0, 6_000 - 0 - 0.085*63_400) = 6_000 - 5_389 = 611.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        tax_unit_is_filer: true
        aca_magi: 63_400
        aca_magi_fraction: 4.05
        slcsp: 6_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
    nm_premium_assistance_mih_eligible: true
    nm_premium_assistance: 611

- name: Scenario 6, single age 55 at 500% FPL (MIH, 8.5% cap binds -> $0 floor).
  # magi_frac 5.0 > 4.0 -> MIH. 0.085*78_250 = 6_651.25 > slcsp 6_000.
  # amount = max(0, 6_000 - 0 - 6_651.25) = 0 (net premium capped at 8.5% is
  # already below the benchmark, so no state top-up is owed ($0 floor).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 55
        is_aca_ptc_eligible: false
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        tax_unit_is_filer: true
        aca_magi: 78_250
        aca_magi_fraction: 5.00
        slcsp: 6_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
    nm_premium_assistance_mih_eligible: true
    nm_premium_assistance: 0

- name: Scenario 7, single age 40 at 250% FPL living in Texas (non-NM -> $0).
  # defined_for StateCode.NM zeroes the amount outside New Mexico.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 39_125
        aca_magi_fraction: 2.50
        slcsp: 6_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    nm_premium_assistance_eligible: false
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance: 0

- name: Scenario 8, single age 40 at 250% FPL in NM but in 2025 (out of window -> $0).
  # in_effect is false before 2026-01-01, so base and MIH are both ineligible.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 39_125
        aca_magi_fraction: 2.50
        slcsp: 6_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance: 0

- name: Scenario 9, base-band unit with zero SLCSP -> $0 (no benchmark to top up).
  # 250% FPL, base-eligible, target% 0.02. benchmark = 0 * 1.0 = 0.
  # amount = max(0, 0 - 0 - 0.02*39_000) = max(0, -780) = 0. Even with a positive
  # target schedule and an eligible unit, no SLCSP means no state assistance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 39_000
        aca_magi_fraction: 2.50
        slcsp: 0
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0.02
    nm_premium_assistance: 0

- name: Scenario 10, PY2027 carry-forward single at 250% FPL matches PY2026.
  # 2027 is inside the in_effect window; schedule carries forward. target% 0.02,
  # benchmark = 6_000 (no gross-up above 200%).
  # amount = max(0, 6_000 - 2_500 - 0.02*39_125) = 6_000 - 2_500 - 782.50 = 2_717.50.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 39_125
        aca_magi_fraction: 2.50
        slcsp: 6_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance_target_contribution_percentage: 0.02
    nm_premium_assistance: 2_717.50

- name: Scenario 11, MIH couple with one premium-payer (base gate vs MIH gate).
  # No member is is_aca_ptc_eligible -> base band fails. person1 pays_aca_premium
  # so tax_unit.any(pays_aca_premium) is true and filing is joint (not separate)
  # -> MIH eligible. magi_frac 4.20 > 4.0.
  # target% schedule clamps to the top band -> 0.085 (unused in MIH; MIH uses the
  # flat 0.085 mih.rate). amount = max(0, 12_000 - 0 - 0.085*66_000)
  # = 12_000 - 5_610 = 6_390.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: false
        pays_aca_premium: true
      person2:
        age: 43
        is_aca_ptc_eligible: false
        pays_aca_premium: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        tax_unit_is_filer: true
        aca_magi: 66_000
        aca_magi_fraction: 4.20
        slcsp: 12_000
        aca_ptc: 0
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
    nm_premium_assistance_mih_eligible: true
    nm_premium_assistance_target_contribution_percentage: 0.085
    nm_premium_assistance: 6_390

# ---- Derived-from-raw-income scenario ----
# Unlike every scenario above, this one does NOT inject aca_magi,
# aca_magi_fraction, or is_aca_ptc_eligible. It supplies raw employment_income
# and pays_aca_premium and lets the federal ACA chain derive:
#   employment_income -> aca_magi -> aca_magi_fraction (floored to whole-% of the
#   prior-year FPG) -> is_aca_ptc_eligible (Marketplace enrollment + not-separate
#   + 100-400% FPL income test). This locks the NM base gate to the REAL
#   is_aca_ptc_eligible internals rather than an injected boolean.
#
# A POSITIVE slcsp (7_000 annual, a realistic benchmark) is injected so the
# asserted amount is a genuine derived state top-up, not a $0 floor. Everything
# on the federal ACA side is still derived from the raw $30,000 wage:
#   employment_income 30_000 -> aca_magi_fraction derives to 1.91 (single-filer,
#   ~191% of the prior-year FPG), which is <= the 200% gross-up limit, so the
#   benchmark is grossed up: benchmark = 7_000 * 1.1 = 7_700. The federal
#   aca_ptc derives to 5_150.14, and the 0-200% target% is 0.
#   base_amount = max(0, 7_700 - 5_150.14 - 0 * aca_magi) = 2_549.86.
# 1.0 <= magi_frac (1.91) <= 4.0 with a Marketplace-enrolled, non-separate filer
# who is income-eligible for the federal PTC, so nm_premium_assistance_eligible
# derives to true and nm_premium_assistance_mih_eligible to false. Asserting the non-zero amount
# locks the whole derived chain (aca_magi_fraction 1.91, aca_ptc 5_150.14, the
# 1.1 gross-up on the injected 7_000 benchmark) down to the dollar.

- name: Scenario 12, derived-from-income single base-band top-up.
  # Raw employment_income drives aca_magi/aca_magi_fraction/is_aca_ptc_eligible
  # and aca_ptc; only slcsp (7_000 annual benchmark) is injected. Derived
  # aca_magi_fraction 1.91 (<= 2.0 gross-up), derived aca_ptc 5_150.14:
  # amount = max(0, 7_000*1.1 - 5_150.14 - 0*aca_magi) = 2_549.86.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 30_000
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        slcsp: 7_000
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance: 2_549.86

# ---- PY2027 benchmark gross-up boundary (era-toggled inclusive vs strict) ----
# The benchmark gross-up income limit is 200% FPL. PY2026 treats it as inclusive
# (magi_frac <= 2.0 -> gross-up ON), PY2027 as strict (magi_frac < 2.0 -> gross-up
# OFF) via benchmark_gross_up.boundary_inclusive (2022: true, 2027: false).
# Scenarios 13 and 14 hold every input fixed at exactly 200% FPL and change only
# the year, so the assistance difference isolates the gross-up toggle:
#   target% is 0 at 200% FPL, so amount = benchmark - aca_ptc.
#   2026: benchmark = 6_000 * 1.1 = 6_600 -> amount = 6_600 - 4_000 = 2_600.
#   2027: benchmark = 6_000 * 1.0 = 6_000 -> amount = 6_000 - 4_000 = 2_000.
# The 600 difference is exactly the 10% gross-up on the 6_000 SLCSP, applied in
# 2026 (inclusive at 2.00) but not in 2027 (strict below 2.00).

- name: Scenario 13, exactly 200% FPL in 2026 -> gross-up applied (inclusive <=).
  # magi_frac 2.00 <= 2.0 -> gross-up ON. amount = 6_000*1.1 - 4_000 = 2_600.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 31_300
        aca_magi_fraction: 2.00
        slcsp: 6_000
        aca_ptc: 4_000
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance: 2_600

- name: Scenario 14, exactly 200% FPL in 2027 -> gross-up NOT applied (strict <).
  # magi_frac 2.00 is NOT < 2.0 in PY2027, so the gross-up is off and the plain
  # benchmark applies. amount = 6_000 - 4_000 = 2_000. Same inputs as Scenario 13
  # except the year; the 600 drop is exactly the withdrawn 10% gross-up.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
        aca_magi: 31_300
        aca_magi_fraction: 2.00
        slcsp: 6_000
        aca_ptc: 4_000
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_premium_assistance_eligible: true
    nm_premium_assistance_mih_eligible: false
    nm_premium_assistance: 2_000
