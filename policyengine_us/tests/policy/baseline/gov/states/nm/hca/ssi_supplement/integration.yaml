# New Mexico SSI State Supplement Integration Tests
# Tests the full eligibility and benefit calculation pipeline
# Source: 8.106.500.10 NMAC - Payments to Adults in Residential Care
# Program: $100/month flat payment for SSI recipients in licensed ARSCH facilities
# 8.106.400.10(C) NMAC: two SSI recipients who would be a family at home are
# two separate benefit groups in an ARSCH facility, so each spouse is paid.

- name: Case 1, elderly SSI recipient in ARSCH facility receives supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    people:
      person1:
        # Eligibility: SSI recipient (aged) AND age >= 18 (70 >= 18) AND in ARSCH (true)
        nm_ssi_state_supplement_eligible: true
        # Benefit: $100/month * 12 = $1,200/year (flat payment)
        nm_ssi_state_supplement: 1_200

- name: Case 2, disabled adult SSI recipient in ARSCH facility receives supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    people:
      person1:
        # Eligibility: SSI recipient (disabled) AND age >= 18 (35 >= 18) AND in ARSCH (true)
        nm_ssi_state_supplement_eligible: true
        # Benefit: $100/month * 12 = $1,200/year
        nm_ssi_state_supplement: 1_200

- name: Case 3, married SSI couple both in ARSCH facility each receive supplement.
  # Both spouses of a joint SSI claim. 2025 SSI couple rate: $1,450/month, or
  # $725 for each spouse. 8.106.400.10(C) NMAC: two SSI recipients who would
  # be a family at home are "two separate benefit groups" in an ARSCH
  # facility, and 8.106.500.10(C)(2) NMAC pays each $100/month. SSA's January
  # 2011 New Mexico table shows the couple supplement as $200 (2 x $100).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        is_tax_unit_head: true
        is_in_adult_residential_care: true
      person2:
        age: 66
        is_tax_unit_spouse: true
        is_in_adult_residential_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    people:
      person1:
        ssi_claim_is_joint: true
        # $725/month * 12 = $8,700/year
        ssi: 8_700
        # Person 1: SSI recipient, age 68 >= 18, in ARSCH
        nm_ssi_state_supplement_eligible: true
        # $100/month * 12 = $1,200/year per person
        nm_ssi_state_supplement: 1_200
      person2:
        ssi_claim_is_joint: true
        ssi: 8_700
        # Person 2: SSI recipient, age 66 >= 18, in ARSCH
        nm_ssi_state_supplement_eligible: true
        # $100/month * 12 = $1,200/year per person
        nm_ssi_state_supplement: 1_200

- name: Case 4, NM resident not in ARSCH facility receives no supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        is_in_adult_residential_care: false
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    people:
      person1:
        # Not in ARSCH facility: ineligible regardless of SSI receipt
        nm_ssi_state_supplement_eligible: false
        nm_ssi_state_supplement: 0

- name: Case 5, age 18 boundary in ARSCH facility is eligible.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 18
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    people:
      person1:
        # Age exactly 18: meets the 18+ requirement
        nm_ssi_state_supplement_eligible: true
        # $100/month * 12 = $1,200/year
        nm_ssi_state_supplement: 1_200

- name: Case 6, household with one eligible and one ineligible person.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_in_adult_residential_care: true
      person2:
        age: 45
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    people:
      person1:
        # Person 1: SSI recipient (disabled), age 60 >= 18, in ARSCH = eligible
        nm_ssi_state_supplement_eligible: true
        nm_ssi_state_supplement: 1_200
      person2:
        # Person 2: not aged, blind or disabled, so no SSI = ineligible even though in ARSCH
        nm_ssi_state_supplement_eligible: false
        nm_ssi_state_supplement: 0

- name: Case 7, SSI recipient in ARSCH facility but outside NM receives nothing.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    people:
      person1:
        # Wrong state: defined_for = StateCode.NM excludes non-NM residents
        nm_ssi_state_supplement_eligible: false
        nm_ssi_state_supplement: 0

- name: Case 8, ARSCH resident whose spouse fails the SSI citizenship condition.
  # The undocumented tax-unit spouse receives no SSI (8 USC 1611, 1612), so
  # is not "a recipient of supplemental security income" under
  # 8.106.500.10(A) NMAC. The citizen head still receives the supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        is_tax_unit_head: true
        is_in_adult_residential_care: true
      person2:
        age: 66
        immigration_status_str: UNDOCUMENTED
        is_tax_unit_spouse: true
        is_in_adult_residential_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    people:
      person1:
        nm_ssi_state_supplement_eligible: true
        nm_ssi_state_supplement: 1_200
      person2:
        ssi: 0
        nm_ssi_state_supplement_eligible: false
        nm_ssi_state_supplement: 0

- name: Case 9, ARSCH resident above the SSI resource limit receives nothing.
  # $3,000 of countable resources exceeds the $2,000 SSI limit, so no SSI is
  # paid and 8.106.500.10(A) NMAC bars the supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 3_000
        is_in_adult_residential_care: true
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    people:
      person1:
        ssi: 0
        nm_ssi_state_supplement_eligible: false
        nm_ssi_state_supplement: 0
