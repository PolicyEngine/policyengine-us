# Benefit = total points x point value (8.150.620.10 A NMAC): 35 a point in FFY2026 and
# 40 in FFY2027 (Point and Income Guides). Energy burden = monthly bill (annual heating
# fuel or electric bill / 12, raised to the energy standard allowance of 291 in FFY2026
# and 298 in FFY2027 when lower) / monthly countable income: 0 points below 6%, 1 from
# 6%, 2 from 11%, 3 from 16%; zero income receives 3; the bill giving more points is used
# (LHP 602); no energy points without a direct bill or with gathered wood (8.150.620.9 A).
# Propane adds 2 on the propane bill (8.150.620.9 A(2)). Income points: 3 at or below
# 100% of the guideline (8.150.620.9 B; size-one 15,650 a year), otherwise 2. Two points
# per category for a counted member 5 or younger, 60 or older, or disabled (is_disabled,
# SSDI, employment disability benefits or SSI as blind or disabled; 8.150.620.9 C).
# Wages are at the 2026 New Mexico minimum wage of 12.00 an
# hour (24,960 full time); gas of 900 is 75 a month, within common winter gas bills of 60
# to 120; electricity of 1,080 is about the EIA 2024 New Mexico average residential bill
# of 90 a month.

- name: Case 1, a bill below the allowance uses the allowance and a burden of exactly 16 percent receives 3 energy points.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        # About 35 hours a week at 12.00.
        employment_income: 21_825
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_080
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    # max(1,080 / 12, 291) / (21,825 / 12) = 291 / 1,818.75 = 0.16 -> 3 energy
    # 1,818.75 > 1,304.17 -> 2 income; 5 points x 35
    nm_liheap: 175

