- name: Case 21, IRA withdrawals count as unearned income and put a retiree over the FFY2026 limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        ssi: 0
        # Social Security of 1,200 a month.
        social_security_retirement: 14_400
        # Traditional IRA withdrawals of about 833 a month.
        taxable_ira_distributions: 10_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    # 14,400 + 10,000 retirement distributions (8.150.520.13 A NMAC)
    nm_liheap_countable_income: 24_400
    # 24,400 > 1,956 x 12 = 23,472; without the withdrawals 14,400 would be
    # eligible for 3 energy + 3 income + 2 elderly = 8 points x 35 = 280
    nm_liheap: 0
