# Benefit = total points x point value (8.150.620.10 A NMAC): 35 a point in FFY2026 and
# 40 in FFY2027 (Point and Income Guides). Energy burden = monthly heating bill (annual
# bill / 12, raised to the energy standard allowance of 291 in FFY2026 and 298 in FFY2027
# when lower) / monthly countable income: 0 points below 6%, 1 from 6%, 2 from 11%, 3
# from 16%; zero income receives 3; no energy points with heat in rent or gathered wood
# (8.150.620.9 A). Propane adds 2 (8.150.620.9 A(2)). Income points: 3 at or below 110%
# of the poverty guideline, otherwise 2 (Point and Income Guides; FFY2026 size-one cutoff
# 1,435 a month). Two points per category for a counted member 5 or younger, 60 or older,
# or disabled (8.150.620.9 C). Wages are at the 2026 New Mexico minimum wage of 12.00 an
# hour (24,960 full time); gas of 900 is 75 a month, within common winter gas bills of 60
# to 120; electricity of 1,080 is about the EIA 2024 New Mexico average residential bill
# of 90 a month.

- name: Case 1, a bill below the allowance uses the allowance and a burden of exactly 16 percent receives 3 energy points.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        # About 35 hours a week at 12.00.
        employment_income: 21_825
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_080
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    # max(1,080 / 12, 291) / (21,825 / 12) = 291 / 1,818.75 = 0.16 -> 3 energy
    # 1,818.75 > 1,435 -> 2 income; 5 points x 35
    nm_liheap: 175

- name: Case 2, a burden just below 16 percent receives 2 energy points.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 21_826
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_080
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    # 291 / (21,826 / 12) = 0.15999 -> 2 energy; 2 income; 4 points x 35
    nm_liheap: 140

- name: Case 3, a propane bill above the allowance at a burden of exactly 11 percent receives 2 energy and 2 propane points.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 36_000
      person2:
        age: 7
      person3:
        age: 9
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        heating_type: PROPANE
        # A propane-heated home whose bills average 330 a month, above the allowance.
        bottled_gas_expense: 3_960
    households:
      household:
        members: [person1, person2, person3]
        state_code: NM
  output:
    # max(3,960 / 12, 291) / (36,000 / 12) = 330 / 3,000 = 0.11 -> 2 energy; 2 propane
    # 3,000 > 2,443 (size three) -> 2 income; 6 points x 35
    nm_liheap: 210

