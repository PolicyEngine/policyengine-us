      person1:
        age: 62
      person2:
        age: 35
        is_disabled: true
        ssi: 0
        # Disability insurance benefit of 1,200 a month.
        social_security_disability: 14_400
      person3:
        age: 3
      person4:
        age: 1
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        tanf: 0
        heating_type: PROPANE
        # Propane of 150 a month, below the allowance.
        bottled_gas_expense: 1_800
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: NM
  output:
    # max(150, 291) / 1,200 = 0.243 -> 3 energy; 2 propane
    # 1,200 <= 2,947 (size four) -> 3 income
    # 2 for the children (once) + 2 for age 62 + 2 for disability = 6; 14 points x 35
    nm_liheap: 490

