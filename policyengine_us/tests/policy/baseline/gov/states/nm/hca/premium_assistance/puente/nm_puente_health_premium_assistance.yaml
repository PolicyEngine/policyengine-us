- name: Case 13, 2027 TPS holder choosing a bronze plan gets at most its premium.
  # 22,344 / 15,960 = 1.40. 9,900 before the cap. The bronze plan costs the
  # benchmark times the rating area's bronze-to-silver price at age 0:
  # 9,000 * 4,500 / 6,000 = 6,750.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: TPS
        slcsp_age_curve_amount_person: 9_000
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 22_344
        aca_fpg: 15_960
        selected_marketplace_plan_category: BRONZE
    households:
      household:
        members: [person1]
        state_code: NM
        slcsp_age_0: 6_000
        lcbp_age_0: 4_500
  output:
    nm_puente_health_plan_premium: 6_750
    nm_puente_health_premium_assistance: 6_750

- name: Case 14, 2027 joint return of an LPR and a TPS holder prices Puente Health on the TPS spouse.
  # 54,100 / 21,640 = 2.50: Table 1 share 2%. Benchmark 9,000 for the TPS
  # spouse alone. 9,000 - 0.02 * 54,100 = 9,000 - 1,082 = 7,918.
  # Puente Health subtracts the whole share because base New Mexico Premium
  # Assistance takes none of it here: with aca_magi supplied and no wages,
  # the head's Medicaid income is 0, so the 2027 Medicaid work requirement
  # (gov.aca.ineligible_coverage) keeps him from the federal credit. Case 19
  # has a federally eligible head.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 6
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        slcsp_age_curve_amount_person: 9_000
      spouse:
        age: 40
        immigration_status: TPS
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        slcsp_age_curve_amount_person: 9_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        aca_magi: 54_100
        aca_fpg: 21_640
    households:
      household:
        members: [head, spouse]
        state_code: NM
  output:
    nm_premium_assistance_eligible: false
    nm_puente_health_benchmark_premium: 9_000
    nm_puente_health_premium_assistance: 7_918

