- name: Case 17, negative income counts as zero.
  # Eligibility is supplied. aca_magi -10,000 counts as 0, so the ratio is 0
  # (under 200%: increase applies) and the Table 1 share, supplied at 5% so the
  # clamp matters, multiplies 0. 9,000 * 1.1 = 9,900, plan 9,900.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        nm_puente_health_eligible: true
        nm_puente_health_benchmark_premium: 9_000
        nm_premium_assistance_target_contribution_percentage: 0.05
        aca_magi: -10_000
        aca_fpg: 15_960
