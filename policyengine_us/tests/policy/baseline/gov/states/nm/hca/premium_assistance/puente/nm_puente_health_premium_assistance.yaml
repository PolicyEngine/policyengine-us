# Puente Health premium assistance:
#   amount = max(0, benchmark * gross_up - Table 1 share * aca_magi),
#   capped at the selected plan premium (the $0 net premium floor).
# gross_up is 1.1 below the base program's limit: up to 200% FPL in PY2026
# (every Puente enrollee, all under 100%) and under 200% in PY2027. Table 1:
# 0% below 200%; 0->2% at 200-250%; 2->5% at 250-300%; 5->8.5% at 300-400%.
# The person's annual benchmark quote is supplied (slcsp_age_curve_amount_person
# 9,000), and aca_fpg is supplied: $15,650 for 2026 and $15,960 for 2027.
# Membership and eligibility are derived from immigration status and income.
# The default plan is a silver plan at the benchmark (ratio 1.0), so the cap is
# the benchmark and hides the 10% increase; cases that show the increase select
# a silver plan at 1.1 times the benchmark.

- name: Case 1, 2026 LPR in the five-year bar at 80% FPL gets the whole benchmark.
  # 12,520 / 15,650 = 0.80. 9,000 * 1.1 - 0 = 9,900, capped at the 9,000 plan.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        slcsp_age_curve_amount_person: 9_000
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 12_520
        aca_fpg: 15_650
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_puente_health_eligible: true
    nm_puente_health_benchmark_premium: 9_000
    nm_puente_health_plan_premium: 9_000
    nm_puente_health_premium_assistance: 9_000

- name: Case 2, 2026 same household with a silver plan at 1.1 times the benchmark gets 9,900.
  # Addendum 2: the premium used is "10% above the price of the SLCSP", with a 0%
  # contribution under 100% FPL. Plan premium 9,900, so the cap doesn't bind.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        slcsp_age_curve_amount_person: 9_000
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 12_520
        aca_fpg: 15_650
        selected_marketplace_plan_benchmark_ratio: 1.1
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_puente_health_plan_premium: 9_900
    nm_puente_health_premium_assistance: 9_900

