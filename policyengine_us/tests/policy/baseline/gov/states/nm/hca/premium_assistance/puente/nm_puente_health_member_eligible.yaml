- name: Case 3, 2027 refugee at 80% FPL is a member (no Medicaid status from October 2026).
  # 12,768 / 15,960 = 0.80. Section 71109 limits Medicaid to citizens, LPRs and
  # Cuban/Haitian entrants from October 1, 2026, so a refugee adult has no
  # Medicaid to bar Puente Health.
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: REFUGEE
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 12_768
        aca_fpg: 15_960
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    is_medicaid_eligible: false
    nm_puente_health_member_eligible: true

- name: Case 4, 2026 LPR in the five-year bar at 80% FPL is a member (Section 71302).
  # 12,520 / 15,650 = 0.80. The LPR's status allows the credit, but Medicaid
  # bars them for five years, and 2026 ends the below-poverty rule that gave
  # them the credit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 12_520
        aca_fpg: 15_650
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    is_aca_ptc_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: false
    aca_ptc_below_fpl_immigration_exception: false
    nm_puente_health_member_eligible: true

- name: Case 5, 2026 LPR in the five-year bar just under 100% FPL is a member.
  # 15,649 / 15,650 = 0.99994, under the poverty line.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_649
        aca_fpg: 15_650
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_puente_health_member_eligible: true

- name: Case 6, 2026 LPR in the five-year bar at exactly 100% FPL is not a member.
  # 15,650 / 15,650 = 1.00. At the poverty line the federal credit's own income
  # test is met, so Section 71302 takes nothing away.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_650
        aca_fpg: 15_650
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    nm_puente_health_member_eligible: false

- name: Case 7, 2026 LPR past the five-year bar at 80% FPL is not a member (Medicaid instead).
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 6
    tax_units:
