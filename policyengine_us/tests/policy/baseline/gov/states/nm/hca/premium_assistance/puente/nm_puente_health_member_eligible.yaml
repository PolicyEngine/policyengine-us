        aca_fpg: 15_650
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    is_medicaid_immigration_status_eligible: true
    nm_puente_health_member_eligible: false

- name: Case 8, 2025 LPR in the five-year bar at 80% FPL is not a member (below-poverty rule still in effect).
  # 12,048 / 15,060 (the 2024 one-person guideline) = 0.80.
  period: 2025
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    tax_units:
