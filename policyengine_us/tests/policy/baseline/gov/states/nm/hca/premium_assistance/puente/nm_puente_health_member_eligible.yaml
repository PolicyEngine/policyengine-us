# Puente Health members: lawfully present non-citizens who lost the federal
# premium tax credit under Public Law 119-21 Section 71301 (status, from 2027)
# or Section 71302 (the repealed below-poverty rule, from 2026), and who
# otherwise meet the credit's conditions. aca_fpg is supplied so the income
# tests don't depend on the uprated guideline: the 2025 one-person guideline
# ($15,650) for 2026 and the 2026 one ($15,960) for 2027.

- name: Case 1, 2027 TPS holder at 250% FPL is a member (Section 71301).
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: TPS
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 39_900
        aca_fpg: 15_960
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    is_aca_ptc_immigration_status_eligible: false
    nm_puente_health_member_eligible: true

- name: Case 2, 2027 statuses Section 71301 bars from the credit are members; the rest are not.
