- name: Case 15, 2027 joint return of an LPR and a TPS holder makes only the TPS spouse a member.
  # 54,100 / 21,640 (the 2026 two-person guideline) = 2.50.
  period: 2027
  input:
    people:
      head:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 6
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      spouse:
        age: 40
        immigration_status: TPS
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        aca_magi: 54_100
        aca_fpg: 21_640
    households:
      household:
        members: [head, spouse]
        state_code: NM
  output:
    nm_puente_health_member_eligible: [false, true]

- name: Case 16, 2027 TPS holder the model counts as federally credit-eligible is not a member.
  # 39,900 / 15,960 = 2.50. Supplying pays_aca_premium makes the person
  # eligible for the federal credit despite the TPS status, so Puente Health,
  # which replaces a lost credit, does not also apply.
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: TPS
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 39_900
        aca_fpg: 15_960
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    is_aca_ptc_immigration_status_eligible: false
    is_aca_ptc_eligible: true
    nm_puente_health_member_eligible: false
    nm_puente_health_eligible: false
