        members: [person1]
        aca_magi: 12_048
        aca_fpg: 15_060
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    aca_ptc_below_fpl_immigration_exception: true
    nm_puente_health_member_eligible: false

- name: Case 9, 2027 LPR in the five-year bar at 80% FPL is a member (Section 71302 continues).
