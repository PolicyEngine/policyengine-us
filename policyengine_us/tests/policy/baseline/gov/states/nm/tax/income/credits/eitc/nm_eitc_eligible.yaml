# Conditional filer-SSN component only: HB 4 (2008), Section 1(A), physical
# page 1; HB 6 (2019), Section 13(A), physical page 40; IRC 32(c)(1)(E),
# 32(m); HB 291 (2021), Section 2(A), physical pages 5-6, and Section 4,
# physical page 7 (the NM exception applies from tax year 2021).
# Every filer has an explicit SSN-card category. Positive SSN premises assume
# timely valid issuance and inclusion on a lawful return. NONE means no SSN
# card, not no TIN. Post-2020 no-SSN cases assume otherwise lawful NM return
# identification, including any required valid ITIN; these tests do not
# validate issuance dates, return inclusion or ITINs.
# Demographic and person-to-filer ID behavior derive from actual person facts.
# Investment and marital eligibility are supplied component premises, so these
# are not full-return eligibility or cash-award tests.

- name: Case 4, 2017 filer SSN-card requirements.
  period: 2017
  input:
    people:
      person1:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: false
        ssn_card_type: CITIZEN
      person2:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: false
        ssn_card_type: NON_CITIZEN_VALID_EAD
      person3:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: false
        ssn_card_type: OTHER_NON_CITIZEN
      person4:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: false
        ssn_card_type: NONE
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SINGLE
        eitc_investment_income_eligible: true
        eitc_marital_eligible: true
      tax_unit2:
        members: [person2]
        filing_status: SINGLE
        eitc_investment_income_eligible: true
        eitc_marital_eligible: true
      tax_unit3:
        members: [person3]
        filing_status: SINGLE
        eitc_investment_income_eligible: true
        eitc_marital_eligible: true
      tax_unit4:
        members: [person4]
        filing_status: SINGLE
        eitc_investment_income_eligible: true
        eitc_marital_eligible: true
    households:
      household1:
        members: [person1]
        state_code: NM
      household2:
        members: [person2]
        state_code: NM
      household3:
        members: [person3]
        state_code: NM
      household4:
        members: [person4]
        state_code: NM
  output:
    filer_meets_eitc_identification_requirements: [true, true, false, false]
    nm_eitc_eligible: [true, true, false, false]

