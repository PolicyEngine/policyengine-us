- name: 2025 single filer aged 65 or older who can be claimed as a dependent is ineligible
  period: 2025
  input:
    people:
      filer:
        age: 70
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        nm_modified_gross_income: 5_000
    households:
      household:
        members: [filer]
        state_code: NM
  output:
    # NMSA 7-2-18: a resident 65 or over "who is not a dependent of another
    # individual".
    nm_property_tax_rebate_eligible: false

- name: 2025 joint return whose only spouse aged 65 or older can be claimed is ineligible (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 70
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        nm_modified_gross_income: 5_000
    households:
      household:
        members: [person_a, person_b]
        state_code: NM
  output:
    nm_property_tax_rebate_eligible: false

- name: 2025 joint return whose only spouse aged 65 or older can be claimed is ineligible (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
