- name: Income eligible - single
  period: 2021
  input:
    state_code: NM
    adjusted_gross_income: 74_999
    filing_status: SINGLE
    claimed_as_dependent_on_another_return: false
  output:
    nm_2021_income_rebate: 250

- name: Income ineligible - separate
  period: 2021
  input:
    state_code: NM
    adjusted_gross_income: 75_000
    filing_status: SEPARATE
    claimed_as_dependent_on_another_return: false
  output:
    nm_2021_income_rebate: 0

- name: Income eligible - joint
  period: 2021
  input:
    state_code: NM
    adjusted_gross_income: 149_999
    filing_status: JOINT
    claimed_as_dependent_on_another_return: false
  output:
    nm_2021_income_rebate: 500

- name: Income ineligible - surviving spouse
  period: 2021
  input:
    state_code: NM
    adjusted_gross_income: 150_000
    filing_status: SURVIVING_SPOUSE
    claimed_as_dependent_on_another_return: false
  output:
    nm_2021_income_rebate: 0

- name: Ineligible if depedent on another return
  period: 2021
  input:
    state_code: NM
    adjusted_gross_income: 149_999
    filing_status: JOINT
    claimed_as_dependent_on_another_return: true
  output:
    nm_2021_income_rebate: 0

- name: Joint return where only one spouse is a dependent of another taxpayer (the claimable spouse is the head)
  period: 2021
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person_a, person_b]
        state_code: NM
  output:
    # A spouse who is not a dependent may still qualify (PIT-RC instructions).
    nm_2021_income_rebate: 500

- name: Joint return where only one spouse is a dependent of another taxpayer (the claimable spouse is the spouse)
  period: 2021
  input:
    people:
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person_b, person_a]
        state_code: NM
  output:
    # A spouse who is not a dependent may still qualify (PIT-RC instructions).
    nm_2021_income_rebate: 500

- name: Joint return where both spouses are a dependent of another taxpayer
  period: 2021
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person_a, person_b]
        state_code: NM
  output:
    nm_2021_income_rebate: 0

# Historical guard regression.
# Main: HB163 (2022), section 4, PDF p13, NMSA 7-2-7.6(B)-(C).
# https://www.nmlegis.gov/Sessions/22%20Regular/final/HB0163.pdf#page=13
# Supplemental: HB2 (2022 special), section 1, PDF pp1-2, NMSA 7-2-7.5(A),(D).
# https://www.nmlegis.gov/Sessions/22%20Special/final/HB0002.pdf#page=1
# Additional: HB547 (2023), section 11, PDF pp31-32, NMSA 7-2-7.7(A)-(B).
# https://www.nmlegis.gov/Sessions/23%20Regular/final/HB0547.pdf#page=31
# Each rebate is expressly tied to the 2021 return/liability, so the 2020
# amounts are $0 + $0 + $0; tax is $1,000 - $0 = $1,000.
- name: New Mexico three 2021 rebates do not reduce 2020 tax
  period: 2020
  absolute_error_margin: 0
  input:
    state_code: NM
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    claimed_as_dependent_on_another_return: false
    claimable_as_dependent_on_another_return: false
    nm_income_tax_before_refundable_credits: 1_000
    nm_cdcc: 0
    nm_medical_expense_credit: 0
    nm_eitc: 0
    nm_low_income_comprehensive_tax_rebate: 0
    nm_property_tax_rebate: 0
  output:
    nm_2021_income_rebate: 0
    nm_additional_2021_income_rebate: 0
    nm_supplemental_2021_income_rebate: 0
    nm_refundable_credits: 0
    nm_income_tax: 1_000

# The pre-program zero must backdate to 2015 for every filing-status branch.
- name: New Mexico rebates are zero in 2015 for every filing status
  period: 2015
  absolute_error_margin: 0
  input:
    people:
      single: {}
      joint: {}
      separate: {}
      head_of_household: {}
      surviving_spouse: {}
    tax_units:
      single_unit:
        members: [single]
        filing_status: SINGLE
        adjusted_gross_income: 50_000
      joint_unit:
        members: [joint]
        filing_status: JOINT
        adjusted_gross_income: 50_000
      separate_unit:
        members: [separate]
        filing_status: SEPARATE
        adjusted_gross_income: 50_000
      head_of_household_unit:
        members: [head_of_household]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 50_000
      surviving_spouse_unit:
        members: [surviving_spouse]
        filing_status: SURVIVING_SPOUSE
        adjusted_gross_income: 50_000
    households:
      single_household:
        members: [single]
        state_code: NM
      joint_household:
        members: [joint]
        state_code: NM
      separate_household:
        members: [separate]
        state_code: NM
      head_of_household_household:
        members: [head_of_household]
        state_code: NM
      surviving_spouse_household:
        members: [surviving_spouse]
        state_code: NM
  output:
    nm_2021_income_rebate: [0, 0, 0, 0, 0]
    nm_additional_2021_income_rebate: [0, 0, 0, 0, 0]
    nm_supplemental_2021_income_rebate: [0, 0, 0, 0, 0]
