# Onset-only conditional component tests; no full-return qualification.
# These are independent annual families, not a longitudinal population cohort.
# Roles and ages compute child counts; raw person claim facts compute claimant
# status. No child-count, claimant-aggregate, or final-credit input is supplied.
# Otherwise lawful relationship/residency/support and NM return facts are
# premises; the model does not derive every IRC 152(c) condition.
# Federal and NM AGI are stipulated equal here. The zero-income claimant
# remains barred independently of the bracket; positive AGIs avoid edges.
# Exact integer-dollar outputs need no numerical tolerance.
# Final 2022 HB163 Section 5, physical page 14: tax years begin in 2023.
# https://www.nmlegis.gov/Sessions/22%20Regular/final/HB0163.pdf#page=14
# 2023 HB547 Sections 9 and 43(A), PDF pages 27-28,118, after the veto.
# https://www.nmlegis.gov/Sessions/23%20Regular/final/HB0547.pdf#page=27

- name: Case 1, 2017 otherwise qualifying child before the credit begins.
  period: 2017
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: false
        is_full_time_student: false
        is_permanently_and_totally_disabled: false
        is_parent_of_filer_or_spouse: false
        is_grandparent_of_filer_or_spouse: false
      person2:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: false
        is_full_time_student: false
        is_permanently_and_totally_disabled: false
        is_parent_of_filer_or_spouse: false
        is_grandparent_of_filer_or_spouse: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    nm_ctc_qualifying_children: 1
    every_filer_is_dependent_elsewhere: false
    nm_ctc: 0

