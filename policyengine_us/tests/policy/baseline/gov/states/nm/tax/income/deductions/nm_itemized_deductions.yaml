- name: New Mexico adopts federal itemized deductions
  period: 2023
  input:
    state_code: NM
    filing_status: SINGLE
    age_head: 35
    charitable_deduction: 5_000
    interest_deduction: 8_000
    salt_deduction: 10_000
    medical_expense_deduction: 2_000
  output:
    # Federal itemized deductions total
    total_itemized_taxable_income_deductions: 25_000
    # NM uses federal itemized deductions
    nm_itemized_deductions: 25_000
    # Should flow through to state_itemized_deductions
    state_itemized_deductions: 25_000

- name: New Mexico itemized deductions for married couple
  period: 2023
  input:
    state_code: NM
    filing_status: JOINT
    age_head: 45
    age_spouse: 43
    charitable_deduction: 10_000
    interest_deduction: 15_000
    salt_deduction: 10_000
  output:
    total_itemized_taxable_income_deductions: 35_000
    nm_itemized_deductions: 35_000
    state_itemized_deductions: 35_000

- name: New Mexico itemized deductions for head of household
  period: 2023
  input:
    state_code: NM
    filing_status: HEAD_OF_HOUSEHOLD
    age_head: 38
    charitable_deduction: 3_000
    interest_deduction: 7_000
    salt_deduction: 8_000
    medical_expense_deduction: 1_500
  output:
    total_itemized_taxable_income_deductions: 19_500
    nm_itemized_deductions: 19_500
    state_itemized_deductions: 19_500

- name: NM uses deductions after the full 2026 federal section 68 limitation.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NM
    filing_status: SINGLE
    adjusted_gross_income: 2_000_000
    taxable_income_before_itemized_deductions: 2_000_000
    total_itemized_taxable_income_deductions: 37_000
    tax_unit_itemizes: true
    state_and_local_sales_or_income_tax: 0
    real_estate_taxes: 0
  output:
    # NMSA 7-2-2(N)(2): itemized deductions allowed under the IRC.
    # $37,000 * 2/37 = $2,000 section 68 reduction, leaving $35,000.
    itemized_taxable_income_deductions_reduction: 2_000
    itemized_taxable_income_deductions: 35_000
    nm_itemized_deductions: 35_000
    nm_salt_add_back: 0

- name: NM keeps the full deduction when the 2026 federal limitation is zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NM
    filing_status: SINGLE
    adjusted_gross_income: 100_000
    taxable_income_before_itemized_deductions: 100_000
    total_itemized_taxable_income_deductions: 37_000
    tax_unit_itemizes: true
    state_and_local_sales_or_income_tax: 0
    real_estate_taxes: 0
  output:
    itemized_taxable_income_deductions_reduction: 0
    nm_itemized_deductions: 37_000
    nm_salt_add_back: 0
