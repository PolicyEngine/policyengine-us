- name: Ineligible
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 3_000
    nm_property_tax_rebate_eligible: false
    real_estate_taxes: 1_000
    rent: 200
    filing_status: SINGLE
  output:
    nm_property_tax_rebate: 0

- name: No rent or taxes
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 16_000
    nm_property_tax_rebate_eligible: true
    real_estate_taxes: 0
    rent: 0
    filing_status: SINGLE
  output:
    nm_property_tax_rebate: 0

- name: Rebate capped at 250 for joint filers
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 16_000
    nm_property_tax_rebate_eligible: true
    real_estate_taxes: 1_000
    rent: 0
    filing_status: JOINT
  output:
    nm_property_tax_rebate: 250

- name: Max tax liability of $180 for agi of 16,000 - should be 0 rebate
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 16_000
    nm_property_tax_rebate_eligible: true
    real_estate_taxes: 180
    rent: 0
    filing_status: JOINT
  output:
    nm_property_tax_rebate: 0

- name: Rebate capped at 250 for separate filers
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 16_000
    nm_property_tax_rebate_eligible: true
    real_estate_taxes: 1_000
    rent: 0
    filing_status: SEPARATE
  output:
    nm_property_tax_rebate: 125

- name: Calculation of 6% of rent # 5,000 * 0.06 - 180 = 120
  period: 2023
  input:
    state_code: NM
    nm_modified_gross_income: 16_000
    nm_property_tax_rebate_eligible: true
    real_estate_taxes: 0
    rent: 5_000
    filing_status: JOINT
  output:
    nm_property_tax_rebate: 120

- name: Zero modified gross income uses the first liability bracket
  period: 2025
  input:
    state_code: NM
    age_head: 65
    filing_status: SINGLE
    real_estate_taxes: 100
  output:
    # NMSA 7-2-18(H), $0 through $1,000: $100 paid less $20 liability.
    nm_modified_gross_income: 0
    nm_property_tax_rebate_eligible: true
    nm_property_tax_rebate: 80

- name: Exactly $1,000 stays in the first liability bracket
  period: 2025
  input:
    state_code: NM
    age_head: 65
    filing_status: SINGLE
    nm_modified_gross_income: 1_000
    real_estate_taxes: 100
  output:
    nm_property_tax_rebate: 80

- name: Income above $1,000 uses the second liability bracket
  period: 2025
  input:
    state_code: NM
    age_head: 65
    filing_status: SINGLE
    nm_modified_gross_income: 1_001
    real_estate_taxes: 100
  output:
    nm_property_tax_rebate: 75
