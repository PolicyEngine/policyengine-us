- name: No children
  period: 2023
  input:
    state_code: NM
    nm_ctc_qualifying_children: 0
    adjusted_gross_income: 10_000
    filing_status: JOINT
  output:
    nm_ctc: 0

- name: Two children with $50,000 of income - joint
  period: 2023
  input:
    state_code: NM
    nm_ctc_qualifying_children: 2
    adjusted_gross_income: 50_000
    filing_status: JOINT
  output:
    nm_ctc: 800

- name: Two children with $50,000 of income - separate
  period: 2023
  input:
    state_code: NM
    nm_ctc_qualifying_children: 2
    adjusted_gross_income: 50_000
    filing_status: SEPARATE
  output:
    nm_ctc: 400

- name: Three children with $350,001 of income - single
  period: 2023
  input:
    state_code: NM
    nm_ctc_qualifying_children: 3
    adjusted_gross_income: 350_001
    filing_status: SINGLE
  output:
    nm_ctc: 75

- name: 2025 single filer who can be claimed as a dependent gets no child income tax credit
  period: 2025
  input:
    people:
      parent:
        age: 20
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NM
  output:
    # NMSA 7-2-18.34(A): "a taxpayer who is a resident and is not a dependent
    # of another individual".
    nm_ctc: 0

- name: 2025 joint return with one claimable spouse keeps the child income tax credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    # "your spouse may still qualify to claim rebates or credits" (PIT-RC);
    # AGI $10,000 is in the first bracket: $637 per qualifying child.
    nm_ctc: 637

- name: 2025 joint return with one claimable spouse keeps the child income tax credit (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NM
  output:
    nm_ctc: 637

- name: 2025 joint return with both spouses claimable gets no child income tax credit
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    nm_ctc: 0

- name: 2025 independent filer with an otherwise qualifying child who has an ITIN gets the child income tax credit
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 5
        # An ITIN holder has no valid Social Security number.
        ssn_card_type: OTHER_NON_CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NM
  output:
    # The federal EITC needs a Social Security number (IRC 32(c)(3)(D)).
    eitc_child_count: 0
    # NMSA 7-2-18.34(J)(2) adopts the IRC 152(c) definition, which has no
    # identification number requirement.
    nm_ctc_qualifying_children: 1
    # AGI $20,000 is in the first 2025 row (PIT-RC Table 4): $637 per child.
    nm_ctc: 637

- name: 2025 independent filer with a qualifying child who has a Social Security number gets the same credit
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 5
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NM
  output:
    eitc_child_count: 1
    nm_ctc_qualifying_children: 1
    nm_ctc: 637

- name: 2025 married couple filing separately with an ITIN child gets half the credit
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 5
        ssn_card_type: OTHER_NON_CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SEPARATE
    households:
      household:
        members: [parent, child]
        state_code: NM
  output:
    # NMSA 7-2-18.34(G): each may claim "only one-half"; 637 / 2.
    nm_ctc: 318.5
