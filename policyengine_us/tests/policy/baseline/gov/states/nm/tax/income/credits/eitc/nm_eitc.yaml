- name: A dependent's capital gain does not remove New Mexico's working families tax credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 22_000
      child:
        age: 10
        is_tax_unit_dependent: true
        long_term_capital_gains: 50_000
    tax_units:
      tax_unit:
        members: [head, child]
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: NM
  output:
    # Federal EITC, one child: the 2025 maximum 4,328 (earnings 22,000
    # are under the 23,350 phase-out start). NM matches 25%: 1,082.
    # Main gives 0 for both.
    eitc: 4_328
    nm_eitc_eligible: true
    nm_eitc: 1_082

- name: Case 5, 2017 New Mexico working families credit match.
  period: 2017
  absolute_error_margin: 0.01
  input:
    # Independently known annual federal-style credit components and eligibility.
    # These component premises do not establish historical federal eligibility.
    nm_eitc_eligible: true
    eitc_maximum: 1_000
    eitc_phased_in: 1_000
    eitc_reduction: 0
    state_code: NM
  output:
    # 2008 Second Special Session HB 4, sections 1-2: 10% from tax year 2008.
    # https://www.nmlegis.gov/Sessions/08%20Special/final/HB0004.pdf#page=1
    # Known annual credit of 1,000 x 10% = 100; this is not a population claim.
    nm_eitc: 100

