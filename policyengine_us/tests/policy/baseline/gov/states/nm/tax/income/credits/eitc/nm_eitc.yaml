- name: Not eligible
  period: 2023
  input:
    nm_eitc_eligible: false
    eitc_maximum: 1_000
    eitc_phased_in: 1_000
    eitc_reduction: 200
    state_code: NM
  output:
    nm_eitc: 0

- name: $1,000 EITC with no reduction in 2023
  period: 2023
  input:
    eitc_maximum: 1_000
    nm_eitc_eligible: true
    eitc_phased_in: 1_000
    eitc_reduction: 0
    state_code: NM
  output:
    nm_eitc: 250

- name: $700 EITC in 2022
  period: 2022
  input:
    eitc_maximum: 1_000
    nm_eitc_eligible: true
    eitc_phased_in: 1_000
    eitc_reduction: 300
    state_code: NM
  output:
    nm_eitc: 140

- name: A dependent's capital gain does not remove New Mexico's working families tax credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 22_000
      child:
        age: 10
        is_tax_unit_dependent: true
        long_term_capital_gains: 50_000
    tax_units:
      tax_unit:
        members: [head, child]
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: NM
  output:
    # Federal EITC, one child: the 2025 maximum 4,328 (earnings 22,000
    # are under the 23,350 phase-out start). NM matches 25%: 1,082.
    # Main gives 0 for both.
    eitc: 4_328
    nm_eitc_eligible: true
    nm_eitc: 1_082
