- name: Joint filing, spouse no income - ineligible
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        is_disabled: false
        earned_income: 1
      spouse:
        is_tax_unit_spouse: true
        is_disabled: false
        earned_income: 0
    spm_units:
      spm_unit:
        members: [head, spouse]
        tanf: 0  
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        nm_modified_gross_income: 30_159
    households:
      household:
        members: [head, spouse]
        state_code: NM
  output:  
    nm_cdcc_eligible: false

