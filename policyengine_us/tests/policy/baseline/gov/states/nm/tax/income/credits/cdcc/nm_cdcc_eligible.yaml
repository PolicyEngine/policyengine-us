- name: Is dependent on another return
  period: 2022
  input:
    claimed_as_dependent_on_another_return: true
    state_code: NM
    earned_income: 1
    is_disabled: false
    is_tax_unit_head: true
    is_tax_unit_spouse: true
    tanf: 0
    nm_modified_gross_income: 30_159
  output:
