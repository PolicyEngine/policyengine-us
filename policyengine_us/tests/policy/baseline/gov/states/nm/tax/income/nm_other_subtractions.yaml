- name: Case 1, default nm_other_subtractions is zero
  period: 2024
  input:
    state_code: NM
  output:
    nm_other_subtractions: 0.0

- name: Case 2, nm_other_subtractions flows into nm_other_deductions_and_exemptions
  period: 2024
  input:
    state_code: NM
    nm_other_subtractions: 1_400
  output:
    nm_other_deductions_and_exemptions: 1_400
