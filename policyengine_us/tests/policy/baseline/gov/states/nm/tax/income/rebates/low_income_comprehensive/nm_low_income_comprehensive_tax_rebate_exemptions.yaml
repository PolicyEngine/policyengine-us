- name: Only normal exemptions.
  period: 2022
  input:
    state_code: NM
    exemptions_count: 2
  output:
    nm_low_income_comprehensive_tax_rebate_exemptions: 2

- name: Exemptions plus aged head and spouse get 2 + 2 = 2.
  period: 2022
  input:
    state_code: NM
    exemptions_count: 2
    age_head: 65
    age_spouse: 65
  output:
    nm_low_income_comprehensive_tax_rebate_exemptions: 6

- name: Single person who is blind.
  period: 2022
  input:
    state_code: NM
    exemptions_count: 1
    blind_head: true
  output:
    nm_low_income_comprehensive_tax_rebate_exemptions: 2

- name: 2025 single filer who can be claimed as a dependent has no rebate exemptions
  period: 2025
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NM
  output:
    # NMSA 7-2-14(A),(C); PIT-RC line 2a.
    nm_low_income_comprehensive_tax_rebate_exemptions: 0

- name: 2025 joint return with one claimable spouse drops its ordinary exemption and the dependents (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 70
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    # "the non-qualifying spouse is not eligible" (PIT-RC line 2a) and a
    # return on which a filer can be claimed has no dependents (IRC
    # 152(b)(1)), leaving 1 ordinary exemption; NMSA 7-2-14(C) still adds 2
    # for "each individual ... included in the return who is sixty-five years
    # of age or older".
    nm_low_income_comprehensive_tax_rebate_exemptions: 3

- name: 2025 joint return with one claimable spouse drops its ordinary exemption and the dependents (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 40
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 70
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NM
  output:
    nm_low_income_comprehensive_tax_rebate_exemptions: 3

- name: 2025 joint return with neither spouse claimable counts everyone plus the age-65 exemptions
  period: 2025
  input:
    people:
      person_a:
        age: 70
      person_b:
        age: 40
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    # 3 federal exemptions + 2 for the spouse aged 65 or older.
    nm_low_income_comprehensive_tax_rebate_exemptions: 5
