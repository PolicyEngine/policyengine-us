- name: Below age eligibility
  period: 2023
  input:
    state_code: NM
    age: 64
    other_medical_expenses: 30_000
    filing_status: JOINT
  output:
    nm_medical_expense_exemption: 0

- name: New Mexico senior medical exemption uses expenses paid before federal premium deductions
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    health_insurance_premiums: 6_000
    other_medical_expenses: 22_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 27_000
    nm_medical_expense_exemption: 3_000

- name: New Mexico senior exemption preserves caller-supplied medical expenses
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    itemized_medical_expenses: 28_000
  output:
    nm_medical_expense_exemption: 3_000

- name: New Mexico exemption cannot add back an SE deduction without reported premiums
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    itemized_medical_expenses: 27_999
    self_employed_health_insurance_ald: 1_000
  output:
    nm_medical_expense_exemption: 0

- name: Below expense eligibility
  period: 2023
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    other_medical_expenses: 27_999
    filing_status: JOINT
  output:
    nm_medical_expense_exemption: 0

- name: Eligible
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 28_000
    filing_status: JOINT
  output:
    nm_medical_expense_exemption: 3_000

- name: Eligible - not halved for separate filers
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 28_000
    filing_status: SEPARATE
  output:
    # Neither NMSA 7-2-5.9 nor the PIT-ADJ line 18 instructions halve the
    # exemption for married filing separately.
    nm_medical_expense_exemption: 3_000

- name: 2025 married filing separately gets the full exemption
  period: 2025
  input:
    state_code: NM
    age: 70
    medicare_enrolled: false
    other_medical_expenses: 30_000
    filing_status: SEPARATE
  output:
    # PIT-ADJ line 18: "enter $3,000 on line 18 to claim the exemption".
    nm_medical_expense_exemption: 3_000

- name: 2025 expenses of exactly $28,000 qualify under the PIT-ADJ instructions
  period: 2025
  input:
    state_code: NM
    age: 70
    medicare_enrolled: false
    other_medical_expenses: 28_000
    filing_status: SINGLE
  output:
    # PIT-ADJ line 18: expenses "of $28,000 or more". NMSA 7-2-5.9(A) says
    # expenses that "exceed" $28,000, which would give 0 here.
    nm_medical_expense_exemption: 3_000

- name: 2025 expenses one dollar under $28,000 do not qualify
  period: 2025
  input:
    state_code: NM
    age: 70
    medicare_enrolled: false
    other_medical_expenses: 27_999
    filing_status: SINGLE
  output:
    nm_medical_expense_exemption: 0

- name: Output always $3,000
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 40_000
    filing_status: SURVIVING_SPOUSE
  output:
    nm_medical_expense_exemption: 3_000

- name: New Mexico supplied subtotal and SE premiums do not create senior exemption eligibility
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    head_is_dependent_elsewhere: false
    itemized_medical_expenses: 27_999
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 27_999
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    nm_medical_expense_credit: 0
    nm_medical_expense_exemption: 0

- name: 2025 a dependent aged 65 or older does not qualify the return for the exemption
  period: 2025
  input:
    people:
      person_a:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      parent:
        age: 70
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, parent]
        filing_status: JOINT
        itemized_medical_expenses: 30_000
    households:
      household:
        members: [person_a, person_b, parent]
        state_code: NM
  output:
    # NMSA 7-2-5.9(A): "any individual sixty-five years of age or older";
    # PIT-ADJ line 18: "If you or your spouse are 65 years of age or older".
    nm_medical_expense_exemption: 0

- name: 2025 joint return with a spouse aged 65 or older gets the exemption (the older spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 70
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        itemized_medical_expenses: 30_000
    households:
      household:
        members: [person_a, person_b]
        state_code: NM
  output:
    nm_medical_expense_exemption: 3_000

- name: 2025 joint return with a spouse aged 65 or older gets the exemption (the older spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 70
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        itemized_medical_expenses: 30_000
    households:
      household:
        members: [person_b, person_a]
        state_code: NM
  output:
    nm_medical_expense_exemption: 3_000

- name: New Mexico restores the exclusion supplied with a net Schedule A subtotal
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    # Schedule A line 1 of 25,000 leaves out 6,400 of premiums taken as the
    # self-employed deduction; costs paid are 31,400, above the 28,000 floor.
    itemized_medical_expenses: 25_000
    itemized_medical_expenses_applied_exclusion: 6_400
  output:
    nm_medical_expense_exemption: 3_000

# Expenses a dependent paid. PIT-ADJ line 18 applies "if you or your spouse
# are 65 years of age or older, and you paid unreimbursed and uncompensated
# medical care expenses of $28,000 or more" for "any combination of you, your
# spouse, or your dependents" (2025 PIT-ADJ instructions, PDF pages 5-6).
# Two tax units with the same people label the senior head and then spouse.
- name: New Mexico's exemption does not count a dependent's own premiums toward $28,000
  period: 2025
  input:
    people:
      a_senior:
        age: 70
        is_tax_unit_head: true
        other_medical_expenses: 27_500
      a_partner:
        age: 60
        is_tax_unit_spouse: true
      a_son:
        age: 35
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
      b_senior:
        age: 70
        is_tax_unit_spouse: true
        other_medical_expenses: 27_500
      b_partner:
        age: 60
        is_tax_unit_head: true
      b_son:
        age: 35
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
    tax_units:
      a:
        members: [a_senior, a_partner, a_son]
      b:
        members: [b_partner, b_senior, b_son]
    households:
      a:
        members: [a_senior, a_partner, a_son]
        state_code: NM
      b:
        members: [b_partner, b_senior, b_son]
        state_code: NM
  output:
    # The filers paid 27,500; with the son's own 1,200 it would be 28,700.
    nm_medical_expense_exemption: [0, 0]

- name: New Mexico's exemption counts a policy the filers bought for a dependent
  period: 2025
  input:
    people:
      a_senior:
        age: 70
        is_tax_unit_head: true
        other_medical_expenses: 27_500
      a_partner:
        age: 60
        is_tax_unit_spouse: true
        health_insurance_premiums: 1_200
      a_son:
        age: 35
        is_tax_unit_dependent: true
      b_senior:
        age: 70
        is_tax_unit_spouse: true
        other_medical_expenses: 27_500
      b_partner:
        age: 60
        is_tax_unit_head: true
        health_insurance_premiums: 1_200
      b_son:
        age: 35
        is_tax_unit_dependent: true
    tax_units:
      a:
        members: [a_senior, a_partner, a_son]
      b:
        members: [b_partner, b_senior, b_son]
    households:
      a:
        members: [a_senior, a_partner, a_son]
        state_code: NM
      b:
        members: [b_partner, b_senior, b_son]
        state_code: NM
  output:
    nm_medical_expense_exemption: [3_000, 3_000]
