- name: Over age eligibility
  period: 2022
  input:
    age: 15
    state_code: NM
    is_tax_unit_dependent: true
  output:
    nm_cdcc_eligible_child: false

- name: Not dependent
  period: 2022
  input:
    age: 14
    state_code: NM
    is_tax_unit_dependent: false
  output:
    nm_cdcc_eligible_child: false

- name: Eligible
  period: 2022
  input:
    age: 14
    state_code: NM
    is_tax_unit_dependent: true
  output:
    nm_cdcc_eligible_child: true


- name: 2025 joint return with one claimable spouse has no eligible child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    # NMSA 7-2-18.1 counts IRC 152 dependents; IRC 152(b)(1) leaves such a
    # return none.
    nm_cdcc_eligible_child: [false, false, false]

- name: 2025 joint return with one claimable spouse has no eligible child (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NM
  output:
    # NMSA 7-2-18.1 counts IRC 152 dependents; IRC 152(b)(1) leaves such a
    # return none.
    nm_cdcc_eligible_child: [false, false, false]

- name: 2025 joint return with neither spouse claimable has an eligible child
  period: 2025
  input:
    people:
      person_a:
        age: 30
      person_b:
        age: 30
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NM
  output:
    nm_cdcc_eligible_child: [false, false, true]
