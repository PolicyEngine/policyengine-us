- name: No capital gains
  period: 2021
  input:
    filing_status: SINGLE
    long_term_capital_gains: 0
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 0

- name: 40% if capital gains if larger than $1,000 - separate filing
  period: 2021
  input:
    filing_status: SEPARATE
    long_term_capital_gains: 10_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 2_000

- name: Allows for a $1,000 max amount if 40% of capital gains is less than $1,000 - joint
  period: 2021
  input:
    filing_status: JOINT
    long_term_capital_gains: 2_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 1_000

- name: Allows for a $500 max amount if 40% of capital gains is less than $500 - separate
  period: 2021
  input:
    filing_status: SEPARATE
    long_term_capital_gains: 1_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 500

# HB0037 (2024) restricts the 40% element to business-sale gains from
# 2025-01-01; PolicyEngine does not model business-sale gains separately,
# so the 40% element is zero and only the capped element applies.

- name: 2025 single — only the capped $2,500 element applies (no business-sale modeling)
  period: 2025
  input:
    filing_status: SINGLE
    long_term_capital_gains: 500_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 2_500

- name: 2025 single with very large gains — still only the $2,500 capped element
  period: 2025
  input:
    filing_status: SINGLE
    long_term_capital_gains: 3_000_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 2_500

- name: 2025 separate — capped element halved
  period: 2025
  input:
    filing_status: SEPARATE
    long_term_capital_gains: 2_000_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 1_250

- name: 2024 above $1M — pre-HB0037 40% element still applies
  period: 2024
  input:
    filing_status: SINGLE
    long_term_capital_gains: 3_000_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 1_200_000

# "Net capital gains" follow IRC Section 1222(11): net long-term capital gain
# less any net short-term capital loss. NMSA 7-2-34(D) has adopted that
# definition since 2019 HB6, section 14, so it applies in every supported year.
# PIT-ADJ instructions (2023 and 2024): "that section defines 'net capital
# gains' as only net long-term capital gains less any net short-term capital
# losses."

- name: Short-term gains are excluded from net capital gains
  period: 2023
  input:
    filing_status: SINGLE
    long_term_capital_gains: 10_000
    short_term_capital_gains: 5_000
    state_code: NM
  output:
    # max(40% x 10,000, min(10,000, 1,000)) = 4,000; the 5,000 short-term gain
    # is not part of net capital gains.
    nm_net_capital_gains_deduction: 4_000

- name: A net short-term loss reduces the long-term gain
  period: 2024
  input:
    filing_status: SINGLE
    long_term_capital_gains: 10_000
    short_term_capital_gains: -4_000
    state_code: NM
  output:
    # Net capital gains = 10,000 - 4,000 = 6,000; 40% = 2,400.
    nm_net_capital_gains_deduction: 2_400

- name: Only short-term gains means no net capital gains
  period: 2023
  input:
    filing_status: JOINT
    long_term_capital_gains: 0
    short_term_capital_gains: 10_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 0

- name: A net long-term loss means no net capital gains
  period: 2023
  input:
    filing_status: SINGLE
    long_term_capital_gains: -2_000
    short_term_capital_gains: 5_000
    state_code: NM
  output:
    nm_net_capital_gains_deduction: 0

- name: Short-term gains are also excluded before 2023
  period: 2022
  input:
    filing_status: SINGLE
    long_term_capital_gains: 10_000
    short_term_capital_gains: 5_000
    state_code: NM
  output:
    # NMSA 7-2-34(D) (2019 HB6, section 14) already used IRC 1222(11) in 2022.
    # Net capital gains = 10,000 - max(0, -5,000) = 10,000 (the 5,000
    # short-term gain is excluded).
    # max(40% x 10,000, min(10,000, 1,000)) = max(4,000, 1,000) = 4,000.
    nm_net_capital_gains_deduction: 4_000

# Cross-spouse netting on a joint return: net capital gain is computed on the
# couple's combined long-term and short-term amounts, so one spouse's net
# short-term loss reduces the other spouse's long-term gain.

- name: Joint couple, one spouse's short-term loss partially offsets the other's long-term gain
  period: 2023
  input:
    people:
      person1:
        long_term_capital_gains: 20_000
      person2:
        short_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    # Net capital gains = 20,000 - 5,000 = 15,000.
    # max(40% x 15,000, min(15,000, 1,000)) = max(6,000, 1,000) = 6,000.
    nm_net_capital_gains_deduction: 6_000

- name: Joint couple, one spouse's short-term loss exactly cancels the other's long-term gain
  period: 2023
  input:
    people:
      person1:
        long_term_capital_gains: 8_000
      person2:
        short_term_capital_gains: -8_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    # Net capital gains = max(0, 8,000 - 8,000) = 0.
    # max(40% x 0, min(0, 1,000)) = 0; the $1,000 element is limited to the
    # net capital gain.
    nm_net_capital_gains_deduction: 0

- name: Joint couple, one spouse's short-term loss exceeds the other's long-term gain
  period: 2023
  input:
    people:
      person1:
        long_term_capital_gains: 5_000
      person2:
        short_term_capital_gains: -12_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    # Net capital gains = max(0, 5,000 - 12,000) = 0, so no deduction.
    nm_net_capital_gains_deduction: 0

- name: Joint couple, short-term gain and loss net across spouses before offsetting the long-term gain
  period: 2023
  input:
    people:
      person1:
        long_term_capital_gains: 10_000
        short_term_capital_gains: 3_000
      person2:
        short_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    # Net short-term = 3,000 - 5,000 = -2,000, a net short-term loss of 2,000.
    # Net capital gains = 10,000 - 2,000 = 8,000; 40% x 8,000 = 3,200.
    nm_net_capital_gains_deduction: 3_200
