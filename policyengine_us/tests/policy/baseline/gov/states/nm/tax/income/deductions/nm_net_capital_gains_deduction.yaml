- name: Separate couple, combined gains above the joint $2,500 cap in 2025
  period: 2025
  input:
    people:
      person1:
        long_term_capital_gains: 3_000
      person2:
        long_term_capital_gains: 1_000
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SEPARATE
      tax_unit2:
        members: [person2]
        filing_status: SEPARATE
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NM
  output:
    # Combined net capital gains = 3,000 + 1,000 = 4,000.
    # Joint deduction = min(4,000, 2,500) = 2,500 (the 40% element is zero).
    # Each spouse: 0.5 x 2,500 = 1,250 (before: min(3,000, 2,500) / 2 = 1,250
    # and min(1,000, 2,500) / 2 = 500).
    nm_net_capital_gains_deduction: [1_250, 1_250]

- name: Separate couple with a dependent in one spouse's unit, explicit marital units
  period: 2023
  input:
    people:
      person1:
        age: 40
        long_term_capital_gains: 2_000
      person2:
        age: 40
        long_term_capital_gains: 2_000
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit1:
        members: [person1, child]
        filing_status: SEPARATE
      tax_unit2:
        members: [person2]
        filing_status: SEPARATE
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [child]
    households:
      household:
        members: [person1, person2, child]
        state_code: NM
  output:
    # Combined net capital gains = 2,000 + 2,000 = 4,000.
    # Joint deduction = max(40% x 4,000, min(4,000, 1,000)) = 1,600.
    # Each spouse: 0.5 x 1,600 = 800.
    nm_net_capital_gains_deduction: [800, 800]

