- name: New Mexico supplied subtotal and SE premiums do not create senior credit eligibility
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    claimed_as_dependent_on_another_return: false
    itemized_medical_expenses: 27_999
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    # Supplied subtotal: 27,999 + 0 applied exclusion < 28,000, so no credit.
    itemized_medical_expenses: 27_999
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    nm_medical_expense_credit: 0
    nm_medical_expense_exemption: 0

- name: Independent aged spouse qualifies with computed medical expenses after the federal premium exclusion (claimable spouse is head)
  period: 2025
  input:
    people:
      claimable_spouse:
        age: 60
        medicare_enrolled: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      independent_spouse:
        age: 70
        medicare_enrolled: false
        claimable_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        health_insurance_premiums: 6_000
        other_medical_expenses: 22_000
    tax_units:
      tax_unit:
        members: [claimable_spouse, independent_spouse]
        filing_status: JOINT
        self_employed_health_insurance_ald: 1_000
    households:
      household:
        members: [claimable_spouse, independent_spouse]
        state_code: NM
  output:
    # Federal: 6,000 + 22,000 - 1,000 = 27,000; NM restores 1,000 to reach 28,000.
    # The independent spouse is 70 >= 65, so the joint credit is 2,800 / 1 = 2,800.
    itemized_medical_expenses: 27_000
    itemized_medical_expenses_applied_exclusion: 1_000
    nm_medical_expense_credit: 2_800

