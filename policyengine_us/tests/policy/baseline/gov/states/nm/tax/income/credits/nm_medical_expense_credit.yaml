- name: New Mexico credit restores the exclusion supplied with a net Schedule A subtotal
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    claimed_as_dependent_on_another_return: false
    # Schedule A line 1 of 25,000 leaves out 6,400 of premiums taken as the
    # self-employed deduction; costs paid are 31,400, above the 28,000 floor.
    itemized_medical_expenses: 25_000
    itemized_medical_expenses_applied_exclusion: 6_400
  output:
    nm_medical_expense_credit: 2_800

# Expenses a dependent paid. PIT-RC line 23 requires that "you paid
# unreimbursed and uncompensated medical care expenses of $28,000 or more",
# which "can be for the care of any combination of you, your spouse, or
# dependents" (2025 PIT-RC instructions, PDF page 9). A dependent's own
# premium payments are not the filers'. Two tax units with the same people
# label the senior head and then spouse.
- name: New Mexico's credit does not count a dependent's own premiums toward $28,000
  period: 2025
  input:
    people:
      a_senior:
        age: 70
        is_tax_unit_head: true
        other_medical_expenses: 27_500
      a_partner:
        age: 60
        is_tax_unit_spouse: true
      a_son:
        age: 35
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
      b_senior:
        age: 70
        is_tax_unit_spouse: true
        other_medical_expenses: 27_500
      b_partner:
        age: 60
        is_tax_unit_head: true
      b_son:
        age: 35
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
    tax_units:
      a:
        members: [a_senior, a_partner, a_son]
      b:
        members: [b_partner, b_senior, b_son]
    households:
      a:
        members: [a_senior, a_partner, a_son]
        state_code: NM
      b:
        members: [b_partner, b_senior, b_son]
        state_code: NM
  output:
    # The filers paid 27,500; with the son's own 1,200 it would be 28,700.
    itemized_medical_expenses: [27_500, 27_500]
    nm_medical_expense_credit: [0, 0]

- name: New Mexico's credit counts a policy the filers bought for a dependent
  period: 2025
  input:
    people:
      a_senior:
        age: 70
        is_tax_unit_head: true
        other_medical_expenses: 27_500
      a_partner:
        age: 60
        is_tax_unit_spouse: true
        # The partner pays the son's 1,200 policy.
        health_insurance_premiums: 1_200
      a_son:
        age: 35
        is_tax_unit_dependent: true
      b_senior:
        age: 70
        is_tax_unit_spouse: true
        other_medical_expenses: 27_500
      b_partner:
        age: 60
        is_tax_unit_head: true
        health_insurance_premiums: 1_200
      b_son:
        age: 35
        is_tax_unit_dependent: true
    tax_units:
      a:
        members: [a_senior, a_partner, a_son]
      b:
        members: [b_partner, b_senior, b_son]
    households:
      a:
        members: [a_senior, a_partner, a_son]
        state_code: NM
      b:
        members: [b_partner, b_senior, b_son]
        state_code: NM
  output:
    itemized_medical_expenses: [28_700, 28_700]
    nm_medical_expense_credit: [2_800, 2_800]
