- name: Below age eligibility
  period: 2023
  input:
    state_code: NM
    age: 64
    other_medical_expenses: 30_000
    claimed_as_dependent_on_another_return: false
  output:
    nm_medical_expense_credit: 0

- name: New Mexico senior medical credit uses expenses paid before federal premium deductions
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    health_insurance_premiums: 6_000
    other_medical_expenses: 22_000
    self_employed_health_insurance_ald: 1_000
    claimed_as_dependent_on_another_return: false
  output:
    # Federal: 6,000 + 22,000 - 1,000 = 27,000. NM: 27,000 + 1,000 = 28,000.
    itemized_medical_expenses: 27_000
    nm_medical_expense_credit: 2_800

- name: New Mexico senior credit preserves caller-supplied medical expenses
