    age: 65
    other_medical_expenses: 40_000
    filing_status: SINGLE
    claimed_as_dependent_on_another_return: true
  output:
    nm_medical_expense_credit: 0

- name: Joint return where only one spouse is a dependent of another taxpayer (the claimable spouse is the head)
  period: 2023
  input:
    people:
      person_a:
        age: 66
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 66
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        itemized_medical_expenses: 28_000
    households:
      household:
        members: [person_a, person_b]
        state_code: NM
  output:
    # A spouse who is not a dependent may still qualify (PIT-RC instructions).
    nm_medical_expense_credit: 2_800

