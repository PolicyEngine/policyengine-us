- name: Below age eligibility
  period: 2023
  input:
    state_code: NM
    age: 64
    other_medical_expenses: 30_000
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 0

- name: New Mexico senior medical credit uses expenses paid before federal premium deductions
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    health_insurance_premiums: 6_000
    other_medical_expenses: 22_000
    self_employed_health_insurance_ald: 1_000
    head_is_dependent_elsewhere: false
  output:
    itemized_medical_expenses: 27_000
    nm_medical_expense_credit: 2_800

- name: New Mexico senior credit preserves caller-supplied medical expenses
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    itemized_medical_expenses: 28_000
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 2_800

- name: New Mexico credit cannot add back an SE deduction without reported premiums
  period: 2025
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    itemized_medical_expenses: 27_999
    self_employed_health_insurance_ald: 1_000
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 0

- name: Below expense eligibility
  period: 2023
  input:
    state_code: NM
    age: 65
    medicare_enrolled: false
    other_medical_expenses: 27_999
    filing_status: JOINT
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 0

- name: Eligible
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 28_000
    filing_status: JOINT
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 2_800

- name: Eligible - halved for separate filers
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 28_000
    filing_status: SEPARATE
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 1_400

- name: Output always $2,800
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 40_000
    filing_status: SINGLE
    head_is_dependent_elsewhere: false
  output:
    nm_medical_expense_credit: 2_800

- name: Ineligible if dependent on another return
  period: 2023
  input:
    state_code: NM
    age: 65
    other_medical_expenses: 40_000
    filing_status: SINGLE
    head_is_dependent_elsewhere: true
  output:
    nm_medical_expense_credit: 0
