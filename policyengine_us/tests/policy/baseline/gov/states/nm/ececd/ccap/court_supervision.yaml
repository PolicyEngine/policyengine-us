# The age-19 limit continues in later years.
- name: Case 10, NM 2027-01 household applies the age-19 limit to court and delay routes.
  period: 2027-01
  input:
    people:
      person1:
        age: 18
        is_under_court_supervision: true
      person2:
        age: 19
        is_under_court_supervision: true
      person3:
        age: 18
        has_developmental_delay: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: NM
  output:
    # Court-supervised 18 < 19: eligible.
    # Court-supervised 19 is not under 19: not eligible.
    # Developmental delay 18 < 19: eligible.
    nm_ccap_eligible_child: [true, false, true]
