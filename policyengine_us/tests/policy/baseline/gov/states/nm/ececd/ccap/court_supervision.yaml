# Court supervision extends this state's age test without setting disability
# or protective-services status. Cases include both age boundaries and adults.
- name: Case 1, NM court supervision age boundaries and default status.
  period: 2025-01
  input:
    state_code: [NM, NM, NM, NM, NM, NM, NM, NM]
    age: [12, 13, 13, 17, 18, 19, 18, 40]
    is_under_court_supervision: [false, false, true, true, true, true, false, true]
  output:
    nm_ccap_eligible_child: [true, false, true, true, false, false, false, false]
    is_disabled: [false, false, false, false, false, false, false, false]
    receives_or_needs_protective_services: [false, false, false, false, false, false, false, false]

- name: Case 2, NM court supervision does not bypass child immigration eligibility.
  period: 2025-01
  input:
    state_code: NM
    age: 17
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
  output:
    nm_ccap_eligible_child: false

# 2026 Laws, Chapter 63, section 5(G), effective May 20, 2026.
- name: Case 3, NM 2026-04 age 18, court True, medical-supervision proxy False.
  period: 2026-04
  input:
    people:
      child:
        age:
          2026: 18
        is_under_court_supervision:
          2026: true
        has_developmental_delay:
          2026: false
    households:
      home:
        members:
        - child
        state_code:
          2026: NM
  output:
    nm_ccap_eligible_child: false
