# Missing-hours convention: zero is the numeric default, not evidence of part-time care.
# Benefit expectations reuse the documented full-time arithmetic in ../integration.yaml.
- name: Omitted hours use the full-time fallback for classification.
  period: 2025-01
  input:
    state_code: PA
    childcare_attending_days_per_month: 20
  output:
    pa_ccw_time_category: FULL_TIME
- name: Zero is unknown while positive hours retain the daily threshold in one population.
  period: 2025-01
  input:
    people:
      child0:
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 20
      child1:
        childcare_hours_per_day: 3
        childcare_attending_days_per_month: 20
      child2:
        childcare_hours_per_day: 4.99
        childcare_attending_days_per_month: 20
      child3:
        childcare_hours_per_day: 5
        childcare_attending_days_per_month: 20
      child4:
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
    households:
      household:
        members:
        - child0
        - child1
        - child2
        - child3
        - child4
        state_code: PA
  output:
    pa_ccw_time_category:
    - FULL_TIME
    - PART_TIME
    - PART_TIME
    - FULL_TIME
    - FULL_TIME
- name: Explicit part-time schedule overrides reported full-time hours.
  period: 2025-01
  input:
    state_code: PA
    childcare_hours_per_day: 8
    pa_ccw_time_category: PART_TIME
  output:
    pa_ccw_time_category: PART_TIME
- name: Billable care with unknown hours uses the full-time rate and copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 28
        weekly_hours_worked_before_lsr: 40
        employment_income: 24000
        immigration_status: CITIZEN
      person2:
        age: 3
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        pa_ccw_provider_type: CENTER
        pa_ccw_age_group: PRE_SCHOOL
        childcare_attending_days_per_month: 20
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 12000
    households:
      household:
        members:
        - person1
        - person2
        state_code: PA
        pa_ccw_region: 1
  output:
    pa_ccw_eligible_child:
    - false
    - true
    pa_ccw_income_eligible: true
    is_ccdf_asset_eligible: true
    pa_ccw_eligible: true
    pa_ccw_copay: 138.67
    pa_ccw_market_rate:
    - 0
    - 42.35
    pa_ccw_maximum_monthly_payment:
    - 0
    - 847
    pa_ccw: 708.33
- name: Zero hours, care days, and expenses do not create a subsidy.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 28
        weekly_hours_worked_before_lsr: 40
        employment_income: 24000
        immigration_status: CITIZEN
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
      person2:
        age: 3
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        pa_ccw_provider_type: CENTER
        pa_ccw_age_group: PRE_SCHOOL
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 0
    households:
      household:
        members:
        - person1
        - person2
        state_code: PA
        pa_ccw_region: 1
  output:
    pa_ccw: 0
