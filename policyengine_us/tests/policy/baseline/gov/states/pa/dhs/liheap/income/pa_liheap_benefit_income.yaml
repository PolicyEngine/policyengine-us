    pa_liheap_benefit_income: 6_250

# FY2026 final plan pp42,53:12000 adult wages+1200 child business=13200; subtract only2400 adult wage disregard, leaving10800.
- name: Case 3, excluded dependent wages are not deducted a second time.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 17
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
        employment_income: 6_000
        self_employment_income: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_liheap_income: 13_200
    pa_liheap_benefit_income: 10_800

# FY2026 final plan p50 prohibits source loss offsets; no wages or positive sources yields0 for both income definitions.
- name: Case 4, zero countable income cannot become negative benefit income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        self_employment_income: -6_000
        farm_operations_income: -1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_income: 0
    pa_liheap_benefit_income: 0
