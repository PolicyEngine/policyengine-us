# Source-supported Pennsylvania income and eligibility components only; no final award is asserted.

# FY2026 final plan p42:6250-20%*6250=5000 benefit income; eligibility income remains6250.
- name: Case 1, wages receive the twenty percent benefit income disregard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 6_250
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_income: 6_250
    pa_liheap_benefit_income: 5_000

