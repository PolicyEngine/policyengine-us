# FY2026 final plan page 39 expressly admits a subsidized household newly responsible for part of its primary heating cost. Explicit fact represents verified primary responsibility.
- name: Case 6, a verified separate primary obligation restores subsidized renter eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 120
        pa_tanf: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
        has_heating_expense: true
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_eligible: true

