  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        pa_tanf: 0
        pre_subsidy_electricity_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_eligible: false

