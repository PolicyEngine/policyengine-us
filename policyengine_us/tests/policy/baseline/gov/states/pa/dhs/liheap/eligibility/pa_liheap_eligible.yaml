# Source-supported Pennsylvania income and eligibility components only; no final award is asserted.

# FY2026 final plan pages 10 and 51: the 23,475 ceiling is inclusive. The federal plan, page 8, has no resource test. Asset balances are not income.
- name: Case 1, exact opening income ceiling qualifies without an asset test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 23_475
        bank_account_assets: 1_000_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_income: 23_475
    pa_liheap_income_limit: 23_475
    pa_liheap_eligible: true

# FY2026 final plan pages 42 and 51: 23,476 exceeds 23,475 even though the 20% wage disregard would lower benefit income. SNAP does not confer categorical eligibility.
- name: Case 2, gross income above the limit fails despite the benefit wage disregard and SNAP.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 23_476
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
        snap: 6_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_income: 23_476
    pa_liheap_income_limit: 23_475
    pa_liheap_eligible: false

# FY2026 final plan pages 38-39 permit indirect primary heating responsibility in unsubsidized rent.
- name: Case 3, unsubsidized heat in rent qualifies with no separate fuel bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        pa_tanf: 0
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_eligible: true

# FY2026 final plan pages 38-39 exclude income-based rent that includes heat unless a primary-fuel obligation is established.
- name: Case 4, subsidized heat in rent without a separate primary obligation fails.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        pa_tanf: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_eligible: false

# FY2026 final plan pages 38-39: the public housing flag independently approximates income-based rent including heat.
- name: Case 5, public housing also applies the heat in rent restriction.
  period: 2026
  input:
