- name: Case 1, no assets.
  period: 2024-01
  input:
    spm_unit_cash_assets: 0
    state_code: PA
  output:
    pa_tanf_resources_eligible: true

- name: Case 2, assets well below limit.
  period: 2024-01
  input:
    spm_unit_cash_assets: 500
    state_code: PA
  output:
    pa_tanf_resources_eligible: true

- name: Case 3, assets just below limit.
  period: 2024-01
  input:
    spm_unit_cash_assets: 999
    state_code: PA
  output:
    pa_tanf_resources_eligible: true

- name: Case 4, assets exactly at limit.
  period: 2024-01
  input:
    spm_unit_cash_assets: 1_000
    state_code: PA
  output:
    pa_tanf_resources_eligible: true

- name: Case 5, assets just above limit.
  period: 2024-01
  input:
    spm_unit_cash_assets: 1_001
    state_code: PA
  output:
    pa_tanf_resources_eligible: false

- name: Case 6, assets well above limit.
  period: 2024-01
  input:
    spm_unit_cash_assets: 5_000
    state_code: PA
  output:
    pa_tanf_resources_eligible: false

# 650.46 + 299.64 + 49.90 = 1,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 1,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.90
    state_code: PA
  output:
    pa_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.91 = 1,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.91
    state_code: PA
  output:
    pa_tanf_resources_eligible: false
