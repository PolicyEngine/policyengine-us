# Source-supported Pennsylvania income and eligibility components only; no final award is asserted.

# FY2026 final plan page 53 excludes wages of dependent children under 18; page 50 prohibits loss offsets. Five independent one-person units test the age and dependency boundaries.
- name: Case 1, dependent child wage exemption ends at age eighteen and needs dependency.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [PA, PA, PA, PA, PA]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200, 1_200, 1_200]
    age: [17, 17, 18, 40, 40]
    is_tax_unit_dependent: [true, false, true, false, false]
    employment_income: [6_000, 6_000, 6_000, -1_000, 0]
  output:
    pa_liheap_countable_employment_income: [0, 6_000, 6_000, 0, 0]

# FY2026 final plan page 49, section 601.82(1), counts wages for services on
# behalf of an employer. An adult's 30,000 of military basic pay counts as
# wages; a dependent 17-year-old's 6,000 is excluded like other child wages.
- name: Case 2, military basic pay counts as wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [PA, PA]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
    age: [25, 17]
    is_tax_unit_dependent: [false, true]
    military_basic_pay: [30_000, 6_000]
  output:
    pa_liheap_countable_employment_income: [30_000, 0]
