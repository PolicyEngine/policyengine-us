# Source-supported Pennsylvania income and eligibility components only; no final award is asserted.

# FY2026 final plan pp49-50: 12000 wages +2400+1200+600+1200 existing net profits =17400. No second business expense adjustment.
- name: Case 1, adult wages and existing positive business sources count once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_400
        sstb_self_employment_income: 1_200
        farm_operations_income: 600
        partnership_s_corp_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pa_tanf: 0
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_liheap_income: 17_400

