# FY2026 final plan page 52, section 601.84(10), and federal plan page 6 exclude
# Medicare premiums deducted from Social Security. The 2026 standard Part B
# premium is 202.90 a month (2,434.80 a year); both incomes are above the
# Medicare Savings Program limits, so each person pays it.
# Household 1: 24,000 - 2,434.80 = 21,565.20, under the 23,475 limit.
# Household 2: a 1,700 a month pension (20,400) and a 150 a month Social
# Security benefit; max(1,800 - 2,434.80, 0) = 0, so the premium cannot reduce
# the pension. 20,400 + 0 = 20,400.
- name: Case 14, Social Security counts net of the Medicare Part B premium without offsetting other income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [PA, PA]
    age: [67, 70]
    immigration_status: [CITIZEN, CITIZEN]
    social_security_retirement: [24_000, 1_800]
    pension_income: [0, 20_400]
    medicare_part_b_premium: [2_434.8, 2_434.8]
    ssi: [0, 0]
    tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
  output:
    pa_liheap_income: [21_565.2, 20_400]
    pa_liheap_income_limit: [23_475, 23_475]
    pa_liheap_eligible: [true, true]

# FY2026 final plan page 51, section 601.82(4)(viii), counts pensions. Military
# retirement pay and railroad retirement annuities are separate inputs from
# pension_income. Household 1: a 2,500 a month military retirement annuity,
# 30,000, is over the 23,475 limit. Household 2: a 1,850 a month railroad
# annuity, 22,200. Handbook 650.6(10) excludes Medicare premiums deducted from
# Railroad Retirement; plan section 601.84(10) names only Social Security, and
# the handbook governs. With the 2026 standard Part B premium of 2,434.80 a
# year: 22,200 - 2,434.80 = 19,765.20, under the 23,475 limit.
- name: Case 15, military and railroad annuities count as pensions, railroad net of the Medicare premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [PA, PA]
    age: [62, 67]
    immigration_status: [CITIZEN, CITIZEN]
    military_retirement_pay: [30_000, 0]
    railroad_benefits: [0, 22_200]
    medicare_part_b_premium: [0, 2_434.8]
    ssi: [0, 0]
    tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
  output:
    pa_liheap_income: [30_000, 19_765.2]
    pa_liheap_eligible: [false, true]

