# FY2026 final plan p10 also prints FY2025 size1=22590,size8=79080,size10=95220,+8070 atsize11. This narrow historical threshold check does not verify the historical program.
- name: Case 3, earlier year backfill uses its own prior year guideline.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [PA, PA, PA]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200]
    pa_liheap_household_size: [1, 8, 11]
  output:
    pa_liheap_income_limit: [22_590, 79_080, 103_290]

# An empty qualified household cannot use the one-person guideline.
- name: Case 4, no qualified member has no income ceiling.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [PA]
    heating_type: [NATURAL_GAS]
    gas_expense: [1_200]
    pa_liheap_household_size: [0]
  output:
    pa_liheap_income_limit: [0]
