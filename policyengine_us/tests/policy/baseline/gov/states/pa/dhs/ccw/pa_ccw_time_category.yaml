# Unit tests for pa_ccw_time_category
# Tests FT/PT classification based on childcare_hours_per_day
# Formula: hours_per_day >= 5 -> FULL_TIME, else PART_TIME

- name: Case 1, full time 8 hours per day.
  period: 2025-01
  input:
    people:
      person1:
        age: 4
        childcare_hours_per_day: 8
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_ccw_time_category: [FULL_TIME]

- name: Case 2, part time 4 hours per day.
  period: 2025-01
  input:
    people:
      person1:
        age: 4
        childcare_hours_per_day: 4
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_ccw_time_category: [PART_TIME]

- name: Case 3, exactly 5 hours per day is full time.
  period: 2025-01
  input:
    people:
      person1:
        age: 4
        childcare_hours_per_day: 5
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # 5 >= 5 -> FULL_TIME
    pa_ccw_time_category: [FULL_TIME]

- name: Case 4, 3 hours per day is part time.
  period: 2025-01
  input:
    people:
      person1:
        age: 4
        childcare_hours_per_day: 3
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_ccw_time_category: [PART_TIME]

- name: Case 5, unknown hours retain full-time pricing.
  period: 2025-01
  input:
    people:
      person1:
        age: 4
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Zero is the unknown-hours input default, so use FULL_TIME.
    pa_ccw_time_category: [FULL_TIME]

# Alternate hours use reported attendance frequency; thresholds remain state-specific.
- name: Case 6, ten weekly hours over five care days is a short day.
  period: 2026-01
  input:
    state_code: PA
    age: 3
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    pa_ccw_time_category: PART_TIME
- name: Case 7, monthly attendance supplies frequency for weekly hours.
  period: 2026-01
  input:
    state_code: PA
    age: 3
    childcare_hours_per_week: 10
    childcare_attending_days_per_month: 20
  output:
    pa_ccw_time_category: PART_TIME
- name: Case 8, weekly hours at the daily threshold qualify for full days.
  period: 2026-01
  input:
    state_code: PA
    age: 3
    childcare_hours_per_week: 25
    childcare_days_per_week: 5
  output:
    pa_ccw_time_category: FULL_TIME
- name: Case 9, reported daily hours take precedence over weekly conversion.
  period: 2026-01
  input:
    state_code: PA
    age: 3
    childcare_hours_per_day: 5
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    pa_ccw_time_category: FULL_TIME
- name: Case 10, care days without hours retain the full-time fallback.
  period: 2026-01
  input:
    state_code: PA
    age: 3
    childcare_days_per_week: 5
  output:
    pa_ccw_time_category: FULL_TIME
