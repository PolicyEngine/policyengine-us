- name: 2025 single filer who can be claimed as a dependent: Pennsylvania tax forgiveness with a child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        pa_tax_forgiveness_parent_qualifies: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      child_1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child_1]
    households:
      household:
        members: [person_a, child_1]
        state_code: PA
  output:
    # A dependent child is a child who is the dependent of a claimant for
    # IRC 151 (Tax Reform Code 301(e.1)); IRC 152(b)(1) leaves none here.
    # $8,000 is $1,500 over the $6,500 base: 6 steps of $250, 40% forgiven
    # of $245.60.
    pa_tax_forgiveness_rate: 0.4
    pa_tax_forgiveness_amount: 98.24

