- name: PA forgiveness amount is rate times eligibility income.
  period: 2021
  input:
    state_code: PA
    pa_income_tax_before_forgiveness: 2
    pa_tax_forgiveness_rate: 0.5
  output:
    pa_tax_forgiveness_amount: 1


- name: 2025 single filer who can be claimed as a dependent: Pennsylvania tax forgiveness
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        employment_income: 3000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: PA
  output:
    # Schedule SP: a dependent on another's federal return cannot claim Tax
    # Forgiveness unless the claiming parent qualifies (not set here).
    pa_tax_forgiveness_eligible_share: 0
    pa_tax_forgiveness_amount: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent: Pennsylvania tax forgiveness (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        employment_income: 3000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 3000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: PA
  output:
    # The spouses must file separately; the eligible spouse claims it on
    # their own $3,000 x 3.07% = $92.10, using joint eligibility income
    # ($6,000, under the $13,000 married base: 100%).
    pa_tax_forgiveness_eligible_share: 0.5
    pa_tax_forgiveness_amount: 92.1

