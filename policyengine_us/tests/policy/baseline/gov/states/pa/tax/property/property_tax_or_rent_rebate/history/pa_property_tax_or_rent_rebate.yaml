- name: Case 3, a sole wage earner receives the 2026 base rebate from raw financial facts.
  period: 2026
  # Stipulate $50,000 of gross wages as the only income, no payroll deductions,
  # and $2,000 of qualifying taxes on the sole full-year primary residence.
  # Wages count in full (PA-1000 line 11a); income exceeds the separate
  # $33,390 supplement ceiling. No programme-income or eligibility input
  # supplies the result, and the case does not establish actual receipt.
  # https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/ptrr/documents/2025_pa-1000_inst.pdf#page=8
  input:
    people:
      person1:
        age: 65
        tax_unit_role_input: HEAD
        employment_income_before_lsr: 50_000
        real_estate_taxes: 2_000
        rent: 0
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate: 380
    pa_property_tax_or_rent_rebate_income: 50_000
    pa_property_tax_or_rent_rebate_eligible: true
