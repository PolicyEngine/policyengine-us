- name: 2025 joint return on which neither spouse can be claimed: Working Pennsylvanians credit without a child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        employment_income: 1500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
      person_b:
        age: 30
        employment_income: 1500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
    tax_units:
