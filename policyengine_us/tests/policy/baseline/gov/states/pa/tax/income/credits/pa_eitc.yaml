- name: No federal EITC, no PA credit
  period: 2025
  absolute_error_margin: 1
  input:
    state_code: PA
    eitc: 0
  output:
    pa_eitc: 0

- name: Basic PA EITC - 10% match of federal EITC
  period: 2025
  absolute_error_margin: 1
  input:
    state_code: PA
    eitc: 1_000
  output:
    pa_eitc: 100

- name: PA EITC with higher federal EITC amount
  period: 2025
  absolute_error_margin: 1
  input:
    state_code: PA
    eitc: 7_430
  output:
    pa_eitc: 743


- name: 2025 single filer who can be claimed as a dependent: Working Pennsylvanians credit without a child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        employment_income: 3000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: PA
  output:
    # 10% of the federal EITC, which IRC 32(c)(1)(A)(ii)(III) denies a childless
    # return with a filer who can be claimed as a dependent.
    pa_eitc: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent: Working Pennsylvanians credit without a child (the claimable spouse is the head)
