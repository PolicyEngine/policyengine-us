- name: Case 1, military pension benefits are excluded from PA tax forgiveness eligibility income per PA-40 SP.
  period: 2025
  input:
    state_code: PA
    employment_income: 5_000
    military_retirement_pay: 30_000
  output:
    pa_eligibility_income: 5_000

- name: Case 2, military retirement survivor benefits are included in PA tax forgiveness eligibility income per PA-40 SP.
  period: 2025
  input:
    state_code: PA
    employment_income: 5_000
    military_retirement_pay_survivors: 10_000
  output:
    pa_eligibility_income: 15_000

# Eligibility income counts "all other income received in the form of cash
# and property from any other source", including gifts of cash, unless
# specifically excluded (PIT Guide, Tax Forgiveness, page 5; 72 P.S.
# 7301(o.2)). The exclusion for "payments made by employers or labor unions
# for programs covering ... strike benefits" reaches payments into a strike
# benefit program: the poverty income regulation, 61 Pa. Code 101.1 (i)(F),
# reads it as payments "by employers to labor unions", and (ii) counts gifts
# and other income its (iii) list leaves in. Schedule SP (2025) counts
# payments from persons outside the household (line 10) and gifts (line 5),
# so the strike benefits a union pays count.
- name: Case 3, strike benefits are PA tax forgiveness eligibility income though not PA taxable income.
  period: 2025
  input:
    state_code: PA
    employment_income: 5_000
    strike_benefits: 4_000
  output:
    pa_eligibility_income: 9_000

- name: Case 4, strike benefits the union meant as gifts are eligibility income too.
  period: 2025
  input:
    state_code: PA
    employment_income: 5_000
    strike_benefits: 4_000
    tax_exempt_strike_benefits: 1_500
  output:
    pa_eligibility_income: 9_000
