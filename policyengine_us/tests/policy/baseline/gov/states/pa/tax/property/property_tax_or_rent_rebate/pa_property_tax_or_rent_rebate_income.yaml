- name: Case 10, half of the State Supplementary Payment is counted.
  period: 2026
  input:
    people:
      person1:
        age: 80
        ssi: 0
        # The 639.30 personal care home supplement for 12 months.
        pa_ssp: 7_671.6
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # PA-1000 Line 4: one-half of the State Supplementary Payment.
    pa_property_tax_or_rent_rebate_income: 3_835.8

- name: Taxable disability benefits count once, through federal AGI.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        disability_benefits: 10_000
        tax_exempt_disability_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Federal AGI holds the taxable 6,000 and line 11 the exempt 4,000.
    adjusted_gross_income: 6_000
    pa_property_tax_or_rent_rebate_income: 10_000
