- name: Case 1, federal AGI is included in rebate income.
  period: 2025
  input:
    people:
      person1:
        age: 65
        # Rebate income counts computed ssi and pa_ssp; pin them to zero so
        # each case isolates its intended income source.
        ssi: 0
        pa_ssp: 0
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 30_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 30_000

- name: Case 2, Social Security income is half-counted.
  period: 2025
  input:
    people:
      person1:
        age: 65
        social_security: 40_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 20_000

- name: Case 3, SSI and railroad benefits are half-counted.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 2_000
        pa_ssp: 0
        railroad_benefits: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 6_000

- name: Case 3, entered as the tier 1 part, gives the same income.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 2_000
        pa_ssp: 0
        railroad_social_security_equivalent_benefits: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Combined income = 10,000 / 2 = 5,000, below the 25,000 base amount, so
    # federal AGI holds none of the tier 1 benefits (IRC 86). Section 1303,
    # "Income" (2), and the SSI rule: half of 2,000 + 10,000 = 6,000.
    adjusted_gross_income: 0
    pa_property_tax_or_rent_rebate_income: 6_000

- name: Case 3a, half of all railroad benefits count, tier 2 included, and once.
  period: 2025
  input:
    people:
      person1:
        age: 65
        railroad_social_security_equivalent_benefits: 10_000
        taxable_railroad_pension_benefits: 10_000
        tax_exempt_railroad_pension_benefits: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Combined income = 10,000 + 10,000 / 2 = 15,000, below the 25,000 base
    # amount, so none of the tier 1 benefits is taxable (IRC 86) and federal
    # AGI is the 10,000 taxable part of tier 2 (IRC 72(r)).
    # Taxpayer Relief Act section 1303, "Income" (2): 50% of railroad
    # retirement benefits. The 10,000 in federal AGI comes out, and half of
    # 10,000 + 10,000 + 2,000 goes in: 10,000 - 10,000 + 11,000 = 11,000.
    adjusted_gross_income: 10_000
    pa_property_tax_or_rent_rebate_income: 11_000

- name: Case 3b, taxable railroad benefits in federal AGI give way to half of the total.
  period: 2025
  input:
    people:
      person1:
        age: 65
        railroad_social_security_equivalent_benefits: 20_000
        taxable_railroad_pension_benefits: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Combined income = 30,000 + 20,000 / 2 = 40,000. IRC 86(a)(2): the lesser
    # of 85% x 20,000 = 17,000 and 85% x (40,000 - 34,000) + 4,500 = 9,600,
    # so 9,600 of tier 1 is taxable and federal AGI is 39,600.
    # Section 1303, "Income" (2): all 39,600 in federal AGI comes out, and half
    # of 20,000 + 30,000 goes in: 39,600 - 39,600 + 25,000 = 25,000.
    adjusted_gross_income: 39_600
    pa_property_tax_or_rent_rebate_income: 25_000

- name: Case 4, tax-exempt interest and retirement income are included.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        tax_exempt_interest_income: 2_000
        tax_exempt_pension_income: 3_000
        tax_exempt_retirement_distributions: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 19_000

- name: Case 5, dependent Social Security income is excluded.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
      person2:
        age: 10
        social_security: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 0

- name: Case 6, CSRS income is reduced by the PA-1000 Line 12 exclusion.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 8_568

- name: Case 7, represented PA-1000 Line 11 income sources are included.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        gambling_winnings: 1_000
        alimony_income: 2_000
        workers_compensation: 3_000
        disability_benefits: 4_000
        # Not in federal AGI (a policy the person paid for), so counted on
        # line 11. A taxable part would be in adjusted_gross_income.
        tax_exempt_disability_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 20_000

- name: Case 8, CSRS exclusion is capped by each recipient's CSRS income.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 5_000
      person2:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 8_568

