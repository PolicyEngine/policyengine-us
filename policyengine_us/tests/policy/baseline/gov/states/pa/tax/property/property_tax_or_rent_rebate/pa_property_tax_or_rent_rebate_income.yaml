- name: Case 1, federal AGI is included in rebate income.
  period: 2025
  input:
    people:
      person1:
        age: 65
        # Rebate income counts computed ssi and pa_ssp; pin them to zero so
        # each case isolates its intended income source.
        ssi: 0
        pa_ssp: 0
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 30_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 30_000

- name: Case 2, Social Security income is half-counted.
  period: 2025
  input:
    people:
      person1:
        age: 65
        social_security: 40_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 20_000

- name: Case 3, SSI and tier 1 railroad benefits are half-counted.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 2_000
        pa_ssp: 0
        # Line 5: Railroad Retirement Tier 1 benefits. None of the $10,000
        # is taxable federally (provisional income $5,000).
        railroad_social_security_equivalent_benefits: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 6_000

- name: Case 4, tax-exempt interest and retirement income are included.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        tax_exempt_interest_income: 2_000
        tax_exempt_pension_income: 3_000
        tax_exempt_retirement_distributions: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 19_000

- name: Case 5, dependent Social Security income is excluded.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
      person2:
        age: 10
        social_security: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 0

- name: Case 6, CSRS income is reduced by the PA-1000 Line 12 exclusion.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 8_568

- name: Case 7, represented PA-1000 Line 11 income sources are included.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        gambling_winnings: 1_000
        alimony_income: 2_000
        workers_compensation: 3_000
        disability_benefits: 4_000
        # Not in federal AGI (a policy the person paid for), so counted on
        # line 11. A taxable part would be in adjusted_gross_income.
        tax_exempt_disability_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 20_000

- name: Case 8, CSRS exclusion is capped by each recipient's CSRS income.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 5_000
      person2:
        age: 65
        ssi: 0
        pa_ssp: 0
        csrs_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 8_568

- name: Case 9, life insurance benefits receive the death benefit exclusion.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        life_insurance_benefits: 7_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    pa_property_tax_or_rent_rebate_income: 12_000

- name: Case 10, half of the State Supplementary Payment is counted.
  period: 2026
  input:
    people:
      person1:
        age: 80
        ssi: 0
        # The 639.30 personal care home supplement for 12 months.
        pa_ssp: 7_671.6
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # PA-1000 Line 4: one-half of the State Supplementary Payment.
    pa_property_tax_or_rent_rebate_income: 3_835.8

- name: Taxable disability benefits count once, through federal AGI.
  period: 2025
  input:
    people:
      person1:
        age: 65
        ssi: 0
        pa_ssp: 0
        disability_benefits: 10_000
        tax_exempt_disability_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Federal AGI holds the taxable 6,000 and line 11 the exempt 4,000.
    adjusted_gross_income: 6_000
    pa_property_tax_or_rent_rebate_income: 10_000

- name: Tier 1 railroad benefits count at half and Tier 2 benefits in full, once each.
  period: 2025
  input:
    people:
      person1:
        age: 70
        ssi: 0
        pa_ssp: 0
        railroad_social_security_equivalent_benefits: 20_000
        taxable_railroad_pension_benefits: 30_000
        tax_exempt_railroad_pension_benefits: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    # Provisional income 30,000 + 50% x 20,000 = 40,000; taxable tier 1
    # benefits min(85% x 20,000, 85% x (40,000 - 34,000) + 4,500) = 9,600.
    adjusted_gross_income: 39_600
    # Line 5: 50% x 20,000 of Tier 1 benefits. Line 6: the gross 32,000 of
    # Tier 2 benefits. Federal AGI's 9,600 of taxable Tier 1 benefits comes
    # out, since line 5 counts them.
    pa_property_tax_or_rent_rebate_income: 42_000
