- name: A Utah owner who also rents counts only the renter's credit.
  # Same household as Case 7 of ut_homeowner_renter_relief.yaml. Counties
  # apply the $600 homeowner's credit to the property tax bill.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        employment_income:
          2024: 10_000
          2025: 10_000
        pre_subsidy_rent: 10_000
        real_estate_taxes: 600
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2024: UT
          2025: UT
  output:
    ut_homeowner_renter_relief: 1_550
    ut_renters_credit: 950
    ut_homeowners_credit: 600
    state_property_tax_refunds: 950

