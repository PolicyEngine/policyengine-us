# Each payment case gives a high earner one refund as an input, so no
# means-tested benefit moves and both benefit totals equal the refund.

- name: North Dakota's renter's refund counts in both benefit totals.
  period: 2026
  input:
    people:
      adult:
        age: 40
        employment_income: 500_000
    tax_units:
      tax_unit:
        members: [adult]
        nd_renters_refund: 600
    spm_units:
      spm_unit:
        members: [adult]
    households:
      household:
        members: [adult]
        state_code: ND
  output:
    state_property_tax_refunds: 600
    household_state_benefits: 600
    household_benefits: 600
    spm_unit_benefits: 600

- name: The renter's refund from North Dakota's worked example reaches household state benefits.
  # Same household as Case 1 of nd_renters_refund.yaml. North Dakota pays no
  # other benefit in household_state_benefits.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        rent: 9_600
    tax_units:
      tax_unit:
        members: [person1]
        nd_renters_refund_income: 35_000
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_renters_refund: 520
    state_property_tax_refunds: 520
    household_state_benefits: 520

