      ma_household:
        members: [massachusetts]
        state_code: MA
      fl_household:
        members: [florida]
        state_code: FL
  output:
    # CO: 750 Cash Back only; MA: 500 premium pay + 100 62F; FL: none.
    state_income_tax_rebate_adjustment: [750, 600, 0]
