        members: [colorado]
        co_sales_tax_refund: 56
        co_tabor_cash_back: 750
        ma_taxpayer_refund_rebate: 100
      ma_unit:
        members: [massachusetts]
        co_sales_tax_refund: 56
        co_tabor_cash_back: 750
        ma_taxpayer_refund_rebate: 100
      fl_unit:
