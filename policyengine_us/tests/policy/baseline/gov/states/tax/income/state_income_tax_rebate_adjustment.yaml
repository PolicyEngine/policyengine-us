    va_spouse_tax_adjustment: 50
    va_rebate: 200
  output:
    state_income_tax_rebate_adjustment: 200

- name: Virginia calculated rebate equals its effect on final tax
  # Other credits, the spouse adjustment and refundable credits limit
  # va_rebate. With no income, va_non_refundable_eitc is 300.
  # 2024 single: rebate = min(200, max(1,000 - 300 - 0 - 0, 0)) = 200;
  # adjustment = max(1,000 - 300, 0) - max(1,000 - 500, 0) = 200.
  period: 2024
  input:
    state_code: VA
    filing_status: SINGLE
    va_income_tax_before_non_refundable_credits: 1_000
    va_spouse_tax_adjustment: 0
    va_refundable_credits: 0
  output:
    va_rebate: 200
    state_income_tax_rebate_adjustment: 200

- name: Refundable credits limit Virginia's calculated rebate
  # 2024 single; va_non_refundable_eitc is 300 (no income).
  # rebate = min(200, max(1,000 - 300 - 0 - 600, 0)) = 100;
  # adjustment = max(1,000 - 300, 0) - max(1,000 - 400, 0) = 100.
  period: 2024
  input:
    state_code: VA
    filing_status: SINGLE
    va_income_tax_before_non_refundable_credits: 1_000
    va_spouse_tax_adjustment: 0
    va_refundable_credits: 600
  output:
    va_rebate: 100
    state_income_tax_rebate_adjustment: 100

