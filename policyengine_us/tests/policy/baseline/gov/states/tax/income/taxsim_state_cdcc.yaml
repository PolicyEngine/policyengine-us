- name: OH CDCC is included in the state CDCC aggregate from 2021
  period: 2021
  input:
    people:
      parent:
        age: 35
    tax_units:
      tax_unit:
        members: [parent]
        oh_cdcc: 200
    households:
      household:
        members: [parent]
        state_code: OH
  output:
    taxsim_state_cdcc: 200

- name: OH CDCC is not counted before 2021
  period: 2020
  input:
    people:
      parent:
        age: 35
    tax_units:
      tax_unit:
        members: [parent]
        oh_cdcc: 200
    households:
      household:
        members: [parent]
        state_code: OH
  output:
    taxsim_state_cdcc: 0


- name: Case 3, 2017 NJ CDCC component reporting preserves liability treatment.
  period: 2017
  absolute_error_margin: 0.01
  input:
    # Known allowed federal credit and precredit tax isolate composition.
    # These inputs do not derive full entitlement or bracket-schedule tax.
    # NJ AGI is above the filing threshold; other refundable credits are zero.
    # The report sums configured components; raw NJ credit can exceed tax used.
    # P.L.2018 c.45 sections 5 and 12; P.L.2021 c.308 sections 1 and 2.
    people:
      person1: {age: 40, is_tax_unit_head: true}
      person2: {age: 6, is_tax_unit_dependent: true}
      person3: {age: 8, is_tax_unit_dependent: true}
      person4: {age: 40, is_tax_unit_head: true}
      person5: {age: 6, is_tax_unit_dependent: true}
      person6: {age: 8, is_tax_unit_dependent: true}
      person7: {age: 40, is_tax_unit_head: true}
      person8: {age: 6, is_tax_unit_dependent: true}
      person9: {age: 8, is_tax_unit_dependent: true}
    tax_units:
      tax_unit1:
        members: [person1, person2, person3]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 60_000
        nj_agi: 60_000
        nj_main_income_tax: 0
        nj_property_tax_credit: 0
        nj_eitc: 0
        nj_ctc: 0
      tax_unit2:
        members: [person4, person5, person6]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 60_000
        nj_agi: 60_000
        nj_main_income_tax: 50
        nj_property_tax_credit: 0
        nj_eitc: 0
        nj_ctc: 0
      tax_unit3:
        members: [person7, person8, person9]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 60_000
        nj_agi: 60_000
        nj_main_income_tax: 200
        nj_property_tax_credit: 0
        nj_eitc: 0
        nj_ctc: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: NJ
      household2:
        members: [person4, person5, person6]
        state_code: NJ
      household3:
        members: [person7, person8, person9]
        state_code: NJ
  output:
    nj_cdcc: [0, 0, 0]
    nj_non_refundable_credits: [0, 0, 0]
    nj_refundable_credits: [0, 0, 0]
    nj_income_tax_before_refundable_credits: [0, 50, 200]
    nj_income_tax: [0, 50, 200]
    taxsim_state_cdcc: [0, 0, 0]
    state_cdcc: [0, 0, 0]

