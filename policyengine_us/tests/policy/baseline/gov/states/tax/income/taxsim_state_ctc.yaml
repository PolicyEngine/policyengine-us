- name: NY additional CTC is included in the state CTC aggregate in 2021
  period: 2021
  input:
    people:
      parent:
        age: 35
    tax_units:
      tax_unit:
        members: [parent]
        ny_ctc: 330
        ny_additional_ctc: 82.5
    households:
      household:
        members: [parent]
        state_code: NY
  output:
    taxsim_state_ctc: 412.5

