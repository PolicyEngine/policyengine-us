- name: MN child tax credit is reported within the combined credit, not the state CTC
  # From 2023 Minnesota's child tax credit (Minn. Stat. 290.0661) and working
  # family credit (290.0671) are phased down jointly (290.0661, subd. 4) and
  # claimed on one Schedule M1REF line, so taxsim_state_eitc reports the whole
  # credit and no separate state CTC is reported. Injected values are arbitrary.
  period: 2024
  input:
    people:
      parent:
        age: 35
    tax_units:
      tax_unit:
        members: [parent]
        mn_child_and_working_families_credits: 2_118.8
        mn_wfc: 1_182.78
    households:
      household:
        members: [parent]
        state_code: MN
  output:
    taxsim_state_ctc: 0

- name: Case 9, 2020 Maryland child tax credit appears in state reporting.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      person2:
        age: 16
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        # Known child-with-disability classification under Education Article 8-401.
        is_disabled: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        # Independently known annual federal AGI and federal child-credit component.
        # These premises do not establish complete federal credit eligibility.
        adjusted_gross_income: 6_000
        ctc: 0
    spm_units:
      spm_unit: {members: [person1, person2]}
    families:
      family: {members: [person1, person2]}
    marital_units:
      marital_unit1: {members: [person1]}
      marital_unit2: {members: [person2]}
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    # 2021 Maryland Laws chapter 40, section 2, applies to tax years 2020-2022.
    # Tax-General 10-751(b)-(d): one qualifying child x 500 - federal credit 0 = 500.
    # https://mgaleg.maryland.gov/2021RS/Chapters_noln/CH_40_sb0218t.pdf#page=5
    md_ctc: 500
    taxsim_state_ctc: 500

- name: Case 10, 2017 New York Empire State child credit appears in state reporting.
  period: 2017
  absolute_error_margin: 0.01
