        is_tax_unit_dependent: false
      person2:
        age: 4
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        # Independently known lawful annual New York credit component.
        # This case exercises reporting, not New York or federal entitlement.
        ny_ctc: 100
    spm_units:
      spm_unit: {members: [person1, person2]}
    families:
      family: {members: [person1, person2]}
    marital_units:
      marital_unit1: {members: [person1]}
      marital_unit2: {members: [person2]}
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    # Official 2017 IT-213, lines 15-16, permits a 100-per-child minimum.
    # https://www.tax.ny.gov/pdf/2017/inc/it213_2017_fill_in.pdf#page=2
    # Include the known raw credit once in the declared state-CTC reporting sum.
    taxsim_state_ctc: 100

