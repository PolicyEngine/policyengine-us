- name: Colorado FAMLI employer-level total adds the employee share the employer does not deduct.
  period: 2026
  input:
    employment_income: 100_000
    employer_total_taxable_earnings_for_social_security: 1_000_000
    employer_state_payroll_premium_deduction_share: 0.5
    state_code: CO
  output:
    # Default headcount of 100 is at least 10, so the employer pays its 0.44%:
    # 0.44% * 1,000,000 = 4,400. It deducts half of the 0.44% employee share
    # and pays the other half: 0.5 * 0.44% * 1,000,000 = 2,200.
    # 4,400 + 2,200 = 6,600.
    employer_total_additional_state_payroll_tax: 6_600
