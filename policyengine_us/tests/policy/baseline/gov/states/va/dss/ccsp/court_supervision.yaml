- name: VA ordinary child remains eligible.
  period: 2026-01
  input:
    state_code: VA
    age: 12
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: true

- name: VA older child needs an exception.
  period: 2026-01
  input:
    state_code: VA
    age: 13
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: false

- name: VA court supervision at the lower boundary.
  period: 2026-01
  input:
    state_code: VA
    age: 13
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: true

- name: VA court supervision at the upper boundary.
  period: 2026-01
  input:
    state_code: VA
    age: 17
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: true

- name: VA court supervision does not override the upper age limit.
  period: 2026-01
  input:
    state_code: VA
    age: 18
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: false

- name: VA supervised adult does not qualify.
  period: 2026-01
  input:
    state_code: VA
    age: 30
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    va_ccsp_child_eligible: false

- name: VA supervision is specific to the child in a mixed household.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        is_under_court_supervision: true
      supervised_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: true
        immigration_status: CITIZEN
      other_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: false
        immigration_status: CITIZEN
    households:
      household:
        members: [parent, supervised_child, other_child]
        state_code: VA
  output:
    va_ccsp_child_eligible: [false, true, false]

- name: VA court-supervised 17-year-old receives a benefit through the full pipeline.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 36_000
        immigration_status: CITIZEN
      person2:
        age: 17
        is_disabled: false
        is_under_court_supervision: true
        is_tax_unit_dependent: true
        childcare_attending_days_per_month: 23
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        va_ccsp_locality_group: GROUP_III
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # person2: age 17, not disabled, under court supervision (13-17) => eligible child
    va_ccsp_child_eligible: [false, true]
    va_ccsp_income_eligible: true
    va_ccsp_eligible: true
    # Group III school-age daily MRR = $30; 23 attending days => 30 * 23 = 690
    va_ccsp_daily_mrr: [30, 30]
    # Copay: family of 2 at 36,000 => $60/month
    va_ccsp_copay: 60
    # Benefit: 690 - 60 = 630
    va_ccsp: 630
