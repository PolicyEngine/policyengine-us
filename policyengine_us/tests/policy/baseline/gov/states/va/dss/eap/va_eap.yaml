- name: Case 7, a large self-employment loss does not inflate the benefit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 15_000
        self_employment_income: -60_000
    spm_units:
      spm_unit:
        members: [head]
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [head]
        state_code: VA
        county: HENRICO_COUNTY_VA
  output:
    # The loss is floored at zero, so countable income stays 15,000.
    va_eap_countable_income: 15_000
    # floor(100 x 15,000 / 23,472) = 63 -> 10.
    va_eap_income_points: 10
    # 9 + 10 + 12 + 0 + 43 = 74.
    va_eap_points: 74
    # 74 x 4.531665 = 335.34321.
    va_eap: 335.34
