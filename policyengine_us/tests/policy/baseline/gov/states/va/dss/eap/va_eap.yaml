# Virginia EAP Fuel Assistance benefit: household points x the statewide value
# per point (22VAC40-680-30; Complete EAP Manual D.5). Period 2026 uses the
# latest published value, FFY2025 $4.531665 (FY2026 LIHEAP plan item 2.5). No
# minimum, maximum or bill cap. Points add 43 for every eligible household:
# living arrangement 20, primary fuel 10 (placeholder) and energy burden 13
# (placeholder). FFY2026 annual limits: size 1 23,472; 2 31,716; 3 39,972;
# 6 64,716; 7 72,972.

- name: Case 1, retiree in Fairfax County with natural gas heat receives 466.76.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 65
        social_security_retirement: 11_736
        ssi: 0
    spm_units:
      spm_unit:
        members: [head]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [head]
        state_code: VA
        county: FAIRFAX_COUNTY_VA
  output:
    va_eap_household_size: 1
    va_eap_income_limit: 23_472
    # 11,736 - 600 elderly deduction.
    va_eap_countable_income: 11_136
    va_eap_income_eligible: true
    va_eap_eligible: true
    va_eap_climate_zone: NORTHERN
    # floor(100 x 11,136 / 23,472) = 47 -> 15.
    va_eap_income_points: 15
    va_eap_vulnerability_points: 20
    # 9 + 15 + 16 + 20 + 43 = 103.
    va_eap_points: 103
    # 103 x 4.531665 = 466.761495.
    va_eap: 466.76

