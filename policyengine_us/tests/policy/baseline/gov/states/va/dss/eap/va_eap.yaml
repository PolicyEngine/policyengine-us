- name: Case 4, family of three one dollar over the limit receives nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 34
        employment_income: 39_973
      child1:
        age: 9
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [head, child1, child2]
        heating_type: NATURAL_GAS
        gas_expense: 1_100
        tanf: 0
    households:
      household:
        members: [head, child1, child2]
        state_code: VA
        county: HENRICO_COUNTY_VA
  output:
    va_eap_income_eligible: false
    va_eap_eligible: false
    va_eap: 0

- name: Case 5, FFY2025 period retiree in Henrico County with propane heat receives 439.57 (historical estimate).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 67
        social_security_retirement: 13_200
        ssi: 0
    spm_units:
      spm_unit:
        members: [head]
        heating_type: PROPANE
        bottled_gas_expense: 1_500
    households:
      household:
        members: [head]
        state_code: VA
        county: HENRICO_COUNTY_VA
  output:
    # 2024 guideline: floor(15,060 x 1.5 / 12) = 1,882; x 12 = 22,584.
    va_eap_income_limit: 22_584
    va_eap_countable_income: 12_600
    # floor(100 x 12,600 / 22,584) = 55 -> 13.
    va_eap_income_points: 13
    # 9 + 13 + 12 + 20 + 43 = 97.
    va_eap_points: 97
    # 97 x 4.531665 (FFY2025 value, in effect from 2024-10-01) = 439.571505.
    va_eap: 439.57

- name: Case 6, household outside Virginia receives nothing.
  period: 2026
