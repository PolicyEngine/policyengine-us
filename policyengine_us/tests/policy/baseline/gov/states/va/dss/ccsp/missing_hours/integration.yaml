# Accomack center school-age full day $30; part day $30 * 0.7 = $21.
# 23 billable days: $21 * 23 - $60 copay = $423.
- name: Positive daily hours determine full-day care while zero retains the fallback.
  period: 2024-01
  input:
    people:
      child0:
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 20
      child1:
        childcare_hours_per_day: 3
        childcare_attending_days_per_month: 20
      child2:
        childcare_hours_per_day: 4.99
        childcare_attending_days_per_month: 20
      child3:
        childcare_hours_per_day: 5
        childcare_attending_days_per_month: 20
      child4:
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
    households:
      household:
        members:
        - child0
        - child1
        - child2
        - child3
        - child4
        state_code: VA
  output:
    va_ccsp_is_full_day:
    - true
    - false
    - false
    - true
    - true
- name: Explicit full-day authorization overrides short reported days.
  period: 2024-01
  input:
    state_code: VA
    childcare_hours_per_day: 3
    va_ccsp_is_full_day: true
  output:
    va_ccsp_is_full_day: true
- name: Explicit part-day authorization overrides missing hours.
  period: 2024-01
  input:
    state_code: VA
    va_ccsp_is_full_day: false
  output:
    va_ccsp_is_full_day: false
- name: Reported short days use the part-day rate in the complete benefit.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 36000
        immigration_status: CITIZEN
      person2:
        age: 5
        is_tax_unit_dependent: true
        childcare_attending_days_per_month: 23
        immigration_status: CITIZEN
        childcare_hours_per_day: 3
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 12000
        va_ccsp_locality_group: GROUP_III
    households:
      household:
        members:
        - person1
        - person2
        state_code: VA
  output:
    va_ccsp_is_full_day:
    - true
    - false
    va_ccsp_daily_mrr:
    - 30
    - 21
    va_ccsp_copay: 60
    va_ccsp: 423
- name: Missing hours retain the full-day rate with billable care.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 36000
        immigration_status: CITIZEN
      person2:
        age: 5
        is_tax_unit_dependent: true
        childcare_attending_days_per_month: 23
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 12000
        va_ccsp_locality_group: GROUP_III
    households:
      household:
        members:
        - person1
        - person2
        state_code: VA
  output:
    va_ccsp_copay: 60
    va_ccsp: 630
- name: No care days or expenses yields no benefit.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 36000
        immigration_status: CITIZEN
      person2:
        age: 5
        is_tax_unit_dependent: true
        childcare_attending_days_per_month: 0
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 0
        va_ccsp_locality_group: GROUP_III
    households:
      household:
        members:
        - person1
        - person2
        state_code: VA
  output:
    va_ccsp: 0
