# VA TANF Income Eligibility Tests
# Two-step test:
#   Step 1: va_tanf_gross_income <= need_standard
#   Step 2: countable_income <= grant_standard (also for UP eligible units,
#   unless the separate TANF-UP standards are in effect)

- name: Case 1, no income is eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 0
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 0
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 0 <= 12,000? YES
    # Step 2: 0 <= 6,000? YES
    va_tanf_income_eligibility: true

- name: Case 2, gross income at need standard is eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 12_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 5_000
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 12,000 <= 12,000? YES
    # Step 2: 5,000 <= 6,000? YES
    va_tanf_income_eligibility: true

- name: Case 3, gross income exceeds need standard - not eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 13_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 5_000
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 13,000 <= 12,000? NO (fails step 1)
    va_tanf_income_eligibility: false

- name: Case 4, countable income exceeds grant standard - not eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 10_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 7_000
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 10,000 <= 12,000? YES
    # Step 2: 7,000 <= 6,000? NO (fails step 2)
    va_tanf_income_eligibility: false

- name: Case 5, in 2021 UP eligible units use the TANF grant standard.
  period: 2021
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 5_500
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 5_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 5,500 <= 6,000? YES
    # (5,500 is above the TANF-UP standard of 5,000)
    va_tanf_income_eligibility: true

- name: Case 6, in 2021 UP eligible units above the TANF grant standard are not eligible.
  period: 2021
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_500
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 7_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 6,500 <= 6,000? NO (fails step 2)
    va_tanf_income_eligibility: false

- name: Case 7, only calculate for VA.
  period: 2023
  input:
    state_code: MD
    va_tanf_gross_income: 0
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 0
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    va_tanf_income_eligibility: false

- name: Case 8, gross income $1 below need standard is eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 11_999
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 5_000
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 11,999 <= 12,000? YES
    # Step 2: 5,000 <= 6,000? YES
    va_tanf_income_eligibility: true

- name: Case 9, countable income exactly at grant standard is eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 10_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_000
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 10,000 <= 12,000? YES
    # Step 2: 6,000 <= 6,000? YES (at boundary)
    va_tanf_income_eligibility: true

- name: Case 10, countable income $1 above grant standard is not eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 10_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_001
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
  output:
    # Step 1: 10,000 <= 12,000? YES
    # Step 2: 6,001 <= 6,000? NO (just above boundary)
    va_tanf_income_eligibility: false

- name: Case 11, before July 2020 UP eligible units with countable at the TANF grant standard are eligible.
  period: 2019
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_000
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 5_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 6,000 <= 6,000? YES (at boundary)
    va_tanf_income_eligibility: true

- name: Case 12, before July 2020 UP eligible units $1 above the TANF grant standard are not eligible.
  period: 2019
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_001
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 7_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 6,001 <= 6,000? NO (just above boundary)
    va_tanf_income_eligibility: false

- name: Case 13, in 2023 UP eligible units use the TANF grant standard.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 5_500
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 5_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 5,500 <= 6,000? YES
    va_tanf_income_eligibility: true

- name: Case 14, in 2023 UP eligible units above the TANF grant standard are not eligible.
  period: 2023
  input:
    state_code: VA
    va_tanf_gross_income: 8_000
    va_tanf_need_standard: 12_000
    va_tanf_countable_income: 6_001
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 7_000
  output:
    # Step 1: 8,000 <= 12,000? YES
    # Step 2 (TANF standard): 6,001 <= 6,000? NO
    va_tanf_income_eligibility: false
