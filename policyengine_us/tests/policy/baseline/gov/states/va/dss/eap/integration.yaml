# Virginia EAP Fuel Assistance end-to-end integration tests.
# Sources: Complete EAP Manual, Volume IX (household and income B.5-B.7,
# medical deduction B.6.c, climate zones Appendix A, point values Appendix B);
# 22VAC40-680-30 (points x value per point); LIHEAP FY2026 Virginia plan item
# 2.5 (FFY2025 value per point $4.531665, used for period 2026).
# FFY2026 annual limits (monthly x 12): 23,472 (1) / 31,716 (2) /
# 39,972 (3) / 64,716 (6) / 72,972 (7).
# Points = household size + income + climate zone + vulnerability + 43
# (living arrangement 20, primary fuel placeholder 10, energy burden
# placeholder 13).

- name: Case 1, retiree in Fairfax County with natural gas heat receives 466.76.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 65
        social_security_retirement: 11_736
        ssi: 0
    spm_units:
      spm_unit:
        members: [head]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [head]
        state_code: VA
        county: FAIRFAX_COUNTY_VA
  output:
    va_eap_household_size: 1
    va_eap_income_limit: 23_472
    # 11,736 - 600 elderly deduction.
    va_eap_countable_income: 11_136
    va_eap_income_eligible: true
    va_eap_eligible: true
    va_eap_climate_zone: NORTHERN
    # floor(100 x 11,136 / 23,472) = 47 -> 15.
    va_eap_income_points: 15
    va_eap_vulnerability_points: 20
    # 9 + 15 + 16 + 20 + 43 = 103.
    va_eap_points: 103
    # 103 x 4.531665 = 466.761495.
    va_eap: 466.76

- name: Case 2, single parent in Norfolk with heat included in rent receives 376.13.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 28
        employment_income: 26_562
        child_support_received: 3_600
      child1:
        age: 4
      child2:
        age: 1
    spm_units:
      spm_unit:
        members: [head, child1, child2]
        heating_type: ELECTRICITY
        heat_expense_included_in_rent: true
        tanf: 0
    households:
      household:
        members: [head, child1, child2]
        state_code: VA
        county: NORFOLK_CITY_VA
  output:
    va_eap_household_size: 3
    va_eap_income_limit: 39_972
    # Full-time minimum wage 12.77 x 2,080 = 26,562 plus child support 3,600.
    va_eap_countable_income: 30_162
    va_eap_income_eligible: true
    va_eap_eligible: true
    va_eap_climate_zone: TIDEWATER
    # floor(100 x 30,162 / 39,972) = 75 -> 8.
    va_eap_income_points: 8
    va_eap_vulnerability_points: 12
    # 12 + 8 + 8 + 12 + 43 = 83.
    va_eap_points: 83
    # 83 x 4.531665 = 376.128195.
    va_eap: 376.13

