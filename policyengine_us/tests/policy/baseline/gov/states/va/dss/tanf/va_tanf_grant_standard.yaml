# From July 2022 the standard is the 7/22 Section 304, Appendix 2 amount
# (Chapter 300, Transmittal 74), not the 7/20 amount times 1.155.
- name: Grant standard in January 2023 is the printed 7/22 Group III amount for one person.
  # 7/22 Group III, size 1: $366 (316 * 1.155 = 364.98)
  period: 2023-01
  input:
    state_code: VA
    spm_unit_size: 1
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf_grant_standard: 366

# Test multiplier effect for 2018 period (multiplier = 0.8282)
- name: Grant standard in 2018-01 for size 3 in Group III locality.
  # Base $508 * 0.8282 = $420.726/month
  period: 2018-01
  input:
    state_code: VA
    spm_unit_size: 3
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf_grant_standard: 420.726

# Printed 7/21 standards (TANF Manual 10/21, Section 304, Appendix 2,
# Transmittal 71). Pittsylvania is a Group II locality, Arlington Group III.

- name: In 2021 a Group II unit of three gets the 7/20 standard to June and the 7/21 standard from July.
  period: 2021
  input:
    state_code: VA
    spm_unit_size: 3
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # 6 * $417 (7/20) + 6 * $459 (7/21; 417 * 1.1 = 458.70) = 2,502 + 2,754
    va_tanf_grant_standard: 5_256

- name: In January 2022 a Group II unit of one gets the 7/21 standard.
  period: 2022-01
  input:
    state_code: VA
    spm_unit_size: 1
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # 7/21 Group II, size 1 (226 * 1.1 = 248.60)
    va_tanf_grant_standard: 249

- name: In January 2022 a Group II unit of twelve gets the 7/21 standard.
  period: 2022-01
  input:
    state_code: VA
    spm_unit_size: 12
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # 7/21 Group II: size 10 $1,073 + 2 * $90 = $1,253 ((975 + 2 * 81) * 1.1 = 1,250.70)
    va_tanf_grant_standard: 1_253

- name: In January 2022 a Group III unit of ten gets the 7/21 standard.
  period: 2022-01
  input:
    state_code: VA
    spm_unit_size: 10
    county_str: ARLINGTON_COUNTY_VA
  output:
    # 7/21 Group III, size 10 (1,085 * 1.1 = 1,193.50)
    va_tanf_grant_standard: 1_194

