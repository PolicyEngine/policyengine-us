# Tests use 2021-01 period to validate the 7/20 Section 304, Appendix 2 values.
# The tables hold the printed 7/20, 7/21 and 7/22 standards; the standard
# multiplier scales the 7/20 standards only for periods before July 2020.

- name: If one person and lives in Arlington, grant standard is $316/month.
  period: 2021-01
  input:
    state_code: VA
    spm_unit_size: 1
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf_grant_standard: 316

- name: If ten person and lives in Fairfax, grant standard is $1,085/month.
  period: 2021-01
  input:
    state_code: VA
    spm_unit_size: 10
    county_str: FAIRFAX_COUNTY_VA
  output:
    va_tanf_grant_standard: 1_085

- name: If eleven person and lives in Arlington, grant standard is $1,166/month.
  # Family size 11 = main[10] + 1 * addition = $1,085 + $81 = $1,166/month
  period: 2021-01
  input:
    state_code: VA
    spm_unit_size: 11
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf_grant_standard: 1_166

- name: If twelve person and lives in Montgomery, grant standard is $1,247/month.
