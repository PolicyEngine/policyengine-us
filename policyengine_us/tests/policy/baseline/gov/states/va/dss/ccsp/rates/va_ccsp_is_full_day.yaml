

# Alternate hours use reported attendance frequency; thresholds remain state-specific.
- name: Case 1, ten weekly hours over five care days is a short day.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    va_ccsp_is_full_day: false
- name: Case 2, monthly attendance supplies frequency for weekly hours.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_week: 10
    childcare_attending_days_per_month: 20
  output:
    va_ccsp_is_full_day: false
- name: Case 3, weekly hours at the daily threshold qualify for full days.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_week: 25
    childcare_days_per_week: 5
  output:
    va_ccsp_is_full_day: true
- name: Case 4, reported daily hours take precedence over weekly conversion.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_day: 5
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    va_ccsp_is_full_day: true
- name: Case 5, care days without hours retain the full-time fallback.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_days_per_week: 5
  output:
    va_ccsp_is_full_day: true
- name: Case 6, weekly hours below the daily threshold without attendance days are a part day.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_week: 4
  output:
    va_ccsp_is_full_day: false
- name: Case 7, weekly hours at the daily threshold without attendance days retain the full-day fallback.
  period: 2026-01
  input:
    state_code: VA
    age: 3
    childcare_hours_per_week: 5
  output:
    va_ccsp_is_full_day: true
