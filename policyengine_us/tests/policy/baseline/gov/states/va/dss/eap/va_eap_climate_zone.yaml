# Virginia EAP climate zone from the household's locality (Complete EAP
# Manual Chapter D, Appendix A: 06/17 page 1 and 01/03 pages 2-3). Bedford
# City (now part of Bedford County) and Clifton Forge (now a town in
# Alleghany County) have no county value. Salem city (775) is listed under
# Central Mountain on the 01/03 page 1 but omitted from the 06/17 page 1; it
# is expected in Central Mountain, the latest page that lists it.

- name: Case 1, Fairfax County is Northern.
  period: 2026
  input:
    state_code: VA
    county: FAIRFAX_COUNTY_VA
  output:
    va_eap_climate_zone: NORTHERN

- name: Case 2, Fairfax city and Alexandria city are Northern.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [FAIRFAX_CITY_VA, ALEXANDRIA_CITY_VA]
  output:
    va_eap_climate_zone: [NORTHERN, NORTHERN]

- name: Case 3, Roanoke city and Roanoke County are both Central Mountain.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [ROANOKE_CITY_VA, ROANOKE_COUNTY_VA]
  output:
    va_eap_climate_zone: [CENTRAL_MOUNTAIN, CENTRAL_MOUNTAIN]

- name: Case 4, Salem city is Central Mountain.
  period: 2026
  input:
    state_code: VA
    county: SALEM_CITY_VA
  output:
    va_eap_climate_zone: CENTRAL_MOUNTAIN

- name: Case 5, Wise County and Norton city are Southwestern Mountain.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [WISE_COUNTY_VA, NORTON_CITY_VA]
  output:
    va_eap_climate_zone: [SOUTHWESTERN_MOUNTAIN, SOUTHWESTERN_MOUNTAIN]

- name: Case 6, Bedford County is Western Piedmont.
  period: 2026
  input:
    state_code: VA
    county: BEDFORD_COUNTY_VA
  output:
    va_eap_climate_zone: WESTERN_PIEDMONT

- name: Case 7, Franklin County is Western Piedmont while Franklin city is Tidewater.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [FRANKLIN_COUNTY_VA, FRANKLIN_CITY_VA]
  output:
    va_eap_climate_zone: [WESTERN_PIEDMONT, TIDEWATER]

- name: Case 8, Richmond city is Eastern Piedmont while Richmond County is Tidewater.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [RICHMOND_CITY_VA, RICHMOND_COUNTY_VA]
  output:
    va_eap_climate_zone: [EASTERN_PIEDMONT, TIDEWATER]

- name: Case 9, Virginia Beach city and Stafford County are Tidewater.
  period: 2026
  input:
    state_code: [VA, VA]
    county: [VIRGINIA_BEACH_CITY_VA, STAFFORD_COUNTY_VA]
  output:
    va_eap_climate_zone: [TIDEWATER, TIDEWATER]

