  output:
    va_tanf_countable_earned_income: 2_200.8

- name: Case 7, earned income exactly at the standard deduction returns zero.
  # Monthly income $2,316 / 12 = $193
  # January-September: ($193 - $193) * 0.8 = 0
  # October-December: $193 is below the $198 standard deduction, so 0
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 2_316
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 0

- name: Case 8, childcare exceeds earnings after 20% disregard.
  # Monthly income $3,004 / 12 = $250.33
  # January-September: ($250.33 - $193) * 0.8 = $45.87
  # October-December: ($250.33 - $198) * 0.8 = $41.87
  # Childcare: $200/month (infant) exceeds both, so 0 each month
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 3_004
        is_tax_unit_dependent: false
        age: 30
      person2:
        tanf_gross_earned_income: 0
        is_tax_unit_dependent: true
        age: 1
    spm_units:
      spm_unit:
        members: [person1, person2]
        childcare_expenses: 2_400
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 0

- name: Case 9, multiple earners in unit.
  # Total gross: $6,000 + $4,000 = $10,000, or $833.33 a month
  # January-September: ($833.33 - $193) * 0.8 = $512.27 * 9 = $4,610.40
  # October-December: ($833.33 - $198) * 0.8 = $508.27 * 3 = $1,524.80
  # Total: $4,610.40 + $1,524.80 = $6,135.20
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 6_000
      person2:
        tanf_gross_earned_income: 4_000
      person3:
        tanf_gross_earned_income: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 6_135.2

