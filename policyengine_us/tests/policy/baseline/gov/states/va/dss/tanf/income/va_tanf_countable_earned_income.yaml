# VA TANF Countable Earned Income tests
# Formula: max_(max_(gross - standard_deduction, 0) * 0.8 - childcare, 0)
# The standard deduction is SNAP's (TANF Manual 305.1 A.2.b). In 2023 it is
# $193 (1-4 members), $225 (5) and $258 (6+) from January to September and
# $198 (1-3), $208 (4), $244 (5) and $279 (6+) from October to December.

- name: Zero earned income returns zero.
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 0
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 0

- name: Earned income below the standard deduction returns zero.
  # Monthly income $1,500 / 12 = $125 is below the $193 and $198 standard deductions.
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 1_500
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 0

- name: Earned income $5,004, size 3.
  # Monthly income $5,004 / 12 = $417
  # January-September: ($417 - $193) * 0.8 = $179.20 * 9 = $1,612.80
  # October-December: ($417 - $198) * 0.8 = $175.20 * 3 = $525.60
  # Total: $1,612.80 + $525.60 = $2,138.40
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 5_004
      person2:
        tanf_gross_earned_income: 0
      person3:
        tanf_gross_earned_income: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 2_138.4

- name: Earned income $8,880, size 6.
  # Monthly income $8,880 / 12 = $740
  # January-September: ($740 - $258) * 0.8 = $385.60 * 9 = $3,470.40
  # October-December: ($740 - $279) * 0.8 = $368.80 * 3 = $1,106.40
  # Total: $3,470.40 + $1,106.40 = $4,576.80
  period: 2023
  input:
    people:
      person1:
        tanf_gross_earned_income: 8_880
      person2:
        tanf_gross_earned_income: 0
      person3:
        tanf_gross_earned_income: 0
      person4:
        tanf_gross_earned_income: 0
      person5:
        tanf_gross_earned_income: 0
      person6:
        tanf_gross_earned_income: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6]
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: VA
  output:
    va_tanf_countable_earned_income: 4_576.8

