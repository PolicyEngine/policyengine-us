- name: If ineligible, they get zero.
  period: 2023
  input:
    va_tanf_eligibility: false
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 1_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 3_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 0

- name: If tanf eligible, a payment under $10 a month is not made.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 2_100
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 2_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Grant standard $2,100 - countable income $2,000 = $100 a year,
    # or $8.33 a month, under the $10 minimum (TANF Manual 502.1 A.2)
    va_tanf: 0

- name: If up tanf eligible before July 2022, the UP grant standard applies.
  period: 2021
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 0
    va_tanf_up_grant_standard: 2_400
    va_tanf_countable_income: 1_200
    county_str: ARLINGTON_COUNTY_VA
  output:
    # UP grant standard $2,400 - countable income $1,200 = $1,200 payment
    # ($200 - $100 = $100 a month, below the monthly maximum)
    va_tanf: 1_200

- name: If tanf eligible, payment less than maximum payment, they get the difference.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 12_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 6_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    # $1,000 - $500 = $500 a month
    va_tanf: 6_000

- name: Grant equals countable income.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 4_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 4_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 0

- name: Zero countable income gets full grant below max.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 6_000

# Payment rounding and minimum (TANF Manual 502.1 A): the budgetary
# deficiency is adjusted to the next lower dollar, and no payment is made
# when it is under $10.

- name: A deficiency under $10 is not paid.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 481.635
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 479.2
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # $481.635 - $479.20 = $2.435, under $10
    va_tanf: 0

- name: A deficiency of $9.99 is not paid.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 500
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 490.01
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # $500 - $490.01 = $9.99, under $10
    va_tanf: 0

- name: A deficiency of exactly $10 is paid.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 500
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 490
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # $500 - $490 = $10
    va_tanf: 10

- name: The payment is rounded down to the next lower dollar.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 481.635
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 100
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # $481.635 - $100 = $381.635, rounded down to $381
    va_tanf: 381

# Max payment cap tests -- max payment = ceil(base_max * standard_multiplier)
# For 2023: multiplier is 1.155 for all 12 months
# Group III TANF: ceil(745*1.155)=861
# Annual max = 12*861 = 10_332

- name: Group III TANF capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 15_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Payment 15000 capped at Group III max: 12*861 = 10_332
    va_tanf: 10_332

# Group II TANF: ceil(625*1.155)=722
# Annual max = 12*722 = 8_664

- name: Group II TANF capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 15_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # Payment 15000 capped at Group II max: 12*722 = 8_664
    va_tanf: 8_664

# Group III TANF-UP: ceil(648*1.155)=749
# Annual max = 12*749 = 8_988

- name: Group III TANF-UP capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 0
    va_tanf_up_grant_standard: 15_000
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Payment 15000 capped at Group III UP max: 12*749 = 8_988
    va_tanf: 8_988

# Group II TANF-UP: ceil(544*1.155)=629
# Annual max = 12*629 = 7_548

- name: Group II TANF-UP capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 0
    va_tanf_up_grant_standard: 15_000
    va_tanf_countable_income: 0
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # Payment 15000 capped at Group II UP max: 12*629 = 7_548
    va_tanf: 7_548

- name: Payment below cap is not reduced.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 9_600
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 1_200
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Payment = 9600 - 1200 = 8400, Group III monthly max = 861
    # Monthly payment = 700, which is below the cap
    va_tanf: 8_400
