- name: If ineligible, they get zero.
  period: 2023
  input:
    va_tanf_eligibility: false
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 1_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 3_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 0

- name: If tanf eligible, small payment is still paid.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 2_100
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 2_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Grant standard $2,100 - countable income $2,000 = $100 payment
    va_tanf: 100

- name: In 2021 a TANF-UP unit gets the TANF grant standard.
  period: 2021
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 2_400
    va_tanf_up_grant_standard: 1_800
    va_tanf_countable_income: 1_200
    county_str: ARLINGTON_COUNTY_VA
  output:
    # TANF grant standard $2,400 - countable income $1,200 = $1,200 payment
    # ($200 - $100 = $100 a month, below the monthly maximum). The TANF-UP
    # standard would give $1,800 - $1,200 = $600.
    va_tanf: 1_200

- name: Before July 2020 a TANF-UP unit gets the TANF grant standard.
  period: 2020-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 400
    va_tanf_up_grant_standard: 300
    va_tanf_countable_income: 100
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # TANF grant standard $400 - countable income $100 = $300, below the
    # Group II maximum. The TANF-UP standard would give $300 - $100 = $200.
    va_tanf: 300

- name: If tanf eligible, payment less than maximum payment, they get the difference.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 10_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 4_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 6_000

- name: Grant equals countable income.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 4_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 4_000
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 0

- name: Zero countable income gets full grant below max.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 6_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    va_tanf: 6_000

# Max payment cap tests -- max payment = ceil(base_max * standard_multiplier)
# For 2023: multiplier is 1.155 for all 12 months
# Group III TANF: ceil(745*1.155)=861
# Annual max = 12*861 = 10_332

- name: Group III TANF capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 15_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Payment 15000 capped at Group III max: 12*861 = 10_332
    va_tanf: 10_332

# Group II TANF: ceil(625*1.155)=722
# Annual max = 12*722 = 8_664

- name: Group II TANF capped at scaled max payment.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 15_000
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 0
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # Payment 15000 capped at Group II max: 12*722 = 8_664
    va_tanf: 8_664

# TANF-UP units are capped at the TANF maximum. The 7/21 Section 304,
# Appendix 2 (Transmittal 71) maximum reimbursable payment is $820 in
# Group III and $688 in Group II.

- name: In January 2022 a Group III TANF-UP unit is capped at the TANF maximum.
  period: 2022-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 1_500
    va_tanf_up_grant_standard: 1_500
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    # ceil(745 * 1.1) = ceil(819.5) = 820
    # (the TANF-UP maximum would be ceil(648 * 1.1) = 713)
    va_tanf: 820

- name: In January 2022 a Group II TANF-UP unit is capped at the TANF maximum.
  period: 2022-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 1_500
    va_tanf_up_grant_standard: 1_500
    va_tanf_countable_income: 0
    county_str: PITTSYLVANIA_COUNTY_VA
  output:
    # ceil(625 * 1.1) = ceil(687.5) = 688
    # (the TANF-UP maximum would be ceil(544 * 1.1) = 599)
    va_tanf: 688

- name: Payment below cap is not reduced.
  period: 2023
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 9_600
    va_tanf_up_grant_standard: 0
    va_tanf_countable_income: 1_200
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Payment = 9600 - 1200 = 8400, Group III monthly max = 861
    # Monthly payment = 700, which is below the cap
    va_tanf: 8_400

# Since July 2021 Virginia has one schedule of standards (TANF Manual
# Section 304, Appendix 2) for all units. January 2025 multiplier: 1.155

- name: In January 2025 a TANF-UP unit gets the TANF grant standard.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 500
    va_tanf_up_grant_standard: 400
    va_tanf_countable_income: 100
    county_str: ARLINGTON_COUNTY_VA
  output:
    # TANF grant standard $500 - countable income $100 = $400
    # (the TANF-UP standard would give $400 - $100 = $300)
    va_tanf: 400

- name: In January 2025 a Group III TANF-UP unit is capped at the TANF maximum.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: true
    va_tanf_grant_standard: 1_500
    va_tanf_up_grant_standard: 1_500
    va_tanf_countable_income: 0
    county_str: ARLINGTON_COUNTY_VA
  output:
    # Group III TANF maximum: ceil(745 * 1.155) = ceil(860.475) = 861, the
    # 7/22 Section 304, Appendix 2 (Transmittal 74) maximum of $861
    # (the TANF-UP maximum would be ceil(648 * 1.155) = 749)
    va_tanf: 861

- name: In January 2025 a single-parent unit is unaffected.
  period: 2025-01
  input:
    va_tanf_eligibility: true
    va_up_tanf_eligibility: false
    va_tanf_grant_standard: 500
    va_tanf_up_grant_standard: 400
    va_tanf_countable_income: 100
    county_str: ARLINGTON_COUNTY_VA
  output:
    # TANF grant standard $500 - countable income $100 = $400
    va_tanf: 400
