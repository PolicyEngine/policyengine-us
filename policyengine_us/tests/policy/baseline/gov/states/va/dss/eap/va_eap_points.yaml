        members: [head, spouse, child1, child2, child3]
        state_code: VA
        county: CHESTERFIELD_COUNTY_VA
  output:
    # 45,000 / 56,472 = 79.69 percent -> 8. 12 + 8 + 12 + 0 + 43 = 75.
