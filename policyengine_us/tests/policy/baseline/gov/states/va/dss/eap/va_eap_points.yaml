- name: Case 6, a working SSI recipient in Wise County scores no income points.
  period: 2026
  input:
    people:
      head:
        age: 35
        employment_income: 24_000
        ssi: 438
        is_ssi_disabled: true
    spm_units:
      spm_unit:
        members: [head]
        heating_type: KEROSENE
        fuel_oil_expense: 1_100
    households:
      household:
        members: [head]
        state_code: VA
        county: WISE_COUNTY_VA
  output:
    # 23,838 / 23,472 = 101.56 percent -> 0. 9 + 0 + 18 + 15 + 43 = 85.
    va_eap_points: 85

- name: Case 7, three-generation household in Augusta County reaches 123 points.
  period: 2026
  input:
    people:
      grandparent:
        age: 66
        social_security_retirement: 12_000
        ssi: 0
      head:
        age: 40
      spouse:
        age: 38
      child1:
        age: 12
      child2:
        age: 9
      child3:
        age: 2
    spm_units:
      spm_unit:
        members: [grandparent, head, spouse, child1, child2, child3]
        heating_type: WOOD
        wood_expense: 800
        tanf: 0
    households:
      household:
        members: [grandparent, head, spouse, child1, child2, child3]
        state_code: VA
        county: AUGUSTA_COUNTY_VA
  output:
    # 12,000 - 600 = 11,400; 11,400 / 64,716 = 17.62 percent -> 25.
    # 15 + 25 + Central Mountain 20 + elderly 20 + 43 = 123.
    va_eap_points: 123
