# Virginia EAP Fuel Assistance eligibility: at least one citizen or qualified
# alien, income eligible, a primary fuel of electricity, natural gas, oil,
# kerosene, LP gas (propane), wood or coal, and a heating expense paid
# directly or included in rent. Subsidized households whose heat is included
# in rent, and homeless persons, are ineligible; subsidized households that
# pay their own heating bill are eligible (Complete EAP Manual B.5.c, B.7,
# D.1.c). UNSPECIFIED, SOLAR, OTHER and NONE heating types are ineligible.
# Unless noted, the household is one adult with $20,000 of wages (under the
# $23,472 one-person limit).

- name: Case 1, natural gas heat with a gas bill is eligible.
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 20_000
    spm_units:
      spm_unit:
        members: [head]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [head]
        state_code: VA
  output:
    va_eap_eligible: true

