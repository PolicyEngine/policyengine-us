# 2025 tests - per 2025 Form 760 Instructions page 27
- name: VA 2025 military benefit subtraction at $40,000 limit
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 50_000
        is_tax_unit_head: true
        age: 60
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    # 2025 limit is $40,000
    va_military_benefit_subtraction: 40_000

- name: VA 2025 military benefit subtraction under limit
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 35_000
        is_tax_unit_head: true
        age: 56
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    # Under $40,000 limit, full amount subtracted
    va_military_benefit_subtraction: 35_000

- name: Virginia does not subtract a nonspouse survivor annuity on the survivor's own return.
  period: 2024
  input:
    state_code: VA
    age: 20
    is_surviving_spouse: false
    is_tax_unit_head_or_spouse: true
    military_retirement_pay_survivors: 10_000
  output:
    va_military_benefit_subtraction: 0

- name: Virginia subtracts an eligible surviving spouse annuity without an age minimum in 2024.
  period: 2024
  input:
    state_code: VA
    age: 40
    is_surviving_spouse: true
    is_tax_unit_head_or_spouse: true
    military_retirement_pay_survivors: 10_000
  output:
    va_military_benefit_subtraction: 10_000

- name: Virginia's surviving spouse subtraction retains the age minimum in 2023.
  period: 2023
  input:
    state_code: VA
    age: 54
    is_surviving_spouse: true
    is_tax_unit_head_or_spouse: true
    military_retirement_pay_survivors: 25_000
  output:
    va_military_benefit_subtraction: 0

- name: Virginia applies the 2023 cap to an age-eligible surviving spouse.
  period: 2023
  input:
    state_code: VA
    age: 55
    is_surviving_spouse: true
    is_tax_unit_head_or_spouse: true
    military_retirement_pay_survivors: 25_000
  output:
    va_military_benefit_subtraction: 20_000

- name: Virginia keeps own retirement pay separate from a nonspouse survivor annuity.
  period: 2025
  input:
    state_code: VA
    age: 60
    is_surviving_spouse: false
