- name: Federal cdcc limit is applied in 2022
  period: 2022
  input:
    capped_count_cdcc_eligible: 1
    state_code: VA
  output:
    va_child_dependent_care_deduction_cdcc_limit: 3_000

# 2022 Va. Acts ch. 3 conformed Virginia to the IRC as of December 31, 2021
# for 2021 returns; the revised 2021 Form 760 code 101 allows "up to $8,000
# for one dependent and $16,000 for two or more".
- name: ARPA's $8,000 one-person limit applies in 2021
  period: 2021
  input:
    capped_count_cdcc_eligible: 1
    state_code: VA
  output:
    va_child_dependent_care_deduction_cdcc_limit: 8_000

# Va. Code § 58.1-322.03(3) deducts the amount on which the federal credit is
# based (Form 2441 line 31), which IRC § 21(c) reduces by § 129 employer
# benefits. The Virginia limit inherits that reduction.
- name: Section 129 employer benefits reduce the Virginia limit
  period: 2024
  input:
    capped_count_cdcc_eligible: 2
    dependent_care_assistance_exclusion: 5_000
    state_code: VA
  output:
    # $6,000 two-child limit less the $5,000 exclusion.
    va_child_dependent_care_deduction_cdcc_limit: 1_000

- name: Section 129 benefits exceeding the limit floor it at zero
  period: 2024
  input:
    capped_count_cdcc_eligible: 1
    dependent_care_assistance_exclusion: 5_000
    state_code: VA
  output:
    # max($3,000 - $5,000, 0) = $0.
    va_child_dependent_care_deduction_cdcc_limit: 0

# IRC § 129(a)(2)(C) treats a separate filer living apart from their spouse as
# unmarried under § 21(e)(4), so the federal Form 2441 limit, and Virginia's,
# is reduced by the full $4,000 exclusion rather than the $2,500 MFS cap.
- name: Separate filer treated as unmarried has the limit reduced by the full exclusion
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
      person3:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: SEPARATE
    households:
      household:
        members: [person1, person2, person3]
        state_code: VA
  output:
    dependent_care_assistance_exclusion: 4_000
    # $6,000 two-child limit less the $4,000 exclusion.
    va_child_dependent_care_deduction_cdcc_limit: 2_000
