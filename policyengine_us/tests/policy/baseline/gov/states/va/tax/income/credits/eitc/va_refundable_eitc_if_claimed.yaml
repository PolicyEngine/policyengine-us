# The refundable EITC expires for taxable years beginning on/after 2030.
- name: VA 2030 Refundable EITC has expired
  period: 2030
  input:
    state_code: VA
    eitc: 5_000
  output:
    va_refundable_eitc_if_claimed: 0


- name: 2025 joint return with one claimable spouse gets no Virginia EITC (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_a, person_b]
        state_code: VA
  output:
    # Va. Code 58.1-339.8(B)(1).
    va_refundable_eitc_if_claimed: 0

- name: 2025 joint return with one claimable spouse gets no Virginia EITC (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_b, person_a]
        state_code: VA
  output:
    va_refundable_eitc_if_claimed: 0

- name: 2025 joint return with neither spouse claimable gets the Virginia EITC
  period: 2025
  input:
    people:
      person_a:
        age: 30
      person_b:
        age: 30
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_a, person_b]
        state_code: VA
  output:
    # 20% x $1,000.
    va_refundable_eitc_if_claimed: 200

# Va. Code 58.1-339.8(D) bars every credit in subsection B, the refundable EITC
# (B)(3) included, in a year in which the filers claim a listed benefit.
- name: 2025 Virginia National Guard subtraction bars the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_national_guard_subtraction: 1_000
  output:
    # 58.1-339.8(D)(1): the subtraction under 58.1-322.02(8).
    va_refundable_eitc_if_claimed: 0

- name: 2025 military basic pay subtraction bars the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_military_basic_pay_subtraction: 1_000
  output:
    # 58.1-339.8(D)(2): the subtraction under 58.1-322.02(15).
    va_refundable_eitc_if_claimed: 0

- name: 2025 federal and state employee subtraction bars the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_federal_state_employees_subtraction: 1_000
  output:
    # 58.1-339.8(D)(3): the subtraction under 58.1-322.02(16).
    va_refundable_eitc_if_claimed: 0

- name: 2025 aged or blind exemption bars the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_aged_blind_exemption: 800
  output:
    # 58.1-339.8(D)(4).
    va_refundable_eitc_if_claimed: 0

- name: 2025 age deduction bars the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_age_deduction: 12_000
  output:
    # 58.1-339.8(D)(5).
    va_refundable_eitc_if_claimed: 0

- name: 2025 military benefits subtraction alone does not bar the refundable EITC
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_military_benefit_subtraction: 10_000
  output:
    # Military benefits are subtracted under 58.1-322.02(18), which
    # 58.1-339.8(D) does not list. 20% x $1,000.
    va_refundable_eitc_if_claimed: 200

- name: 2025 refundable EITC has no poverty test
  period: 2025
  input:
    state_code: VA
    eitc: 1_000
    va_agi: 100_000
  output:
    # Only the low-income credit (B)(1) is limited to family VAGI at or below
    # the poverty guideline. 20% x $1,000.
    va_refundable_eitc_if_claimed: 200
