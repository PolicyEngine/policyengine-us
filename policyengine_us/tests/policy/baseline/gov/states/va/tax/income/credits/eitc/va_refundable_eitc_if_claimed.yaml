- name: Refundable rate at 15%
  period: 2022
  input:
    state_code: VA
    eitc: 1_000
  output:
    va_refundable_eitc_if_claimed: 150

- name: No EITC
  period: 2022
  input:
    state_code: VA
    eitc: 0
  output:
    va_refundable_eitc_if_claimed: 0

# 2025 tests - per 2025 Form 760 Instructions page 31
- name: VA 2025 Refundable EITC at 20%
  period: 2025
  input:
    state_code: VA
    eitc: 5_000
  output:
    # 2025: 20% of federal EITC
    va_refundable_eitc_if_claimed: 1_000

- name: VA 2025 Refundable EITC no federal credit
  period: 2025
  input:
    state_code: VA
    eitc: 0
  output:
    va_refundable_eitc_if_claimed: 0

# HB 30 (2026) extends the 20% refundable rate through TY2029. Under prior law
# the rate reverted after TY2026; these years now stay at 20%.
- name: VA 2027 Refundable EITC still at 20%
  period: 2027
  input:
    state_code: VA
    eitc: 5_000
  output:
    va_refundable_eitc_if_claimed: 1_000

- name: VA 2028 Refundable EITC still at 20%
  period: 2028
  input:
    state_code: VA
    eitc: 5_000
  output:
    va_refundable_eitc_if_claimed: 1_000

- name: VA 2029 Refundable EITC still at 20%
  period: 2029
  input:
    state_code: VA
    eitc: 5_000
  output:
    va_refundable_eitc_if_claimed: 1_000

# The refundable EITC expires for taxable years beginning on/after 2030.
- name: VA 2030 Refundable EITC has expired
  period: 2030
  input:
    state_code: VA
    eitc: 5_000
  output:
    va_refundable_eitc_if_claimed: 0


- name: 2025 joint return with one claimable spouse gets no Virginia EITC (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_a, person_b]
        state_code: VA
  output:
    # Va. Code 58.1-339.8(B)(1).
    va_refundable_eitc_if_claimed: 0

- name: 2025 joint return with one claimable spouse gets no Virginia EITC (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_b, person_a]
        state_code: VA
  output:
    va_refundable_eitc_if_claimed: 0

- name: 2025 joint return with neither spouse claimable gets the Virginia EITC
  period: 2025
  input:
    people:
      person_a:
        age: 30
      person_b:
        age: 30
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        eitc: 1000
    households:
      household:
        members: [person_a, person_b]
        state_code: VA
  output:
    # 20% x $1,000.
    va_refundable_eitc_if_claimed: 200
