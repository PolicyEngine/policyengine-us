  period: 2021
  input:
    filing_status: SINGLE
    real_estate_taxes: 5_000
    adjusted_gross_income: 300_000 # > $278,450
    state_and_local_sales_or_income_tax: 1_000
    state_code: VA
  output:
    va_reduced_itemized_deductions: 4_461.25

