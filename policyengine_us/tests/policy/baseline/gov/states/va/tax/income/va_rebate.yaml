# Virginia rebates are booked to the tax year whose return determines them,
# not the calendar year the check is paid:
#   2021 -> 2022 rebate ($250/$500), 2022 -> 2023 rebate ($200/$400),
#   2024 -> HB1600 TY2024 rebate ($200/$400); 2023 and 2025 carry no rebate.
- name: 2022 rebate booked to the 2021 return (single)
  period: 2021
  input:
    filing_status: SINGLE
    state_code: VA
  output:
    va_rebate: 250

- name: 2022 rebate booked to the 2021 return (joint)
  period: 2021
  input:
    filing_status: JOINT
    state_code: VA
  output:
    va_rebate: 500

- name: 2023 rebate booked to the 2022 return (single)
  period: 2022
  input:
    filing_status: SINGLE
    state_code: VA
  output:
    va_rebate: 200

- name: 2023 rebate booked to the 2022 return (joint)
  period: 2022
  input:
    filing_status: JOINT
    state_code: VA
  output:
    va_rebate: 400

- name: No rebate determined by the 2023 return
  period: 2023
  input:
    filing_status: JOINT
    state_code: VA
  output:
    va_rebate: 0

- name: HB1600 TY2024 rebate booked to the 2024 return (single)
  period: 2024
  input:
    filing_status: SINGLE
    state_code: VA
  output:
    va_rebate: 200

- name: HB1600 TY2024 rebate booked to the 2024 return (joint)
  period: 2024
  input:
    filing_status: JOINT
    state_code: VA
  output:
    va_rebate: 400

- name: Rebate sunsets after the 2024 return
  period: 2025
  input:
    filing_status: JOINT
    state_code: VA
  output:
    va_rebate: 0

# Historical guard regression.
# HB30 (2022 special session), chapter budget, Item 3-5.22(A): the rebate is
# measured from tax liability for taxable year 2021, not a 2020 entitlement.
# https://budget.lis.virginia.gov/item/2022/2/HB30/Chapter/3/3-5.22/
# Hand calculation: rebate $0, other nonrefundable credits $0, spouse adjustment
# $0; tax before refundable credits max($1,000 - $0 - $0, 0) = $1,000.
# Refundable credits $0; final income tax $1,000.
- name: Virginia rebate for the 2021 return does not reduce 2020 tax
  period: 2020
  absolute_error_margin: 0
  input:
    state_code: VA
    filing_status: SINGLE
    va_income_tax_before_non_refundable_credits: 1_000
    va_non_refundable_eitc: 0
    va_spouse_tax_adjustment: 0
    va_refundable_eitc: 0
  output:
    va_rebate: 0
    va_non_refundable_credits: 0
    va_income_tax_before_refundable_credits: 1_000
    va_refundable_credits: 0
    va_income_tax: 1_000

# The pre-program zero must backdate to 2015 for every filing-status branch.
- name: Virginia rebates are zero in 2015 for every filing status
  period: 2015
  absolute_error_margin: 0
  input:
    people:
      single: {}
      joint: {}
      separate: {}
      head_of_household: {}
      surviving_spouse: {}
    tax_units:
      single_unit:
        members: [single]
        filing_status: SINGLE
      joint_unit:
        members: [joint]
        filing_status: JOINT
      separate_unit:
        members: [separate]
        filing_status: SEPARATE
      head_of_household_unit:
        members: [head_of_household]
        filing_status: HEAD_OF_HOUSEHOLD
      surviving_spouse_unit:
        members: [surviving_spouse]
        filing_status: SURVIVING_SPOUSE
    households:
      single_household:
        members: [single]
        state_code: VA
      joint_household:
        members: [joint]
        state_code: VA
      separate_household:
        members: [separate]
        state_code: VA
      head_of_household_household:
        members: [head_of_household]
        state_code: VA
      surviving_spouse_household:
        members: [surviving_spouse]
        state_code: VA
  output:
    va_rebate: [0, 0, 0, 0, 0]
