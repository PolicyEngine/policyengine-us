- name: Each person's VAGI is their federal AGI less their own Virginia subtractions
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 2_500
      person2:
        adjusted_gross_income_person: 30_000
        va_subtractions_person: 7_500
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [7_500, 22_500]

- name: One person without income
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 2_000
      person2:
        adjusted_gross_income_person: 0
        va_subtractions_person: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [8_000, 0]

- name: Social Security subtraction applied directly to the recipient, not prorated
  period: 2025
  input:
    people:
      person1:
        age: 70
        employment_income: 100_000
      person2:
        age: 70
        social_security_retirement: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # person2's $17,000 taxable Social Security is exempt in Virginia and is
    # subtracted from her own Virginia AGI (not prorated to person1), so her
    # separate VAGI is 0. The two columns still sum to the tax unit's VAGI.
    va_agi_person: [100_000, 0]

- name: Unemployment subtraction applied directly to the recipient, not prorated
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 100_000
      person2:
        age: 45
        unemployment_compensation: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # Virginia subtracts unemployment compensation; person2's $15,000 is
    # attributed to her, so her separate VAGI is 0 rather than a prorated
    # share of the subtraction. The columns still sum to the tax unit's VAGI.
    va_agi_person: [100_000, 0]

- name: Age deduction applied directly to eligible person, not prorated
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 11_753
        age: 75
        is_tax_unit_head_or_spouse: true
      person2:
        adjusted_gross_income_person: 55_728
        age: 40
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        va_subtractions: 12_000
        va_age_deduction: 12_000
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [-247, 55_728]

- name: The head's IRA deduction lowers only the head's separate Virginia AGI.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 60_000
        traditional_ira_contributions: 6_000
      spouse:
        age: 45
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # Worksheet for Determining Separate Virginia Adjusted Gross Income,
    # line 10 (adjustments) and line 11. Before: [57_000, 37_000].
    va_agi_person: [54_000, 40_000]

- name: A spouse with negative federal AGI gets no share of the additions.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 0
      spouse:
        adjusted_gross_income_person: -1_000
        va_subtractions_person: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        va_additions: 1_000
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # Prorating by signed AGI would give the head 1,111.11 and the spouse
    # -111.11 of the additions.
    va_agi_person: [11_000, -1_000]
