- name: Each person's VAGI is their federal AGI less their own Virginia subtractions
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 2_500
      person2:
        adjusted_gross_income_person: 30_000
        va_subtractions_person: 7_500
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [7_500, 22_500]

- name: One person without income
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 2_000
      person2:
        adjusted_gross_income_person: 0
        va_subtractions_person: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [8_000, 0]

- name: Social Security subtraction applied directly to the recipient, not prorated
  period: 2025
  input:
    people:
      person1:
        age: 70
        employment_income: 100_000
      person2:
        age: 70
        social_security_retirement: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # person2's $17,000 taxable Social Security is exempt in Virginia and is
    # subtracted from her own Virginia AGI (not prorated to person1), so her
    # separate VAGI is 0. The two columns still sum to the tax unit's VAGI.
    va_agi_person: [100_000, 0]

- name: Unemployment subtraction applied directly to the recipient, not prorated
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 100_000
      person2:
        age: 45
        unemployment_compensation: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # Virginia subtracts unemployment compensation; person2's $15,000 is
    # attributed to her, so her separate VAGI is 0 rather than a prorated
    # share of the subtraction. The columns still sum to the tax unit's VAGI.
    va_agi_person: [100_000, 0]

- name: Age deduction applied directly to eligible person, not prorated
  period: 2021
  input:
    people:
      person1:
        adjusted_gross_income_person: 11_753
        age: 75
        is_tax_unit_head_or_spouse: true
      person2:
        adjusted_gross_income_person: 55_728
        age: 40
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        va_subtractions: 12_000
        va_age_deduction: 12_000
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_agi_person: [-247, 55_728]

- name: The head's IRA deduction lowers only the head's separate Virginia AGI.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 60_000
        traditional_ira_contributions: 6_000
      spouse:
        age: 45
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # Worksheet for Determining Separate Virginia Adjusted Gross Income,
    # line 10 (adjustments) and line 11. Before: [57_000, 37_000].
    va_agi_person: [54_000, 40_000]

- name: A spouse with negative federal AGI gets no share of the additions.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 10_000
        va_subtractions_person: 0
      spouse:
        adjusted_gross_income_person: -1_000
        va_subtractions_person: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        va_additions: 1_000
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # Prorating by signed AGI would give the head 1,111.11 and the spouse
    # -111.11 of the additions.
    va_agi_person: [11_000, -1_000]

- name: On a joint return, the head's capital loss lowers the head's separate VAGI by the joint deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 60_000
        long_term_capital_gains: -5_000
      spouse:
        age: 45
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # The joint federal return deducts $3,000 of the head's $5,000 loss, all
    # of it the head's. Filing status 3's recomputation as a separate federal
    # return ($1,500 limit, 58,500) applies only to separate Virginia
    # returns after a joint federal return, which PolicyEngine does not
    # model. Divided 50/50:
    # [58_500, 38_500].
    va_agi_person: [57_000, 40_000]

- name: After a separate federal return, the capital loss is limited to $1,500.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 60_000
        long_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
    households:
      household:
        members: [head]
        state_code: VA
  output:
    # 26 USC 1211(b): $1,500 for a married person filing separately.
    va_agi_person: 58_500
    va_agi: 58_500

- name: On a joint return, the head's business loss is limited by the joint Section 461(l) threshold.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 100_000
        self_employment_income: -400_000
      spouse:
        age: 45
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: VA
  output:
    # 2024 joint threshold $610,000, above the $400,000 loss, so the joint
    # return deducts all of it, all of it the head's: 100,000 - 400,000.
    # Filing status 3 after a joint federal return, which PolicyEngine does
    # not model, would apply the $305,000 separate threshold (-205,000).
    # Divided 50/50: [-100_000, -150_000].
    va_agi_person: [-300_000, 50_000]

- name: After a separate federal return, the business loss is limited by the separate Section 461(l) threshold.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 100_000
        self_employment_income: -400_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
    households:
      household:
        members: [head]
        state_code: VA
  output:
    # 2024 separate threshold $305,000 (Rev. Proc. 2023-34): 100,000 - 305,000.
    va_agi_person: -205_000
    va_agi: -205_000
