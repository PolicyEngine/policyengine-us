- name: Not eligible for the low income tax credit program because the tax filer is claimed as a dependent on another taxpayer's return.
  period: 2021
  input:
    state_code: VA
    claimed_as_dependent_on_another_return: true
    va_aged_blind_exemption: 0
    va_age_deduction: 0
    va_military_benefit_subtraction: 0
    va_federal_state_employees_subtraction: 0
  output:
    va_low_income_tax_credit_eligible: false

- name: Not eligible for the low income tax credit program because filled for items that disqualify him/her.
  period: 2021
  input:
    state_code: VA
    claimed_as_dependent_on_another_return: false
    va_aged_blind_exemption: 1_600
    va_age_deduction: 12_000
    va_military_benefit_subtraction: 0
    va_federal_state_employees_subtraction: 0
  output:
    va_low_income_tax_credit_eligible: false

- name: Eligible for the low income tax credit program.
  period: 2021
  input:
    state_code: VA
    claimed_as_dependent_on_another_return: false
    va_aged_blind_exemption: 0
    va_age_deduction: 0
    va_military_benefit_subtraction: 0
    va_federal_state_employees_subtraction: 0
  output:
    va_low_income_tax_credit_eligible: true

- name: Joint return is ineligible when either spouse is claimed as a dependent (the claimable spouse is the head)
  period: 2021
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: VA
  output:
    va_low_income_tax_credit_eligible: false

- name: Joint return is ineligible when either spouse is claimed as a dependent (the claimable spouse is the spouse)
  period: 2021
  input:
    people:
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: VA
  output:
    va_low_income_tax_credit_eligible: false

# Va. Code 58.1-339.8(D)(4): no credit when "any person claimed as a dependent"
# claims the additional exemption for blind or aged taxpayers on their own
# return. The model takes a blind or aged dependent to claim it.
- name: 2025 blind dependent bars the low income tax credit
  period: 2025
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 16
        is_blind: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: VA
  output:
    va_aged_blind_exemption: 0
    va_low_income_tax_credit_eligible: false

- name: 2025 aged dependent bars the low income tax credit
  period: 2025
  input:
    people:
      person_a:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      parent:
        age: 70
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, parent]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, parent]
        state_code: VA
  output:
    va_aged_blind_exemption: 0
    va_low_income_tax_credit_eligible: false

- name: 2025 dependent who is neither blind nor aged does not bar the low income tax credit
  period: 2025
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 16
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: VA
  output:
    va_low_income_tax_credit_eligible: true
