# Virginia subtracts the tier 1 railroad benefits in federal AGI on Form 760
# line 5 and the rest of the Railroad Retirement Act benefits in it on Schedule
# ADJ (code 22); 45 U.S.C. 231m(a). Adjusted federal AGI for the age deduction
# removes benefits taxed solely under IRC 86, which include tier 1 but not
# tier 2 (Va. Code 58.1-322.03(5)). A single filer born after January 1, 1939
# gets $12,000, less each dollar of adjusted federal AGI over $50,000.

- name: Virginia removes railroad benefits from AGI and the age deduction test.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 20_000
        railroad_social_security_equivalent_benefits: 20_000
        taxable_railroad_pension_benefits: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: VA
  output:
    # Federal: combined income = 30,000 + 10,000 = 40,000.
    # 86(a)(2)(A): 0.85 * 6,000 + min(7,500, 4,500) = 9,600, under the
    # 17,000 cap. AGI = 20,000 + 10,000 + 9,600 = 39,600.
    adjusted_gross_income: 39_600
    taxable_railroad_benefits: 19_600
    # 39,600 - 9,600 = 30,000, under 50,000: the full 12,000.
    va_age_deduction_agi: 30_000
    va_age_deduction: 12_000
    va_subtractions: 31_600
    va_agi: 8_000

- name: Tier 2 benefits stay in adjusted federal AGI for the age deduction.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 45_000
        railroad_social_security_equivalent_benefits: 10_000
        taxable_railroad_pension_benefits: 15_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: VA
  output:
    # Federal: combined income = 60,000 + 5,000 = 65,000, so the 85 percent
    # cap binds: 8,500. AGI = 45,000 + 15,000 + 8,500 = 68,500.
    adjusted_gross_income: 68_500
    taxable_railroad_benefits: 23_500
    # 68,500 - 8,500 = 60,000; 12,000 - (60,000 - 50,000) = 2,000.
    va_age_deduction_agi: 60_000
    va_age_deduction: 2_000
    va_subtractions: 25_500
    va_agi: 43_000
