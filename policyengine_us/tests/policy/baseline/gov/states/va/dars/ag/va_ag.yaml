- name: Case 6, benefit rounds a half dollar up.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 50
    va_ag_certified: true
    meets_ssi_disability_criteria: true
    social_security_disability: 18_000
    employment_income: 7_224
  output:
    # Earnings of 602 a month are below the 1,690 SGA level, so SSI disabled.
    # Countable: (1,500 - 20) + (602 - 65) * 0.5 = 1,748.50 > 994, so SSI is 0.
    # Need 2,130 + 87 = 2,217; 2,217 - 1,748.50 = 468.50, rounded up to 469
    # (half-to-even rounding would give 468).
    va_ag: 469

- name: Case 7, deficiency cents below fifty round down.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    county: ARLINGTON_COUNTY_VA
    va_ag_days_eligible: 14
  output:
    # Entry on January 18 gives 14 days: 2,450 / 30 * 14 = 1,143.33.
    # Need 1,143.33 + 87 = 1,230.33; SSI 994 makes countable income 994.
    # 1,230.33 - 994 = 236.33, rounded down to 236.
    va_ag: 236

- name: Case 8, income above need standard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    social_security_retirement: 24_000
    pension_income: 6_000
  output:
    # Countable: 2,000 + 500 - 20 = 2,480 > 994, so SSI is 0.
    # 2,480 exceeds the 2,217 need, so no grant.
    va_ag: 0

