- name: Case 24, approved facility rate above the maximum is capped.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    va_ag_facility_rate: 2_500
  output:
    va_ag_maximum_care_rate: 2_130
    va_ag_care_rate: 2_130
    # 2,500 is capped at 2,130: 2,130 + 87 - 994 = 1,223 (uncapped 1,593).
    va_ag: 1_223

- name: Case 25, applicant who appears eligible for SSI but does not apply is denied.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    takes_up_ssi_if_eligible: false
  output:
    # With no income the applicant meets SSI income standards (uncapped SSI
    # 994), so Chapter C 8.2.2 requires an SSI application and 8.2.2.2.1
    # denies the grant without one; otherwise the grant would pay 2,217.
    uncapped_ssi: 994
    ssi: 0
    va_ag_eligible: false
    va_ag: 0

- name: Case 26, applicant over the SSI income limit need not apply for SSI.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    takes_up_ssi_if_eligible: false
    social_security_retirement: 24_000
  output:
    # 994 - (2,000 - 20) = -986, so Chapter C 8.2.1 does not require an SSI
    # application: 2,217 - 1,980 = 237.
    uncapped_ssi: -986
    va_ag_eligible: true
    va_ag: 237

- name: Case 27, unrelated residents with a facility rate and a partial month.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
        va_ag_facility_rate: 1_500
      person2:
        age: 65
        va_ag_certified: true
        va_ag_partial_month_days: 15
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # Each input applies only to its own resident.
    va_ag_care_rate: [1_500, 2_130]
    # person1: 1,500 + 87 - 994 = 593.
    # person2: 2,130 / 30 * 15 = 1,065; 1,065 + 87 - 994 = 158.
    va_ag: [593, 158]

- name: Case 28, partial-month days do not carry into the next month.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    va_ag_partial_month_days:
      2026-02: 27
  output:
    # February: 2,130 / 30 * 27 = 1,917; 1,917 + 87 - 994 = 1,010.
    # March is a full month again: 2,130 + 87 - 994 = 1,223.
    va_ag:
      2026-02: 1_010
      2026-03: 1_223

- name: Case 29, standard rate follows the federal benefit rate in 2027.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
  output:
    # The maximum rate is the federal benefit rate plus 1,136, so for an
    # SSI-only resident the grant stays 1,136 + 87 = 1,223 whatever the FBR.
    va_ag: 1_223

- name: Case 30, entry-month community expenses do not carry into the next month.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    va_ag_partial_month_days:
      2026-01: 15
    va_ag_allowable_income_exclusions:
      2026-01: 400
  output:
    # January: 2,130 / 30 * 15 = 1,065; countable income 994 - 400 = 594;
    # 1,065 + 87 - 594 = 558.
    # February has no exclusion and a full month: 2,130 + 87 - 994 = 1,223.
    va_ag:
      2026-01: 558
      2026-02: 1_223

# AG Manual Chapter B section 6 (PDF pp. 34-35) tests marriage/co-residence
# at the first moment of the application month; entering separate facilities
# later in that month retains the joint budget recorded by the input.
# https://townhall.virginia.gov/l/GetFile.cfm?File=C:%5CTownHall%5Cdocroot%5CGuidanceDocs%5C262%5CGDoc_DARS_5346_v2.pdf#page=34
# Joint countable income = ($1,200 + $1,200 - $20) / 2 = $1,190 each;
# $2,130 maintenance + $87 personal needs - $1,190 = $1,027 grant each.
# Joint resources $1,600 + $1,600 = $3,200 exceed the $3,000 couple limit.
- name: Review VA spouses enter separate facilities during joint initial month
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      husband:
        age:
          2026: 72
        is_tax_unit_head:
          2026: true
        pension_income:
          2026: 14400
        ssi_countable_resources:
          2026: 1000
        va_ag_certified: true
        va_ag_is_joint_initial_month: true
      wife:
        age:
          2026: 70
        is_tax_unit_spouse:
          2026: true
        pension_income:
          2026: 14400
        ssi_countable_resources:
          2026: 1000
        va_ag_certified: true
        va_ag_is_joint_initial_month: true
    tax_units:
      joint_tax_unit:
        members:
        - husband
        - wife
    marital_units:
      declared_marriage:
        members:
        - husband
        - wife
    households:
      husband_facility:
        members:
        - husband
        state_code:
          2026: VA
      wife_facility:
        members:
        - wife
        state_code:
          2026: VA
  output:
    va_ag:
    - 1027
    - 1027
    ssi:
    - 0
    - 0
    va_ag_eligible:
    - true
    - true
    va_ag_countable_income:
    - 1190
    - 1190
