- name: Case 17, partial-month days equal to the month length are a full month.
  period: 2026-02
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: VA
    age:
      2026: 65
    va_ag_certified: true
    va_ag_partial_month_days: 28
  output:
    # 28 days covers all of February, so the rate is not prorated:
    # 2,130 + 87 - 994 = 1,223.
