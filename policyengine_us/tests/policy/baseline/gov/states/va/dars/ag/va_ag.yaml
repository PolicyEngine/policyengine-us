- name: Case 21, interest on countable resources is not counted for a non SSI applicant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    social_security_retirement: 24_000
    ssi_countable_resources: 2_000
    interest_income: 60
  output:
    # SSI counts the 5 monthly interest: 2,000 + 5 - 20 = 1,985 > 994, so SSI is 0.
    # The AG budget excludes it: 2,000 - 20 = 1,980 (resources 2,000 at the limit).
    # 2,217 - 1,980 = 237; counting the interest would give 232.
    va_ag: 237

- name: Case 22, noncitizen who is not a qualified alien.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    age: 65
    va_ag_certified: true
    immigration_status: UNDOCUMENTED
  output:
    # Chapter C section 9.4 limits eligibility to qualified aliens.
    # SSI is also 0, so without the gate the non-SSI budget would pay 2,217.
    ssi: 0
    va_ag_eligible: false
    va_ag: 0

