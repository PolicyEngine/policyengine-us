- name: Case 1, separate institutional SSI claims.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
        ssi_claim_is_joint: false
      person2:
        age: 65
        ssi_claim_is_joint: false
        va_ag_certified: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    va_ag: [1_223, 1_223]

