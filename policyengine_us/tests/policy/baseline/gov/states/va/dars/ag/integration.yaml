- name: Case 1, separate SSI claims.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
      person2:
        age: 65
        va_ag_certified: true
    # After the entry month spouses sharing a facility are individuals for
    # SSI (POMS SI 00501.154 B), so they sit in separate marital units.
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    ssi: [994, 994]
    va_ag: [1_223, 1_223]

- name: Case 2, joint SSI couple claim.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
      person2:
        age: 65
        va_ag_certified: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # Both aged spouses claim SSI jointly: 1,491 / 2 = 745.50 each.
    ssi_claim_is_joint: [true, true]
    ssi: [745.5, 745.5]
    # Chapter D: SSA's gross SSI plus net income, 745.50 + 0.
    va_ag_countable_income: [745.5, 745.5]
    # 2,130 + 87 - 745.50 = 1,471.50, rounded up to 1,472.
    va_ag: [1_472, 1_472]

- name: Case 3, spouse at home has income deemed in the resident's entry month.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
      person2:
        age: 63
        social_security_retirement: 18_000
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # In the entry month the spouses are still one marital unit, and
    # 20 CFR 416.1163(f)(2) stops deeming only from the following month
    # (Case 6). person2 (63, not disabled) is not SSI-eligible, so SSI
    # deems 1,500 - 20 = 1,480: 1,491 - 1,480 = 11.
    ssi: [11, 0]
    # Chapter D (p. 126) uses SSA's amounts: 1,480 + 11 = 1,491.
    # person2's own non-SSI budget is 1,500 - 20 = 1,480.
    va_ag_countable_income: [1_491, 1_480]
    # 2,130 + 87 - 1,491 = 726; person2 is not certified.
    va_ag: [726, 0]

