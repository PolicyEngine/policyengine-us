- name: Case 1, separate institutional SSI claims.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      first:
        age: 65
        va_ag_certified: true
        ssi_claim_is_joint: false
      second:
        age: 65
        ssi_claim_is_joint: false
        va_ag_certified: true
    marital_units:
      couple:
        members:
        - first
        - second
    tax_units:
      unit:
        members:
        - first
        - second
    households:
      household:
        members:
        - first
        - second
        state_code: VA
  output:
    va_ag:
    - 1223
    - 1223
