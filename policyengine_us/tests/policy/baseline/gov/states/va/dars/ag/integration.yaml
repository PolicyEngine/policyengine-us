- name: Case 3, non SSI spouse income is not deemed in ongoing care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        va_ag_certified: true
        is_ssi_spousal_deeming_applies: false
      person2:
        age: 63
        social_security_retirement: 18_000
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VA
  output:
    # No deeming: person1 has no income, so SSI is 994 - 0 = 994.
    # person2 (63, not disabled) is not SSI-eligible.
    # Deeming would count 1,500 - 20 = 1,480 and cut SSI to 1,491 - 1,480 = 11.
    ssi: [994, 0]
    # Countable income 0 + 994 = 994; 2,217 - 994 = 1,223.
    # With deeming it would be 2,217 - (1,480 + 11) = 726.
    va_ag: [1_223, 0]

