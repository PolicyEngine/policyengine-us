- name: Case 1, one deceased spouse
  period: 2022
  input:
    military_retirement_pay_survivors: 11_000
    state_code: SC
  output:
    sc_military_deduction_survivors: 11_000

# Only the head's and spouse's survivor benefits are in the filer's federal
# AGI; a dependent reports their own on their own return.
- name: A dependent's survivor benefits are not deducted from the filer's income.
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 12
        is_tax_unit_dependent: true
        military_retirement_pay_survivors: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_military_deduction_survivors: [0, 0]
    sc_military_deduction: 0

- name: The head's survivor benefits are deducted and the dependent's are not.
  period: 2025
  input:
    people:
      person1:
        age: 60
        military_retirement_pay_survivors: 9_000
      person2:
        age: 15
        is_tax_unit_dependent: true
        military_retirement_pay_survivors: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_military_deduction_survivors: [9_000, 0]
    sc_military_deduction: 9_000
