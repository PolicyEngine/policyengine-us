- name: 2025 joint return with neither spouse claimable (control): South Carolina dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 8000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: SC
  output:
    # One dependent x $4,930 (2025).
    sc_dependent_exemption: 4930
