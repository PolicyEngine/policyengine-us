- name: Case 1, above age threshold, military retirement deduction higher than cap.
  period: 2022
  input:
    taxable_pension_income: 1_000
    military_retirement_pay: 11_000
    age: 70
    is_tax_unit_head_or_spouse: true
    state_code: SC
  output:
    sc_retirement_deduction_indv: 0

