- name: Test case 5 # if federal standard deduction > itemized deductoins
  period: 2021
  input:
    filing_status: JOINT
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 6_000
    standard_deduction: 8_000
    real_estate_taxes: 3_000
    state_and_local_sales_or_income_tax: 1_000
    state_code: SC
  output:
    sc_state_tax_addback: 0
    # line 3 = max(0, 6000 - 8000) = 0
    # line 4 = 1000
    # line 5 = 10000 - 3000 = 7000

- name: Test case 6 # not eligible for federal itemized deductoins
  period: 2021
  input:
    filing_status: JOINT
    tax_unit_itemizes: false
    itemized_taxable_income_deductions: 6_000
    standard_deduction: 2_000
    real_estate_taxes: 3_000
    state_and_local_sales_or_income_tax: 1_000
    state_code: SC
  output:
    sc_state_tax_addback: 0

# Line 5 is the real estate and personal property taxes on federal Schedule A,
# which holds only the filers' own taxes.
- name: A dependent's real estate taxes do not shrink the add-back of the filers' income tax
  period: 2022
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 3_000
      spouse:
        age: 43
      child:
        age: 15
        real_estate_taxes: 4_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        tax_unit_itemizes: true
        itemized_taxable_income_deductions: 50_000
        standard_deduction: 25_900
        state_and_local_sales_or_income_tax: 8_000
    households:
      household:
        members: [head, spouse, child]
        state_code: SC
  output:
    # Line 3 = 50_000 - 25_900 = 24_100; line 5 = 10_000 - 3_000 = 7_000.
    # min(8_000, 7_000, 24_100) = 7_000.
    sc_state_tax_addback: 7_000
