- name: Case 1, in 2022, above age threshold
  period: 2022
  input:
    pension_survivors: 1_000
    military_retirement_pay_survivors: 4_000
    age: 70
    state_code: SC
  output:
    sc_retirement_deduction_survivors: 1_000

- name: Case 2, in 2022, below age threshold
  period: 2022
  input:
    pension_survivors: 4_000
    military_retirement_pay_survivors: 6_000
    age: 64
    state_code: SC
  output:
    sc_retirement_deduction_survivors: 3_000

- name: Case 3, in 2021, above age threshold
  period: 2021
  input:
    pension_survivors: 2_000
    military_retirement_pay_survivors: 4_000
    age: 70
    state_code: SC
  output:
    sc_retirement_deduction_survivors: 2_000

- name: Case 4, in 2021, below age threshold
  period: 2021
  input:
    pension_survivors: 4_000
    military_retirement_pay_survivors: 6_000
    age: 64
    state_code: SC
  output:
    sc_retirement_deduction_survivors: 0

# Only the head's and spouse's survivor benefits are in the filer's federal
# AGI; a dependent reports their own on their own return.
- name: A dependent's survivor pension is not deducted from the filer's income.
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 12
        is_tax_unit_dependent: true
        pension_survivors: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_retirement_deduction_survivors: [0, 0]
