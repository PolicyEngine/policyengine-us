- name: Case 10, 2018 SC EITC respects the federal award and remaining tax.
  period: 2018
  absolute_error_margin: 0.01
  input:
    # Independently known federal awards, SC liabilities and prior-credit amounts.
    # These isolate state-credit composition, not complete federal/SC entitlement.
    people:
      person1: {age: 40, is_tax_unit_head: true}
      person2: {age: 6, is_tax_unit_dependent: true}
      person3: {age: 40, is_tax_unit_head: true}
      person4: {age: 6, is_tax_unit_dependent: true}
      person5: {age: 40, is_tax_unit_head: true}
      person6: {age: 6, is_tax_unit_dependent: true}
    tax_units:
      tax_unit1:
        members: [person1, person2]
        eitc: 0
        sc_income_tax_before_non_refundable_credits: 100
        sc_cdcc_potential: 0
      tax_unit2:
        members: [person3, person4]
        eitc: 1_000
        sc_income_tax_before_non_refundable_credits: 0
        sc_cdcc_potential: 0
      tax_unit3:
        members: [person5, person6]
        eitc: 1_000
        sc_income_tax_before_non_refundable_credits: 100
        sc_cdcc_potential: 50
    households:
      household1:
        members: [person1, person2]
        state_code: SC
      household2:
        members: [person3, person4]
        state_code: SC
      household3:
        members: [person5, person6]
        state_code: SC
  output:
    # Act40 section16(A)-(B)/2018TC60: federal award *20.83%, nonrefundable.
    # Row3 leaves100-50=50 of tax after the independently known prior CDCC.
    sc_eitc_potential: [0, 208.3, 208.3]
    sc_cdcc: [0, 0, 50]
    sc_eitc: [0, 0, 50]
