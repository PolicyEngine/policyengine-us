- name: Case 7, 2017 SC EITC is zero before enactment.
  period: 2017
  absolute_error_margin: 0.01
  input:
    # Known annual federal award and SC liability isolate the state component.
    # They do not establish full federal eligibility or historical SC tax law.
    state_code: SC
    eitc: 1_000
    sc_income_tax_before_non_refundable_credits: 1_000
    sc_cdcc_potential: 0
  output:
    # Act40(2017) section16(C) applies the credit to tax years after2017.
    # https://www.scstatehouse.gov/sess122_2017-2018/bills/3516.htm
    sc_eitc_potential: 0
    sc_eitc: 0

