- name: 1 child under 6 gets $4,430 young child exemption.
  period: 2022
  input:
    people:
      parent: {}
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    sc_young_child_deduction: 4_430

- name: Family with a child age 6 and two children age 4 gets two young child exemptions.
  period: 2022
  input:
    people:
      parent: {}
      child1:
        age: 4
      child2:
        age: 4
      child3:
        age: 6
    tax_units:
      tax_unit:
        members: [parent, child1, child2, child3]
    households:
      household:
        members: [parent, child1, child2, child3]
        state_code: SC
  output:
    sc_young_child_deduction: 8_860

- name: 2025 child under 6 gets $4,930 young child deduction.
  period: 2025
  input:
    people:
      parent: {}
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # 2025 young child deduction amount is $4,930
    sc_young_child_deduction: 4_930

- name: 2025 boundary, child age 6 does not qualify for young child deduction.
  period: 2025
  input:
    people:
      parent: {}
      child:
        age: 6
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Young child deduction requires child to be under age 6 (ineligible_age = 6)
    # Child age 6 does NOT qualify - must be younger than 6
    sc_young_child_deduction: 0

- name: 2025 single filer who can be claimed as a dependent: no South Carolina young child deduction
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: SC
  output:
    # S.C. Code 12-6-1160 requires a dependent eligible for the South
    # Carolina dependent exemption, which a claimable filer has none of.
    sc_young_child_deduction: 0

- name: 2025 joint return with one claimable spouse: no South Carolina young child deduction (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: SC
  output:
    sc_young_child_deduction: 0

