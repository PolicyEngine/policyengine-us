      person1:
        age: 35
        employment_income: 60000
        immigration_status: CITIZEN
        weekly_hours_worked: 40
        childcare_hours_per_week: 0
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
      person2:
        age: 33
        weekly_hours_worked: 35
        childcare_hours_per_week: 0
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
      person3:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_week: 0
        sc_ccap_provider_type: CENTER
        sc_ccap_quality_level: C
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
      person4:
        age: 8
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_week: 0
        sc_ccap_provider_type: CENTER
        sc_ccap_quality_level: C
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        - person3
        - person4
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
        - person4
        spm_unit_pre_subsidy_childcare_expenses: 0
        tanf: 0
    households:
      household:
        members:
        - person1
        - person2
        - person3
        - person4
        state_code: SC
        sc_ccap_geography: URBAN
  output:
    sc_ccap: 0
- name: Head Start still selects half-time with unknown hours.
  period: 2026-01
  input:
    state_code: SC
    is_enrolled_in_head_start: true
    childcare_attending_days_per_month: 20
  output:
    sc_ccap_time_category: HALF_TIME
