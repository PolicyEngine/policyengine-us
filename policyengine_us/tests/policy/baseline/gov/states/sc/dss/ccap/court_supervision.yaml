# Authority: https://scchildcare.org/media/bxkiasbl/acf-118-ccdf-ffy-2025-2027-for-south-carolina-approved-state-plan.pdf#page=21
# Court supervision extends the age limit through 18. From October 2024 the
# protective services definition includes court supervision, so the copay is
# waived (manual 2.4 and 3.4.2; plan 2.2.2(f) and 3.3.1(vi)). Income and
# activity waivers are case-by-case (plan 2.2.2(g)-(h)) and not modeled.

- name: Case 1, court-supervised child at age 12.
  period: 2026-01
  input:
    state_code: SC
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    sc_ccap_eligible_child: true

