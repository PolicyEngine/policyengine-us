- name: Case 8, court supervision combines with disability and applies below 13.
  period: 2026-01
  input:
    state_code: [SC, SC, SC, SC]
    age: [12, 17, 18, 19]
    is_tax_unit_dependent: [true, true, true, true]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [false, true, true, true]
    is_under_court_supervision: [true, true, true, true]
  output:
    sc_ccap_eligible_child: [true, true, true, false]

- name: Case 9, a court-supervised 15-year-old receives a benefit through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 42
        weekly_hours_worked: 40
        employment_income: 36_000
        immigration_status: CITIZEN
      person2:
        age: 15
        is_disabled: false
        is_under_court_supervision: true
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_week: 30
        sc_ccap_provider_type: CENTER
        sc_ccap_quality_level: C
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    households:
      household:
        members: [person1, person2]
        state_code: SC
        sc_ccap_geography: URBAN
  output:
    # person2: age 15, not disabled, under court supervision => limit 19, not 13
    sc_ccap_eligible_child: [false, true]
    # Countable income: 36,000 / 12 = 3,000 per month
    sc_ccap_countable_income: 3_000
    # 2-person SMI: 102,542 * (0.52 + 0.16) = 69,728.56 / 12 = 5,810.71 per month
    # Income limit: 5,810.71 * 0.85 = 4,939.11 >= 3,000
    sc_ccap_income_eligible: true
    # person1 works 40 hours >= 15
    sc_ccap_activity_eligible: true
    sc_ccap_eligible: true
    # Ages 6 and older use the age 5-12 in-school rate group
    sc_ccap_age_group: [AGE_5_12_IN_SCHOOL, AGE_5_12_IN_SCHOOL]
    # Center, level C, full time (30 hours >= 25), age 5-12 in school, urban = $165
    sc_ccap_maximum_weekly_benefit: [0, 165]
    # Fee scale for 2 people:
    #   150% FPG floor: (15,960 + 5,680) * 1.5 / 12 = 2,705
    #   85% SMI ceiling: 4,939.11 rounds to 4,939
    #   Band width: ceil((4,939 - 2,705) / 5) = 447
    #   3,000 > 2,705 and <= 2,705 + 447 = 3,152 => first paid tier, $6 per week
    # Copay: 6 * 52 / 12 = 26; 2% cap: 3,000 * 0.02 = 60 => 26
    sc_ccap_copay: 26
    # Maximum monthly benefit: 165 * 52 / 12 = 715
    # Expense: 12,000 / 12 = 1,000
    # Benefit: min(1,000, 715) - 26 = 689
    sc_ccap: 689

- name: Case 10, without court supervision the same teenager receives nothing.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 42
        weekly_hours_worked: 40
        employment_income: 36_000
        immigration_status: CITIZEN
      person2:
        age: 15
        is_disabled: false
        is_under_court_supervision: false
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_week: 30
        sc_ccap_provider_type: CENTER
        sc_ccap_quality_level: C
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    households:
      household:
        members: [person1, person2]
        state_code: SC
        sc_ccap_geography: URBAN
  output:
    # person2: age 15, not disabled, no court supervision => limit 13; 15 >= 13
    sc_ccap_eligible_child: [false, false]
    sc_ccap_eligible: false
    sc_ccap: 0
