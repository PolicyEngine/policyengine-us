# Authority: https://scchildcare.org/media/bxkiasbl/acf-118-ccdf-ffy-2025-2027-for-south-carolina-approved-state-plan.pdf#page=21
# Court status is distinct from protective-services or child-care authorization.

- name: SC court-supervised child at age 12.
  period: 2026-01
  input:
    state_code: SC
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    sc_ccap_eligible_child: true

