# SC CCAP time category tests
# sc_ccap_time_category is Person, derived from childcare_hours_per_week

- name: Case 1, full time at 30 hours per week.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 30
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [FULL_TIME]

- name: Case 2, half time at 20 hours per week.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 20
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [HALF_TIME]

- name: Case 3, full time at exactly 25 hours per week.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 25
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [FULL_TIME]

- name: Case 4, half time at 24 hours per week.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 24
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [HALF_TIME]

- name: Case 5, full time at 40 hours per week.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 40
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [FULL_TIME]

- name: Case 6, unknown hours retain full-time pricing.
  period: 2025
  input:
    people:
      person1:
        childcare_hours_per_week: 0
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_ccap_time_category: [FULL_TIME]

# Two hours per day cannot exceed 14 hours per week.
- name: Case 7, two daily hours remain part time even across seven days.
  period: 2026-01
  input:
    state_code: SC
    age: 3
    childcare_hours_per_day: 2
  output:
    sc_ccap_time_category: HALF_TIME
- name: Case 8, daily hours and monthly attendance determine weekly pricing.
  period: 2026-01
  input:
    state_code: SC
    age: 3
    childcare_hours_per_day: 3
    childcare_attending_days_per_month: 20
  output:
    sc_ccap_time_category: HALF_TIME
- name: Case 9, reported weekly hours take precedence over daily conversion.
  period: 2026-01
  input:
    state_code: SC
    age: 3
    childcare_hours_per_day: 2
    childcare_hours_per_week: 40
  output:
    sc_ccap_time_category: FULL_TIME
- name: Case 10, care days without hours retain the full-time fallback.
  period: 2026-01
  input:
    state_code: SC
    age: 3
    childcare_days_per_week: 5
  output:
    sc_ccap_time_category: FULL_TIME
