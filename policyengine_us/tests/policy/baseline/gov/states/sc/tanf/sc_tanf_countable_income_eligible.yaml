- name: Case 1, no income is eligible.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf_countable_income_eligible: true

- name: Case 2, countable income below need standard.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_countable_income: 800
  output:
    sc_tanf_countable_income_eligible: true
    # FPG for a benefit group of 2 (2025-01) = 1703.33/month
    # need_standard = floor(1703.33 * 0.5 = 851.67) = 851
    # 800 < 851 -> eligible

- name: Case 3, countable income above need standard.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_countable_income: 900
  output:
    sc_tanf_countable_income_eligible: false
    # need_standard = 851
    # 900 >= 851 -> not eligible

- name: Case 4, countable income exactly at need standard.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_countable_income: 851
  output:
    sc_tanf_countable_income_eligible: false
    # FPG for a benefit group of 2 = 1703.33
    # need_standard = floor(1703.33 * 0.5 = 851.67) = 851
    # 851 < 851 is FALSE (strict less than)
    # -> not eligible
