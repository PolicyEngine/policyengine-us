        employment_income_before_lsr: 0
      parent2:
        age: 33
        employment_income_before_lsr: 0
      child1:
        age: 14
        is_child_dependent: true
      child2:
        age: 12
        is_child_dependent: true
      child3:
        age: 8
        is_child_dependent: true
      child4:
        age: 5
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2, child3, child4]
        spm_unit_cash_assets: 1_000
    households:
      household:
        members: [parent1, parent2, child1, child2, child3, child4]
