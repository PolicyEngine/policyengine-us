- name: Case 1, single parent of 2 children with no income.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 0
      person2:
        age: 10
        is_child_dependent: true
      person3:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 1_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    sc_tanf: 434
    # tanf_fpg for size 3 (2025-01, uses 2024-10 FPG) = 2151.67/month
    # 114-1140(A)(4) and the Section 8.15 table drop the cents of the need
    # standard and the payment.
    # need_standard = floor(2151.67 * 0.5 = 1075.83) = 1075
    # benefit = floor(1075 * 0.4046 = 434.95) = 434

- name: Case 2, single parent with earned income.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 6_000
      person2:
        age: 10
        is_child_dependent: true
      person3:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 1_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    sc_tanf: 333
    # monthly earned = 6,000/12 = 500
    # January (month 1) uses 50% disregard
    # countable_earned = 500 * 0.5 = 250
    # countable_income = 250
    # need_standard = 1075
    # excess = 1075 - 250 = 825
    # benefit = floor(825 * 0.4046 = 333.80) = 333

- name: Case 3, income above gross limit.
  period: 2025-01
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 24_000
      person2:
        age: 10
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_tanf: 0
    # monthly earned = 24,000/12 = 2,000
    # tanf_fpg for size 2 = 1703.33
    # need_standard = floor(851.67) = 851
    # gross_income_limit = floor(851 * 1.85 = 1574.35) = 1574
    # 2,000 > 1,574 -> not eligible

