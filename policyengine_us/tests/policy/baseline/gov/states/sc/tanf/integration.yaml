- name: Case 9, 2020 unemployment compensation below the federal exclusion counts in full.
  period: 2020-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        unemployment_compensation: 6_000
      person2:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    # 2020 federal exclusion: first 10,200 of UC is tax-exempt,
    # so taxable UC = max(6,000 - 10,200, 0) = 0.
    taxable_unemployment_compensation: [0, 0]
    # Section 7.7 counts gross UC: 6,000 / 12 = 500 per month.
    total_unemployment_compensation: [500, 0]
    sc_tanf_gross_unearned_income: [500, 0]
    sc_tanf_countable_income: 500
    # tanf_fpg for size 2 (2020-01, uses 2019 FPG) = 16,910 / 12 = 1,409.17
    # need_standard = floor(1,409.17 * 0.5 = 704.58) = 704
    # 500 < 704 -> countable income eligible
    sc_tanf_income_eligible: true
    # excess = 704 - 500 = 204
    # benefit = floor(204 * 0.3372 = 68.79) = 68
    # (Counting taxable UC instead gave floor(704 * 0.3372) = 237.)
    sc_tanf: 68

- name: Case 10, 2020 unemployment compensation above the federal exclusion counts in full.
  period: 2020-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        unemployment_compensation: 12_000
      person2:
        age: 8
        is_child_dependent: true
      person3:
        age: 7
        is_child_dependent: true
      person4:
        age: 6
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: SC
  output:
    # taxable UC = 12,000 - 10,200 = 1,800 per year = 150 per month.
    taxable_unemployment_compensation: [150, 0, 0, 0]
    # Gross UC counts: 12,000 / 12 = 1,000 per month.
    total_unemployment_compensation: [1_000, 0, 0, 0]
    sc_tanf_gross_unearned_income: [1_000, 0, 0, 0]
    sc_tanf_countable_income: 1_000
    # tanf_fpg for size 4 (2020-01, uses 2019 FPG) = 25,750 / 12 = 2,145.83
    # need_standard = floor(2,145.83 * 0.5 = 1,072.92) = 1,072
    # 1,000 < 1,072 -> countable income eligible
    sc_tanf_income_eligible: true
    # excess = 1,072 - 1,000 = 72
    # benefit = floor(72 * 0.3372 = 24.28) = 24
    # (Counting taxable UC instead gave floor((1,072 - 150) * 0.3372) = 310.)
    sc_tanf: 24

- name: Case 11, gross Social Security counts when none of it is federally taxable.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        social_security_disability: 6_000
      person2:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    # Provisional income = 6,000 * 0.5 = 3,000, below the 25,000 base
    # amount, so taxable Social Security = 0.
    taxable_social_security: [0, 0]
    # Section 7.7 counts the gross SSA benefit: 6,000 / 12 = 500 per month.
    social_security: [500, 0]
    sc_tanf_gross_unearned_income: [500, 0]
    sc_tanf_countable_income: 500
    # tanf_fpg for size 2 (2025-01) = 1,703.33
    # need_standard = floor(1,703.33 * 0.5 = 851.67) = 851
    # 500 < 851 -> countable income eligible
    sc_tanf_income_eligible: true
    # excess = 851 - 500 = 351
    # benefit = floor(351 * 0.4046 = 142.01) = 142
    # (Counting taxable Social Security instead gave floor(851 * 0.4046) = 344.)
    sc_tanf: 142

- name: Case 12, gross Social Security above the need standard makes the family ineligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 35
        social_security_disability: 12_000
      person2:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    # Provisional income = 12,000 * 0.5 = 6,000 < 25,000 -> taxable SS = 0.
    taxable_social_security: [0, 0]
    # Gross SSA benefit counts: 12,000 / 12 = 1,000 per month.
    sc_tanf_countable_income: 1_000
    # need_standard = 851; 1,000 >= 851 -> not income eligible
    sc_tanf_income_eligible: false
    # (Counting taxable Social Security instead paid 344.)
    sc_tanf: 0

- name: Case 13, gross Social Security and unemployment compensation both count once.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        social_security_disability: 3_600
        unemployment_compensation: 2_400
      person2:
        age: 10
        is_child_dependent: true
      person3:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    # SS = 3,600 / 12 = 300 per month; taxable SS = 0.
    # UC = 2,400 / 12 = 200 per month (fully taxable after 2020).
    taxable_social_security: [0, 0, 0]
    taxable_unemployment_compensation: [200, 0, 0]
    # gross unearned = 300 + 200 = 500
    sc_tanf_gross_unearned_income: [500, 0, 0]
    sc_tanf_countable_income: 500
    # tanf_fpg for size 3 (2025-01) = 2,151.67
    # need_standard = floor(2,151.67 * 0.5 = 1,075.83) = 1,075
    # excess = 1,075 - 500 = 575
    # benefit = floor(575 * 0.4046 = 232.65) = 232
    # (Counting taxable SS instead gave floor((1,075 - 200) * 0.4046) = 354.)
    sc_tanf: 232

- name: Case 14, child support, a child's Social Security and interest above the exclusion.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 0
        child_support_received: 3_600
        taxable_interest_income: 1_000
      person2:
        age: 9
        is_child_dependent: true
        social_security_survivors: 4_800
      person3:
        age: 6
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    sc_tanf_gross_income: 750
    sc_tanf: 131
    # SC DSS TANF Policy Manual (Volume 67), Section 7.7:
    # child support paid directly = 3,600/12 = 300 (page 108)
    # child's SSA benefits, gross = 4,800/12 = 400 (page 116)
    # interest = (1,000 - 400 exclusion)/12 = 50 (page 113)
    # gross income = 300 + 400 + 50 = 750
    # tanf_fpg for size 3 = 2151.67; need standard = floor(1075.83) = 1075
    # gross income limit = 1075 * 1.85 = 1,988.75 (114-1150(A)); 750 passes
    # benefit = floor((1075 - 750) * 0.4046 = 131.50) = 131

- name: Case 15, an SSI child and the child's income are excluded from the benefit group.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 0
      person2:
        age: 9
        is_child_dependent: true
        receives_ssi: true
        taxable_private_pension_income: 3_600
      person3:
        age: 6
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    sc_tanf_benefit_group_size: 2
    sc_tanf_gross_income: 0
    sc_tanf_need_standard: 851
    sc_tanf: 344
    # SC DSS TANF Policy Manual (Volume 67), Section 3.6 (page 56) and
    # Section 7.7 (page 117): exclude the SSI recipient, his/her income and
    # resources. The benefit group is the parent and the other child.
    # FPG for 2 = 1703.33; need standard = floor(851.67) = 851
    # benefit = floor(851 * 0.4046 = 344.31) = 344

- name: Case 16, when the only child receives SSI, the parent is the only benefit group member.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 0
      person2:
        age: 9
        is_child_dependent: true
        receives_ssi: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_tanf_benefit_group_size: 1
    sc_tanf: 253
    # Section 3.6 (page 56): "If an SSI child is the only child in the home,
    # include the parent(s) as the only BG member."
    # FPG for 1 = 1255; need standard = floor(627.50) = 627
    # benefit = floor(627 * 0.4046 = 253.68) = 253

- name: Case 17, an SSI child's savings do not count against the resource limit.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 0
        bank_account_assets: 800
      person2:
        age: 9
        is_child_dependent: true
        receives_ssi: true
        bank_account_assets: 1_800
      person3:
        age: 6
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: SC
  output:
    sc_tanf_countable_resources: 800
    sc_tanf: 344
    # Sections 3.6 (page 56) and 7.7 (page 117) exclude the SSI child's
    # resources: 2,600 - 1,800 = 800, within the $2,500 limit (page 91).
    # Benefit group of 2: need standard 851; benefit = floor(851 * 0.4046) = 344

# Rules added for dependent children's earnings (114-1140(N)(1); Section 7.5,
# PDF page 105; Section 8.16 B, page 134), child support paid (114-1140(L);
# Section 8.11, page 131; Section 8.16 D and F, page 134) and whole dollars
# (114-1140(A)(4); the Section 8.15 table notes, page 133). 2026 months use
# the 2025 guideline: a group of three has a need standard of
# floor(26,650 / 12 x 0.5) = 1,110.

- name: Case 18, a parent and two children with no income.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    sc_tanf_need_standard: 1_110
    # floor(1,110 x 0.4046 = 449.11) = 449. Without rounding:
    # 1,110.42 x 0.4046 = 449.27.
    sc_tanf: 449

- name: Case 19, a dependent child's earnings are excluded.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
      child1:
        age: 16
        is_tax_unit_dependent: true
        employment_income_before_lsr: 6_000
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # Section 7.5: "Earned income of a dependent child(ren) is excluded".
    sc_tanf_dependent_child: [false, true, true]
    sc_tanf_gross_earned_income: [0, 0, 0]
    sc_tanf_gross_income: 0
    sc_tanf_countable_income: 0
    # Counting the child's 500 a month gave a 50% January disregard, 250
    # countable, and (1,110.42 - 250) x 0.4046 = 348.12.
    sc_tanf: 449

- name: Case 20, a dependent child's unearned income still counts.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
      child1:
        age: 16
        is_tax_unit_dependent: true
        employment_income_before_lsr: 6_000
        social_security_survivors: 2_400
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # Section 7.5 excludes only the child's earned income: 2,400 / 12 = 200.
    sc_tanf_gross_unearned_income: [0, 200, 0]
    sc_tanf_gross_income: 200
    sc_tanf_countable_income: 200
    # floor((1,110 - 200) x 0.4046 = 368.19) = 368.
    sc_tanf: 368

- name: Case 21, child support paid comes off earned income after the disregard.
  # Annual inputs cover calendar 2026; outputs select May, when the $100
  # disregard applies.
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        employment_income_before_lsr: 7_200
        child_support_expense: 2_400
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # May uses the $100 disregard: E = 600 - 100 = 500; S = 2,400 / 12 = 200.
    sc_tanf_child_support_deduction:
      2026-05: 200
    sc_tanf_countable_income:
      2026-05: 300
    # The Section 8.15 gross income test stays on gross income.
    sc_tanf_gross_income:
      2026-05: 600
    # floor((1,110 - 300) x 0.4046 = 327.73) = 327.
    sc_tanf:
      2026-05: 327

- name: Case 22, support paid by an adult with no income doesn't come off another adult's earnings.
  # Annual inputs cover calendar 2026; outputs select May, when the $100
  # disregard applies.
  period: 2026
  input:
    people:
      adult_a:
        age: 40
        is_tax_unit_head: true
        child_support_expense: 2_400
      adult_b:
        age: 38
        is_tax_unit_spouse: true
        employment_income_before_lsr: 7_200
      child:
        age: 10
        is_tax_unit_dependent: true
    marital_units:
      couple:
        members: [adult_a, adult_b]
      child_unit:
        members: [child]
    households:
      household:
        members: [adult_a, adult_b, child]
        state_code: SC
  output:
    # 114-1140(L) deducts support "from the income of the payor". Adult A
    # has no income, so nothing is deducted, and B's earnings count:
    # E = 600 - 100 = 500.
    sc_tanf_child_support_deduction:
      2026-05: 0
    sc_tanf_countable_income:
      2026-05: 500
    # floor((1,110 - 500) x 0.4046 = 246.81) = 246. Taking A's 200 from the
    # group's income would leave 300 countable and
    # floor(810 x 0.4046 = 327.73) = 327.
    sc_tanf:
      2026-05: 246

- name: Case 23, support paid above the payer's income stops at zero.
  # Annual inputs cover calendar 2026; outputs select May, when the $100
  # disregard applies.
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        employment_income_before_lsr: 3_000
        alimony_income: 1_200
        child_support_expense: 3_600
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # E = 250 - 100 = 150, U = 100, S = 300: the deduction takes E, then U,
    # and stops at min(300, 250) = 250, leaving 0.
    sc_tanf_child_support_deduction:
      2026-05: 250
    sc_tanf_countable_income:
      2026-05: 0
    sc_tanf_gross_income:
      2026-05: 350
    sc_tanf:
      2026-05: 449

- name: Case 24, a pregnant adult's wages count.
  period: 2026-01
  input:
    people:
      parent:
        age: 25
        is_pregnant: true
        is_tax_unit_head: true
        employment_income_before_lsr: 6_000
    households:
      household:
        members: [parent]
        state_code: SC
  output:
    # Pregnancy does not make an adult a dependent child: 500 x 0.5 = 250
    # countable in January. Need standard floor(15,650 / 12 x 0.5) = 652.
    sc_tanf_dependent_child: false
    sc_tanf_countable_income: 250
    # floor((652 - 250) x 0.4046 = 162.65) = 162.
    sc_tanf: 162

- name: Case 25, in January the deduction follows the 50% disregard.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        employment_income_before_lsr: 7_200
        child_support_expense: 2_400
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # Section 8.16 applies the disregard first: E = 600 x 0.5 = 300, less
    # S = 200, leaves 100. Deducting support first would leave
    # (600 - 200) x 0.5 = 200.
    sc_tanf_child_support_deduction: 200
    sc_tanf_countable_income: 100
    sc_tanf_gross_income: 600
    # floor((1,110 - 100) x 0.4046 = 408.65) = 408.
    sc_tanf: 408

- name: Case 26, a minor parent who lives with no adult heads the household.
  period: 2026-01
  input:
    people:
      minor_parent:
        age: 17
        employment_income_before_lsr: 6_000
      baby:
        age: 0
    households:
      household:
        members: [minor_parent, baby]
        state_code: SC
  output:
    # No tax-unit role is input. In a group with no adult the oldest member
    # heads the household, so Section 7.5 counts her earnings.
    sc_tanf_dependent_child: [false, true]
    sc_tanf_gross_earned_income: [500, 0]
    sc_tanf_gross_income: 500
    # 6,000 / 12 = 500 a month, less the 50% January disregard: 250.
    sc_tanf_countable_income: 250
    # Size 2: floor((15,650 + 5,500) / 12 x 0.5 = 881.25) = 881.
    sc_tanf_need_standard: 881
    # floor((881 - 250) x 0.4046 = 255.30) = 255. Treating her as a dependent
    # child would leave 0 countable and floor(881 x 0.4046 = 356.45) = 356.
    sc_tanf: 255

- name: Case 27, a married minor input as the tax unit's spouse counts as a parent.
  period: 2026-01
  input:
    people:
      adult_spouse:
        age: 20
      minor_spouse:
        age: 17
        is_tax_unit_spouse: true
        employment_income_before_lsr: 6_000
      baby:
        age: 0
    marital_units:
      couple:
        members: [adult_spouse, minor_spouse]
      baby_unit:
        members: [baby]
    households:
      household:
        members: [adult_spouse, minor_spouse, baby]
        state_code: SC
  output:
    # Tax-unit roles are inferred only for adults, so with an adult in the
    # group the 17-year-old counts as a parent through the spouse role input.
    sc_tanf_dependent_child: [false, false, true]
    sc_tanf_gross_earned_income: [0, 500, 0]
    # 6,000 / 12 = 500 a month, less the 50% January disregard: 250.
    sc_tanf_countable_income: 250
    # floor((1,110 - 250) x 0.4046 = 347.96) = 347.
    sc_tanf: 347

- name: Case 28, members who tie for oldest in a group with no adult all head it.
  period: 2026-01
  input:
    people:
      sibling:
        age: 17
      minor_parent:
        age: 17
        employment_income_before_lsr: 6_000
      baby:
        age: 0
    households:
      household:
        members: [sibling, minor_parent, baby]
        state_code: SC
  output:
    # No tax-unit role is input. The two 17-year-olds tie for oldest in a
    # group with no adult, so both head the household and the earner's wages
    # count whatever order the members are listed in.
    sc_tanf_dependent_child: [false, false, true]
    sc_tanf_gross_earned_income: [0, 500, 0]
    # 6,000 / 12 = 500 a month, less the 50% January disregard: 250.
    sc_tanf_countable_income: 250
    # Size 3: floor((15,650 + 2 x 5,500) / 12 x 0.5 = 1,110.42) = 1,110.
    # floor((1,110 - 250) x 0.4046 = 347.96) = 347. Dropping her wages would
    # give floor(1,110 x 0.4046 = 449.11) = 449.
    sc_tanf: 347

- name: Case 29, Case 28 with the earner listed first gives the same result.
  period: 2026-01
  input:
    people:
      minor_parent:
        age: 17
        employment_income_before_lsr: 6_000
      sibling:
        age: 17
      baby:
        age: 0
    households:
      household:
        members: [minor_parent, sibling, baby]
        state_code: SC
  output:
    sc_tanf_dependent_child: [false, false, true]
    sc_tanf_gross_earned_income: [500, 0, 0]
    sc_tanf_countable_income: 250
    sc_tanf: 347

- name: Case 30, a younger minor in a group with no adult counts as a dependent child.
  period: 2026-01
  input:
    people:
      older_minor:
        age: 17
      younger_minor:
        age: 16
        employment_income_before_lsr: 6_000
      baby:
        age: 0
    households:
      household:
        members: [older_minor, younger_minor, baby]
        state_code: SC
  output:
    # No tax-unit role is input, so no input says which minor is the baby's
    # parent. The case pins PolicyEngine's inference rule: with no adult and
    # no head or spouse role in the group, the 17-year-old, its oldest
    # member, alone heads it. The 16-year-old is a dependent child, and the
    # 16-year-old's earnings drop out. If the 16-year-old is the minor
    # parent, DSS counts those earnings (glossary, page 328; Section 7.5);
    # inputting is_tax_unit_head for the 16-year-old gives that result.
    sc_tanf_dependent_child: [false, true, true]
    sc_tanf_gross_earned_income: [0, 0, 0]
    sc_tanf_countable_income: 0
    # floor(1,110 x 0.4046 = 449.11) = 449.
    sc_tanf: 449

- name: Case 31, in a group with no adult a member input as the tax unit head heads it in place of the oldest member.
  period: 2026-01
  input:
    people:
      minor_parent:
        age: 16
        is_tax_unit_head: true
      sibling:
        age: 17
        is_tax_unit_dependent: true
        employment_income_before_lsr: 6_000
      baby:
        age: 0
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [minor_parent, sibling, baby]
    spm_units:
      spm_unit:
        members: [minor_parent, sibling, baby]
    households:
      household:
        members: [minor_parent, sibling, baby]
        state_code: SC
  output:
    # The 16-year-old is input as the tax unit head, so the oldest-member
    # rule doesn't apply. The 17-year-old, input as a tax dependent, is a
    # dependent child, and 114-1140(N)(1) excludes the 17-year-old's
    # earnings.
    sc_tanf_dependent_child: [false, true, true]
    sc_tanf_gross_earned_income: [0, 0, 0]
    sc_tanf_countable_income: 0
    # floor(1,110 x 0.4046 = 449.11) = 449. If the oldest member headed the
    # group too, 500 less the 50% January disregard, 250, would count, and
    # floor((1,110 - 250) x 0.4046 = 347.96) = 347.
    sc_tanf: 449

- name: Case 32, support paid by an SSI recipient isn't deducted from another member's earnings.
  # Annual inputs cover calendar 2026; outputs select May, when the $100
  # disregard applies.
  period: 2026
  input:
    people:
      ssi_parent:
        age: 40
        is_tax_unit_head: true
        receives_ssi: true
        child_support_expense: 2_400
      earner:
        age: 38
        is_tax_unit_spouse: true
        employment_income_before_lsr: 7_200
      child:
        age: 10
        is_tax_unit_dependent: true
    marital_units:
      couple:
        members: [ssi_parent, earner]
      child_unit:
        members: [child]
    households:
      household:
        members: [ssi_parent, earner, child]
        state_code: SC
  output:
    # Section 7.7 (page 117) excludes the SSI recipient and that person's
    # income in determining benefits for the other members, so the payer has
    # no counted income to deduct from (114-1140(L)).
    sc_tanf_ssi_recipient:
      2026-05: [true, false, false]
    sc_tanf_child_support_deduction:
      2026-05: 0
    # E = 600 - 100 = 500.
    sc_tanf_countable_income:
      2026-05: 500
    # Size 2: floor((15,650 + 5,500) / 12 x 0.5 = 881.25) = 881.
    sc_tanf_need_standard:
      2026-05: 881
    # floor((881 - 500) x 0.4046 = 154.15) = 154. Taking the 200 from the
    # group's income would leave 300 and floor(581 x 0.4046 = 235.07) = 235.
    sc_tanf:
      2026-05: 154

- name: Case 33, a dependent child who pays support deducts it from the child's own unearned income.
  # Annual inputs cover calendar 2026; outputs select May.
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
      teen:
        age: 17
        is_tax_unit_dependent: true
        social_security_survivors: 2_400
        child_support_expense: 1_200
      child:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, teen, child]
        state_code: SC
  output:
    # 114-1140(L) deducts support paid by "a budget group member", which a
    # dependent child is, from that member's income: 1,200 / 12 = 100 off
    # the 17-year-old's 2,400 / 12 = 200 of survivor benefits.
    sc_tanf_dependent_child:
      2026-05: [false, true, true]
    sc_tanf_gross_unearned_income:
      2026-05: [0, 200, 0]
    sc_tanf_child_support_deduction:
      2026-05: 100
    sc_tanf_countable_income:
      2026-05: 100
    # floor((1,110 - 100) x 0.4046 = 408.65) = 408. Limiting the deduction
    # to adults would leave 200 and floor(910 x 0.4046 = 368.19) = 368.
    sc_tanf:
      2026-05: 408

- name: Case 34, a negative child support input gives no deduction.
  # Annual inputs cover calendar 2026; outputs select May, when the $100
  # disregard applies.
  period: 2026
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        employment_income_before_lsr: 7_200
        child_support_expense: -2_400
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # A negative payment counts as none, so it can't add to income:
    # E = 600 - 100 = 500.
    sc_tanf_child_support_deduction:
      2026-05: 0
    sc_tanf_countable_income:
      2026-05: 500
    # floor((1,110 - 500) x 0.4046 = 246.81) = 246.
    sc_tanf:
      2026-05: 246

- name: Case 35, a self-employment loss with no support paid keeps countable income below zero.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        self_employment_income_before_lsr: -14_400
      child1:
        age: 16
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child1, child2]
        state_code: SC
  output:
    # -14,400 / 12 = -1,200 a month, and the 50% January disregard leaves
    # -600. With no support paid, countable income stays at -600.
    sc_tanf_gross_earned_income: [-1_200, 0, 0]
    sc_tanf_child_support_deduction: 0
    sc_tanf_countable_income: -600
    # The payment stops at the payment standard:
    # floor(1,110 x 0.4046 = 449.11) = 449.
    sc_tanf: 449

- name: Case 36, a payer's support comes off the payer's income when another member has a self-employment loss.
  period: 2026-01
  input:
    people:
      adult_a:
        age: 40
        is_tax_unit_head: true
        employment_income_before_lsr: 7_200
        child_support_expense: 2_400
      adult_b:
        age: 38
        is_tax_unit_spouse: true
        self_employment_income_before_lsr: -14_400
      child:
        age: 10
        is_tax_unit_dependent: true
    marital_units:
      couple:
        members: [adult_a, adult_b]
      child_unit:
        members: [child]
    households:
      household:
        members: [adult_a, adult_b, child]
        state_code: SC
  output:
    # A: 600 x 0.5 = 300, less A's 2,400 / 12 = 200 of support, leaves 100.
    # B: -1,200 x 0.5 = -600. Countable income is 100 - 600 = -500.
    # Deducting from the group's income (300 - 600 = -300) would leave
    # nothing to deduct from, and flooring the total at zero would give 0.
    sc_tanf_child_support_deduction: 200
    sc_tanf_countable_income: -500
    # floor(1,110 x 0.4046 = 449.11) = 449.
    sc_tanf: 449

- name: Case 37, gross income above the whole-dollar limit but within its cents passes the gross test.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        is_tax_unit_head: true
        employment_income_before_lsr: 19_554
      child:
        age: 5
        is_tax_unit_dependent: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # 19,554 / 12 = 1,629.50 a month. 114-1150(A) sets the limit at
    # 881 x 1.85 = 1,629.85, so the group passes. A limit with the cents
    # dropped, 1,629, would fail it and pay nothing.
    sc_tanf_gross_income: 1_629.5
    sc_tanf_gross_income_eligible: true
    # The 50% January disregard leaves 814.75, below the need standard of 881.
    sc_tanf_countable_income: 814.75
    # floor((881 - 814.75) x 0.4046 = 26.80) = 26.
    sc_tanf: 26
