- name: Case 5, unearned income only.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 35
        employment_income_before_lsr: 0
        social_security: 3_600
      person2:
        age: 8
        is_child_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    sc_tanf: 223.20
    # monthly unearned = 3,600/12 = 300 (gross Social Security counts)
    # tanf_fpg for size 2 = 1703.33
    # need_standard = 1703.33 * 0.5 = 851.67
    # countable_income = 0 (earned) + 300 (unearned) = 300
    # excess = 851.67 - 300 = 551.67
    # benefit = 551.67 * 0.4046 = 223.20

