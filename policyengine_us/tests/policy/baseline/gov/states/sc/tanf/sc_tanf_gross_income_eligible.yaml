- name: Case 1, no income is eligible.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf_gross_income_eligible: true

- name: Case 2, income below gross income limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    employment_income_before_lsr: 18_000
  output:
    sc_tanf_gross_income_eligible: true
    # monthly earned = 18,000 / 12 = 1,500
    # FPG for a benefit group of 2 (2025-01) = 1703.33/month
    # need_standard = floor(1703.33 * 0.5 = 851.67) = 851
    # gross_income_limit = 851 * 1.85 = 1,574.35 (114-1150(A))
    # 1,500 <= 1,574.35 -> eligible

- name: Case 3, income above gross income limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    employment_income_before_lsr: 24_000
  output:
    sc_tanf_gross_income_eligible: false
    # monthly earned = 24,000 / 12 = 2,000
    # gross_income_limit = 1,574.35
    # 2,000 > 1,574.35 -> not eligible

- name: Case 4, gross income one cent below the limit.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_gross_income: 1_574.34
  output:
    sc_tanf_gross_income_eligible: true
    # FPG for a benefit group of 2 = 1703.33
    # need_standard = floor(851.67) = 851
    # 114-1150(A): gross income "must not exceed 185 percent of the need
    # standard", so the limit keeps its cents: 851 * 1.85 = 1,574.35.
    # 1,574.34 <= 1,574.35 -> eligible. A whole-dollar limit of 1,574 would
    # fail this group.

- name: Case 5, gross income one cent above the limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_gross_income: 1_574.36
  output:
    # 1,574.36 > 1,574.35 -> not eligible.
    sc_tanf_gross_income_eligible: false

# The Section 8.15 table (PDF page 133) gives the need standards, 2026-01.
# 114-1150(A) sets the gross income limit at 185 percent of the need
# standard, cents included. One cent below each limit passes and one cent
# above fails. The table's whole-dollar limits would fail each case one cent
# below.

- name: Section 8.15 table, gross income one cent below the limit for a benefit group of 1.
  period: 2026-01
  input:
    state_code:
      2026: SC
    sc_tanf_benefit_group_size: 1
    sc_tanf_gross_income: 1206.19
  output:
    # Need standard 652; limit 652 x 1.85 = 1,206.20.
    sc_tanf_gross_income_eligible: true

