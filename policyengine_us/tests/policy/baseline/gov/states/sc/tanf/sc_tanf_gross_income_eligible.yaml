- name: Case 1, no income is eligible.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf_gross_income_eligible: true

- name: Case 2, income below gross income limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    employment_income_before_lsr: 18_000
  output:
    sc_tanf_gross_income_eligible: true
    # monthly earned = 18,000 / 12 = 1,500
    # FPG for a benefit group of 2 (2025-01) = 1703.33/month
    # need_standard = floor(1703.33 * 0.5 = 851.67) = 851
    # gross_income_limit = floor(851 * 1.85 = 1574.35) = 1574
    # 1,500 <= 1,574 -> eligible

- name: Case 3, income above gross income limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    employment_income_before_lsr: 24_000
  output:
    sc_tanf_gross_income_eligible: false
    # monthly earned = 24,000 / 12 = 2,000
    # gross_income_limit = 1,574
    # 2,000 > 1,574 -> not eligible

- name: Case 4, gross income exactly at limit.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_gross_income: 1_574
  output:
    sc_tanf_gross_income_eligible: true
    # FPG for a benefit group of 2 = 1703.33
    # need_standard = floor(851.67) = 851
    # The Section 8.15 table notes: "multiply the Need Standard by 1.85 and
    # drop the cents": floor(851 * 1.85 = 1574.35) = 1574.
    # 1574 <= 1574 -> eligible (uses <=)

- name: Case 5, gross income one cent above the whole-dollar limit.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_benefit_group_size: 2
    sc_tanf_gross_income: 1_574.01
  output:
    # 1574.01 > 1574. Without dropping the cents the limit would be
    # 1.85 * 851.67 = 1575.58 and this group would pass.
    sc_tanf_gross_income_eligible: false

# The Section 8.15 table (PDF page 133), 2026-01: "multiply the Need Standard
# by 1.85 and drop the cents". Each limit passes and one cent above fails.

- name: Section 8.15 table, gross income at the limit for a benefit group of 1.
  period: 2026-01
  input:
    state_code:
      2026: SC
    sc_tanf_benefit_group_size: 1
    sc_tanf_gross_income: 1206.00
  output:
    # Need standard 652; limit floor(652 x 1.85 = 1,206.20) = 1,206.
    sc_tanf_gross_income_eligible: true

- name: Section 8.15 table, gross income one cent above the limit for a benefit group of 1.
  period: 2026-01
  input:
