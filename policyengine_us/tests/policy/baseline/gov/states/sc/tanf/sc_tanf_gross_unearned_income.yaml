- name: Case 1, general assistance counts as unearned income.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        general_assistance: 2_400
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    # 2,400 / 12 = 200
    sc_tanf_gross_unearned_income: 200

- name: Case 2, employment income does not count as unearned income.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000
    households:
      household:
        members: [person1]
        state_code: SC
  output:
    sc_tanf_gross_unearned_income: 0
