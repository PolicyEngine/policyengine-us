- name: Case 1, no earned income is eligible for standard amount.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 0
    sc_tanf_eligible: true
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 344
    # FPG for a benefit group of 2 (2025-01, uses 2024-10 FPG) = 1703.33/month
    # need_standard = floor(1703.33 * 0.5 = 851.67) = 851 (114-1140(A)(4))
    # benefit = floor(851 * 0.4046 = 344.31) = 344

- name: Case 2, not eligible.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 1_000
    sc_tanf_eligible: false
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 0

- name: Case 3, some countable income.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 500
    sc_tanf_eligible: true
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 142
    # FPG for a benefit group of 2 (2025-01) = 1703.33/month
    # need_standard = floor(851.67) = 851
    # excess = 851 - 500 = 351
    # benefit = floor(351 * 0.4046 = 142.01) = 142

- name: Case 4, a benefit under $10 is not paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 840
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = floor($1,703.33 * 0.5) = $851
    # Benefit = floor(($851 - $840) * 0.4046 = $4.45) = $4, under $10
    # (S.C. Code Regs. 114-1140(A)(5))
    sc_tanf: 0

- name: Case 5, a benefit of $10 or more is paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 820
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = floor($851.67) = $851
    # 114-1140(A)(4) rounds the payment down:
    # floor(($851 - $820) * 0.4046 = $12.54) = $12.
    sc_tanf: 12

- name: Case 6, a benefit of $9.72 is not paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 826.98
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851
    # Benefit = floor(($851 - $826.98) * 0.4046 = $9.72) = $9, under $10
    sc_tanf: 0

- name: Case 7, a benefit just over $10 is paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 826.2
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851
    # Benefit = floor(($851 - $826.20) * 0.4046 = $10.03) = $10, at least $10
    sc_tanf: 10

- name: Case 8, a benefit that rounds down to $9 is not paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 826.8
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851
    # floor(($851 - $826.80) * 0.4046 = $9.79) = $9, under the $10 minimum
    # (114-1140(A)(4)-(5); the South Carolina part of issue 10497).
    sc_tanf: 0

# The Section 8.15 table (PDF page 133), 2026-01: "multiply the Need Standard
# by .4046 and drop the cents" gives the payment standard, the payment with
# no countable income.

- name: Section 8.15 table, payment standard for a benefit group of 1.
  period: 2026-01
  input:
    state_code:
      2026: SC
    sc_tanf_countable_income: 0
    sc_tanf_eligible: true
    sc_tanf_benefit_group_size: 1
  output:
    # Need standard 652; floor(652 x 0.4046 = 263.80) = 263.
    sc_tanf: 263

