- name: Case 1, no earned income is eligible for standard amount.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 0
    sc_tanf_eligible: true
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 344.58
    # FPG for a benefit group of 2 (2025-01, uses 2024-10 FPG) = 1703.33/month
    # need_standard = 1703.33 * 0.5 = 851.67
    # benefit = 851.67 * 0.4046 = 344.59

- name: Case 2, not eligible.
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 1_000
    sc_tanf_eligible: false
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 0

- name: Case 3, some countable income.
  absolute_error_margin: 0.1
  period: 2025-01
  input:
    state_code: SC
    sc_tanf_countable_income: 500
    sc_tanf_eligible: true
    sc_tanf_benefit_group_size: 2
  output:
    sc_tanf: 142.28
    # FPG for a benefit group of 2 (2025-01) = 1703.33/month
    # need_standard = 1703.33 * 0.5 = 851.67
    # excess = 851.67 - 500 = 351.67
    # benefit = 351.67 * 0.4046 = 142.31

- name: Case 4, a benefit under $10 is not paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 840
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $1,703.33 * 0.5 = $851.67
    # Benefit = ($851.67 - $840) * 0.4046 = $4.72, under $10
    # (S.C. Code Regs. 114-1140(A)(5))
    sc_tanf: 0

- name: Case 5, a benefit of $10 or more is paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 820
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851.67
    # Benefit = ($851.67 - $820) * 0.4046 = $12.81
    # The rule rounds the need standard and benefit down
    # (114-1140(A)(4)), which is not modeled:
    # (851 - 820) * 0.4046 = 12.54, so $12.
    sc_tanf: 12.81

- name: Case 6, a benefit of $9.99 is not paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 826.98
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851.67
    # Benefit = ($851.67 - $826.98) * 0.4046 = $9.99, under $10
    sc_tanf: 0

- name: Case 7, a benefit just over $10 is paid.
  absolute_error_margin: 0.01
  period: 2025-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        sc_tanf_countable_income: 826.2
        sc_tanf_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: SC
  output:
    # Need standard for 2 (2025-01) = $851.67
    # Benefit = ($851.67 - $826.20) * 0.4046 = $10.30, at least $10
    # With the 114-1140(A)(4) rounding, which is not modeled:
    # (851 - 826.20) * 0.4046 = 10.03, so $10, which is also paid.
    sc_tanf: 10.30
