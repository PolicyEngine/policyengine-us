# Accepted plan has no categorical/asset or additional renter exclusions.
# https://oeo.sc.gov/managedsites/prd/oeo/documents/2026%20LIHEAP%20State%20Plan.pdf#page=5,8
# Current agency annual limits and demonstrated energy-need requirement.
# https://oeo.sc.gov/managedsites/prd/oeo/liheap.html
# These exact Boolean cases intentionally have no absolute_error_margin.

- name: Case 1, annual published income ceiling is inclusive.
  period: 2026
  # Four-person published ceiling is 61_525. That amount qualifies, but a cent
  # above does not. This also distinguishes the rounded ceiling from 61_525.20.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 61_524
      person2:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person3:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person4:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 61_525
      person6:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person7:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person8:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person9:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 61_525.01
      person10:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person11:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person12:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person13:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 61_526
      person14:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person15:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person16:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3, person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit2:
        members: [person5, person6, person7, person8]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit3:
        members: [person9, person10, person11, person12]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit4:
        members: [person13, person14, person15, person16]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
    households:
      household1:
        members: [person1, person2, person3, person4]
        state_code: SC
      household2:
        members: [person5, person6, person7, person8]
        state_code: SC
      household3:
        members: [person9, person10, person11, person12]
        state_code: SC
      household4:
        members: [person13, person14, person15, person16]
        state_code: SC
  output:
    sc_liheap_eligible: [true, true, false, false]

- name: Case 2, known fuel requires its matching bill unless heat is included in rent.
  period: 2026
  # An electricity bill alone does not establish a gas-heating expense. NONE
  # is an affirmative no-heating fact. Heat-in-rent establishes responsibility
  # without a separately measured fuel bill; housing subsidy does not exclude.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person4:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person6:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        sc_tanf: 0
        pre_subsidy_electricity_expense: 1_000
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        sc_tanf: 0
      spm_unit3:
        members: [person3]
        heating_type: NONE
        sc_tanf: 0
      spm_unit4:
        members: [person4]
        heating_type: NONE
        sc_tanf: 0
        heat_expense_included_in_rent: true
      spm_unit5:
        members: [person5]
        heating_type: UNSPECIFIED
        sc_tanf: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
      spm_unit6:
        members: [person6]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
        receives_housing_assistance: true
    households:
      household1:
        members: [person1]
        state_code: SC
      household2:
        members: [person2]
        state_code: SC
      household3:
        members: [person3]
        state_code: SC
      household4:
        members: [person4]
        state_code: SC
      household5:
        members: [person5]
        state_code: SC
      household6:
        members: [person6]
        state_code: SC
  output:
    sc_liheap_eligible: [false, true, false, false, true, true]

- name: Case 3, cash program receipt does not override income and assets do not bar aid.
  period: 2026
  # First income=106_000, above 31_993 even with SSI/SNAP/TANF receipt.
  # The second has eligible income 20_000; no asset test applies.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 6_000
        employment_income: 100_000
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 3_600
        snap: 3_600
      spm_unit2:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
        spm_unit_assets: 1_000_000
    households:
      household1:
        members: [person1]
        state_code: SC
      household2:
        members: [person2]
        state_code: SC
  output:
    sc_liheap_eligible: [false, true]

- name: Case 4, zero qualified size and residence prevent eligibility.
  period: 2026
  # A positive actual heating bill cannot qualify an all-nonqualified household
  # or a nonresident. The comparable qualified SC resident qualifies.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit2:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit3:
        members: [person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
    households:
      household1:
        members: [person1]
        state_code: SC
      household2:
        members: [person2]
        state_code: SC
      household3:
        members: [person3]
        state_code: NC
  output:
    sc_liheap_eligible: [false, true, false]
