  output:
    # Household 1, elderly: 300 + 50 = 350.
    # Household 2, child aged 3 (two-person tier 13_031.70): 300 + 50 = 350.
    # Household 3, disabled: 300 + 50 = 350.
    # Household 4, veteran: 300 + 50 = 350.
    # Household 5, low income: 9_048 <= 9_965.40, and 1_500 < 1_809.60:
    # 300 + 150 = 450.
    # Household 6, energy burden: 10_400 > 9_965.40, and 2_400 >= 2_080:
    # 300 + 200 = 500.
    sc_liheap_cooling: [350, 350, 350, 350, 450, 500]

- name: Case 5, all FY2027 cooling supplements reach the 850 cooling maximum.
  period: 2027
  input:
    people:
      person1:
        age: 64
        is_disabled: true
        is_veteran: true
        social_security_disability: 9_600
        # Does not receive SSI.
        ssi: 0
      person2:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 600
        pre_subsidy_electricity_expense: 1_800
        has_cooling_expense: true
    households:
      household:
        members: [person1, person2]
        state_code: SC
  output:
    # 9_600 <= 13_031.70, and 2_400 >= 1_920.
    # 300 + 50 + 50 + 50 + 50 + 150 + 200 = 850, the cooling maximum.
    sc_liheap_cooling: 850
