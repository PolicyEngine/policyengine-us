# Sources: South Carolina FY2026 and FY2027 LIHEAP plans, items 1.1 and 3.1;
# OEO 2024 Administrative Guide, Section 3A (an obligation to pay a home energy
# bill; Direct Assistance may pay home heating or cooling costs).
# Cooling eligibility is regular LIHEAP eligibility plus cooling costs and a
# specified heating type. FY2026 income limit for one person: 31,993 (60% of
# SMI). Wages are hourly pay times hours; electric bills of 1,800 are 150 a
# month.

- name: Case 1, no cooling costs, an unspecified heating fuel with heat in rent or income over the limit pays no cooling award.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 20_800
      person2:
        age: 40
        employment_income_before_lsr: 20_800
      person3:
        age: 40
        # 15.50 an hour, 40 hours a week: 15.5 * 2_080 = 32_240.
        employment_income_before_lsr: 32_240
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        has_cooling_expense: false
      spm_unit2:
        members: [person2]
        heating_type: UNSPECIFIED
        heat_expense_included_in_rent: true
        pre_subsidy_electricity_expense: 1_800
        has_cooling_expense: true
      spm_unit3:
        members: [person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        has_cooling_expense: true
    households:
      household1:
        members: [person1]
        state_code: SC
      household2:
        members: [person2]
        state_code: SC
      household3:
        members: [person3]
        state_code: SC
  output:
    # Household 1 has no cooling costs but keeps its 200 heating base.
    # Household 2 qualifies for heating through heat in the rent (base 200),
    # but heating_type is a required input, so an unspecified fuel receives
    # no cooling award.
    # Household 3: 32_240 > 31_993 and above 110% of the 2025 guideline
    # (15_650 * 1.1 = 17_215).
    sc_liheap_eligible: [true, true, false]
    sc_liheap_cooling_eligible: [false, false, false]
    sc_liheap_cooling: [0, 0, 0]
    sc_liheap: [200, 200, 0]
