- name: Case 2, mixed status reduces the threshold and zero qualified size is guarded.
  period: 2026
  absolute_error_margin: 0.01
  # One qualified child uses the one-person annual ceiling, without counting
  # the nonqualified parent in size. No qualified residents gives zero.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person2:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person3:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person4:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit2:
        members: [person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
      spm_unit3:
        members: [person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
    households:
      household1:
        members: [person1, person2]
        state_code: SC
      household2:
        members: [person3]
        state_code: SC
      household3:
        members: [person4]
        state_code: NC
  output:
    sc_liheap_household_size: [1, 0, 0]
    sc_liheap_income_limit: [31_993, 0, 0]
