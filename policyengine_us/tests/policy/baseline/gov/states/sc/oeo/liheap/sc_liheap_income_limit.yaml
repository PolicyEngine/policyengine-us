# Current agency table publishes all eight annual income ceilings below.
# https://oeo.sc.gov/managedsites/prd/oeo/liheap.html
# Annual figures govern; the inconsistent one-person monthly figure is not used.
# Tests verify the published values without treating inferred rounding as law.

