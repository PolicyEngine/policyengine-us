- name: Case 3, twenty-percent burden sums energy bills and includes equality.
  period: 2026
  # Gas 500 + electric 3_499/3_500/3_501 gives costs 3_999/4_000/4_001.
  # At income 20_000,20%=4_000. Base 200+gas-fuel 75 gains burden 175 at equality.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 500
        sc_tanf: 0
        pre_subsidy_electricity_expense: 3_499
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 500
        sc_tanf: 0
        pre_subsidy_electricity_expense: 3_500
      spm_unit3:
        members: [person3]
        heating_type: NATURAL_GAS
        gas_expense: 500
        sc_tanf: 0
        pre_subsidy_electricity_expense: 3_501
    households:
      household1:
        members: [person1]
        state_code: SC
      household2:
        members: [person2]
        state_code: SC
      household3:
        members: [person3]
        state_code: SC
  output:
    sc_liheap: [275, 450, 450]

- name: Case 4, nonenergy utility bills do not establish home-energy burden.
  period: 2026
  # Home energy 1_000/20_000=5%. Water, trash and phone bills do not earn 175.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
        water_expense: 5_000
        trash_expense: 2_000
        phone_expense: 2_000
    households:
      household1:
        members: [person1]
        state_code: SC
  output:
    sc_liheap: 200

