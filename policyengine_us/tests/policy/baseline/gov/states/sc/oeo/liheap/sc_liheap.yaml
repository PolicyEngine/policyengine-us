#1,000 is below20%burden and has no fuel supplement:200base+50child=250;
#the same household at age6 receives200.
- name: Case 15, the young-child supplement lasts until the sixth birthday.
  period: 2026
  input:
    people:
      person1: {age: 35, employment_income: 30_000, is_citizen_or_legal_immigrant: true, ssi: 0}
      person2: {age: 5.5, is_citizen_or_legal_immigrant: true, ssi: 0}
      person3: {age: 35, employment_income: 30_000, is_citizen_or_legal_immigrant: true, ssi: 0}
      person4: {age: 6, is_citizen_or_legal_immigrant: true, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
      spm_unit2:
        members: [person3, person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_000
    tax_units:
      tax_unit1: {members: [person1, person2]}
      tax_unit2: {members: [person3, person4]}
    households:
      household1: {members: [person1, person2], state_code: SC}
      household2: {members: [person3, person4], state_code: SC}
  output:
    sc_liheap_household_size: [2, 2]
    sc_liheap_countable_income: [30_000, 30_000]
    sc_liheap_income_limit: [41_837, 41_837]
    sc_liheap_eligible: [true, true]
    sc_liheap: [250, 200]

