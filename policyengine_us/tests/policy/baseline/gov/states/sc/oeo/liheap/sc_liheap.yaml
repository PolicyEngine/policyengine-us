# Accepted FY 2026 plan: regular heating base 200 and seven supplements, cap 850.
# https://oeo.sc.gov/managedsites/prd/oeo/documents/2026%20LIHEAP%20State%20Plan.pdf#page=8
# Matrix used only for named fuels; its conflicting income/burden rules are not used.
# https://liheapch.acf.gov/docs/2026/benefits-matricies/SC_BenefitMatrix_2026.pdf#page=2
# Agency's explicit LIHEAP household rule counts all income but qualified size.
# https://oeo.sc.gov/managedsites/prd/oeo/documents/WAP%202026%20State%20Plan.pdf#page=23
# These are annual state-schedule awards, before unmodeled local funding discretion.
# All intermediate outputs below are calculated from raw facts, never forced inputs.

- name: Case 1, source base and combined low-income high-burden examples.
  period: 2026
  # 40_000 income and 4_000 electric cost give only base 200. At 30_000 income,
  # low-income 175 applies and 6_000/30_000=20% adds burden 175: total 550.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 40_000
      person2:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person3:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person4:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 30_000
      person6:
        age: 33
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person7:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person8:
        age: 12
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3, person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 4_000
        sc_tanf: 0
      spm_unit2:
        members: [person5, person6, person7, person8]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 6_000
        sc_tanf: 0
    households:
      household1:
        members: [person1, person2, person3, person4]
        state_code: SC
      household2:
        members: [person5, person6, person7, person8]
        state_code: SC
  output:
    sc_liheap_household_size: [4, 4]
    sc_liheap_countable_income: [40_000, 30_000]
    sc_liheap_income_limit: [61_525, 61_525]
    sc_liheap_eligible: [true, true]
    sc_liheap: [200, 550]

