# Military retirement is a separate receipt; a rental loss cannot cancel a
#33,000 pension. The last two rows are existing-aggregate UI controls because
#there is no SC state UI model. Reported UI replaces the fallback, never adds
#to it. Every row exceeds the one-person31,993 ordinary income ceiling.
- name: Case 14, distinct received income prevents excess regular awards.
  period: 2026
  input:
    state_code: [SC, SC, SC, SC]
    age: [55, 55, 35, 35]
    is_citizen_or_legal_immigrant: [true, true, true, true]
    ssi: [0, 0, 0, 0]
    military_retirement_pay: [40_000, 0, 0, 0]
    is_veteran: [true, false, false, false]
    taxable_pension_income: [0, 33_000, 0, 0]
    rental_income: [0, -10_000, 0, 0]
    unemployment_compensation: [0, 0, 0, 45_000]
    modeled_state_unemployment_compensation: [0, 0, 40_000, 40_000]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_000, 1_000, 1_000, 1_000]
  output:
    sc_liheap_countable_income: [40_000, 33_000, 40_000, 45_000]
    sc_liheap_income_limit: [31_993, 31_993, 31_993, 31_993]
    sc_liheap_eligible: [false, false, false, false]
    sc_liheap: [0, 0, 0, 0]

