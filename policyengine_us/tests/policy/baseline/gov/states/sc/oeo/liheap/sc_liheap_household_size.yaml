      person1:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person2:
        age: 32
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person4:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person5:
        age: 32
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person6:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person7:
        age: 60
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person8:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person9:
        age: 32
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
