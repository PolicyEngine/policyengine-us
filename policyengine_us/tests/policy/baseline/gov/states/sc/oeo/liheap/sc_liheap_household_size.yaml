        pre_subsidy_electricity_expense: 1_000
        sc_tanf: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: SC
      household2:
        members: [person4, person5]
        state_code: SC
      household3:
        members: [person6, person7]
        state_code: SC
      household4:
        members: [person8, person9]
        state_code: NC
