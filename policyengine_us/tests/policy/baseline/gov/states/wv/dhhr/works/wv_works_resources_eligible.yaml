# Unit tests for wv_works_resources_eligible
# Tests resource/asset eligibility against $2,000 limit
# Source: WV Income Maintenance Manual Chapter 11

- name: Case 1, no assets is eligible.
  period: 2025-01
  input:
    state_code: WV
    spm_unit_cash_assets: 0
  output:
    wv_works_resources_eligible: true

- name: Case 2, assets below limit is eligible.
  period: 2025-01
  input:
    state_code: WV
    spm_unit_cash_assets: 1_500
  output:
    # Assets: $1,500
    # Limit: $2,000
    # 1,500 <= 2,000 = eligible
    wv_works_resources_eligible: true

- name: Case 3, assets at exact limit is eligible.
  period: 2025-01
  input:
    state_code: WV
    spm_unit_cash_assets: 2_000
  output:
    # Assets: $2,000
    # Limit: $2,000
    # 2,000 <= 2,000 = eligible
    wv_works_resources_eligible: true

- name: Case 4, assets above limit is ineligible.
  period: 2025-01
  input:
    state_code: WV
    spm_unit_cash_assets: 2_001
  output:
    # Assets: $2,001
    # Limit: $2,000
    # 2,001 > 2,000 = ineligible
    wv_works_resources_eligible: false

- name: Case 5, assets well above limit.
  period: 2025-01
  input:
    state_code: WV
    spm_unit_cash_assets: 10_000
  output:
    wv_works_resources_eligible: false

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: WV
  output:
    wv_works_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: WV
  output:
    wv_works_resources_eligible: false
