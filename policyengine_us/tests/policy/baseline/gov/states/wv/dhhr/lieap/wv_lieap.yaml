- name: Case 8, represented heating responsibility allows direct and stated costs.
  period: 2027
  absolute_error_margin: 0.01
  # Rows1-2 pay direct heat, including a subsidized tenant; no bill cap applies.
  # Row4 bundled rent has no responsibility override and remains unmodeled.
  # Known-obligation overrides are isolated in Case9 so no input on this
  # variable suppresses its derived default for the other units in this case.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true}
      person2: {age: 40, is_citizen_or_legal_immigrant: true}
      person3: {age: 40, is_citizen_or_legal_immigrant: true}
      person4: {age: 40, is_citizen_or_legal_immigrant: true}
      person5: {age: 40, is_citizen_or_legal_immigrant: true}
      person6: {age: 40, is_citizen_or_legal_immigrant: false}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1
      spm_unit2:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        receives_housing_assistance: true
      spm_unit3:
        members: [person3]
        heating_type: ELECTRICITY
      spm_unit4:
        members: [person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        receives_housing_assistance: true
        heat_expense_included_in_rent: true
      spm_unit5:
        members: [person5]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
      spm_unit6:
        members: [person6]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
    households:
      household1: {members: [person1], state_code: WV}
      household2: {members: [person2], state_code: WV}
      household3: {members: [person3], state_code: WV}
      household4: {members: [person4], state_code: WV}
      household5: {members: [person5], state_code: OH}
      household6: {members: [person6], state_code: WV}
  output:
    wv_lieap: [280, 280, 0, 0, 0, 0]

- name: Case 9, known responsibility for auxiliary and stated rent costs is supplied.
  period: 2027
  absolute_error_margin: 0.01
  # The FY2027 manual expressly recognizes auxiliary electricity for self-cut
  # wood. A separately documented heating charge in rent also qualifies.
  # These existing responsibility facts are supplied only in this case; normal
  # bill-based defaults remain independently exercised in Case8.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true}
      person2: {age: 40, is_citizen_or_legal_immigrant: true}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: WOOD
        wood_expense: 0
        pre_subsidy_electricity_expense: 200
        has_heating_expense: true
      spm_unit2:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 200
        heat_expense_included_in_rent: true
        has_heating_expense: true
    households:
      household1: {members: [person1], state_code: WV}
      household2: {members: [person2], state_code: WV}
  output:
    wv_lieap: [174.24, 280]
