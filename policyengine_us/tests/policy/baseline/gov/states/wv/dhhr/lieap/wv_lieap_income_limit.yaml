# Sources: the FY2026 chart prints sizes 1-10 and adds $688 for each further person.
# https://bfa.wv.gov/utility-assistancelieap
# https://web.archive.org/web/20260302130424/https://bfa.wv.gov/media/39948/download?inline#page=1780
# FY2027 adopted operational IMM gives separately verified sizes 1-11.
# https://web.archive.org/web/20261023203756/https://bfa.wv.gov/media/40005/download?inline#page=1775
# The 60% SMI through 7 and 150% FPG from 8 split is explicit in the accepted FY2026 plan.
# https://liheapch.acf.gov/docs/2026/state-plans/WV_Plan_2026.pdf#page=11
# Expected limits are the published monthly amounts x 12, stopped at the ceiling of
# 42 U.S.C. 8624(b)(2)(B): HHS's 60% SMI amounts through 7, 150% of the guideline from 8.
# https://www.law.cornell.edu/uscode/text/42/8624#b_2_B
# https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM2025-02_SMIStateTable_Att4.pdf#page=3
# https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_Att4SMITable_States_FY2027.pdf#page=3
# Both were checked independently by hand; no model formula was used.
# FY2026 size 11 is 8831/month: the chart's 8144 + 688 = 8832 is above 150% of the
# guideline, 8831.25.
# Payment-grid overlaps and larger-family defects are outside this component.

