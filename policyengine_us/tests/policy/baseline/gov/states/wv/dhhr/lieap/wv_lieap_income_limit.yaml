# Sources: FY2026 agency table gives sizes1–10; earlier IMM gives size11.
# https://bfa.wv.gov/utility-assistancelieap
# https://bfa.wv.gov/media/39948/download?inline=#page=1772,1773
# FY2027 adopted operational IMM gives separately verified sizes1–11.
# https://bfa.wv.gov/media/40005/download?inline=#page=1775,1776
# The60%SMI-through7 /150%FPG-from8 split is explicit in the accepted FY2026 plan.
# https://liheapch.acf.gov/docs/2026/state-plans/WV_Plan_2026.pdf#page=11
# Expected limits are published monthly amounts multiplied by12, independently
# checked with Decimal arithmetic; no model formula was used to generate them.
# FY2026 size11 is8831/month, not the agency shorthand8144+688=8832.
# Payment-grid overlaps and larger-family defects are outside this component.

- name: Case 1, FY2026 published limit for 1 qualified members.
  period: 2026
  absolute_error_margin: 0.01
  # 60% requested-year SMI; published $2,454/month x12 =$29,448/year.
  input:
    people:
      person1: {age: 70, is_citizen_or_legal_immigrant: true}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household1:
        members: [person1]
        state_code: WV
  output:
    wv_lieap_income_limit: 29_448

