        ssi: 0
        employment_income: 15000
    spm_units:
      spm_unit1:
        members:
          - person1
          - person2
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
      spm_unit2:
        members:
          - person3
        heating_type: NATURAL_GAS
        gas_expense: 1200
