        ssi: 0
        general_assistance: 50
    spm_units:
      spm_unit1:
        members:
          - person1
          - person2
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works:
          2026-01: 100
          2026-02: 200
          2026-03: 0
          2026-04: 0
          2026-05: 0
          2026-06: 0
          2026-07: 0
          2026-08: 0
          2026-09: 0
          2026-10: 0
          2026-11: 0
          2026-12: 0
        snap: 0
      spm_unit2:
        members:
          - person3
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works:
          2026-01: 25
          2026-02: 25
          2026-03: 25
          2026-04: 25
          2026-05: 25
          2026-06: 25
          2026-07: 25
          2026-08: 25
          2026-09: 25
          2026-10: 25
          2026-11: 25
          2026-12: 25
        snap: 0
    households:
      household1:
        members:
          - person1
          - person2
        state_code: WV
      household2:
        members:
          - person3
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 1800
      - 350

- name: Case 5, existing net businesses are not discounted again and losses do not offset earnings.
  # Authorized net-business approximation: do not apply the manual gross-receipts 20% deduction twice.
  # First unit sums 1_000 + 2_000 + 3_000 + 4_000 = 10_000.
  # Second counts wages 10_000 + positive business 2_000 + 3_000 = 15_000.
  # Negative business streams contribute zero; the all-loss unit has zero income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        self_employment_income: 1000
        sstb_self_employment_income: 2000
        farm_operations_income: 3000
        partnership_s_corp_income: 4000
      person2:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 10000
        self_employment_income: -9000
        sstb_self_employment_income: 2000
        farm_operations_income: -7000
        partnership_s_corp_income: 3000
      person3:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        self_employment_income: -1000
        sstb_self_employment_income: -2000
        farm_operations_income: -3000
        partnership_s_corp_income: -4000
    spm_units:
      spm_unit1:
        members:
          - person1
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
      spm_unit2:
        members:
          - person2
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
      spm_unit3:
        members:
          - person3
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members:
          - person1
        state_code: WV
      household2:
        members:
          - person2
        state_code: WV
      household3:
        members:
          - person3
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 10000
      - 15000
      - 0

- name: Case 6, student funding RSDI SSI and SNAP do not enlarge recurring wages.
  # Only the 10_000 ordinary wages count; these are not work-study wages.
  # Scholarships/grants 5_000, Pell 3_000, SSDI 2_400, annual SSI 1_200 and SNAP 6_000 are excluded.
  # No separate work-study dollar input exists; this does not assert exclusion of mixed-job wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 20
        is_citizen_or_legal_immigrant: true
        ssi: 1200
        employment_income: 10000
        educational_assistance: 5000
        pell_grant: 3000
        social_security_disability: 2400
    spm_units:
      spm_unit1:
        members:
          - person1
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 6000
    households:
      household1:
        members:
          - person1
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 10000

- name: Case 7, specifically nonrecurring proceeds are excluded under the documented input convention.
  # Fixture facts: one asset sale, one gambling prize and one life-insurance death payment.
  # The manual excludes nonrecurring lump sums, not all possible recurring installments.
  # Existing annual fields cannot distinguish those installments; this scenario
  # does not claim a legal blanket exclusion or test unobserved recurrence.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        long_term_capital_gains: 10000
        gambling_winnings: 2000
        life_insurance_benefits: 50000
    spm_units:
      spm_unit1:
        members:
          - person1
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members:
          - person1
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 0

