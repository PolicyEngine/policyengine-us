  # Current manual A.1-3 retain the income rules; exclusions are now A.5.
  # 2_000 + 1_000 + 300 + 400 + 500 + ordinary VA 600 + WV WORKS 1_200 = 6_000.
  # RSDI 18_000, SSI 1_200 and educational assistance 800 remain excluded.
  # The new Zero Income A.4 is about responsibility and adds no income to this fixture.
