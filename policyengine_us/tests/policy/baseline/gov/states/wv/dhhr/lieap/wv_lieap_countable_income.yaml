# Independent source-derived tests for annualized countable income only.
# Earlier operative IMM, section 21.3.1.A.1-4/B/D (physical pages 1725-1728, 1732).
# https://bfa.wv.gov/media/39948/download?inline=#page=1725
# Current October 1, 2026 IMM, section 21.3.1.A.1-3/A.5/B (physical pages 1726-1729, 1734).
# https://bfa.wv.gov/media/40005/download?inline=#page=1726
# Annual flow inputs approximate steady application-month receipt; they do not
# reconstruct application dates, pay-frequency conversions or partial months.
# The detailed manual governs over unchecked summary-plan income categories.
# Capital/death/prize facts in Case 7 are explicitly nonrecurring.

- name: Case 1, minors and nonqualified members retain their recurring earnings.
  # The operative manual has no blanket minor-earnings exclusion.
  # Every unit counts 12_000 + 6_000, including nonqualified parent earnings.
  # The seventeenth/eighteenth birthday does not change this income rule.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12000
      person2:
        age: 17
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 6000
      person3:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12000
      person4:
        age: 18
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 6000
      person5:
        age: 40
        is_citizen_or_legal_immigrant: false
        ssi: 0
        employment_income: 12000
      person6:
        age: 10
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 6000
    spm_units:
      spm_unit1:
        members:
          - person1
          - person2
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
      spm_unit2:
        members:
          - person3
          - person4
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
      spm_unit3:
        members:
          - person5
          - person6
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members:
          - person1
          - person2
        state_code: WV
      household2:
        members:
          - person3
          - person4
        state_code: WV
      household3:
        members:
          - person5
          - person6
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 18000
      - 18000
      - 18000

- name: Case 2, recurring represented income sources include assistance and ordinary VA.
  # 2_400 + 300 + 600 + 700 + 400 + 900 + (200 + 100)
  # + (250 + 50) + 800 + 1_000 + 900 + 1_100 + 1_200 + 1_300 = 12_200.
  # VA here is ordinary recurring benefits, not excluded Aid and Attendance.
  # Estate income and child support here are recurring, not inheritance or arrears.
  # Outside-household cash assistance and GA count under the all-source rule.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        unemployment_compensation: 2400
        strike_benefits: 300
        rental_income: 600
        farm_rent_income: 700
        alimony_income: 400
        child_support_received: 900
        taxable_interest_income: 200
        tax_exempt_interest_income: 100
        qualified_dividend_income: 250
        non_qualified_dividend_income: 50
        veterans_benefits: 800
        workers_compensation: 1000
        disability_benefits: 900
        estate_income: 1100
        financial_assistance: 1200
        general_assistance: 1300
    spm_units:
      spm_unit1:
        members:
          - person1
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members:
          - person1
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 12200

- name: Case 3, pensions account distributions and non-SSA survivor benefits count once.
  # Recurring pensions: 1_000 + 2_000 + 300 + 400 = 3_700.
  # Recurring account withdrawals: 5_000 + 600 + 700 + 80 + 90 + 10 + 110 + 20 + 30 = 6_640.
  # Non-SSA survivors 500 gives 3_700 + 6_640 + 500 = 10_840.
  # All three RSDI categories are excluded; no narrower pension classifications
  # are supplied alongside their potentially overlapping pension aggregates.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_citizen_or_legal_immigrant: true
        ssi: 0
        taxable_public_pension_income: 1000
        taxable_private_pension_income: 2000
        tax_exempt_public_pension_income: 300
        tax_exempt_private_pension_income: 400
        taxable_ira_distributions: 5000
        tax_exempt_ira_distributions: 600
        taxable_401k_distributions: 700
        tax_exempt_401k_distributions: 80
        taxable_sep_distributions: 90
        tax_exempt_sep_distributions: 10
        taxable_403b_distributions: 110
        tax_exempt_403b_distributions: 20
        keogh_distributions: 30
        survivor_benefits: 500
        social_security_retirement: 18000
        social_security_disability: 12000
        social_security_survivors: 3600
    spm_units:
      spm_unit1:
        members:
          - person1
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members:
          - person1
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 10840

- name: Case 4, monthly WV WORKS aggregates once and general assistance remains countable.
  # First unit: GA 600 + 900 plus WV WORKS 100 + 200 = 1_800.
  # Second unit: GA 50 plus WV WORKS 25 * 12 = 350.
  # WV WORKS is an SPMUnit monthly benefit, not a per-person or annual-times-12 amount.
