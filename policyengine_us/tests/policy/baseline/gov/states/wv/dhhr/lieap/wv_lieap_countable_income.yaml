      spm_unit1:
        members:
          - person1
          - person2
        heating_type: NATURAL_GAS
        gas_expense: 1200
        pre_subsidy_electricity_expense: 0
        wv_works:
          2027-01: 100
          2027-02: 100
          2027-03: 100
          2027-04: 100
          2027-05: 100
          2027-06: 100
          2027-07: 100
          2027-08: 100
          2027-09: 100
          2027-10: 100
          2027-11: 100
          2027-12: 100
        snap: 0
    households:
      household1:
        members:
          - person1
          - person2
        state_code: WV
  output:
    wv_lieap_countable_income:
      - 6000

- name: Case 10, estate losses do not offset wages or another member estate income.
  period: 2026
  absolute_error_margin: 0.01
  # No-deduction rule applied to an input explicitly defined as net income or loss.
  # Person 1 wages 12_000 plus zero from their -10_000 estate loss,
  # plus Person 2 recurring estate income 1_000 = 13_000.
  # Flooring after summing member estates would wrongly erase the positive 1_000.
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        employment_income: 12_000
        estate_income: -10_000
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        estate_income: 1_000
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        wv_works: 0
        snap: 0
    households:
      household1:
        members: [person1, person2]
        state_code: WV
  output:
    wv_lieap_countable_income: 13_000

