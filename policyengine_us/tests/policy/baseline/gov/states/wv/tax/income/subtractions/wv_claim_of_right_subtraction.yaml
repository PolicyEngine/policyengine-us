# 2025 IT-140 instructions, Schedule M line 42 (PDF page 29): "The amount of
# income repaid MUST be more than $3,000.00 to qualify."

- name: Case 1, a repayment over $3,000 is a decreasing modification.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: 10_000
    wv_subtractions: 10_000

- name: Case 2, a repayment of $3,000 does not qualify.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 3_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: 0

- name: Case 3, the federal credit method does not change the modification.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_credit_applies: true
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: 10_000

- name: Case 4, spouses' repayments count together toward $3,000; a dependent's does not.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 2_000
      spouse:
        age: 40
        claim_of_right_repayment: 2_000
      child:
        age: 17
        claim_of_right_repayment: 5_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: [2_000, 2_000, 0]
    wv_subtractions: 4_000

- name: Case 5, outside West Virginia.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: VA
  output:
    wv_claim_of_right_subtraction: 0

# Wages $40,000, repays $10,000. IT-140: West Virginia AGI $40,000 - $10,000 =
# $30,000; less the $2,000 exemption = $28,000.
- name: Case 6, the modification lowers West Virginia AGI and taxable income.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_agi: 30_000
    wv_taxable_income: 28_000

# Age 70, wages $9,000, repays $4,000. Schedule M line 47, box (c), is "all
# income ... not reported on lines 35 through 48": the $9,000 of wages, capped
# at $8,000; W. Va. Code 11-21-12(c)(9) counts income included in federal AGI.
# The repayment is not income, so it does not reduce box (c). Total decreasing
# modifications $4,000 + $8,000 = $12,000.
- name: Case 7, the repayment does not reduce the senior citizen modification's base.
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 9_000
        claim_of_right_repayment: 4_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: 4_000
    wv_senior_citizen_disability_deduction_person: 8_000
    wv_subtractions: 12_000
    # $9,000 - $12,000; taxable income does not go below zero.
    wv_agi: -3_000
    wv_taxable_income: 0

- name: Case 8, West Virginia taxable income is $28,000 under the federal credit method.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_credit_applies: true
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_taxable_income: 28_000

- name: Case 9, West Virginia taxable income is $28,000 under the federal deduction method on a return that itemizes.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_credit_applies: false
        tax_unit_itemizes: true
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_taxable_income: 28_000

- name: Case 10, West Virginia taxable income is $28,000 under the federal deduction method on a return taking the standard deduction.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_credit_applies: false
        tax_unit_itemizes: false
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_taxable_income: 28_000

# Schedule M line 42 requires more than $3,000: one dollar above qualifies.
- name: Case 11, a repayment of $3,001 qualifies in full.
  period: 2025
  input:
    people:
      head:
        age: 40
        claim_of_right_repayment: 3_001
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WV
  output:
    wv_claim_of_right_subtraction: 3_001
    wv_subtractions: 3_001
