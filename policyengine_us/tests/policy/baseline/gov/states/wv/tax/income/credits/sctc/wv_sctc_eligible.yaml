# Sections 11-6B-2/3 and 21(a)(2): source-qualified county exemption can be based on
# permanent/total disability. No additional senior-only age gate. Payment facts are
# still unavailable.
- name: Case 6, actual exemption participation can qualify a certified disabled owner under
    65.
  period: 2025
  input:
    state_code: WV
    age: 45
    adjusted_gross_income: 15_000
    alternative_minimum_tax: 0
    wv_sctc_homestead_qualified: true
    wv_sctc_family_unit_size: 1
    wv_sctc_homestead_facts_available: true
    wv_sctc_income_facts_available: true
    wv_sctc_disabled_veteran_credit_claim_status: NOT_CLAIMED
    wv_sctc_payment_facts_available: false
  output:
    wv_sctc_eligible: true
    wv_sctc_eligibility_available: true
    wv_sctc_amount_available: false

# The sole homestead owner and related adult child reside together but file separate
# returns. Verified legal family 2 permits 31725; using the owner TaxUnit size 1 would
# wrongly deny. The child has no confirmed SCTC claim.
- name: Case 7, legal family size can exceed the claimant federal tax-unit size.
  period: 2025
  input:
    people:
      person1:
        age: 70
      person2:
        age: 30
    tax_units:
      tax_unit1:
        members:
        - person1
        adjusted_gross_income: 31_725
        alternative_minimum_tax: 0
        wv_sctc_homestead_qualified: true
        wv_sctc_family_unit_size: 2
        wv_sctc_homestead_facts_available: true
        wv_sctc_income_facts_available: true
        wv_sctc_disabled_veteran_credit_claim_status: NOT_CLAIMED
        wv_sctc_payment_facts_available: false
      tax_unit2:
        members:
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
    households:
      household:
        members:
        - person1
        - person2
        state_code: WV
  output:
    wv_sctc_eligible:
    - true
    - false
    wv_sctc_eligibility_available:
    - true
    - false

