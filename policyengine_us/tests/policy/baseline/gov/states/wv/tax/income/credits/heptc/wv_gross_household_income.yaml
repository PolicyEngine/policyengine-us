# W. Va. Code 11-21-23(d)(1): gross household income is federal adjusted gross
# income plus "(C) Workers' compensation and loss of earnings insurance".
# 2025 Schedule HEPTC-1 line 4c (page 11): "earnings replacement insurance
# (Workers' Compensation Benefits)". Disability benefits from a plan the
# recipient paid for are loss of earnings insurance outside federal AGI
# (IRC 104(a)(3)).

- name: Disability insurance benefits outside federal AGI are loss of earnings insurance
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 60
    state_code: WV
    employment_income: 20_000
    workers_compensation: 1_000
    # A plan the recipient paid for: all of it is tax-exempt.
    disability_benefits: 4_000
    tax_exempt_disability_benefits: 4_000
  output:
    # Federal AGI 20,000 + 1,000 workers' compensation + 4,000 loss of
    # earnings insurance.
    wv_gross_household_income: 25_000

- name: Loss of earnings insurance raises the income offset in the credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 60
    state_code: WV
    employment_income: 20_000
    # A plan the recipient paid for: all of it is tax-exempt.
    disability_benefits: 5_000
    tax_exempt_disability_benefits: 5_000
    real_estate_taxes: 1_500
  output:
    # Line 4: federal AGI 20,000 (at most 3 x 15,650 = 46,950, the 2025
    # guideline for one person). Line 4c: 5,000. Line 6: 25,000.
    wv_gross_household_income: 25_000
    # Line 7: 4% x 25,000 = 1,000. Line 3: 1,500 > 1,000.
    wv_homestead_excess_property_tax_credit_eligible: true
    # Line 9: smaller of 1,500 - 1,000 = 500 and 1,000.
    wv_homestead_excess_property_tax_credit: 500

- name: Property tax equal to 4 percent of income with loss of earnings insurance gets no credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 60
    state_code: WV
    employment_income: 20_000
    # A plan the recipient paid for: all of it is tax-exempt.
    disability_benefits: 5_000
    tax_exempt_disability_benefits: 5_000
    real_estate_taxes: 1_000
  output:
    # Line 6: 20,000 + 5,000 = 25,000. Line 7: 4% x 25,000 = 1,000.
    wv_gross_household_income: 25_000
    # Line 8: line 3 (1,000) is not greater than line 7 (1,000).
    wv_homestead_excess_property_tax_credit_eligible: false
    wv_homestead_excess_property_tax_credit: 0

- name: Property tax one dollar above 4 percent of income gets a one dollar credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 60
    state_code: WV
    employment_income: 20_000
    # A plan the recipient paid for: all of it is tax-exempt.
    disability_benefits: 5_000
    tax_exempt_disability_benefits: 5_000
    real_estate_taxes: 1_001
  output:
    wv_gross_household_income: 25_000
    # Line 8: 1,001 > 1,000. Line 9: 1,001 - 1,000 = 1.
    wv_homestead_excess_property_tax_credit_eligible: true
    wv_homestead_excess_property_tax_credit: 1
