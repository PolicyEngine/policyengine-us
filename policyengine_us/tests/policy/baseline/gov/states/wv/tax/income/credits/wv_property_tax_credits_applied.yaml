# Conditional helper-only guard: the native upstream liability already floors at 0.
# Clamp this finite override to 0; only the 200 refundable pool applies. No native
# final-tax claim is made from a negative upstream override.
- name: Case 2, a finite negative raw liability is clamped for application.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: WV
    wv_sctc: 9
    wv_homestead_excess_property_tax_credit: 200
    wv_income_tax_before_refundable_credits: -5
    wv_heptc_coordination_available: true
  output:
    wv_property_tax_credits_applied: 200

# Counterfactual SCTC minimum 5 versus unchanged HEPTC minimum 10. Only SCTC 6 is
# refundable; HEPTC 9 has no liability to offset. A shared minimum would incorrectly
# produce 15.
- name: Case 3, reforming the SCTC refund threshold leaves the HEPTC threshold separate.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: WV
    wv_sctc: 6
    wv_homestead_excess_property_tax_credit: 9
    wv_income_tax_before_refundable_credits: 0
    wv_heptc_coordination_available: true
    gov.states.wv.tax.income.credits.sctc.refund_minimum: 5
  output:
    wv_property_tax_credits_applied: 6
    wv_refundable_credits: 6
    wv_income_tax: -6

# Counterfactual HEPTC minimum 5 versus unchanged SCTC minimum 10. Only HEPTC 9 is
# refundable. Asymmetric 6/9 amounts detect swapped parameter ownership.
- name: Case 4, reforming the HEPTC refund threshold leaves the SCTC threshold separate.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: WV
    wv_sctc: 6
    wv_homestead_excess_property_tax_credit: 9
    wv_income_tax_before_refundable_credits: 0
    wv_heptc_coordination_available: true
    gov.states.wv.tax.income.credits.heptc.refund_minimum: 5
  output:
    wv_property_tax_credits_applied: 9
    wv_refundable_credits: 9
    wv_income_tax: -9

# The new helper is inactive before 2025 while the historical refundable list contains
# both entitlements. Conditional list-routing coverage does not rewrite the historical
# SCTC formula.
- name: Case 5, earlier refund-list routing remains unchanged.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: WV
    wv_sctc: 200
    wv_homestead_excess_property_tax_credit: 200
    wv_income_tax_before_refundable_credits: 0
    wv_heptc_coordination_available: true
  output:
    wv_property_tax_credits_applied: 0
    wv_refundable_credits: 400
    wv_income_tax: -400

