# 2025 IT-140 Family Tax Credit Tables (page 12 of the booklet): each row is
# "greater than ... equal to or less than", so the upper endpoint gets the
# higher percentage. Family size 1 limits are $15,650 (Table 1) and $7,825
# (Table 2, married filing separately).
- name: 2025 single filer at exactly the 100% upper endpoint gets 100%.
  period: 2025
  input:
    wv_low_income_family_tax_credit_agi: 15_650
    wv_low_income_family_tax_credit_fpg: 15_650
    wv_low_income_family_tax_credit_eligible: true
    filing_status: SINGLE
    wv_income_tax_before_non_refundable_credits: 1_000
  output:
    wv_low_income_family_tax_credit: 1_000

