- name: Claiming AMT
  period: 2022
  input:
    state_code: WV
    alternative_minimum_tax: 1
  output:
   wv_low_income_family_tax_credit_eligible: false

- name: Not claiming AMT
  period: 2022
  input:
    state_code: WV
    alternative_minimum_tax: 0
  output:
   wv_low_income_family_tax_credit_eligible: true

- name: 2025 single filer who is claimed as a dependent counts the 11-21-16(d) exemption in West Virginia family size
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 16000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: WV
  output:
    # W. Va. Code 11-21-22A(b): family size counts the filer's single
    # 11-21-16(d) exemption, so family size 1: 2025 FPG $15,650. Taxable
    # income $16,000 - $500 = $15,500; tax $222 + $5,500 x 2.96% = $384.80.
    # Income exceeds the FPG by $350, so the single credit is 80%: $307.84.
    wv_low_income_family_tax_credit_eligible: true
    wv_low_income_family_tax_credit_fpg: 15650
    wv_personal_exemption: 500
    wv_taxable_income: 15500
    wv_income_tax_before_non_refundable_credits: 384.8
    wv_low_income_family_tax_credit_potential: 307.84

- name: 2025 joint return with one claimed spouse counts that spouse's 11-21-16(d) exemption in West Virginia family size (the claimed spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WV
  output:
    # Family size 2 (one $2,000 exemption and one 11-21-16(d) exemption):
    # 2025 FPG $15,650 + $5,500 = $21,150. Taxable income $16,000 - $2,500 =
    # $13,500; tax $10,000 x 2.22% + $3,500 x 2.96% = $325.60. Income is
    # below the FPG, so the credit is 100%: $325.60.
    wv_low_income_family_tax_credit_eligible: true
    wv_low_income_family_tax_credit_fpg: 21150
    wv_personal_exemption: 2500
    wv_taxable_income: 13500
    wv_income_tax_before_non_refundable_credits: 325.6
    wv_low_income_family_tax_credit_potential: 325.6

