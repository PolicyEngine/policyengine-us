    wv_income_tax_before_non_refundable_credits: 281.2
    wv_low_income_family_tax_credit_potential: 281.2

- name: 2025 single filer who can be claimed, with a child the filing exception lets the filer claim, keeps the IT-140 count in West Virginia family size
  period: 2025
  input:
    people:
      parent:
        age: 22
        employment_income: 16_000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: true
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [parent, child]
        state_code: WV
  output:
    # The child adds an exemption, so the return keeps the ordinary count:
    # family size 1 and a $2,000 exemption, with no 11-21-16(d) exemption.
    # FPG $15,650. Taxable income $14,000; tax $222 + $4,000 x 2.96% =
    # $340.40. Income exceeds the FPG by $350, so the credit is 80%: $272.32.
    wv_low_income_family_tax_credit_fpg: 15650
    wv_personal_exemption: 2000
    wv_income_tax_before_non_refundable_credits: 340.4
    wv_low_income_family_tax_credit_potential: 272.32
