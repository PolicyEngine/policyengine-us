- name: 2025 joint return with neither spouse claimable: West Virginia low-income family tax credit uses the exemptions that may be claimed
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WV
  output:
    # Family size 2: $15,650 + $5,500 = $21,150. Taxable income $12,000;
    # tax $222 + $2,000 x 2.96% = $281.20; income below the FPG: 100%.
    wv_low_income_family_tax_credit_eligible: true
    wv_low_income_family_tax_credit_fpg: 21150
    wv_income_tax_before_non_refundable_credits: 281.2
    wv_low_income_family_tax_credit_potential: 281.2
