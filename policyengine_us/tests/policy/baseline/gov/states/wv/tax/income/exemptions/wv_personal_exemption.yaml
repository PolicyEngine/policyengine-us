- name: "2025 joint return with one claimable spouse and a child: West Virginia personal exemption has no dependent exemption (the claimable spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: WV
  output:
    # IRC 152(b)(1): either spouse being claimable leaves the return no
    # dependents; one exemption x $2,000 (the control below gets $6,000).
    wv_personal_exemption: 2000

- name: "2025 joint return with one claimable spouse and a child: West Virginia personal exemption has no dependent exemption (the claimable spouse is the spouse)"
  period: 2025
  input:
    people:
