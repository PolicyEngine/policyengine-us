- name: 2025 single filer who can be claimed but whose would-be claimant meets the filing exception gets a West Virginia dependent exemption
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 16000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: WV
  output:
    # No own exemption; one dependent exemption x $2,000, so no $500.
    wv_personal_exemption: 2000

- name: WV statutory individual allowance - single claimable filer
  period: 2025
  input:
    people:
      filer:
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members:
        - filer
        filing_status: SINGLE
        wv_agi: 30000
        wv_low_income_earned_income_exclusion: 0
    households:
      household:
        members:
        - filer
        state_code: WV
  output:
    wv_personal_exemption: 500
    wv_taxable_income: 29500

