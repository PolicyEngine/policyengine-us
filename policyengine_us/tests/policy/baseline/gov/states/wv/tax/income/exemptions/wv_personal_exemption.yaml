- name: If not in West Virginia, no exemption.
  period: 2022
  input:
    state_code: VA
  output:
    wv_personal_exemption: 0

- name: Zero tax unit counts in the tax unit.
  period: 2022
  input:
    state_code: WV
    tax_unit_size: 0
  output:
    wv_personal_exemption: 500

- name: Three tax unit counts in the tax unit.
  period: 2022
  input:
    state_code: WV
    tax_unit_size: 3
  output:
    wv_personal_exemption: 6_000

- name: Two tax unit counts in the tax unit.
  period: 2022
  input:
    state_code: WV
    tax_unit_size: 2
  output:
    wv_personal_exemption: 4_000

- name: 2025 single filer who can be claimed as a dependent: West Virginia personal exemption counts only exemptions that may be claimed
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 16000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: WV
  output:
    # W. Va. Code 11-21-16 and IRC 151(d)(2): no exemption for a filer who
    # can be claimed; a return with no exemptions takes $500 instead.
    wv_personal_exemption: 500

- name: 2025 joint return with one claimable spouse: West Virginia personal exemption counts only exemptions that may be claimed (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WV
  output:
    # One exemption for the spouse who cannot be claimed: $2,000.
    wv_personal_exemption: 2000

- name: 2025 joint return with one claimable spouse: West Virginia personal exemption counts only exemptions that may be claimed (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        employment_income: 8000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: WV
  output:
    wv_personal_exemption: 2000

- name: 2025 joint return with both spouses claimable: West Virginia personal exemption counts only exemptions that may be claimed
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WV
  output:
    # No exemptions on the return: the $500 fallback, once per return.
    wv_personal_exemption: 500

