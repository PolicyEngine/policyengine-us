# Counterfactual coverage cap only: full V100000 and T1000 stay unchanged, as does the
# separate homestead exemption. SCTC=1000*30000/100000=300; HEPTC=1000-300-600=100.
# This is not an entered award or a pre-capped tax input.
- name: Case 7, the full uncapped value supports a covered-value cap reform.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: WV
    age: 70
    adjusted_gross_income: 15_000
    alternative_minimum_tax: 0
    wv_sctc_homestead_qualified: true
    wv_sctc_family_unit_size: 1
    wv_sctc_homestead_facts_available: true
    wv_sctc_income_facts_available: true
    wv_sctc_disabled_veteran_credit_claim_status: NOT_CLAIMED
    wv_sctc_payment_facts_available: true
    wv_sctc_taxable_assessed_value: 100_000
    wv_sctc_qualified_property_taxes_paid: 1_000
    gov.states.wv.tax.income.credits.sctc.max_amount: 30_000
    real_estate_taxes: 1_000
    wv_gross_household_income: 15_000
  output:
    wv_sctc_covered_assessed_value: 30_000
    wv_sctc: 300
    wv_homestead_excess_property_tax_credit: 100
    wv_refundable_credits: 400

