- name: Case 8, court supervision is specific to the child in a mixed household.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        is_under_court_supervision: true
      person2:
        age: 17
        is_under_court_supervision: true
      person3:
        age: 17
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: ND
  output:
    nd_ccap_eligible_child: [false, true, false]
