# Verified court-supervision pathways and independent eligibility requirements.
- name: ND care-specific court order age boundaries
  period: 2026-09
  input:
    state_code:
      2026: [ND, ND, ND, ND, ND, ND]
    age:
      2026: [12, 13, 17, 18, 19, 40]
    requires_childcare_under_court_order:
      2026: [true, true, true, true, true, true]
  output:
    nd_ccap_eligible_child: [true, true, true, true, false, false]
    is_disabled: false
    receives_or_needs_protective_services: false

- name: ND general court supervision alone does not establish a care order
  period: 2026-09
  input:
    state_code:
      2026: [ND, ND, ND, ND]
    age:
      2026: [12, 13, 17, 18]
    is_under_court_supervision:
      2026: [true, true, true, true]
  output:
    nd_ccap_eligible_child: [true, false, false, false]
    requires_childcare_under_court_order: false

- name: ND care order does not bypass immigration requirement
  period: 2026-09
  input:
    state_code:
      2026: ND
    age:
      2026: 17
    requires_childcare_under_court_order:
      2026: true
    immigration_status:
      2026: UNDOCUMENTED
  output:
    nd_ccap_eligible_child: false

- name: ND supervised teenager receives child-care benefit through full pipeline
  period: 2026-09
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 12000
        weekly_hours_worked_before_lsr:
          2026: 25
      child:
        age:
          2026: 17
        is_tax_unit_dependent:
          2026: true
        is_in_k12_school:
          2026: true
        childcare_hours_per_week:
          2026: 30
        childcare_hours_per_day:
          2026: 6
        childcare_days_per_week:
          2026: 5
        childcare_attending_days_per_month:
          2026: 20
        pre_subsidy_childcare_expenses:
          2026: 1200
        requires_childcare_under_court_order:
          2026: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses:
          2026: 1200
    households:
      household:
        members: [parent, child]
        state_code:
          2026: ND
        county_str:
          2026: CASS_COUNTY_ND
  output:
    nd_ccap_eligible_child: [false, true]
    nd_ccap_eligible: true
    nd_ccap: 100

