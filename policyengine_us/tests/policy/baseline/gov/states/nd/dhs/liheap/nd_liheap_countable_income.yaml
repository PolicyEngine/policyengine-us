# A positive health_insurance_premiums input takes precedence. Otherwise the
# deduction is the non-Medicare premiums (floored at zero) plus the computed
# out-of-pocket Medicare Part A and Part B premiums, net of Medicare Savings
# Program coverage. 2026 Part B: 202.90 * 12 = 2,434.80; Part A is premium
# free at the default 40 quarters. A 34,000 pension gives MSP income of
# 34,000 / 12 - 20 = 2,813.33 a month, above the 1,795.50 QI limit.
# Source: ND manual 415-25-05-05-05, Medicare premiums except those MSP pays.
# https://www.nd.gov/dhs/policymanuals/415/415_25_05_05_05.htm

# A negative aggregate is not a reported positive total:
# 34,000 - (1,200 + 2,434.80) - 600 = 29,765.20.
- name: "Case 17, a nonpositive aggregate uses the premium components and the computed Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: -1
        health_insurance_premiums_without_medicare_part_b: 1_200
        other_medical_expenses: 600
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 29_765.2

# A negative non-Medicare premium report is floored at zero, so it cannot
# offset the computed Part B premium: 34,000 - (0 + 2,434.80) = 31,565.20.
# Without the floor the deduction would be 2,134.80, giving 31,865.20.
- name: "Case 18, a negative non-Medicare premium component cannot offset the computed Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: -300
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 31_565.2

# Coverage case: every listed source gets a distinct positive amount, so
# dropping or repeating any entry changes a total. Sections 415-25-05-20-05,
# 415-25-05-20-20 and 415-25-05-27-15.
# Earned: 12,000 wages + 3,000 + 2,500 self-employment + 1,500 farm
# + 1,000 partnership + 2,000 military basic pay = 22,000; * 0.73 = 16,060.
# Unearned: 2,400 Social Security + 1,200 SSI + 1,800 unemployment
# + 1,100 workers' compensation + 1,300 pension + 1,400 military survivor
# annuity + 1,500 retirement distributions + 600 general assistance
# + 700 railroad + 800 veterans + 900 disability + 1,000 survivor
# + 500 strike + 400 child support + 300 alimony + 200 rental + 150 farm rent
# + 250 S corporation + 350 estate = 16,850. Total: 16,060 + 16,850 = 32,910.
- name: "Case 19, every listed earned and unearned source counts."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        self_employment_income: 3_000
        sstb_self_employment_income: 2_500
        farm_operations_income: 1_500
        partnership_income: 1_000
        military_basic_pay: 2_000
        social_security: 2_400
        ssi: 1_200
        unemployment_compensation: 1_800
        workers_compensation: 1_100
        pension_income: 1_300
        military_retirement_pay_survivors: 1_400
        retirement_distributions: 1_500
        general_assistance: 600
        railroad_benefits: 700
        veterans_benefits: 800
        disability_benefits: 900
        survivor_benefits: 1_000
        strike_benefits: 500
        child_support_received: 400
        alimony_income: 300
        rental_income: 200
        farm_rent_income: 150
        s_corp_income: 250
        estate_income: 350
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    total_unemployment_compensation: 1_800
    military_retirement_income: 1_400
    nd_liheap_countable_earned_income: 16_060
    nd_liheap_countable_unearned_income: 16_850
    nd_liheap_countable_income: 32_910

# Each unearned source is floored at zero, so a 3,000 rental loss cannot
# offset a 20,000 pension: countable unearned income is 20,000, not 17,000.
- name: "Case 20, a rental loss does not offset a pension."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        pension_income: 20_000
        rental_income: -3_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_liheap_countable_unearned_income: 20_000
    nd_liheap_countable_income: 20_000

# Section 415-25-05-50 excludes earnings only of a dependent child under 20 in
# school. Each 17-year-old earns 8,000 beside a parent's 25,000 pension.
# Household 1: not a tax dependent, in school; 8,000 * 0.73 = 5,840 counts,
# 25,000 + 5,840 = 30,840. Household 2: a dependent not in school; 5,840
# counts, 30,840. Household 3: a dependent in K-12 school (not secondary
# school); the earnings are excluded, 25,000.
- name: "Case 21, the student earnings exclusion requires dependency and school attendance."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 45, immigration_status: CITIZEN, pension_income: 25_000}
      person2:
        age: 17
        immigration_status: CITIZEN
        employment_income: 8_000
        is_tax_unit_dependent: false
        is_in_k12_school: true
        is_in_secondary_school: false
      person3: {age: 45, immigration_status: CITIZEN, pension_income: 25_000}
      person4:
        age: 17
        immigration_status: CITIZEN
        employment_income: 8_000
        is_tax_unit_dependent: true
        is_in_k12_school: false
        is_in_secondary_school: false
      person5: {age: 45, immigration_status: CITIZEN, pension_income: 25_000}
      person6:
        age: 17
        immigration_status: CITIZEN
        employment_income: 8_000
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_in_secondary_school: false
    tax_units:
      tax_unit1: {members: [person1]}
      tax_unit2: {members: [person2]}
      tax_unit3: {members: [person3, person4]}
      tax_unit4: {members: [person5, person6]}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        nd_tanf: 0
      spm_unit2:
        members: [person3, person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        nd_tanf: 0
      spm_unit3:
        members: [person5, person6]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        nd_tanf: 0
    households:
      household1: {members: [person1, person2], state_code: ND}
      household2: {members: [person3, person4], state_code: ND}
      household3: {members: [person5, person6], state_code: ND}
  output:
    nd_liheap_countable_earned_income: [0, 5_840, 0, 5_840, 0, 0]
    nd_liheap_countable_income: [30_840, 30_840, 25_000]
