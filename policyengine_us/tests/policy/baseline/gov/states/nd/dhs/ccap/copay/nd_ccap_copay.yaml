# The additional waiver cases set annual SMI directly to 120,000.
# Monthly SMI = 120,000 / 12 = 10,000.
# At monthly income 4,500, the worksheet applies the 44-46 percent SMI band:
# ordinary copay = 2 percent * 44 percent * 10,000 = 88.
# Set eligibility directly in these copay cases to isolate waiver decisions.

# Monthly SMI = 120,000 / 12 = 10,000; income / SMI = 0.45.
# Copay = 0.02 * 0.44 * 10,000 = 88.
- name: North Dakota charges the worksheet copay when new inputs retain their defaults
  period: 2026-10
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age:
          2026: 30
        ssi: 0
      child:
        age:
          2026: 3
        ssi: 0
    spm_units:
      family:
        members: [parent, child]
        hhs_smi:
          2026: 120000
        nd_ccap_countable_income: 4500
        is_tanf_enrolled: false
        nd_ccap_eligible: true
    households:
      household:
        members: [parent, child]
        state_code:
          2026: ND
  output:
    nd_ccap_workforce_benefit_eligible: false
    nd_ccap_copay: 88

# The ordinary copay = 0.02 * 0.44 * 10,000 = 88; North Dakota waives it.
- name: North Dakota waives the copay for a Workforce Benefit family
  period: 2024-07
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age:
          2024: 30
        ssi: 0
        nd_ccap_workforce_benefit_eligible_parent: true
      child:
        age:
          2024: 3
        ssi: 0
    spm_units:
      family:
        members: [parent, child]
        hhs_smi:
          2024: 120000
        nd_ccap_countable_income: 4500
        is_tanf_enrolled: false
        nd_ccap_eligible: true
    households:
      household:
        members: [parent, child]
        state_code:
          2024: ND
  output:
    nd_ccap_workforce_benefit_eligible: true
    nd_ccap_copay: 0

