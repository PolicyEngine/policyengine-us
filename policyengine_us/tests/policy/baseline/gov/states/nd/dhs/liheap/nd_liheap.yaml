# Reported premium repair contract v2: supplied positive aggregate takes precedence.
# Components represent paid, unreimbursed premiums; no calculated Medicare premium is used.
# Source: ND manual 415-25-05-05-05, including paid Medicare premiums.
# https://www.nd.gov/dhs/policymanuals/415/415_25_05_05_05.htm

# Accepted C1: 34,000 - 2,400 = 31,600; the 65% band yields 650 on a 1,000 gas bill.
- name: "Case 32, reported paid Part B premiums change the direct heating share."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 0
        medicare_part_b_premiums_reported: 2_400
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    nd_liheap_countable_income: 31_600
    nd_liheap_share: 0.65
    nd_liheap: 650
    msp_part_b_premium_coverage: 0

# 34,000 - 1,200 - 2,400 - 600 = 29,800; the 65% share yields 650.
- name: "Case 33, reported premium components preserve other medical deductions."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 1_200
        medicare_part_b_premiums_reported: 2_400
        other_medical_expenses: 600
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    nd_liheap_countable_income: 29_800
    nd_liheap_share: 0.65
    nd_liheap: 650

# 37,000 - 1,200 aggregate - 600 other medical = 35,200; the 45% share yields 450.
- name: "Case 34, a positive premium aggregate replaces both reported components."
  period: 2026
