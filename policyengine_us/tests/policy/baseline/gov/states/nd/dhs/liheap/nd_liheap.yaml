# Sections 415-25-05-20-20 and 415-25-05-15 count actual cash receipts.
# Without TANF take-up only adult SSI of 9,600 counts. A separate family's
# reported TANF receipt of 3,600 counts once: 9,600 + 3,600 = 13,200.
# Both are below the two-person first ceiling of 17,670 and receive 100%.
# No counterfactual ND TANF entitlement is supplied or asserted as payable.
- name: "Case 37, TANF nonreceipt and reported household receipts determine countable income."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 40, immigration_status: CITIZEN, is_disabled: true, ssi: 9_600}
      person2: {age: 10, immigration_status: CITIZEN}
      person3: {age: 40, immigration_status: CITIZEN, is_disabled: true, ssi: 9_600}
      person4: {age: 10, immigration_status: CITIZEN}
    tax_units:
      tax_unit1: {members: [person1, person2]}
      tax_unit2: {members: [person3, person4]}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        takes_up_tanf_if_eligible: false
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
      spm_unit2:
        members: [person3, person4]
        tanf: 3_600
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
    households:
      household1: {members: [person1, person2], state_code: ND}
      household2: {members: [person3, person4], state_code: ND}
  output:
    tanf: [0, 3_600]
    nd_liheap_countable_income: [9_600, 13_200]
    nd_liheap_share: [1, 1]
    nd_liheap: [3_000, 3_000]

# Sections 415-25-05-05 and 415-25-05-05-05 allow the 27% earnings deduction
# and household-paid premiums. Pretax premiums are disjoint from nonpretax bills.
# 28,000 * 0.73 = 20,440; less 1,200 pretax = 19,240, at the 95% share.
# A further nonpretax aggregate of 1,200 gives 18,040 without counting its
# duplicate component. Negative pretax reports give no deduction: 20,440, 85%.
- name: "Case 38, disjoint pretax premiums are nonnegative and retain aggregate precedence."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 28_000
        pre_tax_health_insurance_premiums: 1_200
      person2:
        age: 40
        immigration_status: CITIZEN
        employment_income: 28_000
        pre_tax_health_insurance_premiums: 1_200
        health_insurance_premiums: 1_200
        health_insurance_premiums_without_medicare_part_b: 1_200
      person3:
        age: 40
        immigration_status: CITIZEN
        employment_income: 28_000
        pre_tax_health_insurance_premiums: -1_200
    tax_units:
      tax_unit1: {members: [person1]}
      tax_unit2: {members: [person2]}
      tax_unit3: {members: [person3]}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
      spm_unit2:
        members: [person2]
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
      spm_unit3:
        members: [person3]
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
    households:
      household1: {members: [person1], state_code: ND}
      household2: {members: [person2], state_code: ND}
      household3: {members: [person3], state_code: ND}
  output:
    nd_liheap_countable_earned_income: [20_440, 20_440, 20_440]
    nd_liheap_countable_income: [19_240, 18_040, 20_440]
    nd_liheap_share: [0.95, 0.95, 0.85]
    nd_liheap: [2_850, 2_850, 2_550]

