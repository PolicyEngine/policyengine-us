# Manual 415-25-05-05-05 bars Part A and B premiums that a Medicare Savings
# Program pays. MSP income: 15,000 / 12 - 20 = 1,230 a month, within the QMB
# limit of 15,960 / 12 = 1,330; no countable resources, under the 9,950 limit.
# MSP pays the full 2,434.80 Part B premium, so nothing is deducted and the
# 15,000 pension is in the 95% band (13,519-20,274): 1,000 * 0.95 = 950.
# Deducting 2,434.80 would give 12,565.20 and the 100% share.
- name: "Case 44, a Part B premium that a Medicare Savings Program pays is not deducted."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        pension_income: 15_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    msp_part_b_premium_coverage: 2_434.8
    medicare_part_b_premium: 0
    nd_liheap_countable_income: 15_000
    nd_liheap_share: 0.95
    nd_liheap: 950

# With 35 quarters of coverage, Part A costs the 2026 reduced premium of
# 311 * 12 = 3,732. MSP income of 38,000 / 12 - 20 = 3,146.67 a month is above
# the QMB and QI limits, so the enrollee pays both premiums:
# 38,000 - 3,732 - 2,434.80 = 31,833.20, within the 65% band (27,031-33,786):
# 1,000 * 0.65 = 650. Deducting Part B alone (35,565.20) gives the 45% share.
- name: "Case 45, a premium-paying Part A enrollee deducts the Part A premium."
