# Section 415-25-05-20-20 counts primary retirement pay separately from pension/VA.
# 50,000 exceeds the one-person maximum of 40,530. The 30,000 control is
# between 27,030 and 33,786: a 65% share of the 3,000 oil bill is 1,950.
- name: "Case 36, primary military retirement counts without excluding eligible retirees."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_veteran: true
        years_in_military: 20
        military_retirement_pay: 50_000
        pension_income: 0
        veterans_benefits: 0
      person2:
        age: 40
        immigration_status: CITIZEN
        is_veteran: true
        years_in_military: 20
        military_retirement_pay: 30_000
        pension_income: 0
        veterans_benefits: 0
    tax_units:
      tax_unit1: {members: [person1]}
      tax_unit2: {members: [person2]}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
      spm_unit2:
        members: [person2]
        heating_type: FUEL_OIL
        fuel_oil_expense: 3_000
    households:
      household1: {members: [person1], state_code: ND}
      household2: {members: [person2], state_code: ND}
  output:
    nd_liheap_countable_income: [50_000, 30_000]
