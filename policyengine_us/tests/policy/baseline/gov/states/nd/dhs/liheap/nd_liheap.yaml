# A positive health_insurance_premiums input takes precedence. Otherwise the
# deduction is the non-Medicare premiums (floored at zero) plus the computed
# out-of-pocket Medicare Part A and Part B premiums, net of Medicare Savings
# Program coverage. 2026 Part B: 202.90 * 12 = 2,434.80 (no IRMAA at these
# incomes); Part A is premium free at the default 40 quarters of coverage.
# MSP: a 34,000 pension gives 34,000 / 12 - 20 = 2,813.33 a month, above the
# QI limit of 1.35 * 15,960 / 12 = 1,795.50, so MSP pays nothing.
# Source: ND manual 415-25-05-05-05, Medicare premiums except those MSP pays.
# https://www.nd.gov/dhs/policymanuals/415/415_25_05_05_05.htm

# A reported 2,400 total replaces the computed 2,434.80 Part B premium:
# 34,000 - 2,400 = 31,600; the 65% band yields 650 on a 1,000 gas bill.
- name: "Case 32, a reported premium total replaces the computed Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 2_400
        health_insurance_premiums_without_medicare_part_b: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 31_600
    nd_liheap_share: 0.65
    nd_liheap: 650
    msp_part_b_premium_coverage: 0

# 34,000 - (1,200 + 2,434.80 Part B) - 600 = 29,765.20; the 65% share yields 650.
- name: "Case 33, premium components with the computed Part B premium preserve other medical deductions."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 1_200
        other_medical_expenses: 600
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 29_765.2
    nd_liheap_share: 0.65
    nd_liheap: 650

# 37,000 - 1,200 aggregate - 600 other medical = 35,200; the 45% share yields 450.
# Neither the 1,200 component nor the computed 2,434.80 Part B premium is added.
- name: "Case 34, a positive premium aggregate replaces the components and the computed Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 37_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 1_200
        health_insurance_premiums_without_medicare_part_b: 1_200
        other_medical_expenses: 600
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 35_200
    nd_liheap_share: 0.45
    nd_liheap: 450

# With no reported premium, the computed Part B premium is deducted:
# 34,000 - 2,434.80 = 31,565.20, within the 65% band (27,031-33,786);
# 1,000 * 0.65 = 650. Without the deduction 34,000 is in the 45% band.
- name: "Case 35, Medicare enrollment deducts the computed Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    medicare_part_a_premium: 0
    medicare_part_b_premium: 2_434.8
    nd_liheap_countable_income: 31_565.2
    nd_liheap_share: 0.65
    nd_liheap: 650
    msp_part_b_premium_coverage: 0

# Section 415-25-05-20-20 counts primary retirement pay separately from pension/VA.
# 50,000 exceeds the one-person maximum of 40,530. The 30,000 control is
# between 27,030 and 33,786: a 65% share of the 3,000 oil bill is 1,950.
- name: "Case 36, primary military retirement counts without excluding eligible retirees."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_veteran: true
        years_in_military: 20
        military_retirement_pay: 50_000
        pension_income: 0
        veterans_benefits: 0
      person2:
        age: 40
        immigration_status: CITIZEN
        is_veteran: true
        years_in_military: 20
        military_retirement_pay: 30_000
        pension_income: 0
        veterans_benefits: 0
    tax_units:
      tax_unit1: {members: [person1]}
      tax_unit2: {members: [person2]}
    spm_units:
      spm_unit1:
        members: [person1]
