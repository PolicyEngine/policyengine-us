# ND manual 415-25-05-05, -20, -27, -30 and -50.
# Expected amounts are independently derived from the source contract.
# https://www.nd.gov/dhs/policymanuals/415/415_25_05_05.htm
- name: Case 1, 27 percent deduction applies to wages.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 20000
        ssi: 0
    spm_units:
      spm_unit:
        members: &id001
        - person1
        heating_type: NATURAL_GAS
        gas_expense: 1000
        nd_tanf: 0
    households:
      household:
        members: *id001
        state_code: ND
  output:
    nd_liheap_countable_income: 14600
