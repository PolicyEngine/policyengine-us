# Reported premium repair contract v2: supplied positive aggregate takes precedence.
# Components represent paid, unreimbursed premiums; no calculated Medicare premium is used.
# Source: ND manual 415-25-05-05-05, including paid Medicare premiums.
# https://www.nd.gov/dhs/policymanuals/415/415_25_05_05_05.htm

# Contract v2: a negative aggregate is not a reported positive total; 34,000 - 1,200 - 2,400 - 600 = 29,800.
- name: "Case 17, a nonpositive aggregate uses the reported premium components."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: -1
        health_insurance_premiums_without_medicare_part_b: 1_200
        medicare_part_b_premiums_reported: 2_400
        other_medical_expenses: 600
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
  output:
    nd_liheap_countable_income: 29_800

# Contract v2: negative non-Part-B and negative Part-B reports cannot offset the other positive component.
- name: "Case 18, each reported premium component has its own zero floor."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: -300
        medicare_part_b_premiums_reported: 2_400
      person2:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 34_000
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 1_200
        medicare_part_b_premiums_reported: -300
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
      spm_unit2:
        members: ["person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        nd_tanf: 0
    households:
      household1:
        members: ["person1"]
        state_code: "ND"
      household2:
        members: ["person2"]
        state_code: "ND"
  output:
    nd_liheap_countable_income: [31_600, 32_800]
