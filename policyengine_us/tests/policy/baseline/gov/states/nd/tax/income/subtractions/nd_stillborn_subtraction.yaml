- name: 2025 single filer who can be claimed as a dependent: North Dakota stillborn child subtraction
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
        tax_unit_stillborn_children: 1
    households:
      household:
        members: [person_a]
        state_code: ND
  output:
    # Schedule ND-1SA line 8: "You would have been eligible to claim the
    # child as a dependent" on your federal return. IRC 152(b)(1): a return on which the filer (or, if joint, either spouse) can be claimed as a dependent has no dependents.
    nd_stillborn_subtraction: 0

