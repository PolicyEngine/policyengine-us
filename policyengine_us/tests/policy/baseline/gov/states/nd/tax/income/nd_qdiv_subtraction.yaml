- name: Test 1, ND qualified dividend subtraction
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        qualified_dividend_income: 700
      person2:
        is_tax_unit_spouse: true
        qualified_dividend_income: 100
    household:
      state_code: ND
  output:
    nd_qdiv_subtraction: 800 * 0.40

- name: A dependent's qualified dividends are on the dependent's own return
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 50_000
        qualified_dividend_income: 1_000
      child:
        age: 10
        qualified_dividend_income: 5_000
    household:
      state_code: ND
  output:
    nd_qdiv_subtraction: 400
