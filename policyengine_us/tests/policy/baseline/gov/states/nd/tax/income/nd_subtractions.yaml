# A dependent's income is not in the filer's federal taxable income; the
# dependent reports it on their own return. So North Dakota subtracts only
# the head's and spouse's military retirement and military service pay.
- name: A dependent child's military retirement pay is not subtracted from the filer's income.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
      child:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: ND
  output:
    nd_subtractions: 0

- name: Only the head's and spouse's military pay is subtracted, not a dependent's.
  period: 2025
  input:
    people:
      head:
        age: 50
        employment_income: 100_000
        military_retirement_pay: 12_000
      spouse:
        age: 45
        military_service_income: 3_000
      child:
        age: 16
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
        military_service_income: 4_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
        state_code: ND
  output:
    # 12,000 head military retirement + 3,000 spouse military pay; the
    # child's 14,000 is excluded.
    nd_subtractions: 15_000
