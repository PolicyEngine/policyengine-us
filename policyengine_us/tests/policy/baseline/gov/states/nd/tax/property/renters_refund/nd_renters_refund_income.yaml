- name: Case 1, income includes dependent earnings and Social Security less medical expenses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        employment_income: 30_000
        social_security_retirement: 20_000
        other_medical_expenses: 2_000
      person2:
        age: 16
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ND
  output:
    nd_renters_refund_income: 53_000

- name: Case 2, medical expenses reduce income but not below zero.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        employment_income: 1_000
        other_medical_expenses: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_renters_refund_income: 0

- name: Case 3, income includes unemployment and excludes nonincome sources.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        unemployment_compensation: 8_000
        general_assistance: 4_000
        ssi: 6_000
        child_support_received: 3_000
        financial_assistance: 4_000
        survivor_benefits: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_renters_refund_income: 12_000

- name: Case 4, after-tax premiums reduce renter refund income as medical expenses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 0
  output:
    market_income: 40_000
    itemized_medical_expenses: 6_000
    nd_renters_refund_income: 34_000

- name: Case 5, mixed premiums reduce renter refund income once through each disjoint route.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 3_000
    pre_tax_health_insurance_premiums: 3_000
  output:
    market_income: 40_000
    irs_employment_income: 37_000
    itemized_medical_expenses: 3_000
    nd_renters_refund_income: 34_000

- name: Case 6, pretax premiums reduce renter refund income as excluded wage income.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 6_000
  output:
    market_income: 40_000
    irs_employment_income: 34_000
    itemized_medical_expenses: 0
    nd_renters_refund_income: 34_000

- name: Case 7, employer-paid premiums do not reduce renter refund income.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 0
    employer_sponsored_insurance_premiums: 6_000
  output:
    market_income: 40_000
    nd_renters_refund_income: 40_000

- name: North Dakota renter refund deducts medical expenses actually paid from gross income
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    health_insurance_premiums: 6_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    # The property tax program separately deducts the full 6,500 paid.
    nd_renters_refund_income: 23_500

- name: North Dakota renter refund preserves caller-supplied medical expenses
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
  output:
    nd_renters_refund_income: 23_500

- name: North Dakota cannot add back an SE deduction without reported premiums
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
    self_employed_health_insurance_ald: 1_000
  output:
    nd_renters_refund_income: 23_500

- name: North Dakota supplied subtotal takes precedence over premiums and SE deduction
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
    health_insurance_premiums: 6_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 6_500
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    nd_renters_refund_income: 23_500

- name: North Dakota supplied subtotal below potential exclusion remains unchanged
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 500
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 500
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    # The supplied paid-cost base is $500, not $1,500.
    nd_renters_refund_income: 29_500

- name: North Dakota supplied zero subtotal does not restore a potential exclusion
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 0
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses_applied_exclusion: 0
    nd_renters_refund_income: 30_000

- name: North Dakota combines the pretax income exclusion with paid SE medical costs
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 10_000
    self_employment_income: 30_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 3_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    itemized_medical_expenses_applied_exclusion: 1_000
    # 40,000 - 3,000 - (5,500 + 1,000) = 30,500.
    nd_renters_refund_income: 30_500

- name: North Dakota restores the exclusion supplied with a net Schedule A subtotal
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    # Schedule A line 1 of 10,000 leaves out 6,400 of premiums (6,000
    # medical, 400 long-term care) taken as the self-employed deduction.
    itemized_medical_expenses: 10_000
    itemized_medical_expenses_applied_exclusion: 6_400
  output:
    # Medical costs paid: 10,000 + 6,400 = 16,400.
    nd_renters_refund_income: 13_600

# Expenses a dependent paid. NDCC 57-02-08.1(5)(c) excludes from income
# "medical expenses paid during the year by the applicant or the applicant's
# dependent". The federal subtotal counts only the filers' premiums, so the
# dependent's own payments are added back. Two tax units with the same people
# label the earner head and then spouse.
- name: North Dakota takes out premiums a dependent paid as well as the filers' costs
  period: 2025
  input:
    people:
      a_earner:
        age: 45
        is_tax_unit_head: true
        employment_income: 30_000
        other_medical_expenses: 500
      a_partner:
        age: 45
        is_tax_unit_spouse: true
      a_student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
      b_earner:
        age: 45
        is_tax_unit_spouse: true
        employment_income: 30_000
        other_medical_expenses: 500
      b_partner:
        age: 45
        is_tax_unit_head: true
      b_student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
    tax_units:
      a:
        members: [a_earner, a_partner, a_student]
      b:
        members: [b_partner, b_earner, b_student]
    households:
      a:
        members: [a_earner, a_partner, a_student]
        state_code: ND
      b:
        members: [b_partner, b_earner, b_student]
        state_code: ND
  output:
    itemized_medical_expenses: [500, 500]
    # 30,000 - (500 + the student's 1,200).
    nd_renters_refund_income: [28_300, 28_300]

- name: North Dakota adds a dependent's premiums to a supplied Schedule A subtotal
  period: 2025
  input:
    people:
      parent:
        age: 45
        employment_income: 30_000
      student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
    tax_units:
      tax_unit:
        members: [parent, student]
        # Schedule A line 1 covers only what the parent paid.
        itemized_medical_expenses: 500
    households:
      household:
        members: [parent, student]
        state_code: ND
  output:
    # 30,000 - (500 + the student's 1,200).
    nd_renters_refund_income: 28_300
