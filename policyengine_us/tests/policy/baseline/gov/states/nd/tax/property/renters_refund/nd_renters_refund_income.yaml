- name: Case 1, income includes dependent earnings and Social Security less medical expenses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        employment_income: 30_000
        social_security_retirement: 20_000
        other_medical_expenses: 2_000
      person2:
        age: 16
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ND
  output:
    nd_renters_refund_income: 53_000

- name: Case 2, medical expenses reduce income but not below zero.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        employment_income: 1_000
        other_medical_expenses: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_renters_refund_income: 0

- name: Case 3, income includes unemployment and excludes nonincome sources.
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 30
        unemployment_compensation: 8_000
        general_assistance: 4_000
        ssi: 6_000
        child_support_received: 3_000
        financial_assistance: 4_000
        survivor_benefits: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ND
  output:
    nd_renters_refund_income: 12_000

- name: Case 4, after-tax premiums reduce renter refund income as medical expenses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 0
  output:
    market_income: 40_000
    itemized_medical_expenses: 6_000
    nd_renters_refund_income: 34_000

- name: Case 5, mixed premiums reduce renter refund income once through each disjoint route.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 3_000
    pre_tax_health_insurance_premiums: 3_000
  output:
    market_income: 40_000
    irs_employment_income: 37_000
    itemized_medical_expenses: 3_000
    nd_renters_refund_income: 34_000

- name: Case 6, pretax premiums reduce renter refund income as excluded wage income.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 6_000
  output:
    market_income: 40_000
    irs_employment_income: 34_000
    itemized_medical_expenses: 0
    nd_renters_refund_income: 34_000

- name: Case 7, employer-paid premiums do not reduce renter refund income.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    state_code: ND
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 0
    employer_sponsored_insurance_premiums: 6_000
  output:
    market_income: 40_000
    nd_renters_refund_income: 40_000

- name: North Dakota renter refund deducts medical expenses actually paid from gross income
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    health_insurance_premiums: 6_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    # The property tax program separately deducts the full 6,500 paid.
    nd_renters_refund_income: 23_500

- name: North Dakota renter refund preserves caller-supplied medical expenses
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
  output:
    nd_renters_refund_income: 23_500

- name: North Dakota cannot add back an SE deduction without reported premiums
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
    self_employed_health_insurance_ald: 1_000
  output:
    nd_renters_refund_income: 23_500

- name: North Dakota supplied subtotal takes precedence over premiums and SE deduction
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 6_500
    health_insurance_premiums: 6_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 6_500
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    nd_renters_refund_income: 23_500

- name: North Dakota supplied subtotal below potential exclusion remains unchanged
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 500
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 500
    itemized_medical_expenses_excluded_premiums: 1_000
    itemized_medical_expenses_applied_exclusion: 0
    # The supplied paid-cost base is $500, not $1,500.
    nd_renters_refund_income: 29_500

- name: North Dakota supplied zero subtotal does not restore a potential exclusion
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    itemized_medical_expenses: 0
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses_applied_exclusion: 0
    nd_renters_refund_income: 30_000

- name: North Dakota combines the pretax income exclusion with paid SE medical costs
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 10_000
    self_employment_income: 30_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 3_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    itemized_medical_expenses_applied_exclusion: 1_000
    # 40,000 - 3,000 - (5,500 + 1,000) = 30,500.
    nd_renters_refund_income: 30_500

- name: North Dakota restores the exclusion supplied with a net Schedule A subtotal
  period: 2025
  input:
    state_code: ND
    employment_income: 30_000
    # Schedule A line 1 of 10,000 leaves out 6,400 of premiums (6,000
    # medical, 400 long-term care) taken as the self-employed deduction.
    itemized_medical_expenses: 10_000
    itemized_medical_expenses_applied_exclusion: 6_400
  output:
    # Medical costs paid: 10,000 + 6,400 = 16,400.
    nd_renters_refund_income: 13_600

- name: North Dakota counts partnership income and capital gain distributions from all sources (#9919).
  period: 2025
  input:
    state_code: ND
    partnership_income: 20_000
    s_corp_income: -2_000
    farm_rent_income: 1_500
    non_sch_d_capital_gains: 500
  output:
    # NDCC 57-02-08.1(5)(c): income for the year from all sources.
    nd_renters_refund_income: 20_000

- name: North Dakota leaves out disability benefits that federal law excludes from income.
  period: 2025
  input:
    state_code: ND
    employment_income: 10_000
    disability_benefits: 12_000
    tax_exempt_disability_benefits: 5_000
  output:
    # The 5,000 from a plan the recipient paid for is excluded by IRC
    # 104(a)(3), and NDCC 57-02-08.1(5)(c) excludes it: 10,000 + 7,000.
    nd_renters_refund_income: 17_000

- name: North Dakota leaves out interest on state and local bonds, which federal law excludes from income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 20_000
    taxable_interest_income: 1_000
    tax_exempt_interest_income: 5_000
  output:
    market_income: 26_000
    # IRC 103(a) excludes the 5,000 of bond interest, and NDCC
    # 57-02-08.1(5)(c) excludes any amount federal law excludes:
    # 20,000 + 1,000.
    nd_renters_refund_income: 21_000

- name: North Dakota counts social security in full but leaves out the nontaxable parts of pensions and IRA distributions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    taxable_private_pension_income: 10_000
    # The investment in the contract (IRC 72(b)(1)).
    tax_exempt_private_pension_income: 4_000
    # A qualified Roth IRA distribution (IRC 408A(d)(1)).
    tax_exempt_ira_distributions: 6_000
    taxable_ira_distributions: 3_000
    social_security_retirement: 8_000
  output:
    # Social security is the one federal exclusion the statute keeps in
    # income: 10,000 + 3,000 + 8,000.
    nd_renters_refund_income: 21_000

- name: North Dakota leaves out the payroll deductions federal law excludes from wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 50_000
    # IRC 402(e)(3) and 402(g)(1) elective deferrals, and HSA contributions
    # through payroll (IRC 106(d)).
    traditional_401k_contributions: 5_000
    health_savings_account_payroll_contributions: 2_000
  output:
    irs_employment_income: 43_000
    nd_renters_refund_income: 43_000

- name: North Dakota counts dependent care assistance above the IRC 129 limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 50_000
    dependent_care_employer_benefits: 9_000
  output:
    # IRC 129(a)(2)(A) excludes 7,500 for 2026, and the other 1,500 is
    # gross income: 50,000 - 7,500.
    taxable_dependent_care_benefits: 1_500
    nd_renters_refund_income: 42_500

- name: North Dakota leaves out alimony under a divorce instrument executed after 2018.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 10_000
    alimony_income: 12_000
    divorce_year: 2020
  output:
    # The recipient's gross income leaves out alimony under an instrument
    # executed after 2018 (IRS Topic 452).
    nd_renters_refund_income: 10_000

- name: North Dakota counts alimony under a divorce instrument executed before 2019.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 10_000
    alimony_income: 12_000
    divorce_year: 2015
  output:
    nd_renters_refund_income: 22_000

- name: North Dakota leaves out a dependent's tax-exempt interest and counts the rest of the dependent's income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 30_000
      child:
        age: 15
        is_tax_unit_dependent: true
        taxable_interest_income: 500
        tax_exempt_interest_income: 2_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ND
  output:
    # NDCC 57-02-08.1(5)(c) counts the dependent's income and excludes what
    # federal law excludes: 30,000 + 500.
    nd_renters_refund_income: 30_500
