    nd_renters_refund_income: 17_000

- name: North Dakota leaves out interest on state and local bonds, which federal law excludes from income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    employment_income: 20_000
    taxable_interest_income: 1_000
    tax_exempt_interest_income: 5_000
  output:
    market_income: 26_000
    # IRC 103(a) excludes the 5,000 of bond interest, and NDCC
    # 57-02-08.1(5)(c) excludes any amount federal law excludes:
    # 20,000 + 1,000.
    nd_renters_refund_income: 21_000

- name: North Dakota counts social security in full but leaves out the nontaxable parts of pensions and IRA distributions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: ND
    taxable_private_pension_income: 10_000
    # The investment in the contract (IRC 72(b)(1)).
    tax_exempt_private_pension_income: 4_000
    # A qualified Roth IRA distribution (IRC 408A(d)(1)).
    tax_exempt_ira_distributions: 6_000
    taxable_ira_distributions: 3_000
    social_security_retirement: 8_000
  output:
    # Social security is the one federal exclusion the statute keeps in
    # income: 10,000 + 3,000 + 8,000.
    nd_renters_refund_income: 21_000

