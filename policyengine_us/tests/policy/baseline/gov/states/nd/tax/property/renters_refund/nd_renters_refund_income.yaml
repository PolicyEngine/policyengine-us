- name: North Dakota's income tax reductions leave retired military benefits, capital gains and dividends in income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    state_code: ND
    # N.D.C.C. 57-38-30.3(2)(d) and (r) reduce North Dakota taxable income by
    # 40 percent of net long-term gains and qualified dividends and by retired
    # military benefits. Item 10 of the Tax Commissioner's guideline lists
    # military pensions and net gains as income.
    military_retirement_pay: 30_000
    long_term_capital_gains: 5_000
    qualified_dividend_income: 1_000
  output:
    # North Dakota's income tax takes each reduction.
    nd_military_retirement_subtraction: 30_000
    nd_ltcg_subtraction: 2_000
    nd_qdiv_subtraction: 400
    # 30,000 + 5,000 + 1,000, with no state-law subtraction.
    nd_renters_refund_income: 36_000
