- name: A rental loss doesn't keep employer adoption assistance in income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        rental_income: -40_000
        social_security_retirement: 10_000
      child:
        age: 3
        is_tax_unit_dependent: true
        # IRC 137(a) excludes 5,000 of the wages.
        qualified_adoption_assistance_expense: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        # Once renter's refund income counts TANF (#10724), the rental loss
        # would qualify the family for it; this case sets TANF to zero to test
        # the loss alone.
        tanf: 0
    households:
      household:
        members: [parent, child]
        state_code: ND
  output:
    # 40,000 - 40,000 + 10,000 - 5,000.
    nd_renters_refund_income: 5_000

