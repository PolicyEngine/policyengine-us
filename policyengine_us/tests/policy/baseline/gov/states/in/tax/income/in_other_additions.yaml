- name: Case 1, default in_other_additions is zero
  period: 2024
  input:
    state_code: IN
    adjusted_gross_income: 50_000
    in_exemptions: 1_000
  output:
    in_other_additions: 0
    in_add_backs: 0
    in_agi: 49_000

- name: Case 2, in_other_additions increases IN add backs and AGI
  period: 2024
  input:
    state_code: IN
    adjusted_gross_income: 50_000
    in_exemptions: 1_000
    in_other_additions: 2_000
  output:
    in_other_additions: 2_000
    in_add_backs: 2_000
    in_agi: 51_000
