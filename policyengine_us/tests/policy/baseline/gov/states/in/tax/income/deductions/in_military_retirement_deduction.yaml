- name: Case 1, Indiana military retirement deduction under 2021 phase-in.
  period: 2021
  input:
    people:
      person1:
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_military_retirement_deduction: 6_250 + 0.75 * (10_000 - 6_250)

- name: Case 2, Indiana military retirement and survivor benefit deduction 100% exempt from 2022.
  period: 2024
  input:
    people:
      person1:
        military_retirement_pay: 30_000
      person2:
        military_retirement_pay_survivors: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_military_retirement_deduction: 40_000
