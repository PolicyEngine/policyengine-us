  output:
    # 300 in_eitc + 200 in_unified_elderly_tax_credit = 500
    in_refundable_credits: 500

- name: Backdated 2015 list counts the earned income and elderly credits
  period: 2015
  input:
    state_code: IN
    in_eitc: 300
    in_unified_elderly_tax_credit: 200
  output:
    # The 2019 list is backdated to 2015, so no rebate is added.
    # 300 in_eitc + 200 in_unified_elderly_tax_credit = 500
    in_refundable_credits: 500
