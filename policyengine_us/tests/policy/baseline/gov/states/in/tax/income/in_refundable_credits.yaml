- name: 2020 list keeps the earned income and elderly credits alongside the rebate
  period: 2020
  input:
    state_code: IN
    in_eitc: 300
    in_unified_elderly_tax_credit: 200
  output:
    # 300 in_eitc + 200 in_unified_elderly_tax_credit + (125 + 200) * 1 rebate
    # = 825
    in_refundable_credits: 825

- name: 2021 list counts the earned income and elderly credits
  period: 2021
  input:
    state_code: IN
    in_eitc: 300
    in_unified_elderly_tax_credit: 200
  output:
    # 300 in_eitc + 200 in_unified_elderly_tax_credit = 500
    in_refundable_credits: 500

- name: 2019 list counts the earned income and elderly credits
  period: 2019
  input:
    state_code: IN
    in_eitc: 300
