- name: Joint filers, two dependents
  period: 2021
  input:
    state_code: IN
    tax_unit_size: 4
  output:
    in_base_exemptions: 4_000

- name: Single filer, two dependents
  period: 2021
  input:
    state_code: IN
    tax_unit_size: 3
  output:
    in_base_exemptions: 3_000


- name: 2025 single filer who can be claimed as a dependent, the filers keep their own exemptions but claim no dependent
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: IN
  output:
    # Information Bulletin 117: the own exemption stays "even if the
    # individual can be claimed as a dependent"; IRC 152(b)(1) removes
    # the dependents.
    in_base_exemptions: 1_000

- name: 2025 joint return with one spouse who can be claimed as a dependent, the filers keep their own exemptions but claim no dependent (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: IN
  output:
    in_base_exemptions: 2_000

- name: 2025 joint return with one spouse who can be claimed as a dependent, the filers keep their own exemptions but claim no dependent (the claimable spouse is the spouse)
  period: 2025
