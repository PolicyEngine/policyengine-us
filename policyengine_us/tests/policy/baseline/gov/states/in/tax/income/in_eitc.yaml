      head:
        age: 30
        employment_income: 18_000
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IN
  output:
    eitc: 45.24
    in_eitc_eligible: true
    in_eitc: 4.52

