# Indiana Income Tax Information Bulletin 70: disability pay at most $100 a
# week, less federal AGI above $15,000 ($7,500 married filing separately).

- name: Deduction reduced by federal AGI above $15,000, with no age limit.
  period: 2024
  input:
    people:
      person:
        age: 67
        retired_on_total_disability: true
        disability_benefits: 10_000
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: IN
  output:
    # min(10,000, 5,200) - (18,000 - 15,000) = 2,200.
    in_disability_retirement_deduction: 2_200

- name: Married filing separately uses a $7,500 threshold.
  period: 2024
  input:
    people:
      person:
        age: 50
        retired_on_total_disability: true
        disability_benefits: 6_000
        taxable_interest_income: 3_000
    tax_units:
      tax_unit:
        members: [person]
        filing_status: SEPARATE
    households:
      household:
        members: [person]
        state_code: IN
  output:
    # min(6,000, 5,200) - (9,000 - 7,500) = 3,700.
    in_disability_retirement_deduction: 3_700

- name: Each spouse's deduction is reduced by the joint federal AGI above $15,000.
  period: 2024
  input:
    people:
      head:
        age: 60
        is_tax_unit_head: true
        retired_on_total_disability: true
        disability_benefits: 6_000
      spouse:
        age: 58
        is_tax_unit_spouse: true
        retired_on_total_disability: true
        disability_benefits: 4_000
        taxable_interest_income: 6_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: IN
  output:
    # Federal AGI 16,000, 1,000 over $15,000.
    # (5,200 - 1,000) + (4,000 - 1,000) = 7,200.
    in_disability_retirement_deduction: 7_200

- name: No deduction without retirement on permanent and total disability.
  period: 2024
  input:
    people:
      person:
        age: 50
        retired_on_total_disability: false
        disability_benefits: 5_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: IN
  output:
    in_disability_retirement_deduction: 0
