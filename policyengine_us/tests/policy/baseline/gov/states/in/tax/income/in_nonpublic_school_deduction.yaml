- name: 2025 single filer who can be claimed as a dependent, no nonpublic school deduction
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 10
        is_in_k12_nonpublic_school: true
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: IN
  output:
    # Information Bulletin 107: the child must be the taxpayer's IRC
    # 152 dependent; a return with a claimable filer has none.
    in_nonpublic_school_deduction: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no nonpublic school deduction (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_in_k12_nonpublic_school: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: IN
  output:
    in_nonpublic_school_deduction: 0

