- name: 2 qualifying kids
  period: 2021
  input:
    people:
      child1: 
        is_in_k12_nonpublic_school: true
      child2: 
        is_in_k12_nonpublic_school: true
    tax_unit: 
      members: [child1, child2]
    households:
      household:
        members: [child1, child2]
        state_code: IN
  output:
    in_nonpublic_school_deduction: 2_000

