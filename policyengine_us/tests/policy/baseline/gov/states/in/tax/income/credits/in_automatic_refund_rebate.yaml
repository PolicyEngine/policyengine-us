- name: Rebate for single filer
  period: 2020
  input:
    state_code: IN
    head_spouse_count: 1
  output:
    in_automatic_refund_rebate: 325  # (125 base + 200 additional) * 1

- name: Rebate for married couple
  period: 2020
  input:
    state_code: IN
    head_spouse_count: 2
  output:
    in_automatic_refund_rebate: 650  # (125 base + 200 additional) * 2

- name: No rebate outside Indiana
  period: 2020
  input:
    state_code: CA
    head_spouse_count: 1
  output:
    in_automatic_refund_rebate: 0

- name: No rebate for zero head_spouse_count
  period: 2020
  input:
    state_code: IN
    head_spouse_count: 0
  output:
    in_automatic_refund_rebate: 0

- name: Rebate for married couple outside Indiana
  period: 2020
  input:
    state_code: NY
    head_spouse_count: 2
  output:
    in_automatic_refund_rebate: 0

- name: Single filer rebate validation
  period: 2020
  input:
    state_code: IN
    filing_status: SINGLE
  output:
    in_automatic_refund_rebate: 325  # (125 base + 200 additional) * 1

- name: No rebate before the one-time 2020 program
  period: 2019
  input:
    state_code: IN
    head_spouse_count: 1
  output:
    in_automatic_refund_rebate: 0

- name: No rebate after the one-time 2020 program
  period: 2021
  input:
    state_code: IN
    head_spouse_count: 2
  output:
    in_automatic_refund_rebate: 0

- name: Couple with a dependent child receives rebate for head and spouse only
  period: 2020
  input:
    people:
      person1:
        age: 40
      person2:
        age: 40
      person3:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: IN
  output:
    head_spouse_count: 2
    # (125 base + 200 additional) * 2; the dependent is not counted.
    in_automatic_refund_rebate: 650
