- name: Indiana joint couple with two qualifying federal annuitants
  period: 2024
  input:
    people:
      person1:
        age: 65
        taxable_public_pension_income: 15_000
        taxable_federal_pension_income: 15_000
        social_security_retirement: 3_000
      person2:
        age: 68
        taxable_public_pension_income: 20_000
        taxable_federal_pension_income: 20_000
        railroad_benefits: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    # person1: min(15_000, 16_000) - 3_000 = 12_000
    # person2: min(20_000, 16_000) - 2_000 = 14_000
    # total = 26_000
    in_civil_service_annuity_deduction: 26_000

