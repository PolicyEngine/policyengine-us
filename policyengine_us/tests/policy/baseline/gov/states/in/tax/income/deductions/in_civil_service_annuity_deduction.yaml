- name: Indiana civil service annuity deduction capped at $16,000 and reduced by Social Security
  period: 2024
  input:
    people:
      person1:
        age: 65
        taxable_public_pension_income: 20_000
        taxable_federal_pension_income: 20_000
        social_security_retirement: 4_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_civil_service_annuity_deduction: 12_000  # min(20_000, 16_000) - 4_000

