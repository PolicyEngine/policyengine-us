- name: Indiana civil service annuity deduction for eligible federal retiree
  period: 2024
  input:
    people:
      person1:
        age: 65
        taxable_public_pension_income: 10_000
        taxable_federal_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_civil_service_annuity_deduction: 10_000
    in_income_tax: 0

