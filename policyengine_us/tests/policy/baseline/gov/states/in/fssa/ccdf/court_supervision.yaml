# Verified court-supervision pathways and independent eligibility requirements.
- name: IN new court-supervised applicants must be under 18
  period: 2026-09
  input:
    state_code:
      2026: [IN, IN, IN, IN, IN, IN]
    age:
      2026: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision:
      2026: [true, true, true, true, true, true]
  output:
    in_ccdf_eligible_child: [true, true, true, false, false, false]

- name: IN active individual awards allow continuation at 18
  period: 2026-09
  input:
    state_code:
      2026: [IN, IN, IN, IN]
    age:
      2026: [17, 18, 19, 40]
    is_under_court_supervision:
      2026: [true, true, true, true]
    in_ccdf_has_active_under_18_award: [true, true, true, true]
  output:
    in_ccdf_eligible_child: [true, true, false, false]

- name: IN household enrollment alone does not establish a child continuation award
  period: 2026-09
  input:
    state_code:
      2026: IN
    age:
      2026: 18
    is_under_court_supervision:
      2026: true
    is_in_ccdf_enrolled: true
  output:
    in_ccdf_eligible_child: false

- name: IN disability uses the same application and continuation ages
  period: 2026-09
  input:
    state_code:
      2026: [IN, IN, IN, IN]
    age:
      2026: [17, 18, 18, 19]
    is_disabled:
      2026: [true, true, true, true]
    in_ccdf_has_active_under_18_award: [false, false, true, true]
  output:
    in_ccdf_eligible_child: [true, false, true, false]

- name: IN continuation award does not bypass immigration
  period: 2026-09
  input:
    state_code:
      2026: IN
    age:
      2026: 18
    is_under_court_supervision:
      2026: true
    in_ccdf_has_active_under_18_award: true
    immigration_status:
      2026: UNDOCUMENTED
  output:
    in_ccdf_eligible_child: false

- name: IN supervised teenager receives child-care benefit through full pipeline
  period: 2026-09
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 12000
        weekly_hours_worked_before_lsr:
          2026: 25
      child:
        age:
          2026: 17
        is_tax_unit_dependent:
          2026: true
        is_in_k12_school:
          2026: true
        childcare_hours_per_week:
          2026: 30
        childcare_hours_per_day:
          2026: 6
        childcare_days_per_week:
          2026: 5
        childcare_attending_days_per_month:
          2026: 20
        pre_subsidy_childcare_expenses:
          2026: 1200
        is_under_court_supervision:
          2026: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses:
          2026: 1200
    households:
      household:
        members: [parent, child]
        state_code:
          2026: IN
        county_str:
          2026: MARION_COUNTY_IN
  output:
    in_ccdf_eligible_child: [false, true]
    in_ccdf_eligible: true
    in_ccdf: 100

