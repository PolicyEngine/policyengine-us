# Court-supervision route for in_ccdf_eligible_child (Policy Manual 1.6,
# p.12): a child with court-ordered supervision who qualified while under 18
# may participate until the Sunday after the 19th birthday, approximated as
# under 19. Court status does not waive income, activity, or immigration
# requirements.
- name: Case 1, court supervision extends the age limit to under 19.
  period: 2026-01
  input:
    state_code: [IN, IN, IN, IN, IN, IN]
    age: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision: [true, true, true, true, true, true]
  output:
    in_ccdf_eligible_child: [true, true, true, true, false, false]

- name: Case 2, court supervision does not bypass the immigration requirement.
  period: 2026-01
  input:
    state_code: IN
    age: 18
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
  output:
    in_ccdf_eligible_child: false

# Monthly expenses of $100 are below the school-age rate, so the payment is
# capped at the $100 charge.
- name: Case 3, supervised 17-year-old receives child-care benefit through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.02
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
        weekly_hours_worked_before_lsr: 25
      person2:
        age: 17
        is_tax_unit_dependent: true
        is_in_k12_school: true
        childcare_hours_per_week: 30
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        childcare_attending_days_per_month: 20
        pre_subsidy_childcare_expenses: 1_200
        is_under_court_supervision: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: IN
        county_str: MARION_COUNTY_IN
  output:
    in_ccdf_eligible_child: [false, true]
    in_ccdf_eligible: true
    in_ccdf: 100

- name: Case 4, supervised 18-year-old at the top of the extended range receives the same benefit.
  # An 18-year-old is a non-child adult, so the head/spouse roles are set
  # explicitly to keep the parent as the only caretaker.
  period: 2026-01
  absolute_error_margin: 0.02
  input:
    people:
      person1:
        age: 35
        is_tax_unit_head_or_spouse: true
        employment_income: 12_000
        weekly_hours_worked_before_lsr: 25
      person2:
        age: 18
        is_tax_unit_dependent: true
        is_tax_unit_head_or_spouse: false
        childcare_hours_per_week: 30
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        childcare_attending_days_per_month: 20
        pre_subsidy_childcare_expenses: 1_200
        is_under_court_supervision: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: IN
        county_str: MARION_COUNTY_IN
  output:
    in_ccdf_eligible_child: [false, true]
    in_ccdf_eligible: true
    in_ccdf: 100

