    in_ccdf_income_eligible: false

# --- 135% FPL applicant boundary at 2027-01 (1.35 era) ---
# January 2027 still uses the 2026 guideline: 2-person FPG = 21,640/yr; 135% prints
# as 2,435 a month, or 29,220 a year. These cases keep a comfortable margin on each
# side of the limit (the inclusive <= boundary is exercised at 2026 in Case 2). The
# ineligible income stays below the 1.5-era limit (32,460), proving the 1.35 rate
# applies.

- name: Case 9, applicant income below 135% FPL, eligible.
  period: 2027-01
  input:
    people:
      person1:
        age: 35
        employment_income: 29_000  # comfortably below the 29,220 limit
      person2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_in_ccdf_enrolled: false
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_ccdf_income_eligible: true

- name: Case 10, applicant income above 135% FPL but below the 1.5-era limit, ineligible.
  period: 2027-01
  input:
    people:
      person1:
        age: 35
        employment_income: 30_800  # above the 29,220 limit, below 1.5 * FPG
      person2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_in_ccdf_enrolled: false
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_ccdf_income_eligible: false

# --- 85% SMI enrolled boundary at 2026-01 ---
# 2-person IN SMI = 6,427.06/mo; 85% = 5,462.99/mo -> 65,555.88/yr. The 2026
# SMI is uprated from the 2025-10-01 actual (107,555/yr) by the CBO AGI
# forecast, and reverts to the un-uprated base (85% = 62,166.79/yr) once an
# actual 2026-10-01 value is added, so these cases keep a comfortable margin
# below the un-uprated limit and above the uprated one.

- name: Case 11, enrolled income below 85% SMI, eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 60_000  # below 85% SMI under either basis
      person2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_in_ccdf_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_ccdf_income_eligible: true

- name: Case 12, enrolled income above 85% SMI, ineligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 70_000  # above 85% SMI (65,556) but below 100% SMI
      person2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_in_ccdf_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_ccdf_income_eligible: false

# --- Degenerate income and family-size scaling ---

- name: Case 13, applicant with zero income, eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 0
      person2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_in_ccdf_enrolled: false
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_ccdf_income_eligible: true

- name: Case 14, larger family, get-on limit scales with household size.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 40_000  # 3,333/mo
      person2:
        age: 33
      person3:
        age: 10
        is_tax_unit_dependent: true
      person4:
        age: 8
        is_tax_unit_dependent: true
      person5:
        age: 5
        is_tax_unit_dependent: true
    marital_units:
      marital_unit:
        members: [person1, person2]
      mu3:
        members: [person3]
      mu4:
        members: [person4]
      mu5:
        members: [person5]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        is_in_ccdf_enrolled: false
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: IN
  output:
    # 5-person FPG 2026 = 38,680/yr; 150% limit = 58,020/yr (4,835/mo).
    # 3,333/mo < 4,835/mo -> eligible. A 2-person unit at this income fails.
    in_ccdf_income_eligible: true

# Tops by family of three: 150% of the 2023 guideline ($3,108) until March 31, 2024; of
# the 2024 guideline ($3,228, state plan section 2.2.4) until May 1, 2025; of the 2025
# guideline ($3,331) until April 5, 2026; then 135% of the 2026 guideline ($3,074, FSSA's
# chart). A monthly period reads each change from the next month's first day.
#
# Before August 2023 the limit was 127% (OECOSL bulletin). No source dates Indiana's
# guideline year before the March 31, 2024 plan, so the model reads the current year's
# guideline until 2024, and these two cases pin that choice: 127% of the 2023 guideline
# gives $2,631 for three in June 2023. The 2022 guideline would give $2,437, and 150%
# would give $3,108.

- name: New applicant of 3 at 2,631 dollars qualifies in 2023-06.
  period: 2023-06
  input:
    people:
      person1:
        age: 30
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        in_ccdf_countable_income: 2_631
        is_in_ccdf_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code:
          2023: IN
  output:
    in_ccdf_income_eligible: true

- name: New applicant of 3 at 2,632 dollars doesn't qualify in 2023-06.
  period: 2023-06
  input:
    people:
      person1:
        age: 30
      person2:
        age: 4
