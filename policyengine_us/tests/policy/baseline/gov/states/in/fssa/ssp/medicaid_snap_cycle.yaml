# These integration cases leave SNAP and Medicaid eligibility computed.
# Indiana SSP enters SNAP unearned income, while Medicaid's 2027 community
# engagement rules can use SNAP receipt. Neither dependency may suppress the
# other program or recurse indefinitely.

- name: Case 1, low-income adult before federal Medicaid work requirements.
  period: 2025-01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    in_ssp_sapn_eligible: false
    in_ssp_rcap_eligible: false
    medicaid_enrolled: true

- name: Case 2, low-income adult when federal Medicaid work requirements begin.
  period: 2027-01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    in_ssp_sapn_eligible: false
    in_ssp_rcap_eligible: false
    # $5,000 is below 80 * $7.25 * 12 = $6,960 and there are no
    # qualifying hours, SNAP work activity, or independent exemptions.
    medicaid_enrolled: false

- name: Case 3, low-income adult in 2030 without a Medicaid exemption.
  period: 2030-01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    in_ssp_sapn_eligible: false
    in_ssp_rcap_eligible: false
    medicaid_enrolled: false

- name: Case 4, low-income adult in 2035 without a Medicaid exemption.
  period: 2035-01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    in_ssp_sapn_eligible: false
    in_ssp_rcap_eligible: false
    medicaid_enrolled: false

- name: Case 5, institutional SSI recipient receives SAPN with computed Medicaid.
  period: 2030-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    # The federal medical-facility rate is $30/month; Indiana's $52
    # personal-needs allowance leaves the maximum $22 SAPN supplement.
    in_ssp: 22
    ssi: 30
    ssi_countable_income: 0
    in_ssp_sapn: 22
    in_ssp_rcap: 0
    in_ssp_sapn_eligible: true
    in_ssp_rcap_eligible: false
    is_medicaid_eligible: true
    medicaid_enrolled: true

- name: Case 6, blind RCAP resident qualifies through Medicaid without SSI receipt.
  period: 2030-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        takes_up_ssi_if_eligible: false
        in_resides_in_licensed_residential_facility: true
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    # Licensed RCAP standard = $49.35/day * 365/12 = $1,501.0625.
    # No SSI or countable income offsets it. Blindness supplies an
    # independent Medicaid work-requirement exemption.
    in_ssp: 1_501.0625
    ssi: 0
    ssi_countable_income: 0
    in_ssp_sapn: 0
    in_ssp_rcap: 1_501.0625
    in_ssp_sapn_eligible: false
    in_ssp_rcap_eligible: true
    medicaid_work_requirement_eligible: true
    medicaid_enrolled: true

- name: Case 7, Medicaid non-takeup prevents SAPN for an institutional SSI recipient.
  period: 2030-01
  input:
    people:
      person1:
        age: 70
        takes_up_medicaid_if_eligible: false
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    ssi: 30
    in_ssp_sapn_eligible: false
    is_medicaid_eligible: true
    medicaid_enrolled: false

- name: Case 8, explicit Medicaid non-enrollment prevents SAPN.
  period: 2030-01
  input:
    people:
      person1:
        age: 70
        medicaid_enrolled: false
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    in_ssp: 0
    ssi: 30
    in_ssp_sapn_eligible: false
    medicaid_enrolled: false

- name: Case 9, SSP calculation preserves another adult's computed SNAP Medicaid pass-through.
  period: 2030-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
        # Workfare satisfies SNAP's ABAWD rule. It does not supply
        # Medicaid activity hours or an independent Medicaid exemption.
        is_snap_workfare_participant: true
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        state_code: IN
      household2:
        members: [person2]
        state_code: IN
  output:
    # Calculate SSP first to detect a helper branch that leaks a false
    # pass-through value into the parent simulation or other people.
    in_ssp: [22, 0]
    ssi: [30, 0]
    in_ssp_sapn_eligible: [true, false]
    in_ssp_rcap_eligible: [false, false]
    medicaid_community_engagement_activity_hours: [0, 0]
    medicaid_community_engagement_pass_through_eligible: [false, true]
    medicaid_work_requirement_eligible: [true, true]
    is_medicaid_eligible: [true, true]
    medicaid_enrolled: [true, true]
