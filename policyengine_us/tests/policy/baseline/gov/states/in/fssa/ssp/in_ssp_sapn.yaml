- name: Case 1, eligible individual receives flat $22 supplement.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        in_ssp_sapn_eligible: true
        ssi_claim_is_joint: false
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    # Individual amount = $22/month
    in_ssp_sapn: 22

- name: Case 2, eligible couple both in Medicaid facility.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        in_ssp_sapn_eligible: true
        ssi_claim_is_joint: true
      person2:
        in_ssp_sapn_eligible: true
        ssi_claim_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    # Couple amount = $44/month ($22 per person)
    # Each person gets $22
    in_ssp_sapn: [22, 22]

- name: Case 3, ineligible person gets zero.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        in_ssp_sapn_eligible: false
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    # defined_for = in_ssp_sapn_eligible, which is false
    in_ssp_sapn: 0

- name: Case 4, couple with asymmetric eligibility.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        in_ssp_sapn_eligible: true
        ssi_claim_is_joint: false
      person2:
        in_ssp_sapn_eligible: false
        ssi_claim_is_joint: false
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    # Only person1 is eligible; not a joint claim
    # person1: individual amount = $22
    # person2: ineligible = $0
    in_ssp_sapn: [22, 0]

# Medicaid Policy Manual 5005.05.00: SAPN fills the $52 personal-needs allowance, capped at $22 per person. Each spouse has $30 SSI and no other budgeted income: $52 - $30 = $22 each. The third adult is not SAPN-eligible; that adult's $100 monthly income is outside the couple budget.
# https://www.in.gov/fssa/ompp/files/Medicaid_PM_5000.pdf#page=2
- name: Indiana combines only spouses budgeted income for SAPN
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      husband:
        age:
          2026: 70
        is_tax_unit_head:
          2026: true
        in_ssp_sapn_eligible: true
        ssi: 30
        ssi_countable_income:
          2026: 0
      wife:
        age:
          2026: 70
        is_tax_unit_spouse:
          2026: true
        in_ssp_sapn_eligible: true
        ssi: 30
        ssi_countable_income:
          2026: 0
      third_adult:
        age:
          2026: 70
        is_tax_unit_dependent:
          2026: true
        in_ssp_sapn_eligible: false
        ssi: 0
        ssi_countable_income:
          2026: 1_200
    tax_units:
      tax_unit:
        members: [husband, wife, third_adult]
    households:
      household:
        members: [husband, wife, third_adult]
        state_code:
          2026: IN
  output:
    in_ssp_sapn: [22, 22, 0]
