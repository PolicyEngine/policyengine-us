- name: Case 8, business losses net against business gains before the floor.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        employment_income: 1_200
        self_employment_income: 1_200
        farm_operations_income: -1_200
        in_ssp_sapn_eligible: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: IN
  output:
    # Business net is $0, so nothing is restored. Earned $100 a month;
    # ($100 - $85) / 2 = $7.50 countable; SSI $30 - $7.50 = $22.50.
    # SAPN = $52 - $22.50 - $7.50 = $22.
    ssi: 22.5
    in_ssp_sapn: 22
