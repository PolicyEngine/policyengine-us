- name: Case 5, farm operations income puts a farm couple over the income limit.
  # Section 6.1 (pages 51-52) defines self-employment to include farming (Schedule F).
  # Income: $58,000 farm operations + $16,640 wages ($16.00 x 1,040 hours) = $74,640.
  # Size 2 SMI: floor($107,555 x 0.68) = $73,137; 60% limit floor($43,882.20) = $43,882.
  # $74,640 > $43,882, so the household is ineligible and receives $0. The wages alone
  # ($16,640) would be within the limit.
  period: 2026
  input:
    people:
      person1:
        age: 52
        farm_operations_income: 58_000
      person2:
        age: 50
        employment_income: 16_640
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: PROPANE
        bottled_gas_expense: 2_400
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_eap_household_size: 2
    in_eap_smi: 73_137
    in_eap_income: 74_640
    in_eap_eligible: false
    in_eap: 0
- name: Case 6, federal 110% poverty floor above the 60% state median income limit at size 16.
  period: 2026
  input:
    state_code: [IN, IN, IN, IN, IN]
    age: [40, 40, 40, 40, 40]
    in_eap_household_size: [16, 16, 16, 16, 15]
    in_eap_income: [104_543, 107_964.99, 107_965, 107_966, 102_608]
  output:
    # 42 U.S.C. 8624(b)(2)(B) bars excluding a household on income below 110%
    # of the poverty guideline. PY2026 uses the 2025 guidelines (LIHEAP IM
    # 2025-02): 15,650 + 5,500 x 15 = 98,150 for 16 people, and 110% is
    # 107,965. The 60% SMI limit for 16 people is 104,543.
    # Household 1 is at the 60% SMI limit: eligible.
    # Household 2 is one cent below the floor: eligible.
    # Household 3 is exactly at the floor, which is not below 110%: not eligible.
    # Household 4 is above the floor: not eligible.
    # Household 5 has 15 people, whose 102,607 limit exceeds the 101,915 floor
    # (110% of 92,650), so the limit still applies: not eligible.
    in_eap_eligible: [true, true, false, false, false]
- name: Case 7, the floor uses the poverty guidelines from the year before the model year.
  period: 2026
  input:
    state_code: IN
    age: 40
    in_eap_household_size: 16
    in_eap_income: 110_000
  output:
    # PY2026 uses the 2025 guidelines, so the floor is 107,965. The 2026
    # guidelines would give 110% x (15,960 + 5,680 x 15) = 111,276.
    in_eap_eligible: false
- name: Case 8, PY2025 uses the 2024 poverty guidelines for the floor.
  period: 2025
  input:
    state_code: [IN, IN]
    age: [40, 40]
    in_eap_household_size: [15, 15]
    in_eap_income: [99_417.99, 99_418]
  output:
    # LIHEAP IM 2024-02 makes the 2024 guidelines mandatory in FY2025:
    # 110% x (15,060 + 5,380 x 14) = 99,418 for 15 people, above the 98,571
    # PY2025 60% SMI limit.
    in_eap_eligible: [true, false]
