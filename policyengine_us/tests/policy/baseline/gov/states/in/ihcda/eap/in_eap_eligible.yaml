- name: Farm operations income puts a farm couple over the income limit
  # Section 6.1 (pages 51-52) defines self-employment to include farming (Schedule F).
  # Income: $58,000 farm operations + $16,640 wages ($16.00 x 1,040 hours) = $74,640.
  # Size 2 SMI: floor($107,555 x 0.68) = $73,137; 60% limit floor($43,882.20) = $43,882.
  # $74,640 > $43,882, so the household is ineligible and receives $0. The wages alone
  # ($16,640) would be within the limit.
  period: 2026
  input:
    people:
      person1:
        age: 52
        farm_operations_income: 58_000
      person2:
        age: 50
        employment_income: 16_640
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: PROPANE
        bottled_gas_expense: 2_400
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_eap_household_size: 2
    in_eap_smi: 73_137
    in_eap_income: 74_640
    in_eap_eligible: false
    in_eap: 0
