- name: Case 12, other fuel reads the other heating fuel bill for bulk-fuel points and kerosene earns no heating award.
  # Wages: $7.25 x 2,080 hours = $15,080. Three-month income $15,080 x 3 / 12 = $3,770
  # is within the size 1 band 1 ceiling floor($55,928 x 0.30 x 3 / 12) = $4,194:
  # 9 income points and the $125 electric payment. Single-family dwelling: 3 points.
  # Household 1, OTHER with a $900 other-fuel bill (Section 8.5, page 71: pellets, corn
  # and biofuels are 6-point bulk fuels): (9 + 3 + 6) x $25 + $125 = $575.
  # Household 2, OTHER with the bill reported only as wood: heating_expense reads
  # other_heating_fuel_expense for OTHER, so there is no heating bill: $125 only.
  # Household 3, KEROSENE with a $1,400 fuel bill (Section 1.1, page 10): zero fuel
  # points, so no heating award: $125 only.
  period: 2026
  input:
    state_code: [IN, IN, IN]
    age: [40, 40, 40]
    employment_income: [15_080, 15_080, 15_080]
    heating_type: [OTHER, OTHER, KEROSENE]
    other_heating_fuel_expense: [900, 0, 0]
    wood_expense: [0, 900, 0]
    fuel_oil_expense: [0, 0, 1_400]
    pre_subsidy_electricity_expense: [1_200, 1_200, 1_200]
  output:
    heating_expense: [900, 0, 1_400]
    in_eap_income: [15_080, 15_080, 15_080]
    in_eap: [575, 125, 125]

- name: Case 13, all utilities in rent through the tenant flag alone pays both benefits.
  # Section 4.7 (page 33): a tenant who pays all utilities in rent receives both
  # benefits. tenant_pays_utilities: false, with the heat flag omitted, places heat
  # and electricity in rent: 2 income points regardless of income (here $12,000, a
  # band 1 income), no dwelling or fuel points, and the $50 electric-in-rent payment.
  # Household 1: 2 x $25 + $50 = $100.
  # Household 2, age 60: (2 + 2 vulnerability) x $25 + $50 = $150.
  # Household 3, $11 a year in rent, below $1 a month ($12 a year): $0.
  # Household 4, gas and electric bills also reported: the bills earn no matrix
  # heating points once heat is in rent, so 2 x $25 + $50 = $100.
  period: 2026
  input:
    state_code: [IN, IN, IN, IN]
    age: [40, 60, 40, 40]
    rent: [9_600, 9_600, 11, 9_600]
    in_eap_eligible: [true, true, true, true]
    in_eap_income: [12_000, 12_000, 12_000, 12_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    tenant_pays_utilities: [false, false, false, false]
    gas_expense: [0, 0, 0, 1_000]
    pre_subsidy_electricity_expense: [0, 0, 0, 1_000]
  output:
    in_eap: [100, 150, 0, 100]

- name: Case 14, size 11 income bands follow the federal adjustment beyond the printed chart.
  # Section 8.3 (page 69) prints the charts through size 10 and refers larger
  # households to the calculation methodology. 45 CFR 96.85 adds 3% of the four-person
  # state median income for each member beyond six, so size 11 uses 52% + 5 x 16% +
  # 5 x 3% = 147%: floor($107,555 x 1.47) = $158,105. The same method at 144% gives
  # the printed size 10 three-month ceilings of $11,615 and $17,423 (page 70).
  # Band 1 three-month ceiling: floor($158,105 x 0.30 x 3 / 12) = $11,857, so annual
  # income of $47,428 ($11,857 x 4) is in band 1 and $47,432 ($11,858 x 4) in band 2.
  # Band 2 three-month ceiling: floor($158,105 x 0.45 x 3 / 12) = $17,786, so annual
  # income of $71,144 ($17,786 x 4) is in band 2 and $71,148 ($17,787 x 4) in band 3.
  # Natural gas, single-family (pages 69-72): band 1 (9 + 3 + 1) x $25 + $125 = $450;
  # band 2 (5 + 3 + 1) x $25 + $100 = $325; band 3 (2 + 3 + 1) x $25 + $50 = $200.
  period: 2026
  input:
    state_code: [IN, IN, IN, IN]
    age: [40, 40, 40, 40]
    in_eap_eligible: [true, true, true, true]
    in_eap_household_size: [11, 11, 11, 11]
    in_eap_income: [47_428, 47_432, 71_144, 71_148]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_000, 1_000, 1_000, 1_000]
    pre_subsidy_electricity_expense: [1_000, 1_000, 1_000, 1_000]
  output:
    in_eap_smi: [158_105, 158_105, 158_105, 158_105]
    in_eap: [450, 325, 325, 200]

- name: Case 15, SSDI or reported SSI receipt alone makes a household vulnerable and a disability flag alone does not.
  # Section 3.4 (page 26) treats a member as a person with a disability when they
  # receive SSI, SSDI or another listed benefit. A disability reported without one of
  # those benefits needs a doctor's statement and a pending SSA claim, which the model
  # cannot identify. Section 8.6 (page 72) awards 2 points for a vulnerable member.
  # No household receives an SSI payment in the model or Medicaid.
  # Household 1, SSDI of $1,200 x 12 = $14,400: three-month income $3,600 is within the
  # size 1 band 1 ceiling of $4,194 (page 69): (9 + 3 + 6 + 2) x $25 + $125 = $625.
  # Household 2, reports SSI receipt, wages $12.00 x 780 hours = $9,360 (three-month
  # income $2,340, band 1): (9 + 3 + 6 + 2) x $25 + $125 = $625.
  # Household 3, disabled with no SSI, SSDI or Medicaid, wages $7.25 x 2,080 hours =
  # $15,080 (three-month income $3,770, band 1): (9 + 3 + 6) x $25 + $125 = $575.
  period: 2026
  input:
    state_code: [IN, IN, IN]
    age: [40, 40, 40]
    ssi: [0, 0, 0]
    social_security_disability: [14_400, 0, 0]
    receives_ssi: [false, true, false]
    is_disabled: [false, false, true]
    receives_medicaid: [false, false, false]
    employment_income: [0, 9_360, 15_080]
    heating_type: [PROPANE, PROPANE, PROPANE]
    bottled_gas_expense: [1_800, 1_800, 1_800]
    pre_subsidy_electricity_expense: [1_200, 1_200, 1_200]
  output:
    in_eap_income: [14_400, 9_360, 15_080]
    in_eap: [625, 625, 575]

- name: Case 16, heat in rent with separately billed electricity and rent under one dollar a month pays only the electric benefit.
  # Section 4.7 (page 32): a client with utilities included in rent must pay at least
  # $1 a month in rent to receive that benefit. Page 33: when heat is in rent and the
  # tenant pays the electric bill directly, the electric benefit goes to the vendor.
  # Wages: $7.25 x 2,080 hours = $15,080. Three-month income $3,770 is within the size 1
  # band 1 ceiling of $4,194 (page 69), so the electric payment is $125 (page 72).
  # Households 1 and 2, rent of $0 and $11 a year, below $12: no heating award, $125.
  # Household 3, rent of $12 a year: heat in rent earns 2 income points (page 69) and
  # no dwelling or fuel points: 2 x $25 + $125 = $175.
  period: 2026
  input:
    state_code: [IN, IN, IN]
    age: [40, 40, 40]
    employment_income: [15_080, 15_080, 15_080]
    rent: [0, 11, 12]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heat_expense_included_in_rent: [true, true, true]
    pre_subsidy_electricity_expense: [1_200, 1_200, 1_200]
  output:
    in_eap_income: [15_080, 15_080, 15_080]
    in_eap: [125, 125, 175]
