- name: Reported Medicare premium and support paid reduce income, while TANF, support received and capital gains
    are excluded
  period: 2_026
  input:
    state_code: IN
    age: 40
    ssi: 1_200
    social_security: 12_000
    receives_ssi: false
    receives_medicaid: false
    rent: 0
    employment_income: 12_000
    medicare_part_b_premiums_reported: 2_400
    child_support_expense: 2_400
    child_support_received: 4_000
    tanf: 4_000
    long_term_capital_gains: 4_000
  output:
    in_eap_income: 20_400
- name: Immigration excludes an adult from size but counts earnings, and child SSA counts despite excluded child
    wages
  period: 2_026
  input:
    people:
      adult:
        age: 35
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
        ssi: 0
        social_security: 0
      child:
        age: 10
        employment_income: 6_000
        social_security: 2_400
        ssi: 1_200
    spm_units:
      unit:
        members: [adult, child]
    households:
      home:
        members: [adult, child]
        state_code: IN
  output:
    in_eap_household_size: 1
    in_eap_income: 15_600
    in_eap_eligible: true
