- name: Existing net business income remains an approximation without a new business deduction
  period: 2_026
  input:
    state_code: IN
    age: 40
    ssi: 0
    social_security: 0
    receives_ssi: false
    receives_medicaid: false
    rent: 0
    employment_income: 12_000
    self_employment_income: 6_000
    sstb_self_employment_income: 3_000
  output:
    # 12,000 wages + 6,000 ordinary business + 3,000 specified service business.
    in_eap_income: 21_000
