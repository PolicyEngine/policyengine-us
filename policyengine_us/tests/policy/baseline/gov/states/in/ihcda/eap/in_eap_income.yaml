- name: Case 1, existing net business income remains an approximation without a new business deduction.
  period: 2026
  input:
    state_code: IN
    age: 40
    ssi: 0
    social_security: 0
    receives_ssi: false
    receives_medicaid: false
    rent: 0
    employment_income: 12_000
    self_employment_income: 6_000
    sstb_self_employment_income: 3_000
  output:
    # 12,000 wages + 6,000 ordinary business + 3,000 specified service business.
    in_eap_income: 21_000
- name: Case 2, adult dependent secondary and college student exemptions do not extend past age 23 for college.
  period: 2026
  input:
    state_code: [IN, IN, IN, IN]
    age: [18, 23, 24, 23]
    ssi: [0, 0, 0, 0]
    social_security: [0, 0, 0, 0]
    receives_ssi: [false, false, false, false]
    receives_medicaid: [false, false, false, false]
    rent: [0, 0, 0, 0]
    is_tax_unit_dependent: [true, true, true, false]
    is_in_secondary_school: [true, false, false, false]
    is_full_time_college_student: [false, true, true, true]
    employment_income: [12_000, 12_000, 12_000, 12_000]
    sstb_self_employment_income: [3_000, 3_000, 3_000, 3_000]
    interest_income: [1_000, 1_000, 1_000, 1_000]
  output:
    in_eap_income: [0, 0, 16_000, 16_000]
- name: Case 3, support paid reduces income while TANF, support received and capital gains are excluded.
  period: 2026
  input:
    state_code: IN
    age: 40
    ssi: 1_200
    social_security: 12_000
    receives_ssi: false
    receives_medicaid: false
    rent: 0
    employment_income: 12_000
    child_support_expense: 2_400
    child_support_received: 4_000
    tanf: 4_000
    long_term_capital_gains: 4_000
  output:
    # 12_000 wages + 12_000 Social Security (a 40-year-old is not enrolled in
    # Medicare, so no premium is deducted) + 1_200 SSI - 2_400 support paid =
    # 22_800.
    in_eap_income: 22_800
- name: Case 4, immigration excludes an adult from size but counts earnings and child Social Security counts despite excluded child wages.
  period: 2026
  input:
    people:
      person1:
        age: 35
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
        ssi: 0
        social_security: 0
      person2:
        age: 10
        employment_income: 6_000
        social_security: 2_400
        ssi: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: UNSPECIFIED
    households:
      household:
        members: [person1, person2]
        state_code: IN
  output:
    in_eap_household_size: 1
    in_eap_income: 15_600
    in_eap_eligible: true

- name: Case 5, farm, partnership and S corporation, estate, farm rental, strike and pension income count.
  # Section 6.1 (pages 51-52, 54, 56): Schedule F farm income, Schedule E partnership
  # and S corporation, estate and trust, and farm rental lines, strike benefits and
  # pensions count. One counted adult per household, one source each:
  # farm operations $21,000; partnership $9,000 + S corporation $6,000 = $15,000;
  # estate $4,800; farm rent $7,200; strike benefits $2,400; a military pension of
  # $18,000, reported in military_retirement_pay.
  period: 2026
  input:
    state_code: [IN, IN, IN, IN, IN, IN]
    age: [45, 45, 45, 45, 45, 45]
    farm_operations_income: [21_000, 0, 0, 0, 0, 0]
    partnership_income: [0, 9_000, 0, 0, 0, 0]
    s_corp_income: [0, 6_000, 0, 0, 0, 0]
    estate_income: [0, 0, 4_800, 0, 0, 0]
    farm_rent_income: [0, 0, 0, 7_200, 0, 0]
    strike_benefits: [0, 0, 0, 0, 2_400, 0]
    military_retirement_pay: [0, 0, 0, 0, 0, 18_000]
  output:
    in_eap_income: [21_000, 15_000, 4_800, 7_200, 2_400, 18_000]

- name: Case 6, each income source is floored at zero so a business, rental or farm loss does not offset wages.
  # Section 6.1 (pages 51-52) counts gross business income before expenses, so a net
  # loss in one source cannot reduce other income. Wages: $14.00 x 2,080 hours = $29,120.
  # Household 1: max($29,120, 0) + max(-$15,000 self-employment, 0) = $29,120.
  # Household 2: max($29,120, 0) + max(-$6,000 rental, 0) = $29,120.
  # Household 3: max($29,120, 0) + max(-$9,000 farm operations, 0) = $29,120.
  # Each also has a $2,000 specified service business loss, floored at zero.
  # $29,120 is within the size 1 limit of $33,556. Three-month income $29,120 x 3 / 12
  # = $7,280 exceeds the band 2 ceiling floor($55,928 x 0.45 x 3 / 12) = $6,291: band 3.
  # Natural gas, single-family: (2 + 3 + 1) x $25 + $50 electric = $200.
  period: 2026
  input:
    state_code: [IN, IN, IN]
    age: [40, 40, 40]
    employment_income: [29_120, 29_120, 29_120]
    self_employment_income: [-15_000, 0, 0]
    sstb_self_employment_income: [-2_000, -2_000, -2_000]
    rental_income: [0, -6_000, 0]
    farm_operations_income: [0, 0, -9_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_100, 1_100, 1_100]
    pre_subsidy_electricity_expense: [1_300, 1_300, 1_300]
  output:
    in_eap_income: [29_120, 29_120, 29_120]
    in_eap_eligible: [true, true, true]
    in_eap: [200, 200, 200]

- name: Case 7, service business profits above the income limit prevent a heating award.
  # Section 6.1 counts business income; a specified service business is not
  # exempt. Existing net profits remain the documented gross-income approximation.
  period: 2026
  input:
    state_code: IN
    age: 40
    sstb_self_employment_income: 60_000
    ssi: 0
    social_security: 0
    receives_ssi: false
    receives_medicaid: false
    heating_type: NATURAL_GAS
    gas_expense: 1_000
    pre_subsidy_electricity_expense: 1_000
  output:
    in_eap_income: 60_000
    # Above the published one-person annual limit of 33,556.
    in_eap_eligible: false
    in_eap: 0

- name: Case 8, survivor benefits other than Social Security count as income.
  # Section 6.1 (page 54) counts life insurance payments issued on a regular basis to
  # a surviving household member and retirement funds paid to a surviving spouse, and
  # page 53 counts Black Lung benefits awarded to a survivor.
  # A widow receives a $900 monthly survivor annuity from her late husband's pension
  # ($900 x 12 = $10,800) and earns $12.00 x 780 hours = $9,360.
  # Income: $10,800 + $9,360 = $20,160.
  period: 2026
  input:
    state_code: IN
    age: 58
    survivor_benefits: 10_800
    employment_income: 9_360
  output:
    in_eap_income: 20_160

- name: Case 9, the Medicare Part B premium is deducted from Social Security only when the person pays it.
  # Section 6.1 (page 55) counts the net Social Security check after the Part B
  # deduction. The 2026 standard premium is $202.90 x 12 = $2,434.80.
  # Household 1: age 70, $12,000 of Social Security; countable income of
  # $1,000 - $20 a month is under 135% of the poverty guideline, so a Medicare
  # Savings Program covers the premium and the full $12,000 is counted.
  # Household 2: age 70, $2,000 of Social Security and a $24,000 private pension;
  # the premium is paid and exceeds the benefit, which is floored at zero:
  # $0 + $24,000.
  # Household 3: age 40 with $12,000 of Social Security disability and no
  # Medicare enrollment: no premium, $12,000.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [IN, IN, IN]
    age: [70, 70, 40]
    social_security_retirement: [12_000, 2_000, 0]
    social_security_disability: [0, 0, 12_000]
    taxable_private_pension_income: [0, 24_000, 0]
    ssi: [0, 0, 0]
  output:
    medicare_part_b_premium: [0, 2_434.8, 0]
    in_eap_income: [12_000, 24_000, 12_000]
