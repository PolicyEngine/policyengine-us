# GA CAPS income limits by date.
# DECAL's letters date each change. A monthly variable reads the parameter at the first day of
# the month, so a change after the first applies from the next month.

- name: September 2019, 50 percent for four, at the limit.
  period: 2019-09
  input:
    people:
      person1:
        age:
          2019: 30
      person2:
        age:
          2019: 5
      person3:
        age:
          2019: 5
      person4:
        age:
          2019: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        ga_caps_countable_income: 3_050
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code:
          2019: GA
  output:
    # DECAL webinar, September 24, 2019: $36,601 for four before October 2019.
    ga_caps_income_eligible: true

