# Court-supervision route for ga_caps_eligible_child (Policy Manual 6.4.1,
# p.29): a child under court-ordered supervision is age-eligible through 17.
# Court status does not waive income, activity, or immigration requirements.
- name: Case 1, court supervision extends the age limit through 17.
  period: 2026-01
  input:
    state_code: [GA, GA, GA, GA, GA, GA]
    age: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision: [true, true, true, true, true, true]
  output:
    ga_caps_eligible_child: [true, true, true, false, false, false]

- name: Case 2, court supervision does not bypass the immigration requirement.
  period: 2026-01
  input:
    state_code: GA
    age: 17
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
  output:
    ga_caps_eligible_child: false

# $12,000 annual income at 50-100% FPG: floor(12,000 * 5% / 52) = $11/week.
# Monthly fee = 11 * 52/12 = $47.67; $100 expenses - $47.67 = $52.33.
- name: Case 3, supervised 17-year-old receives ordinary reimbursement net of the five-percent family fee.
  period: 2026-01
  absolute_error_margin: 0.02
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
        weekly_hours_worked_before_lsr: 25
      person2:
        age: 17
        is_tax_unit_dependent: true
        is_in_k12_school: true
        childcare_hours_per_week: 30
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        childcare_attending_days_per_month: 20
        pre_subsidy_childcare_expenses: 1_200
        is_under_court_supervision: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: GA
        county_str: FULTON_COUNTY_GA
  output:
    ga_caps_eligible_child: [false, true]
    ga_caps_eligible: true
    ga_caps_family_fee: 47.666667
    ga_caps: 52.333333

