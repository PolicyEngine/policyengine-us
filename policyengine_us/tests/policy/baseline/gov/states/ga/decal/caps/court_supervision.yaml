- name: GA sibling supervision does not inherit another child care order
  period: 2026-09
  input:
    people:
      parent:
        age:
          2026: 35
        is_under_court_supervision:
          2026: true
      qualifying:
        age:
          2026: 17
        requires_childcare_under_court_order:
          2026: true
      sibling:
        age:
          2026: 17
        is_under_court_supervision:
          2026: true
    spm_units:
      spm_unit:
        members: &id001 [parent, qualifying, sibling]
    households:
      household:
        members: *id001
        state_code:
          2026: GA
  output:
    ga_caps_eligible_child: [false, true, false]
