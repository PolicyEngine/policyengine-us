# GA CAPS priority groups (CAPS/00-7).
# New applicants must belong to one. The very low income group tests income against a dated
# share of the poverty guideline.

- name: Family with income over the very low income limit and no group.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
      person3:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ga_caps_countable_income: 3_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: GA
  output:
    ga_caps_priority_group_eligible: false

