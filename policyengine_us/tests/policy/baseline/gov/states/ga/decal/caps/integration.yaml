- name: Case 8, large family of 6 at income threshold boundary.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        weekly_hours_worked_before_lsr: 40
        employment_income: 58_469
        immigration_status: CITIZEN
      person2:
        age: 38
        weekly_hours_worked_before_lsr: 40
        immigration_status: CITIZEN
      person3:
        age: 10

        immigration_status: CITIZEN
        ga_caps_provider_type: CENTER
        ga_caps_care_type: BEFORE_AFTER_SCHOOL
        ga_caps_quality_rating: NONE
      person4:
        age: 3

        immigration_status: CITIZEN
        ga_caps_provider_type: FAMILY
        ga_caps_care_type: FULL_TIME
        ga_caps_quality_rating: TWO_STAR
      person5:
        age: 0

        immigration_status: CITIZEN
        ga_caps_provider_type: CENTER
        ga_caps_care_type: FULL_TIME
        ga_caps_quality_rating: TWO_STAR
      person6:
        age: 14

        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5, person6]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6]
        ga_caps_priority_group_eligible: true
        spm_unit_pre_subsidy_childcare_expenses: 20_000
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: GA
        county_str: COBB_COUNTY_GA
  output:
    # === Eligibility ===
    # person3 (10): age < 13 -> eligible
    # person4 (3): age < 13 -> eligible
    # person5 (0): age < 13 -> eligible
    # person6 (14): age >= 13, not disabled -> ineligible
    ga_caps_eligible_child: [false, false, true, true, true, false]

    # 40% SMI family of 6 = 110,736 * 1.32 * 0.4, rounded up = $58,469
    # income 58,469 <= 58,469 -> eligible
    ga_caps_income_eligible: true
    ga_caps_eligible: true

    # === Zone and rates ===
    # Cobb County -> Zone 1
    ga_caps_zone: ZONE_1
    # person3 (10): SCHOOL_AGE, Zone 1 Center B/A School = $84/week
    # person4 (3): PRESCHOOL, Zone 1 Family FT = $180/week
    # person5 (0): INFANT, Zone 1 Center FT = $260/week
    ga_caps_age_group: [PRESCHOOL, PRESCHOOL, SCHOOL_AGE, PRESCHOOL, INFANT, PRESCHOOL]
    ga_caps_maximum_weekly_benefit: [0, 0, 84, 180, 260, 0]

    # === Family fee ===
    # FPG family of 6: $44,360
    # FPL ratio = 58,469 / 44,360 = 1.318 -> 7% rate
    # weekly fee = floor(58,469 * 0.07 / 52) = floor(78.71) = $78
    # monthly fee = 78 * 52 / 12 = $338.00
    ga_caps_family_fee: 338

    # === Benefit ===
    # sum_max_weekly = 84 + 180 + 260 = $524
    # sum_max_monthly = $524 * 52/12 = $2,270.67
    # expenses_monthly = 20,000 / 12 = $1,666.67
    # base = min($1,666.67, $2,270.67) = $1,666.67
    # net_base = max($1,666.67 - $338.00, 0) = $1,328.67
    # weighted_bonus_rate = (84*0 + 180*0.05 + 260*0.05) / 524 = 0.04198
    # subsidy = $1,328.67 * 1.04198 = $1,384.45
    ga_caps: 1_384.45

