    # monthly fee = 19 * 52 / 12 = $82.33
    ga_caps_family_fee: 82.33
    # pre_subsidy_weekly = 5,000 / 52 = $96.15
    # per_child = min($94, $96.15) = $94
    # base_monthly = $94 * 52/12 = $407.33
    # net_base = max($407.33 - $82.33, 0) = $325.00
    # weighted_bonus_rate = ($94 * 0.05) / $94 = 0.05
    # subsidy = $325.00 * 1.05 = $341.25
    ga_caps: 341.25

