    # monthly fee = 67 * 52 / 12 = $290.33
    ga_caps_family_fee: 290.33

    # === Benefit ===
    # pre_subsidy_weekly = 15,000 / 52 = $288.46
    # per_child = min($248, $288.46) = $248
    # base_monthly = $248 * 52/12 = $1,074.67
    # net_base = max($1,074.67 - $290.33, 0) = $784.33
