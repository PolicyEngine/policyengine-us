        age: 30
        weekly_hours_worked_before_lsr: 40
        immigration_status: CITIZEN
      person2:
        age: 2
        immigration_status: CITIZEN
      person3:
        age: 4
        immigration_status: CITIZEN
        ga_caps_pre_k_enrolled: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ga_caps_countable_income: 3_333.33
    households:
      household:
        members: [person1, person2, person3]
        state_code: GA
  output:
    ga_caps_income_eligible: false
    ga_caps_priority_group_eligible: true
    ga_caps_eligible: false

