- name: DFCS custody waives the income and activity requirements.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 0
        immigration_status: CITIZEN
      person2:
        age: 2
        immigration_status: CITIZEN
        is_in_foster_care: true
      person3:
        age: 4
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ga_caps_countable_income: 9_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: GA
  output:
    # CAPS/00-7, 7.5: foster parents need not meet income or activity requirements.
    ga_caps_income_eligible: true
    ga_caps_activity_eligible: true
    ga_caps_priority_group_eligible: true
    ga_caps_eligible: true

