# GA CAPS eligibility with the priority group requirement.

- name: New family earning $40,000 meets the October 2026 income limit but has no priority group.
  period: 2026-10
  input:
    people:
      person1:
        age:
          2026: 30
        weekly_hours_worked_before_lsr:
          2026: 40
        immigration_status:
          2026: CITIZEN
      person2:
        age:
          2026: 2
        immigration_status:
          2026: CITIZEN
      person3:
        age:
          2026: 4
        immigration_status:
          2026: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ga_caps_countable_income: 3_333.33
    households:
      household:
        members: [person1, person2, person3]
        state_code:
          2026: GA
  output:
    # CAPS/00-7, 7.3.1: new applicants outside a priority group are denied.
    ga_caps_income_eligible: true
    ga_caps_priority_group_eligible: false
    ga_caps_eligible: false

