        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code:
          2026: GA
  output:
    # CAPS/00-7, 7.3.1.3: no priority group at annual redetermination.
    ga_caps_priority_group_eligible: false
    ga_caps_eligible: true

