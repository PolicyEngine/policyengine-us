# GA CAPS income eligibility
# Initial (not enrolled) in January 2026: income <= 40% SMI, rounded up
# Ongoing (enrolled): income <= 85% SMI, rounded up
#
# GA SMI for 4-person household at 2026-01 (2025-10-01 entry): $110,736
# Family of 2: 110,736 * 0.68 = $75,300.48
#   40% SMI = $30,120.19 -> $30,121
#   85% SMI = $64,005.41 -> $64,006

- name: Case 1, new applicant income below 40 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 30_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # income 30,000 <= 30,121 (40% SMI for family of 2) -> eligible
    ga_caps_income_eligible: true

- name: Case 2, new applicant income above 40 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # income 40,000 > 30,121 (40% SMI for family of 2) -> ineligible
    ga_caps_income_eligible: false

- name: Case 3, enrolled family income between 40 and 85 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 50_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # enrolled: income 50,000 <= 64,006 (85% SMI) -> eligible
    ga_caps_income_eligible: true

- name: Case 4, enrolled family income above 85 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 68_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # enrolled: income 68,000 > 64,006 (85% SMI) -> ineligible
    ga_caps_income_eligible: false

- name: Case 5, non-enrolled family between 40 and 85 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 50_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_caps_enrolled: false
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # not enrolled: income 50,000 > 30,121 (40% SMI) -> ineligible
    ga_caps_income_eligible: false

- name: Case 6, zero income family is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    ga_caps_income_eligible: true

# Additional family sizes for boundary tests:
# Family of 3: 110,736 * 0.84 = $93,018.24
#   40% SMI -> $37,208; 85% SMI -> $79,066
# Family of 5: 110,736 * 1.16 = $128,453.76
#   40% SMI -> $51,382; 85% SMI -> $109,186

- name: Case 7, income exactly at 40 percent SMI threshold for family of 2.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        # 40% SMI for family of 2 rounds up to $30,121/yr
        employment_income: 30_121
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # income 30,121 <= 30,121 -> eligible (at threshold)
    ga_caps_income_eligible: true

- name: Case 8, income one dollar above 40 percent SMI threshold.
  period: 2026-01
  input:
