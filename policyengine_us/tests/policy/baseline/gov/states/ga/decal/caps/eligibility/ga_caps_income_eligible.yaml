      person1:
        age: 30
        employment_income: 30_122
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # income 30,122 > 30,121 -> ineligible
    ga_caps_income_eligible: false

- name: Case 9, enrolled income exactly at 85 percent SMI threshold.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 64_006
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # enrolled: income 64,006 <= 64,006 -> eligible
    ga_caps_income_eligible: true

- name: Case 10, enrolled income one dollar above 85 percent SMI.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 64_007
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # enrolled: income 64,007 > 64,006 -> ineligible
    ga_caps_income_eligible: false

- name: Case 11, very high income family ineligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 200_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    ga_caps_income_eligible: false

- name: Case 12, larger family of 5 at 40 percent SMI threshold.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 51_382
      person2:
        age: 30
      person3:
        age: 10
      person4:
        age: 7
      person5:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: GA
  output:
    # 40% SMI family of 5 rounds up to $51,382
    # income 51,382 <= 51,382 -> eligible
    ga_caps_income_eligible: true

- name: Case 13, larger family of 5 one dollar over threshold.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income: 51_383
      person2:
        age: 30
      person3:
        age: 10
      person4:
        age: 7
      person5:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: GA
  output:
    # 40% SMI family of 5 rounds up to $51,382
    # income 51,383 > 51,382 -> ineligible
    ga_caps_income_eligible: false

- name: Case 14, enrolled family of 3 at ongoing threshold.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 79_066
      person2:
        age: 28
      person3:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ga_caps_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: GA
  output:
    # 85% SMI family of 3 rounds up to $79,066
    # enrolled: income 79,066 <= 79,066 -> eligible
    ga_caps_income_eligible: true

- name: Case 15, multiple income sources combined.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        employment_income: 20_000
        self_employment_income: 10_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    # total income = 20,000 + 10,000 = 30,000 <= 30,121 -> eligible
    ga_caps_income_eligible: true

