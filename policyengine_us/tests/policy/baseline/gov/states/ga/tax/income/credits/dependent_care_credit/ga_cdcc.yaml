- name: GA cdcc unit test 1
  period: 2021
  input:
    cdcc: 1000
    state_code: GA
    ga_income_tax_before_non_refundable_credits: 1000000
  output:
    ga_cdcc: 300
- name: GA cdcc unit test 2
  period: 2007
  input:
    cdcc: 1000
    state_code: GA
    ga_income_tax_before_non_refundable_credits: 1000000
  output:
    ga_cdcc: 200
- name: GA cdcc unit test 2
  period: 2007
  input:
    cdcc: 0
    state_code: GA
    ga_income_tax_before_non_refundable_credits: 1000000
  output:
    ga_cdcc: 0


- name: 2025 single filer who can be claimed as a dependent, no Georgia child care credit for a child under 13
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 50_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [filer, child]
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [filer, child]
        state_code: GA
  output:
    # Already zero through the federal credit claimed and allowed.
    ga_cdcc_potential: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no Georgia child care credit for a child under 13 (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 25_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 25_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: GA
  output:
    ga_cdcc_potential: 0

