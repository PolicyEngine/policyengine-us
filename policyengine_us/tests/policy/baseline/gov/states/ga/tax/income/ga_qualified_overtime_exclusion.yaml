- name: A full-time salaried employee gets no exclusion for overtime
  period: 2026
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        employment_income: 50_000
        fsla_overtime_premium: 1_000
        is_paid_hourly: false
        weekly_hours_worked_before_lsr: 45
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: GA
  output:
    # Salaried non-exempt pay can be qualified overtime compensation under
    # IRC § 225, but (16)(A) reaches only an employee "paid by an hourly wage".
    ga_qualified_overtime_exclusion: 0

