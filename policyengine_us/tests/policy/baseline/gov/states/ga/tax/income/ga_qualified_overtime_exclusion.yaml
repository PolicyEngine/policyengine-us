        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: GA
  output:
    # (16)(B) replaces the compensation that counts. "Full-time employee paid
    # by an hourly wage" stays. The DOR's guide, p. 22, places the Railway
    # Labor Act rule inside that description.
    ga_qualified_overtime_exclusion: 0

