- name: Railway Labor Act overtime counts up to the cap
  period: 2026
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        employment_income: 80_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
        ga_rla_hourly_component_overtime: 3_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: GA
  output:
    # O.C.G.A. § 48-7-27(a)(16)(B). The DOR's 2026 Employer's Withholding Tax
    # Guide, p. 4, has employers report the full amount in W-2 Box 14a, code
    # GA OT, and applies "the $1,750 limitation" when the employee files.
    ga_qualified_overtime_exclusion: 1_750
    ga_subtractions: 1_750
    ga_agi: 78_250

- name: Part-time Railway Labor Act overtime gets no exclusion
