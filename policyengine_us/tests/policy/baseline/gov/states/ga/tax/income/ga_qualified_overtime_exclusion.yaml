- name: A dependent's overtime does not reduce the filer's Georgia AGI
  period: 2026
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head: true
        employment_income: 60_000
      teen:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 8_000
        fsla_overtime_premium: 1_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
    tax_units:
      tax_unit:
        members: [parent, teen]
    households:
      household:
        members: [parent, teen]
        state_code: GA
  output:
    # O.C.G.A. § 48-7-27(a) subtracts the exclusion from the taxpayer's
    # federal AGI. The teen's overtime is the teen's own income (26 U.S.C.
    # 73(a)) and is not in the parent's AGI.
    ga_qualified_overtime_exclusion: 0
    ga_subtractions: 0
    ga_agi: 60_000

- name: A dependent's overtime does not count when the model infers the dependent
  period: 2026
  input:
    people:
      parent:
        age: 45
        employment_income: 60_000
      teen:
        age: 17
        employment_income: 8_000
        fsla_overtime_premium: 1_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
    tax_units:
      tax_unit:
        members: [parent, teen]
    households:
      household:
        members: [parent, teen]
        state_code: GA
  output:
    ga_qualified_overtime_exclusion: 0

- name: On a joint return only the spouses' own overtime counts, each capped
  period: 2026
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        employment_income: 40_000
        fsla_overtime_premium: 3_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
      spouse:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 40_000
        fsla_overtime_premium: 1_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
      teen:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 8_000
        fsla_overtime_premium: 2_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 40
    tax_units:
      tax_unit:
        members: [head, spouse, teen]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse, teen]
        state_code: GA
  output:
    # Head: min(3,000, 1,750) = 1,750. Spouse: 1,000. Teen: none.
    ga_qualified_overtime_exclusion: 2_750

