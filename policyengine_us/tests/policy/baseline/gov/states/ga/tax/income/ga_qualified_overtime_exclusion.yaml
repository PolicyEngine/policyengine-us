- name: A full-time hourly employee at the 35-hour threshold keeps the exclusion
  period: 2026
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        employment_income: 50_000
        fsla_overtime_premium: 1_000
        is_paid_hourly: true
        weekly_hours_worked_before_lsr: 35
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: GA
  output:
    # O.C.G.A. § 48-7-27(a)(16)(A): "a full-time employee paid by an hourly
    # wage". Chapter 7's credits set full-time at "a minimum of 35 hours a
    # week" (§ 48-7-40(a)(5)).
    ga_qualified_overtime_exclusion: 1_000
    ga_subtractions: 1_000
    ga_agi: 49_000

