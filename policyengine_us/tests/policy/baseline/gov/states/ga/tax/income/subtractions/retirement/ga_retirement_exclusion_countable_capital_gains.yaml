- name: A dependent's capital loss does not reduce an eligible filer's gains
  # IT-511 instructions: "Income or losses should be allocated to the person
  # who owns the item"; the child's loss is on the child's own return.
  period: 2024
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 63
        employment_income: 20_000
        long_term_capital_gains: 5_000
      child:
        age: 15
        short_term_capital_gains: -10_000
    household:
      state_code: GA
  output:
    ga_retirement_exclusion_countable_capital_gains: [5_000, 0]
