- name: 2025 single filer who can be claimed as a dependent, no low income credit
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: GA
  output:
    # O.C.G.A. 48-7A-3 and IT-511 Line 17: only a taxpayer who is not
    # claimed or eligible to be claimed as a dependent; the joint
    # return is barred when either spouse can be claimed.
    ga_low_income_credit_potential: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no low income credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2_500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 2_500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: GA
  output:
    ga_low_income_credit_potential: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no low income credit (the claimable spouse is the spouse)
