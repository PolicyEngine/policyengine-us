# 2025 IT-511, Form 500 line 25: "if the credit option is used, the calculated
# credit may be included on the 'Georgia Income Tax Withheld' line ... the
# taxpayer does not get a credit for the entire amount repaid, only the
# reduced tax from the prior year computed as if they did not receive the
# income in the prior year." Under the deduction option "no adjustment is
# necessary on the Georgia return since that flows to the Georgia return."
- name: Case 1, the credit is the prior-year Georgia tax decrease under the credit option.
  # A $10,000 repayment of income taxed at Georgia's 2024 rate of 5.39%.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ga_claim_of_right_prior_year_tax_decrease: 539
    state_code: GA
  output:
    ga_claim_of_right_credit: 539

- name: Case 2, no credit under the deduction option.
  period: 2025
  input:
    claim_of_right_credit_applies: false
    ga_claim_of_right_prior_year_tax_decrease: 539
    state_code: GA
  output:
    ga_claim_of_right_credit: 0

- name: Case 3, the credit counts as a payment, so an excess over the tax is refunded.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ga_claim_of_right_prior_year_tax_decrease: 539
    ga_income_tax_before_refundable_credits: 400
    state_code: GA
  output:
    ga_refundable_credits: 539
    ga_income_tax: -139

- name: Case 4, the first year Georgia's instructions state the credit.
  period: 2024
  input:
    claim_of_right_credit_applies: true
    ga_claim_of_right_prior_year_tax_decrease: 549
    ga_income_tax_before_refundable_credits: 2_000
    state_code: GA
  output:
    ga_refundable_credits: 549
    ga_income_tax: 1_451

- name: Case 5, the credit is not among Georgia's refundable credits before 2024.
  period: 2023
  input:
    claim_of_right_credit_applies: true
    ga_claim_of_right_prior_year_tax_decrease: 575
    ga_income_tax_before_refundable_credits: 2_000
    state_code: GA
  output:
    ga_refundable_credits: 0
    ga_income_tax: 2_000

- name: Case 6, a joint return sums the spouses' decreases, not a dependent's.
  period: 2025
  input:
    people:
      person1:
        age: 45
        ga_claim_of_right_prior_year_tax_decrease: 300
      person2:
        age: 44
        ga_claim_of_right_prior_year_tax_decrease: 239
      person3:
        age: 20
        is_tax_unit_dependent: true
        ga_claim_of_right_prior_year_tax_decrease: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        claim_of_right_credit_applies: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: GA
  output:
    ga_claim_of_right_credit: 539

- name: Case 7, no credit outside Georgia.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ga_claim_of_right_prior_year_tax_decrease: 539
    state_code: AL
  output:
    ga_claim_of_right_credit: 0

- name: Case 8, end to end, the federal credit option brings the Georgia credit.
  # A prior-year federal decrease of $2,200 beats the deduction, which would
  # lose to the standard deduction, so federal tax uses section 1341(a)(5).
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
        claim_of_right_prior_year_tax_decrease: 2_200
        ga_claim_of_right_prior_year_tax_decrease: 539
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    claim_of_right_credit_applies: true
    ga_claim_of_right_credit: 539

- name: Case 9, end to end, a filer who deducts the repayment federally gets no Georgia credit.
  # With no prior-year federal decrease the deduction gives less federal
  # tax, and it flows to Georgia through federal itemized deductions.
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        claim_of_right_repayment: 10_000
        ga_claim_of_right_prior_year_tax_decrease: 539
    tax_units:
      tax_unit:
        members: [person1]
        interest_deduction: 20_000
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 10_000
    ga_claim_of_right_credit: 0
