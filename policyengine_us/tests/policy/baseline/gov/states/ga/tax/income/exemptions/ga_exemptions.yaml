- name: 2025 single filer who can be claimed as a dependent, no dependent exemption
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: GA
  output:
    # Georgia follows the federal rules for qualified dependents;
    # a return with a claimable filer has none (IRC 152(b)(1)).
    ga_exemptions: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: GA
  output:
    ga_exemptions: 0

