- name: GA CTC - full credit with sufficient liability
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 2
    tax_units:
      tax_unit:
        members:
        - parent
        - child
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members:
        - parent
        - child
        state_code: GA
  output:
    ga_ctc: 250
- name: GA CTC - no credit due to age (too old)
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 6
    tax_units:
      tax_unit:
        members:
        - parent
        - child
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members:
        - parent
        - child
        state_code: GA
  output:
    ga_ctc: 0
- name: GA CTC - multiple children full credit
  period: 2026
  input:
    people:
      parent:
        age: 32
      child1:
        age: 1
      child2:
        age: 5
    tax_units:
      tax_unit:
        members:
        - parent
        - child1
        - child2
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members:
        - parent
        - child1
        - child2
        state_code: GA
  output:
    ga_ctc: 500
- name: GA CTC - not available outside Georgia
  period: 2026
