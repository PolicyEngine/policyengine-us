      parent:
        age: 25
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10_000
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    # The filing exception leaves one qualifying child: min(250, 10,000).
    ga_ctc_potential: 250
    ga_ctc: 250
