- name: GA CTC - full credit with sufficient liability
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 2
    tax_units:
      tax_unit:
        members:
        - parent
        - child
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members:
        - parent
        - child
        state_code: GA
  output:
    ga_ctc: 250
- name: Georgia credits a resident child with an ITIN under section 24(c)
  period: 2026
  input:
    people:
      parent:
        age: 30
      child:
        age: 2
        ssn_card_type: NONE
        has_tin: true
        immigration_status: UNDOCUMENTED
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10_000
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    # Georgia lawmakers adopted IRC 24(c), without 24(h)(7)'s SSN gate,
    # in O.C.G.A. 48-7-29.27.
    # One qualifying child yields min(1 * $250, $10,000 liability) = $250.
    ga_ctc_eligible_child: [false, true]
    ga_ctc_potential: 250
    ga_ctc: 250
