- name: GA CTC - no credit in 2025 (pre-enactment)
  period: 2025
  input:
    people:
      parent:
        age: 30
      child:
        age: 2
    tax_units:
      tax_unit:
        members:
        - parent
        - child
        filing_status: SINGLE
        ga_low_income_credit: 0
    households:
      household:
        members:
        - parent
        - child
        state_code: GA
  output:
    ga_non_refundable_credits: 0


- name: 2026 GA CTC still counts the child of a filer who can be claimed as a dependent
  period: 2026
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    # Georgia uses the IRC 24(c) qualifying-child definition only; whether IRC
    # 152(b)(1) reaches it is not settled, so the child test is kept.
    ga_ctc: 250
