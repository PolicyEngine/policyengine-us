- name: 2026 Georgia denies the child credit to a filer who can be claimed as a dependent
  period: 2026
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
        ga_income_tax_before_non_refundable_credits: 10000
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    # Under IRC 24(c)(2), the child must remain a dependent after the
    # citizenship counterfactual. This filer cannot claim dependents
    # under IRC 152(b)(1), so Georgia allows no child credit.
    ga_ctc: 0


- name: 2026 Georgia denies the potential child credit to a claimable single filer
  period: 2026
  input:
    people:
      filer:
        age: 25
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: GA
  output:
    # Georgia lawmakers adopted IRC 24(c)(2). This taxpayer cannot
    # claim dependents under IRC 152(b)(1), so the child cannot qualify.
    ga_ctc_potential: 0

