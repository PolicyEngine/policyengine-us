# Ungated regular heating matrix gives660 for natural gas; no actual-expense cap is stated.
- name: Case 3, a small heating bill does not cap the fixed matrix amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: GA
    heating_type: NATURAL_GAS
    pre_subsidy_electricity_expense: 1_200
    gas_expense: 50
    ga_liheap_household_size: 1
    ga_liheap_income: 0
  output:
    ga_liheap_matrix_amount: 660

# NONE affirmatively means no heating. No assertions here establish legal ineligibility for unpriced fuel or out-of-table size.
