# Source-derived Georgia independent components; no final eligibility or total award asserted.

# Manual pp51–52 counts citizen/qualified people including minors; DACA and undocumented members do not count in size.
- name: Case 1, qualified adults and minors count without SNAP waiting bars.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi: 0
      person2:
        age: 39
        immigration_status: ASYLEE
        ssi: 0
      person3:
        age: 16
        immigration_status: CITIZEN
        ssi: 0
      person4:
        age: 19
        immigration_status: DACA
        ssi: 0
      person5:
        age: 8
        immigration_status: UNDOCUMENTED
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ga_tanf: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: GA
        hud_utility_allowance: 0
  output:
    ga_liheap_household_size: 3

# No final eligibility result is asserted; this isolates qualified-member size.
- name: Case 2, a wholly nonqualified household has size zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
      person2:
        age: 8
        immigration_status: DACA
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ga_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: GA
        hud_utility_allowance: 0
  output:
    ga_liheap_household_size: 0
