# Monthly25 allowance annualizes to300; exact threshold is excluded and first dollar above it counts.
- name: Case 5, annual household interest allowance has an exact three hundred dollar boundary.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [GA, GA, GA]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_200, 1_200, 1_200]
    age: [40, 40, 40]
    ssi: [0, 0, 0]
    ga_tanf: [0, 0, 0]
    interest_income: [299, 300, 301]
  output:
    ga_liheap_income: [0, 0, 1]

