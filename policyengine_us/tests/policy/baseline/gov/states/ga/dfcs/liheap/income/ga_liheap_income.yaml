# Source-derived Georgia independent components; no final eligibility or total award asserted.

# Manual pp65–68: wages and business17400 + ordinary/farmrent2400 + survivors600 + pension1200 + SSA2400 + SSI1200 + gains600 =25800; no duplicated component aggregates.
- name: Case 1, supported independent adult income sources are counted once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 1_200
        employment_income: 12_000
        self_employment_income: 3_000
        farm_operations_income: 1_200
        sstb_self_employment_income: 600
        partnership_s_corp_income: 600
        rental_income: 1_200
        farm_rent_income: 1_200
        survivor_benefits: 600
        pension_income: 1_200
        social_security: 2_400
        capital_gains: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ga_tanf: 0
    households:
      household:
        members: [person1]
        state_code: GA
        hud_utility_allowance: 0
  output:
    ga_liheap_income: 25_800

# Manual p62 excludes ALL under18 income. At18,6000wages+2400SSI+1200SSA+600dividends+300netinterest adds10500 to parent12000.
- name: Case 2, all age 17 income follows the under eighteen exclusion boundary.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 12_000
      person2:
        age: 17
        immigration_status: CITIZEN
        ssi: 2_400
        employment_income: 6_000
        social_security: 1_200
        ordinary_dividend_income: 600
        interest_income: 600
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ga_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: GA
        hud_utility_allowance: 0
  output:
    ga_liheap_income: 12_000

