- name: Resources exactly at limit are eligible.
  period: 2025-01
  input:
    state_code: GA
    spm_unit_cash_assets: 1_000
  output:
    ga_tanf_resources_eligible: true

- name: Resources one dollar over limit are ineligible.
  period: 2025-01
  input:
    state_code: GA
    spm_unit_cash_assets: 1_001
  output:
    ga_tanf_resources_eligible: false

- name: Zero resources are eligible.
  period: 2025-01
  input:
    state_code: GA
    spm_unit_cash_assets: 0
  output:
    ga_tanf_resources_eligible: true

- name: Resources one dollar under limit are eligible.
  period: 2025-01
  input:
    state_code: GA
    spm_unit_cash_assets: 999
  output:
    ga_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.90 = 1,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 1,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.90
    state_code: GA
  output:
    ga_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.91 = 1,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.91
    state_code: GA
  output:
    ga_tanf_resources_eligible: false
