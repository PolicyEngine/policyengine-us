# Manual page 89, third row: an unsubsidized renter with heat in rent who is billed
# directly for electric has an energy burden, paid to the electric vendor. Page 4 also
# makes subsidized renters eligible when the utility bill is in their name. The award
# is the FY2026 matrix step 2 amount for the main heating fuel; it is not the
# lowest award. Each household is one adult with heat in rent and a $1,200 a year
# ($100 a month) electric bill. Unsubsidized rent is $9,600 ($800 a month); the
# subsidized tenant share is $3,000 ($250 a month). The size 1 limit is $34,549 and
# the Level I cutoff is $13,589.
# Household 1: natural gas, $12,000 wages, Level I: $560 + $100 = $660.
# Household 2: natural gas, $24,000 wages, Level II: $560.
# Household 3: electric, $24,000 wages, Level II: $400.
# Household 4: UNSPECIFIED fuel, $12,000 wages: eligible, but the matrix has no amount
# for an unspecified fuel, so $0.
# Household 5: subsidized, natural gas, $12,000 wages, with the electric bill: $660.
# Household 6: subsidized, natural gas, $12,000 wages, no bill: no energy burden, so
# the $660 matrix amount is not paid.
- name: Case 16, heat in rent renters billed for electric receive the main heating fuel award.
  period: 2026
  input:
    state_code: [GA, GA, GA, GA, GA, GA]
    age: [40, 40, 40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    employment_income: [12_000, 24_000, 24_000, 12_000, 12_000, 12_000]
    ssi: [0, 0, 0, 0, 0, 0]
