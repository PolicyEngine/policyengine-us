    ga_liheap_income: [12_000, 24_000, 24_000, 12_000, 12_000, 12_000]
    ga_liheap_income_limit: [34_549, 34_549, 34_549, 34_549, 34_549, 34_549]
    heating_expense: [0, 0, 1_200, 0, 0, 0]
