# Georgia ordinary heating route only. Categorical recipient facts, utility credits,
# unpriced fuels and size-above-16 coverage remain documented limitations.

# FY2026 matrix p1: size1 income12000 is LevelI and electric pays500. Manual pp4,50 establishes heating burden, not an expense cap; the25 bill must not reduce the scheduled award.
- name: Case 1, a small positive primary bill receives the full fixed heating award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 25
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    ga_liheap_income_limit: 34_549
    heating_expense: 25
    ga_liheap_matrix_amount: 500
    ga_liheap_eligible: true
    ga_liheap: 500

# Manual pp51-52,62: parent income counts fully, parent is excluded from size, and all under18 income is excluded. FY2026 matrix p1 gives the size1 LevelI gas award660.
- name: Case 2, a citizen child qualifies while the nonqualified parent income counts fully.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
        ssi: 0
      person2:
        age: 10
        immigration_status: CITIZEN
        employment_income: 6_000
        survivor_benefits: 1_200
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    ga_liheap_income_limit: 34_549
    ga_liheap_matrix_amount: 660
    ga_liheap_eligible: true
    ga_liheap: 660

# Manual pp51-52,62,67 counts the full30000 wages plus5000 farm-property rent against qualified size1.35000 exceeds the FY2026 matrix ceiling34549, so ordinary eligibility gates the final grant to zero.
- name: Case 3, full nonqualified adult wages and farm rent can exceed the qualified child ceiling.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        employment_income: 30_000
        farm_rent_income: 5_000
        ssi: 0
      person2:
        age: 10
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 35_000
    ga_liheap_income_limit: 34_549
    ga_liheap_eligible: false
    ga_liheap: 0

