    ga_liheap_eligible: [true, true, true, true, true, false]
    ga_liheap_matrix_amount: [660, 560, 400, 0, 660, 660]
    ga_liheap: [660, 560, 400, 0, 660, 0]

# Manual page 89 and FY2026 plan page 30: when unsubsidized rent includes all
# utilities, the tenant pays no utility vendor and gets the lowest award in the
# income level, even if an electric bill is also reported. Ordinary natural gas would
# pay $660 or $560; the lowest award is min($400, $560, $710, $580, $400) = $400,
# plus $100 in Level I. Rent is $9,600 ($800 a month).
# Household 1: $12,000 wages, Level I: $500. Household 2: $24,000 wages, Level II: $400.
- name: Case 17, rent including all utilities keeps the lowest award when an electric bill is reported.
  period: 2026
  input:
    state_code: [GA, GA]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [12_000, 24_000]
    ssi: [0, 0]
    ga_tanf: [0, 0]
    rent: [9_600, 9_600]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    heat_expense_included_in_rent: [true, true]
    tenant_pays_utilities: [false, false]
    receives_housing_assistance: [false, false]
    is_in_public_housing: [false, false]
    gas_expense: [0, 0]
    pre_subsidy_electricity_expense: [1_200, 1_200]
  output:
    ga_liheap_income: [12_000, 24_000]
    heating_expense: [0, 0]
    ga_liheap_eligible: [true, true]
    ga_liheap_matrix_amount: [500, 400]
    ga_liheap: [500, 400]
