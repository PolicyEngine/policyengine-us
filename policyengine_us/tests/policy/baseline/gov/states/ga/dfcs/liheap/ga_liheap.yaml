    ga_liheap: [710, 580, 400, 0]

# Manual pages 4 and 57 permit a verified energy burden in subsidized heat-in-rent
# housing. has_heating_expense is false when heat is in rent, but the reported $100
# primary bill supplies the burden; FY2026 Level I propane pays $680 with no cap.
- name: Case 6, a subsidized renter with verified primary expense can receive the ordinary grant.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: PROPANE
        bottled_gas_expense: 100
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: GA
        is_in_public_housing: true
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    heating_expense: 100
    has_heating_expense: false
    ga_liheap_matrix_amount: 680
    ga_liheap_eligible: true
    ga_liheap: 680

# Manual sections 1200.6-1200.7 (pages 64-66) net self-employment within the
# business, so each source is floored at zero and the $18,000 self-employment loss
# does not offset the $6,000 of wages: countable income is $6,000. That is at or
# below the $13,589 Level I cutoff, so FY2026 Level I wood pays $500.
- name: Case 7, a self-employment loss does not offset wages or inflate the fixed heating award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 6_000
        self_employment_income: -18_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: WOOD
        wood_expense: 100
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_income: 6_000
    ga_liheap_household_size: 1
    ga_liheap_matrix_amount: 500
    ga_liheap_eligible: true
    ga_liheap: 500

# Manual page 3 requires responsibility for energy costs or a verified burden; the
