# FY2026 matrix p1: real single-adult wages20000 are above13589 and below34549. LevelII oil710, propane580 and wood400 pass through ordinary eligibility; the Alabama household receives no Georgia award. Existing unit cases already cover the full ten-cell matrix.
- name: Case 5, ordinary upper band awards use the primary fuel and exclude another state.
  period: 2026
  input:
    state_code: [GA, GA, GA, AL]
    age: [40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    employment_income: [20_000, 20_000, 20_000, 20_000]
    ssi: [0, 0, 0, 0]
    ga_tanf: [0, 0, 0, 0]
    heating_type: [FUEL_OIL, PROPANE, WOOD, FUEL_OIL]
    fuel_oil_expense: [1_200, 0, 0, 1_200]
    bottled_gas_expense: [0, 1_200, 0, 0]
    wood_expense: [0, 0, 1_200, 0]
  output:
    ga_liheap_eligible: [true, true, true, false]
    ga_liheap: [710, 580, 400, 0]

# Manual pp4,57 permits verified energy burden in subsidized heat-in-rent housing. The shared Boolean defaults false for heat in rent, but the reported primary bill100 supplies burden; FY2026 LevelI propane pays680 uncapped.
- name: Case 6, a subsidized renter with verified primary expense can receive the ordinary grant.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: PROPANE
        bottled_gas_expense: 100
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: GA
        is_in_public_housing: true
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    heating_expense: 100
    has_heating_expense: false
    ga_liheap_matrix_amount: 680
    ga_liheap_eligible: true
    ga_liheap: 680

# Contract retains existing signed net-business inputs and floors combined household income0; no additional business-expense policy is introduced. FY2026 matrix p1 fixes LevelI wood at500, so a negative pre-floor total cannot increase the grant.
- name: Case 7, existing net business losses do not inflate the fixed heating award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 6_000
        self_employment_income: -18_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: WOOD
        wood_expense: 100
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_income: 0
    ga_liheap_household_size: 1
    ga_liheap_matrix_amount: 500
    ga_liheap_eligible: true
    ga_liheap: 500

# Manual p3 requires responsibility for energy costs or verified burden; v1.2 honors the existing explicit has_heating_expense fact even when no paid bill amount is reported. FY2026 matrix p1 gives LevelI oil810 with no spending cap.
- name: Case 8, an explicit heating obligation with a zero reported bill receives the scheduled award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: FUEL_OIL
        fuel_oil_expense: 0
        has_heating_expense: true
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    heating_expense: 0
    has_heating_expense: true
    ga_liheap_matrix_amount: 810
    ga_liheap_eligible: true
    ga_liheap: 810

# Manual p89 recognizes an energy burden when all utilities are included in
# unsubsidized rent. FY2026 plan p30 requires the lowest award within the income
# level for payment to the applicant:500 for12000 income and400 for15000 income.
# Both are below the ordinary size1 ceiling34549 and have no separately paid bill.
- name: Case 9, unsubsidized renters with all utilities bundled receive each income level minimum.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        rent: 12_000
        ssi: 0
      person2:
        age: 40
        immigration_status: CITIZEN
        employment_income: 15_000
        rent: 12_000
        ssi: 0
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
        ga_tanf: 0
        heating_type: NATURAL_GAS
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
        gas_expense: 0
        pre_subsidy_electricity_expense: 0
      spm_unit2:
        members: [person2]
        ga_tanf: 0
        heating_type: NATURAL_GAS
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
        gas_expense: 0
        pre_subsidy_electricity_expense: 0
    households:
      household1:
        members: [person1]
        state_code: GA
        is_in_public_housing: false
        tenant_pays_utilities: false
      household2:
        members: [person2]
        state_code: GA
        is_in_public_housing: false
        tenant_pays_utilities: false
  output:
    ga_liheap_household_size: [1, 1]
    ga_liheap_income: [12_000, 15_000]
    ga_liheap_income_limit: [34_549, 34_549]
    heating_expense: [0, 0]
    has_heating_expense: [false, false]
    ga_liheap_matrix_amount: [500, 400]
    ga_liheap_eligible: [true, true]
    ga_liheap: [500, 400]
