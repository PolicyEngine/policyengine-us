# FY2025 matrix step 1: size 1 Level I is $0 - $12,995 and Level II is
# $12,996 - $33,038. Deliberate boundary case: $12,995 is the Level I top and $13,000
# is just above it (the FY2026 cutoff of $13,589 would put both in Level I).
# Limit: floor($105,893 x 0.6) = $63,535; floor($63,535 x 0.52 = $33,038.20) = $33,038.
# Step 2 electric heat pays $500 in Level I and $400 in Level II.
- name: Case 10, the FY2025 Level I cutoff applies in 2025.
  period: 2025
  input:
    state_code: [GA, GA]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [12_995, 13_000]
    ssi: [0, 0]
    ga_tanf: [0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_200, 1_200]
  output:
    ga_liheap_household_size: [1, 1]
    ga_liheap_income: [12_995, 13_000]
    ga_liheap_income_limit: [33_038, 33_038]
    heating_expense: [1_200, 1_200]
    ga_liheap_matrix_amount: [500, 400]
    ga_liheap_eligible: [true, true]
    ga_liheap: [500, 400]

# FY2025 and FY2026 plans, section 1.9 (page 6), count Social Security "Excluding
# MediCare deduction", and manual section 1200.7 (page 69) excludes the premiums.
# The 2026 Part B premium is pinned as an input: $202.90 x 12 = $2,434.80.
# Countable income: $36,000 - $2,434.80 = $33,565.20. That is at or below the size 1
# limit of $34,549 (gross Social Security would exceed it) and above the $13,589
# Level I cutoff, so FY2026 Level II electric pays $400.
- name: Case 11, a retiree's Social Security counts net of the Medicare Part B premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        social_security_retirement: 36_000
        medicare_part_b_premium: 2_434.8
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 33_565.2
    ga_liheap_income_limit: 34_549
    heating_expense: 1_800
    ga_liheap_matrix_amount: 400
    ga_liheap_eligible: true
    ga_liheap: 400

# FY2026 plan page 6 counts retirement and pension benefits; manual page 66 counts a
# pension as unearned income, and page 83 groups Railroad Retirement with Social
# Security. Household 1: $36,000 of military retirement pay. Household 2: $36,000 of
# railroad retirement, counted gross; only Social Security is netted of the pinned
# $2,434.80 premium. Both incomes of $36,000 exceed the size 1 limit of $34,549, so
# both are ineligible. The ungated matrix amounts are Level II natural gas $560 and
