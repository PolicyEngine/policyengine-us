# FY2026 matrix page 1: single-adult wages of $20,000 are above $13,589 and below
# $34,549. Level II oil ($710), propane ($580) and wood ($400) pass ordinary
# eligibility; the Alabama household receives no Georgia award. Unit cases cover the
# full ten-cell matrix.
