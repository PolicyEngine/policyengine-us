    ssi: [0, 0]
    ga_tanf: [0, 0]
    heating_type: [NATURAL_GAS, ELECTRICITY]
    gas_expense: [1_200, 0]
    pre_subsidy_electricity_expense: [0, 1_500]
  output:
    ga_liheap_household_size: [1, 1]
    ga_liheap_income: [36_000, 36_000]
    ga_liheap_income_limit: [34_549, 34_549]
    ga_liheap_matrix_amount: [560, 400]
    ga_liheap_eligible: [false, false]
    ga_liheap: [0, 0]

# Manual page 65 counts capital gains, not losses, and pages 64-66 net business
# income within each business. Each source is floored at zero before the sources are
# added. Household 1: max($40,000, 0) + max(-$10,000, 0) = $40,000. Household 2:
# max($36,000, 0) + max(-$5,000, 0) = $36,000. Both exceed the size 1 limit of
# $34,549; netting the losses ($30,000 and $31,000) would have paid $400 each.
- name: Case 13, a capital loss or a rental loss does not offset wages.
  period: 2026
  input:
    state_code: [GA, GA]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [40_000, 36_000]
    long_term_capital_gains: [-10_000, 0]
    rental_income: [0, -5_000]
    ssi: [0, 0]
    ga_tanf: [0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_500, 1_500]
  output:
    ga_liheap_income: [40_000, 36_000]
    ga_liheap_income_limit: [34_549, 34_549]
    ga_liheap_matrix_amount: [400, 400]
    ga_liheap_eligible: [false, false]
    ga_liheap: [0, 0]

# Manual page 89 gives an energy burden to an unsubsidized renter whose rent includes
# all utilities, and FY2026 plan page 30 pays the applicant the lowest award in the
# income level. The heat-in-rent route does not need the fuel, so an UNSPECIFIED fuel
# still pays: lowest Level II award min($400, $560, $710, $580, $400) = $400, plus
# $100 in Level I. Household 1: $12,000 is at or below $13,589, so $500.
# Household 2: $24,000 is above $13,589, so $400. Household 3 pays its own utilities
# with heat outside rent: UNSPECIFIED has no primary fuel bill (heating_expense is $0),
# so there is no energy burden and no award.
- name: Case 14, bundled utilities in rent pay the income level minimum when the fuel is unspecified.
  period: 2026
  input:
    state_code: [GA, GA, GA]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    employment_income: [12_000, 24_000, 12_000]
    ssi: [0, 0, 0]
    ga_tanf: [0, 0, 0]
    rent: [12_000, 12_000, 12_000]
    heating_type: [UNSPECIFIED, UNSPECIFIED, UNSPECIFIED]
    heat_expense_included_in_rent: [true, true, false]
    tenant_pays_utilities: [false, false, true]
    receives_housing_assistance: [false, false, false]
    is_in_public_housing: [false, false, false]
    pre_subsidy_electricity_expense: [0, 0, 1_200]
  output:
    ga_liheap_income: [12_000, 24_000, 12_000]
    heating_expense: [0, 0, 0]
    has_heating_expense: [false, false, false]
    ga_liheap_matrix_amount: [500, 400, 0]
    ga_liheap_eligible: [true, true, false]
    ga_liheap: [500, 400, 0]

