    heat_expense_included_in_rent: [true, true, true, true, true, true]
    tenant_pays_utilities: [true, true, true, true, true, true]
    receives_housing_assistance: [false, false, false, false, true, true]
    is_in_public_housing: [false, false, false, false, false, false]
    gas_expense: [0, 0, 0, 0, 0, 0]
    pre_subsidy_electricity_expense: [1_200, 1_200, 1_200, 1_200, 1_200, 0]
  output:
