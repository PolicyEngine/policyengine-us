# Georgia ordinary heating route only. Categorical recipient facts, utility credits,
# unpriced fuels and size-above-16 coverage remain documented limitations.

# FY2026 matrix page 1: a size 1 household with $12,000 income is in Level I, and
# electric heat pays $500. Manual pages 4 and 50 establish a heating burden, not an
# expense cap, so the $25 bill does not reduce the scheduled award.
- name: Case 1, a small positive primary bill receives the full fixed heating award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        ga_tanf: 0
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 25
    households:
      household:
        members: [person1]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    ga_liheap_income_limit: 34_549
    heating_expense: 25
    ga_liheap_matrix_amount: 500
    ga_liheap_eligible: true
    ga_liheap: 500

# Manual pages 51-52 and 62: the parent's income counts in full, the parent is
# excluded from size, and all income of members under 18 is excluded. FY2026 matrix
# page 1 gives the size 1 Level I natural gas award of $660.
- name: Case 2, a citizen child qualifies while the nonqualified parent income counts fully.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
        ssi: 0
      person2:
        age: 10
        immigration_status: CITIZEN
        employment_income: 6_000
        survivor_benefits: 1_200
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        ga_tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: GA
  output:
    ga_liheap_household_size: 1
    ga_liheap_income: 12_000
    ga_liheap_income_limit: 34_549
    ga_liheap_matrix_amount: 660
    ga_liheap_eligible: true
    ga_liheap: 660

