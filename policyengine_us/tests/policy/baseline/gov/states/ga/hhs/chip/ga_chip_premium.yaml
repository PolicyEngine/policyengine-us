# 2025 sits entirely within the schedule that took effect on 2024-10-01, so
# every month carries the same premium and the calendar year is twelve times
# the monthly amount.
- name: Georgia PeachCare tier 1 tax unit with one child pays 11 dollars in every month of 2025.
  period: 2025
  input:
    people:
      child:
        is_chip_eligible: true
        is_chip_eligible_child: true
    tax_units:
      tax_unit:
        members: [child]
        tax_unit_medicaid_income_level: 1.40
    households:
      household:
        members: [child]
        state_code: GA
  output:
    ga_chip_premium:
      2025-01: 11
      2025-07: 11
      2025-12: 11
      2025: 132 # 12 x 11

- name: Georgia PeachCare tier 1 tax unit with three children is capped at 16 dollars monthly.
  period: 2025
  input:
    people:
      child1:
        is_chip_eligible: true
        is_chip_eligible_child: true
      child2:
        is_chip_eligible: true
        is_chip_eligible_child: true
      child3:
        is_chip_eligible: true
        is_chip_eligible_child: true
    tax_units:
      tax_unit:
        members: [child1, child2, child3]
        tax_unit_medicaid_income_level: 1.40
    households:
      household:
        members: [child1, child2, child3]
        state_code: GA
  output:
    ga_chip_premium: 192

- name: Georgia PeachCare below 134 percent FPL owes no premium.
  period: 2025
  input:
    people:
      child:
        is_chip_eligible: true
        is_chip_eligible_child: true
    tax_units:
      tax_unit:
        members: [child]
        tax_unit_medicaid_income_level: 1.30
    households:
      household:
        members: [child]
        state_code: GA
  output:
    ga_chip_premium: 0
