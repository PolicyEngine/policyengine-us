- name: Dependent child's public pension does not reduce the filer's Nebraska AGI
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
      child:
        age: 10
        taxable_public_pension_income: 10_000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: NE
  output:
    # Federal AGI is the head's 50,000 of wages; the child's pension is on the
    # child's own return, so Nebraska has nothing to subtract.
    adjusted_gross_income: 50_000
    ne_agi_subtractions: 0
    ne_agi: 50_000

