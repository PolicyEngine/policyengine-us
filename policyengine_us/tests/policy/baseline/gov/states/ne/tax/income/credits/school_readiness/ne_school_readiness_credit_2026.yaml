# Supply the published 2025 amounts as a fixture for 2026 lookup coverage.
# https://revenue.nebraska.gov/school-readiness-tax-credit-staff-member
# DOR does not list 2026 amounts on the cited page.
# Set unrelated benefits, health costs and Nebraska child credit to $0.
# Tax = 0 - 2,992; net income = 0 - (-2,992).
- name: A level 3 worker lives with a child in 2026 with a 2025 amount fixture
  period: 2026
  input:
    gov.states.ne.tax.income.credits.school_readiness.amount.refundable.1: 2_373
    gov.states.ne.tax.income.credits.school_readiness.amount.refundable.2: 2_683
    gov.states.ne.tax.income.credits.school_readiness.amount.refundable.3: 2_992
    gov.states.ne.tax.income.credits.school_readiness.amount.refundable.4: 3_302
    gov.states.ne.tax.income.credits.school_readiness.amount.refundable.5: 3_611
    people:
      worker:
        age: 30
        ne_school_readiness_credit_eligible_worker: true
        ne_school_readiness_credit_child_care_worker_rating: 3
      child:
        age: 3
    households:
      household:
        members: [worker, child]
        state_code: NE
        household_benefits: 0
        household_health_costs: 0
    tax_units:
      tax_unit:
        members: [worker, child]
        ne_refundable_ctc: 0
    spm_units:
      spm_unit:
        members: [worker, child]
    families:
      family:
        members: [worker, child]
    marital_units:
      worker_unit:
        members: [worker]
      child_unit:
        members: [child]
  output:
    ne_school_readiness_credit: [2_992, 0]
    ne_income_tax: -2_992
    household_net_income: 2_992

