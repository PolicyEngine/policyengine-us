# Neb. Rev. Stat. 77-2716(7): federal adjusted gross income is modified to
# exclude any amount repaid for which a reduction in federal tax is allowed
# under 26 U.S.C. 1341(a)(5). Schedule I, line 26 (2025): "Enter the amount
# required to be included on your federal return for a claim of right
# repayment."
- name: Case 1, the subtraction is the amount repaid under section 1341(a)(5).
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: true
    state_code: NE
  output:
    ne_claim_of_right_subtraction: 10_000
    ne_agi_subtractions: 10_000
    ne_agi: 50_000

- name: Case 2, no subtraction under section 1341(a)(4).
  # The repayment is a federal itemized deduction instead.
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: false
    state_code: NE
  output:
    ne_claim_of_right_subtraction: 0
    ne_agi: 60_000

- name: Case 3, a joint return subtracts the spouses' repayments, not a dependent's.
  period: 2025
  input:
    people:
      person1:
        age: 45
        claim_of_right_repayment: 6_000
      person2:
        age: 44
        claim_of_right_repayment: 2_000
      person3:
        age: 30
        is_tax_unit_dependent: true
        claim_of_right_repayment: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        claim_of_right_credit_applies: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: NE
  output:
    ne_claim_of_right_subtraction: 8_000

- name: Case 4, no subtraction outside Nebraska.
  period: 2025
  input:
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: true
    state_code: IA
  output:
    ne_claim_of_right_subtraction: 0

- name: Case 5, the model derives the federal method before subtracting.
  # No other income: federal tax under section 1341(a)(5) is 0 - 2,200 and
  # under (a)(4) is 0, so the reduction under (a)(5) is allowed and Nebraska
  # subtracts the 10,000 dollars repaid.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    claim_of_right_repayment: 10_000
    claim_of_right_prior_year_tax_decrease: 2_200
    state_code: NE
  output:
    claim_of_right_credit_applies: true
    ne_claim_of_right_subtraction: 10_000

- name: Case 6, a repayment of 3,000 dollars or less is not subtracted.
  # Section 1341 does not apply, so no reduction is allowed under (a)(5).
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    claim_of_right_repayment: 3_000
    claim_of_right_prior_year_tax_decrease: 2_200
    state_code: NE
  output:
    claim_of_right_credit_applies: false
    ne_claim_of_right_subtraction: 0
