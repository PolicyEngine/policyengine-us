- name: Unit test 1
  period: 2021
  input:
    filing_status: JOINT
    charitable_deduction: 2_000
    deductible_interest_expense: 24_000
    salt_deduction: 10_000
    real_estate_taxes: 9_000
    # Income taxes are claimed on Schedule A.
    state_withheld_income_tax: 5_000
    local_income_tax: 0
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 2_000 + 24_000 + 9_000

- name: Unit test 2
  period: 2022
  input:
    filing_status: JOINT
    charitable_deduction: 3_000
    deductible_interest_expense: 7_000
    salt_deduction: 10_000
    real_estate_taxes: 6_000
    # Income taxes are claimed on Schedule A.
    state_withheld_income_tax: 5_000
    local_income_tax: 0
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 3_000 + 7_000 + 6_000

- name: Sales taxes claimed on Schedule A stay in the Nebraska deduction
  # Federal itemized: 15,000 other + 8,000 SALT (sales taxes 3,000 exceed
  # income taxes 1,000, so sales taxes are claimed) = 23,000. No income taxes
  # are claimed, so Nebraska subtracts nothing.
  period: 2023
  input:
    filing_status: SINGLE
    itemized_deductions_less_salt: 15_000
    salt_deduction: 8_000
    real_estate_taxes: 5_000
    state_withheld_income_tax: 1_000
    local_income_tax: 0
    state_sales_tax: 3_000
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 23_000

- name: Income taxes claimed on Schedule A are removed from the Nebraska deduction
  # Federal SALT 7,000 = 2,000 income taxes + 5,000 real estate taxes.
  # Nebraska: 15,000 + 7,000 - 2,000 = 20,000.
  period: 2023
  input:
    filing_status: SINGLE
    itemized_deductions_less_salt: 15_000
    salt_deduction: 7_000
    real_estate_taxes: 5_000
    state_withheld_income_tax: 2_000
    local_income_tax: 0
    state_sales_tax: 500
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 20_000

- name: Real estate taxes count only up to the SALT deduction claimed federally
  # 2025: the federal SALT cap has phased down to 10,000, so Schedule A
  # claims 10,000 of the 35,000 income taxes and 30,000 real estate taxes.
  # Real estate taxes count first, so no income taxes are claimed and
  # Nebraska keeps the full 10,000: 15,000 + 10,000 = 25,000, never more
  # than the 25,000 federal total.
  period: 2025
  input:
    filing_status: SINGLE
    itemized_deductions_less_salt: 15_000
    salt_deduction: 10_000
    real_estate_taxes: 30_000
    state_withheld_income_tax: 35_000
    local_income_tax: 0
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 25_000

- name: Income taxes above real estate taxes take the rest of the capped SALT deduction
  # Federal SALT capped at 10,000: real estate taxes 4,000 count first, the
  # other 6,000 is income taxes. Nebraska: 15,000 + 10,000 - 6,000 = 19,000.
  period: 2023
  input:
    filing_status: SINGLE
    itemized_deductions_less_salt: 15_000
    salt_deduction: 10_000
    real_estate_taxes: 4_000
    state_withheld_income_tax: 12_000
    local_income_tax: 0
    state_sales_tax: 1_000
    local_sales_tax: 0
    state_code: NE
  output:
    ne_itemized_deductions: 19_000
