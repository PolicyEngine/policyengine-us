# A head of household earning $75,000 in wages has federal AGI and total household
# income of exactly $75,000. The 3-year-old is age eligible (77-7202(1), five or less),
# and the $3,000 of child care stands in for 77-7203(1)(a) (income is above the
# poverty level, so (1)(c) fails). 77-7203(2)(a): $2,000 at income no more than
# $75,000. The 9-year-old is over the age limit.
- name: Head of household with $75,000 of wages and a 3-year-old in child care gets $2,000
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 75_000
        is_tax_unit_head: true
      toddler:
        age: 3
        is_tax_unit_dependent: true
      older_child:
        age: 9
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, toddler, older_child]
        filing_status: HEAD_OF_HOUSEHOLD
        tax_unit_childcare_expenses: 3_000
    spm_units:
      spm_unit:
        members: [head, toddler, older_child]
    households:
      household:
        members: [head, toddler, older_child]
        state_code: NE
  output:
    ne_refundable_ctc_total_household_income: 75_000
    ne_refundable_ctc: 2_000
