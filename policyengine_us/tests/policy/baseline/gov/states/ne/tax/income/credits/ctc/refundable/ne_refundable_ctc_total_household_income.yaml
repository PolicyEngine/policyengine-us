# Neb. Rev. Stat. 77-7202(8): "Total household income means federal modified
# adjusted gross income." Nebraska Department of Revenue, Child Care
# Refundable Tax Credit Total Household Income Calculation (page 1): line 1 is
# federal adjusted gross income; line 2 is "line 2d of the Federal Schedule
# 8812" (income from Puerto Rico and American Samoa and the Form 2555
# exclusions); line 3, "Add lines 1 and 2. This amount is your total household
# income". Form 7203 instructions, Part A (page 2), say the same.

- name: NE refundable CTC total household income equals federal AGI when no income is excluded
  period: 2024
  input:
    adjusted_gross_income: 1000
    state_code: NE
  output:
    ne_refundable_ctc_total_household_income: 1000

- name: Foreign earned income excluded under section 911 is added to federal AGI
  period: 2025
  input:
    adjusted_gross_income: 70_000
    # Form 2555 exclusion (Schedule 8812 line 2b). Income inputs, and so the
    # adjusted gross income above, are net of it.
    foreign_earned_income_exclusion: 10_000
    state_code: NE
  output:
    # Line 1: 70,000. Line 2: 10,000. Line 3: 80,000.
    ne_refundable_ctc_total_household_income: 80_000

- name: Income from Puerto Rico excluded under section 933 is added to federal AGI
  period: 2025
  input:
    adjusted_gross_income: 60_000
    # Schedule 8812 line 2a.
    puerto_rico_income: 5_000
    state_code: NE
  output:
    # Line 1: 60,000. Line 2: 5,000. Line 3: 65,000.
    ne_refundable_ctc_total_household_income: 65_000

- name: Income from Puerto Rico brings total household income to the poverty guideline
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 21_150
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [parent, child]
        # Part of the wages is income from Puerto Rico that IRC 933 excludes,
        # which the model deducts above the line.
        puerto_rico_income: 1_150
    households:
      household:
        members: [parent, child]
        state_code: NE
  output:
    # Line 1: 21,150 - 1,150 = 20,000. Line 2: 1,150. Line 3: 21,150.
    adjusted_gross_income: 20_000
    ne_refundable_ctc_total_household_income: 21_150
    # 77-7203(1)(c): total household income at or below 100% of the federal
    # poverty level, 15,650 + 5,500 = 21,150 for two people in 2025.
    ne_refundable_ctc_income_eligible: true
    # 77-7203(2)(a): 2,000 per child at no more than 75,000.
    ne_refundable_ctc: 2_000

- name: Income from Puerto Rico one dollar more puts total household income above the poverty guideline
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 21_151
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [parent, child]
        puerto_rico_income: 1_151
    households:
      household:
        members: [parent, child]
        state_code: NE
  output:
    # Line 1: 21,151 - 1,151 = 20,000. Line 2: 1,151. Line 3: 21,151.
    adjusted_gross_income: 20_000
    ne_refundable_ctc_total_household_income: 21_151
    # 21,151 > 21,150, and the household reports no child care expenses.
    ne_refundable_ctc_income_eligible: false
    ne_refundable_ctc: 0
