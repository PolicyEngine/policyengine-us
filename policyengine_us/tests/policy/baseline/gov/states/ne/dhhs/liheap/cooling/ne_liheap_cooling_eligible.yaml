# Source: 476 NAC 2-003 Cooling Assistance and Nebraska FY2026 LIHEAP plan section 3.3.
# https://rules.nebraska.gov/api/fileStorage/GetAsByteArray/chapter-pdfs/476%20NAC%202%20(06-26-2022).pdf/1747#page=2
# A household must qualify for LIHEAP, pay a cooling cost, and include a member who is a child
# under 6 receiving Aid to Dependent Children or a member age 70 or older. The medical-statement
# and prior-air-conditioner routes have no existing inputs.

# Retirees with $1,200 a month of Social Security ($14,400 a year), under the $23,475
# one-person limit. Age 69 has no qualifying member; age 70 does.
- name: Case 1, a member age 70 qualifies the household and age 69 does not.
  period: 2026
  input:
    state_code: [NE, NE]
    age: [69, 70]
    social_security_retirement: [14_400, 14_400]
    ssi: [0, 0]
    ne_aabd: [0, 0]
    general_assistance: [0, 0]
    tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    has_cooling_expense: [true, true]
  output:
    ne_liheap_income_eligible: [true, true]
    ne_liheap_cooling_eligible: [false, true]

# Two mothers receiving ADC of 55% x $897 = $493.35 a month, about $5,920 a year, for
# themselves and one child. The child aged 5 qualifies the household; the child aged 6 does not.
- name: Case 2, a child under 6 receiving ADC qualifies the household and a child aged 6 does not.
  period: 2026
  input:
    people:
      person1:
        age: 28
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
      person2:
        age: 5
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
      person3:
        age: 28
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
      person4:
        age: 6
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
    spm_units:
      spm_unit1:
        members: [person1, person2]
        tanf: 5_920
        heating_type: NATURAL_GAS
        has_cooling_expense: true
      spm_unit2:
        members: [person3, person4]
        tanf: 5_920
        heating_type: NATURAL_GAS
        has_cooling_expense: true
    households:
      household1:
        members: [person1, person2]
        state_code: NE
      household2:
        members: [person3, person4]
        state_code: NE
  output:
    ne_liheap_income_eligible: [true, true]
    ne_liheap_cooling_eligible: [true, false]

# A mother earning $15 an hour for 20 hours a week ($15,600 a year) with a 3-year-old who does
# not receive ADC.
- name: Case 3, a young child without ADC does not qualify the household.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 15_600
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
      person2:
        age: 3
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
        heating_type: NATURAL_GAS
        has_cooling_expense: true
    households:
      household:
        members: [person1, person2]
        state_code: NE
  output:
    ne_liheap_income_eligible: true
    ne_liheap_cooling_eligible: false

# A 45-year-old receiving $1,200 a month of Social Security disability. 476 NAC 2-003 has no
# disability route; route (C) needs a medical statement of a heat-aggravated condition.
- name: Case 4, disability alone does not qualify the household.
  period: 2026
  input:
    state_code: NE
    age: 45
    is_disabled: true
    social_security_disability: 14_400
    ssi: 0
    ne_aabd: 0
    general_assistance: 0
    tanf: 0
    heating_type: NATURAL_GAS
    has_cooling_expense: true
  output:
    ne_liheap_income_eligible: true
    ne_liheap_cooling_eligible: false

# A citizen earning $15,600 lives with an undocumented 74-year-old parent. 476 NAC 2-002.02
# excludes the parent from the household, so no qualifying member remains.
- name: Case 5, an excluded noncitizen member cannot qualify the household.
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 15_600
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
      person2:
        age: 74
        immigration_status: UNDOCUMENTED
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
        heating_type: NATURAL_GAS
        has_cooling_expense: true
    households:
      household:
        members: [person1, person2]
        state_code: NE
  output:
    ne_liheap_household_size: 1
    ne_liheap_income_eligible: true
    ne_liheap_cooling_eligible: false
