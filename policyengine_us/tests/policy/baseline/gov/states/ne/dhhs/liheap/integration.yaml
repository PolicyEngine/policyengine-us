- name: Case 5, student child earnings are excluded until age eighteen.
  period: 2026
  input:
    people:
      person1:
        age: 17
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
        is_in_k12_school: true
        employment_income: 30_000
      person2:
        age: 18
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
        is_in_k12_school: true
        employment_income: 10_000
    spm_units:
      spm_unit:
        members: &id005
        - person1
        - person2
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: *id005
        state_code: NE
  output:
    ne_liheap_household_size: 2
    ne_liheap_earned_income: 10_000
    ne_liheap_gross_income: 10_000
    ne_liheap_fpg: 21_150
    ne_liheap: 700
- name: Case 6, ineligible immigrant is excluded from size and their income is prorated.
  period: 2026
  input:
    people:
      person1:
        age: 35
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
        employment_income: 10_000
      person2:
        age: 35
        ssi: 0
        ne_aabd: 0
        general_assistance: 0
        immigration_status: UNDOCUMENTED
        employment_income: 10_000
        interest_income: 1_000
    spm_units:
      spm_unit:
        members: &id006
        - person1
        - person2
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
    households:
      household:
        members: *id006
        state_code: NE
  output:
    ne_liheap_household_size: 1
    ne_liheap_earned_income: 15_000
    ne_liheap_gross_income: 15_500
    ne_liheap_fpg: 15_650
    ne_liheap_income_eligible: true
    ne_liheap: 550
