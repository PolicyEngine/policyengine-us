- name: Case 1, urban center infant base full-day rate is applied per attending day.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    ne_child_care_subsidy_age_group: INFANT
    ne_child_care_subsidy_location: URBAN
    childcare_attending_days_per_month: 2
    ne_child_care_subsidy_provider_eligible: true
    ne_child_care_subsidy_provider_type: CENTER
    ne_child_care_subsidy_quality_tier: BASE
    ne_child_care_subsidy_rate_unit: FULL_DAY
    state_code: NE
  output:
    # $66.35 full-day rate * 2 attending days.
    ne_child_care_subsidy_maximum_provider_rate: 132.70

