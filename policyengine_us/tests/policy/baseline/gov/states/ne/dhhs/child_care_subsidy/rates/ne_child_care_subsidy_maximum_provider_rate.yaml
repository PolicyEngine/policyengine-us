  output:
    ne_child_care_subsidy_maximum_provider_rate: 110

- name: Case 10, a person who is not an eligible child yields a zero rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NE
  output:
    ne_child_care_subsidy_maximum_provider_rate: 0

- name: Case 11, one in-home provider base is allocated across three children.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      child1:
        ne_child_care_subsidy_authorized_weekly_hours: 40
        ne_child_care_subsidy_provider_eligible: true
        ne_child_care_subsidy_provider_type: LICENSE_EXEMPT_IN_HOME
        ne_child_care_subsidy_rate_unit: HOUR
      child2:
        ne_child_care_subsidy_authorized_weekly_hours: 40
        ne_child_care_subsidy_provider_eligible: true
        ne_child_care_subsidy_provider_type: LICENSE_EXEMPT_IN_HOME
        ne_child_care_subsidy_rate_unit: HOUR
      child3:
        ne_child_care_subsidy_authorized_weekly_hours: 40
        ne_child_care_subsidy_provider_eligible: true
        ne_child_care_subsidy_provider_type: LICENSE_EXEMPT_IN_HOME
        ne_child_care_subsidy_rate_unit: HOUR
    spm_units:
      spm_unit:
        members: [child1, child2, child3]
    households:
      household:
        members: [child1, child2, child3]
        state_code: NE
  output:
    # One $2,340 monthly provider base divided among three children.
    ne_child_care_subsidy_maximum_provider_rate: [780, 780, 780]

