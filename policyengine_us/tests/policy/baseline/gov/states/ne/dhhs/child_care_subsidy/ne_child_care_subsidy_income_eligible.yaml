  period: 2026-01
  input:
    ne_child_care_subsidy_categorical_waived: true
    ne_child_care_subsidy_countable_income: 100_000
    state_code: NE
  output:
    ne_child_care_subsidy_income_eligible: true

- name: Case 10, LB304 preserves 185 percent FPL after the repealed sunset.
  # LB304 was approved April 14, 2026 and removed the October 1, 2026
  # reversion; January 2027 is the first YAML-supported month fully after it.
  period: 2027-01
  input:
    ne_child_care_subsidy_countable_income: 1_500
    ne_child_care_subsidy_fpg: 1_000
    state_code: NE
  output:
    # 150% FPL remains below the 185% initial limit, but exceeds the repealed
    # 130% limit.
    ne_child_care_subsidy_income_eligible: true

- name: Case 11, January uses the prior October FPG vintage.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 30
      child:
        age: 8
    spm_units:
      spm_unit:
        members: [adult, child]
    households:
      household:
        members: [adult, child]
        state_code: NE
  output:
    # The 2025 two-person annual guideline is $21,150.
    ne_child_care_subsidy_fpg: 1_762.5

- name: Case 12, the post-October period uses the current FPG vintage.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      adult:
        age: 30
      child:
        age: 8
    spm_units:
      spm_unit:
        members: [adult, child]
    households:
      household:
        members: [adult, child]
        state_code: NE
  output:
    # The 2026 two-person annual guideline is $21,640.
    ne_child_care_subsidy_fpg: 1_803.33

