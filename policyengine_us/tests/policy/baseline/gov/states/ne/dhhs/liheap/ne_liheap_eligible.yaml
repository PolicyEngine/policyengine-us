# Source: Nebraska FY2026 LIHEAP Guidance, income guidelines and heating payment table.
# https://dhhs.ne.gov/Documents/Low%20Income%20Home%20Energy%20Assistance%20Program%20%28LIHEAP%29%20Guidance%20Document%202026.pdf#page=1,2

- name: Case 1, direct heating bill establishes energy responsibility.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    heating_type: NATURAL_GAS
    gas_expense: 100
  output:
    ne_liheap_eligible: true
- name: Case 2, heat in rent qualifies with zero separate heating expense under the vulnerability assumption.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    heat_expense_included_in_rent: true
    heating_type: UNSPECIFIED
    heating_expense: 0
    pre_subsidy_rent: 10_000
  output:
    ne_liheap_eligible: true
- name: Case 3, heat in rent does not bypass the income test.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: false
    heat_expense_included_in_rent: true
    heating_type: UNSPECIFIED
    heating_expense: 0
  output:
    ne_liheap_eligible: false
- name: Case 4, another state receives no Nebraska benefit.
  period: 2026
  input:
    state_code: KS
    ne_liheap_income_eligible: true
    heating_type: NATURAL_GAS
    gas_expense: 100
  output:
    ne_liheap_eligible: false
    ne_liheap: 0

- name: Case 5, no reported heating responsibility remains ineligible.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    heat_expense_included_in_rent: false
    heating_type: UNSPECIFIED
    heating_expense: 0
  output:
    ne_liheap_eligible: false
    ne_liheap: 0

# Cases 6-9: FY2026 state plan section 2.3. Renters in subsidized housing must
# be responsible for a portion of the heating payment; market-rate renters with
# heat included in rent are accepted under the documented modeling assumption.
# https://dhhs.ne.gov/Documents/LIHEAP%20State%20Plan.pdf#page=9
- name: Case 6, housing-assisted renter with heat in rent and no heating bill is ineligible.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    receives_housing_assistance: true
    heat_expense_included_in_rent: true
    heating_type: NATURAL_GAS
    gas_expense: 0
  output:
    # The matching gas bill is zero, so no portion of the heating is paid.
    heating_expense: 0
    ne_liheap_eligible: false
    ne_liheap: 0

- name: Case 7, public housing tenant with heat in rent and no heating bill is ineligible.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    is_in_public_housing: true
    heat_expense_included_in_rent: true
    heating_type: UNSPECIFIED
  output:
    # An unspecified fuel has no matching bill.
    heating_expense: 0
    ne_liheap_eligible: false
    ne_liheap: 0

- name: Case 8, housing-assisted renter who pays part of the heating cost is eligible.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    receives_housing_assistance: true
    heat_expense_included_in_rent: true
    heating_type: NATURAL_GAS
    gas_expense: 420
  output:
    # A $35 monthly gas charge on top of rent: 35 * 12 = 420.
    heating_expense: 420
    ne_liheap_eligible: true

- name: Case 9, market-rate renter with heat in rent and no heating bill stays eligible.
  period: 2026
  input:
    state_code: NE
    ne_liheap_income_eligible: true
    receives_housing_assistance: false
    is_in_public_housing: false
    heat_expense_included_in_rent: true
    heating_type: UNSPECIFIED
    pre_subsidy_rent: 9_600
  output:
    heating_expense: 0
    ne_liheap_eligible: true
