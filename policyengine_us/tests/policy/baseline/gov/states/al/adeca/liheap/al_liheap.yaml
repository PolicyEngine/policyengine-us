# FY2026 plan p10: the funded IIJA supplement is $100 for each regular heating award.
# The draft FY2027 plan drops it, so it is $0 from October 1, 2026.
# Manual pp22,57: subtract one monthly HUD allowance from the regular award.
# Interpret the supplement as requiring a positive regular payment afterward;
# the plan does not expressly address a regular payment reduced to zero.
# The discretionary high-need award requires an unobserved agency determination.

- name: Case 1, the funded supplement is added without capping the award at a small bill.
  period: 2026
  input:
    state_code: AL
    age: 40
    immigration_status: CITIZEN
    employment_income: 6_000
    ssi: 0
    al_tanf: 0
    heating_type: PROPANE
    heating_expense: 50
    hud_utility_allowance: 0
  output:
    al_liheap_base_payment: 500
    al_liheap: 600

# Four-person electricity, $1,000 monthly income: Appendix D gives $470.
# The funded $100 is per household; age/disability do not award an automatic $50.
- name: Case 2, a family with several vulnerable members receives one funded supplement.
  period: 2026
  input:
    people:
      grandparent:
        age: 65
        immigration_status: CITIZEN
        is_disabled: true
        ssi: 0
      parent:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12_000
        ssi: 0
      child1:
        age: 12
        immigration_status: CITIZEN
        ssi: 0
      child2:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      family:
        members: [grandparent, parent, child1, child2]
        al_tanf: 0
        heating_type: ELECTRICITY
        heating_expense: 1_200
    households:
      household:
        members: [grandparent, parent, child1, child2]
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_base_payment: 470
    al_liheap: 570

# Annual HUD allowances below represent $0/$100/$439/$440/$450/$600 per month.
# The $440 electric base nets to $440/$340/$1/$0/$0/$0. Only the first three
# households receive the full $100 supplement under the accepted interpretation.
- name: Case 3, the supplement requires a positive regular payment after the HUD allowance.
  period: 2026
  input:
    state_code: [AL, AL, AL, AL, AL, AL]
    age: [40, 40, 40, 40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    employment_income: [6_000, 6_000, 6_000, 6_000, 6_000, 6_000]
    ssi: [0, 0, 0, 0, 0, 0]
    al_tanf: [0, 0, 0, 0, 0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY]
    heating_expense: [1_200, 1_200, 1_200, 1_200, 1_200, 1_200]
    hud_utility_allowance: [0, 1_200, 5_268, 5_280, 5_400, 7_200]
  output:
    al_liheap_base_payment: [440, 440, 440, 440, 440, 440]
    al_liheap: [540, 440, 101, 0, 0, 0]

# Unit 2 supplies a heating bill, so only the NONE heating type makes it ineligible.
- name: Case 4, the funded supplement cannot pay an income or heating or immigration ineligible household.
  period: 2026
  input:
    state_code: [AL, AL, AL]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, UNDOCUMENTED]
    employment_income: [23472.12, 6_000, 6_000]
    ssi: [0, 0, 0]
    al_tanf: [0, 0, 0]
    heating_type: [PROPANE, NONE, PROPANE]
    heating_expense: [1_200, 1_200, 1_200]
    hud_utility_allowance: [0, 0, 0]
  output:
    al_liheap_eligible: [false, false, false]
    al_liheap: [0, 0, 0]

# Size one, $1,000 monthly income gives the $450 gas base in Appendix D.
- name: Case 5, nonsubsidized heat in rent receives the funded award without a separate bill.
  period: 2026
  input:
    state_code: [AL, AL]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [12_000, 12_000]
    ssi: [0, 0]
    al_tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    heating_expense: [0, 0]
    heat_expense_included_in_rent: [true, true]
    receives_housing_assistance: [false, true]
    hud_utility_allowance: [0, 0]
  output:
    al_liheap: [550, 0]

- name: Case 6, the regular Alabama award remains restricted to Alabama in a mixed state population.
  period: 2026
  input:
    state_code: [AL, GA, FL]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    employment_income: [6_000, 6_000, 6_000]
    ssi: [0, 0, 0]
    al_tanf: [0, 0, 0]
    heating_type: [PROPANE, PROPANE, PROPANE]
    heating_expense: [1_200, 1_200, 1_200]
    hud_utility_allowance: [0, 0, 0]
  output:
    al_liheap: [600, 0, 0]

# Manual p18 counts "Government employee pensions (including military retirement pay)".
# Military retirement 24_000 > size-one limit 23_472 (1_956 x 12), so no regular award
# or supplement. Without the military pay, income 0 would have paid electricity 440 + 100 = 540.
- name: Case 7, military retirement pay above the income limit means no award.
  period: 2026
  input:
    state_code: AL
    age: 62
    immigration_status: CITIZEN
    military_retirement_pay: 24_000
    ssi: 0
    al_tanf: 0
    heating_type: ELECTRICITY
    pre_subsidy_electricity_expense: 1_200
    hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 24_000
    al_liheap_income_limit: 23_472
    al_liheap_eligible: false
    al_liheap: 0

# Manual p17 counts cash receipts from all sources, so the rental loss is floored at zero:
# max(24_000, 0) wages + max(-3_000, 0) rent = 24_000 > 23_472 limit, so no award.
# Netting the loss would give 21_000 (1_750 per month, band 3) and electricity 440 - 120 + 100 = 420.
- name: Case 8, a rental loss does not bring wages under the income limit.
  period: 2026
  input:
    state_code: AL
    age: 40
    immigration_status: CITIZEN
    employment_income: 24_000
    rental_income: -3_000
    ssi: 0
    al_tanf: 0
    heating_type: ELECTRICITY
    pre_subsidy_electricity_expense: 1_200
    hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 24_000
    al_liheap_eligible: false
    al_liheap: 0

# Both units have $6,000 of wages, $500 a month, within the $1,956 size-one limit, and
# neither heating type is NONE, so both are eligible. Unit 1 pays a $1,200 fuel-oil bill;
# unit 2 has heat in unsubsidized rent with an unknown fuel (manual 6.1.3, p22).
# Manual 3.1 (p9) names electricity, natural gas, propane, wood, coal and kerosene, and
# Appendix D (p57) has no fuel-oil or unspecified column, so the chart amount is $0.
# The supplement requires a positive regular payment, so both awards are $0.
# See PolicyEngine/policyengine-us issue 9754 for the unspecified-fuel default.
- name: Case 9, eligible households with a fuel outside the chart receive no payment.
  period: 2026
  input:
    state_code: [AL, AL]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [6_000, 6_000]
    ssi: [0, 0]
    al_tanf: [0, 0]
    heating_type: [FUEL_OIL, UNSPECIFIED]
    fuel_oil_expense: [1_200, 0]
    heat_expense_included_in_rent: [false, true]
    receives_housing_assistance: [false, false]
    hud_utility_allowance: [0, 0]
  output:
    al_liheap_eligible: [true, true]
    al_liheap_base_payment: [0, 0]
    al_liheap: [0, 0]

# Period 2027 reads the values in force on January 1, 2027. With a one-year lag, the
# 2026 guideline is $15,960 for one person (draft FY2027 plan p9): 15,960 x 1.5 / 12
# = 1,995, or 23,940 a year. Band 1 runs to floor(1,995 / 3 + 0.5) = 665, the plan's
# "$0 - $665"; wages of 6,000 / 12 = 500 fall in band 1. Electricity: 440 - 0 = 440.
# The IIJA supplement is $0 from October 1, 2026, so the award is 440, not 540.
- name: Case 10, the IIJA supplement ends after FY2026.
  period: 2027
  input:
    state_code: AL
    age: 40
    immigration_status: CITIZEN
    employment_income: 6_000
    ssi: 0
    al_tanf: 0
    heating_type: ELECTRICITY
    pre_subsidy_electricity_expense: 1_200
    hud_utility_allowance: 0
  output:
    al_liheap_income_limit: 23_940
    al_liheap_income_band: 1
    al_liheap_base_payment: 440
    al_liheap: 440
