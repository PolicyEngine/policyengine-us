# Source: ADECA FY2026 manual and current Appendix D; requirement bindings in the test manifest.

# Plan p9/chart: monthly0,652,652.01,1305,1305.01,1956 map to1,1,2,2,3,3; fractional dollars do not create gaps.
- name: Case 1, one person band boundaries include exact tops and adjacent cents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [AL, AL, AL, AL, AL, AL]
    heating_type: [PROPANE, PROPANE, PROPANE, PROPANE, PROPANE, PROPANE]
    bottled_gas_expense: [1_200, 1_200, 1_200, 1_200, 1_200, 1_200]
    al_liheap_household_size: [1, 1, 1, 1, 1, 1]
    al_liheap_countable_income: [0, 7_824, 7824.12, 15_660, 15660.12, 23_472]
  output:
    al_liheap_income_band: [1, 1, 2, 2, 3, 3]


