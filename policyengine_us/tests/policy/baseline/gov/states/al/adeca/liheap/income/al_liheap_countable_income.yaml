# Manual p17 counts "total monthly cash receipts ... from all sources", so each source is floored at zero.
# max(6_000, 0) wages + max(-18_000, 0) self-employment = 6_000 + 0 = 6_000.
- name: Case 7, a business loss does not offset wages.
  period: 2026
  absolute_error_margin: 0.01
