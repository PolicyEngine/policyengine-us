    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 6_000
        self_employment_income: -18_000
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 6_000

