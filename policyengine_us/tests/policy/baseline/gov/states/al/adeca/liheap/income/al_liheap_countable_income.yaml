# Source: ADECA FY2026 LIHEAP Policy Manual and its Appendix D Payment Assistance Chart.

# Manual pp17–18: 12000 + 6000 + 600 + 2400 + 1800 = 22800; no additional business deduction.
- name: Case 1, adult wages and existing net business sources are counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 12_000
        self_employment_income: 6_000
        sstb_self_employment_income: 600
        farm_operations_income: 2_400
        partnership_s_corp_income: 1_800
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 22_800

# Manual pp17-19: earned income under 18 is excluded, but annual SSI of 2,400 and survivor benefits of 1,200 count: 12,000 + 2,400 + 1,200 = 15,600.
- name: Case 2, age 17 earned income follows the under eighteen boundary.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 12_000
      person2:
        age: 17
        immigration_status: CITIZEN
        ssi: 2_400
        employment_income: 6_000
        self_employment_income: 2_400
        survivor_benefits: 1_200
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        - person2
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 15_600

