# Manual p17 counts "total monthly cash receipts ... from all sources", so each source is floored at zero.
# max(6_000, 0) wages + max(-18_000, 0) self-employment = 6_000 + 0 = 6_000.
- name: Case 7, a business loss does not offset wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 6_000
        self_employment_income: -18_000
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 6_000

