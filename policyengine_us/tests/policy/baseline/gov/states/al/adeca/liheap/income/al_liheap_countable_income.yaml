    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 1_200
      person2:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        heating_type: PROPANE
        al_tanf: 3_600
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        - person2
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 4_800

