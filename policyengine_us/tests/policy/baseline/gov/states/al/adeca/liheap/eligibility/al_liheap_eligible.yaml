# Manual 6.1.1 (p21): "Subsidized housing tenants whose home energy costs are included in
# their rent and do not pay anything out-of-pocket are not eligible for assistance."
# Unit 1 lives in public housing with heat in rent and a $0 bill, so it is not responsible
# for heat. Unit 2 has heat in unsubsidized rent, so it qualifies (6.1.3, p22):
# 12,000 / 12 = 1,000 falls in the size-one band 2 ($653-$1,305), and electricity
# 440 - 30 = 410, plus the $100 IIJA supplement, is 510.
- name: Case 11, public housing with heat in rent and no out-of-pocket cost is ineligible.
  period: 2026
  input:
    state_code: [AL, AL]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [12_000, 12_000]
    ssi: [0, 0]
    al_tanf: [0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [0, 0]
    heat_expense_included_in_rent: [true, true]
    receives_housing_assistance: [false, false]
    is_in_public_housing: [true, false]
    hud_utility_allowance: [0, 0]
  output:
    al_liheap_eligible: [false, true]
    al_liheap: [0, 510]
