# Source: ADECA FY2026 LIHEAP Policy Manual and its Appendix D Payment Assistance Chart.

# Manual p21: the $1,956 monthly limit is inclusive; the accepted plan has no asset test.
- name: Case 1, exact rounded monthly income ceiling is eligible without an asset test.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 23_472
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
        spm_unit_assets: 1_000_000
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_eligible: true

# $1,956.01 a month exceeds the published $1,956 limit.
- name: Case 2, one cent per month above the income ceiling is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 23472.12
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_eligible: false

