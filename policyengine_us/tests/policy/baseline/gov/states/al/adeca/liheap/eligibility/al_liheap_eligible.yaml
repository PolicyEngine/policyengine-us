# Manual pp21–22: positive primary heating charge approximates a verified public-housing excess charge.
- name: Case 7, reported primary heating excess charge restores public housing eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members:
        - person1
        heating_type: ELECTRICITY
        al_tanf: 0
        pre_subsidy_electricity_expense: 120
        heat_expense_included_in_rent: true
    households:
      household:
        members:
        - person1
        state_code: AL
        hud_utility_allowance: 0
        is_in_public_housing: true
  output:
    al_liheap_eligible: true

# The accepted plan answers No to categorical eligibility (item 1.4, p5), so SSI receipt
# does not waive the income test. The full 2026 SSI federal rate is $994 a month
# (90 FR 49047): 994 x 12 = 11,928. Two adult children each work full time at the $7.25
# federal minimum wage (29 U.S.C. 206(a)(1)(C); Alabama has none): 2,080 x 7.25 = 15,080.
# al_ssp is 0 under the default NONE care setting. Income 11,928 + 15,080 + 15,080 = 42,088.
# Size-3 limit: (15,650 + 2 x 5,500) x 1.5 / 12 = 3,331.25, rounded to 3,331, x 12 = 39,972.
# 42,088 > 39,972, so the household is ineligible; without the SSI, 30,160 would qualify.
- name: Case 8, SSI receipt does not bypass the income ceiling.
  period: 2026
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        ssi: 11_928
      person2:
        age: 42
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 15_080
      person3:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 15_080
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
        heating_type: PROPANE
        al_tanf: 0
        bottled_gas_expense: 1_200
    households:
      household:
        members:
        - person1
        - person2
        - person3
        state_code: AL
        hud_utility_allowance: 0
  output:
    al_liheap_countable_income: 42_088
    al_liheap_income_limit: 39_972
    al_liheap_eligible: false

