# The printed Wood/Coal/Kerosene column applies to all three distinct canonical enum values.
- name: Case 2, wood coal and kerosene share the printed fuel column.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [AL, AL, AL]
    heating_type: [WOOD, COAL, KEROSENE]
    bottled_gas_expense: [1_200, 1_200, 1_200]
    al_liheap_household_size: [1, 1, 1]
    al_liheap_income_band: [1, 2, 3]
    wood_expense: [1_200, 1_200, 1_200]
    coal_expense: [1_200, 1_200, 1_200]
    fuel_oil_expense: [1_200, 1_200, 1_200]
  output:
    al_liheap_base_payment: [400, 370, 280]


