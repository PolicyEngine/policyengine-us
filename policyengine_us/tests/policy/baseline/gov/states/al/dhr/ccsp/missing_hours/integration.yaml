        employment_income: 37290
        immigration_status: CITIZEN
        weekly_hours_worked: 40
        childcare_hours_per_week: 0
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
      person2:
        age: 28
        weekly_hours_worked: 40
        childcare_hours_per_week: 0
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
        pre_subsidy_childcare_expenses: 0
      person3:
        age: 4
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_week: 0
        al_ccsp_provider_type: CENTER
        al_ccsp_quality_tier: STAR_3
        pre_subsidy_childcare_expenses: 0
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        - person3
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
        spm_unit_pre_subsidy_childcare_expenses: 0
        al_ccsp_enrolled: false
    households:
      household:
        members:
        - person1
        - person2
        - person3
        state_code: AL
        county_str: JEFFERSON_COUNTY_AL
  output:
