# Tests for Alabama UI maximum benefit weeks (Code of Alabama § 25-4-74(a)).
# Weeks = 14 + one week per completed 0.5-percentage-point increment of the
# state unemployment rate above 6.5%, capped at 20 weeks once the rate reaches
# 9.5%. The single_amount bracket lower bounds give >= semantics, so each week
# tier begins exactly at its threshold (>= 6.5% -> 14, >= 7.0% -> 15, ...,
# >= 9.5% -> 20) and holds until the next 0.5pp threshold is reached.
# Bracket behavior is covered at the statutory floor, each threshold, and a
# just-below point inside each interior tier (confirming the increment only
# advances at completed 0.5pp steps), plus the cap. Other benefit-flow tests
# exercise the natural 2024 ALUR baseline.

- name: Case 1, UR at 6.5 percent gets 14 weeks.
  period: 2024
  input:
    gov.states.al.dol.unemployment_insurance.state_unemployment_rate: 0.065
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    people:
      person1:
        al_ui_max_weeks: 14

- name: Case 2, UR 6.6 percent (below the 7.0 percent step) stays at 14 weeks.
  period: 2024
  input:
    gov.states.al.dol.unemployment_insurance.state_unemployment_rate: 0.066
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    people:
      person1:
        # 6.6% is above 6.5% but has not completed the first 0.5pp step
        # (7.0%), so weeks remain at the 14-week floor.
        al_ui_max_weeks: 14

