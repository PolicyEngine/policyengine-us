# Tests for Alabama UI maximum benefit weeks (Code of Alabama § 25-4-74(a)).
# Bracket behavior is covered at the statutory floor, first increment, every
# middle bracket boundary (just-below/just-at pairs for the 16-, 17-, 18-, 19-,
# and 20-week thresholds), and the cap. Other benefit-flow tests exercise the
# natural 2024 ALUR baseline.

- name: Case 1, UR at 6.5 percent gets 14 weeks.
  period: 2024
  input:
    gov.states.al.dol.unemployment_insurance.state_unemployment_rate: 0.065
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    people:
      person1:
        al_ui_max_weeks: 14

