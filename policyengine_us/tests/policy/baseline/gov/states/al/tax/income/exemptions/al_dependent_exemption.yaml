# Ala. Code 40-18-19(a)(9)b-e: $1,000 for AGI "equal to or less than" $20,000
# (2007-2021) or $50,000 (2022 on); $500 for AGI "in excess of" that and
# "equal to or less than" $100,000; $300 above. The Form 40 booklet charts read
# 0 - 20,000 / 20,001 - 100,000 (2021) and 0 - 50,000 / 50,001 - 100,000
# / Over 100,000 (2025), each on PDF p. 10.
- name: 2021 Alabama dependent exemption is $1,000 at exactly $20,000 of AGI
  period: 2021
  input:
    state_code: AL
    al_agi: 20_000
    tax_unit_dependents: 1
  output:
    al_dependent_exemption: 1_000

- name: 2021 Alabama dependent exemption is $500 just over $20,000 of AGI
  period: 2021
  input:
    state_code: AL
    al_agi: 20_001
    tax_unit_dependents: 1
  output:
    al_dependent_exemption: 500

