- name: Alabama public pension is deducted from AGI
  period: 2024
  input:
    people:
      person1:
        irs_employment_income: 50_000
        taxable_public_pension_income: 20_000
        age: 65
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    al_agi: 50_000
    al_retirement_exemption_person: 0

- name: Alabama public pension does not consume private retirement exemption cap
  period: 2024
  input:
    people:
      person1:
        irs_employment_income: 50_000
        taxable_public_pension_income: 20_000
        taxable_private_pension_income: 10_000
        age: 65
        al_retirement_exemption_eligible_person: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    al_retirement_exemption_person: 6_000
    al_agi: 54_000  # 60,000 (after 20k public pension deduction) - 6,000 retirement exemption
