- name: Alabama AGI includes modeled federal deductions the state still allows
  period: 2025
  input:
    state_code: AL
    irs_employment_income: 1_000
    early_withdrawal_penalty: 50
    health_savings_account_ald: 150
    self_employed_pension_contribution_ald: 100
  output:
    al_agi: 700

- name: SSTB self-employment income is included in Alabama AGI
  period: 2024
  input:
    sstb_self_employment_income: 100_000
    state_code: AL
  output:
    al_agi: 100_000

- name: Taxable Roth conversions are included in Alabama AGI and income tax
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        taxable_roth_conversions: 10_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    al_agi: 60_000
    al_income_tax: 2_442.75

- name: A dependent's self-employed health insurance and plan deductions follow their income into Alabama AGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
        self_employed_pension_contributions: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: AL
  output:
    # Alabama AGI sums every member's income, so it counts the child's 10,000
    # of Schedule C income and subtracts the child's own self-employed health
    # insurance (1,000) and SEP (500) deductions: 50,000 - 1,500. The federal
    # AGI leaves all of them on the child's return.
    adjusted_gross_income: 40_000
    al_agi: 48_500

- name: Alabama taxes gambling winnings.
  absolute_error_margin: 0.01
  period: 2026
  input:
    irs_employment_income: 50_000
    gambling_winnings: 20_000
    gambling_losses: 12_000
    state_code: AL
  output:
    al_agi: 70_000
