# Ala. Code 40-18-15(a)(6) allows casualty and theft losses "as determined in
# accordance with subsections (c)(3) and (h) of 26 U.S.C. § 165", and 40-18-1.1
# defines "26 U.S.C." as the Internal Revenue Code "as in effect from time to
# time". The 2025 Form 40 instructions (PDF p. 20): "A casualty or theft loss
# is determined in the same manner as on your federal return" except that "The
# loss on personal property must be reduced by 10% of the Alabama adjusted
# gross income"; Schedule A line 19a takes the loss from federal Form 4684, after
# its $100 reduction (line 11) and, from 2018, its limit to losses attributable
# to declared disasters (26 U.S.C. 165(h)(5)). The Department of Revenue's
# OBBBA Executive Summary (PDF p. 8) lists 165(h)(5) as "Tied to Federal: Yes"
# through 40-18-15(a)(6). The model has no input that
# distinguishes disaster losses; like the federal deduction, it allows no
# personal casualty loss from 2018 unless
# gov.irs.deductions.itemized.casualty.active is switched on.
# A joint return is one individual for the $100 rule (26 U.S.C. 165(h)(4)(B)).
# The model records one loss amount per person, so a return's losses are
# treated as one casualty.

- name: Reduction of casualty loss
  period: 2017
  input:
    state_code: AL
    casualty_loss: 2_000
    al_agi: 1_000
  output:
    # (2,000 - 100) - 10% x 1,000 = 1,900 - 100
    al_casualty_loss_deduction: 1_800

- name: Capped at 0
  period: 2017
  input:
    state_code: AL
    casualty_loss: 1_000
    al_agi: 11_000
  output:
    # (1,000 - 100) - 10% x 11,000 = 900 - 1,100, below zero
    al_casualty_loss_deduction: 0

- name: Case 3, a loss not attributable to a declared disaster is not deductible from 2018.
  period: 2021
  input:
    state_code: AL
    casualty_loss: 2_000
    al_agi: 1_000
  output:
    al_casualty_loss_deduction: 0

- name: Case 4, a loss of exactly $100 is fully absorbed by the $100 reduction.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 100
    al_agi: 0
  output:
    # max(100 - 100, 0) - 10% x 0
    al_casualty_loss_deduction: 0

- name: Case 5, a loss of $101 leaves $1 after the $100 reduction.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 101
    al_agi: 0
  output:
    al_casualty_loss_deduction: 1

- name: Case 6, a loss under $100 is not deductible.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 60
    al_agi: 0
  output:
    al_casualty_loss_deduction: 0

- name: Case 7, the 10 percent floor on Alabama AGI applies after the $100 reduction.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 5_000
    al_agi: 20_000
  output:
    # (5,000 - 100) - 10% x 20,000 = 4,900 - 2,000
    al_casualty_loss_deduction: 2_900

- name: Case 8, a joint return reduces the spouses' pooled losses by $100 once.
  period: 2017
  input:
    people:
      person1:
        age: 40
        casualty_loss: 1_500
      person2:
        age: 40
        casualty_loss: 1_500
    tax_units:
      tax_unit:
        members: [person1, person2]
        al_agi: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: AL
  output:
    # (1,500 + 1,500 - 100) - 10% x 10,000 = 2,900 - 1,000
    al_casualty_loss_deduction: 1_900

- name: Case 9, a dependent's loss is left to the dependent's own return.
  period: 2017
  input:
    people:
      person1:
        age: 40
        casualty_loss: 3_000
      person2:
        age: 10
        casualty_loss: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        al_agi: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: AL
  output:
    is_tax_unit_dependent: [false, true]
    # The child's 2,000 is not the parent's loss.
    # (3,000 - 100) - 10% x 10,000 = 2,900 - 1,000
    al_casualty_loss_deduction: 1_900

- name: Case 10, a negative Alabama AGI gives no floor.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 300
    al_agi: -1_000
  output:
    # The loss after the $100 reduction is the most that can be deducted.
    al_casualty_loss_deduction: 200

- name: Case 11, a reform that restores the federal deduction flows to Alabama.
  period: 2025
  input:
    gov.irs.deductions.itemized.casualty.active: true
    state_code: AL
    casualty_loss: 5_000
    al_agi: 20_000
  output:
    # (5,000 - 100) - 10% x 20,000 = 4,900 - 2,000
    al_casualty_loss_deduction: 2_900

- name: Case 12, a negative Alabama AGI with no loss gives no deduction.
  period: 2017
  input:
    state_code: AL
    casualty_loss: 0
    al_agi: -10_000
  output:
    # Nothing to deduct: max(0 - 100, 0) = 0, whatever the AGI.
    al_casualty_loss_deduction: 0
