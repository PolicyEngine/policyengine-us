- name: AL includes US government bond interest in AGI deductions
  period: 2024
  input:
    state_code: AL
    interest_income: 10_000
    us_govt_interest_person: 5_000
  output:
    al_agi: 5_000

- name: A dependent's interest, U.S. government interest included, stays off the filer's AGI
  # Neither the child's interest nor its exemption is on the filer's return;
  # us_govt_interest counts only the head's and spouse's.
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 100_000
      child:
        age: 10
        taxable_interest_income: 5_000
        us_govt_interest_person: 5_000
    household:
      state_code: AL
  output:
    al_agi: 100_000
