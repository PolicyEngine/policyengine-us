# Alabama Federal Income Tax Deduction Worksheet (2021 Form 40 booklet, page 20).
# Part I subtracts the actual refundable federal credits; Part II, added by Act
# 2022-37 (HB 231), recomputes the CTC, CDCC, and EITC as if the IRC in effect
# on 2020-12-31 applied and takes the greater deduction.

- name: 2021 head of household, one child - Part II (2020 recompute) is larger
  # taxsim #1184 / PE-US #9487: wages 104,762, child care 12,992. The 2021 CTC
  # is fully refundable ($3,000), so Part I subtracts $3,000; Part II instead
  # subtracts the 2020-rule non-refundable CTC ($2,000) and CDCC ($600) = $2,600,
  # a $400 larger deduction. The Alabama worksheet gives $10,622 on a federal
  # tax of $13,222; PolicyEngine's federal tax is $13,207.64, so the deduction
  # is $10,607.64 (= 13,207.64 - 2,600).
  absolute_error_margin: 1
  period: 2021
  input:
    people:
      head:
        age: 45
        employment_income: 104_762
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        tax_unit_childcare_expenses: 12_992
    households:
      household:
        members: [head, child]
        state_code: AL
  output:
    al_federal_income_tax_deduction: 10_607.64

- name: 2022 head of household, one child - Part I is larger (no ARPA expansion)
  # In 2022 the CTC/CDCC are back to their 2020-style rules, so Part II gives no
  # advantage and the greater-of picks Part I (federal tax with no refundable
  # credits to subtract): deduction equals federal tax before refundable credits.
  absolute_error_margin: 1
  period: 2022
  input:
    people:
      head:
        age: 45
        employment_income: 104_762
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        tax_unit_childcare_expenses: 12_992
    households:
      household:
        members: [head, child]
        state_code: AL
  output:
    al_federal_income_tax_deduction: 10_296.64

- name: 2021 childless filer - no recomputed credits, deduction is federal tax
  # With no qualifying children or child-care expenses and income too high for
  # the EITC, both parts subtract nothing, so the deduction is the federal tax
  # before refundable credits.
  absolute_error_margin: 1
  period: 2021
  input:
    employment_income: 80_000
    state_code: AL
  output:
    al_federal_income_tax_deduction: 10_587.5

- name: Capped at 0
  period: 2021
  input:
    income_tax_before_refundable_credits: 100
    net_investment_income_tax: 200
    eitc: 200
    american_opportunity_credit: 200
    state_code: AL
  output:
    al_federal_income_tax_deduction: 0
