- name: Case 1, household income with age and dependent subtractions.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 66
        is_tax_unit_head: true
      person2:
        is_tax_unit_dependent: true
      person3:
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: MN
  output:
    mn_renters_credit_household_income: 30_760

- name: Case 2, separate filer household income includes spouse separate AGI proxy.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SEPARATE
        adjusted_gross_income: 40_000
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_renters_credit_household_income: 80_000

- name: Case 3, another adult's income is not the renter's household income.
  # Minn. Stat. 290.0693, subd. 1(g) takes "household" from 290A.03, subd. 4:
  # "a claimant and an individual related to the claimant as the claimant's
  # spouse who are domiciled in the same homestead". 290.0693, subd. 7: "If a
  # homestead is occupied by two or more renters who are not married to each
  # other ... The income of each renter shall be each renter's household
  # income". 2025 Schedule M1RENT instructions (PDF page 3), "Lived with a
  # roommate": "Include only your income when filing for the credit."
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 66
        employment_income: 10_000
        is_tax_unit_head: true
      person2:
        age: 40
        employment_income: 60_000
        is_tax_unit_head: true
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # person1: 10,000 - 5,200 (age 65 or older, subd. 1(i)(6)) = 4,800.
    # person2: 60,000.
    mn_renters_credit_household_income: [4_800, 60_000]
