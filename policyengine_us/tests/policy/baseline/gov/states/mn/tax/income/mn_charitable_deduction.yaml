# Minn. Stat. 290.0122, subd. 4, effective for taxable years beginning after December 31, 2025.
# https://www.revisor.mn.gov/laws/2026/0/Session+Law/Chapter/128/
# https://www.revenue.state.mn.us/sites/default/files/2026-11/m1sa-26.pdf#page=1

# The filer deducts max(750 - 1,000, 0) = 0 in Minnesota and subtracts max(0 - 500, 0) / 2 = 0.
- name: A non-itemizer gives 750 with 100,000 of income in 2026
  absolute_error_margin: 0.02
  period: 2026
  input:
    adjusted_gross_income: 100_000
    charitable_cash_donations: 750
    mn_itemizing: false
    filing_status: SINGLE
    state_code: MN
  output:
    charitable_deduction_before_floor: 750
    charitable_deduction: 250
    mn_charitable_deduction: 0
    mn_charity_subtraction: 0.0

