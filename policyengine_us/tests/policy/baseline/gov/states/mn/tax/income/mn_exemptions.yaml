- name: MN exemptions unit test 1
  period: 2021
  input:
    filing_status: JOINT
    tax_unit_dependents: 2
    adjusted_gross_income: 299_750
    state_code: MN
  output:
    mn_exemptions: 2 * 4_350

- name: MN exemptions unit test 2
  period: 2021
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    tax_unit_dependents: 3
    adjusted_gross_income: 249_800 + 4.4 * 2_500
    state_code: MN
  output:
    mn_exemptions: 3 * 4_350 - 5 * 0.02 * (3 * 4_350)

- name: MN exemptions unit test 3
  period: 2022
  input:
    filing_status: JOINT
    tax_unit_dependents: 4
    adjusted_gross_income: 2_000_000
    state_code: MN
  output:
    mn_exemptions: 0  # complete high-AGI reduction of exemptions

# 2025 test case
# Joint filer with 2 dependents, AGI below threshold ($358,550)
# Exemption per dependent: $5,200
# Total: 2 * $5,200 = $10,400
- name: MN exemptions 2025 joint below threshold
  period: 2025
  input:
    filing_status: JOINT
    tax_unit_dependents: 2
    adjusted_gross_income: 300_000
    state_code: MN
  output:
    mn_exemptions: 10_400

- name: MN exemptions 2026 joint below threshold
  period: 2026
  input:
    filing_status: JOINT
    tax_unit_dependents: 2
    adjusted_gross_income: 300_000
    state_code: MN
  output:
    # Tax Year 2026 Inflation-Adjusted Amounts, page 1: dependent exemption $5,300.
    mn_exemptions: 2 * 5_300

- name: 2025 single filer who can be claimed as a dependent, dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, child]
    households:
      household:
        members: [person_a, child]
        state_code: MN
  output:
    # Minn. Stat. 290.0121: dependents "as defined in sections 151 and
    # 152"; a return with a claimable filer has none, and Form M1 says
    # to leave line 5 blank.
    mn_exemptions: 0

- name: 2025 joint return with one spouse who can be claimed, dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        employment_income: 5_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MN
  output:
    mn_exemptions: 0

- name: 2025 joint return with one spouse who can be claimed, dependent exemption (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 20
        employment_income: 5_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: MN
  output:
    mn_exemptions: 0

