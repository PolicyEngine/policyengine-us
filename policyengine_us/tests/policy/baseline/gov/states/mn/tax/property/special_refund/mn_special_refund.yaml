- name: Case 1, ordinary awards cap and exact growth thresholds follow Schedule M1PR-SR.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [MN, MN, MN, MN, MN, MN, MN, MN]
    age: [40, 40, 40, 40, 40, 40, 40, 40]
    mn_special_refund_current_property_taxes: [4_000, 10_000, 1_120, 1_121, 599, 600, 601, 1_205]
    mn_special_refund_prior_property_taxes: [3_000, 1_000, 1_000, 1_000, 500, 500, 500, 1_004]
    mn_special_refund_prior_refund: [0, 0, 0, 0, 0, 0, 0, 0]
    mn_special_refund_improvement_value: [0, 0, 0, 0, 0, 0, 0, 0]
    mn_special_refund_current_home_use_fraction: [1, 1, 1, 1, 1, 1, 1, 1]
    mn_special_refund_prior_home_use_fraction: [1, 1, 1, 1, 1, 1, 1, 1]
    mn_special_refund_same_homestead: [true, true, true, true, true, true, true, true]
    mn_special_refund_qualifying_claimant: [true, true, true, true, true, true, true, true]
  output:
