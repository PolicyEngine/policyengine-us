# Minn. Stat. 290.0122, subd. 8: losses under 26 U.S.C. 165(c)(3), "including
# the provisions of section 165(h) ... but disregarding paragraph (h)(5)".
# 2024 Schedule M1SA instructions, line 19 (PDF p. 7): a loss is deductible
# only to the extent each loss "is more than $100" and the year's losses
# "reduced by $100" are "more than 10% of the amount on line 1 of Form M1".
# 2024 Schedule M1CAT (PDF p. 1): line 11 "Enter $100"; line 18 "Enter the
# amount from line 1 of Form M1" (federal adjusted gross income); line 19
# "Multiply line 18 by 10%"; line 20 subtracts line 19 from line 17, not below
# 0, and goes to M1SA line 19. The 2018 M1CAT has the same $100 reduction and
# 10% floor; its line 20 goes to M1SA line 18, and its line 18 takes Schedule
# M1NC line 38 (federal adjustments) from filers of that schedule, which the
# model does not have. These cases are ordinary losses:
# the 2020 Schedule M1SA's net qualified disaster loss (federal Form 4684 line
# 15, $500 and no 10% floor) is not modeled.
# A joint return is one individual for the $100 rule (165(h)(4)(B)). The model
# records one loss amount per person, not separate casualty events, so a
# return's losses are treated as one casualty. A dependent's loss belongs on
# the dependent's own return, as the dependent's income does.

- name: Case 1, the $100 reduction applies before the 10 percent floor.
  period: 2024
  input:
    state_code: MN
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    # M1CAT: line 12 = 15,000 - 100 = 14,900; line 19 = 10% x 100,000
    # = 10,000; line 20 = 14,900 - 10,000.
    mn_casualty_loss_deduction: 4_900
    # Minnesota allows the loss though the federal deduction is suspended.
    casualty_loss_deduction: 0

- name: Case 2, a loss $100 above the floor nets to zero.
  period: 2024
  input:
    state_code: MN
    employment_income: 100_000
    casualty_loss: 10_100
  output:
    # (10,100 - 100) - 10% x 100,000 = 10,000 - 10,000
    mn_casualty_loss_deduction: 0

- name: Case 3, a loss $101 above the floor leaves $1.
  period: 2024
  input:
    state_code: MN
    employment_income: 100_000
    casualty_loss: 10_101
  output:
    # (10,101 - 100) - 10% x 100,000 = 10,001 - 10,000
    mn_casualty_loss_deduction: 1

- name: Case 4, a loss of exactly $100 is fully absorbed by the $100 reduction.
  period: 2024
  input:
    state_code: MN
    casualty_loss: 100
  output:
    mn_casualty_loss_deduction: 0

- name: Case 5, Publication 547 Example 1 with $80,000 of AGI.
  period: 2024
  input:
    state_code: MN
    employment_income: 80_000
    casualty_loss: 14_800
  output:
    # IRS Publication 547 (2017, PDF p. 10), Example 1: 14,800 - 100 = 14,700;
    # less 10% of 80,000 = 6,700.
    mn_casualty_loss_deduction: 6_700

- name: Case 6, a negative federal AGI gives no floor, not a larger loss.
  period: 2024
  input:
    state_code: MN
    adjusted_gross_income: -20_000
    casualty_loss: 15_000
  output:
    # M1CAT line 18 has no "enter 0" rule; the floor is held at zero so the
    # deduction never exceeds the reduced loss: 15,000 - 100.
    mn_casualty_loss_deduction: 14_900

- name: Case 7, a joint return reduces the spouses' pooled losses by $100 once.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        casualty_loss: 10_000
      person2:
        age: 40
        employment_income: 40_000
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    filing_status: JOINT
    # (10,000 + 5,000 - 100) - 10% x 100,000 = 14,900 - 10,000
    mn_casualty_loss_deduction: 4_900

- name: Case 8, a dependent's loss is left to the dependent's own return.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        casualty_loss: 15_000
      person2:
        age: 10
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    is_tax_unit_dependent: [false, true]
    # (15,000 - 100) - 10% x 100,000 = 14,900 - 10,000
    mn_casualty_loss_deduction: 4_900

- name: Case 9, a loss only the dependent had gives the parent nothing.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
      person2:
        age: 10
        casualty_loss: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    is_tax_unit_dependent: [false, true]
    mn_casualty_loss_deduction: 0

- name: Case 10, the 2018 Schedule M1CAT already allows a non-disaster loss.
  period: 2018
  input:
    state_code: MN
    employment_income: 50_000
    casualty_loss: 8_000
  output:
    # For a filer with no Schedule M1NC: (8,000 - 100) - 10% x 50,000
    # = 7,900 - 5,000
    mn_casualty_loss_deduction: 2_900
    casualty_loss_deduction: 0

- name: Case 11, the deduction is zero outside Minnesota.
  period: 2024
  input:
    state_code: WI
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    mn_casualty_loss_deduction: 0

- name: Case 12, lifting the federal suspension does not change Minnesota's deduction.
  period: 2024
  input:
    gov.irs.deductions.itemized.casualty.active: true
    state_code: MN
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    # Minnesota's deduction does not read the federal switch.
    mn_casualty_loss_deduction: 4_900
