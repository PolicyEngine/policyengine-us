# 2025 test case
# Single filer, AGI $100,000 (below reduction threshold of $238,950)
# Base deduction: $14,950
- name: 2025 MN standard deduction single below threshold
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: SINGLE
    aged_blind_count: 0
    adjusted_gross_income: 100_000
    state_code: MN
  output:
    mn_standard_deduction: 14_950

# 2026 amounts from the Minnesota DOR Tax Year 2026 Inflation-Adjusted Amounts,
# page 1: standard deduction $15,300 single, $30,600 married joint; additional
# amount for aged or blind $1,600 married, $2,000 single or head of household.
- name: 2026 MN standard deduction single below the reduction threshold
  absolute_error_margin: 0.01
  period: 2026
  input:
    filing_status: SINGLE
    aged_blind_count: 0
    adjusted_gross_income: 100_000
    state_code: MN
  output:
    mn_standard_deduction: 15_300

- name: 2026 MN standard deduction joint, both spouses aged
  absolute_error_margin: 0.01
  period: 2026
  input:
    filing_status: JOINT
    aged_blind_count: 2
    adjusted_gross_income: 100_000
    state_code: MN
  output:
    # 30,600 + 2 * 1,600 = 33,800
    mn_standard_deduction: 33_800

- name: 2025 joint return with one spouse who can be claimed, dependent standard deduction (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: MN
  output:
    # Form M1 Worksheet for Line 4 - Dependent Standard Deduction, used
    # "if someone can claim you, or your spouse if filing a joint
    # return": greater of $1,250 or earned income $2,000 + $350,
    # capped at $14,950.
    mn_standard_deduction: 2_350

- name: 2025 joint return with one spouse who can be claimed, dependent standard deduction (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: MN
  output:
    mn_standard_deduction: 2_350

