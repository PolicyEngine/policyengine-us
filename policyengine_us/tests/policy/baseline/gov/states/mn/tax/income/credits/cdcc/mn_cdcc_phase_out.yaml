# Isolated phaseout-cap component; the qualifying-person count and AGI are
# independently known premises, not a federal-credit eligibility calculation.
# 2017 1st Special Session chapter 1, article 1, sections 18-19: the
# $50,000 threshold and 5% reduction apply after December 31, 2016.
# https://www.revisor.mn.gov/laws/2017/1/1/
# $600 - ($51,000 - $50,000) * 0.05 = $550 remaining credit cap.
- name: Case 6, 2017 Minnesota dependent care phaseout uses its expanded income threshold.
  period: 2017
  absolute_error_margin: 0.01
  input:
    state_code: MN
    filing_status: SINGLE
    adjusted_gross_income: 51_000
    mn_cdcc_dependent_count: 1
  output:
    mn_cdcc_phase_out: 550

