# Minnesota Paid Leave premium, employer and employee sides (Minn. Stat.
# 268B.14). 2026 and 2027 premium rate 0.88% (DEED, subd. 7); the employer
# pays at least 50% (subd. 3). A small employer under subd. 5a (30 or fewer
# employees, average quarterly wage at most 150% * $73,989 / 4 = $27,745.875,
# which DEED's 2026 designation gives as $27,745.88) pays 75% of the rate,
# 0.66%, of which the employer pays at least 25% of the full rate, 0.22%.
# Employees pay at most 0.88% - 0.44% = 0.66% - 0.22% = 0.44% of taxable
# wages. Taxable wages are capped at the Social Security base rounded to the
# nearest $1,000 (268B.01, subd. 43): $184,500 rounds to $185,000 in 2026.

- name: A large employer that deducts the full permitted share pays half the premium.
  period: 2026
  input:
    employment_income: 100_000
    state_code: MN
  output:
    mn_paid_leave_small_employer: false
    mn_paid_leave_premium_rate: 0.0088
    mn_paid_leave_permitted_employee_rate: 0.0044
    # 0.88% * 100,000 = 880.
    mn_paid_leave_premium: 880
    # 0.44% * 100,000 = 440.
    mn_employee_paid_leave_contribution: 440
    # 880 - 440 = 440.
    mn_employer_paid_leave_contribution: 440
    mn_employer_additional_state_payroll_tax: 440
    employer_additional_state_payroll_tax: 440

- name: A large employer that deducts half the permitted share pays the rest.
  period: 2026
  input:
    employment_income: 100_000
    employer_state_payroll_premium_deduction_share: 0.5
    state_code: MN
  output:
    mn_paid_leave_premium: 880
    # 0.5 * 440 = 220.
    mn_employee_paid_leave_contribution: 220
    # 880 - 220 = 660.
    mn_employer_paid_leave_contribution: 660

- name: A large employer that deducts nothing pays the whole premium.
  period: 2026
  input:
    employment_income: 100_000
    employer_state_payroll_premium_deduction_share: 0
    state_code: MN
  output:
    mn_employee_paid_leave_contribution: 0
    mn_employer_paid_leave_contribution: 880

- name: A small employer pays 75% of the rate, of which employees may pay the same 0.44%.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 30
    state_code: MN
  output:
    mn_paid_leave_small_employer: true
    # 75% * 0.88% = 0.66%.
    mn_paid_leave_premium_rate: 0.0066
    # (75% - 25%) * 0.88% = 0.44%.
    mn_paid_leave_permitted_employee_rate: 0.0044
    # 0.66% * 100,000 = 660.
    mn_paid_leave_premium: 660
    mn_employee_paid_leave_contribution: 440
    # 660 - 440 = 220, the 25% * 0.88% = 0.22% minimum.
    mn_employer_paid_leave_contribution: 220
    employer_additional_state_payroll_tax: 220

- name: A small employer that deducts half the permitted share pays the rest.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 30
    employer_state_payroll_premium_deduction_share: 0.5
    state_code: MN
  output:
    mn_employee_paid_leave_contribution: 220
    # 660 - 220 = 440.
    mn_employer_paid_leave_contribution: 440

- name: A small employer that deducts nothing pays the whole small employer premium.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 30
    employer_state_payroll_premium_deduction_share: 0
    state_code: MN
  output:
    mn_employee_paid_leave_contribution: 0
    mn_employer_paid_leave_contribution: 660

- name: An employer with 31 employees is not a small employer.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 31
    state_code: MN
  output:
    mn_paid_leave_small_employer: false
    mn_paid_leave_premium: 880
    mn_employer_paid_leave_contribution: 440

- name: An average quarterly wage equal to the limit meets the small employer wage test.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 10
    mn_paid_leave_employer_average_quarterly_wage: 27_745.88
    state_code: MN
  output:
    mn_paid_leave_small_employer: true
    mn_paid_leave_premium: 660
    mn_employer_paid_leave_contribution: 220

- name: An average quarterly wage above the limit fails the small employer wage test.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 10
    mn_paid_leave_employer_average_quarterly_wage: 27_745.89
    state_code: MN
  output:
    mn_paid_leave_small_employer: false
    mn_paid_leave_premium: 880
    mn_employer_paid_leave_contribution: 440

- name: An average quarterly wage a fraction of a cent above the limit fails the wage test.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 10
    mn_paid_leave_employer_average_quarterly_wage: 27_745.885
    state_code: MN
  output:
    mn_paid_leave_small_employer: false
    mn_paid_leave_premium: 880

- name: Wages above the rounded Social Security base are capped at 185,000.
  period: 2026
  input:
    employment_income: 250_000
    state_code: MN
  output:
    mn_paid_leave_taxable_wages: 185_000
    # 0.88% * 185,000 = 1,628.
    mn_paid_leave_premium: 1_628
    # 0.44% * 185,000 = 814.
    mn_employee_paid_leave_contribution: 814
    mn_employer_paid_leave_contribution: 814

- name: A small employer's capped premium leaves the employer a quarter of the full rate.
  period: 2026
  input:
    employment_income: 250_000
    employer_headcount: 9
    state_code: MN
  output:
    # 0.66% * 185,000 = 1,221.
    mn_paid_leave_premium: 1_221
    mn_employee_paid_leave_contribution: 814
    # 1,221 - 814 = 407 = 0.22% * 185,000.
    mn_employer_paid_leave_contribution: 407

- name: Small wages keep fractional cents.
  period: 2026
  input:
    employment_income: 8_000
    state_code: MN
  output:
    # 0.88% * 8,000 = 70.40; 0.44% * 8,000 = 35.20.
    mn_paid_leave_premium: 70.4
    mn_employee_paid_leave_contribution: 35.2
    mn_employer_paid_leave_contribution: 35.2

- name: Negative employment income owes no premium.
  period: 2026
  input:
    employment_income: -5_000
    state_code: MN
  output:
    mn_paid_leave_premium: 0
    mn_employee_paid_leave_contribution: 0
    mn_employer_paid_leave_contribution: 0

- name: The employer premium flows into employer state and total payroll taxes.
  period: 2026
  input:
    employment_income: 100_000
    state_code: MN
  output:
    mn_employer_paid_leave_contribution: 440
    # Unemployment insurance: 0.9% default rate * the 42,000 wage base = 378.
    employer_state_unemployment_tax: 378
    # 378 + 440 = 818.
    employer_state_payroll_tax: 818
    # Social Security 6.2% * 100,000 = 6,200; Medicare 1.45% * 100,000 =
    # 1,450; FUTA 0.6% * 7,000 = 42; 6,200 + 1,450 + 42 + 818 = 8,510.
    employer_payroll_tax: 8_510

- name: The 2027 premium rate is unchanged at 0.88%.
  period: 2027
  input:
    employment_income: 100_000
    state_code: MN
  output:
    mn_paid_leave_premium: 880
    mn_employee_paid_leave_contribution: 440
    mn_employer_paid_leave_contribution: 440

- name: No premium is due before 2026.
  period: 2025
  input:
    employment_income: 100_000
    employer_headcount: 9
    state_code: MN
  output:
    mn_paid_leave_premium: 0
    mn_employee_paid_leave_contribution: 0
    mn_employer_paid_leave_contribution: 0
    mn_employer_additional_state_payroll_tax: 0

- name: Years before the 2015 parameter backdating still compute.
  period: 2014
  input:
    employment_income: 100_000
    employer_headcount: 9
    state_code: MN
  output:
    mn_paid_leave_premium: 0
    mn_employer_paid_leave_contribution: 0
    employer_additional_state_payroll_tax: 0

- name: Workers outside Minnesota owe no Minnesota premium.
  period: 2026
  input:
    employment_income: 100_000
    employer_headcount: 9
    state_code: WI
  output:
    mn_paid_leave_premium: 0
    mn_employer_paid_leave_contribution: 0
    employer_additional_state_payroll_tax: 0

- name: Employer-level premium for a large employer that deducts the full permitted share.
  period: 2026
  input:
    employer_headcount: 100
    employer_total_taxable_earnings_for_social_security: 1_000_000
    state_code: MN
  output:
    employer_total_mn_paid_leave_taxable_wages: 1_000_000
    # (0.88% - 0.44%) * 1,000,000 = 4,400.
    employer_total_additional_state_payroll_tax: 4_400

- name: Employer-level premium for a small employer that deducts a quarter of the permitted share.
  period: 2026
  input:
    employer_headcount: 20
    employer_state_payroll_premium_deduction_share: 0.25
    employer_total_taxable_earnings_for_social_security: 1_000_000
    state_code: MN
  output:
    # (0.66% - 0.25 * 0.44%) * 1,000,000 = 6,600 - 1,100 = 5,500.
    employer_total_additional_state_payroll_tax: 5_500

- name: Employer-level wages can be set at Minnesota's rounded base.
  period: 2026
  input:
    employer_headcount: 100
    employer_total_taxable_earnings_for_social_security: 369_000
    # Two workers at Minnesota's 185,000 base, not the 184,500 Social
    # Security base.
    employer_total_mn_paid_leave_taxable_wages: 370_000
    state_code: MN
  output:
    # 0.44% * 370,000 = 1,628.
    employer_total_additional_state_payroll_tax: 1_628
