- name: MN WFC eligible unit test 1
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 18
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_wfc_eligible: false  # taxpayer is too young

- name: MN WFC eligible unit test 2
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 65
      person2:
        is_tax_unit_dependent: true
        age: 60
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_wfc_eligible: false  # taxpayer is too old

- name: MN WFC eligible unit test 3
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 65
      person2:
        is_tax_unit_dependent: true
        age: 10
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_wfc_eligible: true  # taxpayer has a child

- name: MN WFC eligible unit test 4
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        tax_exempt_interest_income: 11_000
        age: 65
      person2:
        is_tax_unit_dependent: true
        age: 10
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_wfc_eligible: false  # US EITC property income eligibility rules apply

- name: 2025 joint return with one spouse who can be claimed, working family credit without a qualifying child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: MN
  output:
    # Minn. Stat. 290.0671 subd. 1 requires eligibility for the IRC 32
    # credit, whose childless route requires that neither spouse can be
    # claimed as a dependent (IRC 32(c)(1)(A)(ii)(III); Pub. 596).
    mn_wfc_eligible: false

- name: 2025 joint return with one spouse who can be claimed, working family credit without a qualifying child (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: MN
  output:
    mn_wfc_eligible: false

