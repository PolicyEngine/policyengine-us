- name: 2025 joint return with one claimable spouse and a qualifying child stays eligible (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 1_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MN
  output:
    # IRC 32 bars a dependent filer only on the childless route;
    # Schedule M1CWFC's blanket "You are not a dependent of another
    # person" is the alternative reading queued for review.
    mn_wfc_eligible: true

- name: 2025 joint return with one claimable spouse and a qualifying child stays eligible (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        employment_income: 1_000
