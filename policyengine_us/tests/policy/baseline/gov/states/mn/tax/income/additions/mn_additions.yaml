# 2020 Schedule M1NC line 6 adds back the federal charitable deduction for
# non-itemizers, through Form M1M line 16.
# https://www.revenue.state.mn.us/sites/default/files/2024-02/m1nc_20.pdf#page=1

- name: Case 1, 2020 federal non-itemizer adds back the line 10b deduction.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_additions: 300

- name: Case 2, 2021 deduction for non-itemizers is below the line, so nothing is added back.
  period: 2021
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_additions: 0
