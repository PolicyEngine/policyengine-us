# 2025 test case
# Joint filer with taxable social security below threshold
# 2025 income_amount for JOINT: $88,630 (same as 2024)
# Full subtraction applies when AGI is low
- name: MN social security subtraction 2025 joint low income
  period: 2025
  input:
    filing_status: JOINT
    social_security: 30_000
    taxable_social_security: 25_500
    adjusted_gross_income: 50_000
    state_code: MN
  output:
    mn_social_security_subtraction: 25_500

# 2026 amounts from the Minnesota DOR Tax Year 2026 Inflation-Adjusted Amounts,
# 290.0132 Subd. 26 (page 2): simplified subtraction phase-out thresholds of
# $110,780 (joint) and $86,410 (single), and an alternate subtraction maximum of
# $5,840 (joint) reduced by 20% of provisional income over $88,630, both "Not Indexed".
- name: MN social security subtraction 2026 joint alternate maximum is not indexed
  period: 2026
  input:
    filing_status: JOINT
    taxable_social_security: 30_000
    adjusted_gross_income: 200_000
    state_code: MN
  output:
    # AGI is $89,220 over $110,780, so the simplified subtraction is reduced by
    # 23 x 10% (capped at 100%) to $0. Provisional income is $0, so the
    # alternate subtraction is the unreduced $5,840 maximum.
    mn_social_security_subtraction: 5_840

- name: MN social security subtraction 2027 joint alternate maximum stays at $5,840
  period: 2027
  input:
    filing_status: JOINT
    taxable_social_security: 30_000
    adjusted_gross_income: 500_000
    state_code: MN
  output:
    # Subd. 26(j) indexes only the simplified phase-out thresholds.
    mn_social_security_subtraction: 5_840

- name: MN social security subtraction 2026 joint alternate subtraction phase-out
  absolute_error_margin: 0.01
  period: 2026
  input:
    filing_status: JOINT
    social_security: 100_000
    taxable_social_security: 85_000
    irs_gross_income: 150_000
    adjusted_gross_income: 150_000
    state_code: MN
  output:
    # Simplified: AGI is $39,220 over $110,780, so 10 x 10% = 100% reduction, $0.
    # Provisional income = (150,000 - 85,000) + 50% x 100,000 = 115,000.
    # Alternate = 5,840 - 20% x (115,000 - 88,630) = 5,840 - 5,274 = 566.
    mn_social_security_subtraction: 566

- name: MN social security subtraction 2026 single at the simplified phase-out threshold
  absolute_error_margin: 0.01
  period: 2026
  input:
    filing_status: SINGLE
    social_security: 40_000
    taxable_social_security: 20_000
    irs_gross_income: 86_410
    adjusted_gross_income: 86_410
    state_code: MN
  output:
    # AGI equals the $86,410 threshold, so the simplified subtraction is not
    # reduced and the full $20,000 of taxable benefits is subtracted.
    mn_social_security_subtraction: 20_000

- name: MN social security subtraction 2020 worksheet step 8 leaves out Form 1040 line 10b
  absolute_error_margin: 0.01
  period: 2020
  input:
    # 2020 Worksheet for line 39 constants (2020 M1M instructions, file
    # page 8), as the parameters start in 2021.
    gov.states.mn.tax.income.subtractions.social_security.income_amount.SINGLE: 62_090
    gov.states.mn.tax.income.subtractions.social_security.alternative_amount.SINGLE: 4_090
    people:
      person1:
        age: 67
        employment_income: 65_000
        social_security_retirement: 10_000
        charitable_cash_donations: 300
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    charitable_contributions_ald: 300
    # Federal: provisional income 65,000 - 300 + 5,000 = 69,700, so 85% of
    # benefits, 8,500, are taxable.
    tax_unit_taxable_social_security: 8_500
    # Steps 1-3: 73,500 - 8,500 = 65,000; step 5: 5,000; step 7: 70,000;
    # step 8: Schedule 1 lines 10-19 and 22 only, 0 (not line 10b);
    # step 9: 70,000; step 11: 70,000 - 62,090 = 7,910; step 12: 1,582;
    # step 14: 4,090 - 1,582 = 2,508; step 18: min(2,508, 8,500).
    mn_social_security_subtraction: 2_508

# Tier 1 railroad retirement benefits. Minn. Stat. 290.0132, subd. 26(i) gives
# "Social Security benefits" the meaning in IRC 86(d)(1), so Form 1040 lines 6a
# and 6b carry title II and tier 1 benefits together. The model subtracts the
# taxable tier 1 benefits with the rest of the railroad annuity
# (taxable_railroad_benefits, Schedule M1M line 17), so line 12 leaves them out
# as steps 26-29 of the 2025 worksheet for line 12 do.
- name: MN social security subtraction 2025 single below the threshold leaves the tier 1 benefits to line 17
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        social_security: 20_000
        taxable_social_security: 8_000
        railroad_social_security_equivalent_benefits: 10_000
        taxable_railroad_social_security_equivalent_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # AGI is under $84,490, so line 12 takes all of Form 1040 line 6b,
    # $12,000, and line 17 leaves out the tier 1 benefits. The model's line 12
    # is the $8,000 of taxable title II benefits, and the $4,000 of taxable
    # tier 1 benefits come off once, through taxable_railroad_benefits.
    mn_social_security_subtraction: 8_000
    taxable_railroad_benefits: 4_000
    mn_subtractions: 12_000

- name: MN social security subtraction 2025 single simplified method takes out the tier 1 benefits after the phase-out
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        social_security: 20_000
        taxable_social_security: 17_000
        railroad_social_security_equivalent_benefits: 10_000
        taxable_railroad_social_security_equivalent_benefits: 8_500
        irs_gross_income: 92_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 92_000
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # Steps 1-5: (92,000 - 84,490) / 4,000 = 1.88, rounded up to 2, so 20%.
    # Steps 6-8: 25,500 - 20% x 25,500 = 20,400.
    # Steps 9-19: 92,000 - 25,500 + 50% x 30,000 = 81,500 of provisional
    # income. Steps 20-24: 4,560 - 20% x (81,500 - 69,250) = 2,110.
    # Steps 25-28: min(2,110, 25,500 - 8,500) = 2,110.
    # Step 29: 20,400 - 8,500 = 11,900. Step 30: 11,900.
    # With line 17's 8,500, the subtractions total 20,400.
    mn_social_security_subtraction: 11_900
    mn_subtractions: 20_400

- name: MN social security subtraction 2025 joint provisional income counts tier 1 benefits
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: JOINT
    social_security: 60_000
    taxable_social_security: 51_000
    railroad_social_security_equivalent_benefits: 40_000
    taxable_railroad_social_security_equivalent_benefits: 34_000
    irs_gross_income: 150_000
    adjusted_gross_income: 150_000
    state_code: MN
  output:
    # Steps 1-8: (150,000 - 108,320) / 4,000 rounds up to 11, capped at 10,
    # so the simplified subtraction is $0.
    # Steps 9-19: 150,000 - 85,000 + 50% x 100,000 = 115,000.
    # Steps 20-24: 5,840 - 20% x (115,000 - 88,630) = 566.
    # Steps 25-28: min(566, 85,000 - 34,000) = 566.
    mn_social_security_subtraction: 566

- name: MN social security subtraction 2025 joint alternate method capped at taxable title II benefits
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: JOINT
    social_security: 1_000
    taxable_social_security: 850
    railroad_social_security_equivalent_benefits: 99_000
    taxable_railroad_social_security_equivalent_benefits: 84_150
    irs_gross_income: 145_000
    adjusted_gross_income: 145_000
    state_code: MN
  output:
    # Steps 1-8: (145,000 - 108,320) / 4,000 rounds up to 10, so $0.
    # Steps 9-19: 145,000 - 85,000 + 50% x 100,000 = 110,000.
    # Steps 20-24: 5,840 - 20% x (110,000 - 88,630) = 1,566.
    # Steps 25-28: min(1,566, 85,000 - 84,150) = 850.
    mn_social_security_subtraction: 850

