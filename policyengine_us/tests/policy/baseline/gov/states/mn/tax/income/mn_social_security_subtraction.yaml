    mn_social_security_subtraction: 5_004

- name: MN social security subtraction 2025 provisional income leaves out a dependent's benefits
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 70
        social_security: 100_000
        taxable_social_security: 85_000
        irs_gross_income: 150_000
      spouse:
        is_tax_unit_spouse: true
        age: 68
      child:
        age: 15
        social_security: 12_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        adjusted_gross_income: 150_000
    households:
      household:
        members: [head, spouse, child]
        state_code: MN
  output:
    # Step 12 takes Form 1040 line 6a, which holds the filers' benefits only;
    # the child's $12,000 belongs on the child's return (IRS Pub. 915).
    # Provisional income: 150,000 - 85,000 + 50% x 100,000 = 115,000.
    # Steps 20-24: 5,840 - 20% x (115,000 - 88,630) = 566.
    mn_social_security_subtraction: 566
