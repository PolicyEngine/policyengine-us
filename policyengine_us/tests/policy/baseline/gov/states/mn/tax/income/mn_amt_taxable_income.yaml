- name: MN AMT taxable income unit test 1
  period: 2021
  input:
    adjusted_gross_income: 200_000
    mn_itemizing: true
    charitable_deduction: 1_000  # subtract full 1000 from AMT taxinc 
    us_govt_interest: 3_000
    state_code: MN
  output:
    mn_amt_taxable_income: 200_000 - 1_000 - 3_000

- name: MN AMT taxable income unit test 2
  period: 2021
  input:
    mn_itemizing: false
    adjusted_gross_income: 200_000
    charitable_deduction: 1_000  # subtract 50% * (1000 - 500) from AMT taxinc
    us_govt_interest: 3_000
    state_code: MN
  output:
    mn_amt_taxable_income: 200_000 - 250 - 3_000

# 2024 Schedule M1MT, line 12 (PDF p. 1): "Casualty and theft losses (from line
# 19 of Schedule M1SA)", Minnesota's own amount from Schedule M1CAT.
- name: MN AMT taxable income subtracts the Minnesota casualty loss
  period: 2024
  input:
    adjusted_gross_income: 200_000
    mn_itemizing: true
    casualty_loss: 40_000
    state_code: MN
  output:
    # The federal deduction is suspended.
    casualty_loss_deduction: 0
    # M1CAT: (40,000 - 100) - 10% x 200,000 = 19,900
    mn_casualty_loss_deduction: 19_900
    mn_amt_taxable_income: 200_000 - 19_900

- name: MN AMT taxable income leaves the casualty loss out for a non-itemizer
  period: 2024
  input:
    adjusted_gross_income: 200_000
    mn_itemizing: false
    casualty_loss: 40_000
    state_code: MN
  output:
    mn_amt_taxable_income: 200_000

- name: MN AMT taxable income subtracts military pension subtraction
  period: 2024
  input:
    state_code: MN
    adjusted_gross_income: 200_000
    military_retirement_pay: 50_000
  output:
    mn_military_pension_subtraction: 50_000
    mn_amt_taxable_income: 200_000 - 50_000

- name: MN AMT taxable income adds back the 2020 federal charitable deduction for non-itemizers
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # Federal AGI (M1MT line 1) = 40,000 - 300 (Form 1040 line 10b). Line 4
    # includes Schedule M1NC line 6, the 300 added back (2020 M1MT
    # instructions, file page 2). No itemizing, no subtractions.
    adjusted_gross_income: 39_700
    charitable_contributions_ald: 300
    mn_itemizing: false
    mn_amt_taxable_income: 40_000
