# Minn. Stat. 290.0122, subd. 3(a)(1).
# https://www.revisor.mn.gov/statutes/cite/290.0122#stat.290.0122.3

# The filer deducts min(6_000 + 3_999, 10_000) = 9_999.
- name: A single filer pays 9_999 in combined property taxes in 2025
  absolute_error_margin: 0.02
  period: 2025
  input:
    adjusted_gross_income: 50_000
    real_estate_taxes: 6_000
    mn_personal_property_taxes: 3_999
    itemized_deductions_less_salt: 0
    filing_status: SINGLE
    state_code: MN
  output:
    mn_property_tax_deduction: 9_999
    mn_itemized_deductions: 9_999

