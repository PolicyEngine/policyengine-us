# The filer retains the supplied capped_property_taxes amount of 1_234 for 2024.
- name: A single filer retains the supplied property deduction in 2024
  absolute_error_margin: 0.02
  period: 2024
  input:
    adjusted_gross_income: 50_000
    real_estate_taxes: 18_000
    mn_personal_property_taxes: 4_000
    capped_property_taxes: 1_234
    itemized_deductions_less_salt: 0
    filing_status: SINGLE
    state_code: MN
  output:
    mn_property_tax_deduction: 1_234
    mn_itemized_deductions: 1_234

