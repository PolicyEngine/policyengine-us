# The spouses combine 4,000 + 3,000 of real estate taxes and 1,000 + 4,000
# of personal property taxes, then deduct min(12,000, 10,000) = 10,000.
- name: Joint filers combine property taxes paid by both spouses in 2026
  period: 2026
  input:
    people:
      head:
        age: 40
        real_estate_taxes: 4_000
        mn_personal_property_taxes: 1_000
      spouse:
        age: 42
        real_estate_taxes: 3_000
        mn_personal_property_taxes: 4_000
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
        adjusted_gross_income: 50_000
        itemized_deductions_less_salt: 0
    households:
      household:
        members: [head, spouse]
        state_code: MN
  output:
    tax_units:
      unit:
        mn_property_tax_deduction: 10_000
        mn_itemized_deductions: 10_000
