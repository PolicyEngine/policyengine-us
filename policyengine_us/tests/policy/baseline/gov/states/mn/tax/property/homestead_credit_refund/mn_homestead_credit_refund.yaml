- name: Case 1, standard homeowner refund.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        real_estate_taxes: 3_150
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        mn_homestead_credit_refund_qualified_property_taxes: 3_150
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_homestead_credit_refund_eligible: true
    mn_homestead_credit_refund_household_income: 50_000
    # Official 2025 table p22: income [48,340, 50,530), taxes [3,150, 3,175)
    # gives $1,478; line 17a adds round($1,478 x 0.1488) = $220.
    mn_homestead_credit_refund: 1_698

- name: Case 2, nontaxable Social Security is included in household income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 17_996
        taxable_social_security: 10_000
        real_estate_taxes: 3_150
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        mn_homestead_credit_refund_qualified_property_taxes: 3_150
        adjusted_gross_income: 65_636.60
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_homestead_credit_refund_household_income: 68_432.60
    # Official 2025 table p22: income [68,090, 70,280), taxes [3,150, 3,175)
    # gives $1,210; line 17a adds round($1,210 x 0.1488) = $180.
    mn_homestead_credit_refund: 1_390

- name: Case 3, age, dependent, and retirement contribution subtractions reduce household income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        employment_income: 60_000
        traditional_401k_contributions_desired: 10_000
        is_tax_unit_head: true
      person2:
        is_tax_unit_dependent: true
      person3:
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: SINGLE
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: MN
  output:
    mn_homestead_credit_refund_household_income: 33_760

