- name: Case 7, over-limit desired IRA contributions use contribution amounts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        traditional_ira_contributions_desired: 20_000
        roth_ira_contributions_desired: 20_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    traditional_ira_contributions: 3_500
    roth_ira_contributions: 3_500
    mn_homestead_credit_refund_household_income: 46_500

- name: Case 8, a dependent's IRA contribution is not added back to the parent's household income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head: true
        employment_income: 60_000
        traditional_401k_contributions: 7_000
      student:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 6_000
        traditional_ira_contributions: 2_000
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: MN
  output:
    # Federal AGI is the parent's 60,000 - 7,000 of 401(k) deferrals; the
    # student's wages and IRA deduction are on the student's own return.
    adjusted_gross_income: 53_000
    # 53,000 + the parent's 401(k) addition (7,000) - the retirement
    # subtraction (7,000) - the dependent subtraction (7,280). The student's
    # IRA contribution is neither added back nor subtracted, as their wages
    # are not in AGI.
    mn_homestead_credit_refund_household_income: 45_720

- name: Case 9, zero income receives the capped regular refund plus the one-time increase.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 4_000
    mn_homestead_credit_refund_qualified_property_taxes: 4_000
    mn_homestead_credit_refund_household_income: 0
  output:
    # P23 worksheet: min(4,000 x 88%, 3,480) = 3,480.
    # Separate line 17a: round(3,480 x 0.1488) = 518.
    mn_homestead_credit_refund: 3_998

- name: Case 10, negative household income uses zero without exceeding the increased cap.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 4_000
    mn_homestead_credit_refund_qualified_property_taxes: 4_000
    mn_homestead_credit_refund_household_income: -1_000
  output:
    # P9 line17 directs negative household income to use zero in the table.
    mn_homestead_credit_refund: 3_998

- name: Case 11, the regular refund rounds before computing its separate increase.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 3_502
    mn_homestead_credit_refund_qualified_property_taxes: 3_502
    mn_homestead_credit_refund_household_income: 50_000
  output:
    # P23 worksheet: (3,502 - 50,000 x .02) x .68 = 1,701.36 -> 1,701.
    # Line17a: 1,701 x .1488 = 253.1088 -> 253; total = 1,954.
    # Multiplying the unrounded regular amount by 1.1488 would give 1,955.
    mn_homestead_credit_refund: 1_954

- name: Case 12, the last dollar below a property-tax column boundary stays in that column.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 3_149
    mn_homestead_credit_refund_qualified_property_taxes: 3_149
    mn_homestead_credit_refund_household_income: 50_000
  output:
    # P22: income [48,340,50,530), taxes [3,125,3,150) -> 1,461.
    # 1,461 + round(1,461 x .1488) = 1,461 + 217.
    mn_homestead_credit_refund: 1_678

- name: Case 13, an exact income row boundary selects the next published table row.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 3_150
    mn_homestead_credit_refund_qualified_property_taxes: 3_150
    mn_homestead_credit_refund_household_income: 50_530
  output:
    # P22: income [50,530,52,720), taxes [3,150,3,175) -> 1,448.
    # 1,448 + round(1,448 x .1488) = 1,448 + 215.
    mn_homestead_credit_refund: 1_663

- name: Case 14, property tax just below the worksheet cutoff uses the last table column.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 3_499
    mn_homestead_credit_refund_qualified_property_taxes: 3_499
    mn_homestead_credit_refund_household_income: 50_000
  output:
    # P23: income [48,340,50,530), taxes [3,475,3,500) -> 1,699.
    mn_homestead_credit_refund: 1_952

- name: Case 15, property tax exactly at the worksheet cutoff uses the worksheet.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 3_500
    mn_homestead_credit_refund_qualified_property_taxes: 3_500
    mn_homestead_credit_refund_household_income: 50_000
  output:
    # P23: (3,500 - 50,000 x .02) x .68 = 1,700; bonus rounds to 253.
    mn_homestead_credit_refund: 1_953

- name: Case 16, the 2024 regular refund does not receive the 2025-only increase.
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 4_000
    mn_homestead_credit_refund_household_income: 0
  output:
    # 2024 official M1PR instructions p23: min(4,000 x .88, 3,410).
    # Laws2026ch128art4sec11 applies only to taxes payable2026 (claim2025).
    mn_homestead_credit_refund: 3_410

- name: Case 17, zero qualified property tax cannot produce a positive table refund.
  period: 2025
  input:
    state_code: MN
    age: 40
    real_estate_taxes: 0
    mn_homestead_credit_refund_qualified_property_taxes: 0
    mn_homestead_credit_refund_household_income: 0
  output:
    # M1PR line16 zero or less is blank, and a blank line17 gives no refund.
    mn_homestead_credit_refund: 0

- name: Case 18, next-year qualified claim tax is independent of current-year taxes paid for SALT.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [MN, MN]
    age: [40, 40]
    adjusted_gross_income: [50_000, 50_000]
    mn_homestead_credit_refund_household_income: [50_000, 50_000]
    # Federal ScheduleA2025 deducts taxes paid2025; M1PR2025 uses the
    # separate Statement of Property Taxes Payable2026 (M1PRline14).
    real_estate_taxes: [1_000, 9_000]
    state_and_local_sales_or_income_tax: [0, 0]
    mn_homestead_credit_refund_qualified_property_taxes: [4_000, 4_000]
  output:
    # Worksheet (4000 - 50000 x .02) x .68 =2040; bonus304 ->2344.
    mn_homestead_credit_refund: [2_344, 2_344]
    salt: [1_000, 9_000]
    real_estate_taxes: [1_000, 9_000]
