- name: 2025 joint return with one claimable spouse still counts a dependent incapable of self-care (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 2_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      parent:
        age: 60
        is_incapable_of_self_care: true
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, parent]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, parent]
        state_code: MN
  output:
    # IRC 21(b)(1)(B) determines dependency "without regard to
    # subsections (b)(1), (b)(2), and (d)(1)(B)" of section 152.
    mn_cdcc_dependent_count: 1

