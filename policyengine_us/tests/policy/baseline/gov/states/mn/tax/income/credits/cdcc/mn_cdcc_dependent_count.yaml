- name: One person qualifies by age, one by disability
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 40
      person2:
        age: 10
      person3:
        age: 16
        is_incapable_of_self_care: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MN
  output:
    mn_cdcc_dependent_count: 2

- name: No eligible dependents 
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 40
        is_incapable_of_self_care: true
      person2:
        age: 17
      person3:
        age: 16
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MN
  output:
    mn_cdcc_dependent_count: 0

- name: 2025 single filer who can be claimed as a dependent, child under 13
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, child]
    households:
      household:
        members: [person_a, child]
        state_code: MN
  output:
    # Schedule M1CD counts "your dependent child who is younger than
    # 13" (IRC 21(b)(1)(A)); a return with a claimable filer has no
    # dependents (IRC 152(b)(1)).
    mn_cdcc_dependent_count: 0

- name: 2025 joint return with one spouse who can be claimed, child under 13 (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 2_000
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MN
  output:
    mn_cdcc_dependent_count: 0

