- name: An incapacitated head counts as the qualifying spouse on a joint return
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        age: 45
        is_incapable_of_self_care: true
      person2:
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        age: 45
        employment_income: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_cdcc_dependent_count: 1

- name: Two incapacitated spouses count once
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        age: 45
        is_incapable_of_self_care: true
      person2:
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        age: 45
        is_incapable_of_self_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_cdcc_dependent_count: 1

- name: A single filer is not their own qualifying individual
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 45
        is_incapable_of_self_care: true
    tax_units:
