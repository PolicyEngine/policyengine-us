- name: Case 1, claimant and homestead conditions apply while invalid prior net tax stops the claim.
  period: 2025
  input:
    state_code: [MN, MN, MN, MN, CA, MN, MN]
    age: [40, 40, 40, 40, 40, 40, 40]
    claimed_as_dependent_on_another_return: [false, false, false, true, false, false, false]
    mn_special_refund_current_property_taxes: [4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 4_000]
    mn_special_refund_prior_property_taxes: [3_000, 3_000, 3_000, 3_000, 3_000, 300, 5_000]
    mn_special_refund_prior_refund: [0, 0, 0, 0, 0, 400, 0]
    mn_special_refund_improvement_value: [0, 0, 0, 0, 0, 0, 0]
    mn_special_refund_current_home_use_fraction: [1, 1, 1, 1, 1, 1, 1]
    mn_special_refund_prior_home_use_fraction: [1, 1, 1, 1, 1, 1, 1]
    mn_special_refund_same_homestead: [true, false, true, true, true, true, true]
    mn_special_refund_qualifying_claimant: [true, true, false, true, true, true, true]
  output:
    # Schedule line7 stops negative prior net tax and prior net tax above
    # current comparison tax; it does not floor those into a larger award.
    mn_special_refund_eligible: [true, false, false, false, false, false, false]
