- name: Case 1, default category mirrors the bare-input default.
  period: 2026-01
  input:
    people:
      person1:
        age: 70
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_ALONE

- name: Case 2, user-provided arrangement passes through when not in a Medicaid facility.
  period: 2026-01
  input:
    people:
      person1:
        age: 70
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_WITH_OTHERS

- name: Case 3, federal Medicaid-facility status overrides the input arrangement.
  period: 2026-01
  input:
    people:
      person1:
        age: 80
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_ALONE
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: MEDICAID_FACILITY

- name: Case 4, housing-assistance eligibility applies individual living-alone category.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_disabled: true
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_housing_assistance_eligible: true
        ssi: 994
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_ALONE

- name: Case 5, housing-assistance eligibility applies couple living-alone category.
  period: 2026-01
  input:
    people:
      person1:
        age: 70
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
        mn_msa_housing_assistance_eligible: true
        ssi: 994
      person2:
        age: 70
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
        mn_msa_housing_assistance_eligible: false
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_msa_payment_category: [COUPLE_LIVING_ALONE, COUPLE_LIVING_ALONE]

# Minn. Stat. 256D.44 subd. 2 also gives the living-alone standard to a
# person eligible for a medical assistance home and community-based services
# waiver, and to one with the local agency's placement determination under
# 256I.04 subd. 1a, whether or not they live in a Housing Support setting.
- name: Case 6, HCBS waiver eligibility applies the individual living-alone category.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_disabled: true
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_hcbs_waiver_eligible: true
        ssi: 994
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_ALONE

- name: Case 7, a Housing Support placement determination applies the individual living-alone category.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_disabled: true
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_housing_support_plan_approved: true
        ssi: 994
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_ALONE

- name: Case 8, either spouse's HCBS waiver eligibility applies the couple living-alone category.
  period: 2026-01
  input:
    people:
      person1:
        age: 70
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
        ssi: 994
      person2:
        age: 70
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
        mn_msa_hcbs_waiver_eligible: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_msa_payment_category: [COUPLE_LIVING_ALONE, COUPLE_LIVING_ALONE]

- name: Case 9, a Medicaid facility still overrides an HCBS waiver pathway.
  period: 2026-01
  input:
    people:
      person1:
        age: 80
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_hcbs_waiver_eligible: true
        mn_msa_housing_support_plan_approved: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: MEDICAID_FACILITY

- name: Case 10, the pathways apply from the 2011 starting period.
  period: 2011-01
  input:
    people:
      person1:
        age: 50
        is_disabled: true
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_housing_support_plan_approved: true
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_msa_payment_category: INDIVIDUAL_LIVING_ALONE

- name: Case 11, an unrelated adult's HCBS waiver leaves a couple on the living-with-others category when marital units are omitted.
  period: 2026-01
  input:
    people:
      head:
        age: 70
        is_tax_unit_head: true
        social_security: 7_200
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
      spouse:
        age: 70
        is_tax_unit_spouse: true
        mn_msa_living_arrangement: COUPLE_LIVING_WITH_OTHERS
      third:
        age: 70
        is_tax_unit_head: true
        mn_msa_living_arrangement: INDIVIDUAL_LIVING_WITH_OTHERS
        mn_msa_hcbs_waiver_eligible: true
    tax_units:
      couple:
        members: [head, spouse]
      third:
        members: [third]
    households:
      household:
        members: [head, spouse, third]
        state_code: MN
  output:
    # The waiver moves only its holder to the living-alone standard. The
    # spouse test pairs the head and spouse alone, so neither spouse has it.
    mn_msa_payment_category:
      [COUPLE_LIVING_WITH_OTHERS, COUPLE_LIVING_WITH_OTHERS, INDIVIDUAL_LIVING_ALONE]
