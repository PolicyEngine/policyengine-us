- name: A business loss absorbs restored pretax premiums before Minnesota gross earnings are floored.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 67
    state_code: MN
    employment_income: 1_200
    pre_tax_health_insurance_premiums: 1_200
    self_employment_income: -2_000
    ssi: 0
  output:
    # Gross wage income 1,200 cannot cover the 2,000 business loss.
    # Restoring the premium to an already floored SSI budget would create
    # a false positive 100/month gross-income amount.
    mn_msa_gross_income: 0

- name: Minnesota does not deduct an own loss again after it offsets the spouse's earnings.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 67
        employment_income: 1_200
        pre_tax_health_insurance_premiums: 1_200
        self_employment_income: -2_000
        is_tax_unit_head: true
        ssi: 0
      spouse:
        age: 60
        employment_income: 12_000
        is_tax_unit_spouse: true
        ssi: 0
    households:
      household:
        members: [applicant, spouse]
        state_code: MN
    tax_units:
      couple:
        members: [applicant, spouse]
        tax_unit_is_joint: true
    marital_units:
      couple:
        members: [applicant, spouse]
  output:
    people:
      applicant:
        # Deemed earnings = 12,000 - 2,000; own restoration = 1,200.
        # (10,000 + 1,200) / 12 = 933.3333.
        mn_msa_gross_income: 933.3333

- name: Both spouses' remaining losses absorb their own premiums once in Minnesota's gross test.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      first:
        age: 67
        employment_income: 1_500
        pre_tax_health_insurance_premiums: 1_500
        farm_operations_income: -1_000
        is_tax_unit_head: true
        ssi: 0
      second:
        age: 67
        employment_income: 1_500
        pre_tax_health_insurance_premiums: 1_500
        partnership_self_employment_net_earnings: -1_000
        is_tax_unit_spouse: true
        ssi: 0
    households:
      household:
        members: [first, second]
        state_code: MN
    tax_units:
      couple:
        members: [first, second]
        tax_unit_is_joint: true
    marital_units:
      couple:
        members: [first, second]
  output:
    # Each spouse has 1,500 gross wages less a 1,000 loss = 500/year.
    mn_msa_gross_income: [41.6667, 41.6667]

- name: A spouse's remaining loss also absorbs premiums when their own wages cannot cover it.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      first:
        age: 67
        employment_income: 1_000
        pre_tax_health_insurance_premiums: 1_000
        farm_operations_income: -2_000
        is_tax_unit_head: true
        ssi: 0
      second:
        age: 67
        employment_income: 5_000
        pre_tax_health_insurance_premiums: 5_000
        partnership_self_employment_net_earnings: -2_000
        is_tax_unit_spouse: true
        ssi: 0
    households:
      household:
        members: [first, second]
        state_code: MN
    tax_units:
      couple:
        members: [first, second]
        tax_unit_is_joint: true
    marital_units:
      couple:
        members: [first, second]
  output:
    # First spouse's 1,000 remaining loss offsets second spouse's gross
    # earnings after their own 2,000 loss: 5,000 - 2,000 - 1,000 = 2,000.
    mn_msa_gross_income: [0, 166.6667]
