- name: Case 1, no assets.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    mn_mfip_resources_eligible: true

- name: Case 2, assets below limit.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 5_000
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Assets: $5,000
    # Limit: $10,000
    # Eligible: 5,000 <= 10,000 = true
    mn_mfip_resources_eligible: true

- name: Case 3, assets at limit.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Assets: $10,000
    # Limit: $10,000
    # Eligible: 10,000 <= 10,000 = true
    mn_mfip_resources_eligible: true

- name: Case 4, assets above limit.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 10_001
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Assets: $10,001
    # Limit: $10,000
    # Eligible: 10,001 <= 10,000 = false
    mn_mfip_resources_eligible: false

# 8,688.73 + 9.74 + 1,301.53 = 10,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 10,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.53
    state_code: MN
  output:
    mn_mfip_resources_eligible: true

# 8,688.73 + 9.74 + 1,301.54 = 10,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.54
    state_code: MN
  output:
    mn_mfip_resources_eligible: false
