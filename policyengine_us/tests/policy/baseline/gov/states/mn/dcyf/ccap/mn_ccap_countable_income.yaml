# Tests MN CCAP countable income = gross income (earned + unearned sources)
# minus allowable deductions, floored at zero (Minn. Rules 3400.0170 subp. 4/6a;
# manual sections 6.6 and 6.18). The variable is monthly; annual income inputs
# divide by 12. RSDI counts only above the federal maximum SSI payment (Minn.
# Stat. 256P.06, subd. 3(2)(xvi)).
- name: Case 1, earnings only.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 36_000  # /year -> 3,000/month
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # 36,000 / 12 = 3,000 per month.
    mn_ccap_countable_income: 3_000

- name: Case 2, earned plus unearned income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 24_000  # 2,000/month
        social_security_retirement: 6_000  # 500/month (RSDI component)
        interest_income: 1_200  # 100/month
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # RSDI counts only above the 2026 federal maximum SSI payment of
    # 994 * 12 = 11,928 (Minn. Stat. 256P.06, subd. 3(2)(xvi)), so the 6,000
    # RSDI counts as 0. (24,000 + 0 + 1,200) / 12 = 2,100 per month.
    mn_ccap_countable_income: 2_100

- name: Case 3, income reduced by allowable deductions.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 36_000  # 3,000/month
        child_support_expense: 6_000  # 500/month paid out of household
        alimony_expense: 3_600  # 300/month spousal support paid out
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # (36,000 - 6,000 - 3,600) / 12 = 26,400 / 12 = 2,200 per month.
    mn_ccap_countable_income: 2_200

- name: Case 4, deductions exceeding gross income floor at zero.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 12_000  # 1,000/month
        child_support_expense: 24_000  # 2,000/month paid out
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # 12,000 - 24,000 = -12,000 -> floored to 0.
    mn_ccap_countable_income: 0

# Edge cases.
- name: Case 5, zero income yields zero countable income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    mn_ccap_countable_income: 0

- name: Case 6, negative self-employment income with no deductions floors at zero.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        self_employment_income: -60_000  # business loss, no deductions
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # max(-60,000 - 0, 0) = 0; a loss must not produce negative countable income.
    mn_ccap_countable_income: 0

- name: Case 7, multiple unearned income sources are all counted.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        social_security_retirement: 12_000  # 1,000/month (RSDI component)
        unemployment_compensation: 6_000  # 500/month
        child_support_received: 3_600  # 300/month
        general_assistance: 2_400  # 200/month
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # RSDI counts above the 2026 federal maximum SSI payment:
    # 12,000 - 994 * 12 = 12,000 - 11,928 = 72.
    # (72 + 6,000 + 3,600 + 2,400) / 12 = 12,072 / 12 = 1,006 per month.
    mn_ccap_countable_income: 1_006

- name: Case 8, a child's earned income is not counted.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 36_000  # parent, 3,000/month
      person2:
        age: 16
        employment_income: 12_000  # excluded as a child's earned income
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Only the parent's 36,000/12 = 3,000 counts; the child's earnings are
    # excluded (section 6.6.1).
    mn_ccap_countable_income: 3_000

- name: Case 9, a self-employment loss does not offset wages.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 36_000  # 3,000/month wages
        self_employment_income: -60_000  # business loss
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # Minn. Rules 3400.0170 subp. 4: a self-employment loss is confined to
    # self-employment, so the -60,000 loss is floored at zero and the 36,000
    # wages still count. 36,000 / 12 = 3,000 per month.
    mn_ccap_countable_income: 3_000

- name: Case 10, a self-employment loss does not offset unearned income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        unemployment_compensation: 30_000  # 2,500/month unearned
        self_employment_income: -10_000  # business loss
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # The floored loss (0) cannot erode unearned income. 30,000 / 12 = 2,500.
    mn_ccap_countable_income: 2_500

- name: Case 11, one member's self-employment loss does not offset another's wages.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 36_000  # 3,000/month wages
      person2:
        age: 30
        self_employment_income: -60_000  # other adult's business loss
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Each person's self-employment total is floored at zero independently, so
    # person2's loss cannot reduce person1's wages. 36,000 / 12 = 3,000.
    mn_ccap_countable_income: 3_000

- name: Case 12, a self-employment loss offsets other self-employment income of the same person.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        self_employment_income: 20_000  # one business
        sstb_self_employment_income: -8_000  # a different business at a loss
    households:
      household:
        members: [person1]
        state_code: MN
  output:
    # The allowed cross-business offset still works: max(20,000 - 8,000, 0) =
    # 12,000 net self-employment. 12,000 / 12 = 1,000 per month.
    mn_ccap_countable_income: 1_000

- name: Case 13, each member's RSDI counts only above the federal maximum SSI payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        social_security_disability: 18_000  # 1,500/month
      person2:
        age: 38
        employment_income: 24_000  # 2,000/month
        social_security_survivors: 6_000  # 500/month
      person3:
        age: 6
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MN
  output:
    # Minn. Stat. 256P.06, subd. 3(2)(xvi), 2026 federal maximum SSI payment
    # of 994 * 12 = 11,928 per recipient:
    # person1 RSDI: 18,000 - 11,928 = 6,072.
    # person2 RSDI: max(6,000 - 11,928, 0) = 0.
    # (6,072 + 0 + 24,000) / 12 = 30,072 / 12 = 2,506 per month.
    mn_ccap_countable_income: 2_506

- name: Case 14, a child's RSDI above the federal maximum SSI payment counts as family income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 24_000  # 2,000/month
      person2:
        age: 8
        social_security_dependents: 13_200  # 1,100/month
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Minn. Stat. 256P.06, subd. 2 exempts only a child's earned income, so
    # the child's own RSDI counts above 994 * 12 = 11,928:
    # person2 RSDI: 13,200 - 11,928 = 1,272.
    # (24,000 + 1,272) / 12 = 25,272 / 12 = 2,106 per month.
    mn_ccap_countable_income: 2_106
