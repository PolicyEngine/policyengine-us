- name: Case 34, an eligible person who does not take up SSI receives no supplement.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    state_code: NV
    age: 65
    takes_up_ssi_if_eligible: false
  output:
    # Aged citizen with no resources meets the categorical and resource tests.
    is_ssi_eligible: true
    # $994 federal benefit rate - $0 countable income = $994 if taken up.
    ssi_if_takes_up: 994
    # SSI is defined only for people who take it up.
    ssi: 0
    # SSA pays the supplement through the SSI claim, so no take-up means $0.
    nv_oss: 0

- name: Case 35, spousal deeming in another person's household caps the payment with the reduced federal rate.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 40
        is_blind: true
        # $750 monthly Social Security disability benefit.
        social_security_disability: 9_000
        ssi_lives_in_another_persons_household: true
        ssi_receives_shelter_from_others_in_household: true
        ssi_others_pay_all_meals: true
      person2:
        age: 40
        # 20 hours a week at the $12.00 Nevada minimum wage (NRS 608.250):
        # $12 * 20 * 52 = $12,480 a year, $1,040 a month.
        employment_income: 12_480
        ssi_lives_in_another_persons_household: true
        ssi_receives_shelter_from_others_in_household: true
        ssi_others_pay_all_meals: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NV
  output:
    # Shelter from others and all meals paid by others: one-third reduction.
    ssi_federal_living_arrangement: [ANOTHER_PERSONS_HOUSEHOLD, ANOTHER_PERSONS_HOUSEHOLD]
    nv_oss_living_arrangement: [HOUSEHOLD_OF_ANOTHER, HOUSEHOLD_OF_ANOTHER]
    # Not a joint claim: person1's own-income cap uses the blind
    # household-of-another individual rate; person2 has no SSI category.
    # Spouse earnings $1,040 > $1,491 - $994 = $497, so deeming applies.
    # Deemed: ($1,040 - $65) / 2 = $487.50.
    ssi_income_deemed_from_ineligible_spouse: [487.5, 0]
    # Own $750 - $20 = $730; $730 + $487.50 = $1,217.50.
    ssi_countable_income: [1_217.5, 0]
    # $1,491 couple rate * 2/3 = $994 - $1,217.50 < 0.
    ssi: [0, 0]
    # Couple path: $531.94 - ($1,217.50 - $994) = $308.44.
    # Own-income cap: $213.96 - ($730 - $994 * 2/3 = $662.67) = $146.63
    # after rounding up to cents. min($146.63, $308.44) = $146.63.
    nv_oss: [146.63, 0]

- name: Case 36, a blind child in domiciliary care keeps the independent living supplement.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    state_code: NV
    age: 17
    is_blind: true
    nv_oss_care_setting: DOMICILIARY_CARE
  output:
    # SF01415.300 E lists no exclusion for children, so the child keeps the
    # federal mapping: FLA A gives OSS A, the blind independent living rate.
    nv_oss_living_arrangement: INDEPENDENT_LIVING
    nv_oss: 109.3

- name: Case 37, blind child with two working parents keeps the full supplement after parental deeming.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        own_children_in_household: 1
        # Full-time cashier (SOC 41-2011) at the Nevada median wage, BLS OEWS
        # May 2025: $14.36 an hour * 2,080 hours, published as $29,870 a year.
        employment_income: 29_870
      person2:
        age: 38
        own_children_in_household: 1
        # Also a full-time cashier at the Nevada median: $29,870 a year.
        employment_income: 29_870
      person3:
        age: 10
        is_blind: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # Neither parent is aged, blind or disabled, so the blind child lives with
    # ineligible parents (federal code C), which Nevada pays as OS code A.
    ssi_federal_living_arrangement: [OWN_HOUSEHOLD, OWN_HOUSEHOLD, CHILD_IN_PARENTAL_HOUSEHOLD]
    nv_oss_living_arrangement: [INDEPENDENT_LIVING, INDEPENDENT_LIVING, INDEPENDENT_LIVING]
    # Parents: $29,870 * 2 = $59,740 a year, $4,978.33 a month, all earned.
    # ($4,978.33 - $20 - $65) * 0.5 = $2,446.67; less the two-parent
    # allocation, the $1,491 couple rate, leaves $955.67 deemed to the child.
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 955.67]
    # Child: $955.67 - $20 general exclusion = $935.67.
    ssi_countable_income: [0, 0, 935.67]
    # $994 individual rate - $935.67 = $58.33.
    ssi: [0, 0, 58.33]
    # $935.67 is below the $994 rate, so there is no excess income and the
    # child gets the full $109.30 blind independent living rate.
    nv_oss: [0, 0, 109.3]

