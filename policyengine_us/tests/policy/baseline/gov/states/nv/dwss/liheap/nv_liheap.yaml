# Fixed Annual Credit (EAP Manual 803 II-VI; NRS 702.260(7)): FAC = annual energy cost -
# median energy burden x FAC income, with burden 1.81% in SFY2026 and 1.48% in SFY2027
# (Appendix A). A FAC below 360, including a negative FAC or heat in rent with no bill,
# pays 360 (803 V.1-3). The benefit is capped by the Appendix A table for household size
# (8+ row above eight) and FAC income as a share of the poverty guideline: up to 75%,
# up to 100%, up to 125%, and above; the propane and oil table applies to PROPANE,
# FUEL_OIL and KEROSENE heat, and targeted households add 100 (a counted member 60 or
# older, disabled, or under six; 505 and glossary). Plan range 360-3,136. SFY2026 uses
# the 2025 guideline (15,650 + 5,500 per added person), SFY2027 the 2026 guideline
# (15,960 + 5,680). Wages are at the Nevada minimum wage of 12.00 an hour (24,960 full
# time; 18,720 at 30 hours a week; 12,480 at 20; 9,360 at 15; 6,240 at 10). Gas of
# 600-1,080 is 50-90 a month, electricity of 1,200-1,560 is 100-130 a month (EIA
# Nevada average residential bill), and rural propane runs 1,500-2,500 a year.

- name: Case 1, a gas-heated family receives a FAC between the minimum and the cap.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_960
      person2:
        age: 8
      person3:
        age: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 600
        pre_subsidy_electricity_expense: 1_440
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 600 + 1,440 - 0.0181 x 24,960 = 2,040 - 451.776 = 1,588.224
    # 24,960 / 26,650 = 0.937 -> band 2; cap 1,773
    nv_liheap: 1_588.224

- name: Case 2, the burden applies to FAC income including TANF and a student's wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 9_360
      person2:
        age: 17
        is_in_k12_school: true
        employment_income: 6_240
      person3:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        # Nevada TANF three-person payment allowance of 386 a month.
        tanf: 4_632
        heating_type: NATURAL_GAS
        gas_expense: 600
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # FAC income 9,360 + 6,240 + 4,632 = 20,232
    # 1,920 - 0.0181 x 20,232 = 1,920 - 366.1992 = 1,553.8008
    # 20,232 / 26,650 = 0.759 -> band 2; cap 1,773
    nv_liheap: 1_553.8008

- name: Case 3, a solar-heated home with a FAC below 360 receives the 360 minimum.
  period: 2026
