# Countable annual gross income must not exceed 150% of the poverty guideline (NRS
# 702.260(3); EAP Manual 701, 802; SFY2026 size-one limit 23,475). The household needs a
# home heating source and responsibility for energy costs: a heating bill, or heat in the
# rent (803 V.3); households in subsidized or public housing with all utilities in the
# rent are ineligible unless they have an energy burden (501 I, 503). Household size
# counts citizens and qualified non-citizens outside the five-year bar only (302 C,
# 502 A.I). Wages of 18,720 are 30 hours a week at the Nevada minimum wage of 12.00; gas
# of 720 is 60 a month and electricity of 1,320 is 110 a month, within typical Nevada
# bills.

- name: Case 1, income exactly at the size-one limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        # About 38 hours a week at 12.00.
        employment_income: 23_475
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # 23,475 <= 15,650 x 1.5
    nv_liheap_eligible: true

- name: Case 2, income one dollar above the size-one limit is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 23_476
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_eligible: false

- name: Case 3, a home with no heating is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_eligible: false

- name: Case 4, an unspecified heating fuel without heat in rent is ineligible even with reported heating costs.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        heat_expense_included_in_rent: false
        # The caller reports heating costs but not the fuel.
        has_heating_expense: true
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_eligible: false

- name: Case 5, an unspecified heating fuel with heat included in unsubsidized rent is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
        pre_subsidy_electricity_expense: 0
    households:
      household:
        members: [person1]
        state_code: NV
        is_in_public_housing: false
  output:
    nv_liheap_eligible: true

- name: Case 6, a gas-heated home with heat included in unsubsidized rent and no bills is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
        pre_subsidy_electricity_expense: 0
    households:
      household:
        members: [person1]
        state_code: NV
        is_in_public_housing: false
  output:
    # All utilities in the landlord's name and the rent (803 V.3)
    nv_liheap_eligible: true

- name: Case 7, a household with rental assistance and all utilities in the rent is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 0
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # No energy burden (501 I)
    nv_liheap_eligible: false

- name: Case 8, a public housing household with all utilities in the rent is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
        pre_subsidy_electricity_expense: 0
    households:
      household:
        members: [person1]
        state_code: NV
        is_in_public_housing: true
  output:
    # No energy burden (503)
    nv_liheap_eligible: false

- name: Case 9, a household with rental assistance and heat in the rent that pays its own electricity bill is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # Energy cost 0 + 1,320 > 0: an energy burden remains (501 I)
    nv_liheap_eligible: true

- name: Case 10, a gas-heated home with a zero gas bill and heat outside the rent is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: false
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_eligible: false

- name: Case 11, a household of only undocumented members with no income is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # Size 0; zero income would otherwise pass the income test
    nv_liheap_eligible: false

- name: Case 12, a permanent resident parent within the five-year bar is not counted, so the size-one limit applies.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        # Full time at the 12.00 Nevada minimum wage.
        employment_income: 24_960
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 600
        pre_subsidy_electricity_expense: 1_440
    households:
      household:
        members: [person1, person2]
        state_code: NV
  output:
    # Manual 302 C: the parent entered two years ago with no exemption, so only the citizen
    # child counts (502 A.I) while the parent's wages still count.
    nv_liheap_household_size: 1
    # 15,650 x 1.5; the size-two limit of 31,725 would admit this household
    nv_liheap_income_limit: 23_475
    nv_liheap_countable_income: 24_960
    # 24,960 > 23,475
    nv_liheap_eligible: false
    nv_liheap: 0
