# Authority: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/2025-2027_CCDF_State_Plan._For_Remediation._no_markup__2.pdf#page=17
# Court status is distinct from protective-services or child-care authorization.

- name: NV court-supervised child at age 12.
  period: 2026-01
  input:
    state_code: NV
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    nv_ccdp_eligible_child: true

