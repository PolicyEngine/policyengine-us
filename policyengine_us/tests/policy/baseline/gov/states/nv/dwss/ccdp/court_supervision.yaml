# Authority: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/ACF-118_CCDF_FFY_2025-2027_For_Nevada__3.pdf#page=18
# The FFY 2016-2018 and FFY 2025-2027 plans elect the court-supervision option
# through 18; the FFY 2019-2021 and 2022-2024 plans decline it.

- name: Case 1, court-supervised child at age 12.
  period: 2026-01
  input:
    state_code: NV
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    nv_ccdp_eligible_child: true

