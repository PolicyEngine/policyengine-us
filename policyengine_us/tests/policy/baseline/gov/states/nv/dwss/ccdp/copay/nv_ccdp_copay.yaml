# Edge cases: copay-band cut-points. Each band top is a share of SMI rounded to the
# nearest dollar, and income above a top pays the next band.
# Family of 3, period 2025-01: monthly SMI = 6_721.82, so the $0 band tops out at
# round(0.33 * 6_721.82) = $2,218 and the $90 band at round(0.42 * 6_721.82) = $2,823.

- name: Income just below the 33% SMI cut-point yields a zero copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 26_400
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_200 stays within the $2,218 top of the $0 band -> $0
    nv_ccdp_copay: 0

- name: Income just above the 33% SMI cut-point yields a $90 copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 26_700
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_225 exceeds the $2,218 top of the $0 band -> $90
    nv_ccdp_copay: 90

- name: Income just below the 42% SMI cut-point stays in the $90 band.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 33_600
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_800 stays within the $2,823 top of the $90 band -> $90
    nv_ccdp_copay: 90

- name: Income just above the 42% SMI cut-point yields a $150 copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 34_200
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_850 exceeds the $2,823 top of the $90 band -> $150
    nv_ccdp_copay: 150

- name: Income at 42.8% SMI (above the operational 42% break) yields a $150 copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 34_500
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_875 is 42.8% of SMI, above the $2,823 top -> $150. The State Plan summary
    # text ("43%-49% -> $150") would wrongly bucket this 42-43% SMI income as
    # $90; the operational chart (42% break) correctly makes it $150.
    nv_ccdp_copay: 150

