# nv_ccdp_copay: SPMUnit, float (USD), MONTH
# July 2022 through March 2024: federal funds reimburse the copayment, so it reads $0.
# April through September 2024: a share of gross income from the chart effective
# October 1, 2023, by household size.
# From October 2024, and standing in before July 2022, the flat schedule below applies.
# Flat copay by income as a share of SMI (eff. Oct 1, 2024; State Plan 2.4.v):
#   up to 33% SMI -> $0; up to 42% SMI -> $90; above 42% SMI -> $150.
# The charts print each band top as the nearest dollar, and MS 316 rounds monthly
# income to the nearest dollar before reading them. The $150 band begins above 42%
# SMI per the operational fee charts; the State Plan summary's "43%" is superseded.
# Waived for TANF/NEON (is_tanf_enrolled), CPS/foster placements, and homeless.
# Family of 3, period 2025-01 -> monthly SMI = 6_721.82.

- name: Income below 33% SMI yields a zero copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 24_000
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_000/mo / 6_721.82 = 0.2975 < 0.33 -> $0
    nv_ccdp_copay: 0

- name: Income in the 33-42% SMI band yields a $90 copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 30_000
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 2_500/mo / 6_721.82 = 0.3719 in [0.33, 0.4201) -> $90
    nv_ccdp_copay: 90

- name: Income above the 42% SMI cut-point yields a $150 copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        employment_income: 40_000
      person2:
        age: 30
      person3:
        age: 3
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # 3_333/mo / 6_721.82 = 0.4959 >= 0.4201 -> $150
    nv_ccdp_copay: 150

