# The FAC uses the household's annual dollar usage for its primary heating source and
# electricity (EAP Manual 803 III-IV; NRS 702.260(7)(a) natural gas and electricity).
# Electric and solar heat are already the electricity bill, so it is counted once.
# Annual bills stand in for the prior twelve months of vendor usage. Gas of 720 is 60 a
# month (typical Nevada bills run 40-90); electricity of 1,320-1,440 is 110-120 a month,
# within the EIA Nevada average residential bill.

- name: Case 1, a gas-heated home adds its gas and electricity bills.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # 720 + 1,320
    nv_liheap_energy_cost: 2_040

- name: Case 2, an electrically heated home counts its electricity bill once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_440
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_energy_cost: 1_440

- name: Case 3, a solar-heated home counts its grid electricity bill once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: SOLAR
        # Net grid bill of 50 a month after the panels' output.
        pre_subsidy_electricity_expense: 600
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    nv_liheap_energy_cost: 600

# Section 507 leaves service fees out of the energy cost, and Appendix A lists
# an annual deduction by vendor: Boulder City 150; Mt. Wheeler Power 258
# (SFY2026) and 456 (SFY2027); Alamo Power District 380.04 (SFY2026);
# Southwest Gas 129.60, or 108 for multi-family service in the south. NV
# Energy has no dollar deduction.

- name: Case 4, a Boulder City home deducts the Boulder City and Southwest Gas service fees.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
        nv_liheap_electricity_provider: BOULDER_CITY
        nv_liheap_natural_gas_provider: SOUTHWEST_GAS
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # (720 - 129.60) + (1,320 - 150) = 590.40 + 1,170
    nv_liheap_energy_cost: 1_760.4

- name: Case 5, an electrically heated Mt. Wheeler Power home uses the SFY2027 deduction.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_440
        nv_liheap_electricity_provider: MT_WHEELER_POWER
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # 1,440 - 456 (1,440 - 258 = 1,182 at the SFY2026 amount)
    nv_liheap_energy_cost: 984

- name: Case 6, a deduction larger than the bill leaves no electricity cost.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: SOLAR
        # Net grid bill of 25 a month after the panels' output.
        pre_subsidy_electricity_expense: 300
        nv_liheap_electricity_provider: ALAMO_POWER_DISTRICT
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # 300 - 380.04 < 0
    nv_liheap_energy_cost: 0

- name: Case 7, a southern multi-family Southwest Gas account deducts 108 and NV Energy nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_320
        nv_liheap_electricity_provider: NV_ENERGY
        nv_liheap_natural_gas_provider: SOUTHWEST_GAS_SOUTH_MULTI_FAMILY
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # (720 - 108) + 1,320
    nv_liheap_energy_cost: 1_932

- name: Case 8, a fuel-oil-heated home with a gas account deducts no gas service fee.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: FUEL_OIL
        # Rural heating oil of 125 a month.
        fuel_oil_expense: 1_500
        pre_subsidy_electricity_expense: 1_200
        nv_liheap_natural_gas_provider: SOUTHWEST_GAS
    households:
      household:
        members: [person1]
        state_code: NV
  output:
    # The gas bill is not part of the energy cost: 1,500 + 1,200
    nv_liheap_energy_cost: 2_700

# Each vendor's deduction stops at zero on its own bill and does not reach the
# household's other bill: 1,500 + max(300 - 380.04, 0) = 1,500 and
# max(100 - 129.60, 0) + (1,320 - 0) = 1,320.

- name: Case 9, a deduction larger than its own bill leaves the household's other bill whole.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
      person2:
        age: 40
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
        # Rural heating oil of 125 a month.
        fuel_oil_expense: 1_500
        # An electricity bill below the 380.04 Alamo Power District deduction.
        pre_subsidy_electricity_expense: 300
        nv_liheap_electricity_provider: ALAMO_POWER_DISTRICT
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        # A gas bill below the 129.60 Southwest Gas deduction.
        gas_expense: 100
        pre_subsidy_electricity_expense: 1_320
        nv_liheap_electricity_provider: NV_ENERGY
        nv_liheap_natural_gas_provider: SOUTHWEST_GAS
    households:
      household1:
        members: [person1]
        state_code: NV
      household2:
        members: [person2]
        state_code: NV
  output:
    # One floor on the total would give 1,800 - 380.04 = 1,419.96 and
    # 1,420 - 129.60 = 1,290.40.
    nv_liheap_energy_cost: [1_500, 1_320]
