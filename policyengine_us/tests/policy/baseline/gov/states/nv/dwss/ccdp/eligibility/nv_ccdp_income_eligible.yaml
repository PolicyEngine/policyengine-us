        members: [person1, person2, person3]
        nv_ccdp_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: NV
  output:
    # countable income floors at 0: max(-120_000 - 0, 0) = 0 <= intake limit -> eligible
    nv_ccdp_income_eligible: true

- name: Maximum-size family (8) below the intake limit is income-eligible.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
      person2:
        age: 38
      person3:
        age: 12
      person4:
        age: 10
      person5:
        age: 8
      person6:
        age: 6
      person7:
        age: 4
      person8:
        age: 2
    spm_units:
      spm_unit:
        members:
          [
            person1,
            person2,
            person3,
            person4,
            person5,
            person6,
            person7,
            person8,
          ]
        nv_ccdp_enrolled: false
    households:
      household:
        members:
          [
            person1,
            person2,
            person3,
            person4,
            person5,
            person6,
            person7,
            person8,
          ]
        state_code: NV
  output:
    # Family of 8: monthly SMI = 96_026 * 1.38 / 12 = 11_042.99.
    # intake limit = 0.41 * 11_042.99 = 4_527.63/mo.
    # 50_000 / 12 = 4_166.67/mo <= 4_527.63 -> eligible.
    nv_ccdp_income_eligible: true

