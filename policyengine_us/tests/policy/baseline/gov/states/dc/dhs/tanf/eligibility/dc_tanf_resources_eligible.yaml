- name: Households including a person who is monthly_age 60 or older and having resources not exceeding $3,000 are eligible.
  period: 2021-01
  input:
    state_code: DC
    monthly_age: 60
    bank_account_assets: 3_000
  output:
    dc_tanf_resources_eligible: true


- name: Households including a person who is monthly_age 60 or older and having resources exceeding $3,000 are ineligible.
  period: 2021-01
  input:
    state_code: DC
    monthly_age: 60
    bank_account_assets: 3_001
  output:
    dc_tanf_resources_eligible: false


- name: Households including a person who is under monthly_age 60 and having resources not exceeding $2,000 are eligible.
  period: 2021-01
  input:
    state_code: DC
    monthly_age: 59
    bank_account_assets: 2_000
  output:
    dc_tanf_resources_eligible: true

- name: Households including a person who is under monthly_age 60 and having resources exceeding $2,000 are ineligible.
  period: 2021-01
  input:
    state_code: DC
    monthly_age: 59
    bank_account_assets: 2_001
  output:
    dc_tanf_resources_eligible: false

# 798.28 + 2,187.62 + 14.10 = 3,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 3,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 798.28
    stock_assets: 2_187.62
    bond_assets: 14.10
    state_code: DC
  output:
    dc_tanf_resources_eligible: true

# 798.28 + 2,187.62 + 14.11 = 3,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 798.28
    stock_assets: 2_187.62
    bond_assets: 14.11
    state_code: DC
  output:
    dc_tanf_resources_eligible: false
