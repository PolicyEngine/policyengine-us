# These cases pin the reimbursement rate table lookup: provider category by
# child category by schedule type. The category is set directly so that rows
# the age formula never produces, such as the special needs rows, can be
# priced. Only eligible children draw a payment, so each case includes the
# parent the child lives with.
- name: Case 1, infant in a full time traditional child center.
  period: 2025-01
  absolute_error_margin: 0.2
  input:
    people:
      parent:
        age: 30
      infant:
        age: 1
        dc_ccsp_childcare_provider_category: CHILD_CENTER
        dc_ccsp_child_category: INFANT_AND_TODDLER
        dc_ccsp_schedule_type: FULL_TIME_TRADITIONAL
        childcare_attending_days_per_month: 10
    households:
      household:
        members: [parent, infant]
        state_code: DC
  output:
    # $98.65 per day for the infant; the parent is not an eligible child.
    dc_ccsp_maximum_subsidy_amount: [0, 986.5]

- name: Case 2, preschooler in a part-time nontraditional child home.
  period: 2025-01
  absolute_error_margin: 0.2
  input:
    people:
      parent:
        age: 30
      preschooler:
        age: 4
        dc_ccsp_childcare_provider_category: CHILD_HOME_AND_EXPANDED_HOME
        dc_ccsp_child_category: PRESCHOOL
        dc_ccsp_schedule_type: PART_TIME_NONTRADITIONAL
        childcare_attending_days_per_month: 10
    households:
      household:
        members: [parent, preschooler]
        state_code: DC
  output:
    # $39.78 per day at a child development home.
    dc_ccsp_maximum_subsidy_amount: [0, 397.8]

- name: Case 3, a child over the age limit draws no payment even with authorized days of care.
  period: 2025-01
  absolute_error_margin: 0.2
  input:
    people:
      parent:
        age: 40
      teenager:
        age: 14
        dc_ccsp_childcare_provider_category: CHILD_CENTER
        dc_ccsp_child_category: SCHOOL_AGE_BEFORE_OR_AFTER
        dc_ccsp_schedule_type: FULL_TIME_TRADITIONAL
        childcare_attending_days_per_month: 10
    households:
      household:
        members: [parent, teenager]
        state_code: DC
  output:
    # The subsidy covers children under 13, or under 19 with a disability.
    dc_ccsp_maximum_subsidy_amount: [0, 0]
