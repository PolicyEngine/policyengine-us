- name: If one person, grant standard is (418*9 + 437*3)/yr in 2022.
  period: 2022
  input:
    state_code: DC
    dc_tanf_assistance_unit_size: 1
  output:
    dc_tanf_standard_payment: 418 * 9 + 437 * 3  # 5073

- name: If ten people, grant standard is (1672*9 + 1750*3)/yr in 2022.
  period: 2022
  input:
    state_code: DC
    dc_tanf_assistance_unit_size: 10
  output:
    dc_tanf_standard_payment: 1_672 * 9 + 1_750 * 3  # 20298

- name: Only calculate for DC.
  period: 2023
  input:
    state_code: VA
    dc_tanf_assistance_unit_size: 10
  output:
    dc_tanf_standard_payment: 0

- name: 17 people in 2022, max_unit_size is 19 so not capped
  period: 2022
  input:
    state_code: DC
    dc_tanf_assistance_unit_size: 17
  output:
    dc_tanf_standard_payment: 2_500 * 12  # 30000

- name: 17 people in january of 2024, should be capped at 19
  period: 2024-01
  input:
    state_code: DC
    dc_tanf_assistance_unit_size: 17
  output:
    dc_tanf_standard_payment: 2_668

- name: Three people in September 2025 get the FY2025 payment level.
  period: 2025-09
  input:
    state_code:
      2025: DC
    dc_tanf_assistance_unit_size: 3
  output:
    dc_tanf_standard_payment: 781

- name: Three people in October 2025 get the FY2026 payment level.
  period: 2025-10
  input:
    state_code:
      2025: DC
    dc_tanf_assistance_unit_size: 3
  output:
    # D.C. Code 4-205.52(d-1)(2): 781 * 1.029 (2024 CPI-U), rounded down = 803.
    dc_tanf_standard_payment: 803

- name: Ten people in October 2026 keep the FY2026 payment level.
  period: 2026-10
  input:
    state_code:
      2026: DC
    dc_tanf_assistance_unit_size: 10
  output:
    # No inflation adjustment for FY2027-FY2030 (D.C. Code 4-205.52(d-1)(1)(D)).
    dc_tanf_standard_payment: 2_024
