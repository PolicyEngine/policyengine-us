- name: DC foster-care placement waives the income test only in the placement month.
  period: 2026
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head_or_spouse: true
      person2:
        age: 8
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_in_foster_care:
          2026-06: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    # is_in_foster_care is month-defined; the waiver reads it at the month,
    # so January (not yet placed) is not waived and June is.
    dc_ccsp_income_test_waived:
      2026-01: false
      2026-06: true
