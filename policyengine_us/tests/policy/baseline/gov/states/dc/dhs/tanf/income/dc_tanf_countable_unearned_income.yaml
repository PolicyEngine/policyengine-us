- name: No unearned income or child support, $0 per year
  period: 2023
  input:
    state_code: DC
    veterans_benefits: 0
    rental_income: 0
    alimony_income: 0
    dividend_income: 0
    interest_income: 0
    pension_income: 0
    unemployment_compensation: 0
    gi_cash_assistance: 0
    child_support_received: 0
  output:
    dc_tanf_countable_unearned_income: 0


- name: $1,000 of each unearned income and $1,000 in child support, $8,000 per year
  period: 2023
  input:
    state_code: DC
    veterans_benefits: 1_000
    rental_income: 1_000
    alimony_income: 1_000
    dividend_income: 1_000
    interest_income: 1_000
    pension_income: 1_000
    unemployment_compensation: 1_000
    gi_cash_assistance: 1_000
    child_support_received: 1_000 # disregard $150 per month * 12
  output:
    dc_tanf_countable_unearned_income: 8_000


- name: No unearned income and $2,000 in child support, $11,000 per year
  period: 2023
  input:
    state_code: DC
    veterans_benefits: 0
    rental_income: 0
    alimony_income: 0
    dividend_income: 0
    interest_income: 0
    pension_income: 0
    unemployment_compensation: 0
    gi_cash_assistance: 0
    child_support_received: 2_000 # disregard $150 per month * 12
  output:
    dc_tanf_countable_unearned_income: 200


- name: General assistance counts as unearned income, $1,200 per year
  period: 2023
  input:
    state_code: DC
    general_assistance: 1_200
  output:
    dc_tanf_countable_unearned_income: 1_200


- name: No general assistance, $1,200 of pension income only, $1,200 per year
  period: 2023
  input:
    state_code: DC
    pension_income: 1_200
    general_assistance: 0
  output:
    dc_tanf_countable_unearned_income: 1_200


- name: $500 a month of child support in September 2025, first $150 disregarded.
  period: 2025-09
  input:
    state_code:
      2025: DC
    child_support_received:
      2025: 6_000
  output:
    dc_tanf_countable_unearned_income: 350 # 6_000 / 12 - 150 = 500 - 150


- name: $500 a month of child support in October 2025, all of it disregarded.
  period: 2025-10
  input:
    state_code:
      2025: DC
    child_support_received:
      2025: 6_000
  output:
    dc_tanf_countable_unearned_income: 0 # D.C. Code 4-205.11(a)(8): full child support disregarded from October 1, 2025


- name: Child support is disregarded in full from October 2025, other unearned income still counts.
  period: 2026-01
  input:
    state_code: DC
    child_support_received: 6_000
    pension_income: 1_200
  output:
    dc_tanf_countable_unearned_income: 100 # 1_200 / 12; the $500 of child support is disregarded
