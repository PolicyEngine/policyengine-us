# Court/referral approvals are child-specific; rates are fixed here to isolate eligibility and payment scope.
- name: DC court-supervised dependent age 18 and family waivers
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head_or_spouse: true
      child:
        age: 18
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_under_court_supervision: true
    tax_units:
      unit:
        members: &id001
        - parent
        - child
    spm_units:
      unit:
        members: *id001
        dc_ccsp_income_eligible: false
    households:
      home:
        members: *id001
        state_code: DC
  output:
    dc_ccsp_income_test_waived: true
    dc_ccsp_eligible: true
