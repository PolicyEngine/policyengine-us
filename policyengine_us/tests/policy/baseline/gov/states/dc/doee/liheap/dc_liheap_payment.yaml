    dc_liheap_heating_type: HEAT_IN_RENT
    dc_liheap_payment: 250

# Legacy adapter precedence and the mixed-vocabulary override.
- name: Legacy adapter, person-level total takes precedence over the per-fuel bill.
  period: 2024
  input:
    irs_gross_income: 4_001
    dc_liheap_heating_type: GAS
    heating_expense_person: 300
    gas_expense: 1_400
    dc_liheap_housing_type: SINGLE_FAMILY
    spm_unit_size: 3
    state_code: DC
  output:
    # heating_expense_person > 0 wins: min(1_386, 300) = 300
    dc_liheap_payment: 300

- name: Legacy adapter, an explicit zero person-level input falls through to the per-fuel bill.
  period: 2024
  input:
    irs_gross_income: 4_001
    dc_liheap_heating_type: GAS
    heating_expense_person: 0
    gas_expense: 1_400
    dc_liheap_housing_type: SINGLE_FAMILY
    spm_unit_size: 3
    state_code: DC
  output:
    # heating_expense_person == 0 is treated as unset → gas_expense (1_400)
    # min(1_386, 1_400) = 1_386
    dc_liheap_payment: 1_386

- name: Legacy adapter, person-level inputs sum across members.
  period: 2024
  input:
    people:
      person1:
        age: 30
        irs_gross_income: 4_001
        heating_expense_person: 700
      person2:
        age: 28
        heating_expense_person: 500
      person3:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        dc_liheap_heating_type: GAS
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1, person2, person3]
        state_code: DC
  output:
    # 700 + 500 = 1_200 < gas row 1_386 → 1_200
    dc_liheap_payment: 1_200

- name: Mixed vocabularies, the deprecated state override moves only the matrix row.
  period: 2024
  input:
    irs_gross_income: 4_001
    heating_type: NATURAL_GAS
    dc_liheap_heating_type: OIL
    gas_expense: 1_400
    dc_liheap_housing_type: SINGLE_FAMILY
    spm_unit_size: 3
    state_code: DC
  output:
    # Direct enum input wins for the row (oil, 1_500); the cap follows the
    # canonical heating_type (gas bill 1_400): min(1_500, 1_400) = 1_400
    dc_liheap_heating_type: OIL
    dc_liheap_payment: 1_400

# Cooling-only households, FY2026 matrix (period 2026). DOEE's one-time Regular
# benefit helps with heating and cooling costs (DOEE LIHEAP page; FAQ Q3), and
# the matrix amount is a maximum benefit. A home without heating that pays its
# own electricity bill for cooling takes the Electric row, capped at that bill.
# Income levels use 5_000 steps (level 2 up to 10_000, level 3 up to 15_000).
# Wages are at the DC minimum wage of 17.95 an hour from July 1, 2025:
# 15 hours a week is 15 x 52 x 17.95 = 14_001 and 5 hours is 4_667; full time
# at 40.00 an hour is 83_200. Electricity of 1_358.76 a year is EIA's 2024 DC
# average residential bill of 113.23 a month (Table 5A,
# https://www.eia.gov/electricity/sales_revenue_price/pdf/table_5A.pdf).
- name: Cooling only, a home without heating takes the electricity row.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    dc_liheap_heating_type: ELECTRICITY
    # 10_000 < 14_001 <= 15_000
    dc_liheap_income_level: 3
    # SF, level 3, one person: Electric 440; min(440, 1_358.76) = 440
    dc_liheap_payment: 440

- name: Cooling only, the electricity bill caps the electricity row.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 4_667
      person2:
        age: 38
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    # 4_667 <= 5_000
    dc_liheap_income_level: 1
    # SF, level 1, two people: Electric 1_481; min(1_481, 1_358.76) = 1_358.76
    dc_liheap_payment: 1_358.76

- name: No heating and no cooling costs pays nothing despite an electricity bill.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        has_cooling_expense: false
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    # NONE without cooling: heating_expense = 0; min(440, 0) = 0
    dc_liheap_payment: 0

- name: Cooling only, a heated home with no heating cost takes the electricity row.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        # Wood the household gathers itself, so there is no heating bill.
        heating_type: WOOD
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    # DOEE sets no fuel condition on the benefit, and its only energy cost is
    # cooling. SF, level 3, one person: Electric 440; min(440, 1_358.76) = 440.
    dc_liheap_payment: 440

- name: Cooling only, a gas-heated home with no gas bill takes the electricity amount, not its gas row.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        # Gas heat with no gas bill of its own, so there is no heating cost.
        heating_type: NATURAL_GAS
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    dc_liheap_heating_type: GAS
    # Its only energy cost is cooling, so it is paid the Electric amount, not
    # the Gas row (1_193) against the electricity bill. SF, level 3, one
    # person: Electric 440; min(440, 1_358.76) = 440.
    dc_liheap_payment: 440

- name: A heated home with a heating bill and a cooling cost keeps its heating row.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        has_cooling_expense: true
        gas_expense: 300
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    # SF, level 3, one person: Gas 1_193, capped at the 300 heating bill. The
    # cooling cost does not move it to the electricity bill.
    dc_liheap_payment: 300

- name: A heat-in-rent tenant with a cooling cost keeps the flat heat-in-rent amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heat_expense_included_in_rent: true
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    dc_liheap_heating_type: HEAT_IN_RENT
    # Heat in the rent keeps the household off the cooling route: it gets the
    # flat heat-in-rent amount of 200, with no expense cap, not the Electric
    # amount of 440.
    dc_liheap_payment: 200

- name: Cooling only, income above the limit pays nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 83_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    # 83_200 exceeds 60% of the one-person state median income
    dc_liheap_eligible: false
    dc_liheap_payment: 0

# The cooling route needs a known heating type. An unspecified fuel keeps the
# legacy adapter even with a cooling cost: the person-level heating total of
# 300 (as in the legacy precedence case above) caps the Electric row, not the
# electricity bill.
- name: Cooling cost with an unspecified fuel keeps the legacy adapter.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
        heating_expense_person: 300
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    dc_liheap_heating_type: ELECTRICITY
    # SF, level 3, one person: Electric 440; legacy expense 300; min(440, 300) = 300
    dc_liheap_payment: 300

- name: Cooling cost with an unspecified fuel on the deprecated gas row and no gas bill pays nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 14_001
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        dc_liheap_heating_type: GAS
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 1_358.76
        dc_liheap_housing_type: SINGLE_FAMILY
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    # An unspecified fuel stays off the cooling route. The legacy adapter takes
    # the gas bill for the direct GAS row, which is 0: min(1_193, 0) = 0, as on
    # main.
    dc_liheap_payment: 0
