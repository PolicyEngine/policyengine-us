- name: 2026 dependent under 18 is eligible
  period: 2026
  input:
    is_tax_unit_dependent: true
    age: 17
    state_code: DC
  output:
    dc_ctc_eligible_child: true

- name: 2026 dependent age 18 is not eligible
  period: 2026
  input:
    is_tax_unit_dependent: true
    age: 18
    state_code: DC
  output:
    dc_ctc_eligible_child: false

- name: 2026 dependent age 10 is eligible
  period: 2026
  input:
    is_tax_unit_dependent: true
    age: 10
    state_code: DC
  output:
    dc_ctc_eligible_child: true

- name: 2026 non-dependent is not eligible
  period: 2026
  input:
    is_tax_unit_dependent: false
    age: 10
    state_code: DC
  output:
    dc_ctc_eligible_child: false


- name: 2026 single filer who can be claimed as a dependent, no DC child tax credit child
  period: 2026
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: DC
  output:
    # 47-1806.17(a): a child for whom the taxpayer is allowed a
    # deduction under IRC 151; IRC 152(b)(1).
    dc_ctc_eligible_child: [false, false]

- name: 2026 joint return with one spouse who can be claimed as a dependent, no DC child tax credit child (the claimable spouse is the head)
  period: 2026
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: DC
  output:
    dc_ctc_eligible_child: [false, false, false]

