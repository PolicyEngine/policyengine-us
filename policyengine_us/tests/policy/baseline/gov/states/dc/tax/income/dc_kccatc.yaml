# DC Office of Revenue Analysis, Notice N146434 (D.C. Register Vol. 73/37):
# for tax year 2026 the income limit for single and head of household filers
# is $184,300 and the maximum credit is $1,225 per eligible child.
- name: DC KCCATC 2026 head of household just below the $184,300 income limit
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 30
      person2:
        is_tax_unit_dependent: true
        age: 2
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        dc_taxable_income_joint: 184_250
        tax_unit_childcare_expenses: 2_000
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    # 184,250 <= 184,300, so the unit qualifies.
    # Credit = min(2,000 expenses, 1 child x 1,225) = 1,225
    dc_kccatc: 1_225
