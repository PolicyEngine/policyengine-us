    people:
      person1:
        is_tax_unit_head: true
        age: 30
        employment_income: 80_000
      person2:
        is_tax_unit_spouse: true
        age: 28
        employment_income: 80_000
      person3:
        is_tax_unit_dependent: true
        age: 3
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        tax_unit_childcare_expenses: 2_000
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: DC
  output:
