- name: Case 1, household reference income reaches all SPM units while the bill is assigned once.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        employment_income: 10_000
        dc_senior_disabled_property_tax_relief_ownership_share: 0.5
      person2:
        age: 40
        employment_income: 10_000
      person3:
        age: 65
        employment_income: 10_000
        dc_senior_disabled_property_tax_relief_ownership_share: 0.5
      person4:
        age: 40
        employment_income: 10_000
    tax_units:
      tax_unit1:
        members: [person1]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 4_000
      tax_unit2:
        members: [person2]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 0
      tax_unit3:
        members: [person3]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 4_000
      tax_unit4:
        members: [person4]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 0
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
      spm_unit3:
        members: [person3]
      spm_unit4:
        members: [person4]
    households:
      household1:
        members: [person1, person2]
        state_code: DC
        # Owner's2023AGI120000 plus non-FMV resident's40000 counts.
        dc_senior_disabled_property_tax_relief_household_prior_agi: 160_000
        dc_senior_disabled_property_tax_relief_household_prior_agi_available: true
        dc_senior_disabled_property_tax_relief_residence_eligible: true
      household2:
        members: [person3, person4]
        state_code: DC
        # The second resident is an FMV tenant under a written lease:
        # their40000 reference-yearAGI is excluded by47-863(a)(2).
        dc_senior_disabled_property_tax_relief_household_prior_agi: 120_000
        dc_senior_disabled_property_tax_relief_household_prior_agi_available: true
        dc_senior_disabled_property_tax_relief_residence_eligible: true
  output:
    dc_senior_disabled_property_tax_relief_income: [160_000, 160_000, 120_000, 120_000]
    # Each property base is attributed once. Only the second home qualifies.
    dc_senior_disabled_property_tax_relief: [0, 0, 2_000, 0]
