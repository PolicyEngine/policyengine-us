- name: dc_itemized_deductions unit test 1
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        dc_agi: 100_000
      person2:
        is_tax_unit_spouse: true
        dc_agi: 100_000
        real_estate_taxes: 9_000
      person3:
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        casualty_loss_deduction: 1_000
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: DC
  output:
    dc_itemized_deductions: 10_000

- name: dc_itemized_deductions unit test 2
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        dc_agi: 100_000
      person2:
        is_tax_unit_spouse: true
        dc_agi: 200_000
        real_estate_taxes: 12_000
      person3:
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        casualty_loss_deduction: 1_000
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: DC
  output:
    dc_itemized_deductions: 8_000  # = 1_000 + (12_000 - 100_000 * 0.05)

- name: Wagering losses are outside the DC itemized deduction phase-out.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    employment_income: 190_000
    gambling_winnings: 20_000
    gambling_losses: 20_000
    state_code: DC
  output:
    dc_agi: 210_000
    # 90% of 20,000 from 2026
    wagering_losses_deduction: 18_000
    # The phase-out, 5% x (210,000 - 200,000) = 500, applies only to
    # deductions other than medical, casualty and wagering losses.
    dc_itemized_deductions: 18_000

- name: The DC phase-out still reduces other deductions held with wagering losses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    employment_income: 190_000
    gambling_winnings: 20_000
    gambling_losses: 20_000
    charitable_deduction: 10_000
    state_code: DC
  output:
    dc_agi: 210_000
    wagering_losses_deduction: 20_000
    # 20,000 + (10,000 - 500)
    dc_itemized_deductions: 29_500
