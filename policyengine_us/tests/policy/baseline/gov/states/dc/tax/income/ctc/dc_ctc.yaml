- name: 2026 separate filer with phase-out under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 35
        employment_income: 37_500
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SEPARATE
    households:
      household:
        members: [parent, child]
        state_code: DC
  output:
    # $2,500 excess / $1,000 rounds up to 3 increments; 3 * $50 = $150.
    # One child * $1,000 - $150 = $850.
    dc_ctc: 850

- name: 2026 income fully phases out credit under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 35
        employment_income: 100_000
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child]
        state_code: DC
  output:
    # $45,000 excess / $1,000 = 45 increments; 45 * $50 = $2,250.
    # max($1,000 - $2,250, $0) = $0.
    dc_ctc: 0

- name: 2026 non-DC household receives no DC CTC under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 30
        employment_income: 30_000
      child1:
        age: 10
        is_tax_unit_dependent: true
      child2:
        age: 14
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1, child2]
        state_code: OR
  output:
    dc_ctc: 0
    # No state CTC component applies to this household, so the
    # umbrella must be zero (guards against ungated components).
    taxsim_state_ctc: 0

- name: 2026 DC household receives no state child tax credit after temporary expiry
  period: 2026
  input:
    people:
      parent:
        age: 30
        employment_income: 30_000
      child1:
        age: 10
        is_tax_unit_dependent: true
      child2:
        age: 14
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1, child2]
        state_code: DC
  output:
    # Two otherwise qualifying children * $0 = $0, including the umbrella.
    dc_ctc: 0
    taxsim_state_ctc: 0

- name: 2026 child over 18 fails the child test under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 45
        employment_income: 50_000
      child1:
        age: 17
        is_tax_unit_dependent: true
      child2:
        age: 19
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1, child2]
        state_code: DC
  output:
    dc_ctc_eligible_child: [false, true, false]
    # Only child1 meets the child test; one child * $1,000 = $1,000.
    dc_ctc: 1_000
