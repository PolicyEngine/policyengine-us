- name: 2026 temporary child tax credit expires before the calendar year ends
  period: 2026
  input:
    people:
      parent:
        age: 35
        employment_income: 30_000
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child]
        state_code: DC
  output:
    dc_ctc_eligible_child: [false, true]
    # One otherwise qualifying child * $0 after the temporary act expires = $0.
    dc_ctc: 0

- name: 2026 single filer below threshold with 2 children under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 35
        employment_income: 50_000
      child1:
        age: 10
        is_tax_unit_dependent: true
      child2:
        age: 14
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1, child2]
        state_code: DC
  output:
    # Two qualifying children * $1,000 = $2,000.
    dc_ctc: 2_000

- name: 2026 single filer with phase-out under a $1000 amount reform
  period: 2026
  input:
    gov.states.dc.tax.income.credits.ctc.amount: 1_000
    people:
      parent:
        age: 35
        employment_income: 58_000
      child1:
        age: 10
        is_tax_unit_dependent: true
      child2:
        age: 14
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1, child2]
        state_code: DC
  output:
    # $3,000 excess / $1,000 = 3 increments; 3 * $50 = $150 phase-out.
    # Two children * $1,000 - $150 = $1,850.
    dc_ctc: 1_850

