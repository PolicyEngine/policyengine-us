- name: Case 7, 2025 reference income and availability determine eligibility independently of current earnings.
  period: 2025
  input:
    state_code: [DC, DC, DC, DC, DC, DC, DC, DC, DC]
    age: [65, 65, 65, 65, 65, 65, 65, 65, 65]
    employment_income: [1_000_000, 0, 0, 0, 0, 0, 0, 0, 0]
    dc_senior_disabled_property_tax_relief_household_prior_agi: [159_749, 159_750, 0, 0, -1_000, 20_000, 20_000, 20_000, 20_000]
    dc_senior_disabled_property_tax_relief_household_prior_agi_available: [true, true, true, false, true, true, true, true, true]
    dc_senior_disabled_property_tax_relief_residence_eligible: [true, true, true, true, true, false, true, true, true]
    dc_senior_disabled_property_tax_relief_ownership_share: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.4999, 1.01, 0.5]
    dc_senior_disabled_property_tax_relief_pre_relief_tax: [4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 0]
  output:
    # ASD100 Rev02/2025 requires known2023 household AGI strictly below159,750.
    # Negative AGI is not floored; missing facts do not establish entitlement.
    dc_senior_disabled_property_tax_relief_eligible: [true, false, true, false, true, false, false, false, false]

- name: Case 8, categorical status and ownership must satisfy the DC-specific requirements.
  period: 2025
  input:
    state_code: [DC, DC, DC, DC, DC, DC, DC, DC]
    age: [65, 64.99, 40, 40, 40, 65, 65, 40]
    dc_senior_disabled_property_tax_relief_household_prior_agi: [20_000, 20_000, 20_000, 20_000, 20_000, 20_000, 20_000, 20_000]
    dc_senior_disabled_property_tax_relief_household_prior_agi_available: [true, true, true, true, true, true, true, true]
    dc_senior_disabled_property_tax_relief_residence_eligible: [true, true, true, true, true, true, true, true]
    dc_senior_disabled_property_tax_relief_ownership_share: [0.5, 0.5, 0.5, 0.5, 0.5, 1, 1.01, 0.5]
    dc_senior_disabled_property_tax_relief_pre_relief_tax: [4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 4_000, 4_000]
    dc_senior_disabled_property_tax_relief_qualifying_disability: [false, false, true, false, false, true, false, false]
    is_permanently_and_totally_disabled: [false, false, false, true, false, true, false, false]
    total_disability_payments: [0, 0, 0, 0, 10_000, 0, 0, 0]
    is_disabled: [false, false, false, false, false, false, false, true]
  output:
    # A generic disability or private-payment fact does not certify DC's
    # covered disability routes. The same owner needs age65+ or that DC fact.
    dc_senior_disabled_property_tax_relief_eligible: [true, false, true, false, false, true, false, false]

