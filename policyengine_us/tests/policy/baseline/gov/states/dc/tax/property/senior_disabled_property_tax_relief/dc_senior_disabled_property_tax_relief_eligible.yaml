- name: Case 1, senior homeowner with income below the limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 65
        dc_senior_disabled_property_tax_relief_ownership_share: 1
        employment_income: 100_000
        real_estate_taxes: 4_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 4_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: DC
        # FY2026 uses the household's known 2024 federal AGI.
        dc_senior_disabled_property_tax_relief_household_prior_agi: 100_000
        dc_senior_disabled_property_tax_relief_household_prior_agi_available: true
        dc_senior_disabled_property_tax_relief_residence_eligible: true
  output:
    dc_senior_disabled_property_tax_relief_eligible: true

