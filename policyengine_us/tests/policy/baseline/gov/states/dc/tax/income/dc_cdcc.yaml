- name: DC CDCC unit test 1
  period: 2021
  input:
    cdcc_potential: 800
    dc_income_tax_before_credits: 1_000
    state_code: DC
  output:
    dc_cdcc: 256  # = 800 * 0.32

- name: DC CDCC unit test 2
  period: 2022
  input:
    cdcc_potential: 100
    dc_income_tax_before_credits: 1_000
    state_code: DC
  output:
    dc_cdcc: 32  # = 100 * 0.32

- name: DC CDCC 2025 rate still 32%
  period: 2025
  input:
    cdcc_potential: 1_000
    dc_income_tax_before_credits: 1_000
    state_code: DC
  output:
    dc_cdcc: 320  # = 1_000 * 0.32

- name: DC CDCC 2026 rate reduced to 24.25%
  period: 2026
  input:
    cdcc_potential: 1_000
    dc_income_tax_before_credits: 1_000
    state_code: DC
  output:
    dc_cdcc: 242.5  # = 1_000 * 0.2425

- name: DC CDCC is capped by remaining tax liability
  period: 2025
  input:
    cdcc_potential: 1_000
    dc_income_tax_before_credits: 200
    state_code: DC
  output:
    dc_cdcc_potential: 320
    dc_cdcc: 200


- name: 2025 single filer who can be claimed as a dependent, no DC child care credit for a child under 13
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 50_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [filer, child]
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [filer, child]
        state_code: DC
  output:
    # Already zero through the federal child care credit, which no
    # longer counts a child under 13 on such a return.
    dc_cdcc_potential: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no DC child care credit for a child under 13 (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 25_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 25_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: DC
  output:
    dc_cdcc_potential: 0

