- name: Case 1, default dc_other_additions is zero
  period: 2024
  input:
    employment_income: 50_000
    state_code: DC
  output:
    dc_other_additions: 0
    dc_additions: 0
    dc_agi: 50_000

- name: Case 2, dc_other_additions increases DC AGI
  period: 2024
  input:
    employment_income: 50_000
    dc_other_additions: 2_000
    state_code: DC
  output:
    dc_other_additions: 2_000
    dc_additions: 2_000
    dc_agi: 52_000
