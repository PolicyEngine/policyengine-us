- name: Case 1, senior homeowner receives relief in the property tax aggregate only.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        dc_senior_disabled_property_tax_relief_ownership_share: 1
        employment_income: 100_000
        real_estate_taxes: 2_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 4_000
        takes_up_dc_ptc: false
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: DC
        # FY2026 uses the household's known 2024 federal AGI.
        dc_senior_disabled_property_tax_relief_household_prior_agi: 100_000
        dc_senior_disabled_property_tax_relief_household_prior_agi_available: true
        dc_senior_disabled_property_tax_relief_residence_eligible: true
  output:
    dc_senior_disabled_property_tax_relief: 2_000
    taxsim_state_property_tax_credit: 2_000
    state_property_tax_credit: 2_000
    dc_refundable_credits: 0
    household_refundable_state_tax_credits: 0

- name: Case 2, disabled homeowner receives half of property taxes.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        dc_senior_disabled_property_tax_relief_ownership_share: 1
        employment_income: 80_000
        real_estate_taxes: 1_500
        is_permanently_and_totally_disabled: true
        dc_senior_disabled_property_tax_relief_qualifying_disability: true
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        dc_senior_disabled_property_tax_relief_pre_relief_tax: 3_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: DC
        # FY2026 uses the household's known 2024 federal AGI.
        dc_senior_disabled_property_tax_relief_household_prior_agi: 80_000
        dc_senior_disabled_property_tax_relief_household_prior_agi_available: true
        dc_senior_disabled_property_tax_relief_residence_eligible: true
  output:
    dc_senior_disabled_property_tax_relief: 1_500

