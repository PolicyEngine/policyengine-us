- name: Case 5, applicable installment bases determine one nonnegative 50 percent reduction.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [DC, DC, DC, DC, VA, DC]
    age: [65, 65, 65, 65, 65, 65]
    dc_senior_disabled_property_tax_relief_household_prior_agi: [20_000, 20_000, 20_000, 20_000, 20_000, 20_000]
    dc_senior_disabled_property_tax_relief_household_prior_agi_available: [true, true, true, true, true, true]
    dc_senior_disabled_property_tax_relief_residence_eligible: [true, true, true, true, true, false]
    dc_senior_disabled_property_tax_relief_ownership_share: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    dc_senior_disabled_property_tax_relief_pre_relief_tax: [4_000, 2_000, 0, -1_000, 4_000, 4_000]
    dc_senior_disabled_property_tax_relief_qualifying_disability: [true, false, false, false, false, false]
    real_estate_taxes: [2_000, 3_000, 4_000, 4_000, 4_000, 4_000]
  output:
    # Base4000 full year ->2000; base2000 eligible second installment ->1000.
    # Senior plus disability does not double the reduction (ASD100 part7).
    dc_senior_disabled_property_tax_relief: [2_000, 1_000, 0, 0, 0, 0]

- name: Case 6, Schedule H uses the net billed tax independently of direct relief inputs.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [DC, DC]
    age: [65, 65]
    adjusted_gross_income: [20_000, 20_000]
    real_estate_taxes: [2_000, 2_000]
    takes_up_dc_ptc: [true, true]
    dc_senior_disabled_property_tax_relief_household_prior_agi: [20_000, 0]
    dc_senior_disabled_property_tax_relief_household_prior_agi_available: [true, false]
    dc_senior_disabled_property_tax_relief_residence_eligible: [true, false]
    dc_senior_disabled_property_tax_relief_ownership_share: [0.5, 0]
    dc_senior_disabled_property_tax_relief_pre_relief_tax: [4_000, 0]
  output:
    dc_senior_disabled_property_tax_relief: [2_000, 0]
    # ScheduleH2025 line6 uses the actual net bill. Its3%offset is600,
    # leaving1400, below the1425cap, in both information scenarios.
    dc_ptc: [1_400, 1_400]
    real_estate_taxes: [2_000, 2_000]
