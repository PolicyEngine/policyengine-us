- name: 2026 couple aged 66 filing separately on the same DC return splits the senior deduction like other deductions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        is_tax_unit_head: true
        taxable_private_pension_income: 60_000
      person2:
        age: 66
        is_tax_unit_spouse: true
        taxable_private_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    # Deduction: 30,000 + 2 * 1,650 + 2 * 6,000 = 45,300.
    dc_deduction_joint: 45_300
    # Jointly: taxable income 80,000 - 45,300 = 34,700, tax 400 + 6% * 24,700
    # = 1,882. Separately, the deduction is allocated to minimize tax: 45,300
    # to the head leaves 14,700 and 20,000, tax (400 + 6% * 4,700) +
    # (400 + 6% * 10,000) = 682 + 1,000 = 1,682, less than 1,882.
    dc_deduction_indiv: [45_300, 0]
    dc_income_tax_before_credits_joint: 1_882
    dc_income_tax_before_credits_indiv: 1_682
    dc_files_separately: true
    dc_income_tax_before_credits: 1_682

