# Households in 2025 and 2026 under D.C. Act 26-416. DC's rates: 4% to
# $10,000, $400 + 6% to $40,000, $2,200 + 6.5% to $60,000, $3,500 + 8.5% to
# $250,000.

- name: 2026 couple aged 67 and 65, $45,000 military retired pay and $30,000 Social Security, owes no DC tax.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        is_tax_unit_head: true
        military_retirement_pay: 45_000
        social_security_retirement: 15_000
      person2:
        age: 65
        is_tax_unit_spouse: true
        social_security_retirement: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    # Federal AGI 45,000 + taxable Social Security 19,600
    # (0.85 * (60,000 - 44,000) + 6,000) = 64,600; DC subtracts the 19,600.
    dc_agi: [45_000, 0]
    # Senior deduction: MAGI 64,600 < 150,000, so 2 * 6,000 = 12,000.
    dc_additional_deductions: 12_000
    # 30,000 basic + 2 * 1,650 for age + 12,000 = 45,300
    dc_deduction_joint: 45_300
    dc_taxable_income_joint: -300
    dc_income_tax_before_credits: 0
    dc_income_tax: 0

- name: 2025 couple aged 67 and 65, $45,000 military retired pay and $30,000 Social Security, unchanged.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        is_tax_unit_head: true
        military_retirement_pay: 45_000
        social_security_retirement: 15_000
      person2:
        age: 65
        is_tax_unit_spouse: true
        social_security_retirement: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    dc_agi: [45_000, 0]
    # 47-1803.04(d)(9): no senior deduction before 2026.
    dc_additional_deductions: 0
    # 30,000 basic + 2 * 1,600 for age = 33,200
    dc_deduction_joint: 33_200
    dc_taxable_income_joint: 11_800
    # 400 + 6% * 1,800
    dc_income_tax_before_credits: 508
    dc_income_tax: 508

