  output:
    # 15,000 basic + 2,050 for age + 6,000 senior = 23,050
    dc_deduction_joint: 23_050
    dc_taxable_income_joint: 16_950
    # 400 + 6% * 6,950
    dc_income_tax_before_credits: 817

