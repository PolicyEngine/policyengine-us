- name: 2025 claimable filer under 65 cannot claim Schedule H through the federal filing exception
  period: 2025
  input:
    people:
      filer:
        age: 30
        is_tax_unit_head: true
        employment_income: 10_000
        rent: 10_000
        claimable_as_dependent_on_another_return: true
