- name: 2025 Schedule H applies each eligible claimant's own age to their rent
  period: 2025
  input:
    people:
      head:
        age: 69
        employment_income: 20_000
        rent: 12_000
        is_tax_unit_head: true
      spouse:
        age: 70
        employment_income: 20_000
        rent: 1_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: DC
  output:
    # Age 69: 12,000 * 20% - 40,000 * 4% = 800.
    # Age 70: max(1,000 * 20% - 40,000 * 3%, 0) = 0.
    # The couple chooses the eligible claimant with the larger credit: 800.
    dc_ptc: 800

