      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # Section 47-1801.04(13) incorporates IRC 152 dependent status.
    # The filing exception permits claiming one's own dependents.
    # min(1,425, 10,000 * 20% - 10,000 * 3%) = 1,425;
    # section 47-1806.06(k) still bars this claimant, giving 0.
    dc_ptc_has_eligible_claimant: false
    dc_ptc: 0

