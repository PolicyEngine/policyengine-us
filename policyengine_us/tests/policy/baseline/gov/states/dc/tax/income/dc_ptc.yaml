- name: 2025 Schedule H applies each eligible claimant's own age to the couple's rent
  period: 2025
  input:
    people:
      head:
        age: 69
        employment_income: 20_000
        rent: 12_000
        is_tax_unit_head: true
      spouse:
        age: 70
        employment_income: 20_000
        rent: 1_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: DC
  output:
    # The couple pays 13,000: 13,000 * 20% = 2,600.
    # Age 69: 2,600 - 40,000 * 4% = 1,000.
    # Age 70: 2,600 - 40,000 * 3% = 1,400.
    # The couple claims through the spouse aged 70: min(1,425, 1,400) = 1,400.
    dc_ptc: 1_400

