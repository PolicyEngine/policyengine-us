      filer:
        age: 65
        employment_income: 10_000
        rent: 10_000
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # The dependent bar does not apply at 65 or older; the
    # elderly fractions start at 70.
    dc_ptc: 1_425


- name: 2025 claimable filer under 65 cannot claim Schedule H through the federal filing exception
  period: 2025
  input:
    people:
      filer:
        age: 30
        is_tax_unit_head: true
        employment_income: 10_000
        rent: 10_000
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # Section 47-1801.04(13) incorporates IRC 152 dependent status.
    # The filing exception permits claiming one's own dependents.
    # min(1,425, 10,000 * 20% - 10,000 * 3%) = 1,425;
    # section 47-1806.06(k) still bars this claimant, giving 0.
    dc_ptc_has_eligible_claimant: false
    dc_ptc: 0

- name: 2025 single filer who can be claimed but is not claimed cannot claim Schedule H
  period: 2025
  input:
    people:
      filer:
        age: 30
        is_tax_unit_head: true
        employment_income: 10_000
        rent: 10_000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # 47-1806.06(k) turns on being a dependent, not on an
    # actual claim.
    dc_ptc: 0

- name: 2025 Schedule H uses the eligible spouse's own rent when the head can be claimed
