- name: 2025 Schedule H leaves a non-filer child's rent out of the filing unit's rent
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        is_tax_unit_head: true
      child:
        age: 10
        rent: 10_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: DC
  output:
    # The head can claim but pays no rent: max(0 * 20% - 10,000 * 3%, 0) = 0.
    dc_ptc_eligible_claimant: [true, false]
    dc_ptc: 0
