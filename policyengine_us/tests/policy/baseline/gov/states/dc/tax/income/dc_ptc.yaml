- name: 2025 single filer who can be claimed as a dependent, property tax credit only through a claimant who is not a dependent
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        rent: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # D.C. Code 47-1806.06(k) bars a claimant who was a dependent,
    # unless 65 or older; one claimant per tax filing unit, so the
    # spouse who is not a dependent claims it.
    # min(0.20 x 10,000 - 3% x 10,000, 1,425) = 1,425
    dc_ptc: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, property tax credit only through a claimant who is not a dependent (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        rent: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        rent: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: DC
  output:
    dc_ptc: 1_425

