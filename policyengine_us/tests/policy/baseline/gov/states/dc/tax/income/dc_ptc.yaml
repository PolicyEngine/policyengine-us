- name: 2025 single filer who can be claimed as a dependent, property tax credit only through a claimant who is not a dependent
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        rent: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # D.C. Code 47-1806.06(k) bars a claimant who was a dependent,
    # unless 65 or older: 1,425 before the claimant bar, then 0.
    dc_ptc: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, property tax credit only through a claimant who is not a dependent (the claimable spouse is the head)
