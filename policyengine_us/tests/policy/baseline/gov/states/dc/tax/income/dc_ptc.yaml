- name: 2025 single filer aged 65 who can be claimed as a dependent claims the property tax credit
  period: 2025
  input:
    people:
      filer:
        age: 65
        employment_income: 10_000
        rent: 10_000
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: DC
  output:
    # The dependent bar does not apply at 65 or older; the
    # elderly fractions start at 70.
    dc_ptc: 1_425
