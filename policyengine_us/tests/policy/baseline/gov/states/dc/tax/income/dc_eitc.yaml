- name: DC EITC childless amount for a disabled parent dependent
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 20_000
        ssn_card_type: CITIZEN
      dependent:
        age: 75
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        ssn_card_type: CITIZEN
        has_tin: true
        is_parent_of_filer_or_spouse: true
    tax_units:
      tax_unit:
        members: [head, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, dependent]
        state_code: DC
  output:
    # A parent fails the IRC 152(c)(2) relationship test, so the disabled
    # parent is a qualifying relative, not a qualifying child. (f)(1)(C):
    # min(7.65% x 20,000, 600) - 8.48% x max(0, 20,000 - 21,888) = 600.
    is_eitc_qualifying_child: [false, false]
    eitc_child_count: 0
    dc_eitc_has_qualifying_child: false
    dc_eitc_with_qualifying_child: 0
    dc_eitc_without_qualifying_child: 600
    dc_eitc: 600

