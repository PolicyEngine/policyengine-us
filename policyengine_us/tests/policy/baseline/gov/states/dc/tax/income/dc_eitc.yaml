        members: [head, dependent]
        state_code: DC
  output:
    # 70% x the one-child federal-like credit of 3,995, as if the ITIN met
    # IRC 32(m).
    eitc: 0
    dc_eitc_with_qualifying_child: 2_796.5
    dc_eitc_without_qualifying_child: 0
    dc_eitc: 2_796.5

- name: DC EITC matches the childless federal credit for a filer with only an ITIN child in TY2021
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 20_000
        ssn_card_type: CITIZEN
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [head, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, dependent]
        state_code: DC
  output:
    # ARPA's 2021 childless credit: 1,502 - 15.3% x (20,000 - 11,610) =
    # 218.33 is the federal credit allowed; DC matches 40% of it.
    eitc: 218.33
    dc_eitc_with_qualifying_child: 87.33
    dc_eitc_without_qualifying_child: 0
    dc_eitc: 87.33

