- name: DC EITC keeps a filer whose qualifying child has no TIN on the with-child schedule before 2023 (TY2022)
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 20_000
        ssn_card_type: CITIZEN
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        ssn_card_type: NONE
        has_tin: false
    tax_units:
      tax_unit:
        members: [head, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, dependent]
        state_code: DC
  output:
    # IRC 32(m) treats a child with no TIN exactly like a child with an
    # ITIN, and (f)(1)(D)(ii) does not apply before 2023, so this matches the
    # ITIN case above. The child is still a qualifying child under (f)(4) and
    # IRC 32(c)(3)(A); the 2022 D-40 worksheet says "If you have a qualifying
    # child DO NOT USE THIS WORKSHEET". Routing on the child's TIN sent this
    # unit to the (f)(1)(C) childless schedule and paid 560.
    eitc: 0
    dc_eitc_has_qualifying_child: true
    dc_eitc_with_qualifying_child: 0
    dc_eitc_without_qualifying_child: 0
    dc_eitc: 0

