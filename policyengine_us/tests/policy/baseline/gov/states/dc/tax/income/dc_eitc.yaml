- name: Without the TIN rule, a filer whose qualifying child has no TIN gets the with-child match on the self-only credit in 2023
  period: 2023
  absolute_error_margin: 0.01
  input:
    gov.states.dc.tax.income.credits.eitc.qualifying_child_tin_required: false
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 6_000
        ssn_card_type: CITIZEN
      dependent:
        age: 10
        is_tax_unit_dependent: true
        ssn_card_type: NONE
        has_tin: false
    tax_units:
      tax_unit:
        members: [head, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, dependent]
        state_code: DC
  output:
    # The child stays a qualifying child but is not counted in the IRC 32(b)
    # computation, so the base is the self-only amount, 7.65% x 6,000 = 459,
    # and the match is 70% of it.
    dc_eitc_has_qualifying_child: true
    dc_eitc_with_qualifying_child: 321.3
    dc_eitc_without_qualifying_child: 0
    dc_eitc: 321.3

