- name: DC EITC pays a filer whose only qualifying child is a disabled adult with an ITIN
  period: 2023
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 20_000
      disabled_adult:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [head, disabled_adult]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, disabled_adult]
        state_code: DC
  output:
    # The federal credit needs a Social Security number; from 2023 D.C. Code
    # 47-1806.04(f)(1)(D)(ii), added by D.C. Law 24-167 section 7012, accepts
    # an ITIN. The childless branch also counts this dependent as a child,
    # so before the router matched it the unit got neither credit.
    eitc_child_count: 0
    dc_eitc_without_qualifying_child: 0
    dc_eitc_with_qualifying_child: 2_796.5
    dc_eitc: 2_796.5


- name: DC EITC does not count an ITIN child before 2023 (TY2022)
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 20_000
        ssn_card_type: CITIZEN
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [head, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, dependent]
        state_code: DC
  output:
    # (f)(1)(D)(ii) applies only to tax years beginning after December 31,
    # 2022. Before then IRC 32(c)(3)(D) keeps the ITIN child out of the
    # federal credit, which for this filer is the childless amount:
    # 560 - 7.65% x (20,000 - 9,160) < 0. The child is still a qualifying
    # child, so the (f)(1)(C) childless schedule does not apply.
    eitc: 0
    dc_eitc_has_qualifying_child: true
    dc_eitc_with_qualifying_child: 0
    dc_eitc_without_qualifying_child: 0
    dc_eitc: 0

- name: DC EITC counts an ITIN child from 2023 (TY2023)
