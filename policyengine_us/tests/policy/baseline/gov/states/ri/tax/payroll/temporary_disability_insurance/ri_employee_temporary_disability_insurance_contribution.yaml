  period: 2018
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    state_code: RI
  output:
    ri_temporary_disability_insurance_taxable_wages: 69_300
    # 1.1% * 69,300 = 762.30, the 2018 maximum in ADV 2017-47.
    ri_employee_temporary_disability_insurance_contribution: 762.30
    ri_employee_state_payroll_tax: 762.30
    employee_state_payroll_tax: 762.30

