# Dependents' income is not in federal AGI (they report it on their own
# return), so RI subtractions count only the head's and spouse's amounts.
# R.I. Gen. Laws § 44-30-12(c)(11): the taxpayer's military service pension
# benefits included in federal adjusted gross income.

- name: A dependent child's military retirement pay is not subtracted from the filer's income.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: RI
  output:
    ri_subtractions: 0
    ri_agi: 50_000

- name: Only the head's and spouse's military retirement pay is subtracted, not a dependent's.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 45
        employment_income: 50_000
        military_retirement_pay: 8_000
      person2:
        age: 45
        military_retirement_pay: 6_000
      person3:
        age: 16
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # 8,000 + 6,000; the dependent's 10,000 is excluded.
    ri_subtractions: 14_000

- name: An aged head's capped retirement subtraction ignores a dependent's pension and military retirement pay.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 60_000
      person2:
        age: 16
        is_tax_unit_dependent: true
        taxable_pension_income: 10_000
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: RI
  output:
    # Head born 1955 (on or before 1959) with federal AGI 60,000 (below the
    # 107,000 limit) is eligible; the head's 60,000 is capped at 50,000.
    ri_retirement_income_subtraction: 50_000
    ri_subtractions: 50_000

- name: Aged joint filers count only their own retirement income and military retirement pay, not their dependent's.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 60_000
      person2:
        age: 70
        taxable_pension_income: 20_000
        military_retirement_pay: 5_000
      person3:
        age: 16
        is_tax_unit_dependent: true
        taxable_pension_income: 30_000
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # Federal AGI 80,000 is below the 133,750 joint limit. Retirement
    # subtraction: min(60,000, 50,000) + min(20,000, 50,000) = 70,000.
    # Military retirement pay: the spouse's 5,000 only.
    ri_retirement_income_subtraction: 70_000
    ri_subtractions: 75_000
