- name: Property tax income test
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      you:
        long_term_capital_gains: 1_000
        qualified_dividend_income: 2_000
    households:
      household:
        members: [you]
        state_code: RI
  output:
    capital_gains_excluded_from_taxable_income: 3_000
    adjusted_gross_income: 3_000
    ri_property_tax_household_income: 3_000

# Natural 2025 wage-only households: Part 5 line 14 flows to household
# income line 32. No program-income or eligibility result is supplied.
# These cases verify only the ceiling correction and retained financial path;
# they do not certify the separate domicile/payment/expense gaps.
# 2025 RI-1040H, Part 1E and physical page 3: household income is
# $40,730.00 or less. These fractional cases preserve the existing raw
# engine precision; they do not assert a rule for rounding a filed return.
# https://tax.ri.gov/sites/g/files/xkgbur541/files/2026-01/2025%201040H_w.pdf
- name: Case 4, one-person natural wages 40731 fail the 2025 income ceiling.
  period: 2025
  input:
    people:
      person1:
        age: 65
        employment_income: 40_731
        real_estate_taxes: 4_000
        rent: 0
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
    families:
      family:
        members: [person1]
    marital_units:
      marital_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Wages total 40731; the inclusive 40730 ceiling requires credit 0.
    ri_property_tax_household_income: 40_731
    ri_property_tax_credit_eligible: false
    ri_property_tax_credit: 0

- name: Case 5, one-person natural wages 40730 reach the 2025 maximum at the inclusive ceiling.
  period: 2025
  input:
    people:
      person1:
        age: 65
        employment_income: 40_730
        real_estate_taxes: 4_000
        rent: 0
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
    families:
      family:
        members: [person1]
    marital_units:
      marital_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Wages total 40730; 4000 - .06 * 40730 = 1556.20, capped at 700.
    ri_property_tax_household_income: 40_730
    ri_property_tax_credit_eligible: true
    ri_property_tax_credit: 700

