- name: Not eligible for child tax rebate, one child
  period: 2021
  input:
    people:
      head:
        age: 30
        is_tax_unit_dependent: false
      child1: 
        age: 19
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_units:
        members: [head, child1, child2]
