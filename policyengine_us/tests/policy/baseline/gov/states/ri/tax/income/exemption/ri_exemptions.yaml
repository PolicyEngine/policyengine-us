- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        ri_agi: 10000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: RI
  output:
    # R.I. Gen. Laws 44-30-2.6: "If someone else can claim you on their return,
    # your exemption amount is zero"; IRC 152(b)(1).
    ri_exemptions: 5_100

- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
        ri_agi: 10000
    households:
      household:
        members: [person_b, person_a, child]
        state_code: RI
  output:
    ri_exemptions: 5_100

