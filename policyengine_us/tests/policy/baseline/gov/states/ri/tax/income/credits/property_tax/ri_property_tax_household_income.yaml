# R.I. Gen. Laws 44-33-3(6): "Household income" means all income received by
# all persons of a household, and 44-33-3(7) counts all payments received
# under the federal Social Security Act. Unlike the per-return readers, this
# household amount keeps a dependent's benefits.

- name: A dependent grandchild's Social Security counts in household income
  period: 2025
  input:
    people:
      grandparent:
        age: 70
        employment_income: 5_000
        social_security_retirement: 10_000
      grandchild:
        age: 12
        is_tax_unit_dependent: true
        social_security_survivors: 6_000
    tax_units:
      tax_unit:
        members: [grandparent, grandchild]
    households:
      household:
        members: [grandparent, grandchild]
        state_code: RI
  output:
    # Combined income of 5_000 + 10_000 / 2 = 10_000 is below the $25,000
    # base amount, so none of the grandparent's benefit is taxable.
    adjusted_gross_income: 5_000
    filer_tax_exempt_social_security: 10_000
    # 5_000 + 10_000 + the grandchild's 6_000.
    ri_property_tax_household_income: 21_000
