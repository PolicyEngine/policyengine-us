  period: 2025
  input:
    state_code: RI
    age: 75
    is_surviving_spouse: true
    ri_retirement_income_subtraction_eligible: true
    taxable_pension_income: 10_000
    military_retirement_pay_survivors: 20_000
  output:
    ri_military_retirement_subtraction: 20_000
    ri_retirement_income_subtraction: 10_000
    ri_subtractions: 30_000
