# The age test applies to each spouse: only retirement income received by a
# taxpayer born on or before the threshold qualifies. The 2025 threshold
# year is 1959.
- name: 2025 - Joint, only the older spouse's pension qualifies
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 70 # born 1955, on or before 1959
        taxable_pension_income: 10_000
      spouse:
        age: 60 # born 1965, after 1959
        taxable_pension_income: 30_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: RI
  output:
    # AGI 40,000 < 133,750 and the head qualifies by age.
    ri_retirement_income_subtraction_eligible: true
    # min(10,000, 50,000) for the head; the spouse's 30,000 does not qualify.
    ri_retirement_income_subtraction: 10_000

- name: 2025 - Joint, the younger spouse's pension does not qualify through the older spouse
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 60 # born 1965
        taxable_pension_income: 30_000
      spouse:
        age: 70 # born 1955
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: RI
  output:
    ri_retirement_income_subtraction_eligible: true
    ri_retirement_income_subtraction: 0

- name: 2025 - Joint, both spouses qualify by age
  # The form's cutoff falls on March 1, 1959, and the model reads birth year
  # only, so it counts a head born in 1959 as qualifying.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 66 # born 1959, the threshold year
        taxable_pension_income: 60_000
      spouse:
        age: 70 # born 1955
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: RI
  output:
    # min(60,000, 50,000) + min(20,000, 50,000) = 70,000; AGI 80,000 < 133,750.
    ri_retirement_income_subtraction: 70_000
