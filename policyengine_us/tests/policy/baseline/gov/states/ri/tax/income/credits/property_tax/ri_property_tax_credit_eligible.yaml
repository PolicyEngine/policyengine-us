- name: Head above minimum age, and disabled
  period: 2022
  input:
    people:
      head:
        age: 65
        is_disabled: true
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: RI
  output:
    ri_property_tax_credit_eligible: true

