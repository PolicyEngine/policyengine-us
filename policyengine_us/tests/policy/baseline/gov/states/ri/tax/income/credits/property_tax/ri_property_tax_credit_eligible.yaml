- name: 2025 single filer who can be claimed as a dependent: property tax relief needs a claimant aged 65 or older or disabled who is not claimed as a dependent
  period: 2025
  input:
    people:
      filer:
        age: 65
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: RI
  output:
    # R.I. Gen. Laws 44-33-3: the claimant does not include any person
    # claimed as a dependent by any taxpayer.
    ri_property_tax_credit_eligible: false
    ri_property_tax_credit: 0

- name: 2025 joint return with one claimable spouse: property tax relief needs a claimant aged 65 or older or disabled who is not claimed as a dependent (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 65
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 65
        real_estate_taxes: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: RI
  output:
    # The unclaimed spouse, aged 65, may be the claimant (household
    # members choose who claims). Household income $0, so the
    # threshold is $0; property tax $1,000 is capped at the 2025
    # maximum of $700.
    ri_property_tax_credit_eligible: true
    ri_property_tax_credit: 700

