- name: 2025 joint return with neither spouse claimable: property tax relief needs a claimant aged 65 or older or disabled who is not claimed as a dependent
  period: 2025
  input:
    people:
      person_a:
        age: 65
        real_estate_taxes: 500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 65
        real_estate_taxes: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: RI
  output:
    # Same as above: min($1,000 - 0 x 3%, $700) = $700.
    ri_property_tax_credit_eligible: true
    ri_property_tax_credit: 700

- name: 2025 joint return where only the claimable spouse is 65 or older: property tax relief has no eligible claimant (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 65
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        real_estate_taxes: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: RI
  output:
    # The age test and the dependency test apply to the same claimant,
    # so the claimed spouse's age does not qualify the other spouse.
    ri_property_tax_credit_eligible: false
    ri_property_tax_credit: 0

