# Unit tests for the Rhode Island Marketplace Affordability Program applicable
# percentage, from the Plan Year 2027 Rhode Island Applicable Percentage Table
# (HealthSource RI, 2027 RIMAP Final Parameters, p.3):
#   100-133%: 0% to 0%; 133-150%: 0% to 0%; 150-200%: 0% to 2%, proportional
#   to the position in the band (p.2); 200-400%: none (returns 0);
#   above 400%: 18%.
# aca_magi and aca_fpg are supplied directly; ratio = aca_magi / 15,960.

- name: Case 1, exactly 100% of the poverty line pays 0%.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 15_960
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 2, 133% pays 0%.
  # 21,226.80 / 15,960 = 1.33.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 21_226.8
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 3, exactly 150% starts the 0% to 2% band at 0%.
  # 23,940 / 15,960 = 1.50.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 23_940
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 4, 160% is a fifth of the way through the band.
  # 25,536 / 15,960 = 1.60; 0.02 x (1.60 - 1.50) / 0.50 = 0.004.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 25_536
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.004

- name: Case 5, 175% is halfway through the band.
  # 27,930 / 15,960 = 1.75; 0.02 x 0.25 / 0.50 = 0.01.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 27_930
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.01

- name: Case 6, 199% uses the exact position, not a truncated one.
  # 31,760.40 / 15,960 = 1.99; 0.02 x 0.49 / 0.50 = 0.0196.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 31_760.4
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.0196

- name: Case 7, one dollar below 200%.
  # 31,919 / 15,960 = 1.9999373; 0.02 x 0.4999373 / 0.50 = 0.0199975.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 31_919
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.0199975

- name: Case 8, exactly 200% has no Rhode Island percentage.
  # The 200-250% row is "--": 31,920 / 15,960 = 2.00 is not below 200%.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 31_920
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 9, 300% has no Rhode Island percentage.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 47_880
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 10, exactly 400% has no Rhode Island percentage.
  # "At least 300% but not more than 400%" is "--"; 18% starts above 400%.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 63_840
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0

- name: Case 11, one dollar above 400% pays 18%.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 63_841
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.18

- name: Case 12, 450% pays 18%.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    aca_magi: 71_820
    aca_fpg: 15_960
    state_code: RI
  output:
    ri_rimap_applicable_percentage: 0.18
