# Unit tests for the Rhode Island Marketplace Affordability Program amount:
#   amount = max(0, SLCSP - federal credit - RI% x income)
# (2027 RIMAP Final Parameters pp.1-3). Eligibility (ri_rimap_eligible),
# aca_magi, aca_fpg, the annual benchmark (slcsp) and the federal credit
# (aca_ptc) are supplied directly so each value can be checked by hand. The
# supplied credits are the 2027 federal amounts: SLCSP minus the federal
# applicable percentage of income (2.15% at 120%; 4.30% at 150%; 5.54% at
# 175%; 6.7304% at a truncated 199%).

- name: Case 1, 175% (the survey's hand check).
  # RI% = 1.00%. 9,000 - 7,452.678 - 0.01 x 27,930 = 1,547.322 - 279.30
  # = 1,268.022, or (5.54% - 1.00%) x 27,930.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 27_930
        aca_fpg: 15_960
        slcsp: 9_000
        aca_ptc: 7_452.678
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 1_268.022

- name: Case 2, 120% covers the whole benchmark premium left after the federal credit.
  # RI% = 0%. 9,000 - 8,588.232 - 0 = 411.768 (2.15% x 19,152).
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 19_152
        aca_fpg: 15_960
        slcsp: 9_000
        aca_ptc: 8_588.232
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 411.768

- name: Case 3, exactly 150% still pays 0%.
  # RI% = 0%. 9,000 - 7,970.58 = 1,029.42 (4.30% x 23,940).
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 23_940
        aca_fpg: 15_960
        slcsp: 9_000
        aca_ptc: 7_970.58
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 1_029.42

- name: Case 4, one dollar below 200%.
  # RI% = 0.02 x (31,919 / 15,960 - 1.5) / 0.5 = 0.01999749.
  # 9,000 - 6,851.723624 - 0.01999749 x 31,919 = 2,148.276376 - 638.300
  # = 1,509.976.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 31_919
        aca_fpg: 15_960
        slcsp: 9_000
        aca_ptc: 6_851.723624
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 1_509.976

- name: Case 5, a benchmark below the federal contribution leaves no federal credit.
  # At 175% the federal contribution is 5.54% x 27,930 = 1,547.32, above the
  # 1,000 benchmark, so the credit is 0. 1,000 - 0 - 0.01 x 27,930 = 720.70.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 27_930
        aca_fpg: 15_960
        slcsp: 1_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 720.70

- name: Case 6, a benchmark below the Rhode Island share floors at zero.
  # 200 - 0 - 0.01 x 27,930 = -79.30, floored at 0.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 27_930
        aca_fpg: 15_960
        slcsp: 200
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 0

- name: Case 7, 450% (the survey's hand check).
  # No federal credit above 400%. 15,000 - 0.18 x 71,820 = 15,000 - 12,927.60
  # = 2,072.40.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 71_820
        aca_fpg: 15_960
        slcsp: 15_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 2_072.40

- name: Case 8, one dollar above 400%.
  # 15,000 - 0.18 x 63,841 = 15,000 - 11,491.38 = 3,508.62.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 63_841
        aca_fpg: 15_960
        slcsp: 15_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 3_508.62

- name: Case 9, 600% with 18% of income above the benchmark gets nothing.
  # 15,000 - 0.18 x 95,760 = 15,000 - 17,236.80 < 0, floored at 0.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: true
        aca_magi: 95_760
        aca_fpg: 15_960
        slcsp: 15_000
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 0

- name: Case 10, an ineligible tax unit gets nothing.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        ri_rimap_eligible: false
        aca_magi: 27_930
        aca_fpg: 15_960
        slcsp: 9_000
        aca_ptc: 7_452.678
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_rimap: 0
