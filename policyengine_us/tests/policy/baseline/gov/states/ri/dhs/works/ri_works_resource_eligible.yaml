# Unit tests for Rhode Island TANF resource eligibility
# 218-RICR-20-00-2: Resource limit is $5,000
# https://rules.sos.ri.gov/Regulations/part/218-20-00-2

- name: Case 1, no resources, eligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 0
    state_code: RI
  output:
    ri_works_resource_eligible: true

- name: Case 2, resources below limit, eligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 3_000
    state_code: RI
  output:
    # Resources: $3,000
    # Limit: $5,000
    # $3,000 <= $5,000 = true
    ri_works_resource_eligible: true

- name: Case 3, resources at limit, eligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 5_000
    state_code: RI
  output:
    # Resources: $5,000
    # Limit: $5,000
    # $5,000 <= $5,000 = true
    ri_works_resource_eligible: true

- name: Case 4, resources above limit, ineligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 6_000
    state_code: RI
  output:
    # Resources: $6,000
    # Limit: $5,000
    # $6,000 <= $5,000 = false
    ri_works_resource_eligible: false

- name: Case 5, resources one dollar above limit, ineligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 5_001
    state_code: RI
  output:
    # Resources: $5,001
    # Limit: $5,000
    # $5,001 <= $5,000 = false
    ri_works_resource_eligible: false

- name: Case 6, resources one dollar below limit, eligible.
  period: 2025-01
  input:
    spm_unit_cash_assets: 4_999
    state_code: RI
  output:
    # Resources: $4,999
    # Limit: $5,000
    # $4,999 <= $5,000 = true
    ri_works_resource_eligible: true

# 4,211.74 + 769.20 + 19.06 = 5,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 5,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_211.74
    stock_assets: 769.20
    bond_assets: 19.06
    state_code: RI
  output:
    ri_works_resource_eligible: true

# 4,211.74 + 769.20 + 19.07 = 5,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_211.74
    stock_assets: 769.20
    bond_assets: 19.07
    state_code: RI
  output:
    ri_works_resource_eligible: false
