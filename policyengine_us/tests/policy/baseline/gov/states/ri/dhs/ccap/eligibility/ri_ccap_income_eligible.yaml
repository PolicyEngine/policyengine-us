# 2025 FPG family of 3 (contiguous US): 15_650 + 5_500 * 2 = 26_650
# 261% FPL = 26_650 * 2.61 = 69_556.50
# 300% FPL = 26_650 * 3.00 = 79_950.00

- name: Case 1, new applicant income below 261 percent FPL.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
        employment_income: 50_000
      person2:
        age: 5
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # income 50,000 <= 69,556.50 (261% of 26,650) -> eligible
    ri_ccap_income_eligible: true

- name: Case 2, new applicant income above 261 percent FPL.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
        employment_income: 70_000
      person2:
        age: 5
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # income 70,000 > 69,556.50 (261% of 26,650) -> ineligible
    ri_ccap_income_eligible: false

- name: Case 3, enrolled family income between 261 and 300 percent FPL.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
        employment_income: 75_000
      person2:
        age: 5
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # enrolled: income 75,000 <= 79,950 (300% of 26,650) -> eligible
    ri_ccap_income_eligible: true

- name: Case 4, enrolled family income above 300 percent FPL.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
        employment_income: 80_000
      person2:
        age: 5
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # enrolled: income 80,000 > 79,950 (300% of 26,650) -> ineligible
    ri_ccap_income_eligible: false

- name: Case 5, non-enrolled family between 261 and 300 percent FPL.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
        employment_income: 75_000
      person2:
        age: 5
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    # not enrolled: income 75,000 > 69,556.50 (261% of 26,650) -> ineligible
    ri_ccap_income_eligible: false

- name: Case 6, zero income family is eligible.
  period: 2025-01
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: RI
  output:
    ri_ccap_income_eligible: true

- name: Case 7, a new applicant qualifies at the 180 percent limit.
  period: 2019
  input:
    people:
      person1: {age: 30}
      person2: {age: 5}
      person3: {age: 3}
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_countable_income:
          2019-07: 3_199.50
          2019-08: 3_199.51
    households:
      household: {members: [person1, person2, person3], state_code: RI}
  output:
    # A three-person guideline of $21,330 gives $3,199.50 per month at 180%.
    ri_ccap_income_eligible:
      2019-07: true
      2019-08: false

- name: Case 8, an enrolled family qualifies at the 225 percent limit.
  period: 2017
  input:
    people:
      person1: {age: 30}
      person2: {age: 5}
      person3: {age: 3}
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_enrolled: true
        ri_ccap_countable_income:
          2017-07: 3_828.75
          2017-08: 3_828.76
    households:
      household: {members: [person1, person2, person3], state_code: RI}
  output:
    # The statute includes equality. $20,420 × 225% ÷ 12 gives $3,828.75.
    ri_ccap_income_eligible:
      2017-07: true
      2017-08: false

- name: Case 9, July 2022 raises the entry and continuation limits.
  period: 2022
  input:
    people:
      person1: {age: 30}
      person2: {age: 5}
      person3: {age: 3}
      person4: {age: 30}
      person5: {age: 5}
      person6: {age: 3}
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        ri_ccap_countable_income: {2022-06: 3_600, 2022-07: 3_600}
      spm_unit2:
        members: [person4, person5, person6]
        ri_ccap_enrolled: true
        ri_ccap_countable_income: {2022-06: 5_000, 2022-07: 5_000}
    households:
      household1: {members: [person1, person2, person3], state_code: RI}
      household2: {members: [person4, person5, person6], state_code: RI}
  output:
    # The statute raises entry from 180% to 200% and continuation from 225% to 300%.
    ri_ccap_income_eligible:
      2022-06: [false, false]
      2022-07: [true, true]

- name: Case 10, January 2025 raises the entry limit.
  period: 2025
  input:
    people:
      person1: {age: 30}
      person2: {age: 5}
      person3: {age: 3}
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ri_ccap_countable_income: {2024-12: 5_000, 2025-01: 5_000}
    households:
      household: {members: [person1, person2, person3], state_code: RI}
  output:
    # The statute raises the ordinary limit from 200% to 261%.
    ri_ccap_income_eligible:
      2024-12: false
      2025-01: true

- name: Case 11, December 2026 still applies the 261 and 300 percent limits.
  period: 2026-12
  input:
    people:
      person1: {age: 30}
      person2: {age: 5}
      person3: {age: 3}
      person4: {age: 30}
      person5: {age: 5}
      person6: {age: 3}
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        ri_ccap_countable_income: 6_100
      spm_unit2:
        members: [person4, person5, person6]
        ri_ccap_enrolled: true
        ri_ccap_countable_income: 7_000
    households:
      household1: {members: [person1, person2, person3], state_code: RI}
      household2: {members: [person4, person5, person6], state_code: RI}
  output:
    # The statute puts the 285% and 325% limits into effect in January 2027.
    ri_ccap_income_eligible: [false, false]
