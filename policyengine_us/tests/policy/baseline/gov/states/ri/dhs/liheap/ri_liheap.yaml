# Threshold edge for the two-person limit, reached end to end. The undocumented parent is
# not counted in the size (manual page 12) but her wages count, so the qualified size is
# 2 (the citizen spouse and child) and the FY2026 limit is 55,252, not the three-person
# 68,253. Income 55,252 equals the limit, which is inclusive. Size 2 bands use the 2025
# guideline 21,150: 55,252 > 31,725 (150%) is band 5 (row E): natural gas 159 + 350 = 509.
- name: Case 16, threshold edge, a mixed-status family at the two-person income limit is eligible.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_full_time_student: false
        ssi: 0
        employment_income: 55_252
      person2:
        age: 38
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
      person3:
        age: 9
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        childcare_expenses: 0
        child_care_subsidies: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
        is_in_public_housing: false
  output:
    ri_liheap_household_size: 2
    ri_liheap_income: 55_252
    ri_liheap_income_limit: 55_252
    ri_liheap_eligible: true
    ri_liheap_income_band: 5
    ri_liheap: 509

