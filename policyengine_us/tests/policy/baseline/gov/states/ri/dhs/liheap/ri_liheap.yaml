# FY2026 row G prints $400 under Deliverables, Natural Gas and Other and leaves the
# Electric cell blank. Wages are the 2026 Rhode Island minimum wage: 16 x 40 x 52 =
# 33,280 <= 42,252 (size 1), and heat in unsubsidized rent meets the energy burden.
# Unit 1 has no separate electric bill, so row G applies: blank Electric cell, 0, and
# no enhancement because no utility account receives a grant. Unit 2 has an electric
# bill, so row H applies: 80 + 350 enhancement (DIV 1-1) = 430.
- name: Case 12, electric heat included in unsubsidized rent follows the blank row G cell.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [RI, RI]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [33_280, 33_280]
    ssi: [0, 0]
    tanf: [0, 0]
    childcare_expenses: [0, 0]
    child_care_subsidies: [0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [0, 1_200]
    heat_expense_included_in_rent: [true, true]
    receives_housing_assistance: [false, false]
    is_in_public_housing: [false, false]
  output:
    ri_liheap_eligible: [true, true]
    ri_liheap_base_payment: [0, 430]
    ri_liheap: [0, 430]

# Threshold edge for the federal floor, 42 U.S.C. 8624(b)(2)(B), with the 2026 example
# from review: 23 qualified members (forced size) and 150,000 of countable income
# (forced). The 60% SMI limit is 148,694 (eligibility Case 4), but 150,000 is below
# the floor 1.1 x 136,650 = 150,315 on the 2025 guideline, so the household stays
# eligible. Bands use the same guideline: 136,650 (100%) < 150,000 <= 170,813 (125%,
# 170,812.50 rounded half up) is band 3 (row C): natural gas 192 + 350 = 542.
- name: Case 13, threshold edge, a twenty three member household below the federal poverty floor is paid above the state median income limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [RI]
    ri_liheap_household_size: [23]
    ri_liheap_income: [150_000]
    heating_type: [NATURAL_GAS]
    gas_expense: [1_200]
    heat_expense_included_in_rent: [false]
    receives_housing_assistance: [false]
    is_in_public_housing: [false]
  output:
    ri_liheap_income_limit: [148_694]
    ri_liheap_eligible: [true]
    ri_liheap_income_band: [3]
    ri_liheap_base_payment: [542]
    ri_liheap: [542]

# FY2026 row G pays $400 under Deliverables, Natural Gas and Other. HeatingType documents
# UNSPECIFIED as heat in rent with an unknown fuel, and Appendix B has no coal or solar
# box, so UNSPECIFIED, SOLAR and COAL read the Other cell: 400. With no electric bill no
# utility account receives the grant, so there is no enhancement. Heat in unsubsidized
# rent meets the energy burden; wages are the 2026 Rhode Island minimum wage, 16 x 40 x
# 52 = 33,280 <= 42,252 (size 1).
- name: Case 14, heat in unsubsidized rent with an unspecified, solar or coal fuel receives the row G Other amount.
