# R.I. DLT Unemployment Insurance FAQ
# (https://dlt.ri.gov/individuals/unemployment-insurance/unemployment-insurance-faq):
# the weekly rate is 3.85% of the average of the two highest base-period quarters
# (2026 maximum $745), and the claim lasts 33% of base-period wages divided by the
# weekly rate, capped at 26 weeks. A worker earning 10,000 a quarter (40,000 a year)
# and laid off at the end of 2025 gets 10,000 x 0.0385 = 385 a week. The duration is
# 0.33 x 40,000 / 385 = 34.3 weeks, capped at 26, so the claim pays 26 x 385 = 10,010.
# Rhode Island has no modeled UI, so the total equals the reported amount; manual page 15
# counts unemployment benefits.
- name: Case 25, reported unemployment compensation counts as unearned income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        unemployment_compensation: 10_010
    spm_units:
      spm_unit:
        members: [person1]
        tanf: 0
        childcare_expenses: 0
        child_care_subsidies: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    total_unemployment_compensation: 10_010
    ri_liheap_income: 10_010

# Manual pages 14-17 count every listed unearned source except strike pay and VA
# benefits, which FY2026 plan Section 1.9 (page 6) counts. Each is set to a distinct
# amount, so dropping any one changes the total: 1,000 + 500 + 1,200 + 600 + 1,500 +
# 2,000 + 700 + 800 + 900 + 1,100 + 1,300 + 1,400 + 1,600 + 300 + 200 + 1,700 + 400 + 100
# = 17,300. Interest, rent and TANF are 0. At age 60 with no Social Security disability
# the person is not Medicare-enrolled, so no Part B premium is deducted.
