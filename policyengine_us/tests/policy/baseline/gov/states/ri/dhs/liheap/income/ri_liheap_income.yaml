# Each source is floored at zero before summing, so no loss offsets another source:
# 30000 wages + max(-2500 estate, 0) = 30000; 30000 + max(-4000 rent, 0) x 50% = 30000;
# both losses together also leave 30000. Netting the estate loss would give 27500.
- name: Case 19, estate and rental losses do not offset wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [RI, RI, RI]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200]
    age: [50, 50, 50]
    is_full_time_student: [false, false, false]
    is_household_head: [true, true, true]
    ssi: [0, 0, 0]
    tanf: [0, 0, 0]
    childcare_expenses: [0, 0, 0]
    child_care_subsidies: [0, 0, 0]
    employment_income: [30_000, 30_000, 30_000]
    estate_income: [-2_500, 0, -2_500]
    rental_income: [0, -4_000, -4_000]
  output:
    ri_liheap_income: [30_000, 30_000, 30_000]

