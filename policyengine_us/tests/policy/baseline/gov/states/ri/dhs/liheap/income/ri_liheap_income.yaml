  input:
    people:
      person1:
        age: 60
        immigration_status: CITIZEN
        is_full_time_student: false
        unemployment_compensation: 1_000
        strike_benefits: 500
        social_security: 1_200
        ssi: 600
        pension_income: 1_500
        military_retirement_pay: 2_000
        retirement_distributions: 700
        survivor_benefits: 800
