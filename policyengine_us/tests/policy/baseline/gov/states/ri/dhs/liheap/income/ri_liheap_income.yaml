# Manual page 20 excludes "Child Income (under 18)" and Appendix H page 2 excludes
# full-time students aged 18-23, so only the parent's income counts: 12,000 wages, and
# counted interest 0 gives max(0 - 500, 0) = 0, for a total of 12,000. The minor's 800 of
# interest is about 20,000 of savings at 4%. Counting the excluded members' interest
# would give 12,000 + (800 + 600 - 500) = 12,900.
- name: Case 27, interest of a minor and of a full-time student is excluded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 17
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        interest_income: 800
      person3:
        age: 20
        immigration_status: CITIZEN
        is_full_time_student: true
        ssi: 0
        interest_income: 600
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        childcare_expenses: 0
        child_care_subsidies: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    ri_liheap_income: 12_000

# Each member's interest is floored at zero before the household's $500 exclusion
# (manual page 20), so a negative interest entry cannot cancel another member's
# interest: 12,000 wages + max(0 + 700 - 500, 0) = 12,200. Summing before the floor
# would give max(-1,000 + 700 - 500, 0) = 0 and a total of 12,000.
- name: Case 28, a negative interest entry does not offset another member's interest.
  period: 2026
  absolute_error_margin: 0.01
  input:
