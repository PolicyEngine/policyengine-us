        state_code: RI
  output:
    ri_liheap_income: 12_200

# Manual III.H (page 21) deducts court-documented support without limiting the
# deduction to members whose income counts, so the model deducts every member's
# support and alimony paid, the same household-level reading as the Part B premium.
# Wages use the 2026 Rhode Island minimum wage of $16 an hour: the parent works full
# time (16 x 40 x 52 = 33,280), the 20-year-old full-time student 10 hours a week
# (8,320, excluded by Appendix H page 2) and the undocumented member 20 hours a week
# (16,640, counted although not in the size). Counted income 33,280 + 16,640 =
# 49,920, less the student's 1,200 of child support and the undocumented member's
# 1,800 of alimony: 49,920 - 3,000 = 46,920. Deducting only counted members' expenses
# would give 48,120; only qualified members' expenses, 48,720.
- name: Case 29, support paid by excluded members is deducted from household income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 33_280
      person2:
        age: 20
        immigration_status: CITIZEN
        is_full_time_student: true
        ssi: 0
        employment_income: 8_320
        child_support_expense: 1_200
      person3:
        age: 50
        immigration_status: UNDOCUMENTED
        is_full_time_student: false
        ssi: 0
        employment_income: 16_640
        alimony_expense: 1_800
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        childcare_expenses: 0
        child_care_subsidies: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: RI
  output:
    ri_liheap_household_size: 2
    ri_liheap_income: 46_920
