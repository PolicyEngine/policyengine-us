# Manual pp14-15 income categories, approved existing-net-input approximation:12000+2400+600+1200+1200=17400; no additional40% deduction.
- name: Case 1, adult business income uses existing net receipts without another business deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_400
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        partnership_s_corp_income: 1_200
        is_household_head: true
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 0
        childcare_expenses: 0
        child_care_subsidies: 0
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    ri_liheap_income: 17_400

