# 45 U.S.C. 231m(a): no State may tax an annuity or supplemental annuity under
# the Railroad Retirement Act. Federal AGI includes the taxable part of tier 1
# benefits (IRC 86(d)(1)(B)) and of the rest of the annuity (IRC 72(r)(1)), so
# every state that starts from federal AGI or taxable income removes what it
# includes (taxable_railroad_benefits). States that build their own income
# base from other variables never take it in.
#
# Each household: single, 45, railroad benefits only: $20,000 of tier 1 social
# security equivalent benefits and $25,000 of the taxable rest of the annuity.
# Combined income = 25,000 + 10,000 = 35,000, so IRC 86(a)(2) makes
# 0.85 * 1,000 + 4,500 = 5,350 of the tier 1 benefits taxable, and federal AGI
# is 25,000 + 5,350 = 30,350. None of it is state income.

- name: Railroad retirement benefits are not AL income.
  period: 2025
  input:
    people:
      head:
        age: 45
        railroad_social_security_equivalent_benefits: 20_000
        taxable_railroad_pension_benefits: 25_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AL
  output:
    adjusted_gross_income: 30_350
    state_income_tax_before_refundable_credits: 0

