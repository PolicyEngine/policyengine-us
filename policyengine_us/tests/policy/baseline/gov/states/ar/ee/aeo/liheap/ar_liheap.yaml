  period: 2025
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 21_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_household_size: 1
    ar_liheap_countable_income: 16_800
    ar_liheap_income_limit: 27_012
    ar_liheap_eligible: true
    ar_liheap_matrix_amount: 91
    ar_liheap: 91

