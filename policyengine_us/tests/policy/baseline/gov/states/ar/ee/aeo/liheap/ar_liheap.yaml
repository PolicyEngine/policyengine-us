# Official FY2026 gas matrix: monthly370-429 gives227 for size1-2; monthly2130-2347 gives68; zero income gives308. Oil zero-income size5+ gives570. The 20 percent earned disregard applies before these lookups.
# TEA now counts through take-up-gated tanf, so Cases 1 and 3 pin ar_tea to 0 to keep their
# household-size and zero-income checks; TEA counting is covered in ar_liheap_countable_income.yaml.

- name: Case 1, a nonqualified parents full counted income uses two qualified children for the grant.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
        is_full_time_student: false
        employment_income: 6_000
      person2:
        age: 12
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person3:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        heating_expense: 50
        ar_tea: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AR
  output:
    ar_liheap_household_size: 2
    ar_liheap_countable_income: 4_800
    ar_liheap_income_limit: 36_840
    ar_liheap_matrix_amount: 227
    ar_liheap: 227

# Manual p42 rounds MCI to whole dollars. Alimony counts in full (rental income would
# take the 20% disregard): 28164 / 12 = 2347 and 28164.12 / 12 = 2347.01 rounds to 2347,
# so a one-cent monthly excess stays within the 2347 size-one limit; gas 2130-2347 pays
# 68 for 1&2.
- name: Case 2, a one cent monthly alimony excess rounds away at the one person limit.
  period: 2026
  input:
    state_code: [AR, AR]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    is_full_time_student: [false, false]
    employment_income: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_200, 1_200]
    alimony_income: [28_164, 28_164.12]
  output:
    ar_liheap: [68, 68]

- name: Case 3, five qualified household members receive the large household oil grant.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person2:
        age: 39
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person3:
        age: 12
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person4:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person5:
        age: 4
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: FUEL_OIL
        heating_expense: 100
        ar_tea: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: AR
  output:
    ar_liheap_household_size: 5
    ar_liheap: 570

- name: Case 4, the final grant follows heat in rent eligibility without an expense cap.
  period: 2026
  input:
    state_code: [AR, AR, AR]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    ssi: [0, 0, 0]
    is_full_time_student: [false, false, false]
    employment_income: [0, 0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heating_expense: [0, 0, 10]
    heat_expense_included_in_rent: [true, true, true]
    receives_housing_assistance: [false, true, true]
  output:
    ar_liheap: [308, 0, 308]

- name: Case 5, a mixed state population pays only Arkansas households.
  period: 2026
  input:
    state_code: [AR, GA]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    is_full_time_student: [false, false]
    employment_income: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    heating_expense: [10, 10]
  output:
    ar_liheap: [308, 0]

