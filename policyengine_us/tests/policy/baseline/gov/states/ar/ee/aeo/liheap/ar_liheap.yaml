    ar_liheap_matrix_amount: 68
    ar_liheap: 68

# Per-source floor: farm rent is an earned source (manual p141) and its 1000 loss counts
# as 0, so 36000 x 0.8 = 28800 > 28164 and no grant is paid. Netting the loss would give
# (36000 - 1000) x 0.8 = 28000, MCI 2333 (27996), eligible, and a 68 grant.
# The ungated gas row 2348-3070 shows 62 for 1&2.
- name: Case 11, a farm rent loss does not make a wage earner eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 36_000
        farm_rent_income: -1_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 900
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_household_size: 1
    ar_liheap_countable_income: 28_800
    ar_liheap_income_limit: 28_164
    ar_liheap_eligible: false
    ar_liheap_matrix_amount: 62
    ar_liheap: 0

# Boundary: manual p42 half-up MCI rounding at the 2347 size-one limit.
# 28169.88/12=2347.49 -> 2347 (28164, eligible, gas 2130-2347 pays 68);
# 28170/12=2347.50 -> 2348 (28176 > 28164, ineligible; ungated gas 2348-3070 shows 62).
- name: Case 12, half-up rounding decides eligibility at the income limit.
  period: 2026
  input:
    state_code: [AR, AR]
    age: [60, 60]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    is_full_time_student: [false, false]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [900, 900]
    ar_tea: [0, 0]
    pension_income: [28_169.88, 28_170]
  output:
    ar_liheap_countable_income: [28_164, 28_176]
    ar_liheap_income_limit: [28_164, 28_164]
    ar_liheap_eligible: [true, false]
    ar_liheap_matrix_amount: [68, 62]
    ar_liheap: [68, 0]

# Boundary: half-up rounding moves MCI 69.50 into the 70-129 band. Alimony counts in
# full.
# 833.88 / 12 = 69.49 -> 69 (828), electric 0-69 pays 242 for 1&2;
# 834 / 12 = 69.50 -> 70 (840), 70-129 pays 233.
- name: Case 13, half-up rounding of alimony decides the income band.
  period: 2026
  input:
    state_code: [AR, AR]
    age: [30, 30]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    is_full_time_student: [false, false]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_800, 1_800]
    ar_tea: [0, 0]
    alimony_income: [833.88, 834]
  output:
    ar_liheap_countable_income: [828, 840]
    ar_liheap_eligible: [true, true]
    ar_liheap_matrix_amount: [242, 233]
    ar_liheap: [242, 233]

# Case 3's family with TEA received: manual Appendix E p130 counts TEA, read through take-up-gated tanf.
# Five-person TEA maximum $286/month x 12 = 3432; MCI 286 (whole); size-five limit 5236 (62832).
# FY2026 fuel oil 250-309 pays 497 for 5&up, down from 570 at zero income (0-69).
- name: Case 14, received TEA lowers the large household oil grant.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person2:
        age: 39
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person3:
        age: 12
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person4:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      person5:
        age: 4
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: FUEL_OIL
        heating_expense: 100
        ar_tea: 3_432
        takes_up_tanf_if_eligible: true
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: AR
  output:
    tanf: 3_432
    ar_liheap_household_size: 5
    ar_liheap_countable_income: 3_432
    ar_liheap_income_limit: 62_832
    ar_liheap_eligible: true
    ar_liheap_matrix_amount: 497
    ar_liheap: 497

# Manual Appendix F p137 counts interest only over $200 a month: 3000 - 200 x 12 = 600.
# Pension 12000 + 600 = 12600; MCI 1050; size-one limit 28164; electric 1030-1089 pays
# 121 for 1&2. Counting all interest would give MCI 1250 and the 1210-1269 row, 104.
- name: Case 15, only interest above the monthly disregard lowers the electric grant.
  period: 2026
  input:
    people:
      person1:
        age: 62
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        pension_income: 12_000
        interest_income: 3_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_household_size: 1
    ar_liheap_countable_income: 12_600
    ar_liheap_income_limit: 28_164
    ar_liheap_eligible: true
    ar_liheap_matrix_amount: 121
    ar_liheap: 121

