# Official FY2026 gas matrix: monthly370-429 gives227 for size1-2; monthly2130-2347 gives68; zero income gives308. Oil zero-income size5+ gives570. The 20 percent earned disregard applies before these lookups.

- name: Case 1, a nonqualified parents full counted income uses two qualified children for the grant.
  period: 2026
  input:
    people:
      parent:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
        is_full_time_student: false
        employment_income: 6000
      child1:
        age: 12
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
      child2:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        is_full_time_student: false
    spm_units:
      family:
        members: &id001
        - parent
        - child1
        - child2
        heating_type: NATURAL_GAS
        heating_expense: 50
    households:
      home:
        members: *id001
        state_code: AR
  output:
    ar_liheap_household_size: 2
    ar_liheap_countable_income: 4800
    ar_liheap_income_limit: 36840
    ar_liheap_matrix_amount: 227
    ar_liheap: 227
