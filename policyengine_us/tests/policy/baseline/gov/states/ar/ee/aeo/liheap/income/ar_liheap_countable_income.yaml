# Independent AR component tests; no final household eligibility or total benefit is asserted.

# Plan p5:15000×0.8=12000 countable work income.
- name: Case 1, adult gross wages receive the twenty percent disregard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 15_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 12_000

# Manual Appendix F p134 excludes only full-time college students up to 23 listed as a
# household member's dependent. Living alone, this 22-year-old is not a dependent, so
# work counts: (15000 + 3000) x 0.8 = 14400 + Social Security 1200 = 15600; MCI 1300.
# Under 65 without SSDI there is no Part B premium to net from Social Security.
- name: Case 2, a full time college student living alone has work counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 22
        immigration_status: CITIZEN
        is_full_time_student: true
        is_full_time_college_student: true
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 15_000
        self_employment_income: 3_000
        social_security: 1_200
        medicare_part_b_premium: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 15_600

# Manual Appendix F p133 excludes a minor's earnings only while attending school at
# least half time. This 17-year-old attends no school, so work counts:
# (15000 + 3000) x 0.8 = 14400 + SSI 2400 + child support 3600 = 20400; MCI 1700.
- name: Case 3, a minor not attending school has work counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
      person2:
        age: 17
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 2_400
        employment_income: 15_000
        self_employment_income: 3_000
        child_support_received: 3_600
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_liheap_countable_income: 20_400

