# Manual Appendix F p165 treats rental property as self-employment, so rental and farm
# rent take the 20% disregard with wages: (12000 + 2400 + 1200) x 0.8 = 12480.
# Survivor 600 + child SSI 2400 count in full: 15480.
# Manual Appendix E p155 counts TEA (plan 1.9 leaves TANF unchecked); TEA flows
# through take-up-gated tanf. TEA 1944 = two-person maximum $162 x 12.
# 15480 + 1944 = 17424; MCI 1452 is already whole.
- name: Case 7, rental and farm rent take the earned disregard; other income counts.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 12_000
        rental_income: 2_400
        farm_rent_income: 1_200
        survivor_benefits: 600
      person2:
        age: 8
        immigration_status: CITIZEN
        ssi: 2_400
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 1_944
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_liheap_countable_income: 17_424

