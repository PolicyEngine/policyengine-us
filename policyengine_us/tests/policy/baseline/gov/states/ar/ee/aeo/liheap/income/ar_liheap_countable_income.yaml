# Boundary: manual p42 rounds MCI to the nearest whole dollar, halves up.
# Alimony counts in full (interest below $200 a month would be disregarded).
# 833.88 / 12 = 69.49 -> 69 -> 828; 834 / 12 = 69.50 -> 70 -> 840.
- name: Case 15, monthly countable alimony rounds half up to whole dollars.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [AR, AR]
    age: [30, 30]
    immigration_status: [CITIZEN, CITIZEN]
    is_full_time_student: [false, false]
    ssi: [0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [1_800, 1_800]
    ar_tea: [0, 0]
    alimony_income: [833.88, 834]
  output:
    ar_liheap_countable_income: [828, 840]

# Manual Appendix F p137 counts only interest "amount over $200.00", read per recipient
