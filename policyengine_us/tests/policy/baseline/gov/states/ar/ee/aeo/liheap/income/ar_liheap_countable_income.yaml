    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 10_000
        self_employment_income: 5_000
        farm_operations_income: 2_500
        sstb_self_employment_income: 1_250
        partnership_s_corp_income: 1_250
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 16_000

# Contract specifies nonnegative earned sources: wages12000×0.8+pension1200=10800.
- name: Case 6, source losses do not offset wages or unearned receipts.
  period: 2026
  absolute_error_margin: 0.01
