        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 10_800

# 9600 counted wages+2400rent+1200farmrent+600survivor+2400SSI=16200. Plan pp6–7 excludes TANF although application requests disclosure.
- name: Case 7, farm rent survivors and child SSI count while TANF is excluded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 0
        employment_income: 12_000
        rental_income: 2_400
        farm_rent_income: 1_200
        survivor_benefits: 600
      person2:
        age: 8
        immigration_status: CITIZEN
        is_full_time_student: false
        ssi: 2_400
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 3_600
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_liheap_countable_income: 16_200
