    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [900, 900, 900, 900]
    ar_tea: [0, 0, 0, 0]
    military_retirement_pay: [24_000, 0, 0, 0]
    workers_compensation: [0, 15_600, 0, 0]
    gambling_winnings: [0, 0, 1_200, 0]
    capital_gains: [0, 0, 0, 3_000]
  output:
    ar_liheap_countable_income: [24_000, 15_600, 1_200, 3_000]

