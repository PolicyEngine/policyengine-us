    age: [62, 62]
    immigration_status: [CITIZEN, CITIZEN]
    is_full_time_student: [false, false]
    ssi: [0, 0]
    ar_tea: [0, 0]
    interest_income: [2_400, 3_000]
  output:
    ar_liheap_countable_income: [0, 600]

