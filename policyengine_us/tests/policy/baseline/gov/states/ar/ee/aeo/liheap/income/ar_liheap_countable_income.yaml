# Plan 1.9 checks unemployment insurance, strike pay, "Interest, dividends, or royalties",
# VA benefits and cash gifts. Manual Appendix F counts unemployment (p168), strike pay
# (p167), dividends (p158) and regular cash gifts (p157), and Appendix E (p155) lists
# veterans' benefits as unearned income; each counts in full. UI at Arkansas's $451
# maximum weekly benefit for the 12-week maximum: 451 x 12 = 5412 (MCI 451). Strike pay
# 6 weeks x $500 = 3000 (MCI 250). Dividends 600 qualified + 600 non-qualified = 1200
# (MCI 100). 2026 VA compensation, 30%, veteran alone: 552.47 x 12 = 6629.64; MCI 552.47
# rounds to 552; x12 = 6624. Regular cash gifts 150 x 12 = 1800 (MCI 150);
# financial_assistance cannot separate regular from irregular gifts, so every reported
# gift counts. Arkansas UI is not modeled, so total_unemployment_compensation is the
# reported amount.
- name: Case 26, unemployment strike pay dividends veterans benefits and regular cash gifts count in full.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [AR, AR, AR, AR, AR]
    age: [45, 50, 58, 60, 35]
