# Independent AR component tests; no final household eligibility or total benefit is asserted.

# Plan p5: 15000 x 0.8 = 12000 countable work income.
- name: Case 1, adult gross wages receive the twenty percent disregard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 15_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 12_000

# The manual's full-time student definition (p141) and Appendix F (p159) exclude
# earnings only of a full-time college student up to age 23 who is a dependent of a
# household member. This 22-year-old lives alone and is no one's dependent, so wages
# 15000 + self-employment 3000 = 18000 x 0.8 = 14400 count, plus Social Security 1200
# (under 65 without SSDI there is no Part B premium to deduct): 15600; MCI 1300.
- name: Case 2, an independent full time college student has work counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 22
        immigration_status: CITIZEN
        is_full_time_college_student: true
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 15_000
        self_employment_income: 3_000
        social_security: 1_200
        medicare_part_b_premium: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_liheap_countable_income: 15_600

# Both application forms request work income only from members 18 and older, and the
# accepted plans leave a child's earnings unchecked; Appendix F (p158) excludes a
# child's earnings only during at least half-time attendance, but every minor's
# earnings are excluded. Unearned income counts: SSI 2400 + child support 3600 = 6000;
# MCI 500.
- name: Case 3, a minor not attending school has work excluded but unearned income counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
      person2:
        age: 17
        immigration_status: CITIZEN
        is_in_k12_school: false
        ssi: 2_400
        employment_income: 15_000
        self_employment_income: 3_000
        child_support_received: 3_600
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ar_tea: 0
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_liheap_countable_income: 6_000

