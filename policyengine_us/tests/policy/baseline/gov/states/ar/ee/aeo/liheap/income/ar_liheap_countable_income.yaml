# 24000/12=2000, 15600/12=1300, 1200/12=100, 3000/12=250.
- name: Case 11, military retirement workers compensation gambling winnings and capital gains count in full.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [AR, AR, AR, AR]
    age: [55, 45, 60, 62]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_full_time_student: [false, false, false, false]
