- name: Arkansas tax on wages plus S corporation income matches TAXSIM
  # TAXSIM (taxsimtest, October 2026 build) input: year 2024, state 4,
  # single, age 40, pwages 50000, scorp 20000, opt1 30, opt1v 1.
  # TAXSIM reports state AGI 70,000 and siitax 2,197.15.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        partnership_s_corp_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_income_tax: 2_197.15
