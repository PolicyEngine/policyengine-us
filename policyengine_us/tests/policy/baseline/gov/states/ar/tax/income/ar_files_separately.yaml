      person1:
        ar_income_tax_before_non_refundable_credits_indiv: 3_000
        ar_income_tax_before_non_refundable_credits_joint: 5_000
        ar_taxable_income_indiv: 80_000
        ar_net_taxable_income_joint: 100_000
      person2:
        ar_income_tax_before_non_refundable_credits_indiv: 1_000
        ar_income_tax_before_non_refundable_credits_joint: 0
        ar_taxable_income_indiv: 40_000
        ar_net_taxable_income_joint: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Both incomes >> threshold, both credits are $0
    # Separate $4000 < Joint $5000
    ar_files_separately: true

- name: Equal taxes after credits, files jointly (not strictly less)
  period: 2024
  input:
    people:
      person1:
        ar_income_tax_before_non_refundable_credits_indiv: 300
        ar_income_tax_before_non_refundable_credits_joint: 600
        ar_taxable_income_indiv: 50_000
        ar_net_taxable_income_joint: 50_000
      person2:
        ar_income_tax_before_non_refundable_credits_indiv: 300
        ar_income_tax_before_non_refundable_credits_joint: 0
        ar_taxable_income_indiv: 50_000
        ar_net_taxable_income_joint: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Both credits $0 (income >> threshold)
    # Separate $600 == Joint $600
    # Uses strict < so equal means files jointly (not separately)
    ar_files_separately: false

- name: Single filer always files jointly
  period: 2024
  input:
    people:
      person1:
        ar_income_tax_before_non_refundable_credits_indiv: 500
        ar_income_tax_before_non_refundable_credits_joint: 500
        ar_taxable_income_indiv: 30_000
        ar_net_taxable_income_joint: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    # Single filer: indiv == joint, not strictly less
    ar_files_separately: false

- name: Joint credit uses joint multiplier for married filers
  # Joint multiplier doubles the max credit for joint filers
  period: 2024
  input:
    people:
      person1:
        ar_income_tax_before_non_refundable_credits_indiv: 400
        ar_income_tax_before_non_refundable_credits_joint: 500
        ar_taxable_income_indiv: 24_000
        ar_net_taxable_income_joint: 24_000
      person2:
        ar_income_tax_before_non_refundable_credits_indiv: 0
        ar_income_tax_before_non_refundable_credits_joint: 0
        ar_taxable_income_indiv: 0
        ar_net_taxable_income_joint: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Joint credit: income $24k < $25,800 => full credit
    #   $60 * 2 (joint multiplier) = $120
    # Sep credit: person1 $24k < $25,800 => $60, person2 $0 => $60
    #   Total: $120
    # After credits: joint $500-$120=$380 vs separate $400-$120=$280
    # Separate cheaper
    ar_files_separately: true

- name: Head of household filer never files separately (regression, taxsim 1137)
  period: 2022
  input:
    people:
      head:
        employment_income: 26_190
        is_tax_unit_head: true
      dependent1:
        age: 8
        is_tax_unit_dependent: true
      dependent2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [head, dependent1, dependent2]
        state_code: AR
  output:
    ar_files_separately: false

# A married couple must file jointly if either spouse had a total negative
# income: "IF ONE SPOUSE HAD A TOTAL NEGATIVE INCOME, YOU MUST FILE MARRIED
# FILING JOINTLY." (2024 AR1000F/AR1000NR instructions, Filing Status 4, p.12:
# https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000F_and_AR1000NR_Instructions.pdf#page=12;
# same wording in 2025, p.12).
- name: Separate tax lower, but the spouse's total income is negative, files jointly
  period: 2024
  input:
    people:
      person1:
        ar_income_tax_before_non_refundable_credits_indiv: 0
        ar_income_tax_before_non_refundable_credits_joint: 100
        ar_taxable_income_indiv: 50_000
        ar_net_taxable_income_joint: 50_000
        ar_gross_income_indiv: 50_000
      person2:
        ar_income_tax_before_non_refundable_credits_indiv: 100
        ar_income_tax_before_non_refundable_credits_joint: 500
        ar_taxable_income_indiv: 0
        ar_net_taxable_income_joint: 0
        ar_gross_income_indiv: -1
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Separate tax 100 < joint tax 600, but person2's total income is -1 < 0.
    ar_files_separately: false

- name: Spouse partnership loss of $10 forces a joint return that costs more (issue 9680)
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 27_850
      person2:
        age: 38
        partnership_s_corp_income: -10
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_gross_income_indiv: [27_850, -10]
    # Separate path: person1 27,850 - 2,410 = 25,440, 2024 Regular Income Tax
    # Table row $25,400-$25,500: $584 (p.31); person2 has no taxable income.
    ar_income_tax_before_non_refundable_credits_indiv: [584, 0]
    # Separate additional credit: 60 each (25,440 and 0 are below 25,800) = 120,
    # so the separate path nets 584 - 120 = 464.
    # Joint path: AGI 27,850 - 10 = 27,840, joint low income table (0-1
    # dependents) row $27,801-$27,900: $470 (p.29); the joint additional credit
    # 120 - ceil((27,840 - 25,800) / 100) x 10 phases out to 0, so it nets 470.
    ar_low_income_tax_joint: [470, 0]
    # Separate (464) < joint (470), but person2's total income is negative.
    ar_files_separately: false
    ar_income_tax_before_non_refundable_credits_unit: 470
    # 470 - 2 x 29 personal credits = 412
    ar_non_refundable_credits: 58
    ar_income_tax: 412

- name: Head partnership loss of $10 also forces a joint return
  period: 2024
  input:
    people:
      person1:
        age: 40
        partnership_s_corp_income: -10
      person2:
        age: 38
        employment_income: 27_850
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_gross_income_indiv: [-10, 27_850]
    ar_income_tax_before_non_refundable_credits_indiv: [0, 584]
    # Same as above with the spouses swapped: joint 470 - 58 = 412.
    ar_files_separately: false
    ar_income_tax: 412

- name: Spouse with zero total income can still file separately (regression)
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 27_850
      person2:
        age: 38
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Zero is not negative. Separate 584 - 120 = 464 < joint 470 (AGI 27,850,
    # row $27,801-$27,900), so the couple files separately.
    ar_files_separately: true
    ar_income_tax_before_non_refundable_credits_unit: 584
    # 584 - 58 personal credits - 120 additional credits = 406
    ar_income_tax: 406

- name: Both spouses with positive income keep the cheaper separate election (regression)
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
      person2:
        age: 38
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Separate: each 40,000 - 2,410 = 37,590, row $37,500-$37,600: $1,055 (p.31).
    ar_income_tax_before_non_refundable_credits_indiv: [1_055, 1_055]
    # Joint: 80,000 - 4,820 = 75,180, row $75,101-$75,201: $2,521 (p.33).
    ar_income_tax_before_non_refundable_credits_joint: [2_521, 0]
    # Separate 2,110 < joint 2,521; neither total income is negative.
    ar_files_separately: true
    ar_income_tax_before_non_refundable_credits_unit: 2_110
    # 2,110 - 58 = 2,052
    ar_income_tax: 2_052

- name: Spouse partnership loss of $300 files jointly, where the joint and separate paths tie (issue 9680)
  # The tie already keeps this couple on the joint path (strict <), so this case
  # passes without the negative-income rule. The $10 loss cases above isolate
  # the rule.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 28_450
      person2:
        age: 38
        partnership_s_corp_income: -300
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # Joint AGI 28,450 - 300 = 28,150, joint low income table row
    # $28,101-$28,200: $501 (p.29). Separately, person1's 26,040 falls in the
    # regular row $26,000-$26,100: $606 (p.31), less 45 + 60 of additional
    # credits = 501, a tie, which keeps the joint return; the negative total
    # income also requires it.
    ar_low_income_tax_joint: [501, 0]
    ar_income_tax_before_non_refundable_credits_indiv: [606, 0]
    ar_files_separately: false
    # 501 - 58 = 443
    ar_income_tax: 443

- name: Spouse capital loss of $500 files jointly, where the joint path is already cheaper
  # The joint path costs less even without the negative-income rule, so this
  # case does not isolate the rule. The $10 loss cases above do.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 27_850
      person2:
        age: 38
        short_term_capital_gains: -500
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # person2's total income is the -500 capital loss.
    ar_gross_income_indiv: [27_850, -500]
    # Separate path: person1 27,850 - 2,410 = 25,440, row $25,400-$25,500:
    # $584 (p.31), less 60 + 60 of additional credits = 464.
    ar_income_tax_before_non_refundable_credits_indiv: [584, 0]
    # Joint path: AGI 27,850 - 500 = 27,350, joint low income table row
    # $27,301-$27,400: $418 (p.29); the joint additional credit
    # 120 - ceil((27,350 - 25,800) / 100) x 10 phases out to 0, so it nets 418.
    ar_low_income_tax_joint: [418, 0]
    # Joint (418) < separate (464), so the couple files jointly either way.
    ar_files_separately: false
    # 418 - 58 = 360
    ar_income_tax: 360
