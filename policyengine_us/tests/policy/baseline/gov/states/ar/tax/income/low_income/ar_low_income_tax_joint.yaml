# The 2024 Head of Household/Surviving Spouse with 2 or More Dependents table
# (2024 AR1000F/AR1000NR instructions, PDF page 28) reads: $0-$24,176 -> $0,
# $24,177-$24,200 -> $92, $24,201-$24,300 -> $104, $24,301-$24,400 -> $116,
# $24,401-$24,500 -> $129. The $92 row's threshold was once keyed at $24,200,
# equal to the next row's, and policyengine-core sums the amounts of brackets
# with equal thresholds, so $24,201-$24,300 got $196 and the $92 row vanished.
# One single-member tax unit per income covers every row edge in the range.
- name: Case 19, 2024 head of household with 2 dependents from $24,100 to $24,401.
