# Ark. Code § 26-51-457 (Act 1284 of 2013): 26 U.S.C. § 1341(a)(1)-(3) is
# adopted, the federal methods in (a)(4) and (5) are not, and the tax is
# computed "by allowing a deduction in the tax year the taxpayer restores the
# amount". Ark. Code § 26-51-437 makes it a miscellaneous itemized deduction,
# deducted above 2% of Arkansas AGI on Form AR3.

- name: Case 1, a repayment over $3,000 is deducted.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_claim_of_right_deduction: 10_000

- name: Case 2, a repayment of exactly $3,000 is not.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 3_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_claim_of_right_deduction: 0

- name: Case 3, a repayment of $3,001 is deducted in full.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 3_001
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_claim_of_right_deduction: 3_001

- name: Case 4, the federal credit method still gets the Arkansas deduction.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_prior_year_tax_decrease: 2_200
        claim_of_right_credit_applies: true
    households:
      household:
        members: [head]
        state_code: AR
  output:
    claim_of_right_credit: 2_200
    ar_claim_of_right_deduction: 10_000

# $10,000 repaid, $8,000 of it received while a nonresident and never taxed
# by Arkansas: the $2,000 Arkansas taxed is not more than $3,000.
- name: Case 5, income Arkansas did not tax neither counts nor reaches the threshold.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 10_000
        ar_claim_of_right_repayment_excluded_from_income: 8_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_claim_of_right_deduction: 0

# Head $2,000 and spouse $2,500: $4,500 restored on the return is more than
# $3,000 although neither repayment is. The dependent's $5,000 belongs on the
# dependent's own return.
- name: Case 6, a joint return counts both spouses' repayments but not a dependent's.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 2_000
      spouse:
        age: 40
        claim_of_right_repayment: 2_500
      child:
        age: 17
        claim_of_right_repayment: 5_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: AR
  output:
    ar_claim_of_right_deduction: 4_500

- name: Case 7, outside Arkansas.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: MO
  output:
    ar_claim_of_right_deduction: 0

# Wages $60,000, repays $10,000. AR3: $10,000 - 2% x $60,000 = $8,800 of
# miscellaneous deductions, above the $2,470 standard deduction, so the return
# itemizes: net taxable income $60,000 - $8,800 = $51,200.
- name: Case 8, the deduction counts toward the 2% floor and makes the return itemize.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_misc_deduction_joint: 8_800
    ar_tax_unit_itemizes: true
    ar_deduction_joint: 8_800
    ar_taxable_income_joint: 51_200

# Wages $60,000, repays $3,001: $3,001 - $1,200 = $1,801 of miscellaneous
# deductions, below the $2,470 standard deduction, which the return keeps.
- name: Case 9, a deduction below the standard deduction after the floor leaves taxable income unchanged.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        claim_of_right_repayment: 3_001
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_misc_deduction_joint: 1_801
    ar_tax_unit_itemizes: false
    ar_taxable_income_joint: 57_530

# Wages $100,000, charity $20,000, repays $10,000: miscellaneous $10,000 -
# 2% x $100,000 = $8,000; itemized $20,000 + $8,000 = $28,000; net taxable
# income $72,000.
- name: Case 10, the floored deduction adds to other itemized deductions.
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
        charitable_cash_donations: 20_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AR
  output:
    ar_misc_deduction_joint: 8_000
    ar_itemized_deductions_joint: 28_000
    ar_taxable_income_joint: 72_000
