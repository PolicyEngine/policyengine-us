- name: Below the 2% floor
  period: 2021
  input:
    total_misc_deductions: 800
    ar_agi_joint: 100_000
    state_code: AR
  output:
    ar_misc_deduction_joint: 0

- name: Above the 2% floor
  period: 2021
  input:
    total_misc_deductions: 3_000
    ar_agi_joint: 100_000
    state_code: AR
  output:
    ar_misc_deduction_joint: 1_000

- name: 2017, the 2% floor applies once, to Arkansas AGI
  # 10,000 - 2% * 50,000 = 9,000. The federal misc_deduction has already
  # subtracted 2% of federal AGI, so it must not be the starting point.
  period: 2017
  input:
    total_misc_deductions: 10_000
    ar_agi_joint: 50_000
    state_code: AR
  output:
    ar_misc_deduction_joint: 9_000

- name: 2018, Arkansas did not adopt the federal suspension
  period: 2018
  input:
    total_misc_deductions: 10_000
    ar_agi_joint: 50_000
    state_code: AR
  output:
    ar_misc_deduction_joint: 9_000

- name: 2022, Arkansas did not adopt the federal suspension
  period: 2022
  input:
    total_misc_deductions: 10_000
    ar_agi_joint: 50_000
    state_code: AR
  output:
    ar_misc_deduction_joint: 9_000

- name: 2025, employee expenses and tax preparation fees
  # 6,000 + 500 - 2% * 50,000 = 5,500
  period: 2025
  input:
    people:
      person1:
        unreimbursed_business_employee_expenses: 6_000
        tax_preparation_fees: 500
        ar_agi_joint: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_misc_deduction_joint: 5_500

- name: 2025 Arkansas miscellaneous pool includes investment expenses
  # AR3 instructions line 21: "Brokerage fees (Investment fees) & expenses".
  # https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000F_and_AR1000NR_Instructions.pdf#page=21
  period: 2025
  input:
    state_code: AR
    ar_agi_joint: 100_000
    investment_expenses: 3_000
    tax_preparation_fees: 500
  output:
    total_misc_deductions: 3_500 # AR3 lines 21-22 = investment expenses 3,000 + tax preparation 500
    ar_misc_deduction_joint: 1_500 # AR3 line 25 = 3,500 - 2% * 100,000
    misc_deduction: 0 # Federal section 67(h) disallows miscellaneous deductions after 2017
    form_4952_investment_expenses: 0 # Form 4952 line 5 = 0 when federal misc.applies is false

- name: AR excludes dependent investment fees from the filer miscellaneous pool
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        investment_expenses: 3_000
        ar_agi_joint: 100_000
      child:
        age: 12
        is_tax_unit_dependent: true
        investment_expenses: 50_000
    tax_units:
      unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: AR
  output:
    total_misc_deductions: 3_000
    ar_misc_deduction_joint: 1_000 # Filer fees 3,000 - 2% * AGI 100,000.
