- name: The head and spouse AGI gets split
  period: 2022
  input:
    people:
      person1:
        ar_gross_income_indiv: 1_000
        ar_exemptions: 100
        is_tax_unit_dependent: false
        is_tax_unit_head: true
      person2:
        ar_gross_income_indiv: 2_000
        ar_exemptions: 200
        is_tax_unit_dependent: false
        is_tax_unit_head: false
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_agi_indiv: [900, 1_800]

- name: A dependent's AGI stays off the filers' columns, and a negative column is floored at 0
  period: 2022
  input:
    people:
      person1:
        ar_gross_income_indiv: 1_000
        ar_exemptions: 100
        is_tax_unit_dependent: false
        is_tax_unit_head: true
      person2:
        ar_gross_income_indiv: 100
        ar_exemptions: 200
        is_tax_unit_dependent: false
        is_tax_unit_head: false
      person3:
        ar_gross_income_indiv: 500
        ar_exemptions: 200
        is_tax_unit_dependent: true
        is_tax_unit_head: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: AR 
  output:
    # The dependent's 300 goes on the dependent's own return (Ark. Code
    # 26-51-801(a)-(b)). The spouse's 100 - 200 is floored at 0.
    ar_agi_indiv: [900, 0, 0]

- name: Single filer with 401(k) distributions included in gross income and exempted
  period: 2024
  input:
    people:
      person1:
        irs_employment_income: 50_000
        taxable_401k_distributions: 6_000
        age: 50
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_gross_income_indiv: 56_000
    ar_capped_retirement_or_disability_benefits_exemption_person: 6_000
    ar_agi_indiv: 50_000

- name: A dependent's AGI stays off the filers' columns when the head and spouse labels are exchanged
  period: 2022
  input:
    people:
      person1:
        ar_gross_income_indiv: 1_000
        ar_exemptions: 100
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
      person2:
        ar_gross_income_indiv: 100
        ar_exemptions: 200
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
      person3:
        ar_gross_income_indiv: 500
        ar_exemptions: 200
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: AR
  output:
    # The same couple as above with the head and spouse labels exchanged.
    ar_agi_indiv: [900, 0, 0]

- name: Spouses with equal AGI keep their own AGI; the dependent's is on the dependent's own return
  period: 2022
  input:
    people:
      person1:
        ar_gross_income_indiv: 1_000
        ar_exemptions: 0
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
      person2:
        ar_gross_income_indiv: 1_000
        ar_exemptions: 0
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
      person3:
        ar_gross_income_indiv: 300
        ar_exemptions: 0
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: AR
  output:
    ar_agi_indiv: [1_000, 1_000, 0]

- name: Only taxable disability benefits enter Arkansas gross income on line 18.
  period: 2024
  input:
    people:
      person1:
        irs_employment_income: 30_000
        disability_benefits: 10_000
        tax_exempt_disability_benefits: 7_000
        age: 50
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    # 30,000 + (10,000 - 7,000) = 33,000.
    ar_gross_income_indiv: 33_000
    # The 3,000 is under the 6,000 cap and exempt in full.
    ar_capped_retirement_or_disability_benefits_exemption_person: 3_000
    ar_agi_indiv: 30_000

- name: A dependent child's interest stays off the parent's Arkansas AGI
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 16
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: AR
  output:
    # The child files their own AR1000F if their gross income is over the
    # filing minimum (Ark. Code 26-51-801(a)); the parent's columns hold only
    # the parent's 40,000 of wages, as with no child income.
    ar_gross_income_indiv: [40_000, 8_000]
    ar_agi_indiv: [40_000, 0]
    ar_agi_joint: [40_000, 0]

- name: A dependent child's wages stay off the parent's Arkansas AGI and tax
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 16
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: AR
  output:
    ar_agi_indiv: [40_000, 0]
    ar_agi_joint: [40_000, 0]
    # The same tax as the parent with a child who has no income (issue
    # #9814 reproduction): 957.
    ar_income_tax: 957
