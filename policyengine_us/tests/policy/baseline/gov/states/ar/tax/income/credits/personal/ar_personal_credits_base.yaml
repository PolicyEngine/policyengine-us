      household:
        members: [person1]
        state_code: AR
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
  output:
    ar_retirement_or_disability_benefits_exemption_person: 5_000
    ar_personal_credits_base: 58

