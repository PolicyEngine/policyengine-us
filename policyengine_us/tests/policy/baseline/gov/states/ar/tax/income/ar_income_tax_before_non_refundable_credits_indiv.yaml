  absolute_error_margin: 0.01
  input:
    ar_taxable_income_indiv: 35_100
    state_code: AR
  output:
    # "As Much As" $35,100: same row, $961 (p.31).
    ar_income_tax_before_non_refundable_credits_indiv: 961

