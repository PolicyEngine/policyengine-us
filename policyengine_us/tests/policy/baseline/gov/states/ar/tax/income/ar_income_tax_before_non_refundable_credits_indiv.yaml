# Regular Income Tax Table (issue 9681). Below the table threshold ($100,001
# from 2023), filers look up net taxable income in $100 rows. DFA computes each
# row at its midpoint and rounds to whole dollars: "If you use a formula to
# calculate Arkansas income tax, the results must match the table exactly. The
# calculations in the table are made at the midpoint of each income level."
# (2024 Indexed Tax Brackets, https://www.dfa.arkansas.gov/wp-content/uploads/2024_TaxBrackets.pdf#page=2).
# Pages below are file pages of that year's AR1000F/AR1000NR instructions.
- name: AR regular tax table 2024 - income inside the $35,100-$35,200 row
  period: 2024
  absolute_error_margin: 0.01
  input:
    ar_taxable_income_indiv: 35_180
    state_code: AR
  output:
    # 2024 Regular Income Tax Table (p.31), row $35,100-$35,200: $961.
    # Midpoint of $35,100-$35,199 = 35,149.50; 35,149.50 x 3.9% - 409.86 = 960.97 -> 961
    # (the bracket formula at the exact income gives 35,180 x 3.9% - 409.86 = 962.16)
    ar_income_tax_before_non_refundable_credits_indiv: 961

- name: AR regular tax table 2024 - first income of the $35,100-$35,200 row
