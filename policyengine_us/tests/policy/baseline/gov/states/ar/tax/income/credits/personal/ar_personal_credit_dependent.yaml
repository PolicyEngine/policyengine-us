- name: Person is a dependent
  period: 2022
  input:
    is_tax_unit_dependent: true
    state_code: AR
  output: 
    ar_personal_credit_dependent: 29

- name: Person is not a dependent
  period: 2022
  input:
    is_tax_unit_dependent: false
    state_code: AR
  output: 
    ar_personal_credit_dependent: 0

# Ark. Code 26-51-501 gives each dependent a $29 personal credit
# (credits/personal/amount/base.yaml), with "dependent" in the IRC 152 sense.
# A return on which the filer (or, if joint, either spouse) can be claimed as
# a dependent has no dependents (IRC 152(b)(1)).

- name: 2025 single filer who can be claimed as a dependent gets no dependent credit for a child
  period: 2025
  input:
    people:
      filer:
        age: 19
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: AR
  output:
    ar_personal_credit_dependent: [0, 0]

- name: 2025 single filer who cannot be claimed gets the dependent credit for a child
  period: 2025
  input:
    people:
      filer:
        age: 19
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: AR
  output:
    ar_personal_credit_dependent: [0, 29]

- name: 2025 joint return with one claimable spouse gets no dependent credit for a child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: AR
  output:
    ar_personal_credit_dependent: [0, 0, 0]

- name: 2025 joint return with one claimable spouse gets no dependent credit for a child (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: AR
  output:
    ar_personal_credit_dependent: [0, 0, 0]

