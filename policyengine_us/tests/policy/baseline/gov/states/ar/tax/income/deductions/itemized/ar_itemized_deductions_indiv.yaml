- name: A spouse's casualty loss is split by AGI share, not by owner
  # Only the spouse had a loss. Apply that spouse's casualty limitations:
  # 20,100 - 100 - 10% * 40,000 = 16,000.
  # AR3 lines 31-35 split the line 30 total by AGI share:
  # 60% * 16,000 = 9,600 and 40% * 16,000 = 6,400.
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        ar_agi_indiv: 60_000
      person2:
        is_tax_unit_head: false
        is_tax_unit_dependent: false
        casualty_loss: 20_100
        ar_agi_indiv: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_casualty_loss_deduction_indiv: 16_000
    ar_itemized_deductions_indiv: [9_600, 6_400]

- name: 2025, separate casualty limitations precede AR3 proration
  # (12,000 - 100 - 3,000) + (8,000 - 100 - 2,000) = 14,800.
  # AR3 prorates this total 60% and 40%: 8,880 and 5,920.
  period: 2025
  input:
    people:
      person1:
        age: 40
        casualty_loss: 12_000
        ar_agi_indiv: 30_000
      person2:
        age: 40
        casualty_loss: 8_000
        ar_agi_indiv: 20_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_casualty_loss_deduction_indiv: 14_800
    ar_itemized_deductions_indiv: [8_880, 5_920]

- name: 2020 gambling loss deduction is prorated by AGI when married filing separately
  period: 2020
  input:
    people:
      person1:
        is_tax_unit_head: true
        ar_agi_indiv: 60_000
        gambling_winnings: 10_000
        gambling_losses: 6_000
      person2:
        is_tax_unit_head: false
        ar_agi_indiv: 40_000
        gambling_losses: 4_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # min(6,000 + 4,000, 10,000) split 60% / 40%
    ar_gambling_loss_deduction: 10_000
    ar_itemized_deductions_indiv: [6_000, 4_000]
