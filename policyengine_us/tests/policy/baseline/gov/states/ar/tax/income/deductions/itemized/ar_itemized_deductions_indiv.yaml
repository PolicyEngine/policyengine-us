- name: 2020 gambling loss deduction is prorated by AGI when married filing separately
  period: 2020
  input:
    people:
      person1:
        is_tax_unit_head: true
        ar_agi_indiv: 60_000
        gambling_winnings: 10_000
        gambling_losses: 6_000
      person2:
        is_tax_unit_head: false
        ar_agi_indiv: 40_000
        gambling_losses: 4_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # min(6,000 + 4,000, 10,000) split 60% / 40%
    ar_gambling_loss_deduction: 10_000
    ar_itemized_deductions_indiv: [6_000, 4_000]
