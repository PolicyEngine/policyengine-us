- name: Split the itemized deductions 60% and 40%
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        ar_agi_indiv: 60_000
      person2:
        is_tax_unit_head: false
        ar_agi_indiv: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_medical_expense_deduction_indiv: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_itemized_deductions_indiv: [600, 400]

