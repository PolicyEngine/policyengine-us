- name: Split the itemized deductions 60% and 40%
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        ar_agi_indiv: 60_000
      person2:
        is_tax_unit_head: false
        ar_agi_indiv: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_medical_expense_deduction_indiv: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_itemized_deductions_indiv: [600, 400]

- name: No head AGI
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        ar_agi_indiv: 0
      person2:
        is_tax_unit_head: false
        ar_agi_indiv: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_misc_deduction_indiv: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_itemized_deductions_indiv: [0, 1_000]

- name: No spouse AGI
  period: 2022
  input:
    people:
      person1:
        ar_agi_indiv: 1_000
      person2:
        ar_agi_indiv: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_post_secondary_education_tuition_deduction: 600
        ar_casualty_loss_deduction_indiv: 400
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_itemized_deductions_indiv: [1_000, 0]

- name: Split the itemized deductions 60% and 40%, rounded to the nearest %
