- name: A spouse's casualty loss is split by AGI share, not by owner
  # Only the spouse had a loss. Form AR3 line 18:
  # 20,100 - 100 - 10% * (60,000 + 40,000) = 10,000.
  # AR3 lines 31-35 split the line 30 total by AGI share:
  # 60% * 10,000 = 6,000 and 40% * 10,000 = 4,000.
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        ar_agi_indiv: 60_000
      person2:
        is_tax_unit_head: false
        is_tax_unit_dependent: false
        casualty_loss: 20_100
        ar_agi_indiv: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_casualty_loss_deduction_indiv: 10_000
    ar_itemized_deductions_indiv: [6_000, 4_000]
