# Arkansas grants each taxpayer and spouse a standard deduction under 26-51-430.
# For 2025, one taxpayer deducts $2,470 and joint spouses deduct
# 2 x $2,470 = $4,940, including a filer whom another taxpayer can claim.
- name: 2025 claimable single filer keeps their Arkansas standard deduction
  period: 2025
  input:
    state_code: AR
    filing_status: SINGLE
    claimable_as_dependent_on_another_return: true
  output:
    ar_standard_deduction_joint: 2_470
    ar_standard_deduction_indiv: 2_470

- name: 2025 joint filers keep both Arkansas deductions when the head is claimable
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
      spouse:
        is_tax_unit_spouse: true
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: AR
  output:
    ar_standard_deduction_joint: [4_940, 0]
    ar_standard_deduction_indiv: [2_470, 2_470]

- name: 2025 joint filers keep both Arkansas deductions when the spouse is claimable
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse:
        is_tax_unit_spouse: true
        claimable_as_dependent_on_another_return: true
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: AR
  output:
    ar_standard_deduction_joint: [4_940, 0]
    ar_standard_deduction_indiv: [2_470, 2_470]

- name: 2025 joint filers keep both Arkansas deductions when both are claimable
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
      spouse:
        is_tax_unit_spouse: true
        claimable_as_dependent_on_another_return: true
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: AR
  output:
    ar_standard_deduction_joint: [4_940, 0]
    ar_standard_deduction_indiv: [2_470, 2_470]

- name: AR Standard deduction if single filer
  period: 2022
  input:
    filing_status: SINGLE
    is_tax_unit_head: true
    state_code: AR
  output:
    ar_standard_deduction_joint: 2_270

- name: AR Standard deduction if married filing jointly
  period: 2022
  input:
    filing_status: JOINT
    is_tax_unit_head: true
    state_code: AR
  output:  
    ar_standard_deduction_joint: 4_540 

- name: AR Standard deduction if surviving spouse
  period: 2022
  input:
    filing_status: SURVIVING_SPOUSE
    is_tax_unit_head: true
    state_code: AR
  output:  
    ar_standard_deduction_joint: 2_270 

- name: AR Standard deduction if married filing separately
  period: 2022
  input:
    filing_status: SEPARATE
    is_tax_unit_head: true
    state_code: AR
  output:  
    ar_standard_deduction_joint: 2_270

- name: AR Standard deduction if head of household
  period: 2022
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    is_tax_unit_head: true
    state_code: AR
  output:  
    ar_standard_deduction_joint: 2_270  

- name: Not head of household filers do not get the standard deduction
  period: 2022
  input:
    filing_status: JOINT
    is_tax_unit_head: false
    state_code: AR
  output:
    ar_standard_deduction_joint: 0

- name: Case 7, single filer for 2025.
  period: 2025
  input:
    filing_status: SINGLE
    is_tax_unit_head: true
    state_code: AR
  output:
    ar_standard_deduction_joint: 2_470

- name: Case 8, joint filer for 2025.
  period: 2025
  input:
    filing_status: JOINT
    is_tax_unit_head: true
    state_code: AR
  output:
    ar_standard_deduction_joint: 4_940

- name: Case 9, head of household for 2025.
  period: 2025
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    is_tax_unit_head: true
    state_code: AR
  output:
    ar_standard_deduction_joint: 2_470
