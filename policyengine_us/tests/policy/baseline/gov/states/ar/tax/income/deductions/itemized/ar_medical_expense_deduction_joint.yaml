- name: Arkansas medical expense deduction uses a 10% floor when both spouses are under 65 in 2016
  period: 2016
  input:
    people:
      person1:
        age: 64
        ar_agi_joint: 100_000
      person2:
        age: 50
        ar_agi_joint: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
