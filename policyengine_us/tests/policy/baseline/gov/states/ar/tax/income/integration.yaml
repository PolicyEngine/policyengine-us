        members: [person1, person2]
        state_code: AR
  output:
    ar_agi_joint: [20_000, -20_000]
    # Combined AGI = 20,000 - 20,000 = 0; max(0, 0 - 4,820) = 0.
    ar_taxable_income_joint: [0, 0]
    ar_low_income_tax_joint: [0, 0]
    # Both tables give 0 tax, so the low income table is not selected.
    ar_uses_low_income_tax_tables: false
    ar_net_taxable_income_joint: [0, 0]
    ar_income_tax_before_non_refundable_credits_joint: [0, 0]
