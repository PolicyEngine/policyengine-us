# Arkansas individual income tax schedules for 2014-2020, checked against DFA's
# Regular Tax Tables. Each table row is computed at its midpoint with the year's
# Indexed Tax Brackets (rate times income minus a subtraction amount) and rounded
# to whole dollars, so inputs are row midpoints and outputs are the table cells.
# Every row of the 2014-2020 tables (5,330 rows) matches the bracket formulas.

- name: AR 2014 regular tax table, net taxable income $2,100 to $2,200
  period: 2014
  absolute_error_margin: 0.5
  input:
    ar_taxable_income_indiv: 2_150
    state_code: AR
  output:
    # 2014 Regular Tax Table, LongBookwTaxTables_2014.pdf: $2,100 to $2,200 -> $19
    # 2,150 * 0.9% - 0.00 = 19.35, rounded by DFA to 19
    ar_income_tax_before_non_refundable_credits_indiv: 19

