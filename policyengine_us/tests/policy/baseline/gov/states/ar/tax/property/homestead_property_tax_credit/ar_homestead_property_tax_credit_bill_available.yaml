# Independent source-derived expectations; never obtained from model output.
# Sources: approved optional-bill accounting contract; statutory credit is against qualified real-property liability.

# Rows: complete bill, unknown bill, bill below qualified component, verified zero bill,
# unknown qualified component, unknown claim facts, bill exactly equal to qualified component.
- name: "Case 1, optional bills require known core facts and cannot be smaller than the qualified component."
  period: 2025
  input:
    state_code: [AR, AR, AR, AR, AR, AR, AR]
    ar_homestead_property_tax_credit_qualified_property_taxes: [1_200, 1_200, 1_200, 0, -1, 1_200, 1_200]
    ar_homestead_property_tax_credit_property_in_arkansas: [true, true, true, true, true, true, true]
    ar_homestead_property_tax_credit_homestead_qualified: [true, true, true, true, true, true, true]
    ar_homestead_property_tax_credit_registered: [true, true, true, true, true, true, true]
    ar_homestead_property_tax_credit_claims_disabled_veteran_exemption: [false, false, false, false, false, false, false]
    ar_homestead_property_tax_credit_claimant: [true, true, true, true, true, true, true]
    ar_homestead_property_tax_credit_facts_available: [true, true, true, true, true, false, true]
    ar_homestead_property_tax_credit_bill_before_credit: [1_280, -1, 1_199.99, 0, 1_280, 1_280, 1_200]
  output:
    ar_homestead_property_tax_credit_bill_available: [true, false, false, true, false, false, true]

# The optional total bill is not a condition of legal credit eligibility.
# Only the complete-bill diagnostic is unavailable.
- name: "Case 2, omitted whole bill leaves the core credit available."
  period: 2025
  input:
    state_code: AR
    ar_homestead_property_tax_credit_qualified_property_taxes: 1_200
    ar_homestead_property_tax_credit_property_in_arkansas: true
    ar_homestead_property_tax_credit_homestead_qualified: true
    ar_homestead_property_tax_credit_registered: true
    ar_homestead_property_tax_credit_claims_disabled_veteran_exemption: false
    ar_homestead_property_tax_credit_claimant: true
    ar_homestead_property_tax_credit_facts_available: true
  output:
    ar_homestead_property_tax_credit_inputs_available: true
    ar_homestead_property_tax_credit_eligible: true
    ar_homestead_property_tax_credit_bill_available: false
