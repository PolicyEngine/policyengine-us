- name: Case 10, 2025 joint taxable income in 3.4% bracket, low income cap applies.
  period: 2025
  absolute_error_margin: 1
  input:
    ar_taxable_income_joint: 20_000
    ar_low_income_tax_joint: 300
    state_code: AR
  output:
    # Regular: 20_000 * 0.034 - 287.97 = 392.03
    # Low income cap: 300
    # min(392.03, 300) = 300
    ar_income_tax_before_non_refundable_credits_joint: 300

