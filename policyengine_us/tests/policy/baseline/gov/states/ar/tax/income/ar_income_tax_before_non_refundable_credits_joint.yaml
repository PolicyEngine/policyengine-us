- name: AR income tax rates - taxable income not exceeding $5100
  period: 2022
  absolute_error_margin: 1
  input:
    ar_taxable_income_joint: 5_100
    ar_low_income_tax_joint: 500
    state_code: AR
  output:
    #round(5_100 * 0.00)
    ar_income_tax_before_non_refundable_credits_joint: 0

