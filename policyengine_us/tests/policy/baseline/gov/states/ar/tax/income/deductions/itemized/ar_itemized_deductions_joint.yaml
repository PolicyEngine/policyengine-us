- name: Head gets the itemized deductions amount
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
      person2:
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_medical_expense_deduction_joint: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: AR 
  output:
    ar_itemized_deductions_joint: [1_000, 0]

- name: 2017 employee expenses, federal 2% floor is not applied twice
  # Issue #9614: 10,000 - 2% * 50,000 = 9,000
  period: 2017
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        unreimbursed_business_employee_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_agi_joint: 50_000
    ar_misc_deduction_joint: 9_000
    ar_itemized_deductions_joint: 9_000

- name: 2022 employee expenses remain deductible in Arkansas
  period: 2022
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        unreimbursed_business_employee_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    misc_deduction: 0
    ar_misc_deduction_joint: 9_000
    ar_itemized_deductions_joint: 9_000

- name: 2022 casualty loss remains deductible in Arkansas
  # Issue #9614: 20,000 - 100 - 10% * 50,000 = 14,900
  period: 2022
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        casualty_loss: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    casualty_loss_deduction: 0
    ar_casualty_loss_deduction_joint: 14_900
    ar_itemized_deductions_joint: 14_900

- name: 2019 gambling losses are not reduced by the 2% floor on miscellaneous deductions
  period: 2019
  input:
    people:
      person1:
        is_tax_unit_head: true
        # 2% of this AGI (20,000) exceeds the losses, so a 2% floor would erase them.
        ar_agi_joint: 1_000_000
        gambling_winnings: 20_000
        gambling_losses: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_misc_deduction_joint: 0
    ar_gambling_loss_deduction: 5_000
    ar_itemized_deductions_joint: 5_000

- name: 2025 gambling losses add to other itemized deductions, capped at winnings
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        gambling_winnings: 4_000
      person2:
        is_tax_unit_head: false
        gambling_losses: 9_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        ar_medical_expense_deduction_joint: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    ar_gambling_loss_deduction: 4_000
    ar_itemized_deductions_joint: [5_000, 0]
