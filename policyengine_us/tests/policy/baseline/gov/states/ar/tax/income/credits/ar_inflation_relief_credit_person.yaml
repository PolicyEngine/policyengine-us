        ar_files_separately: false
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: AR
  output:
    # $300 - ceil((207,200 - 179,200) / 2,000) * $20 = $300 - 14 * $20 = $20,
