- name: Person is a dependent but not disabled
  period: 2022
  input:
    is_tax_unit_dependent: true
    is_disabled: false
    state_code: AR
  output: 
    ar_personal_credit_disabled_dependent: 0

- name: Person is disabled but not a dependent
  period: 2022
  input:
    is_tax_unit_dependent: false
    is_disabled: true
    state_code: AR
  output: 
    ar_personal_credit_disabled_dependent: 0

- name: Disabled dependent
  period: 2022
  input:
    is_tax_unit_dependent: true
    is_disabled: true
    state_code: AR
  output: 
    ar_personal_credit_disabled_dependent: 500

# Act 417 of 1999 covers an individual who is "a child of the taxpayer's
# blood, an adopted child, or a dependent" in the IRC 152 sense, $500 each
# (credits/personal/amount/disabled_dependent.yaml). A return on which the
# filer (or, if joint, either spouse) can be claimed has no IRC 152
# dependents (IRC 152(b)(1)), so only the filers' own children qualify. Parent
# ids say whose child the dependent is; id 99 is an absent parent.

- name: 2025 single filer who can be claimed as a dependent gets no credit for a disabled dependent who is not their child
  period: 2025
  input:
    people:
      filer:
        age: 19
        person_id: 1
        claimed_as_dependent_on_another_return: true
      dependent:
        age: 15
        person_id: 3
        is_disabled: true
        parent_1_id: 99
    tax_units:
      tax_unit:
        members: [filer, dependent]
        filing_status: SINGLE
    households:
      household:
        members: [filer, dependent]
        state_code: AR
  output:
    ar_personal_credit_disabled_dependent: [0, 0]

