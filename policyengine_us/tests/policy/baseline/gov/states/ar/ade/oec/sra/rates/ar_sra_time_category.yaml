# Time category: childcare_hours_per_day >= 7 -> FULL_TIME, otherwise PART_TIME.
# Per FSU §5.4.6 "7+ hours per day" (gov.states.ar.ade.oec.sra.rates.full_time_hours_threshold = 7).

- name: Case 1, 7 hours per day is FULL_TIME at the threshold.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 7
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: FULL_TIME

- name: Case 2, 8 hours per day is FULL_TIME.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 8
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: FULL_TIME

- name: Case 3, 5 hours per day is PART_TIME.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 5
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: PART_TIME

- name: Case 4, 6 hours per day is PART_TIME just below the threshold.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 6
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: PART_TIME

- name: Case 5, unknown hours retain full-time pricing.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 0
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: FULL_TIME

- name: Case 6, 8 hours per day for 4 days per week (32 hours per week total) is FULL_TIME under the per-day rule.
  period: 2026-01
  input:
    people:
      person1:
        childcare_hours_per_day: 8
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    ar_sra_time_category: FULL_TIME

# Alternate hours use reported attendance frequency; thresholds remain state-specific.
- name: Case 7, ten weekly hours over five care days is a short day.
  period: 2026-01
  input:
    state_code: AR
    age: 3
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    ar_sra_time_category: PART_TIME
- name: Case 8, monthly attendance supplies frequency for weekly hours.
  period: 2026-01
  input:
    state_code: AR
    age: 3
    childcare_hours_per_week: 10
    childcare_attending_days_per_month: 20
  output:
    ar_sra_time_category: PART_TIME
- name: Case 9, weekly hours at the daily threshold qualify for full days.
  period: 2026-01
  input:
    state_code: AR
    age: 3
    childcare_hours_per_week: 35
    childcare_days_per_week: 5
  output:
    ar_sra_time_category: FULL_TIME
- name: Case 10, reported daily hours take precedence over weekly conversion.
  period: 2026-01
  input:
    state_code: AR
    age: 3
    childcare_hours_per_day: 7
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    ar_sra_time_category: FULL_TIME
- name: Case 11, care days without hours retain the full-time fallback.
  period: 2026-01
  input:
    state_code: AR
    age: 3
    childcare_days_per_week: 5
  output:
    ar_sra_time_category: FULL_TIME
