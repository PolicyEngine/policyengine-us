# Missing-hours convention: zero is the numeric default, not evidence of part-time care.
# Benefit expectations reuse the documented full-time arithmetic in ../integration.yaml.
- name: Omitted hours use the full-time fallback for classification.
  period: 2026-01
  input:
    state_code: AR
    childcare_attending_days_per_month: 20
  output:
    ar_sra_time_category: FULL_TIME
- name: Zero is unknown while positive hours retain the daily threshold in one population.
  period: 2026-01
  input:
    people:
      child0:
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 20
      child1:
        childcare_hours_per_day: 3
        childcare_attending_days_per_month: 20
      child2:
        childcare_hours_per_day: 6.99
        childcare_attending_days_per_month: 20
      child3:
        childcare_hours_per_day: 7
        childcare_attending_days_per_month: 20
      child4:
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
    households:
      household:
        members:
        - child0
        - child1
        - child2
        - child3
        - child4
        state_code: AR
  output:
    ar_sra_time_category:
    - FULL_TIME
    - PART_TIME
    - PART_TIME
    - FULL_TIME
    - FULL_TIME
- name: Explicit part-time schedule overrides reported full-time hours.
  period: 2026-01
  input:
    state_code: AR
    childcare_hours_per_day: 8
    ar_sra_time_category: PART_TIME
  output:
    ar_sra_time_category: PART_TIME
- name: Billable care with unknown hours uses the full-time rate and copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 28
        weekly_hours_worked: 35
        employment_income: 30695
        immigration_status: CITIZEN
      person2:
        age: 2
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_attending_days_per_month: 22
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 20000
    households:
      household:
        members:
        - person1
        - person2
        state_code: AR
        county_str: PULASKI_COUNTY_AR
  output:
    is_ar_sra_eligible: true
    ar_sra: 667.68
    ar_sra_daily_state_payment:
    - 0
    - 28
    ar_sra_daily_copay:
    - 0
    - 7
- name: Zero hours, care days, and expenses do not create a subsidy.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 28
        weekly_hours_worked: 35
        employment_income: 30695
        immigration_status: CITIZEN
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
      person2:
        age: 2
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 0
        childcare_attending_days_per_month: 0
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 0
    households:
      household:
        members:
        - person1
        - person2
        state_code: AR
        county_str: PULASKI_COUNTY_AR
  output:
    ar_sra: 0
