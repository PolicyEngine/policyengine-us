# Authority: https://dese.ade.arkansas.gov/Files/CCDF_FFY_2025-2027_Final_June_DL_OEC.pdf#page=17
# Court status is distinct from protective-services or child-care authorization.

- name: AR court-supervised child at age 12.
  period: 2026-01
  input:
    state_code: AR
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    is_ar_sra_age_eligible: true

