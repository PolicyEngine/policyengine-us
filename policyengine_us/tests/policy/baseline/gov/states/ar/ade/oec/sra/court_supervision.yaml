- name: Case 8, court supervision combines with disability and applies below 13.
  period: 2026-01
  input:
    state_code: [AR, AR, AR, AR]
    age: [12, 17, 18, 19]
    is_tax_unit_dependent: [true, true, true, true]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [false, true, true, true]
    is_under_court_supervision: [true, true, true, true]
  output:
    is_ar_sra_age_eligible: [true, true, true, false]

- name: Case 9, a court-supervised 15-year-old receives a benefit through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 42
        weekly_hours_worked: 40
        employment_income: 30_000
        immigration_status: CITIZEN
      person2:
        age: 15
        is_disabled: false
        is_under_court_supervision: true
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 22
        pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
        county_str: PULASKI_COUNTY_AR
  output:
    # person2: age 15, not disabled, under court supervision => limit 19, not 13
    is_ar_sra_child_eligible: [false, true]
    # Countable income: 30,000 / 12 = 2,500 per month
    ar_sra_countable_income: 2_500
    # 2-person SMI: 90,280 * (0.52 + 0.16) = 61,390.40 / 12 = 5,115.87 per month
    # Income limit: 5,115.87 * 0.85 = 4,348.49 >= 2,500; 40 work hours >= 30
    is_ar_sra_eligible: true
    # 2,500 / 5,115.87 = 48.9% SMI => above 40% and at or below 60%
    ar_sra_income_tier: GT_40_LE_60
    # 15 * 12 = 180 months >= 72 => school-aged, for both members
    ar_sra_age_category: [SCHOOL_AGED, SCHOOL_AGED]
    # 8 hours per day >= 7 => full time
    # Statewide, school-aged, regular care, full time = $28 per day
    ar_sra_daily_base_rate: [0, 28]
    # School-aged, full time, GT_40_LE_60 state share = 0.5
    ar_sra_state_share: [0, 0.5]
    # State payment: 28 * 0.5 = 14; copay: 28 * (1 - 0.5) = 14
    ar_sra_daily_state_payment: [0, 14]
    ar_sra_daily_copay: [0, 14]
    # Monthly maximum state payment: 14 * 22 = 308
    # Monthly rate-sheet copay: 14 * 22 = 308
    # Expense: 12,000 / 12 = 1,000
    # Uncapped subsidy: min(max(1,000 - 308, 0), 308) = 308
    # 4% copay cap: 2,500 * 0.04 = 100; cap savings: 308 - 100 = 208
    # Benefit: min(308 + 208, 1,000) = 516
    ar_sra: 516

- name: Case 10, without court supervision the same teenager receives nothing.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 42
        weekly_hours_worked: 40
        employment_income: 30_000
        immigration_status: CITIZEN
      person2:
        age: 15
        is_disabled: false
        is_under_court_supervision: false
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 22
        pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: AR
        county_str: PULASKI_COUNTY_AR
  output:
    # person2: age 15, not disabled, no court supervision => limit 13; 15 >= 13
    is_ar_sra_child_eligible: [false, false]
    is_ar_sra_eligible: false
    ar_sra: 0
