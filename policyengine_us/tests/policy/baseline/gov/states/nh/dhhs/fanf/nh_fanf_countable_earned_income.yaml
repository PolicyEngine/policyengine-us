# Tests for NH FANF countable earned income for the benefit amount
# The benefit uses the 50% earned income disregard (keep 50%) for every
# eligible unit, He-W 654.13(d)-(e):
# - Recipients: 50% disregard, He-W 654.13(e)(1)
# - Applicants who passed the 20% eligibility test: 50% disregard,
#   He-W 654.13(d) and (e)(3); the 20% test is in
#   nh_fanf_countable_earned_income_for_eligibility
# (the Cliff Effect Initiative's 75% disregard was a pilot for a subgroup and
# is not modeled)
# Child care deduction is also applied to earned income
# Source: He-W 654.02; He-W 654.13; SR 97-03; FAM 603.01; BFA SR 22-28

- name: Case 1, zero earned income.
  period: 2024-01
  input:
    state_code: NH
  output:
    nh_fanf_countable_earned_income: 0

- name: Case 2, applicant benefit uses the 50 percent disregard.
  period: 2024-01
  input:
    state_code: NH
    is_tanf_enrolled: false
    tanf_gross_earned_income: 1_000
  output:
    # He-W 654.13(d): 1,000 * (1 - 0.50) = 500
    nh_fanf_countable_earned_income: 500

- name: Case 3, recipient with earned income, 50 percent disregard.
  period: 2024-01
  input:
    state_code: NH
    is_tanf_enrolled: true
    tanf_gross_earned_income: 1_000
  output:
    # Recipient: 1,000 * (1 - 0.50) = 500
    nh_fanf_countable_earned_income: 500

- name: Case 4, applicant with child care deduction.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 24_000  # $2,000/month gross
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: false
        childcare_expenses: 3_600  # $300/month
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Applicant benefit: 2,000 * (1 - 0.50) = 1,000
    # Child care max (under 6, full-time): $200
    # Countable: 1,000 - 200 = 800
    nh_fanf_countable_earned_income: 800

- name: Case 5, recipient with child care deduction.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 24_000
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: true
        childcare_expenses: 3_600
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Recipient: 2,000 * (1 - 0.50) = 1,000
    # Child care: $200
    # Countable: 1,000 - 200 = 800
    nh_fanf_countable_earned_income: 800

- name: Case 6, child care deduction exceeds income, capped at zero.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 1_200  # $100/month gross
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: true
        childcare_expenses: 2_400
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Recipient: 100 * (1 - 0.50) = 50
    # Child care (part-time): $100
    # Countable: max(50 - 100, 0) = 0
    nh_fanf_countable_earned_income: 0

- name: Case 7, child care deduction exactly equals after-disregard income.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 4_800  # $400/month gross (full-time)
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: true
        childcare_expenses: 3_600
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Recipient: 400 * (1 - 0.50) = 200
    # Child care (full-time, under 6): $200
    # Countable: 200 - 200 = 0
    nh_fanf_countable_earned_income: 0
