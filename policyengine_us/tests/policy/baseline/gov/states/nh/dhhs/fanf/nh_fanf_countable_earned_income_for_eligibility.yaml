# Tests for NH FANF countable earned income for the eligibility test
# He-W 654.13 sets the disregard for the eligibility test by status:
# - Applicants who have not received FANF in any of the previous 6 months:
#   20% disregard (keep 80%), He-W 654.13(b)-(c)
# - Recipients: 50% disregard (keep 50%), He-W 654.13(e)(1)
# Child care deduction is also applied to earned income, He-W 654.02(b)(3)
# Source: He-W 654.02; He-W 654.13; FAM 603.01

- name: Case 1, zero earned income.
  period: 2024-01
  input:
    state_code: NH
  output:
    nh_fanf_countable_earned_income_for_eligibility: 0

- name: Case 2, applicant with earned income, 20 percent disregard.
  period: 2024-01
  input:
    state_code: NH
    is_tanf_enrolled: false
    tanf_gross_earned_income: 1_000
  output:
    # He-W 654.13(b): 1,000 * (1 - 0.20) = 800
    nh_fanf_countable_earned_income_for_eligibility: 800

- name: Case 3, recipient with earned income, 50 percent disregard.
  period: 2024-01
  input:
    state_code: NH
    is_tanf_enrolled: true
    tanf_gross_earned_income: 1_000
  output:
    # He-W 654.13(e)(1): 1,000 * (1 - 0.50) = 500
    nh_fanf_countable_earned_income_for_eligibility: 500

- name: Case 4, applicant with child care deduction.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 24_000  # $2,000/month gross
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: false
        childcare_expenses: 3_600  # $300/month
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Applicant: 2,000 * (1 - 0.20) = 1,600
    # Child care max (under 6, full-time): $200
    # Countable: 1,600 - 200 = 1,400
    nh_fanf_countable_earned_income_for_eligibility: 1_400

- name: Case 5, applicant child care deduction exceeds income, capped at zero.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 1_200  # $100/month gross
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        is_tanf_enrolled: false
        childcare_expenses: 2_400
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # Applicant: 100 * (1 - 0.20) = 80
    # Child care (part-time, under 6): $100
    # Countable: max(80 - 100, 0) = 0
    nh_fanf_countable_earned_income_for_eligibility: 0
