# 285.92 + 1,181.93 + 32.15 = 1,500.00, at the limit.
# The float32 balances add to a fraction of a cent above 1,500 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 285.92
    stock_assets: 1_181.93
    bond_assets: 32.15
    state_code: NH
  output:
    nh_ssp_eligible: true

# 285.92 + 1,181.93 + 32.16 = 1,500.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 285.92
    stock_assets: 1_181.93
    bond_assets: 32.16
    state_code: NH
  output:
    nh_ssp_eligible: false
