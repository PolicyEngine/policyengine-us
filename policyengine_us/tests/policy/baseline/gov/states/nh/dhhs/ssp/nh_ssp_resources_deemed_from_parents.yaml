# Resource balances and certified budgets are stocks. Annual demographic and asset inputs are explicit.
- name: Case 1, Annual asset balances remain undivided in January and July.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        bank_account_assets:
          2026: 10_000
      person2:
        age:
          2026: 10
        person_id:
          2026: 3
        parent_1_id:
          2026: 1
        is_blind:
          2026: true
    marital_units:
      parent1:
        members: [person1]
      child1:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      parent1:
        members: [person1]
      child1:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: NH
  output:
    nh_ssp_resources_deemed_from_parents:
      2026-01: [0, 8_000]
      2026-07: [0, 8_000]

- name: Case 2, Annual agency-certified resource budget remains a monthly stock.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NH
    nh_ssp_resources_deemed_from_parents: 2_500
  output:
    nh_ssp_resources_deemed_from_parents:
      2026-01: 2_500
      2026-07: 2_500
