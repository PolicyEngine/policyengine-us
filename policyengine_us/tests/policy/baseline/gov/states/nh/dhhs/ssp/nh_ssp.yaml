- name: Case 49, a mixed blind and aged applicant couple uses each member's own earned income disregard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
      person2:
        age: 40
        is_blind: true
        # 10 hours a week as a cashier at the New Hampshire median wage of
        # $16.27 (BLS OEWS May 2025): $16.27 * 10 * 52 = $8,460.40 a year.
        employment_income: 8_460.4
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: NH
  output:
    # $8,460.40 / 12 = $705.03 a month; ($705.03 - $20 - $65) * 0.5 = $310.02
    # countable; ($1,491 - $310.02) / 2 = $590.49 each.
    ssi: [590.49, 590.49]
    # He-W 654.15(b), blind: ($705.03 - $85) * 0.5 = $310.02 net earnings; the
    # aged member has none. $310.02 + $1,180.98 SSI - $20 = $1,471.
    nh_ssp_countable_income: [1_471, 1_471]
    # $1,492 two-person standard - $1,471 = $21, split between two recipients.
    nh_ssp: [10.5, 10.5]

- name: Case 50, a blind applicant's nonapplicant spouse's earnings get the blind disregard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_blind: true
      person2:
        age: 40
        # 20 hours a week as a cashier at the New Hampshire median wage of
        # $16.27 (BLS OEWS May 2025): $16.27 * 20 * 52 = $16,920.80 a year.
        employment_income: 16_920.8
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: NH
  output:
    # $16,920.80 / 12 = $1,410.07 a month, above the $497 difference, so SSI
    # deems ($1,410.07 - $20 - $65) * 0.5 = $662.53; $1,491 - $662.53 = $828.47.
    ssi: [828.47, 0]
    nh_ssp_eligible: [true, false]
    # He-W 654.02(e) combines the spouse's earnings before the blind disregard:
    # ($1,410.07 - $85) * 0.5 = $662.53; $662.53 + $828.47 - $20 = $1,471.
    # $1,492 two-person standard - $1,471 = $21.
    nh_ssp: [21, 0]

- name: Case 51, a permanent resident with 40 credited quarters is eligible within the five-year wait.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    # 8 USC 1622(b)(2): 40 qualifying quarters credited under 8 USC 1645.
    snap_alien_qualifying_quarters: 40
    # 8 USC 1613(a) bars federal SSI for 5 years after entry; the federal SSI
    # model does not apply that bar, so SSI is set to the $0 it would pay.
    ssi: 0
  output:
    nh_ssp_eligible: true
    # max(0 - 13, 0) = 0 countable; $1,008 - $0 = $1,008.
    nh_ssp: 1_008

- name: Case 52, the independent-living standard moves with the SSI cost-of-living increase.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 70
  output:
    # He-W 658.03(e): standard = SSI individual rate + $27 - $13, and countable
    # income = SSI - $13, so the grant stays $27 whatever the 2027 rate is.
    nh_ssp: 27

- name: Case 53, the residential care standard moves with the SSI cost-of-living increase.
