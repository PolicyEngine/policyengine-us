# He-W 616.02(a) and AAM 305.11-305.13: five-year rule instead of SSI's 40 quarters.
- name: Case 37, permanent resident past the five-year wait without forty quarters.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 10
    ssi_qualifying_quarters_earnings: 0
  output:
    # 0 of the 40 qualifying quarters SSI requires, so no SSI.
    ssi: 0
    # 10 years since entry >= 5-year waiting period.
    nh_ssp_eligible: true
    # max(0 + 0 - 13, 0) = 0 countable; 1,008 - 0 = 1,008.
    nh_ssp: 1_008

- name: Case 38, permanent resident within the five-year wait is ineligible.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    # Default 40 qualifying quarters, which SSI's rule would accept.
    years_since_us_entry: 2
  output:
    # 2 years since entry < 5-year waiting period.
    nh_ssp_eligible: false
    nh_ssp: 0

- name: Case 39, refugee is eligible without a waiting period.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 70
    immigration_status: REFUGEE
    years_since_us_entry: 1
  output:
    # Refugees are SSI qualified noncitizens.
    ssi: 994
    # AAM 305.11 exempts refugees from the waiting period.
    nh_ssp_eligible: true
    # 994 - 13 = 981 countable; 1,008 - 981 = 27.
    nh_ssp: 27

- name: Case 40, parent and adult child in a default marital unit use an individual budget.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        person_id: 1
      person2:
        age: 40
        person_id: 2
        parent_1_id: 1
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # The omitted marital units put both people in one default unit; the
    # parent link rules out a spouse, so each is a one-person group.
    ssi: [994, 0]
    # person1: 994 - 13 = 981; person2: max(0 - 13, 0) = 0.
    nh_ssp_countable_income: [981, 0]
    # 1,008 - 981 = 27; person2 is not aged, blind or disabled.
    nh_ssp: [27, 0]

- name: Case 41, grant reduction flag on either spouse reduces the couple grant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
        nh_ssp_grant_reduction_applies: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NH
  output:
    # 745.5 SSI each: 745.5 + 745.5 - 20 = 1,471 for the couple.
    nh_ssp_countable_income: [1_471, 1_471]
    # 1,492 - 1,471 = 21; 21 * 2 / 3 = 14 for the couple, whichever spouse has
    # the flag; 14 / 2 = 7 each.
    nh_ssp: [7, 7]
