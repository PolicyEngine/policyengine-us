- name: Case 14, payroll taxes above the minimum employment expense are deducted.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 40
    meets_ssi_disability_criteria: true
    is_permanently_and_totally_disabled: true
    nh_ssp_living_arrangement: ENHANCED_FAMILY_CARE
    # Supported employment, 10 hours a week at the $7.25 minimum wage
    # (RSA 279:21 adopts the federal rate): 10 * 52 * 7.25 = 3,770.
    employment_income: 3_770
  output:
    # SSI: 994 - (3,770 / 12 - 85) * 0.5 = 994 - 114.58 = 879.42.
    ssi: 879.42
    # FICA: 3,770 * 0.0765 / 12 = 24.03, above the $18 minimum.
    nh_ssp_employment_expenses: 24.03
    # Earned: 314.17 - 20 - 30 - 24.03 = 240.13; 240.13 + 879.42 - 13 = 1,106.55.
    nh_ssp_countable_income: 1_106.55
    # 1,188 - 1,106.55 = 81.45, rounded to 81.
    nh_ssp: 81

- name: Case 15, court-ordered child support is deducted.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 40
    meets_ssi_disability_criteria: true
    is_permanently_and_totally_disabled: true
    # The $50 monthly minimum support order of RSA 458-C:2, V: 50 * 12 = 600.
    child_support_expense: 600
  output:
    # 600 / 12 = 50 under He-W 654.20(a)(1).
    nh_ssp_other_income_deductions: 50
    # 994 SSI - 13 disregard - 50 support = 931.
    nh_ssp_countable_income: 931
    # 1,008 - 931 = 77.
    nh_ssp: 77

