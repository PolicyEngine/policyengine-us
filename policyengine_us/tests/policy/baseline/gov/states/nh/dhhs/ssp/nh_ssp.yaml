- name: Case 55, a New Hampshire resident and a Massachusetts resident in one simulation.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
      person2:
        age: 70
    # Separate units, so default units don't pair the two as spouses.
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
