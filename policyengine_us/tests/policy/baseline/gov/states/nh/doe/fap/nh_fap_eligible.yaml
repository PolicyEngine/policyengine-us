# Source: PY27 NH Fuel Assistance Program Procedures Manual.
# https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf
# Physical PDF pages: 12, 17, 18, 21, 35, 36, 74.
# Period 2027 represents the researched 2026-2027 schedule with 2026 FPG.
# Inputs are annual; SSI and FANF totals are explicitly supplied to isolate receipts.
# Heat-in-rent cases assert eligibility only, not an unresolved final award.

# Manual pp12,17 and74; maximum is inclusive.
- name: "Case 1, income at the 1-person annual ceiling is eligible."
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        employment_income: 48_713
    spm_units:
      spm_unit1:
        members: ["person1"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 4_000
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
  output:
    nh_fap_eligible: true

# Manual pp12,17 and74; above published maximum.
- name: "Case 2, income one cent above the 1-person annual ceiling is ineligible."
