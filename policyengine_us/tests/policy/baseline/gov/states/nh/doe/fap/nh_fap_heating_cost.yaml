# Source: PY27 NH Fuel Assistance Program Procedures Manual, physical pages 17, 18, 76, 77.
# https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf
# Agency service counties: https://www.capnh.org/home-old
# Using bedrooms alone is a user-approved modeling approximation, not the statutory room definition.
# Inputs and estimates are annual; actual bills and the estimated cost are not added together.

# Manual pp76-77 formula with the approved bedroom-only proxy: 2000 * 4 * 7672 / 1,000,000 * 28.881 / .78 = 2272.564431.
- name: "Case 1, four bedrooms produce a four-room oil estimate without added rooms."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "FUEL_OIL"
        nh_fap_dwelling_type: "SINGLE_FAMILY_OR_MODULAR"
        fuel_oil_expense: 0
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
        county_str: "COOS_COUNTY_NH"
        bedrooms: 4
  output:
    nh_fap_heating_cost: 2_272.564431

