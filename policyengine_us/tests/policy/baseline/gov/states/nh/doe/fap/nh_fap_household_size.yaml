# Manual pp35-36 and existing qualified-status mapping; income is tested separately.
- name: "Case 3, mixed status excludes ineligible members only from household size."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
      person2:
        age: 40
        immigration_status: "UNDOCUMENTED"
        ssi: 0
      person3:
        age: 40
        immigration_status: "DACA"
        ssi: 0
      person4:
        age: 40
        immigration_status: "TPS"
        ssi: 0
      person5:
        age: 40
        immigration_status: "REFUGEE"
        ssi: 0
    spm_units:
      spm_unit1:
        members: ["person1", "person2", "person3", "person4", "person5"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 4_000
    households:
      household1:
        members: ["person1", "person2", "person3", "person4", "person5"]
        state_code: "NH"
  output:
    nh_fap_household_size: 2

# Manual p36 does not count an ineligible noncitizen for eligibility size.
- name: "Case 4, an entirely ineligible-status household has size zero."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "UNDOCUMENTED"
        ssi: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 4_000
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
  output:
    nh_fap_household_size: 0
