# Source: PY27 NH Fuel Assistance Program Procedures Manual.
# https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf
# Physical PDF pages: 12, 35, 36.
# Period 2027 represents the researched 2026-2027 schedule with 2026 FPG.
# Inputs are annual; SSI and FANF totals are explicitly supplied to isolate receipts.

# Manual pp35-36 includes the reported qualified status regardless of entry date.
- name: "Case 1, citizen is a qualified household member."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        years_since_us_entry: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 4_000
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
  output:
    nh_fap_household_size: 1

