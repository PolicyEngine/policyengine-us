# Manual p17 and plan item 1.9 count Social Security net of the Medicare deduction.
# An enrollee aged 70 needs no reported amount: 1,980 a month after the $20
# exclusion is above the MSP limit (about 1,838), so the premium is
# 202.90 * 12 = 2,434.80 and 24,000 - 2,434.80 = 21,565.20.
- name: "Case 31, a Medicare enrollee's Part B premium is deducted from Social Security."
