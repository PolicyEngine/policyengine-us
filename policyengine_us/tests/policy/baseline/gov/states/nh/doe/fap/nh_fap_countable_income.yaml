  output:
    medicare_part_b_premium: 2_434.8
    nh_fap_countable_income: 15_565.2

# Manual pp14-17 allow support paid and the withheld Medicare premium separately.
# Social Security of 2,000 a month is above the MSP limit (about 1,838 a month),
# so the premium is 2,434.80: 24,000 - 2,000 - 2,434.80 = 19,565.20.
- name: "Case 29, support paid and the Part B premium are both deducted."
