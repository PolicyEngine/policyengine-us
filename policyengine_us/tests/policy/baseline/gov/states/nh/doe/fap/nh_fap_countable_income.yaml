# Manual p17 deducts Medicare premiums withheld from Social Security. Social
# Security of 12,000 is 1,000 a month, or 980 after the $20 exclusion, within the
# Medicare Savings Program limit (135% of the 2027 one-person guideline, about
# 1,838 a month), so MSP pays the premium and nothing is withheld or deducted.
- name: "Case 27, no Part B deduction applies when the Medicare Savings Program pays the premium."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: "CITIZEN"
        ssi: 0
        nh_ssp: 0
        social_security: 12_000
    spm_units:
