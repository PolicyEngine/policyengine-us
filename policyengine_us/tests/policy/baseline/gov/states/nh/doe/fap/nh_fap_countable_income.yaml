# Manual pp15,17 deduct the Medicare premium withheld from railroad retirement.
# railroad_benefits is not an SSI unearned source in the model, so MSP status
# turns on assets: 20,000 exceeds the 9,950 MSP resource limit and the enrollee
# pays the 2027 premium of 202.90 * 12 = 2,434.80. 18,000 - 2,434.80 = 15,565.20.
- name: "Case 28, the Part B premium withheld from railroad retirement is deducted."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: "CITIZEN"
        ssi: 0
        nh_ssp: 0
        railroad_benefits: 18_000
        bank_account_assets: 20_000
    spm_units:
