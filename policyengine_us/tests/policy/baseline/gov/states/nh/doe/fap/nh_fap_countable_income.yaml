# Source: PY27 NH Fuel Assistance Program Procedures Manual.
# https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf
# Physical PDF pages: 13, 14, 15, 16, 17, 23, 25, 26, 29, 34, 36.
# Period 2027 represents the researched 2026-2027 schedule with 2026 FPG.
# Inputs are annual; SSI and FANF totals are explicitly supplied to isolate receipts.
# Investment treatment follows the specific separate exclusions on pp15-16;
# p17's combined wording remains an explicitly documented interpretation gap.

# Manual p15 counts salaries and wages before deductions; p17 does not list a general earned-income disregard.
- name: "Case 1, gross annual wages receive no general earnings disregard."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 4_000
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
  output:
    nh_fap_countable_income: 12_000

