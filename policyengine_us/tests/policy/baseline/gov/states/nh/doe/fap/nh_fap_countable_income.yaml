    nh_fap_countable_income: 21_565.2

# Manual pp14-17; each member's withheld premium is deducted within its own SPM
# unit. Separate tax and marital units keep each person's MSP test individual.
# Person1 (Social Security above the MSP limit) and person2 (assets of 20,000 above
# the 9,950 limit) each pay 2,434.80: 24,000 + 18,000 - 2 * 2,434.80 = 37,130.40.
# Person3's 980 a month after the $20 exclusion is within the MSP limit, so MSP
# pays the premium and unit 2 keeps 12,000.
- name: "Case 32, each SPM unit deducts its members' Part B premiums, and none that MSP pays."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: "CITIZEN"
        ssi: 0
        nh_ssp: 0
        social_security: 24_000
      person2:
        age: 68
        immigration_status: "CITIZEN"
        ssi: 0
        nh_ssp: 0
        railroad_benefits: 18_000
        bank_account_assets: 20_000
      person3:
        age: 70
        immigration_status: "CITIZEN"
        ssi: 0
        nh_ssp: 0
        social_security: 12_000
    tax_units:
      tax_unit1:
        members: ["person1"]
      tax_unit2:
        members: ["person2"]
      tax_unit3:
        members: ["person3"]
    marital_units:
      marital_unit1:
        members: ["person1"]
      marital_unit2:
        members: ["person2"]
      marital_unit3:
        members: ["person3"]
    spm_units:
      spm_unit1:
        members: ["person1", "person2"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
      spm_unit2:
        members: ["person3"]
        nh_fanf: 0
        heating_type: "NATURAL_GAS"
    households:
      household1:
        members: ["person1", "person2", "person3"]
        state_code: "NH"
  output:
    medicare_part_b_premium: [2_434.8, 2_434.8, 0]
    nh_fap_countable_income: [37_130.4, 12_000]

