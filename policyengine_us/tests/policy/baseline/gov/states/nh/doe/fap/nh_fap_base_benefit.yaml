# Source: PY27 NH Fuel Assistance Program Procedures Manual.
# https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf
# Physical PDF pages: 10, 17, 18, 35, 36, 74, 76, 77, 78.
# Period 2027 represents the researched 2026-2027 schedule with 2026 FPG.
# Inputs are annual; SSI and FANF totals are explicitly supplied to isolate receipts.
# This is the base schedule using actual or estimated costs, before unresolved heat-in-rent adjustment.
# No final nh_fap award or unsupported fuel amount is asserted.

# Manual p78, delivered DD/A cell. Actual annual primary-fuel bill selects the row.
- name: "Case 1, delivered matrix cost tier DD and income band A."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        employment_income: 10_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        nh_fanf: 0
        heating_type: "FUEL_OIL"
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        fuel_oil_expense: 500
    households:
      household1:
        members: ["person1"]
        state_code: "NH"
  output:
    nh_fap_countable_income: 10_000
    nh_fap_base_benefit: 750

