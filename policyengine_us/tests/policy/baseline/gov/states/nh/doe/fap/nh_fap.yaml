# Manual page 15 counts annuity payments and military retirement pay. A uniformed
# services Survivor Benefit Plan annuity is reported in military_retirement_pay_survivors.
# Income 20,000 is above 125% of the 2026 one-person FPG (15,960 * 1.25 = 19,950)
# and within 150% (23,940), so band D. No bill: Coos single-family proxy with four
# bedrooms, 2,000 * 4 * 7,672 / 1,000,000 * 28.881 / 0.78 = 2,272.56, cost band BB.
# Fuel oil multiplier 1: BB/D = 1,410.
- name: Case 84, a military Survivor Benefit Plan annuity counts as unearned income.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        nh_ssp: 0
        immigration_status: CITIZEN
        military_retirement_pay_survivors: 20_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
    households:
      household1:
        members: [person1]
        state_code: NH
        county_str: COOS_COUNTY_NH
        bedrooms: 4
  output:
    nh_fap_countable_income: 20_000
    nh_fap_heating_cost: 2_272.564431
    nh_fap_eligible: true
    nh_fap: 1_410

