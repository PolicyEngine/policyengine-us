# Unit tests for the Colorado Premium Assistance amount (REQ-06..12, REQ-16).
#
# All inputs (is_aca_ptc_eligible per person, aca_magi_fraction, slcsp as an
# annual value, aca_ptc) are supplied directly so every expected value is
# exactly hand-verifiable and independent of the rating-area premium lookup.
# slcsp is a MONTH-period variable; the amount formula annualizes it via
# add(tax_unit, period, ["slcsp"]). Providing slcsp at the YEAR period sets the
# annual total, so the values below are annual SLCSP.
#
# Monthly flat build-up (REQ-06/07/09): first_member = $80, additional_member =
# $29, member_cap = 5.
#   n            = min(count of is_aca_ptc_eligible members, 5)
#   flat_monthly = (80 + 29*(n-1)) if n >= 1 else 0
#   residual     = max(0, slcsp_annual - aca_ptc)     (REQ-10)
#   amount       = eligible * min(12 * flat_monthly, residual)   (REQ-11/12)
# Hand values: n=1 -> 12*80 = 960; n=2 -> 12*109 = 1_308;
# n=5 -> 12*196 = 2_352; n>=5 caps at 2_352.

- name: Case 1, single APTC-eligible member, high residual -> n=1 flat $80/mo.
  # n=1 -> flat_monthly = 80 -> 12*80 = 960. residual 10_000-2_000 = 8_000 >= 960.
  # amount = min(960, 8_000) = 960.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 10_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 960

- name: Case 2, two APTC-eligible members -> n=2 flat $109/mo.
  # n=2 -> flat_monthly = 80 + 29*1 = 109 -> 12*109 = 1_308.
  # residual 12_000-2_000 = 10_000 >= 1_308. amount = 1_308.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi_fraction: 3.00
        slcsp: 12_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1, person2]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 1_308

- name: Case 3, five APTC-eligible members -> n=5 flat $196/mo (max build-up).
  # n=5 -> flat_monthly = 80 + 29*4 = 196 -> 12*196 = 2_352.
  # residual 20_000-3_000 = 17_000 >= 2_352. amount = 2_352.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
      person3:
        age: 15
        is_aca_ptc_eligible: true
      person4:
        age: 12
        is_aca_ptc_eligible: true
      person5:
        age: 9
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        aca_magi_fraction: 3.00
        slcsp: 20_000
        aca_ptc: 3_000
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 2_352

- name: Case 4, seven APTC-eligible members -> member cap binds at 5 -> $196/mo.
  # count = 7, min(7, 5) = 5 -> flat_monthly = 196 -> 12*196 = 2_352.
  # residual 25_000-4_000 = 21_000 >= 2_352. amount = 2_352 (cap at 5).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
      person3:
        age: 17
        is_aca_ptc_eligible: true
      person4:
        age: 15
        is_aca_ptc_eligible: true
      person5:
        age: 12
        is_aca_ptc_eligible: true
      person6:
        age: 9
        is_aca_ptc_eligible: true
      person7:
        age: 6
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5, person6, person7]
        aca_magi_fraction: 3.00
        slcsp: 25_000
        aca_ptc: 4_000
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 2_352

- name: Case 5, residual cap binding -> amount = SLCSP minus APTC, not 12*flat.
  # n=1 -> 12*80 = 960. residual 10_000-9_500 = 500 < 960.
  # amount = min(960, 500) = 500 (REQ-10 residual cap).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 10_000
        aca_ptc: 9_500
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 500

- name: Case 6, APTC already covers the SLCSP -> residual 0 -> amount 0.
  # residual = max(0, 8_000 - 8_000) = 0. amount = min(960, 0) = 0 despite
  # eligibility (REQ-10).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 8_000
        aca_ptc: 8_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 0

- name: Case 7, ineligible unit (above 400% FPL) -> amount 0.
  # aca_magi_fraction 4.50 > 4.0 -> co_premium_assistance_eligible false ->
  # where(eligible, annual, 0) returns 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 4.50
        slcsp: 10_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: false
    co_premium_assistance: 0

- name: Case 8, non-Colorado state -> amount 0 (defined_for StateCode.CO).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 10_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    co_premium_assistance: 0

- name: Case 9, program not in effect in 2025 -> amount 0.
  # in_effect false for 2025 -> eligible false -> amount 0.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 10_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: false
    co_premium_assistance: 0

- name: Case 10, zero SLCSP with an eligible unit -> residual 0 -> amount 0.
  # Distinct from Case 6 (both positive and equal): here the benchmark premium
  # itself is 0. residual = max(0, 0 - 0) = 0. n=1 -> 12*80 = 960.
  # amount = min(960, 0) = 0 despite eligibility.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 0
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 0

- name: Case 11, residual exactly equals 12*flat (tie at the min) -> amount = flat.
  # n=1 -> flat_monthly = 80 -> 12*80 = 960. residual 8_000-7_040 = 960.
  # min(960, 960) = 960: the two caps are equal, so the tie resolves to 960.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 2.50
        slcsp: 8_000
        aca_ptc: 7_040
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 960

- name: Case 12, six APTC-eligible members -> cap binds at 5 -> $196/mo (n=5 amount).
  # count = 6, min(6, 5) = 5 -> flat_monthly = 196 -> 12*196 = 2_352. This is the
  # first member above the cap; the amount equals the n=5 case (2_352, Case 3),
  # confirming n=5 -> n=6 produces no change.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 47
        is_aca_ptc_eligible: true
      person2:
        age: 45
        is_aca_ptc_eligible: true
      person3:
        age: 17
        is_aca_ptc_eligible: true
      person4:
        age: 15
        is_aca_ptc_eligible: true
      person5:
        age: 12
        is_aca_ptc_eligible: true
      person6:
        age: 9
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5, person6]
        aca_magi_fraction: 3.00
        slcsp: 25_000
        aca_ptc: 4_000
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 2_352

- name: Case 13, positive amount just inside the FPL band (1.01) -> full 12*$80.
  # Fractional lower-band value 1.01 is income-eligible and yields a positive
  # benefit (not just an eligibility flag). n=1 -> 12*80 = 960.
  # residual 10_000-2_000 = 8_000 >= 960. amount = 960.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.01
        slcsp: 10_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    co_premium_assistance_eligible: true
    co_premium_assistance: 960
