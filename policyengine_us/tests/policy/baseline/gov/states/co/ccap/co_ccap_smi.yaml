# Before October 2015, the October before each month falls before the date
# parameters are backdated to, so the parameters are read at 2015-01-01.
# HHS's FY 2015 SMI for Colorado, effective 2014-10-01, still applies there.
- name: Household size 4, State CO, January and October 2015
  period: 2015
  input:
    spm_unit_size: 4
    state_code_str: CO
  output:
    co_ccap_smi:
      2015-01: 85_182 / 12
      2015-09: 85_182 / 12
      2015-10: 85_915 / 12
