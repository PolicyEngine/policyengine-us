# Authority: https://spl.cde.state.co.us/artemis/huserials/hu62510internet/hu62510202527internet.pdf#page=23
# Court status is distinct from protective-services or child-care authorization.

- name: CO court status alone is insufficient.
  period: 2026-01
  input:
    state_code: CO
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    co_ccap_child_eligible: false

- name: CO verified care needs alone are insufficient.
  period: 2026-01
  input:
    state_code: CO
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: false
    co_ccap_has_verified_additional_care_needs: true
  output:
    co_ccap_child_eligible: false

- name: CO court supervision with verified additional care needs at age 13.
  period: 2026-01
  input:
    state_code: CO
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
    co_ccap_has_verified_additional_care_needs: true
  output:
    co_ccap_child_eligible: true

