- name: Case 1, in 2023, a child's $2,200 of charges less an $800 parent fee leaves $1,400.
  period: 2023
  input:
    people:
      parent:
        age: 30
      child:
        age: 4
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 1_000
        after_school_expenses: 1_200
    spm_units:
      spm_unit:
        members: [parent, child]
        co_ccap_parent_fee: 800
        co_ccap_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_subsidy: 1_400

- name: Case 2, in December 2022, a child's $2,200 of monthly charges less an $800 parent fee leaves $1,400.
  period: 2022
  input:
    people:
      parent:
        age: 30
      child:
        age: 4
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 12 * 1_000
        after_school_expenses: 12 * 1_200
    spm_units:
      spm_unit:
        members: [parent, child]
        co_ccap_parent_fee:
          2022-12: 800
        co_ccap_eligible: true
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_subsidy:
      2022-12: 1_400

- name: Case 3, a teenager without additional care needs adds nothing to the payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      young_child:
        age: 3
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 12_000
      teen:
        age: 15
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 12_000
    spm_units:
      spm_unit:
        members: [parent, young_child, teen]
        co_ccap_parent_fee: 200
        co_ccap_eligible: true
    households:
      household:
        members: [parent, young_child, teen]
        state_code: CO
  output:
    co_ccap_child_eligible: [false, true, false]
    # 8 CCR 1403-1 3.132(D) pays for children under 13: the 3-year-old's
    # $1,000 a month less the $200 fee, and nothing toward the 15-year-old's
    # $1,000.
    co_ccap_subsidy: 800

- name: Case 4, a teenager who can't care for themselves is an eligible child.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      young_child:
        age: 3
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 12_000
      teen:
        age: 15
        is_tax_unit_dependent: true
        is_disabled: true
        pre_subsidy_childcare_expenses: 12_000
    spm_units:
      spm_unit:
        members: [parent, young_child, teen]
        co_ccap_parent_fee: 200
        co_ccap_eligible: true
    households:
      household:
        members: [parent, young_child, teen]
        state_code: CO
  output:
    co_ccap_child_eligible: [false, true, true]
    # 3.132(E) covers a child under 19 who can't care for themselves:
    # $1,000 + $1,000 - $200.
    co_ccap_subsidy: 1_800

