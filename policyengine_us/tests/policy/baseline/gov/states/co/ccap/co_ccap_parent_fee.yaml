- name: Case 12, a teenager sharing the expense adds no fee for an additional child.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 50_000
      child1:
        age: 3
        is_tax_unit_dependent: true
      child2:
        age: 6
        is_tax_unit_dependent: true
      teenager:
        age: 15
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [parent, child1, child2, teenager]
        spm_unit_pre_subsidy_childcare_expenses: 18_000
    households:
      household:
        members: [parent, child1, child2, teenager]
        state_code: CO
  output:
    co_ccap_child_in_care: [false, true, true, false]
    # 50,000 / 12 = 4,166.67; the guideline for four is 32,150 / 12 = 2,679.17.
    # 0.01 * 4,166.67 + 0.14 * 1,487.50 = 41.67 + 208.25 = 249.92, so 249.
    co_ccap_base_parent_fee: 249
    co_ccap_add_on_parent_fee: 15
    # 249 + 15 = 264.
    co_ccap_parent_fee: 264

