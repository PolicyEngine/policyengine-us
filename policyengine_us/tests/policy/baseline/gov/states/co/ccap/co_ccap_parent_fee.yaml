      parent:
        age:
          2028: 35
      child1:
        age:
          2028: 3
        is_tax_unit_dependent:
          2028: true
        childcare_hours_per_day:
          2028: 8
      child2:
        age:
          2028: 5
        is_tax_unit_dependent:
          2028: true
        childcare_hours_per_day:
          2028: 8
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        co_ccap_countable_income: 3_500
        co_ccap_fpg: 2_000
