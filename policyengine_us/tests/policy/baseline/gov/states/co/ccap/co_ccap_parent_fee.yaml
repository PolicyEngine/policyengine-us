# 8 CCR 1403-1 3.124, PDF pages 79-85 of ruleVersionId 12658. A county charges
# one fee per household: the base fee on gross income ((P)(1) and (P)(2)) plus
# $15 for each child in care after the first above the guideline ((P)(3)), in
# whole dollars ((A)), at 55% when every child in care receives part-time
# care ((U) and (W)), and 20% lower at a provider in the top three quality
# levels ((H)). CDEC's parent fee tool drops the cents after each step, in that order:
# https://drive.google.com/file/d/1HtPiC2qxclzWfBa7LRo2Uohrg-RCBkyZ/view
# January to September 2026 use the guideline in 3.111(H)(2), and October to
# December 2026 the one in 3.111(H)(3).
- name: Case 1, a parent earning $40,000 with two children in full-time care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 40_000
      child1:
        age: 3
        is_tax_unit_dependent: true
        childcare_hours_per_day: 8
      child2:
        age: 5
        is_tax_unit_dependent: true
        childcare_hours_per_day: 8
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: CO
  output:
    # 40,000 / 12 = 3,333.33
    co_ccap_countable_income: 3_333.33
    # (15,650 + 2 * 5,500) / 12 = 2,220.83
    co_ccap_fpg: 2_220.83
    # 0.01 * 3,333.33 + 0.14 * (3,333.33 - 2,220.83) = 33.33 + 155.75 = 189.08,
    # which drops its cents to 189.
    co_ccap_base_parent_fee: 189
    # (2 - 1) * 15
    co_ccap_add_on_parent_fee: 15
    # 189 + 15 = 204.
    co_ccap_parent_fee: 204

- name: Case 2, the same family in October 2026, matching CDEC's parent fee tool.
  period: 2026-10
  absolute_error_margin: 0.01
  # A test of a month other than January applies yearly inputs only when they
  # carry their year.
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 40_000
      child1:
        age:
          2026: 3
        is_tax_unit_dependent:
          2026: true
        childcare_hours_per_day:
          2026: 8
      child2:
        age:
          2026: 5
        is_tax_unit_dependent:
          2026: true
        childcare_hours_per_day:
          2026: 8
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code:
          2026: CO
  output:
    # (15,960 + 2 * 5,680) / 12 = 2,276.67
    co_ccap_fpg: 2_276.67
    # 0.01 * 3,333.33 + 0.14 * (3,333.33 - 2,276.67) = 33.3333 + 147.9324 =
    # 181.2657, which drops its cents to 181.
    co_ccap_base_parent_fee: 181
    # 181 + 15 = 196. The tool, with a family of 3, $40,000 a year and 2
    # children, gives the same full-time fee.
    co_ccap_parent_fee: 196

- name: Case 3, with no recorded hours the children count as in full-time care.
  period: 2026-01
  input:
    people:
      parent:
        age: 35
        employment_income: 40_000
      child1:
        age: 3
        is_tax_unit_dependent: true
      child2:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    households:
      household:
        members: [parent, child1, child2]
        state_code: CO
  output:
    co_ccap_children_in_care: 2
    co_ccap_child_in_part_time_care: [false, false, false]
    co_ccap_parent_fee: 204

- name: Case 4, both children in part-time care pay 55% of the fee.
  period: 2026-01
  input:
    people:
      parent:
        age: 35
        employment_income: 40_000
      child1:
        age: 3
        is_tax_unit_dependent: true
        childcare_hours_per_day: 4
      child2:
        age: 4
        is_tax_unit_dependent: true
        childcare_hours_per_day: 4
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: CO
  output:
    # Each child has 0.55 * 21.67 = 11.92 units a month, under 13.
    co_ccap_child_in_part_time_care: [false, true, true]
    # 204 * 0.55 = 112.2, which drops its cents to 112.
    co_ccap_parent_fee: 112

- name: Case 5, one child in full-time care keeps the full fee.
  period: 2026-01
  input:
    people:
      parent:
        age: 35
        employment_income: 40_000
      child1:
        age: 3
        is_tax_unit_dependent: true
        childcare_hours_per_day: 4
      child2:
        age: 4
        is_tax_unit_dependent: true
        childcare_hours_per_day: 8
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: CO
  output:
    co_ccap_child_in_part_time_care: [false, true, false]
    co_ccap_parent_fee: 204

- name: Case 6, the part-time rate and then the quality discount, each dropping cents.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 28_020
      child:
        age: 3
        is_tax_unit_dependent: true
        childcare_hours_per_day: 4
        co_quality_rating_of_child_care_facility: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    # 28,020 / 12 = 2,335; the guideline for two is 21,150 / 12 = 1,762.50.
    # 0.01 * 2,335 + 0.14 * (2,335 - 1,762.50) = 23.35 + 80.15 = 103.50, so 103.
    co_ccap_base_parent_fee: 103
    # Full time: 103. Part time: 103 * 0.55 = 56.65, so 56. Quality level 3:
    # 56 * 0.8 = 44.8, so 44. The discount before the part-time rate would
    # give 45, and so would rounding once at the end.
    co_ccap_parent_fee: 44

- name: Case 7, a child in school with short days pays the part-time fee under section 3.124(W).
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 30_000
      child:
        age: 8
        is_tax_unit_dependent: true
        childcare_hours_per_day: 4
        childcare_attending_days_per_month: 24
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    # 0.55 * 24 = 13.2 units, but section 3.124(W) covers the 8-year-old.
    co_ccap_full_time_equivalent_units: [0, 13.2]
    co_ccap_child_in_part_time_care: [false, true]
    # 0.01 * 2,500 + 0.14 * (2,500 - 1,762.50) = 25 + 103.25 = 128.25, so 128;
    # 128 * 0.55 = 70.4, so 70.
    co_ccap_parent_fee: 70

