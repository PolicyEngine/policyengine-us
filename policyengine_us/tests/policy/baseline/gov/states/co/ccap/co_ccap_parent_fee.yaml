      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    # 20 hours over five weekdays: 4 hours a day, 0.55 * 21.67 = 11.92 units.
    co_ccap_care_hours_per_day: [0, 4]
    co_ccap_child_in_part_time_care: [false, true]
    # 40,000 / 12 = 3,333.33; the guideline for two is 21,150 / 12 = 1,762.50.
    # 0.01 * 3,333.33 + 0.14 * 1,570.83 = 33.33 + 219.92 = 253.25, so 253.
    # 253 * 0.55 = 139.15, so 139.
    co_ccap_parent_fee: 139

