- name: Case 29, a father whom the child's parent ids name counts as a caretaker under 3.111(D)(2) though he files separately, so his lack of activity blocks the working mother.
  period: 2026-01
  input:
    people:
      mother:
        person_id: 1
        age: 30
        employment_income: 30_000
      father:
        person_id: 2
        age: 30
      child:
        person_id: 3
        age: 3
        parent_1_id: 1
        parent_2_id: 2
    spm_units:
      spm_unit:
        members: [mother, father, child]
    tax_units:
      mother_tax_unit:
        members: [mother, child]
      father_tax_unit:
        members: [father]
    households:
      household:
        members: [mother, father, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

