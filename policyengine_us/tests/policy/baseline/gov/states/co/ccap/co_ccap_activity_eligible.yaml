      spm_unit:
        members: [grandparent, parent, child]
    tax_units:
      grandparent_tax_unit:
        members: [grandparent]
      parent_tax_unit:
        members: [parent, child]
    households:
      household:
        members: [grandparent, parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 19, the activity input covers job search and other activities the model does not track.
  period: 2026-01
  input:
