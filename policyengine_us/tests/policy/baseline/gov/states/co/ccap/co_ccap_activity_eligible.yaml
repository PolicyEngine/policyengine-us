    tax_units:
      tax_unit:
        members: [caretaker, child]
    households:
      household:
        members: [caretaker, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 23, a family experiencing homelessness is exempt under 3.121(B)(3)(a).
