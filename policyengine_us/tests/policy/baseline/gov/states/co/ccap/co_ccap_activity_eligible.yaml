      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 12, one parent working and the other at home and able to provide care fail 3.111(D)(1)(c).
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income: 20_000
      parent2:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 13, one parent working and the other incapacitated meet 3.111(D)(1)(c)(3).
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income: 20_000
      parent2:
        age: 30
        is_disabled: true
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 14, an incapacitated single parent with no activity fails 3.111(E).
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        is_disabled: true
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 15, two incapacitated parents with no activity fail, since neither is in an activity.
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        is_disabled: true
      parent2:
        age: 30
        is_disabled: true
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 16, an incarcerated parent counts as absent under 3.111(D)(1)(b), so the working parent qualifies.
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income: 20_000
      parent2:
        age: 30
        is_incarcerated: true
