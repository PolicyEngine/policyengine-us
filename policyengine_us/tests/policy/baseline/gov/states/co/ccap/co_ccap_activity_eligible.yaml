      household:
        members: [parent1, parent2, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 17, a retired grandparent who files separately is not a caretaker under 3.103(C).
  period: 2026-01
  input:
    people:
      grandparent:
        age: 70
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [grandparent, parent, child]
    tax_units:
      grandparent_tax_unit:
        members: [grandparent]
      parent_tax_unit:
        members: [parent, child]
    households:
      household:
        members: [grandparent, parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 18, a working grandparent who files separately does not supply the claiming parent's activity.
  period: 2026-01
  input:
    people:
      grandparent:
