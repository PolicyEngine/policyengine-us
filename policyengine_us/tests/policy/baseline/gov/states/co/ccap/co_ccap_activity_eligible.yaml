        spm_unit_pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
        county: DENVER_COUNTY_CO
  output:
    co_ccap_activity_eligible: false
    co_ccap_eligible: false
    co_ccap_subsidy: 0

