# 8 CCR 1403-1 section 3.111(B)(1), (D), (E) and (G); 3.115(C); 3.116(A); 3.119(D); 3.121(B)(3).
# Federal minimum wage $7.25: 40 hours for 52 weeks is 2,080 hours, so the floor is $15,080.
- name: Case 1, single parent with wages and no recorded hours meets the requirement.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 2, single parent with no activity does not meet the requirement.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 3, wages exactly at the minimum wage floor for the hours worked meet the requirement.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 15_080
        weekly_hours_worked_before_lsr: 40
        weeks_worked: 52
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 4, wages a dollar below the floor fail 3.111(G)(1)(b).
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 15_079
        weekly_hours_worked_before_lsr: 40
        weeks_worked: 52
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 5, the floor counts only the weeks worked, so $10,000 for 26 weeks at 40 hours passes.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 10_000
        weekly_hours_worked_before_lsr: 40
        weeks_worked: 26
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    # 40 x 26 = 1,040 hours x $7.25 = $7,540 <= $10,000
    co_ccap_activity_eligible: true

- name: Case 6, with no weeks reported, usual hours run the full year, so the same $10,000 fails.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 10_000
        weekly_hours_worked_before_lsr: 40
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 7, self-employment income above the floor meets 3.111(G)(2).
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        self_employment_income: 20_000
        weekly_hours_worked_before_lsr: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    # 30 x 52 = 1,560 hours x $7.25 = $11,310 <= $20,000
    co_ccap_activity_eligible: true

- name: Case 8, a business loss fails 3.111(G)(2)(c).
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        self_employment_income: -5_000
        weekly_hours_worked_before_lsr: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 9, a business loss does not erase wages.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
        self_employment_income: -30_000
        weekly_hours_worked_before_lsr: 40
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 10, a full-time college student meets 3.111(G)(4)(a)(1), which the model takes to be a first bachelor's degree or less.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        is_full_time_college_student: true
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 11, two parents who both work meet 3.111(D)(1)(c)(1).
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income: 20_000
      parent2:
