      parent:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
        meets_ccdf_activity_test: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 20, TANF receipt alone does not meet the requirement, since 3.115(C) holds caretakers of children on basic cash assistance to the low-income test.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
        is_tanf_enrolled: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: false

- name: Case 21, an eligible child under protective services exempts the household under 3.119(D).
  period: 2026-01
  input:
    people:
      caretaker:
        age: 50
      child:
        age: 3
        receives_or_needs_protective_services: true
    spm_units:
      spm_unit:
        members: [caretaker, child]
    tax_units:
      tax_unit:
        members: [caretaker, child]
    households:
      household:
        members: [caretaker, child]
        state_code: CO
  output:
    co_ccap_activity_eligible: true

- name: Case 22, an eligible child in foster care exempts the household under 3.118(A) and 3.119(D).
  period: 2026-01
  input:
    people:
