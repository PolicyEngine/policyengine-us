  input:
    people:
      parent:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
        is_homeless: true
  output:
    co_ccap_activity_eligible: true

- name: Case 24, a working parent with an eligible child receives the subsidy through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 30_000
      child:
        age: 3
        childcare_hours_per_day: 8
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CO
        county: DENVER_COUNTY_CO
  output:
    co_ccap_activity_eligible: true
    co_ccap_eligible: true
    # $1,000 a month less the $128 parent fee in court_supervision.yaml Case 5.
    co_ccap_subsidy: 872

- name: Case 25, the same family with the same income from a pension receives nothing.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        pension_income: 30_000
      child:
        age: 3
        childcare_hours_per_day: 8
    spm_units:
