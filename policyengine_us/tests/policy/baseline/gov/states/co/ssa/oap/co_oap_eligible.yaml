# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: CO
  output:
    co_oap_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: CO
  output:
    co_oap_eligible: false
