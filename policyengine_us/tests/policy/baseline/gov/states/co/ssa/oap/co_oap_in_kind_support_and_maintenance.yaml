- name: Reported SSI receipt counts matching ISM even when modeled SSI is zero.
  # 3.520.79(B)(6) charges an SSI recipient the matching SSA ISM.
  period: 2026-01
  input:
    ssi: 0
    receives_ssi: true
    ssi_in_kind_support_and_maintenance:
      2026: 3_600
    ssi_couple_computation_applies: false
  output:
    co_oap_in_kind_support_and_maintenance: 300

- name: Reported SSI receipt preserves the couple's equal ISM split.
  # The couple's $300 matching ISM is split equally between its members.
  period: 2026-01
  input:
    ssi: 0
    receives_ssi: true
    ssi_in_kind_support_and_maintenance:
      2026: 3_600
    ssi_couple_computation_applies: true
  output:
    co_oap_in_kind_support_and_maintenance: 150

- name: Matching SSI ISM follows each month's amount rather than the annual average.
  period: 2026
  absolute_error_margin: 0.01
  input:
    ssi: 0
    receives_ssi: true
    ssi_in_kind_support_and_maintenance_monthly:
      2026-01: 300
      2026-02: 120
    ssi_couple_computation_applies: true
  output:
    # Other months have no ISM, so the annual total is 300 + 120 = 420.
    ssi_in_kind_support_and_maintenance: 420
    # The recipient's share is January's 300 / 2 = 150 and February's
    # 120 / 2 = 60. Averaging the year would give 420 / 12 / 2 = 17.50.
    co_oap_in_kind_support_and_maintenance:
      2026-01: 150
      2026-02: 60
