- name: Case 1, a single client's countable income is their own income under 3.549(A).
  # $300/month of SSDI less the $20 disregard: 280/month, or 3,360/year, with
  # nothing deemed.
  period: 2026
  input:
    people:
      person:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        social_security_disability: 3_600
    households:
      household:
        members: [person]
        state_code: CO
  output:
    co_state_supplement_countable_income: 3_360

- name: Case 2, spouses of a joint SSI claim each count their own income.
  # 9 CCR 2503-5 3.549(A)(2): own unearned income other than SSI, less the
  # client's half of the $20 disregard. Pensions of $400 and $200 a month give 390 and 190
  # a month, or 4,680 and 2,280 a year. Federal SSI would give each half of
  # the pooled 580, or 290 a month.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_disabled: true
        meets_ssi_disability_criteria: true
        pension_income: 4_800
        is_tax_unit_head: true
      spouse:
        age: 52
        is_disabled: true
        meets_ssi_disability_criteria: true
        pension_income: 2_400
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    ssi_countable_income: [3_480, 3_480]
    co_state_supplement_countable_income: [4_680, 2_280]

- name: Case 3, an SSI recipient's earnings get no share of the unearned income disregard.
  # The spouse has $5/month of interest and $200/month of earnings. Their $10
  # share of the $20 disregard covers the $5 of interest (3.549(A)(2)(c)). Their
  # gross unearned income, SSI included, is not under $20, so nothing reaches
  # earned income (3.549(A)(2)(f)): (200 - 65) / 2 = 67.50 a month, or 810 a
  # year.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_head: true
      spouse:
        age: 52
        is_disabled: true
        meets_ssi_disability_criteria: true
        interest_income: 60
        employment_income: 2_400
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    co_state_supplement_countable_income: [0, 810]

- name: Case 4, a married client counts their own income plus income deemed from the spouse.
  # 3.549(H): own 300 - 10 = 290 plus the spouse's pension 400 - 10 = 390
  # (see co_state_supplement_deemed_income Case 2): 680/month, or 8,160/year.
  period: 2026
  input:
    people:
      head:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        social_security_disability: 3_600
        is_tax_unit_head: true
      spouse:
        age: 45
        pension_income: 4_800
        takes_up_medicaid_if_eligible: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    co_state_supplement_countable_income: [8_160, 0]
