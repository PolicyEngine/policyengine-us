- name: Case 1, ineligible senior over 60.
  period: 2023
  input:
    ssi: 1_200
    age: 60
    is_blind: true
    is_ssi_disabled: true
    state_code: CO
  output:
    co_state_supplement_eligible: false

- name: Case 2, not blind or disabled.
  period: 2023
  input:
    ssi: 1_200
    age: 30
    is_blind: false
    is_ssi_disabled: false
    state_code: CO
  output:
    co_state_supplement_eligible: false

- name: Case 3, not receiving SSI.
  period: 2023
  input:
    ssi: 0
    age: 19
    is_blind: true
    is_ssi_disabled: true
    state_code: CO
  output:
    co_state_supplement_eligible: false

