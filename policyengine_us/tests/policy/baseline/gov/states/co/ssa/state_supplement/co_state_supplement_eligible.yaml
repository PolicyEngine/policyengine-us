- name: Case 8, reported SSI receipt qualifies with zero computed SSI.
  period: 2026-01
  input:
    ssi: 0
    receives_ssi: true
    age: 40
    is_blind: false
    is_ssi_disabled: true
    state_code: CO
  output:
    co_state_supplement_eligible: true

- name: Case 9, both members of a disabled SSI couple are eligible.
  # 9 CCR 2503-5 3.546: AND-CS is for clients "receiving SSI due to a
  # disability or blindness"; 3.548(A): grants are "calculated on an
  # individual basis with just one client per case". Each spouse of a joint
  # SSI claim receives SSI, so each is an AND-CS client.
  period: 2026-01
  input:
    people:
      head:
        age: 50
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_head: true
      spouse:
        age: 52
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    co_state_supplement_eligible: [true, true]

- name: Case 10, a disabled spouse who fails the SSI citizenship condition is not eligible.
  # The tax-unit spouse is undocumented, so receives no SSI (8 USC 1611,
  # 1612) and is not an AND-CS client.
  period: 2026-01
  input:
    people:
      head:
        age: 50
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_head: true
      spouse:
        age: 52
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status_str: UNDOCUMENTED
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    people:
      spouse:
        ssi: 0
        co_state_supplement_eligible: false

- name: Case 11, a disabled adult above the SSI resource limit is not eligible.
  # $3,000 of countable resources exceeds the $2,000 SSI limit (20 CFR
  # 416.1205), so no SSI is paid and 3.547(D) bars AND-CS.
  period: 2026-01
  input:
    people:
      person:
        age: 45
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi_countable_resources: 3_000
    households:
      household:
        members: [person]
        state_code: CO
  output:
    ssi: 0
    co_state_supplement_eligible: false
