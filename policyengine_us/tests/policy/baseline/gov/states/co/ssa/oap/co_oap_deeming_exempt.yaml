- name: Case 1, a spouse on SSI within the OAP limit.
  # 9 CCR 2503-5 3.534(C): 400 + 600 = 1,000/month is within the $1,032 limit.
  # Each case's client is OAP-eligible with no income; the first output is
  # the client, who is not the spouse of an OAP-eligible client unless the
  # spouse is OAP-eligible too.
  period: 2026
  input:
    people:
      client:
        co_oap_eligible: true
        co_oap_own_countable_income: 0
        ssi: 0
        co_oap_medicaid_enrolled: false
      spouse:
        ssi: 4_800
        co_oap_own_countable_income: 7_200
        co_oap_eligible: false
        co_oap_medicaid_enrolled: false
    marital_units:
      marital_unit:
        members: [client, spouse]
    households:
      household:
        members: [client, spouse]
        state_code: CO
  output:
    co_oap_deeming_exempt: [false, true]

- name: Case 2, a spouse on SSI above the OAP limit.
  # 100 + 1,000 = 1,100/month exceeds the limit.
  period: 2026
  input:
    people:
      client:
        co_oap_eligible: true
        co_oap_own_countable_income: 0
        ssi: 0
        co_oap_medicaid_enrolled: false
      spouse:
        ssi: 1_200
        co_oap_own_countable_income: 12_000
        co_oap_eligible: false
        co_oap_medicaid_enrolled: false
    marital_units:
      marital_unit:
        members: [client, spouse]
    households:
      household:
        members: [client, spouse]
        state_code: CO
  output:
    co_oap_deeming_exempt: [false, false]

