- name: Case 5, a spouse who is an OAP client receives Adult Financial grant payments.
  # Own countable income of 1,031/month leaves a grant of 1, so the spouse
  # receives OAP with income within the limit. The client, married to an
  # OAP-eligible spouse and within the limit, is exempt too.
  period: 2026
  input:
    people:
      client:
        co_oap_eligible: true
        co_oap_own_countable_income: 0
        ssi: 0
        co_oap_medicaid_enrolled: false
      spouse:
        ssi: 0
        co_oap_own_countable_income: 12_372
        co_oap_eligible: true
        co_oap_medicaid_enrolled: false
    marital_units:
      marital_unit:
        members: [client, spouse]
    households:
      household:
        members: [client, spouse]
        state_code: CO
  output:
    co_oap_deeming_exempt: [true, true]

- name: Case 6, an OAP-eligible spouse with income equal to the standard receives no grant.
  # 3.533: income equal to the grant standard means denial, so the spouse is
  # not receiving Adult Financial grant payments.
  period: 2026
  input:
    people:
      client:
        co_oap_eligible: true
        co_oap_own_countable_income: 0
        ssi: 0
        co_oap_medicaid_enrolled: false
      spouse:
        ssi: 0
        co_oap_own_countable_income: 12_384
        co_oap_eligible: true
        co_oap_medicaid_enrolled: false
    marital_units:
      marital_unit:
        members: [client, spouse]
    households:
      household:
        members: [client, spouse]
        state_code: CO
  output:
    co_oap_deeming_exempt: [true, false]

