- name: Case 9, income a hair under the standard from float residue is not a grant.
  # Own countable income of 1,031.9999/month, the residue of 1,032 computed
  # from annual amounts, gives the OAP-eligible spouse no grant.
  period: 2026
  input:
    people:
      client:
        co_oap_eligible: true
        co_oap_own_countable_income: 0
        ssi: 0
        co_oap_medicaid_enrolled: false
      spouse:
        ssi: 0
        co_oap_own_countable_income: 12_383.9988
        co_oap_eligible: true
        co_oap_medicaid_enrolled: false
    marital_units:
      marital_unit:
        members: [client, spouse]
    households:
      household:
        members: [client, spouse]
        state_code: CO
  output:
    co_oap_deeming_exempt: [true, false]
