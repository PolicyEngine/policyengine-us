    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    ssi: [6_144, 6_144]
    co_state_supplement_countable_income: [5_724, 0]
    co_state_supplement: [156, 5_784]

