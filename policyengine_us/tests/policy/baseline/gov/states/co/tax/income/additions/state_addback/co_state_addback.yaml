# The worksheet starts from federal Schedule A line 5b, which holds only the
# filers' own real estate taxes; a dependent's 4_000 is not on it.
- name: A dependent's real estate taxes do not shrink the add-back of the filers' income tax
  period: 2022
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 3_000
      spouse:
        age: 43
      child:
        age: 15
        real_estate_taxes: 4_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        tax_unit_itemizes: true
        state_withheld_income_tax: 8_000
        salt_deduction: 10_000
        charitable_deduction: 40_000
        standard_deduction: 25_900
    households:
      household:
        members: [head, spouse, child]
        state_code: CO
  output:
    # Line 5d = 8_000 + 3_000 = 11_000 > line 5e 10_000, so line a is
    # 10_000 - 3_000 = 7_000; line d = 50_000 - 25_900 = 24_100.
    co_state_addback: 7_000
