- name: Tier 1 railroad benefits excluded from AGI count as social security benefits.
  absolute_error_margin: 0.01
  period: 2024
  input:
    age: 70
    state_code: CO
    employment_income: 30_000
    railroad_social_security_equivalent_benefits: 10_000
    taxable_railroad_pension_benefits: 3_000
    tax_exempt_railroad_pension_benefits: 2_000
  output:
    # AGI: 30,000 + 7,900 taxable of the 10,000 + 3,000 = 40,900.
    # Add the 2,100 of tier 1 outside AGI. C.R.S. 39-22-2003 does not name
    # the exempt part of a pension.
    co_modified_agi: 43_000
