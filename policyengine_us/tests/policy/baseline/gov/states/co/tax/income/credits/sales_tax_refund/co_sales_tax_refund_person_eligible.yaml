- name: Head below age threshold but with employment income -> eligible
  period: 2022
  input:
    people:
      head:
        age: 10
        is_tax_unit_head: true
        irs_employment_income: 5_000
    tax_units:
      tax_unit:
        members: [head]
        co_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [head]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: true

# Head with NO earnings but positive tax-unit CO income tax before non-refundable
# credits -> eligible via the age-independent tax-liability path
# (C.R.S. 39-22-2003(1)(a)(I)).
- name: Head no earnings but positive unit income tax -> eligible
  period: 2022
  input:
    people:
      head:
        age: 17
        is_tax_unit_head: true
        irs_employment_income: 0
    tax_units:
      tax_unit:
        members: [head]
        co_income_tax_before_non_refundable_credits: 500
    households:
      household:
        members: [head]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: true

# Under-18 non-earning spouse in a JOINT unit with positive CO tax liability is
# eligible: the tax-liability qualifier in (1)(a)(I) is age-independent and
# co_income_tax_before_non_refundable_credits is a tax-unit-level value, so it
# qualifies both filers (documented limitation - cannot be split per spouse).
- name: Under-18 non-earning spouse in joint unit with CO tax -> eligible
  period: 2022
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        irs_employment_income: 50_000
      spouse:
        age: 16
        is_tax_unit_spouse: true
        irs_employment_income: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        co_income_tax_before_non_refundable_credits: 500
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: [true, true]

# Age boundary: C.R.S. 39-22-2003(1)(a)(II) requires age 18 as of December 31
# of the preceding taxable year. Born in 2004, this filer reaches 18 in 2022, the
# taxable year, and was 17 on December 31, 2021.
- name: Head turning 18 during the year -> ineligible
  period: 2022
  input:
    people:
      head:
        age: 18
        is_tax_unit_head: true
        irs_employment_income: 0
    tax_units:
      tax_unit:
        members: [head]
        co_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [head]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: false

# Born in 2003, this filer was 18 on December 31, 2021.
- name: Head 18 at the end of the preceding year -> eligible
  period: 2022
  input:
    people:
      head:
        age: 19
        is_tax_unit_head: true
        irs_employment_income: 0
    tax_units:
      tax_unit:
        members: [head]
        co_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [head]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: true

# The 2015 Form 104 line 46 test: "born before 1997".
- name: 2015 head born in 1997 -> ineligible
  period: 2015
  input:
    people:
      head:
        age: 18
        is_tax_unit_head: true
        irs_employment_income: 0
    tax_units:
      tax_unit:
        members: [head]
        co_income_tax_before_non_refundable_credits: 0
    households:
      household:
        members: [head]
        state_code: CO
  output:
    co_sales_tax_refund_person_eligible: false

- name: 2015 head born in 1996 -> eligible
  period: 2015
  input:
    people:
      head:
        age: 19
        is_tax_unit_head: true
        irs_employment_income: 0
    tax_units:
