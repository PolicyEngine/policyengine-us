- name: Default co_other_subtractions is zero
  period: 2024
  input:
    state_code: CO
    taxable_income: 30_000
  output:
    co_other_subtractions: 0
    co_subtractions: 0
    co_taxable_income: 30_000

- name: co_other_subtractions reduces CO taxable income
  period: 2024
  input:
    state_code: CO
    taxable_income: 30_000
    co_other_subtractions: 2_000
  output:
    co_other_subtractions: 2_000
    co_subtractions: 2_000
    co_taxable_income: 28_000
