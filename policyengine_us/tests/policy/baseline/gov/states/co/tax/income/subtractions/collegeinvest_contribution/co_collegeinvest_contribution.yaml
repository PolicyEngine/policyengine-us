  period: 2022
  input:
    investment_in_529_plan: 25_000
    filing_status: SINGLE
    state_code: CO
  output:
    co_collegeinvest_subtraction: 20_000
    # above capped amount

- name: Case 2, File single, invest below capped amount 
  period: 2022
  input:
    investment_in_529_plan: 15_000
    filing_status: SINGLE
    state_code: CO
  output:
    co_collegeinvest_subtraction: 15_000
