# Rule 39-22-104(3)(p), paragraph (3) (2022), Rule 39-22-104(3)(p.5),
# paragraph (3)(a)(i), and the DR 0104 line 4 instructions (2023 to 2025): the
# addback is reduced by the Schedule A state income tax already added back on
# DR 0104 line 2. The same reduction carries to 2026.
- name: Case 36, 2025 single itemizer, addback reduced by the state income tax addback.
  period: 2025
  input:
    state_code: CO
    co_federal_deduction_addback_required: true
    filing_status: SINGLE
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 20_000
    co_state_addback: 5_000
  output:
    # 20,000 - 12,000 - 5,000
    co_federal_deduction_addback: 3_000

- name: Case 37, 2025 joint itemizer, state income tax addback above the excess leaves no addback.
  period: 2025
  input:
    state_code: CO
    co_federal_deduction_addback_required: true
    filing_status: JOINT
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 30_000
    co_state_addback: 20_000
  output:
    # max(0, 30,000 - 16,000 - 20,000)
    co_federal_deduction_addback: 0

- name: Case 38, 2022 single itemizer, addback reduced by the state income tax addback.
  period: 2022
  input:
    state_code: CO
    co_federal_deduction_addback_required: true
    filing_status: SINGLE
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 40_000
    co_state_addback: 4_000
  output:
    # 40,000 - 30,000 - 4,000
    co_federal_deduction_addback: 6_000

- name: Case 39, 2026 single itemizer, addback reduced by the state income tax addback.
  period: 2026
  input:
    state_code: CO
    co_federal_deduction_addback_required: true
    filing_status: SINGLE
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 20_000
    co_state_addback: 5_000
  output:
    # 20,000 - 1,000 - 5,000
    co_federal_deduction_addback: 14_000

- name: Case 40, 2022 single itemizer, computed state income tax addback above the excess leaves no addback.
  period: 2022
  input:
    people:
      head:
        age: 45
        employment_income: 450_000
        real_estate_taxes: 2_000
        deductible_mortgage_interest: 25_000
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 8_000
    households:
      household:
        members: [head]
        state_code: CO
  output:
    # SALT min(8,000 + 2,000, 10,000) + mortgage interest 25,000
    itemized_taxable_income_deductions: 35_000
    # min(8,000 state income tax, 35,000 - 12,950 standard deduction)
    co_state_addback: 8_000
    # max(0, 35,000 - 30,000 - 8,000)
    co_federal_deduction_addback: 0

- name: Case 41, 2025 single filer claiming the standard deduction with state withholding has no state income tax addback to subtract.
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 450_000
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 20_000
        tax_unit_itemizes: false
    households:
      household:
        members: [head]
        state_code: CO
  output:
    standard_deduction: 15_750
    # Only an itemizer adds back state income tax on DR 0104 line 2.
    co_state_addback: 0
    # 15,750 - 12,000
    co_federal_deduction_addback: 3_750

- name: Case 42, 2026 single filer whose section 68 limitation makes the standard deduction larger has no state income tax addback to subtract.
  period: 2026
  input:
    people:
      head:
        age: 45
        employment_income: 1_000_000
        deductible_mortgage_interest: 6_500
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 10_000
    households:
      household:
        members: [head]
        state_code: CO
  output:
    # SALT 10,000 + mortgage interest 6,500 = 16,500 before the limitation,
    # above the 16,100 standard deduction; the limitation leaves 15,608, so
    # the unit takes the standard deduction.
    tax_unit_itemizes: false
    co_state_addback: 0
    # 16,100 - 1,000
    co_federal_deduction_addback: 15_100
