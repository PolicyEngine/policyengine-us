- name: co_low_income_cdcc unit test 5
  # a disabled adult in the couple is a CDCC qualifying individual but does
  # not dilute the children's share of childcare expenses
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 35
        is_incapable_of_self_care: true
      spouse:
        age: 43
      child_1:
        age: 5
    tax_units:
      tax_unit:
        members: [head, spouse, child_1]
        min_head_spouse_earned: 5_000
        tax_unit_childcare_expenses: 1_600
        co_low_income_cdcc_eligible: true
    households:
      household:
        state_code: CO
        members: [head, spouse, child_1]
  output:
    # All $1,600 of childcare expenses belong to the only child:
    # min(500, 0.25 x min(1_600, 5_000)) = 400
    co_low_income_cdcc: 400

# C.R.S. 39-22-119.5: the low-income credit is repealed for tax years
# beginning on or after January 1, 2026. A filer who would otherwise qualify
# (low income, no federal credit) receives nothing in 2026.
- name: In 2025, a low-income filer with no federal credit receives the credit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 12_000
      spouse:
        age: 34
        employment_income: 12_000
      child_1:
        age: 5
    tax_units:
      tax_unit:
        members: [head, spouse, child_1]
        tax_unit_childcare_expenses: 2_000
    households:
      household:
        state_code: CO
        members: [head, spouse, child_1]
  output:
    # min(500, 0.25 x min(2_000, 12_000)) = 500
    co_low_income_cdcc: 500

- name: In 2026, the same filer receives nothing because the credit is repealed.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 12_000
      spouse:
        age: 34
        employment_income: 12_000
      child_1:
        age: 5
    tax_units:
      tax_unit:
        members: [head, spouse, child_1]
        tax_unit_childcare_expenses: 2_000
    households:
      household:
        state_code: CO
        members: [head, spouse, child_1]
  output:
    co_low_income_cdcc: 0


- name: 2025 single filer who can be claimed as a dependent, no Colorado low-income child care credit
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [filer, child]
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [filer, child]
        state_code: CO
  output:
    # Only the federal liability condition is waived; the child must
    # still be the taxpayer's dependent under 13 (IRC 152(b)(1)).
    co_low_income_cdcc: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no Colorado low-income child care credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 25
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 25
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        tax_unit_childcare_expenses: 1_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: CO
