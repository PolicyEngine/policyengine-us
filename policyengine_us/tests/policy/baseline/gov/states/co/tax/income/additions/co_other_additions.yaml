- name: Case 1, default co_other_additions is zero
  period: 2024
  input:
    state_code: CO
    taxable_income: 30_000
  output:
    co_other_additions: 0
    co_additions: 0
    co_taxable_income: 30_000

- name: Case 2, co_other_additions increases CO taxable income
  period: 2024
  input:
    state_code: CO
    taxable_income: 30_000
    co_other_additions: 1_200
  output:
    co_other_additions: 1_200
    co_additions: 1_200
    co_taxable_income: 31_200

