- name: 2025 single filer who can be claimed as a dependent, no Colorado child tax credit
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: CO
  output:
    # The child must meet the federal child tax credit's requirements,
    # so be the taxpayer's dependent; a return with a claimable filer has
    # no dependents (IRC 152(b)(1)).
    co_ctc: 0
    co_ctc_eligible_children_count: 0

