- name: Colorado EITC under-25 path - age 25 above max for under-25 expansion but qualifies via federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 25
        employment_income: 10_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: CO
  output:
    # At age 25, the under-25 expansion no longer applies, but the federal
    # EITC childless minimum age is also 25, so the filer qualifies for the
    # standard 50% Colorado match of the federal EITC.
    co_eitc: 324.5

