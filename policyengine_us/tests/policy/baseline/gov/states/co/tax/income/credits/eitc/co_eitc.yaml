- name: 2025 single filer who can be claimed as a dependent keeps the Colorado EITC for a qualifying child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 20
        employment_income: 10_000
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
    spm_units:
      spm_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: CO
  output:
    # The dependency bar applies only without a qualifying child:
    # 0.34 x 10,000 = 3,400 federal EITC x 50% = 1,700.
    co_eitc: 1_700
