- name: Colorado EITC counts a disabled adult dependent as a qualifying child (IRC 152(c)(3)(B))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_adult:
        age: 29
        is_tax_unit_dependent: true
        is_permanently_and_totally_disabled: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_adult]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_adult]
    households:
      household:
        members: [head, disabled_adult]
        state_code: CO
  output:
    # The permanently and totally disabled adult dependent is a qualifying
    # child under IRC 152(c)(3)(B), so the CO EITC pays its match on the
    # 1-child federal-style EITC rather than the childless amount.
    co_eitc: 1_700

- name: Colorado EITC uses the childless schedule for a disabled parent dependent (IRC 152(c)(2))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_parent:
        age: 75
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        is_parent_of_filer_or_spouse: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_parent]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_parent]
    households:
      household:
        members: [head, disabled_parent]
        state_code: CO
  output:
    # A parent fails the IRC 152(c)(2) relationship test, so the federal
    # credit is the childless 7.65% x 10,000 capped at 649; 50% x 649.
    eitc_child_count: 0
    co_eitc: 324.5


- name: 2025 single filer who can be claimed as a dependent, no Colorado EITC without a qualifying child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    spm_units:
      spm_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: CO
  output:
    # The ITIN and under-25 routes waive identification and age rules
    # only; IRC 32(c)(1)(A)(ii)(III) still bars a childless filer who can
    # be claimed, and on a joint return either spouse (Publication 596).
    co_eitc: 0

