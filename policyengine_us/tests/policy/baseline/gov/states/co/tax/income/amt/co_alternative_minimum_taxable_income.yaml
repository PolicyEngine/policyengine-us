# Colorado alternative minimum taxable income tests
- name: CO AMTI calculation
  period: 2024
  input:
    amt_income_less_exemptions: 200_000
    co_additions: 10_000
    co_subtractions: 5_000
    state_code: CO
  output:
    # 200,000 + 10,000 - 5,000 = 205,000
    co_alternative_minimum_taxable_income: 205_000

- name: CO AMTI with no federal AMT income
  period: 2024
  input:
    # Form 6251 line 4 equals the line 5 exemption, so line 6 and DR 0104AMT
    # line 1 are zero. A line 4 below line 5 would enter as a negative amount.
    amt_income: 85_700
    amt_exemption: 85_700
    amt_income_less_exemptions: 0
    co_additions: 10_000
    co_subtractions: 5_000
    state_code: CO
  output:
    # 0 + 10,000 - 5,000 = 5,000
    co_alternative_minimum_taxable_income: 5_000

- name: CO AMTI cannot be negative
  period: 2024
  input:
    amt_income_less_exemptions: 0
    co_additions: 0
    co_subtractions: 50_000
    state_code: CO
  output:
    # max(0, 0 + 0 - 50,000) = 0
    co_alternative_minimum_taxable_income: 0

# DR 0104AMT (2025): line 2 sums DR 0104 lines 3 through 7 and 9, leaving out
# the state income tax addback on line 2; line 4 sums the DR 0104AD
# subtractions excluding the state income tax refund on line 1.
- name: CO AMTI leaves out the state income tax addback and the refund subtraction
  period: 2025
  input:
    amt_income_less_exemptions: 200_000
    co_additions: 10_000
    co_state_addback: 6_000
    co_subtractions: 5_000
    salt_refund_income: 1_500
    state_code: CO
  output:
    # 200,000 + (10,000 - 6,000) - (5,000 - 1,500)
    co_alternative_minimum_taxable_income: 200_500

# DR 0104AMT line 4 takes the DR 0104AD subtractions without the refund; it
# cannot go below zero, so the refund never adds to Colorado AMTI.
- name: CO AMTI line 4 without the refund does not go below zero
  period: 2025
  input:
    amt_income_less_exemptions: 200_000
    co_additions: 0
    co_state_addback: 0
    co_subtractions: 500
    salt_refund_income: 1_500
    state_code: CO
  output:
    # 200,000 + 0 - max(0, 500 - 1,500)
    co_alternative_minimum_taxable_income: 200_000

# DR 0104AMT line 1: "If line 5 on form 6251 is larger than line 4 on form
# 6251, subtract line 5 from line 4 and enter the resulting negative amount
# here." C.R.S. 39-22-105(2)(a) has no floor before the modifications.
- name: A negative DR 0104AMT line 1 offsets Colorado additions
  period: 2025
  input:
    people:
      person1:
        age: 40
        salt_refund_income: 15_000
    tax_units:
      tax_unit:
        members: [person1]
        # Non-Colorado municipal bond interest (DR 0104 line 9).
        co_other_additions: 15_000
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    # Federal: AGI 15,000; line 1b 15,000 - 15,750 = -750; line 2a 15,750;
    # line 2b -15,000; line 4 = 0. Line 5 exemption 88,100.
    amt_income: 0
    # Line 1: 0 - 88,100. Line 2: 15,000. Line 4: 15,000 - 15,000 refund.
    # Line 5: -88,100 + 15,000 - 0 < 0.
    co_alternative_minimum_taxable_income: 0
    co_amt: 0

# End to end from wages. C.R.S. 39-22-105(2)(a): federal alternative minimum
# taxable income less the exemption, with the 39-22-104 modifications.
# DR 0104AMT line 2 takes DR 0104 lines 3 through 7 and 9, so it carries the
# line 4 addback of federal deductions but not the line 2 state income tax
# addback. Sales taxes are zero, so the SALT deduction is the 5,000 of state
# income tax withheld plus the 5,000 of real estate tax. DR 0104AMT also says
# not to enter on line 2 "any amount ... that duplicates any income or
# adjustment made in arriving at federal alternative minimum taxable income".
# These cases keep the whole line 4 addback; if the 5,000 of real estate tax in
# it counts as a duplicate of Form 6251 line 2a, line 5 is 5,000 lower.
- name: Colorado AMTI for a 2025 single itemizer with $450,000 of wages
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 450_000
        real_estate_taxes: 5_000
        home_mortgage_interest: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_itemizes: true
        state_withheld_income_tax: 5_000
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    # Itemized deductions 10,000 SALT + 20,000 mortgage interest = 30,000, so
    # taxable income is 450,000 - 30,000 = 420,000. Form 6251 line 2a adds
    # back the 10,000 of taxes: line 4 is 430,000, and line 6 is
    # 430,000 - 88,100 = 341,900.
    taxable_income: 420_000
    amt_income: 430_000
    amt_income_less_exemptions: 341_900
    # DR 0104 line 2 (39-22-104(3)(d)(I)): min(5,000, 30,000 - 15,750) = 5,000.
    # Line 4 (39-22-104(3)(p.5)(I)(A)): 30,000 - 12,000 = 18,000, less the
    # 5,000 line 2 addback = 13,000.
    co_state_addback: 5_000
    co_federal_deduction_addback: 13_000
    # DR 0104AMT line 1 341,900 + line 2 13,000 - line 4 0.
    co_alternative_minimum_taxable_income: 354_900

- name: Colorado AMTI for a 2026 single itemizer with $450,000 of wages
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income: 450_000
        real_estate_taxes: 5_000
        home_mortgage_interest: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_itemizes: true
        state_withheld_income_tax: 5_000
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    # Taxable income 420,000, with no section 68 reduction: 420,000 + 30,000 is
    # below the 640,600 at which the 37% bracket starts. Line 4 is 430,000,
    # and line 6 is 430,000 - 90,100 = 339,900 (Rev. Proc. 2025-32).
    itemized_taxable_income_deductions_reduction: 0
    taxable_income: 420_000
    amt_income: 430_000
    amt_income_less_exemptions: 339_900
    # DR 0104 line 2: min(5,000, 30,000 - 16,100) = 5,000. Line 4
    # (39-22-104(3)(p.7)(I)(A)): 30,000 - 1,000 = 29,000, less the 5,000
    # line 2 addback = 24,000.
    co_state_addback: 5_000
    co_federal_deduction_addback: 24_000
    # DR 0104AMT line 1 339,900 + line 2 24,000 - line 4 0.
    co_alternative_minimum_taxable_income: 363_900
