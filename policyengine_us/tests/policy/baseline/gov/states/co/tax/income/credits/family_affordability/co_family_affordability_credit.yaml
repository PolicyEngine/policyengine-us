- name: 2025 single filer who can be claimed as a dependent, no Colorado family affordability credit
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: CO
  output:
    # The child must be the taxpayer's dependent (IRC 152(b)(1)).
    co_family_affordability_credit: [0, 0]

- name: 2025 joint return with one spouse who can be claimed as a dependent, no Colorado family affordability credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 25
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 25
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: CO
  output:
    co_family_affordability_credit: [0, 0, 0]

