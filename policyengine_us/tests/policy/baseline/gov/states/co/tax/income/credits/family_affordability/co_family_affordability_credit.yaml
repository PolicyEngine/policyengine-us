- name: 2025 claimable but unclaimed filer keeps child and family credits for an age-four qualifying child
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 10_000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: false
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: CO
  output:
    co_ctc: 1_200
    co_ctc_eligible_children_count: 1
    co_family_affordability_credit: [0, 3_273]
