- name: Limiting smaller
  period: 2022
  input:
    state_code: CO
    co_federal_ctc_maximum: 1_000
    ctc_tax_liability_after_preceding_credits: 999
  output:
    co_non_refundable_ctc: 999

- name: Maximum smaller
  period: 2022
  input:
    state_code: CO
    co_federal_ctc_maximum: 998
    ctc_tax_liability_after_preceding_credits: 1_000
  output:
    co_non_refundable_ctc: 998

- name: The Colorado replica does not subtract the residential clean energy credit.
  # 2022 DR 0104CN lines 4 - 6 reproduce Schedule 8812 Credit Limit Worksheet A,
  # lines 1 - 3, without Credit Limit Worksheet B.
  period: 2022
  input:
    state_code: CO
    co_federal_ctc_maximum: 2_000
    ctc_tax_liability_after_preceding_credits: 1_500
    ctc_credit_limit_worksheet_b_applies: true
    residential_clean_energy_credit: 1_000
  output:
    ctc_limiting_tax_liability: 500
    co_non_refundable_ctc: 1_500

- name: From 2023 the Colorado limit is Schedule 8812 line 13, after Credit Limit Worksheet B.
  # 2023 DR 0104CN line 4: "If you completed Federal Schedule 8812, enter the
  # amount from line 13 of that form."
  period: 2023
  input:
    state_code: CO
    co_federal_ctc_maximum: 2_000
    ctc_tax_liability_after_preceding_credits: 1_500
    ctc_credit_limit_worksheet_b_applies: true
    residential_clean_energy_credit: 1_000
  output:
    ctc_limiting_tax_liability: 500
    co_non_refundable_ctc: 500
