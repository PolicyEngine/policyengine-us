# Source-derived FY 2026 Colorado regular heating checks.
# Heating-cost methodology and annual dwelling tables, PDF pages1,5-6: https://liheapch.acf.gov/docs/2026/benefits-matricies/CO_BenefitMatrix_Heat-Crisis_2026.pdf#page=1
# Actual electricity instruction, PDF page94: https://drive.google.com/file/d/1G3XKsXyKoPZmsA5-P6NI6w3svP99xOZd/view#page=94

# A 1,000 direct electric bill uses shares 62%,62%,48%,48%,43%,43%,43%,43%,50%; no extra half-year division.
- name: "Case 1, actual electric bills receive all nine dwelling-specific heating shares."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY", "ELECTRICITY"]
    pre_subsidy_electricity_expense: [1_000, 1_000, 1_000, 1_000, 1_000, 1_000, 1_000, 1_000, 1_000]
    co_leap_dwelling_type: ["HOUSE_MODULAR", "MOBILE_HOME", "DUPLEX_TRIPLEX_FOURPLEX", "TOWNHOUSE", "APARTMENT_CONDO", "HOTEL_MOTEL", "CABIN", "TINY_HOME", "CAMPER_RV"]
  output:
    co_leap_heating_cost: [620, 620, 480, 480, 430, 430, 430, 430, 500]

# Read the independent heat-in-rent table in dwelling order house, mobile, duplex, townhouse, apartment, hotel, cabin, tiny home, RV.
