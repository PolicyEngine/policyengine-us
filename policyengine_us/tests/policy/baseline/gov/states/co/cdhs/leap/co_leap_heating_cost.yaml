# Each household reports 600 for its matching primary fuel; seasonal-cost proxy=600 directly, not annual 600/2. OTHER has an actual-bill route without an invented rent table.
- name: "Case 9, positive actual costs use each primary non-electric fuel bill."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "PROPANE", "FUEL_OIL", "KEROSENE", "WOOD", "COAL", "OTHER"]
    gas_expense: [600, 0, 0, 0, 0, 0, 0]
    other_heating_fuel_expense: [0, 0, 0, 0, 0, 0, 600]
    wood_expense: [0, 0, 0, 0, 600, 0, 0]
    fuel_oil_expense: [0, 0, 600, 600, 0, 0, 0]
    bottled_gas_expense: [0, 600, 0, 0, 0, 0, 0]
    coal_expense: [0, 0, 0, 0, 0, 600, 0]
  output:
    co_leap_heating_cost: [600, 600, 600, 600, 600, 600, 600]

# Ordinary zero defaults cannot distinguish missing records from no expense. Explicit zero has no inferred flat-rate award; negative bills are bounded at zero.
- name: "Case 10, zero and negative direct bills never trigger missing-history flat rates."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS", "UNSPECIFIED"]
    gas_expense: [0, -100, 0]
  output:
    co_leap_heating_cost: [0, 0, 0]

# The published rent table has no NONE, unspecified, solar or other-fuel column; these zeros describe unsupported input classifications, not sourced legal exclusions.
- name: "Case 11, unsupported heat-in-rent fuel classifications do not borrow a table."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO"]
    heating_type: ["NONE", "UNSPECIFIED", "SOLAR", "OTHER"]
    heat_expense_included_in_rent: [true, true, true, true]
  output:
    co_leap_heating_cost: [0, 0, 0, 0]
