# Neither nonqualified adult contributes a qualifying member.
- name: "Case 3, no qualified household member gives a zero counted size."
  period: 2026
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        immigration_status: "UNDOCUMENTED"
      person2:
        age: 35
        ssi: 0
        co_oap: 0
        immigration_status: "DACA"
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_household_size: 0
