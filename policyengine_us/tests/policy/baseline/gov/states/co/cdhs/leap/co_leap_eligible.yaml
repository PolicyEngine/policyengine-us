# No heat, unknown separate fuel and zero bills are unsupported. Positive gas and unsubsidized heat-in-rent qualify. Subsidized bundled heat and no qualified member fail. Electric heat-in-rent needs no separate bill.
- name: "Case 2, heating responsibility housing support and qualified membership gate eligibility."
  period: 2026
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["NONE", "UNSPECIFIED", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "ELECTRICITY"]
    co_leap_household_size: [1, 1, 1, 1, 1, 1, 0, 1]
    co_leap_countable_income: [0, 0, 0, 0, 0, 0, 0, 0]
    gas_expense: [600, 600, 0, 600, 0, 0, 600, 0]
    heat_expense_included_in_rent: [false, false, false, false, true, true, false, true]
    receives_housing_assistance: [false, false, false, false, false, true, false, false]
  output:
    co_leap_eligible: [false, false, false, true, true, false, false, true]

# Both rows exceed the 43,284 annual size 1 ceiling despite categorical-program receipt.
- name: "Case 3, SNAP and SSI do not bypass the income ceiling."
  period: 2026
  input:
    state_code: ["CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS"]
    co_leap_household_size: [1, 1]
    co_leap_countable_income: [50_000, 50_000]
    gas_expense: [600, 600]
    snap: [6_000, 0]
    ssi: [0, 12_000]
  output:
    co_leap_eligible: [false, false]
