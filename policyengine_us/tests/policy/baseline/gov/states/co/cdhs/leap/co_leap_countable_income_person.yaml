# Source-derived FY 2026 Colorado regular heating checks.
# Income and exemptions, PDF pages6-7,46-51,55-57: https://drive.google.com/file/d/1G3XKsXyKoPZmsA5-P6NI6w3svP99xOZd/view#page=6,7,46,47,48,49,50,51,55,56,57

# Adult gross wages 1,000 + net nonfarm 2,000 + SSTB 3,000 + farm 4,000 + partnership 5,000 + S-corp 6,000 =21,000. No second business-expense deduction.
- name: "Case 1, adult wages and independent business streams count once."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        employment_income: 1_000
        self_employment_income: 2_000
        sstb_self_employment_income: 3_000
        farm_operations_income: 4_000
        partnership_income: 5_000
        s_corp_income: 6_000
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: 21_000
    co_leap_countable_income: 21_000

# Rent 3,000 + interest 150 + dividends 300 + UI 400 + strike 500 + pension 3,000 + non-SSA survivors 600 + disability 700 + workers 800 + VA 900 + GA 100 + OAP 200 + alimony 300 + child support 400 + family help 500 + retirement distributions 1,300 =13150.
# Pension survivor 900 and military 800 classify portions already reported within the 3,000 pension; they are not extra receipts.
- name: "Case 2, unearned sources and retirement aggregates count without pension classification duplication."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 200
        rental_income: 1_200
        farm_rent_income: 1_800
        taxable_interest_income: 100
        tax_exempt_interest_income: 50
        dividend_income: 300
        unemployment_compensation: 400
        strike_benefits: 500
        taxable_pension_income: 1_000
        tax_exempt_pension_income: 2_000
        pension_survivors: 900
        military_retirement_pay: 800
        survivor_benefits: 600
        disability_benefits: 700
        workers_compensation: 800
        veterans_benefits: 900
        general_assistance: 100
        alimony_income: 300
        child_support_received: 400
        financial_assistance: 500
        taxable_ira_distributions: 600
        tax_exempt_401k_distributions: 700
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: 13_150
    co_leap_countable_income: 13_150

# Annual SSA survivors 12,011.88 =1,000.99/month; annual SSI 2,411.88 =200.99/month. Drop cents separately: (1,000+200)*12 =14,400. SSA survivors already enter the SSA aggregate.
- name: "Case 3, Social Security and SSI cents are discarded separately per monthly receipt."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 2411.88
        co_oap: 0
        social_security_survivors: 12011.88
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: 14_400
    co_leap_countable_income: 14_400

# Separate recipients receive 1,000.99 and 500.99/month; (1,000+500)*12=18,000. Pooling before truncation would incorrectly count 18,012.
- name: "Case 4, rounding is per recipient rather than after pooling Social Security."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        ssi: 0
        co_oap: 0
        social_security_retirement: 12011.88
      person2:
        age: 67
        ssi: 0
        co_oap: 0
        social_security_retirement: 6011.88
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: [12_000, 6_000]
    co_leap_countable_income: 18_000

# Dependent child lives with parent. At age 17, count 0 wages plus 1,200 SSA survivors and 600 support; parent wages 12,000 count.
- name: "Case 5, minor earnings exclusion applies at seventeen."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi: 0
        co_oap: 0
        employment_income: 12_000
      person2:
        age: 17
        ssi: 0
        co_oap: 0
        employment_income: 6_000
        social_security_survivors: 1_200
        child_support_received: 600
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: [12_000, 1_800]
    co_leap_countable_income: 13_800

# Dependent child lives with parent. At age 18, count 6000 wages plus 1,200 SSA survivors and 600 support; parent wages 12,000 count.
- name: "Case 6, minor earnings exclusion ends at eighteen."
  period: 2026
