# The foster member is outside the LEAP household. Neither their wages nor SSA receipt increases household income.
- name: "Case 7, known foster member earnings and unearned receipts are excluded."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi: 0
        co_oap: 0
        employment_income: 12_000
      person2:
        age: 16
        ssi: 0
        co_oap: 0
        employment_income: 6_000
        social_security_survivors: 2_400
        is_in_foster_care:
          2026-01: true
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: [12_000, 0]
    co_leap_countable_income: 12_000
    co_leap_household_size: 1

# The scoped nonnegative-source convention retains 12,000 wages when a business reports a loss. It cannot turn the benefit contribution negative.
- name: "Case 8, negative net business source does not offset positive wages."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        employment_income: 12_000
        self_employment_income: -50_000
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: 12_000
    co_leap_countable_income: 12_000

# All 12,000 parent income remains even though only the citizen child enters qualified size.
- name: "Case 9, nonqualified parent income remains counted."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        immigration_status: "UNDOCUMENTED"
        employment_income: 12_000
      person2:
        age: 8
        ssi: 0
        co_oap: 0
        immigration_status: "CITIZEN"
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: [12_000, 0]
    co_leap_countable_income: 12_000
    co_leap_household_size: 1

# Review C3: the plan's lottery inclusion and manual prize category are
# unearned income, including a child's receipts. Foster-member income remains
# excluded by the separate household rule. No monthly-to-annual double count.
- name: Lottery annuity receipts count for adults and children but not foster members.
  period: 2026
  input:
    people:
      adult:
        age: 35
        gambling_winnings: 2_400
        ssi: 0
        co_oap: 0
      child:
        age: 17
        gambling_winnings: 1_200
        ssi: 0
        co_oap: 0
      foster_child:
        age: 16
        gambling_winnings: 1_200
        is_in_foster_care: true
        ssi: 0
        co_oap: 0
    spm_units:
      family:
        members: [adult, child, foster_child]
        co_tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [adult, child, foster_child]
        state_code: CO
  output:
    co_leap_countable_income_person: [2_400, 1_200, 0]
