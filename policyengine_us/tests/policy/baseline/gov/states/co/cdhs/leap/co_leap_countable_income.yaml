# Source-derived FY 2026 Colorado regular heating checks.
# Public assistance and exclusions, PDF pages47,50-51: https://drive.google.com/file/d/1G3XKsXyKoPZmsA5-P6NI6w3svP99xOZd/view#page=47

# Annual TANF 3,600 =300/month for the unit. Count wages 12,000 + TANF 3,600 =15,600 once, not once for each member.
- name: "Case 1, Colorado TANF counts once for a parent and two children."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        employment_income: 12_000
      person2:
        age: 8
        ssi: 0
        co_oap: 0
      person3:
        age: 5
        ssi: 0
        co_oap: 0
    spm_units:
      spm_unit:
        members: ["person1", "person2", "person3"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 3_600
    tax_units:
      tax_unit:
        members: ["person1", "person2", "person3"]
    households:
      household:
        members: ["person1", "person2", "person3"]
        state_code: "CO"
  output:
    co_leap_countable_income_person: [12_000, 0, 0]
    co_leap_countable_income: 15_600

# SNAP 6,000 is noncash assistance; only 12,000 wages count.
- name: "Case 2, SNAP is excluded from gross cash income."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 600
        co_tanf: 0
        snap: 6_000
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_countable_income: 12_000
