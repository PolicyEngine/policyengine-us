# Source-derived FY 2026 Colorado regular heating checks.
# Benefit methodology and rates, PDF pages1-2,5-6: https://liheapch.acf.gov/docs/2026/benefits-matricies/CO_BenefitMatrix_Heat-Crisis_2026.pdf#page=1,2,5,6
# Current statewide reduction and calculation order, PDF pages92-95: https://drive.google.com/file/d/1G3XKsXyKoPZmsA5-P6NI6w3svP99xOZd/view#page=92,93,94,95
# Eligibility, PDF pages5,8: https://liheapch.acf.gov/docs/2026/state-plans/CO_Plan_2026.pdf#page=5,8

# Zero bill is ineligible. For positive costs clip(cost,200,1000): 1 and 199.99 receive 200;600 receives 600;1,000.01 and 5,000 receive 1,000. No expense cap removes the minimum.
- name: "Case 1, positive direct heating awards retain the minimum maximum and actual cost proxy."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS"]
    age: [35, 35, 35, 35, 35, 35, 35, 35]
    ssi: [0, 0, 0, 0, 0, 0, 0, 0]
    co_oap: [0, 0, 0, 0, 0, 0, 0, 0]
    co_tanf: [0, 0, 0, 0, 0, 0, 0, 0]
    gas_expense: [0, 1, 199.99, 200, 600, 1_000, 1000.01, 5_000]
  output:
    co_leap_household_size: [1, 1, 1, 1, 1, 1, 1, 1]
    co_leap_countable_income_person: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_countable_income: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_income_limit: [43_284, 43_284, 43_284, 43_284, 43_284, 43_284, 43_284, 43_284]
    co_leap_income_contribution_rate: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_heating_cost: [0, 1, 199.99, 200, 600, 1_000, 1000.01, 5_000]
    co_leap_eligible: [false, true, true, true, true, true, true, true]
    co_leap: [0, 200, 200, 200, 600, 1_000, 1_000, 1_000]

# Monthly wages at 978,1,630 and 2,282 retain the lower rate; +0.01/month moves up. Award=1,000*(1-contribution), with FY 2026 statewide adjustment 0%.
- name: "Case 2, all contribution boundary steps flow through the final award."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS"]
    age: [35, 35, 35, 35, 35, 35]
    ssi: [0, 0, 0, 0, 0, 0]
    co_oap: [0, 0, 0, 0, 0, 0]
    co_tanf: [0, 0, 0, 0, 0, 0]
    employment_income: [11_736, 11736.12, 19_560, 19560.12, 27_384, 27384.12]
    gas_expense: [1_000, 1_000, 1_000, 1_000, 1_000, 1_000]
  output:
    co_leap_household_size: [1, 1, 1, 1, 1, 1]
    co_leap_countable_income_person: [11_736, 11736.12, 19_560, 19560.12, 27_384, 27384.12]
    co_leap_countable_income: [11_736, 11736.12, 19_560, 19560.12, 27_384, 27384.12]
    co_leap_income_limit: [43_284, 43_284, 43_284, 43_284, 43_284, 43_284]
    co_leap_income_contribution_rate: [0, 0.1, 0.1, 0.2, 0.2, 0.3]
    co_leap_heating_cost: [1_000, 1_000, 1_000, 1_000, 1_000, 1_000]
    co_leap_eligible: [true, true, true, true, true, true]
    co_leap: [1_000, 900, 900, 800, 800, 700]

