    co_leap_income_contribution_rate: 0
    co_leap_heating_cost: 5_000
    co_leap_eligible: true
    co_leap: 1_000

# Review C3: monthly wages 3,500 plus a 200 lottery annuity produce
# annual countable income 44,400, above the published 43,284 one-person limit.
# Accepted plan page6 includes lottery winnings; manual page46 counts prizes.
- name: Case 11, regular lottery receipts count toward the income eligibility limit.
  period: 2026
  input:
    state_code: CO
    age: 35
    employment_income: 42_000
    gambling_winnings: 2_400
    ssi: 0
    co_oap: 0
    co_tanf: 0
    heating_type: NATURAL_GAS
    gas_expense: 1_000
  output:
    co_leap_countable_income: 44_400
    co_leap_income_limit: 43_284
    co_leap_eligible: false
    co_leap: 0


# Military retirement is separate from pension_income. Rental losses cannot
# reduce the gross pension receipt. Both exceed the one-person 43,284 ceiling.
- name: Case 12, military retirement and pension receipts prevent excess awards.
  period: 2026
  input:
    state_code: [CO, CO]
    age: [55, 55]
    is_citizen_or_legal_immigrant: [true, true]
    ssi: [0, 0]
    co_oap: [0, 0]
    co_tanf: [0, 0]
    military_retirement_pay: [50_000, 0]
    taxable_pension_income: [0, 44_000]
    rental_income: [0, -10_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_000, 1_000]
  output:
    co_leap_countable_income_person: [50_000, 44_000]
    co_leap_countable_income: [50_000, 44_000]
    co_leap_income_limit: [43_284, 43_284]
    co_leap_eligible: [false, false]
    co_leap: [0, 0]

# The family's potential Colorado Works entitlement is not a received benefit
# when TANF take-up is false. Its zero counted income gives no contribution.
- name: Case 13, a TANF nonparticipant retains the zero-income heating award.
  period: 2026
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        co_oap: 0
      person2:
        age: 8
        is_citizen_or_legal_immigrant: true
        ssi: 0
        co_oap: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        takes_up_tanf_if_eligible: false
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CO
  output:
    tanf: 0
    co_leap_household_size: 2
    co_leap_countable_income: 0
    co_leap_income_contribution_rate: 0
    co_leap_eligible: true
    co_leap: 1_000

