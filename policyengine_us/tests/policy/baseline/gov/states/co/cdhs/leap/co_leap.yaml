      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
