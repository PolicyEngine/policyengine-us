        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 5_000
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_household_size: 1
    co_leap_countable_income_person: 0
    co_leap_countable_income: 0
