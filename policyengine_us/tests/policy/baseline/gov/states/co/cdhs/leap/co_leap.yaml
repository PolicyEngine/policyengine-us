# A loss produces zero counted earnings under the scoped convention, not a negative contribution. The 5,000 bill still receives at most 1,000.
- name: "Case 10, a business loss cannot inflate the regular benefit above its cap."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        self_employment_income: -1_000_000
    spm_units:
      spm_unit:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 5_000
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "CO"
  output:
    co_leap_household_size: 1
    co_leap_countable_income_person: 0
    co_leap_countable_income: 0
    co_leap_income_limit: 43_284
    co_leap_income_contribution_rate: 0
    co_leap_heating_cost: 5_000
    co_leap_eligible: true
    co_leap: 1_000
