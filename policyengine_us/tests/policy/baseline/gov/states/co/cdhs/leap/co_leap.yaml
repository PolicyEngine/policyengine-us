# Eligibility, PDF pages5,8: https://liheapch.acf.gov/docs/2026/state-plans/CO_Plan_2026.pdf#page=5

# Zero bill is ineligible. For positive costs clip(cost,200,1000): 1 and 199.99 receive 200;600 receives 600;1,000.01 and 5,000 receive 1,000. No expense cap removes the minimum.
- name: "Case 1, positive direct heating awards retain the minimum maximum and actual cost proxy."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO", "CO", "CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS"]
    age: [35, 35, 35, 35, 35, 35, 35, 35]
    ssi: [0, 0, 0, 0, 0, 0, 0, 0]
    co_oap: [0, 0, 0, 0, 0, 0, 0, 0]
    co_tanf: [0, 0, 0, 0, 0, 0, 0, 0]
    gas_expense: [0, 1, 199.99, 200, 600, 1_000, 1000.01, 5_000]
  output:
    co_leap_household_size: [1, 1, 1, 1, 1, 1, 1, 1]
    co_leap_countable_income_person: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_countable_income: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_income_limit: [43_284, 43_284, 43_284, 43_284, 43_284, 43_284, 43_284, 43_284]
    co_leap_income_contribution_rate: [0, 0, 0, 0, 0, 0, 0, 0]
    co_leap_heating_cost: [0, 1, 199.99, 200, 600, 1_000, 1000.01, 5_000]
    co_leap_eligible: [false, true, true, true, true, true, true, true]
    co_leap: [0, 200, 200, 200, 600, 1_000, 1_000, 1_000]

