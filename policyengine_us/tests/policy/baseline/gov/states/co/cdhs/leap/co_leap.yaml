# Separate heating: clip(cost-180,200,1000) gives 200,420,820. Subsidized bundled heat without represented surcharge is ineligible despite a rent-table cost.
- name: "Case 5, subsidized housing deduction retains the minimum for low costs."
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ["CO", "CO", "CO", "CO"]
    heating_type: ["NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS", "NATURAL_GAS"]
    age: [35, 35, 35, 35]
    ssi: [0, 0, 0, 0]
    co_oap: [0, 0, 0, 0]
    co_tanf: [0, 0, 0, 0]
    gas_expense: [100, 600, 1_000, 600]
    receives_housing_assistance: [true, true, true, true]
    heat_expense_included_in_rent: [false, false, false, true]
  output:
    co_leap_household_size: [1, 1, 1, 1]
    co_leap_countable_income: [0, 0, 0, 0]
    co_leap_income_limit: [43_284, 43_284, 43_284, 43_284]
    co_leap_income_contribution_rate: [0, 0, 0, 0]
    co_leap_heating_cost: [100, 600, 1_000, 200]
    co_leap_eligible: [true, true, true, false]
    co_leap: [200, 420, 820, 0]

# Two separate units of 1 and 3 members report the same 734 shared-meter seasonal bill. Rates 20% and 10% yield 734*0.8/2=293.60 and 734*0.9/2=330.30; do not divide by 4 people.
- name: "Case 6, unequal-size economic units share costs by units rather than people."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 24_000
        ssi: 0
        co_oap: 0
      person2:
        age: 40
        employment_income: 24_000
        ssi: 0
        co_oap: 0
      person3:
        age: 8
        ssi: 0
        co_oap: 0
      person4:
        age: 5
        ssi: 0
        co_oap: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 734
        co_tanf: 0
        receives_housing_assistance: false
      spm_unit2:
        members: ["person2", "person3", "person4"]
        heating_type: "NATURAL_GAS"
        gas_expense: 734
        co_tanf: 0
    tax_units:
      tax_unit1:
        members: ["person1"]
      tax_unit2:
        members: ["person2", "person3", "person4"]
    households:
      household:
        members: ["person1", "person2", "person3", "person4"]
        state_code: "CO"
  output:
    co_leap_household_size: [1, 3]
    co_leap_countable_income_person: [24_000, 24_000, 0, 0]
    co_leap_countable_income: [24_000, 24_000]
    co_leap_income_limit: [43_284, 69_924]
    co_leap_income_contribution_rate: [0.2, 0.1]
    co_leap_heating_cost: [734, 734]
    co_leap_eligible: [true, true]
    co_leap: [293.6, 330.3]

# First unit income 1,000/month has 10% contribution. Divide by both units even though second fails income:1,000*0.9/2 -180 =270. Dividing after subsidy or counting only eligible units gives the wrong amount.
- name: "Case 7, an ineligible sharing unit still counts and housing deduction follows division."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
        ssi: 0
        co_oap: 0
      person2:
        age: 40
        employment_income: 100_000
        ssi: 0
        co_oap: 0
      person3:
        age: 8
        ssi: 0
        co_oap: 0
      person4:
        age: 5
        ssi: 0
        co_oap: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        co_tanf: 0
        receives_housing_assistance: true
      spm_unit2:
        members: ["person2", "person3", "person4"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        co_tanf: 0
    tax_units:
      tax_unit1:
        members: ["person1"]
      tax_unit2:
        members: ["person2", "person3", "person4"]
    households:
      household:
        members: ["person1", "person2", "person3", "person4"]
        state_code: "CO"
  output:
    co_leap_household_size: [1, 3]
    co_leap_countable_income_person: [12_000, 100_000, 0, 0]
    co_leap_countable_income: [12_000, 100_000]
    co_leap_income_limit: [43_284, 69_924]
    co_leap_income_contribution_rate: [0.1, 0.3]
    co_leap_heating_cost: [1_000, 1_000]
    co_leap_eligible: [true, false]
    co_leap: [270, 0]

# Qualified size 1 with parent income 1,000/month: rate 10%, award 1,000*0.9=900. Counting both people in size would wrongly produce the 0% rate.
- name: "Case 8, citizen child qualifies while nonqualified parent income remains included."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssi: 0
        co_oap: 0
        immigration_status: "UNDOCUMENTED"
        employment_income: 12_000
      person2:
        age: 8
        ssi: 0
        co_oap: 0
        immigration_status: "CITIZEN"
    spm_units:
      spm_unit:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        co_tanf: 0
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
    households:
      household:
        members: ["person1", "person2"]
        state_code: "CO"
  output:
    co_leap_household_size: 1
    co_leap_countable_income_person: [12_000, 0]
    co_leap_countable_income: 12_000
    co_leap_income_limit: 43_284
    co_leap_income_contribution_rate: 0.1
    co_leap_heating_cost: 1_000
    co_leap_eligible: true
    co_leap: 900

