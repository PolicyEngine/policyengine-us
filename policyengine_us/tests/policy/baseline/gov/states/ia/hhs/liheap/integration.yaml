# Iowa LIHEAP Regular Assistance end-to-end integration tests, FY26 season
# (October 1, 2025 to April 30, 2026; model period 2026).
# FY26 LIHEAP Policy and Procedures Manual: income limit section 5.10 p. 18;
# household size and ineligible members section 7.30 p. 34; countable income
# section 6.20 p. 26 and Appendix C pp. 90-121; energy burden Appendix D
# pp. 122-123; 200 percent table Appendix B p. 89; points matrix and award
# Appendix I p. 137: https://hhs.iowa.gov/media/17262/download?inline#page=137
# FFY2026 Detailed Model Plan sections 1.8-1.9 pp. 5-6 and 2.3-2.6 pp. 8-9:
# https://liheapch.acf.gov/docs/2026/state-plans/IA_Plan_2026.pdf#page=9
# FY26 plan hearing draft p. 48 (flat 800 for liquid propane and fuel oil):
# https://hhs.iowa.gov/media/16690/download?inline#page=48
# 2025 guideline (contiguous states): 15,650 + 5,500 per additional person;
# limit = 2 x guideline: 31,300 (1) / 42,300 (2) / 53,300 (3) / 64,300 (4).
# Poverty points by income / guideline: <= 0.75 -> 8, <= 1.00 -> 6,
# <= 1.25 -> 5, <= 2.00 -> 4. Benefit = 40 x points clipped to [80, 800];
# propane and fuel oil households receive the flat 800.

- name: Case 1, retiree on Social Security in a detached gas-heated house.
  period: 2026
  input:
    people:
      person1:
        age: 65
        social_security: 18_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        spm_unit_cash_assets: 5_000
        ia_liheap_dwelling_type: DETACHED
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    ia_liheap_household_size: 1
    ia_liheap_fpg: 15_650
    # 2.0 x 15,650
    ia_liheap_income_limit: 31_300
    # 18,000 Social Security; 1,500 a month exceeds the SSI federal benefit
    # rate, so no SSI is added.
    ia_liheap_countable_income: 18_000
    ia_liheap_income_eligible: true
    ia_liheap_fixed_income_only: true
    ia_liheap_has_energy_burden: true
    ia_liheap_eligible: true
    ia_liheap_fuel_category: NATURAL_GAS
    # 18,000 / 15,650 = 1.1502 -> 116 percent -> 101 to 125 band
    ia_liheap_poverty_points: 5
    # fixed income +1, elderly +1, detached +1
    ia_liheap_targeting_points: 3
    ia_liheap_fuel_points: 4
    # 5 + 3 + 4
    ia_liheap_points: 12
    # 40 x 12
    ia_liheap: 480

- name: Case 2, working couple with a toddler in a Section 8 eight-unit building with heat in rent and an electric account.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 20_000
      person2:
        age: 32
        employment_income: 14_000
      person3:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        # The building's fuel is still required for the fuel points.
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 900
        ia_liheap_dwelling_type: ATTACHED_5_OR_MORE_UNITS
    households:
      household:
        members: [person1, person2, person3]
        state_code: IA
  output:
    ia_liheap_household_size: 3
    # 15,650 + 2 x 5,500
    ia_liheap_fpg: 26_650
    # 2.0 x 26,650
    ia_liheap_income_limit: 53_300
    # 20,000 + 14,000
    ia_liheap_countable_income: 34_000
    ia_liheap_income_eligible: true
    ia_liheap_fixed_income_only: false
    # Subsidized heat in rent with an electric account (Appendix D p. 122).
    ia_liheap_has_energy_burden: true
    ia_liheap_eligible: true
    # 34,000 / 26,650 = 1.2758 -> 128 percent -> 126 to 200 band
    ia_liheap_poverty_points: 4
    # young child +1, five-plex -1, subsidized -2, heat in rent -4
    ia_liheap_targeting_points: -6
    ia_liheap_fuel_points: 4
    # 4 - 6 + 4
    ia_liheap_points: 2
    # 40 x 2 = 80, at the 80 minimum
    ia_liheap: 80

- name: Case 3, farm couple heating with propane and holding savings over 50,000.
  period: 2026
  input:
    people:
      person1:
        age: 55
        farm_operations_income: 22_000
      person2:
        age: 53
        farm_rent_income: 6_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: PROPANE
        bottled_gas_expense: 2_400
        spm_unit_cash_assets: 60_000
        ia_liheap_dwelling_type: DETACHED
    households:
      household:
        members: [person1, person2]
        state_code: IA
  output:
    ia_liheap_household_size: 2
    # 15,650 + 5,500
    ia_liheap_fpg: 21_150
    # 2.0 x 21,150
    ia_liheap_income_limit: 42_300
    # 22,000 + 6,000 (Appendix C p. 98 farm income); no asset test
    ia_liheap_countable_income: 28_000
    ia_liheap_income_eligible: true
    ia_liheap_eligible: true
    ia_liheap_fuel_category: PROPANE
    # 28,000 / 21,150 = 1.3239 -> 133 percent -> 126 to 200 band
    ia_liheap_poverty_points: 4
    # detached +1, savings over 50,000 -4
    ia_liheap_targeting_points: -3
    ia_liheap_fuel_points: 5
    # 4 - 3 + 5
    ia_liheap_points: 6
    # 40 x 6 = 240, raised to the 800 liquid propane amount
    ia_liheap: 800

- name: Case 4, mixed-status family counts both parents' wages against the size-two limit.
  period: 2026
  input:
    people:
      person1:
        age: 35
        immigration_status: UNDOCUMENTED
        employment_income: 26_000
      person2:
        age: 33
        immigration_status: CITIZEN
        employment_income: 12_000
      person3:
        age: 5
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_100
        ia_liheap_dwelling_type: DETACHED
    households:
      household:
        members: [person1, person2, person3]
        state_code: IA
  output:
    # Section 7.30 p. 34: the undocumented parent is not counted.
    ia_liheap_household_size: 2
    ia_liheap_fpg: 21_150
    ia_liheap_income_limit: 42_300
    # 26,000 + 12,000, the ineligible member's income counts in full
    ia_liheap_countable_income: 38_000
    # 38,000 <= 42,300
    ia_liheap_income_eligible: true
    ia_liheap_eligible: true
    # 38,000 / 21,150 = 1.7967 -> 180 percent -> 126 to 200 band
    ia_liheap_poverty_points: 4
    # young child +1, detached +1
    ia_liheap_targeting_points: 2
    ia_liheap_fuel_points: 4
    # 4 + 2 + 4
    ia_liheap_points: 10
    # 40 x 10
    ia_liheap: 400

- name: Case 5, disabled worker paying child support in an all-electric duplex.
  period: 2026
  input:
    people:
      person1:
        age: 45
        is_disabled: true
        employment_income: 26_000
        child_support_expense: 4_800
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_500
        ia_liheap_dwelling_type: ATTACHED_2_TO_4_UNITS
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    ia_liheap_household_size: 1
    ia_liheap_income_limit: 31_300
    # 26,000 - 4,800 child support paid (Appendix C p. 92)
    ia_liheap_countable_income: 21_200
    ia_liheap_income_eligible: true
    ia_liheap_fixed_income_only: false
    ia_liheap_has_energy_burden: true
    ia_liheap_eligible: true
    ia_liheap_fuel_category: ELECTRICITY
    # 21,200 / 15,650 = 1.3546 -> 136 percent -> 126 to 200 band
    ia_liheap_poverty_points: 4
    # disabled +1; a two-to-four-unit building scores 0
    ia_liheap_targeting_points: 1
    ia_liheap_fuel_points: 4
    # 4 + 1 + 4
    ia_liheap_points: 9
    # 40 x 9
    ia_liheap: 360

- name: Case 6, unspecified heating type with heat in unsubsidized rent pays nothing.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 20_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        heat_expense_included_in_rent: true
        ia_liheap_dwelling_type: ATTACHED_2_TO_4_UNITS
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    ia_liheap_household_size: 1
    ia_liheap_countable_income: 20_000
    # 20,000 <= 31,300
    ia_liheap_income_eligible: true
    # Unsubsidized heat in rent is a burden (Appendix D p. 122) ...
    ia_liheap_has_energy_burden: true
    ia_liheap_fuel_category: OTHER
    ia_liheap_fuel_points: 0
    # ... but the fuel must be sent: UNSPECIFIED pays nothing.
    ia_liheap_eligible: false
    ia_liheap: 0

- name: Case 7, disabled grandparent raising a preschooler in a kerosene-heated house reaches the 18-point maximum.
  period: 2026
  input:
    people:
      person1:
        age: 68
        is_disabled: true
        social_security: 15_000
      person2:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: KEROSENE
        fuel_oil_expense: 1_600
        ia_liheap_dwelling_type: DETACHED
    households:
      household:
        members: [person1, person2]
        state_code: IA
  output:
    ia_liheap_household_size: 2
    ia_liheap_fpg: 21_150
    ia_liheap_income_limit: 42_300
    # 15,000 Social Security; 1,250 a month exceeds the SSI federal benefit
    # rate, so no SSI is added.
    ia_liheap_countable_income: 15_000
    ia_liheap_fixed_income_only: true
    ia_liheap_eligible: true
    # Kerosene takes the fuel-oil category by inference.
    ia_liheap_fuel_category: FUEL_OIL
    # 15,000 / 21,150 = 0.7092 -> 71 percent -> 0 to 75 band
    ia_liheap_poverty_points: 8
    # fixed income +1, elderly +1, disabled +1, young child +1, detached +1
    ia_liheap_targeting_points: 5
    ia_liheap_fuel_points: 5
    # 8 + 5 + 5, the largest total the matrix allows
    ia_liheap_points: 18
    # 40 x 18 = 720, below the 800 cap; kerosene does not take the flat 800
    ia_liheap: 720

- name: Case 8, Section 8 tenant with heat in rent, large savings and an electric account has negative points and receives the 80 minimum.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 28_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 900
        spm_unit_cash_assets: 60_000
        ia_liheap_dwelling_type: ATTACHED_5_OR_MORE_UNITS
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    ia_liheap_household_size: 1
    ia_liheap_countable_income: 28_000
    ia_liheap_income_eligible: true
    ia_liheap_has_energy_burden: true
    ia_liheap_eligible: true
    # 28,000 / 15,650 = 1.789 -> 179 percent -> 126 to 200 band
    ia_liheap_poverty_points: 4
    # five-plex -1, subsidized -2, heat in rent -4, savings -4
    ia_liheap_targeting_points: -11
    ia_liheap_fuel_points: 4
    # 4 - 11 + 4
    ia_liheap_points: -3
    # 40 x -3 = -120 -> raised to the 80 minimum
    ia_liheap: 80
