- name: Case 1, one blind spouse receives the categorical supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        is_blind: true
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: IA
  output:
    ia_ssa: [22, 0]

