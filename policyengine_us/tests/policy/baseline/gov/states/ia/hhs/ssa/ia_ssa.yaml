# 441 IAC 177.2(1)"f"(3) and 6-B Home Maintenance Allowance (IHHRC) p.43,
# example 2: "Mr. B receives $1,400 in social security benefits; the child
# receives $125."
- name: Case 50, manual IHHRC example deducts the dependent allowance less the child's income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 65
        social_security_retirement:
          2026: 16_800
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
      person2:
        age:
          2026: 10
        social_security_dependents:
          2026: 1_500
    marital_units:
      parent:
        members: [person1]
      child:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # SSI: 1,400 - 20 = 1,380 > 994, so SSI is 0. The child is not aged,
    # blind or disabled.
    # Dependent allowance: 497 (1,491 - 994) - 125 = 372.
    # Participation: 1,400 - 994 - 372 = 34 (6-B p.43); 400 - 34 = 366.
    ssi: [0, 0]
    ssi_ineligible_child_allocation: [0, 372]
    ia_ssa_care_countable_income: [1_400, 125]
    ia_ssa_ihhrc_participation: [34, 0]
    ia_ssa: [366, 0]

# 6-B Client Participation for Adults (IHHRC) p.42: "The household consists
# of the recipient, the recipient's spouse, and two children. The spouse has
# earned income of $4,500."
- name: Case 51, manual IHHRC example with a working spouse and two children has no participation.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
      person2:
        age:
          2026: 40
        employment_income:
          2026: 54_000
      person3:
        age:
          2026: 8
      person4:
        age:
          2026: 5
    marital_units:
      couple:
        members: [person1, person2]
      child1:
        members: [person3]
      child2:
        members: [person4]
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code:
          2026: IA
  output:
    # SSI deems the spouse's 4,500 less 2 * 497 for the children, 3,506, which
    # is above 497. (3,506 - 20 - 65) / 2 = 1,710.50 > 1,491, so SSI is 0.
    # Care income: (4,500 - 65) / 2 = 2,217.50, the spouse's own earnings
    # under the same exclusions.
    # Participation: 2,217.50 - 1,491 = 726.50; 726.50 - 994 < 0, so 0
    # (6-B p.42), and the full 400 cost is paid.
    ssi: [0, 0, 0, 0]
    ssi_ineligible_child_allocation: [0, 0, 497, 497]
    ia_ssa_care_countable_income: [2_217.5, 2_217.5, 0, 0]
    ia_ssa_ihhrc_participation: [0, 0, 0, 0]
    ia_ssa: [400, 0, 0, 0]

