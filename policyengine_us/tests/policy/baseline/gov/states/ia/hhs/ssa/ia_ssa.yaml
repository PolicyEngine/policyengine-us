- name: Case 22, SMME missing coverage.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: IA
    age:
      2026: 65
    # Social Security of $2,020 a month.
    social_security_retirement:
      2026: 24_240
    ia_ssa_category: SMME
  output:
    # 2,020 - 20 = 2,000 is above 994, so SSI is 0. Without the coverage
    # input there is no SMME.
    ssi: 0
    ia_ssa_smme_countable_income: 2_000
    ia_ssa: 0

- name: Case 23, SMME income below 120 percent poverty.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: IA
    age:
      2026: 65
    # Social Security of $1,020 a month.
    social_security_retirement:
      2026: 12_240
    ia_ssa_category: SMME
    ia_ssa_smme_coverage_eligible: true
  output:
    # 1,020 - 20 = 1,000 is above 994, so SSI is 0, but below January's
    # 1.2 * 15,650 / 12 = 1,565, so no SMME.
    ssi: 0
    ia_ssa_smme_countable_income: 1_000
    ia_ssa: 0

- name: Case 24, SMME cannot stack with blind payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: IA
    age:
      2026: 65
    # Social Security of $1,025 a month.
    social_security_retirement:
      2026: 12_300
    ia_ssa_category: SMME
    ia_ssa_smme_coverage_eligible: true
    ia_ssa_smme_countable_income: 2_000
    is_blind: true
  output:
    # 1,025 - 20 = 1,005 is above 994, so SSI is 0, and SSA pays the blind
    # supplement of 994 + 22 - 1,005 = 11. A federally paid supplement
    # excludes SMME even with SMME income set above the guideline.
    ssi: 0
    ia_ssa_federal: 11
    ia_ssa: 11

