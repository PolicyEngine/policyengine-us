# Iowa Code 249.3(4)(g): income "of at least one hundred twenty percent of the
# federal poverty level" (441 IAC 51.7(6) and 6-B p.77 say "exceed"; the model
# follows the statute). Case 47 is an aged couple with Social Security of
# $1,700 a month each; Cases 48-49 bracket the two-person threshold from April
# 2026 (441 IAC 75.1), 1.2 * (15,960 + 5,680) / 12 = 2,164.
- name: Case 47, an SMME couple's combined income is compared with the two-person guideline.
  period: 2026-04
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 70
        social_security_retirement:
          2026: 20_400
        ia_ssa_category: SMME
        ia_ssa_smme_coverage_eligible: true
      person2:
        age:
          2026: 70
        social_security_retirement:
          2026: 20_400
        ia_ssa_category: SMME
        ia_ssa_smme_coverage_eligible: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # Both spouses are aged, so SSI budgets them as a couple:
    # 1,700 + 1,700 - 20 = 3,380 > 1,491, so SSI is 0, and SSI countable
    # income is 3,380 / 2 = 1,690 each.
    # SMME income combines the couple: 1,690 + 1,690 = 3,380 > 2,164, so each
    # covered spouse gets $1. (Half the couple's income, 1,690, would fail.)
    ssi_couple_computation_applies: [true, true]
    ssi_countable_income: [1_690, 1_690]
    ssi: [0, 0]
    ia_ssa_smme_countable_income: [3_380, 3_380]
    ia_ssa_federal: [0, 0]
    ia_ssa: [1, 1]

- name: Case 48, an SMME couple just above the two-person guideline with one spouse covered.
  period: 2026-04
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 70
        # Boundary income: $1,093 a month each puts the couple $2 above the
        # 2,164 threshold.
        social_security_retirement:
          2026: 13_116
        ia_ssa_category: SMME
        ia_ssa_smme_coverage_eligible: true
      person2:
        age:
          2026: 70
        social_security_retirement:
          2026: 13_116
        ia_ssa_category: SMME
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # SSI: 1,093 + 1,093 - 20 = 2,166 > 1,491, so SSI is 0; 2,166 / 2 = 1,083
    # each. SMME income 1,083 + 1,083 = 2,166 > 2,164.
    # Only person1 has the Medicaid and Part B coverage, so only person1 is
    # paid. Each spouse's own 1,093 - 20 = 1,073 is below the one-person
    # 1,596, so this case pins the combined reading.
    ssi_countable_income: [1_083, 1_083]
    ssi: [0, 0]
    ia_ssa_smme_countable_income: [2_166, 2_166]
    ia_ssa: [1, 0]

