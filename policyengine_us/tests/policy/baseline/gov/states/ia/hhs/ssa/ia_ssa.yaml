- name: Case 45, partial residential care days on one resident leave another resident's full month unchanged.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 65
        ia_ssa_category: RESIDENTIAL_CARE
        ia_ssa_rcf_daily_rate: 38.47
        # Entry on January 7: the day of entry through January 31.
        ia_ssa_care_partial_month_days: 25
      person2:
        age:
          2026: 65
        ia_ssa_category: RESIDENTIAL_CARE
        ia_ssa_rcf_daily_rate: 38.47
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # Each resident has SSI 994, so participation is 994 - 130 = 864.
    # person1: 38.47 * 25 = 961.75 - 864 = 97.75.
    # person2: 38.47 * 31 = 1,192.57 - 864 = 328.57.
    ia_ssa: [97.75, 328.57]

- name: Case 46, the initial partial-month flag and days apply only to the entry month.
