  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 70
        # Boundary income: $1,093 a month each puts the couple $2 above the
        # 2,164 threshold.
        social_security_retirement:
          2026: 13_116
        ia_ssa_category: SMME
        ia_ssa_smme_coverage_eligible: true
      person2:
        age:
          2026: 70
        social_security_retirement:
          2026: 13_116
        ia_ssa_category: SMME
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # SSI: 1,093 + 1,093 - 20 = 2,166 > 1,491, so SSI is 0; 2,166 / 2 = 1,083
    # each. SMME income 1,083 + 1,083 = 2,166 > 2,164.
    # Only person1 has the Medicaid and Part B coverage, so only person1 is
    # paid. Each spouse's own 1,093 - 20 = 1,073 is below the one-person
    # 1,596, so this case pins the combined reading.
    ssi_countable_income: [1_083, 1_083]
    ssi: [0, 0]
    ia_ssa_smme_countable_income: [2_166, 2_166]
    ia_ssa: [1, 0]

