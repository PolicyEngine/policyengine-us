        ia_ssa_care_partial_month_days: 25
      person2:
        age:
          2026: 65
        ia_ssa_category: RESIDENTIAL_CARE
        ia_ssa_rcf_daily_rate: 38.47
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
