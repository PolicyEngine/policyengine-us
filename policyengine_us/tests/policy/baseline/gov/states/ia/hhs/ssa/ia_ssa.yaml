          2026: 16_800
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        ia_ssa_care_partial_month_days: 16
        ia_ssa_care_initial_partial_month: true
      person2:
        age:
          2026: 65
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # person1: no participation in the first partial month; 400 * 16 / 31 = 206.45.
    # person2: SSI 994 less the 994 home maintenance allowance leaves no
    # participation, so the full 400 cost is paid.
    ia_ssa_care_partial_month_days: [16, 0]
    ia_ssa_ihhrc_participation: [0, 0]
    ia_ssa_ihhrc_amount: [206.45, 400]
