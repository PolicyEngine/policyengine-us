- name: Case 4, manual G family example with earned and unearned parental income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        # 6-B example: Mr. G has a retirement pension of $900 a month.
        taxable_private_pension_income:
          2026: 10_800
      person2:
        age:
          2026: 40
        person_id:
          2026: 2
        # 6-B example: Mrs. G has earnings of $1,500 a month.
        employment_income_before_lsr:
          2026: 18_000
      person3:
        age:
          2026: 10
        person_id:
          2026: 3
        parent_1_id:
          2026: 1
        parent_2_id:
          2026: 2
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
      person4:
        age:
          2026: 8
        person_id:
          2026: 4
        parent_1_id:
          2026: 1
        parent_2_id:
          2026: 2
    marital_units:
      parents:
        members: [person1, person2]
      child1:
        members: [person3]
      child2:
        members: [person4]
    families:
      family:
        members: [person1, person2, person3, person4]
    tax_units:
      family:
        members: [person1, person2, person3, person4]
    spm_units:
      unit:
        members: [person1, person2, person3, person4]
    households:
      home:
        members: [person1, person2, person3, person4]
        state_code:
          2026: IA
  output:
    # Iowa: (1,500 - 65) / 2 + 900 = 1,617.50 - 1,491 = 126.50 - 497 < 0, so 0.
    # The child receives the full SSI 994; participation 994 - 994 = 0.
    ia_ssa_income_deemed_from_parents: [0, 0, 0, 0]
    ssi: [0, 0, 994, 0]
    people:
      person3:
        ia_ssa_ihhrc_participation: 0
    ia_ssa: [0, 0, 400, 0]
