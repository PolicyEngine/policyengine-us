      home:
        members: [person1, person2, person3, person4, person5]
        state_code:
          2026: IA
  output:
    # Iowa: 4,000 - 65 - 2,982 - 2 * (497 - 150) = 259.
    # SSI deems (4,000 - 694 - 85) / 2 - 1,491 = 119.50, less 20: 994 - 99.50 = 894.50.
    # Participation 259 + 894.50 - 994 = 159.50, so 400 - 159.50 = 240.50 is paid.
    ia_ssa_income_deemed_from_parents: [0, 0, 259, 0, 0]
    ssi: [0, 0, 894.5, 0, 0]
    people:
      person3:
        ia_ssa_care_countable_income: 1_153.5
        ia_ssa_ihhrc_participation: 159.5
