# Iowa 6-B in-home health-related care parental income deeming worked examples.
- name: Case 1, manual example of a mother with unemployment benefits only.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        # 6-B example: unemployment benefits of $1,050 a month.
        unemployment_compensation:
          2026: 12_600
      person2:
        age:
          2026: 10
        person_id:
          2026: 2
        parent_1_id:
          2026: 1
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
    marital_units:
      parent:
        members: [person1]
      child:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      family:
        members: [person1, person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # Iowa: 1,050 - 994 SSI allowance for the mother = 56 deemed.
    # SSI deems 1,050 - 20 - 994 = 36, less the child's 20 exclusion: 994 - 16 = 978.
    # Participation 56 + 978 - 994 = 40, so 400 - 40 = 360 is paid.
    ia_ssa_income_deemed_from_parents: [0, 56]
    ssi: [0, 978]
    people:
      person2:
        ia_ssa_care_countable_income: 1_034
        ia_ssa_ihhrc_participation: 40
    ia_ssa: [0, 360]

- name: Case 2, manual D family example with earnings only and two ineligible siblings.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        # 6-B example: Mr. D has earnings of $4,200 a month.
        employment_income_before_lsr:
          2026: 50_400
      person2:
        age:
          2026: 40
        person_id:
          2026: 2
      person3:
        age:
          2026: 10
        person_id:
          2026: 3
        parent_1_id:
          2026: 1
        parent_2_id:
          2026: 2
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
      person4:
        age:
          2026: 8
        person_id:
          2026: 4
        parent_1_id:
          2026: 1
        parent_2_id:
          2026: 2
      person5:
        age:
          2026: 8
        person_id:
          2026: 5
        parent_1_id:
          2026: 1
        parent_2_id:
          2026: 2
    marital_units:
      parents:
        members: [person1, person2]
      child1:
        members: [person3]
      child2:
        members: [person4]
      child3:
        members: [person5]
    families:
      family:
        members: [person1, person2, person3, person4, person5]
    tax_units:
      family:
        members: [person1, person2, person3, person4, person5]
    spm_units:
      unit:
        members: [person1, person2, person3, person4, person5]
    households:
      home:
        members: [person1, person2, person3, person4, person5]
        state_code:
          2026: IA
  output:
    # Iowa: 4,200 - 65 - 2,982 (double the couple allowance) - 2 * 497 = 159.
    # SSI deems (4,200 - 994 - 85) / 2 - 1,491 = 69.50, less 20: 994 - 49.50 = 944.50.
    # Participation 159 + 944.50 - 994 = 109.50, so 400 - 109.50 = 290.50 is paid.
    ia_ssa_income_deemed_from_parents: [0, 0, 159, 0, 0]
    ssi: [0, 0, 944.5, 0, 0]
    people:
      person3:
        ia_ssa_care_countable_income: 1_103.5
        ia_ssa_ihhrc_participation: 109.5
    ia_ssa: [0, 0, 290.5, 0, 0]

