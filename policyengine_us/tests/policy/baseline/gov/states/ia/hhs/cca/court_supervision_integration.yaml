- name: IA approved child is paid without funding an unapproved sibling
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 240000
        ia_cca_max_rate: 0
      approved_child:
        age: 12
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        ia_cca_court_ordered_care_approved: true
        pre_subsidy_childcare_expenses: 4800
        childcare_hours_per_week: 40
        ia_cca_max_rate: 500
      sibling:
        age: 8
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 12000
        childcare_hours_per_week: 40
        ia_cca_max_rate: 500
    tax_units:
      unit:
        members: &id001
        - parent
        - approved_child
        - sibling
    spm_units:
      unit:
        members: *id001
        ia_cca_income_eligible: false
        ia_cca_activity_eligible: false
    households:
      home:
        members: *id001
        state_code: IA
  output:
    ia_cca_eligible_child:
    - false
    - true
    - true
    ia_cca_eligible: true
    ia_cca_copay: 0
    ia_cca: 400
