- name: Case 6, a co-resident stepparent's resources are deemed with the parent's.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 38
        person_id:
          2026: 1
      person2:
        age:
          2026: 40
        person_id:
          2026: 2
        bank_account_assets:
          2026: 5_600
      person3:
        age:
          2026: 10
        person_id:
          2026: 3
        parent_1_id:
          2026: 1
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
    marital_units:
      parents:
        members: [person1, person2]
      child:
        members: [person3]
    families:
      family:
        members: [person1, person2, person3]
    tax_units:
      family:
        members: [person1, person2, person3]
    spm_units:
      unit:
        members: [person1, person2, person3]
    households:
      home:
        members: [person1, person2, person3]
        state_code:
          2026: IA
  output:
    # person2 is the mother's spouse but not a named parent. 20 CFR 416.1202(b)(1)
    # deems a stepparent's resources and allows 3,000 for a parent and spouse:
    # 5,600 - 3,000 = 2,600, above the child's 2,000 limit.
    ia_ssa_resources_deemed_from_parents: [0, 0, 2_600]
    ia_ssa_eligible: [false, false, false]
    ia_ssa: [0, 0, 0]

- name: Case 7, manual Child A example deems one parent's bonds above the one-parent allowance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        # 6-B example: the parent has $2,200 in government bonds.
        bond_assets:
          2026: 2_200
      person2:
        age:
          2026: 10
        person_id:
          2026: 2
        parent_1_id:
          2026: 1
        # 6-B example: Child A has $900 in a savings account.
        bank_account_assets:
          2026: 900
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
    marital_units:
      parent:
        members: [person1]
      child:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      family:
        members: [person1, person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    # 2,200 - 2,000 = 200 deemed; 900 + 200 = 1,100 is within the 2,000 limit.
    ia_ssa_resources_deemed_from_parents: [0, 200]
    ia_ssa_eligible: [false, true]
    ia_ssa: [0, 400]

# The parent's 1,805.81 + 244.12 + 50.07 = 2,100.00 is 100 over the one-parent
# allowance; the float32 balances add to 2,100.0002 unless rounded to cents.
# The child's 1,900 plus 100 is exactly the 2,000 limit.
- name: Case 8, a parent's three accounts at the allowance plus 100 deem exactly 100.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 40
        person_id:
          2026: 1
        bank_account_assets:
          2026: 1_805.81
        stock_assets:
          2026: 244.12
        bond_assets:
          2026: 50.07
      person2:
        age:
          2026: 10
        person_id:
          2026: 2
        parent_1_id:
          2026: 1
        bank_account_assets:
          2026: 1_900
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
    marital_units:
      person1_unit:
        members: [person1]
      person2_unit:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      family:
        members: [person1, person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
    ia_ssa_resources_deemed_from_parents: [0, 100]
    ia_ssa_eligible: [false, true]

