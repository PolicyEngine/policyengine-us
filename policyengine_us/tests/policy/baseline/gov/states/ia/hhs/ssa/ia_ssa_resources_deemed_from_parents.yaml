          2026: 1_899.99
        ia_ssa_category: IN_HOME_CARE
        ia_ssa_ihhrc_monthly_cost: 400
        is_disabled:
          2026: true
        meets_ssi_disability_criteria:
          2026: true
    marital_units:
      person1_unit:
        members: [person1]
      person2_unit:
        members: [person2]
    families:
      family:
        members: [person1, person2]
    tax_units:
      family:
        members: [person1, person2]
    spm_units:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code:
          2026: IA
  output:
