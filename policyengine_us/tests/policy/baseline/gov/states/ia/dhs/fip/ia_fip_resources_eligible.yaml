- name: Case 1, applicant with resources below limit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 1_500
        is_tanf_enrolled: false
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    # Applicant limit is $2,000
    ia_fip_resources_eligible: true

- name: Case 2, applicant with resources above limit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 2_500
        is_tanf_enrolled: false
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    # Applicant limit is $2,000
    ia_fip_resources_eligible: false

- name: Case 3, recipient with resources below higher limit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 4_000
        is_tanf_enrolled: true
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    # Recipient limit is $5,000
    ia_fip_resources_eligible: true

- name: Case 4, recipient with resources above higher limit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 6_000
        is_tanf_enrolled: true
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    # Recipient limit is $5,000
    ia_fip_resources_eligible: false

- name: Case 5, applicant at exact limit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 2_000
        is_tanf_enrolled: false
    households:
      household:
        members: [person1]
        state_code: IA
  output:
    # At limit should be eligible (<=)
    ia_fip_resources_eligible: true

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: IA
  output:
    ia_fip_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: IA
  output:
    ia_fip_resources_eligible: false
