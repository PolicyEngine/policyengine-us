- name: Case 1, default ia_other_additions is zero
  period: 2024
  input:
    state_code: IA
    employment_income: 50_000
  output:
    ia_other_additions: 0
    ia_gross_income: 50_000
    ia_net_income: 50_000

- name: Case 2, ia_other_additions increases IA net income
  period: 2024
  input:
    state_code: IA
    employment_income: 50_000
    ia_other_additions: 2_000
  output:
    ia_other_additions: 2_000
    ia_gross_income: 52_000
    ia_net_income: 52_000

- name: Case 3, ia_other_additions raises Iowa taxable income from 2023
  period: 2024
  absolute_error_margin: 0.01
  input:
    state_code: IA
    employment_income: 50_000
    ia_other_additions: 2_000
  output:
    ia_taxable_income_consolidated: 37_400
    ia_income_tax_before_credits: 1_832.48
