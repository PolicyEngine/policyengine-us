- name: IA unit itemized deductions unit test 1
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        ia_net_income: 200_000
        real_estate_taxes: 2_000
      person2:
        is_tax_unit_spouse: true
        ia_net_income: 50_000
        real_estate_taxes: 11_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        interest_deduction: 17_000
        state_and_local_sales_or_income_tax: 8_000
    households:
      household:
        members: [person1, person2]
        state_code: IA
  output:
    ia_itemized_deductions_unit: 30_000

- name: Capped SALT deduction post 2023
  period: 2023
  input:
    real_estate_taxes: 11_000
    state_code: IA
    filing_status: JOINT
  output:
    ia_itemized_deductions_unit: 0

- name: Uncapped SALT deduction pre 2023
  period: 2022
  input:
    real_estate_taxes: 11_000
    state_code: IA
    filing_status: JOINT
  output:
    ia_itemized_deductions_unit: 11_000

# 2018 IA Schedule A lines 19 to 24: unreimbursed employee expenses and tax
# preparation fees above 2% of federal AGI, which the federal return suspends.
- name: 2018 Iowa keeps the miscellaneous deduction above 2% of federal AGI
  period: 2018
  input:
    unreimbursed_business_employee_expenses: 3_000
    tax_preparation_fees: 500
    adjusted_gross_income: 50_000
    real_estate_taxes: 2_000
    state_code: IA
  output:
    misc_deduction: 0
    # 2,000 + (3,500 - 2% * 50,000)
    ia_itemized_deductions_unit: 4_500

- name: 2019 Iowa follows the federal suspension of the miscellaneous deduction
  period: 2019
  input:
    unreimbursed_business_employee_expenses: 3_000
    tax_preparation_fees: 500
    adjusted_gross_income: 50_000
    real_estate_taxes: 2_000
    state_code: IA
  output:
    ia_itemized_deductions_unit: 2_000
