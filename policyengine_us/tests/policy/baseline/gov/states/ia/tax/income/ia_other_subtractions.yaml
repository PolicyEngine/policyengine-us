- name: Case 1, default ia_other_subtractions is zero
  period: 2024
  input:
    state_code: IA
    employment_income: 50_000
  output:
    ia_other_subtractions: 0
    ia_income_adjustments: 0
    ia_net_income: 50_000

- name: Case 2, ia_other_subtractions reduces IA net income
  period: 2024
  input:
    state_code: IA
    employment_income: 50_000
    ia_other_subtractions: 2_000
  output:
    ia_other_subtractions: 2_000
    ia_income_adjustments: 2_000
    ia_net_income: 48_000
