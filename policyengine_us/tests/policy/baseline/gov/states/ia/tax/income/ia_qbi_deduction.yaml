- name: IA qualified business income (QBI) deduction unit test 1
  period: 2021
  input:
    qbid_amount: 11_000
    qualified_business_income_deduction: 10_000
    state_code: IA
  output:
    ia_qbi_deduction: 5_000

- name: IA qualified business income (QBI) deduction unit test 2
  period: 2022
  input:
    qbid_amount: 11_000
    qualified_business_income_deduction: 10_000
    state_code: IA
  output:
    ia_qbi_deduction: 7_500

- name: Spouses share the federal deduction, and a dependent has none
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        qualified_business_income: 50_000
        # Iowa net income, with the other deductions set aside, so the joint
        # taxable income shows the QBI deduction alone.
        ia_net_income: 100_000
        ia_fedtax_deduction: 0
        ia_basic_deduction_joint: 0
      spouse:
        age: 45
        qualified_business_income: 30_000
        ia_net_income: 0
        ia_fedtax_deduction: 0
        ia_basic_deduction_joint: 0
      child:
        age: 17
        qualified_business_income: 10_000
        ia_net_income: 0
        ia_fedtax_deduction: 0
        ia_basic_deduction_joint: 0
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        taxable_income_less_qbid: 200_000
        adjusted_net_capital_gain: 0
    households:
      household:
        members: [head, spouse, child]
        state_code: IA
  output:
    # The federal deduction is 20% of the spouses' 80,000, 16,000, shared
    # 10,000 and 6,000; Iowa deducts 75% of each share.
    qualified_business_income_deduction: 16_000
    qualified_business_income_deduction_person: [10_000, 6_000, 0]
    ia_qbi_deduction: [7_500, 4_500, 0]
    # The joint return deducts the 12,000 once: 100,000 - 12,000.
    ia_taxable_income_joint: [88_000, 0, 0]
