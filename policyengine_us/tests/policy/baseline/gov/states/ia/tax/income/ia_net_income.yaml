- name: Dependents' gross income stays off the head's Iowa net income
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 40
        ia_gross_income: 10_000
        ia_income_adjustments: 2_000
      person2:
        is_tax_unit_dependent: true
        age: 18
        ia_gross_income: 800
      person3:
        is_tax_unit_dependent: true
        age: 17
        ia_gross_income: 600
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: IA
  output:
    # 10,000 - 2,000. The dependents' 800 and 600 go on their own Iowa
    # returns if they must file (Iowa Code 422.13(1)(a)).
    ia_net_income: [8_000, 0, 0]

