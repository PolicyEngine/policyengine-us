- name: A dependent child's interest stays off the parent's Iowa net income and 2022 tax
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 16
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: IA
  output:
    # Iowa net income starts from federal AGI (Iowa Code 422.7), which leaves
    # out the child's interest; the child files their own IA 1040 with net
    # income of 5,000 or more (Iowa Code 422.13(1)(a)).
    ia_net_income: [40_000, 0]
    # The same tax as with no child income (issue #9814 reproduction).
    ia_income_tax: 1_332.05

- name: A dependent child's wages stay off the parent's Iowa net income
  period: 2025
  input:
    people:
