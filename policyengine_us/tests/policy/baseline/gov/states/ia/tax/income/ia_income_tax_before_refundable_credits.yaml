- name: 2022 single filer who can be claimed but is not claimed has tax reduced to income above $9,000
  period: 2022
  input:
    people:
      person_a:
        age: 30
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        ia_income_tax_before_credits: 700
        ia_non_refundable_credits: 0
        ia_is_tax_exempt: false
        ia_modified_income: 9500
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # The filer can be claimed but nobody claims them; this rule turns on
    # being claimed.
    # min($700, $9,500 - $9,000) = $500.
    ia_income_tax_before_refundable_credits: 500

- name: 2022 claimed filer with a low-income claimant is exempt from tax
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 8_000
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
    ia_income_tax_before_credits: 100
    ia_non_refundable_credits: 0
  output:
    # Claimant 8,000 <= 9,000 and filer 6,000 <= 9,000: exempt, so 0.
    ia_is_tax_exempt: true
    ia_income_tax_before_refundable_credits: 0

- name: 2022 high claimant income removes both the exemption and the tax-reduction cap
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 9_001
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
    ia_income_tax_before_credits: 100
    ia_non_refundable_credits: 0
  output:
    # 9,001 > 9,000 removes both benefits; the 100 of tax remains, and the
    # single-filer reduction (6,000 - 9,000 < 0) must not erase it.
    ia_is_tax_exempt: false
    ia_income_tax_before_refundable_credits: 100

