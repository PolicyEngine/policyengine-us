- name: 2022 claimed single filer with a high-income claimant gets no tax reduction
  period: 2022
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        ia_dependent_claimant_net_income: 9_001
        ia_dependent_claimant_filing_status: SINGLE
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        ia_income_tax_before_credits: 700
        ia_non_refundable_credits: 0
        ia_is_tax_exempt: false
        ia_modified_income: 9500
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # Iowa Code 422.5(3) withholds the reduction because the claimant's
    # 9,001 exceeds 9,000.
    ia_income_tax_before_refundable_credits: 700

- name: 2022 claimed single filer with a low-income claimant has tax reduced to income above $9,000
  period: 2022
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        ia_dependent_claimant_net_income: 8_000
        ia_dependent_claimant_filing_status: SINGLE
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        ia_income_tax_before_credits: 700
        ia_non_refundable_credits: 0
        ia_is_tax_exempt: false
        ia_modified_income: 9500
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # Claimant 8,000 <= 9,000, so the reduction caps tax at
    # 9,500 - 9,000 = 500.
    ia_income_tax_before_refundable_credits: 500

