- name: 2022 joint return with no claimable spouse with $6,000 of net income is exempt
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 3000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        ia_net_income: 3000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
