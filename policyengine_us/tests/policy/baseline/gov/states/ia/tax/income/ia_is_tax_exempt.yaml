    ia_is_tax_exempt: true

- name: 2022 joint return with one claimable spouse is not exempt (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 3000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        ia_net_income: 3000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: IA
  output:
    # Joint returns are exempt only if "You are not claimed as a
    # dependent on another person's Iowa return"; either spouse bars it.
    ia_is_tax_exempt: false

- name: 2022 joint return with one claimable spouse is not exempt (the claimable spouse is the spouse)
  period: 2022
  input:
    people:
      person_b:
        age: 30
        ia_net_income: 3000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        ia_net_income: 3000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: IA
  output:
    ia_is_tax_exempt: false

