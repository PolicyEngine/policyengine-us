- name: 2022 single filer who can be claimed as a dependent with $4,999 of net income is exempt
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 4999
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # "less than $5,000 and you are claimed as a dependent" (2022 IA 1040
    # instructions, p.37).
    ia_is_tax_exempt: true

- name: 2022 single filer who can be claimed as a dependent with $5,000 of net income is not exempt
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # "less than $5,000 and you are claimed as a dependent" (2022 IA 1040
    # instructions, p.37).
    ia_is_tax_exempt: false

- name: 2022 single filer who can be claimed as a dependent with $6,000 of net income is not exempt
