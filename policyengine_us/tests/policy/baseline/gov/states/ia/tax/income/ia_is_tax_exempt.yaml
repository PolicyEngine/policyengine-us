    households:
      household:
        members: [person_a, person_b]
        state_code: IA
  output:
    # $3,000 + $3,000 = $6,000 <= $13,500 joint limit.
    ia_is_tax_exempt: true

- name: 2025 single filer who can be claimed as a dependent is exempt on Iowa taxable income below $5,000
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        ia_taxable_income_consolidated: 4000
        ia_modified_income: 19750
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # IA 1040 line 4 is $4,000 < $5,000; "none of the income listed
    # above is required to be added back" (2025 instructions, p.11).
    ia_is_tax_exempt: true

- name: 2025 single filer who cannot be claimed is not exempt once deductions are added back
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        ia_taxable_income_consolidated: 4000
        ia_modified_income: 19750
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # $4,000 + $15,750 standard deduction added back = $19,750 > $9,000.
    ia_is_tax_exempt: false
