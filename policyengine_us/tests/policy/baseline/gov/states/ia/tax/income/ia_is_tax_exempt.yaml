- name: IA is-tax-exempt unit test 1
  period: 2021
  input:
    filing_status: SINGLE
    age_head: 60
    ia_net_income: 0
    ia_pension_exclusion: 0
    ia_reportable_social_security: 10_000
    state_code: IA
  output:
    ia_is_tax_exempt: false

