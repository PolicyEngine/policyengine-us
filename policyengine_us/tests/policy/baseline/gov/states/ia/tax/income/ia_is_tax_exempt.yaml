# Iowa Code 422.5(3)(a) (2021-2022) and 422.5(2)(a) (2023 onward): a person
# claimed as a dependent on another return loses the exemption only when the
# person claiming them has net income over the subsection's limit. The
# instructions' $5,000 test of the dependent's own income does not apply.
- name: 2022 claimed single filer keeps the exemption with a low-income claimant
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 8_000
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
  output:
    # Claimant 8,000 <= 9,000 and the filer's 6,000 <= 9,000.
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2022 claimant income exactly at the statutory limit preserves the exemption
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 9_000
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
  output:
    # 9,000 does not exceed 9,000.
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2022 claimant income over the statutory limit removes the exemption
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 9_001
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
  output:
    # 9,001 > 9,000.
    ia_claimed_filer_income_disqualified: true
    ia_is_tax_exempt: false

- name: 2022 claimability alone does not test a claimant's income
  period: 2022
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
    ia_dependent_claimant_net_income: 50_000
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 6_000
  output:
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2024 a head-of-household claimant uses the larger limit
  period: 2024
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 13_000
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: HEAD_OF_HOUSEHOLD
    ia_modified_income: 6_000
  output:
    # 13,000 <= 13,500.
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2024 a married claimant's combined income is tested against the larger limit
  period: 2024
  input:
    state_code: IA
    age: 24
    age_head: 24
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 8_000
    ia_dependent_claimant_spouse_net_income: 6_000
    ia_dependent_claimant_filing_status: SEPARATE
    ia_modified_income: 6_000
  output:
    # Own 8,000 <= 9,000, but combined 14,000 > 13,500.
    ia_claimed_filer_income_disqualified: true
    ia_is_tax_exempt: false

- name: 2024 an elderly return uses the elderly limits for the claimant test
  period: 2024
  input:
    state_code: IA
    age: 66
    age_head: 66
    filing_status: SINGLE
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    ia_dependent_claimant_net_income: 20_000
    ia_dependent_claimant_spouse_net_income: 0
    ia_dependent_claimant_filing_status: SINGLE
    ia_modified_income: 20_000
  output:
    # Claimant 20,000 <= 24,000; the filer's 20,000 <= 24,000.
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2022 joint return with one claimed spouse and a high-income claimant is not exempt (the claimed spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        ia_dependent_claimant_net_income: 9_001
        ia_dependent_claimant_filing_status: SINGLE
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        ia_modified_income: 6_000
    households:
      household:
        members: [person_a, person_b]
        state_code: IA
  output:
    ia_claimed_filer_income_disqualified: true
    ia_is_tax_exempt: false

- name: 2022 joint return with one claimed spouse and a high-income claimant is not exempt (the claimed spouse is the spouse)
  period: 2022
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        ia_dependent_claimant_net_income: 9_001
        ia_dependent_claimant_filing_status: SINGLE
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        ia_modified_income: 6_000
    households:
      household:
        members: [person_b, person_a]
        state_code: IA
  output:
    ia_claimed_filer_income_disqualified: true
    ia_is_tax_exempt: false

- name: 2022 joint return with one claimed spouse and a low-income claimant stays exempt
  period: 2022
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        ia_dependent_claimant_net_income: 8_000
        ia_dependent_claimant_filing_status: SINGLE
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        ia_modified_income: 6_000
    households:
      household:
        members: [person_a, person_b]
        state_code: IA
  output:
    # 6,000 <= 13,500 joint limit, and the claimant's 8,000 <= 9,000.
    ia_claimed_filer_income_disqualified: false
    ia_is_tax_exempt: true

- name: 2022 single filer who can be claimed but is not claimed keeps the ordinary exemption
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 6000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: IA
  output:
    # The filer can be claimed but nobody claims them; this rule turns on
    # being claimed.
    # $6,000 <= $9,000 single limit.
    ia_is_tax_exempt: true

- name: 2022 joint return with one spouse who can be claimed but is not claimed is exempt (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 30
        ia_net_income: 3000
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
