- name: SSTB self-employment income is included in Iowa gross income
  period: 2024
  input:
    sstb_self_employment_income: 100_000
    state_code: IA
  output:
    ia_gross_income: 100_000

- name: Gambling winnings are Iowa gross income on the 2021 return (IA 1040 line 13).
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      parent:
        age: 40
        irs_employment_income: 60_000
        gambling_winnings: 10_000
      child:
        age: 17
        is_tax_unit_dependent: true
        gambling_winnings: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: IA
  output:
    ia_gambling_winnings: [10_000, 0]
    # The child's winnings are on the child's own return.
    ia_gross_income: [70_000, 0]

- name: Estate and trust income is included in Iowa gross income
  period: 2022
  input:
    irs_employment_income: 30_000
    estate_income: 5_000
    state_code: IA
  output:
    # 2022 IA 1040 line 10 reports federal Schedule E income, which includes
    # estates and trusts: 30,000 + 5,000.
    ia_gross_income: 35_000

- name: An estate or trust loss on federal Schedule E reduces Iowa gross income
  period: 2022
  input:
    irs_employment_income: 30_000
    estate_income: -5_000
    state_code: IA
  output:
    # Line 10 is "the income or loss from federal Schedule E": 30,000 - 5,000.
    ia_gross_income: 25_000
