- name: Joint exemption eligibility counts actual claims symmetrically for the head and spouse
  period: 2025
  input:
    people:
      claimed_head:
        age: 30
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
      unclaimed_spouse:
        age: 29
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
      unclaimed_head:
        age: 30
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
      claimed_spouse:
        age: 29
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
      neither_claimed_head:
        age: 30
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
      neither_claimed_spouse:
        age: 29
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      head_claimed:
        members: [claimed_head, unclaimed_spouse]
        filing_status: JOINT
        il_base_income: 10_000
      spouse_claimed:
        members: [unclaimed_head, claimed_spouse]
        filing_status: JOINT
        il_base_income: 10_000
      neither_claimed:
        members: [neither_claimed_head, neither_claimed_spouse]
        filing_status: JOINT
        il_base_income: 10_000
    households:
      household:
        members: [claimed_head, unclaimed_spouse, unclaimed_head, claimed_spouse, neither_claimed_head, neither_claimed_spouse]
        state_code: IL
  output:
    tax_units:
      head_claimed:
        il_personal_exemption_eligibility_status: PARTIALLY_ELIGIBLE
      spouse_claimed:
        il_personal_exemption_eligibility_status: PARTIALLY_ELIGIBLE
      neither_claimed:
        il_personal_exemption_eligibility_status: BOTH_ELIGIBLE

