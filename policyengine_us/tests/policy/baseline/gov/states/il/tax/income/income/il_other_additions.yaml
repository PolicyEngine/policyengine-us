- name: Case 1, default il_other_additions is zero
  period: 2024
  input:
    state_code: IL
  output:
    il_other_additions: 0.0

- name: Case 2, il_other_additions flows into il_base_income_additions
  period: 2024
  input:
    state_code: IL
    il_other_additions: 1_200
  output:
    il_base_income_additions: 1_200
