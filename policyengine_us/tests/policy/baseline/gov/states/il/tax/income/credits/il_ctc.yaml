- name: Illinois child credit follows dependency and age, not federal CTC child rules
  period: 2024
  input:
    people:
      head:
        age: 30
      dependent:
        age: 11
        is_tax_unit_dependent: true
        ctc_qualifying_child: false
    households:
      household:
        members: [head, dependent]
        state_code: IL
    tax_units:
      tax_unit:
        members: [head, dependent]
        il_eitc: 100
  output:
    il_ctc: 20

- name: Age-11 qualifying child dependent receives the Illinois CTC.
  period: 2024
  input:
    people:
      head:
        age: 30
      dependent:
        age: 11
        is_tax_unit_dependent: true
        is_qualifying_child_dependent: true
    households:
      household:
        members: [head, dependent]
        state_code: IL
    tax_units:
      tax_unit:
        members: [head, dependent]
        il_eitc: 100
  output:
    # IL CTC: 100 * 0.20 (20% match) = 20.
    il_ctc: 20

- name: Age-11 dependent who is not a qualifying child does not receive the Illinois CTC.
  period: 2024
  input:
    people:
      head:
        age: 30
      dependent:
        age: 11
        is_tax_unit_dependent: true
        is_qualifying_child_dependent: false
    households:
      household:
        members: [head, dependent]
        state_code: IL
    tax_units:
      tax_unit:
        members: [head, dependent]
        il_eitc: 100
  output:
    # 35 ILCS 5/212.3 ties to IRC 152(c) qualifying-child rules.
    # A dependent who is not a 152(c) qualifying child (e.g. qualifying relative)
    # does not generate the IL CTC.
    il_ctc: 0


- name: 2025 single filer who can be claimed as a dependent, no Illinois child tax credit although the filer's own EITC counts the child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 20
        employment_income: 1_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
    spm_units:
      spm_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: IL
  output:
    # The filer keeps the EITC for a qualifying child (0.34 x 1,000
    # x 20% = 68), but the credit's child must be the taxpayer's
    # dependent and a return with a claimable filer has none.
    il_eitc: 68
    il_ctc: 0

