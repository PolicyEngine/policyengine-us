- name: A claimable but unclaimed 2025 filer retains the basic exemption
  period: 2025
  input:
    age: 30
    state_code: IL
    filing_status: SINGLE
    il_base_income: 10_000
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
  output:
    il_personal_exemption: 2_850

- name: An actually claimed 2025 filer above the basic amount loses the exemption
  period: 2025
  input:
    age: 30
    state_code: IL
    filing_status: SINGLE
    il_base_income: 10_000
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: true
  output:
    il_personal_exemption: 0

- name: A claimable but unclaimed 2021 filer retains the basic exemption
  period: 2021
  input:
    age: 30
    state_code: IL
    filing_status: SINGLE
    il_base_income: 10_000
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
  output:
    il_personal_exemption: 2_375

- name: An actually claimed single filer retains one basic amount through the base-income boundary
  period: 2025
  input:
    age: 30
    state_code: IL
    filing_status: SINGLE
    il_base_income: [2_849, 2_850, 2_851]
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: true
  output:
    il_personal_exemption: [2_850, 2_850, 0]

- name: The separate AGI gate still limits total exemptions for claimable but unclaimed filers
  period: 2025
  input:
    age: 30
    state_code: IL
    filing_status: SINGLE
    il_base_income: 10_000
    adjusted_gross_income: [250_000, 250_001]
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
  output:
    il_personal_exemption: [2_850, 2_850]
    il_is_exemption_eligible: [true, false]
    il_total_exemptions: [2_850, 0]
