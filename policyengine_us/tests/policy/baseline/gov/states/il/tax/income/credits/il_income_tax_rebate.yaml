- name: 2021 single filer who can be claimed as a dependent, 2022 Illinois income tax rebate only through a spouse who is not claimed, with no dependent amount
  period: 2021
  input:
    people:
      filer:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: IL
  output:
    # Section 212.1(a): a taxpayer claimed as a dependent on another
    # return is ineligible, so the other spouse keeps the $100 joint
    # amount; the return claims no dependent (IRC 152(b)(1)).
    il_income_tax_rebate_eligible: false
    il_income_tax_rebate: 0

- name: 2021 joint return with one spouse who can be claimed as a dependent, 2022 Illinois income tax rebate only through a spouse who is not claimed, with no dependent amount (the claimable spouse is the head)
  period: 2021
  input:
    people:
      person_a:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: IL
  output:
    il_income_tax_rebate_eligible: true
    il_income_tax_rebate: 100

