- name: Illinois EITC childless filer age 18 qualifies for the state EITC
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 18
        employment_income: 8_000
        is_tax_unit_head: true
        has_tin: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IL
  output:
    # 35 ILCS 5/212 (P.A. 102-0700) - IL EITC childless minimum age is 18
    # from 2023 onward; age 18 single filer with earned income qualifies.
    il_eitc: 122.4

- name: Illinois EITC childless filer age 17 does not qualify
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 17
        employment_income: 8_000
        is_tax_unit_head: true
        has_tin: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IL
  output:
    # Below the IL childless minimum age of 18; not eligible.
    il_eitc: 0

- name: Illinois EITC counts a disabled adult dependent as a qualifying child (IRC 152(c)(3)(B))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_adult:
        age: 29
        is_tax_unit_dependent: true
        is_permanently_and_totally_disabled: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_adult]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_adult]
    households:
      household:
        members: [head, disabled_adult]
        state_code: IL
  output:
    # The permanently and totally disabled adult dependent is a qualifying
    # child under IRC 152(c)(3)(B), so the IL EIC reflects the 1-child federal
    # EITC (rather than the childless schedule) times the IL match.
    il_eitc: 680

- name: Illinois EITC uses the childless schedule for a disabled parent dependent (IRC 152(c)(2))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_parent:
        age: 75
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        is_parent_of_filer_or_spouse: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_parent]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_parent]
    households:
      household:
        members: [head, disabled_parent]
        state_code: IL
  output:
    # A parent fails the IRC 152(c)(2) relationship test: 20% x the childless
    # federal-like credit of 649.
    il_eitc: 129.8


- name: 2025 single filer who can be claimed as a dependent, no Illinois EITC without a qualifying child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 30
        employment_income: 1_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    spm_units:
      spm_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: IL
  output:
    # The age and ITIN extensions keep the IRC 32(c)(1)(A)(ii)(III)
    # bar on a childless filer who can be claimed.
    il_eitc: 0

