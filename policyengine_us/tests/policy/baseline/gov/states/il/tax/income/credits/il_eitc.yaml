- name: IL EIC for a 65+ couple nets a self-employment loss, 2023 (20% x 7.65% x 5,000)
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 65
        self_employment_income: -2_000
        is_tax_unit_head: true
      spouse:
        age: 65
        employment_income: 7_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: IL
  output:
    # 35 ILCS 5/212(b-10) waives the federal age limit for filers 65 or older.
    # Earned income is $7,000 - $2,000 = $5,000, so the childless credit is
    # 7.65% x 5,000 = 382.50 and the IL EIC is 20% of it.
    il_eitc: 76.5

- name: Illinois EITC uses the childless schedule for a disabled parent dependent (IRC 152(c)(2))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_parent:
        age: 75
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        is_parent_of_filer_or_spouse: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_parent]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_parent]
    households:
      household:
        members: [head, disabled_parent]
        state_code: IL
  output:
    # A parent fails the IRC 152(c)(2) relationship test: 20% x the childless
    # federal-like credit of 649.
    il_eitc: 129.8
