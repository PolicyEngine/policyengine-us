- name: Illinois EITC counts a disabled adult dependent as a qualifying child (IRC 152(c)(3)(B))
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 10_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      disabled_adult:
        age: 29
        is_tax_unit_dependent: true
        is_permanently_and_totally_disabled: true
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [head, disabled_adult]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, disabled_adult]
    households:
      household:
        members: [head, disabled_adult]
        state_code: IL
  output:
    # The permanently and totally disabled adult dependent is a qualifying
    # child under IRC 152(c)(3)(B), so the IL EIC reflects the 1-child federal
    # EITC (rather than the childless schedule) times the IL match.
    il_eitc: 680

- name: IL EIC nets a spouse's self-employment loss, 2021 (18% x 2,400)
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        is_tax_unit_head: true
      spouse:
        age: 40
        self_employment_income: -4_000
        is_tax_unit_spouse: true
      child1:
        age: 7
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
    spm_units:
      spm_unit:
        members: [head, spouse, child1, child2]
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: IL
  output:
    # The spouse's $4,000 self-employment loss offsets the head's $10,000 of
    # wages, so federal earned income is $6,000 (Form 1040 EIC Worksheet B,
    # line 4b, combines both spouses' amounts on a joint return).
    il_eitc: 432

