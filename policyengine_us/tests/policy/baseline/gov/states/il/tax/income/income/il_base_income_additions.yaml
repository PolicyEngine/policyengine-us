    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 60_000
        tax_exempt_interest_income: 300
      child:
        age: 10
        tax_exempt_interest_income: 5_000
    household:
      state_code: IL
  output:
    il_base_income_additions: 300
