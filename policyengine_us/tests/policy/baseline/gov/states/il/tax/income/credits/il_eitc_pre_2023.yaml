- name: Childless filer aged 40 in 2022 gets 18% of the federal EITC
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 5_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IL
  output:
    # Federal EITC is 7.65% x 5,000 = 382.50; 18% of it is 68.85.
    il_eitc: 68.85

- name: Childless filer aged 70 in 2023 gets the expanded IL EIC
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        employment_income: 5_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IL
  output:
    # 35 ILCS 5/212(b-10): 20% of the credit without the federal age limit,
    # 20% x 7.65% x 5,000 = 76.50.
    il_eitc: 76.5
