- name: Childless filer aged 18 in 2021 gets no IL EIC (federal EITC is 0)
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 18
        employment_income: 5_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: IL
  output:
    # The 2021 federal minimum age for a childless filer is 19, so the federal
    # EITC is 0 and Schedule IL-E/EIC line 6 is 18% of 0.
    il_eitc: 0

