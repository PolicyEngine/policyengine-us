# Illinois subtracts retirement income only to the extent it is included in
# the taxpayer's federal AGI (35 ILCS 5/203(a)(2); IL-1040 Line 5). A tax-unit
# dependent's income is not in the filer's federal AGI, so it is not
# subtracted on the filer's return.

- name: A dependent child's public pension is not subtracted from the filer's base income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
      child:
        age: 10
        is_tax_unit_dependent: true
        taxable_public_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: IL
  output:
    adjusted_gross_income: 50_000
    il_base_income_subtractions: 0
    il_base_income: 50_000
    # Exemptions: 2,850 personal + 2,850 dependent = 5,700.
    il_taxable_income: 44_300
    # 44,300 * 4.95% = 2,192.85
    il_income_tax_before_non_refundable_credits: 2_192.85

- name: A dependent child's other retirement income, Roth conversions and state tax refund are not subtracted.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
      child:
        age: 16
        is_tax_unit_dependent: true
        taxable_private_pension_income: 1_000
        taxable_ira_distributions: 2_000
        taxable_401k_distributions: 3_000
        taxable_403b_distributions: 4_000
        taxable_sep_distributions: 5_000
        keogh_distributions: 500
        taxable_roth_conversions: 6_000
        salt_refund_income: 700
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: IL
  output:
    adjusted_gross_income: 50_000
    il_base_income_subtractions: 0
    il_base_income: 50_000

- name: Only the head's and spouse's retirement income is subtracted when a dependent also has retirement income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        employment_income: 50_000
        taxable_private_pension_income: 20_000
      spouse:
        age: 68
        taxable_ira_distributions: 5_000
      child:
        age: 16
        is_tax_unit_dependent: true
        taxable_public_pension_income: 10_000
        taxable_401k_distributions: 3_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
        state_code: IL
  output:
    adjusted_gross_income: 75_000
    # 20,000 head pension + 5,000 spouse IRA distributions.
    il_base_income_subtractions: 25_000
    il_base_income: 50_000
    # Exemptions: 2 * 2,850 personal + 2,850 dependent + 2 * 1,000 aged = 10,550.
    il_taxable_income: 39_450
    # 39,450 * 4.95% = 1,952.775
    il_income_tax_before_non_refundable_credits: 1_952.78

- name: The spouse's own retirement income is subtracted when the dependent has none.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 40_000
      spouse:
        age: 44
        taxable_public_pension_income: 8_000
        taxable_roth_conversions: 2_000
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
        state_code: IL
  output:
    adjusted_gross_income: 50_000
    il_base_income_subtractions: 10_000
    il_base_income: 40_000
