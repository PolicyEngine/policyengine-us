- name: Case 1, premium with only earned income.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    state_code: IL
    il_hbwd_eligible: true
    il_hbwd_countable_earned_income: 2_000
    il_hbwd_countable_unearned_income: 0
  output:
    il_hbwd_premium: 44
    # Earned $2,000 → 1751-2000 band → $44
    # Unearned $0 → 0-250 band → $0
    # Total: $44

- name: Case 2, premium with earned and unearned.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    state_code: IL
    il_hbwd_eligible: true
    il_hbwd_countable_earned_income: 1_000
    il_hbwd_countable_unearned_income: 1_200
  output:
    il_hbwd_premium: 94
    # Earned $1,000 → 751-1000 band → $19
    # Unearned $1,200 → 1001-1250 band → $75
    # Total: $19 + $75 = $94

- name: Case 3, premium with higher income.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    state_code: IL
    il_hbwd_eligible: true
    il_hbwd_countable_earned_income: 3_000
    il_hbwd_countable_unearned_income: 2_000
  output:
    il_hbwd_premium: 200
    # Earned $3,000 → 2751-3000 band → $69
    # Unearned $2,000 → 1751-2000 band → $131
    # Total: $69 + $131 = $200

- name: Case 4, premium capped at $500.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    state_code: IL
    il_hbwd_eligible: true
    il_hbwd_countable_earned_income: 5_001
    il_hbwd_countable_unearned_income: 5_001
  output:
    il_hbwd_premium: 500
    # Earned above $5,000 → 5000+ band → $125
    # Unearned above $5,000 → 5000+ band → $375
    # Total: $500, the chart's highest premium

