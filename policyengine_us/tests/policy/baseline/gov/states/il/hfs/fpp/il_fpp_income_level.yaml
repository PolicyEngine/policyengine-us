# IL FPP uses applicant's income only with fixed household size of 2
# 2024 FPL for household size 2 in contiguous US: $15,060 + $5,380 = $20,440

- name: Case 1, income at 100% FPL.
  period: 2024
  input:
    state_code: IL
    adjusted_gross_income_person: 20_440
  output:
    il_fpp_income_level: 1.0

- name: Case 2, income at 213% FPL.
  period: 2024
  input:
    state_code: IL
    adjusted_gross_income_person: 43_537
  output:
    # 43,537 / 20,440 = 2.13
    il_fpp_income_level: 2.13

- name: Case 3, zero income.
  period: 2024
  input:
    state_code: IL
    adjusted_gross_income_person: 0
  output:
    il_fpp_income_level: 0

- name: Only the applicant's own deductions lower the applicant's income.
  period: 2024
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 30
        employment_income: 30_000
        traditional_ira_contributions: 6_000
      spouse:
        age: 30
        employment_income: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: IL
  output:
    # Before: [27_000, 17_000].
    adjusted_gross_income_person: [24_000, 20_000]
    il_fpp_income_level: [1.1742, 0.9785]
