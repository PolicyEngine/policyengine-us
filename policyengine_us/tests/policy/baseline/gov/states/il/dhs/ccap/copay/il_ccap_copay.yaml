# Cases 19-21 pin the Table A vintage against a live federal poverty guideline.
# The copayment schedule is frozen each July while the guideline re-bases each
# January, so between January and June a family can sit above the in-force
# chart's minimum-copayment band while still falling under the current calendar
# year's poverty guideline. These cases assert the chart, not the guideline, and
# deliberately leave spm_unit_fpg unset so the real value applies. They run a
# whole-year period and key the assertion to March, because a non-January month
# period does not accept scalar inputs.

- name: Case 19, family size two above the 2025 chart minimum band in March 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    # $1,790 a month; the 2026 guideline for two people is $1,803.33 a month.
    il_ccap_countable_income: 21_480
    spm_unit_size: 2
    il_ccap_eligible: true
    state_code: IL
  output:
    # In-force 2025 table charges $18 from $1,764.
    il_ccap_copay:
      2026-03: 18

- name: Case 20, family size five above the 2025 chart minimum band in March 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    # $3,200 a month; the 2026 guideline for five people is $3,223.33 a month.
    il_ccap_countable_income: 38_400
    spm_unit_size: 5
    il_ccap_eligible: true
    state_code: IL
  output:
    # In-force 2025 table charges $31 from $3,139.
    il_ccap_copay:
      2026-03: 31

