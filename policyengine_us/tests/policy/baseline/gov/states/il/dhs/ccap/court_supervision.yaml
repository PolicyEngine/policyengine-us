# Illinois's approved CCDF Plan 2.2.1(c) (p.18) extends eligibility through
# age 18 for a child under court supervision.
- name: Case 1, court supervision extends the age limit through 18.
  period: 2026-01
  input:
    state_code: [IL, IL, IL, IL, IL]
    age: [12, 13, 17, 18, 19]
    is_tax_unit_dependent: [true, true, true, true, true]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [false, false, false, false, false]
    is_under_court_supervision: [true, true, true, true, true]
  output:
    il_ccap_eligible_child: [true, true, true, true, false]

- name: Case 2, without court supervision the ordinary under-13 limit applies.
  period: 2026-01
  input:
    state_code: [IL, IL]
    age: [12, 13]
    is_tax_unit_dependent: [true, true]
    immigration_status: [CITIZEN, CITIZEN]
    is_disabled: [false, false]
    is_under_court_supervision: [false, false]
  output:
    il_ccap_eligible_child: [true, false]

- name: Case 3, court supervision does not replace the dependency requirement.
  period: 2026-01
  input:
    state_code: IL
    age: 15
    is_tax_unit_dependent: false
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    il_ccap_eligible_child: false
