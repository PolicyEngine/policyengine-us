- name: Case 1, no asset, eligible.  
  period: 2022-01
  input:
    il_aabd_countable_assets: 0
    spm_unit_size: 2
    state_code: IL
  output:
    il_aabd_asset_value_eligible: true

- name: Case 2, some asset, eligible.
  period: 2022-01
  input:
    il_aabd_countable_assets: 3_000
    spm_unit_size: 2
    state_code: IL
  output:
    il_aabd_asset_value_eligible: true

- name: Case 3, too much asset, ineligible.
  period: 2022-01
  input:
    il_aabd_countable_assets: 2_001
    spm_unit_size: 1
    state_code: IL
  output:
    il_aabd_asset_value_eligible: false

- name: Case 4, some asset, eligible.
  period: 2022-01
  input:
    il_aabd_countable_assets: 3_050
    spm_unit_size: 3
    state_code: IL
  output:
    il_aabd_asset_value_eligible: true

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: IL
  output:
    il_aabd_asset_value_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: IL
  output:
    il_aabd_asset_value_eligible: false
