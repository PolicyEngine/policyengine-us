# Historical schedule component fixtures explicitly open the payment gate.
# That override exercises the published rate table only; it does not assert
# that the baseline model pays historical CCAP benefits before July 2025.
# IDHS Policy 06.05.01, July 1, 2021, Group 1A licensed home, age 3+:
# https://www.dhs.state.il.us/page.aspx?item=106228
- name: Case 24, historical 2021 July licensed home rate with an explicit component-only gate override.
  period: 2021-07
  input:
    gov.states.il.dhs.ccap.in_effect: true
    people:
      person1:
        age: {2021: 30}
        employment_income: {2021: 24_000}
      person2:
        age: {2021: 3}
        is_tax_unit_dependent: {2021: true}
        childcare_provider_type_group: {2021: FDC_GFDC}
        childcare_hours_per_day: {2021: 8}
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: {2021: IL}
        county_str: {2021: COOK_COUNTY_IL}
  output:
    il_ccap_eligible_child: [false, true]
    il_ccap_county_group: GROUP_1A
    il_ccap_child_age_group: [AGE_THREE_OR_OLDER, AGE_THREE_OR_OLDER]
    il_ccap_care_duration: [NONE, FULL_DAY]
    il_ccap_max_daily_rate: [0, 35.08]

