# IDHS October 1, 2019 announcement: a family of three can apply with
# annual income up to $42,660, or $3,555 monthly, at 200% FPL.
- name: Case 12, October 2019 new applicant one cent above the published limit.
  period: 2019-10
  input:
    people:
      person1:
        age: {2019: 30}
        employment_income: {2019: 42_660.12}
      person2:
        age: {2019: 3}
      person3:
        age: {2019: 5}
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        il_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: {2019: IL}
  output:
    il_ccap_income_eligible: false

