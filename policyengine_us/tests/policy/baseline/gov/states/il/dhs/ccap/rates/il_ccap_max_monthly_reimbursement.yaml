        il_ccap_max_daily_rate: 10
        il_ccap_provider_type: LICENSED_HOME
        childcare_attending_days_per_month: 20
        il_ccap_approved_eligible_days_per_month: 20
      person2:
        il_ccap_eligible_child: true
        il_ccap_max_daily_rate: 10
        il_ccap_provider_type: LICENSED_HOME
        childcare_attending_days_per_month: 0
        il_ccap_approved_eligible_days_per_month: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: IL
  output:
    il_ccap_max_monthly_reimbursement: [200, 0]

