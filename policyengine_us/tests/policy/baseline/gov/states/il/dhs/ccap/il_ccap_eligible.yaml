    il_ccap_parent_meets_working_requirements: true
    state_code: IL
  output:
    il_ccap_eligible: true

- name: Ineligible family due to income.
  period: 2023
  input:
    il_ccap_eligible_child: true
    il_ccap_income_eligible: false
    il_ccap_parent_meets_working_requirements: true
    state_code: IL
  output:
