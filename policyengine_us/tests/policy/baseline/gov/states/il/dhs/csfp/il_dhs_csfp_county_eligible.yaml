- name: Case 1, Illinois household in Cook County served by the Greater Chicago Food Depository.
  period: 2025
  input:
    people:
      person1:
        age: 65
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
        county_str: COOK_COUNTY_IL
  output:
    il_dhs_csfp_county_eligible: true

