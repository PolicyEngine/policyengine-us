# Tests for il_scretd_household_income
# 320 ILCS 30/2(h): household income has the meaning in the Senior Citizens
# and Persons with Disabilities Property Tax Relief Act. 320 ILCS 25/3.06:
# the combined income of the household, the claimant and spouse (3.05).
# 320 ILCS 25/3.07: federal adjusted gross income plus (A) interest and
# dividends, (C) annuities, (D) Social Security Act benefits, (E) Railroad
# Retirement Act benefits, (F) cash public assistance and (H) workers'
# compensation, to the extent left out of adjusted gross income.
# Form IL-1017 (R-11/25), Worksheet A, PDF page 2.

- name: All Social Security benefits count, not only the taxable part.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 30_000
        social_security_retirement: 60_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    # 3.07(D) adds "the amount of benefits paid under the Federal Social
    # Security Act" left out of AGI; IL-1017 line 1.
    # Taxable Social Security: provisional income 30,000 + 60,000 / 2 =
    # 60,000; 4,500 (half of 9,000) + 85% x (60,000 - 34,000) = 26,600.
    # AGI = 30,000 + 26,600 = 56,600.
    # Household income = 56,600 + (60,000 - 26,600) = 90,000.
    il_scretd_household_income: 90_000

- name: Adjusted gross income is the base, so above-the-line deductions and a capital loss reduce income.
  period: 2025
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 40_000
        early_withdrawal_penalty: 1_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    # 3.07 starts from adjusted gross income. IL-1017 line 10 counts a net
    # capital loss and line 13 subtracts the adjustments to income.
    # AGI = 40,000 - 2,000 capital loss - 1,000 penalty = 37,000.
    il_scretd_household_income: 37_000

- name: Each amount section 3.07 adds back counts.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        tax_exempt_public_pension_income: 2_000
        tax_exempt_interest_income: 1_000
        taxable_interest_income: 500
        us_bonds_for_higher_ed: 500
        ssi: 5_000
        railroad_benefits: 3_000
        il_aabd_person: 1_200
        general_assistance: 600
        workers_compensation: 4_000
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
        tanf: 2_400
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    # AGI = 20,000 pension + 500 interest - 500 savings bond interest
    # excluded under IRC 135 = 20,000.
    # (A) tax-exempt interest 1,000 + excluded savings bond interest 500.
    # (C) nontaxable part of the pension 2,000.
    # (D) SSI 5,000. (E) railroad retirement 3,000.
    # (F) AABD 1,200 + general assistance 600 + TANF 2,400.
    # (H) workers' compensation 4,000.
    # Household income = 20,000 + 1,500 + 2,000 + 5,000 + 3,000 + 4,200
    # + 4,000 = 39,700.
    il_scretd_household_income: 39_700

- name: The spouse's income counts and a dependent's income does not.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 30_000
      person2:
        age: 68
        social_security_retirement: 12_000
      person3:
        age: 16
        tax_exempt_interest_income: 1_000
        ssi: 6_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        # Zero so the case shows only whose income counts.
        tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: IL
  output:
    # 3.05 and 3.06: household income is the combined income of the
    # claimant and spouse. IL-1017 Worksheet A: "Include both applicant's
    # and spouse's income."
    # AGI plus the spouse's nontaxable Social Security is the pension plus
    # all of the spouse's benefits: 30,000 + 12,000 = 42,000.
    # The 16-year-old dependent's 1,000 of interest and 6,000 of SSI are
    # the dependent's own income.
    il_scretd_household_income: 42_000
