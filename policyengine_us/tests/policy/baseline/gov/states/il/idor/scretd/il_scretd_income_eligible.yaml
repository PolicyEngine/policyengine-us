# Edge case: Zero income
- name: Case 9, zero income is eligible.
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 0
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    # Income check: 0 <= 65,000 = true
    il_scretd_income_eligible: true

# Edge case: Income exactly $1 above 2024 limit
- name: Case 10, income one dollar above 2024 limit.
  period: 2024
  input:
    people:
      person1:
