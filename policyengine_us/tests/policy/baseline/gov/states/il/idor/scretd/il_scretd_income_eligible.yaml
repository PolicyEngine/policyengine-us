# Tests for il_scretd_income_eligible variable
# Household income (il_scretd_household_income, 320 ILCS 25/3.07) is no
# greater than the maximum household income, which varies by year:
# - 2024: $65,000
# - 2025: $75,000
# - 2026: $77,000
# - 2027+: $79,000
# Source: 320 ILCS 30/2(a)(iii) and (j), SB1821

- name: Case 1, income below 2024 limit.
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    il_scretd_income_eligible: true

- name: Case 2, income at 2024 limit.
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 65_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    il_scretd_income_eligible: true

- name: Case 3, income above 2024 limit.
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 66_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: IL
  output:
    il_scretd_income_eligible: false

