- name: Case 20, mixed vocabularies, the deprecated state override moves only the matrix row.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        irs_gross_income: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
