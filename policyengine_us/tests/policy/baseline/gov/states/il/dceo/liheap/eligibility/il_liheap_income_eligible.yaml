- name: Single person below 60% SMI is eligible
  period: 2024
  input:
    state_code: IL
    irs_gross_income: 25_000
    # smi and fpg computed automatically from household size
  output:
    il_liheap_income_eligible: true

- name: Single person above 60% SMI but below 200% FPG is eligible
  period: 2024
  input:
    state_code: IL
    irs_gross_income: 28_000  
    # Person below 200% FPG so should be eligible
  output:
    il_liheap_income_eligible: true

- name: Family of 4 below income limits is eligible
  period: 2024
  input:
    people:
      parent1:
        irs_gross_income: 30_000
      parent2:
        irs_gross_income: 15_000
      child1:
        age: 10
      child2:
        age: 5
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: IL
    # smi and fpg computed automatically from spm_unit_size
  output:
    il_liheap_income_eligible: true

- name: High income household not eligible
  period: 2024
  input:
    state_code: IL
    irs_gross_income: 100_000
    # High income above both limits
  output:
    il_liheap_income_eligible: false

- name: Income exactly at 200% FPG is eligible
  period: 2024
  input:
    state_code: IL
    irs_gross_income: 30_120  # Exactly 200% of FPG
    # Exactly at 200% FPG limit
  output:
    il_liheap_income_eligible: true

# DCEO PY2027 size-one state limit = 3 * 2026 FPG 15,960 = 47,880.
- name: Case 6, all five named utility routes allow the published state-funded income boundary.
  period: 2027
  input:
    state_code: [IL, IL, IL, IL, IL, IL, IL]
    spm_unit_size: [1, 1, 1, 1, 1, 1, 1]
    il_liheap_electricity_provider: [AMEREN_ILLINOIS, COMED, OTHER, OTHER, OTHER, OTHER, COMED]
    il_liheap_natural_gas_provider: [OTHER, OTHER, NICOR_GAS, NORTH_SHORE_GAS, PEOPLES_GAS, AMEREN_ILLINOIS,
      OTHER]
    irs_gross_income: [47_880, 47_880, 47_880, 47_880, 47_880, 47_880, 47_881]
  output:
    il_liheap_income_eligible: [true, true, true, true, true, true, false]

# PY2027 final matrix "151% TO 60% SMI" monthly tops times 12: one person
# 3,441 -> 41,292; eight 9,132 -> 109,584; twelve 9,926 -> 119,112. Above
# twelve members the limit is 150% of the 2026 guideline: 1.5 * 84,120 = 126,180.
- name: Case 7, federal income limit matches the published monthly rows on both sides of the boundary.
  period: 2027
  input:
    state_code: [IL, IL, IL, IL, IL, IL, IL, IL]
    spm_unit_size: [1, 1, 8, 8, 12, 12, 13, 13]
    il_liheap_electricity_provider: [OTHER, OTHER, OTHER, OTHER, OTHER, OTHER, OTHER, OTHER]
    il_liheap_natural_gas_provider: [OTHER, OTHER, OTHER, OTHER, OTHER, OTHER, OTHER, OTHER]
    irs_gross_income: [41_292, 41_293, 109_584, 109_585, 119_112, 119_113, 126_180, 126_181]
  output:
    il_liheap_income_eligible: [true, false, true, false, true, false, true, false]

# An unreported company counts as one of the five state-funded utilities, so
# only a household reporting OTHER for both companies uses the federal limit.
# PY2027 size-one limits: state 3 * 15,960 = 47,880; federal 41,292.
- name: Case 8, unreported companies use the state-funded limit unless both are reported as other.
  period: 2027
  input:
    state_code: [IL, IL, IL, IL, IL]
    spm_unit_size: [1, 1, 1, 1, 1]
    il_liheap_electricity_provider: [UNSPECIFIED, UNSPECIFIED, OTHER, UNSPECIFIED, OTHER]
    il_liheap_natural_gas_provider: [UNSPECIFIED, UNSPECIFIED, UNSPECIFIED, OTHER, OTHER]
    irs_gross_income: [47_880, 47_881, 47_880, 47_880, 47_880]
  output:
    il_liheap_income_eligible: [true, false, true, true, false]

# The PY2027 chart prints no cash row in its "60% SMI to 300% FPL" block, so a
# household with heat included in rent keeps the federal limit even when no
# company is reported. One person: federal 3,441 * 12 = 41,292; state-funded
# 3 * 15,960 = 47,880. The third household pays its own gas heat.
- name: Case 9, heat-in-rent household with no reported company keeps the federal income limit.
  period: 2027
  input:
    state_code: [IL, IL, IL]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heat_expense_included_in_rent: [true, true, false]
    irs_gross_income: [45_000, 41_292, 45_000]
  output:
    il_liheap_income_eligible: [false, true, true]

# Model year 2026 predates the provider limits, so the limit does not read the
# companies. One person: 60% SMI = 128,140 * 0.52 * 0.6 = 39,979.68, above
# 200% of the 2026 guideline (2 * 15,960 = 31,920), so 45,000 is over the
# limit for both households. The 300% state-funded limit is not yet in effect;
# it would admit the unreported household (3 * 15,650 = 46,950).
- name: Case 10, model year 2026 income limit does not depend on the reported companies.
  period: 2026
  input:
    state_code: [IL, IL]
    spm_unit_size: [1, 1]
    il_liheap_electricity_provider: [OTHER, UNSPECIFIED]
    il_liheap_natural_gas_provider: [OTHER, UNSPECIFIED]
    irs_gross_income: [45_000, 45_000]
  output:
    il_liheap_income_eligible: [false, false]
