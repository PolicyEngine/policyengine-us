- name: Widowed single filer gets only the single personal exemption
  period: 2024
  input:
    people:
      person1:
        age: 62
        employment_income: 45_000
        is_tax_unit_head: true
        is_surviving_spouse: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: LA
  output:
    # Former R.S. 47:294(A): $4,500 for a single individual; no extra amount for a widow(er).
    la_exemptions: 4_500

- name: Qualifying surviving spouse with one dependent claims three exemptions
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 30_000
        is_tax_unit_head: true
        is_surviving_spouse: true
      person2:
        age: 15
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        members: [person1, person2]
        state_code: LA
  output:
    # $9,000 covers the Yourself and Qualifying Surviving Spouse boxes on Line 6A,
    # plus $1,000 for the dependent (2024 IT-540 tax table, column 3).
    la_exemptions: 10_000
    # Joint brackets: 1.85% x $25,000 + 3.5% x $5,000 = $637.50,
    # less 1.85% x $10,000 exemptions = $185, gives $452.50.
    la_income_tax_before_non_refundable_credits: 452.5

- name: Widowed parent claimed as a dependent adds only the dependent exemption
  period: 2024
  input:
    people:
      person1:
        age: 50
        employment_income: 60_000
        is_tax_unit_head: true
      person2:
        age: 80
        is_tax_unit_dependent: true
        is_surviving_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, person2]
        state_code: LA
  output:
    # $9,000 for head of household plus $1,000 for one dependent.
    la_exemptions: 10_000
