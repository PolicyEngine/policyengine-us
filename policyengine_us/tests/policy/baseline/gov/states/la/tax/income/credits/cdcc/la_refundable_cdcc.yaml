- name: Match of 50%
  period: 2007
  input:
    adjusted_gross_income: 25_000
    cdcc_potential: 1_000
    state_code: LA
  output:
    la_refundable_cdcc: 500

- name: AGI ineligible
  period: 2007
  input:
    adjusted_gross_income: 25_001
    cdcc_potential: 1_000
    state_code: LA
  output:
    la_refundable_cdcc: 0

- name: Match of 25% pre 2007
  period: 2006
  input:
    adjusted_gross_income: 24_999
    cdcc_potential: 1_000
    state_code: LA
  output:
    la_refundable_cdcc: 250


- name: 2024 single filer who can be claimed as a dependent gets no refundable child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: LA
  output:
    # IRC 21(b)(1)(A) needs a dependent; IRC 152(b)(1) leaves none.
    la_refundable_cdcc: 0

- name: 2024 single filer who cannot be claimed gets the refundable child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: LA
  output:
    # $1,000 x .35 = $350; AGI $10,000 <= $25,000: x .50 = $175.
    la_refundable_cdcc: 175

- name: 2024 joint return with one claimable spouse gets no refundable child care credit (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: LA
  output:
    # Either spouse being claimable leaves the return no dependents.
    la_refundable_cdcc: 0

