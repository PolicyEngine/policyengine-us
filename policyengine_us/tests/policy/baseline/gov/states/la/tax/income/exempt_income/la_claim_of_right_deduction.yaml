# Louisiana Revenue Ruling No. 04-002: individual taxpayers who use the
# federal credit under 26 U.S.C. 1341 "may file their tax returns for the
# same period that the credit is taken on the federal return and use
# Schedule E to deduct the amount of repayment." Under the federal deduction
# "no special adjustment is necessary on the Louisiana return."
- name: Case 1, the deduction is the amount repaid under the federal credit method.
  period: 2025
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income: 60_000
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: true
    state_code: LA
  output:
    la_claim_of_right_deduction: 10_000
    la_agi_exempt_income: 10_000
    la_agi: 50_000

- name: Case 2, no deduction under the federal deduction method.
  period: 2025
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income: 60_000
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: false
    state_code: LA
  output:
    la_claim_of_right_deduction: 0
    la_agi: 60_000

- name: Case 3, a joint return deducts the spouses' repayments, not a dependent's.
  period: 2025
  input:
    people:
      person1:
        age: 45
        claim_of_right_repayment: 6_000
      person2:
        age: 44
        claim_of_right_repayment: 2_000
      person3:
        age: 30
        is_tax_unit_dependent: true
        claim_of_right_repayment: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        claim_of_right_credit_applies: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: LA
  output:
    la_claim_of_right_deduction: 8_000

- name: Case 4, no deduction outside Louisiana.
  period: 2025
  input:
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: true
    state_code: MS
  output:
    la_claim_of_right_deduction: 0

- name: Case 5, in 2021 the deduction joins the Schedule E total that the federal tax allocation reduces.
  # 2021 Schedule E, lines 4H to 4K: exempt income of 20,000 is the 10,000
  # repaid plus 10,000 of taxable Social Security. With no federal tax
  # deduction the reduction is 25 percent of the amount over 15,000, so
  # 20,000 - 1,250 = 18,750.
  period: 2021
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income: 80_000
    taxable_social_security: 10_000
    claim_of_right_repayment: 10_000
    claim_of_right_credit_applies: true
    la_federal_tax_deduction: 0
    state_code: LA
  output:
    la_claim_of_right_deduction: 10_000
    la_agi_exempt_income: 18_750

- name: Case 6, the model derives the federal method before deducting.
  # No other income: federal tax under section 1341(a)(5) is 0 - 2,200 and
  # under (a)(4) is 0, so the filer uses the federal credit and deducts the
  # 10,000 dollars repaid.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    claim_of_right_repayment: 10_000
    claim_of_right_prior_year_tax_decrease: 2_200
    state_code: LA
  output:
    claim_of_right_credit_applies: true
    la_claim_of_right_deduction: 10_000

- name: Case 7, a repayment of 3,000 dollars or less is not deducted.
  # The ruling covers repayments over 3,000 dollars; section 1341 does not
  # apply below that, so there is no federal credit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    claim_of_right_repayment: 3_000
    claim_of_right_prior_year_tax_decrease: 2_200
    state_code: LA
  output:
    claim_of_right_credit_applies: false
    la_claim_of_right_deduction: 0
