- name: 2021 claimable filer keeps personal and dependent exemptions under the filing exception
  period: 2021
  input:
    people:
      filer:
        age: 20
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: LA
  output:
    # 2021 IT-540 instructions, PDF p. 3, Lines 6A and 6C:
    # https://dam.ldr.la.gov/taxforms/IT540i(2021)%20Instructions.pdf#page=3
    # RR 18-001, PDF p. 2, quotes pre-2025 R.S. 47:294(A) and (B):
    # https://dam.ldr.la.gov/lawspolicies/RR%2018-001%20Personal%20Exemptions.pdf#page=2
    # LDR counts the filer on Line 6A and the federal dependent on Line 6C.
    # (1 filer + 1 child - 1 personal allowance) * $1,000 = $1,000.
    # $4,500 personal + $1,000 dependent + $0 blind + $0 aged = $5,500.
    la_personal_exemption: 4_500
    la_dependents_exemption: 1_000
    la_exemptions: 5_500

