- name: A Louisiana family keeps its credit beside a New York adult
  period: 2026
  input:
    people:
      parent:
        la_school_readiness_credit_eligible_child: false
      child:
        la_school_readiness_credit_eligible_child: true
        la_quality_rating_of_child_care_facility: 5
      other_adult:
        la_school_readiness_credit_eligible_child: false
    tax_units:
      family:
        members: [parent, child]
        la_refundable_cdcc: 50
        la_non_refundable_cdcc: 0
        la_school_readiness_credit_refundable_eligible: true
      other_tax_unit:
        members: [other_adult]
        la_refundable_cdcc: 0
        la_non_refundable_cdcc: 0
    households:
      family_home:
        members: [parent, child]
        state_code: LA
      other_home:
        members: [other_adult]
        state_code: NY
  output:
    # The Louisiana parent keeps $50 * 2 = $100; the New York adult gets $0.
    la_school_readiness_credit: [100, 0]
    la_school_readiness_credit_refundable: [100, 0]
    la_school_readiness_credit_non_refundable: [0, 0]

