- name: A Louisiana parent claims the credit for one child attending a five-star facility
  period: 2026
  input:
    people:
      parent:
        la_school_readiness_credit_eligible_child: false
      child:
        la_school_readiness_credit_eligible_child: true
        la_quality_rating_of_child_care_facility: 5
    tax_units:
      family:
        members: [parent, child]
        la_refundable_cdcc: 50
        la_non_refundable_cdcc: 0
        la_school_readiness_credit_refundable_eligible: true
    households:
      family_home:
        members: [parent, child]
        state_code: LA
  output:
    # The five-star rate gives the parent $50 * 2 = $100.
    la_school_readiness_credit: 100
    la_school_readiness_credit_refundable: 100
    la_school_readiness_credit_non_refundable: 0

