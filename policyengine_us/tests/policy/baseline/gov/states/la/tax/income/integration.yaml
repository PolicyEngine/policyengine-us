- name: 2026 single filer standard deduction follows RIB 26-019
  period: 2026
  input:
    state_code: LA
    filing_status: SINGLE
    la_agi: 40_000
    tax_unit_itemizes: false
    la_federal_tax_deduction: 0
    la_non_refundable_credits: 0
  output:
    la_standard_deduction: 12_838
    # 40,000 - 12,838
    la_taxable_income: 27_162
    # 27,162 * 3%
    la_income_tax_before_refundable_credits: 814.86

# The cases below mirror the Axiom companion tests proposed in
# TheAxiomFoundation/rulespec-us#1493, with expectations from the same
# ground truth: LDR Revenue Information Bulletin 26-019's 2026 amounts
# ($12,838 / $25,676 standard deduction, $12,324 retirement exemption) and
# R.S. 47:32(A)'s 3% rate.
# --- Standard deduction end to end from federal AGI (Axiom: *_federal_agi_50000_end_to_end_*) ---
- name: 2026 single, federal AGI 50,000, RIB 26-019 end to end
  period: 2026
  input:
    state_code: LA
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    tax_unit_itemizes: false
  output:
    la_agi: 50_000
    la_standard_deduction: 12_838
    # 50,000 - 12,838
    la_taxable_income: 37_162
    # 37,162 x 0.03
    la_income_tax_before_non_refundable_credits: 1_114.86

- name: 2026 married filing separately, federal AGI 50,000, RIB 26-019 end to end
  period: 2026
  input:
    state_code: LA
    filing_status: SEPARATE
    adjusted_gross_income: 50_000
    tax_unit_itemizes: false
  output:
    la_standard_deduction: 12_838
    la_taxable_income: 37_162
    la_income_tax_before_non_refundable_credits: 1_114.86

- name: 2026 joint, federal AGI 50,000, RIB 26-019 end to end
  period: 2026
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        adjusted_gross_income: 50_000
        tax_unit_itemizes: false
    households:
      household:
        members: [head, spouse]
        state_code: LA
  output:
    la_standard_deduction: 25_676
    # 50,000 - 25,676
    la_taxable_income: 24_324
    # 24,324 x 0.03
    la_income_tax_before_non_refundable_credits: 729.72

