# --- Retirement exemption end to end (Axiom: *_end_to_end_with_retirement_exemption*) ---
# These set adjusted_gross_income directly, so they test the Louisiana
# exemption and tax path, not that pensions flow into federal AGI.
- name: 2026 aged single, federal AGI 50,000 with 20,000 private pension
  period: 2026
  input:
    people:
      person1:
        age: 66
        is_tax_unit_head: true
        taxable_private_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 50_000
        tax_unit_itemizes: false
    households:
      household:
        members: [person1]
        state_code: LA
  output:
    la_retirement_exemption_person: 12_324
    la_agi_exempt_income: 12_324
    # 50,000 - 12,324
    la_agi: 37_676
    # 37,676 - 12,838
    la_taxable_income: 24_838
    # 24,838 x 0.03
    la_income_tax_before_non_refundable_credits: 745.14

