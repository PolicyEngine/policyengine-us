# Authority: https://mychildde.org/wp-content/uploads/11.18.24-2024.11.08_ACF-118-CCDF-FFY-2025-2027-For-Delaware.pdf#page=21
# The approved FFY 2025-2027 plan, section 2.2.1(c), elects the 45 CFR
# 98.20(a)(1)(ii) court-supervision age extension through 18 from 2024-10-01.
# Court status is distinct from a DFS protective-care referral, which is a
# separate route that also waives the family income, activity and copay rules.

- name: DE court status alone qualifies under the plan election at age 13.
  period: 2026-01
  input:
    state_code: DE
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    de_poc_eligible_child: true

- name: DE court-supervised child with protective-care referral at age 13.
  period: 2026-01
  input:
    state_code: DE
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
    de_poc_has_dfs_referral: true
  output:
    de_poc_eligible_child: true

