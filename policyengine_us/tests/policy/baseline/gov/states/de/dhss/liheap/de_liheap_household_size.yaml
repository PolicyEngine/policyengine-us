# REQ-002/007: section 429.2 excludes qualifying student income, not household membership.
- name: Case 4, dependent college student remains a household member.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
      person2:
        age: 21
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: true
        rent: 0
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    de_liheap_household_size: 2
