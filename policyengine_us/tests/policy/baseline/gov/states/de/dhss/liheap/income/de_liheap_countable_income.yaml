# Delaware FY2026 regular heating. Independent source-derived expectations.
# Sources:
# - https://liheapch.acf.gov/docs/2026/state-plans/DE_Plan_2026.pdf#page=5

# Person income 10,000 + 3,000, TANF 12 x 200 = 2,400, helper 800 + 150 + 50 = 1,000
# including state payroll 100, city 125; 15,400 - 1,000 - 125 = 14,275.
- name: Case 1, TANF counts once and payroll helper includes state contributions once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        employment_income: 10_000
        de_employee_state_payroll_tax: 100
      person2:
        age: 10
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        social_security_survivors: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_wilmington_earned_income_tax: 125
        employee_payroll_tax: 800
        state_withheld_income_tax: 150
        income_tax_before_credits: 50
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          2026-01: 200
          2026-02: 200
          2026-03: 200
          2026-04: 200
          2026-05: 200
          2026-06: 200
          2026-07: 200
          2026-08: 200
          2026-09: 200
          2026-10: 200
          2026-11: 200
          2026-12: 200
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    spm_unit_paycheck_withholdings: 1_000
    de_liheap_countable_income: 14_275

# max(500 - 800, 0) = 0.
- name: Case 2, deductions cannot make household income negative.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        employment_income: 500
    tax_units:
      tax_unit:
        members: [person1]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 800
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_liheap_countable_income: 0

# A negative deduction is floored at zero, so 500 remains 500; refunds are not income.
- name: Case 3, negative tax total cannot increase income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        child_support_received: 500
    tax_units:
      tax_unit:
        members: [person1]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: -100
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_liheap_countable_income: 500

# The nonqualified parent's gross 21,000 minus supplied withholding 1,000 leaves 20,000
# for qualified size 1.
- name: Case 4, income of members excluded from qualified size still counts.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        employment_income: 21_000
      person2:
        age: 5
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    de_liheap_household_size: 1
    de_liheap_countable_income: 20_000

- name: Case 5, excluded child taxes, zero supplied deductions stay zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        immigration_status: CITIZEN
        child_support_received: 26_000
        ssi: {'2026': 0}
      child:
        age: 17
        immigration_status: CITIZEN
        employment_income: 20_000
        is_tax_unit_dependent: true
        ssi: {'2026': 0}
    tax_units:
      tax_unit:
        members: [parent, child]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [parent, child]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        de_tanf: {'2026': 0}
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [parent, child]
        state_code: DE
        in_wilmington: true
  output:
    de_liheap_countable_income: 26000

- name: Case 6, excluded child taxes, remaining supplied deductions are retained.
