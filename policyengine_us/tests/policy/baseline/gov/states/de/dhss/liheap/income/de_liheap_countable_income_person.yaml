# Existing-aggregate UI control tests fallback without inventing a Delaware UI
# formula. A supplied Part B amount can offset only this person's SSA, never
# their separate pension when the premium exceeds SSA.
- name: Case 13, UI receipts and Social Security premium attribution remain distinct.
  period: 2026
  input:
    state_code: [DE, DE, DE]
    age: [35, 35, 68]
    ssi: [0, 0, 0]
    de_tanf: [0, 0, 0]
    unemployment_compensation: [0, 400, 0]
    modeled_state_unemployment_compensation: [1_200, 1_200, 0]
    social_security: [0, 0, 1_200]
    taxable_pension_income: [0, 0, 1_000]
    medicare_part_b_premium: [0, 0, 2_400]
  output:
    total_unemployment_compensation: [1_200, 400, 0]
    de_liheap_countable_income_person: [1_200, 400, 1_000]

# Manual 419.1 and 419.3: an adult's railroad retirement 6,000 and insurance
# disability payments 2,400 count (8,400). Manual 418: a minor keeps only child
# support 1,800, SSI 2,400, Social Security survivors 3,000 and railroad retirement
# 1,500 (8,700); the minor's 500 of interest is excluded.
- name: Case 14, railroad and disability payments count; a minor keeps only support and Social Security benefits.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        railroad_benefits: 6_000
        disability_benefits: 2_400
      person2:
        age: 16
        immigration_status: CITIZEN
        ssi:
          '2026': 2_400
        is_full_time_college_student: false
        child_support_received: 1_800
        social_security_survivors: 3_000
        railroad_benefits: 1_500
        taxable_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    de_liheap_countable_income_person: [8_400, 8_700]

# Manual 416.2 counts trusts and 416.1 counts other taxable income: 2,000 + 1,000.
# A minor's trust income stays out under manual 418.
- name: Case 15, trust and other taxable income count for adults only.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [DE, DE]
    age: [40, 16]
    ssi: [0, 0]
    de_tanf: [0, 0]
    estate_income: [2_000, 2_000]
    miscellaneous_income: [1_000, 0]
  output:
    de_liheap_countable_income_person: [3_000, 0]

# Manual 419.1 lists railroad retirement among Social Security benefits, so Part B
# nets against their sum: 41,000 - 2,434.80; 6,000 + 6,000 - 2,400. A premium above
# 1,000 of railroad retirement cannot reduce the separate 1,000 pension.
- name: Case 16, Part B nets against Social Security and railroad retirement together.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [DE, DE, DE]
    age: [70, 70, 70]
    ssi: [0, 0, 0]
    de_tanf: [0, 0, 0]
    railroad_benefits: [41_000, 6_000, 1_000]
    social_security: [0, 6_000, 0]
    taxable_pension_income: [0, 0, 1_000]
    medicare_part_b_premium: [2_434.80, 2_400, 2_400]
  output:
    de_liheap_countable_income_person: [38_565.20, 9_600, 1_000]
