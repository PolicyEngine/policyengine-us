        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_liheap_countable_income_person: 4_000

