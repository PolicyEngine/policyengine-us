    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        employment_income: 1_000
        financial_assistance: 2_000
        strike_benefits: 3_000
        gambling_winnings: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
