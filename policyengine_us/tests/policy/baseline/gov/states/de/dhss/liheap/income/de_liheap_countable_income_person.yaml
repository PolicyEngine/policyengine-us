# Delaware FY2026 regular heating. Independent source-derived expectations.
# Sources:
# - https://liheapch.acf.gov/docs/2026/state-plans/DE_Plan_2026.pdf#page=5,6,7,9,10
# - https://bidcondocs.delaware.gov/HSS/HSS_15027Liheap_MAN.pdf#page=35,36,40,41,42

# REQ-005: 1,000+2,000+3,000+4,000+5,000+6,000+7,000=28,000. Historical section 418 classifies property rent as earned.
- name: Case 1, adult earned sources including rents count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 0
        is_full_time_college_student: false
        rent: 0
        employment_income: 1_000
        self_employment_income: 2_000
        sstb_self_employment_income: 3_000
        farm_operations_income: 4_000
        partnership_s_corp_income: 5_000
        rental_income: 6_000
        farm_rent_income: 7_000
    tax_units:
      tax_unit:
        members: [person1]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_liheap_countable_income_person: 28_000

# REQ-005: 100+200+...+1,200=7,800; SSI is an annual total for a monthly variable. Ordinary dividends feed the existing compatibility alias once.
- name: Case 2, disjoint unearned income sources count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi:
          '2026': 300
        is_full_time_college_student: false
        rent: 0
        unemployment_compensation: 100
        social_security: 200
        pension_income: 400
        survivor_benefits: 500
        general_assistance: 600
        alimony_income: 700
        child_support_received: 800
        interest_income: 900
        ordinary_dividend_income: 1_000
        veterans_benefits: 1_100
        workers_compensation: 1_200
    tax_units:
      tax_unit:
        members: [person1]
        de_wilmington_earned_income_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        housing_assistance: 0
        de_tanf:
          '2026': 0
        spm_unit_paycheck_withholdings: 0
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_liheap_countable_income_person: 7_800

