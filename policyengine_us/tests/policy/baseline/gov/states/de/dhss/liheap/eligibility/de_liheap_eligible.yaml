# REQ-003/004/009/011: membership, heating responsibility and housing gates; no asset test.
- name: Case 2, direct gas with positive matching bill.
  period: 2026
  input:
    state_code: DE
    heating_type: NATURAL_GAS
    gas_expense: 1_000
    de_liheap_household_size: 1
    de_liheap_countable_income: 0
    de_liheap_income_limit: 39_342
  output:
    de_liheap_eligible: true

# REQ-003/004/009/011: membership, heating responsibility and housing gates; no asset test.
