# Unit tests for Delaware TANF resource eligibility
# 16 Del. Admin. Code SS 4000-4002: Resource limit is $10,000
# https://www.law.cornell.edu/regulations/delaware/16-Del-Admin-Code-SS-4000-4002

- name: Case 1, no resources.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    de_tanf_resources_eligible: true

- name: Case 2, at boundary.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 10_000
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    # $10,000 = $10,000 limit → eligible
    de_tanf_resources_eligible: true

- name: Case 3, below boundary.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 9_999
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    # $9,999 < $10,000 limit → eligible
    de_tanf_resources_eligible: true

- name: Case 4, above boundary.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 10_001
    households:
      household:
        members: [person1]
        state_code: DE
  output:
    # $10,001 > $10,000 limit → ineligible
    de_tanf_resources_eligible: false

# 8,688.73 + 9.74 + 1,301.53 = 10,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 10,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.53
    state_code: DE
  output:
    de_tanf_resources_eligible: true

# 8,688.73 + 9.74 + 1,301.54 = 10,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.54
    state_code: DE
  output:
    de_tanf_resources_eligible: false
