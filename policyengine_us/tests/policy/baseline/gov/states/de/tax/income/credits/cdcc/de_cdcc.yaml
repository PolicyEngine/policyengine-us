  input:
    cdcc: 100
    state_code: DE
    de_income_tax_before_non_refundable_credits_unit: 1000000
  output:
    de_cdcc: 50
- name: cdcc 0
  period: 2023
  input:
    cdcc: 0
    state_code: DE
    de_income_tax_before_non_refundable_credits_unit: 1000000
  output:
    de_cdcc: 0

- name: Delaware's 2021 credit follows the increased federal dependent care exclusion
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      parent1:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      parent2:
        age: 38
        employment_income: 40_000
      child1:
        age: 5
      child2:
        age: 7
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 20_000
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: DE
  output:
    dependent_care_assistance_exclusion: 9_000
    # Federal Form 2441: min(16_000 - 9_000, 20_000 - 9_000) * 50% = 3_500.
    cdcc: 3_500
    # 2021 PIT-RES line 30 worksheet: min(3_500 * 50%, 4_000) = 1_750.
    # https://revenuefiles.delaware.gov/2021/PIT-RES_TY21_2021-01_Instructions.pdf#page=9
    de_cdcc_potential: 1_750

# The 2021 and 2022 Delaware credit (50% of the federal credit, Line 30 of the
# PIT-RES) must flow into the state_cdcc aggregate that TAXSIM reads for v38;
# it was previously omitted from state_cdccs for those years (taxsim #1188).
- name: 2021 DE CDCC flows into the state_cdcc aggregate
  period: 2021
  input:
    cdcc: 100
    state_code: DE
    de_income_tax_before_non_refundable_credits_unit: 1000000
  output:
    de_cdcc: 50
    state_cdcc: 50
- name: 2022 DE CDCC flows into the state_cdcc aggregate
  period: 2022
  input:
    cdcc: 100
    state_code: DE
    de_income_tax_before_non_refundable_credits_unit: 1000000
  output:
    de_cdcc: 50
    state_cdcc: 50
