- name: Split the itemized deductions 60% and 40%
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        adjusted_gross_income_person: 60_000
      person2:
        is_tax_unit_head: false
        adjusted_gross_income_person: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_itemized_deductions_unit: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: DE 
  output:
    de_itemized_deductions_indv: [600, 400]

- name: No head AGI
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        adjusted_gross_income_person: 0
      person2:
        is_tax_unit_head: false
        adjusted_gross_income_person: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_itemized_deductions_unit: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    de_itemized_deductions_indv: [0, 1_000]

- name: No spouse AGI
  period: 2022
  input:
    people:
      person1:
        adjusted_gross_income_person: 1_000
      person2:
        adjusted_gross_income_person: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_itemized_deductions_unit: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: DE 
  output:
    de_itemized_deductions_indv: [1_000, 0]

- name: Deductions are allocated to the spouse who paid them, not by income share
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        adjusted_gross_income_person: 60_000
        real_estate_taxes: 6_000
        deductible_mortgage_interest: 10_000
      person2:
        adjusted_gross_income_person: 40_000
        real_estate_taxes: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    # 2023 PIT-RES instructions, line 13: "If you are unable to specifically
    # allocate deductions between spouses, prorate the deductions" by income.
    # Here each deduction is specifically allocable: person 1 paid 6_000 of
    # real estate tax and 10_000 of mortgage interest, person 2 paid 1_000 of
    # real estate tax. Proration by income would give 60% / 40% of 17_000.
    de_itemized_deductions_indv: [16_000, 1_000]

- name: Amounts a dependent paid cannot be allocated to a spouse and are prorated
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        adjusted_gross_income_person: 60_000
        real_estate_taxes: 2_000
      person2:
        adjusted_gross_income_person: 40_000
      person3:
        is_tax_unit_dependent: true
        real_estate_taxes: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: DE
  output:
    # Person 1's 2_000 is theirs; the dependent's 1_000 is split 60% / 40%.
    de_itemized_deductions_indv: [2_600, 400, 0]

- name: Proration counts only positive income, so no spouse gets a negative deduction
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        adjusted_gross_income_person: 45_000
      person2:
        adjusted_gross_income_person: -5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_itemized_deductions_unit: 4_000
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    # A share of 45_000 / 40_000 and -5_000 / 40_000 would give person 2 a
    # negative deduction of -500.
    de_itemized_deductions_indv: [4_000, 0]

- name: With no positive income the spouses split unallocable deductions equally
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        adjusted_gross_income_person: 0
      person2:
        adjusted_gross_income_person: -2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        de_itemized_deductions_unit: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    de_itemized_deductions_indv: [500, 500]
