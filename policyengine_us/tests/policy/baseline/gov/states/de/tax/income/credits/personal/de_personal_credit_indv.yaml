- name: all credits to higher-capacity column (spouse)
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        de_income_tax_before_non_refundable_credits_indv: 100
      person2:
        is_tax_unit_spouse: true
        de_income_tax_before_non_refundable_credits_indv: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    # 2 exemptions × $110 = $220, all to spouse (more capacity)
    # Each spouse's own $110 stays in their column (PIT-RES line 27a
    # example: "$110 in each column if Filing Status 4"); only dependent
    # credits are splittable, and this couple has none.
    de_personal_credit_indv: [110, 110]

- name: all credits to higher-capacity column (head)
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        de_income_tax_before_non_refundable_credits_indv: 5_000
      person2:
        is_tax_unit_spouse: true
        de_income_tax_before_non_refundable_credits_indv: 100
      child1:
        is_tax_unit_dependent: true
        age: 8
      child2:
        is_tax_unit_dependent: true
        age: 12
    tax_units:
      tax_unit:
        members: [person1, person2, child1, child2]
    households:
      household:
        members: [person1, person2, child1, child2]
        state_code: DE
  output:
    # 4 exemptions × $110 = $440, all to head (more capacity)
    # Own $110 per spouse is fixed; only the two dependents' credits are
    # allocable, so the head column can receive at most 110 + 220 = 330.
    de_personal_credit_indv: [330, 110, 0, 0]

- name: tied capacity splits evenly
  period: 2025
  input:
    people:
      person1:
        is_tax_unit_head: true
        de_income_tax_before_non_refundable_credits_indv: 500
      person2:
        is_tax_unit_spouse: true
        de_income_tax_before_non_refundable_credits_indv: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DE
  output:
    # Equal capacity: split evenly (both columns can absorb their share)
    de_personal_credit_indv: [110, 110]


- name: 2025 spouse who can be claimed as a dependent has no personal credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        de_income_tax_before_non_refundable_credits_indv: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        de_income_tax_before_non_refundable_credits_indv: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: DE
  output:
    # 30 Del. C. 1110(b)(1): $110 for each personal exemption to which the
    # individual is entitled for federal purposes; IRC 151(d)(2).
    de_personal_credit_indv: [0, 110]

- name: 2025 spouse who can be claimed as a dependent has no personal credit (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        de_income_tax_before_non_refundable_credits_indv: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        de_income_tax_before_non_refundable_credits_indv: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: DE
  output:
    de_personal_credit_indv: [110, 0]

- name: Filing-exception child's credit goes to the claimable head's column to minimize tax
  period: 2025
  input:
    people:
      claimable:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        de_income_tax_before_non_refundable_credits_indv: 100
      other_filer:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        de_income_tax_before_non_refundable_credits_indv: 200
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [claimable, other_filer, child]
        filing_status: JOINT
    households:
      household:
        members: [claimable, other_filer, child]
        state_code: DE
  output:
    # The claimable filer has no own credit but may claim a dependent under
    # the filing exception. Allocating the child's $110 there leaves $90
    # total tax; allocating it to the other filer would leave $100.
    de_personal_credit_indv: [110, 110, 0]

- name: Filing-exception child's credit goes to the claimable spouse's column to minimize tax
  period: 2025
  input:
    people:
      claimable:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        de_income_tax_before_non_refundable_credits_indv: 100
      other_filer:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        de_income_tax_before_non_refundable_credits_indv: 200
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [claimable, other_filer, child]
        filing_status: JOINT
    households:
      household:
        members: [claimable, other_filer, child]
        state_code: DE
  output:
    # The claimable filer has no own credit but may claim a dependent under
    # the filing exception. Allocating the child's $110 there leaves $90
    # total tax; allocating it to the other filer would leave $100.
    de_personal_credit_indv: [110, 110, 0]
