# 30 Del. C. 1106(b)(3)f.4 (85 Del. Laws c. 426, Senate Amendment 1): from
# 2027, a person 60 or older claims the subtraction only after 3 years of
# Delaware domicile, or 5 years for a person domiciled in Delaware from 2027.

- name: DE 60+ filer who fails the domicile requirement gets no exclusion in 2027.
  period: 2027
  input:
    state_code: DE
    age: 65
    military_retirement_pay: 30_000
    de_pension_exclusion_domicile_requirement_met: false
  output:
    de_pension_exclusion: 0

