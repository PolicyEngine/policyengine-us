# 30 Del. C. 1106(b)(3)c-e: the military pension cap rises to $15,000 for
# 2027, $20,000 for 2028 and $25,000 from 2029, and from 2027 filers age 60 or
# older take the greater of the $12,500 pension exclusion and the military
# pension exclusion.

- name: DE under-60 military pension cap stays $12,500 in 2026.
  period: 2026
  input:
    state_code: DE
    age: 45
    military_retirement_pay: 30_000
  output:
    de_pension_exclusion: 12_500

- name: DE under-60 military pension cap is $15,000 in 2027.
  period: 2027
  input:
    state_code: DE
    age: 45
    military_retirement_pay: 30_000
  output:
    de_pension_exclusion: 15_000

- name: DE under-60 military pension cap is $20,000 in 2028.
  period: 2028
  input:
    state_code: DE
    age: 45
    military_retirement_pay: 30_000
  output:
    de_pension_exclusion: 20_000

- name: DE under-60 military pension cap is $25,000 in 2029.
  period: 2029
  input:
    state_code: DE
    age: 45
    military_retirement_pay: 30_000
  output:
    de_pension_exclusion: 25_000

- name: DE under-60 military pension cap stays $25,000 after 2029.
  period: 2031
  input:
    state_code: DE
