    de_non_refundable_eitc: 419.32
    de_income_tax_before_refundable_credits_separate: 310.68

- name: Equal incomes, the dependent care credit and EITC columns are chosen together
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      younger:
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        de_taxable_income_indv: 11_750
        de_income_tax_before_non_refundable_credits_indv: 345
        de_aged_personal_credit_indv: 0
      older:
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        de_taxable_income_indv: 11_750
        de_income_tax_before_non_refundable_credits_indv: 345
        de_aged_personal_credit_indv: 110
    tax_units:
      tax_unit:
        members: [younger, older]
        exemptions_count: 3
        de_cdcc: 13.5
        de_non_refundable_eitc: 250
    households:
      household:
        members: [younger, older]
        state_code: DE
  output:
    # The dependent's $110 and the dependent care credit go to the older
    # spouse's column (345 - 110 - 110 - 110 - 13.50 = 1.50) and the EITC
    # clears the younger spouse's 345 - 110 = 235. Sending the dependent care
    # credit to the column with more room instead leaves 15.
    de_income_tax_before_refundable_credits_separate: 1.5

