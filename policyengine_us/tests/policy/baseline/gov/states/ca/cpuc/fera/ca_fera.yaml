- name: Case 1, FERA-eligible household with $100 in electricity expenses is discounted $18.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_fera_eligible: true
    pre_subsidy_electricity_expense: 100
  output:
    ca_fera: 18

- name: Case 2, FERA-eligible household with multiple SPM units.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      p1: {}
      p2: {}
    spm_units:
      spm_unit_1:
        members: [p1]
        pre_subsidy_electricity_expense: 100
      spm_unit_2:
        members: [p2]
        pre_subsidy_electricity_expense: 100
    households:
      household:
        members: [p1, p2]
        state_code: CA
        ca_fera_eligible: true
  output:
    ca_fera: 36

- name: Case 3, household not eligible for FERA gets $0.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_fera_eligible: false
    pre_subsidy_electricity_expense: 100
  output:
    ca_fera: 0
