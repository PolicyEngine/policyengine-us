- name: A three-person household with an income between 200% and 250% of the poverty line is ineligible for CARE and eligible for FERA.
  period: 2023
  input:
  # if the following line is not included, then the test fails. The program is assuming categorical care eligibility.
    # ca_care_categorically_eligible: false 
    household_size: 3
    employment_income: 60_000 # ~240% of poverty line
    state_code: CA
  output:
    ca_care_categorically_eligible: false
    ca_care_eligible: false
    ca_fera_eligible: true

- name: A three-person household with an income between 200% and 250% of the poverty line is ineligible for CARE and eligible for FERA.
  period: 2023
  input:
  # if the following line is not included, then the test fails. The program is assuming categorical care eligibility.
    # ca_care_categorically_eligible: false 
    people:
      parent:
        employment_income: 60_000 # ~240% of poverty line
      child1:
        age: 10
      child2:
        age: 10
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        pre_subsidy_electricity_expense: 100
    households:
      household:
        members: [parent, child1, child2]
        state_code: CA
  output:
    # Eligible due to child Medicaid.
    ca_care_categorically_eligible: true
    ca_care_eligible: true
    ca_fera_eligible: false

- name: A three-person household with an income between 200% and 250% of the poverty line is ineligible for CARE and eligible for FERA.
  period: 2023
  input:
  # if the following line is not included, then the test fails. The program is assuming categorical care eligibility.
    # ca_care_categorically_eligible: false 
    people:
      adult1:
        age: 30
        employment_income: 60_000 # ~240% of poverty line
      adult2:
        age: 30
      adult3:
        age: 30
    spm_units:
      spm_unit:
        members: [adult1, adult2, adult3]
        pre_subsidy_electricity_expense: 100
    households:
      household:
        members: [adult1, adult2, adult3]
        state_code: CA
        ca_care_categorically_eligible: false
  output:
    ca_care_categorically_eligible: false
    ca_care_eligible: false
    ca_fera_eligible: true
    ca_fera: 18

- name: Case 6, housing assistance does not disqualify an income-eligible CARE household.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 40_700
        pre_subsidy_rent: 36_000
    spm_units:
      unit:
        members: [person1]
        spm_unit_tenure_type: RENTER
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: CA
        pha_payment_standard: 36_000
  output:
    # Tenant payment is 30% of income. The $36,000 payment standard equals
    # gross rent, so the HUD benefit is $36,000 minus the tenant payment.
    hud_ttp: 12_210
    housing_assistance: 23_790
    # CPUC D.14-08-030 excludes housing subsidies from countable income.
    ca_cpuc_countable_income: 40_700
    ca_care_categorically_eligible: false
    ca_care_income_eligible: true
    ca_care_eligible: true
    ca_care: 390
    ca_fera_eligible: false
    ca_fera: 0

- name: Case 7, housing assistance does not disqualify an income-eligible FERA household.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 21_000
        pre_subsidy_rent: 36_000
      person2:
        age: 40
        employment_income: 21_000
      person3:
        age: 40
        employment_income: 21_000
    spm_units:
      unit:
        members: [person1, person2, person3]
        spm_unit_tenure_type: RENTER
        receives_housing_assistance: true
        pre_subsidy_electricity_expense: 1_200
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        pha_payment_standard: 36_000
  output:
    # Tenant payment = 30% of $63,000; the $36,000 payment standard equals
    # gross rent, so the HUD benefit is $36,000 - $18,900 = $17,100.
    hud_ttp: 18_900
    housing_assistance: 17_100
    ca_cpuc_countable_income: 63_000
    ca_care_categorically_eligible: false
    ca_care_income_eligible: false
    ca_care_eligible: false
    ca_care: 0
    ca_fera_eligible: true
    # FERA discount = 18% of $1,200.
    ca_fera: 216
