- name: Household that participates in SNAP is categorically eligible.
  period: 2023
  input:
    state_code: CA
    snap: 1
    wic: 2
  output:
    ca_care_categorically_eligible: true

- name: Tribal household that participates in Head Start is categorically eligible.
  period: 2023
  input:
    state_code: CA
    is_on_tribal_land: true
    head_start: 10
  output:
    ca_care_categorically_eligible: true

- name: Household that participates in none of the programs is not categorically eligible.
  period: 2023
  input:
    state_code: CA
    medicaid_enrolled: 0
    wic: 0
    snap: 0
    ssi: 0
    tanf: 0
    head_start: false
  output:
    ca_care_categorically_eligible: false

- name: Household reporting SNAP receipt with a zero modeled allotment is categorically eligible.
  period: 2023
  input:
    state_code: CA
    medicaid_enrolled: 0
    wic: 0
    snap: 0
    receives_snap: true
    ssi: 0
    tanf: 0
    head_start: false
  output:
    ca_care_categorically_eligible: true

- name: Household reporting WIC receipt with a zero modeled benefit is categorically eligible.
  period: 2023
  input:
    state_code: CA
    medicaid_enrolled: 0
    wic: 0
    receives_wic: true
    snap: 0
    ssi: 0
    tanf: 0
    head_start: false
  output:
    ca_care_categorically_eligible: true

- name: Household reporting SSI receipt with a zero modeled payment is categorically eligible.
  period: 2023
  input:
    state_code: CA
    medicaid_enrolled: 0
    wic: 0
    snap: 0
    ssi: 0
    receives_ssi: true
    tanf: 0
    head_start: false
  output:
    ca_care_categorically_eligible: true

- name: Tribal household reporting TANF receipt with a zero modeled benefit is categorically eligible.
  period: 2023
  input:
    state_code: CA
    is_on_tribal_land: true
    tanf: 0
    receives_tanf: true
    head_start: false
  output:
    ca_care_categorically_eligible: true

- name: Tribal household reporting SSI receipt is not qualified via the non-tribal list.
  period: 2023
  input:
    state_code: CA
    is_on_tribal_land: true
    tanf: 0
    head_start: false
    medicaid_enrolled: 0
    wic: 0
    snap: 0
    ssi: 0
    receives_ssi: true
  output:
    # SSI is only in the non-tribal list, which tribal households do not read.
    ca_care_categorically_eligible: false
