- name: Case 1, CARE-eligible household with $100 in electricity expenses is discounted $32.50.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_care_eligible: true
    pre_subsidy_electricity_expense: 100
  output:
    ca_care_electricity: 32.5

- name: Case 2, CARE-eligible household with multiple SPM units.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      p1: {}
      p2: {}
    spm_units:
      spm_unit_1:
        members: [p1]
        pre_subsidy_electricity_expense: 100
      spm_unit_2:
        members: [p2]
        pre_subsidy_electricity_expense: 100
    households:
      household:
        members: [p1, p2]
        state_code: CA
        ca_care_eligible: true
  output:
    ca_care_electricity: 65

- name: Case 3, household not eligible for CARE gets no electricity discount.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_care_eligible: false
    pre_subsidy_electricity_expense: 100
  output:
    ca_care_electricity: 0
