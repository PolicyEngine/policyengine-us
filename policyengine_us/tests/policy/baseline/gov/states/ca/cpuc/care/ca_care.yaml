- name: Case 1, CARE sums the electricity and gas discounts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_care_eligible: true
    ca_care_electricity: 100
    ca_care_gas: 20
  output:
    ca_care: 120

- name: Case 2, household not eligible for CARE gets $0.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: CA
    ca_care_eligible: false
    pre_subsidy_electricity_expense: 1_000
    gas_expense: 1_000
  output:
    ca_care: 0
