- name: Case 3, SNAP and CalWORKs bypass the income ceiling but SSI does not.
  period: 2026
  # The first two exceed SMI but qualify categorically. SSI alone does not
  # create the bypass, even when the household reports actual SSI receipt.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 100_000
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 100_000
      person3: {age: 8, is_citizen_or_legal_immigrant: true, ssi: 0}
      person4:
        age: 65
        is_citizen_or_legal_immigrant: true
        ssi: 1_200
        employment_income: 100_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 1_200
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 2_400
        ca_state_supplement: 0
      spm_unit3:
        members: [person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household2:
        members: [person2, person3]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household3:
        members: [person4]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
  output:
    ca_liheap_income_eligible: [true, true, false]
