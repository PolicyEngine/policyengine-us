# PDF pages 6,217-218
# https://www.csd.ca.gov/Shared%20Documents/2026-Final-LIHEAP-State-Plan.pdf#page=6
# SNAP and CalWORKs qualify; SSI and VA alone do not.

- name: Case 1, categorical status uses the two selected programs and is state guarded.
  period: 2026
  # Positive annual receipt is the existing-input proxy for current receipt.
  # SSI/VA alone and no receipt do not qualify; Oregon remains outside CA.
  input:
    people:
      person1: {age: 35, is_citizen_or_legal_immigrant: true, ssi: 0}
      person2: {age: 35, is_citizen_or_legal_immigrant: true, ssi: 0}
      person3: {age: 8, is_citizen_or_legal_immigrant: true, ssi: 0}
      person4: {age: 65, is_citizen_or_legal_immigrant: true, ssi: 6_000}
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        veterans_benefits: 6_000
      person6: {age: 35, is_citizen_or_legal_immigrant: true, ssi: 0}
      person7: {age: 35, is_citizen_or_legal_immigrant: true, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 1_200
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 1_200
        ca_state_supplement: 0
      spm_unit3:
        members: [person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit4:
        members: [person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit5:
        members: [person6]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit6:
        members: [person7]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 1_200
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household2:
        members: [person2, person3]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household3:
        members: [person4]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household4:
        members: [person5]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household5:
        members: [person6]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household6:
        members: [person7]
        state_code: OR
        county: MULTNOMAH_COUNTY_OR
  output:
    ca_liheap_categorically_eligible: [true, true, false, false, false, false]
