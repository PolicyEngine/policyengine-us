    ca_liheap_income_group: [1, 1, 1, 1, 1, 1, 1, 1]
    ca_liheap_energy_burden_group: [1, 1, 1, 1, 1, 1, 2, 2]
    ca_liheap_liquid_priority_points: [29, 24, 24, 14, 14, 24, 26, 31]

# Income10+burden4+young-child10+under3child5+elderly10+age70plus5
# +disability10=54. Two elders, two young children and two disabled people
# do not duplicate category points; demographic addition is the maximum40.
- name: "Case 3, overlapping vulnerability categories count once each."
  period: 2026
  input:
    people:
      p1_1: {"age": 70, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000, "is_disabled": true}
      p1_2: {"age": 75, "is_citizen_or_legal_immigrant": true, "ssi": 0, "is_disabled": true}
      p1_3: {"age": 2.5, "is_citizen_or_legal_immigrant": true, "ssi": 0}
      p1_4: {"age": 1, "is_citizen_or_legal_immigrant": true, "ssi": 0}
    spm_units:
      s1:
        members: ["p1_1", "p1_2", "p1_3", "p1_4"]
        heating_type: "PROPANE"
        snap: 0
        tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 1200
    households:
      h1:
        members: ["p1_1", "p1_2", "p1_3", "p1_4"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_liquid_priority_points: [54]

# Madera p191 awards disability points for a household member without an
# adult or citizenship restriction; the size rule separately excludes the
# nonqualified member. Income10+burden4+disability10=24 in each household.
- name: "Case 4, child and nonqualified household disability still identify vulnerability."
  period: 2026
  input:
    people:
      p1_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
      p1_2: {"age": 10, "is_citizen_or_legal_immigrant": true, "ssi": 0, "is_disabled": true}
      p2_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
      p2_2: {"age": 40, "is_citizen_or_legal_immigrant": false, "ssi": 0, "is_disabled": true}
    spm_units:
      s1:
        members: ["p1_1", "p1_2"]
        heating_type: "PROPANE"
        snap: 0
        tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 1200
      s2:
        members: ["p2_1", "p2_2"]
        heating_type: "PROPANE"
        snap: 0
        tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 1200
    households:
      h1:
        members: ["p1_1", "p1_2"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h2:
        members: ["p2_1", "p2_2"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_household_size: [2, 1]
    ca_liheap_liquid_priority_points: [24, 24]
