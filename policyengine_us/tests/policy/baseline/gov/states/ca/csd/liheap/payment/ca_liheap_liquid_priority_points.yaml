# FY2026 ordinary liquid component; no discretionary vendor supplement.
# Annual recurring income/costs represent the same application month.


# One-person monthly incomes1000/1500/1800/2500 fall in original p184
# groups1/2/3/4. Burden12 percent contributes6; income adds10/8/6/4.
- name: "Case 1, all income groups contribute their own priority points."
  period: 2026
  input:
    people:
      p1_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
      p2_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 18000}
      p3_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 21600}
      p4_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 30000}
    spm_units:
      s1:
        members: ["p1_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 1440.0
      s2:
        members: ["p2_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 2160.0
      s3:
        members: ["p3_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 2592.0
      s4:
        members: ["p4_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 3600.0
    households:
      h1:
        members: ["p1_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h2:
        members: ["p2_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h3:
        members: ["p3_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h4:
        members: ["p4_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_income_group: [1, 2, 3, 4]
    ca_liheap_energy_burden_group: [2, 2, 2, 2]
    ca_liheap_liquid_priority_points: [16, 14, 12, 10]

