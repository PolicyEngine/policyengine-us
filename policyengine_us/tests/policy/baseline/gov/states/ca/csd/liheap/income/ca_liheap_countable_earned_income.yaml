# PDF pages 231,240,247
# https://www.csd.ca.gov/Shared%20Documents/2026-Final-LIHEAP-State-Plan.pdf#page=231
# Person-level YEAR output; partnership losses remain net business receipts.

- name: Case 1, adult earnings include net business losses and minor earnings are excluded.
  period: 2026
  absolute_error_margin: 0.01
  # Adult total=12_000+2_000+300+700-1_000=14_000. At age 17 earnings
  # are excluded; at 18 wages plus net business count. Net loss stays negative
  # at Person level; household countable income separately floors at zero.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_000
        sstb_self_employment_income: 300
        farm_operations_income: 700
        partnership_s_corp_income: -1_000
      person2:
        age: 17
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_000
      person3:
        age: 18
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_000
      person4:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        self_employment_income: -1_000
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit3:
        members: [person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household2:
        members: [person4]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household3:
        members: [person5]
        state_code: OR
        county: MULTNOMAH_COUNTY_OR
  output:
    ca_liheap_countable_earned_income: [14_000, 0, 14_000, -1_000, 0]

# Guide p. 249 deducts a paid employee's business expenses: 40,500 - 1,000 = 39,500.
# A minor's earnings are excluded (p. 247), so the minor's 500 offsets nothing.
- name: Case 2, unreimbursed employee expenses reduce adult earnings only.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 40_500
        unreimbursed_business_employee_expenses: 1_000
      person2:
        age: 17
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 5_000
        unreimbursed_business_employee_expenses: 500
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
  output:
    ca_liheap_countable_earned_income: [39_500, 0]

# Guide p. 231 counts all gross wages and p. 250 excludes only combat pay. $45,000
# is above the $39,979.92 one-person limit, so San Diego pays $0. For two people,
# $30,000 is $2,500 a month, group 3: 362 + 19 = 381.
- name: Case 3, military basic pay counts as earned income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 25
        is_citizen_or_legal_immigrant: true
        ssi: 0
        military_basic_pay: 45_000
      person2:
        age: 22
        is_citizen_or_legal_immigrant: true
        ssi: 0
        military_basic_pay: 30_000
      person3:
        age: 22
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1]
        state_code: CA
        county: SAN_DIEGO_COUNTY_CA
      household2:
        members: [person2, person3]
        state_code: CA
        county: SAN_DIEGO_COUNTY_CA
  output:
    ca_liheap_countable_earned_income: [45_000, 30_000, 0]
    ca_liheap_utility_heating: [0, 381]
