# 120+240+360+480+720=1920;1920/12000=16.00 percent, group3.
# The deprecated metered gas value duplicates gas and is excluded. Water/sewer
# are not one of the five energy categories on state-plan p257.
- name: "Case 2, all five energy costs enter once and unrelated expenses do not."
  period: 2026
  input:
    people:
      p1_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
    spm_units:
      s1:
        members: ["p1_1"]
        heating_type: "PROPANE"
        snap: 0
        tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 480
        pre_subsidy_electricity_expense: 120
        gas_expense: 240
        wood_expense: 360
        fuel_oil_expense: 720
        metered_gas_expense: 9000
        water_expense: 9000
        sewage_expense: 9000
    households:
      h1:
        members: ["p1_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_energy_burden_group: [3]

# State-plan pp282–283:45.12+56.36=101.48 monthly, not printed101.51.
# Income1100+250=1350 monthly;101.48/1350=7.517037... percent,
# truncated7.51 in group1. All source monthly amounts are annualized once.
- name: "Case 3, published component bills use the correct sum before truncation."
  period: 2026
  input:
    people:
      p1_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "social_security": 13200, "pension_income": 3000}
    spm_units:
      s1:
        members: ["p1_1"]
        heating_type: "NATURAL_GAS"
        snap: 0
        tanf: 0
        ca_state_supplement: 0
        gas_expense: 676.32
        pre_subsidy_electricity_expense: 541.44
    households:
      h1:
        members: ["p1_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_countable_income: [16200]
    ca_liheap_energy_burden_group: [1]
