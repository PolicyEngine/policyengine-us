# https://www.csd.ca.gov/Shared%20Documents/2026-Final-LIHEAP-State-Plan.pdf#page=184,185,186,187,188,193,205,229,234,257,279,282,283
# https://maderacap.org/wp-content/uploads/2025/10/Agenda-and-Packet-for-October-9-2025-Updated.pdf#page=191,233,234
# FY2026 ordinary liquid component; no discretionary vendor supplement.
# Annual recurring income/costs represent the same application month.
# Conditional statewide schedule cases explicitly force only coverage, burden
# and priority; all other cases derive CA LIHEAP intermediates from raw facts.


# Madera BBA411/374/336/284. Row1:411+105=516 at exactly20points.
# Row2:411+70=481 scheduled but18points<20 gives no approval.
# Row3:284+70+105=459; row4:284+19+35+105=443. These are ordinary
# no-supplement awards; income and expenses are annualized raw facts.
- name: "Case 1, Madera published rules yield the four independently calculated outcomes."
  period: 2026
  input:
    people:
      p1_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
      p2_1: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 12000}
      p3_1: {"age": 60, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 30000}
      p4_1: {"age": 60, "is_citizen_or_legal_immigrant": true, "ssi": 0, "employment_income": 36000}
      p4_2: {"age": 40, "is_citizen_or_legal_immigrant": true, "ssi": 0}
    spm_units:
      s1:
        members: ["p1_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 2040
      s2:
        members: ["p2_1"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 1800
      s3:
        members: ["p3_1"]
        heating_type: "FUEL_OIL"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        fuel_oil_expense: 4200
      s4:
        members: ["p4_1", "p4_2"]
        heating_type: "PROPANE"
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
        bottled_gas_expense: 3960
    households:
      h1:
        members: ["p1_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h2:
        members: ["p2_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h3:
        members: ["p3_1"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
      h4:
        members: ["p4_1", "p4_2"]
        state_code: "CA"
        county: "MADERA_COUNTY_CA"
  output:
    ca_liheap_liquid_heating_covered: [true, true, true, true]
    ca_liheap_countable_income: [12000, 12000, 30000, 36000]
    ca_liheap_income_group: [1, 1, 4, 4]
    ca_liheap_energy_burden_group: [4, 3, 3, 2]
    ca_liheap_liquid_priority_points: [20, 18, 22, 20]
    ca_liheap_covered_liquid_heating: [516, 0, 459, 443]

