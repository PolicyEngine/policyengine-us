- name: Case 8, CalWORKs nonparticipation prevents both income counting and categorical bypass.
  period: 2026
  absolute_error_margin: 0.01
  # State entitlement is supplied to isolate take-up, not to test CalWORKs
  # entitlement rules. With takes_up_tanf_if_eligible false, the 6_000 state
  # entitlement is not received: count 60_000 and no categorical bypass.
  # The participant receives 6_000 once: count 66_000, bypass the ceiling,
  # and pay the approved 900 wood cost. All other LIHEAP inputs are actual
  # people, primary fuel and approved eligible-delivery costs.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, employment_income: 60_000}
      person2: {age: 8, is_citizen_or_legal_immigrant: true, ssi: 0}
      person3: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, employment_income: 60_000}
      person4: {age: 8, is_citizen_or_legal_immigrant: true, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        ca_state_supplement: 0
        ca_tanf: 6_000
        takes_up_tanf_if_eligible: false
      spm_unit2:
        members: [person3, person4]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        ca_state_supplement: 0
        ca_tanf: 6_000
        takes_up_tanf_if_eligible: true
    households:
      household1:
        members: [person1, person2]
        state_code: CA
        county: FRESNO_COUNTY_CA
      household2:
        members: [person3, person4]
        state_code: CA
        county: FRESNO_COUNTY_CA
  output:
    tanf: [0, 6_000]
    ca_liheap_countable_income: [60_000, 66_000]
    ca_liheap_categorically_eligible: [false, true]
    ca_liheap_income_eligible: [false, true]
    ca_liheap_wood_heating: [0, 900]

- name: Case 9, shared unemployment uses modeled fallback and a reported override.
  period: 2026
  absolute_error_margin: 0.01
  # The existing modeled-UI input isolates the shared fallback contract;
  # California has no state UI formula in this model. Zero reported UI uses
  # 6_000 modeled compensation: 35_000 + 6_000 = 41_000, over 39_979.92.
  # Reported 1_200 overrides modeled 6_000: 35_000 + 1_200 = 36_200.
  # The approved wood cost pays 900 only to the second household.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, employment_income: 35_000, unemployment_compensation: 0, modeled_state_unemployment_compensation: 6_000}
      person2: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, employment_income: 35_000, unemployment_compensation: 1_200, modeled_state_unemployment_compensation: 6_000}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person2]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1]
        state_code: CA
        county: FRESNO_COUNTY_CA
      household2:
        members: [person2]
        state_code: CA
        county: FRESNO_COUNTY_CA
  output:
    total_unemployment_compensation: [6_000, 1_200]
    ca_liheap_countable_income: [41_000, 36_200]
    ca_liheap_income_eligible: [false, true]
    ca_liheap_wood_heating: [0, 900]
