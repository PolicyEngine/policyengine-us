- name: Case 6, military retirement is separate from ordinary pension income.
  period: 2026
  absolute_error_margin: 0.01
  # Military pensions count under the final plan at page 236. Each household
  # has 50_000 total income, above the one-person 39_979.92 ceiling. The
  # second has 20_000 ordinary pension + 30_000 military pay, counted once.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, military_retirement_pay: 50_000}
      person2: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, pension_income: 20_000, military_retirement_pay: 30_000}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person2]
        heating_type: WOOD
        ca_liheap_approved_wood_delivery_cost: 900
        snap: 0
        tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1]
        state_code: CA
        county: FRESNO_COUNTY_CA
      household2:
        members: [person2]
        state_code: CA
        county: FRESNO_COUNTY_CA
  output:
    ca_liheap_countable_income: [50_000, 50_000]
    ca_liheap_income_eligible: [false, false]
    ca_liheap_wood_heating: [0, 0]

- name: Case 7, Medicare and payroll medical premiums change awards without double deduction.
  period: 2026
  absolute_error_margin: 0.01
  # Final plan pages 233,235,246-247 deduct allowable medical premiums from
  # total gross income. Reported components contain medical coverage only.
  # 41_000 - 2_400 Part B = 38_600; 41_000 - 2_400 payroll = 38_600.
  # The third direct non-payroll total 2_400 already includes the decomposed
  # 1_200 + 1_200; add only the disjoint 600 payroll: 41_000 - 3_000 = 38_000.
  # All are below 39_979.92; the 41_000 no-premium comparison is ineligible.
  input:
    people:
      person1: {age: 68, is_citizen_or_legal_immigrant: true, ssi: 0, social_security_retirement: 41_000, medicare_enrolled: true, medicare_part_b_premium: 2_400}
      person2: {age: 40, is_citizen_or_legal_immigrant: true, ssi: 0, employment_income: 41_000, pre_tax_health_insurance_premiums: 2_400}
