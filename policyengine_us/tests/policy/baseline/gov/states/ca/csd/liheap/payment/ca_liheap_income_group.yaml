- name: Case 2, two-person half-cent rounding follows the printed upper bound.
  period: 2026
  # 125% of two-person FPG 21_150 /12=2203.125; the table rounds to 2203.13.
  # That printed value is group 2;2203.14 is group 3.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 26_437.56
      person2: {age: 33, is_citizen_or_legal_immigrant: true, ssi: 0}
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 26_437.68
      person4: {age: 33, is_citizen_or_legal_immigrant: true, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
      spm_unit2:
        members: [person3, person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        snap: 0
        ca_tanf: 0
        ca_state_supplement: 0
    households:
      household1:
        members: [person1, person2]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
      household2:
        members: [person3, person4]
        state_code: CA
        county: ALAMEDA_COUNTY_CA
  output:
    ca_liheap_income_group: [2, 3]

