- name: California pregnancy counting remains isolated in a mixed-state population
  period: 2025
  input:
    people:
      ca_person1:
        age: 35
        employment_income: 80000
      ca_person2:
        age: 35
        current_pregnancies: 2
      ca_person3:
        age: 8
      ks_person1:
        age: 35
        employment_income: 80000
      ks_person2:
        age: 35
        current_pregnancies: 1
      ks_person3:
        age: 8
    tax_units:
      ca_tax_unit:
        members:
        - ca_person1
        - ca_person2
        - ca_person3
      ks_tax_unit:
        members:
        - ks_person1
        - ks_person2
        - ks_person3
    marital_units:
      ca_marital_unit:
        members:
        - ca_person1
        - ca_person2
      ca_marital_unit2:
        members:
        - ca_person3
      ks_marital_unit:
        members:
        - ks_person1
        - ks_person2
      ks_marital_unit2:
        members:
        - ks_person3
    families:
      ca_family:
        members:
        - ca_person1
        - ca_person2
        - ca_person3
      ks_family:
        members:
        - ks_person1
        - ks_person2
        - ks_person3
    spm_units:
      ca_spm_unit:
        members:
        - ca_person1
        - ca_person2
        - ca_person3
      ks_spm_unit:
        members:
        - ks_person1
        - ks_person2
        - ks_person3
    households:
      ca_household:
        members:
        - ca_person1
        - ca_person2
        - ca_person3
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
      ks_household:
        members:
        - ks_person1
        - ks_person2
        - ks_person3
        state_code: KS
  output:
    medicaid_household_size:
    - 5
    - 5
    - 5
    - 3
    - 4
    - 3
    ca_medicaid_household_pregnancies:
    - 2
    - 2
    - 2
    - 0
    - 0
    - 0
- name: California MCAP insurance exclusion is applied per person in a mixed-state population
  period: 2025
  input:
    people:
      ca_blocked:
        age: 30
        is_pregnant: true
        has_esi: true
        medicaid_income_level: 2.5
        is_medicaid_eligible: false
      tx_control:
        age: 30
        is_pregnant: true
        has_esi: true
        medicaid_income_level: 2
        is_medicaid_eligible: false
      ca_uninsured:
        age: 30
        is_pregnant: true
        medicaid_income_level: 2.5
        is_medicaid_eligible: false
    households:
      ca_blocked:
        members:
        - ca_blocked
        state_code: CA
      tx_control:
        members:
        - tx_control
        state_code: TX
      ca_uninsured:
        members:
        - ca_uninsured
        state_code: CA
    tax_units:
      ca_blocked:
        members:
        - ca_blocked
      tx_control:
        members:
        - tx_control
      ca_uninsured:
        members:
        - ca_uninsured
    marital_units:
      ca_blocked:
        members:
        - ca_blocked
      tx_control:
        members:
        - tx_control
      ca_uninsured:
        members:
        - ca_uninsured
  output:
    is_chip_fcep_eligible_person:
    - false
    - true
    - true
    chip_category:
    - NONE
    - PREGNANT_FCEP
    - PREGNANT_FCEP
