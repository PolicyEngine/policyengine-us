# Cases 11 onward: interactions with Medi-Cal pregnancy counting (DHCS ACWDL
# 20-10, pp. 3-5), the MCAP insurance exclusion (WIC §§ 15833-15834, applied
# through the CHIP FCEP formula), CARE and WIC. With a pregnant spouse the
# household size is 3 + 1 unborn = 4 and the 2025 four-person FPG is 32,150,
# so 80,000 is 2.49 FPL: the pregnant spouse qualifies for MCAP (213 to 322
# percent) and the child for Medi-Cal (at or below 266 percent).
- name: Case 11, pregnant-parent household preserves Medi-Cal, CARE and WIC for child age 8.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
        is_pregnant: true
      person3:
        age: 8
        is_wic_at_nutritional_risk: true
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        pre_subsidy_electricity_expense: 2_400
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size: [4, 4, 4]
    is_medicaid_eligible: [false, false, true]
    ca_cchip_eligible: [false, false, false]
    chip_category: [NONE, PREGNANT_FCEP, NONE]
    # CARE is categorical through the child's Medi-Cal enrollment
    # (gov.states.ca.cpuc.care.eligibility.categorical); 2,400 x 32.5% = 780.
    ca_care_eligible: true
    ca_care: 780
    # An 8-year-old has no WIC category, and the pregnant spouse fails the WIC
    # income test (80,000 exceeds 1.85 x FPG for four) with no Medi-Cal,
    # SNAP or TANF categorical path.
    wic: [0, 0, 0]
    is_aca_ptc_eligible: [true, false, false]

