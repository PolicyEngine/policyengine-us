# California County Children's Health Initiative Program (CCHIP) end to end.
# Married couple with one child, 2025. The three-person FPG is 26,650, so
# 80,000 of employment income is 300 percent FPL (medicaid_income_level 3.0),
# inside the CCHIP band (above the 266 percent Medi-Cal child limit, at or
# below 322 percent). per_capita_chip is California separate-CHIP spending
# divided by enrollment from the MACPAC calibration parameters.
- name: Case 1, Santa Clara County child at 300 percent FPL gets CCHIP and loses ACA PTC eligibility.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_income_level: [3, 3, 3]
    is_medicaid_eligible: [false, false, false]
    ca_cchip_eligible: [false, false, true]
    chip_category: [NONE, NONE, CHILD_CCHIP]
    is_chip_eligible: [false, false, true]
    # 678,088,532 / 51,684 = 13,119.89
    per_capita_chip: [0, 0, 13_119.89]
    chip: [0, 0, 13_119.89]
    is_aca_ptc_eligible: [true, true, false]

