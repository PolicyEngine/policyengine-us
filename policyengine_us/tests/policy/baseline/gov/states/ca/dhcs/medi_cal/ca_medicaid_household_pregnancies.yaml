- name: California counts a known externally claimed pregnant dependent without doubling her pregnancy
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 80000
      dependent:
        age: 17
        current_pregnancies: 1
        medicaid_claiming_tax_unit_id: 1
    tax_units:
      claimant:
        members:
        - parent
        tax_unit_id: 1
      dependent_return:
        members:
        - dependent
        tax_unit_id: 2
    families:
      one:
        members:
        - parent
      two:
        members:
        - dependent
    marital_units:
      one:
        members:
        - parent
      two:
        members:
        - dependent
    households:
      one:
        members:
        - parent
        state_code: CA
      two:
        members:
        - dependent
        state_code: CA
  output:
    medicaid_household_size:
    - 3
    - 3
    ca_medicaid_household_pregnancies:
    - 1
    - 1
