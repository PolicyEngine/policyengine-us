# DHCS ACWDL 20-10, pp. 3-5; MAGI Household Size Flowchart, steps 7-8.
- name: California joint filers and dependent count twins once in each household
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80000
      person2:
        age: 35
        current_pregnancies: 2
      person3:
        age: 8
    families:
      family:
        members:
        - person1
        - person2
        - person3
    marital_units:
      marital_unit:
        members:
        - person1
        - person2
      marital_unit2:
        members:
        - person3
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        - person3
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
    households:
      household:
        members:
        - person1
        - person2
        - person3
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size:
    - 5
    - 5
    - 5
    ca_medicaid_household_pregnancies:
    - 2
    - 2
    - 2
