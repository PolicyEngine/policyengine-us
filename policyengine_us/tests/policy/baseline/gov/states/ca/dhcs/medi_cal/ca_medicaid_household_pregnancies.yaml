        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size: [2, 2, 2]
    ca_medicaid_household_pregnancies: [0, 1, 0]

- name: Case 7, a known externally claimed pregnant dependent is counted without doubling her pregnancy.
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 80_000
      person2:
        age: 17
        current_pregnancies: 1
        medicaid_claiming_tax_unit_id: 1
    tax_units:
      claimant:
        members: [person1]
        tax_unit_id: 1
      dependent_return:
        members: [person2]
        tax_unit_id: 2
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        state_code: CA
      household2:
        members: [person2]
        state_code: CA
  output:
    # Claimant plus the claimed dependent plus her unborn child.
    medicaid_household_size: [3, 3]
    ca_medicaid_household_pregnancies: [1, 1]

- name: Case 8, non-California pregnancy household treatment is preserved.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
        current_pregnancies: 1
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: KS
  output:
    # Outside California only the pregnant member's own household grows.
    medicaid_household_size: [3, 4, 3]
    ca_medicaid_household_pregnancies: [0, 0, 0]

# ACWDL 20-10, p. 5, non-filer rule for a child: the child, the child's
# children, the child's parents in the home and siblings. A pregnant teen mother
# is both a child-age member and a parent, so the union sum counts her one
# pregnancy once for herself and for her baby.
- name: Case 9, a pregnant teen mother claimed on another return counts her pregnancy once for herself and her baby.
  period: 2025
  input:
    people:
      person1:
        # Custodial mother, files alone and does not claim her daughter.
        age: 40
        employment_income: 110_000
        own_children_in_household: 1
      person2:
        # Pregnant 17-year-old daughter with her own child, claimed on the
        # non-custodial parent's return (ACWDL 20-10, p. 5, exception 3).
        age: 17
        current_pregnancies: 1
        own_children_in_household: 1
        claimed_as_dependent_on_another_return: true
      person3:
        age: 1
        claimed_as_dependent_on_another_return: true
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
    tax_units:
      tax_unit1:
        members: [person1]
        tax_unit_is_filer: true
      tax_unit2:
        members: [person2, person3]
        tax_unit_is_filer: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_uses_non_filer_rules: [false, true, true]
    # person1 follows her own return (no pregnancy in it); person2 and person3
    # sum pregnancies once over the union of child-age members and parents.
    ca_medicaid_household_pregnancies: [0, 1, 1]
    # Eligibility is not asserted: under DHCS non-filer rules (Box C) the
    # infant's household is the infant and the teen mother, not the grandmother,
    # and the model's current composition for the infant is a follow-up.

# ACWDL 20-10, p. 5, non-filer rule for a child: both 18-year-old parents are
# child-age members (under 19) and parents, and each is the other's spouse.
# The wife's pregnancy is already inside the union sum for the husband, so the
# spouse channel must not add it again; every member counts it exactly once.
- name: Case 10, married non-filing 18-year-old parents count the wife's pregnancy once for each member.
  period: 2025
  input:
    people:
      person1:
        age: 18
        own_children_in_household: 1
      person2:
        age: 18
        own_children_in_household: 1
        current_pregnancies: 1
      person3:
        age: 1
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        tax_unit_is_filer: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    # person1 and person2 are the unit's head and spouse in a non-filing unit
    # with no claim elsewhere; person3 is their dependent claimed by a parent in
    # the same unit with both parents present, so no tax-dependent exception
    # applies and the child follows the parents' tax household (one pregnancy).
    medicaid_uses_non_filer_rules: [true, true, false]
    # person1: wife's pregnancy via the (child | is_parent) union only, not
    # again through the spouse channel; person2: her own pregnancy once;
    # person3: the tax household sum over the unit.
    ca_medicaid_household_pregnancies: [1, 1, 1]
