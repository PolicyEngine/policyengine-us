        members: [person1]
      person2:
        members: [person2]
      person3:
        members: [person3]
    tax_units:
      tax1:
        members: [person1, person3]
        tax_unit_is_filer: true
      tax2:
        members: [person2]
        tax_unit_is_filer: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
