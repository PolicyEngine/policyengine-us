# DHCS ACWDL 20-10, pp. 3-5; MAGI Household Size Flowchart, steps 7-8.
- name: Case 1, joint filers and dependent count twins once in each household.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
        current_pregnancies: 2
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    # Tax household of 3 plus the 2 expected children.
    medicaid_household_size: [5, 5, 5]
    ca_medicaid_household_pregnancies: [2, 2, 2]

- name: Case 2, a pregnant dependent counts for both parents and the dependent.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
      person3:
        age: 17
        current_pregnancies: 1
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size: [4, 4, 4]
    ca_medicaid_household_pregnancies: [1, 1, 1]

- name: Case 3, all expected children count across multiple pregnant members.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
      person2:
        age: 35
        current_pregnancies: 1
      person3:
        age: 17
        current_pregnancies: 2
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    # 3 members plus 1 + 2 expected children.
    medicaid_household_size: [6, 6, 6]
    ca_medicaid_household_pregnancies: [3, 3, 3]

- name: Case 4, separately filing unmarried parents with a pregnancy.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
        own_children_in_household: 1
      person2:
        age: 35
        own_children_in_household: 1
        current_pregnancies: 1
        employment_income: 10_000
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      person1:
        members: [person1]
      person2:
        members: [person2]
      person3:
        members: [person3]
    tax_units:
      tax1:
        members: [person1, person3]
        tax_unit_is_filer: true
        cohabitating_spouses: false
      tax2:
        members: [person2]
        tax_unit_is_filer: true
        cohabitating_spouses: false
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    # person1 and person2 follow their own returns (2 and 1 + 1 unborn); the
    # child lives with both parents, so the non-filer rule counts the child,
    # both parents and person2's unborn child.
    medicaid_household_size: [2, 2, 4]
    ca_medicaid_household_pregnancies: [0, 1, 1]

- name: Case 5, separately filing married parents with a pregnancy.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
        own_children_in_household: 1
      person2:
        age: 35
        own_children_in_household: 1
        current_pregnancies: 1
        employment_income: 10_000
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax1:
        members: [person1, person3]
        tax_unit_is_filer: true
        cohabitating_spouses: true
      tax2:
        members: [person2]
        tax_unit_is_filer: true
        cohabitating_spouses: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    # A cohabiting spouse joins each filer's household: person1 counts 2 + the
    # spouse + her unborn child; person2 counts herself, the spouse and the
    # unborn child.
    medicaid_household_size: [4, 3, 4]
    ca_medicaid_household_pregnancies: [1, 1, 1]

