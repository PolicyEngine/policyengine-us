# The county handbook excludes children with employer-sponsored coverage
# available, even when not enrolled; the ACA offer input is the model's proxy.
- name: Case 14, uninsured child with employer coverage available is not eligible.
  period: 2025
  input:
    age: 8
    state_code: CA
    county_str: SANTA_CLARA_COUNTY_CA
    is_medicaid_eligible: false
    medicaid_income_level: 3
    has_esi: false
    offered_aca_disqualifying_esi: true
  output:
    has_chip_disqualifying_health_coverage: false
    ca_cchip_eligible: false

# CMS SHO #12-002 excludes DACA from the CHIP lawfully residing option.
