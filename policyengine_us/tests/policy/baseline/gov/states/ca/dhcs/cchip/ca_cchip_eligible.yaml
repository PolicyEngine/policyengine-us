# Cases 18 and 19 let is_medicaid_eligible run from income instead of taking it
# as an input, proving that the 2.66 FPL Medi-Cal child limit is the CCHIP
# floor without a separate lower-bound parameter. Married parents with one
# child in 2025: the three-person FPG is 15,650 + 2 x 5,500 = 26,650. The
# published monthly Medi-Cal child ceiling is 2.66 x 26,650 / 12 = 5,907.42,
# rounded up to 5,908 (70,896 a year); the CCHIP ceiling is 3.22 x 26,650 / 12
# = 7,151.08, rounded up to 7,152 (85,824 a year).
- name: Case 18, child at 250 percent FPL is Medi-Cal eligible, so CCHIP excludes him without a lower-bound parameter.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        # 2.5 x 26,650 = 66,625, at or below the 70,896 Medi-Cal child ceiling.
        employment_income: 66_625
      person2:
        age: 35
      person3:
        age: 8
        immigration_status: CITIZEN
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size: [3, 3, 3]
    medicaid_income_level: [2.5, 2.5, 2.5]
    is_medicaid_eligible: [false, false, true]
    ca_cchip_eligible: [false, false, false]

- name: Case 19, child at 300 percent FPL is above the Medi-Cal child ceiling and inside the CCHIP band.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        # 3 x 26,650 = 79,950: above the 70,896 Medi-Cal child ceiling and at
        # or below the 85,824 CCHIP ceiling.
        employment_income: 79_950
      person2:
        age: 35
      person3:
        age: 8
        immigration_status: CITIZEN
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    medicaid_household_size: [3, 3, 3]
    medicaid_income_level: [3, 3, 3]
    is_medicaid_eligible: [false, false, false]
    ca_cchip_eligible: [false, false, true]
