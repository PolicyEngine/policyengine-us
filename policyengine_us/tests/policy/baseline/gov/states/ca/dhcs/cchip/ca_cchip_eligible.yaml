# California County Children's Health Initiative Program (CCHIP): children under
# 19 in San Francisco, San Mateo, or Santa Clara County who are not eligible for
# no-cost Medi-Cal and have household income at or below 322 percent of the FPL
# (state plan SPA CA-24-0012, Section 4.1 Population 1).
- name: Case 1, child in Santa Clara County at 300 percent FPL is eligible.
  period: 2025
  input:
    people:
      person1:
        age: 8
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 3
    households:
      household:
        members: [person1]
        state_code: CA
        county_str: SANTA_CLARA_COUNTY_CA
  output:
    ca_cchip_eligible: true

