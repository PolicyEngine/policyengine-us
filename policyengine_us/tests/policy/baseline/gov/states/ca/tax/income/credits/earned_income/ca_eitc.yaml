- name: CA EITC, no children, $20k income
  period: 2022
  absolute_error_margin: 20
  input:
    employment_income: 20_500
    eitc_child_count: 0
  output:
    ca_eitc: 88

- name: Tax unit with taxsimid 95611 in e21.its.csv and e21.ots.csv
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 68
        employment_income: 15010
        taxable_interest_income: 11010
        ssi: 0  # not in TAXSIM35
        ma_state_supplement: 0  # not in TAXSIM35
        wic: 0  # not in TAXSIM35
      person2:
        age: 11
        ssi: 0  # not in TAXSIM35
        ma_state_supplement: 0  # not in TAXSIM35
        wic: 0  # not in TAXSIM35
      person3:
        age: 11
        ssi: 0  # not in TAXSIM35
        ma_state_supplement: 0  # not in TAXSIM35
        wic: 0  # not in TAXSIM35
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        snap: 0  # not in TAXSIM35
        tanf: 0  # not in TAXSIM35
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        aca_ptc: 0  # not in TAXSIM35
        ca_use_tax: 0  # not in TAXSIM35
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:  # expected results from patched TAXSIM35 2023-02-22 version
    # expected US results:
    eitc: 0  # too much investment income to be eligible
    income_tax: -9648
    # expected CA results:
    ca_income_tax_before_credits: 164.14  # this is a PolicyEngineUS output
    ca_exemptions: 1_058  # treated as a nonrefundable credit
    ca_income_tax_before_refundable_credits: 0
    ca_eitc: 0  # too much investment income to be CalEITC eligible
    ca_income_tax: 0

- name: A qualifying ITIN child uses the one-child CalEITC schedule
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_tax_unit_head: true
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
        has_tin: true
      child:
        age: 8
        is_tax_unit_dependent: true
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      unit:
        members: [parent, child]
        ca_eitc_eligible: true
        ca_eitc_earned_income: 1_000
        adjusted_gross_income: 1_000
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    eitc_child_count: 0
    # $1,000 * .34 * .85, rather than the childless $65.025.
    ca_eitc: 289

- name: A child without an SSN or ITIN does not increase CalEITC
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_tax_unit_head: true
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
        has_tin: true
      child:
        age: 8
        is_tax_unit_dependent: true
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: false
    tax_units:
      unit:
        members: [parent, child]
        ca_eitc_eligible: true
        ca_eitc_earned_income: 1_000
        adjusted_gross_income: 1_000
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    eitc_child_count: 0
    ca_eitc: 65.025

- name: Four ITIN qualifying children use the three-or-more-child CalEITC schedule
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        is_tax_unit_head: true
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
        has_tin: true
      child1:
        age: 12
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: true
      child2:
        age: 10
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: true
      child3:
        age: 8
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: true
      child4:
        age: 6
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      unit:
        members: [parent, child1, child2, child3, child4]
        ca_eitc_eligible: true
        ca_eitc_earned_income: 1_000
        adjusted_gross_income: 1_000
    households:
      household:
        members: [parent, child1, child2, child3, child4]
        state_code: CA
  output:
    eitc_child_count: 0
    # $1,000 * .45 * .85; the count itself is not capped at three.
    ca_eitc: 382.5
