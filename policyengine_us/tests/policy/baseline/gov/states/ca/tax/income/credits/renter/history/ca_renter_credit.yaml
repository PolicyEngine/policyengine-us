# Wage-only control: $40,079 gross wages, no other gross income, deductions,
# or California additions/subtractions gives $40,079 California AGI. The 2017
# current-law source limits single-filer AGI to $40,078, so $40,079 gives no credit.
# The same renter premises above apply. Compute AGI from raw earnings.
- name: 2017 single renter computes income above the cap from raw wages
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        employment_income_before_lsr: 40_079
        rent: 6_000
        claimed_as_dependent_on_another_return: false
        lives_with_claiming_taxpayer: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
    households:
      household:
        members: [filer]
        state_code: CA
  output:
    ca_agi: 40_079
    ca_renter_credit: 0
