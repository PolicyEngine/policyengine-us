- name: Case 1, investment interest is not counted twice.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
  output:
    ca_itemized_deductions_pre_limitation: 10_000

- name: Case 2, California investment interest replaces federal investment interest.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
    investment_expenses: 2_000
    real_estate_taxes: 5_000
  output:
    ca_itemized_deductions_pre_limitation: 13_000

- name: California deducts charitable gifts below the federal charitable floor.
  period: 2026
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    charitable_cash_donations: 100
    real_estate_taxes: 10_000
  output:
    charitable_deduction: 0
    ca_itemized_deductions_pre_limitation: 10_100

- name: California retains employee expenses above two percent of federal AGI.
  period: 2026
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    unreimbursed_business_employee_expenses: 2_400
    tax_preparation_fees: 100
    real_estate_taxes: 10_000
  output:
    misc_deduction: 0
    ca_itemized_deductions_pre_limitation: 10_500
    ca_amti_adjustments: 10_500

- name: California charitable gifts are capped at fifty percent of federal AGI.
  period: 2026
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    charitable_cash_donations: 60_000
  output:
    charitable_deduction: 59_500
    ca_itemized_deductions_pre_limitation: 50_000

- name: California already retains miscellaneous deductions before 2026.
  period: 2025
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    unreimbursed_business_employee_expenses: 2_500
    real_estate_taxes: 10_000
  output:
    misc_deduction: 0
    ca_itemized_deductions_pre_limitation: 10_500

- name: California already caps charitable deductions before 2026.
  period: 2025
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    charitable_cash_donations: 60_000
  output:
    charitable_deduction: 60_000
    ca_itemized_deductions_pre_limitation: 50_000

- name: California nonconformity continues after 2026.
  period: 2027
  input:
    state_code: CA
    age: 40
    employment_income: 100_000
    charitable_cash_donations: 100
    unreimbursed_business_employee_expenses: 2_500
    real_estate_taxes: 10_000
  output:
    charitable_deduction: 0
    misc_deduction: 0
    ca_itemized_deductions_pre_limitation: 10_600

