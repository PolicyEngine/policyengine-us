- name: Case 1, California SDI uses the California HSA addback wage base.
  period: 2026
  input:
    employment_income: 6_000
    pre_tax_health_insurance_premiums: 1_000
    health_savings_account_payroll_contributions: 1_000
    state_code: CA
  output:
    ca_employee_state_disability_insurance_contribution: 65

- name: Case 2, California SDI in 2023 uses the 0.9% rate below the taxable wage limit.
  period: 2023
  input:
    employment_income: 60_000
    state_code: CA
  output:
    # DE 3395: 2023 SDI rate 0.9%, taxable wage limit $153,164.
    # 0.9% x 60,000 = 540.
    ca_employee_state_disability_insurance_contribution: 540

- name: Case 3, California SDI in 2023 stops at the taxable wage limit.
  period: 2023
  absolute_error_margin: 0.01
  input:
    employment_income: 200_000
    state_code: CA
  output:
    # 0.9% x min(200,000, 153,164) = 1,378.48, the 2023 maximum withholding.
    ca_employee_state_disability_insurance_contribution: 1_378.48

- name: Case 4, California SDI in 2024 uses the 1.1% rate on all wages.
  period: 2024
  input:
    employment_income: 200_000
    state_code: CA
  output:
    # DE 3395: 2024 SDI rate 1.1%; no taxable wage limit from 2024 (UIC 985(b)).
    # 1.1% x 200,000 = 2,200.
    ca_employee_state_disability_insurance_contribution: 2_200

- name: Case 5, California SDI in 2025 uses the 1.2% rate.
  period: 2025
  input:
    employment_income: 60_000
    state_code: CA
  output:
    # DE 3395: 2025 SDI rate 1.2%. 1.2% x 60,000 = 720.
    ca_employee_state_disability_insurance_contribution: 720

- name: Case 6, California SDI in 2026 uses the 1.3% rate on all wages.
  period: 2026
  input:
    employment_income: 200_000
    state_code: CA
  output:
    # DE 3395: 2026 SDI rate 1.3%, no wage limit. 1.3% x 200,000 = 2,600.
    ca_employee_state_disability_insurance_contribution: 2_600

- name: Case 7, California SDI in 2010 stops at the 2010 taxable wage limit.
  period: 2010
  absolute_error_margin: 0.01
  input:
    employment_income: 200_000
    state_code: CA
  output:
    # DE 3395 Rev. 55: 2010 SDI rate 1.1%, taxable wage limit $93,316.
    # 1.1% x min(200,000, 93,316) = 1,026.476.
    ca_employee_state_disability_insurance_contribution: 1_026.48

