- name: Case 13, California SDI in 2022 limits each earner's wages separately.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 200_000
      person2:
        employment_income: 50_000
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # DE 3395 Rev. 69: 2022 SDI rate 1.1%, taxable wage limit $145,600.
    # person1: 1.1% x min(200,000, 145,600) = 1,601.60.
    # person2: 1.1% x 50,000 = 550.
    ca_employee_state_disability_insurance_contribution: [1_601.60, 550]
