# 2024 Schedule CA (540) instructions, line 15 (Form 540 booklet, PDF p. 66):
# federal law allows the personal casualty and theft loss deduction only for a
# federally declared disaster; "California law does not conform." Filers
# "complete another federal Form 4684 ... using California amounts".
# Cal. Rev. & Tax. Code 17204(b) (as amended by SB 711, 2025): 26 U.S.C.
# 165(h)(5) "shall not apply".
# FTB Publication 1034 (PDF p. 4): "subtract $100 and then 10% of your federal
# adjusted gross income."
# 2024 Form 4684: line 11 enters $100; line 17 enters 10% of adjusted gross
# income from Form 1040 line 11; line 18 is line 16 less line 17, not below 0.
# A joint return is one individual for the $100 rule (165(h)(4)(B)). The model
# records one loss amount per person, not separate casualty events, so a
# return's losses are treated as one casualty. A dependent's loss belongs on
# the dependent's own return, as the dependent's income does.

- name: Case 1, the $100 reduction applies before the 10 percent floor.
  period: 2024
  input:
    state_code: CA
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    # Form 4684: line 12 = 15,000 - 100 = 14,900; line 17 = 10% x 100,000
    # = 10,000; line 18 = 14,900 - 10,000.
    ca_casualty_loss_deduction: 4_900
    # California allows the loss though the federal deduction is suspended.
    casualty_loss_deduction: 0

- name: Case 2, a loss $100 above the floor nets to zero.
  period: 2024
  input:
    state_code: CA
    employment_income: 100_000
    casualty_loss: 10_100
  output:
    # (10,100 - 100) - 10% x 100,000 = 10,000 - 10,000
    ca_casualty_loss_deduction: 0

- name: Case 3, a loss $101 above the floor leaves $1.
  period: 2024
  input:
    state_code: CA
    employment_income: 100_000
    casualty_loss: 10_101
  output:
    # (10,101 - 100) - 10% x 100,000 = 10,001 - 10,000
    ca_casualty_loss_deduction: 1

- name: Case 4, a loss of exactly $100 is fully absorbed by the $100 reduction.
  period: 2024
  input:
    state_code: CA
    casualty_loss: 100
  output:
    ca_casualty_loss_deduction: 0

- name: Case 5, with no income a loss is deductible above the $100.
  period: 2024
  input:
    state_code: CA
    casualty_loss: 101
  output:
    # (101 - 100) - 10% x 0
    ca_casualty_loss_deduction: 1

- name: Case 6, Publication 547 Example 1 with $80,000 of AGI.
  period: 2024
  input:
    state_code: CA
    employment_income: 80_000
    casualty_loss: 14_800
  output:
    # IRS Publication 547 (2017, PDF p. 10), Example 1: loss after
    # reimbursement 14,800; subtract $100 = 14,700; subtract 10% of 80,000 AGI
    # = 6,700.
    ca_casualty_loss_deduction: 6_700

- name: Case 7, the floor uses federal AGI, not California AGI.
  period: 2024
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    ca_agi: 60_000
    casualty_loss: 15_000
  output:
    # (15,000 - 100) - 10% x 100,000 federal AGI = 4,900. On California AGI it
    # would be 14,900 - 6,000 = 8,900.
    ca_casualty_loss_deduction: 4_900

- name: Case 8, a negative federal AGI gives no floor, not a larger loss.
  period: 2024
  input:
    state_code: CA
    adjusted_gross_income: -20_000
    casualty_loss: 15_000
  output:
    # The 10% floor is not allowed below zero: 15,000 - 100.
    ca_casualty_loss_deduction: 14_900

- name: Case 9, a joint return reduces the spouses' pooled losses by $100 once.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        casualty_loss: 10_000
      person2:
        age: 40
        employment_income: 40_000
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    filing_status: JOINT
    # (10,000 + 5,000 - 100) - 10% x 100,000 = 14,900 - 10,000
    ca_casualty_loss_deduction: 4_900

- name: Case 10, a dependent's loss is left to the dependent's own return.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        casualty_loss: 15_000
      person2:
        age: 10
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    is_tax_unit_dependent: [false, true]
    # The child's 5,000 is not the parent's loss.
    # (15,000 - 100) - 10% x 100,000 = 14,900 - 10,000
    ca_casualty_loss_deduction: 4_900

- name: Case 11, a loss only the dependent had gives the parent nothing.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
      person2:
        age: 10
        casualty_loss: 15_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    is_tax_unit_dependent: [false, true]
    ca_casualty_loss_deduction: 0

- name: Case 12, California keeps allowing the loss under its 2025 conformity date.
  period: 2026
  input:
    state_code: CA
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    # R&TC 17204(b) turns 165(h)(5) off for taxable years from 2025.
    ca_casualty_loss_deduction: 4_900
    casualty_loss_deduction: 0

- name: Case 13, the deduction is zero outside California.
  period: 2024
  input:
    state_code: NY
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    ca_casualty_loss_deduction: 0

- name: Case 14, lifting the federal suspension does not change California's deduction.
  period: 2024
  input:
    gov.irs.deductions.itemized.casualty.active: true
    state_code: CA
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    # California's deduction does not read the federal switch.
    ca_casualty_loss_deduction: 4_900
