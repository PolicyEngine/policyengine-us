# RTC 17054 and the Form 540 line 6-10 instructions: a filer whom another
# taxpayer can claim gets no personal, blind or senior credit (line 7 enters
# 0 for a single or head of household filer, and on a joint return 1 when only
# one spouse can be claimed and 0 when both can), and the dependents must be
# federal dependents, of which such a return has none (IRC 152(b)(1)). 2025
# amounts: $153 per personal, blind or senior credit and $475 per dependent;
# income is zero, so nothing phases out.

- name: 2025 single filer who can be claimed as a dependent with a child gets no exemption credits
  period: 2025
  input:
    people:
      filer:
        age: 30
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: CA
  output:
    ca_exemptions: 0

- name: 2025 single filer who cannot be claimed with a child gets the personal and dependent credits
  period: 2025
  input:
    people:
      filer:
        age: 30
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: CA
  output:
    # $153 + $475.
    ca_exemptions: 628

- name: 2025 joint return with one claimable spouse with a child gets only the other spouse's personal credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: CA
  output:
    ca_exemptions: 153

