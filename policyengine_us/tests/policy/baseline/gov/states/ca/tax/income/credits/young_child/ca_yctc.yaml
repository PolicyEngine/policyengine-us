        self_employment_income: -35_640
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    ca_taxable_wages: [35_640, 0]
    ca_eitc_earned_income: 0
    ca_eitc: 0
    ca_agi: 0
