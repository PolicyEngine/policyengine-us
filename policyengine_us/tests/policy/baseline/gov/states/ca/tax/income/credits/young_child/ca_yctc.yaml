- name: Zero earnings with losses, but still eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        short_term_capital_gains: -20_000  # modest capital losses
      child:
        age: 5
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # ca_eitc: 0  # because of zero earnings
    ca_yctc: 1_083  # the full YCTC amount in 2022 via the 2022 YCTC reform

- name: Zero earnings with large losses, so not eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        short_term_capital_gains: -40_000  # large capital losses
      child:
        age: 5
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # ca_eitc: 0  # because of zero earnings
    ca_yctc: 0  # not eligible for YCTC in 2022 because of large losses

# R&TC 17052.1(b)(1)(B) and the 2022 FTB 3514 instructions, Step 8 (lines 23a
# and 23b): a filer with zero or negative earned income qualifies only if net
# losses (Form 540 line 17 without utilization limitations) and wages are each
# $32,490 or less in 2022.
- name: Self-employment loss above wages, modest net loss, so eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
        self_employment_income: -30_000
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # Earned income -10,000; net loss 10,000; wages 20,000.
    ca_yctc: 1_083

- name: Wages above $32,490 with negative earned income, so not eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        employment_income: 71_846
        self_employment_income: -92_009
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # Line 23a: wages of $71,846 exceed $32,490.
    ca_yctc: 0

- name: Self-employment net loss above $32,490, so not eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
        self_employment_income: -80_000
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # Line 23b: net loss of $60,000 exceeds $32,490.
    ca_yctc: 0

- name: Capital gain distributions reduce a self-employment loss to within $32,490, so eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        self_employment_income: -35_000
        non_sch_d_capital_gains: 3_000
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # Line 23b: Form 540 line 17 is -35,000 + 3,000 = -32,000, a net loss of
    # $32,000, within $32,490. Investment income of $3,000 is within $4,389.
    ca_yctc: 1_083

- name: A dependent's wages do not count toward the $32,490 wage limit in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        self_employment_income: -10_000
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
      teen:
        age: 17
        employment_income: 40_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child, teen]
    households:
      household:
        members: [parent, child, teen]
        state_code: CA
  output:
    # Line 23a carries the filer's wages (line 13), which are $0; the
    # dependent's $40,000 is on the dependent's own return.
    ca_yctc: 1_083
