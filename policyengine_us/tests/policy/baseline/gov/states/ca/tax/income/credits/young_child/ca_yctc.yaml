# R&TC 17052.1(b)(1)(B) and the 2022 FTB 3514 instructions, Step 8 (lines 23a
# and 23b): a filer with zero or negative earned income qualifies only if net
# losses (Form 540 line 17 without utilization limitations) and wages are each
# $32,490 or less in 2022.
- name: Self-employment loss above wages, modest net loss, so eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
        self_employment_income: -30_000
      child:
        age: 3
        ca_is_qualifying_child_for_caleitc: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # Earned income -10,000; net loss 10,000; wages 20,000.
    ca_yctc: 1_083

# R&TC 17052.1(b)(1)(B)(iii), (b)(2); 2025 FTB 3514 lines 13 and 23a:
# the wage ceiling uses California taxable wages (W-2 box 16), excluding
# traditional elective deferrals. Line 23 uses the net earned income on line 19.
- name: Traditional deferrals and a business loss leave zero earned income and eligible California taxable wages
  period: 2025
  input:
    people:
      parent:
        age: 35
        employment_income: 40_000
        traditional_401k_contributions_desired: 10_000
        self_employment_income: -30_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    # FTB 3514 line 13 feeds the line 23a compensation ceiling.
    ca_taxable_wages: [30_000, 0]
    ca_eitc_earned_income: 0
    ca_eitc: 0
    ca_agi: 0
    ca_yctc: 1_189

- name: California taxable wages exactly at the zero-earned-income YCTC ceiling remain eligible
