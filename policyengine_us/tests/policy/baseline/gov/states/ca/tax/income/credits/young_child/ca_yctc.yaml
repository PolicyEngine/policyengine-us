  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 10_000
        farm_operations_income: -15_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: CA
  output:
    # FTB 3514 line 19: 10,000 wages - 15,000 farm loss, floored at 0.
    ca_eitc_earned_income: 0
    # Step 8: earned income of zero or less; the 5,000 net loss and the
    # 10,000 wages are within the 2022 $32,490 limits, so the full $1,083.
    ca_yctc: 1_083

