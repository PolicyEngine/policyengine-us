- name: Capital gain distributions reduce a self-employment loss to within $32,490, so eligible in 2022.
  period: 2022
  input:
    people:
      parent:
        age: 30
        self_employment_income: -35_000
        non_sch_d_capital_gains: 3_000
      child:
