- name: Case 11, California itemized deductions replace the federal mortgage interest.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        home_mortgage_interest: 60_000
        real_estate_taxes: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        first_home_mortgage_balance: 1_500_000
        first_home_mortgage_origination_year: 2020
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    interest_deduction: 30_000
    # $43,980 mortgage interest + $10,000 real estate taxes.
    ca_itemized_deductions_pre_limitation: 53_980
