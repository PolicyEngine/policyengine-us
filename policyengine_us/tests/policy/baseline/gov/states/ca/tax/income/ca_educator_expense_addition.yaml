# R&TC 17072(b) disallows IRC 62(a)(2)(D), with no sunset.
# FTB 2025 Schedule CA (540), Section C, line 11, requires restoring the
# federal deduction claimed: https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf#page=64
# Thus $50,000 wages less a $300 federal deduction gives $49,700 federal AGI
# and $49,700 + $300 = $50,000 California AGI. Over-cap expenses and dependent
# expenses are not added back unless claimed on this federal return.
# Federal per-educator caps: $250 through 2021, $300 in 2022-2025, $350 in 2026;
# see the IRS references on educator_expense_ald_person.

- name: 2015, California restores the claimed deduction for $200 of expenses
  period: 2015
  input:
    people:
      teacher:
        age: 40
        employment_income: 50000
        educator_expense: 200
    tax_units:
      tax_unit:
        members: &id001
        - teacher
    households:
      household:
        members: *id001
        state_code: CA
  output:
    educator_expense_ald: 200
    adjusted_gross_income: 49800
    ca_educator_expense_addition: 200
    ca_additions: 200
    ca_agi: 50000
