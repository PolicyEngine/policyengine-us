- name: California carries the federal deduction for Publication 525 Example 40.
  # IRS Publication 525 (2025), Example 40, as a California resident.
  # https://www.irs.gov/pub/irs-prior/p525--2025.pdf#page=37
  # Schedule CA (540), Part II line 16, retains the federal deduction in
  # column A when California also deducts the repayment.
  # https://www.ftb.ca.gov/forms/2025/2025-540-ca-instructions.html
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 65_700
        charitable_cash_donations: 15_750
        claim_of_right_repayment: 5_000
    tax_units:
      tax_unit:
        members: [head]
        claim_of_right_prior_year_tax_decrease: 568
    households:
      household:
        members: [head]
        state_code: CA
  output:
    ca_income_tax: 1_078.89
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    ca_itemized_deductions_pre_limitation: 20_750
    ca_taxable_income: 44_950

# 2026 married couples with no dependents, from FTB Tax News, October 2026,
# 2026 Indexing: $11,800 standard deduction, Schedule Y, and $316 of personal
# exemption credits for joint filers.
# https://www.ftb.ca.gov/about-ftb/newsroom/tax-news/2026/10.html#article1

- name: 2026 married couple with $70,000 of California AGI and no dependents
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 70_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_agi: 70_000
    # 70,000 - 11,800
    ca_taxable_income: 58_200
    # 857.16 + 4% x (58,200 - 54,314)
    ca_income_tax_before_credits: 1_012.60
    ca_exemptions: 316
    # 1,012.60 - 316
    ca_income_tax: 696.60

- name: 2026 married couple with $60,000 of California AGI and no dependents
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_agi: 60_000
    # 60,000 - 11,800
    ca_taxable_income: 48_200
    # 229.12 + 2% x (48,200 - 22,912)
    ca_income_tax_before_credits: 734.88
    ca_exemptions: 316
    # 734.88 - 316
    ca_income_tax: 418.88
