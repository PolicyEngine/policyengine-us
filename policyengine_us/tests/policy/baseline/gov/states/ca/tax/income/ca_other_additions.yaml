- name: Default ca_other_additions is zero
  period: 2024
  input:
    state_code: CA
    employment_income: 50_000
  output:
    ca_other_additions: 0
    ca_additions: 0
    ca_agi: 50_000

- name: ca_other_additions increases CA AGI
  period: 2024
  input:
    state_code: CA
    employment_income: 50_000
    ca_other_additions: 1_000
  output:
    ca_other_additions: 1_000
    ca_additions: 1_000
    ca_agi: 51_000
