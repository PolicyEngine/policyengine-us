      household:
        members: [person_a, person_b]
        state_code: CA
  output:
    # max($1,350, $2,000 + $450) = $2,450 < $11,412.
    ca_standard_deduction: 2_450

- name: 2025 joint return with neither spouse claimable gets the full standard deduction
  period: 2025
  input:
    people:
