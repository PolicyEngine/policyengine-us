- name: CA 2026 single, $100,000 wages, passing U.S. government fund
  # $1,000 fund dividends x 35% = $350 subtracted; the 9.3% bracket cuts tax by $350 x 9.3% = $32.55.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 100_000
        non_qualified_dividend_income: 1_000
        us_govt_fund_1_ordinary_dividends: 1_000
        us_govt_fund_1_govt_income_share: 0.35
        us_govt_fund_1_govt_asset_share_q1: 0.5
        us_govt_fund_1_govt_asset_share_q2: 0.5
        us_govt_fund_1_govt_asset_share_q3: 0.5
        us_govt_fund_1_govt_asset_share_q4: 0.5
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    adjusted_gross_income: 101_000
    ca_us_govt_fund_dividend_subtraction: 350
    ca_agi: 100_650
    ca_taxable_income: 94_750
    ca_income_tax: 4_971.31

