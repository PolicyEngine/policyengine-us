# Schedule CA (540) subtracts the unemployment compensation in the filers'
# federal AGI (2020 and 2024 Schedule CA instructions, line 7). A dependent's
# compensation is on the dependent's own return.
- name: Case 1, the filer's taxable compensation is subtracted.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 30_000
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    adjusted_gross_income: 35_000
    ca_agi_subtractions: 5_000
    ca_agi: 30_000

- name: Case 2, a dependent's compensation, not in the filer's federal AGI, is not subtracted.
  period: 2024
  input:
    people:
      person1:
        age: 45
        employment_income: 30_000
        is_tax_unit_head: true
      person2:
        age: 17
        is_tax_unit_dependent: true
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    adjusted_gross_income: 30_000
    ca_agi_subtractions: 0
    ca_agi: 30_000

- name: Case 3, a dependent's 2020 compensation taxable on their own return is not subtracted.
  period: 2020
  input:
    people:
      person1:
        age: 45
        employment_income: 30_000
        is_tax_unit_head: true
      person2:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        dividend_income: 150_000
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # The dependent's own modified AGI is 150,000, so the 5,000 is taxable
    # on the dependent's federal return, not the filer's.
    taxable_unemployment_compensation: [0, 5_000]
    adjusted_gross_income: 30_000
    ca_agi_subtractions: 0
    ca_agi: 30_000
