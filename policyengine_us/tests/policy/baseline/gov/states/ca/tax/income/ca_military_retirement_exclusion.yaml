- name: Military retirement pay and SBP exclusion under R&TC §§ 17132.9 and 17132.10 (2025)
  period: 2025
  input:
    military_retirement_pay: 50_000
    military_retirement_pay_survivors: 10_000
    state_code: CA
  output:
    ca_military_retirement_exclusion: 20_000 + 10_000

- name: CA AGI cliff at $125,000 (excludes when AGI does not exceed limit)
  period: 2025
  input:
    state_code: CA
    employment_income: 105_000
    military_retirement_pay: 20_000
  output:
    ca_military_retirement_exclusion: 20_000

- name: CA AGI cliff at $125,001 (cliff denies exclusion when AGI exceeds limit)
  period: 2025
  input:
    state_code: CA
    employment_income: 105_001
    military_retirement_pay: 20_000
  output:
    ca_military_retirement_exclusion: 0

- name: CA joint return at $250,000 AGI limit
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 100_000
        military_retirement_pay: 25_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 100_000
        military_retirement_pay: 25_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_military_retirement_exclusion: 20_000

- name: CA dependent recipient does not generate exclusion on filer return
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 50_000
      dependent:
        is_tax_unit_dependent: true
        military_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: CA
  output:
    ca_military_retirement_exclusion: 0

- name: CA 2030 sunset of military retirement exclusion
  period: 2030
  input:
    state_code: CA
    military_retirement_pay: 20_000
  output:
    ca_military_retirement_exclusion: 0

- name: CA joint return with both spouses receiving military pay capped at $20,000 per return
  period: 2025
  input:
    people:
      head:
        age: 62
        is_tax_unit_head: true
        military_retirement_pay: 60_000
      spouse:
        age: 62
        is_tax_unit_spouse: true
        military_retirement_pay: 60_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_military_retirement_exclusion: 20_000
