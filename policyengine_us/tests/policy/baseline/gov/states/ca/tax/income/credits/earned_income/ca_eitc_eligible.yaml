# RTC 17052 keeps the IRC 32(c)(1)(A)(ii)(III) rule that a filer without a
# qualifying child must not be another taxpayer's dependent (FTB 3514, Step 4,
# question f). FTB 3514 skips that question on a joint return, since a married
# filer can be claimed only when the joint return seeks just a refund of
# withholding; as for the federal credit, a joint return on which either
# spouse can be claimed gets no credit without a qualifying child. A filer
# with a qualifying child is not barred.

- name: 2025 single filer who can be claimed as a dependent without a qualifying child is ineligible
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
    households:
      household:
        members: [filer]
        state_code: CA
  output:
    ca_eitc_eligible: false
    ca_eitc: 0

- name: 2025 single filer who cannot be claimed without a qualifying child is eligible
  period: 2025
  input:
    people:
      filer:
        age: 25
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
    households:
      household:
        members: [filer]
        state_code: CA
  output:
    # $1,000 x 7.65% x 0.85.
    ca_eitc_eligible: true
    ca_eitc: 65.025

- name: 2025 joint return with one claimable spouse without a qualifying child is ineligible (the claimable spouse is the head)
  period: 2025
  input:
