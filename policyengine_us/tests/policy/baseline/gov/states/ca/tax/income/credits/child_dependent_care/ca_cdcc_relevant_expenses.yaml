- name: test 6, disabled adult dependent's care expenses enter the base
  period: 2021
  input:
    people:
      person1:
        is_tax_unit_head: true
      person2:
        age: 18
        is_incapable_of_self_care: true
        is_tax_unit_dependent: true
        pre_subsidy_care_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_childcare_expenses: 0
        ca_cdcc_min_head_spouse_earned: 50_000
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # One qualifying individual at the pre-ARPA $3,000 cap:
    # min(10_000 adult care, 3_000, 50_000) = 3_000.
    ca_cdcc_relevant_expenses: 3_000

# FTB 3506 Part IV reduces the $3,000 / $6,000 dollar limit by the IRC § 129
# employer-provided dependent care benefits excluded from income, matching the
# federal § 21(c) reduction.
- name: Section 129 employer benefits reduce the California base
  period: 2024
  input:
    state_code: CA
    tax_unit_childcare_expenses: 10_000
    count_cdcc_eligible: 2
    min_head_spouse_earned: 50_000
    ca_cdcc_min_head_spouse_earned: 50_000
    dependent_care_assistance_exclusion: 5_000
  output:
    # California earned income equals federal earned income, so the
    # California exclusion is the federal 5,000, within the $5,000 cap.
    ca_dependent_care_assistance_exclusion: 5_000
    # min(10_000 expenses, $6,000 two-child cap - $5,000 exclusion, 50_000) = 1_000.
    ca_cdcc_relevant_expenses: 1_000

# IRC § 129(a)(2)(C), which California adopts with § 129, treats a separate
# filer living apart from their spouse as unmarried under § 21(e)(4), so the
# full employer benefit is excluded and reduces the dollar limit.
- name: Separate filer treated as unmarried has the base reduced by the full exclusion
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
      person3:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: SEPARATE
        tax_unit_childcare_expenses: 10_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    dependent_care_assistance_exclusion: 4_000
    # min(10_000 expenses, $6,000 two-child cap - $4,000 exclusion, 38_000) = 2_000.
    ca_cdcc_relevant_expenses: 2_000

# 2021: the federal exclusion uses the $10,500 cap, but FTB 3506 line 22 keeps
# California's $5,000, so the California base subtracts only $5,000.
- name: The 2021 California base subtracts the $5,000-capped exclusion
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      parent1:
        age: 40
        employment_income: 55_000
        dependent_care_employer_benefits: 9_000
      parent2:
        age: 38
        employment_income: 40_000
      child1:
        age: 5
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 12_000
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: CA
  output:
    # Federal: min($9,000, $10,500, $40,000) = $9,000.
    dependent_care_assistance_exclusion: 9_000
    # California: min($9,000, $5,000) = $5,000.
    ca_dependent_care_assistance_exclusion: 5_000
    # min($12,000, $6,000 two-person 2020 limit - $5,000, $40,000) = $1,000.
    ca_cdcc_relevant_expenses: 1_000
    # AGI $95,000: the 2020 rate is 35% less 1 point per $2,000 over $15,000,
    # floored at 20%. $1,000 x 20% = $200.
    ca_federal_cdcc: 200
    # California matches 34% for AGI over $70,000 and not over $100,000.
    ca_cdcc: 68

- name: A 2021 separate filer living apart from their spouse subtracts at most $5,000
  period: 2021
  input:
    people:
      head:
        age: 35
        is_tax_unit_head: true
        is_separated: true
        employment_income: 50_000
        dependent_care_employer_benefits: 6_000
      child1:
        age: 5
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [head, child1, child2]
        filing_status: SEPARATE
        tax_unit_childcare_expenses: 12_000
    households:
      household:
        members: [head, child1, child2]
        state_code: CA
  output:
    # Treated as unmarried: federal min($6,000, $10,500, $50,000) = $6,000.
    # California line 22 is $5,000 (FTB 3506 line 20 instructions), so the
    # state exclusion is $5,000 and its remaining limit is $1,000.
    # The federal $16,000 - $6,000 limit does not further reduce the base.
    dependent_care_assistance_exclusion: 6_000
    ca_dependent_care_assistance_exclusion: 5_000
    ca_cdcc_relevant_expenses: 1_000

- name: The 2026 federal ceiling exhausts a positive California limit
  period: 2026
  input:
    people:
      parent1:
        age: 40
        employment_income: 55_000
        dependent_care_employer_benefits: 7_000
      parent2:
        age: 38
        employment_income: 40_000
      child1:
        age: 5
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 12_000
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: CA
  output:
    # Federal: min($7,000 benefits, $7,500 cap, $40,000 earnings) = $7,000.
    dependent_care_assistance_exclusion: 7_000
    # California retains $5,000, leaving $6,000 - $5,000 = $1,000.
    ca_dependent_care_assistance_exclusion: 5_000
    # Federal Form 2441 line 31 is zero: max($6,000 - $7,000, 0) = 0.
    # FTB 3506 lines 32-33 cap the otherwise positive state limit at zero.
    cdcc_limit: 0
    ca_cdcc_relevant_expenses: 0
    ca_federal_cdcc: 0
    ca_cdcc: 0

- name: The 2021 California ceiling uses federal net expenses as well as the dollar limit
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      parent1:
        age: 40
        employment_income: 55_000
        dependent_care_employer_benefits: 6_000
      parent2:
        age: 38
        employment_income: 40_000
      child1:
        age: 5
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 6_500
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: CA
  output:
    # 2021 Form 2441 lines 20-25: min($6,000 benefits, $6,500 expenses,
    # $40,000 earnings, $10,500 cap) = $6,000 excluded benefits.
    # https://www.irs.gov/pub/irs-prior/f2441--2021.pdf#page=2
    dependent_care_assistance_exclusion: 6_000
    ca_dependent_care_assistance_exclusion: 5_000
    # Federal line 29 = $16,000 - $6,000 = $10,000;
    # line 30 = $6,500 - $6,000 = $500; line 31 = min(10,000, 500) = $500.
    cdcc_limit: 10_000
    # FTB 3506 lines 30-33: min($6,000 - $5,000, $6,500, $500) = $500.
    # Using federal line 29 alone incorrectly gives a $1,000 California base.
    # https://www.ftb.ca.gov/forms/2021/2021-3506.pdf#page=2
    ca_cdcc_relevant_expenses: 500
    # FTB 3506 lines 7-10: AGI $95,000 gives 20% and a 34% state match.
    ca_federal_cdcc: 100
    ca_federal_capped_cdcc: 100
    ca_cdcc: 34

# FTB 3506 counts expenses for qualifying persons. The child of a filer who can be
# claimed as a dependent is not one (IRC 152(b)(1)); the incapacitated relative is.
- name: 2025 childcare for the child of a claimable filer does not count
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 5000
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
      relative:
        age: 40
        is_incapable_of_self_care: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child, relative]
        tax_unit_childcare_expenses: 3000
    households:
      household:
        members: [parent, child, relative]
        state_code: CA
  output:
    ca_cdcc_relevant_expenses: 0

- name: 2025 the same household with a filer who cannot be claimed counts the childcare
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
      relative:
        age: 40
        is_incapable_of_self_care: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child, relative]
        tax_unit_childcare_expenses: 3000
    households:
      household:
        members: [parent, child, relative]
        state_code: CA
  output:
    ca_cdcc_relevant_expenses: 3000

# R&TC 17052.6(d)(2) limits earned income to "earned income subject to tax
# under this part", and FTB 3506 line 4 counts "other taxable employee
# compensation". California excludes a traditional 401(k) deferral but taxes
# payroll HSA contributions (Schedule CA (540) line 1h, column C).
- name: 2025 California earned income limit counts payroll HSA but not a 401(k) deferral
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
      spouse:
        age: 38
        employment_income: 6_000
        traditional_401k_contributions_desired: 1_000
        health_savings_account_payroll_contributions: 1_000
      child1:
        age: 5
      child2:
        age: 3
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        tax_unit_childcare_expenses: 9_000
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: CA
  output:
    # Federal (W-2 box 1): 6,000 - 1,000 401(k) - 1,000 HSA = 4,000.
    spouse_earned: 4_000
    min_head_spouse_earned: 4_000
    # California (W-2 box 16): 6,000 - 1,000 401(k) = 5,000.
    # ca_adjusted_earnings measures earned income on these wages: 5,000.
    ca_spouse_earned: 5_000
    ca_cdcc_min_head_spouse_earned: 5_000
    # min(9,000 expenses, 6,000 two-person limit, federal line 31 of 6,000,
    # 5,000 California earned income) = 5,000.
    ca_cdcc_relevant_expenses: 5_000
