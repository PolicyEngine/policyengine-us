- name: CA AMT does not add back acquisition home mortgage interest
  period: 2025
  input:
    people:
      head: {age: 45, taxable_interest_income: 168_340.64, deductible_mortgage_interest: 50_000}
      spouse: {age: 45}
    tax_units: {tax_unit: {members: [head, spouse]}}
    households: {household: {members: [head, spouse], state_code: CA}}
  output:
    ca_amt: 0

- name: The 2031 rate expiry exposes AMT for a single filer with $1 million of taxable income
  period: 2031
  absolute_error_margin: 1
  input:
    state_code: CA
    filing_status: SINGLE
    ca_taxable_income: 1_000_000
    ca_amti: 1_400_000
    ca_amt_exemption: 0
    ca_non_refundable_credits: 0
  output:
    # Regular tax falls to 88,942.90 once the rates above 9.3% expire (see
    # ca_income_tax_before_credits.yaml). Tentative minimum tax is .07 x 1,400,000 = 98,000,
    # so AMT is 98,000 - 88,942.90 = 9,057.10 and total tax is 98,000.
    ca_income_tax_before_credits: 88_942.90
    ca_amt: 9_057.10
    ca_income_tax_before_refundable_credits: 98_000


- name: Excess employee deductions do not create California AMT below the exemption
  # Schedule P line 15 uses -99,000, not the zero on Form 540 line 19.
  # https://www.ftb.ca.gov/forms/2025/2025-540-p-instructions.html
  period: 2025
  absolute_error_margin: 0.02
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
        unreimbursed_business_employee_expenses: 150_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: CA
  output:
    ca_amt: 0
    ca_misc_deduction: 149_000
    ca_deductions: 149_000
    ca_taxable_income: 0
    ca_pre_exemption_amti: 50_000
    ca_amti: 50_000

- name: California AMT with income exceeding deductions is unchanged
