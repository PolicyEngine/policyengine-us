- name: Single filer, 2026, exemption phases out at 25% under R&TC 17062.1, not the federal 50%
  # Schedule P (540) Exemption Worksheet with the 2025 amounts uprated by the June
  # 2026 California CPI, 364.969 / 353.044 (the FTB has not published 2026 amounts):
  # Line 1: 95,881.84. Line 3: 359,556.14. Line 4: 500,000 - 359,556.14 = 140,443.86.
  # Line 5: 25% x 140,443.86 = 35,110.96. Line 6: 95,881.84 - 35,110.96 = 60,770.88.
  # At the federal 2026 rate of 50%, line 6 would be 95,881.84 - 70,221.93 = 25,659.91.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {}
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ca_amti: 500_000
        ca_head_earned: 500_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_amt_exemption: 60_770.88

- name: Joint filers, 2026, exemption phases out at 25%
  # Line 1: 127,844.18. Line 3: 479,409.22. Line 4: 700,000 - 479,409.22 = 220,590.78.
  # Line 5: 25% x 220,590.78 = 55,147.69. Line 6: 127,844.18 - 55,147.69 = 72,696.49.
  # At 50%, line 6 would be 127,844.18 - 110,295.39 = 17,548.79.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {}
      person2: {}
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        ca_amti: 700_000
        ca_head_earned: 700_000
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_amt_exemption: 72_696.49

