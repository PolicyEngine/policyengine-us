- name: Child exemption counts payroll HSA contributions but not a 401(k) deferral
  period: 2025
  input:
    people:
      person1:
        age: 17
        is_tax_unit_head: true
        is_qualifying_child_dependent: true
        employment_income: 10_000
        traditional_401k_contributions_desired: 1_000
        health_savings_account_payroll_contributions: 1_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ca_amti: 100_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Federal taxable wages: 10,000 - 1,000 - 1,000 = 8,000.
    head_earned: 8_000
    # California wages add back the payroll HSA contribution: 9,000.
    ca_head_earned: 9_000
    # Adult exemption: AMTI below the 347,808 threshold, so 92,749.
    # Child: min(9,550 + 9,000, 92,749) = 18,550 (Schedule P worksheet
    # lines 7-10).
    ca_amt_exemption: 18_550
