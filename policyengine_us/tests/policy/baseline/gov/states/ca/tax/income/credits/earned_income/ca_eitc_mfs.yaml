- name: A child who did not live with the MFS filer for more than half the year cannot enable the exception
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 8_639
      child:
        age: 3
        is_tax_unit_dependent: true
        eitc_child_lived_with_taxpayer_more_than_half_year: false
    tax_units:
      unit:
        members: [parent, child]
        filing_status: SEPARATE
        eitc_spouses_lived_apart_last_six_months: true
        eitc_legal_separation_and_apart_at_year_end: true
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    eitc_marital_eligible: false
    ca_eitc: 0
    ca_yctc: 0
    eitc: 0

- name: A qualifying child without a valid SSN still satisfies the MFS exception
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 8_639
      child:
        age: 3
        is_tax_unit_dependent: true
        ssn_card_type: NONE
    tax_units:
      unit:
        members: [parent, child]
        filing_status: SEPARATE
        eitc_spouses_lived_apart_last_six_months: true
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    is_eitc_qualifying_child: [false, true]
    eitc_child_count: 0
    eitc_marital_eligible: true
    eitc_eligible: true
    ca_eitc_eligible: true
    ca_yctc: 1_189

