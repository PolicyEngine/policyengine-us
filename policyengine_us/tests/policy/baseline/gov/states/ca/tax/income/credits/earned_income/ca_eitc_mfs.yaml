- name: MFS parent living apart for the last six months qualifies in 2023
  period: 2023
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age: 40
        employment_income: 8_639
      child:
        age: 3
        is_tax_unit_dependent: true
    tax_units:
      unit:
        members: [parent, child]
        filing_status: SEPARATE
        eitc_spouses_lived_apart_last_six_months: true
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    eitc_marital_eligible: true
    eitc_eligible: true
    ca_eitc_eligible: true
    eitc: 2_937.26
    ca_eitc: 1_304.835
    ca_yctc: 1_117

