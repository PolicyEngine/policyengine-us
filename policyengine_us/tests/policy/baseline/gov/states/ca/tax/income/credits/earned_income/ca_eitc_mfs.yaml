- name: Childless MFS cannot receive California or federal EITC in 2023
  period: 2023
  input:
    people:
      parent:
        age: 40
        employment_income: 8_639
    tax_units:
      unit:
        members: [parent]
        filing_status: SEPARATE
    households:
      household:
        members: [parent]
        state_code: CA
  output:
    ca_eitc: 0
    eitc: 0
    ca_yctc: 0

