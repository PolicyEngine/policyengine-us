- name: A spouse's self-employment loss offsets the other spouse's wages (FTB 3514 line 19)
  period: 2023
  # Line 19 = 9,975.50 - 6,000 = 3,975.50, the midpoint of the 2023 EITC
  # Table row 3,951-4,000, which lists $259 with no qualifying children.
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 30
        employment_income: 9_975.5
      spouse:
        age: 30
        self_employment_income: -6_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_eitc_earned_income: 3_975.5
    ca_eitc: 259

- name: No CalEITC when the net of wages and self-employment loss is zero or less
  period: 2023
  # Worksheet Part I line 1: "If the amount is zero or less, stop here."
  input:
    people:
      head:
        age: 30
        employment_income: 10_000
      spouse:
        age: 30
        self_employment_income: -12_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CA
  output:
    ca_eitc_earned_income: 0
    ca_eitc: 0

- name: YCTC phase-out uses the netted line 19 earned income
  period: 2023
  # Line 23 = line 19 = 30,000 - 10,000 = 20,000, below the $25,775
  # threshold, so the full 2023 YCTC of $1,117 applies.
  input:
    people:
      head:
        age: 30
        employment_income: 30_000
      spouse:
        age: 30
        self_employment_income: -10_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: CA
  output:
    ca_eitc_earned_income: 20_000
    ca_yctc: 1_117
