# Unit tests for California Premium Subsidy eligibility.
# Eligible when: the program is in effect (PY2026-2027), the household is in
# California, at least one tax-unit member is eligible for the federal ACA
# premium tax credit (which embeds on-Marketplace enrollment, the
# married-filing-separately exclusion, and the federal required-contribution
# income test), the tax unit is an applicable return filer, and ACA MAGI is at
# or above the 100% FPL floor and at or below the FPL limit (1.65 in PY2026,
# under 2.00 in PY2027; see fpl_limit_inclusive). Program Design (d)(7) applies
# these limits to the exact ratio of nonnegative ACA MAGI to prior-year FPG,
# not to the truncated aca_magi_fraction (FTB 3849 Table 1-2 likewise decides
# band edges on the exact percentage). Supplied-income cases pin prior-year FPG
# to $10,000 and set aca_magi to the target ratio; is_aca_ptc_eligible is
# supplied so the gate logic is tested in isolation from the premium-data
# lookup. Income-derived cases use the actual prior-year one-person FPG
# ($15,650 for PY2026, $15,960 for PY2027).
#   fpl_floor = 1.0; fpl_limit = 1.65 inclusive (PY2026), 2.0 exclusive (PY2027)

# ---- Income-band boundaries ----

- name: Case 1, just below the 100% FPL floor (0.99) is ineligible.
  # Exact ratio 9_900 / 10_000 = 0.99 < fpl_floor 1.0 -> income test fails.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 9_900
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 2, exactly at the 100% FPL floor (1.0) is eligible.
  # Exact ratio 1.0 >= fpl_floor 1.0 and <= fpl_limit 1.65.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 10_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

- name: Case 3, mid-band (140% FPL) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

- name: Case 4, exactly at the 165% FPL limit (1.65) is eligible.
  # Exact ratio 1.65 <= fpl_limit 1.65 (PY2026: "at or below 165 percent").
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 16_500
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

- name: Case 5, just above the 165% FPL limit (1.66) is ineligible.
  # Exact ratio 1.66 > fpl_limit 1.65 -> above the band (federal APTC only).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 16_600
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

# ---- PY2026 165% limit from derived income (exact ratio, not truncation) ----

- name: Case 4b, PY2026 income of exactly 165% of FPL is eligible.
  # $25,822.50 / 2025 one-person FPG $15,650 = 165.000%, which is "at or below
  # 165 percent" (Program Design (d)(7)).
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 25_822.50
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 25_822.50
    aca_magi_fraction: 1.65
    ca_premium_subsidy_eligible: true

- name: Case 5b, PY2026 income of 165.003% of FPL is ineligible though it truncates to 1.65.
  # $25,823 / $15,650 = 165.0032%. aca_magi_fraction truncates to 1.65, but the
  # limit applies to the exact ratio, which is above 165 percent.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 25_823
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 25_823
    aca_magi_fraction: 1.65
    ca_premium_subsidy_eligible: false

- name: Case 5c, PY2026 income of 165.994% of FPL is ineligible though it truncates to 1.65.
  # $25,978 / $15,650 = 165.9936%, the highest whole-dollar income that
  # truncates to 1.65. Before the exact-ratio gate this case was eligible.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 25_978
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 25_978
    aca_magi_fraction: 1.65
    ca_premium_subsidy_eligible: false

- name: Case 5d, PY2026 income of 166.000% of FPL is ineligible.
  # $25,979 / $15,650 = 166.0000%; the truncated fraction is 1.66 as well.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 25_979
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 25_979
    aca_magi_fraction: 1.66
    ca_premium_subsidy_eligible: false

# ---- Federal APTC gate ----

- name: Case 6, no member is federal-APTC-eligible -> ineligible.
  # In-band on income, but is_aca_ptc_eligible is false for the only member, so
  # tax_unit.any(is_aca_ptc_eligible) is false.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 7, one of two members federal-APTC-eligible -> eligible (any gate).
  # tax_unit.any(is_aca_ptc_eligible) is true when at least one member qualifies.
  period: 2026
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: false
      person2:
        age: 43
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

# ---- State gate ----

- name: Case 8, in-band APTC-eligible unit outside California -> ineligible.
  # defined_for StateCode.CA zeroes the (bool) eligibility outside California.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ca_premium_subsidy_eligible: false

# ---- In-effect window ----

- name: Case 9, in-band CA unit in 2025 (before the program) -> ineligible.
  # in_effect is false before 2026-01-01, so the program does not apply.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2024: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 10, in-band CA unit in 2028 (after the window) -> ineligible.
  # in_effect ends 2028-01-01 (carry-forward covers PY2026-2027 only).
  period: 2028
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2027: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 11, in-band CA unit in 2027 -> eligible.
  # in_effect is true through PY2027.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2026: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

# ---- Zero-income edge ----

- name: Case 12, zero-income household (0% FPL) is ineligible.
  # Exact ratio 0 < fpl_floor 1.0 -> income test fails. A tax unit with no
  # income (0% FPL) sits below the CA 100% floor and receives federal APTC only,
  # even with an APTC-eligible member. Confirms the fraction-0 edge is on the
  # ineligible side of the floor rather than a spurious pass-through.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 0
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

# ---- Applicable return filer gate (Program Design (d)(7)) ----

- name: Case 13, non-filer in-band CA unit is ineligible.
  # Exact ratio 1.40 in [1.0,1.65] and APTC-eligible, but the tax unit is
  # not an applicable return filer, so ca_premium_subsidy_eligible is false.
  # GC 100810(a)(6) requires filing a California return; a non-filer forms no
  # claiming unit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: false
        # Nor does it take up the federal credit, so it files no return to claim it.
        takes_up_aca_if_eligible: false
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 14, filer twin of Case 13 is eligible.
  # Identical in-band APTC-eligible unit but tax_unit_is_filer true -> eligible.
  # Confirms the filer gate is the sole difference from Case 13.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

# ---- Derived married-filing-separately exclusion ----

- name: Case 15, married filing separately -> ineligible (derived MFS gate).
  # is_aca_ptc_eligible is NOT injected: with filing_status SEPARATE the federal
  # gate's ~separate term makes is_aca_ptc_eligible false for both members, so
  # ca_premium_subsidy_eligible is false even in-band with a filer flag.
  # pays_aca_premium is supplied so only the SEPARATE gate drives the result.
  period: 2026
  input:
    people:
      person1:
        age: 45
        pays_aca_premium: true
      person2:
        age: 43
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

# ---- Dependent-only unit ----

- name: Case 16, dependent-only unit is ineligible (no APTC-eligible member).
  # A single dependent claimed by another filer does not form a separate
  # claiming unit; with no APTC-eligible member the gate is false. Confirms the
  # dependent exclusion is structural.
  period: 2026
  input:
    people:
      person1:
        age: 20
        is_tax_unit_dependent: true
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

# ---- PY2027 FPL-limit edge (under 200%) ----

- name: Case 17, PY2027 at 199% FPL (1.99) is eligible (limit under 200%).
  # PY2027 Program Design (d)(7): "under 200 percent". 1.99 < 2.0 -> in-band.
  # Confirms the widened PY2027 band admits units up to 199% FPL.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_900
        tax_unit_fpg:
          2026: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

- name: Case 18, PY2027 at exactly 200% FPL (2.00) is ineligible (strict limit).
  # PY2027 fpl_limit 2.0 with fpl_limit_inclusive false: 2.00 is not under 2.0.
  # Pairs with Case 17 to bracket the PY2027 upper edge.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        tax_unit_fpg:
          2026: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 17a, PY2027 at 199.5% FPL (1.995) is eligible.
  # Exact ratio 19_950 / 10_000 = 1.995 < 2.0. A limit of 1.99 on the exact
  # ratio would wrongly exclude incomes between 199% and 200% of FPL.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_950
        tax_unit_fpg:
          2026: 10_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

# ---- PY2027 200% limit from derived income ----

- name: Case 17b, PY2027 income of 199.994% of FPL is eligible.
  # $31,919 / 2026 one-person FPG $15,960 = 199.9937%, which is "under 200
  # percent" (2027 Program Design (d)(7)).
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 31_919
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 31_919
    aca_magi_fraction: 1.99
    ca_premium_subsidy_eligible: true

- name: Case 18b, PY2027 income of exactly 200% of FPL is ineligible.
  # $31,920 / $15,960 = 200.000%, which is not "under 200 percent".
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 31_920
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 31_920
    aca_magi_fraction: 2.00
    ca_premium_subsidy_eligible: false

- name: Case 18c, PY2027 income of 165.006% of FPL is eligible (165% is the PY2026 limit only).
  # $26,335 / $15,960 = 165.0063%. Ineligible under the PY2026 limit, but
  # inside the PY2027 band, which runs to under 200%.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        employment_income: 26_335
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi: 26_335
    aca_magi_fraction: 1.65
    ca_premium_subsidy_eligible: true

# ---- Filing via federal credit take-up ----

- name: Case 13b, an in-band CA unit that takes up the federal credit files and is eligible.
  # Case 13 with take-up true and a positive federal credit ($6,000 benchmark
  # less 4.19% of $22,000 = $5,078.20): a tax unit that takes up the credit
  # files a return to claim or reconcile it (26 CFR 1.6011-8(a)), so the
  # filing gate passes.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.40
        slcsp: 6_000
        aca_magi: 22_000
        aca_required_contribution_percentage: 0.0419
        tax_unit_is_filer: false
        takes_up_aca_if_eligible: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true

- name: Case 13c, an in-band CA non-filer that takes up coverage with a zero federal credit is ineligible.
  # The federal contribution (4% of $22,000 = $880) exceeds the $500
  # benchmark, so there is no federal credit and no reason to file. Filer twin:
  # Case 13d.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.40
        slcsp: 500
        aca_magi: 22_000
        aca_required_contribution_percentage: 0.04
        tax_unit_is_filer: false
        takes_up_aca_if_eligible: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: false

- name: Case 13d, the same unit filing for another reason is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.40
        slcsp: 500
        aca_magi: 22_000
        aca_required_contribution_percentage: 0.04
        tax_unit_is_filer: true
        takes_up_aca_if_eligible: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true
