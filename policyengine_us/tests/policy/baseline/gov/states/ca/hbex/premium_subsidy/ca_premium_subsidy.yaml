# Unit tests for the California Premium Subsidy amount. The subsidy is the
# residual top-up over the federal APTC toward the SLCSP benchmark:
#   income  = max(aca_magi, 0)                          # negative MAGI clamped
#   slcsp   = annualized second-lowest-cost silver plan  # sum of 12 monthly slcsp
#   pct     = ca_premium_subsidy_applicable_percentage   # CA schedule
#   amount  = max(0, slcsp - aca_ptc - pct * income)
#   result  = amount when ca_premium_subsidy_eligible (defined_for), else 0
# slcsp is a MONTH-period variable; in a YEAR test it is supplied as the annual
# figure (spread across 12 months and re-summed by add()), matching the NM
# convention. aca_magi, aca_magi_fraction, slcsp, aca_ptc and is_aca_ptc_eligible
# are supplied directly so each expectation is exactly hand-verifiable.
#   CA schedule: threshold [1.0, 1.5, 1.65], initial [0, 0.0319], final [0, 0.0391]

# ---- 100-150% FPL band (applicable percentage 0%) ----

- name: Case 1, 140% FPL with APTC covering the full residual -> $0 floor.
  # pct 0 (100-150% band). amount = max(0, 6_000 - 6_000 - 0*21_000) = 0.
  # Below 150% FPL the state fills the post-APTC gap; when APTC already reaches
  # the benchmark there is no remaining state top-up owed.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 21_000
        aca_magi_fraction: 1.40
        slcsp: 6_000
        aca_ptc: 6_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

- name: Case 2, 140% FPL positive subsidy fills the post-APTC gap.
  # pct 0 (100-150% band). amount = max(0, 6_000 - 3_500 - 0*21_000) = 2_500.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 21_000
        aca_magi_fraction: 1.40
        slcsp: 6_000
        aca_ptc: 3_500
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 2_500

# ---- 150-165% FPL band (applicable percentage 3.19% -> 3.91%) ----

- name: Case 3, 157.5% FPL positive subsidy (pct 3.55% interpolated).
  # pct = 0.0319 + 0.5*(0.0391-0.0319) = 0.0355. income 25_000.
  # amount = max(0, 6_000 - 2_000 - 0.0355*25_000) = 6_000 - 2_000 - 887.50 = 3_112.50.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 3_112.50

- name: Case 4, exactly 165% FPL positive subsidy (pct 3.91%, top of the ramp).
  # pct = 0.0391 (final rate). income 26_000.
  # amount = max(0, 7_000 - 2_500 - 0.0391*26_000) = 7_000 - 2_500 - 1_016.60 = 3_483.40.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 26_000
        aca_magi_fraction: 1.65
        slcsp: 7_000
        aca_ptc: 2_500
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 3_483.40

- name: Case 5, 160% FPL with expected contribution exceeding the gap -> $0 floor.
  # pct = 0.0319 + (2/3)*0.0072 = 0.0367. income 24_000 -> 0.0367*24_000 = 880.80.
  # amount = max(0, 3_000 - 2_500 - 880.80) = max(0, -380.80) = 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 24_000
        aca_magi_fraction: 1.60
        slcsp: 3_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

# ---- Negative-MAGI clamp ----

- name: Case 6, negative ACA MAGI is clamped to zero (does not inflate subsidy).
  # magi_frac 1.575 -> pct 0.0355; aca_magi -10_000 clamps to 0 so the -pct*income
  # term is 0 rather than +355. amount = max(0, 6_000 - 2_000 - 0.0355*0) = 4_000.
  # Without the clamp it would be 6_000 - 2_000 - 0.0355*(-10_000) = 4_355.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: -10_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 4_000

# ---- Ineligibility paths (subsidy zeroed) ----

- name: Case 7, in-band positive-subsidy inputs outside California -> $0.
  # defined_for StateCode.CA zeroes the amount outside California.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ca_premium_subsidy: 0

- name: Case 8, in-band CA unit in 2025 (before the program) -> $0.
  # in_effect is false before 2026-01-01, so the unit is ineligible and the
  # defined_for gate returns 0 despite a positive residual.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

- name: Case 9, above the 165% FPL limit (1.66) -> $0 (federal APTC only).
  # ca_premium_subsidy_eligible is false above the band, so the defined_for gate
  # returns 0 even though slcsp exceeds aca_ptc.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 27_000
        aca_magi_fraction: 1.66
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

- name: Case 10, zero SLCSP -> $0 (no benchmark to top up).
  # 140% FPL, eligible, pct 0. amount = max(0, 0 - 0 - 0*21_000) = 0. Even for an
  # eligible unit, no SLCSP means no state assistance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 21_000
        aca_magi_fraction: 1.40
        slcsp: 0
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

# ---- Floor edge with a positive amount ----

- name: Case 11, exactly at the 100% FPL floor (1.0) with a positive subsidy.
  # magi_frac 1.0 -> pct 0 (flat 100-150% band). Eligible: 1.0 >= fpl_floor 1.0,
  # <= fpl_limit 1.65, in effect, APTC-eligible. income 15_000.
  # amount = max(0, 6_000 - 3_500 - 0*15_000) = 2_500. Confirms the floor edge is
  # eligible AND pays the full post-APTC gap (pct is 0 at the bottom of the band).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_000
        aca_magi_fraction: 1.00
        slcsp: 6_000
        aca_ptc: 3_500
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 2_500

# ---- Mid-band interaction: APTC and pct both active, residual positive ----

- name: Case 12, 160% FPL positive residual with APTC and pct both active.
  # magi_frac 1.60 -> pct 0.0319 + (2/3)*0.0072 = 0.0367. income 24_000.
  # 0.0367*24_000 = 880.80. amount = max(0, 6_000 - 2_000 - 880.80) = 3_119.20.
  # Exercises the interaction where aca_ptc > 0 AND pct > 0 simultaneously and the
  # residual stays positive (Case 5 and Scenario 5 hit the $0 floor at 1.60;
  # this checks the non-floored arithmetic on the same knot).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 24_000
        aca_magi_fraction: 1.60
        slcsp: 6_000
        aca_ptc: 2_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 3_119.20

# ---- Sunset (amount level) ----

- name: Case 13, in-band CA unit in 2028 (after the sunset) -> $0.
  # in_effect ends 2028-01-01, so ca_premium_subsidy_eligible is false and the
  # defined_for gate returns 0 despite a positive residual. Mirrors the eligible
  # variable's 2028 case at the amount level.
  period: 2028
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

# ---- Applicable-percentage clamp region cross-checked against the amount gate ----

- name: Case 14, above the 165% limit (1.66) clamps pct to 3.91% but amount is $0.
  # aca_magi_fraction 1.66 clamps ca_premium_subsidy_applicable_percentage to the
  # top-bracket 0.0391 (see the pct file Case 10), and slcsp - aca_ptc = 4_000 is a
  # positive residual, yet ca_premium_subsidy_eligible is false above fpl_limit 1.65
  # so the defined_for gate zeroes the amount. Confirms the out-of-band pct clamp is
  # unreachable through the eligibility gate (the raw residual + clamped pct never
  # pay out above the band).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 27_000
        aca_magi_fraction: 1.66
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.0391
    ca_premium_subsidy: 0

- name: Case 15, below the 100% floor (0.99) clamps pct to 0% and amount is $0.
  # aca_magi_fraction 0.99 clamps ca_premium_subsidy_applicable_percentage to the
  # first-bracket 0 (see the pct file Case 9), and slcsp - aca_ptc = 4_000 is a
  # positive residual, yet ca_premium_subsidy_eligible is false below fpl_floor 1.0
  # so the defined_for gate zeroes the amount. Cross-checks the below-floor clamp
  # region against the eligibility gate from the low side.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_850
        aca_magi_fraction: 0.99
        slcsp: 6_000
        aca_ptc: 2_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0
    ca_premium_subsidy: 0

# ---- PY2027 carry-forward (positive amount) ----

- name: Case 16, PY2027 pays a positive subsidy at 157.5% FPL (revised schedule).
  # in_effect is true through PY2027 and the schedule CHANGED (Board Res. 2026-22):
  # the 150-165% band is now initial 0.0269 -> final 0.0341, so
  # magi_frac 1.575 -> pct 0.0269 + 0.5*(0.0341-0.0269) = 0.0269 + 0.0036 = 0.0305.
  # income 25_000. amount = max(0, 6_000 - 2_000 - 0.0305*25_000)
  # = 6_000 - 2_000 - 762.50 = 3_237.50 (up from the 2026 value of 3_112.50 at the
  # same FPL because the PY2027 applicable percentage in this band is lower).
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 2_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 3_237.50

# ---- Floor from the SLCSP == APTC direction ----

- name: Case 17, benchmark exactly covered by federal APTC with positive pct -> $0.
  # slcsp - aca_ptc = 6_000 - 6_000 = 0 (federal PTC already reaches the benchmark)
  # while pct 0.0355 > 0 (157.5% FPL, in the paying band). income 25_000.
  # amount = max(0, 0 - 0.0355*25_000) = max(0, -887.50) = 0. Documents the floor
  # from the "benchmark exactly covered but a positive contribution is required"
  # direction: with no residual left, the -pct*income term drives the raw amount
  # negative and the max_(0, ...) floor returns 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_magi_fraction: 1.575
        slcsp: 6_000
        aca_ptc: 6_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

# ---- Multi-member asymmetric eligibility pays the full tax-unit subsidy ----

- name: Case 18, two adults, one APTC-eligible one not, in the paying band -> full subsidy.
  # person1 is_aca_ptc_eligible true, person2 false. The eligibility gate uses
  # add(is_aca_ptc_eligible) > 0, which fires on any eligible member, so the tax
  # unit is eligible. The amount uses tax-unit slcsp/aca_ptc (not per-member), so
  # the asymmetry does NOT halve or zero the payout. magi_frac 1.575 -> pct 0.0355.
  # income 30_000. amount = max(0, 8_000 - 3_000 - 0.0355*30_000) = 5_000 - 1_065 = 3_935.
  # Confirms the add()>0 gate + defined_for + person->tax_unit aggregation produce
  # the full subsidy rather than a per-eligible-member proration.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi: 30_000
        aca_magi_fraction: 1.575
        slcsp: 8_000
        aca_ptc: 3_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true
    ca_premium_subsidy: 3_935
