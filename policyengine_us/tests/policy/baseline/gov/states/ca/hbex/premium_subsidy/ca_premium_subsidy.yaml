        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true
    ca_premium_subsidy: 3_490.34

- name: Case 5, 160% FPL with expected contribution exceeding the gap -> $0 floor.
  # pct = 0.0319 + (2/3)*0.0072 = 0.0367. income 24_000 -> 0.0367*24_000 = 880.80.
  # amount = max(0, 3_000 - 2_500 - 880.80) = max(0, -380.80) = 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_fpg:
          2026: 15_000
        aca_magi: 24_000
        aca_magi_fraction: 1.60
        slcsp: 3_000
        aca_ptc: 2_500
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 0

# ---- Negative-MAGI clamp ----

- name: Case 6, negative ACA MAGI is clamped to zero (does not inflate subsidy).
  # Supply eligibility and pct 0.0355 to isolate the amount clamp:
  # exact negative MAGI would otherwise be ineligible and select the 0% band,
  # hiding a missing amount clamp. The income fraction is zero because
  # aca_magi_fraction floors negative MAGI at zero before dividing by FPG.
  # aca_magi -10_000 clamps to 0 so the -pct*income
  # term is 0 rather than +355. amount = max(0, 6_000 - 2_000 - 0.0355*0) = 4_000.
  # Without the clamp it would be 6_000 - 2_000 - 0.0355*(-10_000) = 4_355.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_fpg:
          2026: 10_000
        aca_magi: -10_000
        aca_magi_fraction: 0
        ca_premium_subsidy_eligible: true
        ca_premium_subsidy_applicable_percentage: 0.0355
        slcsp: 6_000
        aca_ptc: 2_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy: 4_000

