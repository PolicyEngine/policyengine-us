# ---- Multi-member asymmetric eligibility pays the full tax-unit subsidy ----

- name: Case 18, two adults, one APTC-eligible one not, in the paying band -> full subsidy.
  # person1 is_aca_ptc_eligible true, person2 false. The eligibility gate uses
  # add(is_aca_ptc_eligible) > 0, which fires on any eligible member, so the tax
  # unit is eligible. The amount uses tax-unit slcsp/aca_ptc (not per-member), so
  # the asymmetry does NOT halve or zero the payout. magi_frac 1.575 -> pct 0.0355.
  # Pin aca_fpg (prior-year FPG) to 20_000: income 31_500 / 20_000 = 1.575.
  # amount = max(0, 8_000 - 3_000 - 0.0355*31_500) = 5_000 - 1_118.25 = 3_881.75.
  # Confirms the add()>0 gate + defined_for + person->tax_unit aggregation produce
  # the full subsidy rather than a per-eligible-member proration.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_fpg:
          2026: 20_000
        aca_magi: 31_500
        aca_magi_fraction: 1.575
        slcsp: 8_000
        aca_ptc: 3_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_premium_subsidy_eligible: true
    ca_premium_subsidy_applicable_percentage: 0.0355
    ca_premium_subsidy: 3_881.75

# ---- PY2027 upper limit (Covered California's worked example) ----

- name: Case 19, PY2027 exactly 200% FPL pays the 1.5-point gap (OE27 example).
  # The OE27 enroller deck (PDF pages 37-38) works a single 40-year-old in
  # Sacramento County at $31,920, exactly 200% of the 2026 one-person FPG
  # $15,960: benchmark $688 a month, federal required contribution 6.78%,
  # state rate 5.28% (6.78% - 1.5%), state subsidy about $40 a month.
  # slcsp = 688*12 = 8_256. aca_ptc = 8_256 - 0.0678*31_920 = 8_256 - 2_164.176
  # = 6_091.824. Eligible: 2.0 is "at or below 200 percent" (Design (d)(7)).
  # amount = max(0, 8_256 - 6_091.824 - 0.0528*31_920)
  # = 2_164.176 - 1_685.376 = 478.80 = 0.015*31_920, or $39.90 a month.
  # aca_ptc is derived from the federal 2027 applicable percentage table
  # (Rev. Proc. 2026-26, PolicyEngine/policyengine-us#10443), which gives 6.78%
  # at exactly 200% FPL. The output pins that federal credit.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_fpg:
          2027: 15_960
        aca_magi: 31_920
        aca_magi_fraction: 2.00
        slcsp: 8_256
        tax_unit_is_filer: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_ptc: 6_091.824
    ca_premium_subsidy_eligible: true
    ca_premium_subsidy_applicable_percentage: 0.0528
    ca_premium_subsidy: 478.80

