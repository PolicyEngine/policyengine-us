- name: Case 15, PY2027 199% FPL (top of the eligible band) -> ~5.05%.
  # bracket 2 [1.65,2.0]: position (1.99-1.65)/0.35 = 0.34/0.35 = 0.971428...
  # 0.0341 + 0.971428*(0.051-0.0341) = 0.0341 + 0.971428*0.0169 = 0.0341 +
  # 0.016417 = 0.050517. Derived (non-round position); confirm against the model.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_900
        tax_unit_fpg:
          2026: 10_000
        aca_magi_fraction: 1.99
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.050517  # model computes 0.05051714

- name: Case 2b, a supplied fraction of 1.505 interpolates on the fraction given.
  # searchsorted([1.0,1.5,1.65], 1.505, "left") = 2, -1 -> bracket 1 [1.5,1.65].
  # position (1.505-1.50)/0.15 = 0.0333 -> 0.0319 + 0.0333 x (0.0391 - 0.0319)
  # = 0.03214. (A fraction computed from income is truncated to whole
  # percentages first; see the next case.)
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_050
        tax_unit_fpg:
