  # PY2027 Program Design V4 (Board Res. 2026-22) changes the 150-165% band to
  # initial 0.0269 -> final 0.0341. bracket 1 [1.5,1.65]:
  # position (1.575-1.5)/0.15 = 0.5 -> 0.0269 + 0.5*(0.0341-0.0269)
  # = 0.0269 + 0.5*0.0072 = 0.0269 + 0.0036 = 0.0305.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_750
        tax_unit_fpg:
          2026: 10_000
        aca_magi_fraction: 1.575
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.0305

