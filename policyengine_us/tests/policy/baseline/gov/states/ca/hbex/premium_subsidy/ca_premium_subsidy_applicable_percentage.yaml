# Unit tests for the California Premium Subsidy applicable percentage.
# Bracket-interpolated from
# gov.states.ca.hbex.premium_subsidy.applicable_percentage:
#   threshold: [1.0, 1.5, 1.65]
#   initial:   [0,   0.0319]
#   final:     [0,   0.0391]
# Bands (initial -> final over the FPL band):
#   100-150% FPL: 0%              (flat)
#   above 150-165% FPL: 3.19% -> 3.91%  (interpolated linearly)
# PY2027 (Final 2027 Program Design (d)(4)): threshold [1.0, 1.5, 2.0],
# initial [0, 0.028], final [0, 0.0528]; above 150-200% FPL: 2.8% -> 5.28%.
# The exact nonnegative MAGI / prior-year FPG ratio selects the band; the
# truncated aca_magi_fraction determines the rate within it. Supplied-fraction
# cases normalize prior-year FPG to $10,000 and supply consistent MAGI to
# isolate interpolation, including fractional percentages that a derived
# aca_magi_fraction would truncate. Every expected value is hand-computed
# inline. The variable itself has no income-band cap (out-of-band
# clamping to the nearest bracket rate is fine; the ca_premium_subsidy_eligible
# gate separately determines eligibility). This file
# checks raw interpolation, including clamps at 0.99 and 1.66.

# ---- Knot points ----

- name: Case 1, exactly 100% FPL -> 0.00% (start of the flat 100-150% band).
  # searchsorted([1.0,1.5,1.65], 1.00, "left") = 0, -1 = -1, clipped to bracket 0 [1.0,1.5].
  # initial 0, final 0 -> 0 regardless of position.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 10_000
        tax_unit_fpg:
          2025: 10_000
        aca_magi_fraction: 1.00
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0

- name: Case 2, exactly 150% FPL -> 0% (the adopted design's "up to 150%" band).
  # The 2026 Program Design's bands are "100% up to 150%" (0%) and "Above 150%
  # up to 165%"; the Policy Explainer's "150% - At or Below 165%" would give
  # 3.19%. The model follows the adopted design.
  # searchsorted([1.0,1.5,1.65], 1.50, "left") = 1, -1 -> bracket 0 [1.0,1.5].
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 15_000
        tax_unit_fpg:
          2025: 10_000
        aca_magi_fraction: 1.50
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0

- name: Case 3, exactly 165% FPL -> 3.91% (top of the ramp).
  # searchsorted([1.0,1.5,1.65], 1.65, "left") = 2, -1 = 1 -> bracket 1 at position 1.
  # bracket_start 1.5, bracket_end 1.65, position (1.65-1.5)/0.15 = 1 -> final 0.0391.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 16_500
        tax_unit_fpg:
          2025: 10_000
        aca_magi_fraction: 1.65
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.0391

# ---- Mid-bracket interpolations ----

- name: Case 4, 125% FPL -> 0.00% (mid the flat 100-150% band).
