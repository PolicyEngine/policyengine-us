        aca_magi_fraction: 1.575
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.0355

- name: Case 6, 160% FPL -> 3.67% (upper third of the 150-165% band).
  # bracket 1 [1.5,1.65]: position (1.60-1.5)/0.15 = 0.6667.
  # 0.0319 + (2/3)*0.0072 = 0.0319 + 0.0048 = 0.0367.
  period: 2026
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 16_000
        tax_unit_fpg:
          2025: 10_000
        aca_magi_fraction: 1.60
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.0367

