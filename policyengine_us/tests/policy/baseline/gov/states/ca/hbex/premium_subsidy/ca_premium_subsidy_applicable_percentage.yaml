        state_code: CA
  output:
    ca_premium_subsidy_applicable_percentage: 0.03214

# ---- Derived fractions around the exact 150% and truncated 151% boundaries ----

- name: Case 2c, income at 150.6% of FPL pays 3.19% despite truncating to 150%.
  # The adopted Design (d)(4) puts exact income above 150% in the paying band.
  # FTB 3849 (2020/2021), Table 1-2, decides "above" on the exact percentage
  # before truncating for the rate lookup. $23,569 / 2025 one-person FPG
  # $15,650 = 150.6006% selects the upper band; the truncated 1.50 fraction
  # gives its starting rate 0.0319, for a $751.85 annual contribution.
  period: 2026
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
        employment_income:
          2026: 23_569
        is_aca_ptc_eligible: true
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    aca_magi_fraction: 1.50
    ca_premium_subsidy_applicable_percentage: 0.0319

