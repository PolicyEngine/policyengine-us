  # -1 = 1 -> bracket 1 [1.5,1.65] at position 1 -> its final rate 0.0341,
  # which equals the 165-200% tier's initial rate, so the rate is continuous
  # at 165% (2026 had 0.0391 at this point).
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
