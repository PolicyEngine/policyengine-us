- name: Case 2b, a supplied fraction of 1.505 interpolates on the fraction given.
  # searchsorted([1.0,1.5,1.65], 1.505, "left") = 2, -1 -> bracket 1 [1.5,1.65].
  # position (1.505-1.50)/0.15 = 0.0333 -> 0.0319 + 0.0333 x (0.0391 - 0.0319)
  # = 0.03214. (A fraction computed from income is truncated to whole
  # percentages first; see the next case.)
  period: 2026
  absolute_error_margin: 0.0001
