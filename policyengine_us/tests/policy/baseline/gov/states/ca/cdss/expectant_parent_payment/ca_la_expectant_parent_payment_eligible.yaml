- name: Pregnancy month 6 does not qualify in Los Angeles
  period: 2022-01
  input:
    state_code: {2022: CA}
    county_str: {2022: LOS_ANGELES_COUNTY_CA}
    ca_foster_care_minor_dependent: true
    current_pregnancy_month: 6
  output:
    ca_la_expectant_parent_payment_eligible: false
    ca_la_expectant_parent_payment: 0  # Month 6 precedes month 7: $900 * 0.

