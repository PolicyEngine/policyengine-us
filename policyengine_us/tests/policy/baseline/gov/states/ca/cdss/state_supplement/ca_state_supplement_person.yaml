- name: Case 33, married parents who are their child's tax dependents take the couple share.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 100_000
      person2:
        age: 70
        is_tax_unit_dependent: true
      person3:
        age: 68
        is_tax_unit_dependent: true
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2, person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # SSI pairs the parents through their marital unit, whatever their tax roles.
    # Each takes half the couple's federal rate, 1,491 / 2 = 745.50, and half the
    # couple's state level, 607.83 / 2 = 303.915, which SSA rounds up to 303.92.
    ssi: [0, 745.5, 745.5]
    ca_state_supplement_person: [0, 303.92, 303.92]

