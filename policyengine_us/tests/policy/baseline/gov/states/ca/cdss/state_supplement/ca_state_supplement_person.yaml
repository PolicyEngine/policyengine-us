- name: Case 37, 2025 citizen married to a CAPI spouse whom a third adult claims counts the spouse's income above the couple standard.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        immigration_status: CITIZEN
        social_security_retirement: 6_000 # 500 a month
      person2:
        age: 68
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        pension_income: 18_000 # 1,500 a month
      person3:
        age: 40
        is_tax_unit_head: true
        immigration_status: CITIZEN
    tax_units:
      citizen:
        members: [person1]
      third:
        members: [person3, person2]
    marital_units:
      couple:
        members: [person1, person2]
      third:
        members: [person3]
    spm_units:
      couple:
        members: [person1, person2]
      third:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        living_arrangements_allow_for_food_preparation: false
  output:
    # (500 + 1,500 - 20) / 2 = 990 a month each, so the couple gets no SSI.
    ssi_countable_income: [11_880, 11_880, 0] # 990 * 12
    ssi: [0, 0, 0]
    # The couple total is 1,980, so person1 counts
    # max(480, 1,980 - (2,315.57 - 1,335.81)) = 1,000.24 a month and gets
    # 1,335.81 - 1,000.24 = 335.57.
    ca_state_supplement_person: [4_026.84, 0, 0] # 335.57 * 12
