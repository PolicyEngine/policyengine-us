- name: Case 1, ineligible, countable income one dollar above the payment standard.
  period: 2026
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    ssi_qualifying_quarters_earnings: 39
    # The case supplies countable income directly to isolate the CAPI income
    # test: 1,234.94 per month (14,819.28 per year).
    ssi_countable_income: 14_819.28
    living_arrangements_allow_for_food_preparation: true
    state_code: CA
  output:
    # Standard 1,233.94 with no offset since June 2019 (WIC 18941).
    # Countable income must be lower than the standard (MPP 49-035.1);
    # 1,234.94 is not, so there is no CAPI.
    ca_capi_income_eligible: false

- name: Case 2, eligible, countable income one dollar below the payment standard.
  period: 2026
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    ssi_qualifying_quarters_earnings: 39
    # Supplied as above: 1,232.94 per month (14,795.28 per year).
    ssi_countable_income: 14_795.28
    living_arrangements_allow_for_food_preparation: true
    state_code: CA
  output:
    # 1,232.94 is lower than the 1,233.94 standard: 1 per month of CAPI.
    ca_capi_income_eligible: true

- name: Case 3, ineligible, income deemed from a high-earning spouse exhausts the couple state supplement.
  period: 2026
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
      person2:
        age: 50
        employment_income: 60_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The spouse earns 5,000 per month; couple countable income is
    # (5,000 - 20 - 65) / 2 = 2,457.50 per month (29,490 per year), all
    # deemed.
    is_ssi_spousal_deeming_applies: [true, false]
    ssi_income_deemed_from_ineligible_spouse: [29_490, 0]
    ssi_countable_income: [29_490, 0]
    # POMS SI 01320.430 D. As an individual: federal 994, state 239.94.
    # Under deeming: 2,457.50 exceeds the couple FBR 1,491 by 966.50, which
    # exceeds the couple OSS 607.83, so neither a federal benefit nor a
    # state supplement is due. Federal = 0, state = min(239.94, 607.83 -
    # 966.50) = -358.67, and CAPI = max(0 - 358.67, 0) = 0 in every month.
    ca_capi_income_eligible: false

# MPP 49-035.1 and 49-055.32: income and the citizen spouse's SSP
# exhaust the 2,315.57 monthly standard at these three incomes.
# https://www.cdss.ca.gov/Portals/9/CAPI/CAPI_Regulations-Accessible.pdf#page=47
- name: Case 4, a mixed couple gets no CAPI at the income boundary.
  period: 2025
  absolute_error_margin: 1.0e-06
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        immigration_status: CITIZEN
        social_security_retirement: 6000
      person2:
        age: 68
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        pension_income: 18000.0
      person3:
        age: 40
        is_tax_unit_head: true
        immigration_status: CITIZEN
    tax_units:
      citizen:
        members: [person1]
      third:
        members: [person3, person2]
    marital_units:
      couple:
        members: [person1, person2]
      third:
        members: [person3]
    spm_units:
      couple:
        members: [person1, person2]
      third:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
        living_arrangements_allow_for_food_preparation: false
  output:
    ca_capi_person: [0, 0, 0]
    ca_capi_income_eligible: [false, false]

