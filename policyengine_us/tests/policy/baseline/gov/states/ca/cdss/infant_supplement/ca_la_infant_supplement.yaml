- name: Eligible household with one infant, not in group home
  period: 2024
  input:
    people:
      person1:
        ca_la_infant_supplement_eligible_person: true
        is_in_foster_care_group_home: false
      person2:
        is_child: true
    households:
      household:
        members: [person1, person2]
        state_code: CA
        county_str: LOS_ANGELES_COUNTY_CA
  output:
    ca_la_infant_supplement: 10_800  # 12 months * $900 * one child.

- name: Fresno foster parent receives the supplement for two children
  period: 2024
  input:
    people:
      parent:
        age: 20
        is_in_foster_care: true
      first_child:
        age: 0
      second_child:
        age: 2
    households:
      household:
        members: [parent, first_child, second_child]
        state_code: CA
        county_str: FRESNO_COUNTY_CA
  output:
    ca_la_infant_supplement: 21_600  # 12 months * $900 * two children.

- name: San Diego foster parent receives the group home supplement
  period: 2024
  input:
    people:
      parent:
        age: 20
        is_in_foster_care: true
        is_in_foster_care_group_home: true
      child:
        age: 0
    households:
      household:
        members: [parent, child]
        state_code: CA
        county_str: SAN_DIEGO_COUNTY_CA
  output:
    ca_la_infant_supplement: 16_548  # 12 months * $1,379 * one child.

- name: Fresno parent outside qualifying foster care receives no supplement
  period: 2024
