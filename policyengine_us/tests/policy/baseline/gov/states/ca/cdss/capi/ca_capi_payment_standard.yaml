    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # A blind child takes the blind amount, 1,318.32 (MPP 49-050.253).
    ca_capi_payment_standard: [0, 1_318.32]

- name: Case 13, aged couple with one blind member without cooking takes the aged couple rate with the food allowance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
      person2:
        age: 70
        is_blind: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: false
  output:
    # WIC 12200(e) gives the food allowance only to an aged or disabled
    # individual or couple (12200(c), (d)), so the one-blind couple rate
    # (12200(b)) adds none: 2,238.44. Both spouses are aged, so the aged
    # couple rate without cooking also applies: 2,098.83 + 257.74 = 2,356.57,
    # the higher. One-half each: 2,356.57 / 2 = 1,178.285. POMS SI 01415.058
    # code C would add 128.87 to the one-blind rate instead (2,367.31).
    ca_capi_payment_standard: [1_178.285, 1_178.285]

- name: Case 14, 2024 independent-living standard adds the state share to the federal benefit rate.
