- name: Case 15, the 10 individual offset applies through May 2019 and ends in June 2019.
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    households:
      household:
        members: [person1]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The 2019 standard is 771 + 160.72 = 931.72 (POMS SI 01415.051; ACIN
    # I-23-19): 931.72 - 10 = 921.72 through May 2019 (MPP 49-050.11) and
    # 931.72 from June 1, 2019 (WIC 18941).
    ca_capi_payment_standard:
      2019-05: 921.72
      2019-06: 931.72

- name: Case 16, CAPI couple, the 20 couple offset applies through May 2019 and ends in June 2019.
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
      person2:
        age: 68
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # Couple standard 1,157 + 407.14 = 1,564.14 (POMS SI 01415.051).
    # May: (1,564.14 - 20) / 2 = 772.07 each (MPP 49-050.12).
    # June: 1,564.14 / 2 = 782.07 each (WIC 18941).
    ca_capi_payment_standard:
      2019-05: [772.07, 772.07]
      2019-06: [782.07, 782.07]

