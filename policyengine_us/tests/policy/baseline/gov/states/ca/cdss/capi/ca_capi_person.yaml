- name: Case 1, aged noncitizen couple splits the couple's countable income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: UNDOCUMENTED
        # 420 per month foreign pension.
        pension_income: 5_040
        # SSI zeroes countable income for people who fail its immigration
        # test, so the case supplies it. The couple's countable income is
        # 420 - 20 general exclusion = 400 per month, split equally as SSI
        # does for a couple: 200 per month (2,400 per year) each.
        ssi_countable_income: 2_400
      person2:
        age: 68
        immigration_status: UNDOCUMENTED
        ssi_countable_income: 2_400
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # Couple standard 2,098.83 - 20 = 2,078.83, less the couple's countable
    # income 400 = 1,678.83 (MPP 49-055.32); each member receives one-half
    # (MPP 49-055.4): 839.415.
    ca_capi_person: [839.415, 839.415]

- name: Case 2, deemed income from an ineligible spouse below the couple FBR.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: UNDOCUMENTED
        # SSI does not compute these for people who fail its immigration
        # test, so the case supplies them. The spouse earns 500 per month,
        # above the 497 gap between the couple and individual FBRs
        # (1,491 - 994), so deeming applies. Couple countable income is
        # (500 - 20 - 65) / 2 = 207.50 per month (2,490 per year), all of it
        # deemed because person1 has no income of her own.
        is_ssi_spousal_deeming_applies: true
        ssi_income_deemed_from_ineligible_spouse: 2_490
        ssi_countable_income: 2_490
      person2:
        age: 50
        employment_income: 6_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # POMS SI 01320.430 D.
    # As an individual: federal 994 - 0 = 994; a federal benefit is due, so
    # the state supplement is the full individual OSS 1,233.94 - 994 = 239.94.
    # Under deeming: federal 1,491 - 207.50 = 1,283.50; a federal benefit is
    # due, so the state supplement is the couple OSS 2,098.83 - 1,491 = 607.83.
    # Federal = min(994, 1,283.50) = 994; state = min(239.94, 607.83) = 239.94.
    # CAPI = 994 + 239.94 - 10 = 1,223.94.
    ca_capi_person: [1_223.94, 0]

- name: Case 3, deemed income above the couple FBR reduces the couple state supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: UNDOCUMENTED
        # Supplied for the reason in Case 2. The spouse earns 3,867 per
        # month; couple countable income is (3,867 - 85) / 2 = 1,891 per
        # month (22,692 per year), all deemed.
        is_ssi_spousal_deeming_applies: true
        ssi_income_deemed_from_ineligible_spouse: 22_692
        ssi_countable_income: 22_692
      person2:
        age: 50
        employment_income: 46_404
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # POMS SI 01320.430 D.
    # As an individual: federal 994; state supplement 239.94.
    # Under deeming: 1,891 exceeds the couple FBR 1,491 by 400, so no federal
    # benefit; state supplement = couple OSS 607.83 - 400 = 207.83.
    # Federal = min(994, 0) = 0; state = min(239.94, 207.83) = 207.83.
    # CAPI = 0 + 207.83 - 10 = 197.83.
    ca_capi_person: [197.83, 0]

- name: Case 4, blind noncitizen with an ineligible spouse uses the two-blind couple rate under deeming.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_blind: true
        immigration_status: UNDOCUMENTED
        # Supplied for the reason in Case 2. The spouse earns 4,267 per
        # month; couple countable income is (4,267 - 85) / 2 = 2,091 per
        # month (25,092 per year), all deemed.
        is_ssi_spousal_deeming_applies: true
        ssi_income_deemed_from_ineligible_spouse: 25_092
        ssi_countable_income: 25_092
      person2:
        age: 42
        employment_income: 51_204
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # POMS SI 01320.430 C.7 and D.
    # As an individual: federal 994; state supplement = blind individual
    # OSS 1,318.32 - 994 = 324.32.
    # Under deeming the ineligible spouse is treated as blind too, so the
    # couple OSS is the two-blind rate 2,324.35 - 1,491 = 833.35. 2,091
    # exceeds the couple FBR by 600, so no federal benefit; state supplement
    # = 833.35 - 600 = 233.35.
    # Federal = 0; state = min(324.32, 233.35) = 233.35.
    # CAPI = 0 + 233.35 - 10 = 223.35.
    ca_capi_person: [223.35, 0]
