# California MCE has no net-income ceiling for any household size or
# elderly/disabled status (ACL 12-62 examples 4-5; ACL 13-32). ACL 14-56
# page 6 and ACL 14-63 page 2 deny zero-allotment units of three or more.
# https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2012/12-62.pdf
# https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2013/13-32.pdf
# https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2014/14-56.pdf#page=6
# https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2014/14-63.pdf#page=2
# FY2026 maximum/minimum allotments: CDSS ACIN I-46-25 attachment I.
# Each pair holds gross income, size and member eligibility fixed while
# varying only net income. All categorical and member gates are derived.
# Gross inputs floor the model's exact 200%-FPG limit: twice
# ($15,650 + $5,500 x (size - 1))/12. This preserves the existing model's
# exact-ratio convention rather than imposing CDSS chart rounding.
# Expected benefits are hand-calculated as max(minimum, maximum minus
# ceil(30% x net)); minimum is $24 for one/two-person units and $0 otherwise.

# Net 0 / 2608 gives contributions 0 / 783,
# so maximum $298 yields allotments $298 / $24.
- name: California MCE size 1 without elderly or disabled members varies net income at fixed gross income.
  period: 2026-01
  input:
    people:
      lower_person_1: &first_member_1
        age: 35
        monthly_age: 35
        immigration_status: CITIZEN
        weekly_hours_worked_before_lsr: 40
        is_tax_unit_dependent: false
        is_full_time_college_student: false
        is_part_time_college_student: false
        is_permanently_disabled_veteran: false
      higher_person_1:
        <<: *first_member_1
    spm_units:
      lower:
        members: [lower_person_1]
        snap_gross_income: 2608
        snap_net_income: 0
      higher:
        members: [higher_person_1]
        snap_gross_income: 2608
        snap_net_income: 2608
    tax_units:
      tax_lower_person_1:
        members: [lower_person_1]
      tax_higher_person_1:
        members: [higher_person_1]
    families:
      family_lower_person_1:
        members: [lower_person_1]
      family_higher_person_1:
        members: [higher_person_1]
    marital_units:
      marital_lower_person_1:
        members: [lower_person_1]
      marital_higher_person_1:
        members: [higher_person_1]
    households:
      lower_household:
        members: [lower_person_1]
        state_code: CA
      higher_household:
        members: [higher_person_1]
        state_code: CA
  output:
    snap_unit_size: [1, 1]
    is_snap_excluded_member: [false, false]
    is_tanf_non_cash_hheod: [false, false]
    snap_gross_test_income: [2608, 2608]
    meets_tanf_non_cash_gross_income_test: [true, true]
    meets_tanf_non_cash_net_income_test: [true, true]
    is_tanf_non_cash_eligible: [true, true]
    meets_snap_categorical_eligibility: [true, true]
    snap_max_allotment: [298, 298]
    snap_allotment_before_eligibility: [298, 24]
    ca_snap_meets_allotment_requirement: [true, true]
    is_snap_eligible: [true, true]
    snap_normal_allotment: [298, 24]
    snap: [298, 24]

