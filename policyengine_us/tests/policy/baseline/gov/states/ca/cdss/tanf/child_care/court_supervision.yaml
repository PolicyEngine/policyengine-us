# Authority: https://www.cdss.ca.gov/Portals/9/CCDD/2025-27%20CCDF%20State%20Plan%20%E2%80%93%20Amendments%201.pdf#page=19
# Court status is distinct from protective-services or child-care authorization.

- name: CA general court status without qualifying jurisdiction.
  period: 2026
  input:
    state_code: CA
    age: 14
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    ca_calworks_child_care_child_age_eligible: false

- name: CA qualifying court supervision at age 17.
  period: 2026
  input:
    state_code: CA
    age: 17
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
    ca_calworks_child_care_has_qualifying_court_supervision: true
  output:
    ca_calworks_child_care_child_age_eligible: true

