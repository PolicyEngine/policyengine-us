  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 1_000
        is_disabled: true
        meets_ssi_disability_criteria: true
      person2:
        age: 10
        employment_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ssi: [11_316, 0]
    ca_state_supplement_dependent_amount: 0
    ca_state_supplement: 0
    ca_capi: 0

- name: Integration test, permanent resident without 40 SSI quarters
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 1_000
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
      person2:
        age: 10
        employment_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ssi: [0, 0]
    ca_state_supplement_eligible_person: [false, false]
    ca_state_supplement_aged_disabled_count: 0
    ca_state_supplement_blind_amount: 0
    ca_state_supplement_aged_blind_disabled_amount: 0
    ca_state_supplement: 0
    # Disabled individual standard 1,233.94 + no-cooking food allowance
    # 128.87 (living arrangements default to no food preparation) =
    # 1,362.81 per month with no offset. Earnings of 83.33 per month fall
    # within the $20 + $65 exclusions, so countable income is 0.
    # 1,362.81 x 12 = 16,353.72.
    ca_capi: 16_353.72

- name: Mixed couple, only the noncitizen spouse receives CAPI
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: CITIZEN
      person2:
        age: 68
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The citizen receives SSI/SSP, which counts as the CAPI member's
    # unearned income (MPP 49-035.221). The model pays the citizen SSI of
    # 1,491 / 2 = 745.50 and a state supplement of 1,233.94 - 745.50 =
    # 488.44 per month; SSA pays 994 + 239.94, the same 1,233.94 total.
    # CAPI = couple standard 2,098.83 (MPP 49-050.13, no offset) - 0 income
    # - 745.50 - 488.44 = 864.89 per month; 864.89 x 12 = 10,378.68.
    ca_capi_person: [0, 10_378.68]
    ca_capi: 10_378.68

- name: Two unrelated eligible people in one unit, income is not pooled
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        # 1,520 per month foreign pension.
        pension_income: 18_240
      person2:
        age: 68
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # person1: 1,520 - 20 = 1,500 per month (18,000 per year).
    ssi_countable_income: [18_000, 0]
    # Each person is assessed on their own income (MPP 49-035.1, 49-055.32).
    # person1: 1,500 is not lower than the 1,233.94 standard, so 0.
    # person2: no income, so 1,233.94 per month; x 12 = 14,807.28. Pooling
    # person1's excess income with person2's standard would lower this.
    ca_capi_person: [0, 14_807.28]
    ca_capi: 14_807.28

- name: Aged person in 2024, the independent-living standard is floored at the federal benefit rate
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    households:
      household:
        members: [person1]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The state supplement parameters hold the 1991 aged amount of 630 until
    # 2025 (issue 7787). CAPI equals SSI/SSP (WIC 18941), so the standard is
    # floored at the 2024 federal benefit rate: max(630, 943) = 943 per
    # month with no offset and no income; 943 x 12 = 11,316. This pins a
    # known-low value from the stopgap floor: the published aged standard was
    # 1,182.94 (POMS SI 01415.056); issue 10480 removes the floor.
    ca_capi_person: 11_316
    ca_capi: 11_316

- name: Integration test, aged permanent resident without 40 SSI quarters whose pension exceeds the CAPI standard
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 0
        pension_income: 24_000 # 2,000 a month
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ssi: 0
    ca_capi_eligible_person: true
    # (2,000 - 20) x 12 = 23,760 of countable income.
    ssi_countable_income: 23_760
    # 1,980 a month exceeds CAPI's individual payment standard, which is at
    # most the 1,335.81 SSI/SSP no-cooking standard, so CAPI pays nothing.
    ca_capi: 0

- name: Integration test, mixed couple with income, the noncitizen spouse receives CAPI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        immigration_status: CITIZEN
        social_security_retirement: 6_000 # 500 a month
      person2:
        age: 68
        is_tax_unit_spouse: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        pension_income: 6_000 # 500 a month foreign pension
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # Both spouses are aged, so the model applies the SSI couple computation:
    # (500 + 500 - 20) / 2 = 490 a month each (5,880 a year).
    ssi_countable_income: [5_880, 5_880]
    # The citizen's SSI is 1,450 / 2 - 490 = 235 a month.
    # NOTE: SSA treats the noncitizen spouse as an ineligible spouse
    # (20 CFR 416.1160(d)). Her 500 exceeds the 1,450 - 967 = 483 gap, so SSA
    # deems her income and pays SSI of min(967 - 480, 1,450 - 980) = 470 and
    # a state supplement of min(1,335.81 - 967, 2,315.57 - 1,450) = 368.81,
    # 838.81 in all (POMS SI 01320.430 D; 20 CFR 416.1163(e)(2)). CAPI would
    # then be 2,315.57 - 980 - 838.81 = 496.76 a month (5,961.12 a year). The
    # model's couple computation for a mixed-status couple pays
    # 235 + 610.81 = 845.81, so CAPI is 489.76 instead of 496.76. This is a
    # pre-existing ssi_claim_is_joint limitation: it counts aged, blind or
    # disabled head/spouse status rather than SSI eligibility. The expected
    # values below are the model's.
    ssi: [2_820, 0] # 235 * 12
    # The citizen's state supplement is the 1,206.94 + 128.87 = 1,335.81
    # no-cooking individual standard less SSI 235 and his own 490:
    # 610.81 a month. The CAPI member's 490 is not counted.
    ca_state_supplement: 7_329.72 # 610.81 * 12
    # The CAPI member takes the whole couple standard (MPP 49-050.13), the
    # 2,057.83 + 257.74 = 2,315.57 no-cooking aged couple standard, with no
    # offset since June 2019 (WIC 18941).
    ca_capi_payment_standard: [0, 27_786.84] # 2,315.57 * 12
    # The couple's countable income 490 + 490 = 980 (MPP 49-055.32) and the
    # citizen's SSI/SSP 235 + 610.81, counted as unearned income based on
    # need (MPP 49-035.221), are subtracted:
    # 2,315.57 - 980 - 235 - 610.81 = 489.76 a month.
    ca_capi_person: [0, 5_877.12] # 489.76 * 12
    ca_capi: 5_877.12
