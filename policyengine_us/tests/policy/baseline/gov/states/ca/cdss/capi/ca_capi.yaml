- name: Single eligible person
  period: 2024
  input:
    people:
      person1:
        ssi_amount_if_eligible: 1_000
        ca_capi_eligible_person: true
        ssi_countable_income: 500
    spm_units:
      spm_unit:
        members: [person1]
        ca_capi_eligible: true
        ca_state_supplement: 2_000
  output:
    ca_capi: 2_490

- name: Couple, both people eligible
  period: 2024
  input:
    people:
      person1:
        ssi_amount_if_eligible: 1_000
        ca_capi_eligible_person: true
        ssi_countable_income: 500
      person2:
        ssi_amount_if_eligible: 1_000
        ca_capi_eligible_person: true
        ssi_countable_income: 4_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        ca_capi_eligible: true
        ca_state_supplement: 4_000
  output:
    ca_capi: 1_480

- name: Integration test, ineligible
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
      person2:
        age: 10
        employment_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ca_capi: 0

- name: Integration test, SSI eligible
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 1_000
        is_disabled: true
        meets_ssi_disability_criteria: true
      person2:
        age: 10
        employment_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ssi: [11_316, 0]
    ca_state_supplement_dependent_amount: 0
    ca_state_supplement: 0
    ca_capi: 0

- name: Integration test, undocumented
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 1_000
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: UNDOCUMENTED
      person2:
        age: 10
        employment_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    ssi: [0, 0]
    ca_state_supplement_eligible_person: [false, false]
    ca_state_supplement_aged_disabled_count: 0
    ca_state_supplement_blind_amount: 0
    ca_state_supplement_aged_blind_disabled_amount: 0
    ca_state_supplement: 0
    ca_capi: 11_306

- name: Integration test, aged permanent resident without 40 SSI quarters has pension counted
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 0
        pension_income: 6_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ssi: 0
    ca_capi_eligible_person: true
    # (500 - 20) x 12 = 5,760 of countable income.
    ssi_countable_income: 5_760
    ca_state_supplement: 0
    # 943 x 12 = 11,316 payment standard, less the 10 offset and 5,760.
    ca_capi: 5_546
