- name: Single eligible person
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        # 520 per month foreign pension.
        pension_income: 6_240
    households:
      household:
        members: [person1]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # 520 - 20 general exclusion = 500 per month (6,000 per year).
    ssi_countable_income: 6_000
    # Individual standard 1,233.94 (no offset since June 2019, WIC 18941),
    # less countable income 500 = 733.94 per month (MPP 49-055.32).
    # 733.94 x 12 = 8,807.28.
    ca_capi: 8_807.28

- name: Couple, both people eligible
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
      person2:
        age: 68
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # Couple standard 2,098.83 with no offset; each member receives one-half
    # (MPP 49-055.4): 1,049.415 per month, 12,592.98 per year. The unit
    # total is 2 x 12,592.98 = 25,185.96.
    ca_capi_person: [12_592.98, 12_592.98]
    ca_capi: 25_185.96

