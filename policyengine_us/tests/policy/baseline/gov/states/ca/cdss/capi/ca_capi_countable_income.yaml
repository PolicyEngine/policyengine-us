- name: CAPI preserves an annual countable-income override
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: CA
    age: 10
    is_ssi_disabled: true
    immigration_status: UNDOCUMENTED
    ssi_countable_income: 1_200
  output:
    # The supplied annual 1,200 gives 100 of monthly countable income.
    ca_capi_person: 991.27

- name: CAPI preserves an annual parental-deeming override
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: CA
    age: 10
    is_ssi_disabled: true
    immigration_status: UNDOCUMENTED
    ssi_unearned_income_deemed_from_ineligible_parent: 1_200
  output:
    # The supplied 100 a month consumes the 20 general income exclusion.
    ca_capi_person: 1_011.27

- name: A CAPI child applies the general exclusion before the earned exclusion
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        person_id: 1
        is_tax_unit_head: true
        ssi_unearned_income: 24_000
      child:
        age: 10
        person_id: 2
        parent_1_id: 1
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        immigration_status: UNDOCUMENTED
        ssi_earned_income: 2_400
        is_full_time_student: false
    tax_units:
      family:
        members: [parent, child]
    marital_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [child]
    households:
      home:
        members: [parent, child]
        state_code: CA
  output:
    people:
      child:
        # Parent: 2,000 - 20 - 994 = 986 deemed.
        # Child: 986 - 20 + (200 - 65) / 2 = 1,033.50 countable.
        ca_capi_person: 57.77

- name: Abolishing annual SSI countable income reaches monthly program budgets
  period: 2026-01
  input:
    gov.abolitions.ssi_countable_income: true
    state_code: CA
    age: 10
    is_ssi_disabled: true
    immigration_status: UNDOCUMENTED
    ssi_unearned_income: 12_000
  output:
    ssi_countable_income: 0
    ssi_countable_income_monthly: 0
    ca_capi_countable_income: 0
    ca_capi_person: 1_091.27
