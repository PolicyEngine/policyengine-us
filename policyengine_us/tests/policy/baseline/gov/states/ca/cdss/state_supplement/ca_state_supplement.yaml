# A CAPI-eligible member's income does not reduce the state supplement: CAPI
# budgets its own members' income (CAPI regulations MPP 49-035), and SSI/SSP
# counts another member's income only when it is deemed (20 CFR 416.1160(a)).
# 2025: federal SSI is $967; the no-cooking individual standard is
# $1,206.94 + $128.87 = $1,335.81.
- name: Case 10, 2025 aged citizen sharing an SPM unit with a CAPI-eligible sibling keeps the supplement.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        immigration_status: CITIZEN
        social_security_retirement: 6_000 # 500 a month
      person2:
        age: 72
        is_tax_unit_head: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 0
        pension_income: 6_000 # 500 a month
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # person2 is an LPR with fewer than 40 quarters, so SSI and the state
    # supplement bar her and she is CAPI-eligible.
    ca_capi_eligible_person: [false, true]
    # Each has 500 - 20 = 480 a month of countable income.
    ssi_countable_income: [5_760, 5_760]
    # person1's SSI is 967 - 480 = 487 a month.
    ssi: [5_844, 0] # 487 * 12
    # One eligible aged member, and living_arrangements_allow_for_food_preparation
    # defaults to false, so the standard is 1,206.94 + 128.87 = 1,335.81.
    ca_state_supplement_payment_standard: 16_029.72 # 1,335.81 * 12
    # The supplement is 1,335.81 - 487 - 480 = 368.81 a month; person2's 480
    # is not counted.
    ca_state_supplement: 4_425.72 # 368.81 * 12

# Under the model's SSI couple computation each aged spouse carries half of
# the couple's countable income for SSI. SSA treats the noncitizen spouse as
# an ineligible spouse (20 CFR 416.1160(d)) but deems none of the spouse's
# income: CAPI is a public income-maintenance payment (20 CFR 416.1142(a)(6);
# POMS SI 00830.175), and income counted in figuring it is not deemed
# (20 CFR 416.1161(a)(2)-(3); POMS SI 01320.141 A). So the supplement counts
# the citizen's own income. 2025: the couple federal benefit rate is $1,450;
# the no-cooking individual standard is $1,206.94 + $128.87 = $1,335.81.
# NOTE: SSA pays SSI of 967 - 480 = 487 and a supplement of 368.81. The
# model's SSI is still the couple computation, 235 (#10481), so its
# supplement is 620.81; the citizen's total, 855.81, is the same.
- name: Case 11, 2025 aged citizen married to a CAPI-eligible spouse, the supplement counts the citizen's own income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        immigration_status: CITIZEN
        social_security_retirement: 6_000 # 500 a month
      person2:
        age: 68
        is_tax_unit_spouse: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        pension_income: 6_000 # 500 a month foreign pension
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # SSI and the state supplement bar person2 for immigration status, so she
    # is CAPI-eligible.
    ca_capi_eligible_person: [false, true]
    # Both spouses are aged, so the model applies the SSI couple computation:
    # (500 + 500 - 20) / 2 = 490 a month each (5,880 a year).
    ssi_countable_income: [5_880, 5_880]
    # person1's SSI is 1,450 / 2 - 490 = 235 a month.
    ssi: [2_820, 0] # 235 * 12
    # One eligible aged member, and living_arrangements_allow_for_food_preparation
    # defaults to false, so the standard is 1,206.94 + 128.87 = 1,335.81.
    ca_state_supplement_payment_standard: 16_029.72 # 1,335.81 * 12
    # The supplement counts the citizen's own 500 - 20 = 480:
    # 1,335.81 - 235 - 480 = 620.81 a month.
    ca_state_supplement: 7_449.72 # 620.81 * 12

