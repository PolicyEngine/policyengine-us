        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The spouse's 2,000 - 20 = 1,980 leaves no CAPI, so it is deemed (20 CFR
    # 416.1163): the lesser of 1,233.94 - 0 and 2,098.83 - 1,980 = 118.83.
    # The model's joint SSI is max(745.50 - 990, 0) = 0, so the supplement is
    # 118.83.
    ssi: [0, 0]
    ca_state_supplement: 118.83
    # CAPI: 2,098.83 - 1,980 - 118.83 = 0.
    ca_capi_person: [0, 0]
