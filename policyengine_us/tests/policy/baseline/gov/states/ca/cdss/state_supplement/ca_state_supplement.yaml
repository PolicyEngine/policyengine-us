- name: Case 14, 2026 mixed couple where both spouses have income, the supplement counts the citizen's own income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        immigration_status: CITIZEN
        social_security_retirement: 9_600 # 800 a month
      person2:
        age: 68
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 39
        pension_income: 9_600 # 800 a month
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
        living_arrangements_allow_for_food_preparation: true
  output:
    # The model's SSI couple computation gives each spouse (1,600 - 20) / 2
    # = 790, so the citizen's SSI is max(745.50 - 790, 0) = 0. The supplement
    # counts the citizen's own 800 - 20 = 780: 1,233.94 - 0 - 780 = 453.94.
    # SSA pays the citizen 994 - 780 = 214 of SSI and 239.94 of supplement,
    # the same 453.94 in all (#10481).
    ssi: [0, 0]
    ca_state_supplement: 453.94
    # The spouse is paid, so CAPI is the mixed-couple amount:
    # 2,098.83 - 1,580 - 0 - 453.94 = 64.89.
    ca_capi_person: [0, 64.89]

- name: Case 15, 2026 mixed couple whose CAPI spouse has too much income for CAPI, so the spouse's income is deemed.
