- name: Threshold for single is $150,000.
  period: 2022
  input:
    filing_status: SINGLE
    adjusted_gross_income: 150_001 # AGI.
  output:
    is_ca_cvrp_normal_rebate_eligible: false

- name: Threshold for single is $150,000.
  period: 2022
  input:
    filing_status: SINGLE
    adjusted_gross_income: 150_000
  output:
    is_ca_cvrp_normal_rebate_eligible: true

- name: The 2020 charitable deduction for non-itemizers does not lower CVRP income.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 150_200
        charitable_cash_donations: 300
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Form 1040 line 11 is 150,200 - 300 = 149,900, but the CVRP manual
    # counts income before adjustments (Form 1040 lines 1-7, Schedule 1
    # lines 1-8): 150,200, over the $150,000 single cap.
    adjusted_gross_income: 149_900
    is_ca_cvrp_normal_rebate_eligible: false
