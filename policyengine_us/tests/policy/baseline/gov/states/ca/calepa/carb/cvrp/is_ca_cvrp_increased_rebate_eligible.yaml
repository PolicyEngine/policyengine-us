- name: Threshold is 400% of FPL.
  period: 2022
  input:
    ca_cvrp_countable_income: 40_000
    spm_unit_fpg: 10_000
    medicaid_enrolled: false
  output:
    is_ca_cvrp_increased_rebate_eligible: true

- name: Threshold is 400% of FPL.
  period: 2022
  input:
    ca_cvrp_countable_income: 40_100
    # Keep school meal income below the limit to check the separate measure.
    school_meal_countable_income: 0
    spm_unit_fpg: 10_000
    medicaid_enrolled: false
  output:
    is_ca_cvrp_increased_rebate_eligible: false

- name: Can also qualify via SSI.
  period: 2022
  input:
    ca_cvrp_countable_income: 40_100
    spm_unit_fpg: 10_000
    medicaid_enrolled: false
    ssi: 1
  output:
    is_ca_cvrp_increased_rebate_eligible: true

- name: Reported SSI receipt with a zero modeled payment also qualifies above the income threshold.
  period: 2022
  input:
    ca_cvrp_countable_income: 40_100
    spm_unit_fpg: 10_000
    medicaid_enrolled: false
    ssi: 0
    receives_ssi: true
  output:
    is_ca_cvrp_increased_rebate_eligible: true

- name: Child support received counts in the income base, pushing over 400% FPL.
  period: 2026
  input:
    age: 40
    employment_income: 62_000
    child_support_received: 3_000
    medicaid_enrolled: false
  output:
    is_ca_cvrp_increased_rebate_eligible: false

- name: Same earnings without child support stay under 400% FPL.
  period: 2026
  input:
    age: 40
    employment_income: 62_000
    medicaid_enrolled: false
  output:
    is_ca_cvrp_increased_rebate_eligible: true
