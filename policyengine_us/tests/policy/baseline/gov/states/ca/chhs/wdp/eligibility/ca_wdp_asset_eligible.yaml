- name: Case 6, three-person tax unit at the July 2027 three-person limit is eligible in 2028.
  period: 2028
  input:
    people:
      person1:
        age: 45
        ssi_countable_resources: 16_000
      person2:
        age: 43
        ssi_countable_resources: 16_550
      person3:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    # Limit 31,000 + 1 x 1,550 = 32,550. 16,000 + 16,550 + 0 = 32,550 is at
    # it; resources may not exceed it.
    ca_wdp_asset_eligible: [true, true, true]

- name: Case 7, three-person tax unit above the July 2027 three-person limit is ineligible in 2028.
  period: 2028
  input:
    people:
      person1:
        age: 45
        ssi_countable_resources: 16_000
      person2:
        age: 43
        ssi_countable_resources: 16_551
      person3:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    # Limit 31,000 + 1 x 1,550 = 32,550. 16,000 + 16,551 + 0 = 32,551 is over
    # it.
    ca_wdp_asset_eligible: [false, false, false]
