    # may not exceed it.
    ca_wdp_asset_eligible: [true, true]

- name: Case 5, two-person tax unit above the July 2027 two-person limit is ineligible in 2028.
  period: 2028
  input:
    people:
      person1:
        age: 45
        ssi_countable_resources: 15_500
      person2:
        age: 43
        ssi_countable_resources: 15_501
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # 15,500 + 15,501 = 31,001 is over the 31,000 two-person limit.
