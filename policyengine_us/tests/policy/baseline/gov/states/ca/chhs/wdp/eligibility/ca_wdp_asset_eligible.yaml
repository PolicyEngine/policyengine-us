- name: Case 1, two-person tax unit at the 2026 two-person limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 45
        ssi_countable_resources: 100_000
      person2:
        age: 43
        ssi_countable_resources: 95_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # 100,000 + 95,000 = 195,000 is at the 195,000 two-person limit; resources
    # may not exceed it.
    ca_wdp_asset_eligible: [true, true]

- name: Case 2, one person at the July 2027 one-person limit is eligible in 2028.
  period: 2028
  input:
    people:
