- name: Case 14, negative HQW lifted to $16 statutory floor.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: -1_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # floor(-$1,000 / 23) = floor(-$43.48) = -$44; max(-$44, $16) = $16;
        # min($16, $541) = $16. The $16 min_amount floor absorbs negative HQW.
        ok_ui_weekly_benefit_rate: 16
