# Tests for Oklahoma UI overall monetary eligibility (40 O.S. §2-207).
# Eligible if Test A OR Test B passes:
#   Test A (§2-207(A)): taxable >= $1,500 AND total >= 1.5 x HQW.
#   Test B (§2-207(B)): taxable > 0 AND total >= annual taxable wage base.
# Reference: 40 O.S. §2-207.

- name: Case 1, Test A passes alone (Test B fails on total below wage base).
  period: 2024
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_high_quarter_total_wages: 10_000
        ok_ui_base_period_taxable_wages: 5_000
        ok_ui_base_period_total_wages: 20_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: taxable $5,000 >= $1,500 AND $20,000 >= 1.5 * $10,000 = $15,000 -> passes.
        # Test B: total $20,000 < $27,000 (2024 wage base) -> fails.
        # Overall: A OR B = true.
        ok_ui_meets_high_quarter_test: true
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: true

- name: Case 2, Test B passes alone (Test A fails on 1.5x prong).
  period: 2025
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 20_000
        ok_ui_high_quarter_total_wages: 20_000
        ok_ui_base_period_taxable_wages: 2_000
        ok_ui_base_period_total_wages: 28_500
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: taxable $2,000 >= $1,500 (ok); total $28,500 < 1.5 * $20,000 = $30,000 -> fails.
        # Test B: taxable $2,000 > $0 (ok); total $28,500 >= $28,200 (2025 wage base) -> passes.
        # Overall: A OR B = true.
        ok_ui_meets_high_quarter_test: false
        ok_ui_meets_alternate_wages_test: true
        ok_ui_monetarily_eligible: true

- name: Case 3, both tests fail.
  period: 2025
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_high_quarter_total_wages: 10_000
        ok_ui_base_period_taxable_wages: 1_000
        ok_ui_base_period_total_wages: 12_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: taxable $1,000 < $1,500 -> fails.
        # Test B: total $12,000 < $28,200 (2025 wage base) -> fails.
        # Overall: A OR B = false.
        ok_ui_meets_high_quarter_test: false
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: false

# --- Boundary cases redistributed from edge_cases.yaml (Test A/Test B seams) ---
# These assert the two component tests plus the overall aggregator, all of which
# this file covers.

- name: Case 1, Test A taxable wages exactly at $1,500 threshold.
  period: 2024
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 1_000
        ok_ui_high_quarter_total_wages: 1_000
        ok_ui_base_period_taxable_wages: 1_500
        ok_ui_base_period_total_wages: 1_500
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A taxable prong: $1,500 >= $1,500 -> passes (>= operator).
        # Test A multiplier prong: $1,500 >= 1.5 * $1,000 = $1,500 -> passes (>=).
        # Test A: both prongs pass.
        ok_ui_meets_high_quarter_test: true
        # Test B: total $1,500 < $27,000 (2024 wage base) -> fails.
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: true

- name: Case 2, Test A taxable wages one dollar below threshold.
  period: 2024
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 1_000
        ok_ui_high_quarter_total_wages: 1_000
        ok_ui_base_period_taxable_wages: 1_499
        ok_ui_base_period_total_wages: 1_500
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A taxable prong: $1,499 < $1,500 -> fails.
        ok_ui_meets_high_quarter_test: false
        # Test B: $1,499 > 0 but total $1,500 < $27,000 -> fails.
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: false

- name: Case 3, Test A total wages exactly at 1.5x HQW boundary.
  period: 2024
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_high_quarter_total_wages: 10_000
        ok_ui_base_period_taxable_wages: 5_000
        ok_ui_base_period_total_wages: 15_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A multiplier prong: $15,000 >= 1.5 * $10,000 = $15,000 -> passes (>= operator).
        # Test A taxable prong: $5,000 >= $1,500 -> passes.
        ok_ui_meets_high_quarter_test: true
        ok_ui_monetarily_eligible: true

- name: Case 4, Test A total wages one dollar below 1.5x HQW boundary.
  period: 2024
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_high_quarter_total_wages: 10_000
        ok_ui_base_period_taxable_wages: 5_000
        ok_ui_base_period_total_wages: 14_999
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A multiplier prong: $14,999 < 1.5 * $10,000 = $15,000 -> fails.
        ok_ui_meets_high_quarter_test: false
        # Test B: total $14,999 < $27,000 -> fails.
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: false

- name: Case 5, Test B total wages exactly at 2025 taxable wage base.
  period: 2025
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 20_000
        ok_ui_high_quarter_total_wages: 20_000
        ok_ui_base_period_taxable_wages: 2_000
        ok_ui_base_period_total_wages: 28_200
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: $28,200 < 1.5 * $20,000 = $30,000 -> fails.
        ok_ui_meets_high_quarter_test: false
        # Test B: taxable $2,000 > $0 AND $28,200 >= $28,200 (2025 wage base) -> passes (>=).
        ok_ui_meets_alternate_wages_test: true
        ok_ui_monetarily_eligible: true

- name: Case 6, Test B total wages one dollar below 2025 taxable wage base.
  period: 2025
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 20_000
        ok_ui_high_quarter_total_wages: 20_000
        ok_ui_base_period_taxable_wages: 2_000
        ok_ui_base_period_total_wages: 28_199
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: $28,199 < $30,000 -> fails.
        ok_ui_meets_high_quarter_test: false
        # Test B: $28,199 < $28,200 -> fails.
        ok_ui_meets_alternate_wages_test: false
        ok_ui_monetarily_eligible: false
