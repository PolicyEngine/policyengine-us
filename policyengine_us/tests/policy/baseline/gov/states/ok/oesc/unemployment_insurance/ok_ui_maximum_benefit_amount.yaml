# --- Item 17: 2022 base-period-wages-share (0.4) binding band. Confirms the
# restored 2022=0.4 share can be the binding cap under the 26-week regime. ---

- name: Case 6, 2022 - 0.4 share binds under the 26-week regime.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        # HQW $6,900 -> floor($6,900 / 23) = $300.
        ok_ui_high_quarter_taxable_wages: 6_900
        ok_ui_base_period_taxable_wages: 6_900
        ok_ui_base_period_total_wages: 12_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        ok_ui_weekly_benefit_rate: 300
        # 26-week product $300 * 26 = $7,800 < $9,900 max_amount, but
        # 0.4 * $12,000 = $4,800 share cap is the lesser -> MBA $4,800.
        ok_ui_maximum_benefit_amount: 4_800

