  input:
    people:
      person1:
        age: 35
        # HQW $20,000 -> floor($20,000 / 23) = $869 -> clamped to $541 (2025 max WBA).
        ok_ui_high_quarter_taxable_wages: 20_000
        ok_ui_base_period_taxable_wages: 20_000
        ok_ui_base_period_total_wages: 100_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        ok_ui_weekly_benefit_rate: 541
        # min(min($541 * 16 = $8,656, $8,656 max_amount), 0.4 * $100,000 = $40,000) = $8,656.
        ok_ui_maximum_benefit_amount: 8_656

