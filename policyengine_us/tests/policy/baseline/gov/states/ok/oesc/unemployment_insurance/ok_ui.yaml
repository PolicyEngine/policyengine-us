    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: $0 < $1,500 -> fails. Test B: $0 not > 0 -> fails.
        ok_ui_monetarily_eligible: false
        # defined_for gate -> $0.
