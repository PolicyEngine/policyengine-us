- name: Case 8, base-period wages share caps annual benefit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_base_period_taxable_wages: 10_000
        ok_ui_base_period_total_wages: 15_000
        ok_ui_gross_weekly_earnings: 0
        weeks_unemployed: 16
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        ok_ui_monetarily_eligible: true
        ok_ui_weekly_benefit_rate: 434
        # Lesser of $434 * 16 = $6,944, statewide $8,656, and 40% * $15,000 = $6,000.
        ok_ui_maximum_benefit_amount: 6_000
        ok_ui: 6_000

# --- Item 18(e): share-cap-derived MBA binds ok_ui even though weeks < 16. ---

- name: Case 9, share cap binds annual benefit at 14 weeks (< 16).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 10_000
        ok_ui_base_period_taxable_wages: 10_000
        ok_ui_base_period_total_wages: 15_000
        ok_ui_gross_weekly_earnings: 0
        weeks_unemployed: 14
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    people:
      person1:
        # Test A: total $15,000 >= 1.5 * $10,000 = $15,000 -> passes.
        ok_ui_monetarily_eligible: true
        # WBR: floor($10,000 / 23) = $434.
        ok_ui_weekly_benefit_rate: 434
        # MBA = lesser of $434 * 16 = $6,944, statewide $8,656, and
        # 40% * $15,000 = $6,000 -> share cap binds at $6,000.
        ok_ui_maximum_benefit_amount: 6_000
        # Annual: min($434 * 14 = $6,076, $6,000) = $6,000 -> share-derived MBA
        # binds despite only 14 weeks (< 16 max_weeks).
        ok_ui: 6_000

# --- Item 19: negative base-period wages -> ok_ui $0 (monetary gate fails; the
# max_(..., 0) guard also prevents a negative MBA). ---

- name: Case 10, negative base-period total wages - no benefit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ok_ui_high_quarter_taxable_wages: 9_200
