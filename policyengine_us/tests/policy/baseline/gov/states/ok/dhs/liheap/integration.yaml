# Oklahoma LIHEAP end-to-end integration cases for regular winter heating.
# Sources: OAC 340:20-1-10, 340:20-1-11 and 340:20-1-19 (current Title 340 and the 9-15-25 adoption in Oklahoma
# Register Vol. 42 No. 20); OKDHS Appendix C-7 (10/1/2024, 10/1/2025 and 10/1/2026 editions: 130% of the prior year's
# poverty guideline and a $240 monthly earned income deduction per employed member); Appendix C-7-A (winter heating
# matrix); Appendix C-1 Schedule IX-A (need standard of an ineligible adult); Appendix C-4 (child care family share).
# Monthly gross limits used: FY2025 size 1 $1,632; FY2026 size 1 $1,696, size 3 $2,888, size 4 $3,483; FY2027 size 8
# $6,037 plus $616 for each member above eight.
# C-7-A net monthly income rows: $0-$400, $401-$700, $701 and up; size columns 1-3, 4-6, 7 or more. Monthly income is
# annual income / 12, rounded half up to the dollar (OAC 340:20-1-11(a)).

- name: Case 1, a retiree heating with propane deducts Medicare and other medical costs in FY2025.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        ssi: 0
        social_security: 12_000
        medicare_enrolled: true
        # 2025 standard Part B premium: 185 x 12.
        medicare_part_b_premium: 2_220
        other_medical_expenses: 1_800
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: PROPANE
        bottled_gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_household_size: 1
    # Social Security counts gross before any deduction (OAC 340:20-1-11(a), (c)).
    ok_liheap_countable_income: 12_000
    ok_liheap_gross_income: 12_000
    # C-7 10/1/2024: 1,632 x 12.
    ok_liheap_income_limit: 19_584
    # 1,000 a month <= 1,632.
    ok_liheap_eligible: true
    # Age 68: Part B 2,220 + other medical 1,800 (OAC 340:20-1-11(c)(1)).
    ok_liheap_income_deductions: 4_020
    # 12,000 - 4,020 = 7,980 -> 665 a month, row $401-$700.
    ok_liheap_net_income: 7_980
    # C-7-A LP gas, kerosene or heating oil, $401-$700, size 1-3.
    ok_liheap_matrix_amount: 350
    ok_liheap: 350

- name: Case 2, a single parent of three with a child care copay is paid from the four to six person column in FY2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 32
        ssi: 0
        # Full time at $15 an hour: 15 x 2,080.
        employment_income: 31_200
      person2:
        age: 9
        ssi: 0
      person3:
        age: 6
        ssi: 0
      person4:
        age: 3
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        # Appendix C-4-B one-star center, 25-48 months, full time: 17.20 x 22 days = 378.40 a month, less the 189
        # family share = 189.40 a month.
        ok_child_care_subsidies: 2_272.80
        # Appendix C-4 family share for four at $2,559-$2,842 a month: 189 x 12.
        ok_ccs_copay: 2_268
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: OK
  output:
    ok_liheap_household_size: 4
    ok_liheap_gross_income: 31_200
    # C-7 10/1/2025: 3,483 x 12.
    ok_liheap_income_limit: 41_796
    # 2,600 a month <= 3,483.
    ok_liheap_eligible: true
    # 240 x 12 for the one employed member.
    ok_liheap_income_deductions: [2_880, 0, 0, 0]
    # 31,200 - 2,880 - 2,268 copay (OAC 340:20-1-11(c)(5)) = 26,052 -> 2,171 a month, row $701 and up.
    ok_liheap_net_income: 26_052
    # C-7-A natural gas, $701 and up, size 4-6.
    ok_liheap_matrix_amount: 259
    ok_liheap: 259

- name: Case 3, an SSI recipient roomer with heat in rent deducts medical costs and receives the roomer amount in
    FY2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        # 2026 federal SSI benefit rate: 994 x 12.
        ssi: 11_928
        other_medical_expenses: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heat_expense_included_in_rent: true
        ok_liheap_dwelling_type: ROOMER
        # Utility surcharge on the rent receipt: $50 a month in six winter months.
        gas_expense: 300
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    # SSI receipt meets OAC 340:50-5-4(a)(2).
    is_usda_disabled: true
    ok_liheap_household_size: 1
    ok_liheap_countable_income: 11_928
    ok_liheap_gross_income: 11_928
    # C-7 10/1/2025: 1,696 x 12.
    ok_liheap_income_limit: 20_352
    # 994 a month <= 1,696; the surcharge shows responsibility (OAC 340:20-1-19(d)(1)-(2)).
    ok_liheap_eligible: true
    ok_liheap_income_deductions: 600
    # 11,928 - 600 = 11,328 -> 944 a month, row $701 and up.
    ok_liheap_net_income: 11_328
    # C-7-A roomer, all energy sources, $701 and up, size 1-3.
    ok_liheap_matrix_amount: 40
    ok_liheap: 40

- name: Case 4, a mixed status family counts the ineligible parent's income after his deductions and need standard in
    FY2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 38
        immigration_status: UNDOCUMENTED
        years_since_us_entry: 10
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 24_000
      person2:
        age: 36
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
      person3:
        age: 9
        is_tax_unit_dependent: true
        ssi: 0
      person4:
        age: 4
        is_tax_unit_dependent: true
        ssi: 0
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: OK
  output:
    # OAC 340:20-1-10(d), (h)(3): the undocumented parent is not in household size.
    ok_liheap_immigration_eligible: [false, true, true, true]
    ok_liheap_household_size: 3
    # OAC 340:20-1-11(a)(4): 24,000 - 2,880 earned income deduction - 398 x 12 (C-1 Schedule IX-A, one person).
    ok_liheap_deemed_income: 16_344
    # 12,000 + 16,344.
    ok_liheap_gross_income: 28_344
    # C-7 10/1/2025: 2,888 x 12.
    ok_liheap_income_limit: 34_656
    # 2,362 a month <= 2,888.
    ok_liheap_eligible: true
    ok_liheap_income_deductions: [2_880, 2_880, 0, 0]
    # Only the eligible parent's deduction applies here: 28,344 - 2,880 = 25,464 -> 2,122 a month, row $701 and up.
    ok_liheap_net_income: 25_464
    # C-7-A natural gas, $701 and up, size 1-3.
    ok_liheap_matrix_amount: 235
    ok_liheap: 235

- name: Case 5, a nine person household uses the additional member limit and the seven or more column in FY2027.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 41
        ssi: 0
        # Full time at $25 an hour: 25 x 2,080.
        employment_income: 52_000
      person2: {age: 39, ssi: 0}
      person3: {age: 16, ssi: 0}
      person4: {age: 14, ssi: 0}
      person5: {age: 12, ssi: 0}
      person6: {age: 10, ssi: 0}
      person7: {age: 8, ssi: 0}
      person8: {age: 5, ssi: 0}
      person9: {age: 2, ssi: 0}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_400
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        state_code: OK
  output:
    ok_liheap_household_size: 9
    ok_liheap_gross_income: 52_000
    # C-7 10/1/2026: (6,037 for eight + 616 for the ninth member) x 12 = 6,653 x 12.
    ok_liheap_income_limit: 79_836
    # 4,333.33 a month rounds to 4,333 <= 6,653.
    ok_liheap_eligible: true
    ok_liheap_income_deductions: [2_880, 0, 0, 0, 0, 0, 0, 0, 0]
    # 52,000 - 2,880 = 49,120 -> 4,093.33, rounded 4,093 a month, row $701 and up.
    ok_liheap_net_income: 49_120
    # C-7-A electricity, $701 and up, size 7 or more.
    ok_liheap_matrix_amount: 277
    ok_liheap: 277
