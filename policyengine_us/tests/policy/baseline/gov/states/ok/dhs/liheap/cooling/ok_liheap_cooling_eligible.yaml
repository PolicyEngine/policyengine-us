# Oklahoma LIHEAP summer cooling eligibility.
# OAC 340:20-1-10(h): responsibility for home energy costs, gross income at or below
# Appendix C-7 (130% of the poverty guideline, the limit winter heating uses), and at
# least one eligible member. Monthly size-one limits: FY2025 1,632, FY2026 1,696
# (also printed in the July 14, 2026 summer cooling release), FY2027 1,729. Wages of
# 15,080 are full-time work at the 7.25 Oklahoma minimum wage (7.25 x 40 x 52).

- name: Case 1, a home with no heating is cooling eligible like a home with a known heating fuel.
  period: 2026
  input:
    state_code: [OK, OK]
    age: [40, 40]
    employment_income_before_lsr: [15_080, 15_080]
    heating_type: [NONE, NATURAL_GAS]
    gas_expense: [0, 600]
    has_cooling_expense: [true, true]
  output:
    # Winter heating needs a heating fuel; summer cooling does not.
    ok_liheap_eligible: [false, true]
    ok_liheap_cooling_eligible: [true, true]

- name: Case 2, the FY2026 limit admits gross income of 1,667 a month but not 1,700.
  period: 2026
  input:
    state_code: [OK, OK]
    age: [40, 40]
    employment_income_before_lsr: [20_000, 20_400]
    heating_type: [ELECTRICITY, ELECTRICITY]
    has_cooling_expense: [true, true]
  output:
    # 20,000 / 12 = 1,666.67 -> 1,667 <= 1,696; 20,400 / 12 = 1,700 > 1,696.
    ok_liheap_cooling_eligible: [true, false]

- name: Case 3, the lower FY2025 limit excludes gross income of 1,667 a month.
  period: 2025
  input:
    state_code: [OK]
    age: [40]
    employment_income_before_lsr: [20_000]
    heating_type: [ELECTRICITY]
    has_cooling_expense: [true]
  output:
    # 1,667 > 1,632.
    ok_liheap_cooling_eligible: [false]

- name: Case 4, the higher FY2027 limit admits gross income of 1,700 a month.
  period: 2027
  input:
    state_code: [OK]
    age: [40]
    employment_income_before_lsr: [20_400]
    heating_type: [ELECTRICITY]
    has_cooling_expense: [true]
  output:
    # 1,700 <= 1,729.
    ok_liheap_cooling_eligible: [true]

- name: Case 5, a household with no eligible member is ineligible.
  period: 2026
  input:
    state_code: [OK]
    age: [40]
    immigration_status: [UNDOCUMENTED]
    employment_income_before_lsr: [15_080]
    heating_type: [ELECTRICITY]
    has_cooling_expense: [true]
  output:
    # The undocumented member is excluded from household size, and the deemed
    # income of 15,080 - 2,880 - 398 x 12 = 7,424 (619 a month) exceeds the
    # size-0 limit of 0.
    ok_liheap_cooling_eligible: [false]

- name: Case 6, a household with no eligible member is ineligible even when it passes the income test.
  period: 2026
  input:
    state_code: [OK]
    age: [40]
    immigration_status: [UNDOCUMENTED]
    employment_income_before_lsr: [7_000]
    heating_type: [ELECTRICITY]
    has_cooling_expense: [true]
  output:
    # Deemed income max(7,000 - 2,880 - 398 x 12, 0) = 0 meets the size-0 limit
    # of 0, so the household size of 0 alone makes the household ineligible.
    ok_liheap_income_eligible: [true]
    ok_liheap_cooling_eligible: [false]
    ok_liheap_cooling: [0]
