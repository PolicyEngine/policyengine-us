# Unit tests for Oklahoma TANF resources eligibility
# OAC 340:10-3-5: Maximum countable reserve is $1,000
# https://www.law.cornell.edu/regulations/oklahoma/Okla-Admin-Code-SS-340-10-3-5

- name: Resources below $1,000 limit
  period: 2024-01
  input:
    people:
      adult:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [adult, child]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_tanf_resources_eligible: true

- name: Resources at exact $1,000 limit
  period: 2024-01
  input:
    people:
      adult:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [adult, child]
        spm_unit_cash_assets: 1_000
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_tanf_resources_eligible: true

- name: Resources above $1,000 limit
  period: 2024-01
  input:
    people:
      adult:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [adult, child]
        spm_unit_cash_assets: 1_500
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_tanf_resources_eligible: false

- name: No resources
  period: 2024-01
  input:
    people:
      adult:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [adult, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.90 = 1,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 1,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.90
    state_code: OK
  output:
    ok_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.91 = 1,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.91
    state_code: OK
  output:
    ok_tanf_resources_eligible: false
