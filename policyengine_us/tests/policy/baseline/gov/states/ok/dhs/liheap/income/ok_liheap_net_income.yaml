# Oklahoma independent fully qualified household components; no final eligibility or award is asserted.

# C7 dated2026-10-01:240monthly*12=2880 for each of two workers.24000-2880-2880=18240; worker1 has two sources but gets one allowance.
- name: Case 1, FY2027 earned allowance applies once per worker rather than once per source or household.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 6_000
      person2:
        age: 39
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 6_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    ok_liheap_gross_income: 24_000
    ok_liheap_net_income: 18_240

