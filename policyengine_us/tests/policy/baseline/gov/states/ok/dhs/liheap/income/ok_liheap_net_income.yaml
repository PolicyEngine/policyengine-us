# Register p. 581 allows the OKDHS CCS copay for actual recipients. Annual copay 1,200 (100 monthly) is deducted once with
# a positive subsidy: 12,000 - 2,880 - 1,200 = 7,920.
- name: Case 7, FY2027 reported CCS copay is deducted for an actual subsidy recipient.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 2_400
        ok_ccs_copay: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    ok_liheap_gross_income: 12_000
    ok_liheap_net_income: 7_920

