# Source-derived Oklahoma ordinary heating cases under contract v1.3.
# Current C1 need and C7 earned amounts are tested in2027.

# Current340:20-1-11(a)(2)-(4):12000wages+600rent+1200farmrent+1200annualSSI=15000;2400pension stays with its recipient before deeming. SSI is monthly but the supplied annual receipt is counted once.
- name: Case 1, person income preserves separate annual receipts before immigration deeming.
  period: 2027
  input:
    people:
      eligible:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 1200
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
        rental_income: 600
        farm_rent_income: 1200
      ineligible:
        age: 35
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        pension_income: 2400
    tax_units:
      tax_unit:
        members: [eligible, ineligible]
    spm_units:
      spm_unit:
        members: [eligible, ineligible]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [eligible, ineligible]
        state_code: OK
  output:
    ok_liheap_countable_income: [15000, 2400]

# Plan Section 1.9 nets the Medicare Part B premium from Social Security only, floored at zero:
# max(1,200 - 2,434.80 (202.90 x 12), 0) = 0, so the excess premium does not reduce the 12,000 pension. Countable 12,000.
- name: Case 2, a Part B premium above the Social Security benefit floors that benefit at zero without reducing other income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        social_security: 1_200
        medicare_part_b_premium: 2_434.80
        pension_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_income: 12_000
    ok_liheap_gross_income: 12_000

# Each unearned source is floored at zero before summing, so losses cannot offset other income:
# person1 12,000 wages + max(-6,000 rental, 0) = 12,000; person2 5,000 pension + max(-3,000 farm rent, 0) + max(-2,000 estate, 0) = 5,000.
# Gross 12,000 + 5,000 = 17,000.
- name: Case 3, rental farm rent and estate losses do not offset wages or pension income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        employment_income: 12_000
        rental_income: -6_000
      person2:
        age: 62
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        pension_income: 5_000
        farm_rent_income: -3_000
        estate_income: -2_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    ok_liheap_countable_income: [12_000, 5_000]
    ok_liheap_gross_income: 17_000

# Plan Section 1.9 counts retirement benefits; an IRA withdrawal enters through retirement_distributions.
# Social Security 1,000/mo (12,000) net of the 2026 Part B premium 202.90 x 12 = 2,434.80 -> 9,565.20.
# IRA withdrawal 300/mo (3,600). Countable 9,565.20 + 3,600 = 13,165.20 (1,097.10/mo).
- name: Case 4, an IRA withdrawal counts alongside Social Security net of the Part B premium for a retiree.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 75
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        social_security: 12_000
        medicare_part_b_premium: 2_434.80
        taxable_ira_distributions: 3_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_income: 13_165.20
    ok_liheap_gross_income: 13_165.20
