# Oklahoma independent fully qualified household components; no final eligibility or award is asserted.

# OAC 340:20-1-11(a)-(b) (Register pp. 576-578) with the existing net business inputs:
# 12,000 + 2,400 + 600 + 0 + 1,200 = 16,200. No further 50% business deduction.
- name: Case 1, adult positive sources count without another business deduction and losses are zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_400
        sstb_self_employment_income: 600
        farm_operations_income: -1_200
        partnership_s_corp_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_earned_income: 16_200

# Incorporated SNAP rule 340:50-7-22(9) exempts elementary or high school students 17 and younger under adult control.
# K-12 explicitly true and tax dependency approximate attendance and control.
- name: Case 2, dependent elementary school earnings are excluded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
      person2:
        age: 10
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        employment_income: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    ok_liheap_countable_earned_income: [12_000, 0]

# SNAP rule 340:50-7-22(9), incorporated by Register p. 578, needs age under 18, K-12 attendance and adult control.
# Wages 6,000 + business 1,200 = 7,200 count unless all three hold; adult college is not K-12.
- name: Case 3, dependent high school student follows all three student exclusion conditions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
