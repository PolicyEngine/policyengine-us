# Oklahoma independent fully qualified household components; no final eligibility or award is asserted.

# Register pp576-578 and approved existing-net-input convention:12000+2400+600+0+1200=16200. No second legal50% business deduction is applied.
- name: Case 1, adult positive sources count without another business deduction and losses are zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 2_400
        sstb_self_employment_income: 600
        farm_operations_income: -1_200
        partnership_s_corp_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_earned_income: 16_200

