# OAC 340:20-1-11(a)(2) counts self-employment as earned income; farm_operations_income is the existing net farm input.
# 12,000 wages + 1,200 net farm income = 13,200 (12,000 if the farm source were not listed).
- name: Case 8, positive net farm income counts as earned income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        ssi: 0
        employment_income: 12_000
        farm_operations_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_earned_income: 13_200
