# Source-derived Oklahoma ordinary heating cases under contract v1.3.
# Current C1 need and C7 earned amounts are tested in2027.

# Current340:20-1-11(a)(4), C1p4/C7p1:13200-2880-4776=5544=462monthly. C7Ap1 ordinaryfuel,size1-3,401-700=>265 despite10annual bill. Regular heating schedule has no actual-expense cap.
- name: Case 1, the ordinary mixed status heating award uses deemed net income without a bill cap.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 13200
      child:
        age: 10
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
    tax_units:
      tax_unit:
        members: [adult, child]
    spm_units:
      spm_unit:
        members: [adult, child]
        heating_type: NATURAL_GAS
        gas_expense: 10
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_liheap_household_size: 1
    ok_liheap_gross_income: 5544
    ok_liheap_net_income: 5544
    ok_liheap_eligible: true
    ok_liheap: 265

# C7p1 allowance12000-2880=9120=760monthly; C7Ap1 deliveredfuel,size1-3,701orhigher pays280. The10primary bill does not cap the ordinary scheduled award.
- name: Case 2, a delivered fuel household receives the published award after its earned allowance.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
    tax_units:
      tax_unit:
        members: [adult]
    spm_units:
      spm_unit:
        members: [adult]
        heating_type: PROPANE
        gas_expense: 0
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
        bottled_gas_expense: 10
    households:
      household:
        members: [adult]
        state_code: OK
  output:
    ok_liheap_gross_income: 12000
    ok_liheap_net_income: 9120
    ok_liheap_eligible: true
    ok_liheap: 280

# Current340:20-1-10(f)-(g) plus C7Ap1:0net,size1 renter150,roomer70; subsidizedpositive surcharge retains150, zero surcharge ineligible. Roomer written-agreement fact is assumed under documented input limitation.
- name: Case 3, renter roomer and subsidized surcharge routes link eligibility to their heating schedules.
  period: 2027
  input:
    state_code: [OK, OK, OK, OK]
    age: [40, 40, 40, 40]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    ssi: [0, 0, 0, 0]
    ok_tanf: [0, 0, 0, 0]
    ok_child_care_subsidies: [0, 0, 0, 0]
    ok_ccs_copay: [0, 0, 0, 0]
    heat_expense_included_in_rent: [true, true, true, true]
    receives_housing_assistance: [false, false, true, true]
    ok_liheap_dwelling_type: [STANDARD, ROOMER, STANDARD, STANDARD]
    gas_expense: [0, 0, 10, 0]
    has_heating_expense: [false, false, false, false]
  output:
    ok_liheap_eligible: [true, true, true, false]
    ok_liheap: [150, 70, 150, 0]

