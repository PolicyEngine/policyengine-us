# Oklahoma LIHEAP regular heating cases.
# Cases dated 2027 use the current Appendix C-1 need standards and Appendix C-7 earned income deduction.

# OAC 340:20-1-11(a)(4), C-1 p. 4, C-7 p. 1: 13,200 - 2,880 - 4,776 = 5,544 deemed (462/mo).
# C-7-A p. 1 ordinary fuel, size 1-3, 401-700 -> 265 despite the 10 annual bill; the schedule has no expense cap.
- name: Case 1, the ordinary mixed status heating award uses deemed net income without a bill cap.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 13200
      child:
        age: 10
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
    tax_units:
      tax_unit:
        members: [adult, child]
    spm_units:
      spm_unit:
        members: [adult, child]
        heating_type: NATURAL_GAS
        gas_expense: 10
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_liheap_household_size: 1
    ok_liheap_gross_income: 5544
    ok_liheap_net_income: 5544
    ok_liheap_eligible: true
    ok_liheap: 265

# C-7 p. 1: 12,000 - 2,880 = 9,120 (760/mo); C-7-A p. 1 delivered fuel, size 1-3, 701 or more -> 280.
# The 10 bill does not cap the award.
- name: Case 2, a delivered fuel household receives the published award after its earned allowance.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
    tax_units:
      tax_unit:
        members: [adult]
    spm_units:
      spm_unit:
        members: [adult]
        heating_type: PROPANE
        gas_expense: 0
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
        bottled_gas_expense: 10
    households:
      household:
        members: [adult]
        state_code: OK
  output:
    ok_liheap_gross_income: 12000
    ok_liheap_net_income: 9120
    ok_liheap_eligible: true
    ok_liheap: 280

# OAC 340:20-1-19(d) pays heat-in-rent renters and roomers only when they pay a surcharge (positive fuel bill).
# Size 1, net 0: C-7-A renter 150, roomer 70. Unsubsidized renter and roomer with no surcharge -> 0; subsidized renter
# with a 10 surcharge -> 150; subsidized renter with no surcharge -> 0.
- name: Case 3, heat in rent renters and roomers are paid only with a surcharge whether or not the rent is subsidized.
  period: 2027
  input:
    state_code: [OK, OK, OK, OK]
    age: [40, 40, 40, 40]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    ssi: [0, 0, 0, 0]
    ok_tanf: [0, 0, 0, 0]
    ok_child_care_subsidies: [0, 0, 0, 0]
    ok_ccs_copay: [0, 0, 0, 0]
    heat_expense_included_in_rent: [true, true, true, true]
    receives_housing_assistance: [false, false, true, true]
    ok_liheap_dwelling_type: [STANDARD, ROOMER, STANDARD, STANDARD]
    gas_expense: [0, 0, 10, 0]
    has_heating_expense: [false, false, false, false]
  output:
    ok_liheap_eligible: [false, false, true, false]
    ok_liheap: [0, 0, 150, 0]

# Current OAC 340:20-1-11(a)(4), (c), C-1 p. 4, C-7 p. 1: ineligible 12,000 - 2,880 - 600 medical - 1,200 support
# - 4,776 need = 2,544. Gross 2,544 + 6,000 eligible + 1,200 annual TANF = 9,744. Net 9,744 - 2,880 eligible allowance
# - 600 eligible support - 600 annual CCS copay = 5,664 = 472 monthly; C-7-A p. 1 ordinary, size 2 -> 265.
# No duplicate ineligible deductions or SPM transfers.
- name: Case 4, ineligible person deductions TANF and the household copay are each applied once.
  period: 2027
  input:
    people:
      ineligible:
        age: 60
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
        other_medical_expenses: 600
        child_support_expense: 1200
      eligible:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 6000
        child_support_expense: 600
      child:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
    tax_units:
      tax_unit:
        members: [ineligible, eligible, child]
    spm_units:
      spm_unit:
        members: [ineligible, eligible, child]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 1200
        ok_child_care_subsidies: 2400
        ok_ccs_copay: 600
    households:
      household:
        members: [ineligible, eligible, child]
        state_code: OK
  output:
    ok_liheap_deemed_income: 2544
    ok_liheap_household_size: 2
    ok_liheap_gross_income: 9744
    ok_liheap_net_income: 5664
    ok_liheap_eligible: true
    ok_liheap: 265

# Current OAC 340:20-1-11(a)(1), (4), (c): 18,000 + 4,344 deemed = 22,344 gross exceeds the 20,748 size 1 limit.
# Net 22,344 - 2,880 = 19,464 does not restore eligibility.
- name: Case 5, deemed income enters the gross gate before the eligible worker deduction.
  period: 2027
  input:
    people:
      eligible:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 18000
      ineligible:
        age: 35
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
    tax_units:
      tax_unit:
        members: [eligible, ineligible]
    spm_units:
      spm_unit:
        members: [eligible, ineligible]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [eligible, ineligible]
        state_code: OK
  output:
    ok_liheap_deemed_income: 4344
    ok_liheap_household_size: 1
    ok_liheap_gross_income: 22344
    ok_liheap_income_limit: 20748
    ok_liheap_net_income: 19464
    ok_liheap_eligible: false
    ok_liheap: 0

# Current OAC 340:20-1-10 and C-7-A p. 1 ordinary fuel, size 1, 0 net -> 365. Outside OK or explicit NONE gives 0;
# no cooling/crisis award substituted.
- name: Case 6, the final award applies state and no heating gates.
  period: 2027
  input:
    state_code: [OK, TX, OK]
    age: [40, 40, 40]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NONE]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    has_heating_expense: [true, true, true]
    gas_expense: [1, 1, 1]
    ssi: [0, 0, 0]
    ok_tanf: [0, 0, 0]
    ok_child_care_subsidies: [0, 0, 0]
    ok_ccs_copay: [0, 0, 0]
  output:
    ok_liheap: [365, 0, 0]

# OAC 340:20-1-11(a), (c): Social Security counts gross in the income test; the Part B premium is a medical deduction
# (340:50-7-31(a)(3)(A)(vi)) taken only after it. Both retirees: 21,360/12 = 1,780 > 1,696 (2026 size 1 limit 20,352) -> 0.
# Net income: person 1 deducts 202.90 x 12 = 2,434.80 -> 18,925.20; person 2 pays no premium -> 21,360.
- name: Case 7, Social Security counts gross in the income test and the Part B premium does not restore eligibility.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK]
    age: [70, 70]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    social_security: [21_360, 21_360]
    medicare_part_b_premium: [2_434.80, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
    ok_tanf: [0, 0]
    ok_child_care_subsidies: [0, 0]
    ok_ccs_copay: [0, 0]
  output:
    ok_liheap_countable_income: [21_360, 21_360]
    ok_liheap_gross_income: [21_360, 21_360]
    ok_liheap_income_limit: [20_352, 20_352]
    ok_liheap_eligible: [false, false]
    ok_liheap_net_income: [18_925.20, 21_360]
    ok_liheap: [0, 0]

# Military retirement pay is a separate input from pension_income and counts as unearned income.
# 24,000/12 = 2,000 > 1,696 (2026 size 1 limit) -> ineligible, 0.
# 12,000/12 = 1,000 <= 1,696 -> eligible; no deductions, net 1,000/mo is band 3 -> natural gas 235.
- name: Case 8, military retirement pay counts toward the gross limit and the payment band.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK]
    age: [62, 62]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    military_retirement_pay: [24_000, 12_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
    ok_tanf: [0, 0]
    ok_child_care_subsidies: [0, 0]
    ok_ccs_copay: [0, 0]
  output:
    ok_liheap_countable_income: [24_000, 12_000]
    ok_liheap_gross_income: [24_000, 12_000]
    ok_liheap_eligible: [false, true]
    ok_liheap_net_income: [24_000, 12_000]
    ok_liheap: [0, 235]

# OAC 340:20-1-11(a) rounds monthly income to the nearest dollar; 2026 size 1 limit is 1,696/mo (20,352/yr).
# Wages 20,355/12 = 1,696.25 -> 1,696 <= 1,696, eligible; net 20,355 - 2,880 = 17,475 -> 1,456.25 -> 1,456, band 3 -> 235.
# Wages 20,358/12 = 1,696.50 -> rounds half up to 1,697 > 1,696 -> ineligible, 0 (net 20,358 - 2,880 = 17,478).
- name: Case 9, monthly gross income within fifty cents of the limit rounds to the nearest dollar before the test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    employment_income: [20_355, 20_358]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
    ok_tanf: [0, 0]
    ok_child_care_subsidies: [0, 0]
    ok_ccs_copay: [0, 0]
  output:
    ok_liheap_gross_income: [20_355, 20_358]
    ok_liheap_income_limit: [20_352, 20_352]
    ok_liheap_eligible: [true, false]
    ok_liheap_net_income: [17_475, 17_478]
    ok_liheap: [235, 0]

# OAC 340:20-1-19(d)(1)-(2): heat-in-rent renters and roomers who pay a verified surcharge are paid. A 300 surcharge
# ($50 a month in six high-usage months) is the positive primary fuel bill. Size 1, net 0 -> C-7-A renter 150,
# roomer 70. The responsibility flag with no surcharge bill does not qualify -> ineligible, 0 (matrix still 150).
- name: Case 10, a surcharge bill pays unsubsidized heat in rent renters and roomers but the responsibility flag alone
    does not.
  period: 2027
  input:
    state_code: [OK, OK, OK]
    age: [40, 40, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    ssi: [0, 0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heat_expense_included_in_rent: [true, true, true]
    ok_liheap_dwelling_type: [STANDARD, ROOMER, STANDARD]
    gas_expense: [300, 300, 0]
    has_heating_expense: [false, false, true]
    ok_tanf: [0, 0, 0]
    ok_child_care_subsidies: [0, 0, 0]
    ok_ccs_copay: [0, 0, 0]
  output:
    ok_liheap_eligible: [true, true, false]
    ok_liheap_matrix_amount: [150, 70, 150]
    ok_liheap: [150, 70, 0]

# OAC 340:20-1-11(c)(1) with OAC 340:50-7-31(a)(3)(A)(v)-(vi): a member 60+ deducts Medicare and health premiums.
# A member 60+ deducts the whole 2026 Part B premium after the gross test: 202.90 x 12 = 2,434.80.
# Pension 750/mo (9,000) -> gross 750/mo <= 1,696 (2026 size 1 limit), eligible.
# Net 9,000 - 2,434.80 = 6,565.20 -> 547.10/mo rounds to 547, band 2 (401-700) -> natural gas 265.
- name: Case 11, a retiree deducts the full Medicare Part B premium after the gross income test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        social_security: 0
        medicare_part_b_premium: 2_434.80
        pension_income: 9_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_income: 9_000
    ok_liheap_gross_income: 9_000
    ok_liheap_income_deductions: 2_434.80
    ok_liheap_eligible: true
    ok_liheap_net_income: 6_565.20
    ok_liheap: 265

# OAC 340:20-1-11(a), (c): Social Security 1,000/mo counts gross, so countable income = 12,000 (1,000/mo <= 1,696),
# eligible. Deductions after the gross test = 1,800 Medigap (150/mo) + 2,434.80 Part B (202.90 x 12) = 4,234.80.
# Net 12,000 - 4,234.80 = 7,765.20 -> 647.10/mo rounds to 647, band 2 (401-700) -> natural gas 265.
- name: Case 12, a retiree with Social Security deducts the Part B premium and another health premium after the gross
    test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: CITIZEN
        is_disabled: false
        ssi: 0
        social_security: 12_000
        medicare_part_b_premium: 2_434.80
        health_insurance_premiums_without_medicare_part_b: 1_800
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_countable_income: 12_000
    ok_liheap_gross_income: 12_000
    ok_liheap_income_deductions: 4_234.80
    ok_liheap_eligible: true
    ok_liheap_net_income: 7_765.20
    ok_liheap: 265

# OAC 340:20-1-11(c)(1) and 340:50-5-4 (7 CFR 271.2): a member under 60 is "considered disabled" only with a qualifying
# disability benefit. SSA's 2026 average disabled-worker benefit is 1,630/mo (19,560/yr).
# Person 1 receives SSDI, so is_usda_disabled: gross 19,560 (1,630/mo <= 1,696), deducts 1,200 medical -> net 18,360
# (1,530/mo), band 3 -> 235. Person 2 reports a disability but receives no qualifying benefit: gross 19,560 wages, eligible;
# only the 2,880 earned allowance -> net 16,680 (1,390/mo), band 3 -> 235.
- name: Case 13, Social Security disability receipt qualifies a member under 60 for the medical deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK]
    age: [50, 50]
    immigration_status: [CITIZEN, CITIZEN]
    ssi: [0, 0]
    is_disabled: [false, true]
    social_security_disability: [19_560, 0]
    employment_income: [0, 19_560]
    other_medical_expenses: [1_200, 1_200]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
    ok_tanf: [0, 0]
    ok_child_care_subsidies: [0, 0]
    ok_ccs_copay: [0, 0]
  output:
    is_usda_disabled: [true, false]
    ok_liheap_income_deductions: [1_200, 2_880]
    ok_liheap_gross_income: [19_560, 19_560]
    ok_liheap_eligible: [true, true]
    ok_liheap_net_income: [18_360, 16_680]
    ok_liheap: [235, 235]
