# Oklahoma independent fully qualified household components; no final eligibility or award is asserted.

# Register income rule and FY2026 plan source categories:12000+1200+2400+1200+2400=19200 before ordinary benefit deductions.
- name: Case 1, rental and survivor receipts remain separate from wages and pensions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
        rental_income: 1_200
        farm_rent_income: 2_400
        survivor_benefits: 1_200
        pension_income: 2_400
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_gross_income: 19_200

# Register340:20-1-11(a)-(b) ordinary regular receipts:12000+2400+1200+600+1200+600+1200+600+120+240+1200+600+600+600=23160. Estate/help inputs here are regular unrestricted receipts, not excluded nonrecurring principal.
- name: Case 2, ordinary disjoint unearned income is counted before net deductions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 1_200
        social_security: 12_000
        unemployment_compensation: 2_400
        workers_compensation: 1_200
        disability_benefits: 600
        veterans_benefits: 600
        child_support_received: 1_200
        alimony_income: 600
        interest_income: 120
        ordinary_dividend_income: 240
        railroad_benefits: 1_200
        estate_income: 600
        financial_assistance: 600
        strike_benefits: 600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_gross_income: 23_160

# 6000 adult wages+1200 adult federalSSI+1200 childSSA+3600 annual familyOKTANF=12000. The school exception covers earnings, not childSSA; monthlyprogram receipts aggregate once.
- name: Case 3, monthly SSI and state TANF are annualized once and child unearned income remains included.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 1_200
        employment_income: 6_000
      person2:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        social_security: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 3_600
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    ok_liheap_gross_income: 12_000

# Registerp578 incorporates program exclusions; SNAP and housing subsidy are not added to ordinary grossincome. This does not assert categorical eligibility.
- name: Case 4, SNAP and housing assistance do not enter the gross income base.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
        snap: 6_000
        housing_assistance: 6_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    ok_liheap_gross_income: 12_000
