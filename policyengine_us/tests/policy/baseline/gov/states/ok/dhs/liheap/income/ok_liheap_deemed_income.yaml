        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        pension_income: 1000
    tax_units:
      unit1:
        members: [ineligible]
      unit2:
        members: [eligible]
    spm_units:
      spm_unit:
        members: [ineligible, eligible]
