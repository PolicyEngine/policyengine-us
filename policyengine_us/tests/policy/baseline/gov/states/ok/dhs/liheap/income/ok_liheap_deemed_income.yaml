        is_snap_alien_military_connected: false
        employment_income: 12000
      adult2:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 6000
      ineligible_child:
        age: 12
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        survivor_benefits: 1200
      eligible_child:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        survivor_benefits: 600
    tax_units:
      tax_unit:
        members: [adult1, adult2, ineligible_child, eligible_child]
    spm_units:
      spm_unit:
        members: [adult1, adult2, ineligible_child, eligible_child]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [adult1, adult2, ineligible_child, eligible_child]
        state_code: OK
  output:
    ok_liheap_deemed_income: 5700
    ok_liheap_gross_income: 6300
    ok_liheap_net_income: 6300
    ok_liheap_household_size: 1

