# Oklahoma LIHEAP regular heating cases.
# Cases dated 2027 use the current Appendix C-1 need standards and Appendix C-7 earned income deduction.

# Current OAC 340:20-1-11(a)(4); C-7 p. 1 and C-1 p. 4 IX-A. Annual 12,000 - 2,880 - 398 x 12 = 4,344 (monthly 362).
# The eligible child receives no ineligible need allowance. No second deduction in net.
- name: Case 1, one ineligible employed adult contributes after the earned and single adult need allowances.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
      child:
        age: 10
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
    tax_units:
      family:
        members: [adult, child]
    spm_units:
      spm_unit:
        members: [adult, child]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_liheap_deemed_income: 4344
    ok_liheap_household_size: 1
    ok_liheap_gross_income: 4344
    ok_liheap_net_income: 4344

# Current OAC 340:20-1-11(a)(4), C-1 p. 4 IX-A size 3 need 645. Ineligible 19,200 - 2 x 2,880 - 645 x 12 = 5,700;
# eligible 600 gives 6,300. An equal-age representative tie must not count 5,700 twice. Tax units approximate the
# claimable-dependent group.
