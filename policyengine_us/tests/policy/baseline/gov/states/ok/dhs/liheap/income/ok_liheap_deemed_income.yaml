# Source-derived Oklahoma ordinary heating cases under contract v1.3.
# Current C1 need and C7 earned amounts are tested in2027.

# Current340:20-1-11(a)(4); C7p1 and C1p4 IX-A. Annual12000-2880-398*12=4344 (monthly362). The eligible child receives no ineligible need allowance. No second deduction in net.
- name: Case 1, one ineligible employed adult contributes after the earned and single adult need allowances.
  period: 2027
  input:
    people:
      adult:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        is_in_k12_school: false
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
        employment_income: 12000
      child:
        age: 10
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        is_in_k12_school: true
        is_disabled: false
        ssi: 0
        years_since_us_entry: 5
        snap_alien_qualifying_quarters: 0
        is_snap_lpr_in_waiting_period_exempt_category: false
        is_snap_alien_military_connected: false
    tax_units:
      family:
        members: [adult, child]
    spm_units:
      spm_unit:
        members: [adult, child]
        heating_type: NATURAL_GAS
        gas_expense: 1200
        ok_tanf: 0
        ok_child_care_subsidies: 0
        ok_ccs_copay: 0
    households:
      household:
        members: [adult, child]
        state_code: OK
  output:
    ok_liheap_deemed_income: 4344
    ok_liheap_household_size: 1
    ok_liheap_gross_income: 4344
    ok_liheap_net_income: 4344

