# Oklahoma LIHEAP regular heating cases.
# Cases dated 2027 use the current Appendix C-1 need standards and Appendix C-7 earned income deduction.

# OAC 340:20-1-11(c), C-7 p. 1: earned allowance = min(earnings, 2,880). Age 40, not disabled: 1,200 + 300 = 1,500
# (no medical); age 60: 2,880 + 600 + 400 = 3,880; is_usda_disabled: 2,880 + 700 + 500 = 4,080. The household floor
# applies later, so person deductions may exceed income.
- name: Case 1, person deductions retain the earned cap and medical attribution before grouping.
  period: 2027
  input:
    state_code: [OK, OK, OK]
    age: [40, 60, 40]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    ok_liheap_countable_earned_income: [1200, 12000, 12000]
    is_usda_disabled: [false, false, true]
    other_medical_expenses: [500, 600, 700]
    child_support_expense: [300, 400, 500]
  output:
    ok_liheap_income_deductions: [1500, 3880, 4080]

# C-7 10/1/2024 edition: $240/mo per employed member -> 240 x 12 = 2,880/yr in 2025.
# min(12,000, 2,880) = 2,880; min(1,200, 2,880) = 1,200. Age 40 and not disabled, so no medical deduction.
- name: Case 2, the 2025 earned income deduction is two hundred forty dollars a month capped at earnings.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    is_disabled: [false, false]
    ssi: [0, 0]
    employment_income: [12_000, 1_200]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
  output:
    ok_liheap_countable_earned_income: [12_000, 1_200]
    ok_liheap_income_deductions: [2_880, 1_200]

# OAC 340:20-1-11(c)(1) with SNAP's list in 340:50-7-31(a)(3)(A)(v): health premiums count whether withheld through
# payroll or paid after tax. 1,440 is KFF's 2025 average worker contribution for single coverage.
# Earned allowance min(12,000, 2,880) = 2,880. Age 62 with a payroll premium: 2,880 + 1,440 = 4,320; age 62 with an
# after-tax premium: 4,320; age 40, not disabled: 2,880 only. Gross 12,000 (1,000/mo <= 1,696), all eligible.
# Net 7,680 (640/mo, band 2) -> 265; 7,680 -> 265; 9,120 (760/mo, band 3) -> 235.
- name: Case 3, payroll and after-tax health premiums of an older worker are both deductible medical expenses.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [OK, OK, OK]
    age: [62, 62, 40]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    ssi: [0, 0, 0]
    employment_income: [12_000, 12_000, 12_000]
    pre_tax_health_insurance_premiums: [1_440, 0, 1_440]
    health_insurance_premiums_without_medicare_part_b: [0, 1_440, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200, 1_200]
    ok_tanf: [0, 0, 0]
    ok_child_care_subsidies: [0, 0, 0]
    ok_ccs_copay: [0, 0, 0]
  output:
    ok_liheap_income_deductions: [4_320, 4_320, 2_880]
    ok_liheap_net_income: [7_680, 7_680, 9_120]
    ok_liheap: [265, 265, 235]
