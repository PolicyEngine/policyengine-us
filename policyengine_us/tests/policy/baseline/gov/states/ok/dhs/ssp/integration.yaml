        members: [person1, person2]
      child:
        members: [person3]
    families:
      family:
        members: [person1, person2, person3]
    households:
      hh:
        members: [person1, person2, person3]
        state_code: OK
  output:
    # Federal: 41_600 - (5_964 - 4_800) = 40_436 deemed earnings;
    # (3_369.67 - 85) / 2 = 1_642.33 > 1_491, so SSI is 0.
    # Allocation 498 - 400 = 98; (3_467 - 98 - 85) / 2 = 1_642 >= 1_532.
    ok_ssp: [0, 0, 0]

