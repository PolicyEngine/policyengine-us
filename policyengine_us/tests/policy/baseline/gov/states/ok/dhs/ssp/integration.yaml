- name: Case 5, aged spouse who declines SSI is an ineligible spouse whose income counts.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        social_security_retirement: 6_000
      person2:
        age: 66
        social_security_retirement: 18_000
        takes_up_ssi_if_eligible: false
    marital_units:
      couple:
        members: [person1, person2]
    families:
      family:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OK
  output:
    # person2 does not take up, so only person1 is SSP-eligible.
    ok_ssp_eligible: [true, false]
    # 317:35-5-42(k)(1): a spouse who is not eligible is an ineligible spouse.
    # Federal couple SSI: (500 + 1_500 - 20) / 2 = 990 > 745.5, so 0.
    # Own income 500 - 20 = 480 < 1_034, but combined income
    # 500 + 1_500 - 20 = 1_980 >= 1_532, so 0.
    ok_ssp: [0, 0]

