- name: Case 5, aged spouse who declines SSI leaves the claimant on the individual test.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        social_security_retirement: 6_000
      person2:
        age: 66
        social_security_retirement: 18_000
        takes_up_ssi_if_eligible: false
    marital_units:
      couple:
        members: [person1, person2]
    families:
      family:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OK
  output:
    # person2 does not take up, so only person1 is SSP-eligible.
    ok_ssp_eligible: [true, false]
    # An aged spouse is not an ineligible spouse, so person1 is tested alone.
    # Federal couple SSI: (500 + 1_500 - 20) / 2 = 990 > 745.5, so 0.
    # Own income 500 - 20 = 480 + 0 SSI; min(1_034 - 480, 40) = 40.
    ok_ssp: [40, 0]

- name: Case 6, disabled spouse barred from SSP leaves the claimant on the individual test.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        social_security_retirement: 6_000
      person2:
        age: 55
        meets_ssi_disability_criteria: true
        social_security_disability: 18_000
        ok_ssp_is_excluded: true
    marital_units:
      couple:
        members: [person1, person2]
    families:
      family:
        members: [person1, person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OK
  output:
    # person2 is disabled but excluded, so only person1 is SSP-eligible.
    ok_ssp_eligible: [true, false]
    # A disabled spouse is not an ineligible spouse; the 1_500 SSDI is not
    # combined. Federal couple SSI: (500 + 1_500 - 20) / 2 = 990 > 745.5, so 0.
    # Own income 480 + 0 SSI; min(1_034 - 480, 40) = 40.
    ok_ssp: [40, 0]

- name: Case 7, spouse child allocation supports recipient.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 40
        employment_income: 41_600
      person3:
        age: 10
    marital_units:
      couple:
        members: [person1, person2]
      child:
        members: [person3]
    families:
      family:
        members: [person1, person2, person3]
    households:
      hh:
        members: [person1, person2, person3]
        state_code: OK
  output:
    # Federal: 41_600 - 5_964 child allocation = 35_636 deemed earnings;
    # 1_491 - (2_969.67 - 85) / 2 = 48.67 SSI.
    # Combined: 3_466.67 rounds to 3_467; (3_467 - 498 - 85) / 2 = 1_442
    # + 48.67 = 1_490.67 < 1_532; min(41.33, 40) = 40.
    ok_ssp: [40, 0, 0]

- name: Case 8, child income reduces spouse allocation.
