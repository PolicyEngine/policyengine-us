- name: Case 12, blind child is eligible.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 34
        person_id: 1
        employment_income: 15_080
      person2:
        age: 10
        person_id: 2
        parent_1_id: 1
        is_blind: true
    marital_units:
      parent:
        members: [person1]
      child:
        members: [person2]
    households:
      hh:
        members: [person1, person2]
        state_code: OK
  output:
    # Parent works full time at 7.25 an hour: (1_256.67 - 85) / 2 = 585.83
    # is below the 994 parent allocation, so nothing is deemed.
    # Child SSI 994; min(1_034 - 994, 40) = 40.
    ok_ssp: [0, 40]

