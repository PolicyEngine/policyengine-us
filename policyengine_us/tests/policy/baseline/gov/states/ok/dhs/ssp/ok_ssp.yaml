    ok_ssp: 0

- name: Case 18, institutional SSI is outside optional community program.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OK
    age: 65
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    # Living in a medical treatment facility fails ok_ssp_eligible.
    ok_ssp: 0

- name: Case 19, VTR does not increase the forty dollar maximum.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OK
    age: 65
    ssi_federal_living_arrangement: ANOTHER_PERSONS_HOUSEHOLD
  output:
    ok_ssp: 40

- name: Case 20, facility living arrangement alone bars SSP.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OK
    age: 65
    ssi_federal_living_arrangement: MEDICAL_TREATMENT_FACILITY
  output:
    # Aged, 0 resources <= 2_000, citizen: otherwise SSI-eligible.
    is_ssi_eligible: true
    # The facility booleans stay false, but the arrangement is
    # MEDICAL_TREATMENT_FACILITY, so in_facility is true.
    ok_ssp_eligible: false
    # defined_for ok_ssp_eligible, so 0.
    ok_ssp: 0
