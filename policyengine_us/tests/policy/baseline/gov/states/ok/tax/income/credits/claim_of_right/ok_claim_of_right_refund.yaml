# OAC 710:50-3-9: Oklahoma has no claim of right credit or deduction of its
# own for the year of repayment. When the federal return takes the credit
# under 26 U.S.C. 1341(a)(5), the filer amends the Oklahoma return for the
# year the income was received to exclude the repaid income.
- name: Case 1, the refund is the prior-year Oklahoma tax decrease under the federal credit.
  # A $10,000 repayment of income taxed at Oklahoma's top rate of 4.75%.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ok_claim_of_right_prior_year_tax_decrease: 475
    state_code: OK
  output:
    ok_claim_of_right_refund: 475

- name: Case 2, no refund when the federal return deducts the repayment.
  period: 2025
  input:
    claim_of_right_credit_applies: false
    ok_claim_of_right_prior_year_tax_decrease: 475
    state_code: OK
  output:
    ok_claim_of_right_refund: 0

- name: Case 3, the refund is not limited by the repayment year's tax.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ok_claim_of_right_prior_year_tax_decrease: 475
    ok_income_tax_before_refundable_credits: 300
    ok_ptc: 0
    ok_stc: 0
    ok_eitc: 0
    state_code: OK
  output:
    ok_refundable_credits: 475
    ok_income_tax: -175

- name: Case 4, a joint return enters the decrease for the return.
  period: 2025
  input:
    people:
      person1:
        age: 45
      person2:
        age: 44
      person3:
        age: 20
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        ok_claim_of_right_prior_year_tax_decrease: 475
        claim_of_right_credit_applies: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: OK
  output:
    ok_claim_of_right_refund: 475

- name: Case 5, no refund outside Oklahoma.
  period: 2025
  input:
    claim_of_right_credit_applies: true
    ok_claim_of_right_prior_year_tax_decrease: 475
    state_code: TX
  output:
    ok_claim_of_right_refund: 0

- name: Case 6, end to end, the federal credit brings the Oklahoma refund.
  # A prior-year federal decrease of $2,200 beats the deduction, which would
  # lose to the standard deduction, so federal tax uses section 1341(a)(5).
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        claim_of_right_prior_year_tax_decrease: 2_200
        ok_claim_of_right_prior_year_tax_decrease: 475
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    claim_of_right_credit_applies: true
    ok_claim_of_right_refund: 475

- name: Case 7, end to end, a filer who deducts the repayment federally gets no refund.
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        claim_of_right_repayment: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        ok_claim_of_right_prior_year_tax_decrease: 475
        interest_deduction: 20_000
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 10_000
    ok_claim_of_right_refund: 0
