- name: No children and under 25, not eligible.
  period: 2022
  input:
    age: 24
    state_code: OK
  output:
    ok_federal_eitc_demographic_eligible: false

- name: No children and over 25, ineligible.
  period: 2022
  input:
    age: 25
  output:
    ok_federal_eitc_demographic_eligible: false

- name: Children and under 25, eligible.
  period: 2022
  input:
    people:
      parent:
        age: 24
      child:
        age: 7
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household: 
        members: [child, parent]
        state_code: OK
  output:
    ok_federal_eitc_demographic_eligible: true

- name: Non-student in 2021 ineligible at age 19.
  period: 2021
  input:
    age: 19
    state_code: OK
  output:
    ok_federal_eitc_demographic_eligible: false

- name: Student in 2021 not eligible at age 19.
  period: 2021
  input:
    age: 19
    is_full_time_student: true
    state_code: OK
  output:
    ok_federal_eitc_demographic_eligible: false


- name: 2025 the 2020 age test applies to the filer, not to a dependent
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
      relative:
        age: 40
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, relative]
    households:
      household:
        members: [person_a, relative]
        state_code: OK
  output:
    # A 20-year-old filer misses the 2020 age-25 minimum even with an older
    # dependent who is not a qualifying child.
    ok_federal_eitc_demographic_eligible: false
