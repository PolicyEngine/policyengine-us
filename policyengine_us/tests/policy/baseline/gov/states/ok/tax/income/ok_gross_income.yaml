# 68 O.S. 5012 and 2904(3): "gross household income" means the gross amount of
# income of every type, regardless of the source, received by all persons
# occupying the same household, whether such income was taxable or nontaxable
# for federal or state income tax purposes, including pensions, annuities,
# federal social security, unemployment payments, veterans' disability
# compensation, public assistance payments, alimony, support money, workers'
# compensation, loss-of-time insurance payments, capital gains and any other
# type of income received; and excluding gifts.
# Form 538-S line 9 counts the federal earned income credit and, from 2022,
# when it became refundable, the Oklahoma credit. Cases that isolate another
# source set both credits (eitc and ok_eitc) to 0.

- name: OK gross income unit test 1
  period: 2021
  absolute_error_margin: 0.01
  input:
    employment_income: 12_000
    social_security: 2_000
    eitc: 800
    state_code: OK
  output:
    # The Oklahoma earned income credit was nonrefundable in 2021 (it became
    # refundable in 2022), so it lowers tax rather than counting as income;
    # only the federal credit counts.
    # 12,000 + 2,000 + 800 = 14,800.
    ok_gross_income: 14_800

- name: OK gross income includes SSTB self-employment income
  period: 2024
  input:
    sstb_self_employment_income: 100_000
    state_code: OK
  output:
    ok_gross_income: 100_000

- name: OK gross income nets capital gains before applying positive-only rule
  period: 2024
  input:
    short_term_capital_gains: -12_311
    long_term_capital_gains: 18_713
    dividend_income: 6_096
    interest_income: 1_551
    social_security: 24_517
    state_code: OK
  output:
    ok_gross_income: 38_566

- name: OK gross income includes estate and trust income, which can end the sales tax credit
  period: 2025
  input:
    age: 40
    irs_employment_income: 18_000
    estate_income: 3_000
    eitc: 0
    state_code: OK
  output:
    # Form 538-S line 11: 18,000 + 3,000 = 21,000, over the 20,000 limit
    # for a filer with no dependents who is under 65 and not disabled.
    ok_gross_income: 21_000
    ok_stc: 0

- name: OK gross income leaves out an estate or trust loss
  period: 2025
  input:
    age: 40
    irs_employment_income: 18_000
    estate_income: -3_000
    # The loss lowers federal AGI into the childless EITC range, and line 9
    # counts the EITC; set it to zero to isolate line 11.
    eitc: 0
    state_code: OK
  output:
    # Line 11 takes gross (positive) income only: 18,000 + max(-3,000, 0).
    # 18,000 is within the 20,000 limit, so the credit is 40 for one person.
    ok_gross_income: 18_000
    ok_stc: 40

- name: OK gross income counts the state supplement, which can end the property tax credit
  period: 2026
  input:
    age: 70
    real_estate_taxes: 500
    state_code: OK
  output:
    # Form 538-H line 10 counts public assistance: SSI 994 x 12 = 11,928 plus
    # the 40 x 12 = 480 state supplement is 12,408, over the 12,000 limit.
    ok_ssp: 480
    ok_gross_income: 12_408
    ok_ptc: 0

- name: OK gross income counts military retired pay and survivor annuities
  period: 2025
  input:
    irs_employment_income: 10_000
    military_retirement_pay: 15_000
    military_retirement_pay_survivors: 2_000
    state_code: OK
  output:
    # Form 538-S Part 3 counts taxable and nontaxable income, line 6 other
    # pensions and annuities: 10,000 + 15,000 + 2,000.
    ok_gross_income: 27_000

- name: OK gross household income counts everyone living in the household
  period: 2025
  input:
    people:
      parent:
        age: 70
        # 1,500 a month, above the SSI income limit, so no SSI is computed.
        social_security_retirement: 18_000
      adult_child:
        age: 40
        irs_employment_income: 30_000
    tax_units:
      parent_unit:
        members: [parent]
        eitc: 0
        ok_eitc: 0
      child_unit:
        members: [adult_child]
        eitc: 0
        ok_eitc: 0
    households:
      household:
        members: [parent, adult_child]
        state_code: OK
  output:
    # Income "received by all persons occupying the same household"; Form
    # 538-S line 13, "income of others living in your household".
    # 18,000 + 30,000 = 48,000 on either claim (one tax unit alone would
    # give [18,000, 30,000]).
    ok_gross_income: [48_000, 48_000]

- name: OK gross household income takes each return's gross positive income, so one member's loss doesn't offset another's income
  period: 2025
  input:
    people:
      parent:
        age: 70
        social_security_retirement: 18_000
        rental_income: -5_000
      adult_child:
        age: 40
        irs_employment_income: 30_000
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
        state_code: OK
  output:
    # Forms 538-S and 538-H line 11: gross (positive) income from rentals;
    # "YOU MAY NOT ENTER NEGATIVE AMOUNTS". The parent's rental loss counts
    # as 0 and doesn't reduce the child's wages. Neither return has an
    # earned income credit (the parent is over 64; the child's 30,000 is past
    # the childless phase-out).
    # 18,000 + max(-5,000, 0) + 30,000 = 48,000.
    ok_gross_income: [48_000, 48_000]

- name: OK sales tax credit at exactly the 50,000 limit once a household member's income counts
  period: 2025
  input:
    people:
      parent:
        age: 70
        social_security_retirement: 18_000
      adult_child:
        age: 40
        irs_employment_income: 32_000
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
        state_code: OK
  output:
    # 18,000 + 32,000 = 50,000 for both returns. The parent (70) has the
    # 50,000 limit and qualifies at exactly the limit: 1 x 40. The child (no
    # dependents, under 65) has the 20,000 limit.
    ok_gross_income: [50_000, 50_000]
    ok_stc: [40, 0]

- name: OK sales tax credit just above the 50,000 limit once a household member's income counts
  period: 2025
  input:
    people:
      parent:
        age: 70
        social_security_retirement: 18_000
      adult_child:
        age: 40
        irs_employment_income: 32_001
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
        state_code: OK
  output:
    # 18,000 + 32,001 = 50,001, over the parent's 50,000 limit. Counting the
    # parent's return alone (18,000) would allow 40.
    ok_gross_income: [50_001, 50_001]
    ok_stc: [0, 0]

- name: OK property tax credit ends when a household member's wages count
  period: 2025
  input:
    people:
      parent:
        age: 70
        social_security_retirement: 10_000
        # Savings above the 2,000 SSI resource limit, so no SSI or state
        # supplement is computed.
        bank_account_assets: 10_000
        real_estate_taxes: 500
      adult_child:
        age: 40
        irs_employment_income: 30_000
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [adult_child]
    households:
      household:
        members: [parent, adult_child]
        state_code: OK
  output:
    # 68 O.S. 2904(3) and Form 538-H Part 2: income of all members of the
    # household. 10,000 + 30,000 = 40,000, over the 12,000 limit. The
    # parent's 10,000 alone would allow min(200, 500 - 1% x 10,000) = 200.
    ok_gross_income: [40_000, 40_000]
    ok_ptc: [0, 0]

- name: OK gross income counts nontaxable W-2 income such as dependent care benefits
  period: 2025
  input:
    age: 40
    employment_income: 20_000
    # Excluded from federal wages (W-2 box 10), so irs_employment_income is
    # 17,000. With no qualifying person the 3,000 is taxable on Form 2441,
    # but box 1 plus box 10 is 20,000 either way.
    dependent_care_employer_benefits: 3_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # Form 538-S line 1: wages "(including nontaxable income from your
    # W-2s)"; its definitions name "a dependent care reimbursement account".
    # 17,000 + 3,000 = 20,000.
    ok_gross_income: 20_000

- name: OK gross income counts IRA distributions
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    taxable_ira_distributions: 15_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # Form 538-S line 6: "Other pensions, annuities, and Individual
    # Retirement Accounts (IRAs)". Deferred income is "included when
    # distributed and taxed on your federal return".
    # 10,000 + 15,000 = 25,000.
    ok_gross_income: 25_000

- name: OK gross income counts TANF as a public assistance payment
  period: 2025
  input:
    age: 40
    irs_employment_income: 5_000
    tanf: 2_400
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # "public assistance payments".
    # 5,000 + 2,400 = 7,400.
    ok_gross_income: 7_400

- name: OK property tax credit ends when TANF counts as public assistance
  period: 2025
  input:
    people:
      grandparent:
        age: 66
        social_security_retirement: 12_000
        # Savings above the 2,000 SSI resource limit, so no SSI or state
        # supplement is computed.
        bank_account_assets: 10_000
        real_estate_taxes: 300
      grandchild:
        age: 10
    tax_units:
      tax_unit:
        members: [grandparent, grandchild]
    spm_units:
      spm_unit:
        members: [grandparent, grandchild]
        tanf: 600
    households:
      household:
        members: [grandparent, grandchild]
        state_code: OK
  output:
    # Form 538-H line 10: public assistance. 12,000 + 600 = 12,600, over the
    # 12,000 limit. Without the TANF, income is exactly 12,000 and the
    # credit is min(200, 300 - 1% x 12,000) = 180.
    ok_gross_income: 12_600
    ok_ptc: 0

- name: OK gross income counts veterans' disability compensation
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    veterans_benefits: 12_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # "veterans' disability compensation".
    # 10,000 + 12,000 = 22,000.
    ok_gross_income: 22_000

- name: OK gross income counts loss-of-time insurance and disability benefits
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    disability_benefits: 6_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # "loss-of-time insurance payments".
    # 10,000 + 6,000 = 16,000.
    ok_gross_income: 16_000

- name: OK gross income counts school grants and scholarships
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    educational_assistance: 4_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # Forms 538-S and 538-H: gross household income "includes, but is not
    # limited to ... school grants or scholarships".
    # 10,000 + 4,000 = 14,000.
    ok_gross_income: 14_000

- name: OK gross income counts gambling winnings
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    gambling_winnings: 3_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # "income of every type, regardless of the source".
    # 10,000 + 3,000 = 13,000.
    ok_gross_income: 13_000

- name: OK gross income counts the earned income credit on the year's own return
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    # The credit on the 2025 return.
    eitc: 3_000
    # The Oklahoma credit is set to zero here; the next case covers it.
    ok_eitc: 0
    state_code: OK
  output:
    # Form 538-S line 9 asks for the "Earned Income Credit (EIC) received in
    # 2025", and the 2025 credit is paid in 2026. PolicyEngine follows the
    # current-year convention (as TAXSIM does): it counts the credit on the
    # year's own return, so the 2025 credit counts as 2025 income.
    # 10,000 + 3,000 = 13,000.
    ok_gross_income: 13_000

- name: OK gross income combines the federal and Oklahoma earned income credits
  period: 2025
  input:
    people:
      parent:
        age: 40
        # TANF reads wages before labor supply responses.
        employment_income_before_lsr: 10_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: OK
  output:
    # Form 538-S line 9: "if applicable, combine federal and Oklahoma
    # amounts". Federal 2025 credit with one child: 10,000 x 34% = 3,400
    # (below the 4,328 maximum; income is under the 23,350 phase-out start).
    # Oklahoma: 5% of the credit under 2020 rules, 10,000 x 34% = 3,400
    # (below the 3,584 maximum and the 19,330 phase-out start), so 170.
    # No TANF: 833.33 a month of wages, less the 120 or 240 work expense
    # and the 50% disregard, leaves at least 296.67 of countable income,
    # above the 225 payment standard for two.
    # 10,000 + 3,400 + 170 = 13,570.
    eitc: 3_400
    ok_eitc: 170
    ok_gross_income: 13_570

- name: OK gross income counts foreign earned income excluded from federal income
  period: 2025
  input:
    age: 40
    irs_employment_income: 10_000
    # Wage inputs are the amounts left after the IRC 911 exclusion.
    foreign_earned_income_exclusion: 10_000
    eitc: 0
    ok_eitc: 0
    state_code: OK
  output:
    # Income counts "whether such income was taxable or nontaxable for
    # federal or state income tax purposes".
    # 10,000 + 10,000 = 20,000.
    ok_gross_income: 20_000
