# Federal Child Tax Credit allowed for Oklahoma's Child Care/Child Tax Credit:
# the refundable CTC plus the non-refundable CTC actually applied against
# federal income tax. non_refundable_ctc is the CTC that is not refunded,
# before the tax limit; when the non-refundable credits exceed income tax, the
# credits that Schedule 8812 Credit Limit Worksheet A subtracts are applied
# before the CTC (line 2, and on line 4 the residential clean energy credit
# when Credit Limit Worksheet B applies). Otherwise the residential clean
# energy credit follows the CTC (26 U.S.C. 25D(c)):
# https://www.irs.gov/pub/irs-pdf/i1040s8.pdf#page=4

- name: The residential clean energy credit does not displace the CTC when credits exceed tax.
  period: 2025
  input:
    state_code: OK
    income_tax_before_credits: 1_000
    non_refundable_ctc: 500
    refundable_ctc: 0
    residential_clean_energy_credit: 1_000
  output:
    # Credits 500 + 1,000 = 1,500 exceed tax of 1,000, so 1,000 is applied.
    # No credit precedes the CTC, so all 500 of it is applied.
    income_tax_capped_non_refundable_credits: 1_000
    ok_federal_ctc: 500

- name: A credit on Credit Limit Worksheet A, line 2, is applied before the CTC when credits exceed tax.
  period: 2025
  input:
    state_code: OK
    income_tax_before_credits: 1_000
    elderly_disabled_credit: 800
    non_refundable_ctc: 500
    refundable_ctc: 0
  output:
    # Credits 800 + 500 = 1,300 exceed tax of 1,000; the elderly or disabled
    # credit takes 800 first, leaving 200 for the CTC.
    income_tax_capped_non_refundable_credits: 1_000
    ok_federal_ctc: 200

- name: With Credit Limit Worksheet B, the residential clean energy credit is applied before the CTC.
  period: 2025
  input:
    state_code: OK
    income_tax_before_credits: 1_000
    ctc_credit_limit_worksheet_b_applies: true
    non_refundable_ctc: 500
    refundable_ctc: 0
    residential_clean_energy_credit: 800
  output:
    # Worksheet A: line 3 = 1,000; line 4 = 800 (Worksheet B, line 15);
    # line 5 = 200.
    income_tax_capped_non_refundable_credits: 1_000
    ok_federal_ctc: 200

- name: Credit for other dependents larger than tax, computed in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 26_625
      child:
        age: 17
    tax_units:
      tax_unit:
        members: [parent, child]
        solar_electric_property_expenditures: 10_000
    households:
      household:
        members: [parent, child]
        state_code: OK
  output:
    # Head of household: taxable income 26,625 - 23,625 = 3,000; tax = 300.
    income_tax_before_credits: 300
    # The 500 credit for other dependents is limited to 300 (Worksheet A,
    # line 5), which leaves nothing for the residential clean energy credit.
    non_refundable_ctc: 500
    refundable_ctc: 0
    residential_clean_energy_credit: 0
    income_tax_capped_non_refundable_credits: 300
    ok_federal_ctc: 300

- name: Credit for other dependents and a residential clean energy credit, computed in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 33_625
      child:
        age: 17
    tax_units:
      tax_unit:
        members: [parent, child]
        solar_electric_property_expenditures: 10_000
    households:
      household:
        members: [parent, child]
        state_code: OK
  output:
    # Head of household: taxable income 33,625 - 23,625 = 10,000; tax 10% =
    # 1,000 (Form 1040, line 18).
    income_tax_before_credits: 1_000
    # A 17-year-old dependent gets the 500 credit for other dependents, none of
    # which is refundable; nothing on Worksheet A, line 2.
    non_refundable_ctc: 500
    refundable_ctc: 0
    # Form 5695, line 14 worksheet: 1,000 - 500 = 500; the credit before the
    # limit is 30% x 10,000 = 3,000.
    residential_clean_energy_credit: 500
    income_tax_capped_non_refundable_credits: 1_000
    ok_federal_ctc: 500
