- name: Dependent Roth conversion not subtracted from filer AGI for special exemption
  period: 2024
  input:
    people:
      parent:
        age: 66
        employment_income: 20_000
      child:
        age: 17
        taxable_roth_conversions: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [parent, child]
        state_code: OK
  output:
    ok_count_exemptions: 2

- name: Dependent Roth conversion not subtracted from filer AGI under repeal dependent exemptions reform
  period: 2024
  reforms: policyengine_us.reforms.state_dependent_exemptions.repeal_state_dependent_exemptions.repeal_state_dependent_exemptions
  input:
    gov.contrib.repeal_state_dependent_exemptions.in_effect: true
    people:
      parent:
        age: 66
        employment_income: 20_000
      child:
        age: 17
        taxable_roth_conversions: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [parent, child]
        state_code: OK
  output:
    ok_count_exemptions: 1



- name: 2025 single filer who can be claimed as a dependent: Oklahoma exemptions
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: OK
  output:
    # Form 511 item F: "If you can be claimed as a dependent on another
    # return, enter '0' for your exemption."
    ok_count_exemptions: 0
    ok_exemptions: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent: Oklahoma exemptions (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 2500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: OK
  output:
    # Only the spouse who cannot be claimed keeps a $1,000 exemption.
    ok_count_exemptions: 1
    ok_exemptions: 1000

