# Oklahoma EITC tests
# Refundability history:
#   2002-2015: refundable (Laws 2001, c. 383)
#   2016-2021: non-refundable (Laws 2016, c. 341 sec. 1)
#   2022-present: refundable (HB 2962, Laws 2021, c. 493 sec. 2)

- name: OK EITC - unit test - part-year resident ratio
  period: 2021
  input:
    adjusted_gross_income: 40_000
    ok_agi: 30_000
    ok_federal_eitc: 2_000
    state_code: OK
  output:
    # Tentative: $2,000 * 5% * (30,000 / 40,000) = $75. Tax on $30k OK AGI
    # is well above $75, so the non-refundable cap does not bind.
    ok_eitc: 2_000 * 0.05 * (30_000 / 40_000)

- name: OK EITC - 2021 non-refundable cap binds when tax is zero
  period: 2021
  input:
    ok_income_tax_before_credits: 0
    ok_child_care_child_tax_credit: 0
    adjusted_gross_income: 10_000
    ok_agi: 10_000
    ok_federal_eitc: 500
    state_code: OK
  output:
    # Tentative: $500 * 5% * 1.0 = $25.
    # 2021 is non-refundable, and OK tax before credits is $0,
    # so the credit is capped at $0.
    ok_eitc: 0

- name: OK EITC - 2021 non-refundable cap binds partially
  period: 2021
  input:
    ok_income_tax_before_credits: 10
    ok_child_care_child_tax_credit: 0
    adjusted_gross_income: 25_000
    ok_agi: 25_000
    ok_federal_eitc: 3_000
    state_code: OK
  output:
    # Tentative: $3,000 * 5% * 1.0 = $150. Remaining tax: $10.
    # Non-refundable cap binds at $10.
    ok_eitc: 10

- name: OK EITC - 2022 refundable, no cap applies
  period: 2022
  input:
    ok_income_tax_before_credits: 10
    ok_child_care_child_tax_credit: 0
    adjusted_gross_income: 25_000
    ok_agi: 25_000
    ok_federal_eitc: 3_000
    state_code: OK
  output:
    # Tentative: $3,000 * 5% * 1.0 = $150. Refundable from 2022 onward,
    # so the full tentative amount is returned.
    ok_eitc: 150

- name: OK EITC - 2022 refundable with zero tax still pays full credit
  period: 2022
  input:
    ok_income_tax_before_credits: 0
    ok_child_care_child_tax_credit: 0
    adjusted_gross_income: 10_000
    ok_agi: 10_000
    ok_federal_eitc: 500
    state_code: OK
  output:
    # Refundable: full credit regardless of tax.
    ok_eitc: 25

- name: OK EITC - 2024 - HOH with one child
  absolute_error_margin: 2
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
        ssi: 0
        wic: 0
        deductible_mortgage_interest: 0
      person2:
        age: 10
        employment_income: 1
        ssi: 0
        wic: 0
        deductible_mortgage_interest: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_childcare_expenses: 0
        premium_tax_credit: 0
        local_income_tax: 0
        state_sales_tax: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap: 0
        ok_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_fips: 40
  output:
    # Federal EITC for 1 child at $20k income ~ $3,480
    # OK EITC = $3,480 * 5% = $174
    # OK CTC = 5% of $1,700 refundable federal CTC.
    ok_child_care_child_tax_credit: 85
    ok_eitc: 174
    ok_income_tax: -235.97171

- name: OK EITC - 2025 - full year resident
  period: 2025
  input:
    adjusted_gross_income: 25_000
    ok_agi: 25_000
    ok_federal_eitc: 3_000
    state_code: OK
  output:
    # Full resident: OK EITC = $3,000 * 5% * 1.0 = $150
    ok_eitc: 150

- name: OK EITC - 2025 - zero income
  period: 2025
  input:
    adjusted_gross_income: 0
    ok_agi: 0
    ok_federal_eitc: 0
    state_code: OK
  output:
    ok_eitc: 0

- name: OK EITC - 2025 - high earner no EITC
  period: 2025
  input:
    adjusted_gross_income: 80_000
    ok_agi: 80_000
    ok_federal_eitc: 0
    state_code: OK
  output:
    # No federal EITC = no OK EITC
    ok_eitc: 0

- name: OK EITC - 2025 - a spouse's self-employment loss reduces the phase-in base
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
      spouse:
        age: 40
        self_employment_income: -4_000
      child1:
        age: 7
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: OK
  output:
    # Form 511-EIC: line 1 wages 10,000; line 12 Schedule C loss -4,000;
    # line 15 total earned income 6,000 (lines 13 and 15 combine them). AGI is
    # also 6,000. Under the 2020 rules the two-child phase-in rate is 40%:
    # 0.40 x 6,000 = 2,400 (the 2020 EIC table row 6,000-6,050 gives 2,410 at
    # the row midpoint). OK EITC = 5% x 2,400 = 120. Flooring each spouse at
    # zero would count 10,000 and give 4,000 and 200.
    ok_federal_eitc: 2_400
    ok_eitc: 120

- name: OK EITC - 2025 - a spouse's self-employment loss lowers the phase-out base
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
      spouse:
        age: 40
        self_employment_income: -10_000
      child1:
        age: 7
        is_tax_unit_dependent: true
      child2:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: OK
  output:
    # Earned income (511-EIC line 15) = 40,000 + (-10,000) = 30,000 = AGI.
    # 2020 joint two-child credit: 5,920 - 21.06% x (30,000 - 25,220) =
    # 4,913.33 (the 2020 EIC table row 30,000-30,050 gives 4,908 at the row
    # midpoint). OK EITC = 5% x 4,913.33 = 245.67. Measuring from 40,000 would
    # give 5,920 - 21.06% x 14,780 = 2,807.33.
    ok_federal_eitc: 4_913.33
    ok_eitc: 245.67
