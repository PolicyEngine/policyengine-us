# Unit tests for Vermont Premium Assistance eligibility (REQ-1, REQ-2, REQ-3,
# REQ-8). A tax unit is eligible when the program is in effect (2026+), at least
# one member is federal-ACA-PTC-eligible (is_aca_ptc_eligible), and ACA MAGI is
# at or below 300% of the federal poverty line (33 V.S.A. 1812(a)(1): "less
# than or equal to 300 percent"), on the exact ratio of ACA MAGI to the
# prior-year guideline, not the truncated aca_magi_fraction:
#   eligible = in_effect & any(is_aca_ptc_eligible) & (aca_magi / FPG <= 3.0)
# Supplied-income cases pin the prior-year guideline to $10,000 and set
# aca_magi to the target ratio, so each expectation is hand-verifiable.
# Income-derived cases use the actual 2025 one-person guideline, $15,650.
# There is no minimum-income floor.

- name: Case 1, 250% FPL APTC-eligible Vermont tax unit is eligible.
  # in_effect (2026) true; member APTC-eligible; 2.50 <= 3.0 -> eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: true

- name: Case 2, 299% FPL just below the ceiling is eligible.
  # 2.99 <= 3.0 -> eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 29_900
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: true

- name: Case 3, exactly 300% FPL is eligible (boundary is inclusive).
  # 3.00 <= 3.0 -> eligible (REQ-2 boundary is inclusive).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: true

- name: Case 4, 301% FPL just above the ceiling is ineligible.
  # 3.01 > 3.0 -> ineligible (REQ-2 boundary).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_100
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: false

- name: Case 5, no APTC-eligible member is ineligible.
  # any(is_aca_ptc_eligible) is false -> ineligible (REQ-1), even at 250% FPL.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: false

- name: Case 6, one APTC-eligible member among two makes the unit eligible.
  # tax_unit.any() is satisfied by a single eligible member (REQ-1).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
      person2:
        age: 38
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi: 25_000
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: VT
  output:
    vt_premium_assistance_eligible: true

- name: Case 7, non-Vermont household is ineligible via defined_for.
  # defined_for = StateCode.VT gates the whole variable off for other states.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    vt_premium_assistance_eligible: false

- name: Case 8, 2025 off-year before the program is in effect is ineligible.
  # in_effect is false before 2026-01-01 -> ineligible (REQ-8).
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        tax_unit_fpg:
          2024: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: false

- name: Case 9, 2027 later year keeps the standing program in effect.
  # in_effect is open-ended (no sunset), so 2027 remains eligible (REQ-8).
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        tax_unit_fpg:
          2026: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: true

- name: Case 10, 300.01% FPL just barely above the ceiling is ineligible.
  # 30_001 / 10_000 = 3.0001 > 3.0 -> ineligible. Tightest just-above-ceiling case (REQ-2 boundary),
  # complementing the inclusive 3.00 eligible case and the coarser 3.01 case.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_001
        tax_unit_fpg:
          2025: 10_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_premium_assistance_eligible: false

- name: Case 11, $46,950 (exactly 300% of the 2025 guideline) is eligible.
  # 3 x $15,650 = $46,950; aca_magi_fraction 3.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 46_950
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    aca_magi_fraction: 3.00
    vt_premium_assistance_eligible: true

- name: Case 12, $46,950.47 (300.003%) is ineligible though truncated to 3.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 46_950.47
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    aca_magi_fraction: 3.00
    vt_premium_assistance_eligible: false

- name: Case 13, $47,105.56 (300.994%) is ineligible though truncated to 3.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 47_105.56
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    aca_magi_fraction: 3.00
    vt_premium_assistance_eligible: false

- name: Case 14, $46,949 (299.994%) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 46_949
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    aca_magi_fraction: 2.99
    vt_premium_assistance_eligible: true
