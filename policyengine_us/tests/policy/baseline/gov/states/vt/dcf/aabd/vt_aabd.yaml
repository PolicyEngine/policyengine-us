# POMS SI 01415.058 M, Vermont January 2026 optional supplement schedule.
- name: Case 1, independent individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
  output:
    vt_aabd_living_arrangement: INDEPENDENT
    vt_aabd: 55.68

- name: Case 2, residential care level iii individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    vt_aabd_care_setting: RESIDENTIAL_CARE_LEVEL_III
  output:
    vt_aabd: 51.77

- name: Case 3, residential care level iv individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    vt_aabd_care_setting: RESIDENTIAL_CARE_LEVEL_IV
  output:
    vt_aabd: 239.62

- name: Case 4, custodial care individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    vt_aabd_care_setting: CUSTODIAL_CARE
  output:
    vt_aabd: 105.6

- name: Case 5, household of another individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    ssi_lives_in_another_persons_household: true
    ssi_receives_shelter_from_others_in_household: true
    ssi_others_pay_all_meals: true
  output:
    # Federal another person's household maps to HOUSEHOLD_OF_ANOTHER.
    vt_aabd_living_arrangement: HOUSEHOLD_OF_ANOTHER
    # No countable income: 42.05 rate - 0 excess over the 662.67 reduced FBR = 42.05.
    vt_aabd: 42.05

- name: Case 6, medicaid institution individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    # Federal Medicaid-paid medical treatment facility maps to MEDICAID_INSTITUTION.
    vt_aabd_living_arrangement: MEDICAID_INSTITUTION
    # No countable income: 49.93 rate - 0 excess over the $30 facility FBR = 49.93.
    vt_aabd: 49.93

- name: Case 7, a recipient who declines SSI gets no supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    takes_up_ssi_if_eligible: false
  output:
    # 33 V.S.A. § 1301(3) requires SSI receipt if eligible.
    ssi: 0
    vt_aabd: 0

- name: Case 8, Chittenden County independent living uses the same rate as the rest of the state.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    county: CHITTENDEN_COUNTY_VT
    age: 65
  output:
    # POMS SI 01415.058 M.2.a: OS code B (Chittenden County) and code A both
    # pay 55.68.
    vt_aabd_living_arrangement: INDEPENDENT
    vt_aabd: 55.68

- name: Case 9, income above federal SSI standard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    social_security_retirement: 12_360
  output:
    vt_aabd: 39.68

- name: Case 10, income at combined cutoff.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    social_security_retirement: 12_836.16
  output:
    vt_aabd: 0

- name: Case 11, minimum positive payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    social_security_retirement: 12_836.04
  output:
    vt_aabd: 1

- name: Case 12, excess resources.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    ssi_countable_resources: 2_001
  output:
    vt_aabd: 0

- name: Case 13, not aged blind or disabled.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 30
  output:
    vt_aabd: 0

- name: Case 14, non Vermont resident.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NH
    age: 65
  output:
    vt_aabd: 0

- name: Case 15, a care setting for one of two unrelated people leaves the other independent.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_care_setting: CUSTODIAL_CARE
      person2:
        age: 70
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: VT
  output:
    vt_aabd_living_arrangement: [CUSTODIAL_CARE, INDEPENDENT]
    # Individual rates with no income: 105.60 custodial care and 55.68 independent.
    vt_aabd: [105.6, 55.68]

- name: Case 16, a Title XIX facility precedes a care setting.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    vt_aabd_care_setting: RESIDENTIAL_CARE_LEVEL_III
  output:
    # POMS SI 01415.058 M.2.a uses code I with federal arrangement D.
    vt_aabd_living_arrangement: MEDICAID_INSTITUTION
    # 49.93 rate - 0 excess over the $30 facility FBR = 49.93.
    vt_aabd: 49.93

- name: Case 17, independent individual in 2023 gets the $52.04 supplement.
  period: 2023-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
  output:
    vt_aabd: 52.04
