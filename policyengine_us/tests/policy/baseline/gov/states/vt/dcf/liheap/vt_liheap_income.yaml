# Gross household income with no deductions (rules 2910 and 2911; P-2910: "Fuel has
# no deductions for income"). Earned income (2911.1), unearned income including Reach
# Up and child support (2911.2) and self-employment (2911.3) count. The earned income
# of a member under 18 who lives with a parent and attends elementary or high school
# at least half time is excluded (2912(a)(12)), including during vacation breaks.
# Rules, "#page 25-29,34":
# https://outside.vermont.gov/dept/DCF/Shared%20Documents/ESD/Rules/2900-Seasonal-Fuel-Assistance.pdf#page=25
# Modeling assumption: each source is floored at zero per person, so a self-employment loss
# cannot offset wages. Reach Up is the SPM unit's tanf, counted once.
# Wages use the 2026 Vermont minimum wage, $14.42 an hour (Vermont Department of
# Labor, indexed under 21 V.S.A. 384(a)).

- name: Case 1, wages, child support and Reach Up add up with no deductions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 31
        # 14.42 x 20 hours x 52 weeks = 14,996.80.
        employment_income: 14_996.8
        # 200 a month.
        child_support_received: 2_400
      child1:
        age: 5
      child2:
        age: 3
    spm_units:
      spm_unit:
        members: [head, child1, child2]
        # Reach Up of 600 a month.
        tanf: 7_200
    households:
      household:
        members: [head, child1, child2]
        state_code: VT
  output:
    # 14,996.80 + 2,400 + 7,200 = 24,596.80.
    vt_liheap_income: 24_596.8

- name: Case 2, a self-employment loss does not reduce wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 47
        # 14.42 x 25 hours x 52 weeks = 18,746.
        employment_income: 18_746
        # A small craft business that lost money.
        self_employment_income: -4_200
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: VT
  output:
    # Wages 18,746 + max(-4,200, 0) = 18,746, not 14,546.
    vt_liheap_income: 18_746

- name: Case 3, a 16-year-old student's earnings are excluded but older or out-of-school teens' count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 44
        # 14.42 x 40 hours x 52 weeks = 29,993.60.
        employment_income: 29_993.6
      child1:
        age: 16
        is_in_k12_school: true
        is_tax_unit_dependent: true
        # Summer job: 14.42 x 15 hours x 10 weeks = 2,163.
        employment_income: 2_163
      child2:
        age: 17
        is_in_k12_school: false
        is_tax_unit_dependent: true
        # Left school and works 14.42 x 30 hours x 52 weeks = 22,495.20.
        employment_income: 22_495.2
      child3:
        age: 18
        is_in_k12_school: true
        is_tax_unit_dependent: true
        # High school senior: 14.42 x 12 hours x 40 weeks = 6,921.60.
        employment_income: 6_921.6
    spm_units:
      spm_unit:
        members: [head, child1, child2, child3]
        # No Reach Up.
        tanf: 0
    households:
      household:
        members: [head, child1, child2, child3]
        state_code: VT
  output:
    # child1 is under 18, a dependent and in school: excluded. child2 is not in
    # school and child3 is 18: both counted.
    # 29,993.60 + 22,495.20 + 6,921.60 = 59,410.40.
    vt_liheap_income: 59_410.4

- name: Case 4, Social Security and IRA withdrawals both count in full.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 73
        # Social Security of 1,200 a month, gross of the Medicare premium.
        social_security_retirement: 14_400
        # Required minimum distributions from a traditional IRA.
        taxable_ira_distributions: 3_000
        # Social Security is above the SSI federal benefit rate.
        ssi: 0
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: VT
  output:
    # Rule 2911.2(b)(4) and (9) count retirement benefits, including retirement
    # account distributions, and social security: 14,400 + 3,000 = 17,400.
    vt_liheap_income: 17_400

- name: Case 5, a 16-year-old student who is not a tax dependent has her earnings counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 16
        is_in_k12_school: true
        # A teen parent who lives on her own with her child, so she is not
        # under parental control or anyone's tax dependent.
        is_tax_unit_dependent: false
        # After-school job: 14.42 x 15 hours x 52 weeks = 11,247.60.
        employment_income: 11_247.6
      person2:
        age: 1
    spm_units:
      spm_unit:
        members: [person1, person2]
        # No Reach Up.
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: VT
  output:
    # person1 is under 18 and in school but not a dependent, so rule
    # 2912(a)(12) does not exclude her wages: 11,247.60.
    vt_liheap_income: 11_247.6

- name: Case 6, every earned income source counts, including a positive self-employment profit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 52
        # One distinct amount per earned source (1, 2, 4, 8 and 16 x 1,000), so
        # dropping any list entry changes the total.
        employment_income: 16_000
        self_employment_income: 1_000
        sstb_self_employment_income: 2_000
        farm_operations_income: 4_000
        # partnership_s_corp_income adds partnership_income and s_corp_income.
        partnership_income: 8_000
    spm_units:
      spm_unit:
        members: [person1]
        # No Reach Up.
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # 16,000 + 1,000 + 2,000 + 4,000 + 8,000 = 31,000.
    vt_liheap_income: 31_000

- name: Case 7, every unearned income source counts, including monthly SSI and AABD, railroad retirement, reported unemployment and a military survivor annuity.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        # The k-th unearned source in list order gets 120 x k, so dropping any
        # list entry changes the total. Where a listed variable only adds other
        # variables, the input is a component it adds.
        # ssi and vt_aabd are monthly: an annual input of 120 and 240 is 10 and
        # 20 a month, summed back over the year by add().
        ssi: 120
        vt_aabd: 240
        general_assistance: 360
        # pension_income adds taxable_pension_income, which adds this.
        taxable_private_pension_income: 480
        railroad_benefits: 600
        # military_retirement_income adds this Survivor Benefit Plan annuity.
        military_retirement_pay_survivors: 720
        # retirement_distributions adds taxable_retirement_distributions, which
        # adds this.
        taxable_401k_distributions: 840
        veterans_benefits: 960
        disability_benefits: 1_080
        workers_compensation: 1_200
        # A reported amount, so total_unemployment_compensation uses it.
        unemployment_compensation: 1_320
        # social_security adds this.
        social_security_retirement: 1_440
        survivor_benefits: 1_560
        strike_benefits: 1_680
        rental_income: 1_800
        farm_rent_income: 1_920
        child_support_received: 2_040
        alimony_income: 2_160
        # interest_income adds this.
        taxable_interest_income: 2_280
        # ordinary_dividend_income adds this.
        non_qualified_dividend_income: 2_400
        estate_income: 2_520
        miscellaneous_income: 2_640
    spm_units:
      spm_unit:
        members: [person1]
        # No Reach Up.
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # 120 x (1 + 2 + ... + 22) = 120 x 253 = 30,360.
    vt_liheap_income: 30_360

- name: Case 8, a rental loss does not reduce wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 47
        # 14.42 x 25 hours x 52 weeks = 18,746.
        employment_income: 18_746
        # A rented-out apartment that lost money.
        rental_income: -3_600
    spm_units:
      spm_unit:
        members: [person1]
        # No Reach Up.
        tanf: 0
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # Wages 18,746 + max(-3,600, 0) = 18,746, not 15,146.
    vt_liheap_income: 18_746
