# Vermont TANF Resource Eligibility
# Resource limit: $9,000
# Source: 33 V.S.A. Section 1103(a)(1)

- name: Case 1, zero assets.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # Assets: $0 <= $9,000 limit
    vt_reach_up_resources_eligible: true

- name: Case 2, one dollar below limit.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 8_999
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # Assets: $8,999 <= $9,000 limit
    vt_reach_up_resources_eligible: true

- name: Case 3, assets at limit.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 9_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # Assets: $9,000 = $9,000 limit
    vt_reach_up_resources_eligible: true

- name: Case 4, one dollar above limit.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 9_001
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    # Assets: $9,001 > $9,000 limit
    vt_reach_up_resources_eligible: false

# 617.28 + 8,353.98 + 28.74 = 9,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 9,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 617.28
    stock_assets: 8_353.98
    bond_assets: 28.74
    state_code: VT
  output:
    vt_reach_up_resources_eligible: true

# 617.28 + 8,353.98 + 28.75 = 9,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 617.28
    stock_assets: 8_353.98
    bond_assets: 28.75
    state_code: VT
  output:
    vt_reach_up_resources_eligible: false
