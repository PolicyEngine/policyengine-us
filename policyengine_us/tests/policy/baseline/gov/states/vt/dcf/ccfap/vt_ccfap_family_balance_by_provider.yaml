- name: An 18-year-old with special needs in care splits the 600 bill evenly with a 5-year-old, so each payment covers its own 300.
  # The model splits the unit's bill over members under 18, which gives the
  # 18-year-old none of it. CCFAP covers a child with special needs to age 19, so
  # both children are in care and carry 300 each. The 2026 full-time center rates
  # are 371 for a school-age child and 439 for a preschooler (Vermont counts
  # children as preschoolers to 72 months from July 13, 2025). With no share, each
  # payment covers its child's 300, with 71 and 139 to spare, and the family owes
  # nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
      young_adult:
        age: 18
        is_disabled: true
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
      child:
        age: 5
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
    spm_units:
      spm_unit:
        members: [parent, young_adult, child]
        vt_ccfap_eligible: true
        vt_ccfap_family_share: 0
        spm_unit_pre_subsidy_childcare_expenses: 31_200 # 600 x 52
    households:
      household:
        members: [parent, young_adult, child]
        state_code: VT
  output:
    pre_subsidy_childcare_expenses: [0, 0, 31_200]
    vt_ccfap_child_bill: [0, 15_600, 15_600] # 300 x 52 each
    vt_ccfap_child_payment: [0, 19_292, 22_828] # 371 x 52 and 439 x 52
    vt_ccfap_payment_above_bill: [0, 3_692, 7_228] # 71 x 52 and 139 x 52
    child_care_subsidies: 42_120
    child_care_subsidies_above_provider_bills: 10_920
    household_child_care_subsidies: 31_200
    childcare_expenses: 0

