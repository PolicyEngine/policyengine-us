# The department states these amounts by the week. The model's year has 52 weeks.
# Each child's bill stands for what that child's program charges a CCFAP family.
# The family pays its share to the youngest child's provider first (CCFAP Family
# Booklet, PDF page 10), and each program's invoice takes the state's payment for
# the child off that child's tuition (department memo of January 13, 2026, PDF
# pages 1 and 6). A payment above one child's tuition stays with that program
# (the same memo, blended tuition example 3, PDF page 4).

- name: Centers charging 360 for an infant and 325 for a preschooler, with a 200 share, leave the family 65 a week.
  # The 2026 full-time center rates are 495 for an infant and 439 for a preschooler.
  # The share goes to the infant's center, so the state pays 495 - 200 = 295 there and
  # 439 at the preschooler's center. The infant's invoice shows 360 - 295 = 65 due,
  # and the preschooler's center keeps the 439 - 325 = 114 above its tuition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      infant:
        age: 0
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
        pre_subsidy_childcare_expenses: 18_720 # 360 x 52
      preschooler:
        age: 3
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
        pre_subsidy_childcare_expenses: 16_900 # 325 x 52
    spm_units:
      spm_unit:
        members: [parent, infant, preschooler]
        vt_ccfap_eligible: true
        vt_ccfap_family_share: 10_400 # 200 x 52
    households:
      household:
        members: [parent, infant, preschooler]
        state_code: VT
  output:
    vt_ccfap_assigned_family_share: [0, 10_400, 0] # 200 x 52
    vt_ccfap_child_payment: [0, 15_340, 22_828] # 295 x 52 and 439 x 52
    vt_ccfap_payment_above_bill: [0, 0, 5_928] # 114 x 52
    child_care_subsidies: 38_168 # 734 x 52
    child_care_subsidies_above_provider_bills: 5_928
    household_child_care_subsidies: 32_240 # (295 + 325) x 52
    childcare_expenses: 3_380 # 65 x 52

- name: The memo's 350 tuition with a 300 share leaves 211 due, and a sibling's payment above its tuition pays none of it.
  # Department memo of January 13, 2026, separate tuition example 1 (PDF page 6):
  # the state pays 439 - 300 = 139 for the preschooler and the invoice shows
  # 350 - 139 = 211 due. A seven-year-old in part-time care at another center, which
  # charges 150, draws the 204 part-time school-age rate, 54 above that tuition.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      preschooler:
        age: 3
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
        pre_subsidy_childcare_expenses: 18_200 # 350 x 52
      schoolchild:
        age: 7
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 3
        childcare_hours_per_day: 5
        pre_subsidy_childcare_expenses: 7_800 # 150 x 52
    spm_units:
      spm_unit:
        members: [parent, preschooler, schoolchild]
        vt_ccfap_eligible: true
        vt_ccfap_family_share: 15_600 # 300 x 52
    households:
      household:
        members: [parent, preschooler, schoolchild]
        state_code: VT
  output:
    vt_ccfap_assigned_family_share: [0, 15_600, 0] # 300 x 52
    vt_ccfap_child_payment: [0, 7_228, 10_608] # 139 x 52 and 204 x 52
    vt_ccfap_payment_above_bill: [0, 0, 2_808] # 54 x 52
    child_care_subsidies: 17_836 # 343 x 52
    child_care_subsidies_above_provider_bills: 2_808
    household_child_care_subsidies: 15_028 # (139 + 150) x 52
    childcare_expenses: 10_972 # 211 x 52

- name: A 300 share fills the infant's 223 rate first and puts the other 77 on the preschooler's center.
  # The 2026 part-time infant rate at a registered home is 223, and the full-time
  # preschool rate at a center is 439. The infant's home takes 223 of the share, so
  # the state pays it nothing and the family owes its 200 tuition. The center takes
  # the remaining 77, so the state pays it 439 - 77 = 362, which covers its 300
  # tuition with 62 to spare.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      infant:
        age: 0
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: REGISTERED_HOME
        childcare_days_per_week: 3
        childcare_hours_per_day: 5
        pre_subsidy_childcare_expenses: 10_400 # 200 x 52
      preschooler:
        age: 3
        is_tax_unit_dependent: true
        vt_ccfap_provider_type: LICENSED_CENTER
        childcare_days_per_week: 5
        childcare_hours_per_day: 7
        pre_subsidy_childcare_expenses: 15_600 # 300 x 52
    spm_units:
      spm_unit:
        members: [parent, infant, preschooler]
        vt_ccfap_eligible: true
        vt_ccfap_family_share: 15_600 # 300 x 52
    households:
      household:
        members: [parent, infant, preschooler]
        state_code: VT
  output:
    vt_ccfap_assigned_family_share: [0, 11_596, 4_004] # 223 x 52 and 77 x 52
    vt_ccfap_child_payment: [0, 0, 18_824] # 362 x 52
    vt_ccfap_payment_above_bill: [0, 0, 3_224] # 62 x 52
    child_care_subsidies: 18_824
    child_care_subsidies_above_provider_bills: 3_224
    household_child_care_subsidies: 15_600 # 300 x 52
    childcare_expenses: 10_400 # 200 x 52

- name: Without care hours, a teenager's share of the bill stays the family's while the preschooler's payment exceeds its share.
  # The unit reports a 300 weekly bill and no care hours, so each child carries
  # 150. The preschooler draws the 240 part-time center rate, and the state pays
  # 240 - 50 = 190, 40 above the preschooler's 150. The 15-year-old is past
  # CCFAP's age limit, so the family owes the teenager's 150.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      preschooler:
        age: 3
        is_tax_unit_dependent: true
      teenager:
        age: 15
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [parent, preschooler, teenager]
        vt_ccfap_eligible: true
        vt_ccfap_family_share: 2_600 # 50 x 52
        spm_unit_pre_subsidy_childcare_expenses: 15_600 # 300 x 52
    households:
      household:
        members: [parent, preschooler, teenager]
        state_code: VT
  output:
    pre_subsidy_childcare_expenses: [0, 7_800, 7_800] # 150 x 52 each
    vt_ccfap_child_payment: [0, 9_880, 0] # 190 x 52
    vt_ccfap_payment_above_bill: [0, 2_080, 0] # 40 x 52
    child_care_subsidies: 9_880
    child_care_subsidies_above_provider_bills: 2_080
    household_child_care_subsidies: 7_800 # 150 x 52
    childcare_expenses: 7_800 # 150 x 52
