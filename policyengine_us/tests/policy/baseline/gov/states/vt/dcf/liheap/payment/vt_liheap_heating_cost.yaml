# Standard heating costs come from the P-2916 Standard Heating Cost Tables for the
# 2025-26 heating season (procedure 7/1/25, Bulletin 25-16):
# https://outside.vermont.gov/dept/DCF/Policies%20Procedures%20Guidance/ESD-Procedure-P2916.pdf
# Rules 2914(a)(6) and 2916 (fuel type, housing type and bedrooms), "#page 39,43":
# https://outside.vermont.gov/dept/DCF/Shared%20Documents/ESD/Rules/2900-Seasonal-Fuel-Assistance.pdf#page=39
# The table has rows for natural gas, propane, oil, kerosene and electricity, plus one
# "Firewood, Wood Pellets and Coal" row. Columns are 1, 2, 3 and 4+ bedrooms. Zero
# bedrooms (a studio) uses the smallest, 1-bedroom column (modeling assumption). SOLAR
# uses the electricity row: rule 2901(a)(14) makes the primary heating fuel the listed
# type providing the most heat, electricity for a grid-tied solar home with electric
# heat. OTHER, NONE and UNSPECIFIED have no row.

- name: Case 1, natural gas in a two-bedroom home uses the single-family default.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
    spm_units:
      spm_unit:
        members: [head]
        heating_type: NATURAL_GAS
    households:
      household:
        members: [head]
        state_code: VT
        bedrooms: 2
  output:
    # vt_liheap_dwelling_type is not supplied, so the single-family and mobile home
    # table applies: natural gas, 2 bedrooms = 1,454.
    vt_liheap_heating_cost: 1_454

- name: Case 2, propane in a three-bedroom apartment matches the P-2914D example.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
    spm_units:
      spm_unit:
        members: [head]
        heating_type: PROPANE
        vt_liheap_dwelling_type: MULTI_FAMILY
    households:
      household:
        members: [head]
        state_code: VT
        bedrooms: 3
  output:
    # Multi-family, propane, 3 bedrooms = 2,347 (also the P-2914D worked example).
    vt_liheap_heating_cost: 2_347

- name: Case 3, oil in a five-bedroom house uses the four-or-more-bedroom column.
