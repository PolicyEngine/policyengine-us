    households:
      household:
        members: [head]
        state_code: VT
        bedrooms: 5
  output:
    # Single-family, oil, 4+ bedrooms = 4,552 (5 bedrooms falls in the 4+ column).
    vt_liheap_heating_cost: 4_552

