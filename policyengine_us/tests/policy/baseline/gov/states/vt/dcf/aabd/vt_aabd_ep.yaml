- name: Case 21, One certified essential person for an eligible couple uses the couple maximum.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_ep_level: FULL
      person2:
        age: 70
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: VT
  output:
    # Rules 2780(A), 2783.1 and 2784(C): one grant for the couple.
    # Couple maximum 1,491 + 105.80 + 183.84 = 1,780.64; countable SSI 745.50 * 2
    # + AABD 52.90 * 2 = 1,596.80; floor(183.84) = 183 / 2 = 91.50 each.
    vt_aabd_ep: [91.5, 91.5]

