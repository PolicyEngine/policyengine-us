- name: Case 9, A spouse who is not aged, blind or disabled defaults as the essential person in another household.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_ep_level: FULL
        ssi_lives_in_another_persons_household: true
        ssi_receives_shelter_from_others_in_household: true
        ssi_others_pay_all_meals: true
      person2:
        age: 60
        ssi_lives_in_another_persons_household: true
        ssi_receives_shelter_from_others_in_household: true
        ssi_others_pay_all_meals: true
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: VT
  output:
    # person1 is aged and person2 (60, not blind or disabled) is in the same marital unit.
    vt_aabd_ep_is_spouse: [true, false]
    vt_aabd_living_arrangement: [HOUSEHOLD_OF_ANOTHER, HOUSEHOLD_OF_ANOTHER]
    # No spouse income, so no deeming: 994 * (1 - 1/3) = 662.67 reduced FBR.
    ssi: [662.67, 0]
    # 42.05 another-household rate - 0 excess = 42.05.
    vt_aabd_federal: [42.05, 0]
    # Maximum 994 + 55.68 = 1,049.68; countable 662.67 + 42.05 = 704.72;
    # floor(1,049.68 - 704.72) = floor(344.96) = 344.
    vt_aabd_ep: [344, 0]

