- name: Case 13, Non-SSI recipient requires verified resource eligibility.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 70
    vt_aabd_ep_level: FULL
    # Scaled low earner claiming at 65: $15,238 in 2025 dollars (2025 Trustees
    # Report Table V.C7) * 1.028 COLA = about $15,665 a year, $1,305.42 a month.
    social_security_retirement: 15_665
  output:
    # SSI countable 1,305.42 - 20 = 1,285.42 > 994 FBR, so SSI is 0.
    ssi: 0
    # 55.68 - (1,285.42 - 994) excess of 291.42 < 0, so no AABD supplement.
    vt_aabd_federal: 0
    # No SSI, AABD or reported SSI receipt and no state resource determination.
    vt_aabd_ep_resources_eligible: false
    vt_aabd_ep: 0

- name: Case 14, State-only essential-person grant with verified resources.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 70
    vt_aabd_ep_level: FULL
    vt_aabd_ep_resources_eligible: true
    # Same scaled low earner Social Security benefit as Case 13: $1,305.42 a month.
    social_security_retirement: 15_665
  output:
    # SSI countable 1,285.42 > 994 FBR and 291.42 excess > 55.68 supplement.
    ssi: 0
    vt_aabd_federal: 0
    # 1,305.42 - 20 general exclusion = 1,285.42.
    vt_aabd_ep_countable_income: 1_285.42
    # Maximum 1,491 + 105.80 = 1,596.80; floor(1,596.80 - 1,285.42) = floor(311.38) = 311.
    vt_aabd_ep: 311

- name: Case 15, A worker receives the state employment-expense deduction.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 70
    vt_aabd_ep_level: FULL
    vt_aabd_ep_resources_eligible: true
    # Full time at Vermont's 2026 minimum wage: $14.42 * 2,080 hours = $29,993.60,
    # $2,499.47 a month.
    employment_income: 29_993.6
  output:
    # SSI countable (2,499.47 - 20 - 65) * 0.5 = 1,207.23 > 994 FBR.
    ssi: 0
    # 1,207.23 - 994 = 213.23 excess > 55.68 supplement.
    vt_aabd_federal: 0
    # (2,499.47 - 90 employment expense - 20 - 65) * 0.5 = 1,162.23.
    vt_aabd_ep_countable_income: 1_162.23
    # floor(1,596.80 - 1,162.23) = floor(434.57) = 434.
    vt_aabd_ep: 434

- name: Case 16, Needs-based veterans pension does not get the general exclusion.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 70
    vt_aabd_ep_level: FULL
    vt_aabd_ep_resources_eligible: true
    # VA pension MAPR for a veteran with no dependents from December 1, 2025:
    # $17,441 a year, $1,453.42 a month, with no other income.
    veterans_benefits: 17_441
  output:
    # SSI countable 1,453.42 - 20 = 1,433.42 > 994 FBR.
    ssi: 0
    # 1,433.42 - 994 = 439.42 excess > 55.68 supplement.
    vt_aabd_federal: 0
    # The needs-based pension counts in full, without the $20 general exclusion.
    vt_aabd_ep_countable_income: 1_453.42
    # floor(1,596.80 - 1,453.42) = floor(143.38) = 143.
    vt_aabd_ep: 143

