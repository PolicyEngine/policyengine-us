- name: Case 18, A nonspouse essential person qualifies at 34 percent next to an ineligible spouse.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_ep_level: PARTIAL_34
        vt_aabd_ep_nonspouse_essential_person: true
      person2:
        age: 45
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: VT
  output:
    # The certified essential person is not the spouse (rules 2781(E), 2782).
    vt_aabd_ep_is_spouse: [false, false]
    # SSI 994 + AABD 55.68; the spouse has no income.
    vt_aabd_ep_countable_income: [1_049.68, 1_049.68]
    # 1,049.68 + 0.34 * (1,596.80 - 1,049.68) = 1,235.70;
    # floor(1,235.70 - 1,049.68) = floor(186.02) = 186.
    vt_aabd_ep: [186, 0]
    # 55.68 AABD + 186 Essential Person grant = 241.68.
    vt_aabd: [241.68, 0]

