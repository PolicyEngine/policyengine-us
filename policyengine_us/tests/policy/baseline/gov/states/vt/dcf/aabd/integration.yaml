- name: Case 1, independent couple.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VT
  output:
    # Joint couple, no countable income: 105.80 couple rate / 2 = 52.90 each.
    vt_aabd: [52.9, 52.9]

