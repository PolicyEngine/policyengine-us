- name: Case 7, annual benefits and SNAP income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 65
    # SNAP take-up off so spm_unit_benefits does not rest on projected SNAP amounts.
    takes_up_snap_if_eligible: false
  output:
    # 55.68 independent rate * 12 = 668.16.
    vt_aabd: 668.16
    household_state_benefits: 668.16
    # SSI 994 * 12 = 11,928 + 668.16 = 12,596.16.
    snap_unearned_income: 12_596.16
    # SSI 11,928 + vt_aabd 668.16; SNAP is 0 without take-up.
    spm_unit_benefits: 12_596.16

- name: Case 8, Essential-person grant enters the annual Vermont benefit total.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 70
    vt_aabd_ep_level:
      2026: FULL
  output:
    # 994 * 12 = 11,928.
    ssi: 11_928
    # 55.68 * 12 = 668.16.
    vt_aabd_federal: 668.16
    # Monthly maximum 1,491 + 105.80 = 1,596.80; countable 994 + 55.68 = 1,049.68;
    # floor(1,596.80 - 1,049.68) = floor(547.12) = 547 * 12 = 6,564.
    vt_aabd_ep: 6_564
    # 668.16 + 6,564 = 7,232.16.
    vt_aabd: 7_232.16
    # 11,928 + 7,232.16 = 19,160.16.
    snap_unearned_income: 19_160.16
    # SSI plus the whole AABD payment, including the Essential Person grant:
    # 11,928 + 7,232.16 = 19,160.16.
    hud_unearned_income: 19_160.16

- name: Case 9, Two eligible spouses share one essential-person grant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_ep_level: FULL
      person2:
        age: 70
        vt_aabd_ep_level: FULL
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: VT
  output:
    # Couple maximum 1,491 + 105.80 + 183.84 = 1,780.64; countable SSI 745.50 * 2
    # + AABD 52.90 * 2 = 1,596.80; floor(183.84) = 183 / 2 = 91.50 each.
    vt_aabd_ep: [91.5, 91.5]
    # 52.90 AABD + 91.50 Essential Person grant = 144.40 each.
    vt_aabd: [144.4, 144.4]

- name: Case 10, Ineligible spouse earnings do not get the ABD half-earnings deduction.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        vt_aabd_ep_level: FULL
      person2:
        age: 40
        employment_income: 6_000
    marital_units:
      couple:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: VT
  output:
    # person2 (40, not blind or disabled) is the ineligible spouse.
    vt_aabd_ep_is_spouse: [true, false]
    # SSI receipt passes the resource test for the group.
    vt_aabd_ep_resources_eligible: [true, true]
    # Spouse earnings 500 - 90 employment expense - 20 general = 390, with no
    # half-earnings exclusion, + SSI 994 + AABD 55.68 = 1,439.68.
    vt_aabd_ep_countable_income: [1_439.68, 1_439.68]
    # floor(1,596.80 - 1,439.68) = floor(157.12) = 157 for the recipient only.
    vt_aabd_ep: [157, 0]

- name: Case 11, Vermont essential care for a disabled member counts as HUD income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 40
    meets_ssi_disability_criteria: true
    is_disabled: true
    vt_aabd_ep_level: FULL
  output:
    # AABD 55.68 * 12 = 668.16 + Essential Person grant floor(1,596.80 - 1,049.68)
    # = 547 * 12 = 6,564; 668.16 + 6,564 = 7,232.16.
    vt_aabd: 7_232.16
    # SSI 994 * 12 = 11,928 + 7,232.16 = 19,160.16.
    snap_unearned_income: 19_160.16
    # HUD counts the whole AABD payment, including the Essential Person grant:
    # 11,928 + 7,232.16 = 19,160.16.
    hud_unearned_income: 19_160.16

- name: Case 12, One spouse in a Medicaid facility is paid as an individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 70
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: VT
  output:
    vt_aabd_living_arrangement: [MEDICAID_INSTITUTION, INDEPENDENT]
    # 20 CFR 416.414(b)(3): each spouse is paid at an individual rate.
    ssi_couple_computation_applies: [false, false]
    # $30 facility rate and the 994 individual FBR.
    ssi_amount_if_eligible: [30, 994]
    ssi: [30, 994]
    # POMS SI 01415.058 M.2.a individual rates: code I 49.93, code A 55.68.
    vt_aabd: [49.93, 55.68]
