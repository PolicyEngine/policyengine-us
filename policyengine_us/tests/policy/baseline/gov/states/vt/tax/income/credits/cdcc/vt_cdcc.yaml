- name: Vermont CDCC  
  period: 2022
  input:
    capped_cdcc: 1_000
    state_code: VT
  output:
    vt_cdcc: 720  

- name: Vermont CDCC 
  period: 2022
  input:
    capped_cdcc: 2_000
    state_code: VT
  output:
    vt_cdcc: 1440 

- name: Vermont CDCC 2022 high-AGI filer still gets the full 72% credit; 2022 Act 138 Sec. 3 struck the low-income AGI cap
  period: 2022
  input:
    capped_cdcc: 1_000
    adjusted_gross_income: 50_000
    state_code: VT
  output:
    vt_cdcc: 720

- name: Vermont CDCC 2022 high-income joint filer keeps the credit; no AGI cap after Act 138
  period: 2022
  input:
    capped_cdcc: 1_000
    adjusted_gross_income: 100_000
    filing_status: JOINT
    state_code: VT
  output:
    vt_cdcc: 720

- name: Vermont CDCC 2023 has no AGI cap
  period: 2023
  input:
    capped_cdcc: 1_000
    adjusted_gross_income: 50_000
    state_code: VT
  output:
    vt_cdcc: 720

# 32 V.S.A. § 5824, as amended by 2026 Act 164 § 60 (effective January 1,
# 2026), adopts the federal income tax laws as in effect on December 31, 2025,
# so from 2026 the credit is 72% of the federal credit allowed under the OBBBA
# section 21 rates (capped_cdcc), not the pre-OBBBA credit.
- name: Vermont CDCC 2026 matches the OBBBA federal credit
  period: 2026
  input:
    capped_cdcc: 2_000
    pre_obbba_capped_cdcc: 1_000
    state_code: VT
  output:
    # 72% of the $2,000 federal credit allowed.
    vt_cdcc: 1_440

- name: Vermont CDCC 2026 joint filers with AGI of $100,000 and $6,000 of care expenses
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      parent1:
        age: 35
        employment_income: 60_000
      parent2:
        age: 35
        employment_income: 40_000
      child1:
        age: 3
        is_tax_unit_dependent: true
      child2:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        tax_unit_childcare_expenses: 6_000
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: VT
  output:
    # Federal credit allowed: 35% of $6,000 = $2,100 (OBBBA section 21 rate at
    # AGI $100,000); Vermont: 72% x $2,100 = $1,512.
    vt_cdcc: 1_512
