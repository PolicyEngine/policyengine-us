# S.51 (2025) tests for new income-based exemption system
- name: S.51 - Full exemption below $125k AGI
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 25_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_military_retirement_pay_exclusion: 25_000

- name: S.51 - Partial exemption at $150k AGI (50% of military pay)
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 150_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_military_retirement_pay_exclusion: 10_000

- name: S.51 - No exemption above $175k AGI
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 200_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_military_retirement_pay_exclusion: 0

# A dependent's income is not in the filer's federal AGI; the dependent
# reports it on their own return, so only the head's and spouse's military
# retirement pay counts.
- name: A dependent child's military retirement pay is not excluded on the filer's return.
  period: 2024
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
      child:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: VT
  output:
    vt_military_retirement_pay_exclusion: 0

- name: Only the head's military retirement pay counts toward the capped exclusion, not a dependent's.
  period: 2024
  input:
    people:
      head:
        age: 50
        employment_income: 50_000
        military_retirement_pay: 8_000
      child:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: VT
  output:
    # min(8,000 head pay, 10,000 cap); the child's 10,000 is not counted.
    vt_military_retirement_pay_exclusion: 8_000

- name: Under the 2025 income-based exemption, only the head's military retirement pay is exempt.
  period: 2025
  input:
    people:
      head:
        age: 50
        employment_income: 50_000
        military_retirement_pay: 6_000
      child:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: VT
  output:
    # Federal AGI 50,000 is below the 125,000 full-exemption threshold, so the
    # head's 6,000 is fully exempt; the child's 10,000 is not counted.
    vt_military_retirement_pay_exclusion: 6_000
