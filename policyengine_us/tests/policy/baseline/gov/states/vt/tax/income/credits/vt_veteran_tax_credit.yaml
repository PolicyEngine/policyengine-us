- name: S.51 - Veteran tax credit full amount below $25k AGI
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_veteran: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 20_000
    households:
      household:
        members: [person1]
        state_code: VT
  output:
    vt_veteran_tax_credit: 250

