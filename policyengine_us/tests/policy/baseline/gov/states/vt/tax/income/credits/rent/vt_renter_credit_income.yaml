# 32 V.S.A. 6061(18): for the renter credit, "income" means federal adjusted
# gross income increased by (A) business, rental, capital, estate or trust
# and farm losses, (B) exempt interest, (C) 75 percent of the Social Security
# benefits excluded from gross income, and (D) the listed above-the-line
# deductions, among them "the penalty for early withdrawal of savings".
# 2025 Form RCC-146: line 10 is federal total income (Form 1040 line 9),
# line 11 is 75% of Form 1040 line 6a minus line 6b, line 12 is tax-exempt
# interest, and line 13 adds back negative amounts on Form 1040 line 7 and
# Schedule 1 lines 3, 4, 5, 6 and 8a.

- name: Case 1, an above-the-line deduction is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    early_withdrawal_penalty: 500
  output:
    # Federal total income (Form 1040 line 9) is 30,000; AGI is 29,500.
    # 6061(18)(D) adds the penalty back: 30,000.
    adjusted_gross_income: 29_500
    vt_renter_credit_deduction_add_back: 500
    vt_renter_credit_income: 30_000

- name: Case 2, a business loss is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    self_employment_income: -5_000
  output:
    # Federal AGI is 25,000. 6061(18)(A) and RCC-146 line 13 add back the
    # 5,000 loss on Schedule 1 line 3: 30,000.
    adjusted_gross_income: 25_000
    vt_renter_credit_income: 30_000

- name: Case 3, a capital loss above the federal limit is added back up to the limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    long_term_capital_gains: -4_000
  output:
    # Form 1040 line 7 shows the 3,000 loss allowed by IRC 1211(b), so AGI is
    # 27,000. Line 13 adds the 3,000 back: 30,000.
    adjusted_gross_income: 27_000
    vt_renter_credit_income: 30_000

- name: Case 4, a dependent child's Social Security is not the claimant's income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 20_000
      child:
        age: 10
        is_tax_unit_dependent: true
        social_security_survivors: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: VT
  output:
    # 6066(b)(1) tests "the claimant's income". The parent's Form 1040 lines
    # 6a and 6b are blank, so RCC-146 line 11 is 0 and income is 20,000.
    # Counting 75% of the child's benefit would give 20,000 + 6,000 = 26,000.
    vt_renter_credit_countable_tax_exempt_ss: 0
    vt_renter_credit_income: 20_000

- name: Case 5, a capital loss exactly at the federal limit is added back in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    long_term_capital_gains: -3_000
  output:
    # Form 1040 line 7 is -3,000, so AGI is 27,000; line 13 adds 3,000 back.
    adjusted_gross_income: 27_000
    vt_renter_credit_income: 30_000

- name: Case 6, a capital loss netted against capital gain distributions is added back in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    long_term_capital_gains: -4_000
    non_sch_d_capital_gains: 2_000
  output:
    # Gross income is 30,000 + 2,000 of capital gain distributions = 32,000.
    # IRC 1211(b) allows the 4,000 loss against the 2,000 of gains, plus the
    # 2,000 excess, inside the 3,000 limit. Schedule D line 16 and Form 1040
    # line 7 are -2,000, and AGI is 32,000 - 2,000 - 2,000 = 28,000.
    # 6061(18)(A) adds back each capital loss included in AGI, the 2,000
    # allowed against the gains and the 2,000 net loss:
    # 28,000 + 2,000 + 2,000 = 32,000. (RCC-146 line 13 adds back only the
    # 2,000 on line 7, for 30,000.)
    capital_losses_allowed_against_gains: 2_000
    limited_capital_loss: 2_000
    adjusted_gross_income: 28_000
    vt_renter_credit_income: 32_000

- name: Case 7, a partnership loss is added back although rental income offsets it on Schedule E.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    rental_income: 10_000
    partnership_s_corp_income: -4_000
  output:
    # AGI is 30,000 + 10,000 - 4,000 = 36,000. 6061(18)(A) lists "loss from
    # a partnership", so the 4,000 is added back: 40,000. (RCC-146 line 13
    # reads Schedule 1 line 5, where the two net to +6,000, and would add
    # nothing.)
    adjusted_gross_income: 36_000
    vt_renter_credit_income: 40_000

- name: Case 8, the deductible part of self-employment tax is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    self_employment_income: 20_000
  output:
    # Net earnings 20,000 x 0.9235 = 18,470; self-employment tax
    # 18,470 x 15.3% = 2,825.91; the deductible half (Schedule 1 line 15) is
    # 1,412.955, so AGI is 18,587.045. 6061(18)(D) adds it back: 20,000.
    vt_renter_credit_deduction_add_back: 1_412.955
    vt_renter_credit_income: 20_000

- name: Case 9, IRA and student loan interest deductions are added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    age: 40
    employment_income: 30_000
    traditional_ira_contributions: 2_000
    student_loan_interest: 1_000
  output:
    # The IRA deduction (2,000, Schedule 1 line 20) and the student loan
    # interest deduction (1,000, line 21; income is far below the phase-out)
    # bring AGI to 27,000. 6061(18)(D) adds both back: 30,000.
    adjusted_gross_income: 27_000
    vt_renter_credit_deduction_add_back: 3_000
    vt_renter_credit_income: 30_000

- name: Case 10, a dependent's own early withdrawal penalty is not added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 30_000
        early_withdrawal_penalty: 0
      child:
        age: 17
        is_tax_unit_dependent: true
        early_withdrawal_penalty: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: VT
  output:
    # The child's penalty is on the child's own return, so the parent's AGI
    # is 30,000 and 6061(18)(D) has nothing of the parent's to add back.
    adjusted_gross_income: 30_000
    vt_renter_credit_deduction_add_back: 0
    vt_renter_credit_income: 30_000

- name: Case 11, a short-term capital loss netted against the same person's long-term gain is added back in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    short_term_capital_gains: -4_000
    long_term_capital_gains: 2_000
  output:
    # capital_gains nets the two parts to -2,000, so gross income is 30,000.
    # The 2,000 net loss is inside the 3,000 limit (Form 1040 line 7), and
    # AGI is 28,000. 6061(18)(A) adds back the whole 4,000 short-term loss:
    # the 2,000 that offset the long-term gain and the 2,000 net loss, for
    # 28,000 + 4,000 = 32,000, as in Case 6. (RCC-146 line 13 adds back only
    # the 2,000 on line 7, for 30,000.)
    capital_losses_allowed_against_gains: 0
    limited_capital_loss: 2_000
    adjusted_gross_income: 28_000
    vt_renter_credit_capital_loss_add_back: 4_000
    vt_renter_credit_income: 32_000

- name: Case 12, a capital loss netted against capital gain distributions on Schedule D line 13 is added back in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    long_term_capital_gains: -2_000
    schedule_d_capital_gain_distributions: 2_000
  output:
    # The 2,000 of distributions on Schedule D line 13 net with a 4,000
    # long-term loss from sales to -2,000 on line 15, so AGI is 28,000.
    # 6061(18)(A) adds back the 4,000 loss: the 2,000 the distributions
    # absorbed and the 2,000 net loss, for 32,000, as in Case 6.
    limited_capital_loss: 2_000
    adjusted_gross_income: 28_000
    vt_renter_credit_capital_loss_add_back: 4_000
    vt_renter_credit_income: 32_000

- name: Case 13, a prior-year capital loss carryover absorbed by the same person's long-term gain is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    long_term_capital_gains: 5_000
    long_term_capital_loss_carryover: 3_000
  output:
    # The year's 8,000 long-term gain less the 3,000 carryover (Schedule D
    # lines 14 and 15) is 5,000, so AGI is 35,000. 26 U.S.C. 1212(b)(1)(B)
    # treats the carryover as a long-term capital loss of the year, and AGI
    # deducted all of it, so 6061(18)(A) adds it back: 38,000.
    adjusted_gross_income: 35_000
    vt_renter_credit_capital_loss_add_back: 3_000
    vt_renter_credit_income: 38_000

- name: Case 14, the part of a netted capital loss above the federal limit is not added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    short_term_capital_gains: -10_000
    long_term_capital_gains: 2_000
  output:
    # The parts net to -8,000, of which IRC 1211(b) allows 3,000, so AGI is
    # 27,000. AGI deducted 2,000 of the short-term loss against the
    # long-term gain and 3,000 as the net loss; the other 5,000 carries to
    # 2026. 6061(18)(A) adds back the 5,000 deducted: 32,000.
    limited_capital_loss: 3_000
    adjusted_gross_income: 27_000
    vt_renter_credit_capital_loss_add_back: 5_000
    vt_renter_credit_income: 32_000

- name: Case 15, a dependent's capital loss netted against the dependent's own gain is not added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 30_000
      child:
        age: 17
        is_tax_unit_dependent: true
        short_term_capital_gains: -4_000
        long_term_capital_gains: 2_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: VT
  output:
    # The child's gains and losses are on the child's own return, so the
    # parent's AGI is 30,000 and there is no capital loss to add back.
    adjusted_gross_income: 30_000
    vt_renter_credit_capital_loss_add_back: 0
    vt_renter_credit_income: 30_000

- name: Case 16, a carryover is added back when the net capital gain is supplied without its parts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: VT
    employment_income: 30_000
    capital_gains: -1_000
    long_term_capital_loss_carryover: 3_000
  output:
    # The -1,000 net includes the 3,000 carryover, so the year's own gain is
    # 2,000. AGI deducts the 1,000 net loss: 29,000. The carryover is a
    # capital loss of the year (IRC 1212(b)(1)(B)); AGI deducted 2,000 of it
    # against the gain and 1,000 as the net loss, so 6061(18)(A) adds back
    # 3,000: 32,000.
    limited_capital_loss: 1_000
    adjusted_gross_income: 29_000
    vt_renter_credit_capital_loss_add_back: 3_000
    vt_renter_credit_income: 32_000
