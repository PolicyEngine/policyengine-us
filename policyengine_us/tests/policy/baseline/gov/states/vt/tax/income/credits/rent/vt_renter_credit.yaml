# Income limit corrections. Each case puts income where the corrected limits
# and PE's earlier values give different credits. Base credit = fair market
# rent x 12 x 10%. The 2023-2025 expectations match the department's Renter
# Credit Website Calculator for the same household.
- name: Washington, 7 people, 2025, midpoint of the corrected income limits
  period: 2025
  input:
    vt_renter_credit_income: 68_820
    county: WASHINGTON_COUNTY_VT
    tax_unit_size: 7
    rent_is_shared_with_another_tax_unit: false
    housing_assistance: 0
    rent: 0
    state_code: VT
  output:
    # Partial limit 88,990 = 1.3 x HUD FY2025 very low-income limit 68,450,
    # rounded to $10 (the booklet prints 88,880). Full limit 48,650.
    # (88,990 - 68,820) / (88,990 - 48,650) = 0.5; 0.5 x 1,977 x 12 x 0.1 = 1,186.2
    vt_renter_credit: 1_186

- name: Washington, 7 people, 2025, income between the booklet and corrected limits
  period: 2025
  input:
    vt_renter_credit_income: 88_950
    county: WASHINGTON_COUNTY_VT
    tax_unit_size: 7
    rent_is_shared_with_another_tax_unit: false
    housing_assistance: 0
    rent: 0
    state_code: VT
  output:
    # Above the booklet's 88,880 but below 88,990.
    # (88,990 - 88,950) / 40,340 x 2,372.4 = 2.35
    vt_renter_credit: 2

