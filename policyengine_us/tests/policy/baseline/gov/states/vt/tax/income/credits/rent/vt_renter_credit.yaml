# Franklin and Grand Isle use the state-average fair market rent (32 V.S.A.
# 6061(7)(C)). Expected values are the department's Renter Credit Website
# Calculators (2022, 2023, 2025), recalculated in LibreOffice for each household:
# 12 months rented, not shared, not subsidized.
- name: Franklin, 4 people, 2022, full credit at the state-average fair market rent
  period: 2022
  input:
    vt_renter_credit_income: 5_000
    county: FRANKLIN_COUNTY_VT
    tax_unit_size: 4
    rent_is_shared_with_another_tax_unit: false
    housing_assistance: 0
    rent: 0
    state_code: VT
  output:
    # 10% x 12 x 1,477.91 = 1,773.49; the whole-dollar 1,478 gave 1,774.
    vt_renter_credit: 1_773

