- name: "2025 single filer who can be claimed as a dependent: Vermont personal exemptions count only filers who cannot be claimed and, when none can be, the dependents"
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: VT
  output:
    # 32 V.S.A. 5811(21)(C): no exemption for a dependent individual, and
    # IRC 152(b)(1) leaves a claimable filer no dependents.
    vt_personal_exemptions: 0

- name: "2025 joint return with one claimable spouse: Vermont personal exemptions count only filers who cannot be claimed and, when none can be, the dependents (the claimable spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 8000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: VT
  output:
    # The unclaimed spouse's exemption only: 1 x $5,300.
    vt_personal_exemptions: 5300

