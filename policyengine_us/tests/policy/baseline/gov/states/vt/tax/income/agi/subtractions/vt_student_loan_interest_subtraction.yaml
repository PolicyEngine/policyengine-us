- name: 2025 single filer who can be claimed as a dependent: Vermont subtracts the student loan interest not deducted federally
  period: 2025
  input:
    people:
      filer:
        age: 24
        employment_income: 10000
        student_loan_interest: 1000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: VT
  output:
    # A claimed filer gets no federal deduction (IRC 221(c)), so Schedule
    # IN-112 line 16 subtracts all $1,000 of interest: $10,000 - $1,000.
    student_loan_interest_ald: 0
    vt_student_loan_interest_subtraction: 1000
    vt_agi: 9000

- name: 2025 joint return with one claimable spouse: Vermont subtracts the student loan interest not deducted federally (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 24
        employment_income: 5000
        student_loan_interest: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 24
        employment_income: 5000
        student_loan_interest: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: VT
  output:
    # Neither spouse may be claimed for the federal deduction; Vermont
    # subtracts the full $1,000.
    student_loan_interest_ald: [0, 0]
    vt_student_loan_interest_subtraction: 1000
    vt_agi: 9000

