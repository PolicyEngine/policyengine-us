- name: 2021 Vermont has no student loan interest subtraction
  period: 2021
  input:
    people:
      filer:
        age: 24
        employment_income: 10000
        student_loan_interest: 1000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: VT
  output:
    # 2022 Act 138 added 5811(21)(B)(vi) from 2022; the 2021 Schedule
    # IN-112 has no such line.
    vt_subtractions: 0
    vt_agi: 10000
