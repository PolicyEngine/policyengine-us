- name: Five qualifying children.
  period: 2023
  input:
    people:
      parent:
        age: 30
      child1:
        age: 10 #disqualified
      child2:
        age: 5
      child3:
        age: 4
      child4:
        age: 3
      child5:
        age: 2
      child6:
        age: 0
    households:
      household:
        members: [parent, child1, child2, child3, child4, child5, child6]
        state_code: VT
    tax_units:
      tax_unit:
        members: [parent, child1, child2, child3, child4, child5, child6]
        adjusted_gross_income: 1_000
  output:
    vt_ctc: 5_000

- name: Fully phases out at $175,000. 1000-20*(175000-125000)/1000 = 0
  period: 2023
  input:
    state_code: VT
    age: 5
    adjusted_gross_income: 175_000
  output:
    vt_ctc: 0

- name: Check we're not creating a negative value.
  period: 2023
  input:
    state_code: VT
    age: 5
    adjusted_gross_income: 200_000
  output:
    vt_ctc: 0

- name: Halfway phased out at $150,000. 1000-20*(150000-125000)/1000 = 500
  period: 2023
  input:
    state_code: VT
    age: 5
    adjusted_gross_income: 150_000
  output:
    vt_ctc: 500

# S.51 (2025) tests for expanded age eligibility
- name: S.51 - CTC includes 6-year-olds starting 2025
  period: 2025
  input:
    state_code: VT
    age: 6
    adjusted_gross_income: 50_000
  output:
    vt_ctc: 1_000

- name: S.51 - CTC still applies to 5-year-olds in 2025
  period: 2025
  input:
    state_code: VT
    age: 5
    adjusted_gross_income: 50_000
  output:
    vt_ctc: 1_000

- name: S.51 - CTC does not apply to 7-year-olds in 2025
  period: 2025
  input:
    state_code: VT
    age: 7
    adjusted_gross_income: 50_000
  output:
    vt_ctc: 0

- name: S.51 - CTC did not include 6-year-olds before 2025
  period: 2024
  input:
    state_code: VT
    age: 6
    adjusted_gross_income: 50_000
  output:
    vt_ctc: 0

- name: 2025 single filer who can be claimed as a dependent: no Vermont child tax credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 2000
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: VT
  output:
    # 32 V.S.A. 5830f requires entitlement to the federal child tax credit
    # (waiving only the identification-number rules); IRC 152(b)(1) leaves
    # a claimable filer no dependents and so no federal credit.
    vt_ctc: 0

- name: 2025 joint return with one claimable spouse: no Vermont child tax credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: VT
  output:
    # Either spouse being claimable leaves the joint return no dependents.
    vt_ctc: 0

- name: 2025 joint return with one claimable spouse: no Vermont child tax credit (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: VT
  output:
    vt_ctc: 0

- name: 2025 joint return with both spouses claimable: no Vermont child tax credit
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: VT
  output:
    vt_ctc: 0

- name: 2025 joint return with neither spouse claimable: no Vermont child tax credit
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: VT
  output:
    # One qualifying child aged 6 or under x $1,000; AGI $2,000 is below
    # the $125,000 phase-out start.
    vt_ctc: 1000

- name: 2025 a young household member who is not a dependent does not count for the Vermont child tax credit
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 2000
      sibling:
        age: 5
        is_tax_unit_dependent: false
    tax_units:
      tax_unit:
        members: [parent, sibling]
    households:
      household:
        members: [parent, sibling]
        state_code: VT
  output:
    # 5830f counts qualifying children under IRC 152(c), who are dependents.
    vt_ctc: 0
