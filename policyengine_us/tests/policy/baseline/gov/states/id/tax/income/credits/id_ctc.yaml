# 2025 Tests - Credit amount remains $205 per qualifying child
# NOTE: Idaho CTC expires after 2025 per Idaho Code 63-3029L

- name: One child in 2025
  # $205 per qualifying child
  period: 2025
  input:
    ctc_qualifying_children: 1
    state_code: ID
  output:
    id_ctc: 205

- name: Family with 3 children in 2025
  # 3 children * $205 = $615
  period: 2025
  input:
    ctc_qualifying_children: 3
    state_code: ID
  output:
    id_ctc: 615

- name: No children in 2025
  period: 2025
  input:
    ctc_qualifying_children: 0
    state_code: ID
  output:
    id_ctc: 0

# 2021 Idaho Form 40 instructions, Line 25 Idaho Child Tax Credit Worksheet:
# the child must "Be age 16 or under as of December 31, 2021". The federal
# age-17 rule for 2021 is in IRC 24(i)(1), not 24(c).
- name: Child aged 16 qualifies in 2021
  period: 2021
  input:
    people:
      parent:
        age: 40
      child1:
        age: 16
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1]
    households:
      household:
        members: [parent, child1]
        state_code: ID
  output:
    id_ctc: 205

- name: Child aged 17 does not qualify in 2021
  period: 2021
  input:
    people:
      parent:
        age: 40
      child1:
        age: 17
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1]
    households:
      household:
        members: [parent, child1]
        state_code: ID
  output:
    id_ctc: 0

- name: Six children with the oldest aged 17 in 2021
  period: 2021
  input:
    people:
      parent:
        age: 40
      child1:
        age: 17
        is_tax_unit_dependent: true
      child2:
        age: 15
        is_tax_unit_dependent: true
      child3:
        age: 13
        is_tax_unit_dependent: true
      child4:
        age: 11
        is_tax_unit_dependent: true
      child5:
        age: 10
        is_tax_unit_dependent: true
      child6:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2, child3, child4, child5, child6]
    households:
      household:
        members: [parent, child1, child2, child3, child4, child5, child6]
        state_code: ID
  output:
    # 5 children under 17 * $205
    id_ctc: 1025


- name: 2025 single filer who can be claimed as a dependent, no Idaho child tax credit
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: ID
  output:
    # Already zero through the federal child test: the 2021-2025
    # worksheet requires the child to be the taxpayer's dependent.
    id_ctc: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent, no Idaho child tax credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: ID
  output:
    id_ctc: 0

