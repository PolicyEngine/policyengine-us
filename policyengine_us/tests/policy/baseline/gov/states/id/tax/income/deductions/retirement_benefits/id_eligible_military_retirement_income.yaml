# Idaho Code 63-3022A(1)(b) covers retirement benefits paid to a retired
# member of the military services or to the member's unremarried widow or
# widower.

- name: An unremarried surviving spouse counts military survivor benefits.
  period: 2025
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: true
    military_retirement_pay_survivors: 25_000
  output:
    id_eligible_military_retirement_income: 25_000
    id_retirement_benefits_deduction: 25_000

- name: A survivor who is not a surviving spouse does not count survivor benefits.
  period: 2025
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay_survivors: 25_000
  output:
    id_eligible_military_retirement_income: 0
    id_retirement_benefits_deduction: 0

- name: A recipient keeps own retired pay when non-spouse survivor benefits are present.
  period: 2025
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay: 30_000
    military_retirement_pay_survivors: 25_000
  output:
    id_eligible_military_retirement_income: 30_000
    id_retirement_benefits_deduction: 30_000

- name: A remarried survivor filing separately does not count survivor benefits.
  period: 2025
  input:
    people:
      survivor:
        age: 65
        is_surviving_spouse: true
        military_retirement_pay_survivors: 25_000
      new_spouse:
        age: 65
    families:
      family:
        members: [survivor, new_spouse]
    marital_units:
      couple:
        members: [survivor, new_spouse]
    tax_units:
      survivor_return:
        members: [survivor]
        filing_status: SEPARATE
      spouse_return:
        members: [new_spouse]
        filing_status: SEPARATE
    households:
      household:
        members: [survivor, new_spouse]
        state_code: ID
  output:
    id_eligible_military_retirement_income: [0, 0]
    id_retirement_benefits_deduction: [0, 0]

- name: An unmarried widow stays eligible when a married adult child shares the family.
  period: 2025
  input:
    people:
      survivor:
        age: 65
        is_surviving_spouse: true
        military_retirement_pay_survivors: 25_000
      adult_child:
        age: 40
      child_spouse:
        age: 40
    families:
      family:
        members: [survivor, adult_child, child_spouse]
    marital_units:
      widow:
        members: [survivor]
      couple:
        members: [adult_child, child_spouse]
    tax_units:
      survivor_return:
        members: [survivor]
        filing_status: SINGLE
      child_return:
        members: [adult_child, child_spouse]
        filing_status: JOINT
    households:
      household:
        members: [survivor, adult_child, child_spouse]
        state_code: ID
  output:
    id_eligible_military_retirement_income: [25_000, 0, 0]
    id_retirement_benefits_deduction: [25_000, 0]
