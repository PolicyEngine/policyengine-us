# Idaho Code 63-3022A(4): "disabled" means a disabled person described in
# section 63-701 (recognized as disabled by the Social Security
# Administration, the Railroad Retirement Board or "the office of management
# and budget pursuant to title 5", or, "if a person is not within the purview
# of" any other listed entity, by the person's public employee retirement
# system or disability plan; or "A disabled veteran of any war engaged in by
# the United States" with a VA service-connected disability of 10% or more or
# a VA nonservice-connected disability pension), or a person with a
# physician-certified permanent disability under section 49-117(7)(b)(iv).
# A supplied id_retirement_benefits_disability_classification decides, in the
# year it is supplied for. When it is unspecified, an SSDI award (the Social
# Security Administration's finding) or is_disabled classifies the person;
# nothing else does.

- name: A person with no disability facts is not classified as disabled.
  period: 2025
  input:
    state_code: ID
    age: 45
  output:
    id_retirement_benefits_deduction_disabled: false

- name: Social Security disability insurance benefits show recognition by the Social Security Administration.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_disability: 10_000
  output:
    id_retirement_benefits_deduction_disabled: true

- name: Meeting the SSI disability test alone does not classify a person as disabled.
  period: 2025
  input:
    state_code: ID
    age: 45
    meets_ssi_disability_criteria: true
  output:
    # The SSI disability test is the model's test, not a finding by the
    # Social Security Administration. Supply DISABLED for an SSI disability
    # award.
    is_ssi_disabled: true
    id_retirement_benefits_deduction_disabled: false

- name: A veteran fully disabled by a service-connected disability is not classified as disabled without the Idaho classification.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_fully_disabled_service_connected_veteran: true
  output:
    # Section 63-701(1)(e) also needs service in a war engaged in by the
    # United States, which the model doesn't record.
    id_retirement_benefits_deduction_disabled: false

- name: Permanent and total disability alone does not classify a person as disabled.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_permanently_and_totally_disabled: true
  output:
    # 26 U.S.C. 22(e)(3) is a federal tax test, not a recognition 63-701 or
    # 49-117 lists.
    id_retirement_benefits_deduction_disabled: false

- name: The general disability input stands for the groups PolicyEngine has no input for.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_disabled: true
  output:
    id_retirement_benefits_deduction_disabled: true

- name: The supplied classification admits a wartime veteran with a service-connected rating.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_fully_disabled_service_connected_veteran: true
    id_retirement_benefits_disability_classification: DISABLED
  output:
    id_retirement_benefits_deduction_disabled: true

- name: A supplied NOT_DISABLED overrides an SSDI award and the general disability input.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_disability: 10_000
    is_disabled: true
    id_retirement_benefits_disability_classification: NOT_DISABLED
  output:
    id_retirement_benefits_deduction_disabled: false

- name: A supplied UNSPECIFIED gives the default.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_disability: 10_000
    id_retirement_benefits_disability_classification: UNSPECIFIED
  output:
    id_retirement_benefits_deduction_disabled: true

- name: One spouse's supplied classification leaves the other spouse's SSDI default in place.
  period: 2025
  input:
    people:
      head:
        age: 45
        is_disabled: true
        id_retirement_benefits_disability_classification: NOT_DISABLED
      spouse:
        age: 45
        social_security_disability: 10_000
        military_retirement_pay: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_disabled: [false, true]
    # The spouse is classified as disabled (63-3022A(1)(b)(i)), so the
    # spouse's $20,000 of military retired pay counts.
    id_retirement_benefits_deduction_military_eligible_person: [false, true]
    id_retirement_benefits_deduction: 20_000

- name: A classification supplied only for 2024 does not apply in 2025, so the SSDI default decides.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_disability: 10_000
    id_retirement_benefits_disability_classification:
      2024: NOT_DISABLED
  output:
    id_retirement_benefits_disability_classification: UNSPECIFIED
    id_retirement_benefits_deduction_disabled: true

- name: A classification supplied for 2025 replaces the 2024 one in 2025.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_disability: 10_000
    id_retirement_benefits_disability_classification:
      2024: DISABLED
      2025: NOT_DISABLED
  output:
    id_retirement_benefits_deduction_disabled: false

- name: 2025 a spouse's DISABLED supplied only for 2024 does not admit the spouse's 2025 public pension.
  period: 2025
  input:
    people:
      head:
        age: 63
      spouse:
        age: 63
        public_pension_income: 20_000
        id_retirement_benefits_disability_classification:
          2024: DISABLED
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ID
  output:
    # The spouse has no 2025 classification, SSDI or is_disabled, so at 63
    # the spouse fails the (1)(a) test. The 2024 classification would admit
    # the $20,000 pension if it applied in 2025.
    id_retirement_benefits_disability_classification: [UNSPECIFIED, UNSPECIFIED]
    id_retirement_benefits_deduction_disabled: [false, false]
    id_retirement_benefits_deduction: 0

- name: 2025 the head's own 2025 classification leaves the spouse's 2025 classification unspecified.
  period: 2025
  input:
    people:
      head:
        age: 63
        id_retirement_benefits_disability_classification:
          2025: NOT_DISABLED
      spouse:
        age: 63
        public_pension_income: 20_000
        id_retirement_benefits_disability_classification:
          2024: DISABLED
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ID
  output:
    # The spouse's 2025 value is the spouse's own default whether or not the
    # head supplies a classification for 2025.
    id_retirement_benefits_disability_classification: [NOT_DISABLED, UNSPECIFIED]
    id_retirement_benefits_deduction_disabled: [false, false]
    id_retirement_benefits_deduction: 0

- name: Blindness alone does not count.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_blind: true
  output:
    # Section 63-701(1)(g) lists blindness as a group of its own, not as a
    # disabled person, and the Form 39R list of who is classified as
    # disabled leaves it out.
    id_retirement_benefits_deduction_disabled: false

- name: Social Security survivor benefits are not a finding of disability.
  period: 2025
  input:
    state_code: ID
    age: 45
    social_security_survivors: 10_000
  output:
    id_retirement_benefits_deduction_disabled: false

- name: Veterans benefits alone do not show a disability rating.
  period: 2025
  input:
    state_code: ID
    age: 45
    veterans_benefits: 10_000
  output:
    # veterans_benefits combines disability compensation with pensions,
    # survivor benefits and education benefits.
    id_retirement_benefits_deduction_disabled: false
