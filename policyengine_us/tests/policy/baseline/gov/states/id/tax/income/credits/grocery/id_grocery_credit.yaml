- name: Integration test, no aged credit in 2025
  # In 2025, base grocery credit is $155 per person and aged credit is not in effect
  # Two people at $155 each = $310 total
  period: 2025
  input:
    people:
      person1:
        age: 70
      person2:
        age: 70
    households:
      household:
        members: [person1, person2]
        state_code: ID
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap: 0
  output:
    id_grocery_credit: 310


- name: 2025 claimed single filer receives no food tax credit
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        id_grocery_credit_qualified_months: 12
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
        id_grocery_credit_qualified_months: 12
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: ID
  output:
    # Idaho Code 63-3024A: a credit per taxpayer, spouse and claimed
    # dependent; a claimed filer gets none and the return
    # has no dependents (IRC 152(b)(1)).
    id_grocery_credit: 0

- name: 2025 joint return keeps the unclaimed spouse's food tax credit when the head is claimed
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5_000
        id_grocery_credit_qualified_months: 12
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 5_000
        id_grocery_credit_qualified_months: 12
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        id_grocery_credit_qualified_months: 12
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: ID
  output:
    id_grocery_credit: 155

