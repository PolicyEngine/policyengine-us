        members: [filer]
    households:
      household:
        members: [filer]
        state_code: ID
  output:
    # Idaho Code 63-3024A(4) allows one credit per personal exemption:
    # the taxpayer who claims this filer takes the $100, so 0 x $100 = 0.
    id_grocery_credit: 0


