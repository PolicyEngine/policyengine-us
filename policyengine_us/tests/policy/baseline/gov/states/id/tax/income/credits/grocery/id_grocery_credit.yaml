- name: 2025 single filer who can be claimed but is not claimed keeps the food tax credit
  period: 2025
  input:
    people:
      filer:
        age: 30
        is_tax_unit_head: true
        employment_income: 10_000
        id_grocery_credit_qualified_months: 12
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: ID
  output:
    # Idaho Code 63-3024A(1), (4): 1 x $155, with no duplicate claim.
    id_grocery_credit: 155


