- name: Two people fully eligible
  period: 2022
  input:
    people:
      person1:
        id_grocery_credit_qualified_months: 12
        id_grocery_credit_base: 100
        id_grocery_credit_aged: 20
      person2:
        id_grocery_credit_qualified_months: 12
        id_grocery_credit_base: 100
        id_grocery_credit_aged: 20
    households: 
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_grocery_credit: 240

