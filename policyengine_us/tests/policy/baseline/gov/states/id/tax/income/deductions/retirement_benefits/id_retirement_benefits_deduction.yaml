- name: Separate ineligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: No benefit amount if no eligible income
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 45_000
        id_retirement_benefits_deduction_relevant_income: 0
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: The deduction is capped at the social security benefits amounts
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 40_140
        id_retirement_benefits_deduction_relevant_income: 38_700
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: Only the social security benefits amount of the head or spouse is considered
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 15_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
      person3:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: JOINT 
    households:
      household:
        members: [person1, person2, person3]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 35_210

- name: Test for the surviving spouse case
  period: 2022
  input:
    people:
      person1:
        id_retirement_benefits_deduction_eligible_person: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 30_000
      person2:
        id_retirement_benefits_deduction_eligible_person: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SURVIVING_SPOUSE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 30_000

- name: Idaho general retirement deduction excludes non-spouse military survivor benefits before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 0
    id_retirement_benefits_deduction: 0

- name: Idaho general retirement deduction includes an unremarried surviving spouse before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: true
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000

- name: Idaho general retirement deduction retains own military pay before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000

- name: Idaho reduces the cap by every railroad tier, taxable or not, and by Social Security.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 67
        public_pension_income: 20_000
        social_security_retirement: 5_000
        railroad_social_security_equivalent_benefits: 25_000
        taxable_railroad_pension_benefits: 3_000
        tax_exempt_railroad_pension_benefits: 2_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: ID
  output:
    # Form 39R: line 8a 48,216; line 8b 25,000 + 3,000 + 2,000 = 30,000;
    # line 8c 5,000; line 8d 13,216; line 8e 20,000; line 8f 13,216.
    id_retirement_benefits_deduction: 13_216
