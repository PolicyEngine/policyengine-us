- name: Separate ineligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: No benefit amount if no eligible income
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 45_000
        id_retirement_benefits_deduction_relevant_income: 0
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: The deduction is capped at the social security benefits amounts
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 40_140
        id_retirement_benefits_deduction_relevant_income: 38_700
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: Only the social security benefits amount of the head or spouse is considered
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 15_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
      person3:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: JOINT 
    households:
      household:
        members: [person1, person2, person3]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 35_210

- name: Test for the surviving spouse case
  period: 2022
  input:
    people:
      person1:
        id_retirement_benefits_deduction_eligible_person: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 30_000
      person2:
        id_retirement_benefits_deduction_eligible_person: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SURVIVING_SPOUSE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 30_000

# Military retirement benefits under the deduction's cap from 2025 (Idaho
# Code 63-3022A(1)(b), (2) and (3); Form 39R lines 8a to 8f). The cap is
# $48,216 single and $72,324 joint for 2025, and $0 on a separate return. The
# model reduces it by the head's and spouse's Social Security retirement
# benefits. 63-3022A(3) and line 8b also subtract Railroad Retirement Act
# benefits, which the model does not subtract yet.

- name: 2025 military retired pay and a public pension share the $48,216 single cap.
  period: 2025
  input:
    state_code: ID
    age: 66
    military_retirement_pay: 40_000
    public_pension_income: 20_000
  output:
    id_retirement_benefits_deduction_relevant_income: 60_000
    id_retirement_benefits_deduction: 48_216

- name: 2025 Social Security benefits reduce the cap on military retired pay.
  period: 2025
  input:
    state_code: ID
    age: 66
    military_retirement_pay: 40_000
    social_security_retirement: 20_000
  output:
    # 48,216 - 20,000
    id_retirement_benefits_deduction: 28_216

- name: 2025 retired couple's Social Security reduces the $72,324 joint cap.
  period: 2025
  input:
    people:
      retiree:
        age: 67
        military_retirement_pay: 45_000
        social_security_retirement: 30_000
      spouse:
        age: 65
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_relevant_income: [45_000, 0]
    # 72,324 - 30,000
    id_retirement_benefits_deduction: 42_324

- name: 2025 a married retiree filing separately cannot deduct military retired pay.
  period: 2025
  input:
    people:
      retiree:
        age: 66
        military_retirement_pay: 30_000
      spouse:
        age: 66
    marital_units:
      couple:
        members: [retiree, spouse]
    tax_units:
      retiree_return:
        members: [retiree]
        filing_status: SEPARATE
      spouse_return:
        members: [spouse]
        filing_status: SEPARATE
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction: [0, 0]

- name: 2025 an unremarried widow under 62 without a job or disability cannot deduct survivor benefits.
  period: 2025
  input:
    state_code: ID
    age: 50
    is_surviving_spouse: true
    military_retirement_pay_survivors: 25_000
  output:
    id_retirement_benefits_deduction: 0

- name: 2025 an unremarried widow aged 62 deducts survivor benefits.
  period: 2025
  input:
    state_code: ID
    age: 62
    is_surviving_spouse: true
    military_retirement_pay_survivors: 25_000
  output:
    id_retirement_benefits_deduction: 25_000

- name: 2025 the deduction reduces Idaho AGI.
  period: 2025
  input:
    state_code: ID
    age: 40
    employment_income: 50_000
    military_retirement_pay: 30_000
  output:
    id_retirement_benefits_deduction: 30_000
    id_subtractions: 30_000

- name: Idaho general retirement deduction excludes non-spouse military survivor benefits before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 0
    id_retirement_benefits_deduction: 0

- name: Idaho general retirement deduction includes an unremarried surviving spouse before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: true
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000

- name: Idaho general retirement deduction retains own military pay before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000
