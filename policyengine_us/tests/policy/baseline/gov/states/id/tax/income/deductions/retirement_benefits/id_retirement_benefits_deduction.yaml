- name: Separate ineligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: No benefit amount if no eligible income
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 45_000
        id_retirement_benefits_deduction_relevant_income: 0
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: The deduction is capped at the social security benefits amounts
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 40_140
        id_retirement_benefits_deduction_relevant_income: 38_700
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 0

- name: Only the social security benefits amount of the head or spouse is considered
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 15_000
        id_retirement_benefits_deduction_relevant_income: 45_000
      person2:
        is_tax_unit_head_or_spouse: true
        social_security_retirement: 10_000
      person3:
        is_tax_unit_head_or_spouse: false
        social_security_retirement: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: JOINT 
    households:
      household:
        members: [person1, person2, person3]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 35_210

- name: Test for the surviving spouse case
  period: 2022
  input:
    people:
      person1:
        id_retirement_benefits_deduction_eligible_person: true
        social_security_retirement: 10_000
        id_retirement_benefits_deduction_relevant_income: 30_000
      person2:
        id_retirement_benefits_deduction_eligible_person: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SURVIVING_SPOUSE 
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 30_000

- name: Idaho general retirement deduction excludes non-spouse military survivor benefits before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 0
    id_retirement_benefits_deduction: 0

- name: Idaho general retirement deduction includes an unremarried surviving spouse before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: true
    military_retirement_pay_survivors: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000

- name: Idaho general retirement deduction retains own military pay before 2025.
  period: 2024
  input:
    state_code: ID
    age: 65
    is_surviving_spouse: false
    military_retirement_pay: 10_000
  output:
    id_retirement_benefits_deduction_relevant_income: 10_000
    id_retirement_benefits_deduction: 10_000

# Idaho Code 63-3022A(2) caps the deduction at SSA's maximum benefit for a
# worker reaching full retirement age: $4,152 a month in 2026, so $49,824 for
# a single filer and 1.5 times that, $74,736, on a joint return.

- name: Idaho 2026 retirement benefits cap for a single filer.
  period: 2026
  input:
    people:
      person1:
        id_retirement_benefits_deduction_relevant_income: 60_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 49_824

- name: Idaho 2026 retirement benefits cap on a joint return.
  period: 2026
  input:
    people:
      person1:
        id_retirement_benefits_deduction_relevant_income: 80_000
      person2:
        id_retirement_benefits_deduction_relevant_income: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_retirement_benefits_deduction: 74_736

- name: Idaho 2026 retirement benefits cap less Social Security retirement benefits.
  period: 2026
  input:
    people:
      person1:
        id_retirement_benefits_deduction_relevant_income: 60_000
        social_security_retirement: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    # 49,824 - 20,000
    id_retirement_benefits_deduction: 29_824

