# Idaho Code 63-3022A(1)(b)(iii): employed, with enough income from that
# employment to have to file a federal return "under section 6012(a)(1)".
# For 2025 the model applies section 6012(f), which replaces (a)(1) for 2018
# to 2025: gross income over the standard deduction ($15,750 single and
# $31,500 joint, plus $2,000 unmarried or $1,600 married for each of age 65
# and blindness), and any gross income on a separate return. 2026 applies
# section 6012(a)(1): gross income of at least the basic standard deduction
# ($16,100 single and $32,200 joint, Rev. Proc. 2025-32), plus $2,050
# unmarried or $1,650 married for each spouse aged 65 or older. A separate
# return has no exception in 2026, so its threshold is the exemption amount,
# $0, and the test turns on having income from employment at all.

- name: 2025 single filer with wages equal to the standard deduction does not meet the test.
  period: 2025
  input:
    state_code: ID
    age: 45
    employment_income: 15_750
  output:
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: 2025 single filer with wages a dollar over the standard deduction meets the test.
  period: 2025
  input:
    state_code: ID
    age: 45
    employment_income: 15_751
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: 2025 blindness raises the single threshold to $17,750.
  period: 2025
  input:
    state_code: ID
    age: 45
    is_blind: true
    employment_income: 17_750
  output:
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: 2026 single filer with wages a dollar under the basic standard deduction does not meet the test.
  period: 2026
  input:
    state_code: ID
    age: 45
    employment_income: 16_099
  output:
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: 2026 single filer with wages equal to the basic standard deduction meets the test.
  period: 2026
  input:
    state_code: ID
    age: 45
    employment_income: 16_100
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: 2026 blindness does not raise the threshold.
  period: 2026
  input:
    state_code: ID
    age: 45
    is_blind: true
    employment_income: 16_100
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: 2025 a married person filing separately meets the test with any wages.
  period: 2025
  input:
    state_code: ID
    age: 45
    filing_status: SEPARATE
    employment_income: 5_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: 2026 a married person filing separately with no income from employment does not meet the test.
  period: 2026
  input:
    state_code: ID
    age: 45
    filing_status: SEPARATE
  output:
    # The separate return's 2026 threshold is $0, which no income from
    # employment would otherwise meet.
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: 2026 joint return uses the joint threshold, and a dollar under it fails.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        employment_income: 32_199
      spouse:
        age: 43
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_military_employment_eligible: [false, false]

- name: 2026 joint return compares the retiree's own wages with the joint threshold, whatever the spouse earns.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        employment_income: 20_000
      spouse:
        age: 43
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    # The couple must file ($60,000 of wages), but the retiree's $20,000 is
    # under the $32,200 joint threshold. The spouse's $40,000 meets it.
    id_retirement_benefits_deduction_military_employment_eligible: [false, true]

- name: 2026 joint return with wages equal to the joint threshold meets the test for the employed spouse only.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        employment_income: 32_200
      spouse:
        age: 43
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_military_employment_eligible: [true, false]

- name: 2026 a spouse aged 65 raises the joint threshold to $33,850.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        employment_income: 33_849
      spouse:
        age: 66
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_military_employment_eligible: [false, false]

- name: 2026 joint return with wages at the $33,850 threshold meets the test.
  period: 2026
  input:
    people:
      retiree:
        age: 45
        employment_income: 33_850
      spouse:
        age: 66
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_military_employment_eligible: [true, false]

- name: 2025 a spouse aged 65 raises the joint standard deduction to $33,100.
  period: 2025
  input:
    people:
      retiree:
        age: 45
        employment_income: 33_100
      spouse:
        age: 66
    tax_units:
      tax_unit:
        members: [retiree, spouse]
        filing_status: JOINT
    households:
      household:
        members: [retiree, spouse]
        state_code: ID
  output:
    id_retirement_benefits_deduction_military_employment_eligible: [false, false]

- name: Self-employment profit counts as income from employment.
  period: 2026
  input:
    state_code: ID
    age: 45
    self_employment_income: 20_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: Profit from a specified service trade or business counts as income from employment.
  period: 2026
  input:
    state_code: ID
    age: 45
    sstb_self_employment_income: 20_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: Farm profit counts as income from employment.
  period: 2026
  input:
    state_code: ID
    age: 45
    farm_operations_income: 20_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: 2025 a business profit under the section 6012 threshold does not meet the test.
  period: 2025
  input:
    state_code: ID
    age: 45
    self_employment_income: 5_000
  output:
    # Section 6017 requires a self-employment tax return at $400 of net
    # earnings. Idaho Code 63-3022A(1)(b)(iii) names section 6012(a)(1), so
    # the test is the gross income threshold ($15,750).
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: A business loss does not reduce wages.
  period: 2026
  input:
    state_code: ID
    age: 45
    employment_income: 20_000
    self_employment_income: -10_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: true

- name: Pension and investment income are not income from employment.
  period: 2026
  input:
    state_code: ID
    age: 45
    military_retirement_pay: 30_000
    taxable_interest_income: 20_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: false

- name: The employment test does not apply before 2025.
  period: 2024
  input:
    state_code: ID
    age: 45
    employment_income: 100_000
  output:
    id_retirement_benefits_deduction_military_employment_eligible: false
