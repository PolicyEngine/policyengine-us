- name: Case 1, default id_other_subtractions is zero
  period: 2024
  input:
    state_code: ID
    employment_income: 50_000
  output:
    id_other_subtractions: 0
    id_subtractions: 0
    id_agi: 50_000

- name: Case 2, id_other_subtractions reduces ID AGI
  period: 2024
  input:
    state_code: ID
    employment_income: 50_000
    id_other_subtractions: 2_000
  output:
    id_other_subtractions: 2_000
    id_subtractions: 2_000
    id_agi: 48_000

- name: Case 3, id_other_subtractions reduces ID AGI in 2025
  period: 2025
  input:
    state_code: ID
    employment_income: 50_000
    id_other_subtractions: 2_000
  output:
    id_other_subtractions: 2_000
    id_subtractions: 2_000
    id_agi: 48_000
