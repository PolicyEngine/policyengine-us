# Component test: the Idaho qualifying-child count and precredit liability are
# independent known premises. This does not test federal or child eligibility.
# 2018 HB463 section 6 created the credit for taxable years beginning in 2018:
# https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2018/legislation/H0463.pdf#page=7
# HB675 section 2 subsequently increased the 2018 amount retroactively to $205:
# https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2018/legislation/H0675.pdf#page=1
- name: Case 1, Idaho child tax credit is absent before its 2018 enactment.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
        id_ctc_qualifying_children: 1
        id_income_tax_before_non_refundable_credits: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_ctc: 0
    id_non_refundable_credits: 0

# Same component premises in the constructor's earliest modeled years. The
# enacted credit begins in 2018, so neither year has a worksheet or applied credit.

- name: Case 2, Idaho child tax credit is absent in the first modeled year.
  period: 2015
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
        id_ctc_qualifying_children: 1
        id_income_tax_before_non_refundable_credits: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_ctc: 0
    id_non_refundable_credits: 0

- name: Case 3, Idaho child tax credit is absent in the year before 2017.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
        id_ctc_qualifying_children: 1
        id_income_tax_before_non_refundable_credits: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
