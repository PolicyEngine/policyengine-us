      spm_unit:
        members: *id001
        takes_up_snap_if_eligible: true
    families:
      family:
        members: *id001
    marital_units:
      marital_unit:
        members: *id001
    households:
      household:
        members: *id001
        state_code: ID
        household_vehicles_value: 2660.0
  output:
