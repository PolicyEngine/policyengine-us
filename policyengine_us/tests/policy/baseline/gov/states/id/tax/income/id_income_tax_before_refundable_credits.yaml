    people:
      head:
        age: 56
        employment_income: 0.0
        bank_account_assets: 71500.0
        employer_sponsored_insurance_premiums: 6309.27587890625
        has_esi: true
        health_insurance_premiums_without_medicare_part_b: 2080.0
        hours_worked_last_week: 50.0
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        other_health_insurance_premiums: 2080.0
        other_medical_expenses: 150.0
        pre_subsidy_rent: 18352.94140625
        social_security_disability: 19285.0
        tax_exempt_private_pension_income: 284.1176452636719
        taxable_private_pension_income: 35280.0
        weekly_hours_worked_before_lsr: 50.0
        takes_up_medicaid_if_eligible: true
        takes_up_ssi_if_eligible: true
    tax_units:
      tax_unit:
        members: &id001
        - head
        takes_up_aca_if_eligible: true
        takes_up_dc_ptc: true
        takes_up_eitc: true
        would_file_if_eligible_for_refundable_credit: true
