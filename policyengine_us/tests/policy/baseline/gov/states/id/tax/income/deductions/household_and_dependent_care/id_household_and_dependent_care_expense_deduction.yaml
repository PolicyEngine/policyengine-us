- name: Care expenses for a disabled adult qualifying individual enter the deduction base
  period: 2022
  input:
    tax_unit_childcare_expenses: 0
    care_expenses: 3_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 4_000
    state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 3_000

# Idaho Form 39R Line 6 worksheet line 4 reduces the operative cap by the IRC
# § 129 employer-provided dependent care benefits ("excluded benefits from Part
# III of Form 2441"). Here the reduced $12,000 cap binds below the expenses.
- name: Section 129 employer benefits reduce the Idaho deduction cap
  period: 2023
  input:
    tax_unit_childcare_expenses: 10_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 60_000
    dependent_care_assistance_exclusion: 5_000
    state_code: ID
  output:
    # min(10_000 expenses, max(6_000, 12_000) - 5_000 = 7_000, 60_000) = 7_000.
    id_household_and_dependent_care_expense_deduction: 7_000

# The Form 2441 Part III excluded benefits follow IRC § 129(a)(2)(C): a
# separate filer living apart from their spouse is unmarried under § 21(e)(4)
# and excludes the full $4,000 rather than the $2,500 MFS cap.
- name: Separate filer treated as unmarried has the cap reduced by the full exclusion
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        tax_unit_childcare_expenses: 10_000
        id_cdcc_limit: 3_000
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    dependent_care_assistance_exclusion: 4_000
    # min(10_000 expenses, max(3_000, 12_000) - 4_000 = 8_000, 38_000) = 8_000.
    id_household_and_dependent_care_expense_deduction: 8_000
