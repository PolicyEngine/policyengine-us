- name: Federal cdcc calculation with a cap at earned income
  period: 2022
  input:
    tax_unit_childcare_expenses: 13_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 4_000
    state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 4_000

- name: Capped after 2023
  period: 2023
  input:
    tax_unit_childcare_expenses: 13_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 14_000    
    state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 12_000

- name: Integration test for the 2022 calculation
  period: 2022
  input:
    people:
      person1: 
        earned_income: 7_000
        age: 40
      person2:
        earned_income: 10_000
        age: 40
      person3:
        age: 10
      person4:
        age: 10
      person5:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        tax_unit_childcare_expenses: 10_000
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 6_000

- name: Integration test for the 2022 calculation
  period: 2023
  input:
    people:
      person1: 
        earned_income: 14_000
        age: 40
      person2:
        earned_income: 18_000
        age: 40
      person3:
        age: 10
      person4:
        age: 10
      person5:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        tax_unit_childcare_expenses: 17_000
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 12_000

- name: In 2021 Idaho applies the ARPA $16,000 limit
  period: 2021
  input:
    people:
      person1: 
        earned_income: 14_000
        age: 40
      person2:
        earned_income: 18_000
        age: 40
      person3:
        age: 10
      person4:
        age: 10
      person5:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        tax_unit_childcare_expenses: 17_000
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: ID
  output:
    # min(17_000 expenses, 2 x 8_000 = 16_000, 14_000 lesser earnings).
    id_household_and_dependent_care_expense_deduction: 14_000

- name: Care expenses for a disabled adult qualifying individual enter the deduction base
  period: 2022
  input:
    tax_unit_childcare_expenses: 0
    care_expenses: 3_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 4_000
    state_code: ID
  output:
    id_household_and_dependent_care_expense_deduction: 3_000

# Idaho Form 39R Line 6 worksheet line 4 reduces the operative cap by the IRC
# § 129 employer-provided dependent care benefits ("excluded benefits from Part
# III of Form 2441"). Here the reduced $12,000 cap binds below the expenses.
- name: Section 129 employer benefits reduce the Idaho deduction cap
  period: 2023
  input:
    tax_unit_childcare_expenses: 10_000
    id_cdcc_limit: 6_000
    min_head_spouse_earned: 60_000
    dependent_care_assistance_exclusion: 5_000
    state_code: ID
  output:
    # min(10_000 expenses, max(6_000, 12_000) - 5_000 = 7_000, 60_000) = 7_000.
    id_household_and_dependent_care_expense_deduction: 7_000

# The Form 2441 Part III excluded benefits follow IRC § 129(a)(2)(C): a
# separate filer living apart from their spouse is unmarried under § 21(e)(4)
# and excludes the full $4,000 rather than the $2,500 MFS cap.
- name: Separate filer treated as unmarried has the cap reduced by the full exclusion
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        tax_unit_childcare_expenses: 10_000
        id_cdcc_limit: 3_000
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    dependent_care_assistance_exclusion: 4_000
    # min(10_000 expenses, max(3_000, 12_000) - 4_000 = 8_000, 38_000) = 8_000.
    id_household_and_dependent_care_expense_deduction: 8_000
# 2021 Form 39R Line 6 worksheet: line 2 is $8,000 ($16,000) under the Tax
# Commission's 2021 instruction changes, and line 3 enters the excluded
# benefits from federal Form 2441 Part III, which uses the 2021 $10,500 IRC
# section 129 cap. H.B. 472 (2022) conformed Idaho to the IRC as in effect on
# January 1, 2022.
- name: 2021 worksheet uses the $16,000 limit less the $10,500-capped exclusion
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      person2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 40_000
      person3:
        age: 5
        is_tax_unit_dependent: true
      person4:
        age: 3
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
        filing_status: JOINT
        tax_unit_childcare_expenses: 20_000
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: ID
  output:
    # 2 x $8,000.
    id_cdcc_limit: 16_000
    # min($9,000, $10,500, $40,000) = $9,000.
    dependent_care_assistance_exclusion: 9_000
    # min($20,000, $16,000 - $9,000, $40,000) = $7,000.
    id_household_and_dependent_care_expense_deduction: 7_000

- name: 2021 worksheet with one child and benefits above the pre-ARPA cap
  period: 2021
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 6_000
      person2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 40_000
      person3:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: JOINT
        tax_unit_childcare_expenses: 12_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: ID
  output:
    # min($12,000, $8,000 - $6,000, $40,000) = $2,000.
    id_household_and_dependent_care_expense_deduction: 2_000
