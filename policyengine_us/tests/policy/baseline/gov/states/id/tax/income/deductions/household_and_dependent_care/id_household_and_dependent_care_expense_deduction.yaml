- name: 2025 single filer who can be claimed as a dependent deducts care for a disabled dependent
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 10_000
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      dependent:
        age: 14
        is_incapable_of_self_care: true
        care_expenses: 1_000
    tax_units:
      tax_unit:
        members: [filer, dependent]
    households:
      household:
        members: [filer, dependent]
        state_code: ID
  output:
    # IRC 21(b)(1)(B) determines dependency without regard
    # to IRC 152(b)(1): min(1,000, 12,000, 10,000).
    id_household_and_dependent_care_expense_deduction: 1_000
