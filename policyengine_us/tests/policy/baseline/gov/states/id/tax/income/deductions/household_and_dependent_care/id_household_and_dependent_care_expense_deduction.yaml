        earned_income: 7_000
        age: 40
      person2:
        earned_income: 10_000
        age: 40
      person3:
        age: 10
      person4:
        age: 10
      person5:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
