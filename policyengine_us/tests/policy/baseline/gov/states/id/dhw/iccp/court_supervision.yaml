# Verified court-supervision pathways and independent eligibility requirements.
- name: ID constant-supervision plan extends age without disability
  period: 2026-09
  input:
    state_code:
      2026: [ID, ID, ID, ID, ID, ID]
    age:
      2026: [12, 13, 17, 18, 19, 40]
    id_iccp_has_constant_supervision_plan:
      2026: [true, true, true, true, true, true]
  output:
    id_iccp_eligible_child: [true, true, true, true, false, false]
    is_disabled: false
    receives_or_needs_protective_services: false

- name: ID court status and child-care order do not establish constant supervision
  period: 2026-09
  input:
    state_code:
      2026: [ID, ID, ID]
    age:
      2026: [13, 17, 18]
    is_under_court_supervision:
      2026: [true, true, true]
    requires_childcare_under_court_order:
      2026: [true, true, true]
  output:
    id_iccp_eligible_child: false
    id_iccp_has_constant_supervision_plan: false

- name: ID supervision plan does not bypass immigration
  period: 2026-09
  input:
    state_code:
      2026: ID
    age:
      2026: 17
    id_iccp_has_constant_supervision_plan:
      2026: true
    immigration_status:
      2026: UNDOCUMENTED
  output:
    id_iccp_eligible_child: false

- name: ID supervised teenager receives child-care benefit through full pipeline
  period: 2026-09
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 12000
        weekly_hours_worked_before_lsr:
          2026: 25
      child:
        age:
          2026: 17
        is_tax_unit_dependent:
          2026: true
        is_in_k12_school:
          2026: true
        childcare_hours_per_week:
          2026: 30
        childcare_hours_per_day:
          2026: 6
        childcare_days_per_week:
          2026: 5
        childcare_attending_days_per_month:
          2026: 20
        pre_subsidy_childcare_expenses:
          2026: 1200
        id_iccp_has_constant_supervision_plan:
          2026: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses:
          2026: 1200
    households:
      household:
        members: [parent, child]
        state_code:
          2026: ID
        county_str:
          2026: ADA_COUNTY_ID
  output:
    id_iccp_eligible_child: [false, true]
    id_iccp_eligible: true
    id_iccp: 80

