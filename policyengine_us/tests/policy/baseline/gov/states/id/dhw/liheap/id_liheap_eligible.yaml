- name: Single person under income limit is eligible
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        spm_unit_gross_income: 2_000 * 12  # Under $2,530.42/month limit
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_liheap_eligible:
      - True

- name: Single person over income limit is not eligible
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        spm_unit_gross_income: 3_000 * 12  # Over $2,530.42/month limit
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_liheap_eligible:
      - False

- name: Two person household at income limit is eligible
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
      person2:
        age: 30
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap: 0
        spm_unit_gross_income: 3_309 * 12  # At $3,309/month limit
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    id_liheap_eligible:
      - True
      - True

- name: SNAP participant is presumptively eligible
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
    spm_units:
      spm_unit:
        members: [person1]
        snap: 100 * 12  # Receiving SNAP
        spm_unit_gross_income: 4_000 * 12  # Over income limit
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_liheap_eligible:
      - True

- name: Large household (8 persons) income test
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
      person2:
        age: 32
      child1:
        age: 10
      child2:
        age: 8
      child3:
        age: 6
      child4:
        age: 4
      child5:
        age: 2
      child6:
        age: 1
    spm_units:
      spm_unit:
        members: [person1, person2, child1, child2, child3, child4, child5, child6]
        snap: 0
        spm_unit_gross_income: 6_500 * 12  # Under $6,590/month limit for 8
    households:
      household:
        members: [person1, person2, child1, child2, child3, child4, child5, child6]
        state_code: ID
  output:
    id_liheap_eligible:
      - True
      - True
      - True
      - True
      - True
      - True
      - True
      - True

- name: Non-Idaho resident is not eligible
  absolute_error_margin: 0
  period: 2025
  input:
    people:
      person1:
        age: 35
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        spm_unit_gross_income: 1_000 * 12  # Well under income limit
    households:
      household:
        members: [person1]
        state_code: CA  # Not Idaho
  output:
    id_liheap_eligible:
      - False