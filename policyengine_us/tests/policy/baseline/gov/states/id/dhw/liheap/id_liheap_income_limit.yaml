- name: Income limit for single person household
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 35
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    id_liheap_income_limit:
      - 2_530.42 * 12  # Annual limit for 1 person

