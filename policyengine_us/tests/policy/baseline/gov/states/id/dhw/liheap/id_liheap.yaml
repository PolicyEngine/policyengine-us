# Expected amounts come from the PY26 Benefit Determination Chart and its summary (pages 1-2).
# https://liheapch.acf.gov/docs/2026/benefits-matricies/ID_BenefitMatrix_Heating_2026.pdf#page=1
# Burden = estimated annual heating cost / annual income, with the PY2007 costs:
# electricity 1_335, 1_455, 1_605; natural gas 977, 1_100, 1_207;
# oil or propane 1_625, 1_845, 2_145; coal or wood 1_200, 1_600, 1_800 (Areas I, II, III).
# Ada County is Area I, Bannock County Area II, Bear Lake County Area III.
# Low burden is under 6%, medium 6% to under 11%, high 11% or more.
# Income 40_000 is low and 8_000 high for every fuel and area.
# Cases 1 to 8 set has_heating_expense directly; a bill would not change the amount.

- name: Case 1, electric heat pays the Idaho Power and Southern Utilities column in every cell.
  period: 2026
  absolute_error_margin: 0.01
  # Income 16_000 is medium: 8.34%, 9.09%, 10.03%.
  input:
    state_code: [ID, ID, ID, ID, ID, ID, ID, ID, ID]
    county: [ADA_COUNTY_ID, ADA_COUNTY_ID, ADA_COUNTY_ID,
             BANNOCK_COUNTY_ID, BANNOCK_COUNTY_ID, BANNOCK_COUNTY_ID,
             BEAR_LAKE_COUNTY_ID, BEAR_LAKE_COUNTY_ID, BEAR_LAKE_COUNTY_ID]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY,
                   ELECTRICITY, ELECTRICITY, ELECTRICITY,
                   ELECTRICITY, ELECTRICITY, ELECTRICITY]
    id_liheap_countable_income: [40_000, 16_000, 8_000,
                                 40_000, 16_000, 8_000,
                                 40_000, 16_000, 8_000]
    id_liheap_income_eligible: [true, true, true, true, true, true, true, true, true]
    has_heating_expense: [true, true, true, true, true, true, true, true, true]
  output:
    id_liheap: [328, 342, 355,
                378, 394, 410,
                429, 447, 464]

