- name: Case 2, no qualified member has zero income limit.
  period: 2026
  absolute_error_margin: 0.01
  # REQ002/005: no eligible household member means no applicable income ceiling.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: false}
    spm_units:
      spm_unit: {members: [person1], heating_type: NATURAL_GAS, gas_expense: 1_000}
    households:
      household: {members: [person1], state_code: ID}
  output:
    id_liheap_income_limit: 0

- name: Case 3, mixed state vector preserves the Idaho limit and masks another state.
  period: 2026
  absolute_error_margin: 0.01
  # REQ005/state scope: Idaho one-person monthly2736.25*12=32835; California0.
  input:
    people:
      person1: {age: 40, is_citizen_or_legal_immigrant: true}
      person2: {age: 40, is_citizen_or_legal_immigrant: true}
    spm_units:
      spm_unit1: {members: [person1], heating_type: NATURAL_GAS, gas_expense: 1_000}
      spm_unit2: {members: [person2], heating_type: NATURAL_GAS, gas_expense: 1_000}
    households:
      household1: {members: [person1], state_code: ID}
      household2: {members: [person2], state_code: CA}
  output:
    id_liheap_income_limit: [32_835, 0]
