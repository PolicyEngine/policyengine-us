# Court supervision extends this state's age test without setting disability
# or protective-services status. Cases include both age boundaries and adults.
- name: Case 1, MO court supervision age boundaries and default status.
  period: 2025-01
  input:
    state_code: [MO, MO, MO, MO, MO, MO, MO, MO]
    age: [12, 13, 13, 17, 18, 19, 18, 40]
    is_under_court_supervision: [false, false, true, true, true, true, false, true]
    is_tax_unit_dependent: [true, true, true, true, true, true, true, false]
  output:
    mo_ccs_eligible_child: [true, false, true, true, false, false, false, false]
    # Court supervision does not place anyone in the protective-services
    # category of 5 CSR 25-200.060(7)(A).
    mo_ccs_protective_services: [false, false, false, false, false, false, false, false]
    # is_disabled would meet the need-for-care test as the incapacitated-parent
    # proxy for the adult units (ages 18, 19, 18, and 40). None reports work,
    # study, or disability, so every unit fails it, including the
    # court-supervised adults.
    mo_ccs_activity_eligible: [false, false, false, false, false, false, false, false]

- name: Case 2, MO court supervision does not bypass child immigration eligibility.
  period: 2025-01
  input:
    state_code: MO
    age: 17
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
    is_tax_unit_dependent: true
  output:
    mo_ccs_eligible_child: false

- name: Case 3, MO court supervision receives special-needs reimbursement and sliding-fee treatment.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000
        immigration_status: CITIZEN
        weekly_hours_worked: 35
      person2:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
        mo_ccs_provider_type: LICENSED_CENTER
        is_under_court_supervision: true
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 30_000
    households:
      household:
        members:
        - person1
        - person2
        state_code: MO
        county: JACKSON_COUNTY_MO
  output:
    mo_ccs_eligible_child:
    - false
    - true
    mo_ccs_maximum_daily_benefit:
    - 0
    - 89.4625
    mo_ccs_copay: 0
    mo_ccs: 1_789.25
    mo_ccs_special_needs:
    - false
    - true
    mo_ccs_protective_services:
    - false
    - false

