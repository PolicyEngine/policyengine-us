# mo_ccs_funding_rate: SPMUnit, MONTH.
# DESE's chart updated July 1, 2026 prints, for three on the 2025 guideline ($26,650):
#   traditional up to $3,331, Transitional Level 1 $3,332 to $4,109, Level 2 $4,110 to $4,775.

- name: July 2026, a family of three at the $3,331 traditional top keeps the full rate.
  period: 2026-07
  input:
    people:
      person1:
        age:
          2026: 30
      person2:
        age:
          2026: 5
      person3:
        age:
          2026: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        mo_ccs_adjusted_income: 3_331
        mo_ccs_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code:
          2026: MO
  output:
    mo_ccs_funding_rate: 1

