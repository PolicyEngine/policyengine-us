- name: Eligible when a dependent child is present and all tests pass
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_dependent_child: true
    mo_tanf_income_eligible: true
    mo_tanf_resources_eligible: true
  output:
    mo_tanf_eligible: true

- name: Ineligible when not in Missouri
  period: 2024-01
  input:
    state_code: NY
    mo_tanf_dependent_child: true
    mo_tanf_income_eligible: true
    mo_tanf_resources_eligible: true
  output:
    mo_tanf_eligible: false

- name: Pregnancy alone does not qualify without a dependent child
  period: 2024-01
  input:
    state_code: MO
    age: 25
    is_pregnant: true
    mo_tanf_income_eligible: true
    mo_tanf_resources_eligible: true
  output:
    mo_tanf_eligible: false

- name: Ineligible when no dependent child is present
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_dependent_child: false
    mo_tanf_income_eligible: true
    mo_tanf_resources_eligible: true
  output:
    mo_tanf_eligible: false

- name: Ineligible when not income eligible
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_dependent_child: true
    mo_tanf_income_eligible: false
    mo_tanf_resources_eligible: true
  output:
    mo_tanf_eligible: false

- name: Ineligible when resources exceed limit
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_dependent_child: true
    mo_tanf_income_eligible: true
    mo_tanf_resources_eligible: false
  output:
    mo_tanf_eligible: false

- name: Ineligible when all conditions fail
  period: 2024-01
  input:
    state_code: NY
    mo_tanf_dependent_child: false
    mo_tanf_income_eligible: false
    mo_tanf_resources_eligible: false
  output:
    mo_tanf_eligible: false
