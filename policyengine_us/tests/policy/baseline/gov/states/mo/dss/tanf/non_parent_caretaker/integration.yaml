# Missouri TANF non-parent caretaker relative (NPCR) rules: 13 CSR 40-2.300(5)(D),
# 13 CSR 40-2.310(3) and (8)(B)1.C, and DSS Manual 0210.005.05, 0210.005.10,
# 0210.005.15, 0210.005.35, 0210.005.40 and 0210.010.10.
# Standard of need: size 1 $393, size 2 $678, size 3 $846. Payment is 34.526%
# of the standard: size 1 $135.687, size 2 $234.086, size 3 $292.090.

- name: Grandparent with no spouse and $100 unemployment is left out because inclusion lowers the grant
  period: 2026-01
  input:
    people:
      grandparent:
        age: 55
        unemployment_compensation: 1_200  # $100/month
        mo_tanf_is_non_parent_caretaker: true
      grandchild1:
        age: 6
        is_tax_unit_dependent: true
      grandchild2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [grandparent, grandchild1, grandchild2]
    spm_units:
      spm_unit:
        members: [grandparent, grandchild1, grandchild2]
    households:
      household:
        members: [grandparent, grandchild1, grandchild2]
        state_code: MO
  output:
    # No spouse in the home, so the NPCR is needy without a budget
    # (DSS Manual 0210.005.35). Included: 292.090 - 100 = 192.090.
    # Excluded: the two children alone get 234.086. DSS Manual 0210.005.15
    # forbids an optional inclusion that reduces the grant.
    mo_tanf_non_parent_caretaker: [true, false, false]
    mo_tanf_non_parent_caretaker_needy: true
    mo_tanf_if_non_parent_caretaker_included: 192.090
    mo_tanf_if_non_parent_caretaker_excluded: 234.086
    mo_tanf_non_parent_caretaker_included: false
    mo_tanf_is_assistance_unit_member: [false, true, true]
    mo_tanf_assistance_unit_size: 2
    mo_tanf_gross_unearned_income: 0
    mo_tanf: 234.086

- name: The same household without the non-parent input keeps the grandparent as a caretaker
  period: 2026-01
  input:
    people:
      grandparent:
        age: 55
        unemployment_compensation: 1_200
      grandchild1:
        age: 6
        is_tax_unit_dependent: true
      grandchild2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [grandparent, grandchild1, grandchild2]
    spm_units:
      spm_unit:
        members: [grandparent, grandchild1, grandchild2]
    households:
      household:
        members: [grandparent, grandchild1, grandchild2]
        state_code: MO
  output:
    mo_tanf_non_parent_caretaker: [false, false, false]
    mo_tanf_non_parent_caretaker_needy: false
    mo_tanf_assistance_unit_size: 3
    mo_tanf: 192.090

- name: Grandparent with $700 unemployment and a $0 spouse is not needy and is excluded
  period: 2026-01
  input:
    people:
      grandparent:
        age: 55
        unemployment_compensation: 8_400  # $700/month
        mo_tanf_is_non_parent_caretaker: true
      spouse:
        age: 54
        mo_tanf_is_non_parent_caretaker: true
      grandchild1:
        age: 6
        is_tax_unit_dependent: true
      grandchild2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [grandparent, spouse, grandchild1, grandchild2]
    spm_units:
      spm_unit:
        members: [grandparent, spouse, grandchild1, grandchild2]
    households:
      household:
        members: [grandparent, spouse, grandchild1, grandchild2]
        state_code: MO
  output:
    # Neediness budget for the NPCR and spouse: $700 against the size-2
    # standard of $678 shows no need, so the NPCR is excluded (needs and
    # income) with no election (DSS Manual 0210.005.35). The spouse is not
    # a unit member either.
    mo_tanf_non_parent_caretaker: [true, false, false, false]
    mo_tanf_non_parent_caretaker_budget_member: [true, true, false, false]
    mo_tanf_non_parent_caretaker_countable_income: 700
    mo_tanf_non_parent_caretaker_needy: false
    mo_tanf_non_parent_caretaker_included: false
    mo_tanf_is_assistance_unit_member: [false, false, true, true]
    mo_tanf_assistance_unit_size: 2
    mo_tanf_eligible: true
    mo_tanf: 234.086

