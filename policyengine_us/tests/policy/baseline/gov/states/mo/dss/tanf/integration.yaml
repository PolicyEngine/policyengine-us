- name: Family of 3 with low earned income, passes all tests
  period: 2024
  input:
    people:
      person1:
        age: 35
        employment_income_before_lsr: 3_000
      person2:
        age: 8
        is_tax_unit_dependent: true
      person3:
        age: 3
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 800
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    mo_tanf_standard_of_need: 10_152
    mo_tanf_maximum_benefit: 3_505.08
    mo_tanf_income_eligible: true
    mo_tanf_eligible: true
    # Monthly: $250 earned - ($90 + $30 + $130 / 3) deductions leaves
    # $86.67 countable; $292.09 - $86.67 = $205.42 benefit; * 12 =
    # $2,465.08.
    mo_tanf: 2_465.08

