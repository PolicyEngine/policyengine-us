- name: Case 8, unmarried adult child in a parent's tax unit uses the individual limit.
  period: 2026-07
  input:
    people:
      person1:
        age: 50
        mo_ssp_living_arrangement: NONE
      person2:
        age: 22
        is_blind: true
        ssi_countable_resources: 8_000
        mo_ssp_living_arrangement: SAB
    marital_units:
      parent_marital_unit:
        members: [person1]
      child_marital_unit:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # is_tax_unit_spouse ranks the 22-year-old as the spouse, so the SPM
    # unit reads as married, but the claimant's own marital unit has one
    # person. $8,000 exceeds the $6,220.50 individual limit.
    mo_ssp_resource_eligible: [true, false]

- name: Case 9, married SAB claimant living with a spouse uses the couple limit.
  period: 2026-07
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi_countable_resources: 8_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 50
        mo_ssp_living_arrangement: NONE
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # $8,000 is below the $12,441.00 couple limit.
    mo_ssp_resource_eligible: [true, true]

- name: Case 10, married couple above the July 2026 couple limit is ineligible.
  period: 2026-07
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi_countable_resources: 8_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 50
        ssi_countable_resources: 4_441.01
        mo_ssp_living_arrangement: NONE
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # Combined $12,441.01 exceeds the $12,441.00 couple limit.
    mo_ssp_resource_eligible: [false, true]
