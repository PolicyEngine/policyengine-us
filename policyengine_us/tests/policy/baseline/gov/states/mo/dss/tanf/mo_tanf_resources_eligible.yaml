- name: Eligible with resources below limit
  period: 2024-01
  input:
    state_code: MO
    spm_unit_cash_assets: 500
  output:
    mo_tanf_resources_eligible: true

- name: Eligible with resources at limit
  period: 2024-01
  input:
    state_code: MO
    spm_unit_cash_assets: 1_000
  output:
    mo_tanf_resources_eligible: true

- name: Ineligible with resources above limit
  period: 2024-01
  input:
    state_code: MO
    spm_unit_cash_assets: 1_001
  output:
    mo_tanf_resources_eligible: false

# 650.46 + 299.64 + 49.90 = 1,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 1,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.90
    state_code: MO
  output:
    mo_tanf_resources_eligible: true

# 650.46 + 299.64 + 49.91 = 1,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 650.46
    stock_assets: 299.64
    bond_assets: 49.91
    state_code: MO
  output:
    mo_tanf_resources_eligible: false
