- name: Workers compensation above the payment standard makes the unit ineligible
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 6000
        unemployment_compensation: 0
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    tanf_gross_unearned_income: [0.0, 0]
    mo_tanf_gross_unearned_income: 500.0
    mo_tanf_assistance_unit_size: 2
    mo_tanf_eligible: false
    mo_tanf: 0

- name: Workers compensation of an excluded adult does not count
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        unemployment_compensation: 600
      child:
        age: 8
        is_tax_unit_dependent: true
      adult_child:
        age: 20
        workers_compensation: 2400
    tax_units:
      tax_unit:
        members: [parent, child]
      adult_tax_unit:
        members: [adult_child]
    spm_units:
      spm_unit:
        members: [parent, child, adult_child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child, adult_child]
        state_code: MO
  output:
    mo_tanf_is_assistance_unit_member: [true, true, false]
    mo_tanf_gross_unearned_income: 50
    mo_tanf_assistance_unit_size: 2
    mo_tanf: 184.08628

- name: Workers compensation of an SSI recipient does not count
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 2400
        receives_ssi: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    mo_tanf_is_assistance_unit_member: [false, true]
    mo_tanf_gross_unearned_income: 0
    mo_tanf_assistance_unit_size: 1
    mo_tanf: 135.68718
