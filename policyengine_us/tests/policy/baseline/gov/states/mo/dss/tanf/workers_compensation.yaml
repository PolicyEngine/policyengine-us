# Missouri DSS Manual 0210.015.05 counts workers compensation as unearned income.
# Income inputs are annual amounts; TANF outputs below are monthly.

- name: Workers compensation reduces the grant
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 2400
        unemployment_compensation: 0
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    tanf_gross_unearned_income: [0.0, 0]
    mo_tanf_gross_unearned_income: 200.0
    mo_tanf_assistance_unit_size: 2
    mo_tanf_eligible: true
    mo_tanf: 34.08628

