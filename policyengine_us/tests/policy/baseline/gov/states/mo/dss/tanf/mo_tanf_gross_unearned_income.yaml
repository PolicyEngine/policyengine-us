- name: Workers compensation of an excluded adult does not count
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        unemployment_compensation: 600
      child:
        age: 8
        is_tax_unit_dependent: true
      adult_child:
        age: 20
        workers_compensation: 2400
    tax_units:
      tax_unit:
        members: [parent, child]
      adult_tax_unit:
        members: [adult_child]
    spm_units:
      spm_unit:
        members: [parent, child, adult_child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child, adult_child]
        state_code: MO
  output:
    mo_tanf_is_assistance_unit_member: [true, true, false]
    mo_tanf_gross_unearned_income: 50
    mo_tanf_assistance_unit_size: 2
    mo_tanf: 184.08628

