- name: Unit members' unearned income is counted
  period: 2024-01
  input:
    people:
      parent:
        age: 35
        unemployment_compensation: 6_000  # $500/month
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    mo_tanf_gross_unearned_income: 500

- name: Unearned income of a non-member 19-year-old is not counted
  period: 2024-01
  input:
    people:
      parent:
        age: 35
        unemployment_compensation: 6_000  # $500/month
      child:
        age: 8
        is_tax_unit_dependent: true
      adult_child:
        age: 19
        social_security: 3_600  # $300/month
    tax_units:
      tax_unit:
        members: [parent, child]
      tax_unit_2:
        members: [adult_child]
    spm_units:
      spm_unit:
        members: [parent, child, adult_child]
    households:
      household:
        members: [parent, child, adult_child]
        state_code: MO
  output:
    # DSS Manual 0210.005.10: excluded household members contribute
    # neither needs nor income.
    mo_tanf_gross_unearned_income: 500

# Missouri DSS Manual 0210.015.05 counts workers compensation as unearned income.
# Income inputs are annual amounts; TANF outputs below are monthly.

- name: Workers compensation reduces the grant
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 2400
        unemployment_compensation: 0
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    tanf_gross_unearned_income: [0.0, 0]
    mo_tanf_gross_unearned_income: 200.0
    mo_tanf_assistance_unit_size: 2
    mo_tanf_eligible: true
    mo_tanf: 34.08628

- name: Unemployment remains countable
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 0
        unemployment_compensation: 2400
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    tanf_gross_unearned_income: [200.0, 0]
    mo_tanf_gross_unearned_income: 200.0
    mo_tanf_assistance_unit_size: 2
    mo_tanf_eligible: true
    mo_tanf: 34.08628

