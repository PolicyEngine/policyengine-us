  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        workers_compensation: 6000
        unemployment_compensation: 0
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    tanf_gross_unearned_income: [0.0, 0]
    mo_tanf_gross_unearned_income: 500.0
    mo_tanf_assistance_unit_size: 2
