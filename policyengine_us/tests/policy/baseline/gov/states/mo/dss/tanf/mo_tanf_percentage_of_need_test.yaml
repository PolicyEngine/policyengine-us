- name: Passes when countable income falls below the printed need row
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_countable_income: 200
    mo_tanf_assistance_unit_size: 3
  output:
    mo_tanf_percentage_of_need_test: true  # $200 < $292.

- name: Passes when countable income falls just below the limit
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_countable_income: 291.99
    mo_tanf_assistance_unit_size: 3
  output:
    mo_tanf_percentage_of_need_test: true  # $291.99 < $292.

- name: Fails when countable income equals the limit
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_countable_income: 292
    mo_tanf_assistance_unit_size: 3
  output:
    mo_tanf_percentage_of_need_test: false  # $292 equals the printed row.

- name: Fails when countable income exceeds the limit
  period: 2024-01
  input:
    state_code: MO
    mo_tanf_countable_income: 300
    mo_tanf_assistance_unit_size: 3
  output:
    mo_tanf_percentage_of_need_test: false

