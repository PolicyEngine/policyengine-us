        ssi: 500
        mo_ssp_living_arrangement: SNF_OR_ICF_NON_MEDICAID
        mo_snc_facility_base_charge: 1_000
    tax_units:
      tax_unit:
        members: [person1]
    marital_units:
      marital_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # SNC SNF base $390 + $50 PNA = $440.
    mo_ssp_eligible: true
    mo_ssp_personal_needs_allowance: 50
    mo_ssp: 440

