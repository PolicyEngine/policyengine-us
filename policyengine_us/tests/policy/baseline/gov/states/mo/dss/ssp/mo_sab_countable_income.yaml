- name: Case 32, an annual reported tax amount is spread across months.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 12_000
        mo_sab_reported_earnings_taxes: 1_200
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,200 a year is $100 a month: $457.50 - $100 - $100 = $257.50.
    mo_sab_countable_income:
      2026-01: 257.5
