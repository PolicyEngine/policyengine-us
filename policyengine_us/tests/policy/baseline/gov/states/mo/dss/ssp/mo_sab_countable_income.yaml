- name: Case 1, zero income gives zero SAB countable income.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_sab_countable_income: 0

- name: Case 2, modeled taxes do not create a deduction when no taxes are reported.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 12_000
        mo_withheld_income_tax: 1_200
    tax_units:
      tax_unit:
        members: [person1]
        income_tax_before_credits: 2_400
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $1,000. ($1,000 - $85) x 0.5 = $457.50, less the
    # $100 personal standard = $357.50. The 13 CSR 40-2.120(8) standard tax
    # table is not modeled.
    mo_sab_reported_earnings_taxes: 0
    mo_sab_countable_income: 357.5

- name: Case 3, earnings below the $85 exemption are fully exempt.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 960
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $80, all within the $85 exemption.
    mo_sab_countable_income: 0

- name: Case 4, earnings of exactly $85 are fully exempt.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 1_020
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_sab_countable_income: 0

- name: Case 5, the personal standard is 10% of gross earnings, not of the remainder.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 1_800
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $150. ($150 - $85) x 0.5 = $32.50, less the $15
    # personal standard = $17.50.
    mo_sab_countable_income: 17.5

- name: Case 6, the personal standard is 10% of exact gross earnings.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 5_940.12
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $495.01. ($495.01 - $85) x 0.5 = $205.005, less the
    # $49.501 personal standard = $155.504. The 13 CSR table would round the
    # standard up to $50, the top of the $495.01-$500 band.
    mo_sab_countable_income: 155.504

- name: Case 7, reported taxes reduce countable earnings.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 36_000
        mo_sab_reported_earnings_taxes: 529.5
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $3,000. ($3,000 - $85) x 0.5 = $1,457.50, less $529.50
    # reported taxes and the $300 personal standard = $628.
    mo_sab_countable_income: 628

- name: Case 8, earnings with no reported taxes get no tax deduction.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 36_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_sab_countable_income: 1_157.5

- name: Case 9, reported taxes reduce countable earnings; the 13 CSR tax table is not modeled.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 12_000
        mo_sab_reported_earnings_taxes: 76.5
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $457.50 - $76.50 reported taxes - $100 personal standard = $281.
    mo_sab_countable_income: 281

- name: Case 10, unearned income counts in full, and reported taxes need earnings.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        pension_income: 12_876
        mo_sab_reported_earnings_taxes: 100
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,073 monthly pension is fully countable under 13 CSR 40-2.120(2)(B).
    mo_sab_countable_income: 1_073

- name: Case 11, earned and unearned income combine.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 6_000
        pension_income: 3_600
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Earned $500: ($500 - $85) x 0.5 = $207.50, less the $50 personal
    # standard = $157.50. Plus $300 pension = $457.50.
    mo_sab_countable_income: 457.5

- name: Case 12, a spouse's income is not deemed to the SAB claimant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        pension_income: 6_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 50
        employment_income: 15_600
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # The SAB income test is individual regardless of marital status
    # (Appendix K), so person1 counts only the own $500 pension. Person2's own
    # figure is ($1,300 - $85) x 0.5 - $130 = $477.50.
    mo_sab_countable_income: [500, 477.5]

- name: Case 13, the SSI student earned income exclusion does not apply.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 20
        is_blind: true
        is_full_time_student: true
        employment_income: 12_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # SSI would exclude all $1,000 for a blind student under 22; SAB applies
    # only the $85-plus-half exemption and personal standard.
    mo_sab_countable_income: 357.5

- name: Case 14, in-kind support and maintenance is excluded.
