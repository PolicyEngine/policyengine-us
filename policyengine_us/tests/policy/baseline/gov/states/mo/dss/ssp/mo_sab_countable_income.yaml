- name: Case 29, monthly reported taxes carry forward until changed.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 36_000
        mo_sab_reported_earnings_taxes:
          2026-01: 100
          2026-02: 200
          2026-04: 0
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # The February amount also applies in March, which has no entry of its own.
    mo_sab_countable_income:
      2026-01: 1_057.5
      2026-02: 957.5
      2026-03: 957.5
      2026-04: 1_157.5

