- name: Earnings of a non-member 19-year-old are not counted
  period: 2024-01
  input:
    people:
      parent:
        age: 35
        employment_income_before_lsr: 12_000  # $1,000/month
      child:
        age: 8
        is_tax_unit_dependent: true
      adult_child:
        age: 19
        employment_income_before_lsr: 6_000  # $500/month
    tax_units:
      tax_unit:
        members: [parent, child]
      tax_unit_2:
        members: [adult_child]
    spm_units:
      spm_unit:
        members: [parent, child, adult_child]
    households:
      household:
        members: [parent, child, adult_child]
        state_code: MO
  output:
    mo_tanf_gross_earned_income: 1_000

- name: Student child's earnings are exempt from gross earned income
  period: 2024-01
  input:
    people:
      parent:
        age: 35
        employment_income_before_lsr: 12_000  # $1,000/month
      student_child:
        age: 17
        is_tax_unit_dependent: true
        is_in_secondary_school: true
        employment_income_before_lsr: 15_600  # $1,300/month
    tax_units:
      tax_unit:
        members: [parent, student_child]
    spm_units:
      spm_unit:
        members: [parent, student_child]
    households:
      household:
        members: [parent, student_child]
        state_code: MO
  output:
    mo_tanf_gross_earned_income: 1_000
