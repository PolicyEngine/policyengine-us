- name: Case 29, a refugee within five years of entry is eligible for SAB.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 6_000
        immigration_status: REFUGEE
        years_since_us_entry: 1
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Refugees are exempt from the five-year bar.
