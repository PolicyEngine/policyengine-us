- name: Case 9, disabled adult age 21 in SNF non-Medicaid is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 21
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi: 500
        mo_ssp_living_arrangement: SNF_OR_ICF_NON_MEDICAID
        mo_snc_facility_base_charge: 1_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Exactly meets SNC age threshold and the ABD category requirement.
    mo_ssp_eligible: true

- name: Case 10, adult exactly age 18 with SAB arrangement is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 18
        is_blind: true
        ssi: 200
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Exactly meets SAB age threshold of 18.
