- name: Case 20, SAB applicant whose income equals the consolidated standard is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 12_876
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,073 monthly pension counts in full with no $20 disregard. $1,073 -
    # $1,073 leaves no remainder, so the need determination fails
    # (§ 0410.020.00).
    mo_ssp_eligible: false

