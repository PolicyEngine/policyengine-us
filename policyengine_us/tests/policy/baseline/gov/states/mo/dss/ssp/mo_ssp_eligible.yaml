- name: Case 28, SSI is left out of the SAB need test.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 400
        pension_income: 9_600
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # The $400 SSI is a stand-in input.
    # § 0410.020.00: countable income is the $800 pension only. Counting SSI
    # would give $1,200, above the $1,073 standard. Grant = $917 - $400 SSI.
    mo_sab_countable_income: 800
    mo_ssp_eligible: true
    mo_ssp: 517

