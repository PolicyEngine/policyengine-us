- name: Case 40, child support for a child in the home is not the blind parent's income.
  period: 2026-01
  input:
    people:
      person1:
        age: 40
        is_blind: true
        ssi: 0
        pension_income: 7_200
        child_support_received: 6_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # § 0410.015.10: the $500 support is the child's income, so the parent
    # counts only the $600 pension, below the $1,073 standard.
    mo_sab_countable_income: [600, 0]
    mo_ssp_eligible: [true, false]
    mo_ssp: [917, 0]

- name: Case 41, two blind SAB spouses are each tested on their own income.
  period: 2026-01
  input:
    people:
      person1:
        age: 60
        is_blind: true
        ssi: 0
        pension_income: 6_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 60
        is_blind: true
        ssi: 0
        pension_income: 9_600
        mo_ssp_living_arrangement: SAB
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # Appendix K: the SAB income test is individual regardless of marital
    # status: $500 and $800, both below the $1,073 standard.
    mo_sab_countable_income: [500, 800]
    mo_ssp_eligible: [true, true]
