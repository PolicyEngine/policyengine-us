        state_code: MO
  output:
    # Exactly meets SNC age threshold of 21 and the ABD category requirement.
    mo_ssp_eligible: true

- name: Case 12, adult age 20 in RCF Level I is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 20
        ssi: 500
        mo_ssp_living_arrangement: RCF_LEVEL_I
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # SNC categories require age 21+; 20 is below threshold.
    mo_ssp_eligible: false

- name: Case 13, adult age 17 in SAB arrangement is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 17
        is_blind: true
        ssi: 200
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # SAB requires age 18+; 17 is below threshold.
    mo_ssp_eligible: false

- name: Case 14, adult with nominal SSI receipt is still eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0.01
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # SAB eligibility is independent of SSI receipt; nominal SSI does not
    # affect this — the SAB income test uses mo_sab_countable_income against
    # the consolidated standard.
    mo_ssp_eligible: true

- name: Case 15, adult with valid eligibility outside Missouri is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 200
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: OK
  output:
    # defined_for = StateCode.MO filters non-MO residents to false.
    mo_ssp_eligible: false

- name: Case 16, SAB applicant with countable income above the monthly limit is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 200
        employment_income: 96_000
        mo_sab_tax_exemption: 1_912
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $8,000. ($8,000 - $85) x 0.5 = $3,957.50, less $1,912
    # reported tax withholdings and the $800 personal standard =
    # $1,245.50, which leaves no remainder under the $1,073 consolidated
    # standard.
    mo_ssp_eligible: false

- name: Case 17, SAB applicant with non-SSI income at or below the monthly limit is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 200
        employment_income: 12_000
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $1,000. ($1,000 - $85) x 0.5 - $100 personal standard
    # = $357.50, below the $1,073 consolidated standard.
    mo_ssp_eligible: true

- name: Case 18, SNC resident who is not aged, blind, or disabled is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: false
        is_disabled: false
        social_security: 600
        mo_ssp_living_arrangement: RCF_LEVEL_I
        mo_snc_facility_base_charge: 1_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Facility cost exceeds income, but SNC still requires aged, blind, or
    # disabled categorical eligibility.
    mo_ssp_eligible: false

- name: Case 19, SAB applicant above the resource limit is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        ssi_countable_resources: 100_000
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_eligible: false

- name: Case 20, SAB applicant whose income equals the consolidated standard is not eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 12_876
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,073 monthly pension counts in full with no $20 disregard. $1,073 -
    # $1,073 leaves no remainder, so the need determination fails
    # (§ 0410.020.00).
    mo_ssp_eligible: false

- name: Case 21, SAB applicant with income one dollar under the consolidated standard is eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 12_864
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,073 - $1,072 leaves a $1 remainder.
    mo_ssp_eligible: true

- name: Case 22, SAB applicant with an earning non-blind spouse is eligible on own income.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 6_000
        mo_ssp_living_arrangement: SAB
      person2:
        age: 50
        employment_income: 15_600
        mo_ssp_living_arrangement: NONE
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # The $1,300 monthly spousal earnings are not deemed; person1 counts only
    # the $500 pension, below the $1,073 consolidated standard.
    mo_ssp_eligible: [true, false]

- name: Case 23, 2025 SAB applicant is tested against the $1,044 consolidated standard.
  period: 2025-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 12_000
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,000 monthly pension is below the $1,044 standard effective 2025-01-01.
    mo_ssp_eligible: true

- name: Case 24, 2025 SAB applicant at the $1,044 consolidated standard is not eligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        pension_income: 12_528
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # $1,044 monthly pension leaves no remainder under the $1,044 standard.
    mo_ssp_eligible: false

- name: Case 25, the tax exemption brings a blind worker under the consolidated standard.
  period: 2026-01
  input:
    people:
      person1:
        age: 50
        is_blind: true
        ssi: 0
        employment_income: 36_000
        mo_sab_tax_exemption: 529.5
        mo_ssp_living_arrangement: SAB
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # Monthly earned = $3,000. ($3,000 - $85) x 0.5 = $1,457.50, less the $300
    # personal standard = $1,157.50 before taxes, above the $1,073 standard.
    # Less $529.50 reported tax withholdings, countable income is $628.
    mo_ssp_eligible: true

- name: Case 26, an undocumented SAB applicant is not eligible.
