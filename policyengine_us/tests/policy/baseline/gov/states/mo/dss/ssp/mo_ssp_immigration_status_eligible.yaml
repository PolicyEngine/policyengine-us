- name: Case 1, a citizen meets the Missouri SSP citizenship and immigrant status requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 2, an undocumented person does not meet the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: UNDOCUMENTED
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 3, a DACA recipient is not a qualified immigrant.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: DACA
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 4, a person with temporary protected status is not a qualified immigrant.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: TPS
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 5, a permanent resident meets the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 6, a refugee meets the requirement after the 2026 federal Medicaid change.
  period: 2027
  input:
    people:
      person1:
        age: 50
        immigration_status: REFUGEE
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # § 1805.020.10 still lists refugees as qualified immigrants.
    mo_ssp_immigration_status_eligible: true

- name: Case 7, a person paroled for at least one year meets the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: PAROLED_ONE_YEAR
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 8, the requirement applies in years before the federal Medicaid status parameters.
  period: 2013
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 9, a non-Missouri resident is not evaluated.
  period: 2026
  input:
    people:
      person1:
        age: 50
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    mo_ssp_immigration_status_eligible: false
