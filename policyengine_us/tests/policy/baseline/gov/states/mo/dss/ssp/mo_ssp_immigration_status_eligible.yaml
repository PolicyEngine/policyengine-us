- name: Case 6, a refugee meets the requirement after the 2026 federal Medicaid change.
  period: 2027
  input:
    people:
      person1:
        age: 50
        immigration_status: REFUGEE
        years_since_us_entry: 1
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # § 1805.020.10.10.05 still lists refugees with no waiting period.
    mo_ssp_immigration_status_eligible: true

