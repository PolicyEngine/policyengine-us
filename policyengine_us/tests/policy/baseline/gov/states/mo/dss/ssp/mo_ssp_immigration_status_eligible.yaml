- name: Case 1, a citizen meets the Missouri SSP citizenship and immigrant status requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 2, an undocumented person does not meet the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: UNDOCUMENTED
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 3, a DACA recipient is not a qualified immigrant.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: DACA
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 4, a permanent resident within five years of entry does not meet the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 4
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 5, a permanent resident five years after entry meets the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 5
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 6, a refugee has no waiting period, including after the 2026 federal Medicaid change.
  period: 2027
  input:
    people:
      person1:
        age: 50
        immigration_status: REFUGEE
        years_since_us_entry: 1
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # § 1805.020.10.10.05 lists refugees with no waiting period.
    mo_ssp_immigration_status_eligible: true

- name: Case 7, a Cuban or Haitian entrant has no waiting period.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: CUBAN_HAITIAN_ENTRANT
        years_since_us_entry: 1
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 8, a conditional entrant within five years does not meet the requirement.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: CONDITIONAL_ENTRANT
        years_since_us_entry: 2
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 9, an active-duty permanent resident has no waiting period.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_military: true
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    # § 1805.020.10.10.10 waives the five-year period for active duty members.
    mo_ssp_immigration_status_eligible: true

- name: Case 10, the spouse of a veteran has no waiting period.
  period: 2026
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
      person2:
        age: 55
        is_veteran: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: [true, true]

- name: Case 11, the dependent child of a veteran has no waiting period.
  period: 2026
  input:
    people:
      person1:
        age: 50
        is_veteran: true
      person2:
        age: 16
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: [true, true]

- name: Case 12, the requirement applies in years before the federal Medicaid status parameters.
  period: 2013
  input:
    people:
      person1:
        age: 50
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 6
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    mo_ssp_immigration_status_eligible: true

- name: Case 13, a non-Missouri resident is not evaluated.
  period: 2026
  input:
    people:
      person1:
        age: 50
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    mo_ssp_immigration_status_eligible: false

- name: Case 14, a veteran's dependent parent is not a dependent child.
  period: 2026
  input:
    people:
      person1:
        age: 50
        is_veteran: true
      person2:
        age: 75
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # § 1805.020.10.10.10 waives the waiting period only for a spouse or a
    # dependent child; a 75-year-old dependent fails the qualifying child age
    # test.
    mo_ssp_immigration_status_eligible: [true, false]

- name: Case 15, sharing a default marital unit with a veteran does not make someone a spouse.
  period: 2026
  input:
    people:
      person1:
        age: 50
        is_veteran: true
      person2:
        age: 45
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
      person3:
        age: 30
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    # With no marital units declared, all three share one unit, so nobody is
    # married and person2 gets no spouse exception.
    mo_ssp_immigration_status_eligible: [true, false, true]

- name: Case 16, a veteran's dependent full-time student child has no waiting period.
  period: 2026
  input:
    people:
      person1:
        age: 50
        is_veteran: true
      person2:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # A 20-year-old full-time student claimed as a dependent is a dependent
    # child (under 24 if a student).
    mo_ssp_immigration_status_eligible: [true, true]
