# Form MO-A Part 3 Section B, Line 6 takes the taxable private pension of the
# filer and spouse from their federal return (Form 1040, Lines 4b and 5b). A
# tax-unit dependent's pension is not in the filer's federal AGI
# (RSMo 143.124.13); the dependent reports it on their own return.

- name: A dependent child's private pension is not deducted on the parent's return
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 40
        employment_income: 15_000
        is_tax_unit_head: true
      child:
        age: 10
        is_tax_unit_dependent: true
        taxable_private_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: MO
  output:
    mo_pension_and_ss_or_ssd_deduction_section_b: [0, 0]
    mo_pension_and_ss_or_ssd_deduction: 0

