- name: No EITC, no matched credit
  period: 2023
  input:
    state_code: MO
    eitc: 0
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 0
- name: 10% match
  period: 2023
  input:
    state_code: MO
    eitc: 100
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 10
- name: Outside MO is ineligible
  period: 2023
  input:
    state_code: MA
    eitc: 100
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 0
- name: Introduced in 2023
  period: 2022
  input:
    state_code: MO
    eitc: 100
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 10
- name: Married filing separately filers receive no credit
  period: 2023
  input:
    state_code: MO
    filing_status: SEPARATE
    eitc: 100
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 0
- name: Investment income above the Missouri limit zeroes the credit
  period: 2025
  input:
    state_code: MO
    eitc: 100
    eitc_relevant_investment_income: 4_401
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 0
- name: Filers claimed as a dependent receive no credit from 2024
  period: 2025
  input:
    state_code: MO
    eitc: 100
    claimed_as_dependent_on_another_return: true
    mo_income_tax_before_credits: 1000000
  output:
    mo_wftc: 0
- name: Property tax credit exhausting liability leaves no room for the WFTC
  period: 2023
  input:
    state_code: MO
    eitc: 1_000
    mo_income_tax_before_credits: 100
    mo_property_tax_credit: 150
  output:
    # Form MO-WFTC Line 9: 100 - 150, floored at 0.
    mo_wftc: 0
- name: Property tax credit partially reduces the liability cap
  period: 2023
  input:
    state_code: MO
    eitc: 5_000
    mo_income_tax_before_credits: 100
    mo_property_tax_credit: 60
  output:
    # min(10% x 5,000, 100 - 60) = 40, per Form MO-WFTC Lines 7-10.
    mo_wftc: 40
