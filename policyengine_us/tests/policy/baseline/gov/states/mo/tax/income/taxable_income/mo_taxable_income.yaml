# Integration test from issue #7793:
# Verifies the $1,400 HoH additional exemption (Line 15) is subtracted.
- name: MO HoH additional exemption reduces taxable income
  period: 2024
  absolute_error_margin: 0.01
  input:
    mo_adjusted_gross_income: 51_830
    mo_federal_income_tax_deduction: 0
    tax_unit_itemizes: false
    standard_deduction: 21_900
    mo_itemized_deductions: 0
    filing_status: HEAD_OF_HOUSEHOLD
    state_code: MO
  output:
    # 51,830 - 21,900 - 1,400 = 28,530
    mo_taxable_income: 28_530

- name: MO Single filer gets no HoH exemption
  period: 2024
  absolute_error_margin: 0.01
  input:
    mo_adjusted_gross_income: 51_830
    mo_federal_income_tax_deduction: 0
    tax_unit_itemizes: false
    standard_deduction: 14_600
    mo_itemized_deductions: 0
    filing_status: SINGLE
    state_code: MO
  output:
    # 51,830 - 14,600 = 37,230 (no HoH exemption)
    mo_taxable_income: 37_230

- name: Line 7 gives a spouse with negative Missouri AGI zero percent
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        mo_adjusted_gross_income: -15_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        mo_adjusted_gross_income: 30_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
        mo_federal_income_tax_deduction: 0
        tax_unit_itemizes: false
        standard_deduction: 0
        mo_itemized_deductions: 0
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # In the 2023 instructions' example (page 7), spouse 1 reports -15,000
    # and spouse 2 reports 30,000. They use 0% and 100% on Line 7.
    # They add their columns on Line 6 to get 15,000. Without deductions,
    # spouse 2 reports all 15,000 as taxable income on Line 26.
    mo_taxable_income: [0, 15_000]

- name: A voluntary federal itemizer can take the smaller Missouri standard deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: MO
    tax_unit_itemizes: true
    state_deduction_method: STANDARD
    standard_deduction: 15_750
    mo_itemized_deductions: 18_000
    mo_adjusted_gross_income: 18_950
    mo_federal_income_tax_deduction: 1_000
  output:
    mo_taxable_income: 2_200
    # Only 2,200 less the 1,313 zero bracket is taxed, at 2%.
    mo_income_tax_before_credits: 17.74

- name: Missouri requires state itemization for a separate filer whose spouse itemizes
  period: 2025
  input:
    gov.simulation.joint_federal_state_itemization: true
    state_code: MO
    filing_status: SEPARATE
    separate_filer_itemizes: true
  output:
    # With no expenses or tax the two state amounts tie at zero. MO-A Part 2
    # requires Missouri itemization when the federal return must itemize.
    # https://dor.mo.gov/forms/MO-1040%20Instructions_2025.pdf#page=16
    standard_deduction: 0
    tax_unit_itemizes: true
    state_deduction_method: ITEMIZED
    mo_taxable_income: 0
