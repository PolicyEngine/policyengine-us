# 2026 Form MO-1040ES Tax Rate Chart (page 2): brackets start at $1,348,
# $2,696, $4,044, $5,392, $6,740, $8,088 and $9,436; 4.7% over $9,436. The
# chart's base amounts are whole dollars ($27, ..., $263), and its examples
# round the tax to the whole dollar entered on Line 10.
- name: $4,000 MO taxable income in 2026 (MO-1040ES Example 1)
  period: 2026
  absolute_error_margin: 0
  input:
    mo_taxable_income: 4_000
    state_code: MO
  output:
    # $27 + 2.5% x (4,000 - 2,696) = $59.60; "The whole dollar to enter on
    # Line 10 would be $60."
    mo_income_tax_before_credits: 60

- name: $12,300 MO taxable income in 2026 (MO-1040ES Example 2)
  period: 2026
  absolute_error_margin: 0
  input:
    mo_taxable_income: 12_300
    state_code: MO
  output:
    # $263 + 4.7% x (12,300 - 9,436) = $397.61; "The amount to enter on Line
    # 10 would be $398." Applying each rate to the full $1,348 bracket width
    # would give $262.86 + $134.61 = $397.47, which rounds to $397.
    mo_income_tax_before_credits: 398

