- name: Dependent's self-employment tax deduction neither reduces nor raises the parent's Missouri AGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MO
  output:
    # The child's Schedule SE line 13 (706.48) is on the child's own federal
    # and Missouri returns. The parent's federal AGI (Form 1040, line 11) is
    # 40,000 and has no Missouri additions or subtractions. The parent's
    # personal deductions and the tax unit's deductions both leave the child
    # out, so the remaining deductions allocated between spouses are 0, not
    # -706.48.
    adjusted_gross_income: 40_000
    mo_adjusted_gross_income: [40_000, 0]

- name: 12 CSR 10-2.010(4)(A)2, a spouse's subtraction for U.S. obligation interest exceeds their federal AGI
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        employment_income: 38_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        taxable_interest_income: 5_000
        us_govt_interest_person: 5_000
        self_employment_income: -4_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # Spouse 2's federal AGI is 1,000 (5,000 of interest less a 4,000
    # business loss) and the U.S. obligation interest subtraction is 5,000.
    # Regulation (effective February 29, 2024): "The combined Missouri
    # adjusted gross income equals thirty-four thousand dollars ($34,000)
    # (thirty-eight thousand dollars ($38,000) plus negative four thousand
    # dollars (-$4,000))." (main floored spouse 2 at 0 and split the loss by
    # gross income share: 34,465.12 and 0.)
    mo_adjusted_gross_income: [38_000, -4_000]

- name: 12 CSR 10-2.010(4)(A)3, the MOST subtraction is limited to the spouse's Missouri AGI in 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        employment_income: 38_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 1_000
        investment_in_529_plan_indv: 5_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # Regulation (effective February 29, 2024): "thirty-eight thousand
    # dollars ($38,000) plus zero ... because the MOST subtraction is limited
    # to the spouse's Missouri adjusted gross income."
    mo_adjusted_gross_income: [38_000, 0]

