- name: A negative federal AGI column is replaced by zero before subtractions from 2024
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        employment_income: 5_000
        self_employment_income: -15_000
        us_govt_interest_person: 1_000
        taxable_interest_income: 1_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # Spouse 1's separate federal AGI is 6,000 - 15,000 = -9,000, so Line 1
    # is 0 for spouse 1 and the joint 91,000 for spouse 2 (2025 instructions,
    # page 6). Spouse 1's Line 5 is 0 - 1,000 = -1,000.
    mo_federal_adjusted_gross_income: [0, 91_000]
    mo_adjusted_gross_income: [-1_000, 91_000]
