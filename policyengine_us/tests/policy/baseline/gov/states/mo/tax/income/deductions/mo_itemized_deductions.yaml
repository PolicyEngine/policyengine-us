# Single filer, $100,000 of self-employment income and $20,000 of cash
# charity. The filer owes 14,129.55 of self-employment tax and deducts half
# (7,064.775) in computing federal AGI, so Missouri allows the other half as
# an itemized deduction (RSMo 143.141(4)(c)). With the charity, itemized
# deductions total 27,064.775, and the 0.01 margin covers either rounding of
# the half cent. If the model counted the full tax, they would total 34,129.55.
- name: 2017 self-employment tax counted net of the federal AGI deduction
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      head: {age: 40, self_employment_income: 100_000, charitable_cash_donations: 20_000}
    tax_units: {tax_unit: {members: [head]}}
    households: {household: {members: [head], state_code: MO}}
  output:
    self_employment_tax: 14_129.55
    self_employment_tax_ald: 7_064.77
    mo_self_employment_tax_addback: 7_064.77
    mo_itemized_deductions: 27_064.78

- name: 2024 self-employment tax counted net of the federal AGI deduction
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head: {age: 40, self_employment_income: 100_000, charitable_cash_donations: 20_000}
    tax_units: {tax_unit: {members: [head]}}
    households: {household: {members: [head], state_code: MO}}
  output:
    self_employment_tax: 14_129.55
    self_employment_tax_ald: 7_064.77
    mo_self_employment_tax_addback: 7_064.77
    mo_itemized_deductions: 27_064.78

- name: Missouri adds back only net income taxes claimed under the federal Schedule A election.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [MO, MO, MO, MO]
    filing_status: [SINGLE, SINGLE, SINGLE, SINGLE]
    adjusted_gross_income: [150_000, 150_000, 650_000, 650_000]
    deductible_mortgage_interest: [20_000, 20_000, 20_000, 20_000]
    state_withheld_income_tax: [8_000, 8_000, 30_000, 30_000]
    mo_kansas_city_earnings_tax: [0, 0, 6_500, 6_500]
    state_sales_tax: [7_800, 7_800, 1_000, 1_000]
    local_sales_tax: [0, 0, 0, 0]
    state_and_local_sales_tax_elected: [true, false, true, false]
  output:
    # MO-A Part 2 lines 9–11 remove only income taxes in the federal
    # deduction, excluding Kansas City earnings tax from the addback.
    # At $650,000 AGI the fourth row prorates $30,000 / $36,500
    # against the $10,000 SALT cap, so line 11 is $8,219.18.
    # https://dor.mo.gov/forms/MO-A_2025.pdf#page=2
    salt_deduction: [7_800, 8_000, 1_000, 10_000]
    mo_net_state_income_taxes: [0, 8_000, 0, 8_219.178]
    mo_itemized_deductions: [27_800, 20_000, 21_000, 21_780.822]

- name: Missouri retains legacy handling of a Schedule A election supplied only as an untyped total.
  period: 2025
  absolute_error_margin: 0.01
  input:
