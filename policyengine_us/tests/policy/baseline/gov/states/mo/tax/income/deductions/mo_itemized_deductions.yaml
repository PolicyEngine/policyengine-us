    filing_status: SINGLE
    adjusted_gross_income: 150_000
    deductible_mortgage_interest: 20_000
    state_withheld_income_tax: 2_000
    state_and_local_sales_or_income_tax: 5_000
  output:
    mo_net_state_income_taxes: 2_000
    mo_itemized_deductions: 23_000
