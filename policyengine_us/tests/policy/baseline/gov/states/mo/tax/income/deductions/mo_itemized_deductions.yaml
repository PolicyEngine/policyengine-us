- name: No Federal itemizations
  period: 2021
  absolute_error_margin: 0
  input:
    itemized_taxable_income_deductions: 0
    employee_social_security_tax: 0
    employee_medicare_tax: 0
    mo_net_state_income_taxes: 0
    state_code: MO
  output:
    mo_itemized_deductions: 0.0

- name: 60 in Federal itemizations, 10 in net_state_income_taxes
  period: 2021
  absolute_error_margin: 0.01
  input:
    # Form MO-A Part 2 line 1 is the federal total, which already includes
    # any miscellaneous deduction.
    itemized_taxable_income_deductions: 20
    employee_social_security_tax: 0
    employee_medicare_tax: 0
    mo_net_state_income_taxes: 10
    state_code: MO
  output:
    mo_itemized_deductions: 10.00

- name:  6000 in Federal itemizations, 1000 in net_state_income_taxes
  period: 2021
  absolute_error_margin: 0.01
  input:
    itemized_taxable_income_deductions: 2000
    employee_social_security_tax: 0
    employee_medicare_tax: 0
    mo_net_state_income_taxes: 1000
    state_code: MO
  output:
    mo_itemized_deductions: 1000.00

# MO state-income-tax add-back respects the OBBBA SALT cap phase-down: a
# high-income MFJ filer whose federal SALT has phased to the $10,000 floor
# keeps the $50,000 mortgage deduction instead of it being wiped out.
- name: MO state-income-tax add-back respects the OBBBA SALT cap phase-down
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head: {age: 45, taxable_interest_income: 789_125.13, deductible_mortgage_interest: 50_000}
      spouse: {age: 45}
    tax_units: {tax_unit: {members: [head, spouse]}}
    households: {household: {members: [head, spouse], state_code: MO}}
  output:
    mo_itemized_deductions: 50_000

# 2017 Form MO-A Part 2 line 1 is total federal itemized deductions from Form
# 1040 line 40, which already includes the miscellaneous deduction above the
# 2% floor; Part 2 has no separate line for it.
- name: 2017 miscellaneous deduction counted once
  period: 2017
  absolute_error_margin: 0.01
  input:
    charitable_deduction: 9_000
    misc_deduction: 1_000
    employee_social_security_tax: 0
    employee_medicare_tax: 0
    mo_net_state_income_taxes: 0
    state_code: MO
  output:
    itemized_taxable_income_deductions: 10_000
    mo_itemized_deductions: 10_000
