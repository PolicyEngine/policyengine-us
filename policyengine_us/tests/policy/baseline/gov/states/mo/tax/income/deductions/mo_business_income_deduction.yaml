
- name: 2023 non-zero qualified business income
  period: 2023
  input:
    qualified_business_income: 10_000
    state_code: MO
  output:
    mo_business_income_deduction: 2_000

- name: 2023 zero qualified business income
  period: 2023
  input:
    qualified_business_income: 0
    state_code: MO
  output:
    mo_business_income_deduction: 0

- name: 2022 non-zero qualified business income
  period: 2022
  input:
    qualified_business_income: 10_000
    state_code: MO
  output:
    mo_business_income_deduction: 1_500

- name: 2022 zero qualified business income
  period: 2022
  input:
    qualified_business_income: 0
    state_code: MO
  output:
    mo_business_income_deduction: 0

- name: 2023 SSTB-only qualified business income
  period: 2023
  input:
    sstb_self_employment_income: 10_000
    self_employment_tax_ald_person: 0
    self_employed_health_insurance_ald_person: 0
    self_employed_pension_contribution_ald_person: 0
    state_code: MO
  output:
    mo_business_income_deduction: 2_000

- name: Signed qualified business losses cannot create a negative Missouri deduction
  period: 2023
  input:
    qualified_business_income: -10_000
    state_code: MO
  output:
    mo_business_income_deduction: 0

- name: Missouri floors each spouse business income before summing
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        self_employment_income: 100_000
      spouse:
        age: 45
        self_employment_income: -20_000
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: MO
  output:
    mo_business_income_deduction: 18_587.04

- name: A dependent's business income is on the dependent's own return
  period: 2025
  input:
    people:
      head:
        age: 45
        qualified_business_income: 30_000
      spouse:
        age: 45
        qualified_business_income: 20_000
      child:
        age: 17
        qualified_business_income: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: MO
  output:
    # 20% of the spouses' 50,000.
    mo_business_income_deduction: 10_000
