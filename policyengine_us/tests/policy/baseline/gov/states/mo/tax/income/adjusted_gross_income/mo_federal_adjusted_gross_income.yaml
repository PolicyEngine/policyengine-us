- name: Each spouse's IRA, student loan interest and educator expenses stay in their column
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        employment_income: 40_000
        traditional_ira_contributions: 7_000
        student_loan_interest: 2_500
        educator_expense: 300
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # Primary: 40,000 - 7,000 - 2,500 - 300 = 30,200. Secondary: 8,000.
    # (main split the 9,800 by gross income share: 31,833.33 and 6,366.67.)
    adjusted_gross_income: 38_200
    mo_federal_adjusted_gross_income: [30_200, 8_000]

