- name: An SSTB loss beside a non-SSTB profit stays in its owner's column
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        self_employment_income: 10_000
        sstb_self_employment_income: -5_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 30_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # The primary spouse earns 10,000 from a non-SSTB Schedule C business and
    # loses 5,000 in an SSTB, so worksheet line 6 (business income or loss)
    # shows 5,000 in their column and the loss is theirs alone.
    # Self-employment tax on the net 5,000: 5,000 * 0.9235 = 4,617.50, and
    # 4,617.50 * 15.3% = 706.48; half, 353.24, is an adjustment.
    # Primary: 10,000 - 5,000 - 353.24 = 4,646.76. Secondary: 30,000.
    # Joint federal AGI: 4,646.76 + 30,000 = 34,646.76.
    # Netting the two Schedule C amounts before reading losses would show the
    # primary spouse no loss and divide the 5,000 equally:
    # [10,000 - 2,500 - 353.24, 30,000 - 2,500] = [7,146.76, 27,500].
    adjusted_gross_income: 34_646.76
    mo_federal_adjusted_gross_income: [4_646.76, 30_000]

- name: A non-SSTB loss beside an SSTB profit stays in its owner's column
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        self_employment_income: -10_000
        sstb_self_employment_income: 4_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 50_000
        rental_income: -6_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # Primary: 4,000 SSTB profit - 10,000 non-SSTB loss = -6,000; a net
    # Schedule C loss owes no self-employment tax.
    # Secondary: 50,000 wages - 6,000 rental loss = 44,000.
    # Joint federal AGI: -6,000 + 44,000 = 38,000.
    # Netting the two Schedule C amounts before reading losses would read
    # the primary spouse's loss as 6,000, equal to the secondary spouse's,
    # and divide the 16,000 of losses 8,000 each:
    # [4,000 - 8,000, 50,000 - 8,000] = [-4,000, 42,000].
    adjusted_gross_income: 38_000
    mo_federal_adjusted_gross_income: [-6_000, 44_000]

