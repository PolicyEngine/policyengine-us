    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # Regulation: MAGI $7,000 and $5,000.
    adjusted_gross_income: 12_000
    mo_federal_adjusted_gross_income: [7_000, 5_000]

