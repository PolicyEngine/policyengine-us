- name: An adoption benefit recorded on the child is divided equally between the spouses
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        employment_income: 50_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 30_000
      child:
        age: 3
        is_tax_unit_dependent: true
        qualified_adoption_assistance_expense: 5_000
    tax_units:
      tax_unit:
        members: [primary, secondary, child]
    marital_units:
      marital_unit:
        members: [primary, secondary]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [primary, secondary, child]
        state_code: MO
  output:
    # The household records 5,000 of employer adoption assistance, which
    # 26 USC 137 excludes from the adopting employee's income, on the child.
    # It does not record which parent's employer paid it, so each parent
    # subtracts 2,500: 50,000 - 2,500 = 47,500 and 30,000 - 2,500 = 27,500.
    # The child's column is zero. The columns add up to joint federal AGI:
    # 50,000 + 30,000 - 5,000 = 75,000. Leaving the 5,000 out of the columns
    # would give [50,000, 30,000, 0], 5,000 more than joint federal AGI.
    adjusted_gross_income: 75_000
    mo_federal_adjusted_gross_income: [47_500, 27_500, 0]
