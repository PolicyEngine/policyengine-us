- name: 12 CSR 10-2.010(2) Example No. 1, both spouses responsible for the excess capital loss
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        employment_income: 10_000
        long_term_capital_gains: -2_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 5_000
        long_term_capital_gains: -3_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # The $3,000 Section 1211 deduction pro rata: 2/5 and 3/5.
    # Regulation: MAGI $8,800 and $3,200, total $12,000.
    adjusted_gross_income: 12_000
    mo_federal_adjusted_gross_income: [8_800, 3_200]

- name: 12 CSR 10-2.010(2) Example No. 2, short-term and long-term netting
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
        is_tax_unit_head: true
        employment_income: 10_000
        short_term_capital_gains: -200
        long_term_capital_gains: -8_000
      spouse_2:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 5_000
        short_term_capital_gains: -300
        long_term_capital_gains: 3_000
    tax_units:
      tax_unit:
        members: [spouse_1, spouse_2]
    marital_units:
      marital_unit:
        members: [spouse_1, spouse_2]
    households:
      household:
        members: [spouse_1, spouse_2]
        state_code: MO
  output:
    # The 5,500 excess is 200 + 5,000 for spouse 1 (short-term and the net
    # long-term loss) and 300 for spouse 2. The regulation's allocation:
    # "Spouse 1 (5,200/5,500 x 3,000) and Spouse 2 (300/5,500 x 3,000)",
    # 2,836.36 and 163.64. Its table rounds them to 2,850 and 150.
    # Spouse 2's long-term gain nets against spouse 1's losses and is in
    # neither column.
    adjusted_gross_income: 12_000
    mo_federal_adjusted_gross_income: [7_163.64, 4_836.36]

- name: 12 CSR 10-2.010(2) Example No. 3, one spouse responsible for the excess
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      spouse_1:
        age: 40
