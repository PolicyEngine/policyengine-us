        age: 40
        is_tax_unit_head: true
        employment_income: 40_000
        traditional_ira_contributions: 7_000
        student_loan_interest: 2_500
        educator_expense: 300
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
