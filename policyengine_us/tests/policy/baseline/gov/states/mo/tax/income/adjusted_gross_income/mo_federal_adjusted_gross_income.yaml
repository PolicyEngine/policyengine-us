# Form MO-1040 Line 1 for each filer. On a combined return the Line 1
# worksheet puts each spouse's own income, losses and federal adjustments in
# their column, and the columns add up to joint federal AGI (2023
# instructions, pages 6-7). From 2024 a negative amount is replaced by zero:
# 12 CSR 10-2.710(1), the 2025 instructions' Negative Federal Adjusted Gross
# Income table (page 6) and 12 CSR 10-2.010(5).

- name: Single filer with negative federal AGI keeps it through 2023
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 40
        self_employment_income: -12_000
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: MO
  output:
    adjusted_gross_income: -12_000
    mo_federal_adjusted_gross_income: -12_000

- name: Single filer with negative federal AGI enters zero from 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 40
        self_employment_income: -12_000
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: MO
  output:
    # 2024 instructions, Line 1: "If the amount you would otherwise report as
    # your federal adjusted gross income would be a negative number, enter $0
    # on Line 1."
    adjusted_gross_income: -12_000
    mo_federal_adjusted_gross_income: 0

- name: Combined return through 2023, one spouse's column negative
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        employment_income: 5_000
        self_employment_income: -15_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # Primary: 5,000 of wages and a 15,000 business loss = -10,000.
    # Secondary: 100,000. The columns add up to joint federal AGI, 90,000.
    # (main split the loss by gross income share: 4,285.71 and 85,714.29.)
    adjusted_gross_income: 90_000
    mo_federal_adjusted_gross_income: [-10_000, 100_000]

- name: 2025 table row 1, joint federal AGI 90,000 = (10,000) + 100,000
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        employment_income: 5_000
        self_employment_income: -15_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # Table: Line 1Y (primary) $0.00, Line 1S (secondary) $90,000.
    adjusted_gross_income: 90_000
    mo_federal_adjusted_gross_income: [0, 90_000]

- name: 2025 table row 1 with the head and spouse labels exchanged
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 5_000
        self_employment_income: -15_000
      secondary:
        age: 40
        is_tax_unit_head: true
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    adjusted_gross_income: 90_000
    mo_federal_adjusted_gross_income: [0, 90_000]

- name: 2024 applies the same rule to a combined return
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      primary:
        age: 40
        is_tax_unit_head: true
        employment_income: 5_000
        self_employment_income: -15_000
      secondary:
        age: 40
        is_tax_unit_spouse: true
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [primary, secondary]
    marital_units:
      marital_unit:
        members: [primary, secondary]
    households:
      household:
        members: [primary, secondary]
        state_code: MO
  output:
    # The 2024 instructions say only "enter $0 on Line 1". Giving the
    # secondary spouse the whole 90,000 keeps the worksheet's rule that the
    # columns add up to joint federal AGI, as the 2025 instructions do under
    # the same 12 CSR 10-2.710(1).
    mo_federal_adjusted_gross_income: [0, 90_000]

