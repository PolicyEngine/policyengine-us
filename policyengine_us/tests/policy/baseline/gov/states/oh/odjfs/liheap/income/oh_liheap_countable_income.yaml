# Guidelines pp75-76 exclude TANF (OWF) and child support received; SNAP is a noncash
# benefit and is not an income source; alimony counts (p73).
# General assistance is on neither list, so the E-2.3 catch-all (p8) counts it; the FY2026
# plan (p6) leaves it unchecked. 12,000 wages + 1,200 alimony + 1,200 GA = 14,400.
- name: Case 8, TANF and child support are excluded while alimony and general assistance count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
        child_support_received: 6_000
        alimony_income: 1_200
        general_assistance: 1_200
      person2:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 3_600
        snap: 6_000
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_liheap_countable_income: 14_400

