# Current FY2026 application physical p7 and manual physical p74 deduct child support paid. 30,000 - 3,600 = 26,400, below the one-person ceiling of 27,387.
- name: Case 9, child support paid changes an otherwise over limit household to eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 30_000
        child_support_expense: 3_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_countable_income: 26_400
    oh_liheap_income_limit: 27_387
    oh_liheap_eligible: true

# The same deduction cannot produce negative countable income: max(1,200 - 2,400, 0) = 0.
- name: Case 10, child support paid above income floors countable income at zero.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 1_200
        child_support_expense: 2_400
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_countable_income: 0
    oh_liheap_eligible: true

# Application physical p7 excludes support received while deducting support paid. A parent receives support for the resident child and pays for another child: 12,000 + 600 dividends - 1,200 = 11,400.
