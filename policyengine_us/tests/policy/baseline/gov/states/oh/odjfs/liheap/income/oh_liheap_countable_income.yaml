# Ohio income and eligibility components only; no payment schedule or final award is asserted.

# Manual p8:12000+6000+600+1200+1200=21000; existing net-business inputs need no added work-expense calculation.
- name: Case 1, adult wages and existing net business sources count without another deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
        self_employment_income: 6_000
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        partnership_s_corp_income: 1_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_countable_income: 21_000

