# Ohio income and eligibility components only; no payment schedule or final award is asserted.

# Manual pp7,10: count qualified members including minors; no SNAP-specific waiting bar.
- name: Case 1, citizen minors and qualified adults count but nonqualified members do not.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: LEGAL_PERMANENT_RESIDENT
        is_tax_unit_dependent: false
        ssi: 0
      person2:
        age: 39
        immigration_status: ASYLEE
        is_tax_unit_dependent: false
        ssi: 0
      person3:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person4:
        age: 19
        immigration_status: DACA
        is_tax_unit_dependent: false
        ssi: 0
      person5:
        age: 18
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: OH
  output:
    oh_liheap_household_size: 3

# Manual p10: nonqualified members are excluded from household membership used for eligibility.
- name: Case 2, all nonqualified members produce a zero qualified size.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
      person2:
        age: 8
        immigration_status: DACA
        is_tax_unit_dependent: true
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_liheap_household_size: 0
