# Ohio income and eligibility components only; no payment schedule or final award is asserted.

# Application p1 limit27387 is inclusive; current plan/manual has no asset test.
- name: Case 1, exact one person income ceiling qualifies without an asset test.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 27_387
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        spm_unit_assets: 1_000_000
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: true

# One dollar above27387fails even with categorical-benefit receipts; current plan categoricalNo.
- name: Case 2, TANF and SNAP receipts do not bypass income above the limit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 27_388
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 3_600
        snap: 6_000
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Regular eligibility still requires a primary heating burden.
- name: Case 3, no separate bill and no heat in rent means no heating responsibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Canonical NONE means no heating; an unrelated gas bill cannot establish a primary heating burden.
- name: Case 4, explicit no heating fails despite a gas bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Application p1 energy household includes undesignated heating in rent; flag represents verified arrangement in the contract.
- name: Case 5, verified nonsubsidized heat in rent qualifies without a separate bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: true

# Current plan p8 requires verification the subsidized tenant pays some utility cost.
- name: Case 6, housing assistance with heat in rent needs a reported own portion.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Positive primary gas bill is the approved proxy for the tenant own portion; no guessed benefit amount.
- name: Case 7, reported heating portion restores subsidized heat in rent eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 120
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: true

# Public-housing status independently identifies subsidized heat in rent even when receives_housing_assistance is unset.
- name: Case 8, public housing alone identifies the subsidy restriction.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: OH
        is_in_public_housing: true
  output:
    oh_liheap_eligible: false

# Manual p10 requires an eligible citizen/qualified member; size0must not pass a safe fallback limit.
- name: Case 9, no qualified household member fails eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Manual pp7,10: parent excluded from size, not income. Full28000 exceeds size1limit27387; headcount proration would incorrectly approve.
- name: Case 10, nonqualified adult income is counted in full against citizen child size.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 28_000
      person2:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_liheap_household_size: 1
    oh_liheap_countable_income: 28_000
    oh_liheap_income_limit: 27_387
    oh_liheap_eligible: false

