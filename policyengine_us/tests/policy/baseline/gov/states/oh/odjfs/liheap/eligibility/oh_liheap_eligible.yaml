    oh_liheap_income_limit: 89_862
    oh_liheap_eligible: true

# Threshold edge: in 2027 the floor uses the lagged 2026 guideline (LIHEAP IM 2026-01).
# Size 17 (set directly): limit floor(68,755 x 1.65) = 113,445 (FFY2026 SMI, one-year
# lag); guideline 15,960 + 16 x 5,680 = 106,840; floor round(1.1 x 106,840, 2) = 117,524
# (the unrounded float product is 117,524.00000000001). 117,523.99 passes; exactly
# 117,524 fails. Without the lag the model would read its CPI-projected 2027 guideline
# (gov.hhs.fpg_uprating, 331.359 / 321.943), whose floor is about 120,961, and 117,524 would pass.
- name: Case 15, threshold edge one cent below and at the federal 110 percent floor for a seventeen member household in 2027.
  period: 2027
  input:
    state_code: [OH, OH]
    age: [40, 40]
    immigration_status: [CITIZEN, CITIZEN]
    is_tax_unit_dependent: [false, false]
    ssi: [0, 0]
    oh_liheap_household_size: [17, 17]
    employment_income: [117_523.99, 117_524]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_200, 1_200]
  output:
    oh_liheap_income_limit: [113_445, 113_445]
    oh_liheap_eligible: [true, false]

# Threshold edge with a household built from its members: two working parents and fifteen
# dependent children, all citizens, give size 17. The 2026 limit, floor(68,755 x 1.65) =
# 113,445, is below the 110% floor, round(1.1 x (15,650 + 16 x 5,500), 2) = 114,015. Wages
# of 70,000 + 43,446 = 113,446 are $1 above the printed limit and pass only through the
# floor.
- name: Case 16, threshold edge for a seventeen member household built from its members that passes only through the federal floor.
  period: 2026
  input:
    people:
      person1: {age: 45, immigration_status: CITIZEN, is_tax_unit_dependent: false, ssi: 0, employment_income: 70_000}
      person2: {age: 43, immigration_status: CITIZEN, is_tax_unit_dependent: false, ssi: 0, employment_income: 43_446}
      person3: {age: 17, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person4: {age: 16, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person5: {age: 15, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person6: {age: 14, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person7: {age: 13, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person8: {age: 12, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person9: {age: 11, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person10: {age: 10, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person11: {age: 9, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person12: {age: 8, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person13: {age: 7, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
      person14: {age: 6, immigration_status: CITIZEN, is_tax_unit_dependent: true, ssi: 0}
