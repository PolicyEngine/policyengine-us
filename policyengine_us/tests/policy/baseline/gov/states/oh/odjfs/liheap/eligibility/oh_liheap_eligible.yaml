# Ohio income and eligibility components only; no payment schedule or final award is asserted.

# 2025-2026 application p1: the $27,387 limit is inclusive; the FY2026 plan and the
# Guidelines have no asset test.
- name: Case 1, exact one person income ceiling qualifies without an asset test.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 27_387
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        spm_unit_assets: 1_000_000
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: true

# One dollar above $27,387 fails even with TANF and SNAP receipts; FY2026 plan item 1.4
# answers No to categorical eligibility.
- name: Case 2, TANF and SNAP receipts do not bypass income above the limit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 27_388
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        tanf: 3_600
        snap: 6_000
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Regular eligibility still requires a primary heating burden.
- name: Case 3, no separate bill and no heat in rent means no heating responsibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Canonical NONE means no heating; an unrelated gas bill cannot establish a primary heating burden.
- name: Case 4, explicit no heating fails despite a gas bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Application p1 counts undesignated heat payments in rent; Guidelines E-4 (p12) does not
# require the bill in a member's name for HEAP.
- name: Case 5, verified nonsubsidized heat in rent qualifies without a separate bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: true

# FY2026 plan item 2.3 (p8) and the accepted FY2027 plan item 2.3 (p9) require verification that a subsidized tenant pays part of the electric bill.
- name: Case 6, housing assistance with heat in rent needs a reported own portion.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# A positive primary gas bill stands in for the subsidized tenant's own portion.
- name: Case 7, reported heating portion restores subsidized heat in rent eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
