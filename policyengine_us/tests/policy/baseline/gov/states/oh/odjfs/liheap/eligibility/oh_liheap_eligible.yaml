# 2022-2023 Guidelines E-2.2 (p7) apply 175% FPG to every size: size 9 limit
# (13,590 + 8 x 4,720) x 1.75 = 89,862.5 -> 89,862. Wages 50,000 + 30,000 = 80,000 qualify;
# 60% SMI (floor(0.6 x 93,649) = 56,189 x 1.41 = 79,226) would have denied them.
- name: Case 14, a nine member household in 2023 uses the poverty guideline limit.
  period: 2023
