      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13, person14, person15, person16, person17]
        heating_type: NATURAL_GAS
        gas_expense: 1_800
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13, person14, person15, person16, person17]
        state_code: OH
  output:
    oh_liheap_household_size: 17
    oh_liheap_countable_income: 113_446
    oh_liheap_income_limit: 113_445
    oh_liheap_eligible: true
