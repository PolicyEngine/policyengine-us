        ssi: 0
        employment_income: 30_000
      person3:
        age: 17
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person4:
        age: 15
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person5:
        age: 13
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person6:
        age: 11
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person7:
        age: 9
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person8:
        age: 6
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
      person9:
        age: 3
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
