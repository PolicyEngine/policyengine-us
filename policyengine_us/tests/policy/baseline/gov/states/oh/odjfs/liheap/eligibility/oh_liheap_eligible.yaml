      person1:
        age: 40
        immigration_status: CITIZEN
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 0
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: OH
        is_in_public_housing: true
  output:
    oh_liheap_eligible: false

# Guidelines E-2.8 (p10) requires at least one citizen or qualified member; a size-0 unit fails.
- name: Case 9, no qualified household member fails eligibility.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    oh_liheap_eligible: false

# Guidelines E-2.1 and E-2.8 (pp6-7, 10): the parent is excluded from size, not income. The
# full 28,000 exceeds the size-1 limit of 27,387; prorating by headcount would approve.
- name: Case 10, nonqualified adult income is counted in full against citizen child size.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        is_tax_unit_dependent: false
        ssi: 0
        employment_income: 28_000
      person2:
        age: 8
        immigration_status: CITIZEN
        is_tax_unit_dependent: true
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_liheap_household_size: 1
    oh_liheap_countable_income: 28_000
    oh_liheap_income_limit: 27_387
    oh_liheap_eligible: false

