- name: Case 1, both spouses in approved care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        oh_rss_certified: true
        medicaid_enrolled: true
      person2:
        age: 65
        oh_rss_certified: true
        medicaid_enrolled: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_rss: [1_054.5, 1_054.5]

