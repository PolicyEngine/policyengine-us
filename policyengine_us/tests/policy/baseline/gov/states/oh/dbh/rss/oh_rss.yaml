- name: Case 17, interest and dividends excluded from RSS income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 55
    oh_rss_certified: true
    medicaid_enrolled: true
    meets_ssi_disability_criteria: true
    # SSA Monthly Statistical Snapshot, August 2026: average disabled-worker
    # benefit $1,635.90; $1,636 x 12 = 19,632.
    social_security_disability: 19_632
    # $1,200 in savings at 4% and $400 in a dividend fund at 3%.
    bank_account_assets: 1_200
    taxable_interest_income: 48
    stock_assets: 400
    qualified_dividend_income: 12
  output:
    oh_rss_eligible: true
    # SSI counts interest and dividends: 1,636 + 48 / 12 + 12 / 12 = 1,641.
    ssi_unearned_income: 1_641
    # 1,641 - 20 = 1,621.
    ssi_countable_income: 1_621
    # 994 - 1,621 < 0.
    ssi: 0
    # 5160:1-3-03.2(D)(2)(v): 1,641 - 4 - 1 = 1,636; 1,636 - 20 = 1,616; SSI 0.
    oh_rss_countable_income: 1_616
    # Resources 1,200 + 400 = 1,600 <= 2,000; 1,800 - 1,616 = 184.
    oh_rss: 184

- name: Case 18, disabled working student earnings excluded.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 20
    oh_rss_certified: true
    medicaid_enrolled: true
    meets_ssi_disability_criteria: true
    is_full_time_college_student: true
    # Ohio minimum wage $11.00 (US DOL state minimum wage table) x 15 hours
    # x 52 weeks = 8,580.
    employment_income: 8_580
    # SSA Monthly Statistical Snapshot, August 2026: average benefit for
    # children of deceased workers $1,181.07; $1,181 x 12 = 14,172.
    social_security_survivors: 14_172
  output:
    oh_rss_eligible: true
    # 8,580 / 12 = 715 < 2,410 monthly limit; 8,580 a year < 9,730 cap.
    ssi_blind_or_disabled_working_student_exclusion: 715
    # Earned 715 - 715 = 0; unearned 1,181 - 20 = 1,161.
    ssi_countable_income: 1_161
    # 994 - 1,161 < 0.
    ssi: 0
    # Same exclusion: 0 earned + (1,181 - 20) unearned + SSI 0 = 1,161.
    oh_rss_countable_income: 1_161
    # 1,800 - 1,161 = 639. Without the exclusion, (715 - 65) / 2 = 325 more
    # would count and pay 314.
    oh_rss: 639
