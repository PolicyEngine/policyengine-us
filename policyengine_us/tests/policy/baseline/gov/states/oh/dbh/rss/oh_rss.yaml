- name: Case 1, full SSI.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
  output:
    # No other income: SSI pays the 994 federal benefit rate.
    ssi: 994
    oh_rss_countable_income: 994
    # 1,600 fee + 200 allowance - SSI 994 = 806.
    oh_rss: 806

- name: Case 2, non SSI Social Security.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
    # SSA Monthly Statistical Snapshot, August 2026, Table 2: average
    # disabled-worker benefit $1,635.90; 1,635.90 x 12 = 19,630.80.
    social_security_disability: 19_630.8
  output:
    # 1,635.90 - 20 = 1,615.90 > 994, so no SSI.
    ssi: 0
    oh_rss_countable_income: 1_615.9
    # 1,800 - 1,615.90 = 184.10.
    oh_rss: 184.1

- name: Case 3, countable income exactly at the income standard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
    oh_rss_countable_income: 1_800
  output:
    oh_rss_eligible: true
    # 5160:1-5-01(E)(4)(b): income equal to the 1,800 standard is ineligible.
    oh_rss: 0

- name: Case 4, countable income one dollar below the income standard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
    oh_rss_countable_income: 1_799
  output:
    # 1,800 - 1,799 = 1.
    oh_rss: 1

- name: Case 5, income above threshold.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
    # SSA Monthly Statistical Snapshot, August 2026, Table 2: average
    # retired-worker benefit $2,087.52; 2,087.52 x 12 = 25,050.24.
    social_security_retirement: 25_050.24
  output:
    # 2,087.52 - 20 = 2,067.52 > 994, so no SSI.
    ssi: 0
    oh_rss_countable_income: 2_067.52
    # 2,067.52 > 1,800 standard.
    oh_rss: 0

- name: Case 6, earned income exclusion.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: OH
    age: 65
    oh_rss_certified: true
    medicaid_enrolled: true
    # Ohio minimum wage $11.00 (US DOL state minimum wage table) x 5 hours
    # x 52 weeks = 2,860.
    employment_income: 2_860
  output:
    # 2,860 / 12 = 238.33; (238.33 - 20 - 65) / 2 = 76.67.
    ssi_countable_income: 76.67
    # 994 - 76.67 = 917.33.
    ssi: 917.33
    # Same exclusions: 76.67 + SSI 917.33 = 994.
    oh_rss_countable_income: 994
    # 1,800 - 994 = 806.
    oh_rss: 806

