# Procedure Letter 36, pages 2 and 4: one monthly payment per child, up to the provider's private rate.

- name: Family of three earning $40,000 with a toddler and a preschooler at centers.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 2
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 24_000
        childcare_hours_per_week: 40
      person3:
        age: 4
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 24_000
        childcare_hours_per_week: 40
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        oh_ccap_countable_income: 3_333.33
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    # Procedure Letter 36: 800 + 750.
    oh_ccap_eligible: false
    oh_ccap: 0
    oh_ccvp_eligible: true
    oh_ccvp: 1_550

- name: The charge caps the payment for each child.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 2
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 6_000
      person3:
        age: 4
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 24_000
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        oh_ccap_countable_income: 3_500
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    # min(800, 6,000 / 12 = 500) + min(750, 2,000) = 1,250.
    oh_ccvp: 1_250

