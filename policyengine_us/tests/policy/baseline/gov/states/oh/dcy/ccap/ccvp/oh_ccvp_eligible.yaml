# Ohio Child Care Choice Voucher Program eligibility.
# Procedure Letter 36 (October 29, 2025), pages 3-4: income of 146-200% of poverty, all other
# Publicly Funded Child Care conditions, and no family eligible for that program.
# Procedure Letter 21, page 2, and Procedure Letter 45, page 2, print the monthly limits.
# H.B. 96, Section 423.190, sets the same income conditions in law.

- name: Family of three at the January 2026 Publicly Funded Child Care intake limit stays on that program.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 2
        immigration_status: CITIZEN
      person3:
        age: 4
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        oh_ccap_countable_income: 3_221
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    # Procedure Letter 21: 145% prints $3,221 for three.
    oh_ccap_income_eligible: true
    oh_ccvp_eligible: false

