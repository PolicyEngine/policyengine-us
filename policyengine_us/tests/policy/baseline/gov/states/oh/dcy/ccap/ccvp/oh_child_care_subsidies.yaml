- name: Annual subsidies add voucher payments across 2026.
  period: 2026
  absolute_error_margin: 0.05
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 42_000
      person2:
        age: 2
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 24_000
        childcare_hours_per_week: 40
      person3:
        age: 4
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 24_000
        childcare_hours_per_week: 40
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
        county_str: BROWN_COUNTY_OH
  output:
    # 10 months x 1,550 + 2 months x 1,473.33.
    oh_child_care_subsidies: 18_446.67

