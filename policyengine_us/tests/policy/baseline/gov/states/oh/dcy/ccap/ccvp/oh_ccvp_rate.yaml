          2026: 40
        pre_subsidy_childcare_expenses:
          2026: 24_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: OH
        county_str:
          2026: BROWN_COUNTY_OH
  output:
    # OAC 5180:6-1-10 Appendix A, category 1 center toddler full-time: 180 a week x 52 / 12 = 780.
    oh_ccvp_rate: [0, 780]

