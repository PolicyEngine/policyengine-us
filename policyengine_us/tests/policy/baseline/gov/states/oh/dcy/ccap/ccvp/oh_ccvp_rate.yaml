- name: November 2026 pays the Publicly Funded Child Care rate for a toddler at a center.
  period: 2026-11
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 30
      person2:
        age:
          2026: 2
        immigration_status:
          2026: CITIZEN
        childcare_hours_per_week:
          2026: 40
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: OH
        county_str:
          2026: BROWN_COUNTY_OH
  output:
    # OAC 5180:6-1-10 Appendix A, category 1 center toddler full-time: 180 a week x 52 / 12 = 780.
    oh_ccvp_rate: [0, 780]

