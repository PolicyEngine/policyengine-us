# Procedure Letter 36, pages 2-3: monthly voucher payment by provider type and age from November 1, 2025.
# H.B. 96, Section 423.190: Publicly Funded Child Care payment rates by November 1, 2026, without the
# Step Up to Quality enhancement.

- name: January 2026 center rate for an infant.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 0.5
        immigration_status: CITIZEN
        childcare_hours_per_week: 40
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_ccvp_rate: [0, 900]

- name: January 2026 home rate for an infant.
  period: 2026-01
  input:
