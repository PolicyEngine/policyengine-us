- name: Income and subtractions
  absolute_error_margin: 0.01
  period: 2021
  input:
    state_code: OH
    oh_agi_person: 67_000
    oh_joint_filing_credit_agi_subtractions: 40_000
  output:
    oh_joint_filing_credit_qualifying_income: 27_000

- name: Subtractions cannot be negative
  absolute_error_margin: 0.01
  period: 2025
  input:
    state_code: OH
    oh_agi_person: -10_000
    oh_joint_filing_credit_agi_subtractions: -40_000
  output:
    oh_joint_filing_credit_qualifying_income: -10_000

- name: Total income can be negative
  absolute_error_margin: 0.01
  period: 2025
  input:
    state_code: OH
    oh_agi_person: 4_000
    oh_joint_filing_credit_agi_subtractions: 10_000
  output:
    oh_joint_filing_credit_qualifying_income: -6_000

- name: The spouse's own IRA deduction counts against the spouse's qualifying income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 60_000
      spouse:
        age: 45
        employment_income: 3_000
        traditional_ira_contributions: 2_800
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: OH
  output:
    # The spouse's AGI is $200, under the $500 each spouse needs
    # (R.C. 5747.05(E)). Before, half the IRA deduction went to the head:
    # [58_600, 1_600], and the couple qualified.
    oh_joint_filing_credit_qualifying_income: [60_000, 200]
    oh_joint_filing_credit_eligible: false

- name: A qualifying capital gain deducted from Ohio AGI is not excluded again
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        employment_income: 600
        long_term_capital_gains: 100_000
        oh_qualifying_capital_gain: 100_000
        oh_qualifying_capital_gain_deductible_payroll: 60_000
      person2:
        age: 50
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    # Person 1's Ohio AGI is 100_600 - 60_000 = 40_600, of which 40_000 is
    # capital gain still in Ohio AGI. R.C. 5747.05(E)(1) excludes capital gains
    # from "adjusted gross income", so qualifying income is 600, not
    # 40_600 - 100_000.
    oh_joint_filing_credit_qualifying_income: [600, 50_000]
