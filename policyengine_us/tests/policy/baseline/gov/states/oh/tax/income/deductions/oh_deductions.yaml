- name: A dependent's U.S. government interest is not deducted
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 60_000
        us_govt_interest_person: 200
        taxable_interest_income: 200
      child:
        age: 10
        us_govt_interest_person: 50_000
        taxable_interest_income: 50_000
    household:
      state_code: OH
  output:
    oh_deductions: [200, 0]

- name: Ohio deducts the disability benefits included in federal AGI.
  period: 2024
  input:
    people:
      person:
        age: 50
        disability_benefits: 10_000
        tax_exempt_disability_benefits: 4_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: OH
  output:
    # 10,000 - 4,000 = 6,000.
    oh_deductions: 6_000
    adjusted_gross_income_person: 6_000
    # 6,000 federal AGI - 6,000 deduction = 0. Deducting the full 10,000
    # would take Ohio AGI below zero.
    oh_agi_person: 0
