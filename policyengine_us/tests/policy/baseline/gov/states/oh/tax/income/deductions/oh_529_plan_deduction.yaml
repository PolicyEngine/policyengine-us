- name: deduction capped
  period: 2021
  input:
    state_code: OH
    investment_in_529_plan_indv: 4_500
    count_529_contribution_beneficiaries: 1
  output:
    oh_529_plan_deduction: 4_000

- name: A dependent contributor cannot increase the filers' contribution or cap
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        investment_in_529_plan_indv: 6_000
        count_529_contribution_beneficiaries: 1
      child:
        age: 10
        is_tax_unit_dependent: true
        investment_in_529_plan_indv: 5_000
        count_529_contribution_beneficiaries: 1
    household:
      state_code: OH
  output:
    # The filer contributed 6,000 for one beneficiary: min(6,000, 4,000).
    oh_529_plan_deduction: 4_000

- name: Two beneficiaries increases the cap
  period: 2021
  input:
    people: 
      person1:
        investment_in_529_plan_indv: 4_500
        count_529_contribution_beneficiaries: 1
      person2:
        investment_in_529_plan_indv: 4_500
        count_529_contribution_beneficiaries: 1
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_529_plan_deduction: 8_000

- name: One beneficiary
  period: 2021
  input:
    people: 
      person1:
        investment_in_529_plan_indv: 4_500
        count_529_contribution_beneficiaries: 1
      person2:
        investment_in_529_plan_indv: 4_500
        count_529_contribution_beneficiaries: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    oh_529_plan_deduction: 4_000
