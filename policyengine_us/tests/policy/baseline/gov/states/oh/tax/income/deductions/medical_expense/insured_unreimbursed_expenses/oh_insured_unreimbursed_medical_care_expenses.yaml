- name: The expense amount is reduced by the AGI floor
  period: 2022
  input:
    state_code: OH
    oh_insured_unreimbursed_medical_care_expense_amount: 100
    adjusted_gross_income: 1_000
  output:
    oh_insured_unreimbursed_medical_care_expenses: 25


- name: Two people with combined expenses reduced by the AGI floor
  period: 2022
  input:
    people:
      head:
        oh_insured_unreimbursed_medical_care_expense_amount: 500
      spouse:
        oh_insured_unreimbursed_medical_care_expense_amount: 200
    tax_units:
      tax_unit:
        members: [head, spouse]
        adjusted_gross_income: 2_000
    households:
      household:
        members: [head, spouse]
        state_code: OH
  output:
    oh_insured_unreimbursed_medical_care_expenses: 550

- name: Capped at 0
  period: 2022
  input:
    state_code: OH
    oh_insured_unreimbursed_medical_care_expense_amount: 70
    adjusted_gross_income: 1_000
  output:
    oh_insured_unreimbursed_medical_care_expenses: 0

- name: Negative federal AGI is entered as zero on line 6
  period: 2025
  input:
    state_code: OH
    oh_insured_unreimbursed_medical_care_expense_amount: 1_000
    adjusted_gross_income: -20_000
  output:
    # Worksheet line 6 is max(-20,000, 0) = 0, so line 7 is 0 and line 8 is
    # 1,000 - 0 = 1,000. The deduction never exceeds the expenses paid.
    oh_insured_unreimbursed_medical_care_expenses: 1_000

- name: Negative federal AGI with no expenses gives no deduction
  period: 2025
  input:
    state_code: OH
    oh_insured_unreimbursed_medical_care_expense_amount: 0
    adjusted_gross_income: -20_000
  output:
    oh_insured_unreimbursed_medical_care_expenses: 0
