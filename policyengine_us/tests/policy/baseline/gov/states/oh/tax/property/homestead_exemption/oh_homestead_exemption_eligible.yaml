- name: Case 8, a total income input overrides the same year's Ohio modified adjusted gross income.
  period: 2026
  input:
    people:
      person1:
        age: 65
        assessed_property_value: 200_000
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        oh_modified_agi: 0
        oh_homestead_exemption_total_income: 41_001
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    # Total income is given as 41,001, so the 0 modified AGI is not read.
    # 41,001 > 41,000 (2026 income limit).
    oh_homestead_exemption_eligible: false

