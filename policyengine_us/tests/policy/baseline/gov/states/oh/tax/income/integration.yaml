        members: [person1, person2, person3]
        aca_ptc: 0  # not in TAXSIM35
    households:
      household:
        members: [person1, person2, person3]
        state_fips: 39  # OH
  output:
    # Patched TAXSIM35 (2024-03-09) gives 2_818.55, but it does not apply
    # Ohio's business income deduction (R.C. 5747.01(A)(28)). With it: the
    # Schedule C income of 28_010 is deducted in full; Ohio AGI 80_081.16;
    # MAGI 108_091.16, so three exemptions of 1_900; lines 5 and 7 =
    # 74_381.16; line 8a = 1_850.54 in the model (1_850.45 on the 2021 table,
    # the same pre-existing $0.09 base difference).
    oh_business_income_deduction: 28_010
    oh_income_tax: 1_850.54

