- name: Tax unit with taxsimid 94803 in j21.its.csv and j21.ots.csv
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        age: 48
        employment_income: 152_010
        qualified_dividend_income: 4_005
        taxable_interest_income: 5_505
        short_term_capital_gains: 3_505
        long_term_capital_gains: 3_005
        rental_income: 4_005
        rent: 17_000
        self_employment_income: 160_010
        business_is_qualified: true
        business_is_sstb: false
        w2_wages_from_qualified_business: 100e6
      person2:
        age: 48
        employment_income: 53_010
        qualified_dividend_income: 4_005
        taxable_interest_income: 5_505
        short_term_capital_gains: 3_505
        long_term_capital_gains: 3_005
        rental_income: 4_005
      person3:
        age: 11
      person4:
        age: 11
      person5:
        age: 11
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_fips: 39  # OH
  output:
    # Patched TAXSIM35 (2024-02-21) gives 13_756.36, but it does not apply
    # Ohio's business income deduction (R.C. 5747.01(A)(28)). With it: the
    # Schedule C income of 160_010 is deducted in full (Schedule of Business
    # Income lines 10-13); Ohio AGI 242_927.34; MAGI 402_937.34, so five
    # exemptions of 1_900; lines 5 and 7 = 233_427.34; line 8a = 8_021.96 in
    # the model (the 2021 table's $346.16 base gives 8_021.87; the model's
    # first-bracket rate gives a $0.09 higher base, as before this change);
    # joint filing credit 5% = 401.10; tax 7_620.86.
    oh_business_income_deduction: 160_010
    oh_income_tax: 7_620.86

