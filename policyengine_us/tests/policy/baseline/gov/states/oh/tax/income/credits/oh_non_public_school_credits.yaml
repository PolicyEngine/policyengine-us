# R.C. 5747.75 counts tuition paid for the taxpayer's dependents, so each
# case records the tuition on a dependent child.
- name: AGI Not eligible
  period: 2021
  input:
    people:
      parent:
        age: 40
      child1:
        age: 10
        is_tax_unit_dependent: true
        non_public_school_tuition: 1000
    tax_units:
      tax_unit:
        members: [parent, child1]
        adjusted_gross_income: 100000
        oh_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members: [parent, child1]
        state_code: OH
  output:
    oh_non_public_school_credits: 0

