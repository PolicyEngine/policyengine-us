- name: 2024 single filer who can be claimed as a dependent: Ohio nonpublic school tuition credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      child_1:
        age: 6
        non_public_school_tuition: 400
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child_1]
    households:
      household:
        members: [person_a, child_1]
        state_code: OH
  output:
    # R.C. 5747.75 counts tuition paid for the taxpayer's dependents, and
    # 5747.01(O) takes dependents from the IRC. IRC 152(b)(1): a return on which the filer (or, if joint, either spouse) can be claimed as a dependent has no dependents.
    oh_non_public_school_credits_potential: 0

- name: 2024 joint return with one spouse who can be claimed as a dependent: Ohio nonpublic school tuition credit (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
      child_1:
        age: 6
        non_public_school_tuition: 400
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child_1]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child_1]
        state_code: OH
  output:
    oh_non_public_school_credits_potential: 0

