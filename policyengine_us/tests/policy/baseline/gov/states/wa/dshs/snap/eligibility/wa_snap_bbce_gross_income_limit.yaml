# WAC 388-414-0001(2)(a)(ii): the 200% FPL standard re-bases on the
# current-year poverty guidelines each April 1, rounded to the closest
# whole dollar.
- name: One person in March 2025 uses the 2024 guidelines
  period: 2025-03
  input:
    people:
      person1:
        age:
          2025: 30
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2025: WA
  output:
    # 200% x 15,060 / 12 = 2,510.
    wa_snap_bbce_gross_income_limit: 2_510

- name: One person in April 2025 moves to the 2025 guidelines
  period: 2025-04
  input:
    people:
      person1:
        age:
          2025: 30
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2025: WA
  output:
    # 200% x 15,650 / 12 = 2,608.33, rounded to 2,608.
    wa_snap_bbce_gross_income_limit: 2_608

- name: One person in March 2026 still uses the 2025 guidelines
  period: 2026-03
  input:
    people:
      person1:
        age:
          2026: 30
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2026: WA
  output:
    wa_snap_bbce_gross_income_limit: 2_608

- name: One person in April 2026 moves to the 2026 guidelines
  period: 2026-04
  input:
    people:
      person1:
        age:
          2026: 30
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2026: WA
  output:
    # 200% x 15,960 / 12 = 2,660.
    wa_snap_bbce_gross_income_limit: 2_660

- name: Two persons in April 2026 round 3,606.67 up to 3,607
  period: 2026-04
  input:
    people:
      person1:
        age:
          2026: 30
      person2:
        age:
          2026: 28
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: WA
  output:
    # 200% x (15,960 + 5,680) / 12 = 3,606.67, rounded to 3,607.
    wa_snap_bbce_gross_income_limit: 3_607

- name: Four persons in April 2026 use the additional person amount
  period: 2026-04
  input:
    people:
      parent1:
        age:
          2026: 35
      parent2:
        age:
          2026: 34
      child1:
        age:
          2026: 8
      child2:
        age:
          2026: 5
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code:
          2026: WA
  output:
    # 200% x (15,960 + 3 x 5,680) / 12 = 5,500.
    wa_snap_bbce_gross_income_limit: 5_500
