# Tests for Feb 2024+ resource limits ($12,000)
- name: Case 1, assets at $12,000 resource limit.
  period: 2025
  input:
    state_code: WA
    bank_account_assets: 12_000
  output:
    # Resource limit: $12,000 (Feb 2024+)
    wa_tanf_resources_eligible: true

- name: Case 2, assets above $12,000 resource limit.
  period: 2025
  input:
    state_code: WA
    bank_account_assets: 13_000
  output:
    wa_tanf_resources_eligible: false

# Historical tests - verify pre-Feb-2024 resource limits
- name: Case 3, 2024-01 uses $6,000 limit (before Feb 2024).
  period: 2024-01
  input:
    state_code: WA
    bank_account_assets: 6_000
  output:
    # Resource limit in Jan 2024: $6,000
    wa_tanf_resources_eligible: true

- name: Case 4, 2024-01 over $6,000 limit.
  period: 2024-01
  input:
    state_code: WA
    bank_account_assets: 6_001
  output:
    wa_tanf_resources_eligible: false

- name: Case 5, 2018-01 uses $1,000 limit (before 2019).
  period: 2018-01
  input:
    state_code: WA
    bank_account_assets: 1_000
  output:
    # Resource limit in 2018: $1,000
    wa_tanf_resources_eligible: true

- name: Case 6, 2018-01 over $1,000 limit.
  period: 2018-01
  input:
    state_code: WA
    bank_account_assets: 1_001
  output:
    wa_tanf_resources_eligible: false

# 8,978.98 + 2,564.81 + 456.21 = 12,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 12,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025
  input:
    age: 30
    bank_account_assets: 8_978.98
    stock_assets: 2_564.81
    bond_assets: 456.21
    state_code: WA
  output:
    wa_tanf_resources_eligible: true

# 8,978.98 + 2,564.81 + 456.22 = 12,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025
  input:
    age: 30
    bank_account_assets: 8_978.98
    stock_assets: 2_564.81
    bond_assets: 456.22
    state_code: WA
  output:
    wa_tanf_resources_eligible: false
