# FY2026 plan sections 1.8-1.9; Byrd Barr FY2025-26 application pages 1-2;
# Commerce 2026 manual Policy 1.1.2, pages 14-15. SSA subtype deduction is unverified.

- name: Case 1, payroll wages receive the twenty-percent deduction.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 24000
  output:
    wa_liheap_countable_income: 19200

- name: Case 2, net business income receives no second deduction.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 12000
    self_employment_income: 12000
  output:
    wa_liheap_countable_income: 21600

- name: Case 3, business losses do not offset wages.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 12000
    self_employment_income: -3000
  output:
    wa_liheap_countable_income: 9600

- name: Case 4, minor wages and business earnings are excluded.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 17
    employment_income: 10000
    self_employment_income: 2000
  output:
    wa_liheap_countable_income: 0

- name: Case 5, earnings count at age eighteen.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 18
    employment_income: 10000
  output:
    wa_liheap_countable_income: 8000

- name: Case 6, pensions and retirement distributions receive ten percent.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    pension_income: 10000
    retirement_distributions: 2000
  output:
    wa_liheap_countable_income: 10800

- name: Case 7, unemployment receives ten percent.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    unemployment_compensation: 12000
  output:
    wa_liheap_countable_income: 10800

- name: Case 8, Social Security retirement remains fully counted pending subtype evidence.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    social_security_retirement: 12000
  output:
    wa_liheap_countable_income: 12000

- name: Case 9, Social Security disability and SSI remain fully counted.
  period: 2026
  input:
    state_code: WA
    ssi: 2400
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    social_security_disability: 12000
  output:
    wa_liheap_countable_income: 14400

- name: Case 10, reported aggregate Social Security is not duplicated.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    social_security: 15000
    social_security_retirement: 10000
  output:
    wa_liheap_countable_income: 15000

- name: Case 11, TANF and State Family Assistance count once per unit.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 1200
    wa_sfa: 2400
    age: 40
  output:
    wa_liheap_countable_income: 3600

- name: Case 12, child support received counts and paid support is deducted.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    child_support_received: 5000
    child_support_expense: 1200
  output:
    wa_liheap_countable_income: 3800

- name: Case 13, support deduction cannot create negative income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 1000
    child_support_expense: 3000
  output:
    wa_liheap_countable_income: 0

- name: Case 14, negative support cannot raise income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 1000
    child_support_expense: -2000
  output:
    wa_liheap_countable_income: 800

- name: Case 15, VA benefits and insurance payments are excluded under the FY2026 plan.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 50
    veterans_benefits: 20000
    disability_benefits: 5000
    life_insurance_benefits: 10000
  output:
    wa_liheap_countable_income: 0

- name: Case 16, refundable credits and balances are excluded.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    income_tax_refundable_credits: 5000
    bank_account_assets: 100000
  output:
    wa_liheap_countable_income: 0

- name: Case 17, ordinary income sources count without duplicate components.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    strike_benefits: 1000
    general_assistance: 2000
    financial_assistance: 3000
    rental_income: 4000
    farm_rent_income: 5000
    alimony_income: 6000
    child_support_received: 7000
    interest_income: 8000
    ordinary_dividend_income: 9000
  output:
    wa_liheap_countable_income: 45000

- name: Case 18, rental losses do not offset positive income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    rental_income: -10000
    farm_rent_income: 2000
    employment_income: 12000
  output:
    wa_liheap_countable_income: 11600

- name: Case 19, private and public pension components are counted only through pension income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    taxable_private_pension_income: 10000
    taxable_public_pension_income: 2000
  output:
    wa_liheap_countable_income: 10800

- name: Case 20, separate net business sources retain their positive amounts.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    self_employment_income: 1000
    sstb_self_employment_income: 2000
    farm_operations_income: 3000
    partnership_s_corp_income: 4000
  output:
    wa_liheap_countable_income: 10000

- name: Case 21, a minors unearned income counts while wages are excluded.
  period: 2026
  input:
    people:
      person1: {age: 40, employment_income: 12_000, ssi: 0}
      person2: {age: 10, employment_income: 2_000, child_support_received: 3_000, ssi: 1_200}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 0, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    wa_liheap_countable_income: 13_800

- name: Case 22, income from an undocumented parent remains countable.
  period: 2026
  input:
    people:
      person1: {age: 40, immigration_status: UNDOCUMENTED, employment_income: 24_000, ssi: 0}
      person2: {age: 10, immigration_status: CITIZEN, ssi: 0}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 0, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    wa_liheap_household_size: 1
    wa_liheap_countable_income: 19_200

- name: Case 23, household-level assistance is not multiplied by member count.
  period: 2026
  input:
    people:
      person1: {age: 40, ssi: 0}
      person2: {age: 10, ssi: 0}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 6_000, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    wa_liheap_countable_income: 6_000

- name: Case 24, Washington income calculation is zero outside Washington.
  period: 2026
  input:
    state_code: OR
    age: 40
    employment_income: 24_000
  output:
    wa_liheap_countable_income: 0
