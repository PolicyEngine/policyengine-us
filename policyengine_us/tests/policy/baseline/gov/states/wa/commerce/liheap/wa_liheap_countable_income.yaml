# FY2026 plan sections 1.8-1.9; Byrd Barr FY2025-26 application pages 1-2;
# Commerce 2026 manual Policy 1.1.2, pages 14-15. Social Security counts net of the
# Medicare Part B premium; no SSA subtype retirement deduction is applied.

- name: Case 1, payroll wages receive the twenty-percent deduction.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 24000
  output:
    wa_liheap_countable_income: 19200

- name: Case 2, net business income receives no second deduction.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 12000
    self_employment_income: 12000
  output:
    wa_liheap_countable_income: 21600

- name: Case 3, business losses do not offset wages.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 12000
    self_employment_income: -3000
  output:
    wa_liheap_countable_income: 9600

- name: Case 4, minor wages and business earnings are excluded.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 17
    employment_income: 10000
    self_employment_income: 2000
  output:
    wa_liheap_countable_income: 0

- name: Case 5, earnings count at age eighteen.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 18
    employment_income: 10000
  output:
    wa_liheap_countable_income: 8000

- name: Case 6, pensions and retirement distributions receive ten percent.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    pension_income: 10000
    retirement_distributions: 2000
  output:
    wa_liheap_countable_income: 10800

- name: Case 7, unemployment receives ten percent.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    unemployment_compensation: 12000
  output:
    wa_liheap_countable_income: 10800

- name: Case 8, Social Security counts in full when a Medicare Savings Program pays the Part B premium.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    social_security_retirement: 12000
  output:
    # MSP income: (12,000 - 240) / 12 = 980 < 1.35 * 15,960 / 12 = 1,795.50,
    # so the program pays the 12 * 202.90 premium and none is deducted.
    medicare_part_b_premium: 0
    wa_liheap_countable_income: 12000

- name: Case 9, Social Security disability and SSI remain fully counted.
  period: 2026
  input:
    state_code: WA
    ssi: 2400
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    social_security_disability: 12000
  output:
    wa_liheap_countable_income: 14400

- name: Case 10, reported aggregate Social Security is not duplicated.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    social_security: 15000
    social_security_retirement: 10000
  output:
    # MSP income (15,000 - 240) / 12 = 1,230 is below 1,795.50, so the
    # program pays the Part B premium and the aggregate counts once in full.
    wa_liheap_countable_income: 15000

- name: Case 11, TANF and State Family Assistance count once per unit.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 1200
    wa_sfa: 2400
    age: 40
  output:
    wa_liheap_countable_income: 3600

- name: Case 12, child support received counts and paid child support is deducted.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    child_support_received: 5000
    child_support_expense: 1200
  output:
    # Commerce Exhibit 1.3.1A lists child support received and paid:
    # 5,000 received - 1,200 paid = 3,800.
    wa_liheap_countable_income: 3800

- name: Case 13, VA benefits and insurance payments are excluded under the FY2026 plan.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 50
    veterans_benefits: 20000
    disability_benefits: 5000
    life_insurance_benefits: 10000
  output:
    wa_liheap_countable_income: 0

- name: Case 14, refundable credits and balances are excluded.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    income_tax_refundable_credits: 5000
    bank_account_assets: 100000
  output:
    wa_liheap_countable_income: 0

- name: Case 15, ordinary income sources count without duplicate components.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    strike_benefits: 1000
    general_assistance: 2000
    financial_assistance: 3000
    rental_income: 4000
    farm_rent_income: 5000
    alimony_income: 6000
    child_support_received: 7000
    interest_income: 8000
    ordinary_dividend_income: 9000
  output:
    wa_liheap_countable_income: 45000

- name: Case 16, rental losses do not offset positive income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    rental_income: -10000
    farm_rent_income: 2000
    employment_income: 12000
  output:
    wa_liheap_countable_income: 11600

- name: Case 17, private and public pension components are counted only through pension income.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 65
    taxable_private_pension_income: 10000
    taxable_public_pension_income: 2000
  output:
    wa_liheap_countable_income: 10800

- name: Case 18, separate net business sources retain their positive amounts.
  period: 2026
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    self_employment_income: 1000
    sstb_self_employment_income: 2000
    farm_operations_income: 3000
    partnership_s_corp_income: 4000
  output:
    wa_liheap_countable_income: 10000

- name: Case 19, a minors unearned income counts while wages are excluded.
  period: 2026
  input:
    people:
      person1: {age: 40, employment_income: 12_000, ssi: 0}
      person2:
        age: 10
        employment_income: 2_000
        child_support_received: 3_000
        ssi: 1_200
        meets_ssi_disability_criteria: true
    marital_units:
      marital_unit1: {members: [person1]}
      marital_unit2: {members: [person2]}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 0, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    # A child receives SSI only when disabled; a disabled SSI recipient gets
    # the STANDARD state supplement, 35.50 * 12 = 426.
    # 12,000 * 0.80 = 9,600 + 3,000 child support + 1,200 SSI + 426 = 14,226.
    wa_ssp: [0, 426]
    wa_liheap_countable_income: 14_226

- name: Case 20, income from an undocumented parent remains countable.
  period: 2026
  input:
    people:
      person1: {age: 40, immigration_status: UNDOCUMENTED, employment_income: 24_000, ssi: 0}
      person2: {age: 10, immigration_status: CITIZEN, ssi: 0}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 0, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    wa_liheap_household_size: 1
    wa_liheap_countable_income: 19_200

- name: Case 21, household-level assistance is not multiplied by member count.
  period: 2026
  input:
    people:
      person1: {age: 40, ssi: 0}
      person2: {age: 10, ssi: 0}
    spm_units:
      spm_unit1: {members: [person1, person2], wa_tanf: 6_000, wa_sfa: 0}
    households:
      household1: {members: [person1, person2], state_code: WA}
  output:
    wa_liheap_countable_income: 6_000

- name: Case 22, Washington income calculation is zero outside Washington.
  period: 2026
  input:
    state_code: OR
    age: 40
    employment_income: 24_000
  output:
    wa_liheap_countable_income: 0

- name: Case 23, Social Security below the Part B premium does not reduce other income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 70
    pension_income: 30_000
    social_security_retirement: 1_800
  output:
    # MSP income (30,000 + 1,800 - 240) / 12 = 2,630 exceeds 1,795.50, so the
    # person pays the full 12 * 202.90 = 2,434.80 premium.
    # Pension: 30,000 * (1 - 0.10) = 27,000.
    # Social Security: max(1,800 - 2,434.80, 0) = 0, so the remaining
    # 634.80 of premium is not taken from the pension.
    medicare_part_b_premium: 2_434.8
    wa_liheap_countable_income: 27_000

- name: Case 24, railroad and survivor benefits count in full without the retirement deduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 62
    railroad_benefits: 3_000
    survivor_benefits: 4_000
  output:
    # Unearned list, no 10% deduction: 3,000 + 4,000 = 7,000.
    wa_liheap_countable_income: 7_000

- name: Case 25, alimony and child support paid reduce countable income no lower than zero.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    age: 40
    employment_income: 6_000
    child_support_expense: 3_600
    alimony_expense: 2_400
  output:
    # 6,000 * 0.80 = 4,800; paid support 3,600 + 2,400 = 6,000.
    # max(4,800 - 6,000, 0) = 0.
    wa_liheap_countable_income: 0

- name: Case 26, Refugee Cash Assistance counts as state cash assistance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WA
    ssi: 0
    wa_tanf: 0
    wa_sfa: 0
    wa_rca: 5_400
    age: 40
  output:
    # Size-1 payment standard 450 x 12 = 5,400 (WAC 388-478-0020). wa_rca is
    # monthly, summed to 5,400 for the year and added once at the SPM-unit
    # level with TANF and SFA (both 0).
    wa_liheap_countable_income: 5_400
