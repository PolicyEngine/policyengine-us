- name: Case 59, Minor wages are excluded while child support, SSI and the state supplement affect the final award.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 12000
        ssi: 0
      person2:
        age: 10
        immigration_status: CITIZEN
        employment_income: 2000
        child_support_received: 3000
        ssi: 1200
        meets_ssi_disability_criteria: true
    marital_units:
      marital_unit1:
        members:
        - person1
      marital_unit2:
        members:
        - person2
    spm_units:
      spm_unit1:
        members:
        - person1
        - person2
        wa_tanf: 0
        wa_sfa: 0
        heating_type: WOOD
        wood_expense: 1000
    households:
      household1:
        members:
        - person1
        - person2
        state_code: WA
  output:
    # The disabled child's SSI brings the STANDARD state supplement,
    # 35.50 * 12 = 426. Countable: 9,600 + 3,000 + 1,200 + 426 = 14,226.
    # 14,226 / 12 / 1.36 = 871.69; 3,648.10 - 871.69 = 2,776.41.
    # 1,460.80 / 2,776.41 = 0.52615 rounds to .53; (1.30 - .53) * 1,000 = 770.
    wa_ssp: [0, 426]
    wa_liheap_household_size: 2
    wa_liheap_countable_income: 14226
    wa_liheap_income_limit: 31725
    wa_liheap_eligible: true
    wa_liheap: 770
