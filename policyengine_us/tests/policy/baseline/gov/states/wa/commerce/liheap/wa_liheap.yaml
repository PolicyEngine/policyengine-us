        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1000
      recipient_unit:
        members: [recipient_parent, recipient_child]
        takes_up_tanf_if_eligible: true
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1000
    households:
      nonrecipient_home:
        members: [nonrecipient_parent, nonrecipient_child]
        state_code: WA
      recipient_home:
        members: [recipient_parent, recipient_child]
        state_code: WA
  output:
    wa_tanf: [6840, 6840]
    tanf: [0, 6840]
    wa_sfa: [0, 0]
    wa_liheap_household_size: [2, 2]
    wa_liheap_countable_income: [0, 6840]
    wa_liheap_eligible: [true, true]
    wa_liheap: [900, 850]

