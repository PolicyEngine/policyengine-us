    - 590
    - 100
    - 0

- name: Case 61, one cent below the adjusted-income rounding tie retains the lower quotient.
  period: 2026
  input:
    age: 40
    immigration_status: CITIZEN
    state_code: WA
    self_employment_income: 3479.21
    heating_type: ELECTRICITY
    pre_subsidy_electricity_expense: 1_000
  output:
    # 3,479.21 / 12 = 289.934 rounds to 289.93; 3,648.10 - 289.93 = 3,358.17.
    # 1,460.80 / 3,358.17 = 0.43499 rounds to .43, giving (1.30 - .43) * 1,000.
    wa_liheap: 870

