    # At the tie, 3,479.22 / 12 = 289.935 rounds to 289.94.
    # The next quotient rounds to .44, giving (1.30 - .44) * 1,000.
    wa_liheap: 860

- name: Case 63, one cent above the adjusted-income rounding tie retains the upper quotient.
  period: 2026
  input:
