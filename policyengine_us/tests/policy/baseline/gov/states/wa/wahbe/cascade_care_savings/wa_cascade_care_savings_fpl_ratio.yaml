# Unit tests for wa_cascade_care_savings_fpl_ratio (TaxUnit, /1):
#   max(aca_magi, 0) / aca_fpg, divided in float64, with no truncation.
# Cascade Care Savings reads this one ratio for both the 250% income limit
# (wa_cascade_care_savings_eligible) and, from PY2027, the 200% split of the
# with-federal-subsidy amount (wa_cascade_care_savings_member_amount).
# Supplied-income cases pin aca_fpg to $10,000; the guideline-derived cases
# use the actual one-person guidelines: $15,650 (2025, for 2026 coverage) and
# $15,960 (2026, for 2027 coverage).

- name: Case 1, 2027, 140% FPL.
  # 14_000 / 10_000 = 1.4.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_fpl_ratio: 1.4

- name: Case 2, 2027, exactly 200% FPL.
  # 20_000 / 10_000 = 2.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_fpl_ratio: 2

- name: Case 3, 2027, 200.5% FPL keeps its decimals where aca_magi_fraction drops them.
  # 20_050 / 10_000 = 2.005; aca_magi_fraction truncates to 2.00.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_050
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    aca_magi_fraction: 2
    wa_cascade_care_savings_fpl_ratio: 2.005

- name: Case 4, 2027, just above 250% FPL.
  # 25_000.5 / 10_000 = 2.50005 (25_000.5 is exact in float32);
  # aca_magi_fraction truncates to 2.50.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000.5
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    aca_magi_fraction: 2.5
    wa_cascade_care_savings_fpl_ratio: 2.50005

- name: Case 5, 2027, negative income counts as zero.
  # max(-5_000, 0) / 10_000 = 0.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: -5_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_fpl_ratio: 0

- name: Case 6, 2026, the guideline is derived (2025 guideline, $15,650).
  # 39_125 / 15_650 = 2.5.
  period: 2026
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 39_125
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    aca_fpg: 15_650
    wa_cascade_care_savings_fpl_ratio: 2.5

- name: Case 7, 2027, the guideline is derived (2026 guideline, $15,960).
  # 31_920 / 15_960 = 2.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 31_920
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    aca_fpg: 15_960
    wa_cascade_care_savings_fpl_ratio: 2

- name: Case 8, 2027, a zero guideline gives an infinite ratio, not NaN from 0 / 0.
  # aca_fpg 0 and aca_magi 0: the formula divides by 1 instead and returns an
  # infinite ratio. An infinite ratio is above the 200% split, so the Group 1
  # member's pre-eligibility amount is the second band, 12*20 = 240; an
  # unguarded 0 / 0 would give NaN, which the scale maps to its out-of-range
  # cell, 0. The infinite ratio also fails the 250% limit, so the tax unit is
  # ineligible and the amount is 0.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 0
        aca_fpg: 0
        slcsp: 6_000
        aca_ptc: 5_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_member_amount: 240
    wa_cascade_care_savings_eligible: false
    wa_cascade_care_savings: 0

- name: Case 9, 2027, a household outside Washington gets 0.
  # defined_for StateCode.WA.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    wa_cascade_care_savings_fpl_ratio: 0
