  output:
    wa_cascade_care_savings_member_amount: [660]

- name: Case 19, 2026, Group 1 member one cent above 200% FPL still gets $55 PMPM.
  # 2.000001 > 2.00 takes the second band, which also carries $55 -> 660.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
