        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_member_amount: [660]

- name: Case 20, 2026, Group 1 member at 240% FPL still gets $55 PMPM.
  # PY2026: 12*55 = 660 above 200% FPL as below it.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 24_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    wa_cascade_care_savings_member_amount: [660]
