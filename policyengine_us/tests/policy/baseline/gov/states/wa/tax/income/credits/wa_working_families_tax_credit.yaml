# Washington Working Families Tax Credit tests
# RCW 82.08.0206 and ESSB 6346 Sec. 901 (age expansion)

- name: Case 1, ineligible without EITC.
  period: 2022
  absolute_error_margin: 0
  input:
    eitc: 0
  output:
    wa_working_families_tax_credit: 0

- name: Case 2, single eligible person with low income gets maximum credit.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      head:
        age: 30
        employment_income: 1
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WA
  output:
    wa_working_families_tax_credit: 300

- name: Case 3, family with income over the limit receives no credit.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: WA
    eitc: 1
    filer_adjusted_earnings: 100_000
    eitc_child_count: 3
  output:
    wa_working_families_tax_credit: 0

- name: Case 4, near EITC AGI limit credit floors at $50 minimum.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 49_000
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
      child:
        age: 5
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: WA
  output:
    # 2024 head-of-household, one child: maximum $640, phase-out start $44,084
    # (limit $49,084 less the $5,000 band), rate 640 / 5,000 = 12.8% (WAC
    # 458-20-285(10)(d)). At $49,000 the reduced amount (~$11) is below the $50
    # statutory minimum (RCW 82.08.0206(3)(c)), so the credit floors to $50.
    wa_working_families_tax_credit: 50

- name: Case 5, mid-phaseout gives correctly reduced credit.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 46_584
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
      child:
        age: 5
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: WA
  output:
    # 2024 head-of-household, one child: maximum $640, phase-out start $44,084
    # (limit $49,084 less the $5,000 band), rate 640 / 5,000 = 12.8% (WAC
    # 458-20-285(10)(d)). 640 - 0.128 x (46,584 - 44,084) = 320.00, which the
    # RCW 82.08.0206(3)(b) nearest-dollar rounding leaves at 320.
    wa_working_families_tax_credit: 320

- name: Case 6, joint filer with 1 child and moderate income receives credit.
  period: 2024
  absolute_error_margin: 50
  input:
    people:
      filer:
        employment_income: 40_000
        age: 30
        has_tin: true
        ssn_card_type: CITIZEN
      spouse:
        employment_income: 0
        age: 30
        has_tin: true
        ssn_card_type: CITIZEN
      child:
        age: 5
        has_tin: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [filer, spouse, child]
        filing_status: JOINT
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    families:
      family:
        members: [filer, spouse, child]
    spm_units:
      spm_unit:
        members: [filer, spouse, child]
    households:
      household:
        members: [filer, spouse, child]
        state_code: WA
  output:
    wa_working_families_tax_credit: 640

- name: Case 6b, phase-out keys off federal phase-out income (max of earned income and AGI), not earnings alone.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        unemployment_compensation: 25_000
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
      spouse:
        age: 40
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_spouse: true
      child1:
        age: 8
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
      child2:
        age: 10
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
      child3:
        age: 12
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2, child3]
        filing_status: JOINT
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [head, spouse, child1, child2, child3]
    households:
      household:
        members: [head, spouse, child1, child2, child3]
        state_code: WA
  output:
    # Earned income ($40,000) is below the 2025 three-child phase-out start
    # ($63,675 = limit $68,675 less the $5,000 band), but AGI ($65,000, incl.
    # $25,000 unemployment) lands inside the phase-out band. As a modeling
    # choice (not a statutory base -- RCW 82.08.0206(2)(b) defines "income" as
    # earned income), the reduction is measured against max(earned income, AGI)
    # = $65,000, matching the maximum-qualifying-income ceiling. The $1,330
    # maximum tapers at 1,330 / 5,000 = 26.6% (WAC 458-20-285(10)(d)) over the
    # $1,325 of excess to 977.55, which the RCW 82.08.0206(3)(b) nearest-dollar
    # rounding lifts to 978. See policyengine-taxsim#986.
    wa_working_families_tax_credit: 978

# ESSB 6346 Sec. 901 - WFTC Age Expansion tests (effective 2028)

- name: Case 7, age 18+ without EITC gets WFTC via the age expansion (tested in 2029).
  period: 2029
  absolute_error_margin: 0.01
  input:
    state_code: WA
    age_head: 20
    eitc: 0
    eitc_earned_income: 10_000
    filer_adjusted_earnings: 10_000
    eitc_child_count: 0
  output:
    # Eligible via age expansion: age 18+, has earned income
    # Amount is inflation-adjusted from $300 (2022) and rounded to the
    # nearest $5, producing $365 in 2029.
    wa_working_families_tax_credit: 365

