  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 20_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: CITIZEN
      ssn_child:
        age: 5
        is_tax_unit_dependent: true
        has_tin: true
        ssn_card_type: CITIZEN
      itin_child:
        age: 7
        is_tax_unit_dependent: true
        has_tin: true
        ssn_card_type: OTHER_NON_CITIZEN
    tax_units:
      tax_unit:
        members: [head, ssn_child, itin_child]
        filing_status: HEAD_OF_HOUSEHOLD
    spm_units:
      spm_unit:
        members: [head, ssn_child, itin_child]
    households:
      household:
        members: [head, ssn_child, itin_child]
        state_code: WA
  output:
    # Federal EITC counts only the SSN child (federal_child_count = 1) but the
    # WA WFTC counts both children (state child_count = 2). Because child_count
    # > federal_child_count, the state-only path applies and the credit reflects
    # the full 2025 2-child WFTC maximum ($995): $20K earnings is well below the
    # 2-child phase-out start, so no reduction applies.
    wa_working_families_tax_credit: 995

