- name: WA WFTC maximum qualifying income uses the cash assistance need standard in tax year 2029
  period: 2029
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 44_000
        has_tin: true
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    # WAC 388-478-0015 sets the 2025 single-person monthly need standard
    # at $3,816; ESSB 6346 multiplies it by 12 for tax years 2028 onward.
    wa_working_families_tax_credit_maximum_qualifying_income: 45_792
    # Combined effect of #9371 (max uprated then rounded to the nearest $5 = 365)
    # and this PR (rate = max / band per WAC 458-20-285(10)(d) = 365 / 2,500 =
    # 0.146); phase-out start $43,292 (limit less the $2,500 band):
    # 365 - 0.146 x (44,000 - 43,292) = 261.632, which the RCW 82.08.0206(3)(b)
    # nearest-dollar rounding brings to 262.
    wa_working_families_tax_credit: 262

