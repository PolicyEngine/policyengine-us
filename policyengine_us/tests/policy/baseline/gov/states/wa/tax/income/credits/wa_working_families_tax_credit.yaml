      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: WA
  output:
    # Low-income one-child filer well below the phase-out start receives the
    # full 2024 one-child maximum ($640). This end-to-end case confirms the
    # WFTC flows through to household_net_income (it is a positive component).
    wa_working_families_tax_credit: 640
