- name: General disability alone does not waive the adult ITIN child age test.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        employment_income: 20_000
        is_tax_unit_head: true
        has_tin: true
        ssn_card_type: OTHER_NON_CITIZEN
      adult_child:
        age: 30
        is_tax_unit_dependent: true
        is_disabled: true
        is_permanently_and_totally_disabled: false
        has_tin: true
        ssn_card_type: OTHER_NON_CITIZEN
    tax_units:
      tax_unit:
        members: [parent, adult_child]
        filing_status: HEAD_OF_HOUSEHOLD
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    spm_units:
      spm_unit:
        members: [parent, adult_child]
    households:
      household:
        members: [parent, adult_child]
        state_code: WA
  output:
    # Federal EITC excludes this child without a qualifying SSN.
    eitc_child_count: 0
    # Without permanent and total disability, the adult fails the child age test.
    wa_working_families_tax_credit: 0

