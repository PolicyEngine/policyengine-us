    age: 45
    is_veteran: true
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 0.9
    wa_pte_va_total_disability_rating: false
  output:
    # Collection years 2016-2019 require a total disability rating.
    wa_pte_categorical_eligible: false

- name: Case 17, in 2019 a compensated veteran with a 100 percent combined rating qualifies.
  period: 2019
  input:
    state_code: WA
    age: 45
    is_veteran: true
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 1
    wa_pte_va_total_disability_rating: false
  output:
    # A 100% evaluation is a total rating (38 CFR 3.340(a)(2)).
    wa_pte_categorical_eligible: true

- name: Case 18, in 2019 a compensated veteran with a total rating below 100 percent qualifies.
  period: 2019
  input:
