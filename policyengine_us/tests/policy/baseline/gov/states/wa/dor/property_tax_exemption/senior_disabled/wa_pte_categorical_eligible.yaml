- name: Case 37, an 80 percent veteran first qualifies in collection year 2020.
  period: 2020
  input:
    state_code:
      2019: WA
      2020: WA
    age:
      2019: 45
      2020: 46
    is_veteran:
      2019: true
      2020: true
    wa_pte_receives_va_disability_compensation:
      2019: true
      2020: true
    wa_pte_va_service_connected_rating:
      2019: 0.8
      2020: 0.8
  output:
    # 0.8 < 1 and no total rating in 2019; 0.8 >= 0.8 in 2020.
    # 2019 c 453 s 9 applies the new route to taxes collected from 2020.
    wa_pte_categorical_eligible:
      2019: false
      2020: true
