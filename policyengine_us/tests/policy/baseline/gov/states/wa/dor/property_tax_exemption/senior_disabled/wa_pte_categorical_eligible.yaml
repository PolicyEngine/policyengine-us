- name: Case 1, a person aged 61 in the collection year misses the filing-year age requirement.
  period: 2024
  input:
    people:
      person1:
        age: 61
        is_disabled: false
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WA
  output:
    # 61 - 1 = 60 at the preceding filing-year deadline; 60 < 61.
    wa_pte_categorical_eligible: false

