# RCW 84.36.381(3)(a): the claimant must be (i) 61 or older at filing-year
# end (62 at collection-year end), or retired from
# regular gainful employment by reason of disability, or (ii) a veteran
# entitled to and receiving VA compensation at a qualifying service-connected
# rating. Generic disability (is_disabled) establishes neither pathway.
# Veteran rating tests by collection year (session laws, PDF page 3 each):
# - 2016-2019 (2015 3rd sp.s. c 30 s 2): a total disability rating; a 100%
#   combined evaluation is a total rating (38 CFR 3.340(a)(2)).
# - 2020-2026 (2019 c 453 s 1): combined rating of 80% or more, or a total rating.
# - 2027 on (2025 c 200 s 1): combined rating of 40% or more, or a total rating.

- name: Case 8, generic disability without disability retirement does not qualify.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_disabled: true
    is_veteran: false
    wa_pte_retired_due_to_disability: false
    wa_pte_receives_va_disability_compensation: false
    real_estate_taxes: 5_000
    assessed_property_value: 500_000
    wa_pte_income_eligible: true
    wa_pte_tier: 1
  output:
    # 45 - 1 = 44 < 61 and neither statutory disability pathway holds. Before this fix
    # the model awarded 5,000 x 0.30 + 300,000 x (5,000 x 0.70 / 500,000)
    # = 3,600.
    wa_pte_categorical_eligible: false
    wa_pte_eligible: false
    wa_senior_disabled_property_tax_exemption: 0

- name: Case 9, retirement by reason of disability establishes the disability pathway.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_disabled: true
    is_veteran: false
    wa_pte_retired_due_to_disability: true
    wa_pte_receives_va_disability_compensation: false
    real_estate_taxes: 5_000
    assessed_property_value: 500_000
    wa_pte_income_eligible: true
    wa_pte_tier: 1
  output:
    # 5,000 x 0.30 + max(60,000, 500,000 x 0.60) x (5,000 x 0.70 / 500,000)
    # = 1,500 + 300,000 x 0.007 = 3,600.
    wa_pte_categorical_eligible: true
    wa_pte_eligible: true
    wa_senior_disabled_property_tax_exemption: 3_600

- name: Case 10, a compensated 40 percent veteran qualifies beginning in collection year 2027.
  period: 2027
  input:
    state_code:
      2026: WA
      2027: WA
    age:
      2026: 45
      2027: 46
    is_disabled:
      2026: false
      2027: false
    is_veteran:
      2026: true
      2027: true
    wa_pte_retired_due_to_disability:
      2026: false
      2027: false
    wa_pte_receives_va_disability_compensation:
      2026: true
      2027: true
    wa_pte_va_service_connected_rating:
      2026: 0.4
      2027: 0.4
    wa_pte_va_total_disability_rating:
      2026: false
      2027: false
  output:
    # 0.40 < 0.80 in 2026; 0.40 >= 0.40 in 2027.
    wa_pte_categorical_eligible:
      2026: false
      2027: true

- name: Case 11, a compensated veteran rated 80 percent qualifies in 2024 without generic disability.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_disabled: false
    is_veteran: true
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 0.8
  output:
    # 2019 c 453 s 1: a combined rating of 80% or higher. Before this fix the
    # model required is_disabled and returned false.
    wa_pte_categorical_eligible: true

- name: Case 12, a compensated veteran rated 70 percent does not qualify in 2024.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_veteran: true
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 0.7
  output:
    wa_pte_categorical_eligible: false

- name: Case 13, a total disability rating qualifies a compensated veteran regardless of the combined rating.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_veteran: true
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 0.6
    wa_pte_va_total_disability_rating: true
  output:
    # RCW 84.36.381(3)(a)(ii)(B): a total disability rating "without regard to
    # evaluation percent".
    wa_pte_categorical_eligible: true

- name: Case 14, a qualifying rating without receipt of VA compensation does not qualify.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_veteran: true
    wa_pte_receives_va_disability_compensation: false
    wa_pte_va_service_connected_rating: 1
    wa_pte_va_total_disability_rating: true
  output:
    # The veteran must be "entitled to and receiving compensation".
    wa_pte_categorical_eligible: false

- name: Case 15, a non-veteran's rating inputs do not establish the veteran pathway.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_veteran: false
    wa_pte_receives_va_disability_compensation: true
    wa_pte_va_service_connected_rating: 1
    wa_pte_va_total_disability_rating: true
  output:
    wa_pte_categorical_eligible: false

- name: Case 16, in 2019 a compensated veteran rated 90 percent without a total rating does not qualify.
