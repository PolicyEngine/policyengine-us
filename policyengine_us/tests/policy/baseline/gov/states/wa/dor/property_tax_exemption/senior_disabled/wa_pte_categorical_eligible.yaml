- name: Case 19, in 2015 generic disability without disability retirement does not qualify a non-veteran.
  period: 2015
  input:
    state_code: WA
    age: 45
    is_disabled: true
    is_veteran: false
    wa_pte_retired_due_to_disability: false
  output:
    # 2008 c 6 s 706 (PDF page 85) already required retirement from regular
    # gainful employment by reason of disability.
    wa_pte_categorical_eligible: false

- name: Case 20, in 2015 a disabled veteran keeps the generic disability treatment.
  period: 2015
  input:
    state_code: WA
    age: 45
    is_disabled: true
    is_veteran: true
    wa_pte_retired_due_to_disability: false
  output:
    # Before collection year 2016 the veteran pathway was a wholly
    # service-connected disability under 42 U.S.C. 423(d)(1)(A). The model has
    # no service-connection input for it, so is_disabled is the default proxy.
    wa_pte_wholly_service_connected_disability: true
    wa_pte_categorical_eligible: true

- name: Case 21, mixed people are evaluated together.
  period: 2024
  input:
    people:
      person1:
        age: 61
      person2:
        age: 45
        is_disabled: true
      person3:
        age: 45
        wa_pte_retired_due_to_disability: true
      person4:
        age: 45
        is_veteran: true
        wa_pte_receives_va_disability_compensation: true
        wa_pte_va_service_connected_rating: 0.8
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WA
  output:
    # The first person was 61 - 1 = 60 at filing-year end.
    wa_pte_categorical_eligible: [false, false, true, true]

- name: Case 22, by default a person receiving Social Security disability benefits is retired by reason of disability.
  period: 2024
  input:
    state_code: WA
    age: 45
    social_security_disability: 12_000
  output:
    # RCW 84.36.383(6) uses the Social Security definition, 42 U.S.C.
    # 423(d)(1)(A); an SSDI award is the Social Security Administration's
    # finding under it.
    wa_pte_retired_due_to_disability: true
    wa_pte_categorical_eligible: true

- name: Case 23, by default a person with no Social Security disability benefits is not retired by reason of disability.
  period: 2024
  input:
    state_code: WA
    age: 45
    is_disabled: true
  output:
    wa_pte_retired_due_to_disability: false
    wa_pte_categorical_eligible: false

- name: Case 24, by default a fully disabled service-connected veteran has a compensated total rating.
