- name: WA ordinary child remains eligible.
  period: 2026-01
  input:
    state_code: WA
    age: 12
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: true

- name: WA older child needs an exception.
  period: 2026-01
  input:
    state_code: WA
    age: 13
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: false

- name: WA court supervision at the lower boundary.
  period: 2026-01
  input:
    state_code: WA
    age: 13
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: true

- name: WA court supervision at the upper boundary.
  period: 2026-01
  input:
    state_code: WA
    age: 18
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: true

- name: WA court supervision does not override the upper age limit.
  period: 2026-01
  input:
    state_code: WA
    age: 19
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: false

- name: WA supervised adult does not qualify.
  period: 2026-01
  input:
    state_code: WA
    age: 30
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    wa_wccc_eligible_child: false

- name: WA supervision is specific to the child in a mixed household.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        is_under_court_supervision: true
      supervised_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: true
        immigration_status: CITIZEN
      other_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: false
        immigration_status: CITIZEN
    households:
      household:
        members: [parent, supervised_child, other_child]
        state_code: WA
  output:
    wa_wccc_eligible_child: [false, true, false]

- name: WA court-supervised teenager receives ordinary school-age reimbursement.
  period: 2025-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 24_000
      child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: true
        wa_wccc_provider_type: CENTER
        childcare_attending_days_per_month: 20
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 6_000
        wa_wccc_copay: 100
        spm_unit_assets: 0
        snap: 0
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: WA
        county_str: ADAMS_COUNTY_WA
  output:
    wa_wccc_eligible_child: [false, true]
    wa_wccc_eligible: true
    wa_wccc_center_age_group: [SCHOOL_AGE, SCHOOL_AGE]
    wa_wccc: 400

- name: WA court supervision does not waive activity or pay for no care.
  period: 2026-01
  input:
    state_code: WA
    age: 17
    is_tax_unit_dependent: true
    is_under_court_supervision: true
    wa_wccc_activity_eligible: false
    wa_wccc_income_eligible: true
    spm_unit_pre_subsidy_childcare_expenses: 0
  output:
    wa_wccc_eligible_child: true
    wa_wccc_eligible: false
    wa_wccc: 0
