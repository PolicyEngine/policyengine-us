- name: UT retirement credit max unit test 1
  period: 2022
  input:
    people:
      person1:
        age: 30
        tax_exempt_interest_income: 500
      person2:
        age: 10
        tax_exempt_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
        ut_total_income: 10_000
        filing_status: SINGLE
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output: 
    ut_retirement_credit_max: 0

- name: UT retirement credit max unit test 2
  period: 2022
  input:
    people:
      person1:
        age: 80
        tax_exempt_interest_income: 500
      person2: 
        age: 64
        tax_exempt_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
        ut_total_income: 10_000
        filing_status: SINGLE
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:  
    ut_retirement_credit_max: 450

- name: UT retirement credit max unit test 3
  period: 2022
  input:
    people:
      person1:
        age: 80
        tax_exempt_interest_income: 500
      person2: 
        age: 64
        tax_exempt_interest_income: 500
      person3:
        age: 80
        tax_exempt_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2,person3]
        ut_total_income: 30_000
        filing_status: SINGLE
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:  
    # person1 is the head, person3 the spouse and person2 a dependent, whose
    # tax-exempt interest is on their own return. Phase-out reduction:
    # 900 - (30_000 + 2 * 500 - 25_000) * 0.025 = 750.
    ut_retirement_credit_max: 750

- name: UT retirement credit max unit test 4
  period: 2022
  input:
    people:
      person1:
        age: 80
        tax_exempt_interest_income: 500
      person2: 
        age: 64
        tax_exempt_interest_income: 500
      person3:
        age: 80
        tax_exempt_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2,person3]
        ut_total_income: 30_000
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:  
    ut_retirement_credit_max: 900 

- name: UT retirement credit max unit test 5
  period: 2022
  input:
    people:
      person1:
        age: 80
        tax_exempt_interest_income: 500
      person2: 
        age: 64
        tax_exempt_interest_income: 500
      person3:
        age: 80
        tax_exempt_interest_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2,person3]
        ut_total_income: 40_000
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:  
    # person2 is a dependent, so only the head's and spouse's tax-exempt
    # interest counts: 900 - (40_000 + 2 * 500 - 32_000) * 0.025 = 675.
    ut_retirement_credit_max: 675

