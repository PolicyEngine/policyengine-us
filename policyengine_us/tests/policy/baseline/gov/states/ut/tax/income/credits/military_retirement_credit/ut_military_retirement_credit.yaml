- name: UT military retirement credit - basic calculation
  period: 2024
  input:
    people:
      person1:
        military_retirement_pay: 30000
    tax_units:
      tax_unit:
        members:
        - person1
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        state_code: UT
  output:
    ut_military_retirement_credit: 1365
- name: UT military retirement credit - married filing jointly with both having military
    retirement
  period: 2024
  input:
    people:
      person1:
        military_retirement_pay: 25000
      person2:
        military_retirement_pay: 20000
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        - person2
        state_code: UT
  output:
    ut_military_retirement_credit: 2047.5
- name: UT military retirement credit - not eligible when claiming retirement credit
  period: 2024
  input:
    people:
      person1:
        military_retirement_pay: 30000
    tax_units:
      tax_unit:
        members:
        - person1
        ut_claims_retirement_credit: true
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        state_code: UT
  output:
    ut_military_retirement_credit: 0
- name: UT military retirement credit - zero military retirement pay
  period: 2024
  input:
    people:
      person1:
        military_retirement_pay: 0
    tax_units:
      tax_unit:
        members:
        - person1
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        state_code: UT
  output:
    ut_military_retirement_credit: 0
- name: UT military retirement credit - 2025 rate (4.5%)
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 30000
    tax_units:
      tax_unit:
        members:
        - person1
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        state_code: UT
  output:
    ut_military_retirement_credit: 1350

- name: UT military retirement credit - retiree too young for the retirement credit gets the military credit
  period: 2025
  input:
    people:
      person1:
        age: 45
        military_retirement_pay: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        ut_income_tax_before_non_refundable_credits: 1_000_000
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_claims_retirement_credit: false
    ut_military_retirement_credit_eligible: true
    ut_military_retirement_credit: 1_350

- name: UT military retirement credit - older retiree with little military pay takes the retirement credit instead
  period: 2025
  input:
    people:
      person1:
        age: 76
        military_retirement_pay: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        ut_income_tax_before_non_refundable_credits: 1_000_000
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_retirement_credit_max: 450
    ut_military_retirement_credit_max: 180
    ut_claims_retirement_credit: true
    ut_military_retirement_credit_eligible: false
    ut_military_retirement_credit: 0
