- name: 2025 claimable but unclaimed filer whose claimant meets the filing exception keeps the Utah at-home
    parent credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 2000
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: true
      child:
        age: 0
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
    households:
      household:
        members: [filer, child]
        state_code: UT
  output:
    ut_at_home_parent_credit_potential: 100
