        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, newborn]
        state_code: UT
  output:
    # One child under 1 x $100 x one parent earning $3,000 or less
    # (the other parent earns $4,000); AGI $6,000 is under $50,000.
