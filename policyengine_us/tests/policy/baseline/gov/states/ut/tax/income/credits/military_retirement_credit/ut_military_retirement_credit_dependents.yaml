# Utah Code 59-10-1043(2)(b): the credit is the Utah rate times the military
# retirement pay "included in adjusted gross income on the claimant's federal
# income tax return". A tax unit dependent's pay is not in the filer's federal
# AGI (the dependent reports it on their own return), so only the head's and
# spouse's pay counts.

- name: A dependent child's military retirement pay does not make the filer eligible for the credit.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1_000_000
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ut_military_retirement_credit_eligible: false
    ut_military_retirement_credit_potential: 0
    ut_military_retirement_credit: 0

- name: Only the head's and spouse's military retirement pay counts toward the credit.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 50
        military_retirement_pay: 20_000
      person2:
        age: 48
        military_retirement_pay: 10_000
      person3:
        age: 16
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        ut_claims_retirement_credit: false
        ut_income_tax_before_non_refundable_credits: 1_000_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: UT
  output:
    ut_military_retirement_credit_eligible: true
    # (20,000 + 10,000) * 4.5%; the dependent's 10,000 is excluded.
    ut_military_retirement_credit_potential: 1_350
    ut_military_retirement_credit: 1_350

- name: With the Social Security credit worth more than the retirement credit, a dependent's military retirement pay still gives no credit.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 67
        employment_income: 40_000
        social_security: 20_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    filing_status: HEAD_OF_HOUSEHOLD
    # Taxable Social Security: min(85% x 20,000, 85% x (50,000 - 34,000)
    # + min(50% x 20,000, 4,500)) = min(17,000, 18,100) = 17,000, where
    # 50,000 = 40,000 wages + half of the benefits. 17,000 x 4.5% = 765, with
    # modified AGI of 57,000 under the 90,000 head of household threshold.
    ut_ss_benefits_credit_max: 765
    # Born in 1958, after the 1952 cutoff for the retirement credit.
    ut_retirement_credit_max: 0
    # The retirement credit is not claimed, so 59-10-1043(3)(b) does not bar
    # the military credit; the household has no qualifying pay of its own.
    ut_claims_retirement_credit: false
    ut_military_retirement_credit_eligible: false
    ut_military_retirement_credit: 0
