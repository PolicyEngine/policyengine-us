- name: UT Social Security Benefits Credit max unit test 1
  period: 2022
  input:
    taxable_social_security: 5_000
    ut_total_income: 20_000
    tax_exempt_interest_income: 500
    filing_status: SINGLE
    state_code: UT
  output:
    ut_ss_benefits_credit_max: 242.50

