    taxable_social_security: 100_000
    ut_total_income: 20_000
    tax_exempt_interest_income: 20_000
    filing_status: SINGLE
    state_code: UT
  output:
    ut_ss_benefits_credit_max: 4_700  

- name: A dependent's tax-exempt interest is on the dependent's own return
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 70
        social_security_retirement: 30_000
        taxable_pension_income: 20_000
      child:
        age: 10
        tax_exempt_interest_income: 50_000
    household:
      state_code: UT
  output:
    ut_ss_benefits_credit_max: 259.475

- name: Same household without the dependent's interest
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 70
        social_security_retirement: 30_000
        taxable_pension_income: 20_000
      child:
        age: 10
    household:
      state_code: UT
  output:
    ut_ss_benefits_credit_max: 259.475
