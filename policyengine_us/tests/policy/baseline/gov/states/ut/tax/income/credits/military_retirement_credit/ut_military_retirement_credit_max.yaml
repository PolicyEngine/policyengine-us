- name: UT military retirement credit maximum - 4.5% of military retirement pay in 2025
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_military_retirement_credit_max: 1_350

- name: UT military retirement credit maximum - survivor benefits count as military retirement pay
  period: 2025
  input:
    people:
      person1:
        military_retirement_pay_survivors: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_military_retirement_credit_max: 450

