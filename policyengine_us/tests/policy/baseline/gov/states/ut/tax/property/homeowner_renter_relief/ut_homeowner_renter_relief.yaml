- name: Case 12, nontaxable income uses self-employed pension contributions.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        self_employment_income: 100_000
        self_employed_pension_contributions_desired: 100_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    # Pub. 560 worksheet: 20% x 92,935.23 of earned income + 24,500 of
    # deferrals + the 8,000 catch-up at age 66.
    self_employed_pension_contributions: 51_087.05
    ut_homeowner_renter_relief_nontaxable_income: 51_087.05

# Utah Code 59-2a-101(17): "Income" means the sum of "federal adjusted gross
# income as defined in Section 62, Internal Revenue Code" and "nontaxable
# income". (20)(a): "Nontaxable income" means "amounts excluded from adjusted
# gross income under the Internal Revenue Code, including: ...". The cases
# below enter no SSI unless SSI is the point, since (20)(a)(vii) counts it.
- name: Case 13, taxable alimony is counted once, through federal adjusted gross income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        alimony_income: 10_000
        # A pre-2019 instrument (also the input's default), so the alimony is
        # in federal gross income.
        divorce_year: 2010
        rent: 12_000
        ssi: 0
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    taxable_alimony_income: 10_000
    adjusted_gross_income: 10_000
    # Alimony in federal AGI is not an amount "excluded from adjusted gross
    # income".
    ut_homeowner_renter_relief_nontaxable_alimony: 0
    ut_homeowner_renter_relief_nontaxable_income: 0
    # 10,000 of AGI + 0.
    ut_homeowner_renter_relief_household_income: 10_000
    # $0 to $15,033 of household income: 9.5% x 12,000 = 1,140, under the
    # $1,412 maximum (as in Case 1).
    ut_renters_credit: 1_140

