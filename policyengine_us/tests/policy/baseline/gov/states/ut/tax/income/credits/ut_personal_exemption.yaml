- name: "2025 joint return with neither spouse claimable (control): Utah additional dependent for a child born this year"
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 8000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 8000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      newborn:
        age: 0
    tax_units:
      tax_unit:
        members: [person_a, person_b, newborn]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, newborn]
        state_code: UT
  output:
    # (1 dependent + 1 additional dependent) x $2,111 = $4,222.
    ut_personal_exemption_additional_dependents: 1
    ut_personal_exemption: 4222
