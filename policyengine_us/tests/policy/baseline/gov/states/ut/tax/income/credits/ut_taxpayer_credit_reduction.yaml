  period: 2026
  absolute_error_margin: 0.001
  input:
    filing_status: SINGLE
    ut_taxable_income: 20_000
    state_code: UT
  output:
    ut_taxpayer_credit_reduction: 16.952 # (20,000 - 18,696) * 0.013

