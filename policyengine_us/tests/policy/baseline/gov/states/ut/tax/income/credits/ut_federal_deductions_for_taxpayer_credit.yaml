    ut_federal_deductions_for_taxpayer_credit: 9_000

- name: "Case 17: 2017 income-tax electors retain the section 68 reduction"
  # $100,000 charity + $20,000 income tax = $120,000 before section 68.
  # Reduction: min(3% x ($1,500,000 - $261,500), 80% x $120,000)
  # = $37,155. Retained fraction: ($120,000 - $37,155) / $120,000
  # = 0.690375. Allowed income tax: $20,000 x 0.690375 = $13,807.50.
  # Utah base: $82,845 - $13,807.50 = $69,037.50.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        long_term_capital_gains: 1_500_000
        charitable_cash_donations: 100_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        tax_unit_itemizes: true
        state_withheld_income_tax: 20_000
        local_income_tax: 0
        state_sales_tax: 1_000
        local_sales_tax: 0
    households:
      household:
        members: [head]
        state_code: UT
  output:
    total_itemized_taxable_income_deductions: 120_000
    itemized_taxable_income_deductions_reduction: 37_155
    itemized_taxable_income_deductions: 82_845
    ut_federal_deductions_for_taxpayer_credit: 69_037.50

- name: "Case 18: 2017 filers protect medical expenses, investment interest and casualty losses during allocation"
  # Total: $40,000 charity + $20,000 income tax + $20,000 medical
  # + $10,000 investment interest + $10,000 casualty losses = $100,000.
  # Section 68 excludes the last three deductions: $40,000 protected.
  # Reduction: min(3% x ($1,261,500 - $261,500), 80% x $60,000)
  # = $30,000. Subject deductions retain ($70,000 - $40,000) / $60,000
  # = 50%, so allowed income tax = $20,000 x 50% = $10,000.
  # Utah base: $70,000 - $10,000 = $60,000.
  period: 2017
  input:
    state_code: UT
    filing_status: SINGLE
    tax_unit_itemizes: true
    adjusted_gross_income: 1_261_500
    charitable_deduction: 40_000
    medical_expense_deduction: 20_000
    interest_deduction: 10_000
    investment_interest_expense: 10_000
    casualty_loss_deduction: 10_000
    misc_deduction: 0
    real_estate_taxes: 0
    state_withheld_income_tax: 20_000
    local_income_tax: 0
    state_sales_tax: 1_000
    local_sales_tax: 0
  output:
    total_itemized_taxable_income_deductions: 100_000
    itemized_taxable_income_deductions_reduction: 30_000
    itemized_taxable_income_deductions: 70_000
    ut_federal_deductions_for_taxpayer_credit: 60_000

