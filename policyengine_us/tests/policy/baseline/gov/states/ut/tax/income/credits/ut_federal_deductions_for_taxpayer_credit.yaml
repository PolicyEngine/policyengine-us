    ut_federal_deductions_for_taxpayer_credit: 3_000

- name: "Case 23: 2025 income-tax electors cross Utah's ten-thousand-dollar subtraction limit"
  # Income tax $9,999/$10,000/$10,001 plus $6,000 charity gives federal
  # totals $15,999/$16,000/$16,001, all below the federal SALT cap.
  # Utah subtracts $9,999/$10,000/$10,000, leaving $6,000/$6,000/$6,001.
  period: 2025
  input:
    adjusted_gross_income: [100_000, 100_000, 100_000]
    state_code: [UT, UT, UT]
    filing_status: [JOINT, JOINT, JOINT]
    tax_unit_itemizes: [true, true, true]
    charitable_deduction: [6_000, 6_000, 6_000]
    real_estate_taxes: [0, 0, 0]
    state_withheld_income_tax: [9_999, 10_000, 10_001]
    local_income_tax: [0, 0, 0]
    state_sales_tax: [1_000, 1_000, 1_000]
    local_sales_tax: [0, 0, 0]
    itemized_taxable_income_deductions: [15_999, 16_000, 16_001]
  output:
    salt_deduction: [9_999, 10_000, 10_001]
    ut_federal_deductions_for_taxpayer_credit: [6_000, 6_000, 6_001]

