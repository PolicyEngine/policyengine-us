- name: Case 1:Separate filing status, claimed standard deductions, total SALT < cap
  period: 2021
  input:
    filing_status: SEPARATE
    state_code: UT
    tax_unit_itemizes: false
    standard_deduction: 2_000
    charitable_deduction: 1_000
    medical_expense_deduction: 500
    casualty_loss_deduction: 500
    real_estate_taxes: 1_000  
  output:
    ut_federal_deductions_for_taxpayer_credit: 2_000

  
- name: Case 2:Separate filing status, claimed itemized deductions, total SALT > cap
  period: 2021
  input:
    filing_status: SEPARATE
    state_code: UT
    tax_unit_itemizes: true
    standard_deduction: 2_000
    charitable_deduction: 1_000
    medical_expense_deduction: 500
    casualty_loss_deduction: 500
    real_estate_taxes: 6_000
    itemized_taxable_income_deductions: 7_000
    state_and_local_sales_or_income_tax: 0
  output:
    ut_federal_deductions_for_taxpayer_credit: 7_000
  
- name: Case 3:Joint filling status, total SALT > cap
  period: 2021
  input:
    filing_status: JOINT
    state_code: UT
    tax_unit_itemizes: true
    standard_deduction: 6_000
    charitable_deduction: 1_000
    medical_expense_deduction: 500
    casualty_loss_deduction: 500
    real_estate_taxes: 12_000
    itemized_taxable_income_deductions: 12_000
    state_and_local_sales_or_income_tax: 0
  output:
    ut_federal_deductions_for_taxpayer_credit: 12_000
    
- name: Case 4:Joint filling status, total SALT < cap
  period: 2021
  input:
    filing_status: JOINT
    state_code: UT
    tax_unit_itemizes: false
    standard_deduction: 5_000
    charitable_deduction: 1_000
    medical_expense_deduction: 500
    casualty_loss_deduction: 500
    real_estate_taxes: 5_000 
  output:
    ut_federal_deductions_for_taxpayer_credit: 5_000

- name: "Case 5: Utah subtracts only state income or sales tax from claimed itemized deductions"
  period: 2023
  input:
    filing_status: JOINT
    state_code: UT
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 15_000
    state_and_local_sales_or_income_tax: 9_000
    standard_deduction: 0
  output:
    ut_federal_deductions_for_taxpayer_credit: 6_000


# The federal SALT deduction holds only the filers' own real estate taxes, so
# only those are kept when removing the income tax it includes.
- name: A dependent's real estate taxes do not displace the filers' income tax removal
  period: 2022
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 3_000
      spouse:
        age: 43
      child:
        age: 15
        real_estate_taxes: 4_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        tax_unit_itemizes: true
        standard_deduction: 25_900
        itemized_taxable_income_deductions: 50_000
        salt_deduction: 10_000
        charitable_deduction: 40_000
        state_and_local_sales_or_income_tax: 8_000
    households:
      household:
        members: [head, spouse, child]
        state_code: UT
  output:
    # Income tax deducted = 10_000 - 3_000 = 7_000; 50_000 - 7_000 = 43_000,
    # equal to the fallback 40_000 + 3_000.
    ut_federal_deductions_for_taxpayer_credit: 43_000
