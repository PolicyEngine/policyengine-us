      tax_unit:
        members:
        - person1
        - person2
        - person3
        ut_at_home_parent_credit_agi_eligible: false
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        - person2
        - person3
        state_code: UT
