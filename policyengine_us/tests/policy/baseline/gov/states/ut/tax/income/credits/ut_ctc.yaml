# Utah Code 59-10-1047(1)(e) counts a child "with respect to whom the claimant is
# allowed to claim a tax credit under Section 24". From 2025 a filer without an
# SSN cannot claim the federal child tax credit (IRC 24(h)(7)(A)(i)), but IRC
# 24(h)(4)(C) gives the credit for other dependents for that child, so the child
# still counts if the filer has an SSN or ITIN. A filer without any TIN gets no
# section 24 credit (IRC 24(e)(2)) (issue #9403).
- name: Head of household with an ITIN and 1 child gets the Utah CTC in 2026
  period: 2026
  input:
    people:
      person1:
        age: 35
        ssn_card_type: OTHER_NON_CITIZEN
        tax_exempt_interest_income: 0
      person2:
        age: 3
        is_tax_unit_dependent: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        ut_total_income: 1000
        filing_status: HEAD_OF_HOUSEHOLD
        ut_income_tax_before_non_refundable_credits: 1000000
    households:
      household:
        members:
        - person1
        - person2
        state_code: UT
  output:
    ctc_qualifying_children: 0
    ut_ctc: 1_000
