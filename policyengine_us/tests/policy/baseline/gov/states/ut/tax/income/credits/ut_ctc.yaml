# Utah Code 59-10-1047(1)(d): "Modified adjusted gross income" is the sum, for
# the claimant and a joint filer's spouse, of "(i) adjusted gross income ...;
# (ii) any interest income that is not included in adjusted gross income ...;
# and (iii) any addition to adjusted gross income required by Section
# 59-10-114". Nothing is subtracted. 2025 TC-40 instructions, Child Tax Credit
# Worksheet (PDF page 24): line 3 is "the amount from TC-40, line 6 (Total
# Income)", before Utah subtractions (line 8) and the state tax refund (line 7).
- name: Utah subtractions do not reduce modified adjusted gross income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        ctc_qualifying_child_ignoring_filer_identification: false
        tax_exempt_interest_income: 0
      person2:
        age: 3
        ctc_qualifying_child_ignoring_filer_identification: true
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        ut_total_income: 50_000
        ut_subtractions: 5_000
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members:
        - person1
        - person2
        state_code: UT
  output:
    # MAGI = total income 50,000 + tax-exempt interest 0 = 50,000.
    # Excess over the head of household threshold: 50,000 - 43,000 = 7,000.
    # Reduction: 7,000 x 0.10 = 700. Credit: 1,000 - 700 = 300.
    ut_ctc_potential: 300

- name: Interest on U.S. government obligations stays in modified adjusted gross income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        ssn_card_type: CITIZEN
        employment_income: 40_000
        taxable_interest_income: 5_000
        us_govt_interest_person: 5_000
      person2:
        age: 3
        is_tax_unit_dependent: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members:
        - person1
        - person2
        state_code: UT
  output:
    # Federal AGI: 40,000 of wages + 5,000 of interest = 45,000.
    adjusted_gross_income: 45_000
    ut_total_income: 45_000
    # Utah subtracts the U.S. government interest from taxable income only.
    ut_subtractions: 5_000
    # MAGI 45,000; excess over 43,000 = 2,000; 2,000 x 0.10 = 200.
    # Credit: 1,000 - 200 = 800.
    ut_ctc_potential: 800

