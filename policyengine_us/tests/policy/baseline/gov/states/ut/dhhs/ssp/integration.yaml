- name: Case 1, Utah supplement enters state benefit and SNAP income totals.
  period: 2026
  input:
    state_code: UT
    age: 65
    medicaid_enrolled: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    ut_ssp: 180
    snap_unearned_income: 540
    household_state_benefits: 180
    # HUD income excludes the supplement (see ut_ssp): SSI 30 * 12 = 360.
    hud_unearned_income: 360

- name: Case 2, endogenous Medicaid enrollment counts the supplement in SNAP income without a dependency cycle.
  period: 2026-01
  input:
    state_code: UT
    age: 65
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    ut_ssp: 15
    # $30 SSI + $15 supplement = $45 for the month.
    snap_unearned_income: 45
