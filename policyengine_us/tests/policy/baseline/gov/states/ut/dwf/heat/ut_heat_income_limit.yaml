# Source: Utah HEAT section 608 and the March 1, 2026 poverty table.
# Annual thresholds are 1.5 * (15,960 + 5,680 * (eligible members - 1)).

# 1.5*(15960+5680*(size-1)); above 14 published monthly increment 710.
- name: "Case 1, published March limit for 1 eligible members."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_income_limit: 23_940

