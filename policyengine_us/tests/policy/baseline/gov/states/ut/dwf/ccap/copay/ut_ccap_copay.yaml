- name: Case 17, October 2026 table, a structurally impossible size 2 two-child cell uses the padded one-child value.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        ut_ccap_countable_income: 2_000  # group 2 (1,803.01-2,140)
        # The October 2026 edition prints 0 in the impossible size 2
        # multi-child cells (where the April edition printed n/a); the
        # child count group is forced directly to reach the padded cell.
        ut_ccap_child_count_group: TWO
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
