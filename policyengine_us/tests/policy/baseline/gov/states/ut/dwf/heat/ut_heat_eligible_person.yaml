# Source: Utah HEAT section 203-2B, effective October 1, 2025.
# LPR is separately eligible; parole/conditional entry needs an eligible criterion.
# Service exceptions use actual marital, tax and family relationships.

# Section 203-2 B qualified and eligible categories, including the explicit LPR exception.
- name: "Case 1, citizen."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        years_since_us_entry: 0
        is_veteran: false
        is_military: false
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible_person: true

