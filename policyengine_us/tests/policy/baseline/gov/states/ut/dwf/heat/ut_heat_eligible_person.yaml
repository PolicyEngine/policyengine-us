# An actual marital-unit connection; no synthetic SPM-wide veteran flag.
- name: "Case 15, actual spouse of veteran qualifies without five years."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        is_veteran: true
        is_tax_unit_head: true
      person2:
        age: 38
        immigration_status: PAROLED_ONE_YEAR
        ssi: 0
        years_since_us_entry: 0
        is_tax_unit_spouse: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1, person2]
        state_code: UT
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
  output:
    ut_heat_eligible_person: [true, true]

# Share an SPM unit and household but have separate family, tax, and marital units.
- name: "Case 16, unrelated veteran does not confer immigration eligibility."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        is_veteran: true
        is_tax_unit_head: true
      person2:
        age: 38
        immigration_status: PAROLED_ONE_YEAR
        ssi: 0
        years_since_us_entry: 0
        is_tax_unit_head: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1, person2]
        state_code: UT
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
  output:
    ut_heat_eligible_person: [true, false]
