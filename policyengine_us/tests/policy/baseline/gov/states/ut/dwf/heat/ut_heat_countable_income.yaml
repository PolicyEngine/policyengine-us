# Sources: Utah Admin. Code R982-403, Utah HEAT sections 401-407 and archived
# March 2026 sections 405/407.
# R982-403-6 and the March 2026 worksheet (cell C8) disregard 20% of earned
# income, including net self-employment and rental income (section 403).
# Prior-period business-loss reconstruction remains outside scope.

# R982-403-6(1): 18,000 x (1 - 0.2) = 14,400.
- name: "Case 1, twenty percent of gross earnings is disregarded."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 18_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_countable_income: 14_400

