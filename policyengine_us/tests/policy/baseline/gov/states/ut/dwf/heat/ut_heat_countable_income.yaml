# Section 407 and R982-403-7(1)(b) deduct health insurance premiums. A nonzero
# direct premium input replaces the components; otherwise non-Medicare premiums
# and the modeled Part B premium for an enrollee (net of Medicare Savings
# Program coverage) count, and any Part A premium is added once.
# Source: Utah HEAT section 407, effective March 1 through September 30, 2026.

# No direct premium and no Medicare Savings Program coverage, so the modeled
# Part B premium is 202.90 x 12 = 2,434.80.
# 18,360 - (1,200 + 2,434.80) - 600 = 14,125.20.
- name: "Case 22, a zero direct premium falls back to non-Medicare premiums plus the modeled Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: "CITIZEN"
        pension_income: 18_360
        ssi: 0
        medicare_enrolled: true
        health_insurance_premiums: 0
        health_insurance_premiums_without_medicare_part_b: 1_200
        other_medical_expenses: 600
        msp_part_b_premium_coverage: 0
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        ut_fep: 0
        ut_heat_dwelling_type: "HOUSE"
    households:
      household1:
        members: ["person1"]
        state_code: "UT"
  output:
    medicare_part_b_premium: 2_434.80
    medical_expense_health_insurance_premiums: 3_634.80
    ut_heat_countable_income: 14_125.20

# A retiree with 35 quarters of covered work pays the reduced Part A premium:
# 311 x 12 = 3,732. Medicare Savings Program countable income is
# 18,360 / 12 - 20 = 1,510 a month: above the QMB limit of 1,330 (no Part A
# coverage) but below the QI limit of 1,330 x 1.35 = 1,795.50 with no assets,
# so the program pays the 2,434.80 Part B premium.
# 18,360 - 3,732 - 0 = 14,628.
- name: "Case 23, a Part A premium is deducted and Medicare Savings Program coverage leaves no Part B premium."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        immigration_status: CITIZEN
        pension_income: 18_360
        ssi: 0
        medicare_enrolled: true
        medicare_quarters_of_coverage: 35
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    medicare_part_a_premium: 3_732
    msp_part_b_premium_coverage: 2_434.80
    medicare_part_b_premium: 0
    ut_heat_countable_income: 14_628

