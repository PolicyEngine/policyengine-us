# Sources: Utah HEAT sections 401-407 and archived March 2026 sections 405/407.
# Section 406 rescinded the general 20% earnings disregard.
# Medicare and prior-period business-loss reconstruction remain outside scope.

# UT-08; section 406 rescinds disregard, the contrary line in the older matrix is not used.
- name: "Case 1, gross earnings have no twenty percent disregard."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 18_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_countable_income: 18_000

