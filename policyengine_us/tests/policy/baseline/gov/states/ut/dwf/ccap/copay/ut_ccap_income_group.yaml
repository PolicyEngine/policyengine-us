        members: [person1, person2]
        ut_ccap_countable_income: 2_140  # inclusive group 2 upper bound
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    # The October 1, 2026 edition raised the size 2 group 2 bound from
    # 2,082 to 2,140, so 2,140 now stays in group 2.
    ut_ccap_income_group: 2

