# Tests for ut_ccap_income_group (SPMUnit, MONTH, int).
# Table 4 classifies monthly countable income into 16 groups per
# household size (2 through 12 or more). Each encoded limit is the
# inclusive upper bound of its group; income above a bound falls in the
# next group. Countable income is set directly to isolate the
# classification. Periods in 2026 use the April 1, 2026 edition (encoded
# at the 2020-01-01 backdating floor); periods from October 2026 use the
# October 1, 2026 edition (the 2027-01 cases below).

- name: Case 1, size 2 with low income lands in group 1.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ut_ccap_countable_income: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ut_ccap_income_group: 1

- name: Case 2, size 2 at the group 1 upper bound stays in group 1.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ut_ccap_countable_income: 1_763  # inclusive group 1 upper bound
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ut_ccap_income_group: 1

- name: Case 3, size 2 just above the group 1 bound moves to group 2.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ut_ccap_countable_income: 1_764  # above 1,763, group 2 (1,763.01-2,082)
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ut_ccap_income_group: 2

- name: Case 4, size 2 at the group 5 upper bound stays in group 5.
  period: 2026-01
  input:
    people:
      person1:
