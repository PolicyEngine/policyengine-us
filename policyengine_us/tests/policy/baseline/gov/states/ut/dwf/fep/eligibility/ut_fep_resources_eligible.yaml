# Unit tests for ut_fep_resources_eligible (resource/asset test)
# Countable resources must not exceed $2,000
# Reference: Utah Admin. Code R986-200-230

- name: No resources - eligible.
  period: 2024-01
  input:
    state_code: UT
    spm_unit_cash_assets: 0
  output:
    ut_fep_resources_eligible: true

- name: Resources below limit - eligible.
  period: 2024-01
  input:
    state_code: UT
    spm_unit_cash_assets: 1_500
  output:
    # Resources = 1,500 <= 2,000 - eligible
    ut_fep_resources_eligible: true

- name: Resources at limit - eligible.
  period: 2024-01
  input:
    state_code: UT
    spm_unit_cash_assets: 2_000
  output:
    # Resources = 2,000 <= 2,000 - eligible
    ut_fep_resources_eligible: true

- name: Resources above limit - ineligible.
  period: 2024-01
  input:
    state_code: UT
    spm_unit_cash_assets: 2_001
  output:
    # Resources = 2,001 > 2,000 - ineligible
    ut_fep_resources_eligible: false

- name: Resources significantly above limit - ineligible.
  period: 2024-01
  input:
    state_code: UT
    spm_unit_cash_assets: 5_000
  output:
    # Resources = 5,000 > 2,000 - ineligible
    ut_fep_resources_eligible: false

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: UT
  output:
    ut_fep_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: UT
  output:
    ut_fep_resources_eligible: false
