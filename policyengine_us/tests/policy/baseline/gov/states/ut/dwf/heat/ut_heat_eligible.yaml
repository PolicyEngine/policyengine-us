- name: "Case 9, no energy costs or rent responsibility."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
