# Indirect energy responsibility.
- name: "Case 11, ordinary heat in rent."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        rent: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 0
        ut_heat_dwelling_type: HOUSE
        heat_expense_included_in_rent: true
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: true

