# Sources: Utah HEAT manual sections 202-204, 208 and March 2026 section 608.
# The annual 2026 period represents the March 2026 snapshot.

# Monthly income 1995 equals published 150% limit.
- name: "Case 1, inclusive income limit."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 23_940
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: true

# Monthly income 1995.01 exceeds limit.
- name: "Case 2, income just above limit."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        employment_income: 23_940.12
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: false

# Requires adult 18+; emancipation unavailable.
- name: "Case 3, no adult member."
  period: 2026
  input:
    people:
      person1:
        age: 17
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: false

# Adult threshold is inclusive 18.
- name: "Case 4, adult age eighteen."
  period: 2026
  input:
    people:
      person1:
        age: 18
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: true

# At least one eligible person.
- name: "Case 5, no qualified member."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: false

# An eligible child can qualify unit; the adult need not be eligible.
- name: "Case 6, citizen child with ineligible adult."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: UNDOCUMENTED
        ssi: 0
      person2:
        age: 5
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1, person2]
        state_code: UT
  output:
    ut_heat_eligible: true

# Utah residence required.
