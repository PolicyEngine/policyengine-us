# Subsidized housing does not itself bar utility responsibility.
- name: "Case 14, subsidized household directly pays heating."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
        receives_housing_assistance: true
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: true

# Section 208 and plan item 2.3: public housing counts as subsidized housing,
# and heat included in subsidized rent is not a household energy cost.
- name: "Case 15, public housing with heat in rent and no utility bill."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 0
        ut_heat_dwelling_type: HOUSE
        heat_expense_included_in_rent: true
        pre_subsidy_electricity_expense: 0
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: UT
        is_in_public_housing: true
  output:
    ut_heat_eligible: false

# A public housing tenant who pays an electric bill directly is responsible for
# an energy cost (section 208).
- name: "Case 16, public housing with a separately paid electric bill."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 0
        ut_heat_dwelling_type: HOUSE
        heat_expense_included_in_rent: true
        pre_subsidy_electricity_expense: 600
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: UT
        is_in_public_housing: true
  output:
    ut_heat_eligible: true

# The household reports paying for heat without a bill amount; the heating-cost
# flag alone establishes responsibility (section 208). Case 9 is the same
# household without the flag.
- name: "Case 17, reported heating costs without a bill amount qualify."
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 0
        ut_heat_dwelling_type: HOUSE
        pre_subsidy_electricity_expense: 0
        heat_expense_included_in_rent: false
        has_heating_expense: true
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat_eligible: true
