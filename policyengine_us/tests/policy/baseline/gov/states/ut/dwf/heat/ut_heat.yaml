  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat: 500

