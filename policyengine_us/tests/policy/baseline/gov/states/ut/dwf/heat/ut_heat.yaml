# Sources: Utah HEAT manual sections 602-605 and 609; FY2026 plan pages 8-9.
# The annual 2026 period represents the March 2026 snapshot.
# Countable earnings take the 20% disregard of Utah Admin. Code R982-403-6.

# Income component 250 + zero-income burden 250.
- name: "Case 1, zero income yields the ordinary gas award."
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        heating_expense: 1_200
        ut_heat_dwelling_type: HOUSE
    households:
      household:
        members: [person1]
        state_code: UT
  output:
    ut_heat: 500

