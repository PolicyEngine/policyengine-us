# REQ-001/005: eligibility requires a positive qualified household size.
- name: Case 3, no qualified members have no income allowance.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: CT
    heating_type: NATURAL_GAS
    gas_expense: 1_000
    ct_ceap_household_size: 0
  output:
    ct_ceap_income_limit: 0
