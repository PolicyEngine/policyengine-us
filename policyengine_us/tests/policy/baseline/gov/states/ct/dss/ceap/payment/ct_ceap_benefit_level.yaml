# REQ-007: 2025 two-person FPG is 15,650 + 5,500 = 21,150; multiply by 1.25 and 2.
- name: Case 3, two person family uses additional person FPG.
  period: 2026
  input:
    state_code: [CT, CT, CT, CT]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_000, 1_000, 1_000, 1_000]
    ct_ceap_household_size: [2, 2, 2, 2]
    ct_ceap_countable_income: [26437.5, 26437.51, 42_300, 42300.01]
  output:
    ct_ceap_benefit_level: [1, 2, 2, 3]
