# REQ-001/005/006/008/009. State, membership, income and heating responsibility.
# Sources:
# - https://liheapch.acf.gov/docs/2026/benefits-matricies/CT_BenefitMatrix_Heat-Crisis_2026.pdf
# - https://portal.ct.gov/dss/-/media/departments-and-agencies/dss/winter-heating-assistance/09012026/ffy-27-liheap-allocation-plan.pdf#page=5,6,7,9,10,11,15
# REQ-005: published one-person SMI ceiling is inclusive.
- name: Case 1, FY2026 income at ceiling eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_disabled: false
        is_in_foster_care:
          2026-01: false
        ssi:
          '2026': 0
        social_security: 0
        employment_income: 47_764
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap:
          '2026': 0
        ct_tfa:
          '2026': 0
        ct_ssp:
          '2026': 0
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_ceap_eligible: true

