# Edge case tests for CT TFA resource eligibility
# Resource limit: $6,000

- name: Case 1, resources exactly at limit.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 6_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 2, resources one dollar above limit.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 6_001
    state_code: CT
  output:
    ct_tfa_resources_eligible: false

- name: Case 3, resources one dollar below limit.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 5_999
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 4, zero resources.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 0
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 5, very high resources.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 100_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: false

# --- Historical period: pre-2023 resource limit was $3,000 ---

- name: Case 6, pre-2023 resources at old limit.
  period: 2021-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 3_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 7, pre-2023 resources above old limit.
  period: 2021-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 3_001
    state_code: CT
  output:
    ct_tfa_resources_eligible: false

- name: Case 8, pre-2023 resources between old and new limit.
  period: 2021-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 5_000
    state_code: CT
  output:
    # $5,000 > $3,000 old limit, so ineligible pre-2023
    ct_tfa_resources_eligible: false

- name: Case 9, 2020 resources at old limit.
  period: 2020-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 3_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 10, 2020 resources above old limit.
  period: 2020-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 3_001
    state_code: CT
  output:
    ct_tfa_resources_eligible: false

- name: Case 11, 2024 resources at new limit.
  period: 2024-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 6_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

# --- Transition boundary: 2023-01 still uses $3,000 limit (change is 2023-10-01) ---

- name: Case 12, 2023-01 resources at old limit.
  period: 2023-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 3_000
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

- name: Case 13, 2023-01 resources above old limit but below new.
  period: 2023-01
  absolute_error_margin: 0.1
  input:
    spm_unit_cash_assets: 5_000
    state_code: CT
  output:
    # $5,000 > $3,000 old limit, ineligible before 10/1/2023
    ct_tfa_resources_eligible: false

# 4,489.49 + 1,282.41 + 228.10 = 6,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 6,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_489.49
    stock_assets: 1_282.41
    bond_assets: 228.10
    state_code: CT
  output:
    ct_tfa_resources_eligible: true

# 4,489.49 + 1,282.41 + 228.11 = 6,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_489.49
    stock_assets: 1_282.41
    bond_assets: 228.11
    state_code: CT
  output:
    ct_tfa_resources_eligible: false
