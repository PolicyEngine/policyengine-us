# FY2026 plan page 5; FY2026 and FY2027 allocation plans, sections IV and IX; direct-vendor exception.
# Sources:
# PDF pages 5-7
# - https://liheapch.acf.gov/docs/2026/state-plans/CT_Plan_2026.pdf#page=5
# PDF pages 5-7,9-11,15
# - https://portal.ct.gov/dss/-/media/departments-and-agencies/dss/winter-heating-assistance/09012026/ffy-27-liheap-allocation-plan.pdf#page=5
# Direct-vendor receipt bypasses the income ceiling; rental assistance keeps its income test.
- name: Case 1, snap receipt with direct heating.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_disabled: false
        is_in_foster_care:
          2026-01: false
        ssi:
          '2026': 0
        social_security: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap:
          '2026': 120
        tanf:
          '2026': 0
        ct_ssp:
          '2026': 0
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_ceap_categorically_eligible: true

