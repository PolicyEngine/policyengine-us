# REQ-001-004. P26 physical pp6-7 checkbox source list; A26/A27 III.
# Sources:
# - https://liheapch.acf.gov/docs/2026/state-plans/CT_Plan_2026.pdf#page=5,6,7
# - https://www.cga.ct.gov/app/related/20250616_2025%20Block%20Grants%20and%20Waiver%20Applications/FFY%202026%20LIHEAP%20Allocation%20Plan.pdf#page=5,9
# - https://portal.ct.gov/dss/-/media/departments-and-agencies/dss/winter-heating-assistance/09012026/ffy-27-liheap-allocation-plan.pdf#page=5,6,7,9,10,11,15
# REQ-002: 1,000 + 2,000 + 3,000 + 4,000 + 5,000 = 15,000.
- name: Case 1, adult earned sources all count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_disabled: false
        is_in_foster_care:
          2026-01: false
        ssi:
          '2026': 0
        social_security: 0
        employment_income: 1_000
        self_employment_income: 2_000
        sstb_self_employment_income: 3_000
        farm_operations_income: 4_000
        partnership_s_corp_income: 5_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap:
          '2026': 0
        ct_tfa:
          '2026': 0
        ct_ssp:
          '2026': 0
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_ceap_countable_income: 15_000

# REQ-003/004: 100 + 200 + ... + 1,700 = 15,300. Generic VA is countable under the documented input limitation.
- name: Case 2, supported disjoint unearned sources count once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_disabled: false
        is_in_foster_care:
          2026-01: false
        ssi:
          '2026': 0
        social_security: 100
        unemployment_compensation: 200
        strike_benefits: 300
        pension_income: 400
        survivor_benefits: 500
        workers_compensation: 600
        disability_benefits: 700
        rental_income: 800
        farm_rent_income: 900
        estate_income: 1_000
        interest_income: 1_100
        ordinary_dividend_income: 1_200
        alimony_income: 1_300
        child_support_received: 1_400
        financial_assistance: 1_500
        gambling_winnings: 1_600
        veterans_benefits: 1_700
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap:
          '2026': 0
        ct_tfa:
          '2026': 0
        ct_ssp:
          '2026': 0
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_ceap_countable_income: 15_300

