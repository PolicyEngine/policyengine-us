- name: Case 1, foster and incarcerated people are outside the household.
  period: 2026
  input:
    people:
      person1:
        age: 40
      person2:
        age: 10
        is_in_foster_care:
          2026-01: true
      person3:
        age: 40
        is_incarcerated:
          2026-01: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: CT
  output:
    ct_ceap_household_member: [true, false, false]
