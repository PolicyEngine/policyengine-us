- name: Case 45, military retirement pay counts outside ordinary pension income.
  period: 2026
  absolute_error_margin: 0.01
  # Pensions are counted by the FY2026 plan and FY2027 income definition.
  # 60_000 military pay, or 30_000 pension + 30_000 military, both count as
  # 60_000, above the one-person 47_764 limit. Neither receives a grant.
  input:
    people:
      person1: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, military_retirement_pay: 60_000}
      person2: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, pension_income: 30_000, military_retirement_pay: 30_000}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
    households:
      household1:
        members: [person1]
        state_code: CT
      household2:
        members: [person2]
        state_code: CT
  output:
    ct_ceap_countable_income: [60_000, 60_000]
    ct_ceap_eligible: [false, false]
    ct_ceap: [0, 0]

- name: Case 46, each Social Security receipt is net of its paid Part B premium and floored.
  period: 2026
  absolute_error_margin: 0.01
  # FY2026 plan page 6 selects SSA excluding Medicare deductions.
  # 49_000 gross SSA - 2_400 explicitly supplied paid Part B = 46_600,
  # below 47_764 and above 200% FPG (31_300): Level 3 plus age-68
  # supplement gives min(295 + 50, 1_000) = 345.
  # Second member: max(1_000 SSA - 2_400 Part B, 0) + 5_000 pension
  # = 5_000, Level 1, min(595 + 50, 1_000) = 645. Excess premiums
  # cannot deduct a different income source.
  input:
    people:
      person1: {age: 68, immigration_status: CITIZEN, is_disabled: false, ssi: 0, social_security_retirement: 49_000, medicare_enrolled: true, medicare_part_b_premium: 2_400}
      person2: {age: 68, immigration_status: CITIZEN, is_disabled: false, ssi: 0, social_security_retirement: 1_000, pension_income: 5_000, medicare_enrolled: true, medicare_part_b_premium: 2_400}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
    households:
      household1:
        members: [person1]
        state_code: CT
      household2:
        members: [person2]
        state_code: CT
  output:
    ct_ceap_countable_income: [46_600, 5_000]
    ct_ceap_benefit_level: [3, 1]
    ct_ceap_eligible: [true, true]
    ct_ceap: [345, 645]

- name: Case 47, rental losses cannot cancel pension receipts within or across members.
  period: 2026
  absolute_error_margin: 0.01
  # The source counts gross rental receipts. Existing rental inputs stand
  # in for nonnegative gross receipts, so a negative input contributes zero.
  # Each household counts 49_000 pension, above its qualified-size-one
  # 47_764 ceiling. The second rental owner is excluded from size, while
  # their countable receipts would remain included. Both grants are zero.
  input:
    people:
      person1: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, pension_income: 49_000, rental_income: -10_000}
      person2: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, pension_income: 49_000}
      person3: {age: 40, immigration_status: UNDOCUMENTED, is_disabled: false, ssi: 0, rental_income: -10_000}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
      spm_unit2:
        members: [person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
    households:
      household1:
        members: [person1]
        state_code: CT
      household2:
        members: [person2, person3]
        state_code: CT
  output:
    ct_ceap_household_size: [1, 1]
    ct_ceap_countable_income: [49_000, 49_000]
    ct_ceap_eligible: [false, false]
    ct_ceap: [0, 0]

- name: Case 48, a supplied TFA entitlement requires actual take-up for categorical receipt.
  period: 2026
  absolute_error_margin: 0.01
  # The supplied 6_000 TFA entitlement isolates take-up, rather than testing
  # TFA entitlement rules. Nonparticipation makes tanf zero and gives no
  # categorical bypass. A participant receives 6_000 and is categorical.
  # TFA remains excluded from CEAP income: both count 100_000 wages.
  # The participant above SMI keeps the sourced Level 3 award of 295.
  input:
    people:
      person1: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, employment_income: 100_000}
      person2: {age: 10, immigration_status: CITIZEN, is_disabled: false, ssi: 0}
      person3: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, employment_income: 100_000}
      person4: {age: 10, immigration_status: CITIZEN, is_disabled: false, ssi: 0}
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        ct_ssp: 0
        ct_tfa: 6_000
        takes_up_tanf_if_eligible: false
      spm_unit2:
        members: [person3, person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        ct_ssp: 0
        ct_tfa: 6_000
        takes_up_tanf_if_eligible: true
    households:
      household1:
        members: [person1, person2]
        state_code: CT
      household2:
        members: [person3, person4]
        state_code: CT
  output:
    tanf: [0, 6_000]
    ct_ceap_countable_income: [100_000, 100_000]
    ct_ceap_categorically_eligible: [false, true]
    ct_ceap_benefit_level: [3, 3]
    ct_ceap_eligible: [false, true]
    ct_ceap: [0, 295]

- name: Case 49, unemployment fallback and reported override reach the final heating grant.
  period: 2026
  absolute_error_margin: 0.01
  # The existing modeled-UI input isolates the shared fallback contract.
  # 45_000 wages + 6_000 modeled UI (reported zero) = 51_000, above
  # 47_764. Reported 1_200 overrides modeled 6_000, giving 46_200:
  # Level 3, nonvulnerable, min(295, 1_000) = 295.
  input:
    people:
      person1: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, employment_income: 45_000, unemployment_compensation: 0, modeled_state_unemployment_compensation: 6_000}
      person2: {age: 40, immigration_status: CITIZEN, is_disabled: false, ssi: 0, employment_income: 45_000, unemployment_compensation: 1_200, modeled_state_unemployment_compensation: 6_000}
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap: 0
        tanf: 0
        ct_ssp: 0
    households:
      household1:
        members: [person1]
        state_code: CT
      household2:
        members: [person2]
        state_code: CT
  output:
    total_unemployment_compensation: [6_000, 1_200]
    ct_ceap_countable_income: [51_000, 46_200]
    ct_ceap_eligible: [false, true]
    ct_ceap: [0, 295]

