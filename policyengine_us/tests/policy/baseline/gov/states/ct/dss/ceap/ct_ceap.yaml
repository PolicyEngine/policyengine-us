# REQ-007/008/011: published basic or rental amount; direct annual expense 1,000 exceeds schedule.
- name: Case 1, FY2026 level 1 direct heating grant.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        is_disabled: false
        is_in_foster_care:
          2026-01: false
        ssi:
          '2026': 0
        social_security: 0
        employment_income: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_000
        heat_expense_included_in_rent: false
        snap:
          '2026': 0
        tanf:
          '2026': 0
        ct_ssp:
          '2026': 0
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_ceap_countable_income: 0
    ct_ceap_household_size: 1
    ct_ceap_benefit_level: 1
    ct_ceap_eligible: true
    ct_ceap: 595

