- name: Case 1, default ct_other_additions is zero
  period: 2024
  input:
    state_code: CT
    employment_income: 50_000
  output:
    ct_other_additions: 0
    ct_additions: 0
    ct_agi: 50_000

- name: Case 2, ct_other_additions increases CT AGI
  period: 2024
  input:
    state_code: CT
    employment_income: 50_000
    ct_other_additions: 2_000
  output:
    ct_other_additions: 2_000
    ct_additions: 2_000
    ct_agi: 52_000
