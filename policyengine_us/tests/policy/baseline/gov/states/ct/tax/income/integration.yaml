- name: CT 2021 joint filer with federal AGI above the 100k cliff gets no pension and annuity subtraction (taxsim 1077)
  period: 2021
  absolute_error_margin: 2
  input:
    people:
      head:
        age: 71
        taxable_private_pension_income: 46_772.66
        taxable_interest_income: 955.58
        social_security_retirement: 10_204.63
      spouse:
        age: 69
        taxable_private_pension_income: 46_772.66
        taxable_interest_income: 955.58
        social_security_retirement: 10_204.63
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: CT
  output:
    adjusted_gross_income: 112_804
    ct_pension_annuity_subtraction: 0
    ct_social_security_benefit_adjustment: 12_246
    ct_agi: 100_559
    ct_income_tax: 4_671

- name: CT 2021 single parent, one child - child tax rebate flows through ct_income_tax
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_dependent: false
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        adjusted_gross_income: 50_000
        filing_status: SINGLE
    households:
      household:
        members: [parent, child]
        state_code: CT
  output:
    # --- Rebate (booked in the 2021 eligibility year; the chain this PR fixes) ---
    # 1 eligible child (age 8 <= 18, dependent); AGI 50,000 < SINGLE threshold
    # 100,000 -> no phase-out -> 1 * 250 = 250.
    ct_child_tax_rebate: 250
    # --- Refundable credits = ct_eitc + ct_child_tax_rebate ---
    # No earned income -> federal EITC 0 -> ct_eitc 0; so aggregate = rebate = 250.
    ct_refundable_credits: 250
    # --- Baseline ct_income_tax, hand-derived from 2021 CT parameters ---
    # ct_agi = adjusted_gross_income 50,000 (no CT additions/subtractions).
    # Personal exemption (SINGLE): max 15,000; reduction start 30,000;
    #   excess 20,000 -> ceil(20,000/1,000)=20 increments * 1,000 = 20,000 reduction
    #   -> max(15,000 - 20,000, 0) = 0 (fully phased out).
    # ct_taxable_income = max(50,000 - 0, 0) = 50,000.
    # Tax (SINGLE 2021 brackets): 10,000 @ 3% = 300; 40,000 @ 5% = 2,000
    #   (50,000 is the start of the 5.5% bracket, 0 there) -> 2,300.
    # Phase-out add-back: SINGLE start 56,500 > 50,000 -> 0.
    # Recapture: low bracket not in effect in 2021; middle start 200,000 -> 0.
    # Personal credit rate at ct_agi 50,000 (SINGLE agi table, bracket
    #   [33,300, 60,000)) = 0.10 -> credit 0.10 * 2,300 = 230.
    # ct_income_tax_after_personal_credits = max(0, 2,300 - 230) = 2,070.
    # ct_amt 0; non-refundable credits 0 (no property tax) -> before-refundable 2,070.
    # ct_income_tax = 2,070 - ct_refundable_credits 250 = 1,820.
    ct_income_tax: 1_820
