# CT subtraction for regulated investment company dividends attributable to
# U.S. government obligations, applied fund by fund with the quarterly 50% asset test.

- name: CT fund at exactly 50% at every quarter-end passes; $1,000 x 35% = $350
  # The test is at least 50% at the close of each quarter, so 50% passes.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        non_qualified_dividend_income: 1_000
        us_govt_fund_1_ordinary_dividends: 1_000
        us_govt_fund_1_govt_income_share: 0.35
        us_govt_fund_1_govt_asset_share_q1: 0.5
        us_govt_fund_1_govt_asset_share_q2: 0.5
        us_govt_fund_1_govt_asset_share_q3: 0.5
        us_govt_fund_1_govt_asset_share_q4: 0.5
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_us_govt_fund_dividend_subtraction: 350
    ct_agi_subtractions: 350
    adjusted_gross_income: 1_000
    ct_agi: 650

- name: CT one quarter at 49.99% fails even though the annual average is above 50%
  # Quarter-end shares 90%, 49.99%, 90%, 90% average 77.5%; every quarter must pass.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        non_qualified_dividend_income: 1_000
        us_govt_fund_1_ordinary_dividends: 1_000
        us_govt_fund_1_govt_income_share: 0.35
        us_govt_fund_1_govt_asset_share_q1: 0.9
        us_govt_fund_1_govt_asset_share_q2: 0.4999
        us_govt_fund_1_govt_asset_share_q3: 0.9
        us_govt_fund_1_govt_asset_share_q4: 0.9
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_us_govt_fund_dividend_subtraction: 0
    ct_agi_subtractions: 0
    ct_agi: 1_000

