- name: CT retirement account distribution gets no fund subtraction
  # CT's existing pension and annuity subtraction (line 48b) covers the IRA distribution.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        taxable_ira_distributions: 1_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_us_govt_fund_dividend_subtraction: 0
    ct_pension_annuity_subtraction: 1_000
    ct_agi_subtractions: 1_000
    ct_agi: 0

- name: CT fund slot filled for an IRA-held fund is capped at zero ordinary dividends
  # Dividends earned inside an IRA are not ordinary dividend income, so the cap is $0.
  # CT's existing pension and annuity subtraction (line 48b) covers the IRA distribution.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        taxable_ira_distributions: 1_000
        us_govt_fund_1_ordinary_dividends: 1_000
        us_govt_fund_1_govt_income_share: 1
        us_govt_fund_1_govt_asset_share_q1: 1
        us_govt_fund_1_govt_asset_share_q2: 1
        us_govt_fund_1_govt_asset_share_q3: 1
        us_govt_fund_1_govt_asset_share_q4: 1
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_us_govt_fund_dividend_subtraction: 0
    ct_pension_annuity_subtraction: 1_000
    ct_agi_subtractions: 1_000
    ct_agi: 0

