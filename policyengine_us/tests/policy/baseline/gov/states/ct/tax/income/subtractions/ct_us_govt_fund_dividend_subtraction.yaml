- name: CT two funds tested separately; only the passing fund is subtracted
  # Fund 1: $1,000 x 35% = $350, passes. Fund 2: $2,000 x 80% fails in quarter 2.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        non_qualified_dividend_income: 3_000
        us_govt_fund_1_ordinary_dividends: 1_000
        us_govt_fund_1_govt_income_share: 0.35
        us_govt_fund_1_govt_asset_share_q1: 0.5
        us_govt_fund_1_govt_asset_share_q2: 0.5
        us_govt_fund_1_govt_asset_share_q3: 0.5
        us_govt_fund_1_govt_asset_share_q4: 0.5
        us_govt_fund_2_ordinary_dividends: 2_000
        us_govt_fund_2_govt_income_share: 0.8
        us_govt_fund_2_govt_asset_share_q1: 0.7
        us_govt_fund_2_govt_asset_share_q2: 0.45
        us_govt_fund_2_govt_asset_share_q3: 0.7
        us_govt_fund_2_govt_asset_share_q4: 0.7
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_us_govt_fund_dividend_subtraction: 350
    ct_agi_subtractions: 350
    adjusted_gross_income: 3_000
    ct_agi: 2_650

