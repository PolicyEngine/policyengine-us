- name: Eligibility for CT property tax credit of filers age 65 and 70 and 0 dependents in 2017
  period: 2017
  input:
    state_code: CT
    tax_unit_dependents: 0
    greater_age_head_spouse: 70
  output:
    ct_property_tax_credit_eligible: true

