        filing_status: SINGLE
    households:
      household:
        members: [parent, child1]
        state_code: CT
  output:
    # 1 * 250 = 250, AGI 50,000 below 100,000 threshold -> no reduction.
    ct_child_tax_rebate: 250
    # No earned income -> ct_eitc 0, so the refundable aggregate equals the rebate.
    ct_eitc: 0
    ct_refundable_credits: 250

