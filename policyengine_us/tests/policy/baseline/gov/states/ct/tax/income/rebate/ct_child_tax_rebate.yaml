- name: 2021 rebate flows through the refundable credits aggregate
  period: 2021
  input:
    people:
      parent:
        age: 40
        is_tax_unit_dependent: false
      child1:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1]
        adjusted_gross_income: 50_000
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1]
        state_code: CT
  output:
    # 1 * 250 = 250, AGI 50,000 below 100,000 threshold -> no reduction.
    ct_child_tax_rebate: 250
    # No earned income -> ct_eitc 0, so the refundable aggregate equals the rebate.
    ct_eitc: 0
    ct_refundable_credits: 250

- name: 2022 tax unit with a qualifying child receives no rebate (sunset)
  period: 2022
  input:
    people:
      parent:
        age: 40
        is_tax_unit_dependent: false
      child1:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child1]
        adjusted_gross_income: 50_000
        filing_status: SINGLE
    households:
      household:
        members: [parent, child1]
        state_code: CT
  output:
    # amount and child_cap sunset to 0 at 2022-01-01 -> rebate 0; also dropped from
    # the refundable list at 2022-01-01.
    ct_child_tax_rebate: 0
