# Authority: https://www.ctoec.org/forms-documents/25-27-ccdf-plan.pdf#page=17
# Court status is distinct from protective-services or child-care authorization.

- name: CT ordinary age remains eligible.
  period: 2026-01
  input:
    state_code: CT
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    ct_c4k_eligible_child: true

- name: CT court supervision alone does not extend eligibility at age 13.
