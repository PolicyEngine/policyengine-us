# ct_temporary_premium_assistance_fpl_ratio = max(aca_magi, 0) / aca_fpg,
# divided in float64, with no truncation; infinite where aca_fpg is 0.

- name: 190% FPL.
  # 19,000 / 10,000 = 1.9.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_fpl_ratio: 1.9

- name: Just above 400% FPL keeps its decimals where aca_magi_fraction drops them.
  # 40,001 / 10,000 = 4.0001; aca_magi_fraction truncates to 4.00.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 40_001
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    aca_magi_fraction: 4
    ct_temporary_premium_assistance_fpl_ratio: 4.0001

- name: Negative income counts as zero.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: -5_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_fpl_ratio: 0

