# The expired enhanced applicable percentage, 26 U.S.C. 36B(b)(3)(A)(iii):
#   up to 150%: 0%; 150-200%: 0 -> 2%; 200-250%: 2 -> 4%; 250-300%: 4 -> 6%;
#   300-400%: 6 -> 8.5%; above 400%: 8.5%, with no income cap.
# Read at aca_magi_fraction (truncated to whole percentage points), with
# aca_fpg pinned to $10,000.

- name: 140% FPL is in the 0% bracket.
  period: 2027
  absolute_error_margin: 0.000001
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_enhanced_contribution_percentage: 0

- name: 150% FPL starts the 150-200% bracket at 0%.
  period: 2027
  absolute_error_margin: 0.000001
