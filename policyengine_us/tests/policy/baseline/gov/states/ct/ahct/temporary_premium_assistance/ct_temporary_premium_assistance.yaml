# Connecticut Temporary Premium Assistance (TPA) amount:
#   enhanced credit E = max(0, annual benchmark - p_enhanced x income), where
#     p_enhanced is the 2021-2025 table of 26 U.S.C. 36B(b)(3)(A)(iii) read at
#     the truncated aca_magi_fraction;
#   TPA = rate x max(0, E - aca_ptc), rate 1 at 100-200% FPL (outside Covered
#     Connecticut) and 0.5 above 400% up to 500% FPL.
# Income is an exact percentage of the real guideline for the coverage year
# (aca_fpg, derived): $15,960 for one person and $21,640 for two in 2027 (the
# 2026 guideline), $15,650 for one person in 2026 (the 2025 guideline). The
# current federal credit is supplied; each value is shown with its 2026 or
# 2027 applicable percentage.

- name: T1, 2027, 190% FPL, full replacement of the lost enhanced credit.
  # Income 1.9 x 15,960 = 30,324. p_enhanced = 0 + 0.8 x 2% = 1.6%.
  # E = 7,200 - 0.016 x 30,324 = 6,714.816.
  # aca_ptc = 7,200 - 6.284% x 30,324 = 5,294.44 (2027 p = 4.30% + 0.8 x 2.48%).
  # TPA = 6,714.816 - 5,294.44 = 1,420.376. 190% > 175%, so no Covered CT.
  period: 2027
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_324
        slcsp: 7_200
        aca_ptc: 5_294.44
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    aca_fpg: 15_960
    ct_temporary_premium_assistance_enhanced_contribution_percentage: 0.016
    ct_temporary_premium_assistance_enhanced_ptc: 6_714.82
    ct_covered_connecticut: 0
    ct_temporary_premium_assistance_eligible: true
    ct_temporary_premium_assistance: 1_420.38

- name: T2, 2027, exactly 200% FPL is the top of the full replacement band.
  # Income 2 x 15,960 = 31,920. p_enhanced = 2%: E = 7,200 - 638.40 = 6,561.60.
  # aca_ptc = 7,200 - 6.78% x 31,920 = 5,035.82. TPA = 1,525.78.
  period: 2027
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 31_920
        slcsp: 7_200
        aca_ptc: 5_035.82
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance: 1_525.78

