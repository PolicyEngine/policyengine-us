  # enrollees cannot receive TPA.
  period: 2027
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 23_940
        slcsp: 7_200
        aca_ptc: 6_170.58
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_covered_connecticut_eligible: true
    ct_covered_connecticut: 1_029.42
    ct_temporary_premium_assistance_eligible: false
    ct_temporary_premium_assistance: 0

