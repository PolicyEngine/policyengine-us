    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
      person2:
        age: 38
        is_aca_ptc_eligible: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi: 41_116
        slcsp: 14_400
        aca_ptc: 11_816.27
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
