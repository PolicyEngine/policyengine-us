    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: 2026, the first plan year, both bands qualify.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
        pays_aca_premium: true
      person2:
        age: 60
        is_aca_ptc_eligible: false
        pays_aca_premium: true
    tax_units:
      tax_unit1:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
      tax_unit2:
        members: [person2]
        aca_magi: 45_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: [true, true]

- name: 2025, before the program, neither band qualifies.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
        pays_aca_premium: true
      person2:
        age: 60
        is_aca_ptc_eligible: false
        pays_aca_premium: true
    tax_units:
      tax_unit1:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
      tax_unit2:
        members: [person2]
        aca_magi: 45_000
