- name: A zero guideline gives an ineligible tax unit, not a division by zero.
  # aca_fpg 0: the ratio is infinite, which is above both bands.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 0
        aca_fpg: 0
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: A household outside Connecticut is not eligible.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
