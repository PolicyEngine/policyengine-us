- name: Partial replacement needs a member who pays a Marketplace premium.
  period: 2027
  input:
    people:
      person1:
        age: 60
        pays_aca_premium: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 45_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: Partial replacement excludes a separate return.
  period: 2027
