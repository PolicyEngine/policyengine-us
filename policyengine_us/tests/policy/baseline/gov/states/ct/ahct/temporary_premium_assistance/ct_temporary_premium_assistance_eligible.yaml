        filing_status: SEPARATE
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: Partial replacement has no filing condition, since no federal credit exists above 400% FPL.
  period: 2027
  input:
    people:
      person1:
        age: 60
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 45_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: false
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: true

- name: Full replacement requires filing a return that claims the federal credit.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: false
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: Full replacement requires a member eligible for the federal credit.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_000
        aca_fpg: 10_000
