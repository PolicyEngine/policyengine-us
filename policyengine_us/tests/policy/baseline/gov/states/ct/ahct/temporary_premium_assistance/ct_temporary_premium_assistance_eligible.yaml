# Eligibility for Connecticut Temporary Premium Assistance, decided on the
# exact ratio of aca_magi to aca_fpg:
#   full replacement: 1 <= ratio <= 2, a member eligible for the federal
#     credit, not Covered CT eligible, and filing a return for the credit;
#   partial replacement: 4 < ratio <= 5, a member who pays a Marketplace
#     premium and is in the tax family, and not filing separately;
#   2026 and 2027 only.
# aca_fpg is pinned to $10,000 so each edge is a round income.

- name: Exactly 100% FPL is in the full replacement band.
  # Covered CT eligibility is supplied false to isolate the income edge.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 10_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
        ct_covered_connecticut_eligible: false
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: true

- name: Just below 100% FPL is below the full replacement band.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 9_999
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
        ct_covered_connecticut_eligible: false
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: false

- name: Exactly 175% FPL is Covered Connecticut eligible, so not eligible for TPA.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 17_500
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_covered_connecticut_eligible: true
    ct_temporary_premium_assistance_eligible: false

- name: Just above 175% FPL leaves Covered Connecticut and qualifies for TPA.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 17_501
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_covered_connecticut_eligible: false
    ct_temporary_premium_assistance_eligible: true

- name: Exactly 200% FPL is in the full replacement band.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    ct_temporary_premium_assistance_eligible: true

- name: Just above 200% FPL is out, although aca_magi_fraction truncates to 2.00.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_001
        aca_fpg: 10_000
        files_return_for_aca_ptc: true
    households:
      household:
        members: [person1]
        state_code: CT
  output:
    aca_magi_fraction: 2
    ct_temporary_premium_assistance_eligible: false

- name: 300% FPL is between the bands.
  period: 2027
