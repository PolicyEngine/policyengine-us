# MS 3002-1 A.10 and D.6: citizen adult, citizen child and refugee count; undocumented adult does not.
- name: "Case 2, mixed status excludes only unqualified members from household size."
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person2:
        age: 17
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        is_tax_unit_dependent: true
      person3:
        age: 40
        immigration_status: "UNDOCUMENTED"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person4:
        age: 40
        immigration_status: "REFUGEE"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        years_since_us_entry: 0
    spm_units:
      spm_unit1:
        members: ["person1", "person2", "person3", "person4"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1", "person2", "person3", "person4"]
        state_code: "AK"
  output:
    ak_hap_household_size: 3

# No final eligibility is asserted. MS 3003-6 E still counts all members' income; contract returns a zero limit for zero qualified size.
- name: "Case 3, an Alaska household without a qualified member has no income ceiling."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "UNDOCUMENTED"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        employment_income: 12_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1"]
        state_code: "AK"
  output:
    ak_hap_household_size: 0
    ak_hap_countable_income: 12_000
    ak_hap_income_limit: 0

