  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        employment_income: 24_000
      person2:
        age: 12
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        is_tax_unit_dependent: true
        is_in_k12_school: true
        employment_income: 1_200
    spm_units:
      spm_unit1:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1", "person2"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 24_000

# 7 AAC 44.042(5) covers any full-time student under 18, not only elementary or secondary students, and exempts only "wages". A 17-year-old full-time college student who is not the head has 12,000 of wages and 1,200 of National Guard drill pay (military basic pay) excluded, but the 2,000 of net business income counts: 24,000 + 0 + 0 + 2,000 = 26,000.
- name: "Case 10, a full-time college student under 18 who is not the head has wages excluded and net business income counted."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        employment_income: 24_000
      person2:
        age: 17
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        is_tax_unit_dependent: true
        is_full_time_college_student: true
        is_in_k12_school: false
        employment_income: 12_000
        military_basic_pay: 1_200
        self_employment_income: 2_000
    spm_units:
      spm_unit1:
        members: ["person1", "person2"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1", "person2"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 26_000

