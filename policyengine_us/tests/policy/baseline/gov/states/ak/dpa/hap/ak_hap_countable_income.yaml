# FY2027 HAP manual; supported income components only.
# These tests do not assert final eligibility, heating points or an award.
# Sources:
# http://dpaweb.hss.state.ak.us/manuals/HAP/3003/3003-1_countable_income.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/3003/3003-2_noncountable_(exempt)_income.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/3003/3003-4_income_from_self-employment.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/3003/3003-6_guidelines_for_computing_income.htm
# https://www.akleg.gov/basis/aac.asp?media=print&secStart=7.44.010&secEnd=7.44.9001
# Annual receipts approximate the application-month rules; computed benefits are supplied.

# MS 3003-1 A.1 counts gross wages before deductions or garnishments.
- name: "Case 1, gross wages receive no general earned-income deduction."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        employment_income: 12_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 12_000

# MS 3003-4 A.7 defines gross less allowable costs; the supplied input is already net, so no second standard expense deduction applies.
- name: "Case 2, supplied net self-employment is not reduced by another fifty percent."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        self_employment_income: 6_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 6_000

# MS 3003-4 A.7 and supplied-net approximation: each source is floored at zero, so 12,000 + 0 = 12,000. Prior-period losses and disallowed expenses cannot be reconstructed.
- name: "Case 3, a current net business loss does not offset other income."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        employment_income: 12_000
        self_employment_income: -3_000
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 12_000

# MS 3003-4 A.7 and D.2: 2,000 + 0 (the 600 SSTB loss is floored) + 800 + (600 + 400) = 3,800. Use canonical partnership and S-corporation components.
- name: "Case 4, separate supplied business sources count once without another expense deduction."
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: "CITIZEN"
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
        self_employment_income: 2_000
        sstb_self_employment_income: -600
        farm_operations_income: 800
        partnership_income: 600
        s_corp_income: 400
    spm_units:
      spm_unit1:
        members: ["person1"]
        heating_type: "NATURAL_GAS"
        gas_expense: 1_000
        ak_atap: 0
    households:
      household1:
        members: ["person1"]
        state_code: "AK"
  output:
    ak_hap_countable_income: 3_800

