# FY2027 sole-household award (7 AAC 44.035(c)): no dwelling share and no
# utility-allowance reduction; ak_hap applies both at the points stage.
# Sources (each URL listed once):
# http://dpaweb.hss.state.ak.us/manuals/HAP/3004/3004-5_grant_computation.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_e.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_a.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/3002/3002-1_households.htm
# https://www.akleg.gov/basis/aac.asp?media=print&secStart=7.44.010&secEnd=7.44.9001
# Census places not named in Addendum A take the oil and gas points of the nearest listed
# community; these approximations are not a state-issued crosswalk.
# The one-person 25% ceiling is 415 under the 25% rule; Addendum E prints 407.
# Fuel, dwelling and location are explicit; no new monetary inputs or sentinel defaults.

# GRANT: 10 oil points * 1.4; minimum 2 before half-up whole-point rounding, then $175/point.
- name: Case 1, Fairbanks dwelling large_mobile_home_or_boat uses its published factor.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members:
        - person1
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: LARGE_MOBILE_HOME_OR_BOAT
        ak_atap: 0
        receives_housing_assistance: false
        fuel_oil_expense: 1_000
    households:
      household1:
        members:
        - person1
        state_code: AK
        place_fips: '24230'
  output:
    ak_hap_base_benefit: 2_450

