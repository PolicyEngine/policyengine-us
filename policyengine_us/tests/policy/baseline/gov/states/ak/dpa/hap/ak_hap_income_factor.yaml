# FY2027 income factors from the lagged 2026 Alaska poverty guideline (Addendum E).
# Sources (each URL listed once):
# http://dpaweb.hss.state.ak.us/manuals/HAP/3004/3004-5_grant_computation.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_e.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_a.htm
# http://dpaweb.hss.state.ak.us/manuals/HAP/3002/3002-1_households.htm
# https://www.akleg.gov/basis/aac.asp?media=print&secStart=7.44.010&secEnd=7.44.9001
# The one-person 25% ceiling is 415 under the 25% rule; Addendum E prints 407.
# Fuel, dwelling and location are explicit; no new monetary inputs or sentinel defaults.

# GRANT Step 3: income at or below 25% receives factor 1.
- name: Case 1, zero income receives all heating points.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members:
        - person1
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        ak_atap: 0
        receives_housing_assistance: false
        fuel_oil_expense: 1_000
        ak_hap_countable_income: 0
        ak_hap_household_size: 1
    households:
      household1:
        members:
        - person1
        state_code: AK
        place_fips: '24230'
  output:
    ak_hap_income_factor: 1

