# 7 AAC 44.040(a)(4) and 44.080(i) use exact percentages. Four-person guideline
# 19,950 + 3 * 7,100 = 41,250 (3,437.50 a month). The 125% ceiling is 51,562.50
# and the 150% ceiling is 61,875 a year (5,156.25 a month). Income of 5,156 a
# month (61,872 a year) is within 150%: factor 0.5. A ceiling floored to whole
# monthly dollars, 5,155 (61,860 a year), would give factor 0.
- name: Case 23, four people at 5,156 a month are within the exact 150 percent ceiling.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members:
        - person1
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        ak_atap: 0
        receives_housing_assistance: false
        fuel_oil_expense: 1_000
        ak_hap_countable_income: 61_872
        ak_hap_household_size: 4
    households:
      household1:
        members:
        - person1
        state_code: AK
        place_fips: '24230'
  output:
    ak_hap_income_factor: 0.5
