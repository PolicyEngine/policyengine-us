# 7 AAC 44.080 order: community points times the dwelling factor, reduced to
# the household's share of the dwelling's heating expenses (h), times the
# income factor (i), plus the vulnerable point (k), halved for a utility
# allowance (l), then the 2.0-point minimum (m), half-up rounding (n) and the
# 35-point cap (o). When no household in the dwelling reports a heating
# expense, as with heat in rent, manual 3002-1 A.5 gives each eligible
# household an equal share of at most one half. When some households report
# bills, each eligible heat-in-rent household takes that equal share and the
# bill payers split the rest in proportion to their bills (7 AAC 44.900(11)
# counts heat paid through rent). Subsidized households that
# pay heat directly receive a HUD utility allowance for tenant-paid utilities.
# SPM units approximate separate economic households within one dwelling.
# Sources, each URL listed once:
# Regulation 7 AAC 44.035-44.080:
# https://www.akleg.gov/basis/aac.asp?media=print&secStart=7.44.010&secEnd=7.44.9001
# Household manual 3002-1 A.3-5:
# http://dpaweb.hss.state.ak.us/manuals/HAP/3002/3002-1_households.htm
# Grant manual 3004-5 steps 1-8 and FY2027 price of $175 per point:
# http://dpaweb.hss.state.ak.us/manuals/HAP/3004/3004-5_grant_computation.htm
# Community table, Fairbanks oil 10, Juneau oil 5, Ambler oil 35:
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_a.htm
# Current income bands:
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_e.htm
# HUD utility allowances, 24 CFR 965.502 and 982.517:
# https://www.law.cornell.edu/cfr/text/24/965.502
# https://www.law.cornell.edu/cfr/text/24/982.517

# The only SPM unit in its dwelling pays the whole heating bill, so its share
# is 1. Fairbanks oil 10 * two-bedroom house 1 * income factor 1 = 10 points,
# plus 1 for age 65 = 11; 11 * 175 = 1,925, the same as its base award.
- name: Case 1, a sole household keeps its base when no allowance adjustment applies.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 1_000
        ak_atap: 0
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1]
        state_code: AK
        place_fips: '24230'
  output:
    heating_expense: 1_000
    ak_hap_base_benefit: 1_925
    ak_hap: 1_925

# Fairbanks oil 10, two-bedroom house 1. The bills of 300 and 900 are 25% and
# 75% of the dwelling's 1,200, and 44.080(h) reduces points to those shares
# before the income factor, minimum and rounding. Unit 1 (income 0, factor 1):
# 10 * 1 * .25 * 1 = 2.5, plus 1 unshared point for age 65 = 3.5 -> 4 points
# = 700. Unit 2 (24,000 is in the 100-125% band, factor .6):
# 10 * 1 * .75 * .6 = 4.5 -> 5 points = 875. Sole-household bases stay
# (10 + 1) * 175 = 1,925 and 10 * .6 * 175 = 1,050.
- name: Case 2, two Fairbanks households receive points in proportion to their heating bills.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person2:
        age: 35
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person3:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person4:
        age: 40
        immigration_status: CITIZEN
        employment_income: 24_000
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 300
        ak_atap: 0
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
      spm_unit2:
        members: [person4]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 900
        ak_atap: 0
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1, person2, person3, person4]
        state_code: AK
        place_fips: '24230'
  output:
    ak_hap_household_size: [3, 1]
    ak_hap_countable_income: [0, 24_000]
    ak_hap_income_factor: [1, 0.6]
    heating_expense: [300, 900]
    ak_hap_base_benefit: [1_925, 1_050]
    ak_hap: [700, 875]

# Heat is included in each unit's unsubsidized rent, so no unit reports a
