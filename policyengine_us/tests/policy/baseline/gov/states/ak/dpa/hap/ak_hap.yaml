# Approved manual-based convention: compute each household's base first, then
# apply equal shares and the final-dollar utility-allowance reduction. This
# conflicts with earlier points-sharing and utility-adjustment regulatory text.
# SPM units approximate separate economic households within one dwelling.
# Sources, each URL listed once:
# Household manual 3002-1 A.3-5:
# http://dpaweb.hss.state.ak.us/manuals/HAP/3002/3002-1_households.htm
# Grant manual 3004-5 steps 1-8 and FY2027 price of $175 per point:
# http://dpaweb.hss.state.ak.us/manuals/HAP/3004/3004-5_grant_computation.htm
# Community table, Fairbanks oil 10, Juneau oil 5, Ambler oil 35:
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_a.htm
# Current income bands:
# http://dpaweb.hss.state.ak.us/manuals/HAP/addendum/addendum_e.htm

# A single economic household retains the complete sole-household base award.
- name: Case 1, a sole household keeps its base when no allowance adjustment applies.
  period: 2027
  absolute_error_margin: 0.01
  input:
    state_code: AK
    ak_hap_base_benefit: 1_925
    receives_housing_assistance: false
    heat_expense_included_in_rent: false
    hud_utility_allowance: 0
  output:
    ak_hap: 1_925

# Fairbanks 10 oil points, ordinary two-bedroom factor 1. The first unit has
# zero income and an elderly member: (10 * 1 + 1) * 175 = 1,925. The second
# has annual income 24,000 in the 100-125% band: 10 * 0.6 * 175 = 1,050.
# A.3-5 divides each award by two despite unequal member counts and bills.
# Bills are 25%/75% of combined costs; those proportions do not set the grant.
- name: Case 2, two Fairbanks households share their independently calculated awards equally.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person2:
        age: 35
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person3:
        age: 8
        immigration_status: CITIZEN
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
      person4:
        age: 40
        immigration_status: CITIZEN
        employment_income: 24_000
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 300
        ak_atap: 0
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
      spm_unit2:
        members: [person4]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 900
        ak_atap: 0
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1, person2, person3, person4]
        state_code: AK
        place_fips: '24230'
        hud_utility_allowance: 0
  output:
    ak_hap_household_size: [3, 1]
    ak_hap_countable_income: [0, 24_000]
    ak_hap_income_factor: [1, 0.6]
    heating_expense: [300, 900]
    ak_hap_base_benefit: [1_925, 1_050]
    ak_hap: [962.50, 525]

# A.5 counts eligible economic households, not people or actual expense shares.
# Each unit receives one-third of its own base; no monetary rounding follows.
# The tighter margin distinguishes the fractional award from cent rounding.
- name: Case 3, three eligible units with different sizes and bases each receive one third.
  period: 2027
  absolute_error_margin: 0.0001
  input:
    people:
      person1: {}
      person2: {}
      person3: {}
      person4: {}
      person5: {}
      person6: {}
    spm_units:
      spm_unit1:
        members: [person1]
        ak_hap_base_benefit: 1_925
        heating_expense: 300
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
      spm_unit2:
        members: [person2, person3]
        ak_hap_base_benefit: 1_050
        heating_expense: 900
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
      spm_unit3:
        members: [person4, person5, person6]
        ak_hap_base_benefit: 525
        heating_expense: 1_800
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: AK
        hud_utility_allowance: 0
  output:
    ak_hap: [641.666667, 350, 175]

