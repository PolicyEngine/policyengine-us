# floor(19,950 / 12) = 1,662 a month: the 75% ceiling is floor(1,662 * 0.75)
# = 1,246 (14,952 a year) and the 100% ceiling is 1,662 (19,944 a year), so
# factor 0.7. Fairbanks oil 10 * two-bedroom house 1 * 0.7 = 7 points, plus
# 1 point for age 62 = 8 points; 8 * 175 = 1,400. Leaving the annuity out
# would give factor 1 and (10 + 1) * 175 = 1,925.
