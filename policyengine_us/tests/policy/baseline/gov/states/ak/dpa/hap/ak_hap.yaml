# Juneau oil 5 * dwelling 1 * income factor 0.6 = 3 points, at least 2;
# 3 * 175 = $525. Step 8 then reduces dollars to 262.50. Reducing points
# first would wrongly deny this household for having only 1.5 points.
- name: Case 7, a three point Juneau household receives half the dollar award.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        employment_income: 24_000
        ssi: 0
        ak_ssp: 0
        ak_permanent_fund_dividend: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: FUEL_OIL
        ak_hap_dwelling_type: TWO_BEDROOM_HOUSE
        fuel_oil_expense: 300
        ak_atap: 0
        receives_housing_assistance: true
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1]
        state_code: AK
        place_fips: '36400'
        hud_utility_allowance: 1_200
  output:
    ak_hap_household_size: 1
    ak_hap_countable_income: 24_000
    ak_hap_income_factor: 0.6
    heating_expense: 300
    ak_hap_base_benefit: 525
    ak_hap: 262.50

