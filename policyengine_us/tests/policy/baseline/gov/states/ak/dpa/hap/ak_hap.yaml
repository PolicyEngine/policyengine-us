        heating_expense: 1_800
        receives_housing_assistance: false
        heat_expense_included_in_rent: false
    households:
      household1:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: AK
        hud_utility_allowance: 0
  output:
    ak_hap: [641.666667, 350, 175]

