# Two Fairbanks units of a parent and a 10-year-old child, each with a $3,000
# oil bill. The unit that does not take up ATAP counts no income: factor 1,
# 10 * 175 = 1,750. The other counts its modeled 9,852 ATAP receipt. The
# two-person guideline floor(27,050 / 12) = 2,254 a month gives a 25% ceiling
# of floor(563.5) * 12 = 6,756 and a 50% ceiling of 1,127 * 12 = 13,524, so
# factor 0.9: 10 * 0.9 = 9 points * 175 = 1,575.
