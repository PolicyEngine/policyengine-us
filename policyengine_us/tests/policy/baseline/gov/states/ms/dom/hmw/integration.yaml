# Mississippi made no lawfully residing election under 42 USC 1396b(v)(4) or
# 1397gg(e)(1)(Q), so an LPR child two years after entry is in the five-year
# bar (8 USC 1613) for both Medicaid and separate CHIP. She is not otherwise
# eligible for Medicaid or CHIP, so she meets the HMW category. Her status
# still bars full Medicaid, leaving emergency Medicaid under 42 USC 1396b(v)(2).
- name: Case 8, blind LPR child in the five-year bar fails CHIP and falls to HMW for emergency Medicaid.
  period: 2025
  input:
    age: 10
    state_code: MS
    is_blind: true
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    social_security_survivors: 17_000
    medicaid_income_level: 1.8
    has_emergency_medical_condition: true
  output:
    is_chip_immigration_status_eligible: false
    is_chip_eligible_child: false
    ms_hmw_other_coverage_ineligible: true
    ms_hmw_eligible: true
    medicaid_category: HEALTHIER_MISSISSIPPI_WAIVER
    is_medicaid_eligible: false
    is_emergency_medicaid_eligible: true
