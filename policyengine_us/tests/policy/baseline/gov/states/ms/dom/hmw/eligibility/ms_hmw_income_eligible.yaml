- name: Case 1, countable income at 135 percent of poverty passes.
  period: 2026
  input:
    state_code: MS
    medicaid_optional_senior_or_disabled_countable_income: 21_546
  output:
    ms_hmw_income_eligible: true

- name: Case 2, countable income over 135 percent of poverty fails.
  period: 2026
  input:
    state_code: MS
    medicaid_optional_senior_or_disabled_countable_income: 21_547
  output:
    ms_hmw_income_eligible: false

- name: Case 3, couple income at 135 percent of poverty passes.
  period: 2026
  input:
    people:
      person1:
        age: 67
        medicaid_optional_senior_or_disabled_countable_income: 14_607
      person2:
        age: 66
        medicaid_optional_senior_or_disabled_countable_income: 14_607
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    ms_hmw_income_eligible: [true, true]

- name: Case 4, dependent does not increase the income limit.
  period: 2026
  input:
    people:
      person1:
        age: 67
        medicaid_optional_senior_or_disabled_countable_income: 21_547
      person2:
        age: 10
        medicaid_optional_senior_or_disabled_countable_income: 0
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    ms_hmw_income_eligible: [false, true]

- name: Case 5, spouse in a separate tax unit counts toward the couple income limit.
  period: 2026
  input:
    people:
      person1:
        age: 67
        medicaid_optional_senior_or_disabled_countable_income: 22_000
      person2:
        age: 66
        medicaid_optional_senior_or_disabled_countable_income: 7_214
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
  output:
    ms_hmw_income_eligible: [true, true]

# Marital units omitted: the couple and an unrelated adult share one default
# marital unit. The tax roles identify the spouses, so the couple is still
# tested together against 135% of the two-person guideline ($29,214), and the
# unrelated adult's income stays out. 14,880 x 2 = 29,760 > 29,214, although
# each spouse's 14,880 alone would pass the one-person $21,546 limit.
- name: Case 6, a couple in a default marital unit with an unrelated adult is tested as a couple.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 14_880
      spouse:
        age: 50
        is_tax_unit_spouse: true
        medicaid_optional_senior_or_disabled_countable_income: 14_880
      outsider:
        age: 70
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 0
    tax_units:
      couple:
        members: [head, spouse]
      outsider:
        members: [outsider]
    households:
      household:
        members: [head, spouse, outsider]
        state_code: MS
  output:
    ms_hmw_income_eligible: [false, false, true]

# Same default group: 14,000 x 2 = 28,000 <= 29,214 passes, and the unrelated
# adult's 99,760 is neither pooled with the couple nor offset by theirs.
- name: Case 7, an unrelated adult's income does not enter a couple's budget in a default marital unit.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 14_000
      spouse:
        age: 50
        is_tax_unit_spouse: true
        medicaid_optional_senior_or_disabled_countable_income: 14_000
      outsider:
        age: 70
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 99_760
    tax_units:
      couple:
        members: [head, spouse]
      outsider:
        members: [outsider]
    households:
      household:
        members: [head, spouse, outsider]
        state_code: MS
  output:
    ms_hmw_income_eligible: [true, true, false]

# Same default group: the unrelated adult has no identified spouse, so their
# own 24,760 is tested against the one-person $21,546 limit and fails, not
# against the two-person $29,214 limit, which it would pass.
- name: Case 8, an unrelated adult in a default marital unit gets the one-person limit.
  period: 2026
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 14_000
      spouse:
        age: 50
        is_tax_unit_spouse: true
        medicaid_optional_senior_or_disabled_countable_income: 14_000
      outsider:
        age: 70
        is_tax_unit_head: true
        medicaid_optional_senior_or_disabled_countable_income: 24_760
    tax_units:
      couple:
        members: [head, spouse]
      outsider:
        members: [outsider]
    households:
      household:
        members: [head, spouse, outsider]
        state_code: MS
  output:
    ms_hmw_income_eligible: [true, true, false]
