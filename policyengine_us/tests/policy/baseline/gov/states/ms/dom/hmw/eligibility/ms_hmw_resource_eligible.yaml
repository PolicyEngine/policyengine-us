- name: Case 1, individual resources below limit pass.
  period: 2026
  input:
    state_code: MS
    ssi_countable_resources: 3_999
  output:
    ms_hmw_resource_eligible: true

- name: Case 2, individual resources at limit fail.
  period: 2026
  input:
    state_code: MS
    ssi_countable_resources: 4_000
  output:
    ms_hmw_resource_eligible: false

- name: Case 3, couple resources below couple limit pass.
  period: 2026
  input:
    people:
      person1:
        age: 67
        ssi_countable_resources: 2_999
      person2:
        age: 66
        ssi_countable_resources: 2_999
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    ms_hmw_resource_eligible: [true, true]

- name: Case 4, couple resources at couple limit fail.
  period: 2026
  input:
    people:
      person1:
        age: 67
        ssi_countable_resources: 3_000
      person2:
        age: 66
        ssi_countable_resources: 3_000
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    ms_hmw_resource_eligible: [false, false]

- name: Case 5, dependent resources do not count toward the applicant resource limit.
  period: 2026
  input:
    people:
      person1:
        age: 67
        ssi_countable_resources: 3_500
      person2:
        age: 10
        ssi_countable_resources: 1_000
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    ms_hmw_resource_eligible: [true, true]

- name: Case 6, spouse in a separate tax unit counts toward the couple resource limit.
  period: 2026
  input:
    people:
      person1:
        age: 67
        ssi_countable_resources: 4_500
      person2:
        age: 66
        ssi_countable_resources: 1_499
    households:
      household:
        members: [person1, person2]
        state_code: MS
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
  output:
    ms_hmw_resource_eligible: [true, true]

# 1,843.69 + 2,145.15 + 11.16 = 4,000.00, which the limit excludes.
# The float32 balances add to a fraction of a cent below 4,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit fail
  period: 2025
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_843.69
    stock_assets: 2_145.15
    bond_assets: 11.16
    state_code: MS
  output:
    ms_hmw_resource_eligible: false

# 1,843.69 + 2,145.15 + 11.15 = 3,999.99, a cent under the limit.
- name: Three accounts a cent under the resource limit pass
  period: 2025
  input:
    age: 70
    is_ssi_aged_blind_disabled: true
    is_ssi_disabled: true
    bank_account_assets: 1_843.69
    stock_assets: 2_145.15
    bond_assets: 11.15
    state_code: MS
  output:
    ms_hmw_resource_eligible: true
