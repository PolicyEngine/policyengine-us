    # The 2,400 electricity bill exceeds every cap, so each payment equals its cap.
    ms_liheap: [1_500, 1_400, 1_400, 1_300, 0, 1_200, 1_500, 1_400, 1_400, 1_300]
- name: Case 17, the size-sixteen propane cap does not apply to other fuels or household sizes.
  period: 2026
  input:
    state_code: [MS, MS, MS, MS]
    ms_liheap_eligible: [true, true, true, true]
    ms_liheap_household_size: [16, 16, 15, 17]
    ms_liheap_income: [78_000, 78_000, 75_000, 80_000]
    heating_type: [NATURAL_GAS, ELECTRICITY, PROPANE, PROPANE]
    gas_expense: [900, 0, 0, 0]
    pre_subsidy_electricity_expense: [0, 2_400, 0, 0]
    bottled_gas_expense: [0, 0, 1_200, 1_200]
  output:
    # Matrix page 5 (manual PDF page 63), fourth band of each table.
    # Household size 16, 73,614-83,306: Propane 350, Natural Gas 550, Total
    # Electric 1,200. Household size 15, 69,489-81,764: Propane 650. Household
    # size 17, 77,739-84,849: Propane 650.
    # Household 1, natural gas: min(550, 900) = 550.
    # Household 2, total electric: min(1,200, 2,400) = 1,200.
    # Households 3 and 4, propane at sizes 15 and 17: min(650, 1,200) = 650.
    ms_liheap: [550, 1_200, 650, 650]
- name: Case 18, a credit balance on the main fuel account does not reduce the payment.
  period: 2026
  input:
    state_code: [MS, MS]
    ms_liheap_eligible: [true, true]
    ms_liheap_household_size: [1, 1]
    ms_liheap_income: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [-150, -150]
    pre_subsidy_electricity_expense: [0, 600]
  output:
    # Rule 7.4 C (manual PDF page 36): "Electric and natural gas bills should
    # not be paid if there is a credit balance." A negative gas bill is a credit
    # balance, so the natural gas payment is 0 rather than -150.
    # Household 1 has no electric bill: 0.
    # Household 2 has an electric bill of 50 a month. Matrix page 1, household
    # size 1, first band, Electric 700: min(700, 600) = 600, with nothing
    # deducted for the gas credit.
    ms_liheap: [0, 600]
- name: Case 19, heat included in rent receives no heating column payment.
  period: 2026
  input:
    state_code: [MS, MS]
    ms_liheap_eligible: [true, true]
    ms_liheap_household_size: [1, 1]
    ms_liheap_income: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [0, 0]
    heat_expense_included_in_rent: [true, true]
    pre_subsidy_electricity_expense: [0, 540]
  output:
    # Rule 6.4 A-B (manual PDF page 24) pays the energy charge itemized in the
    # lease, or $100 per intake up to the matrix amount when no amount is
    # itemized. Neither the itemized charge nor the number of intakes is an
    # input, so a household with no gas bill of its own receives 0 from the
    # Natural Gas column.
    # Household 1 has no electric bill either: 0.
    # Household 2 pays its own electric bill of 45 a month. Matrix page 1,
    # household size 1, first band, Electric 700: min(700, 540) = 540.
    ms_liheap: [0, 540]
