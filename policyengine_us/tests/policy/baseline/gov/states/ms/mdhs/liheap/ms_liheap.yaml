- name: Case 11, households not heated by electricity also receive the electric column.
  period: 2026
  input:
    state_code: [MS, MS, MS, MS, MS, MS, MS, MS, MS]
    ms_liheap_eligible: [true, true, true, true, true, true, true, true, true]
    ms_liheap_household_size: [1, 1, 1, 1, 1, 1, 1, 1, 1]
    ms_liheap_income: [0, 0, 0, 0, 0, 0, 0, 0, 0]
    heating_type: [NATURAL_GAS, PROPANE, WOOD, ELECTRICITY, NATURAL_GAS, SOLAR, NONE, UNSPECIFIED, UNSPECIFIED]
    gas_expense: [2_000, 0, 0, 0, 300, 0, 0, 0, 0]
    bottled_gas_expense: [0, 2_000, 0, 0, 0, 0, 0, 0, 0]
    wood_expense: [0, 0, 2_000, 0, 0, 0, 0, 0, 0]
    pre_subsidy_electricity_expense: [1_000, 1_000, 1_000, 2_000, 200, 1_000, 1_000, 1_000, 1_000]
    heat_expense_included_in_rent: [false, false, false, false, false, false, false, false, true]
  output:
    # Rule 7.8 D (manual PDF page 39): a total electric household receives the
    # Total Electric column; "all other households may receive a total of the
    # electric column and the main heating source column that is used."
    # Matrix page 1, household size 1, first band: Propane 800, Electric 700,
    # Natural Gas 700, Wood/Other Fuel 400, Maximum Benefit 1,500, Total
    # Electric 1,500.
    # Household 1, natural gas: min(700, 2,000) + min(700, 1,000) = 1,400.
    # Household 2, propane: 800 + 700 = 1,500, the Maximum Benefit.
    # Household 3, wood: 400 + 700 = 1,100.
    # Household 4, total electric: min(1,500, 2,000) = 1,500, with no second
    # payment.
    # Household 5, natural gas with small bills: 300 + 200 = 500.
    # Households 6 and 7, solar and no heating: no fuel column, so only the
    # electric column: min(700, 1,000) = 700.
    # Household 8, fuel not reported: no payment.
    # Household 9, heat in rent with an unknown fuel: the electric column for
    # its own electric bill, 700.
    ms_liheap: [1_400, 1_500, 1_100, 1_500, 500, 700, 700, 0, 700]
