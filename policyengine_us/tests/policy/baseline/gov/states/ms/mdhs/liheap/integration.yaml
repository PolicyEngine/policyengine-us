- name: Electric heating payment is available only to an eligible Mississippi household
  period: 2_026
  input:
    state_code: [MS, MS, AL]
    age: [40, 40, 40]
    employment_income: [0, 26_741, 0]
    ssi: [0, 0, 0]
    social_security: [0, 0, 0]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY]
    pre_subsidy_electricity_expense: [2_000, 2_000, 2_000]
  output:
    ms_liheap: [1_500, 0, 0]
