- name: Two dependents gets $3k exemption.
  period: 2020
  input:
    state_code: MS
    tax_unit_dependents: 2
  output:
    ms_dependents_exemption: 3_000

- name: One dependent gets $1.5k exemption.
  period: 2020
  input:
    state_code: MS
    tax_unit_dependents: 1
  output:
    ms_dependents_exemption: 1_500

- name: No dependent gets $0 exemption.
  period: 2020
  input:
    state_code: MS
    tax_unit_dependents: 0
  output:
    ms_dependents_exemption: 0

- name: If states is not MS, no exemption.
  period: 2020
  input:
    state_code: CA
    tax_unit_dependents: 2
  output:
    ms_dependents_exemption: 0

- name: 2025 single filer who can be claimed as a dependent, no dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, child]
    households:
      household:
        members: [person_a, child]
        state_code: MS
  output:
    # Miss. Code 27-7-21(e): a person who "qualifies for federal income
    # tax purposes as a dependent of the taxpayer" (Form 80-100); a
    # return with a claimable filer has none (IRC 152(b)(1)).
    ms_dependents_exemption: 0

- name: 2025 joint return with one spouse who can be claimed, no dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MS
  output:
    ms_dependents_exemption: 0

- name: 2025 joint return with one spouse who can be claimed, no dependent exemption (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: MS
  output:
    ms_dependents_exemption: 0

- name: 2025 joint return with both spouses claimable, no dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MS
  output:
    ms_dependents_exemption: 0

- name: 2025 joint return with neither spouse claimable, no dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MS
  output:
    # One dependent: $1,500 (exemptions/dependents/amount.yaml).
    ms_dependents_exemption: 1_500
