- name: A dependent's income stays off both spouses' columns
  period: 2021
  input:
    people:
      person1:
        employment_income: 10_000
        is_tax_unit_head: true
        ms_agi_adjustments: 1_000
      person2:
        employment_income: 12_000
        is_tax_unit_head: false
        ms_agi_adjustments: 2_000
      person3:
        employment_income: 3_000
        is_tax_unit_head: false
        ms_agi_adjustments: 0
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MS
  output:
    # Each spouse's column holds their own income; the dependent's 3,000 goes
    # on the dependent's own return (35 Miss. Admin. Code Pt. III, 10.01.104).
    ms_agi: [9_000, 10_000, 0]

- name: A dependent's income stays off both spouses' columns when the head and spouse labels are exchanged
  period: 2021
  input:
    people:
      person1:
        employment_income: 10_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        ms_agi_adjustments: 1_000
      person2:
        employment_income: 12_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ms_agi_adjustments: 2_000
      person3:
        employment_income: 3_000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ms_agi_adjustments: 0
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MS
  output:
    ms_agi: [9_000, 10_000, 0]

- name: Spouses with equal income keep their own income; the dependent's is on the dependent's own return
  period: 2021
  input:
    people:
      person1:
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ms_agi_adjustments: 0
      person2:
        employment_income: 10_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        ms_agi_adjustments: 0
      person3:
        employment_income: 3_000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ms_agi_adjustments: 0
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MS
  output:
    ms_agi: [10_000, 10_000, 0]

- name: A dependent's negative income does not reduce a spouse's column
  period: 2021
  input:
    people:
      person1:
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ms_agi_adjustments: 0
      person2:
        employment_income: 4_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        ms_agi_adjustments: 0
      person3:
        employment_income: 1_000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ms_agi_adjustments: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MS
  output:
    ms_agi: [10_000, 4_000, 0]

- name: A negative amount is kept, so a joint return can combine it with the other column
  period: 2021
  input:
    state_code: MS
    ms_agi_adjustments: 1_000
    employment_income: 500
  output:
    ms_agi: -500

- name: SSTB self-employment income is included in Mississippi AGI
  period: 2024
  input:
    sstb_self_employment_income: 100_000
    ms_agi_adjustments: 0
    state_code: MS
  output:
    ms_agi: 100_000

- name: A dependent's self-employment income and adjustments stay on the dependent's own return
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
        self_employed_pension_contributions: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # The child's own adjustments: one-half of self-employment tax (Schedule
    # SE line 13, 706.48), health insurance (1,000) and SEP (500), 2,206.48.
    ms_agi_adjustments: [0, 2_206.48]
    # The child's income and adjustments both go on the child's own
    # Mississippi return, so the parent's AGI is the parent's 40,000.
    ms_agi: [40_000, 0]

- name: Each spouse subtracts only their own self-employed health insurance
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        self_employment_income: 30_000
        self_employed_health_insurance_premiums: 3_000
      spouse:
        age: 44
        employment_income: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MS
  output:
    # Head: one-half of self-employment tax (30,000 x 0.9235 x 0.153 / 2 =
    # 2,119.43) plus health insurance 3,000. The spouse has no adjustment.
    ms_agi_adjustments: [5_119.43, 0]
    ms_agi: [24_880.57, 20_000]

- name: Estate and trust income is included in Mississippi AGI
  period: 2025
  input:
    irs_employment_income: 30_000
    estate_income: 5_000
    state_code: MS
  output:
    # Form 80-105 line 41 reports federal Schedule E income, which includes
    # trusts: 30,000 + 5,000, with no adjustments.
    ms_agi: 35_000

- name: An estate or trust loss on federal Schedule E reduces Mississippi AGI
  period: 2025
  input:
    irs_employment_income: 30_000
    estate_income: -5_000
    state_code: MS
  output:
    # Line 41 is "the income or loss from activities reported on Federal
    # Schedule E": 30,000 - 5,000.
    ms_agi: 25_000

- name: A dependent child's interest stays off the parent's Mississippi AGI and tax
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 16
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # A minor resident files their own Form 80-105 when their gross income is
    # over the personal exemption plus the standard deduction (2024 Form
    # 80-100 instructions, p. 3). The parent's AGI is the parent's wages.
    ms_agi: [40_000, 0]
    # Head of household: 40,000 - 3,400 standard deduction - 8,000 exemption
    # - 1,500 for the dependent = 27,100 of taxable income; 4.4% of the
    # 17,100 over 10,000 = 752.40, the same as with no child income.
    ms_income_tax: 752.4

- name: A dependent child's wages stay off the parent's Mississippi AGI and tax
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 16
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    ms_agi: [40_000, 0]
    ms_income_tax: 752.4

- name: A parent's capital loss is limited to 3,000 when the dependent child has no capital gains
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        long_term_capital_gains: -10_000
      child:
        age: 16
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # Mississippi limits a capital loss as on the federal return (2024 Form
    # 80-100 instructions, line 40; 26 USC 1211(b)): 40,000 - 3,000.
    ms_agi: [37_000, 0]
    # Head of household: 37,000 - 3,400 standard deduction - 8,000 exemption
    # - 1,500 for the dependent = 24,100; 4.4% of the 14,100 over 10,000.
    ms_income_tax: 620.4

- name: A dependent child's capital gain smaller than the parent's loss does not change the parent's AGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        long_term_capital_gains: -10_000
      child:
        age: 16
        long_term_capital_gains: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # The child's 5,000 gain is on the child's own return. The parent's
    # return has only the parent's 10,000 loss, limited to 3,000:
    # 40,000 - 3,000. (Allocating the tax unit's limited loss over every
    # member gave the parent -6,000 and an AGI of 34,000.)
    ms_agi: [37_000, 0]
    ms_income_tax: 620.4

- name: A dependent child's capital gain larger than the parent's loss does not lift the parent's loss limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        long_term_capital_gains: -10_000
      child:
        age: 16
        long_term_capital_gains: 20_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # The parent's own net loss is 10,000, limited to 3,000: 40,000 - 3,000.
    # (A tax unit net gain of 10,000 left the parent's whole 10,000 loss
    # unlimited and gave an AGI of 30,000.)
    ms_agi: [37_000, 0]
    ms_income_tax: 620.4

- name: A dependent child's capital loss does not reduce the parent's capital gain
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        long_term_capital_gains: 5_000
      child:
        age: 16
        short_term_capital_gains: -10_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MS
  output:
    # The child's loss is on the child's own return; the parent keeps the
    # whole 5,000 gain: 40,000 + 5,000.
    ms_agi: [45_000, 0]

- name: Spouses share their limited capital loss in proportion to their own losses
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 30_000
        long_term_capital_gains: -8_000
      spouse:
        age: 45
        employment_income: 20_000
        long_term_capital_gains: -2_000
      child:
        age: 15
        long_term_capital_gains: 50_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: MS
  output:
    # The filers' net loss is 10,000, limited to 3,000 for a joint federal
    # return. The head takes 8,000 / 10,000 of it (2,400) and the spouse
    # 2,000 / 10,000 (600). The child's 50,000 gain is on the child's own
    # return: 30,000 - 2,400 and 20,000 - 600.
    ms_agi: [27_600, 19_400, 0]
