- name: Case 1, default ms_other_subtractions is zero
  period: 2024
  input:
    state_code: MS
    employment_income: 50_000
  output:
    ms_other_subtractions: 0
    ms_agi_adjustments: 0
    ms_agi: 50_000

- name: Case 2, ms_other_subtractions increases adjustments and reduces MS AGI
  period: 2024
  input:
    state_code: MS
    employment_income: 50_000
    ms_other_subtractions: 2_000
  output:
    ms_other_subtractions: 2_000
    ms_agi_adjustments: 2_000
    ms_agi: 48_000
