# Authority: https://www.mdhs.ms.gov/document/2025-2027-ccdf-triennial-state-plan/#page=18
# Court status is distinct from protective-services or child-care authorization.

- name: MS ordinary age remains eligible.
  period: 2026-01
  input:
    state_code: MS
    age: 12
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    ms_ccpp_eligible_child: true

