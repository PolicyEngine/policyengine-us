# Mississippi TANF resources eligibility tests
# Resource limit: $2,000 for all households
# Effective date: July 1, 2019

- name: Case 1, zero resources.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 0
  output:
    # $0 <= $2,000 = true
    ms_tanf_resources_eligible: true

- name: Case 2, resources well below limit.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 500
  output:
    # $500 <= $2,000 = true
    ms_tanf_resources_eligible: true

- name: Case 3, resources below limit.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 1_500
  output:
    # $1,500 <= $2,000 = true
    ms_tanf_resources_eligible: true

- name: Case 4, resources exactly at limit.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 2_000
  output:
    # $2,000 <= $2,000 = true
    ms_tanf_resources_eligible: true

- name: Case 5, resources slightly above limit.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 2_001
  output:
    # $2,001 > $2,000 = false
    ms_tanf_resources_eligible: false

- name: Case 6, resources well above limit.
  period: 2026-01
  input:
    state_code: MS
    spm_unit_cash_assets: 5_000
  output:
    # $5,000 > $2,000 = false
    ms_tanf_resources_eligible: false

- name: Case 7, not in Mississippi.
  period: 2026-01
  input:
    state_code: NY
    spm_unit_cash_assets: 500
  output:
    # Not in MS, returns false (defined_for = MS)
    ms_tanf_resources_eligible: false

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: MS
  output:
    ms_tanf_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: MS
  output:
    ms_tanf_resources_eligible: false
