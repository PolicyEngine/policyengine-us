# Tests for md_ccs_income_eligible
# Initial applicants: income <= 75% SMI
# Continuing families (md_ccs_enrolled): income <= 85% SMI
# TCA/SSI recipients: income test waived
#
# For MD family of 4 in 2025 (FY2025 SMI base = $149,249):
#   hhs_smi = 149,249 * (0.52 + 0.16 * 3) = 149,249
#   75% SMI = 149,249 * 0.75 = 111,936.75 annual
#   85% SMI = 149,249 * 0.85 = 126,861.65 annual

- name: Case 1, family of 4 with income below 75 percent SMI is eligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 35
        employment_income: 100_000
      person2:
        age: 33
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
  output:
    # Monthly countable income: 100,000 / 12 = 8,333.33
    # Monthly 75% SMI threshold: 149,249 * 0.75 / 12 = 9,328.06
    # 8,333.33 <= 9,328.06 -> eligible
    md_ccs_income_eligible: true

- name: Case 2, family of 4 with income above 75 percent SMI is not eligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 35
        employment_income: 120_000
      person2:
        age: 33
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
  output:
    # Monthly countable income: 120,000 / 12 = 10,000
    # Monthly 75% SMI threshold: 149,249 * 0.75 / 12 = 9,328.06
    # 10,000 > 9,328.06 -> not eligible (new applicant)
    md_ccs_income_eligible: false

- name: Case 3, enrolled family of 4 with income between 75 and 85 percent SMI is eligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 35
        employment_income: 120_000
      person2:
        age: 33
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        md_ccs_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
  output:
    # Monthly countable income: 120,000 / 12 = 10,000
    # Monthly 85% SMI threshold: 149,249 * 0.85 / 12 = 10,571.81
    # 10,000 <= 10,571.81 -> eligible (continuation)
    md_ccs_income_eligible: true

- name: Case 4, enrolled family of 4 with income above 85 percent SMI is not eligible.
  period: 2025-01
  input:
    people:
      person1:
        age: 35
        employment_income: 130_000
      person2:
        age: 33
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        md_ccs_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
  output:
    # Monthly countable income: 130,000 / 12 = 10,833.33
    # Monthly 85% SMI threshold: 149,249 * 0.85 / 12 = 10,571.81
    # 10,833.33 > 10,571.81 -> not eligible
    md_ccs_income_eligible: false

- name: Case 5, frozen SMI is converted to monthly before comparing income.
  period: 2024-01
  input:
    people:
      person1:
        age: 35
        employment_income: 100_000
      person2:
        age: 33
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
  output:
    # Monthly countable income: 100,000 / 12 = 8,333.33
    # Frozen FY2024 four-person SMI uses 2021 MD SMI: 124,807
    # Monthly 75% SMI threshold: 124,807 * 0.75 / 12 = 7,800.44
    # 8,333.33 > 7,800.44 -> not eligible
    md_ccs_income_eligible: false

# MSDE posts an Initial Income Scale effective December 15, 2024 ($94,026 a year for three)
# and a Continuation Income Scale effective April 22, 2024 ($106,563), both at the federal
# fiscal 2025 median, and still posts them in October 2026.
- name: In November 2024 a new family of three still faced 75% of the median MSDE froze at its 2021 level.
  period: 2024-11
  input:
    people:
      p1_1:
        age:
          2024: 30
      p1_2:
        age:
          2024: 8
      p1_3:
        age:
          2024: 5
      p2_1:
        age:
          2024: 30
      p2_2:
        age:
          2024: 8
      p2_3:
        age:
          2024: 5
    spm_units:
      u1:
        members: [p1_1, p1_2, p1_3]
        md_ccs_countable_income: 6_552
        md_ccs_enrolled: false
      u2:
        members: [p2_1, p2_2, p2_3]
        md_ccs_countable_income: 6_553
        md_ccs_enrolled: false
    households:
      h1:
        members: [p1_1, p1_2, p1_3]
        state_code:
          2024: MD
      h2:
        members: [p2_1, p2_2, p2_3]
        state_code:
          2024: MD
  output:
    # 75% * 124_807 * 0.84 / 12 = 6_552.37
    md_ccs_income_eligible: [true, false]

- name: In March 2026 a new family of three faces the posted Initial Income Scale of $94,026 a year.
  period: 2026-03
  input:
    people:
      p1_1:
        age:
          2026: 30
      p1_2:
        age:
          2026: 8
      p1_3:
        age:
          2026: 5
      p2_1:
        age:
          2026: 30
      p2_2:
        age:
          2026: 8
      p2_3:
        age:
          2026: 5
    spm_units:
      u1:
        members: [p1_1, p1_2, p1_3]
        md_ccs_countable_income: 7_835
        md_ccs_enrolled: false
      u2:
        members: [p2_1, p2_2, p2_3]
        md_ccs_countable_income: 7_836
        md_ccs_enrolled: false
    households:
      h1:
        members: [p1_1, p1_2, p1_3]
        state_code:
          2026: MD
      h2:
        members: [p2_1, p2_2, p2_3]
        state_code:
          2026: MD
  output:
    # 75% of the federal fiscal 2025 median: 0.75 * 149_249 * 0.84 / 12 = 7_835.57.
    # The federal fiscal 2026 median would give 0.75 * 154_117 * 0.84 / 12 = 8_091.14
    md_ccs_income_eligible: [true, false]

