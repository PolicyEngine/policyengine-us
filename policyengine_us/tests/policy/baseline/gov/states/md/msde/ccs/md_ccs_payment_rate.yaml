- name: Licensed center, Region X (Howard), regular age, negative hours falls to one unit.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person2:
        age: 5
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: -1
        md_ccs_provider_type: LICENSED_CENTER
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MD
        county: HOWARD_COUNTY_MD
  output:
    # Negative hours -> 0 units from the bracket -> select default UNIT_1.
    # Region X, Center, REGULAR (age 5), UNIT_3 base $381/week x 1/3 = $127/week
    md_ccs_payment_rate: [0, 127]

- name: Informal provider, unknown-county and out-of-state households in one simulation with a Montgomery County household.
  # defined_for masks the output but the formula still runs over every
  # household in the simulation. Before the UNKNOWN guard, the Maryland
  # household with an UNKNOWN county reached the county-keyed informal rate
  # table and raised ParameterNotFoundError.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person2:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
      person3:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person4:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
      person5:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person6:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3, person4]
      tax_unit3:
        members: [person5, person6]
    spm_units:
      spm_unit1:
        members: [person1, person2]
      spm_unit2:
        members: [person3, person4]
      spm_unit3:
        members: [person5, person6]
    households:
      household1:
        members: [person1, person2]
        state_code: MD
        county: MONTGOMERY_COUNTY_MD
      household2:
        members: [person3, person4]
        state_code: MD
        county: UNKNOWN
      household3:
        members: [person5, person6]
        state_code: VA
        county: FAIRFAX_COUNTY_VA
  output:
    # person2: informal, Montgomery, REGULAR (age 3), UNIT_1 (2 hours):
    #   $177 / 3 = $59/week.
    # person4: UNKNOWN county falls back to Allegany, informal REGULAR
    #   UNIT_1: $83 / 3 = $27.67/week.
    # person6: Virginia; defined_for zeroes the result.
    md_ccs_payment_rate: [0, 59, 0, 27.67, 0, 0]

- name: Maryland household with a Virginia county uses Allegany in a mixed simulation
  # Keep a normal Maryland household present so the vectorized formula runs
  # for the household whose county belongs to another state.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person2:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
      person3:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person4:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3, person4]
    spm_units:
      spm_unit1:
        members: [person1, person2]
      spm_unit2:
        members: [person3, person4]
    households:
      household1:
        members: [person1, person2]
        state_code: MD
        county: MONTGOMERY_COUNTY_MD
      household2:
        members: [person3, person4]
        state_code: MD
        county: FAIRFAX_COUNTY_VA
  output:
    # person2: informal, Montgomery, REGULAR (age 3), UNIT_1 (2 hours):
    #   $177 / 3 = $59/week.
    # person4: the Virginia county falls back to Allegany, informal REGULAR,
    #   UNIT_1: $83 / 3 = $27.67/week.
    md_ccs_payment_rate: [0, 59, 0, 27.67]

- name: UTF-8 byte counties preserve the Maryland rate in a mixed-state simulation
  # !!binary preserves bytes, including the UTF-8 Ñ in DOÑA_ANA_COUNTY_NM.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person2:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
      person3:
        age: 30
        employment_income: 40_000
        is_tax_unit_head_or_spouse: true
      person4:
        age: 3
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 2
        md_ccs_provider_type: INFORMAL
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3, person4]
    spm_units:
      spm_unit1:
        members: [person1, person2]
      spm_unit2:
        members: [person3, person4]
    households:
      household1:
        members: [person1, person2]
        state_code: MD
        county_str: !!binary TU9OVEdPTUVSWV9DT1VOVFlfTUQ=  # MONTGOMERY_COUNTY_MD
      household2:
        members: [person3, person4]
        state_code: NM
        county_str: !!binary RE/DkUFfQU5BX0NPVU5UWV9OTQ==  # DOÑA_ANA_COUNTY_NM
  output:
    # Montgomery informal regular UNIT_1: $177 / 3 = $59 per week.
    md_ccs_payment_rate: [0, 59, 0, 0]
