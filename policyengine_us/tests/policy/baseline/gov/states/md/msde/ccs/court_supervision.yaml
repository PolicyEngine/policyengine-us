- name: Maryland court-supervised child receives ordinary rates and pays the ordinary copay
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 50000
        weekly_hours_worked: 40
        is_tax_unit_head_or_spouse: true
      child:
        age: 18
        is_under_court_supervision: true
        is_tax_unit_dependent: false
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
        md_ccs_provider_type: LICENSED_CENTER
    tax_units:
      unit:
        members:
        - parent
        - child
    spm_units:
      unit:
        members:
        - parent
        - child
        spm_unit_pre_subsidy_childcare_expenses: 4800
        receives_snap: false
        is_tanf_enrolled: false
        meets_ccdf_activity_test: false
    households:
      unit:
        members:
        - parent
        - child
        state_code: MD
        county: ALLEGANY_COUNTY_MD
  output:
    md_ccs_eligible_child:
    - false
    - true
    md_ccs_eligible: true
    md_ccs_weekly_copay: 3
    md_ccs_payment_rate:
    - 0
    - 183
    md_ccs: 387
    is_disabled:
    - false
    - false
    receives_or_needs_protective_services:
    - false
    - false
