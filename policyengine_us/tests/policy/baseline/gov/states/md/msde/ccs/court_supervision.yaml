# Maryland's CCDF plans elect court-supervised children through age 18
# (FFY 2022-2024 plan 3.1.1; FFY 2025-2027 plan 2.2.1(c)). The route is modeled
# from 2018-10-01, the FFY 2019-2021 plan period start; before that the court
# threshold equals the ordinary child ceiling.

- name: Case 1, Maryland court age boundaries include 18 and exclude 19 and adults.
  period: 2025-01
  input:
    people:
      person1:
        age:
          2025: 12
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
      person2:
        age:
          2025: 13
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
      person3:
        age:
          2025: 17
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
      person4:
        age:
          2025: 18
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
      person5:
        age:
          2025: 19
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
      person6:
        age:
          2025: 40
        is_ccdf_immigration_eligible_child:
          2025: true
        is_under_court_supervision:
          2025: true
    households:
      household:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
        - person6
        state_code:
          2025: MD
  output:
    md_ccs_eligible_child:
    - true
    - true
    - true
    - true
    - false
    - false
