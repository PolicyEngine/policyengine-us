    - false
- name: Case 9, Maryland court-supervised child receives ordinary rates and pays the ordinary copay.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 50_000
        weekly_hours_worked: 40
        is_tax_unit_head_or_spouse: true
      person2:
        age: 18
        is_under_court_supervision: true
        is_tax_unit_dependent: false
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
        md_ccs_provider_type: LICENSED_CENTER
    tax_units:
      unit:
        members:
        - person1
        - person2
    spm_units:
      unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 4_800
        receives_snap: false
        is_tanf_enrolled: false
        meets_ccdf_activity_test: false
    households:
      unit:
        members:
        - person1
        - person2
        state_code: MD
        county: ALLEGANY_COUNTY_MD
  output:
    md_ccs_eligible_child:
    - false
    - true
    md_ccs_eligible: true
    # One eligible child at 8 hours/day (3 units): $3/week. The 7% federal
    # cap (50_000 / 52 * 0.07 = 67.31) does not bind.
    md_ccs_weekly_copay: 3
    # Allegany County is Region Z; licensed center, regular age, 3 units.
    md_ccs_payment_rate:
    - 0
    - 183
    # (4_800 - 3 * 52) / 12 = 4_644 / 12 = 387,
    # below the cap of 183 * 52 / 12 = 793.
    md_ccs: 387
