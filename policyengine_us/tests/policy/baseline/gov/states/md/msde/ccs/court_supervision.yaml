- name: Case 19, Maryland court-supervised 17-year-old head of unit counts as an eligible child with their own infant.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 17
        employment_income: 12_000
        weekly_hours_worked: 20
        is_tax_unit_head_or_spouse: true
        is_under_court_supervision: true
        immigration_status: CITIZEN
      person2:
        age: 1
        immigration_status: CITIZEN
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        spm_unit_pre_subsidy_childcare_expenses: 6_000
        receives_snap: false
        is_tanf_enrolled: false
        meets_ccdf_activity_test: false
    households:
      household:
        members:
        - person1
        - person2
        state_code: MD
        county: ALLEGANY_COUNTY_MD
  output:
    # Pins current behavior: the model has no head-or-spouse gate on
    # md_ccs_eligible_child, so the court-supervised teen head (17 < 19)
    # is an eligible child, as is the infant (1 < 13).
    md_ccs_eligible_child:
    - true
    - true
    # person1, the only head or spouse, works 20 hours a week.
    md_ccs_activity_eligible: true
    # 12_000 / 12 = 1_000 is within 75% of SMI for 2 people:
    # 149_249 * (0.52 + 0.16) * 0.75 / 12 = 6_343.08.
    md_ccs_income_eligible: true
    md_ccs_eligible: true
    # Region Z licensed center (default provider type).
    # person1: regular age, 0 care hours -> 1 unit: 183 * 1 / 3 = 61.
    # person2: infant (12 months < 24), 8 hours -> 3 units: 262.
    md_ccs_payment_rate:
    - 61
    - 262
    # 1 unit ($1) + 3 units ($3) = $4/week. The 7% federal cap
    # (1_000 * 12 / 52 * 0.07 = 16.15) does not bind.
    md_ccs_weekly_copay: 4
    # 6_000 - 4 * 52 = 5_792, below the cap of (61 + 262) * 52 = 16_796;
    # 5_792 / 12 = 482.67.
    md_ccs: 482.67
