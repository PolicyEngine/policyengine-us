# Tests for md_paa main benefit variable.
# Formula (prospective SSI cascade):
#   paa = max(combined_need - md_paa_countable_income - imputed_federal_ssi, 0)
# REHAB residents impute the $30 federal SSI medical-facility rate.
# 2026 federal SSI individual FBR = $994; PNA = $106.

- name: Case 1, CARE_HOME_LEVEL_B with only SSI — federal SSI exceeds combined need.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800  # gates eligibility
        ssi_earned_income: 0
        ssi_unearned_income: 0
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_B
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # combined_need = 875 + 106 = 981. imputed SSI = 994. PAA = 0.
    md_paa: 0

- name: Case 2, REHAB_RESIDENCE with only SSI receives state-funded gap to PNA.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        ssi_earned_income: 0
        ssi_unearned_income: 0
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: REHAB_RESIDENCE
        # MDH rehab residents are SSI medical-treatment-facility recipients
        # (federal SSI capped at $30/mo). md_paa_eligible requires both flags.
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # combined_need = 0 + 106 = 106. imputed SSI = $30. PAA = 76.
    md_paa: 76

- name: Case 3, ineligible (NONE living arrangement).
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: NONE
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_paa: 0

- name: Case 4, CARE_HOME_LEVEL_C SSI-only — state fills gap above federal.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        ssi_earned_income: 0
        ssi_unearned_income: 0
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # combined_need = 1173 + 106 = 1279. imputed SSI = 994. PAA = 285.
    md_paa: 285

- name: Case 5, negative earned income does not inflate benefit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        # Self-employment loss should not reduce countable income below zero.
        self_employment_income: -60_000_000
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # md_paa_countable_income floors at 0 by design.
    # imputed SSI = 994. PAA = 1279 - 994 = 285.
    md_paa: 285

- name: Case 6, out-of-state recipient is ineligible.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_B
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    md_paa: 0

- name: Case 7, high-income REHAB recipient — income exhausts federal then state.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        # $2,500/mo non-SSI unearned * 12 = $30,000/yr.
        social_security: 30_000
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: REHAB_RESIDENCE
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # combined = 106. countable = 2500 - 20 = 2480.
    # imputed SSI = 0 because countable income exceeds the $30 medical rate.
    # PAA = max(106 - 2480, 0) = 0.
    md_paa: 0

- name: Case 8, CARE_HOME_LEVEL_D recipient gets the largest state supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_D
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # combined_need = 1376 + 106 = 1482. imputed SSI = 994. PAA = 488.
    md_paa: 488

# Partial-erosion case: countable income exceeds the imputed medical-facility
# SSI amount but does not fully exhaust the PNA.
- name: Case 9, REHAB recipient with $80/mo unearned — partial state erosion.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 800  # gates eligibility
        social_security: 960  # $80/mo unearned (in addition to medical SSI)
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: REHAB_RESIDENCE
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # countable monthly = 80 - 20 (general exclusion) = 60.
    # imputed SSI = max(30 - 60, 0) = 0.
    # PAA = max(106 - 60, 0) = 46. Partial reduction (not zero).
    md_paa: 46

- name: Case 10, SSDI-only recipient with high SSDI receives no PAA.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        is_disabled: false
        ssi: 0
        social_security_disability: 30_000
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_paa_eligible: true
    md_paa_countable_income: 2_480
    md_paa_imputed_federal_ssi: 0
    md_paa: 0

# SSA cannot pay SSI to an LPR with fewer than 40 quarters, so PAA imputes no
# federal SSI and counts only her own income (COMAR 07.03.07.07 has no spousal
# deeming); PAA pays allowable needs less net countable income
# (COMAR 07.03.07.09A). 2025-01: provider rate $1,376; PNA $102.
- name: Case 11, aged LPR without 40 quarters in CARE_HOME_LEVEL_D with a working spouse.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 20
        social_security_survivors: 6_000 # 500 a month
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_D
      person2:
        age: 60
        employment_income: 12_000 # 1,000 a month
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    # person1 qualifies through aged Social Security receipt; person2 is not
    # in a PAA facility.
    md_paa_eligible: [true, false]
    ssi: [0, 0]
    # SSI would deem person2's wages to person1: couple countable
    # 480 + (1,000 - 65) * 0.5 = 947.50 less her own 480 = 467.50 a month.
    ssi_income_deemed_from_ineligible_spouse: [467.50, 0]
    # PAA counts person1's own 500 - 20 = 480 a month (5,760 a year) without
    # the deemed amount. person2's own countable wages are
    # (1,000 - 20 - 65) * 0.5 = 457.50.
    md_paa_countable_income: [480, 457.50]
    md_paa_imputed_federal_ssi: [0, 0]
    # combined_need = 1,376 + 102 = 1,478. PAA = 1,478 - 480 - 0 = 998.
    md_paa_total_cost_of_care: [1_478, 0]
    md_paa: [998, 0]

# A person who reports SSI receipt keeps the imputed federal SSI even though
# the model's alien test bars her, for example someone SSA still pays under 8
# U.S.C. 1612(a)(2)(E) because she was receiving SSI on August 22, 1996. PAA
# counts federally funded assistance payments (COMAR 07.03.07.07B(3)) and pays
# allowable needs less net countable income (COMAR 07.03.07.09A). 2025-01:
# federal SSI individual rate $967; provider rate $1,376; PNA $102.
- name: Case 12, aged LPR without 40 quarters who reports SSI receipt keeps the imputed SSI.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 30 # entered in 1995
        ssi_qualifying_quarters_earnings: 20
        receives_ssi: true
        social_security_survivors: 6_000 # 500 a month
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_D
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_paa_eligible: true
    # The model's SSI fails her on the 40-quarter test, so it computes no SSI.
    ssi: 0
    # 500 - 20 general exclusion = 480 a month (5,760 a year).
    md_paa_countable_income: 480
    # Reported SSI receipt keeps the imputation: 967 - 480 = 487.
    md_paa_imputed_federal_ssi: 487
    # combined_need = 1,376 + 102 = 1,478.
    md_paa_total_cost_of_care: 1_478
    # PAA = 1,478 - 480 - 487 = 511.
    md_paa: 511

# Case 11's household when person1 reports SSI receipt. PAA counts only her
# own income (COMAR 07.03.07.07), and the imputed SSI is what SSA pays her
# under spouse deeming: the lesser of the couple computation and the
# individual computation (20 CFR 416.1163(d)-(e); POMS SI 01320.430).
# 2025-01: federal SSI couple rate $1,450 and individual rate $967; provider
# rate $1,376; PNA $102.
- name: Case 13, aged LPR without 40 quarters who reports SSI receipt and has a working spouse.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 30 # entered in 1995
        ssi_qualifying_quarters_earnings: 20
        receives_ssi: true
        social_security_survivors: 6_000 # 500 a month
        ssi_countable_resources: 1_000
        md_paa_living_arrangement: CARE_HOME_LEVEL_D
      person2:
        age: 60
        employment_income: 12_000 # 1,000 a month
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    md_paa_eligible: [true, false]
    # The model's SSI fails person1 on the 40-quarter test.
    ssi: [0, 0]
    # person2's 12,000 a year exceeds the (1,450 - 967) x 12 = 5,796 gap, so
    # deeming applies: couple countable 480 + (1,000 - 65) x 0.5 = 947.50
    # less person1's own 480 = 467.50 a month.
    ssi_income_deemed_from_ineligible_spouse: [467.50, 0]
    # PAA counts person1's own income only: 500 - 20 = 480. person2's own
    # countable wages are (1,000 - 20 - 65) x 0.5 = 457.50.
    md_paa_countable_income: [480, 457.50]
    # SSA pays min(1,450 - (480 + 467.50), 967 - 480) = min(502.50, 487) = 487.
    md_paa_imputed_federal_ssi: [487, 0]
    # combined_need = 1,376 + 102 = 1,478.
    md_paa_total_cost_of_care: [1_478, 0]
    # PAA = 1,478 - 480 - 487 = 511, the same as with no spouse (Case 12).
    md_paa: [511, 0]
