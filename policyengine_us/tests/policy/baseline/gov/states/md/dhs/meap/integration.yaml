- name: Mixed status follows the regulation household count and counts excluded income in full
  period: 2026
  input:
    people:
      parent:
        age: 40
        employment_income: 20000
        ssi: 0
      child:
        age: 5
        immigration_status: UNDOCUMENTED
        child_support_received: 1000
        ssi: 0
    spm_units:
      unit:
        members:
        - parent
        - child
        heating_type: NATURAL_GAS
        gas_expense: 1
        snap: 0
        md_tca: 0
    households:
      home:
        members:
        - parent
        - child
        state_code: MD
        county: BALTIMORE_COUNTY_MD
  output:
    md_meap_household_size: 1
    md_meap_countable_income: 21000
    md_meap_income_limit: 31300
    md_meap_fpg: 15650
    md_meap_level: 4
    md_meap_eligible: true
    md_meap: 360
- name: Categorically eligible high-income subsidized household receives the nominal payment
  period: 2026
  input:
    state_code: MD
    age: 40
    employment_income: 100000
    snap: 120
    md_tca: 0
    ssi: 0
    receives_housing_assistance: true
    heating_type: PROPANE
    bottled_gas_expense: 1
    county: GARRETT_COUNTY_MD
  output:
    md_meap_categorically_eligible: true
    md_meap_countable_income: 100000
    md_meap_level: 7
    md_meap_eligible: true
    md_meap: 25
- name: Unsubsidized heat in rent with known fuel uses its normal fuel row
