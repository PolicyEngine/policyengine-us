# Source for the expected values in this file: COMAR 07.03.21.04D(1)-(2) (countable
# wages and net self-employment income) and E(3) (excluded earnings of a child
# under 18 or a full-time student):
# https://regs.maryland.gov/us/md/exec/comar/07.03.21.04

- name: Case 1, child and full-time student earnings are excluded, adults' count from age 18, and business losses floor at zero.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD]
    age: [17, 18, 18, 40, 40, 40]
    is_full_time_student: [false, true, false, true, false, false]
    employment_income: [12_000, 12_000, 12_000, 12_000, 12_000, 12_000]
    self_employment_income: [1_000, 1_000, 1_000, 1_000, 1_000, -1_000]
    sstb_self_employment_income: [600, 600, 600, 600, 600, 600]
    farm_operations_income: [1_200, 1_200, 1_200, 1_200, 1_200, 1_200]
  output:
    # COMAR 07.03.21.04E(3): employment income of a child younger than 18 or of a
    # full-time student is not countable: the 17-year-old, the 18-year-old student
    # and the 40-year-old student each count $0. An 18-year-old who is not a student
    # and a 40-year-old count $12,000 wages + $1,000 + $600 + $1,200 net
    # self-employment (D(1), D(2)) = $14,800. With a $1,000 business loss the loss
    # is floored at $0 for that source: $12,000 + $0 + $600 + $1,200 = $13,800.
    md_meap_countable_earned_income: [0, 0, 14_800, 0, 14_800, 13_800]
