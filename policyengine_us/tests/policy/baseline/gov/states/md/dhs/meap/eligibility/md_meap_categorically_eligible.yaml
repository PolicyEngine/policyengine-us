- name: Receipt of SNAP, TCA or SSI independently waives the income test
  period: 2026
  input:
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    state_code: [MD, MD, MD, MD]
    snap: [1, 0, 0, 0]
    tanf: [0, 1, 0, 0]
    ssi: [0, 0, 1, 0]
    veterans_benefits: [0, 0, 0, 1000]
  output:
    md_meap_categorically_eligible: [true, true, true, false]

- name: Unclaimed state cash entitlement does not confer categorical eligibility
  period: 2026
  input:
    state_code: [MD, MD]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    age: [40, 40]
    md_tca: [1200, 1200]
    takes_up_tanf_if_eligible: [false, true]
    snap: [0, 0]
    ssi: [0, 0]
  output:
    md_meap_categorically_eligible: [false, true]
