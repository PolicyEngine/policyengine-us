- name: Case 1, no income gives zero PAA countable income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_paa_countable_income: 0

- name: Case 2, OASI income applies the unearned-income disregard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security: 12_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # $1,000 monthly OASI - $20 general exclusion.
    md_paa_countable_income: 980

- name: Case 3, SSDI-only recipient does not need a separate disability flag for income counting.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        is_disabled: false
        social_security_disability: 30_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # $2,500 monthly SSDI - $20 general exclusion.
    ssi_countable_income: 0
    md_paa_countable_income: 2_480

- name: Case 4, a spouse's facility stay from July separates the couple's income from July.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        ssi_earned_income: 12_000
        ssi_unearned_income: 12_000
      person2:
        age: 70
        is_tax_unit_spouse: true
        ssi_unearned_income: 6_000
        ssi_lives_in_medical_treatment_facility:
          2025-01: false
          2025-07: true
        ssi_medicaid_pays_majority_of_care:
          2025-01: false
          2025-07: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    # person2 is in a Medicaid-funded facility from July through December,
    # so the couple computation applies through June and not from July.
    ssi_couple_computation_applies:
      2025-06: [true, true]
      2025-07: [false, false]
    # January to June each spouse counts half of the couple's combined income
    # (20 CFR 416.1802(b)(1)): earned 1,000 and unearned 1,000 + 500 = 1,500 a
    # month, so (1,500 - 20) + (1,000 - 65) / 2 = 1,480 + 467.50 = 1,947.50,
    # and 1,947.50 / 2 = 973.75 each.
    # July to December each spouse counts their own income (20 CFR
    # 416.414(b)(3)): person1 (1,000 - 20) + (1,000 - 65) / 2 = 1,447.50;
    # person2 500 - 20 = 480.
    # Both spouses are aged, so neither is an ineligible spouse and no
    # income is deemed.
    # Year: person1 6 x 973.75 + 6 x 1,447.50 = 5,842.50 + 8,685 = 14,527.50;
    # person2 6 x 973.75 + 6 x 480 = 5,842.50 + 2,880 = 8,722.50. The two sum
    # to 23,250 = 6 x 1,947.50 + 6 x (1,447.50 + 480), the couple's income
    # net of exclusions.
    md_paa_countable_income:
      2025-06: [973.75, 973.75]
      2025-07: [1_447.50, 480]
      2025: [14_527.50, 8_722.50]

- name: Maryland counts January's SSI in-kind support in January PAA income.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age:
          2024: 70
        ssi_receives_food_from_others:
          2024: true
        md_paa_living_arrangement:
          2024: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person]
        state_code:
          2024: MD
  output:
    # ISM = 943 / 3 + 20; countable = ISM - 20 = 314.333333.
    ssi_in_kind_support_and_maintenance: 334.333333
    md_paa_countable_income: 314.333333
    # Imputed SSI = 943 - 314.333333 = 628.666667.
    md_paa_imputed_federal_ssi: 628.666667
    # PAA = 1,173 + 98 - 314.333333 - 628.666667 = 328.
    md_paa: 328

- name: Maryland counts November's SSI in-kind support in November PAA income.
  period: 2024-11
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age:
          2024: 70
        ssi_receives_food_from_others:
          2024: true
        md_paa_living_arrangement:
          2024: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person]
        state_code:
          2024: MD
  output:
    # November retains food ISM from September under SSI's payment timing.
    ssi_in_kind_support_and_maintenance: 334.333333
    md_paa_countable_income: 314.333333
    md_paa_imputed_federal_ssi: 628.666667
    # PAA = 1,173 + 102 - 943 = 332 after the July PNA increase.
    md_paa: 332

- name: Maryland counts no SSI in-kind support in December 2024 PAA income.
  period: 2024-12
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age:
          2024: 70
        ssi_receives_food_from_others:
          2024: true
        md_paa_living_arrangement:
          2024: CARE_HOME_LEVEL_C
    households:
      household:
        members: [person]
        state_code:
          2024: MD
  output:
    # October food no longer counts, so December ISM and countable income = 0.
    ssi_in_kind_support_and_maintenance: 0
    md_paa_countable_income: 0
    md_paa_imputed_federal_ssi: 943
    # PAA = 1,173 + 102 - 0 - 943 = 332.
    md_paa: 332

- name: Maryland sums monthly countable income without carrying December's unused exclusion.
  period: 2024
  absolute_error_margin: 0.01
  input:
    age: 70
    state_code: MD
    ssi_receives_food_from_others: true
  output:
    # 11 * (943 / 3 + 20) = 3,677.666667 gross ISM.
    ssi_in_kind_support_and_maintenance: 3_677.666667
    # 11 * (943 / 3) + 0 = 3,457.666667 countable income.
    md_paa_countable_income: 3_457.666667
