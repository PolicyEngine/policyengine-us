- name: Case 1, no income gives zero PAA countable income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_paa_countable_income: 0

- name: Case 2, OASI income applies the unearned-income disregard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security: 12_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # $1,000 monthly OASI - $20 general exclusion.
