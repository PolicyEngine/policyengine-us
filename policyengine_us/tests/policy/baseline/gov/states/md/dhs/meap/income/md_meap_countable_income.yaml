# Sources for the expected values in this file:
# - COMAR 07.03.21.04D (countable income sources), E(13) and F (court-ordered child
#   support paid is deducted), D(3), D(26) and E(20) (Social Security and railroad
#   retirement less the Medicare deduction):
#   https://regs.maryland.gov/us/md/exec/comar/07.03.21.04
# - FY2026 LIHEAP State Plan, section 1.9 (page 6): SSA benefits "Excluding MediCare
#   deduction":
#   https://liheapch.acf.gov/docs/2026/state-plans/MD_Plan_2026.pdf#page=6

- name: Case 1, every modeled unearned source counts and court-ordered support is deducted.
  period: 2026
  input:
    state_code: MD
    md_meap_countable_earned_income: 10_000
    social_security: 12_000
    medicare_part_b_premium: 0
    railroad_benefits: 600
    pension_income: 1_200
    military_retirement_pay: 1_800
    survivor_benefits: 300
    retirement_distributions: 2_400
    interest_income: 120
    ordinary_dividend_income: 240
    estate_income: 360
    rental_income: 1_200
    farm_rent_income: 240
    child_support_received: 600
    alimony_income: 480
    workers_compensation: 720
    unemployment_compensation: 840
    veterans_benefits: 960
    strike_benefits: 120
    ssi: 0
    tanf: 0
    child_support_expense: 2_400
  output:
    # COMAR 07.03.21.04D: $10,000 earnings + $12,000 Social Security (D(3), with no
    # Medicare premium to deduct) + $600 railroad retirement (D(26)) + $1,200 pensions
    # + $1,800 military retirement pay (D(12)) + $300 survivor benefits (D(12),
    # D(13), D(18)) + $2,400 retirement account disbursements (D(13)) + $120 interest
    # (D(6)) + $240 dividends (D(5)) + $360 estate income (D(8)) + $1,200 rental +
    # $240 farm rental income (D(2)) + $600 child support (D(14)) + $480 alimony
    # (D(15)) + $720 workers' compensation (D(16)) + $840 unemployment (D(17)) +
    # $960 veterans benefits (D(18)) + $120 strike funds (D(24)) = $34,180; less
    # $2,400 court-ordered child support paid (E(13), F) = $31,780.
    md_meap_countable_income: 31_780

- name: Case 2, the support deduction cannot make countable income negative.
  period: 2026
  input:
    state_code: MD
    md_meap_countable_earned_income: 0
    ssi: 0
    tanf: 0
    child_support_expense: 10_000
  output:
    # COMAR 07.03.21.04F deducts verified support from gross income; with no income
    # the result is floored at $0.
    md_meap_countable_income: 0

- name: Case 3, TCA counts only when it is taken up.
  period: 2026
  input:
    state_code: [MD, MD]
    md_tca: [1_200, 1_200]
    takes_up_tanf_if_eligible: [false, true]
    ssi: [0, 0]
  output:
    # COMAR 07.03.21.04D(10): temporary cash assistance is countable. The first
    # household is entitled to $1,200 of TCA but does not receive it, $0; the second
    # receives it, $1,200.
    md_meap_countable_income: [0, 1_200]

- name: Case 4, Social Security counts net of the Medicare Part B premium the person pays.
  period: 2026
  input:
    state_code: [MD, MD]
    age: [70, 70]
    social_security: [32_000, 32_000]
    medicare_part_b_premium: [2_435, 0]
    ssi: [0, 0]
    tanf: [0, 0]
  output:
    # COMAR 07.03.21.04D(3) counts "Social Security income less Medicare payment
    # deduction" and E(20) excludes the Medicare payments deducted from the check;
    # plan 1.9 checks "Excluding MediCare deduction". $32,000 - $2,435 = $29,565 for
    # the retiree who pays the premium; $32,000 when a Medicare Savings Program
    # pays it.
    md_meap_countable_income: [29_565, 32_000]

- name: Case 5, a rental or estate loss is floored at zero and does not offset earnings.
  period: 2026
  input:
    state_code: [MD, MD]
    md_meap_countable_earned_income: [33_000, 33_000]
    rental_income: [-3_000, 3_000]
    estate_income: [-1_000, 0]
    ssi: [0, 0]
    tanf: [0, 0]
  output:
    # COMAR 07.03.21.04D(2) treats self-employment and rental income as one item,
    # and plan 1.8 (page 6) counts gross income, so each source is floored at zero
    # like the earned sources: $33,000 + $0 + $0 = $33,000, and $33,000 + $3,000 =
    # $36,000.
    md_meap_countable_income: [33_000, 36_000]
