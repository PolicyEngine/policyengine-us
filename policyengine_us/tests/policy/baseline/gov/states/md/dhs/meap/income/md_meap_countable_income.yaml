# 10,000 earnings + 12,600 SSA/railroad + 9,240 other receipts - 2,400 support = 29,440.
- name: Count pensions and IRA withdrawals separately, deduct court-ordered support while Medicare deductions remain deferred
  period: 2026
  input:
    heating_type: NATURAL_GAS
    state_code: MD
    md_meap_countable_earned_income: 10000
    social_security: 12000
    railroad_benefits: 600
    medicare_part_b_premium: 1200
    pension_income: 1200
    retirement_distributions: 2400
    interest_income: 120
    ordinary_dividend_income: 240
    estate_income: 360
    rental_income: 1200
    child_support_received: 600
    alimony_income: 480
    workers_compensation: 720
    unemployment_compensation: 840
    veterans_benefits: 960
    strike_benefits: 120
    ssi: 0
    tanf: 0
    child_support_expense: 2400
  output:
    md_meap_countable_income: 29440
- name: Support deduction cannot make countable income negative
  period: 2026
  input:
    heating_type: NATURAL_GAS
    state_code: MD
    md_meap_countable_earned_income: 0
    ssi: 0
    tanf: 0
    child_support_expense: 10000
  output:
    md_meap_countable_income: 0

- name: State cash entitlement counts only when TANF is taken up
  period: 2026
  input:
    state_code: [MD, MD]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    age: [40, 40]
    md_tca: [1200, 1200]
    takes_up_tanf_if_eligible: [false, true]
    ssi: [0, 0]
  output:
    md_meap_countable_income: [0, 1200]
