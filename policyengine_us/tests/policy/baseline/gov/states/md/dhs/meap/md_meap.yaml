# Sources for the expected values in this file:
# - FY26 MEAP Benefit Matrix (one page), "the matrix" below:
#   https://dhs.maryland.gov/documents/OHEP/Advisory%20Board/FY26-MEAP-Benefit-Matrix-2-1-1.pdf
# - FY2026 OHEP Income Guidelines (one page):
#   https://dhs.maryland.gov/documents/OHEP/Advisory%20Board/Income-Guidelines-FY2026-Updated-7.9.2025.pdf
# - FY2026 LIHEAP State Plan, item 2.5 on page 11 (Garrett County multiplier):
#   https://liheapch.acf.gov/docs/2026/state-plans/MD_Plan_2026.pdf#page=11
# - FY27 MEAP Benefit Matrices, page 1 (Oil/Kerosene row label, Garrett County table):
#   https://dhs.maryland.gov/documents/OHEP/FY27-MEAP-Benefit-Matrices.pdf#page=1
# - OHEP Operations Manual (May 2025), page 63 (nominal benefit above 200% FPL):
#   https://dhs.maryland.gov/documents/OHEP/OHEP-Operations-Manual.pdf#page=63
# - COMAR 07.03.21.03 and 07.03.21.06:
#   https://regs.maryland.gov/us/md/exec/comar/07.03.21.06

- name: Case 1, electric heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Electric row, Levels 1 to 7: $100, $100, $100, $100, $100, $100, $25.
    md_meap: [100, 100, 100, 100, 100, 100, 25]

- name: Case 2, natural gas heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Gas row, Levels 1 to 7: $550, $475, $400, $360, $300, $225, $25.
    md_meap: [550, 475, 400, 360, 300, 225, 25]

