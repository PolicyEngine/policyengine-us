# Sources for the expected values in this file:
# - FY26 MEAP Benefit Matrix (one page), "the matrix" below:
#   https://dhs.maryland.gov/documents/OHEP/Advisory%20Board/FY26-MEAP-Benefit-Matrix-2-1-1.pdf
# - FY2025 MEAP Benefit Matrix (one page; Cases 11 and 12):
#   https://liheapch.acf.gov/docs/2025/benefits-matricies/MD_BenefitMatrix_2025.pdf
# - FY27 MEAP Benefit Matrices, page 1 (statewide and Garrett County tables; Cases
#   13 and 14, the Oil/Kerosene row label and the Garrett rounding):
#   https://dhs.maryland.gov/documents/OHEP/FY27-MEAP-Benefit-Matrices.pdf#page=1
# - FY2026 OHEP Income Guidelines (one page):
#   https://dhs.maryland.gov/documents/OHEP/Advisory%20Board/Income-Guidelines-FY2026-Updated-7.9.2025.pdf
# - FY2026 LIHEAP State Plan, item 2.5 on page 11 (Garrett County multiplier):
#   https://liheapch.acf.gov/docs/2026/state-plans/MD_Plan_2026.pdf#page=11
# - FY2025 LIHEAP State Plan, item 2.5 on page 11 (the same multiplier):
#   https://liheapch.acf.gov/docs/2025/state-plans/MD_Plan_2025.pdf#page=11
# - OHEP Operations Manual (May 2025), page 6 (solar subscriptions), page 38
#   (categorical eligibility denials) and page 63 (nominal benefit above 200% FPL):
#   https://dhs.maryland.gov/documents/OHEP/OHEP-Operations-Manual.pdf#page=63
# - COMAR 07.03.21.03 (eligibility):
#   https://regs.maryland.gov/us/md/exec/comar/07.03.21.03
# - COMAR 07.03.21.06 (denials):
#   https://regs.maryland.gov/us/md/exec/comar/07.03.21.06
# A model year reads the parameters at January 1, inside state FY (July to June) of
# the same number: period 2025 is FY25, 2026 is FY26 and 2027 is FY27.

- name: Case 1, electric heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Electric row, Levels 1 to 7: $100, $100, $100, $100, $100, $100, $25.
    md_meap: [100, 100, 100, 100, 100, 100, 25]

- name: Case 2, natural gas heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Gas row, Levels 1 to 7: $550, $475, $400, $360, $300, $225, $25.
    md_meap: [550, 475, 400, 360, 300, 225, 25]

- name: Case 3, fuel oil heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [FUEL_OIL, FUEL_OIL, FUEL_OIL, FUEL_OIL, FUEL_OIL, FUEL_OIL, FUEL_OIL]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Oil row, Levels 1 to 7: $1,100, $990, $880, $770, $650, $225, $25.
    md_meap: [1_100, 990, 880, 770, 650, 225, 25]

- name: Case 4, propane heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [PROPANE, PROPANE, PROPANE, PROPANE, PROPANE, PROPANE, PROPANE]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Propane row, Levels 1 to 7: $1,000, $930, $830, $725, $600, $225, $25.
    md_meap: [1_000, 930, 830, 725, 600, 225, 25]

- name: Case 5, wood heat at each FY26 matrix level.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD]
    heating_type: [WOOD, WOOD, WOOD, WOOD, WOOD, WOOD, WOOD]
    md_meap_eligible: [true, true, true, true, true, true, true]
    md_meap_level: [1, 2, 3, 4, 5, 6, 7]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
  output:
    # Matrix, Wood/Coal row, Levels 1 to 7: $550, $475, $400, $360, $300, $225, $25,
    # the same as the FY26 Gas row (the FY25 and FY27 rows differ).
    md_meap: [550, 475, 400, 360, 300, 225, 25]

- name: Case 6, Garrett County multiplier rounds half up and leaves the nominal grant flat.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD]
    county: [GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD]
    heating_type: [NATURAL_GAS, PROPANE, FUEL_OIL, FUEL_OIL, FUEL_OIL]
    md_meap_eligible: [true, true, true, true, true]
    md_meap_level: [2, 4, 6, 1, 7]
  output:
    # State Plan item 2.5 (page 11) applies a 1.1 multiplier to MEAP benefits for
    # Garrett County residents. Matrix cells times 1.1:
    #   Gas, Level 2: $475 x 1.1 = $522.50, rounded half up to $523.
    #   Propane, Level 4: $725 x 1.1 = $797.50, rounded half up to $798.
    #   Oil, Level 6: $225 x 1.1 = $247.50, rounded half up to $248.
    #   Oil, Level 1: $1,100 x 1.1 = $1,210.
    #   Oil, Level 7: the $25 nominal grant, no multiplier.
    # No FY26 Garrett County dollar table is published. Half-up rounding and the flat
    # Level 7 amount follow the FY27 Garrett County table (FY27 matrices, page 1),
    # where every Level 7 cell is $25.
    md_meap: [523, 798, 248, 1_210, 25]

- name: Case 7, kerosene, coal and solar rows and fuels without a matrix row.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD, MD]
    heating_type: [KEROSENE, COAL, SOLAR, OTHER, UNSPECIFIED, NONE]
    md_meap_eligible: [true, true, true, true, true, true]
    md_meap_level: [1, 1, 1, 1, 1, 1]
  output:
    # Matrix, Level 1 cells. Kerosene is paid from the Oil row, $1,100 (the FY26 matrix
    # has no kerosene row; the FY27 matrix, page 1, labels the row Oil/Kerosene).
    # Coal is paid from the Wood/Coal row, $550. A grid-tied solar home pays an
    # electricity bill (manual page 6 lists solar subscriptions), so it is paid from
    # the Electric row, $100. Other fuels and no heating have no matrix row, $0. An
    # unspecified fuel pays $0 as a coverage gap: the amount depends on the fuel and
    # the unspecified default is tracked in #9754.
    md_meap: [1_100, 550, 100, 0, 0, 0]

- name: Case 8, submetered home at Level 6 and the assisted living denial with and without categorical eligibility.
  period: 2026
  input:
    state_code: [MD, MD, MD, MD, MD]
    county: [MONTGOMERY_COUNTY_MD, MONTGOMERY_COUNTY_MD, MONTGOMERY_COUNTY_MD, MONTGOMERY_COUNTY_MD, MONTGOMERY_COUNTY_MD]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_150, 1_150, 1_150, 1_150, 1_150]
    md_meap_countable_income: [0, 0, 0, 40_000, 40_000]
    md_meap_categorically_eligible: [false, false, false, true, true]
    md_meap_dwelling_type: [STANDARD, SUB_METERED, ASSISTED_LIVING, SUB_METERED, ASSISTED_LIVING]
  output:
    # COMAR 07.03.21.06D(3)(k) denies an applicant who resides in an assisted living
    # facility. The fourth household is over the $31,300 one-person limit (Income
    # Guidelines) but categorically eligible, so the income test is waived. The fifth
    # is categorically eligible too, but manual page 38 lets such applications be
    # denied "for other eligibility issues", so assisted living still denies it.
    md_meap_eligible: [true, true, false, true, false]
    # Matrix columns: no income is Level 1 (0-25% FPL); a submetered home is Level 6
    # (Subsidized/Sub metered); $40,000 for one person is 256% of the $15,650
    # guideline, Level 7 (Over 200% FPL), which the manual (page 63) pays as the
    # nominal benefit ahead of the submetered level.
    md_meap_level: [1, 6, 1, 7, 7]
    # Matrix, Gas row: Level 1 $550, Level 6 $225, Level 7 $25. Ineligible: $0.
    md_meap: [550, 225, 0, 25, 0]

- name: Case 9, Maryland household and Virginia household in the same simulation.
  period: 2026
  input:
    state_code: [MD, VA]
    county: [BALTIMORE_COUNTY_MD, FAIRFAX_COUNTY_VA]
    age: [34, 34]
    employment_income: [20_000, 20_000]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_150, 1_150]
    # Neither household receives SNAP, TCA or SSI.
    snap: [0, 0]
    tanf: [0, 0]
    ssi: [0, 0]
  output:
    # Maryland: one person with $20,000 of wages is under the $31,300 annual limit for
    # size 1 (Income Guidelines) and at 128% of the $15,650 guideline ($31,300 / 2),
    # the matrix's Level 4 column (101-150% FPL). Matrix, Gas row, Level 4: $360.
    # Virginia: MEAP requires that the household resides in Maryland
    # (COMAR 07.03.21.03A(1)), so the same household pays $0 there.
    md_meap: [360, 0]

# COMAR 07.03.21.04D(2) counts rental-property income after operating expenses:
# https://regs.maryland.gov/us/md/exec/comar/07.03.21.04
- name: Case 10, farm rental income puts a gas-heating household over the income limit.
  period: 2026
  input:
    state_code: MD
    county: BALTIMORE_COUNTY_MD
    age: 45
    employment_income: 24_000
    farm_rent_income: 12_000
    ssi: 0
    tanf: 0
    snap: 0
    heating_type: NATURAL_GAS
    gas_expense: 1_200
  output:
    # No rental expenses: $24,000 wages + $12,000 farm rents = $36,000.
    md_meap_countable_income: 36_000
    # Income Guidelines: the one-person annual limit is $31,300.
    md_meap_income_limit: 31_300
    md_meap_categorically_eligible: false
    md_meap_eligible: false
    md_meap: 0

# FY2025 MEAP Benefit Matrix ("*Flat Rates"), Level 1 (0-25% FPL) and Level 6
# (Subsidized/Sub metered) by row:
#   Electric: $102, $102.   Gas: $301, $102.   Oil: $750, $102.
#   Propane: $644, $102.    Wood/Coal: $418, $102.
# Level 6 is $102 for every fuel in FY25; the FY25 plan (page 11) prints the $750
# maximum, the oil Level 1 cell.
- name: Case 11, FY25 matrix rows at Levels 1 and 6 in period 2025.
  period: 2025
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD, MD, MD, MD]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
    heating_type: [ELECTRICITY, NATURAL_GAS, FUEL_OIL, PROPANE, WOOD, ELECTRICITY, NATURAL_GAS, FUEL_OIL, PROPANE, WOOD]
    md_meap_eligible: [true, true, true, true, true, true, true, true, true, true]
    md_meap_level: [1, 1, 1, 1, 1, 6, 6, 6, 6, 6]
  output:
    md_meap: [102, 301, 750, 644, 418, 102, 102, 102, 102, 102]

- name: Case 12, FY25 Garrett County multiplier in period 2025.
  period: 2025
  input:
    state_code: [MD, MD, MD]
    county: [GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD]
    heating_type: [FUEL_OIL, NATURAL_GAS, PROPANE]
    md_meap_eligible: [true, true, true]
    md_meap_level: [1, 5, 7]
  output:
    # FY2025 plan item 2.5 (page 11) applies the same 1.1 multiplier. FY25 matrix
    # cells times 1.1: Oil, Level 1: $750 x 1.1 = $825. Gas, Level 5: $150 x 1.1 =
    # $165. Propane, Level 7: the $25 nominal grant, no multiplier.
    md_meap: [825, 165, 25]

# FY27 MEAP Benefit Matrix, statewide table (page 1), Level 1 and Level 6 by row:
#   Electric: $100, $100.   Gas: $700, $315.   Oil/Kerosene: $1,225, $550.
#   Propane: $1,325, $595.  Wood/Coal: $550, $245.
- name: Case 13, FY27 matrix rows at Levels 1 and 6 in period 2027.
  period: 2027
  input:
    state_code: [MD, MD, MD, MD, MD, MD, MD, MD, MD, MD]
    county: [BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD, BALTIMORE_COUNTY_MD]
    heating_type: [ELECTRICITY, NATURAL_GAS, FUEL_OIL, PROPANE, WOOD, ELECTRICITY, NATURAL_GAS, FUEL_OIL, PROPANE, WOOD]
