- name: Case 14, FY27 Garrett County table in period 2027.
  period: 2027
  input:
    state_code: [MD, MD, MD, MD, MD]
    county: [GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD, GARRETT_COUNTY_MD]
    heating_type: [ELECTRICITY, NATURAL_GAS, WOOD, FUEL_OIL, FUEL_OIL]
    md_meap_eligible: [true, true, true, true, true]
    md_meap_level: [1, 2, 5, 4, 7]
  output:
    # FY27 Garrett County table (page 1) against the statewide cells times 1.1:
    #   Electric, Level 1: $100 x 1.1 = $110, printed $110.
    #   Gas, Level 2: $665 x 1.1 = $731.50, rounded half up to $732, printed $732.
    #   Wood/Coal, Level 5: $355 x 1.1 = $390.50, rounded half up to $391, printed $391.
    #   Oil, Level 4: $980 x 1.1 = $1,078. The table prints $1,210 in this one cell
    #   (1.1 x the FY26 oil Level 1), which no other cell supports; the model keeps
    #   the plan's multiplier.
    #   Oil, Level 7: the $25 nominal grant, printed $25.
    md_meap: [110, 732, 391, 1_078, 25]
