- name: Case 1, eligible with income below maximum benefit.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 727
        md_tca_countable_income: 200
    households:
      household:
        state_code: MD
  output:
    # Benefit = $727 - $200 = $527
    md_tca: 527

- name: Case 2, eligible with zero income.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 575
        md_tca_countable_income: 0
    households:
      household:
        state_code: MD
  output:
    # Benefit = $575 - $0 = $575
    md_tca: 575

- name: Case 3, income exceeds maximum benefit.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 575
        md_tca_countable_income: 600
    households:
      household:
        state_code: MD
  output:
    # Benefit = max($575 - $600, 0) = $0
    md_tca: 0

- name: Case 4, ineligible household receives zero.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: false
        md_tca_maximum_benefit: 575
        md_tca_countable_income: 0
    households:
      household:
        state_code: MD
  output:
    md_tca: 0

- name: Case 5, a benefit under $10 is not issued.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 448
        md_tca_countable_income: 443.2
    households:
      household:
        state_code: MD
  output:
    # Net countable income $443.20 is rounded down to $443
    # (COMAR 07.03.03.13 E(1)).
    # Benefit = $448 - $443 = $5, under $10 (COMAR 07.03.03.13 E(2))
    md_tca: 0

- name: Case 6, a benefit of exactly $10 is issued.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 448
        md_tca_countable_income: 438
    households:
      household:
        state_code: MD
  output:
    # Benefit = $448 - $438 = $10
    md_tca: 10

- name: Case 7, net countable income is rounded down before it is deducted.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 448
        md_tca_countable_income: 438.5
    households:
      household:
        state_code: MD
  output:
    # Net countable income $438.50 is rounded down to $438
    # (COMAR 07.03.03.13 E(1)).
    # Benefit = $448 - $438 = $10, which is issued (E(2)). Without the
    # rounding, $448 - $438.50 = $9.50 would not be issued.
    md_tca: 10

- name: Case 8, a benefit above the minimum uses the rounded-down income.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
    spm_units:
      spm_unit:
        members: [person1]
        md_tca_eligible: true
        md_tca_maximum_benefit: 727
        md_tca_countable_income: 200.75
    households:
      household:
        state_code: MD
  output:
    # Net countable income $200.75 is rounded down to $200.
    # Benefit = $727 - $200 = $527
    md_tca: 527
