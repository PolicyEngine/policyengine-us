

- name: 2025 single filer who can be claimed as a dependent gets no personal exemptions
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: MD
  output:
    # Filing status 6: "You do not get an exemption for yourself" (2025
    # Resident Booklet, p.12); IRC 152(b)(1) leaves no dependents.
    md_total_personal_exemptions: 0

- name: 2025 single filer who cannot be claimed gets personal exemptions for the filer and the child
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: MD
  output:
    # 2 exemptions x $3,200 (AGI under $100,000).
    md_total_personal_exemptions: 6400

- name: 2025 joint return with one claimable spouse gets only the other spouse's exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 23
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MD
  output:
    # Separate Maryland returns: "Each spouse must claim their own personal
    # exemption" and the spouses split the federal return's dependents (none).
    md_total_personal_exemptions: 3200

- name: 2025 joint return with one claimable spouse gets only the other spouse's exemption (the claimable spouse is the spouse)
  period: 2025
  input:
