    md_itemized_deductions: 34_000

- name: Maryland keeps property taxes but scales them by the 2026 section 68 reduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: MD
    filing_status: JOINT
    adjusted_gross_income: 400_000
    total_itemized_taxable_income_deductions: 74_000
    itemized_deductions_less_salt: 34_000
    itemized_taxable_income_deductions_reduction: 3_700
    salt_deduction: 40_000
    capped_property_taxes: 15_000
  output:
    # Income-tax component: $74,000 - $34,000 - $15,000 = $25,000.
    # $74,000 - $3,700 - $25,000 + $3,700 * $25,000 / $74,000 = $46,550.
    # Equivalently $49,000 * (1 - $3,700 / $74,000) = $46,550.
    # Phaseout: ($400,000 - $200,000) * 7.5% = $15,000; $46,550 - $15,000.
    md_itemized_deductions: 31_550

