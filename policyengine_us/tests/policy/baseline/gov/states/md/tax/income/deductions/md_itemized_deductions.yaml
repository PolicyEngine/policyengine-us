- name: Maryland applies the 2026 federal section 68 reduction before its own phaseout.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: MD
    filing_status: SINGLE
    adjusted_gross_income: 1_000_000
    total_itemized_taxable_income_deductions: 100_000
    itemized_deductions_less_salt: 100_000
    itemized_taxable_income_deductions_reduction: 5_405.405405
    salt_deduction: 0
    capped_property_taxes: 0
  output:
    # Tax-General 10-218(b)(1): federal itemized deductions after section 68.
    # No income taxes to remove, so the whole reduction stays.
    # $100,000 - $5,405.41 = $94,594.59.
    # Maryland phaseout: ($1,000,000 - $200,000) * 7.5% = $60,000.
    # $94,594.59 - $60,000 = $34,594.59.
    md_itemized_deductions: 34_594.594595

- name: Maryland restores the income-tax share of the 2026 section 68 reduction.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: MD
    filing_status: SINGLE
    adjusted_gross_income: 1_000_000
    total_itemized_taxable_income_deductions: 110_000
    itemized_deductions_less_salt: 100_000
    itemized_taxable_income_deductions_reduction: 5_945.945946
    salt_deduction: 10_000
    capped_property_taxes: 0
  output:
    # Tax-General 10-218(b)(3): the $10,000 of SALT is all income tax.
    # Pro rata restoration: $5,945.95 * $10,000 / $110,000 = $540.54.
    # $110,000 - $5,945.95 - $10,000 + $540.54 = $94,594.59.
    # Less the $60,000 Maryland phaseout = $34,594.59.
    md_itemized_deductions: 34_594.594595

