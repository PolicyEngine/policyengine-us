

- name: 2025 single filer who can be claimed keeps their own exemption but no dependents
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: MD
  output:
    # Tax-General 10-211(a)(1) allows an exemption for "the taxpayer" with no
    # dependency condition (2018 ch. 575); IRC 152(b)(1) leaves no
    # dependents. The 2025 booklet's filing status 6 would give 0.
    md_personal_exemptions_count: 1
    md_total_personal_exemptions: 3_200

- name: 2025 single filer whose claimant meets the filing exception has exemptions for the filer and the child
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: MD
  output:
    # 10-211(a)(1) gives the filer an exemption, and the filing exception
    # keeps the dependent: 2 x $3,200.
    md_personal_exemptions_count: 2
    md_total_personal_exemptions: 6_400

- name: 2025 joint return with one claimable spouse counts both spouses but no dependents (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 23
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MD
  output:
    # Each spouse has their own exemption under 10-211(a)(1), on a joint or
    # a separate Maryland return; the federal return has no dependents.
    # 2 x $3,200.
    md_personal_exemptions_count: 2
    md_total_personal_exemptions: 6_400

