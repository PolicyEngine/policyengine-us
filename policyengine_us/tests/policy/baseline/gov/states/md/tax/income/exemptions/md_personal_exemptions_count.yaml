- name: 2022 single filer who can be claimed keeps their own exemption
  period: 2022
  input:
    people:
      person_a:
        age: 19
        employment_income: 4_000
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: MD
  output:
    # 10-211(a)(1) as amended by 2018 ch. 575 applies from tax year 2018:
    # 1 x $3,200 at AGI under $100,000.
    md_personal_exemptions_count: 1
    md_total_personal_exemptions: 3_200
