- name: 2025 joint return whose claimable spouse's claimant meets the filing exception counts both spouses and the child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 23
        employment_income: 1000
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 23
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: MD
  output:
    # The would-be claimant meets the filing exception (Publication 501,
    # Dependent Taxpayer Test), so the return keeps its dependents.
    # 2 own + 1 dependent = 3 x $3,200.
    md_personal_exemptions_count: 3
    md_total_personal_exemptions: 9_600

