  output:
    # TAXSIM: siitax 111.38 = staxbc 111.38.
    md_poverty_line_credit: 0
    md_income_tax: 111.38

- name: Wages below a self-employment loss give no credit (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
        self_employment_income: -10_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: siitax 401.13 = staxbc 401.13, low-income credit 0.00.
    # § 32(c)(2) nets the loss against wages (26 CFR 1.32-2(c)(2)). Form 502
    # Worksheet 18B line 2 would instead exclude the loss, giving 5,000 and a
    # $250 credit.
    md_poverty_line_credit: 0
    md_income_tax: 401.13

- name: A farm loss is netted against wages like other self-employment (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
        farm_operations_income: -10_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # § 1402(a) net earnings cover "any trade or business", and the 2024
    # EIC Worksheet B, Part 2 (filers not required to file Schedule SE),
    # line 2a takes "net farm profit or (loss)". TAXSIM
    # has one self-employment input, so this reuses the record above
    # (pwages 5,000, psemp -10,000, intrec 20,000): siitax 401.13,
    # low-income credit 0.00.
    md_poverty_line_credit: 0
    md_income_tax: 401.13

- name: A spouse's self-employment loss is netted against wages (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 4_000
        taxable_interest_income: 8_000
      spouse:
        is_tax_unit_spouse: true
        age: 40
        self_employment_income: -2_000
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    # TAXSIM: low-income credit 100.00 = 5% x (4,000 - 2,000);
    # siitax 168.13 = staxbc 268.13 - 100.00.
    eitc_earned_income: 2_000
    md_poverty_line_credit: 100
    md_income_tax: 168.13

- name: Self-employment earnings are net of the section 164(f) deduction (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        self_employment_income: 3_000
        taxable_interest_income: 11_700
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: low-income credit 139.40 = 5% x 2,788.06 (3,000 less half of
    # self-employment tax); siitax 241.05 = staxbc 380.46 - 139.40.
    md_poverty_line_credit: 139.40
    md_income_tax: 241.05

- name: Joint self-employment earnings are net of the section 164(f) deduction (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        self_employment_income: 4_000
        taxable_interest_income: 8_000
      spouse:
        is_tax_unit_spouse: true
        age: 40
        taxable_interest_income: 8_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    # TAXSIM: low-income credit 185.87 = 5% x 3,717.41;
    # siitax 163.83 = staxbc 349.70 - 185.87.
    md_poverty_line_credit: 185.87
    md_income_tax: 163.83

- name: Self-employment income above the poverty level can still qualify after the section 164(f) deduction (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        self_employment_income: 16_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # Earned income 14,869.64 (16,000 less half of self-employment tax) is
    # below the 15,060 one-person poverty level. TAXSIM: siitax 0.00 with a
    # nonzero low-income credit in both builds; staxbc 395.86. Form 502
    # Worksheet 18B would enter net profit of 16,000 on line 2 and deny the
    # credit.
    is_eligible_md_poverty_line_credit: true
    md_income_tax_before_credits: 395.86
    md_income_tax: 0

- name: Wages above the poverty level do not qualify (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 16_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: low-income credit 0.00.
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit: 0


# Rules for a filer who can be claimed as a dependent on another return.
# Expected values are hand-computed from Md. Code, Tax-General 10-709
# and 10-211, the 2025 Resident Booklet and the repository parameters.

- name: 2025 single filer who can be claimed as a dependent gets no poverty line credit
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        md_income_tax_before_credits: 200
        md_married_or_has_child_non_refundable_eitc: 0
        md_local_income_tax_before_credits: 100
        md_local_eitc: 0
    households:
      household:
        members: [person_a]
        state_code: MD
        county_str: BALTIMORE_CITY_MD
  output:
    # "You are not eligible for this credit if you checked filing status 6
    # (dependent taxpayer)" (2025 Resident Booklet, p.23).
    md_poverty_line_credit_earned_income: 0
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0
    md_local_poverty_line_credit: 0

- name: 2025 single filer who cannot be claimed gets the poverty line credit
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        md_income_tax_before_credits: 200
        md_married_or_has_child_non_refundable_eitc: 0
        md_local_income_tax_before_credits: 100
        md_local_eitc: 0
    households:
      household:
        members: [person_a]
        state_code: MD
        county_str: BALTIMORE_CITY_MD
  output:
    # Poverty level for 1 exemption $15,650; 5% x $1,000 = $50 <= $200 tax;
    # Baltimore City .032 x $1,000 = $32 <= $100 local tax.
    md_poverty_line_credit_earned_income: 1000
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 50
    md_local_poverty_line_credit: 32
    md_poverty_line_credit_income_level: 15650

- name: 2025 joint return with one claimable spouse gets the poverty line credit on the other spouse's earnings (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        md_income_tax_before_credits: 200
        md_married_or_has_child_non_refundable_eitc: 0
        md_local_income_tax_before_credits: 100
        md_local_eitc: 0
    households:
      household:
        members: [person_a, person_b]
        state_code: MD
        county_str: BALTIMORE_CITY_MD
  output:
    # The claimable spouse files a separate status 6 return; the other spouse's
    # separate return has 1 exemption (poverty level $15,650) and $500 earned:
    # 5% x $500 = $25; .032 x $500 = $16.
    md_poverty_line_credit_earned_income: 500
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 25
    md_local_poverty_line_credit: 16
    md_poverty_line_credit_income_level: 15650

- name: 2025 joint return with one claimable spouse gets the poverty line credit on the other spouse's earnings (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
