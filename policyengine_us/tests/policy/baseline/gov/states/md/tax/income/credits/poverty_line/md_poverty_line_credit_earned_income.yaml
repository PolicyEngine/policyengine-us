        md_married_or_has_child_non_refundable_eitc: 0
        md_local_income_tax_before_credits: 100
        md_local_eitc: 0
    households:
      household:
        members: [person_b, person_a]
        state_code: MD
        county_str: BALTIMORE_CITY_MD
  output:
    md_poverty_line_credit_earned_income: 500
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 25
    md_local_poverty_line_credit: 16
    md_poverty_line_credit_income_level: 15650

