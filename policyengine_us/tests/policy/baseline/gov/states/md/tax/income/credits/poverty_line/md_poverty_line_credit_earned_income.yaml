        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: siitax 189.75 = staxbc 189.75.
    md_poverty_line_credit: 0
    md_income_tax: 189.75

- name: Self-employment loss gives no credit (2025)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        self_employment_income: -10_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
