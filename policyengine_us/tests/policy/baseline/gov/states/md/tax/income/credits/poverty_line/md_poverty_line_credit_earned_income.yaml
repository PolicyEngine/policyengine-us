# Earned income for the Maryland poverty level credit is § 32(c)(2) earned
# income (Md. Code, Tax-General § 10-709(a)(3)(ii), (c)(2), (d)(2)).
# Expected values are NBER TAXSIM `taxsimtest` output, identical in builds
# cdate-20260521 and cd2026090910 (Maryland `siitax`, which is state-only).
# The "General/Food/Low Inc crd" line of TAXSIM's idtl=5 output is its
# poverty level credit.

- name: Self-employment loss gives no credit instead of a negative one (2024)
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        self_employment_income: -10_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: siitax 185.00 = staxbc 185.00, low-income credit 0.00.
    # Eligible: Worksheet 18B line 4 is 10,000, below line 3 (15,060).
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit: 0
    md_income_tax: 185

- name: Self-employment loss gives no credit (2021)
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        self_employment_income: -10_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person]
    spm_units:
      spm_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: MD
  output:
    # TAXSIM: siitax 196.88 = staxbc 196.88, low-income credit 0.00. For
    # 2021 TAXSIM's credit reaches siitax only through a refundable path, so
    # the credit line is the check.
    md_poverty_line_credit: 0
    md_income_tax: 196.88

