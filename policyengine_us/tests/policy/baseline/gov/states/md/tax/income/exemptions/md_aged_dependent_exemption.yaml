- name: 2025 joint return with no claimable spouse gets the aged dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      parent:
        age: 66
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, parent]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, parent]
        state_code: MD
  output:
    # One dependent aged 65 or older: $3,200.
    md_aged_dependent_exemption: 3200


- name: 2025 aged dependent exemption is limited like the personal exemption at $110,000 of single AGI
  period: 2025
  input:
    people:
      person_a:
        age: 50
        employment_income: 110000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      parent:
        age: 70
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, parent]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, parent]
        state_code: MD
  output:
    # Single AGI over $100,000 but not over $125,000: each exemption is $1,600 (10-211(c)(1)(i)).
    # The chart's "reduction applies to the additional dependency exemptions as well".
    md_aged_dependent_exemption: 1600

