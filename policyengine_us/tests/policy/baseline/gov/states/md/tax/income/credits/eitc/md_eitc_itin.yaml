    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: ITIN family that does not take up the EITC is treated like its SSN twin
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
      child:
        age: 5
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
        takes_up_eitc: false
    households:
      household:
        members: [parent, child]
        state_code: MD
  output:
    # The with-child path follows the federal credit's take-up, as for an SSN
    # family, whose eitc is then zero.
    md_federal_eitc_without_ssn_requirement: 0
    md_eitc: 0

