- name: Local EITC for a childless ITIN filer in Baltimore City
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 30
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [person]
        md_local_income_tax_before_credits: 2_000
    households:
      household:
        members: [person]
        state_code: MD
        county_str: BALTIMORE_CITY_MD
  output:
    eitc: 0
    # 10-704(d)(1)(i): $649 x 10 x 3.2% = $207.68, below the local tax.
    md_local_eitc: 207.68

