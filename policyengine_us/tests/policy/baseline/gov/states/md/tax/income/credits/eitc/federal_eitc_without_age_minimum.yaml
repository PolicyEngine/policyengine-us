- name: Childless young person qualifies for MD modified EITC but not federal EITC.
  period: 2022
  input:
    age: 19
    employment_income: 5_000
    md_qualifies_for_unmarried_childless_eitc: true
    state_code: MD
  output:
    eitc: 0
    federal_eitc_without_age_minimum: 382.50

- name: Childless filer aged 65 fails the federal maximum age, which Maryland keeps (taxsim 1260)
  period: 2025
  input:
    age: 65
    employment_income: 7_542.86
    social_security_retirement: 12_360.58
    state_code: MD
  output:
    # Md. Code Tax-Gen. § 10-704(c)(3)(i) disregards only the minimum age in
    # IRC § 32(c)(1)(A)(ii)(II) ("attained age 25 but not attained age 65").
    # TaxAct's 2025 Form 502 EIC worksheets show $0.
    eitc: 0
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Childless filer aged 64 is within the federal age limits
  period: 2025
  input:
    age: 64
    employment_income: 7_000
    state_code: MD
  output:
    # 7.65% x $7,000 = $535.50, below the $649 maximum (Rev. Proc. 2024-40).
    eitc: 535.50
    federal_eitc_without_age_minimum: 535.50

- name: Childless filer aged 70 in 2021, when federal law had no maximum age
  period: 2021
  input:
    age: 70
    employment_income: 5_000
    state_code: MD
  output:
    # IRC § 32(n)(2) removed the maximum age for 2021: 15.3% x $5,000 = $765.
    eitc: 765
    federal_eitc_without_age_minimum: 765

- name: Married childless couple both aged 65 or older gets no Maryland EITC
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 5_000
      spouse:
        age: 70
        employment_income: 5_000
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
    families:
      family:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    eitc: 0
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Married childless couple with one spouse under 65 keeps the Maryland EITC
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 5_000
      spouse:
        age: 60
        employment_income: 5_000
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
    families:
      family:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    # IRC § 32(c)(1)(A)(ii)(II) is met if either spouse is 25-64. 7.65% x
    # $10,000 exceeds the $649 maximum; AGI is below the $17,730 joint
    # phase-out start (Rev. Proc. 2024-40).
    eitc: 649
    federal_eitc_without_age_minimum: 649

# 26 U.S.C. 32(c)(1)(C): no EITC for an individual who claims the benefits of
# section 911. Md. Code Tax-Gen. 10-704(c)(3)(i) waives only the minimum age
# and section 32(m), and the 2025 Resident Booklet (Instruction 18) requires a
# filer "otherwise eligible for the federal credit". Maryland computes every
# childless filer's credit from this pro forma, not from the federal EITC.
- name: Section 911 claimant below the federal minimum age gets no pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 21
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 30_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: The same filer without a section 911 exclusion gets the pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 21
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 0
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # 7.65% x $5,000 = $382.50, below the $649 maximum and the phase-out.
    # Maryland allows 100% of it to a childless filer, refundable.
    federal_eitc_without_age_minimum: 382.5
    md_eitc: 382.5

- name: Section 911 claimant in the federal age range gets no pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 30_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # The federal EITC is already $0 (32(c)(1)(C)); before this rule the
    # pro forma still paid Maryland's childless credit.
    eitc: 0
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Married section 911 claimants without children get no pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 2_500
      person2:
        age: 30
        employment_income: 2_500
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        foreign_earned_income_exclusion: 30_000
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: A filer who claims only the section 911 housing exclusion gets no pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 21
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_housing_exclusion: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # Section 911(a)(2) is a separate election; the filer still claims the
    # benefits of section 911.
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

# IRC 32(i): no credit when disqualified income exceeds $11,950 (2025, Rev.
# Proc. 2024-40). Md. Code Tax-Gen. 10-704(c)(3)(i) waives only the minimum
# age and section 32(m), so the investment income limit still applies.
- name: Investment income above the federal limit bars the pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 21
        employment_income: 5_000
        taxable_interest_income: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Investment income below the federal limit leaves the pro forma federal EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 21
        employment_income: 5_000
        taxable_interest_income: 11_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    # AGI $16,000: $649 - 7.65% x ($16,000 - $10,620) = $237.43, below the
    # phased-in $382.50.
    federal_eitc_without_age_minimum: 237.43
    # Maryland's unmarried childless credit, 100% of it, non-refundable.
    md_eitc: 237.43
