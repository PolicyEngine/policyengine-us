- name: 2025 joint return with no claimable spouse gets the pro forma federal EITC despite the minimum age
  period: 2025
  input:
    people:
      person_a:
        age: 21
        employment_income: 500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 21
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: MD
  output:
    # $76.50; married refundable match .45 x $76.50 - $0 tax = $34.425.
    federal_eitc_without_age_minimum: 76.5
    md_married_or_has_child_refundable_eitc: 34.425
