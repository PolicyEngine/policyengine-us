- name: Childless young person qualifies for MD modified EITC but not federal EITC.
  period: 2022
  input:
    age: 19
    employment_income: 5_000
    md_qualifies_for_unmarried_childless_eitc: true
    state_code: MD
  output:
    eitc: 0
    federal_eitc_without_age_minimum: 382.50

- name: Childless filer aged 65 fails the federal maximum age, which Maryland keeps (taxsim 1260)
  period: 2025
  input:
    age: 65
    employment_income: 7_542.86
    social_security_retirement: 12_360.58
    state_code: MD
  output:
    # Md. Code Tax-Gen. § 10-704(c)(3)(i) disregards only the minimum age in
    # IRC § 32(c)(1)(A)(ii)(II) ("attained age 25 but not attained age 65").
    # TaxAct's 2025 Form 502 EIC worksheets show $0.
    eitc: 0
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Childless filer aged 64 is within the federal age limits
  period: 2025
  input:
    age: 64
    employment_income: 7_000
    state_code: MD
  output:
    # 7.65% x $7,000 = $535.50, below the $649 maximum (Rev. Proc. 2024-40).
    eitc: 535.50
    federal_eitc_without_age_minimum: 535.50

- name: Childless filer aged 70 in 2021, when federal law had no maximum age
  period: 2021
  input:
    age: 70
    employment_income: 5_000
    state_code: MD
  output:
    # IRC § 32(n)(2) removed the maximum age for 2021: 15.3% x $5,000 = $765.
    eitc: 765
    federal_eitc_without_age_minimum: 765

- name: Married childless couple both aged 65 or older gets no Maryland EITC
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 5_000
      spouse:
        age: 70
        employment_income: 5_000
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
    families:
      family:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    eitc: 0
    federal_eitc_without_age_minimum: 0
    md_eitc: 0

- name: Married childless couple with one spouse under 65 keeps the Maryland EITC
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 5_000
      spouse:
        age: 60
        employment_income: 5_000
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
    families:
      family:
        members: [head, spouse]
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MD
  output:
    # IRC § 32(c)(1)(A)(ii)(II) is met if either spouse is 25-64. 7.65% x
    # $10,000 exceeds the $649 maximum; AGI is below the $17,730 joint
    # phase-out start (Rev. Proc. 2024-40).
    eitc: 649
    federal_eitc_without_age_minimum: 649


- name: 2025 single filer who can be claimed as a dependent gets no pro forma federal EITC
  period: 2025
  input:
    people:
      person_a:
        age: 21
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: MD
  output:
    # Section 10-704 waives only "the minimum age requirement"; the filer must
    # be "otherwise eligible" (2025 Resident Booklet, p.22), and IRC
    # 32(c)(1)(A)(ii)(III) bars a childless filer who can be claimed.
    federal_eitc_without_age_minimum: 0
    md_unmarried_childless_refundable_eitc: 0

- name: 2025 single filer who cannot be claimed gets the pro forma federal EITC despite the minimum age
  period: 2025
  input:
    people:
      person_a:
        age: 21
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: MD
  output:
    # Age 21 fails the federal minimum age, which Maryland waives:
    # $1,000 x .0765 = $76.50; unmarried childless match 100%, no tax.
    federal_eitc_without_age_minimum: 76.5
    md_unmarried_childless_refundable_eitc: 76.5

- name: 2025 joint return with one claimable spouse gets no pro forma federal EITC (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 21
        employment_income: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 21
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: MD
  output:
    # Either spouse being claimable bars the childless federal EITC.
    federal_eitc_without_age_minimum: 0
    md_married_or_has_child_refundable_eitc: 0

