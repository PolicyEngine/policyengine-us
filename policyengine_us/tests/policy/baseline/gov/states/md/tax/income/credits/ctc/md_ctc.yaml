- name: 2025 single filer who can be claimed as a dependent gets no child tax credit
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: MD
  output:
    # Section 10-751(a)(2)(i): a qualified child is "a dependent for purposes
    # of section 152"; IRC 152(b)(1) leaves the return none.
    md_ctc_eligible: false
    md_ctc: 0

- name: 2025 single filer who cannot be claimed gets the child tax credit
