# Tax-General 10-709(a)(3)(iii): the exclusion takes an actual claim as an
# exemption on another Maryland return under 10-211; claimability alone does
# not exclude the filer. These three cases supply a poverty level of 15,650 and
# one exemption to isolate the (a)(3)(iii) test.
- name: Claimable but unclaimed Maryland filer passes the dependency exclusion
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10,000 is below the supplied 15,650 level; the 0 EITC is below the 600
    # tax; no actual Maryland claim. min(600, 0.05 x 10,000) = 500.
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

- name: An actual Maryland exemption claim excludes the filer
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10-709(a)(3)(iii) fails, so no credit although the supplied level and
    # exemption meet the other conditions.
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: A federal claim by a claimant who files no Maryland return does not exclude the filer
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # The Maryland claim defaults to the federal claim; this input overrides
    # it, so only (a)(3)(iii) is in play and nobody claims the filer on a
    # Maryland return: min(600, 0.05 x 10,000) = 500.
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

# Tax-General 10-709(a)(2): the applicable poverty income level is the amount
# "that corresponds to the number of exemptions which the individual is allowed
# and claims under § 10-211(b)(1)". Under 10-211(a)(1) every filer has an
# exemption, whether or not someone else can claim them, so a claimable single
# filer's level is the one-person guideline. These cases compute the level
# rather than supplying it.
- name: 2025 claimable but unclaimed single filer at 12,000 gets the one-exemption level and the credit
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 12_000
        md_total_additions: 0
        eitc_earned_income: 12_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # The filer's own exemption: 1, so the 2025 contiguous guideline for one
    # person, 15,650. 12,000 <= 15,650 for AGI and earnings; 0 EITC < 600
    # tax; no Maryland claim. min(600, 0.05 x 12,000) = 600.
    md_personal_exemptions_count: 1
    md_poverty_line_credit_income_level: 15_650
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 600

