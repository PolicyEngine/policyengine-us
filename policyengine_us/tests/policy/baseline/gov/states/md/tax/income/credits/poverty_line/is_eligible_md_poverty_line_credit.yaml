- name: 2025 claimable single filer claimed on another federal return is by default claimed in Maryland and gets no credit
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # No Maryland claim input, so it follows the federal claim: a Maryland
    # claimant takes an exemption for each IRC 152 dependent (10-211(a)(3)).
    # The level (15,650) and income tests pass, but (a)(3)(iii) fails.
    md_personal_exemptions_count: 1
    md_poverty_line_credit_income_level: 15_650
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: 2025 claimable filer whose claimant meets the filing exception keeps both exemptions, the two-exemption level and the credit
  period: 2025
  input:
    people:
      filer:
        age: 23
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        md_claimed_as_exemption_on_another_return: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer, child]
        state_code: MD
  output:
    # The filer's own exemption plus the child, whom the filing exception
    # keeps: 2. 2025 contiguous guideline for 2 = 15,650 + 5,500 = 21,150.
    # 10,000 <= 21,150 for AGI and earnings; 0 EITC < 600 tax; no Maryland
    # claim. min(600, 0.05 x 10,000) = 500.
    md_personal_exemptions_count: 2
    md_poverty_line_credit_income_level: 21_150
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

- name: 2025 claimable filer with the filing exception is still excluded by an actual Maryland claim
  period: 2025
  input:
    people:
      filer:
        age: 23
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
