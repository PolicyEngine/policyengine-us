- name: 2025 joint return with a claimable head uses the two-exemption level and qualifies at 18,000
  period: 2025
  input:
    people:
      a:
        age: 30
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
      b:
        age: 30
        is_tax_unit_spouse: true
        employment_income: 18_000
    tax_units:
      tax_unit:
        members: [a, b]
        filing_status: JOINT
        md_income_tax_before_credits: 1_000
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [a, b]
        state_code: MD
  output:
    # Tax-General 10-709(a)(2) with 10-211(a)(1): each spouse has their own
    # exemption, so the two-person level of 21,150 applies. Income of 18,000
    # is below it; 0 EITC < 1,000 tax. min(1,000, 0.05 x 18,000) = 900.
    md_personal_exemptions_count: 2
    md_poverty_line_credit_income_level: 21_150
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 900

