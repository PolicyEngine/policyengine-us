- name: Ineligible because non-refundable EITC >= tax before credits
  period: 2021
  input:
    adjusted_gross_income: 90
    md_total_additions: 10
    tax_unit_fpg: 100
    eitc_earned_income: 100
    md_married_or_has_child_non_refundable_eitc: 10
    md_income_tax_before_credits: 10
  output:
    is_eligible_md_poverty_line_credit: false

# Tax-General 10-709(a)(3)(iii): the exclusion takes an actual claim as an
# exemption on another Maryland return under 10-211; claimability alone does
# not exclude the filer. These three cases supply a poverty level of 15,650 and
# one allowed exemption to isolate the (a)(3)(iii) test. Neither is this
# filer's own: alone, a claimable single filer has no allowed exemption and so
# no level (see the cases below).
- name: Claimable but unclaimed Maryland filer passes the dependency exclusion
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10,000 is below the supplied 15,650 level; the 0 EITC is below the 600
    # tax; no actual Maryland claim. min(600, 0.05 x 10,000) = 500.
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

- name: An actual Maryland exemption claim excludes the filer
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10-709(a)(3)(iii) fails, so no credit although the supplied level and
    # exemption meet the other conditions.
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: A federal claim alone does not establish a Maryland exemption claim
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_personal_exemptions_count: 1
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # With the supplied level and exemption, only (a)(3)(iii) is in play, and
    # a federal claim is not a Maryland one: min(600, 0.05 x 10,000) = 500.
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

# Tax-General 10-709(a)(2): the applicable poverty income level is the amount
# "that corresponds to the number of exemptions which the individual is allowed
# and claims under § 10-211(b)(1)". HHS lists amounts from one person up, so a
# filer with no allowed exemption has no level and fails (a)(3)(i) and (ii).
# These cases compute the level rather than supplying it.
- name: 2025 claimable but unclaimed single filer at 12,000 has no poverty level and no credit
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 12_000
        md_total_additions: 0
        eitc_earned_income: 12_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # Filing status 6: no own exemption and no dependents, so 0 exemptions,
    # no level, and no credit.
    md_personal_exemptions_count: 0
    md_poverty_line_credit_income_level: 0
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: 2025 claimable but unclaimed single filer at 10,000 has no poverty level and no credit
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # A zero-person guideline would be 15,650 - 5,500 = 10,150, and 10,000
    # would pass it; with no allowed exemption there is no level at all.
    md_personal_exemptions_count: 0
    md_poverty_line_credit_income_level: 0
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: 2025 claimable single filer with no income still fails without an allowed exemption
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 0
        md_total_additions: 0
        eitc_earned_income: 0
        md_income_tax_before_credits: 100
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # Zero income meets a zero level (0 <= 0), and the supplied 100 of tax
    # keeps (a)(3)(iv) satisfied, so only the allowed-exemption requirement
    # removes eligibility.
    md_personal_exemptions_count: 0
    md_poverty_line_credit_income_level: 0
    is_eligible_md_poverty_line_credit: false

- name: 2025 claimable filer whose claimant meets the filing exception keeps the child's exemption, a poverty level and the credit
  period: 2025
  input:
    people:
      filer:
        age: 23
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        md_claimed_as_exemption_on_another_return: false
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer, child]
        state_code: MD
  output:
    # No own exemption (filing status 6), but the filing exception keeps the
    # child: 0 + 1 = 1 exemption. 2025 contiguous guideline for 1 = 15,650.
    # 10,000 <= 15,650 for AGI and earnings; 0 EITC < 600 tax; no Maryland
    # claim. min(600, 0.05 x 10,000) = 500.
    md_personal_exemptions_count: 1
    md_poverty_line_credit_income_level: 15_650
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

- name: 2025 claimable filer with the filing exception is still excluded by an actual Maryland claim
  period: 2025
  input:
    people:
      filer:
        age: 23
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        md_claimed_as_exemption_on_another_return: true
      child:
        age: 4
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer, child]
        state_code: MD
  output:
    # Same count (1) and level (15,650); (a)(3)(iii) alone removes the credit.
    md_personal_exemptions_count: 1
    md_poverty_line_credit_income_level: 15_650
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0
