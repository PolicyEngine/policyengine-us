- name: "Meets all criteria: (AGI + additions) <= FPG, earnings <= FPG, and non-refundable EITC < tax before credits"
  period: 2021
  input:
    adjusted_gross_income: 90
    md_total_additions: 10
    tax_unit_fpg: 100
    eitc_earned_income: 100
    md_married_or_has_child_non_refundable_eitc: 9
    md_income_tax_before_credits: 10
    state_code: MD
  output:
    is_eligible_md_poverty_line_credit: true

- name: Ineligible because (AGI + additions) > FPG
  period: 2021
  input:
    adjusted_gross_income: 91
    md_total_additions: 10
    tax_unit_fpg: 100
    eitc_earned_income: 100
    md_married_or_has_child_non_refundable_eitc: 9
    md_income_tax_before_credits: 10
    state_code: MD
  output:
    is_eligible_md_poverty_line_credit: false


- name: Ineligible because earnings > FPG
  period: 2021
  input:
    adjusted_gross_income: 90
    md_total_additions: 10
    tax_unit_fpg: 100
    eitc_earned_income: 101
    md_married_or_has_child_non_refundable_eitc: 9
    md_income_tax_before_credits: 10
    state_code: MD
  output:
    is_eligible_md_poverty_line_credit: false

- name: Ineligible because non-refundable EITC >= tax before credits
  period: 2021
  input:
    adjusted_gross_income: 90
    md_total_additions: 10
    tax_unit_fpg: 100
    eitc_earned_income: 100
    md_married_or_has_child_non_refundable_eitc: 10
    md_income_tax_before_credits: 10
  output:
    is_eligible_md_poverty_line_credit: false

# Tax-General 10-709(a)(3)(iii): the exclusion takes an actual claim as an
# exemption on another Maryland return under 10-211; claimability alone does
# not exclude the filer. The applicable poverty level is supplied to isolate
# this gate from the separate exemption-count rule.
- name: Claimable but unclaimed Maryland filer passes the dependency exclusion
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10,000 is below 15,650; the 0 EITC is below the 600 tax; no actual
    # Maryland claim. min(600, 0.05 x 10,000) = 500.
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500

- name: An actual Maryland exemption claim excludes the filer
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    # 10-709(a)(3)(iii) fails, so no credit despite the other conditions.
    is_eligible_md_poverty_line_credit: false
    md_poverty_line_credit_potential: 0

- name: A federal claim alone does not establish a Maryland exemption claim
  period: 2025
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        md_claimed_as_exemption_on_another_return: false
    tax_units:
      tax_unit:
        members: [filer]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
        md_total_additions: 0
        eitc_earned_income: 10_000
        md_poverty_line_credit_income_level: 15_650
        md_income_tax_before_credits: 600
        md_married_or_has_child_non_refundable_eitc: 0
    households:
      household:
        members: [filer]
        state_code: MD
  output:
    is_eligible_md_poverty_line_credit: true
    md_poverty_line_credit_potential: 500
