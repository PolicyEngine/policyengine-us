# Unit tests for Maryland Premium Assistance eligibility.
# Eligible when: program in effect (PY2026-2027), household in MD, at least one
# tax-unit member is federal-APTC-eligible, and ACA MAGI <= 400% FPL ("No state
# subsidy above 400% FPL"; PY2027 "400% FPL or below"), on the exact ratio of
# ACA MAGI to aca_fpg (the prior-year guideline for the section 36B tax family),
# not the truncated aca_magi_fraction. is_aca_ptc_eligible is provided directly
# so the gate logic is tested in isolation from the premium-data lookup.
# Supplied-income cases pin aca_fpg to $10,000; income-derived cases use the
# actual 2025 one-person guideline, $15,650, for 2026 and the 2026 guideline,
# $15,960, for 2027 (2027 deck slide 12: 400% FPL for 1 person = $63,840).

- name: Case 1, MD APTC-eligible unit at 250% FPL in 2026 is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

- name: Case 2, MD unit above 400% FPL is ineligible (income cap).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 40_100
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: false

- name: Case 3, exactly 400% FPL is eligible (boundary, at limit not above).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 40_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

- name: Case 4, no federal-APTC-eligible member makes the unit ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: false

- name: Case 5, non-Maryland state is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: VA
  output:
    md_premium_assistance_eligible: false

- name: Case 6, program not in effect in 2025 (before PY2026 start).
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: false

- name: Case 7, program sunset in 2028 (after PY2027 end).
  period: 2028
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: false

- name: Case 8, one eligible member in a multi-person unit qualifies the unit.
  period: 2026
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: false
      person2:
        age: 43
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi: 30_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

# ---- Edge cases ----

- name: Case 9, zero income (0% FPL) APTC-eligible MD unit is eligible.
  # Lower bound of the income test: 0 <= 4.00 FPL limit holds.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 0
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

- name: Case 10, just below 400% FPL (3.99) is eligible (below the income cap).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 39_900
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

- name: Case 11, direct 2027 case (second plan year) is eligible.
  # The program is authorized for plan years 2026-2027; this confirms eligibility
  # holds in 2027 directly (distinct from the 2028 sunset), not only via 2026.
  period: 2027
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 25_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true

# ---- A12(c): raw-income 400%-FPL boundary eligibility pair ----
# These derive aca_magi_fraction from employment_income through the federal FPL
# chain instead of forcing it. EXPECTED TO CHANGE when the upstream federal
# 400%/truncation fix lands (aca ptc_income_eligibility 4.00 threshold is
# lower-bound-inclusive and zeroes [400%,401%) FPL); the masked boundary here
# pairs with that upstream issue.

- name: Case 12, raw income just below the 400% FPL cap is eligible.
  # employment_income set so aca_magi_fraction is DERIVED; a single filer near but
  # under 4x the 2026 FPL should be eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: true  # derived aca_magi_fraction < 4.00 cap

- name: Case 13, raw income just above the 400% FPL cap is ineligible.
  # employment_income set above 4x the 2026 FPL so the DERIVED aca_magi_fraction
  # exceeds the cap; the unit should be ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 70_000
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_eligible: false  # derived aca_magi_fraction > 4.00 cap

- name: Case 14, $62,599 (399.994% of the 2025 guideline) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 62_599
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    aca_magi_fraction: 3.99
    md_premium_assistance_eligible: true

- name: Case 15, $62,600 (exactly 400%) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 62_600
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    aca_magi_fraction: 4.00
    md_premium_assistance_eligible: true

- name: Case 16, $62,600.47 (400.003%) is ineligible though truncated to 4.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 62_600.47
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    aca_magi_fraction: 4.00
    md_premium_assistance_eligible: false

- name: Case 17, $62,755.56 (400.994%) is ineligible though truncated to 4.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 62_755.56
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    aca_magi_fraction: 4.00
    md_premium_assistance_eligible: false

- name: Case 18, with the federal credit extended above 400%, 400.003% is still ineligible.
  # A reform that keeps the premium tax credit above 400% FPL makes
  # is_aca_ptc_eligible true at $62,600.47, so the Maryland ceiling alone decides.
  period: 2026
  input:
    gov.aca.ptc_income_eligibility[2].amount: true
    people:
      person1:
        age: 40
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_basic_health_program_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 62_600.47
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    is_aca_ptc_eligible: [true]
    md_premium_assistance_eligible: false

- name: Case 19, a joint return with one claimable spouse at 400% of the one-person guideline is eligible.
  # The claimable spouse is outside the section 36B tax family, so aca_fpg is
  # the one-person guideline: 62_600 / 15_650 = 4.00. Maryland's rules don't
  # define the family counted; this pins the model's use of aca_fpg.
  period: 2026
  input:
    people:
      person_a:
        age: 30
        is_aca_ptc_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_aca_ptc_eligible: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 62_600
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: MD
  output:
    aca_tax_family_size: 1
    aca_fpg: 15_650
    md_premium_assistance_eligible: true

- name: Case 20, the same return above 400% of the one-person guideline is ineligible.
  # 70_000 / 15_650 = 4.47 > 4.0. Against the two-person guideline of the whole
  # tax unit ($21,150) the ratio would be 3.31.
  period: 2026
  input:
    people:
      person_a:
        age: 30
        is_aca_ptc_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_aca_ptc_eligible: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 70_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: MD
  output:
    aca_tax_family_size: 1
    aca_fpg: 15_650
    md_premium_assistance_eligible: false

