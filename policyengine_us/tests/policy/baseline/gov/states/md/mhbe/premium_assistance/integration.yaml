  # aca_magi 128_600; md target 9.23%; federal 9.96%. COMAR .04B:
  # max(0, (22_000 - 9_191) - 0.0923 * 128_600) = 12_809 - 11_869.78 = 939.22/yr.
  period: 2026
  absolute_error_margin: 0.01
  input:
