        is_aca_ptc_eligible: true
      person4:
        age: 13
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
        aca_magi: 128_600
        aca_magi_fraction: 4.00
        aca_required_contribution_percentage: 0.0996
        slcsp: 22_000
        aca_ptc: 9_191  # 22_000 - 0.0996*128_600
        tax_unit_is_filer: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MD
