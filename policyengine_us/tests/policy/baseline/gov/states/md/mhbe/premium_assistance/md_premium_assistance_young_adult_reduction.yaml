        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_young_adult_reduction: 0.02

- name: Case 6, age 35 reduced by 1.5 points.
  period: 2026
  input:
    people:
      person1:
        age: 35
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MD
  output:
    md_premium_assistance_young_adult_reduction: 0.015

- name: Case 7, age 36 reduced by 1.0 point.
  period: 2026
  input:
    people:
      person1:
        age: 36
        is_aca_ptc_eligible: true
    tax_units:
