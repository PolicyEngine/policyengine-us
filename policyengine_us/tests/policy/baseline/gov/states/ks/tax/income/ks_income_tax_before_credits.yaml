- name: KS income tax before credits unit test 1
  period: 2021
  input:
    filing_status: SINGLE
    ks_taxable_income: 100_000
    ks_agi: 100_000
    state_code: KS
  output:  # from filling out 2021 Tax Computation Worksheet
    ks_income_tax_before_credits: 0.057 * 100_000 - 457.50

- name: KS income tax before credits unit test 2
  period: 2022
  input:
    filing_status: JOINT
    ks_taxable_income: 100_000
    ks_agi: 100_000
    state_code: KS
  output:  # from filling out 2022 Tax Computation Worksheet
    ks_income_tax_before_credits: 0.057 * 100_000 - 915

- name: KS income tax before credits unit test 3
  period: 2021
  input:
    filing_status: JOINT
    ks_taxable_income: 4_900
    ks_agi: 4_900
    state_code: KS
  output:  # from filling out 2021 Tax Computation Worksheet
    ks_income_tax_before_credits: 0

- name: 492-KS.yaml
  absolute_error_margin: 2
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 25051
        ssi: 0
        wic: 0
        deductible_mortgage_interest: 0
      person2:
        age: 40
        employment_income: 25051
        ssi: 0
        wic: 0
        deductible_mortgage_interest: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_childcare_expenses: 0
        premium_tax_credit: 0
        local_income_tax: 0
        state_sales_tax: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap: 0
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_fips: 20
  output:
    ks_income_tax: 1_223

- name: Zero-tax threshold applies to taxable income, not AGI (issue 9172, taxsim issue 1115)
  period: 2021
  input:
    filing_status: JOINT
    ks_taxable_income: 4_440
    ks_agi: 18_340
    state_code: KS
  output:
    # 2021 tax table, married filing joint column: 0 through $5,000 of
    # line 7 taxable income.
    ks_income_tax_before_credits: 0

- name: Tax resumes above the joint taxable-income threshold
  period: 2021
  input:
    filing_status: JOINT
    ks_taxable_income: 5_100
    ks_agi: 18_340
    state_code: KS
  output:
    ks_income_tax_before_credits: 0.031 * 5_100

- name: Single filer threshold is 2,500 of taxable income
  period: 2021
  input:
    filing_status: SINGLE
    ks_taxable_income: 2_500
    ks_agi: 20_000
    state_code: KS
  output:
    ks_income_tax_before_credits: 0

- name: 2024 AGI-based minimum filing requirement still zeroes the tax
  period: 2024
  input:
    filing_status: JOINT
    ks_taxable_income: 3_000
    ks_agi: 25_000
    state_code: KS
  output:
    ks_income_tax_before_credits: 0
