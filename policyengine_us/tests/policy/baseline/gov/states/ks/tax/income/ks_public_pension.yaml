- name: Kansas public pension is subtracted from federal AGI
  period: 2024
  input:
    people:
      person1:
        taxable_public_pension_income: 15_000
        taxable_private_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_agi_subtractions: 15_000
    ks_agi: 10_000
    ks_income_tax: 0

- name: Kansas private pension alone has same tax liability as private pension with exempt public pension
  period: 2024
  input:
    people:
      person1:
        taxable_private_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_agi_subtractions: 0
    ks_agi: 10_000
    ks_income_tax: 0

- name: Kansas private pension equal to total retirement income is not subtracted and results in higher tax
  period: 2024
  input:
    people:
      person1:
        taxable_private_pension_income: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_agi_subtractions: 0
    ks_agi: 25_000
    ks_income_tax: 636.22
