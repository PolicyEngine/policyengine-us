- name: Unmarried with no dependents
  period: 2021
  input:
    filing_status: SINGLE
    tax_unit_dependents: 0
    state_code: KS
  output:
    ks_count_exemptions: 1

- name: Married with two dependents
  period: 2022
  input:
    people:
      head:
        age: 40
      spouse:
        age: 40
      child1:
        age: 5
        is_tax_unit_dependent: true
      child2:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: KS
  output:
    # 2 unclaimable filers + 2 dependents.
    ks_count_exemptions: 4

- name: Unmarried with one dependent
  period: 2022
  input:
    people:
      head:
        age: 40
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: KS
  output:
    # K.S.A. 79-32,121(a): 1 unclaimable filer + 1 dependent. The extra
    # head-of-household allowance applied only in tax year 1998.
    ks_count_exemptions: 2
