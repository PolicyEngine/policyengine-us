- name: KS itemized deductions unit test 1
  period: 2021
  input:
    real_estate_taxes: 8
    salt_deduction: 10
    interest_deduction: 9
    medical_expense_deduction: 2
    state_code: KS
  output:
    ks_itemized_deductions: 8 + 9 + 2

- name: KS itemized deductions unit test 2
  period: 2022
  input:
    real_estate_taxes: 12
    salt_deduction: 10
    interest_deduction: 9
    medical_expense_deduction: 2
    state_code: KS
  output:
    ks_itemized_deductions: 12 + 9 + 2

- name: Kansas taxes gambling winnings but its itemized deductions leave out wagering losses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    employment_income: 40_000
    gambling_winnings: 10_000
    gambling_losses: 8_000
    state_code: KS
  output:
    wagering_losses_deduction: 8_000
    ks_agi: 50_000
    # K.S.A. 79-32,120(a) lists only charity, medical care, home mortgage
    # interest and property taxes.
    ks_itemized_deductions: 0

- name: Kansas itemized deductions keep charity and drop wagering losses in 2026.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    employment_income: 40_000
    gambling_winnings: 10_000
    gambling_losses: 8_000
    charitable_deduction: 3_000
    state_code: KS
  output:
    wagering_losses_deduction: 7_200
    ks_itemized_deductions: 3_000
