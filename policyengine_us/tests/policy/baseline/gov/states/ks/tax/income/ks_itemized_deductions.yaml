- name: KS itemized deductions unit test 1
  period: 2021
  input:
    real_estate_taxes: 8
    salt_deduction: 10
    deductible_mortgage_interest_tax_unit: 9
    medical_expense_deduction: 2
    state_code: KS
  output:
    ks_itemized_deductions: 8 + 9 + 2

- name: KS itemized deductions unit test 2
  period: 2022
  input:
    real_estate_taxes: 12
    salt_deduction: 10
    deductible_mortgage_interest_tax_unit: 9
    medical_expense_deduction: 2
    state_code: KS
  output:
    ks_itemized_deductions: 12 + 9 + 2

# K.S.A. 79-32,120(a)(5): from 2020, 100% of charitable contributions, medical
# care, qualified residence interest and real and personal property taxes.
# Investment interest and casualty losses are not Kansas itemized deductions.
- name: Case 3, 2025 only the four Kansas categories count.
  period: 2025
  input:
    state_code: KS
    charitable_deduction: 3_000
    medical_expense_deduction: 2_000
    deductible_mortgage_interest_tax_unit: 9_000
    interest_deduction: 13_000
    casualty_loss_deduction: 1_000
    real_estate_taxes: 5_000
  output:
    # 3,000 + 2,000 + 9,000 + 5,000; not the 4,000 of investment interest in
    # interest_deduction or the 1,000 casualty loss.
    ks_itemized_deductions: 19_000

# K.S.A. 79-32,120(a)(4): 2019 allows 100% of charity and 75% of the other
# three categories.
- name: Case 4, 2019 shares.
  period: 2019
  input:
    state_code: KS
    charitable_deduction: 1_000
    medical_expense_deduction: 2_000
    deductible_mortgage_interest_tax_unit: 8_000
    real_estate_taxes: 4_000
  output:
    # 1,000 + 0.75 * (2,000 + 8,000 + 4,000)
    ks_itemized_deductions: 11_500

# K.S.A. 79-32,120(a)(3): 2018 allows 100% of charity and 50% of the other
# three categories.
- name: Case 5, 2018 shares.
  period: 2018
  input:
    state_code: KS
    charitable_deduction: 1_000
    medical_expense_deduction: 2_000
    deductible_mortgage_interest_tax_unit: 8_000
    real_estate_taxes: 4_000
  output:
    # 1,000 + 0.5 * (2,000 + 8,000 + 4,000)
    ks_itemized_deductions: 8_000

# K.S.A. 79-32,120(a)(2): 2015 to 2017 allow 100% of charity, 50% of qualified
# residence interest and property taxes, and no medical care (2017 Schedule S,
# Part C).
- name: Case 6, 2017 shares, no medical expenses.
  period: 2017
  input:
    state_code: KS
    charitable_deduction: 1_000
    medical_expense_deduction: 2_000
    deductible_mortgage_interest_tax_unit: 8_000
    real_estate_taxes: 4_000
  output:
    # 1,000 + 0.5 * (8,000 + 4,000)
    ks_itemized_deductions: 7_000

- name: Case 7, 2021 federal deduction for non-itemizers' charitable gifts is not a Kansas itemized deduction.
  period: 2021
  input:
    state_code: KS
    charitable_deduction: 2_000
    charitable_deduction_for_non_itemizers: 300
    real_estate_taxes: 4_000
  output:
    # 2,000 + 4,000; the 300 non-itemizer deduction does not count.
    ks_itemized_deductions: 6_000

# K.S.A. 79-32,120(a)(4) counts qualified residence interest under section
# 163(h), and 163(h)(3)(E) treats mortgage insurance premiums as such interest
# (2019 Schedule S, line C4).
- name: Case 8, 2019 mortgage insurance premiums count at the 75% share.
  period: 2019
  input:
    state_code: KS
    employment_income: 40_000
    home_mortgage_interest: 8_000
    mortgage_insurance_premiums: 1_000
  output:
    # AGI of 40,000 is below the 100,000 premium phase-out start.
    # 0.75 * (8,000 + 1,000)
    ks_itemized_deductions: 6_750

- name: Case 9, 2025 a direct deductible mortgage interest input counts.
  period: 2025
  input:
    state_code: KS
    deductible_mortgage_interest: 9_000
  output:
    # 1 * 9,000
    ks_itemized_deductions: 9_000

# K.S.A. 79-32,120(a)(5) and 163(h)(3)(E): P.L. 119-21 sec. 70108 restores the
# federal premium deduction from 2026, and Kansas counts it at 100%.
- name: Case 10, 2026 mortgage insurance premiums count at 100%.
  period: 2026
  input:
    state_code: KS
    home_mortgage_interest: 8_000
    mortgage_insurance_premiums: 1_000
  output:
    # AGI of 0 is below the premium phase-out start.
    # 1 * (8,000 + 1,000)
    ks_itemized_deductions: 9_000

# 163(h)(3)(E)(iv) allows premiums through 2021, so premiums alone count.
- name: Case 11, 2021 mortgage insurance premiums alone count.
  period: 2021
  input:
    state_code: KS
    mortgage_insurance_premiums: 1_000
  output:
    # AGI of 0 is below the premium phase-out start.
    # 1 * 1,000
    ks_itemized_deductions: 1_000

# 163(h)(3)(E)(iv) ends the premium deduction after 2021, and P.L. 119-21
# sec. 70108 restores it only from 2026 (2025 Kansas Schedule A line 8d is
# reserved).
- name: Case 12, 2025 mortgage insurance premiums do not count.
  period: 2025
  input:
    state_code: KS
    home_mortgage_interest: 8_000
    mortgage_insurance_premiums: 1_000
  output:
    # 1 * 8,000
    ks_itemized_deductions: 8_000

# 163(h)(3)(E)(ii) cuts premiums by 10% for each $1,000, or fraction of one,
# of AGI above $100,000.
- name: Case 13, 2019 premiums after the AGI phase-out count at the 75% share.
  period: 2019
  input:
    state_code: KS
    employment_income: 104_500
    home_mortgage_interest: 8_000
    mortgage_insurance_premiums: 1_000
  output:
    # AGI exceeds 100,000 by 4,500: 5 steps, so premiums fall 50% to 500.
    deductible_mortgage_insurance_premiums: 500
    # 0.75 * (8,000 + 500)
    ks_itemized_deductions: 6_375

- name: KS itemized deductions leave out the federal claim of right repayment deduction
  # K.S.A. 79-32,120(a) lists charitable contributions, medical care,
  # qualified residence interest and property taxes only.
  period: 2025
  input:
    real_estate_taxes: 3_000
    home_mortgage_interest: 9_000
    claim_of_right_deduction: 5_000
    state_code: KS
  output:
    itemized_deductions_less_salt: 14_000
    # 9,000 + 3,000; the 5,000 claim of right deduction is not one of the four.
    ks_itemized_deductions: 12_000
