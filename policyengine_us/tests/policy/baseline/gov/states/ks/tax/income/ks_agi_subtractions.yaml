        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: KS
  output:
    ks_agi_subtractions: 0

- name: Only the head's and spouse's public pensions and tax refunds are subtracted, not the dependent's
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 67
        employment_income: 50_000
        taxable_public_pension_income: 8_000
        salt_refund_income: 1_000
      spouse:
        age: 65
        taxable_public_pension_income: 6_000
      child:
        age: 16
        is_tax_unit_dependent: true
        taxable_public_pension_income: 10_000
        salt_refund_income: 2_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
        state_code: KS
  output:
    # Pensions 8,000 + 6,000 and the head's refund of 1,000.
    ks_agi_subtractions: 15_000

- name: An aged head's tax is unchanged by a dependent child's public pension
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 70
        employment_income: 50_000
      child:
        age: 16
        is_tax_unit_dependent: true
        taxable_public_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, child]
        state_code: KS
  output:
    ks_agi_subtractions: 0
    ks_agi: 50_000
    # Head of household standard deduction 6,180 + 850 for age 65 or older;
    # exemptions 13,800. 50,000 - 7,030 - 13,800 = 29,170
    ks_taxable_income: 29_170
    # 23,001 * 5.2% + (29,170 - 23,001) * 5.58% = 1,196.05 + 344.23
    ks_income_tax_before_credits: 1_540.28
