- name: 2024 single filer who can be claimed as a dependent with a child gets no food sales tax credit
  period: 2024
  input:
    people:
      person_a:
        age: 25
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # No child is claimed "as a personal exemption" (IRC 152(b)(1)) and no
    # filer is 55 or older, so no route to the credit.
    ks_fstc: 0

