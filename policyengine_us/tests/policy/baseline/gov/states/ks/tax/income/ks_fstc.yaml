# K.S.A. 79-32,271(d), as reenacted by 2022 HB 2106 section 4: $125 for every
# exemption claimed on the federal return, counting each unclaimable filer
# and each dependent child under 18.
- name: The 2024 joint credit counts only the unclaimable spouse
  period: 2024
  input:
    people:
      head:
        age: 60
        claimable_as_dependent_on_another_return: false
      spouse:
        age: 20
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        adjusted_gross_income: 10_000
    households:
      household:
        members: [head, spouse]
        state_code: KS
  output:
    # Age 60 qualifies and 10,000 <= the AGI limit. 1 unclaimable filer + 0
    # children = 1; 1 x $125.
    ks_fstc: 125

- name: A claimable but unclaimed older filer receives no personal food credit
  period: 2021
  input:
    state_code: KS
    age: 60
    filing_status: SINGLE
    adjusted_gross_income: 1_000
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
  output:
    # Age and income pass, but 0 federal exemptions x $125 = $0.
    ks_fstc: 0

- name: An unclaimable head of household and one child count twice
  period: 2024
  input:
    people:
      head:
        age: 35
        claimable_as_dependent_on_another_return: false
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 10_000
    households:
      household:
        members: [head, child]
        state_code: KS
  output:
    # 1 unclaimable filer + 1 child under 18 = 2; 2 x $125, with no extra
    # Kansas head-of-household exemption.
    ks_fstc: 250

- name: 2024 claimable single filer whose claimant meets the filing exception gets the credit for the child
  period: 2024
  input:
    people:
      person_a:
        age: 25
        employment_income: 1_000
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # The would-be claimant meets the filing exception (Publication 501), so
    # IRC 152(b)(1) leaves the child a dependent and opens the child route.
    # The filer stays claimable, so no own exemption (IRC 151(d)(2)):
    # 0 filers + 1 child under 18 = 1; 1 x $125.
    ks_fstc: 125
