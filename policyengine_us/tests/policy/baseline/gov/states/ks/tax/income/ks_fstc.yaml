- name: 2022 single filer who can be claimed as a dependent gets no food sales tax credit
  period: 2022
  input:
    people:
      person_a:
        age: 60
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: KS
  output:
    # K.S.A. 79-32,271(d) counts federal exemptions, and IRC 151(d)(2) allows
    # none to a filer whom another taxpayer may claim: age 60 qualifies, but
    # 0 exemptions x $125 = $0.
    ks_fstc: 0

