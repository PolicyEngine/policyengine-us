- name: KS food sales tax credit unit test 1
  period: 2021
  input:
    age_head: 56
    blind_head: false
    adjusted_gross_income: 30_000
    tax_unit_size: 3
    state_code: KS
  output:
    ks_fstc: 125 * 3

- name: KS food sales tax credit unit test 2
  period: 2021
  input:
    age_head: 54
    blind_head: true
    adjusted_gross_income: 30_000
    tax_unit_size: 1
    state_code: KS
  output:
    ks_fstc: 125 * 1

- name: KS food sales tax credit unit test 2
  period: 2021
  input:
    age_head: 54
    blind_head: false
    adjusted_gross_income: 30_000
