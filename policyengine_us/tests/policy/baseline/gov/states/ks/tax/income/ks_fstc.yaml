- name: KS food sales tax credit unit test 1
  period: 2021
  input:
    people:
      head:
        age: 56
      child1:
        age: 10
        is_tax_unit_dependent: true
      child2:
        age: 12
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child1, child2]
        adjusted_gross_income: 30_000
    households:
      household:
        members: [head, child1, child2]
        state_code: KS
  output:
    # 1 unclaimable filer + 2 dependent children under 18 = 3 exemptions.
    ks_fstc: 125 * 3

- name: KS food sales tax credit unit test 2
  period: 2021
  input:
    age_head: 54
    blind_head: true
    adjusted_gross_income: 30_000
    tax_unit_size: 1
    state_code: KS
  output:
    ks_fstc: 125 * 1

- name: KS food sales tax credit unit test 2
