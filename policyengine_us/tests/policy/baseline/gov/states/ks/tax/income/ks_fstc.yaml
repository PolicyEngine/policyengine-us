    state_code: KS
  output:
    ks_fstc: 0  # tax unit is ineligible

- name: KS food sales tax credit unit test 4
  period: 2022
  input:
    age_head: 56
    blind_head: false
    adjusted_gross_income: 31_000
    tax_unit_size: 3
    state_code: KS
  output:
    ks_fstc: 0  # income ineligible


- name: 2022 single filer who can be claimed as a dependent gets no food sales tax credit
  period: 2022
  input:
    people:
      person_a:
        age: 60
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: KS
  output:
    # Line E is the total Kansas exemptions, which is "0" for a claimed filer
    # (2022 K-40 instructions, p.6).
    ks_fstc: 0

- name: 2022 single filer who cannot be claimed gets the food sales tax credit
  period: 2022
  input:
    people:
      person_a:
        age: 60
        employment_income: 1000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: KS
  output:
    # Age 60 qualifies; AGI $1,000 <= $30,615; 1 x $125.
    ks_fstc: 125

- name: 2022 joint return with one claimable spouse gets no food sales tax credit (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 60
        employment_income: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: KS
  output:
    # The joint return's total exemptions are 0 when either spouse is claimable.
    ks_fstc: 0

- name: 2022 joint return with one claimable spouse gets no food sales tax credit (the claimable spouse is the spouse)
