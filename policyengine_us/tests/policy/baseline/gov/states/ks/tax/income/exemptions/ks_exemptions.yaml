- name: 2024 joint return with no claimable spouse gets the dependent exemption
  period: 2024
  input:
    people:
      person_a:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # $18,320 + $2,320 = $20,640.
    ks_exemptions: 20640


- name: 2024 single filer whose claimant meets the filing exception gets the dependent exemption
  period: 2024
  input:
    people:
      person_a:
        age: 20
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # The would-be claimant meets the filing exception (Publication 501,
    # Dependent Taxpayer Test), so the return keeps its dependents.
    # $9,160 + $2,320 = $11,480.
    ks_exemptions: 11480

- name: 2024 actually claimed single filer whose claimant meets the filing exception keeps the dependent exemption
  period: 2024
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: SINGLE
    households:
      household:
        members: [parent, child]
        state_name: KS
  output:
    # K.S.A. 79-32,121b federal entitlement preserves this dependent under
    # the filing exception: $9,160 + $2,320 = $11,480. The K-40 instruction
    # to enter zero dependents for actually claimed taxpayers gives $9,160.
    ks_exemptions: 11_480
