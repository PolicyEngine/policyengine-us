- name: Case 4,two exemptions in 2023, and two disabled veteran exemption.
  period: 2023
  input:
    people:
      person1:
        ks_disabled_veteran_exemptions_eligible_person: true
      person2:
        ks_disabled_veteran_exemptions_eligible_person: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        ks_count_exemptions: 2
    households:
      household:
        members: [person1, person2]
        state_code: KS
