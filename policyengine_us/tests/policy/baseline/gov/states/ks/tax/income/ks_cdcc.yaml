- name: KS cdcc unit test 1
  period: 2021
  input:
    cdcc: 1_000
    state_code: KS
  output:
    ks_cdcc: 0.25 * 1_000

- name: Disabled adult dependent's care expenses count toward Kansas CDCC
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        is_tax_unit_head: true
      person2:
        age: 38
        employment_income: 30_000
        is_tax_unit_spouse: true
      person3:
        age: 18
        is_incapable_of_self_care: true
        is_tax_unit_dependent: true
        pre_subsidy_care_expenses: 6_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: KS
  output:
    cdcc: 600  # federal credit, fed by the adult-care expense
    ks_cdcc: 300  # Kansas share of the federal credit


- name: 2024 single filer who can be claimed as a dependent gets no Kansas child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # IRC 21(b)(1)(A) needs a dependent; IRC 152(b)(1) leaves none.
    ks_cdcc: 0

- name: 2024 single filer who cannot be claimed gets the Kansas child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # $1,000 x .35 = $350 federal credit allowed; x .50 = $175.
    ks_cdcc: 175

- name: 2024 joint return with one claimable spouse gets no Kansas child care credit (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # Either spouse being claimable leaves the return no dependents.
    ks_cdcc: 0

