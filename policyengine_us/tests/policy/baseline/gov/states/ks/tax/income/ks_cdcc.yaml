- name: KS cdcc unit test 1
  period: 2021
  input:
    cdcc: 1_000
    state_code: KS
  output:
    ks_cdcc: 0.25 * 1_000

- name: Disabled adult dependent's care expenses count toward Kansas CDCC
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        is_tax_unit_head: true
      person2:
        age: 38
        employment_income: 30_000
        is_tax_unit_spouse: true
      person3:
        age: 18
        is_incapable_of_self_care: true
        is_tax_unit_dependent: true
        pre_subsidy_care_expenses: 6_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: KS
  output:
    cdcc: 600  # federal credit, fed by the adult-care expense
    ks_cdcc: 300  # Kansas share of the federal credit

- name: Kansas's 2021 credit follows the increased federal dependent care exclusion
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      parent1:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      parent2:
        age: 38
        employment_income: 40_000
      child1:
        age: 5
      child2:
        age: 7
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 20_000
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: KS
  output:
    dependent_care_assistance_exclusion: 9_000
    # Federal Form 2441: min(16_000 - 9_000, 20_000 - 9_000) * 50% = 3_500.
    cdcc: 3_500
    # 2021 K-40 line 14: 3_500 federal credit * 25% = 875.
    # https://www.ksrevenue.gov/incomebook21.html
    ks_cdcc: 875
