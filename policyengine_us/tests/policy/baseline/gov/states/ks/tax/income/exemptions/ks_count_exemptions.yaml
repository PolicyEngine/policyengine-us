      person_a:
        age: 20
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: KS
  output:
    ks_count_exemptions: 1
    ks_exemptions: 2250

- name: A claimable but unclaimed 2021 filer has no personal exemption
  period: 2021
  input:
    state_code: KS
    filing_status: SINGLE
    age: 20
    claimable_as_dependent_on_another_return: true
    claimed_as_dependent_on_another_return: false
  output:
    # 0 unclaimable filers + 0 dependents = 0; 0 x $2,250 = $0.
    ks_count_exemptions: 0
    ks_exemptions: 0

- name: A claimed spouse does not remove the other spouse's exemption
  period: 2023
  input:
    people:
      head:
        age: 21
        claimable_as_dependent_on_another_return: false
      spouse:
        age: 20
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: KS
  output:
    # 1 unclaimable head + 0 for the claimable spouse = 1; 1 x $2,250.
    ks_count_exemptions: 1
    ks_exemptions: 2_250

- name: A 2022 head of household receives no additional adult exemption
  period: 2022
  input:
    people:
      head:
        age: 35
      child:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: KS
  output:
    # 1 unclaimable filer + 1 dependent = 2; 2 x $2,250 = $4,500.
    ks_count_exemptions: 2
    ks_exemptions: 4_500
