        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # The filer can be claimed but nobody claims them; this rule turns on
    # being claimed.
    # No dependents (IRC 152(b)(1)): 2 x $2,250 = $4,500.
    ks_count_exemptions: 2
    ks_exemptions: 4500

