

- name: 2022 single filer who can be claimed as a dependent has no Kansas exemptions
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # K.S.A. 79-32,121(a) with IRC 151(d)(2): a filer whom another taxpayer
    # may claim has no exemption of their own.
    ks_count_exemptions: 0
    ks_exemptions: 0

- name: 2022 joint return with one claimable spouse keeps the other spouse's Kansas exemption (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # IRC 151(d)(2) applies to each spouse separately; no dependents.
    ks_count_exemptions: 1
    ks_exemptions: 2250

