

- name: 2022 single filer who can be claimed as a dependent has no Kansas exemptions
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # 2022 K-40 instructions, p.6: "If you are claimed as a dependent by
    # another taxpayer, enter '0' in the Total Kansas exemptions box."
    ks_count_exemptions: 0
    ks_exemptions: 0

- name: 2022 joint return with one claimable spouse has no Kansas exemptions (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # Either spouse being claimable zeroes the joint return's exemptions.
    ks_count_exemptions: 0
    ks_exemptions: 0

- name: 2022 joint return with one claimable spouse has no Kansas exemptions (the claimable spouse is the spouse)
  period: 2022
  input:
    people:
      person_b:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: KS
  output:
    ks_count_exemptions: 0
    ks_exemptions: 0

