- name: 2022 joint return with no claimable spouse has three Kansas exemptions
  period: 2022
  input:
    people:
      person_a:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # 2 + 1 child = 3 exemptions x $2,250 = $6,750.
    ks_count_exemptions: 3
    ks_exemptions: 6750


- name: 2022 single filer who can be claimed but is not claimed has no Kansas exemptions
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: KS
  output:
    # IRC 151(d)(2) turns on whether another taxpayer is allowed the
    # deduction, not whether they take it; the child is not the filer's
    # dependent (IRC 152(b)(1)).
    ks_count_exemptions: 0
    ks_exemptions: 0

- name: 2022 joint return with one spouse who can be claimed but is not claimed keeps only the other spouse's exemption (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KS
  output:
    # The claimable spouse has no exemption (IRC 151(d)(2)) and there are
    # no dependents (IRC 152(b)(1)): 1 x $2,250 = $2,250.
    ks_count_exemptions: 1
    ks_exemptions: 2250

- name: 2022 joint return with one spouse who can be claimed but is not claimed keeps only the other spouse's exemption (the claimable spouse is the spouse)
  period: 2022
  input:
    people:
      person_b:
        age: 20
