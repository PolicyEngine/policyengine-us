# Keep SSI, Medicaid eligibility, and SNAP computed. From 2027, Medicaid's
# community-engagement pass-through reads SNAP, which counts Kansas SSPP.

- name: Case 1, aged institutional SSI recipient receives SSPP in 2030.
  period: 2030-01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # The SSPP payment parameter is $32/month; federal institutional
    # SSI provides $30/month. No other income reduces the SSI payment.
    # SSA independently reports the $32 state supplement in Table 1:
    # https://www.ssa.gov/policy/docs/progdesc/ssi_st_asst/2011/ks.html
    ks_sspp: 32
    ks_sspp_eligible: true
    ssi: 30
    ssi_countable_income: 0
    medicaid_enrolled: true

- name: Case 2, disabled institutional SSI recipient receives SSPP in 2035.
  period: 2035-01
  input:
    people:
      person1:
        age: 45
        meets_ssi_disability_criteria: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_sspp: 32
    ks_sspp_eligible: true
    ssi: 30
    is_ssi_disabled: true
    medicaid_work_requirement_eligible: true
    medicaid_enrolled: true

- name: Case 3, Medicaid non-takeup prevents SSPP despite institutional SSI receipt.
  period: 2030-01
  input:
    people:
      person1:
        age: 70
        takes_up_medicaid_if_eligible: false
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_sspp: 0
    ks_sspp_eligible: false
    ssi: 30
    is_medicaid_eligible: true
    medicaid_enrolled: false

- name: Case 4, explicit Medicaid non-enrollment prevents SSPP in 2035.
  period: 2035-01
  input:
    people:
      person1:
        age: 70
        medicaid_enrolled: false
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_sspp: 0
    ks_sspp_eligible: false
    ssi: 30
    medicaid_enrolled: false

- name: Case 5, income above the institutional SSI cutoff prevents SSPP.
  period: 2030-01
  input:
    people:
      person1:
        age: 70
        social_security: 720
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # $720/year / 12 - $20 general exclusion = $40 countable income.
    # max($30 institutional SSI - $40, 0) = $0; SSPP requires receipt.
    ks_sspp: 0
    ks_sspp_eligible: false
    ssi_countable_income: 40
    ssi: 0

- name: Case 6, SSI non-takeup prevents SSPP in 2035.
  period: 2035-01
  input:
    people:
      person1:
        age: 70
        takes_up_ssi_if_eligible: false
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_sspp: 0
    ks_sspp_eligible: false
    ssi: 0

- name: Case 7, low-income adult without SSI or institutional residence receives no SSPP.
  period: 2030-01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
        weekly_hours_worked_before_lsr: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_sspp: 0
    ks_sspp_eligible: false
    ssi: 0
    medicaid_enrolled: false
