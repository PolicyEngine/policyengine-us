# KEESM 13361: child interest exclusion and year-specific interest exemptions.
# KEESM sections refer to the October 2024 and January 2026 editions:
# https://content.dcf.ks.gov/ees/KEESM/Robo10-24/Robo_10_01_24/ and
# https://content.dcf.ks.gov/ees/KEESM/Robo01-26/Robo_01_01_26/ (keesm<section>.htm).
- name: Case 1, FY2025 exactly at monthly exemption.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: KS
    age: 40
    interest_income: 360
    qualified_dividend_income: 240
  output:
    ks_liheap_countable_interest_dividend_income: 0
- name: Case 2, FY2025 above exemption counts the full amount.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: KS
    age: 40
    interest_income: 361
    qualified_dividend_income: 240
  output:
    ks_liheap_countable_interest_dividend_income: 601
- name: Case 3, FY2026 regular small interest has no blanket exemption.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KS
    age: 40
    interest_income: 120
    qualified_dividend_income: 0
  output:
    ks_liheap_countable_interest_dividend_income: 120
- name: Case 4, FY2026 interest of a 17-year-old is exempt but dividends count.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KS
    age: 17
    interest_income: 1_000
    qualified_dividend_income: 300
  output:
    ks_liheap_countable_interest_dividend_income: 300
- name: Case 5, FY2026 interest counts at age 18.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KS
    age: 18
    interest_income: 1_000
    qualified_dividend_income: 300
  output:
    ks_liheap_countable_interest_dividend_income: 1_300
