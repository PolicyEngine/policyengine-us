# KEESM 13360: verified SNAP/TANF income still enters the household test.
# KEESM 13361(29)-(30): only specified interest/dividend income is exempt.
# KEESM 13340: heating equipment alone does not establish fuel responsibility.
# KEESM 13362: FY2026 uses the published monthly limits, including rounding.
- name: SNAP receipt does not exempt an over-income household from the income test.
  period: 2026
  input:
    state_code: KS
    age: 40
    ks_liheap_household_size: 2
    ks_liheap_countable_income: 40_000
    snap: 1_200
  output:
    ks_liheap_income_eligible: false

- name: Regular adult interest and dividends count toward household income.
  period: 2026
  input:
    state_code: KS
    age: 40
    employment_income: 20_000
    interest_income: 3_000
    dividend_income: 2_000
    ks_tanf: 0
  output:
    ks_liheap_countable_income: 25_000

- name: A household gathering its own wood has no purchased heating costs.
  period: 2026
  input:
    state_code: KS
    age: 40
    employment_income: 15_000
    heating_type: WOOD
    wood_expense: 0
    heat_expense_included_in_rent: false
  output:
    ks_liheap_eligible: false
    ks_liheap: 0

- name: FY2026 one-person income above the published monthly limit is ineligible.
  period: 2026
  input:
    state_code: KS
    ks_liheap_household_size: 1
    # Published monthly limit is 1,956; 1,956.25 exceeds it.
    ks_liheap_countable_income: 23_475
    snap: 0
    ssi: 0
    ks_tanf: 0
  output:
    ks_liheap_income_eligible: false

- name: FY2026 four-person household exactly at the published monthly limit qualifies.
  period: 2026
  input:
    state_code: KS
    ks_liheap_household_size: 4
    # Published monthly limit is 4,019.
    ks_liheap_countable_income: 48_228
    snap: 0
    ssi: 0
    ks_tanf: 0
  output:
    ks_liheap_income_eligible: true
