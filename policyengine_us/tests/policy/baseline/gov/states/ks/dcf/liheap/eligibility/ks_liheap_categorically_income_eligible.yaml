# Kansas LIEAP categorical income eligibility (KS LIHEAP State Plan FY2026
# section 1.4, #page=5): a household with at least one member receiving TANF,
# SSI or SNAP is considered income eligible for heating assistance. Modeled
# on receipt: any member ssi > 0, spm_unit snap > 0, or spm_unit ks_tanf > 0.
# Means-tested veterans programs are not a categorical route (plan 1.4: No).

- name: Case 1, a member receiving SSI makes the household categorically eligible.
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income: 40_000
      person2:
        age: 68
        ssi: 6_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    ks_liheap_categorically_income_eligible: true

- name: Case 2, SNAP receipt makes the household categorically eligible.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 20_000
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        ks_tanf: 0
        snap: 2_400
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    ks_liheap_categorically_income_eligible: true

- name: Case 3, TANF receipt makes the household categorically eligible.
  period: 2026
  input:
    people:
      person1:
        age: 28
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        ks_tanf: 3_600
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    ks_liheap_categorically_income_eligible: true

- name: Case 4, no TANF, SSI or SNAP receipt is not categorically eligible.
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income: 40_000
      person2:
        age: 68
        social_security: 15_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    ks_liheap_categorically_income_eligible: false

- name: Case 5, veterans benefits alone are not a categorical route.
  period: 2026
  input:
    people:
      person1:
        age: 60
        veterans_benefits: 30_000
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # Plan 1.4: means-tested veterans programs -> No for heating.
    ks_liheap_categorically_income_eligible: false
