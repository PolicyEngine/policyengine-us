# Kansas CSFP State Plan, effective April 11, 2025, PDF page 4.
# https://www.dcf.ks.gov/services/ees/Documents/Food_Distribution_Programs/CSFPStatePlan.pdf#page=4
# 7 CFR 247.9(b)(1), (3): qualifying program participation bypasses income only.
# In cases 1-6, person2 shares an SPM unit with recipients person1 and person3;
# person4 belongs to a separate SPM unit in the same household.

- name: Case 1, ssi bypasses income only for the recipient or participating SPM unit.
  period: 2026
  input:
    people:
      person1:
        age: 60
        ssi: 1_200
        receives_ssi: false
        msp: 0
      person2:
        age: 68
        ssi: 0
        receives_ssi: false
        msp: 0
      person3:
        age: 35
        ssi: 1_200
        receives_ssi: false
        msp: 0
      person4:
        age: 70
        ssi: 0
        receives_ssi: false
        msp: 0
    spm_units:
      unit1:
        members: [person1, person2, person3]
        school_meal_fpg_ratio: 2
        snap: 0
        receives_snap: false
        fdpir: 0
      unit2:
        members: [person4]
        school_meal_fpg_ratio: 2
        snap: 0
        receives_snap: false
        fdpir: 0
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: KS
        county_str: SEDGWICK_COUNTY_KS
  output:
    ks_dcf_csfp_categorically_eligible: [true, false, true, false]
    commodity_supplemental_food_program_eligible: [true, false, false, false]
    commodity_supplemental_food_program: [651, 0, 0, 0]

