# Values annualize the published monthly limits; FY2026 includes rounding.
- name: Case 1, 2025 household size 1, income 0 dollar above the published limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: KS
    ks_liheap_household_size: 1
    ks_liheap_countable_income: 22_590
  output:
    ks_liheap_income_limit: 22_590
    ks_liheap_income_eligible: true

