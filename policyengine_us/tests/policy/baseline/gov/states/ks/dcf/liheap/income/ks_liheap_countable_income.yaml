# Kansas LIEAP countable gross income (KS LIHEAP State Plan FY2026 sections
# 1.8-1.9, #page=5-6; KEESM 13320). Counted: wages, self-employment,
# unemployment insurance, SSA benefits, SSI, retirement/pension, TANF, child
# support, alimony, rental income, VA benefits and recurring adult interest.
# Earned income of children under 18 is excluded. Income of other
# household members counts, including non-qualified noncitizens (KEESM 13330).
# All amounts are annual (YEAR variable).

- name: Case 1, recurring adult interest and dividends are counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
        interest_income: 3_000
        dividend_income: 2_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 20,000 wages + 3,000 interest + 2,000 dividends (KEESM 13360).
    ks_liheap_countable_income: 25_000

- name: Case 2, earned income of a child under 18 is not counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 42
        employment_income: 18_000
      person2:
        age: 16
        employment_income: 5_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        ks_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    # 18,000 parent wages; the 16-year-old's 5,000 wages are excluded.
    ks_liheap_countable_income: 18_000

- name: Case 3, Social Security and SSI are counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security: 12_000
        ssi: 3_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 12,000 SSA + 3,000 SSI = 15,000 (plan 1.8: SSA and SSI checked).
    ks_liheap_countable_income: 15_000

- name: Case 4, an 18-year-old member's earnings are counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 18_000
      person2:
        age: 18
        employment_income: 5_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    # KEESM 13320: a member who is 18 has countable income -> 18,000 + 5,000.
    ks_liheap_countable_income: 23_000

- name: Case 5, unearned income of a child under 18 is still counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 38
        employment_income: 18_000
      person2:
        age: 12
        social_security: 4_000
        employment_income: 1_000
    spm_units:
      spm_unit:
        members: [person1, person2]
        ks_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    # Only the child's *earned* income is excluded (plan 1.9); the child's
    # 4,000 SSA survivor benefit counts: 18,000 + 4,000 = 22,000.
    ks_liheap_countable_income: 22_000

- name: Case 6, other checked income sources are summed.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        self_employment_income: 8_000
        unemployment_compensation: 6_000
        pension_income: 10_000
        child_support_received: 3_000
        alimony_income: 2_000
        rental_income: 4_000
        veterans_benefits: 5_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 8,000 + 6,000 + 10,000 + 3,000 + 2,000 + 4,000 + 5,000 = 38,000
    # (plan 1.8 checked boxes: self-employment, UI, retirement, child support,
    # alimony, rental income, VA benefits).
    ks_liheap_countable_income: 38_000

- name: Case 7, TANF cash assistance is counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 3_000
      person2:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2]
        ks_tanf: 2_400
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    # 3,000 wages + 2,400 TANF (plan 1.8: TANF checked) = 5,400.
    ks_liheap_countable_income: 5_400

- name: Case 8, income of a non-qualified noncitizen member is counted.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        immigration_status: CITIZEN
        employment_income: 6_000
      person2:
        age: 33
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    # KEESM 13330: income from non-qualified members is counted -> 18,000.
    ks_liheap_countable_income: 18_000

- name: Case 9, countable earned income supplied by the caller is used as given.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: 5_000
        # The caller supplies the countable earned income amount.
        ks_liheap_countable_earned_income: 18_000
    spm_units:
      spm_unit:
        members: [person1]
        ks_tanf: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 18,000 supplied countable earned income + 0 unearned income = 18,000.
    ks_liheap_countable_income: 18_000

- name: Case 10, employer disability benefits are counted as unearned income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 52
        # Example amount: 1,200 a month of employer disability benefits.
        disability_benefits: 14_400
    spm_units:
      spm_unit:
        members: [person1]
        ks_tanf: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # disability_benefits is in the unearned source list: 1,200 x 12 = 14,400;
    # every other listed source is 0.
    ks_liheap_countable_unearned_income: 14_400
    # 0 earned income + 14,400 unearned income = 14,400.
    ks_liheap_countable_income: 14_400
