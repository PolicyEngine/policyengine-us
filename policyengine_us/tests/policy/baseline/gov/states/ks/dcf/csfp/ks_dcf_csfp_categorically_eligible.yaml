- name: Case 1, categorical eligibility follows the state plan effective date.
  period: 2025
  input:
    state_code: KS
    ssi: 0
    receives_ssi: true
    snap: 0
    receives_snap: false
    fdpir: 0
    msp: 0
  output:
    ks_dcf_csfp_categorically_eligible:
      2025-03: false
      # The plan takes effect April 11. The parameter list is read at the start
      # of each month, so April (starting April 1) still sees the empty list
      # and May is the first month with the bypass.
      2025-04: false
      2025-05: true
      2025-12: true
      2025: true

- name: Case 2, annual eligibility uses year-end receipt rather than an earlier month.
  period: 2026
  input:
    state_code: KS
    county_str: SEDGWICK_COUNTY_KS
    age: 68
    school_meal_fpg_ratio: 2
    ssi: 0
    receives_ssi:
      2026-01: true
      2026-12: false
    snap: 0
    receives_snap: false
    fdpir: 0
    msp: 0
  output:
    ks_dcf_csfp_categorically_eligible:
      2026-01: true
      2026-12: false
      2026: false
    commodity_supplemental_food_program_eligible: false
