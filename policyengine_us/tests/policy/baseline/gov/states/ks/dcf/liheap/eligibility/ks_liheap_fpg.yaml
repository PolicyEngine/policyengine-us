# Kansas LIEAP federal poverty guideline for the income limit. The season's
# published table is 150% of the prior calendar year's HHS guidelines (2026
# flyer: $1,956/month for one person = 1.5 x 15,650 / 12), so program year Y
# uses the year Y-1 guideline. Household size counts only citizens and
# qualified aliens (KEESM 13330). Contiguous-US guidelines (gov/hhs/fpg.yaml):
# 2025 = 15,650 + 5,500 per additional person; 2024 = 15,060 + 5,380.

- name: Case 1, single citizen in the 2026 season uses the 2025 one-person guideline.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 2025 guideline, size 1 = 15,650
    ks_liheap_fpg: 15_650

- name: Case 2, four citizens in the 2026 season use the 2025 four-person guideline.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
      person2:
        age: 38
      person3:
        age: 10
      person4:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: KS
  output:
    # 15,650 + 3 x 5,500 = 32,150
    ks_liheap_fpg: 32_150

- name: Case 3, five members with one undocumented member use the four-person guideline.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        immigration_status: CITIZEN
      person2:
        age: 33
        immigration_status: UNDOCUMENTED
      person3:
        age: 10
      person4:
        age: 7
      person5:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: KS
  output:
    # KEESM 13330: the undocumented member is not counted in household size,
    # so size 4: 15,650 + 3 x 5,500 = 32,150 (size 5 would be 37,650).
    ks_liheap_fpg: 32_150

- name: Case 4, single citizen in the 2025 season uses the 2024 one-person guideline.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # 2024 guideline, size 1 = 15,060 (the 2025 guideline would be 15,650)
    ks_liheap_fpg: 15_060

- name: Case 5, four citizens in the 2025 season use the 2024 four-person guideline.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
      person2:
        age: 38
      person3:
        age: 10
      person4:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: KS
  output:
    # 15,060 + 3 x 5,380 = 31,200
    ks_liheap_fpg: 31_200
