    ks_liheap_income_band: 2
    ks_liheap_fuel_category: PROPANE
    # matrix p.3 propane (80%) 900-1,199, tier C, Duplex, size 5+ = 393
    ks_liheap_matrix_amount: 393
    ks_liheap: 393

- name: Case 4, mixed-status family of five with an undocumented earner.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 33
        immigration_status: CITIZEN
        employment_income: 6_000
      person2:
        age: 35
        immigration_status: UNDOCUMENTED
        employment_income: 12_000
      person3:
        age: 9
        immigration_status: CITIZEN
      person4:
        age: 6
        immigration_status: CITIZEN
      person5:
        age: 2
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
        ks_liheap_utility_rate_tier: E
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: KS
  output:
    # KEESM 13330: undocumented member excluded from size, income counted.
    ks_liheap_household_size: 4
    ks_liheap_household_size_group: 1
    ks_liheap_countable_income: 18_000
    # 18,000 <= 48,228 (size 4)
    ks_liheap_income_eligible: true
    ks_liheap_eligible: true
    # 18,000 / 12 = 1,500 -> 1,200-1,699
    ks_liheap_income_band: 3
    ks_liheap_fuel_category: NATURAL_GAS
    # size 4 -> 1-4 column: matrix p.1 (80%) 1,200-1,699, tier E, House = 567
    # (the 5+ column would give 648)
    ks_liheap_matrix_amount: 567
    ks_liheap: 567

- name: Case 5, retired couple over the income limit but one spouse receives SSI.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        social_security: 20_000
      person2:
        age: 70
        social_security: 15_000
        ssi: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ks_liheap_dwelling_type: APARTMENT
        ks_liheap_utility_rate_tier: E
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    ks_liheap_household_size: 2
    ks_liheap_household_size_group: 1
    # 20,000 + 15,000 + 1,200 SSI = 36,200 (SSA and SSI both counted)
    ks_liheap_countable_income: 36_200
    # 36,200 > 2,644 x 12 = 31,728; SSI receipt does not waive the limit.
    ks_liheap_income_eligible: false
    ks_liheap_eligible: false
    # 36,200 / 12 = 3,017 -> 1,700 & over
    ks_liheap_income_band: 4
    ks_liheap_fuel_category: ELECTRICITY
    # matrix p.2 electricity (80%) 1,700 & over, tier E, Apt, size 1-4 = 365
    ks_liheap_matrix_amount: 365
    ks_liheap: 0

