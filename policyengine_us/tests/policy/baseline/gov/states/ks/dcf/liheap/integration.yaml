- name: Case 8, subsidized-housing renter with heat in rent is income eligible but not vulnerable.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 29
        employment_income: 12_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ks_liheap_dwelling_type: APARTMENT
        receives_housing_assistance: true
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_liheap_household_size: 1
    ks_liheap_household_size_group: 1
    ks_liheap_countable_income: 12_000
    ks_liheap_income_eligible: true
    # KEESM 13340 / plan 2.3: heat included in subsidized rent -> ineligible
    ks_liheap_eligible: false
    ks_liheap_income_band: 2
    ks_liheap_fuel_category: ELECTRICITY
    ks_liheap: 0

- name: Case 9, single adult in a propane trailer on the lowest tier gets the 130 minimum.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 55
        employment_income: 21_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: PROPANE
        bottled_gas_expense: 1_200
        ks_liheap_dwelling_type: TRAILER_OTHER
        ks_liheap_utility_rate_tier: A
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_liheap_household_size: 1
    ks_liheap_household_size_group: 1
    ks_liheap_countable_income: 21_600
    # 21,600 <= 23,472
    ks_liheap_income_eligible: true
    ks_liheap_eligible: true
    # 21,600 / 12 = 1,800 -> 1,700 & over
    ks_liheap_income_band: 4
    ks_liheap_fuel_category: PROPANE
    # matrix p.3 propane (80%) 1,700 & over, tier A, Trailer/Other, size 1-4 = 75
    ks_liheap_matrix_amount: 75
    # max(75, 130) = 130 (plan 2.6 minimum benefit)
    ks_liheap: 130

