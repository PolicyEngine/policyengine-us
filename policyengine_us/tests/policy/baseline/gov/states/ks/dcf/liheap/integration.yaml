# Kansas LIEAP end-to-end integration tests.
# Sources: KEESM 13100-13400 (eligibility, household, citizenship, energy
# vulnerability, benefit levels); KS LIHEAP State Plan FY2026 (income sources
# 1.8-1.9 #page=5,6, income verification 1.4 #page=5, 150% FPG 2.1 and
# subsidized housing 2.3 #page=8, $130 minimum 2.6 #page=9);
# KS_BenefitMatrix_2026.pdf (FY2026 season, "Benefit Adjustment @ 80%" table);
# KS_BenefitMatrix_2025.pdf (FY2025 season, 100%).
# Annualized published monthly income limits (KEESM 13362):
# 2026: 23,472 (1) / 31,728 (2) / 48,228 (4) / 56,472 (5);
# 2025: 22,590 (1) / 46,800 (4).
# Monthly income band = annual countable income / 12:
# 1 = 0-899, 2 = 900-1,199, 3 = 1,200-1,699, 4 = 1,700+.
# KEESM sections refer to the October 2024 and January 2026 editions:
# https://content.dcf.ks.gov/ees/KEESM/Robo10-24/Robo_10_01_24/ and
# https://content.dcf.ks.gov/ees/KEESM/Robo01-26/Robo_01_01_26/ (keesm<section>.htm).

- name: Case 1, single adult renting an apartment with natural gas heat.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 34
        employment_income: 22_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_dwelling_type: APARTMENT
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_liheap_household_size: 1
    ks_liheap_household_size_group: 1
    ks_liheap_countable_income: 22_000
    # 22,000 <= 23,472
    ks_liheap_income_eligible: true
    ks_liheap_eligible: true
    # 22,000 / 12 = 1,833 -> 1,700 & over
    ks_liheap_income_band: 4
    ks_liheap_fuel_category: NATURAL_GAS
    # matrix p.1 (80%) 1,700 & over, tier E (default), Apt, size 1-4 = 248
    ks_liheap_matrix_amount: 248
    ks_liheap: 248

