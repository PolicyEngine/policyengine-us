      person1:
        age: 40
        employment_income: 30_000
      person2:
        age: 38
        employment_income: 15_000
      person3:
        age: 8
      person4:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
        ks_liheap_utility_rate_tier: E
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: KS
  output:
    ks_liheap_household_size: 4
    ks_liheap_household_size_group: 1
    ks_liheap_countable_income: 45_000
    # 45,000 <= 4,019 x 12 = 48,228
    ks_liheap_income_eligible: true
    ks_liheap_eligible: true
    # 45,000 / 12 = 3,750 -> 1,700 & over
    ks_liheap_income_band: 4
    ks_liheap_fuel_category: ELECTRICITY
    # matrix p.2 electricity (80%) 1,700 & over, tier E, House, size 1-4 = 730
    ks_liheap_matrix_amount: 730
    ks_liheap: 730

