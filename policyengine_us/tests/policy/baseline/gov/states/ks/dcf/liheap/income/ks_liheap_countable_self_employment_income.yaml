- name: Net income fallback does not deduct business costs a second time.
  period: 2026
  input:
    state_code: KS
    age: 40
    self_employment_income: 5000
    sstb_self_employment_income: 2000
    farm_operations_income: 3000
  output:
    ks_liheap_countable_self_employment_income: 10000
- name: A non-farm business loss does not offset wages or another business.
  period: 2026
  input:
    state_code: KS
    age: 40
    employment_income: 15000
    self_employment_income: -5000
    sstb_self_employment_income: 2000
  output:
    ks_liheap_countable_earned_income: 17000
- name: Self-employment income of a child under 18 is excluded.
  period: 2026
  input:
    state_code: KS
    age: 17
    ks_liheap_self_employment_gross_income: 24000
  output:
    ks_liheap_countable_earned_income: 0
