# KEESM 13360, October 2024 and January 2026: gross receipts less 25%
# or elected actual costs. Tax-net fallback is a documented approximation.
- name: 2025 self-employment, standard deduction.
  period: 2025
  input:
    state_code: KS
    age: 40
    ks_liheap_self_employment_gross_income: 24000
    ks_liheap_self_employment_expenses: 0
    self_employment_income: 5000
  output:
    ks_liheap_countable_self_employment_income: 18000
    ks_liheap_countable_earned_income: 18000
- name: 2025 self-employment, higher actual costs.
  period: 2025
  input:
    state_code: KS
    age: 40
    ks_liheap_self_employment_gross_income: 24000
    ks_liheap_self_employment_expenses: 10000
    self_employment_income: 5000
  output:
    ks_liheap_countable_self_employment_income: 14000
    ks_liheap_countable_earned_income: 14000
- name: 2025 self-employment, lower actual costs retain standard deduction.
  period: 2025
  input:
    state_code: KS
    age: 40
    ks_liheap_self_employment_gross_income: 24000
    ks_liheap_self_employment_expenses: 1000
    self_employment_income: 5000
  output:
    ks_liheap_countable_self_employment_income: 18000
    ks_liheap_countable_earned_income: 18000
- name: 2025 self-employment, expenses exceed receipts.
  period: 2025
  input:
    state_code: KS
    age: 40
    ks_liheap_self_employment_gross_income: 12000
    ks_liheap_self_employment_expenses: 15000
    self_employment_income: 5000
  output:
    ks_liheap_countable_self_employment_income: 0
    ks_liheap_countable_earned_income: 0
- name: 2025 self-employment, explicit zero gross receipts.
  period: 2025
  input:
    state_code: KS
    age: 40
    ks_liheap_self_employment_gross_income: 0
    ks_liheap_self_employment_expenses: 0
    self_employment_income: 5000
  output:
    ks_liheap_countable_self_employment_income: 0
    ks_liheap_countable_earned_income: 0
