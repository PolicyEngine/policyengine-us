# Kansas LIEAP annual heating benefit: one regular benefit per program year
# (KEESM 13310), equal to the matrix cell (KEESM 13410; KS_BenefitMatrix_2026
# at 80%, KS_BenefitMatrix_2025 at 100%) with the $130 minimum benefit applied
# as a floor (KS LIHEAP State Plan FY2026 2.6, #page=9). The FY2025 season
# minimum is $100 (KS LIHEAP State Plan FY2025 2.6, #page=9). Zero when
# ineligible.
# KEESM sections refer to the October 2024 and January 2026 editions:
# https://content.dcf.ks.gov/ees/KEESM/Robo10-24/Robo_10_01_24/ and
# https://content.dcf.ks.gov/ees/KEESM/Robo01-26/Robo_01_01_26/ (keesm<section>.htm).

- name: Case 1, other fuel trailer cell of 128 for a large family is raised to 130.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 30_000
      person2:
        age: 38
      person3:
        age: 12
      person4:
        age: 9
      person5:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        ks_tanf: 0
        heating_type: WOOD
        wood_expense: 1_200
        ks_liheap_dwelling_type: TRAILER_OTHER
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: KS
  output:
    # 2,500/mo -> 1,700 & over; matrix p.4 other (80%), Trailer/Other,
    # size 5+ = 128; max(128, 130) = 130
    ks_liheap: 130

- name: Case 2, cell just above the minimum is paid unchanged.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 9_600
      person2:
        age: 38
      person3:
        age: 12
      person4:
        age: 9
      person5:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        ks_tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: A
        ks_liheap_dwelling_type: TRAILER_OTHER
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: KS
  output:
    # 800/mo -> 0-899; matrix p.1 (80%) tier A, Trailer/Other, size 5+ = 138;
    # max(138, 130) = 138
    ks_liheap: 138

- name: Case 3, home with no heating receives nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 9_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NONE
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    ks_liheap_eligible: false
    ks_liheap: 0

- name: Case 4, negative self-employment income does not inflate the benefit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        self_employment_income: -60_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: E
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # The business loss is floored at zero in countable earned income, so
    # countable income is 0 and the household falls in the lowest income band
    # (0-899): matrix p.1 (80%) tier E, House, size 1-4 = 709.
    ks_liheap: 709

- name: Case 5, FY2025 natural gas trailer cell of 112 is above the 100 minimum and unchanged.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 21_600
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: A
        ks_liheap_dwelling_type: TRAILER_OTHER
        snap: 0
        ks_tanf: 0
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    # KS_BenefitMatrix_2025.pdf p.1 (100%) 1,700 & over tier A, Trailer/Other,
    # size 1-4 = 112; max(112, 100) = 112 (would be 130 under the FY2026
    # minimum, KS LIHEAP State Plan FY2025 2.6, #page=9 gives $100).
    ks_liheap: 112

# Case 6 evaluates seven SPM units in one simulation, including a Missouri
# unit that the Kansas mask must zero: FY2026 adjusted matrix cells
# (KS_BenefitMatrix_2026.pdf pages 1-4), the income limit (KEESM 13362) and
# the energy-vulnerability gate (KEESM 13340).
- name: Case 6, mixed households evaluate Kansas LIEAP in one vectorized simulation.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 9_600
      person2:
        age: 40
        employment_income: 22_000
      person3:
        age: 40
        employment_income: 21_600
      person4:
        age: 40
        employment_income: 12_000
      person5:
        age: 40
        employment_income: 30_000
      person6:
        age: 40
        employment_income: 12_000
      person7:
        age: 40
        employment_income: 9_600
    spm_units:
      gas:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: E
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
        ks_tanf: 0
      electric:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        ks_liheap_utility_rate_tier: E
        ks_liheap_dwelling_type: APARTMENT
        ks_tanf: 0
      propane:
        members: [person3]
        heating_type: PROPANE
        bottled_gas_expense: 1_200
        ks_liheap_utility_rate_tier: A
        ks_liheap_dwelling_type: TRAILER_OTHER
        ks_tanf: 0
      wood:
        members: [person4]
        heating_type: WOOD
        wood_expense: 1_200
        ks_liheap_utility_rate_tier: J
        ks_liheap_dwelling_type: DUPLEX
        ks_tanf: 0
      over_limit:
        members: [person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: B
        ks_liheap_dwelling_type: DUPLEX
        ks_tanf: 0
      free_wood:
        members: [person6]
        heating_type: WOOD
        wood_expense: 0
        ks_liheap_utility_rate_tier: A
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
        ks_tanf: 0
      missouri:
        members: [person7]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        ks_liheap_utility_rate_tier: E
        ks_liheap_dwelling_type: HOUSE_MODULAR_MOBILE
        ks_tanf: 0
    households:
      gas:
        members: [person1]
        state_code: KS
      electric:
        members: [person2]
        state_code: KS
      propane:
        members: [person3]
        state_code: KS
      wood:
        members: [person4]
        state_code: KS
      over_limit:
        members: [person5]
        state_code: KS
      free_wood:
        members: [person6]
        state_code: KS
      missouri:
        members: [person7]
        state_code: MO
  output:
    spm_units:
      gas:
        ks_liheap_eligible: true
        ks_liheap: 709
      electric:
        ks_liheap_eligible: true
        ks_liheap: 365
      propane:
        ks_liheap_eligible: true
        ks_liheap: 130
      wood:
        ks_liheap_eligible: true
        ks_liheap: 431
      over_limit:
        ks_liheap_eligible: false
        ks_liheap: 0
      free_wood:
        ks_liheap_eligible: false
        ks_liheap: 0
      missouri:
        ks_liheap_eligible: false
        ks_liheap: 0
