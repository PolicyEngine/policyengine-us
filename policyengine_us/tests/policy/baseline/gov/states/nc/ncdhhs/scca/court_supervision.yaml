- name: NC ordinary child remains eligible.
  period: 2026
  input:
    state_code: NC
    age: 12
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    nc_scca_child_age_eligible: true

- name: NC older child needs an exception.
  period: 2026
  input:
    state_code: NC
    age: 13
    is_under_court_supervision: false
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    nc_scca_child_age_eligible: false

- name: NC court supervision at the lower boundary.
  period: 2026
  input:
    state_code: NC
    age: 13
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    nc_scca_child_age_eligible: true

- name: NC court supervision at the upper boundary.
  period: 2026
  input:
    state_code: NC
    age: 17
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
    nc_scca_child_age_eligible: true

- name: NC court supervision does not override the upper age limit.
  period: 2026
  input:
    state_code: NC
    age: 18
    is_under_court_supervision: true
    is_disabled: false
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
  output:
