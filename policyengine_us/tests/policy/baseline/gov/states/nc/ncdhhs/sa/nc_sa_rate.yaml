# SA-3220 II.A-B: the published basic and enhanced rates, or the lower rate a
# facility actually charges an SA resident. In-home payments use the published
# rate.
# PDF pages 204-205
# https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-Manual-Rev-June-2026.pdf#page=204
- name: Case 1, adult care home uses the published basic rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: ADULT_CARE_HOME
  output:
    nc_sa_rate: 1_397

- name: Case 2, special care unit uses the published enhanced rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: SPECIAL_CARE_UNIT
  output:
    nc_sa_rate: 1_792

- name: Case 3, enhanced in-home care uses the published enhanced rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: IN_HOME_ENHANCED
  output:
    nc_sa_rate: 1_792

- name: Case 4, lower contracted adult care home rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: ADULT_CARE_HOME
    nc_sa_facility_rate: 1_000
  output:
    nc_sa_rate: 1_000

- name: Case 5, contracted rate above the published basic rate is capped.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: ADULT_CARE_HOME
    nc_sa_facility_rate: 2_000
  output:
    nc_sa_rate: 1_397

- name: Case 6, lower contracted special care unit rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: SPECIAL_CARE_UNIT
    nc_sa_facility_rate: 1_500
  output:
    nc_sa_rate: 1_500

- name: Case 7, in-home care ignores a contracted facility rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: IN_HOME
    nc_sa_facility_rate: 1_000
  output:
    nc_sa_rate: 1_397

# G.S. 108A-42.1(a)-(b) applies the federally approved Social Security COLA,
# which is 3.6% in 2027, to the published 2026 rates $1,397 and $1,792.
# These are derived rates, pending a 2027 state rate notice.
# https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_108A/GS_108A-42.1.html
# https://www.ssa.gov/news/en/cola/factsheets/2027.html
# https://policies.ncdhhs.gov/wp-content/uploads/EFS-SA-CN-01-2026.pdf#page=1
- name: Case 8, 2027 basic rate uses the federally approved 3.6 percent COLA.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: ADULT_CARE_HOME
  output:
    # round(1,397 * 1.036) = 1,447; the raw CPI ratio would give 1,448.
    nc_sa_rate: 1_447

- name: Case 9, 2027 enhanced rate uses the federally approved 3.6 percent COLA.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: SPECIAL_CARE_UNIT
  output:
    # round(1,792 * 1.036) = 1,857.
    nc_sa_rate: 1_857
