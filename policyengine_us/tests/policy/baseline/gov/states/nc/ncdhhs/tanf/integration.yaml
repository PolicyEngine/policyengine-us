- name: Single parent with five children and $598 monthly earnings receives $1,586.70 per year.
  period: 2026
  input:
    people:
      parent:
        age: 30
        employment_income: 7_176
      child1:
        age: 15
      child2:
        age: 12
      child3:
        age: 9
      child4:
        age: 6
      child5:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child1, child2, child3, child4, child5]
    households:
      household:
        members: [parent, child1, child2, child3, child4, child5]
        state_code: NC
  output:
    # Countable earnings: 7_176 * (1 - 0.275) = 5_202.60 (433.55 a month)
    nc_tanf_countable_earned_income: 5_202.6
    # Need standard for 6: 698 * 12 = 8_376; 8_376 - 5_202.60 = 3_173.40
    nc_tanf_reduced_need_standard: 3_173.4
    nc_tanf_income_eligible: true
    # 0.5 * 3_173.40 = 1_586.70 (132.225 a month)
    nc_tanf: 1_586.7

