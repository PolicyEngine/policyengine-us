- name: Case 1, family of four (2 children, ages 0 & 3), no disabilities, monthly income below FPL, saving $1280/month.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        is_disabled: false
      person2:
        age: 35
        is_disabled: false
      child1:
        age: 0
        is_disabled: false
        is_tax_unit_dependent: true
      child2:
        age: 3
        is_disabled: false
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        nc_scca_countable_income: 51_99
        members: [person1, person2, child1, child2]
    households:
      household:
        members: [person1, person2, child1, child2]
        county_str: ALAMANCE_COUNTY_NC
        state_code: NC
  output:
    nc_scca_maximum_payment: 1_280

