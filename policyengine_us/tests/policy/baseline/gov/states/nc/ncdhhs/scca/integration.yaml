- name: Durham family of three, ages 7 and 4, income between 133% and 200% FPL, only the 4-year-old is served.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        is_disabled: false
        employment_income: 42_000
        child_support_received: 12_000
      child1:
        age: 7
        is_disabled: false
        is_tax_unit_dependent: true
      child2:
        age: 4
        is_disabled: false
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, child1, child2]
        spm_unit_pre_subsidy_childcare_expenses: 36_000
    households:
      household:
        members: [person1, child1, child2]
        county_str: DURHAM_COUNTY_NC
        state_code: NC
  output:
    # $3_500 wages + $1_000 child support = $4_500/mo; 2026 FPG for 3 = 2_276.67/mo.
    nc_scca_countable_income: 4_500
    nc_scca_child_income_eligible: [false, false, true]
    nc_scca_entry_eligible: true
    nc_scca_parent_fee: 450
    nc_scca_maximum_payment: 717
    # Expenses 3_000/mo - 450 fee = 2_550 > 717, so the market-rate cap binds.
    nc_scca: 717

