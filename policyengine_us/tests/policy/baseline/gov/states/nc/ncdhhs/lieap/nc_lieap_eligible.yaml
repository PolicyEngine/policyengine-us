- name: Case 5, a disabled member not served by DAAS does not get the special income limit.
  # EP-300.09 (page 10): the 150% limit needs a member aged 60 or over or a
  # disabled person receiving DAAS services. 22_200 / 12 = $1,850 a month is
  # over the $1,695 regular limit for one person (page 14).
  period: 2026
  input:
    state_code: NC
    age: 59
    is_disabled: true
    nc_lieap_income: 22_200
    nc_lieap_gross_income_person: 0
    tanf: 0
    heating_type: NATURAL_GAS
    heating_expense: 1_000
  output:
    nc_lieap_eligible: false
- name: Case 6, large resources do not affect eligibility during the FY2026 waiver.
  # EP-300.11 (page 17): resources are not countable from July 1, 2025 through
  # June 30, 2026.
  period: 2026
  input:
    state_code: NC
    age: 40
    bank_account_assets: 100_000
    nc_lieap_nonbank_resources: 100_000
    nc_lieap_income: 0
    nc_lieap_gross_income_person: 0
    tanf: 0
    heating_type: ELECTRICITY
    heating_expense: 1_000
  output:
    nc_lieap_eligible: true
- name: Case 7, the resource limits apply again in FY2027.
  # EP-300.11 (page 18): the waiver ends June 30, 2026. The limit is $4,500
  # with a member aged 60 or older or disabled and $3,000 otherwise.
  period: 2027
  input:
    state_code: [NC, NC, NC, NC]
    age: [40, 40, 60, 60]
    bank_account_assets: [3_000, 3_001, 4_500, 4_501]
    nc_lieap_income: [0, 0, 0, 0]
    nc_lieap_gross_income_person: [0, 0, 0, 0]
    tanf: [0, 0, 0, 0]
    heating_type: [PROPANE, PROPANE, PROPANE, PROPANE]
    heating_expense: [1_000, 1_000, 1_000, 1_000]
  output:
    nc_lieap_eligible: [true, false, true, false]
- name: Case 8, FY2027 income limits for one person, regular and special.
  # EP-300 pages 14-15: one eligible member has a limit of $1,729 at 130%
  # (page 14) and $1,995 at 150% (page 15), from the 2026 guideline
  # of $15,960. 20_748 / 12 = $1,729 and 20_760 / 12 = $1,730;
  # 23_940 / 12 = $1,995 and 23_952 / 12 = $1,996.
  period: 2027
  input:
    state_code: [NC, NC, NC, NC]
    age: [40, 40, 60, 60]
    nc_lieap_income: [20_748, 20_760, 23_940, 23_952]
    nc_lieap_gross_income_person: [0, 0, 0, 0]
    tanf: [0, 0, 0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    heating_expense: [1_000, 1_000, 1_000, 1_000]
  output:
    nc_lieap_eligible: [true, false, true, false]

