  # EP-300.11 expressly counts ineligible aliens' resources: $2,000 + $1,001.
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        bank_account_assets: 2_000
        nc_lieap_gross_income_person: 0
      person2:
        age: 40
        immigration_status: UNDOCUMENTED
        nc_lieap_nonbank_resources: 1_001
        nc_lieap_gross_income_person: 0
    spm_units:
      spm_unit:
