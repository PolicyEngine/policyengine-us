- name: Case 11, an excluded member's resources count in the household resource test.
  # EP-300.11 (page 18) expressly counts ineligible aliens' resources:
  # $2,000 + $1,001 = $3,001, over the $3,000 limit.
  period: 2027
  input:
    people:
      person1:
        age: 40
        immigration_status: CITIZEN
        bank_account_assets: 2_000
        nc_lieap_gross_income_person: 0
      person2:
        age: 40
        immigration_status: UNDOCUMENTED
        nc_lieap_nonbank_resources: 1_001
        nc_lieap_gross_income_person: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        nc_lieap_income: 0
        tanf: 0
        heating_type: ELECTRICITY
        heating_expense: 100
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_lieap_eligible: false

- name: Case 12, a DAAS-disabled member gives the higher resource limit.
  # EP-300.11 (page 18): $4,500 with a member aged 60 or older or disabled.
  period: 2027
  input:
    state_code: [NC, NC]
    age: [40, 40]
    nc_lieap_is_daas_disabled: [true, true]
    is_usda_disabled: [false, false]
    nc_lieap_income: [0, 0]
    nc_lieap_gross_income_person: [0, 0]
    tanf: [0, 0]
    heating_type: [KEROSENE, KEROSENE]
    heating_expense: [100, 100]
    bank_account_assets: [4_500, 4_501]
  output:
    nc_lieap_eligible: [true, false]

- name: Case 13, excluded parent's wages pass the prorated net test but fail the unprorated gross test.
  # EP-300.10 A.2.b (page 15): count all of a non-qualified member's income in
  # the manual gross income test at the eligible household size, before any
  # proration; if it exceeds the limit, deny. Two of three members are eligible.
  # Limit, size 2: (15_650 + 5_500) x 1.3 = 27_495 a year; 27_495 / 12 = 2,291.25,
  #   rounded to $2,291 a month (EP-300 page 14).
  # Gross test: 36_000 / 12 = $3,000 > $2,291 -> fails.
  # Net test, taken alone, passes: 36_000 x 2/3 = 24_000 prorated (page 16);
  #   $2,000 a month is over $400, so the work deduction is 20% = $400;
  #   net $1,600 a month <= $2,291. nc_lieap_income = 1_600 x 12 = 19_200.
  # Only the gross test makes this household ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 36_000
        immigration_status: UNDOCUMENTED
        ssi: 0
      person2:
        age: 38
        ssi: 0
      person3:
        age: 10
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 0
        childcare_expenses: 0
        heating_type: NATURAL_GAS
        gas_expense: 1_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: NC
  output:
    nc_lieap_household_size: 2
    nc_lieap_gross_income_person: [36_000, 0, 0]
    nc_lieap_income: 19_200
    nc_lieap_income_limit: 27_495
    has_heating_expense: true
    nc_lieap_eligible: false
    nc_lieap: 0

- name: Case 14, a disabled member not served by DAAS gets the higher resource limit but the regular income limit.
  # EP-300.11 (page 18): $4,500 for "households with member aged 60 or older
  # or disabled", $3,000 for all others. The 150% income limit instead needs
  # a member aged 60 or over or a disabled person receiving DAAS services
  # (EP-300.09, page 10), so these one-person households keep the 130% limit.
  # Social Security disability of $1,300 a month = 15_600. Standard medical
  # deduction for a disability payment recipient: 85 x 12 = 1_020 (page 13).
  # nc_lieap_income = 15_600 - 1_020 = 14_580, or $1,215 a month.
  # Limit, one member: 15_960 x 1.3 = 20_748 a year -> $1,729 a month (page
  # 14); $1,215 <= $1,729.
  # Household 1: $4,500 in the bank <= $4,500 -> eligible.
  # Household 2: $4,501 in the bank > $4,500 -> ineligible.
  period: 2027
  input:
    state_code: [NC, NC]
    age: [40, 40]
    is_usda_disabled: [true, true]
    nc_lieap_is_daas_disabled: [false, false]
    social_security_disability: [15_600, 15_600]
    ssi: [0, 0]
    tanf: [0, 0]
    childcare_expenses: [0, 0]
    bank_account_assets: [4_500, 4_501]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_000, 1_000]
  output:
    nc_lieap_income: [14_580, 14_580]
    nc_lieap_income_limit: [20_748, 20_748]
    nc_lieap_eligible: [true, false]

- name: Case 15, a household that pays no heating bill and does not have heat in rent is not vulnerable.
  # EP-300.08 (page 9): a household is vulnerable if it has a heating source
  # billed separately. Item 3: a private living arrangement with no separate
  # bill from the energy provider is not vulnerable. Heat is not included in
  # the rent, so the public housing rule in item 4 does not apply.
  # Wages: $12.00 an hour x 25 hours x 52 weeks = 15_600, or $1,300 a month.
  # Work deduction: over $400 a month -> 20% = $260 (page 13).
  # nc_lieap_income = (1_300 - 260) x 12 = 12_480, or $1,040 a month.
  # Limit, one member: 15_650 x 1.3 = 20_345 a year -> $1,695 a month (page
  # 14); $1,040 <= $1,695, so income does not decide the result.
  # Household 1 pays nothing for natural gas -> not vulnerable -> ineligible.
  # Household 2 pays $900 a year -> vulnerable -> eligible. The lower band for
  # one member ends at $848 (page 19); $1,040 is above it -> $300.
  period: 2026
  input:
    state_code: [NC, NC]
    age: [45, 45]
    employment_income: [15_600, 15_600]
    ssi: [0, 0]
    tanf: [0, 0]
    childcare_expenses: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [0, 900]
    heat_expense_included_in_rent: [false, false]
  output:
    nc_lieap_income: [12_480, 12_480]
    has_heating_expense: [false, true]
    nc_lieap_eligible: [false, true]
    nc_lieap: [0, 300]
