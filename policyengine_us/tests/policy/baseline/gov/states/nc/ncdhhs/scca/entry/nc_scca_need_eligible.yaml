# 10A NCAC 10 .0905 and Subsidized Child Care Assistance Program Policy Manual, Chapter 5.
- name: Case 1, single parent with wages has a need for care.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 20_000
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NC
  output:
    nc_scca_need_eligible: true

- name: Case 2, single parent with no activity has no need for care.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NC
  output:
    nc_scca_need_eligible: false

