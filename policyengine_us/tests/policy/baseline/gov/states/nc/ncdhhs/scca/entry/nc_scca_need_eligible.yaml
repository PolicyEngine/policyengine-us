- name: Case 20, a working parent with an eligible child receives the subsidy through the full pipeline.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        employment_income: 30_000
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NC
        county_str: WAKE_COUNTY_NC
  output:
    nc_scca_need_eligible: true
    nc_scca_entry_eligible: true
    # $1,000 a month less the 10% fee on $2,500, which the $1,256 market rate leaves uncapped.
    nc_scca: 750

- name: Case 21, the same family with the same income from a pension receives nothing.
  period: 2026-01
  input:
    people:
      parent:
        age: 30
        pension_income: 30_000
      child:
        age: 3
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NC
        county_str: WAKE_COUNTY_NC
  output:
    nc_scca_need_eligible: false
    nc_scca_entry_eligible: false
    nc_scca: 0
