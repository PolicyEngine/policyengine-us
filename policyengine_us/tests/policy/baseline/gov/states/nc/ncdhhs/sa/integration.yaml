- name: Case 1, two in home recipients.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        nc_sa_care_setting: IN_HOME
      person2:
        age: 65
        nc_sa_care_setting: IN_HOME
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # Joint claim with no income: couple FBR 1,491 / 2 = 745.50 each.
    ssi: [745.5, 745.5]
    # Own income 0 + SSI 745.50; in-home budgets keep the couple amount.
    nc_sa_countable_income: [745.5, 745.5]
    # Both receive SSI; TCMI 745.50 < 1,466.51.
    nc_sa_eligible: [true, true]
    # In-home basic payments use the published basic rate.
    nc_sa_rate: [1_397, 1_397]
    # 1,397 + 70 - 745.50 = 721.50 -> 722.
    nc_sa: [722, 722]

- name: Case 2, one in home recipient with spouse income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        nc_sa_care_setting: IN_HOME
      person2:
        age: 65
        social_security_retirement: 14_400
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # Joint claim: (1,200 - 20) / 2 = 590 countable each; 745.50 - 590 = 155.50.
    ssi: [155.5, 155.5]
    # person1: own income 0 + SSI 155.50.
    # person2: 1,200 - 20 = 1,180 + SSI 155.50 = 1,335.50.
    nc_sa_countable_income: [155.5, 1_335.5]
    # person2 has no approved care setting.
    nc_sa_eligible: [true, false]
    nc_sa_rate: [1_397, 1_397]
    # 1,397 + 70 - 155.50 = 1,311.50 -> 1,312.
    nc_sa: [1_312, 0]

# person2 earns North Carolina's May 2023 median wage, $21.85 an hour
# (BLS OEWS, all occupations), full time: 21.85 * 2,080 = $45,448 a year.
# https://www.bls.gov/oes/2023/may/oes_nc.htm
- name: Case 3, ineligible spouse income is not directly counted.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        nc_sa_care_setting: IN_HOME
      person2:
        age: 40
        employment_income: 45_448
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # SSI deems the ineligible spouse's 45,448 / 12 = 3,787.33 a month:
    # (3,787.33 - 20 - 65) / 2 = 1,851.17 > 1,491 couple FBR, so SSI is 0.
    ssi: [0, 0]
    # SA counts only the applicant's own income (budget unit of one).
    # person2: (3,787.33 - 85) / 2 = 1,851.17.
    nc_sa_countable_income: [0, 1_851.17]
    # person1: aged citizen with own resources 0 <= 2,000 and TCMI 0.
    nc_sa_eligible: [true, false]
    nc_sa_rate: [1_397, 1_397]
    # 1,397 + 70 - 0 = 1,467.
    nc_sa: [1_467, 0]

- name: Case 4, annual in home benefit and SNAP income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: IN_HOME
  output:
    # 994 * 12 = 11,928.
    ssi: 11_928
    # Own income 0 + SSI 994 = 994 a month; 994 * 12 = 11,928.
    nc_sa_countable_income: 11_928
    nc_sa_eligible:
      2026-01: true
    # 1,397 * 12 = 16,764.
    nc_sa_rate: 16_764
    # (1,397 + 70 - 994) * 12 = 473 * 12 = 5,676.
    nc_sa: 5_676
    household_state_benefits: 5_676
    # SSI 11,928 + SA 5,676 = 17,604.
    snap_unearned_income: 17_604
    # SSI 11,928 + SA 5,676 + the SNAP minimum benefit (24 * 9 + 25 * 3 = 291).
    spm_unit_benefits: 17_895

- name: Case 5, in home household reduction exception.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: IN_HOME
    ssi_lives_in_another_persons_household: true
    ssi_receives_shelter_from_others_in_household: true
    ssi_others_pay_all_meals: true
  output:
    # One-third reduction: 994 * (1 - 1/3) = 662.67.
    ssi_amount_if_eligible: 662.67
    ssi: 662.67
    # In-home budgets keep the reduced SSI (SA-3210 V.D.1.e(3)): 0 + 662.67.
    nc_sa_countable_income: 662.67
    nc_sa_eligible: true
    nc_sa_rate: 1_397
    # 1,397 + 70 - 662.67 = 804.33 -> 804.
    nc_sa: 804

- name: Case 6, ongoing individual facility month after the two-month admission window budgets the full federal rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: ADULT_CARE_HOME
    ssi_lives_in_another_persons_household: true
    ssi_receives_shelter_from_others_in_household: true
    ssi_others_pay_all_meals: true
  output:
    # One-third reduction: 994 * (1 - 1/3) = 662.67.
    ssi_amount_if_eligible: 662.67
    ssi: 662.67
    # Individual facility budget uses max(662.67, 994 - 0) = 994.
    nc_sa_countable_income: 994
    nc_sa_eligible: true
    nc_sa_rate: 1_397
    # 1,397 + 70 - 994 = 473.
    nc_sa: 473

- name: Case 7, North Carolina in-home assistance counts for SNAP and is excluded for HUD.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_care_setting: IN_HOME
  output:
    # 994 * 12 = 11,928.
    ssi: 11_928
    nc_sa_countable_income: 11_928
    nc_sa_eligible:
      2026-01: true
    nc_sa_rate: 16_764
    # 473 * 12 = 5,676.
    nc_sa: 5_676
    # SAIH payments are excluded for HUD (SA-5400 III).
    nc_sa_countable_for_hud: 0
    # SSI 11,928 + SA 5,676 = 17,604.
    snap_unearned_income: 17_604
    # SSI 11,928 + SA 0 = 11,928.
    hud_unearned_income: 11_928

# SSA treats spouses as individuals once they no longer live in the same
# household on the first day of the month (20 CFR 416.1801(c); POMS SI
# 00501.154 A.1), so a facility resident whose spouse stays at home is entered
# in a separate marital unit after the month of entry. SA then budgets the
# resident at the individual FBR (SA-3210 V.D.1.e).
# https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-Manual-Rev-June-2026.pdf#page=195
- name: Case 8, adult care home resident whose spouse stays at home after the month of entry.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        nc_sa_care_setting: ADULT_CARE_HOME
      person2:
        age: 68
    marital_units:
      resident:
        members: [person1]
      spouse:
        members: [person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # Separate claims with no income: the individual FBR of 994 each.
    ssi: [994, 994]
    nc_sa_countable_income: [994, 994]
    # 1,397 + 70 - 994 = 473; person2 has no approved care setting.
    nc_sa: [473, 0]

# A married SAIH applicant whose couple income is at or above the couple FBR
# need not apply for SSI (SA-3210 V.E.4.c), and SA is computed on countable
# income when SSI is denied for spousal income (SA-5400 V). The SSI take-up
# input therefore does not matter.
# https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-Manual-Rev-June-2026.pdf#page=198
# https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-In-Home-Program-Manual-Rev-June-2026.pdf#page=48
# person2 earns North Carolina's May 2023 median wage, as in Case 3.
- name: Case 9, applicant denied SSI for spousal income does not need SSI take-up.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        nc_sa_care_setting: IN_HOME
        takes_up_ssi_if_eligible: false
      person2:
        age: 40
        employment_income: 45_448
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # Deemed income leaves no SSI: (3,787.33 - 85) / 2 = 1,851.17 > 1,491.
    uncapped_ssi: [-360.17, 0]
    ssi: [0, 0]
    nc_sa_eligible: [true, false]
    # 1,397 + 70 - 0 = 1,467.
    nc_sa: [1_467, 0]
