# SA-3220 II.E, III.C and IV.A: an applicant whose full-month payment rounds to
# $0 is ineligible, including in a prorated first month.
# Cases 29-32 enter TCMI directly at the last eligible cent and at the cutoff.
# https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-Manual-Rev-June-2026.pdf#page=207
- name: Case 27, income-ineligible basic entrant receives no partial-month grant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    social_security_retirement: 36_000
    nc_sa_care_setting: ADULT_CARE_HOME
    nc_sa_partial_month_days: 15
  output:
    nc_sa: 0

- name: Case 28, income-ineligible basic entrant receives no full-month grant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    social_security_retirement: 36_000
    nc_sa_care_setting: ADULT_CARE_HOME
    nc_sa_partial_month_days: 31
  output:
    nc_sa: 0

- name: Case 29, basic last eligible cent retains the partial-month grant.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NC
    age: 65
    nc_sa_countable_income: 1_466.5
    nc_sa_care_setting: ADULT_CARE_HOME
    nc_sa_partial_month_days: 15
  output:
    # TCMI 1,466.50 is below the 1,466.51 basic cutoff.
    nc_sa_eligible: true
    # Per diem 1,397 / 31 = 45.0645 -> 45.06; 45.06 * 15 + 70 = 745.90 -> 746.
    nc_sa: 746

- name: Case 30, basic exact exclusive income limit prevents partial payment.
