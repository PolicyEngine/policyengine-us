# A lower rate or partial-month days entered for one resident leave the other
# resident, an unrelated adult, on the published rate and a full month.
- name: Case 25, contracted rate and partial month entered for one of two residents.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        nc_sa_care_setting: ADULT_CARE_HOME
        nc_sa_facility_rate: 1_000
        nc_sa_partial_month_days: 15
      person2:
        age: 72
        nc_sa_care_setting: ADULT_CARE_HOME
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_sa_rate: [1_000, 1_397]
    # person1: 1,000 / 31 = 32.26; 32.26 * 15 + 70 = 553.90 -> 554.
    # person2: SSI 994; 1,397 + 70 - 994 = 473.
    nc_sa: [554, 473]

