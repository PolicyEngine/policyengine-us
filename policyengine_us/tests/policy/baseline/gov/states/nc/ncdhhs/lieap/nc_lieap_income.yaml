        social_security: 0
      member1:
        age: 30
        ssi: 0
        social_security: 0
      member2:
        age: 30
        ssi: 0
        social_security: 0
    spm_units:
      unit:
        members: [adult, member1, member2]
        tanf: 0
        childcare_expenses: 0
        heating_expense: 1_000
