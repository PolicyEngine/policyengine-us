- name: Coal and wood use a fixed award for every income-eligible household
  # Fourth household: age 60, 20_352 / 12 = $1,696 a month, above the $1,695
  # regular limit but under the $1,956 special-population limit (EP-300 pages
  # 10 and 14), so it is income eligible and receives the flat $300 (page 20).
  period: 2_026
  input:
    state_code: [NC, NC, NC, NC]
    age: [40, 60, 60, 60]
    nc_lieap_eligible: [true, true, true, true]
    nc_lieap_household_size: [1, 1, 1, 1]
    nc_lieap_income: [0, 0, 20_340, 20_352]
    heating_type: [COAL, WOOD, WOOD, COAL]
  output:
    nc_lieap: [300, 300, 300, 300]
