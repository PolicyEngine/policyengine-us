    nc_lieap_income: [11_748, 15_876, 20_004, 24_120, 28_248, 32_376, 36_504, 40_620, 44_748, 48_876, 53_004]
    heating_type: [ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY, ELECTRICITY,
