- name: DAAS disability uses special payment bands and the fixed coal and wood award up to 150 percent
  # Special lower band ends at $978/month ($979 pays the next band). Coal and
  # wood pay the flat $300 to every income-eligible household: the special
  # population's limit is $1,956 (150% FPG), so $1,695 and $1,696 a month both
  # receive it (EP-300 pages 10, 18 and 20).
  period: 2026
  input:
    state_code: [NC, NC, NC, NC]
    age: [40, 40, 40, 40]
    nc_lieap_is_daas_disabled: [true, true, true, true]
    nc_lieap_eligible: [true, true, true, true]
    nc_lieap_household_size: [1, 1, 1, 1]
    nc_lieap_income: [11_736, 11_748, 20_340, 20_352]
    heating_type: [NATURAL_GAS, NATURAL_GAS, WOOD, COAL]
  output:
    nc_lieap: [400, 300, 300, 300]

- name: Case 8, coal and wood households are paid up to their own income limit and not above it.
  # Eligibility is computed here, not forced: the payment formula no longer
  # tests income, so the 130 or 150 percent limit comes only from
  # nc_lieap_eligible. One-person households on the 2025 guideline of $15,650.
  # Special population (age 62, wood): 15_650 x 1.5 = 23_475 a year;
  #   23_475 / 12 = 1,956.25, rounded to $1,956 a month (EP-300 pages 10, 14).
  #   23_472 / 12 = $1,956 -> eligible, flat $300 (page 20).
  #   23_484 / 12 = $1,957 -> ineligible, $0.
  # Regular (age 40, coal): 15_650 x 1.3 = 20_345 a year;
  #   20_345 / 12 = 1,695.42, rounded to $1,695 a month.
  #   20_340 / 12 = $1,695 -> eligible, flat $300.
  #   20_352 / 12 = $1,696 -> between 130 and 150 percent with no member aged
  #   60 or DAAS-disabled -> ineligible, $0.
  period: 2026
  input:
    state_code: [NC, NC, NC, NC]
    age: [62, 62, 40, 40]
    nc_lieap_income: [23_472, 23_484, 20_340, 20_352]
    nc_lieap_gross_income_person: [0, 0, 0, 0]
    tanf: [0, 0, 0, 0]
    heating_type: [WOOD, WOOD, COAL, COAL]
    wood_expense: [900, 900, 0, 0]
    coal_expense: [0, 0, 700, 700]
  output:
    nc_lieap_household_size: [1, 1, 1, 1]
    nc_lieap_income_limit: [23_475, 23_475, 20_345, 20_345]
    has_heating_expense: [true, true, true, true]
    nc_lieap_eligible: [true, false, true, false]
    nc_lieap: [300, 0, 300, 0]
