- name: Case 1, two in home recipients.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        nc_sa_care_setting: IN_HOME
      person2:
        age: 65
        nc_sa_care_setting: IN_HOME
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_sa: [722, 722]

