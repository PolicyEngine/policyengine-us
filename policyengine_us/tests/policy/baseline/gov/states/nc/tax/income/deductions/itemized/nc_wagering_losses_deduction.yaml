# N.C. Gen. Stat. 105-153.5(a)(2)e, added by S.L. 2026-41 section 44.2 for
# taxable years beginning on or after January 1, 2025: the wagering losses
# allowed under 26 U.S.C. 165(d), to the extent not deducted in arriving at
# AGI (Form D-400 Schedule A line 9 for 2025, per NCDOR's notice of July 23,
# 2026 and its FAQs of September 11, 2026).

- name: No deduction before 2025.
  period: 2024
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NC
  output:
    nc_wagering_losses_deduction: 0

- name: NCDOR example, losses above winnings are allowed up to the winnings.
  period: 2025
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NC
  output:
    # NCDOR notice: Jane Smith had $10,000 of winnings and $12,000 of losses,
    # was allowed $10,000 under section 165(d), and can include $10,000.
    nc_wagering_losses_deduction: 10_000

- name: Losses below winnings are deductible in full.
  period: 2025
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 4_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NC
  output:
    nc_wagering_losses_deduction: 4_000

- name: Spouses' winnings and losses are combined on a joint return.
  period: 2025
  input:
    people:
      head:
        age: 40
        gambling_winnings: 3_000
        gambling_losses: 5_000
      spouse:
        age: 40
        gambling_winnings: 4_000
        gambling_losses: 1_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: NC
  output:
    # Losses 6,000, allowed to the extent of winnings of 7,000.
    nc_wagering_losses_deduction: 6_000

- name: The deduction continues in 2026.
  period: 2026
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NC
  output:
    # Section 165(d) as amended by P.L. 119-21 section 70114 allows 90% of
    # losses, 10,800, to the extent of winnings: 10,000.
    nc_wagering_losses_deduction: 10_000

- name: From 2026 only 90% of losses count.
  period: 2026
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 8_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NC
  output:
    # P.L. 119-21 section 70114, in North Carolina's July 5, 2025 Code:
    # 0.9 * 8,000 = 7,200, below the 10,000 of winnings. Fails until the
    # federal deduction applies the 90% (PolicyEngine/policyengine-us#9637).
    nc_wagering_losses_deduction: 7_200

- name: A dependent's gambling is not on the parent's return.
  period: 2025
  input:
    people:
      head:
        age: 40
      child:
        age: 17
        gambling_winnings: 10_000
        gambling_losses: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: NC
  output:
    # Federal gross income leaves out dependents' income, so their wagering
    # losses cannot be deducted on the parent's return. Fails until the
    # federal deduction counts only the head and spouse.
    nc_wagering_losses_deduction: 0

- name: No deduction outside North Carolina.
  period: 2025
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: SC
  output:
    nc_wagering_losses_deduction: 0

- name: NCDOR example as a 2025 return, with the winnings in AGI.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
        # Wages plus the winnings, which section 61 and Schedule 1 line 8b
        # put in federal AGI.
        adjusted_gross_income: 70_000
        charitable_deduction: 5_000
    households:
      household:
        members: [head]
        state_code: NC
  output:
    # Schedule A: line 6 5,000 + line 9 10,000 = 15,000, above the 12,750
    # single standard deduction.
    nc_itemized_deductions: 15_000
    nc_taxable_income: 55_000
    # 55,000 * 4.25%.
    nc_income_tax: 2_337.50

- name: The same return in 2024 gets no wagering deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        gambling_winnings: 10_000
        gambling_losses: 12_000
    tax_units:
      tax_unit:
        members: [head]
        adjusted_gross_income: 70_000
        charitable_deduction: 5_000
    households:
      household:
        members: [head]
        state_code: NC
  output:
    nc_itemized_deductions: 5_000
    # The 12,750 standard deduction exceeds itemized deductions of 5,000.
    nc_taxable_income: 57_250
    # 57,250 * 4.5%.
    nc_income_tax: 2_576.25
