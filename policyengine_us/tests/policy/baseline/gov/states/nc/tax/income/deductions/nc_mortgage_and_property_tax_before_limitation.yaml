# Form D-400 Schedule A line 3: home mortgage interest (line 1) plus real
# estate property taxes (line 2), G.S. 105-153.5(a)(2)b.

- name: Mortgage interest plus real estate taxes within the federal cap
  period: 2024
  input:
    filing_status: JOINT
    home_mortgage_interest: 9_000
    real_estate_taxes: 4_000
    state_code: NC
  output:
    nc_mortgage_and_property_tax_before_limitation: 13_000

- name: Real estate taxes above the federal cap count only up to the cap
  period: 2024
  input:
    filing_status: SEPARATE
    home_mortgage_interest: 9_000
    real_estate_taxes: 11_000
    state_code: NC
  output:
    # Section 164 allows $5,000 of these taxes on a separate return.
    nc_mortgage_and_property_tax_before_limitation: 14_000

- name: The amount before limitation is not capped at $20,000
  period: 2024
  input:
    filing_status: SINGLE
    home_mortgage_interest: 25_000
    state_code: NC
  output:
    nc_mortgage_and_property_tax_before_limitation: 25_000

# Line 1 is "the amount allowed as a deduction for interest paid or accrued
# during the taxable year under section 163(h) of the Code with respect to any
# qualified residence" (G.S. 105-153.5(a)(2)b; 2025 Form D-401, PDF page 20),
# so the 26 U.S.C. 163(h)(3) acquisition-debt limits apply: $750,000
# ($375,000 separate) for debt from 2018 or later, $1,000,000 ($500,000) for
# other debt from 2017 or earlier, and no dollar limit for grandfathered debt
# from 1987 or earlier (IRS Publication 936 (2025), Table 1). The expectations
# follow PolicyEngine's federal calculation, which uses the exact ratio; Table
# 1 line 14 rounds it to three places (for example $8,007 rather than $8,000
# for the mixed-vintage case below).

- name: Interest on debt above the federal limit is excluded
  period: 2025
  input:
    state_code: NC
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    # $40,000 x $750,000 / $1,500,000 = $20,000. Before the fix line 1 was
    # all $40,000.
    deductible_mortgage_interest: 20_000
    nc_mortgage_and_property_tax_before_limitation: 20_000

- name: Interest on debt within the federal limit is fully counted
  period: 2025
  input:
    state_code: NC
    filing_status: SINGLE
    home_mortgage_interest: 24_000
    real_estate_taxes: 3_000
    first_home_mortgage_balance: 600_000
    first_home_mortgage_origination_year: 2020
  output:
    nc_mortgage_and_property_tax_before_limitation: 27_000

- name: Grandfathered debt above $1,000,000 is fully counted
  period: 2025
  input:
    state_code: NC
    filing_status: JOINT
    home_mortgage_interest: 15_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 1986
  output:
    nc_mortgage_and_property_tax_before_limitation: 15_000

- name: Earlier debt of $750,000 or more leaves no room under the later limit
  period: 2025
  input:
    state_code: NC
    filing_status: JOINT
    home_mortgage_interest: 17_000
    first_home_mortgage_balance: 900_000
    first_home_mortgage_origination_year: 2020
    second_home_mortgage_balance: 800_000
    second_home_mortgage_origination_year: 2016
  output:
    # Qualified loan limit = $800,000; $17,000 x $800,000 / $1,700,000.
    nc_mortgage_and_property_tax_before_limitation: 8_000

- name: Married filing separately uses the $375,000 limit
  period: 2025
  input:
    state_code: NC
    filing_status: SEPARATE
    home_mortgage_interest: 24_000
    first_home_mortgage_balance: 600_000
    first_home_mortgage_origination_year: 2020
  output:
    # $24,000 x $375,000 / $600,000.
    nc_mortgage_and_property_tax_before_limitation: 15_000

- name: The July 5, 2025 Code keeps the $750,000 limit in 2026
  period: 2026
  input:
    state_code: NC
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    # S.L. 2026-31 section 12(a) adopts the Code as of July 5, 2025, which
    # includes P.L. 119-21 section 70108's permanent $750,000 limit.
    nc_mortgage_and_property_tax_before_limitation: 20_000

# Qualified mortgage insurance premiums: North Carolina excludes them through
# 2021, and from 2026 the conformed federal deduction joins line 1 before the
# shared $20,000 cap.

- name: North Carolina excludes mortgage insurance premiums through 2021
  period: 2021
  input:
    state_code: NC
    adjusted_gross_income: 80_000
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    # 2021 D-401 p20, Schedule A line 1, excludes premiums explicitly.
    deductible_mortgage_insurance_premiums: 2_000
    nc_mortgage_and_property_tax_before_limitation: 0

- name: No federal or North Carolina premium deduction in 2022
  period: 2022
  input:
    state_code: NC
    adjusted_gross_income: 80_000
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    deductible_mortgage_insurance_premiums: 0
    nc_mortgage_and_property_tax_before_limitation: 0

- name: North Carolina conforms to the restored federal premiums in 2026
  period: 2026
  input:
    state_code: NC
    adjusted_gross_income: 80_000
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    # SL 2026-31 section 12(a) adopts the IRC as of July 5, 2025.
    # GS 105-153.5(a)(2)b limits the express premium exclusion to 2014-2021.
    deductible_mortgage_insurance_premiums: 2_000
    nc_mortgage_and_property_tax_before_limitation: 2_000

- name: North Carolina includes premiums after the federal AGI phase-out
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NC
    adjusted_gross_income: 100_001
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    # The first fraction of a $1,000 AGI increment reduces $2,000 by 10%.
    deductible_mortgage_insurance_premiums: 1_800
    nc_mortgage_and_property_tax_before_limitation: 1_800

- name: Restored premiums share North Carolina's 20000 mortgage and tax cap
  period: 2026
  input:
    state_code: NC
    adjusted_gross_income: 80_000
    home_mortgage_interest: 19_000
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    # With no balance reported, all $19,000 of interest is federally
    # deductible: $19,000 + $2,000 of premiums = $21,000, capped at $20,000.
    nc_mortgage_and_property_tax_before_limitation: 21_000
    nc_mortgage_and_property_tax_deduction: 20_000
