- name: Floor at 0
  period: 2023
  input:
    nc_income_tax_before_credits: 100
    nc_non_refundable_credits: 300
    nc_use_tax: 50
    state_code: NC
  output:
    nc_income_tax: 0

- name: NC income tax excludes use tax, Case 1
  period: 2023
  input:
    nc_income_tax_before_credits: 1_000
    nc_non_refundable_credits: 300
    nc_use_tax: 500
    state_code: NC
  output:
    nc_income_tax: 700

- name: NC income tax excludes use tax, Case 2
  period: 2023
  input:
    nc_income_tax_before_credits: 100
    nc_non_refundable_credits: 300
    nc_use_tax: 500
    state_code: NC
  output:
    nc_income_tax: 0

- name: The refundable claim of right payment can make North Carolina income tax negative
  period: 2025
  input:
    nc_income_tax_before_credits: 100
    nc_non_refundable_credits: 30
    nc_claim_of_right_payment: 500
    state_code: NC
  output:
    nc_income_tax_before_refundable_credits: 70
    nc_refundable_credits: 500
    nc_income_tax: -430
