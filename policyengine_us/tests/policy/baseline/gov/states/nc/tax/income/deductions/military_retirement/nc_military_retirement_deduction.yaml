- name: Military retirement pay, not eligible
  period: 2022
  input:
     military_retirement_pay: 30_000
     nc_military_retirement_deduction_eligible: true
     state_code: NC
  output:
    nc_military_retirement_deduction: 30_000

- name: Military retirement pay, is eligible
  period: 2022
  input:
     military_retirement_pay: 30_000
     nc_military_retirement_deduction_eligible: false
     state_code: NC
  output:
    nc_military_retirement_deduction: 0

# G.S. 105-153.5(b) allows only items included in the taxpayer's adjusted gross
# income, and (b)(5a)a. only the pay of a retired member with 20 years of
# service or a medical retirement. A tax unit dependent's pay is not in the
# filer's federal AGI (the dependent files their own return).

- name: A dependent's military retirement pay is not deducted from the filer's income.
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        # An elderly parent claimed as a qualifying relative.
        age: 80
        is_tax_unit_dependent: true
        years_in_military: 25
        military_retirement_pay: 4_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_military_retirement_deduction: 0

- name: The head's qualifying pay is deducted and the dependent's is not.
  period: 2025
  input:
    people:
      person1:
        age: 50
        years_in_military: 22
        military_retirement_pay: 20_000
      person2:
        age: 78
        is_tax_unit_dependent: true
        years_in_military: 20
        military_retirement_pay: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_military_retirement_deduction: 20_000

- name: A spouse's pay counts only if the spouse meets the service test.
  period: 2025
  input:
    people:
      person1:
        age: 50
        years_in_military: 20
        military_retirement_pay: 20_000
      person2:
        age: 48
        years_in_military: 4
        military_retirement_pay: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    # The spouse served 4 years and was not medically retired.
    nc_military_retirement_deduction: 20_000

# G.S. 105-153.5(b)(5a)b. also allows Survivor Benefit Plan payments to the
# beneficiary of a retired member who meets the (5a)a. test. Eligibility turns
# on the deceased member's service, recorded as
# nc_military_retirement_survivor_eligible, not on the beneficiary's own.

- name: A spouse's qualifying survivor benefits are deducted with the retiree's own pay.
  period: 2025
  input:
    people:
      person1:
        age: 50
        years_in_military: 20
        military_retirement_pay: 20_000
      person2:
        # A civilian spouse receiving Survivor Benefit Plan payments as the
        # beneficiary of a former spouse who retired after 20 years.
        age: 48
        military_retirement_pay: 10_000
        nc_military_retirement_survivor_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_military_retirement_deduction: 30_000

- name: Survivor benefits from a member who did not qualify are not deducted.
  period: 2025
  input:
    people:
      person1:
        age: 50
        years_in_military: 20
        military_retirement_pay: 20_000
      person2:
        age: 48
        military_retirement_pay: 10_000
        nc_military_retirement_survivor_eligible: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_military_retirement_deduction: 20_000

- name: A surviving spouse filing alone deducts qualifying survivor benefits recorded separately.
  period: 2025
  input:
    age: 70
    military_retirement_pay_survivors: 12_000
    nc_military_retirement_survivor_eligible: true
    state_code: NC
  output:
    nc_military_retirement_deduction: 12_000

- name: Survivor benefits recorded separately are not deducted without a qualifying member.
  period: 2025
  input:
    age: 70
    years_in_military: 20
    military_retirement_pay_survivors: 12_000
    nc_military_retirement_survivor_eligible: false
    state_code: NC
  output:
    # The filer's own service does not make another member's survivor
    # benefits deductible.
    nc_military_retirement_deduction: 0

- name: A dependent child's qualifying survivor benefits are not deducted from the filer's income.
  period: 2025
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
      person2:
        age: 12
        is_tax_unit_dependent: true
        military_retirement_pay_survivors: 6_000
        nc_military_retirement_survivor_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    nc_military_retirement_deduction: 0
