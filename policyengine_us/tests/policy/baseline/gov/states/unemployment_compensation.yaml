# unemployment_compensation follows
# calibration.gov.irs.soi.unemployment_compensation_per_capita, the IRS SOI
# total divided by population. An input dated in one year and read in a later
# year is multiplied by the ratio of that index between the two years.

- name: A 2021 input read in 2022 grows with SOI unemployment compensation per capita, into the added 2022 total.
  period: 2022
  absolute_error_margin: 0.01
  input:
    unemployment_compensation:
      2021: 10_000
  output:
    # IRS SOI Publication 1304 Table 1.4, all returns, unemployment
    # compensation, over calibration.gov.census.populations.total:
    #   2021: 208,872,354,000 / 338,039,000 = 617.8942
    #         (https://www.irs.gov/pub/irs-soi/21in14ar.xls)
    #   2022: 30,247,572,000 / 339,654,000 = 89.05407
    #         (https://www.irs.gov/pub/irs-soi/22in14ar.xls)
    # 10,000 x 89.05407 / 617.8942 = 1,441.25. With the old values this came to
    # 9,952.45.
    unemployment_compensation: 1_441.25
