# Integration tests for Texas SSI State Supplement
# Tests realistic scenarios with full eligibility and benefit calculations
#
# Key Texas SSI State Supplement rules:
# - Only for SSI recipients in Medicaid-funded nursing facilities or ICF/IID
# - Supplement = PNA - Federal reduced SSI benefit
# - 2024 PNA: $75/month, Federal reduced SSI: $30/month individual
# - Individual supplement: $45/month = $540/year
# - No additional state income rules beyond federal SSI
# - Each spouse of a couple in a facility receives the reduced benefit ($60
#   for the couple, H-6000), so each receives the supplement
# - Only people on SSI's reduced facility rate qualify (1 TAC 358.381(c)(2))
#
# Reference: 1 TAC 358.381(c)(2)
# Reference: Texas Human Resources Code Section 32.024(w)
# Reference: HHSC MEPD Handbook H-1500 and H-6000
# Reference: SSA State Assistance Programs for SSI Recipients - Texas

- name: Scenario 1, elderly SSI recipient in Texas Medicaid facility.
  # 70-year-old SSI recipient in a nursing facility receives state supplement
  period: 2024
  input:
    people:
      person1:
        age: 70
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Federal reduced SSI: $30/month * 12 = $360/year
    ssi: 360
    # Eligibility: SSI recipient + in Medicaid facility + TX = eligible
    tx_ssi_state_supplement_eligible: true
    # Supplement: ($75 PNA - $30 federal reduced SSI) * 12 = $540/year
    tx_ssi_state_supplement: 540

- name: Scenario 2, disabled SSI recipient in Texas Medicaid facility.
  # 45-year-old disabled SSI recipient in ICF/IID
  period: 2024
  input:
    people:
      person1:
        age: 45
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 360
    # Eligibility: SSI recipient + in Medicaid facility + TX = eligible
    tx_ssi_state_supplement_eligible: true
    # Supplement: ($75 - $30) * 12 = $540/year
    tx_ssi_state_supplement: 540

- name: Scenario 3, SSI recipient NOT in Medicaid facility.
  # SSI recipient living in community - no supplement
  period: 2024
  input:
    people:
      person1:
        age: 70
        is_in_medicaid_facility: false
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Not in Medicaid facility = not eligible
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 4, person in Medicaid facility but NOT an SSI recipient.
  # 50-year-old who is neither aged, blind nor disabled receives no SSI
  period: 2024
  input:
    people:
      person1:
        age: 50
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # No SSI = not eligible for supplement
    ssi: 0
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 5, SSI recipient in Medicaid facility in another state.
  # SSI recipient in facility but not in Texas
  period: 2024
  input:
    people:
      person1:
        age: 68
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Not in Texas = TX supplement does not apply (defined_for TX)
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 6, married SSI couple both in a Texas Medicaid facility.
  # Both spouses of a joint SSI claim live in a nursing facility. H-6000:
  # "SSA lowers the SSI payment standard to the reduced standard for a couple
  # ($60)", i.e. $30 for each spouse, and "HHSC supplements the reduced SSI
  # payment standard by $45 per month to ensure SSI recipients also have a $75
  # personal needs allowance."
  period: 2024
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 70
        is_tax_unit_spouse: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    ssi_claim_is_joint: [true, true]
    # Each spouse: $30/month * 12 = $360/year
    ssi: [360, 360]
    # Both spouses are eligible
    tx_ssi_state_supplement_eligible: [true, true]
    # Each person: ($75 - $30) * 12 = $540/year
    tx_ssi_state_supplement: [540, 540]

- name: Scenario 7, historical 2023 period with lower PNA.
  # Tests pre-2024 PNA of $60/month
  period: 2023
  input:
    people:
      person1:
        age: 75
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tx_ssi_state_supplement_eligible: true
    # 2023 PNA: $60/month, Federal reduced SSI: $30/month
    # Supplement: ($60 - $30) * 12 = $360/year
    tx_ssi_state_supplement: 360

- name: Scenario 8, historical 2005 period with $45 PNA.
  # Tests 2003-2005 PNA of $45/month (PNA dropped back from $60)
  period: 2005
  input:
    people:
      person1:
        age: 80
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tx_ssi_state_supplement_eligible: true
    # 2005 PNA: $45/month (set 2003-09-01), Federal reduced SSI: $30/month
    # Supplement: ($45 - $30) * 12 = $180/year
    tx_ssi_state_supplement: 180

- name: Scenario 9, facility resident whose spouse fails the SSI citizenship condition.
  # The undocumented tax-unit spouse receives no SSI (8 USC 1611, 1612), so
  # receives no Texas supplement. The citizen head still does.
  period: 2024
  input:
    people:
      person1:
        age: 72
        is_tax_unit_head: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 70
        immigration_status_str: UNDOCUMENTED
        is_tax_unit_spouse: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    ssi: [360, 0]
    tx_ssi_state_supplement_eligible: [true, false]
    tx_ssi_state_supplement: [540, 0]

- name: Scenario 10, facility resident above the SSI resource limit.
  # $3,000 of countable resources exceeds the $2,000 SSI limit, so the
  # person is not an SSI recipient and H-1500 gives no state supplement.
  period: 2024
  input:
    people:
      person1:
        age: 80
        ssi_countable_resources: 3_000
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 0
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 11, facility resident whose countable income equals the $30 reduced standard.
  # A $50/month pension less the $20 general exclusion is $30 of countable
  # income, so the federal payment is $30 - $30 = $0. H-6000: the resident
  # "remains eligible for SSI if their countable income does not exceed the
  # SSI reduced standard payment amount", and HHSC pays the $45 supplement.
  period: 2024
  input:
    people:
      person1:
        age: 80
        pension_income: 600
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 0
    tx_ssi_state_supplement_eligible: true
    # ($75 - $30) * 12 = $540/year
    tx_ssi_state_supplement: 540

- name: Scenario 12, facility resident whose countable income exceeds the $30 reduced standard.
  # A $51/month pension gives $31 of countable income, above the reduced
  # standard, so the resident is not eligible for SSI or the supplement.
  period: 2024
  input:
    people:
      person1:
        age: 80
        pension_income: 612
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 0
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 13, facility resident outside the SSI facility living arrangement with income at the full federal rate.
  # Only is_in_medicaid_facility is set, so SSI uses the $943 own-household
  # rate. A $963/month pension gives $943 of countable income: SSI is $0, and
  # the income is far above the $30 reduced standard that H-6000 applies to a
  # facility resident, so there is no supplement.
  period: 2024
  input:
    people:
      person1:
        age: 80
        pension_income: 11_556
        is_in_medicaid_facility: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 0
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0

- name: Scenario 14, facility resident whose ineligible spouse at home has a pension.
  # The resident (80) is on the $30 facility rate with no income; the spouse
  # (60, not disabled) lives at home with a $500/month pension. 20 CFR
  # 416.1163(f)(5): while the $30 rate applies, the spouse's income is not
  # deemed and only the resident's own countable income ($0) counts, so the
  # resident gets the $45 supplement.
  period: 2024
  input:
    people:
      person1:
        age: 80
        is_tax_unit_head: true
        is_in_medicaid_facility: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 60
        pension_income: 6_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    tx_ssi_state_supplement_eligible: [true, false]
    tx_ssi_state_supplement: [540, 0]

- name: Scenario 15, facility resident on SSI's full rate gets no supplement.
  # Only is_in_medicaid_facility is set, so SSI pays the $943 own-household
  # rate, as in the month of entry (H-6000). 1 TAC 358.381(c)(2) gives the
  # supplement only to a person "receiving the reduced SSI federal benefit
  # rate".
  period: 2024
  input:
    people:
      person1:
        age: 80
        is_in_medicaid_facility: true
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    ssi: 11_316
    tx_ssi_state_supplement_eligible: false
    tx_ssi_state_supplement: 0
