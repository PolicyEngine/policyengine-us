# Unit tests for Texas SSI State Supplement eligibility
# Eligible if: eligible for SSI with own countable income not over the $30
# reduced standard (a $0 federal payment at the limit included) and takes up
# SSI, or reported to receive SSI; AND on SSI's reduced medical facility rate;
# AND residing in a Medicaid-funded facility; AND in Texas
# Reference: 1 TAC 358.381(c)(2) ("For a person receiving the reduced SSI
# federal benefit rate, HHSC issues a supplement"); Texas Human Resources Code
# Section 32.024(w); HHSC MEPD Handbook
# H-1500 ("SSI recipients who live in an institutional setting and receive the
# $30 reduced federal benefit receive a state supplement") and H-6000 (an SSI
# recipient in a facility "remains eligible for SSI if their countable income
# does not exceed the SSI reduced standard payment amount")

- name: Case 1, SSI-eligible facility resident with no countable income.
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 0
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: true

- name: Case 2, SSI-eligible but not in Medicaid facility.
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 0
    is_in_medicaid_facility: false
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 3, not SSI eligible but in Medicaid facility.
  period: 2024
  input:
    is_ssi_eligible: false
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 4, neither SSI eligible nor in Medicaid facility.
  period: 2024
  input:
    is_ssi_eligible: false
    is_in_medicaid_facility: false
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 5, reported SSI receipt qualifies a facility resident.
  period: 2024-01
  input:
    is_ssi_eligible: false
    receives_ssi: true
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: true

- name: Case 6, countable income equal to the $30 reduced standard stays eligible.
  # $360/year = $30/month, so the federal payment is $0 (H-6000).
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 360
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: true

- name: Case 7, countable income above the $30 reduced standard is not eligible.
  # $372/year = $31/month.
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 372
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 8, a facility resident who does not take up SSI is not eligible.
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 0
    takes_up_ssi_if_eligible: false
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 9, no supplement for SSI recipients once SSI is abolished.
  period: 2024
  input:
    gov.ssa.ssi.abolish_ssi: true
    is_ssi_eligible: true
    ssi_countable_income: 0
    is_in_medicaid_facility: true
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 10, a facility resident still on SSI's full rate is not eligible.
  # Only is_in_medicaid_facility is set, so SSI pays the own-household rate,
  # as in the month of entry (H-6000); 1 TAC 358.381(c)(2) limits the
  # supplement to people receiving the reduced rate.
  period: 2024
  input:
    is_ssi_eligible: true
    ssi_countable_income: 0
    is_in_medicaid_facility: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false

- name: Case 11, reported SSI receipt on the full rate is not eligible.
  period: 2024-01
  input:
    receives_ssi: true
    is_in_medicaid_facility: true
    state_code: TX
  output:
    tx_ssi_state_supplement_eligible: false
