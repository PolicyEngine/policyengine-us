- name: Case 1, Greater Dallas BCY 2024 at the top of the more than 75% to 100% FPG range.
  period: 2024
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 24_864  # $2,072 a month
      person2:
        age: 3
        is_citizen_or_legal_immigrant: true
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_size: 3
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
        tx_ccs_workforce_board_region: DALLAS_COUNTY
  output:
    # The chart (policy S0408, change 5, effective as of 10.1.2016) charges $111 for the first child and $46 for the second.
    tx_ccs_board_copay:
      2024-03: 157

