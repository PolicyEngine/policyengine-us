- name: Case 1 - Low income family with childcare expenses below copay
  period: 2025-01
  input:
    people:
      parent1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 12_000  # Annual income ($1,000/month, <20% SMI)
      child1:
        age: 3
        is_disabled: false
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [parent1, child1]
        spm_unit_size: 2
        spm_unit_pre_subsidy_childcare_expenses: 240  # Annual childcare expense ($20/month)
    households:
      household:
        members: [parent1, child1]
        state_code: TX
  output:
    # Childcare expense ($20/month) < copay ($22.70, rate-based), so no benefit
    tx_ccs: 0

- name: Case 2 - Family with childcare expenses exceeding copay
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      parent1:
        age: 35
        weekly_hours_worked_before_lsr: 40
        employment_income: 30_000  # Annual income ($2,500/month, ~35% SMI)
      parent2:
        age: 32
        weekly_hours_worked_before_lsr: 40
      child1:
        age: 4
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1]
        spm_unit_size: 3
        spm_unit_pre_subsidy_childcare_expenses: 6_000  # Annual childcare expense ($500/month)
    households:
      household:
        members: [parent1, parent2, child1]
        state_code: TX
        county: DALLAS_COUNTY_TX
  output:
    # Max reimbursement (10 days × ~$41.60 BCY2025 expanded Dallas rate) ≈ $415.98
    # Expense ($500) is capped at $415.98, then copay (~$105.95) is deducted
    tx_ccs: 310.03

- name: Case 3 - Two children with high childcare expenses
  period: 2025-01
  input:
    people:
      parent1:
        age: 35
        weekly_hours_worked_before_lsr: 40
        employment_income: 48_000  # Annual income ($4,000/month, ~55% SMI)
      parent2:
        age: 32
        weekly_hours_worked_before_lsr: 40
      child1:
        age: 5
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 10
      child2:
        age: 2
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
        spm_unit_size: 4
        spm_unit_pre_subsidy_childcare_expenses: 15_600  # Annual childcare expense ($1,300/month)
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: TX
        county: DALLAS_COUNTY_TX
  absolute_error_margin: 0.5
  output:
    # Max reimbursement: ($40.20 × 10) + ($43.80 × 10) = $840
    # Expense ($1,300) is capped at $840, then copay (~$229.08) is deducted
    tx_ccs: 610.92

- name: Case 4 - Single parent with childcare expenses at maximum reimbursement
  period: 2025-01
  absolute_error_margin: 0.5
  input:
    people:
      parent1:
        age: 28
        weekly_hours_worked_before_lsr: 40
        employment_income: 24_000  # Annual income ($2,000/month, ~34% SMI for family size 2)
      child1:
        age: 1
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 22
        tx_ccs_payment_rate: 600  # Maximum reimbursement limit
    spm_units:
      spm_unit:
        members: [parent1, child1]
        spm_unit_size: 2
        spm_unit_pre_subsidy_childcare_expenses: 9_600  # Annual childcare expense ($800/month)
    households:
      household:
        members: [parent1, child1]
        state_code: TX
  output:
    # Expense ($800) capped at max rate ($600), then copay (~$84.21) deducted
    tx_ccs: 515.79

- name: Case 5 - Not eligible household means no benefit
  period: 2025-01
  input:
    people:
      parent1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 36_000
      teenager:
        age: 14  # Too old for CCS
        is_disabled: false
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [parent1, teenager]
        spm_unit_size: 2
        tx_ccs_eligible: false
        spm_unit_pre_subsidy_childcare_expenses: 1_200  # Annual childcare expense ($100/month)
    households:
      household:
        members: [parent1, teenager]
        state_code: TX
  output:
    tx_ccs: 0  # Not eligible for CCS

- name: Case 6 - Panhandle registered home preschool across the BCY24 to BCY25 boundary, zero copay
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 0  # No countable income, so no copay
      child1:
        age: 4
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 21
        tx_ccs_provider_type: RCCH
        tx_ccs_provider_rating: REG
        tx_ccs_care_schedule: FULL_TIME
    spm_units:
      spm_unit:
        members: [parent1, child1]
        spm_unit_pre_subsidy_childcare_expenses: 12_000  # $1,000/month, above both rates
    households:
      household:
        members: [parent1, child1]
        state_code: TX
        county: POTTER_COUNTY_TX  # Panhandle board
  output:
    # January to September 2024 (BCY24): $27.33/day * 21 days = $573.93/month
    # October to December 2024 (BCY25): $30.40/day * 21 days = $638.40/month
    # 9 * $573.93 + 3 * $638.40 = $7,080.57
    tx_ccs: 7_080.57

- name: Case 7 - Panhandle registered home preschool with a copay, either side of October 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 24_000  # $2,000/month
      child1:
        age: 4
        is_disabled: false
        is_citizen_or_legal_immigrant: true
        childcare_attending_days_per_month: 21
        tx_ccs_provider_type: RCCH
        tx_ccs_provider_rating: REG
        tx_ccs_care_schedule: FULL_TIME
    spm_units:
      spm_unit:
        members: [parent1, child1]
        spm_unit_pre_subsidy_childcare_expenses: 12_000  # $1,000/month
    households:
      household:
        members: [parent1, child1]
        state_code: TX
        county: POTTER_COUNTY_TX
  output:
    # Panhandle's scale charges $110 for one child from more than 30% to 40% of
    # SMI. September uses FY 2024 SMI for 2 people, $94,466 * 0.68 / 12 =
    # $5,353.07 a month, so that range runs from $1,607 to $2,141. October
    # uses FY 2025 SMI, $103,213 * 0.68 / 12 = $5,848.74, so it runs from
    # $1,756 to $2,339. $2,000 falls in it both months.
    # September (BCY24): $27.33 * 21 = $573.93 - $110 = $463.93
    # October (BCY25): $30.40 * 21 = $638.40 - $110 = $528.40
    tx_ccs_copay:
      2024-09: 110
      2024-10: 110
    tx_ccs:
      2024-09: 463.93
      2024-10: 528.40

