# BCY26 Alamo LCCC REG age 3: full time $43/day, part time $36.80/day.
# Age 4 blended: $36.91/day. BCY25 four-group preschool part time: $32.13/day.

- name: Case 1, reported short days select the part-time rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 3
    is_tax_unit_dependent: true
    state_code: TX
    tx_ccs_workforce_board_region: ALAMO
    childcare_attending_days_per_month: 20
    childcare_hours_per_day: 3
  output:
    tx_ccs_payment_rate: 736
    tx_ccs_payment_care_schedule: PART_TIME

- name: Case 2, weekly hours with known weekly days select the part-time rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 3
    is_tax_unit_dependent: true
    state_code: TX
    tx_ccs_workforce_board_region: ALAMO
    childcare_attending_days_per_month: 20
    childcare_hours_per_week: 15
    childcare_days_per_week: 5
  output:
    tx_ccs_payment_rate: 736
    tx_ccs_payment_care_schedule: PART_TIME

