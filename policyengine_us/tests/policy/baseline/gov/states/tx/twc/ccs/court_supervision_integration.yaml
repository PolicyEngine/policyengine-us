- name: TX approved child is paid without funding an unapproved sibling
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 240000
        tx_ccs_payment_rate: 0
      approved_child:
        age: 18
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        tx_ccs_dfps_authorized: true
        pre_subsidy_childcare_expenses: 4800
        childcare_hours_per_week: 40
        tx_ccs_payment_rate: 500
      sibling:
        age: 8
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 12000
        childcare_hours_per_week: 40
        tx_ccs_payment_rate: 500
    tax_units:
      unit:
        members: &id001
        - parent
        - approved_child
        - sibling
    spm_units:
      unit:
        members: *id001
        tx_ccs_income_eligible: false
        tx_ccs_work_requirement_eligible: false
    households:
      home:
        members: *id001
        state_code: TX
  output:
    tx_ccs_eligible_child:
    - false
    - true
    - true
    tx_ccs_eligible: true
    tx_ccs_copay: 0
    tx_ccs: 400
