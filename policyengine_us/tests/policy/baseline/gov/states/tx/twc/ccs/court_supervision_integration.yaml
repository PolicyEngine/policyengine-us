- name: TX approved child with expenses reported only at the SPM unit level
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 240000
      approved_child:
        age: 18
        is_tax_unit_dependent: false
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        tx_ccs_dfps_authorized: true
        childcare_hours_per_week: 40
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
        tx_ccs_provider_type: LCCC
        tx_ccs_provider_rating: REG
        tx_ccs_care_schedule: FULL_TIME
    tax_units:
      unit:
        members:
        - parent
        - approved_child
    spm_units:
      unit:
        members:
        - parent
        - approved_child
        spm_unit_pre_subsidy_childcare_expenses: 2400
        tx_ccs_income_eligible: false
        tx_ccs_work_requirement_eligible: false
    households:
      home:
        members:
        - parent
        - approved_child
        state_code: TX
        tx_ccs_workforce_board_region: DALLAS_COUNTY
  output:
    # The default person-level allocation only reaches children under 18,
    # so the 18-year-old's own expense is 0; the unattributed $2,400 / 12 =
    # $200 falls back to the authorized child, matching the person-level case.
    pre_subsidy_childcare_expenses:
    - 0
    - 0
    tx_ccs_eligible_child:
    - false
    - true
    tx_ccs_eligible: true
    tx_ccs_copay: 0
    tx_ccs: 200
