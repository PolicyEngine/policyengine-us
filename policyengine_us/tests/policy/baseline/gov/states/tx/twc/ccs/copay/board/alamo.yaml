- name: Case 1, Alamo BCY 2024 at the top of the more than 30% to 40% SMI range.
  period: 2024
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 31_740  # $2,645 a month
      person2:
        age: 3
        is_citizen_or_legal_immigrant: true
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_size: 3
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
        tx_ccs_workforce_board_region: ALAMO
  output:
    # The chart (Effective October 1, 2023 through September 30, 2024) charges $75 for the first child and $30 for the second.
    tx_ccs_board_copay:
      2024-03: 105

