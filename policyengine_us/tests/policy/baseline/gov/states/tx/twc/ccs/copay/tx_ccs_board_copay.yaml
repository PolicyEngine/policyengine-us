        employment_income: 31_740  # $2,645 a month
      person2:
        age: 3
        is_citizen_or_legal_immigrant: true
        tx_ccs_provider_rating: TRS3
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_size: 3
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
        tx_ccs_workforce_board_region: PANHANDLE
  output:
    # $155 (Case 1) * (1 - 30%) = $108.50
    tx_ccs_board_copay:
      2024-03: 108.5

