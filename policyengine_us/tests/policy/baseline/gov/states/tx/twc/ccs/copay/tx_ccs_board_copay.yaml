- name: Case 8, Panhandle from TX3C's launch uses the statewide scale.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 48_000  # $4,000 a month
      person2:
        age: 28
        weekly_hours_worked_before_lsr: 40
      person3:
        age: 3
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_size: 3
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
        tx_ccs_workforce_board_region: PANHANDLE
  output:
    # The Board scale no longer applies, so the statewide scale does. FY 2025
    # SMI for 3 people: 103,213 * 0.84 / 12 = $7,224.91 a month, so $4,000 is
    # 55.364% of SMI. First child: 2% + (55.364% - 1%) * (6.93% - 2%) /
    # (75% - 1%) = 5.6218%, and 5.6218% * $4,000 = $224.87.
    tx_ccs_board_copay:
      2025-01: 0
    tx_ccs_copay:
      2025-01: 224.87

