- name: Case 1, Panhandle BCY 2024, two children at the top of the 0% to 20% SMI range.
  period: 2024
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        employment_income: 15_876  # $1,323 a month
      person2:
        age: 3
        is_citizen_or_legal_immigrant: true
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_size: 3
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
        tx_ccs_workforce_board_region: PANHANDLE
  output:
    # 20% of FY 2024 SMI for 3 people: 0.2 * 94,466 * 0.84 / 12 = $1,322.52,
    # which TWC rounds to $1,323. The 0% to 20% range charges $30 for the
    # first child and $15 for the second.
    tx_ccs_board_copay:
      2024-03: 45
    tx_ccs_copay:
      2024-03: 45

