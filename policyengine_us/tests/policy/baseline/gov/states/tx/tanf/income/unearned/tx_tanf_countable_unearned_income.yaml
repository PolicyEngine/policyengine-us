- name: Case 1, unearned income with no child support deduction.
  period: 2025-01
  input:
    tx_tanf_gross_unearned_income: 300
    tx_tanf_child_support_deduction: 0
    state_code: TX
  output:
    tx_tanf_countable_unearned_income: 300
    # 300 - 0 = 300

- name: Case 2, unearned income with partial child support deduction.
  period: 2025-01
  input:
    tx_tanf_gross_unearned_income: 300
    tx_tanf_child_support_deduction: 50
    state_code: TX
  output:
    tx_tanf_countable_unearned_income: 250
    # 300 - 50 = 250

- name: Case 3, unearned income with $75 child support deduction.
  period: 2025-01
  input:
    tx_tanf_gross_unearned_income: 300
    tx_tanf_child_support_deduction: 75
    state_code: TX
  output:
    tx_tanf_countable_unearned_income: 225
    # 300 - 75 = 225

- name: Case 4, child support deduction exceeds unearned income.
  period: 2025-01
  input:
    tx_tanf_gross_unearned_income: 50
    tx_tanf_child_support_deduction: 75
    state_code: TX
  output:
    tx_tanf_countable_unearned_income: 0
    # max(50 - 75, 0) = 0

- name: Case 5, no unearned income.
  period: 2025-01
  input:
    tx_tanf_gross_unearned_income: 0
    tx_tanf_child_support_deduction: 0
    state_code: TX
  output:
    tx_tanf_countable_unearned_income: 0
    # 0 - 0 = 0

- name: Case 6, cash aid reported as financial assistance flows through to countable unearned income.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        financial_assistance: 2_400
      person2:
        age: 10
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 2,400 / 12 = 200 per month, no child support deduction
    tx_tanf_countable_unearned_income: 200

- name: Case 7, veterans benefits plus child support with the $75 deduction applied.
  period: 2025-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 30
        veterans_benefits: 6_000
        child_support_received: 1_200
      person2:
        age: 10
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 500 veterans + 100 child support - 75 deduction = 525 per month
    tx_tanf_countable_unearned_income: 525
