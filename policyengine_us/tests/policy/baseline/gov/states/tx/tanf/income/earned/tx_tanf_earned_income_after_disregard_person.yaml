# Conditional Part A arithmetic: no TANF receipt in any state in the preceding four months.
# Monthly gross earnings are $600; the work deduction is $120, with no other deductions.
# HHSC A-1425.2: (600 - 120) - (600 - 120) / 3 = 320. Eligibility/history are premises.
# https://fhb.hhs.texas.gov/handbooks/texas-works-handbook/a-1420-types-deductions
- name: Case 1, new applicant with low earnings gets 1/3 disregard.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    tx_tanf_gross_earned_income: 600
    is_tanf_enrolled: false
    state_code: TX
  output:
    tx_tanf_earned_income_after_disregard_person: 320

- name: Case 2, continuing recipient gets 90% disregard.
  period: 2025-01
  input:
    tx_tanf_gross_earned_income: 600
    is_tanf_enrolled: true
    state_code: TX
  output:
    tx_tanf_earned_income_after_disregard_person: 48

- name: Case 3, continuing recipient hits $1,400 disregard cap.
  period: 2025-01
  input:
    tx_tanf_gross_earned_income: 2_000
    is_tanf_enrolled: true
    state_code: TX
  output:
    tx_tanf_earned_income_after_disregard_person: 480

- name: Case 4, zero earnings.
  period: 2025-01
  input:
    tx_tanf_gross_earned_income: 0
    is_tanf_enrolled: false
    state_code: TX
  output:
    tx_tanf_earned_income_after_disregard_person: 0

