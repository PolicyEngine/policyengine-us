- name: Case 1, household in TX with income below 150% FPG is eligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    employment_income: 20_000
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 2, household in TX with income above both 150% FPG and 60% SMI is ineligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    # 150% FPG for HH of 4 = $46,800; 60% SMI ~ $56,680
    # Income must exceed both limits to be ineligible
    employment_income: 60_000
    spm_unit_size: 4
    state_code: TX
    is_snap_eligible: false
  output:
    tx_ceap_eligible: false

- name: Case 3, household in TX with zero income is eligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    employment_income: 0
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 4, household not in TX is ineligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    employment_income: 10_000
    spm_unit_size: 1
    state_code: CA
  output:
    tx_ceap_eligible: false

- name: Case 5, household at exactly 50% FPG is eligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    # 50% FPG for HH of 1 = $7,580 (FPG 2024 = $15,060 * 0.5)
    employment_income: 7_580
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 6, household in FY 2025 with income above 150% FPG but below 60% SMI is ineligible.
  absolute_error_margin: 0.1
  period: 2025
  input:
    # In FY 2025, only 150% FPG applies (SMI threshold removed)
    employment_income: 50_000
    spm_unit_size: 4
    state_code: TX
    is_snap_eligible: false
  output:
    tx_ceap_eligible: false

- name: Case 7, SNAP-eligible household above income limit is categorically eligible.
  absolute_error_margin: 0.1
  period: 2024
  input:
    employment_income: 80_000
    spm_unit_size: 1
    state_code: TX
    is_snap_eligible: true
  output:
    tx_ceap_eligible: true

- name: Case 8, aged household with low resources but income above the limit and no SSI payment is ineligible.
  absolute_error_margin: 0.1
  period: 2025
  input:
    age: 70
    immigration_status: CITIZEN
    employment_income: 100_000
    ssi_countable_resources: 0
    spm_unit_size: 1
    state_code: TX
  output:
    is_ssi_eligible: true
    ssi: 0
    tx_ceap_eligible: false

- name: Case 9, household reporting SSI receipt above the income limit is categorically eligible.
  absolute_error_margin: 0.1
  period: 2025
  input:
    employment_income: 100_000
    receives_ssi: true
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 10, SSI receipt reported only from December still confers categorical eligibility for the year.
  absolute_error_margin: 0.1
  period: 2025
  input:
    employment_income: 100_000
    receives_ssi:
      2025-01: false
      2025-12: true
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 11, SSI receipt reported from June through November but not December still confers categorical eligibility.
  absolute_error_margin: 0.1
  period: 2025
  input:
    employment_income: 100_000
    receives_ssi:
      2025-01: false
      2025-06: true
      2025-12: false
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true

- name: Case 12, reading Medicaid eligibility before CEAP leaves the annual SSI flag untouched.
  absolute_error_margin: 0.1
  period: 2025
  input:
    age: 70
    immigration_status: CITIZEN
    employment_income: 100_000
    ssi_countable_resources: 0
    receives_ssi:
      2025-01: false
      2025-06: true
      2025-12: false
    spm_unit_size: 1
    state_code: TX
  output:
    is_medicaid_eligible: false
    tx_ceap_eligible: true
    receives_ssi:
      2025-12: false

- name: Case 13, reading CEAP before Medicaid eligibility gives the same answers.
  absolute_error_margin: 0.1
  period: 2025
  input:
    age: 70
    immigration_status: CITIZEN
    employment_income: 100_000
    ssi_countable_resources: 0
    receives_ssi:
      2025-01: false
      2025-06: true
      2025-12: false
    spm_unit_size: 1
    state_code: TX
  output:
    tx_ceap_eligible: true
    is_medicaid_eligible: false
    receives_ssi:
      2025-12: false
