- name: Case 1, household with assets at $2,000 limit is eligible.
  period: 2024-01
  input:
    state_code: NJ
    spm_unit_cash_assets: 2_000
  output:
    nj_wfnj_resources_eligible: true

- name: Case 2, household with assets above $2,000 is ineligible.
  period: 2024-01
  input:
    state_code: NJ
    spm_unit_cash_assets: 2_001
  output:
    nj_wfnj_resources_eligible: false

- name: Case 3, household with zero assets is eligible.
  period: 2024-01
  input:
    state_code: NJ
    spm_unit_cash_assets: 0
  output:
    nj_wfnj_resources_eligible: true

# 1,157.81 + 285.17 + 557.02 = 2,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.02
    state_code: NJ
  output:
    nj_wfnj_resources_eligible: true

# 1,157.81 + 285.17 + 557.03 = 2,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 1_157.81
    stock_assets: 285.17
    bond_assets: 557.03
    state_code: NJ
  output:
    nj_wfnj_resources_eligible: false
