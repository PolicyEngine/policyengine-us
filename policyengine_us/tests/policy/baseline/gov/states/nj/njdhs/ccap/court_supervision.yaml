# Authority: https://www.childcarenj.gov/ChildCareNJ/media/media_library/CCDF_State_Plan_for_New_Jersey_FFY25-27.pdf#page=20
# The approved FFY 2025-2027 plan, section 2.2.1(c), elects the 45 CFR
# 98.20(a)(1)(ii) court-supervision age extension through 18 from 2024-10-01.
# Ordinary income, activity, immigration and copay rules still apply.

- name: NJ court status alone qualifies under the plan election at age 13.
  period: 2026-01
  input:
    state_code: NJ
    age: 13
    is_tax_unit_dependent: true
    immigration_status: CITIZEN
    is_disabled: false
    is_under_court_supervision: true
  output:
    nj_ccap_eligible_child: true

- name: NJ court status alone qualifies under the plan election at age 18.
  period: 2026-01
  input:
