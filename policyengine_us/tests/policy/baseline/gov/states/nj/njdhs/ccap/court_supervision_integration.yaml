- name: NJ approved child with expenses reported only at the SPM unit level
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 240000
      approved_child:
        age: 18
        is_tax_unit_dependent: false
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        nj_ccap_has_cpp_referral: true
        childcare_hours_per_week: 40
        nj_ccap_cpp_copay_waived: true
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 20
        nj_ccap_provider_type: LICENSED_CENTER
        nj_ccap_grow_nj_kids_rating: NONE
    tax_units:
      unit:
        members:
        - parent
        - approved_child
    spm_units:
      unit:
        members:
        - parent
        - approved_child
        spm_unit_pre_subsidy_childcare_expenses: 2400
        nj_ccap_income_eligible: false
        nj_ccap_activity_eligible: false
    households:
      home:
        members:
        - parent
        - approved_child
        state_code: NJ
  output:
    # The default person-level allocation only reaches children under 18,
    # so the 18-year-old's own expense is 0; the unattributed $2,400 / 12 =
    # $200 falls back to the referred child, matching the person-level case.
    pre_subsidy_childcare_expenses:
    - 0
    - 0
    nj_ccap_eligible_child:
    - false
    - true
    nj_ccap_eligible: true
    nj_ccap_copay: 0
    nj_ccap: 200
