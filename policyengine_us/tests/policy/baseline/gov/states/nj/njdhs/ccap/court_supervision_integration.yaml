- name: NJ approved child is paid without funding an unapproved sibling
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        employment_income: 240000
        nj_ccap_maximum_weekly_benefit: 0
      approved_child:
        age: 18
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        nj_ccap_has_cpp_referral: true
        pre_subsidy_childcare_expenses: 4800
        childcare_hours_per_week: 40
        nj_ccap_maximum_weekly_benefit: 500
        nj_ccap_cpp_copay_waived: true
      sibling:
        age: 8
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        pre_subsidy_childcare_expenses: 12000
        childcare_hours_per_week: 40
        nj_ccap_maximum_weekly_benefit: 500
    tax_units:
      unit:
        members: &id001
        - parent
        - approved_child
        - sibling
    spm_units:
      unit:
        members: *id001
        nj_ccap_income_eligible: false
        nj_ccap_activity_eligible: false
    households:
      home:
        members: *id001
        state_code: NJ
  output:
    nj_ccap_eligible_child:
    - false
    - true
    - true
    nj_ccap_eligible: true
    nj_ccap_copay: 0
    nj_ccap: 400
