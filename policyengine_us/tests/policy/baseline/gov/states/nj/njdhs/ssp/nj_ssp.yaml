# Sources: POMS SI 01415.058 J and SI NY01415.025.
- name: Case 1, independent individual.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
  output:
    nj_ssp: 31.25

- name: Case 2, certified congregate care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    nj_ssp_care_setting: CONGREGATE_CARE
  output:
    nj_ssp: 150.05

- name: Case 3, certified residential health care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    nj_ssp_care_setting: RESIDENTIAL_HEALTH_CARE
