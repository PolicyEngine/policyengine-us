- name: Case 5, Medicaid institutional payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    ssi: 30
    nj_ssp: 20

- name: Case 6, non Medicaid medical institution.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    ssi_lives_in_medical_treatment_facility: true
  output:
    nj_ssp: 0

- name: Case 7, household of another.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    ssi_lives_in_another_persons_household: true
    ssi_receives_shelter_from_others_in_household: true
    ssi_others_pay_all_meals: true
  output:
    nj_ssp: 44.31

- name: Case 8, state only payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    social_security_retirement: 12_360
  output:
    ssi: 0
    nj_ssp: 15.25

- name: Case 9, positive sub dollar amount receives minimum.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    social_security_retirement: 12_540
  output:
    # 12_540 / 12 = 1_045 - 20 = 1_025 countable, 31 above the 994 FBR.
    # 31.25 - 31 = 0.25, raised to the 1 dollar minimum.
    nj_ssp: 1

- name: Case 10, combined income cutoff.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NJ
    age: 65
    social_security_retirement: 12_543
