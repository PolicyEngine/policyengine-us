# Unit tests for New Jersey Health Plan Savings (NJHPS) tax-unit eligibility.
#
# nj_njhps_eligible (TaxUnit, bool, YEAR) returns:
#   in_effect
#   & (fpl_floor <= ratio <= fpl_limit)   [1.38 <= ratio <= 6.0]
# where ratio = max(aca_magi, 0) / aca_fpg, the exact ratio, not the truncated
# aca_magi_fraction. Supplied-income cases pin aca_fpg to $10,000.
#   & (count of nj_njhps_member_eligible > 0)
#
# in_effect is false before 2026-01-01 and true (open-ended) from 2026-01-01.
# pays_aca_premium is supplied per person to control which members qualify.

# --- Positive baseline ---

- name: Case 1, in effect, within band, one eligible member -> eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: true

# --- Income floor boundary (138%) ---

- name: Case 2, just below the 138% floor -> ineligible.
  # frac 1.37 < 1.38 -> below floor -> not eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 13_700
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: false

- name: Case 3, exactly at the 138% floor -> eligible.
  # frac 1.38 == fpl_floor -> inclusive floor -> eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 13_800
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: true

# --- Income ceiling boundary (600%) ---

- name: Case 4, exactly at the 600% ceiling -> eligible.
  # frac 6.0 == fpl_limit -> inclusive ceiling -> eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 60_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: true

- name: Case 5, just above the 600% ceiling -> ineligible.
  # frac 6.01 > 6.0 -> above ceiling -> not eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 60_100
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: false

# --- No eligible member ---

- name: Case 6, within band but no member pays a premium -> ineligible.
  # count of nj_njhps_member_eligible is 0 (nobody pays an ACA premium), so even
  # though the fraction is within band the tax unit is not eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: false

# --- 500% FPL above the APTC cliff still eligible ---

- name: Case 7, 500% FPL member above the APTC cliff keeps the tax unit eligible.
  # frac 5.0 is within the 1.38-6.0 band and one member pays an ACA premium, so the
  # tax unit is eligible even though the federal is_aca_ptc_eligible is False here.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 50_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: true

# --- Non-NJ ---

- name: Case 8, non-NJ resident is not eligible.
  # defined_for StateCode.NJ -> a NY household returns the default False.
  period: 2026
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    nj_njhps_eligible: false

# --- Temporal: off-year 2025 (not in effect) and open-ended 2027 ---

- name: Case 9, 2025 off-year is not in effect -> ineligible.
  # in_effect is false before 2026-01-01, so an otherwise-qualifying tax unit is not
  # eligible in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: false

- name: Case 10, 2027 open-ended in_effect keeps the tax unit eligible.
  # in_effect has no end date (2026-01-01 true, open-ended), so 2027 mirrors 2026.
  period: 2027
  input:
    people:
      person1:
        age: 40
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 20_000
        aca_fpg: 10_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_njhps_eligible: true

- name: Case 11, $93,900 (exactly 600% of the 2025 guideline) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        nj_njhps_member_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 93_900
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    aca_magi_fraction: 6.00
    nj_njhps_eligible: true

- name: Case 12, $93,900.47 (600.003%) is ineligible though truncated to 6.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        nj_njhps_member_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 93_900.47
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    aca_magi_fraction: 6.00
    nj_njhps_eligible: false

- name: Case 13, $94,055.56 (600.994%) is ineligible though truncated to 6.00.
  period: 2026
  input:
    people:
      person1:
        age: 40
        nj_njhps_member_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 94_055.56
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    aca_magi_fraction: 6.00
    nj_njhps_eligible: false

- name: Case 14, $21,597 (exactly 138%) is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        nj_njhps_member_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 21_597
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    aca_magi_fraction: 1.38
    nj_njhps_eligible: true

- name: Case 15, a joint return with one claimable spouse at 600% of the one-person guideline is eligible.
  # The claimable spouse is outside the section 36B tax family, so aca_fpg is
  # the one-person guideline: 93_900 / 15_650 = 6.00. New Jersey's sources don't
  # say whether this filer counts; this pins the model's use of aca_fpg.
  period: 2026
  input:
    people:
      person_a:
        age: 30
        nj_njhps_member_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        nj_njhps_member_eligible: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 93_900
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: NJ
  output:
    aca_tax_family_size: 1
    aca_fpg: 15_650
    nj_njhps_eligible: true

- name: Case 16, the same return at 600.003% of the one-person guideline is ineligible.
  # 93_900.47 / 15_650 = 6.00003, though only 444% of the whole unit's $21,150.
  period: 2026
  input:
    people:
      person_a:
        age: 30
        nj_njhps_member_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        nj_njhps_member_eligible: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 93_900.47
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: NJ
  output:
    aca_tax_family_size: 1
    aca_fpg: 15_650
    nj_njhps_eligible: false

- name: Case 17, the same return at 150% of the one-person guideline is eligible.
  # 23_475 / 15_650 = 1.50, though only 111% of the whole unit's $21,150, which
  # is below the 138% floor.
  period: 2026
  input:
    people:
      person_a:
        age: 30
        nj_njhps_member_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        nj_njhps_member_eligible: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 23_475
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: NJ
  output:
    aca_tax_family_size: 1
    aca_fpg: 15_650
    nj_njhps_eligible: true
