- name: Case 1, default nj_other_additions is zero
  period: 2024
  input:
    people:
      person1:
        employment_income: 50_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_other_additions: 0
    nj_additions: 0
    nj_total_income: 50_000

- name: Case 2, nj_other_additions increases NJ total income
  period: 2024
  input:
    people:
      person1:
        employment_income: 50_000
        nj_other_additions: 2_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_other_additions: 2_000
    nj_additions: 2_000
    nj_total_income: 52_000
