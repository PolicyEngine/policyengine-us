# Isolated NJ ordinary retirement fraction/pension-cap component.
# Filing statuses and full-year NJ residence are independently established
# premises; this does not derive HOH support or survivor/death-timing rules.
# The separate filer's spouse lives elsewhere and files a separate return.
# Known nj_total_income is the NJ taxable-line total BEFORE retirement
# exclusions, not federal AGI. Both joint spouses contribute to that total.
# HOH/survivor dependents have their own $5,000 NJ income, excluded from the
# filers' return. Their filing-status classification is a component premise.
# Independently known eligible pension totals $10,000 per filer unit; joint
# head/spouse shares are $6,000/$4,000. No final fraction/exclusion is input.
# Age-65 full-year filers avoid part-year and mixed-age qualification issues.
# This case asserts no special-exclusion or complete NJ tax result.
# 2017 NJ-1040 instructions, line 27a (physical PDF page 28).
# https://www.nj.gov/treasury/taxation/pdf/other_forms/tgi-ee/2017/1040i.pdf#page=28
# P.L.2021,c.129 section1, N.J.S.A.54A:6-10(b)(2): before2021 cutoff.
# https://pub.njleg.state.nj.us/Bills/2020/PL21/129_.HTM
