- name: Two dependents gets $3k exemption.
  period: 2022
  input:
    state_code: NJ
    tax_unit_dependents: 2
  output:
    nj_dependents_exemption: 3_000

- name: One dependent gets $1.5k exemption.
  period: 2022
  input:
    state_code: NJ
    tax_unit_dependents: 1
  output:
    nj_dependents_exemption: 1_500

- name: No dependent gets $0 exemption.
  period: 2022
  input:
    state_code: NJ
    tax_unit_dependents: 0
  output:
    nj_dependents_exemption: 0

- name: If state is New York, NJ exemption is $0.
  period: 2022
  input:
    state_code: NY
    tax_unit_dependents: 2
  output:
    nj_dependents_exemption: 0


- name: 2025 single filer who can be claimed as a dependent: New Jersey dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      child_1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child_1]
    households:
      household:
        members: [person_a, child_1]
        state_code: NJ
  output:
    # NJ-1040 lines 10-11: each child who qualifies as your dependent
    # for federal tax purposes. IRC 152(b)(1): a return on which the filer (or, if joint, either spouse) can be claimed as a dependent has no dependents.
    nj_dependents_exemption: 0

- name: 2025 joint return with one spouse who can be claimed as a dependent: New Jersey dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 2500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 30
        employment_income: 2500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: false
      child_1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child_1]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child_1]
        state_code: NJ
  output:
    nj_dependents_exemption: 0

