- name: A childless filer who meets the federal age test takes the federal path, not the age path.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
  output:
    # P.L. 2021, c.130, section 1a(4) reaches a filer "ineligible to claim
    # the federal earned income tax credit due to age requirements"; at 30
    # the filer meets the federal 25-64 range.
    nj_childless_eitc_age_eligible: false

