# P.L. 2021, c.130, section 1a(4): the filer "shall meet all qualifications,
# except for the minimum or maximum age, for the federal earned income tax
# credit", including 26 U.S.C. 32(c)(1)(C) (no credit for an individual who
# claims the benefits of section 911).
- name: Section 911 claimant fails a non-age federal qualification.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
        foreign_earned_income_exclusion: 30_000
  output:
    nj_childless_eitc_age_eligible: false

- name: Housing-only leaf claimant fails the non-age qualification with zero aggregates.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
        foreign_earned_income_exclusion_amount: 0
        foreign_housing_exclusion: 5_000
        foreign_earned_income_exclusion_allocable_deductions: 5_000
  output:
    foreign_earned_income_exclusion: 0
    section_911_excluded_income: 0
    nj_childless_eitc_age_eligible: false

# P.L. 2021, c.130, section 1a(4) and the 2025 NJ-1040 line 58 instructions:
# the age path is for a filer ineligible for the federal credit "due to age
# requirements" who meets "all federal EIC requirements except the age
# requirement". The federal age test looks at the filer and spouse only.
- name: A dependent's age does not make the filer meet the federal age test.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_dependent: false
      person2:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_dependent: true
    households:
      household:
        members: [person1, person2]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1, person2]
        nj_eitc_income_eligible: true
  output:
    # The 30-year-old dependent is not an EITC qualifying child, and the
    # 20-year-old filer fails the federal minimum age of 25.
    nj_childless_eitc_age_eligible: true

- name: A spouse who meets the federal age test takes the couple off the age path.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
      person2:
        age: 30
    households:
      household:
        members: [person1, person2]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: false

- name: A filer without an SSN valid for the EITC fails a non-age federal qualification.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
        ssn_card_type: OTHER_NON_CITIZEN
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
  output:
    # IRC 32(c)(1)(E) and 32(m); New Jersey waives only the age requirements.
    nj_childless_eitc_age_eligible: false

