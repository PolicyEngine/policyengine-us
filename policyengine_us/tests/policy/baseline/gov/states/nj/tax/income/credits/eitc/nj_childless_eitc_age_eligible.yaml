- name: Individual without child that is still eligible for federal eitc based on age.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: true

- name: Individual without child that is age eligible but not income eligible.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: false
  output:
    nj_childless_eitc_age_eligible: false

- name: Individual with child should not be eligible, regardless of income.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
      person2:
        age: 15
    households:
      household:
        members: [person1, person2]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1, person2]
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: false

- name: Individual with child that does not qualify for EITC should still be eligible.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 30
      person2:
        age: 15
        is_qualifying_child_dependent: false
    households:
      household:
        members: [person1, person2]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1, person2]
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: true

- name: Filer without children that is ineligible for the federal EITC based on age, but still eligible for the NJ EITC because of lower age minimum.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: true

- name: Filer without children that is ineligible for the federal EITC based on age, but still eligible for the NJ EITC because of no age maximum.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 66
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
  output:
    nj_childless_eitc_age_eligible: true

# P.L. 2021, c.130, section 1a(4): the filer "shall meet all qualifications,
# except for the minimum or maximum age, for the federal earned income tax
# credit", including 26 U.S.C. 32(c)(1)(C) (no credit for an individual who
# claims the benefits of section 911).
- name: Section 911 claimant fails a non-age federal qualification.
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 20
    households:
      household:
        members: [person1]
        state_code: NJ
    tax_units:
      tax_unit:
        members: [person1]
        nj_eitc_income_eligible: true
        foreign_earned_income_exclusion: 30_000
  output:
    nj_childless_eitc_age_eligible: false
