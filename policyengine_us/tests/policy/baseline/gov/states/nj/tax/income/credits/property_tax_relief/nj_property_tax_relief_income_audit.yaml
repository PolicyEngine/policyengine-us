# Target: policyengine_us/tests/policy/baseline/gov/states/nj/tax/income/credits/property_tax_relief/nj_property_tax_relief_income.yaml
# Each case fails on main (06c0dcbc54) and passes once the gap is fixed.
# N.J.S.A. 54:4-8.75b (P.L. 2024, c. 88, s. 1): the claimant's "Income" is
# New Jersey gross income before exclusions plus exempt interest, excluded
# pension and other retirement income, Roth IRA distributions and Social
# Security. 2025 PAS-1 instructions: line a is line 27 of the applicant's
# NJ-1040, and line d adds a total and permanent disability pension that
# "is not reported on Form NJ-1040".

- name: A dependent's income is not the claimant's income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_private_pension_income: 50_000
        is_tax_unit_head: true
      person2:
        age: 20
        is_full_time_student: true
        employment_income: 3_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NJ
  output:
    # The dependent's 3,000 of wages goes on the dependent's own NJ-1040.
    # The claimant's line 27 is 50,000. Main: 53,000.
    nj_property_tax_relief_income: 50_000

- name: A disability pension reported as wages counts once.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 60
        # A taxable disability pension before minimum retirement age is
        # reported as wages (Form 1040 line 1h), so it sits in
        # employment_income as total_disability_payments documents.
        employment_income: 30_000
        total_disability_payments: 30_000
        taxable_interest_income: 2_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # Line a (line 27 of the NJ-1040) holds the 2,000 of interest; the
    # pension "is not reported on Form NJ-1040". Line d adds the pension:
    # 2,000 + 30,000 = 32,000. Main: 62,000 (pension counted twice).
    nj_property_tax_relief_income: 32_000
