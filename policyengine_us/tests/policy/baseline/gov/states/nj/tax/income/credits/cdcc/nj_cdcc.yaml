- name: Case 9, 2018 NJ CDCC statutory upper ceiling.
  period: 2018
  absolute_error_margin: 0.01
  input:
    # Known annual federal awards and qualifying counts isolate the NJ component.
    # Each full-year NJ household has one parent and two dependent children.
    people:
      person1: {age: 40, is_tax_unit_head: true}
      person2: {age: 6, is_tax_unit_dependent: true}
      person3: {age: 8, is_tax_unit_dependent: true}
      person4: {age: 40, is_tax_unit_head: true}
      person5: {age: 6, is_tax_unit_dependent: true}
      person6: {age: 8, is_tax_unit_dependent: true}
      person7: {age: 40, is_tax_unit_head: true}
      person8: {age: 6, is_tax_unit_dependent: true}
      person9: {age: 8, is_tax_unit_dependent: true}
    tax_units:
      tax_unit1:
        members: [person1, person2, person3]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 59_999.99
      tax_unit2:
        members: [person4, person5, person6]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 60_000
      tax_unit3:
        members: [person7, person8, person9]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 60_000.01
    households:
      household1:
        members: [person1, person2, person3]
        state_code: NJ
      household2:
        members: [person4, person5, person6]
        state_code: NJ
      household3:
        members: [person7, person8, person9]
        state_code: NJ
  output:
    # P.L.2018 c.45 section5: through $60,000, min(10% * $1,000,
    # the $1,000 two-person cap) = $100; above the ceiling the credit is zero.
    # https://pub.njleg.state.nj.us/Bills/2018/PL18/45_.HTM
    nj_cdcc: [100, 100, 0]

