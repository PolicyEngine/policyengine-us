- name: Single filer, taxable income is $25k in 2022 then tax is $367.50.
  period: 2022
  input:
    nj_taxable_income: 25_000
    filing_status: SINGLE
    state_code: NJ
  output:
    # .014 * 20,000 + .0175 * (25,000-20,000) = 367.50
    nj_main_income_tax: 367.5

