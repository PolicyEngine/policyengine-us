# Expectations come from the law and forms, not from PolicyEngine output:
#   - 2025 NJ-1040 instructions, Line 58 (PDF p. 44, printed p. 42,
#     https://www.nj.gov/treasury/taxation/pdf/current/1040i.pdf, retrieved
#     2026-09-26): a filer with no qualifying child, at least 18, who "met all
#     federal EIC requirements except the age requirement" enters $260. PE-US
#     computes 40% x the $649 federal no-child maximum = 259.60, hence
#     absolute_error_margin: 1.
#   - N.J.S.A. 54A:4-7a.(4) (P.L.2021, c.130): the filer "shall meet all
#     qualifications, except for the minimum or maximum age, for the federal
#     earned income tax credit".
#   - IRS Pub. 596 (2025) Rule 6 ($11,950 limit), Worksheet 1 lines 11-14
#     (passive losses are floored at zero before being added to interest), and
#     Rule 11 (no-child filers must be at least 25 but under 65).
- name: Age 20, interest 12,500 and a 10,000 rental loss; Worksheet 1 line 14 is 12,500 > 11,950, so no NJEITC.
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 20
        employment_income: 10_000
        taxable_interest_income: 12_500
        rental_income: -10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NJ
  output:
    nj_eitc: 0

