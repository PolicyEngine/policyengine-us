- name: NJ income tax should be zero for a single filer with income below the filing threshold.
  period: 2022
  input:
    state_code: NJ
    nj_agi: 9_999
    filing_status: SINGLE
    nj_childless_eitc_age_eligible: false
  output:
    nj_income_tax: 0

- name: NJ income tax should be zero for a joint couple filing with income below the filing threshold.
  period: 2022
  input:
    state_code: NJ
    nj_agi: 19_999
    filing_status: JOINT
  output:
    nj_income_tax: 0

- name: Below the filing threshold, tax is zeroed before applying refundable credits
  period: 2022
  input:
    state_code: NJ
    nj_agi: 19_999
    filing_status: JOINT
    # Per N.J.S.A. 54A:2-4, the pre-credit liability is wiped before
    # credits flow through; the full $1,001 of credits is refunded
    # rather than netted against the $1,000 of bracket-schedule tax.
    nj_income_tax_before_refundable_credits: 1_000
    nj_refundable_credits: 1_001
  output:
    nj_income_tax: -1_001

- name: NJ joint at $20K gross income owes no tax, full refundable credits
  period: 2025
  input:
    people:
      head: {age: 40}
      spouse: {age: 40, employment_income: 20_000}
      k1: {age: 2}
      k2: {age: 11}
    tax_units:
      tax_unit:
        members: [head, spouse, k1, k2]
        tax_unit_childcare_expenses: 3_000
    marital_units:
      m:
        members: [head, spouse]
      m1:
        members: [k1]
      m2:
        members: [k2]
    households:
      household:
        members: [head, spouse, k1, k2]
        state_name: NJ
  output:
    nj_income_tax: -3_860.8

- name: AGI exactly at the SINGLE filing threshold still zeroes pre-credit tax
  period: 2022
  input:
    state_code: NJ
    nj_agi: 10_000
    filing_status: SINGLE
    nj_income_tax_before_refundable_credits: 500
    nj_refundable_credits: 200
  output:
    # <= comparison: $10,000 is still inside the no-tax zone.
    nj_income_tax: -200

- name: AGI one dollar above the SINGLE filing threshold falls through to schedule
  period: 2022
  input:
    state_code: NJ
    nj_agi: 10_001
    filing_status: SINGLE
    nj_income_tax_before_refundable_credits: 500
    nj_refundable_credits: 200
  output:
    nj_income_tax: 300

- name: NJ income tax above filing threshold so tax is calculated amount minus refundable credits.
  period: 2022
  input:
    state_code: NJ
    nj_agi: 60_000
    filing_status: JOINT
    nj_income_tax_before_refundable_credits: 10_000
    nj_refundable_credits: 50
  output:
    nj_income_tax: 9_950

- name: Case 8, 2017 NJ CDCC composition preserves other refundable credits.
  period: 2017
  absolute_error_margin: 0.01
  input:
    # Known main-tax50/CDCC1000/EITC0-or-18 isolate credit composition.
    # These premises do not derive full federal/state entitlement or bracket tax.
    # NJ AGI is above the filing threshold; no aggregate or final-tax input is supplied.
    # P.L.2018 c.45 section5: nonrefundable; P.L.2021 c.308 section1: refundable.
    people:
      person1: {age: 40, is_tax_unit_head: true}
      person2: {age: 6, is_tax_unit_dependent: true}
      person3: {age: 8, is_tax_unit_dependent: true}
      person4: {age: 40, is_tax_unit_head: true}
      person5: {age: 6, is_tax_unit_dependent: true}
      person6: {age: 8, is_tax_unit_dependent: true}
    tax_units:
      tax_unit1:
        members: [person1, person2, person3]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 20_000
        nj_agi: 30_000
        nj_main_income_tax: 50
        nj_property_tax_credit: 0
        nj_eitc: 0
        nj_ctc: 0
      tax_unit2:
        members: [person4, person5, person6]
        filing_status: HEAD_OF_HOUSEHOLD
        cdcc: 1_000
        count_cdcc_eligible: 2
        nj_taxable_income: 20_000
        nj_agi: 30_000
        nj_main_income_tax: 50
        nj_property_tax_credit: 0
        nj_eitc: 18
        nj_ctc: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: NJ
      household2:
        members: [person4, person5, person6]
        state_code: NJ
  output:
    nj_cdcc: [0, 0]
    nj_non_refundable_credits: [0, 0]
    nj_refundable_credits: [0, 18]
    nj_income_tax_before_refundable_credits: [50, 50]
    nj_income_tax: [50, 32]

