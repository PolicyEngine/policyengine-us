- name: No AGI - total expenses deductable
  period: 2022
  absolute_error_margin: 0
  input:
    self_employed_health_insurance_ald: 1_000
    other_medical_expenses: 2_000
    nj_agi: 0
    state_code: NJ
  output:
    nj_medical_expense_deduction: 3_000

- name: High AGI - only self-employed health insurance deduction applies
  period: 2022
  absolute_error_margin: 0
  input:
    self_employed_health_insurance_ald: 1_000
    other_medical_expenses: 2_000
    nj_agi: 100_000
    state_code: NJ
  output:
    nj_medical_expense_deduction: 1_000

- name: New Jersey leaves out a dependent's own premiums when the filer's deduction exceeds the filer's premiums
  period: 2025
  input:
    people:
      parent:
        age: 40
        health_insurance_premiums: 300
        other_medical_expenses: 100
      child:
        age: 12
        is_tax_unit_dependent: true
        health_insurance_premiums: 500
        other_medical_expenses: 200
    tax_units:
      tax_unit:
        members: [parent, child]
        self_employed_health_insurance_ald: 1_000
        nj_agi: 0
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    # The parent's 300 were deducted as self-employed; the child's own 500 is
    # not an expense the parent paid. Other expenses: 100 + 200.
    itemized_medical_expenses: 300
    # Separate SE deduction 1,000 + 300.
    nj_medical_expense_deduction: 1_300

- name: Partial out of pocket expenses deductable
  period: 2022
  absolute_error_margin: 0
  input:
    self_employed_health_insurance_ald: 1_000
    other_medical_expenses: 2_000
    nj_agi: 20_000
    state_code: NJ
  output:
    nj_medical_expense_deduction: 2_600

- name: A dependent's self-employed health insurance counts where New Jersey counts the dependent's income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    # New Jersey AGI includes the child's 10,000 of Schedule C income, so the
    # child's 1,000 of self-employed health insurance is deducted too.
    nj_agi: 50_000
    nj_medical_expense_deduction: 1_000

- name: New Jersey allows after-tax premiums above two percent of gross income
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 0
    state_code: NJ
  output:
    nj_agi: 40_000
    nj_medical_expense_deduction: 5_200

- name: New Jersey counts disjoint payroll and after-tax premiums once each
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    health_insurance_premiums: 3_000
    pre_tax_health_insurance_premiums: 3_000
    state_code: NJ
  output:
    nj_agi: 40_000
    irs_employment_income: 37_000
    nj_medical_expense_deduction: 5_200

- name: New Jersey allows federally pretax payroll premiums included in state wages
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 6_000
    state_code: NJ
  output:
    nj_agi: 40_000
    irs_employment_income: 34_000
    nj_medical_expense_deduction: 5_200

- name: Employer-paid premiums are not employee medical expenses in New Jersey
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 40_000
    health_insurance_premiums: 0
    pre_tax_health_insurance_premiums: 0
    employer_sponsored_insurance_premiums: 6_000
    state_code: NJ
  output:
    nj_agi: 40_000
    nj_medical_expense_deduction: 0

- name: New Jersey counts self-employed premiums once across its medical deductions
  period: 2025
  input:
    state_code: NJ
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
    other_medical_expenses: 500
    nj_agi: 30_000
  output:
    # Worksheet F adds the SE deduction after applying the 2% floor to the remainder.
    nj_medical_expense_deduction: 5_900

- name: New Jersey excludes a dependent's separately deducted premiums from its medical base
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 30_000
      child:
        age: 17
        self_employment_income: 10_000
        health_insurance_premiums: 1_000
        is_self_employed: true
        other_medical_expenses: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    nj_agi: 40_000
    dependents_self_employed_health_insurance_ald: 1_000
    # Only the 500 of other expenses remains subject to the 800 floor.
    nj_medical_expense_deduction: 1_000

- name: New Jersey keeps a dependent's separate deduction but not another dependent's own premiums
  period: 2025
  input:
    people:
      parent:
        age: 40
      dependent_a:
        age: 17
        is_tax_unit_dependent: true
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
      dependent_b:
        age: 16
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_000
    tax_units:
      tax_unit:
        members: [parent, dependent_a, dependent_b]
        nj_agi: 0
    households:
      household:
        members: [parent, dependent_a, dependent_b]
        state_code: NJ
  output:
    dependents_self_employed_health_insurance_ald: 1_000
    # Dependent B's own 1,000 is not an expense the parent paid, so line 1
    # is 0 and nothing remains for dependent A's deduction to consume.
    itemized_medical_expenses: 0
    # Separate SE deduction 1,000, which New Jersey counts with dependent A's
    # income.
    # https://pub.njleg.gov/bills/9899/PL99/222_.HTM
    nj_medical_expense_deduction: 1_000

- name: New Jersey combines pretax premiums with separately deducted SE premiums
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: NJ
    employment_income: 10_000
    self_employment_income: 30_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 3_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    nj_agi: 40_000
    # 1,000 + (5,500 + 3,000 - 0.02 * 40,000) = 8,700.
    nj_medical_expense_deduction: 8_700

- name: New Jersey leaves out a dependent's own premiums, after-tax or through payroll
  # Line 31: "unreimbursed medical expenses you paid during the year for
  # yourself, your spouse or domestic partner, and any dependents you claim"
  # (2025 NJ-1040 instructions, PDF page 25). Two tax units with the same
  # people label the earner head and then spouse.
  period: 2025
  input:
    people:
      a_earner:
        age: 45
        is_tax_unit_head: true
        other_medical_expenses: 3_000
        pre_tax_health_insurance_premiums: 400
      a_partner:
        age: 45
        is_tax_unit_spouse: true
      a_student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
        pre_tax_health_insurance_premiums: 500
      b_earner:
        age: 45
        is_tax_unit_spouse: true
        other_medical_expenses: 3_000
        pre_tax_health_insurance_premiums: 400
      b_partner:
        age: 45
        is_tax_unit_head: true
      b_student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
        pre_tax_health_insurance_premiums: 500
    tax_units:
      a:
        members: [a_earner, a_partner, a_student]
        nj_agi: 50_000
      b:
        members: [b_partner, b_earner, b_student]
        nj_agi: 50_000
    households:
      a:
        members: [a_earner, a_partner, a_student]
        state_code: NJ
      b:
        members: [b_partner, b_earner, b_student]
        state_code: NJ
  output:
    # 3,000 + the filer's 400 of payroll premiums - 2% of 50,000. Counting
    # the student's 1,200 and 500 would give 4,100.
    nj_medical_expense_deduction: [2_400, 2_400]
