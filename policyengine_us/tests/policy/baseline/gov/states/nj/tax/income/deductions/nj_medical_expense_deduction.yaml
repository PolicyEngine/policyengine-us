- name: New Jersey counts self-employed premiums once across its medical deductions
  period: 2025
  input:
    state_code: NJ
    health_insurance_premiums: 6_000
    self_employed_health_insurance_ald: 1_000
    other_medical_expenses: 500
    nj_agi: 30_000
  output:
    # Worksheet F adds the SE deduction after applying the 2% floor to the remainder.
    nj_medical_expense_deduction: 5_900

- name: New Jersey excludes a dependent's separately deducted premiums from its medical base
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 30_000
      child:
        age: 17
        self_employment_income: 10_000
        health_insurance_premiums: 1_000
        is_self_employed: true
        other_medical_expenses: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    # The child's 10,000 of Schedule C income is on the child's own return.
    nj_agi: 30_000
    dependents_self_employed_health_insurance_ald: 1_000
    # The child deducts the 1,000 of premiums on their own return. Only the
    # 500 of other expenses remains, under the 600 floor (2% of 30,000).
    nj_medical_expense_deduction: 0

- name: New Jersey cannot subtract one dependent's deduction from another dependent's premiums
  period: 2025
  input:
    people:
      parent:
        age: 40
      dependent_a:
        age: 17
        is_tax_unit_dependent: true
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
      dependent_b:
        age: 16
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_000
    tax_units:
      tax_unit:
        members: [parent, dependent_a, dependent_b]
        nj_agi: 0
    households:
      household:
        members: [parent, dependent_a, dependent_b]
        state_code: NJ
  output:
    dependents_self_employed_health_insurance_ald: 1_000
    itemized_medical_expenses: 1_000
    # C.54A:3-3(c)(3) excludes separately deducted amounts, not another
    # person's paid premiums: min(1,000, 0) + min(0, 1,000) = 0 excluded.
    # https://pub.njleg.gov/bills/9899/PL99/222_.HTM
    # Dependent A's separate SE deduction is on dependent A's own return, so
    # only the 1,000 of general medical premiums is deducted.
    nj_medical_expense_deduction: 1_000

- name: New Jersey combines pretax premiums with separately deducted SE premiums
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 40
    state_code: NJ
    employment_income: 10_000
    self_employment_income: 30_000
    health_insurance_premiums: 6_000
    pre_tax_health_insurance_premiums: 3_000
    other_medical_expenses: 500
    self_employed_health_insurance_ald: 1_000
  output:
    itemized_medical_expenses: 5_500
    nj_agi: 40_000
    # 1,000 + (5,500 + 3,000 - 0.02 * 40,000) = 8,700.
    nj_medical_expense_deduction: 8_700

- name: A dependent's long-term care deduction is not counted again in New Jersey
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 100_000
      dependent:
        age: 72
        is_tax_unit_dependent: true
        is_self_employed: true
        self_employment_income: 4_000
        long_term_health_insurance_premiums: 3_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: NJ
  output:
    # Eligible long-term care premiums: min(3,000, 6,020 above age 70) =
    # 3,000. The earned income limit is 4,000 - 4,000 x 0.9235 x 0.153 / 2 =
    # 3,717.41, so the dependent's own deduction is 3,000, all of it Form
    # 7206 line 2.
    dependents_self_employed_health_insurance_ald: 3_000
    # The dependent's deduction took those premiums.
    itemized_medical_expenses_long_term_care_premiums: 0
    # The head isn't the dependent's spouse, so SSI deems none of the head's
    # income to the dependent. The dependent's own countable income, 1,490,
    # leaves SSI of 11,604 - 1,490 = 10,114 and passes the Medicare Savings
    # Program test. The program and the SSI buy-in each cover the
    # $185 x 12 = $2,220 Part B premium, so the subtotal holds nothing.
    itemized_medical_expenses: 0
    # The dependent's 4,000 of Schedule C income, and their 3,000 deduction,
    # are on the dependent's own return.
    nj_agi: 100_000
    # max(0, 0 - 0.02 x 100,000) = 0. Counting the Part B premium, as when
    # the head's income was deemed to the dependent, would give
    # max(0, 2,220 - 2,000) = 220.
    nj_medical_expense_deduction: 0

- name: A filer's own deduction is not removed again from the federal base
  period: 2025
  input:
    state_code: NJ
    age: 45
    is_self_employed: true
    self_employment_income: 50_000
    health_insurance_premiums: 5_000
    other_medical_expenses: 10_000
  output:
    # The federal subtotal already leaves out the 5,000 deducted; New Jersey
    # deducts it separately: 5,000 + (10,000 - 0.02 x 50,000).
    itemized_medical_expenses: 10_000
    nj_medical_expense_deduction: 14_000
