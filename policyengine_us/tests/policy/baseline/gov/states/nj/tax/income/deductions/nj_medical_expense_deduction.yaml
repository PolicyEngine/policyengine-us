- name: New Jersey preserves dependent premiums when the filer's deduction exceeds reported filer premiums
  period: 2025
  input:
    people:
      parent:
        age: 40
        health_insurance_premiums: 300
        other_medical_expenses: 100
      child:
        age: 12
        is_tax_unit_dependent: true
        health_insurance_premiums: 500
        other_medical_expenses: 200
    tax_units:
      tax_unit:
        members: [parent, child]
        self_employed_health_insurance_ald: 1_000
        nj_agi: 0
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    itemized_medical_expenses: 800
    nj_medical_expense_deduction: 1_800

- name: Partial out of pocket expenses deductable
  period: 2022
  absolute_error_margin: 0
