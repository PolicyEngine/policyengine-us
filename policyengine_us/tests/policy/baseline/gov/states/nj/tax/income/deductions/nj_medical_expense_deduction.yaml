- name: A dependent's self-employed health insurance stays on the dependent's own return
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    # The child's 10,000 of Schedule C income and the child's 1,000
    # self-employed health insurance deduction both go on the child's own
    # NJ-1040, so neither is on the parent's return.
    nj_agi: 40_000
    nj_medical_expense_deduction: 0

