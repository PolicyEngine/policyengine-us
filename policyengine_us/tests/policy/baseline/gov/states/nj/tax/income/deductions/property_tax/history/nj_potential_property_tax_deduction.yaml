# Conditional general-cap controls, USD per TaxUnit and tax year. Stipulate
# an otherwise-qualified full-year New Jersey resident who solely owns and
# occupies one homestead and pays all stated property taxes for that calendar
# year. Each return uses SINGLE status, no rent, no co-ownership, no separate
# spouse, no Senior Freeze/PTR limitation and no reimbursement application.
# These cases do not test the deduction/credit election or a complete return.
# The 2015 node marks earliest model availability; the statute predates 2015.
# Primary cap sources:
# P.L.2009c69 section2: https://pub.njleg.gov/bills/2008/PL09/69_.PDF#page=2
# 2016 Division report: https://www.nj.gov/treasury/taxation/pdf/annual/2016.pdf#page=34
# 2017 WorksheetGline2: https://www.nj.gov/treasury/taxation/pdf/other_forms/tgi-ee/2017/1040i.pdf#page=36
# P.L.2018c45 sections1-3/12: https://pub.njleg.gov/bills/2018/AL18/45_.HTM
# The 1996/1997 phase-in and taxyear2009 special restriction stay outside these
# periods. Integer paid taxes avoid selecting a fractional-dollar convention.
# In component vectors, nj_agi=50,000 supplies an income premise; compute the
# existing eligibility gate from that premise and positive paid property taxes.

- name: Case 1, 2015 paid property taxes below, at and above the general cap.
  period: 2015
  absolute_error_margin: 0.01
  input:
    people: &lower_cap_people
      person1: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 9_999}
      person2: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 10_000}
      person3: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 10_001}
    tax_units: &single_returns
      tax_unit1: {members: [person1], filing_status: SINGLE, nj_agi: 50_000}
      tax_unit2: {members: [person2], filing_status: SINGLE, nj_agi: 50_000}
      tax_unit3: {members: [person3], filing_status: SINGLE, nj_agi: 50_000}
    households: &homes
      household1: {members: [person1], state_code: NJ}
      household2: {members: [person2], state_code: NJ}
      household3: {members: [person3], state_code: NJ}
  output:
    nj_potential_property_tax_deduction: [9_999, 10_000, 10_000]

- name: Case 2, 2016 paid property taxes below, at and above the general cap.
  period: 2016
  absolute_error_margin: 0.01
  input:
    people: *lower_cap_people
    tax_units: *single_returns
    households: *homes
  output:
    nj_potential_property_tax_deduction: [9_999, 10_000, 10_000]

- name: Case 3, 2017 paid property taxes below, at and above the general cap.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people: *lower_cap_people
    tax_units: *single_returns
    households: *homes
  output:
    nj_potential_property_tax_deduction: [9_999, 10_000, 10_000]

- name: Case 4, 2018 paid property taxes below, at and above the general cap.
  period: 2018
  absolute_error_margin: 0.01
  input:
    people: &higher_cap_people
      person1: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 14_999}
      person2: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 15_000}
      person3: {age: 40, is_tax_unit_head: true, is_tax_unit_spouse: false, is_tax_unit_dependent: false, real_estate_taxes: 15_001}
    tax_units: *single_returns
    households: *homes
  output:
    nj_potential_property_tax_deduction: [14_999, 15_000, 15_000]

- name: Case 5, 2019 paid property taxes below, at and above the general cap.
  period: 2019
  absolute_error_margin: 0.01
  input:
    people: *higher_cap_people
    tax_units: *single_returns
    households: *homes
  output:
    nj_potential_property_tax_deduction: [14_999, 15_000, 15_000]

- name: Case 6, 2020 paid property taxes below, at and above the general cap.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people: *higher_cap_people
    tax_units: *single_returns
    households: *homes
  output:
    nj_potential_property_tax_deduction: [14_999, 15_000, 15_000]

# Raw financial facts: wage-only income of $50,000, no NJ additions,
# subtractions, retirement exclusions or other income, and $20,000 qualifying
# property taxes. The 2017 WorksheetG cap gives min(20,000,10,000)=10,000.
# Compute NJ AGI and the existing eligibility gate; do not supply their outputs.
- name: Case 7, 2017 single homeowner computes the potential deduction from wages and paid taxes.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        employment_income_before_lsr: 50_000
        real_estate_taxes: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_potential_property_tax_deduction: 10_000
    nj_agi: 50_000
