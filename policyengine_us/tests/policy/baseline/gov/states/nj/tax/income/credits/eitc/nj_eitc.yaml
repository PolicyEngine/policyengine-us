- name: A parent whose federal EITC phase-out reduction exceeds the phase-in amount gets 40% of the federal EITC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 3_000
        unemployment_compensation: 30_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NJ
  output:
    # One child: phase-in 34% x $3,000 = $1,020; reduction 15.98% x ($33,000
    # - $23,350) = $1,542.07, below the $4,328 maximum, so the federal EITC is
    # $1,020. New Jersey matches 40% of it.
    eitc: 1_020
    nj_eitc: 408
