- name: Married separated head of household without a qualifying child gets no NJ age fallback
  # The filer is married under IRC 7703(a) (7703(b) gives only HoH status),
  # lived apart six months (is_separated default), but has no EITC
  # qualifying child, so IRC 32(d) denies the federal credit. The NJ
  # fallback waives only the age limits, so the marital failure denies it
  # too: federal 0, NJ 0. Before this fix NJ paid 0.4 x 649 = 259.60.
  period: 2025
  input:
    people:
      head:
        age: 55
        employment_income: 12_000
        is_separated: true
      adult_child:
        age: 30
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, adult_child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, adult_child]
        state_code: NJ
  output:
    eitc_spouses_lived_apart_last_six_months: true
    eitc_child_count: 0
    eitc_marital_eligible: false
    eitc: 0
    nj_childless_eitc_age_eligible: false
    nj_eitc: 0

- name: Unmarried 22-year-old without a qualifying child still gets the NJ age fallback
  # Below the federal minimum age of 25 but above NJ's minimum of 18.
  # 2025: NJ match 0.4 x federal zero-child maximum 649 = 259.60.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 22
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NJ
  output:
    eitc_marital_eligible: true
    eitc: 0
    nj_childless_eitc_age_eligible: true
    nj_eitc: 259.60

- name: Separate filer who meets the federal exception through a child without an SSN gets the federal credit but no NJ EITC
  # The child counts for IRC 32(d)(2)(B) and, from 2021, establishes federal
  # eligibility without the childless age test (32(c)(1)(A)(i)), but not
  # for the federal schedule (32(c)(3)(D)). So eitc_child_count is 0 and
  # the 22-year-old gets the zero-child credit: min(649, 0.0765 x 8,000 =
  # 612) = 612, below the 10,620 phase-out start. N.J.S.A. 54A:4-7a.(3)
  # requires a married claimant to file jointly, so NJ pays 0 on both the
  # federal route (otherwise 0.4 x 612 = 244.80) and the age fallback.
  period: 2025
  input:
    people:
      head:
        age: 22
        employment_income: 8_000
      child:
        age: 5
        ssn_card_type: NONE
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        eitc_spouses_lived_apart_last_six_months: true
    households:
      household:
        members: [head, child]
        state_code: NJ
  output:
    eitc_marital_eligible: true
    eitc_child_count: 0
    eitc_demographic_eligible: true
    eitc: 612
    nj_eitc_separate_filer_eligible: false
    nj_childless_eitc_age_eligible: false
    nj_eitc: 0

- name: Separate filer on the separation-instrument route gets the federal EITC but no NJ EITC
  # IRC 32(d)(2)(B)(ii)(II): a written separation instrument and living apart
  # at year end meet the federal exception. 2026, one child: phase-in
  # 0.34 x 20,000 = 6,800 caps at the 4,427 maximum, and 20,000 is below the
  # 23,890 phase-out start, so the federal EITC is 4,427. N.J.S.A.
  # 54A:4-7a.(3) requires a married claimant to file jointly, so NJ pays 0.
  period: 2026
  input:
    people:
      head:
        age: 35
        employment_income: 20_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        eitc_legal_separation_and_apart_at_year_end: true
    households:
      household:
        members: [head, child]
        state_code: NJ
  output:
    eitc: 4_427
    nj_eitc_separate_filer_eligible: false
    nj_eitc: 0

- name: Separate filer on the separation-instrument route with a child without an SSN gets the federal credit but no NJ EITC
  # The instrument route meets the federal marital test. The child without
  # an SSN makes the 22-year-old federally eligible but leaves
  # eitc_child_count at 0, so the federal credit is the zero-child 612.
  # N.J.S.A. 54A:4-7a.(3) bars a married separate filer from both NJ routes.
  period: 2025
  input:
    people:
      head:
        age: 22
        employment_income: 8_000
      child:
        age: 5
        ssn_card_type: NONE
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        eitc_legal_separation_and_apart_at_year_end: true
    households:
      household:
        members: [head, child]
        state_code: NJ
  output:
    eitc_marital_eligible: true
    eitc: 612
    nj_childless_eitc_age_eligible: false
    nj_eitc: 0

- name: Separate filer with a child and six months apart gets no NJ EITC, against the NJ-1040 line 58 instructions
  # The 2025 NJ-1040 instructions allow this filer the credit; the statute,
  # N.J.S.A. 54A:4-7a.(3), and N.J.A.C. 18:35-4.3(g)(3) require a married
  # claimant to file jointly, and the model follows them. Federal 2026, one
  # child: 4,427 - 0.1598 x (30,000 - 23,890) = 3,450.62. The instructions'
  # reading would pay 0.4 x 3,450.62 = 1,380.25.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 30_000
        is_separated: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
    households:
      household:
        members: [head, child]
        state_code: NJ
  output:
    eitc_spouses_lived_apart_last_six_months: true
    eitc: 3_450.62
    nj_eitc_separate_filer_eligible: false
    nj_eitc: 0

- name: Separate filer under a decree with a child gets the NJ match
  # IRC 7703(a)(2): a filer legally separated under a decree is not married,
  # so neither the federal marital test nor New Jersey's joint-filing rule
  # applies, with both separation routes false. 2025, one child: phase-in
  # 0.34 x 20,000 = 6,800 caps at 4,328, so NJ pays 0.4 x 4,328 = 1,731.20.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 20_000
        is_separated_under_decree: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        eitc_spouses_lived_apart_last_six_months: false
        eitc_legal_separation_and_apart_at_year_end: false
    households:
      household:
        members: [head, child]
        state_code: NJ
  output:
    eitc: 4_328
    nj_eitc_separate_filer_eligible: true
    nj_eitc: 1_731.20

- name: Separate filer under a decree without a child gets the NJ age fallback
  # The decree makes the 22-year-old unmarried (IRC 7703(a)(2)), so the
  # marital tests pass with no child. Below the federal minimum age of 25,
  # the filer reaches the age fallback: 2025, 0.4 x 649 = 259.60.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 22
        employment_income: 8_000
        is_separated_under_decree: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
    households:
      household:
        members: [head]
        state_code: NJ
  output:
    eitc: 0
    nj_childless_eitc_age_eligible: true
    nj_eitc: 259.60

# N.J.S.A. 54A:4-7(a), as amended by P.L. 2021, c.130. Paragraph (1): a
# resident eligible for the federal credit gets a percentage of "the federal
# earned income tax credit that would be allowed". Paragraph (4): a resident
# at least 18 who "cannot claim a qualifying child" and is ineligible for the
# federal credit "due to age requirements" gets a credit "predicated on the
# federal maximum amount for taxpayers with no qualifying child".

- name: 2023 NJ parent aged 20 whose only child lacks an SSN gets 40% of the federal credit allowed
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        is_full_time_student: false
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
        employment_income: 3_000
      child:
        age: 2
        is_tax_unit_dependent: true
        is_eitc_qualifying_child: true
        ssn_card_type: NONE
    tax_units:
      unit:
        members: [filer, child]
        filing_status: SINGLE
        eitc_relevant_investment_income: 0
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    households:
      household:
        members: [filer, child]
        state_code: NJ
  output:
    # From 2021 the child without an SSN makes the filer federally eligible
    # (IRC 32(c)(1)(A)(i)) but is left out of the amount (32(c)(3)(D)), so the
    # zero-child schedule applies: 7.65% x $3,000 = $229.50, below the $600
    # maximum.
    eitc_child_count: 0
    eitc_eligible: true
    eitc: 229.50
    # Paragraph (4) reaches only a resident ineligible for the federal credit
    # "due to age requirements". This filer is federally eligible, so
    # paragraph (1) governs: 40% x $229.50 = $91.80 (54A:4-7(a)(1)).
    nj_eitc: 91.80

- name: 2023 NJ childless filer aged 20 gets 40% of the federal zero-child maximum
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        is_full_time_student: false
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
        employment_income: 3_000
    tax_units:
      unit:
        members: [filer]
        filing_status: SINGLE
        eitc_relevant_investment_income: 0
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
    households:
      household:
        members: [filer]
        state_code: NJ
  output:
    # Under the federal childless minimum age of 25, so no federal credit.
    eitc_eligible: false
    eitc: 0
    # Ineligible federally only because of age and without a qualifying
    # child: 40% x the $600 zero-child maximum = $240 (54A:4-7(a)(4)).
    nj_childless_eitc_age_eligible: true
    nj_eitc: 240
