- name: A childless filer below the federal minimum age with unearned income under the federal AGI limit gets the age-path amount.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 20
        employment_income: 1_000
        unemployment_compensation: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # AGI $13,000 is below the $19,104 limit. The reduction, 7.65% x
    # ($13,000 - $10,620) = $182.07, exceeds the $76.50 phase-in amount but
    # not the $649 maximum, so the recomputed federal credit is $76.50 > 0.
    # 40% of $649.
    eitc: 0
    nj_eitc: 259.6

- name: A childless filer in the federal age range with the same income gets 40% of the federal EITC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 1_000
        unemployment_compensation: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # min($76.50, $649 - $182.07) = $76.50; 40% = $30.60.
    eitc: 76.5
    nj_eitc: 30.6

