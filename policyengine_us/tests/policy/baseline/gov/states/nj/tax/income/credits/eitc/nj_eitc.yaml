        foreign_earned_income_exclusion: 30_000
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_eitc: 0

# P.L. 2021, c.130, section 1a(4): the age path pays 40% of the federal
# childless maximum only to a filer "ineligible to claim the federal earned
# income tax credit due to age requirements" who meets "all qualifications,
# except for the minimum or maximum age". 2025 childless figures: maximum
# $649, phase-in 7.65%, phase-out from $10,620 at 7.65% (Rev. Proc. 2024-40).
- name: A childless filer in the federal age range who does not take up the federal EITC gets no New Jersey EITC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        takes_up_eitc: false
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    # The filer meets the federal age test, so the age path does not apply;
    # New Jersey matches the federal credit allowed, $0.
    eitc: 0
    nj_childless_eitc_age_eligible: false
    nj_eitc: 0

