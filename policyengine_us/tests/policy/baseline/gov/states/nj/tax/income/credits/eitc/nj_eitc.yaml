        age: 20
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: NJ
  output:
    # P.L.2021 c.130 keeps every federal qualification except age, including
    # IRC 32(c)(1)(A)(ii)(III): not a dependent of another taxpayer (either
