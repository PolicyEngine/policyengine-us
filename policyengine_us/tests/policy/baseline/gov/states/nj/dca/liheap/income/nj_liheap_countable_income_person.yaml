# Sources for the expected values in this file:
# - FY2026 LIHEAP Handbook, sections 2.2.5 (page 6), 2.3.C (page 7), 2.3.D and
#   2.3.E.3 (page 8), 2.3.E.8, 2.3.E.9 and 2.3.E.10 (page 9) and 2.3.F.7
#   (page 10):
#   https://www.nj.gov/dca/dhcr/offices/docs/FY2026%20LIHEAP%20Handbook%20.pdf#page=6
# - FY2026 LIHEAP State Plan, sections 1.8 and 1.9 (pages 6 and 7; the child
#   earnings box is on page 7):
#   https://liheapch.acf.gov/docs/2026/state-plans/NJ_Plan_2026.pdf#page=6

# Household 1 is a parent (person4) living with a 17-year-old (person1) and a
# 20-year-old full-time student (person2). Household 2 is a 20-year-old
# full-time student living alone (person3). Each person has 12_000 in wages,
# 600 of specified-service business income and 1_200 of farm income; the first
# three also have 1_000 of other self-employment income and the parent has a
# 1_000 self-employment loss.
# - person1: "Earned income of a child under the age of 18" is not a countable
#   form of income (State Plan section 1.9, page 7): 0.
# - person2: "Earned income of a student who is a member of a larger household,
#   enrolled in any school or training program full-time" is excluded (handbook
#   section 2.3.E.3, page 8): 0.
# - person3: a student living alone is not a member of a larger household, so
#   wages and self-employment income count (section 2.3.C, page 7):
#   12_000 + 1_000 + 600 + 1_200 = 14_800.
# - person4: 12_000 + 0 + 600 + 1_200 = 13_800. The 1_000 loss is floored at
#   zero for that source, a modeling convention.
- name: Case 1, child and student earnings are excluded while adult wages and business income count.
  period: 2026
  input:
    people:
      person1:
        age: 17
        is_full_time_student: false
        employment_income: 12_000
        self_employment_income: 1_000
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        ssi: 0
      person2:
        age: 20
        is_full_time_student: true
        employment_income: 12_000
        self_employment_income: 1_000
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        ssi: 0
      person3:
        age: 20
        is_full_time_student: true
        employment_income: 12_000
        self_employment_income: 1_000
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        ssi: 0
      person4:
        age: 40
        is_full_time_student: false
        employment_income: 12_000
        self_employment_income: -1_000
        sstb_self_employment_income: 600
        farm_operations_income: 1_200
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person4]
      spm_unit2:
        members: [person3]
    households:
      household1:
        members: [person1, person2, person4]
        state_code: NJ
      household2:
        members: [person3]
        state_code: NJ
  output:
    nj_liheap_countable_income_person: [0, 0, 14_800, 13_800]

# Three one-person households, each with 12_000 of Social Security, 600 of SSI
# and 5_000 of veterans benefits.
# - Age 17: "Social Security benefits for children under 18 years old shall be
#   excluded" (handbook section 2.3.E.9, page 9), leaving the SSI: 600.
# - Age 40 paying a 1_200 Medicare Part B premium: section 2.3.F.7(a) (page
#   10) deducts the premium from gross Social Security, and 2.3.E.8 (page 9)
#   excludes the Part B buy-in withheld from the check:
#   12_000 - 1_200 + 600 = 11_400.
# - Age 40 with no premium: 12_000 + 600 = 12_600.
# Veterans benefits are excluded for all three (section 2.3.E.10, page 9).
- name: Case 2, child Social Security is excluded and adult Social Security counts net of the Part B premium.
  period: 2026
  input:
    state_code: [NJ, NJ, NJ]
    age: [17, 40, 40]
    social_security: [12_000, 12_000, 12_000]
    medicare_part_b_premium: [0, 1_200, 0]
    ssi: [600, 600, 600]
    veterans_benefits: [5_000, 5_000, 5_000]
  output:
    nj_liheap_countable_income_person: [600, 11_400, 12_600]

# Three undocumented adults with wages only. Handbook section 2.2.5 (page 6):
# "If the non-qualified citizens have a monthly income of more than $500.00,
# the amount in excess of $500.00 shall be counted as income to the household."
# The annual disregard is 500 * 12 = 6_000 for each such member.
# - 5_000 - 6_000 is below zero: 0.
# - 6_000 - 6_000 = 0.
# - 7_200 - 6_000 = 1_200.
- name: Case 3, each nonqualified member has the monthly disregard.
  period: 2026
  input:
    state_code: [NJ, NJ, NJ]
    age: [40, 40, 40]
    immigration_status: [UNDOCUMENTED, UNDOCUMENTED, UNDOCUMENTED]
    employment_income: [5_000, 6_000, 7_200]
    ssi: [0, 0, 0]
  output:
    nj_liheap_countable_income_person: [0, 0, 1_200]

# Two adults with 60_000 of wages who each own a rental property. State Plan
# section 1.8 (page 6) counts gross income and handbook section 2.3.D (page 8)
# counts "receipts from the rental of property", so each source is floored at
# zero and a loss does not offset the wages.
# - A 20_000 rental loss: 60_000 + 0 = 60_000.
# - 20_000 of rental income: 60_000 + 20_000 = 80_000.
- name: Case 4, a rental loss is floored at zero and rental income counts.
  period: 2026
  input:
    state_code: [NJ, NJ]
    age: [40, 40]
    employment_income: [60_000, 60_000]
    rental_income: [-20_000, 20_000]
    ssi: [0, 0]
  output:
    nj_liheap_countable_income_person: [60_000, 80_000]

# Two people who are not students, each with 12_000 of wages and 6_000 of
# Social Security and no Part B premium. "Earned income of a child under the
# age of 18" (State Plan section 1.9, page 7) and "Social Security benefits for
# children under 18 years old" (handbook section 2.3.E.9, page 9) are excluded,
# so 18 is the first counted age.
# - Age 17: 0.
# - Age 18: 12_000 + 6_000 = 18_000.
- name: Case 5, earnings and Social Security count from age 18.
  period: 2026
  input:
    state_code: [NJ, NJ]
    age: [17, 18]
    is_full_time_student: [false, false]
    employment_income: [12_000, 12_000]
    social_security: [6_000, 6_000]
    medicare_part_b_premium: [0, 0]
    ssi: [0, 0]
  output:
    nj_liheap_countable_income_person: [0, 18_000]

# One adult with every listed unearned source (handbook section 2.3.D, page 8;
# parameter gov.states.nj.dca.liheap.income.sources.unearned) at 100 times its
# position in the list, 100 to 1_400, and no earnings or Social Security:
# 100 * (1 + 2 + ... + 14) = 10_500.
- name: Case 6, every listed unearned source counts.
  period: 2026
  input:
    state_code: NJ
    age: 40
    social_security: 0
    unemployment_compensation: 100
    strike_benefits: 200
    ssi: 300
    pension_income: 400
    survivor_benefits: 500
    general_assistance: 600
    rental_income: 700
    farm_rent_income: 800
    alimony_income: 900
    child_support_received: 1_000
    interest_income: 1_100
    ordinary_dividend_income: 1_200
    workers_compensation: 1_300
    disability_benefits: 1_400
  output:
    nj_liheap_countable_income_person: 10_500
