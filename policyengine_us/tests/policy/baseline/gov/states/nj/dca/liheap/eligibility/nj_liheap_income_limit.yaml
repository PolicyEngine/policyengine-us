# Source for the expected values in this file: FFY 2026 fact sheet, page 2,
# "FY2026 Program Income Limit ... (60% State Median Income)":
# https://nj.gov/dca/dhcr/offices/docs/FY2026%20USFHEA%20Factsheet%20-%20English.pdf#page=2
# The income test is monthly (FY2026 LIHEAP Handbook section 2.3.A, page 7), so
# each expected value is the published monthly limit times 12. This file
# asserts the odd sizes of the published table (1, 3, 5, 7, 9 and 11) plus the
# additional-member increment; the grid cases in ../nj_liheap.yaml use the even
# sizes.
#   size 1:  4,167 * 12 = 50_004      size 7:  10,819 * 12 = 129_828
#   size 3:  6,732 * 12 = 80_784      size 9:  11,299 * 12 = 135_588
#   size 5:  9,296 * 12 = 111_552     size 11: 11,780 * 12 = 141_360
# "Household members greater than 12 - Please add $241 for each additional
# member for monthly income limit", starting from the size-12 limit of 12,021:
#   size 13: (12,021 + 241) * 12 = 12,262 * 12 = 147_144
#   size 14: (12,021 + 2 * 241) * 12 = 12,503 * 12 = 150_036
- name: Case 1, published monthly limits for the odd sizes 1 to 11 and the additional-member increment.
  period: 2026
  input:
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    state_code: [NJ, NJ, NJ, NJ, NJ, NJ, NJ, NJ]
    nj_liheap_household_size: [1, 3, 5, 7, 9, 11, 13, 14]
  output:
    nj_liheap_income_limit: [50_004, 80_784, 111_552, 129_828, 135_588, 141_360, 147_144, 150_036]
