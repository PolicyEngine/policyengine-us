# Sources for the expected values in this file:
# - FY2026 Benefit Matrix (one page; four fuel panels, each with the columns
#   "All Other (19) counties" and "Warren & Sussex Counties"):
#   https://nj.gov/dca/dhcr/offices/docs/FY2026%20Benefit%20Matrix.pdf
# - FFY 2026 fact sheet, income limits on page 2:
#   https://nj.gov/dca/dhcr/offices/docs/FY2026%20USFHEA%20Factsheet%20-%20English.pdf#page=2
# - FY2026 LIHEAP Handbook, sections 2.2 (page 5), 2.3.A (page 7), 3.1.a.3
#   (page 11) and 3.2.F (page 12):
#   https://www.nj.gov/dca/dhcr/offices/docs/FY2026%20LIHEAP%20Handbook%20.pdf#page=5
# - FY2027 Benefit Matrix (one page; identical to FY2026 except one Warren &
#   Sussex renters cell, Cases 18 and 19):
#   https://www.nj.gov/dca/dhcr/offices/docs/FY2027%20Benefit%20Matrix.png
# - N.J.A.C. 5:49-2.2(d)1.i, the renter's level for subsidized direct payers
#   (Case 13): https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-5-49-2-2
#
# Cases 1 to 8 read the printed cells of one panel and one county column each.
# Eligibility is set directly because these cases test the grid lookup, not the
# income test. In every one of them:
# - Monthly income is 0, 77_280 / 12 = 6,440, 106_644 / 12 = 8,887 and
#   115_920 / 12 = 9,660: the first dollar of the printed rows "$0 - $1000",
#   "$6440 - $8886", "$8887 - $9659" and "$9660 +". The rows "$1001 - $2000"
#   and "$2001 - $6439" print the same amounts as "$0 - $1000" (Case 10); the
#   model keeps "$2001 - $6439" as its own band for the FY2027 cell of Case 18.
# - Sizes 2, 6, 10 and 14 are the smallest even sizes in the printed columns
#   "1 to 4", "5 to 8", "9 to 12" and "13 or More". One even size stands for
#   each size group here; Case 15 crosses the column edges at sizes 8, 9, 12
#   and 13, and eligibility/nj_liheap_income_limit.yaml asserts the published
#   limit for every size.

