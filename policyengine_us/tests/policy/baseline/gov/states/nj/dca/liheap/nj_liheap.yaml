# One simulation holding a Newark (Essex County) household and a Brooklyn
# (Kings County, New York) household. Each is a single adult working full time
# who heats with natural gas billed in their own name. Neither receives
# WFNJ/TANF or SSI. Nothing is set on the New Jersey unit except what an
# applicant would report.
# - New Jersey unit: wages 42_000 / 12 = 3,500 a month, which does not exceed
#   the one-person limit of $4,167 (fact sheet, page 2), so the household is
#   income eligible (handbook section 2.3.A, page 7). Gas panel, "All Other
#   (19) counties", row "$2001 - $6439", column "1 to 4": $334.
# - New York unit: household members must be residents of New Jersey (handbook
#   section 2.2, page 5), so it is not eligible and receives $0.
- name: Case 11, New Jersey household and New York household in one simulation.
  period: 2026
  input:
    state_code: [NJ, NY]
    county: [ESSEX_COUNTY_NJ, KINGS_COUNTY_NY]
    age: [34, 41]
    employment_income: [42_000, 48_000]
    ssi: [0, 0]
    tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_300, 1_500]
  output:
    nj_liheap_eligible: [true, false]
    nj_liheap: [334, 0]

- name: Case 12, farm rental income puts a gas-heating household over the income limit.
  period: 2026
  input:
    state_code: NJ
    county: SUSSEX_COUNTY_NJ
    age: 45
    immigration_status: CITIZEN
    employment_income: 36_000
    farm_rent_income: 24_000
    rental_income: 0
    ssi: 0
