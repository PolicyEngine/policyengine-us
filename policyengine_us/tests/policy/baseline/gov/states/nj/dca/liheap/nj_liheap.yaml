#   page 12).
# - Section 8 voucher: N.J.A.C. 5:49-2.2(d)1.i, "Households receiving a rent
#   subsidy which does not include all of their heating costs and have a
#   heating bill in their name are entitled to assistance at a renter's
#   benefit level": Renters panel, $234. Handbook section 2.2 (page 6) copies
#   (d)1 without that subparagraph and prints no contrary rule.
# - Public housing with its own bill: eligible under N.J.A.C. 5:49-2.3(b)1 and
#   read with the rent subsidy, so also $234.
