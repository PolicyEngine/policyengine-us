- name: Case 1, eligible couple rounds each half up.
  period: 2026-01
  absolute_error_margin: 0.001
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: &id001 [person1, person2]
    households:
      household:
        members: *id001
        state_code: NJ
  output:
    nj_ssp: [12.68, 12.68]

