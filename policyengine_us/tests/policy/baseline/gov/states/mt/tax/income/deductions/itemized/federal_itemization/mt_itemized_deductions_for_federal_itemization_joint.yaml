# 2022 Form 2 instructions, Itemized Deductions Schedule, line 15 (PDF pp. 35-36):
# complete federal Form 4684 using Montana AGI in place of federal AGI; spouses
# filing separately each complete their own Form 4684. A joint return pools the
# tax unit's losses, so they must be counted once, not once per member.

- name: A couple's casualty loss counts once on a joint return
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        employment_income: 60_000
        casualty_loss: 30_000
        mt_salt_deduction: 0
      person2:
        age: 40
        employment_income: 40_000
        mt_salt_deduction: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_federal_income_tax_deduction_for_federal_itemization: 0
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # (30,000 - 100) - 10% x 100,000 Montana AGI, counted once.
    mt_itemized_deductions_for_federal_itemization_joint: [19_900, 0]

- name: A dependent in the tax unit does not repeat the joint casualty loss
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        employment_income: 60_000
        casualty_loss: 30_000
        mt_salt_deduction: 0
      person2:
        age: 40
        employment_income: 40_000
        mt_salt_deduction: 0
      person3:
        age: 10
        is_tax_unit_dependent: true
        mt_salt_deduction: 0
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        mt_federal_income_tax_deduction_for_federal_itemization: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_itemized_deductions_for_federal_itemization_joint: [19_900, 0, 0]
