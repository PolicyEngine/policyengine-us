- name: R1 2024 gambling losses sit in Form 1040 line 12 and change the addback
  # Federal AGI = 50,000 wages + 20,000 gambling winnings = 70,000 (Form 1040
  # line 11). Federal AGI is an input because the model does not yet count
  # gambling winnings in gross income (policyengine-us#9637).
  # Schedule A: charity 2,000 + SALT 4,000 + gambling losses 20,000 (line 16)
  # = 26,000 > 14,600, so the filer itemizes.
  # Revised Worksheet A L1=4,000; L2=L3=L4=0; L5=4,000; L6=26,000;
  # L7=14,600; L8=11,400; L9=4,000; L10=22,000.
  # Form 2 L1=70,000; L2=22,000; L3=48,000; L4=L5=L6=0; L7=48,000;
  # tax=48,000 x 5.9% - 246 = 2,586.
  # Leaving gambling losses out of L6 would give L6=6,000 < L7, L9=0,
  # L2=26,000 and L3=44,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
        gambling_winnings: 20_000
        gambling_losses: 20_000
        charitable_cash_donations: 2_000
    tax_units:
      tax_unit:
        members: [head]
        adjusted_gross_income: 70_000
        state_withheld_income_tax: 4_000
        state_sales_tax: 0
        local_sales_tax: 0
        local_income_tax: 0
    households:
      household:
        members: [head]
        state_code: MT
  output:
    tax_unit_itemizes: true
