# Montana caps a joint return at $10,000 and each separate column at $5,000.
# Taxpayers elect sales taxes or local income taxes under IRC 164(b)(5)(A).

- name: Each spouse's column is capped at the married filing separately amount
  period: 2023
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 8_000
      person2:
        age: 45
        real_estate_taxes: 8_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Column A: min(8,000, 5,000); column B: min(8,000, 5,000).
    mt_salt_deduction_indiv: [5_000, 5_000]
    # No income, so the federal income tax deduction (line 4) is zero and
    # line 5 is each column's only itemized deduction.
    mt_itemized_deductions_indiv: [5_000, 5_000]

- name: A spouse below the cap deducts their own taxes
  period: 2022
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 8_000
      person2:
        age: 45
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Column A: min(8,000, 5,000); column B: 2,000.
    mt_salt_deduction_indiv: [5_000, 2_000]

- name: The couple's general sales taxes are divided equally between the columns
  period: 2021
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 4_800
      person2:
        age: 45
    tax_units:
      tax_unit:
        members: [person1, person2]
        state_sales_tax: 1_000
        local_sales_tax: 0
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Line 5a: 1,000 / 2 = 500 in each column.
    # Column A: min(4,800 + 500, 5,000) = 5,000; column B: 500.
    mt_salt_deduction_indiv: [5_000, 500]

- name: A dependent has no column
  period: 2023
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 3_000
      person2:
        age: 45
        real_estate_taxes: 1_000
      person3:
        age: 20
        is_tax_unit_dependent: true
        real_estate_taxes: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_salt_deduction_indiv: [3_000, 1_000, 0]

- name: A single filer's one column takes the single cap
  period: 2023
  input:
     filing_status: SINGLE
     real_estate_taxes: 12_000
     state_code: MT
  output:
     # min(12,000, 10,000)
     mt_salt_deduction_indiv: 10_000

- name: A single filer below the single cap deducts all taxes
  period: 2022
  input:
     filing_status: SINGLE
     real_estate_taxes: 8_000
     state_code: MT
  output:
     mt_salt_deduction_indiv: 8_000

- name: A married person filing on a separate form takes the separate cap
  period: 2021
  input:
     filing_status: SEPARATE
     real_estate_taxes: 6_000
     state_code: MT
  output:
     # min(6,000, 5,000)
     mt_salt_deduction_indiv: 5_000

- name: No separate columns from 2024
  period: 2024
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 8_000
      person2:
        age: 45
        real_estate_taxes: 8_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # SB 399 ended filing separately on the same form after 2023.
    mt_salt_deduction_indiv: [0, 0]

# Each spouse claims the city income tax on their own earnings
# (2023 Form 2 instructions, PDF p. 13).

- name: A city earnings tax goes in the column of the spouse who earned it
  period: 2023
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 3_000
        mo_kansas_city_earnings_tax_taxable_earnings: 100_000
      person2:
        age: 45
        real_estate_taxes: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Column A: 3,000 + 1% x 100,000 = 4,000; column B: 3,000.
    mt_salt_deduction_indiv: [4_000, 3_000]

- name: Both spouses' city earnings taxes, one column at the cap
  period: 2022
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 4_500
        mo_kansas_city_earnings_tax_taxable_earnings: 100_000
      person2:
        age: 45
        mo_kansas_city_earnings_tax_taxable_earnings: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Kansas City tax: 1,000 on column A's earnings and 500 on column B's.
    # Column A: min(4,500 + 1,000, 5,000) = 5,000; column B: 500.
    mt_salt_deduction_indiv: [5_000, 500]

- name: Each column takes its own spouse's Philadelphia wage tax at that spouse's rate
  period: 2023
  input:
    people:
      person1:
        age: 45
        pa_philadelphia_wage_tax_taxable_wages: 100_000
      person2:
        age: 45
        pa_philadelphia_wage_tax_taxable_wages: 100_000
        pa_philadelphia_wage_tax_reduced_rate_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Nonresident rate 3.44% x 100,000 = 3,440; reduced rate 1.5% x 100,000
    # = 1,500. Splitting the 4,940 by wages would give 2,470 each.
    mt_salt_deduction_indiv: [3_440, 1_500]

- name: A St. Louis credit reduces only its own spouse's column
  period: 2023
  input:
    people:
      person1:
        age: 45
        mo_st_louis_earnings_tax_taxable_earnings: 100_000
        mo_st_louis_earnings_tax_credit: 1_000
      person2:
        age: 45
        mo_st_louis_earnings_tax_taxable_earnings: 100_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Column A: 1% x 100,000 - 1,000 credit = 0; column B: 1,000.
    mt_salt_deduction_indiv: [0, 1_000]

- name: Two cities' taxes, one column at the cap
  period: 2023
  input:
    people:
      person1:
        age: 45
        real_estate_taxes: 4_000
        mo_kansas_city_earnings_tax_taxable_earnings: 100_000
      person2:
        age: 45
        pa_philadelphia_wage_tax_taxable_wages: 100_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Column A: min(4,000 + 1% x 100,000, 5,000) = 5,000.
    # Column B: 3.44% x 100,000 = 3,440.
    mt_salt_deduction_indiv: [5_000, 3_440]

- name: Each column receives half the local income tax without a person allocation
  period: 2023
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 4_500
      spouse:
        age: 45
    tax_units:
      tax_unit:
        members: [head, spouse]
        local_income_tax: 2_000
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Half of 2,000 gives each column 1,000. Only the head reaches 5,000.
    mt_salt_deduction_indiv: [5_000, 1_000]

- name: Each column keeps its city tax and half the remaining local income tax
  period: 2022
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 1_000
        mo_kansas_city_earnings_tax_taxable_earnings: 100_000
      spouse:
        age: 45
    tax_units:
      tax_unit:
        members: [head, spouse]
        local_income_tax: 3_000
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Kansas City tax: 1,000. Remaining tax: 3,000 - 1,000 = 2,000.
    # Head: 1,000 property + 1,000 city + 1,000 remaining; spouse: 1,000.
    mt_salt_deduction_indiv: [3_000, 1_000]

- name: Spouses independently elect local income taxes and sales taxes
  period: 2021
  input:
    people:
      head:
        age: 45
        mo_kansas_city_earnings_tax_taxable_earnings: 200_000
      spouse:
        age: 45
    tax_units:
      tax_unit:
        members: [head, spouse]
        state_sales_tax: 2_000
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Head elects 2,000 city tax over 1,000 sales tax; spouse elects 1,000 sales.
    mt_salt_deduction_indiv: [2_000, 1_000]
    # A joint return elects between total sales and income taxes: max(2,000, 2,000).
    mt_salt_deduction: [2_000, 0]

- name: A column elects sales taxes before adding its own real estate taxes
  period: 2023
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 1_000
        mo_kansas_city_earnings_tax_taxable_earnings: 100_000
      spouse:
        age: 45
    tax_units:
      tax_unit:
        members: [head, spouse]
        state_sales_tax: 4_000
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Head: 1,000 property + max(2,000 sales, 1,000 city) = 3,000.
    # Spouse elects 2,000 sales; joint return: 1,000 + max(4,000, 1,000).
    mt_salt_deduction_indiv: [3_000, 2_000]
    mt_salt_deduction: [5_000, 0]
