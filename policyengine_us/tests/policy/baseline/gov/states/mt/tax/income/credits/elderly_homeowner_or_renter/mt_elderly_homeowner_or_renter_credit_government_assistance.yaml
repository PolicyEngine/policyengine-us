# Government assistance in gross household income: SSI, TANF and workers'
# compensation. § 15-30-2337(9)(a) counts "all nontaxable income, including
# but not limited to ... (vi) cash public assistance and relief". 2024 and
# 2025 Schedule 2EC line 16: "This includes veteran's compensation benefits,
# supplemental security income (SSI) payments, worker's compensation, and any
# other government assistance received during the year." The 2014-2023
# instructions list "Disability benefits including, but not limited to,
# veteran's disability, SSI payments and workers' compensation", and the
# 2014-2017 instructions add "Cash public assistance and relief - Do not
# include LIEAP ... or SNAP".

- name: 2024 Schedule 2EC worked case, the claimant's SSI counts on line 16
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
        ssi: 6_000
        real_estate_taxes: 1_200
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # Line 5 pensions 15_000; line 16 SSI 6_000; line 18 = 21_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_000
    # Line 19 12_600; line 20 = 8_400; line 21 = 0.039 (8_000 to 8_999);
    # line 22 = 8_400 x 0.039 = 327.60.
    mt_elderly_homeowner_or_renter_credit_net_household_income: 327.60
    # Line 23 = 1_200; line 26 = 1_200; line 27 = 1_200 - 327.60 = 872.40;
    # line 28 = 872.40 (under 1_150); line 29 = 100%; line 30 = 872.40.
    # Without the SSI, line 18 = 15_000, line 22 = 2_400 x 0.006 = 14.40 and
    # the credit would be the 1_150 cap.
    mt_elderly_homeowner_or_renter_credit: 872.40

- name: 2025 Schedule 2EC worked case, a household member's workers' compensation counts on line 17
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        taxable_pension_income: 18_000
        real_estate_taxes: 1_500
      person2:
        age: 45
        workers_compensation: 9_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # The claimant's adult son lives in the household and files his own
    # return. Line 5 pensions 18_000; line 17 his workers' compensation, a
    # line 16 item for another member, 9_000; line 18 = 27_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [18_000, 9_000]
    # Line 20 = 27_000 - 12_600 = 14_400; line 21 = 0.05; line 22 = 720.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [720, 0]
    # Line 27 = 1_500 - 720 = 780; line 28 = 780; line 29 = 100%; line 30 =
    # 780. Without his workers' compensation, line 18 = 18_000, line 22 =
    # 5_400 x 0.028 = 151.20 and the credit would be the 1_150 cap.
    mt_elderly_homeowner_or_renter_credit: [780, 0]

- name: 2024 Schedule 2EC worked case, TANF in a shared SPM unit counts once across two returns
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 1_500
      person2:
        age: 30
      person3:
        age: 5
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 4_800
    households:
      household:
        members: [person1, person2, person3]
        state_name: MT
  output:
    # The claimant's daughter and granddaughter live with her; the daughter
    # files her own return and receives 4_800 of TANF. Line 5 pensions
    # 20_000; line 17 the TANF 4_800; line 18 = 24_800. The model holds TANF
    # for the SPM unit and counts each member's per capita share
    # (tanf_person, 1_600 each), so the household total counts it once.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [21_600, 1_600, 1_600]
    # Line 20 = 24_800 - 12_600 = 12_200; line 21 = 0.05; line 22 = 610.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [610, 0, 0]
    # Line 27 = 1_500 - 610 = 890; line 28 = 890; line 29 = 100%; line 30 =
    # 890. Without the TANF, line 18 = 20_000, line 22 = 7_400 x 0.035 = 259
    # and the credit would be the 1_150 cap. Counting the whole 4_800 for
    # each of the three members would give line 18 = 34_400 and a credit of
    # 1_500 - 1_090 = 410.
    mt_elderly_homeowner_or_renter_credit: [890, 0, 0]

- name: 2024 Schedule 2EC worked case, Montana TANF paid to a separate SPM unit counts on line 17
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 1_500
      person2:
        age: 30
      person3:
        age: 5
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2, person3]
        mt_tanf: 4_800
    households:
      household:
        members: [person1, person2, person3]
        state_name: MT
  output:
    # The same household with the daughter's family in its own SPM unit and
    # the payment entered as Montana TANF (ARM 37.78), which tanf sums with
    # the other states' programs. Line 17 = 4_800; line 18 = 24_800.
    tanf: [0, 4_800]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 2_400, 2_400]
    # Line 22 = (24_800 - 12_600) x 0.05 = 610; line 27 = 890; line 30 = 890.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [610, 0, 0]
    mt_elderly_homeowner_or_renter_credit: [890, 0, 0]

- name: 2023 Elderly Homeowner/Renter Credit Schedule worked case, workers' compensation and a spouse's SSI count on line 8
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        taxable_pension_income: 14_000
        workers_compensation: 6_000
        real_estate_taxes: 1_000
      person2:
        age: 64
        ssi: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # Joint return. Line 1 federal AGI 14_000; line 8 "Disability benefits
    # including, but not limited to, veteran's disability, SSI payments, and
    # workers' compensation": 6_000 + 5_000 = 11_000; line 10 = 25_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 5_000]
    # Line 11 12_600; line 12 = 12_400; line 13 = 0.05; line 14 = 620.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [620, 0]
    # Line 15 = 1_000; line 18 = 1_000; line 19 = 1_000 - 620 = 380; line 20
    # = 380; line 21 = 100%; line 22 = 380. Without either amount, line 10 =
    # 14_000, line 12 = 1_400 at a 0 rate and the credit would be 1_000.
    mt_elderly_homeowner_or_renter_credit: [380, 0]

- name: 2017 Form 2EC worked case, a household member's SSI counts in gross household income
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
        real_estate_taxes: 1_000
      person2:
        age: 40
        # 2017 federal benefit rate: 735 a month.
        ssi: 8_820
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # The claimant's adult son receives SSI. Gross Household Income
    # Worksheet: line 6 pensions 15_000; line 7 income of other household
    # members, his SSI 8_820 ("Disability benefits including ... SSI
    # payments"); line 8 = 23_820, Form 2EC line 1.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [15_000, 8_820]
    # Line 2 6_300; line 3 = 17_520; line 4 = 0.05; line 5 = 876.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [876, 0]
    # Line 6 = 1_000; line 9 = 1_000; line 10 = 1_000 - 876 = 124; line 11 =
    # 124 (under 1_000); line 12 = 100%; line 13 = 124. Without his SSI, line
    # 1 = 15_000, line 5 = 8_700 x 0.039 = 339.30 and the credit 660.70.
    mt_elderly_homeowner_or_renter_credit: [124, 0]

- name: 2016 Form 2EC worked case, cash public assistance received by another household member counts
  period: 2016
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 12_000
        real_estate_taxes: 900
      person2:
        age: 30
      person3:
        age: 5
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2, person3]
        tanf: 5_400
    households:
      household:
        members: [person1, person2, person3]
        state_name: MT
  output:
    # Gross Household Income Worksheet line 7, "Alimony, cash public
    # assistance, unemployment", for the daughter's 5_400 of TANF; line 9 =
    # 12_000 + 5_400 = 17_400, Form 2EC line 1.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [12_000, 2_700, 2_700]
    # Line 2 6_300; line 3 = 11_100; line 4 = 0.048; line 5 = 532.80.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [532.80, 0, 0]
    # Line 6 = 900; line 10 = 900 - 532.80 = 367.20; line 11 = 367.20; line
    # 12 = 100%; line 13 = 367.20. Without the TANF, line 1 = 12_000, line 5
    # = 5_700 x 0.028 = 159.60 and the credit 740.40.
    mt_elderly_homeowner_or_renter_credit: [367.20, 0, 0]

- name: SNAP is not cash public assistance and does not count
  period: 2017
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
    spm_units:
      spm_unit:
        members: [person1]
        snap: 1_800
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # 2017 Form 2EC instructions: "Cash, public assistance and relief - Do
    # not include LIEAP (Low Income Energy Assistance Program) or SNAP".
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 15_000
