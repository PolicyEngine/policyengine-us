- name: Person with income over the standard deduction amount
  period: 2022
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 7_000
    filing_status: JOINT
    state_code: MT
  output:
    mt_withheld_income_tax: 19.1

- name: Changing the filing status should not change the output 
  period: 2022
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 7_000
    filing_status: SURVIVING_SPOUSE
    state_code: MT
  output:
    mt_withheld_income_tax: 19.1

- name: Capped at 0
  period: 2022
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 5_000
    filing_status: SURVIVING_SPOUSE
    state_code: MT
  output:
    mt_withheld_income_tax: 0

- name: From 2024, a single filer's estimate uses the federal standard deduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 60_000
    filing_status: SINGLE
    state_code: MT
  output:
    # (60,000 - 16,100) * 4.7%
    mt_withheld_income_tax: 2_063.3

- name: One-earner joint return uses the joint brackets and standard deduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 169_000
      spouse:
        adjusted_gross_income_person: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Taxable income 169,000 - 32,200 = 136,800:
    # 95,000 * 4.7% + 41,800 * 5.65% = 6,826.70, all on the earner.
    mt_withheld_income_tax: [6_826.7, 0]
    state_withheld_income_tax: 6_826.7

- name: Two-earner joint return splits the estimate by AGI
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 100_000
      spouse:
        adjusted_gross_income_person: 50_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Taxable income 150,000 - 32,200 = 117,800:
    # 95,000 * 4.7% + 22,800 * 5.65% = 5,753.20, split 2/3 and 1/3.
    mt_withheld_income_tax: [3_835.47, 1_917.73]
    state_withheld_income_tax: 5_753.2

- name: Head of household uses the head-of-household brackets and standard deduction
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 90_000
      child:
        adjusted_gross_income_person: 0
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: MT
  output:
    # (90,000 - 24,150) * 4.7%, below the 71,250 threshold
    mt_withheld_income_tax: [3_094.95, 0]

- name: A member with negative AGI lowers the unit's estimate but carries none of it
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 120_000
      spouse:
        adjusted_gross_income_person: -10_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # (110,000 - 32,200) * 4.7%
    mt_withheld_income_tax: [3_656.6, 0]

- name: AGI below the federal standard deduction gives no estimate
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 16_000
    filing_status: SINGLE
    state_code: MT
  output:
    mt_withheld_income_tax: 0

- name: Long-term capital gains straddling the threshold are taxed at the capital gains rates
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 80_000
    long_term_capital_gains: 30_000
    filing_status: SINGLE
    state_code: MT
  output:
    # Taxable income 63,900; ordinary income 33,900 * 4.7% = 1,593.30.
    # Gains: 13,600 * 3% = 408 below the 47,500 threshold, 16,400 * 4.1% = 672.40.
    mt_withheld_income_tax: 2_673.7

- name: A short-term capital loss limits the gains taxed at the capital gains rates
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 80_000
    long_term_capital_gains: 30_000
    short_term_capital_gains: -10_000
    filing_status: SINGLE
    state_code: MT
  output:
    # Gains 20,000; ordinary income 43,900 * 4.7% = 2,063.30.
    # Gains: 3,600 * 3% = 108, 16,400 * 4.1% = 672.40.
    mt_withheld_income_tax: 2_843.7

- name: 2024 joint return
  period: 2024
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 100_000
    filing_status: JOINT
    state_code: MT
  output:
    # Taxable income 100,000 - 29,200 = 70,800:
    # 41,000 * 4.7% + 29,800 * 5.9%
    mt_withheld_income_tax: 3_685.2

- name: A dependent's capital gains are left out of the parents' estimate
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 100_000
      spouse:
        adjusted_gross_income_person: 50_000
      child:
        age: 15
        is_tax_unit_dependent: true
        adjusted_gross_income_person: 0
        long_term_capital_gains: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse, child]
        state_code: MT
  output:
    # The child's gains are on the child's own return, so the estimate
    # matches the two-earner case: 95,000 * 4.7% + 22,800 * 5.65% = 5,753.20.
    mt_withheld_income_tax: [3_835.47, 1_917.73, 0]
    state_withheld_income_tax: 5_753.2

- name: Separate filer uses the separate brackets and capital gains threshold
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income_person: 90_000
    long_term_capital_gains: 20_000
    filing_status: SEPARATE
    state_code: MT
  output:
    # Taxable income 90,000 - 16,100 = 73,900; ordinary income 53,900:
    # 47,500 * 4.7% + 6,400 * 5.65% = 2,594.10.
    # Ordinary income is above the 47,500 threshold: 20,000 * 4.1% = 820.
    mt_withheld_income_tax: 3_414.1

- name: Surviving spouse uses the surviving spouse brackets and capital gains threshold
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 140_000
        long_term_capital_gains: 30_000
      child:
        age: 10
        is_tax_unit_dependent: true
        adjusted_gross_income_person: 0
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        members: [head, child]
        state_code: MT
  output:
    # Taxable income 140,000 - 32,200 = 107,800; ordinary income 77,800:
    # 77,800 * 4.7% = 3,656.60.
    # Gains: 17,200 * 3% = 516 below the 95,000 threshold, 12,800 * 4.1% = 524.80.
    mt_withheld_income_tax: [4_697.4, 0]

- name: Joint long-term capital gains straddling the threshold are taxed at the capital gains rates
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        adjusted_gross_income_person: 120_000
        long_term_capital_gains: 40_000
      spouse:
        adjusted_gross_income_person: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Taxable income 160,000 - 32,200 = 127,800; ordinary income 87,800:
    # 87,800 * 4.7% = 4,126.60.
    # Gains: 7,200 * 3% = 216 below the 95,000 threshold, 32,800 * 4.1% = 1,344.80.
    # Total 5,687.40, split 3/4 and 1/4 by AGI.
    mt_withheld_income_tax: [4_265.55, 1_421.85]
    state_withheld_income_tax: 5_687.4
