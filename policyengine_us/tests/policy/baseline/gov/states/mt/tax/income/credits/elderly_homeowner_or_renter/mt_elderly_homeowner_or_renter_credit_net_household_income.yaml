- name: The amount of the credit is allocated to the head and reduced combined
  period: 2022
  input:
    people:
      person1: 
        is_tax_unit_head: true
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000
        mt_elderly_homeowner_or_renter_credit_eligible: true
      person2: 
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 14_000
        mt_elderly_homeowner_or_renter_credit_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_net_household_income: [1_070, 0]

- name: Maximum 
  period: 2021
  input:
    people:
      person1: 
        is_tax_unit_head: true
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 38_000
        mt_elderly_homeowner_or_renter_credit_eligible: true
      person2: 
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 10_000
        mt_elderly_homeowner_or_renter_credit_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # (48,000 - 6,300) x 0.05 with the 2021 exclusion of $6,300.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [2_085, 0]

- name: Gross household income includes members outside the claimant's tax unit
  period: 2024
  input:
    people:
      person1:
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000
        mt_elderly_homeowner_or_renter_credit_eligible: true
      person2:
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 10_000
        mt_elderly_homeowner_or_renter_credit_eligible: false
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 2024 Schedule 2EC line 18 = 20_000 + 10_000 (line 17, the other member)
    # = 30_000; line 20 = 30_000 - 12_600 = 17_400; line 21 = 0.05;
    # line 22 = 870, on the claimant's row. person2's tax unit has no
    # claimant, so 0.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [870, 0]
