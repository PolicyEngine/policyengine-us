    mt_elderly_homeowner_or_renter_credit_unemployment_compensation_addback: 0
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 26_400
    # Line 12 = 20_100; line 13 = 0.05; line 14 = 1_005.
    mt_elderly_homeowner_or_renter_credit_net_household_income: 1_005
    # Line 19 = 1_500 - 1_005 = 495; line 20 = 495; line 22 = 495.
    mt_elderly_homeowner_or_renter_credit: 495

