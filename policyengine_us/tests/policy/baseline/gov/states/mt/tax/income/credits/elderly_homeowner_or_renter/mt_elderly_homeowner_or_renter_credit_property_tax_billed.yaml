- name: Case 1, a single owner's property tax billed.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # Schedule 2EC line 23.
    mt_elderly_homeowner_or_renter_credit_property_tax_billed: 2_000

- name: Case 2, a joint couple's bills are one claimant's.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 1_200
      person2:
        age: 66
        real_estate_taxes: 800
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # A joint return makes one claim: line 23 = 1_200 + 800.
    mt_elderly_homeowner_or_renter_credit_property_tax_billed: 2_000

- name: Case 3, a home in a dependent's name is not billed to the claimant.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 75
        is_tax_unit_dependent: false
      person2:
        age: 50
        is_tax_unit_dependent: true
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # The property is "in a name other than the claimant", so its tax "can
    # qualify as rent only" (ARM 42.4.302(2)(b)): line 23 = 0.
    mt_elderly_homeowner_or_renter_credit_property_tax_billed: 0

- name: Case 4, each tax unit counts only the bill in its own name.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 80
      person2:
        age: 45
        real_estate_taxes: 3_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_billed: [0, 3_000]

- name: Case 5, outside Montana.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: ID
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_billed: 0
