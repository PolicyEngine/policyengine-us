# 2023 Form 2, Taxable Social Security Benefits Worksheet, for a single filer
# with $30,000 of wages, $10,000 of title II benefits and $10,000 of tier 1
# benefits. Federal taxable benefits (Form 1040 line 6b) are the smaller of
# 0.85 x 20,000 = 17,000 and 0.85 x (40,000 - 34,000) + 4,500 = 9,600.
# Line 1 takes Forms SSA-1099 only: 10,000. Line 2: 5,000. Line 3 subtracts all
# of line 6b from total income: 39,600 - 9,600 = 30,000. Line 6: 35,000. Line 8
# (subtractions through line 35) leaves out the tier 1 benefits, which line 37
# subtracts: 0. Line 9: 35,000. Line 11: 10,000. Line 12: 9,000. Line 13: 1,000.
# Line 14: 9,000. Line 15: 4,500. Line 16: 4,500. Line 17: 850. Line 18: 5,350.
# Line 19: 8,500. Line 20: 5,350.
- name: Tier 1 railroad benefits stay out of Montana's modified income and line 1.
  period: 2023
  input:
    age: 67
    employment_income: 30_000
    social_security_retirement: 10_000
    railroad_social_security_equivalent_benefits: 10_000
    filing_status: SINGLE
    state_code: MT
  output:
    mt_taxable_social_security: 5_350
