- name: Montana allows the federal wagering losses deduction.
  absolute_error_margin: 0.01
  period: 2023
  input:
    age: 40
    employment_income: 50_000
    gambling_winnings: 30_000
    gambling_losses: 20_000
    state_code: MT
  output:
    mt_wagering_losses_deduction: 20_000
    mt_misc_deductions: 20_000

- name: From 2026 Montana carries 90% of the losses.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    employment_income: 50_000
    gambling_winnings: 30_000
    gambling_losses: 20_000
    state_code: MT
  output:
    mt_wagering_losses_deduction: 18_000
    mt_misc_deductions: 18_000

- name: The Montana spouse who reports the winnings claims the losses.
  absolute_error_margin: 0.01
  period: 2023
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
      spouse:
        age: 40
        gambling_losses: 8_000
      child:
        age: 10
        is_tax_unit_dependent: true
        gambling_winnings: 5_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse, child]
        state_code: MT
  output:
    wagering_losses_deduction: 8_000
    mt_wagering_losses_deduction: [8_000, 0, 0]

- name: When both Montana spouses have winnings, each claims their own losses.
  absolute_error_margin: 0.01
  period: 2023
  input:
    people:
      head:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 8_000
      spouse:
        age: 40
        gambling_winnings: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    wagering_losses_deduction: 8_000
    mt_wagering_losses_deduction: [8_000, 0]

- name: Montana losses beyond a spouse's own winnings go to the spouse with winnings left.
  absolute_error_margin: 0.01
  period: 2023
  input:
    people:
      head:
        age: 40
        gambling_winnings: 4_000
        gambling_losses: 9_000
      spouse:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 1_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # The return deducts min(10,000, 14,000) = 10,000. The head takes 4,000
    # against their own winnings and the spouse 1,000; the other 5,000 falls
    # on the spouse's remaining 9,000 of winnings.
    wagering_losses_deduction: 10_000
    mt_wagering_losses_deduction: [4_000, 6_000]
