- name: Statutory nontaxable income sources are counted
  period: 2025
  input:
    people:
      person1:
        age: 75
        veterans_benefits: 5_000
        child_support_received: 3_000
        strike_benefits: 2_000
        general_assistance: 1_000
        # These amounts would make the model compute SSI, which also counts;
        # its own cases are in the government assistance test file.
        ssi: 0
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # § 15-30-2337(9)(a)(i), (iv), (v), (vi). Sum: 5,000 + 3,000 + 2,000 + 1,000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 11_000

- name: Untaxed Social Security is fully counted in gross household income
  period: 2025
  input:
    people:
      person1:
        age: 75
        social_security_retirement: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # § 15-30-2337(9)(a)(viii) requires all SS to be counted, even the
    # portion excluded from federal AGI.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 30_000

- name: A capital loss deducted in federal AGI is added back
  period: 2023
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        long_term_capital_gains: -3_000
        mt_refundable_credits_before_renter_credit: 0
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # § 15-30-2337(9)(a): federal AGI "without regard to loss". 2023 Elderly
    # Homeowner/Renter Credit Schedule:
    # line 1 federal AGI 20_000 - 3_000 = 17_000; line 9 adds back the 3_000
    # capital loss; line 10 = 20_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000

- name: A business loss deducted in federal AGI is added back once for the return
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        mt_refundable_credits_before_renter_credit: 0
        # Net household income is computed for eligible claimants.
        mt_elderly_homeowner_or_renter_credit_eligible: true
      person2:
        age: 68
        self_employment_income: -5_000
        mt_refundable_credits_before_renter_credit: 0
        mt_elderly_homeowner_or_renter_credit_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # Federal AGI 20_000 - 5_000 = 15_000; the 5_000 loss is added back, so
    # gross household income is 20_000 (2024 Schedule 2EC line 18). Net household
    # income: (20_000 - 12_600) * 0.035 = 259, allocated to the head.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [259, 0]

- name: SNAP is not cash public assistance and does not count
  period: 2017
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
    spm_units:
      spm_unit:
        members: [person1]
        snap: 1_800
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # 2017 Form 2EC instructions: "Cash, public assistance and relief - Do
    # not include LIEAP (Low Income Energy Assistance Program) or SNAP".
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 15_000

- name: A dependent's wages count in gross household income
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 16
        employment_income: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # § 15-30-2337(4): "all income received by all individuals of a
    # household". The dependent's wages are on their own return, not in the
    # head's federal AGI. 2024 Schedule 2EC: line 5 pensions 20_000 (head);
    # line 17 income of other household members 10_000 (dependent's wages);
    # line 18 gross household income 30_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 10_000]

- name: A dependent's Social Security counts once, in full
  period: 2024
  input:
    people:
      person1:
        age: 70
        # No SSI for the claimant, so the case isolates the dependent's income.
        ssi: 0
      person2:
        age: 17
        employment_income: 25_000
        social_security_survivors: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # On the dependent's own return, provisional income is
    # 25_000 + 10_000 / 2 = 30_000, so 50% x (30_000 - 25_000) = 2_500 of the
    # benefits is taxable (IRC 86) and is part of dependent_gross_income.
    dependent_taxable_social_security: [0, 2_500]
    # § 15-30-2337(9)(a)(viii) counts all Social Security, and 2024
    # Schedule 2EC line 6 takes "the total taxable and nontaxable" benefits:
    # wages 25_000 + Social Security 10_000 = 35_000, not 37_500.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [0, 35_000]

- name: A dependent's capital loss does not reduce gross household income
  period: 2024
  input:
    people:
      person1:
        age: 70
        # No SSI for the claimant, so the case isolates the dependent's income.
        ssi: 0
      person2:
        age: 16
        employment_income: 10_000
        long_term_capital_gains: -3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # § 15-30-2337(9)(a): income "without regard to loss". 2024 Schedule 2EC
    # line 7: "do not include any capital losses". Wages 10_000 count; the
    # 3_000 loss does not reduce them.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [0, 10_000]

- name: A household member's federal and Montana EITC count once, on their own return
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 40
        employment_income: 10_000
        # Federal EITC refund received during 2024.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 632
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # 2024 Schedule 2EC line 8: "Combine all the refundable credits received
    # by all household members in 2024. Refundable credits include the
    # federal and Montana earned income tax credits". The member received a
    # 632 federal EITC refund. Rev. Proc. 2023-34, no qualifying child:
    # 10_000 is above the 8_260 earned income amount and under the 10_330
    # phaseout threshold, so this year's federal EITC is the maximum 632 and
    # the Montana EITC is 10% of it, 63.20. The member's 10_000 + 632 +
    # 63.20.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 10_695.20]

- name: A parent's federal EITC and refundable child tax credit count in gross household income
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 30
        employment_income: 10_000
        # Federal EITC and refundable CTC received during 2024.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 4_525
      person3:
        age: 5
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_name: MT
  output:
    # 2024 Schedule 2EC line 8 counts "the refundable portion of the federal
    # child tax credit". Federal EITC 34% x 10_000 = 3_400; refundable CTC
    # min(1_700, 15% x 7_500) = 1_125; Montana EITC 340. The parent:
    # 10_000 + 3_400 + 1_125 + 340 = 14_865.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 14_865, 0]

- name: The elderly homeowner/renter credit received during the year counts
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        mt_elderly_homeowner_or_renter_credit_received: 1_150
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # 2024 Schedule 2EC line 8: "including your elderly homeowner/renter
    # credit received in 2024". 20_000 + 1_150.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_150

- name: The rebate for 2023 property taxes, received in 2024, counts
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes:
          2023: 2_000
          2024: 2_000
        mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 675
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2023: MT
          2024: MT
  output:
    # 2024 Schedule 2EC line 8 lists "the 2023 Montana property tax rebate":
    # min(675, 2_000) = 675. 20_000 + 675.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_675

- name: Actual rebate cash received in 2023 counts under the broad income definition
  period: 2023
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes:
          2022: 2_000
          2023: 2_000
        mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 675
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2022: MT
          2023: MT
  output:
    # HB191 section1(9), PDFp2: all nontaxable income; ARM42.4.301(2)(c):
    # state refundable credits received. The illustrative 2023 list does
    # not exempt the rebate. Pension 20_000 + actual cash 675 = 20_675.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 675
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_675

- name: Federal refundable credits count from 2017
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 10_000
        mt_refundable_credits_before_renter_credit: 0
        # Federal EITC refund received during 2017.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 383.01
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # ARM 42.4.301(2)(b), effective 11/10/2017: "federal refundable credits
    # received"; 2017 Form 2EC worksheet item 4: "Any federal or state
    # refundable credits". Rev. Proc. 2016-55, no qualifying child:
    # 510 - 7.65% x (10_000 - 8_340) = 383.01.
    eitc: 383.01
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 10_383.01

- name: Federal refundable credits do not count before 2017
  period: 2016
  input:
    people:
      person1:
        age: 40
        employment_income: 10_000
        mt_refundable_credits_before_renter_credit: 0
        # Federal EITC refund received during 2016.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 383.01
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # The 2004-2017 ARM 42.4.301(2)(b) counted federal refunds only "to the
    # extent that the amount recovered reduced the claimant's Montana income
    # tax in a prior year".
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 10_000

- name: A filer's short-term loss netted against their own long-term gain does not reduce gross household income
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 30
        long_term_capital_gains: 10_000
        short_term_capital_gains: -4_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # § 15-30-2337(9)(a): federal AGI "without regard to loss"; 2024
    # Schedule 2EC line 7: "do not include any capital losses". The member's
    # own return nets the 4_000 loss into a 6_000 gain, so no loss reaches
    # loss_ald; line 17 still carries the 10_000 gain.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 10_000]

- name: A claimant's short-term loss netted against their own long-term gain does not reduce gross household income
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        long_term_capital_gains: 10_000
        short_term_capital_gains: -4_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # Line 5 pensions 20_000 plus line 7 capital gain 10_000, without the
    # 4_000 loss: 30_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 30_000

- name: A minor alone in a tax unit and not input as a dependent counts once
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        is_tax_unit_dependent: false
      person2:
        age: 16
        employment_income: 10_000
        is_tax_unit_dependent: false
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # The minor is neither head (no adult in the unit), spouse nor
    # dependent. irs_gross_income counts people who are not dependents and
    # dependent_gross_income people who are not the head or spouse, so only
    # the dependent gate keeps the 10_000 wages from counting twice.
    is_tax_unit_head: [true, false]
    is_tax_unit_dependent: [false, false]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 10_000]

- name: Social Security counts in full for a person input as a dependent who is also the head
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        is_tax_unit_dependent: false
      person2:
        age: 40
        social_security_retirement: 60_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # Every adult in tax_unit2 is input as a dependent, so person2 is also
    # its head. Neither irs_gross_income (dependents) nor
    # dependent_gross_income (heads) counts their taxable benefits, so none
    # may be subtracted: § 15-30-2337(9)(a)(viii) counts all 60_000.
    is_tax_unit_head: [true, true]
    is_tax_unit_dependent: [false, true]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 60_000]

- name: A business loss on another household member's return does not reduce gross household income
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 40
        taxable_interest_income: 10_000
        self_employment_income: -5_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # The member's federal AGI is 10_000 - 5_000 = 5_000; the 5_000 loss is
    # added back on their own return's head. 2024 Schedule 2EC line 10:
    # "Do not include any losses generated from the business."
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 10_000]

- name: A dependent in another household member's tax unit counts
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
      person2:
        age: 35
        employment_income: 25_000
        # Federal EITC and refundable CTC received during 2024.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 9_854.83
      person3:
        age: 5
      person4:
        age: 8
        employment_income: 3_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_name: MT
  output:
    # Three generations. The daughter's line 8 credits: federal EITC with
    # two children 6_960 - 21.06% x (25_000 - 22_720) = 6_479.83; refundable
    # child tax credit min(2 x 1_700, 15% x (25_000 - 2_500)) = 3_375;
    # Montana EITC 10% = 647.98. Her total: 25_000 + 6_479.83 + 3_375 +
    # 647.98 = 35_502.81. The grandchild is her dependent; their 3_000 of
    # wages count through the dependent path.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [15_000, 35_502.81, 0, 3_000]

- name: A prior-year capital loss carryover does not reduce the year's gain
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        # A 10_000 gain this year less a 4_000 carryover (Schedule D line 15).
        long_term_capital_gains: 6_000
        long_term_capital_loss_carryover: 4_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # Line 7 counts the year's gain, 10_000, without the carried loss.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 30_000

- name: A carryover larger than the year's gain leaves the gain counted and the rest unused
  period: 2024
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        # A 2_000 gain this year less a 10_000 carryover.
