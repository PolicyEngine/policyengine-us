- name: Case 8, only tax unit heads are ranked; another member's amount does not count.
  period: 2024
  input:
    people:
      person1:
        age: 70
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 100
      person2:
        # A dependent: the model holds a tax unit's credit on its head, so
        # this amount, set here only to test the ranking, is ignored.
        age: 12
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 900
      person3:
        age: 67
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 200
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_selected_claimant: [false, true]

