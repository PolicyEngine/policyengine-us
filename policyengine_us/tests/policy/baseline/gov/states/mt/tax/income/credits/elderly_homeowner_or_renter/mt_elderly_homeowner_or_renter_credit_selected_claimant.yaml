- name: Case 1, two eligible tax units in one household; the larger credit claims.
  period: 2024
  input:
    people:
      person1:
        age: 66
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 100
      person2:
        age: 70
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 460
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_selected_claimant: [false, true]

