- name: Case 6, the limit is per household; each household selects its own claimant.
  period: 2024
  input:
    people:
      person1:
        age: 70
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 1_150
      person2:
        age: 75
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 900
      person3:
        age: 66
        mt_elderly_homeowner_or_renter_credit_eligible: true
        mt_elderly_homeowner_or_renter_credit_pre_one_claimant: 300
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
      tax_unit3:
        members: [person3]
    households:
      household1:
        members: [person1]
        state_code: MT
      household2:
        members: [person2, person3]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_selected_claimant: [true, true, false]

