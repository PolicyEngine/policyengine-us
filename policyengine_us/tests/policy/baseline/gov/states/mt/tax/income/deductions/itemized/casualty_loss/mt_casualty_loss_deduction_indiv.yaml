- name: The spouse owns the entire casualty loss
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      head:
        age: 40
        employment_income: 90_000
      spouse:
        age: 40
        employment_income: 20_000
        casualty_loss: 12_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    mt_casualty_loss_deduction_indiv: [0, 9_900]

