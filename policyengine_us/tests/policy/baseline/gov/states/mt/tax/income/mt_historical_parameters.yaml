# Form 2 instructions give the yearly exemption, income-tax schedule and
# pension exemption. The 2021 instructions, PDF page 54, also list the
# historical standard-deduction limits for every year below.

- name: Montana applies its 2017 exemptions and income tax schedule
  period: 2017
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 40
    mt_agi_indiv: 25_000
    mt_taxable_income_indiv: 20_000
    taxable_pension_income: 10_000
    adjusted_gross_income_person: 35_260
  output:
    # 20% x 25,000 exceeds the 4,510 standard deduction cap.
    mt_standard_deduction_indiv: 4_510
    mt_personal_exemptions_indiv: 2_400
    # Apply the year's seven marginal rates to 20,000 of taxable income.
    mt_regular_income_tax_indiv: 819.60
    # Pension cap 4,110 less 2 x 1,000 of excess federal AGI.
    mt_pension_exemption_indiv: 2_110

