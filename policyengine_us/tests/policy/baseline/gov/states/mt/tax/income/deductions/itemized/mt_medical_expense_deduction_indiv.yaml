- name: Montana separate medical deductions exclude each spouse's own self-employed premiums
  period: 2023
  input:
    people:
      head:
        age: 40
        health_insurance_premiums: 6_000
        self_employed_health_insurance_ald_person: 1_000
        other_medical_expenses: 500
        mt_agi_indiv: 30_000
        mt_married_filing_separately_on_same_return_eligible: true
      spouse:
        age: 40
        health_insurance_premiums: 3_000
        self_employed_health_insurance_ald_person: 2_000
        other_medical_expenses: 500
        mt_agi_indiv: 10_000
        mt_married_filing_separately_on_same_return_eligible: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Line 1 floors only the other expenses; line 2 adds the premiums net of
    # each spouse's own self-employed health insurance deduction, in full.
    # Head: max(0, 500 - 7.5% x 30,000) + (6,000 - 1,000) = 0 + 5,000.
    # Spouse: max(0, 500 - 7.5% x 10,000) + (3,000 - 2,000) = 0 + 1,000.
    mt_medical_expense_deduction_indiv: [5_000, 1_000]

- name: Medical insurance premiums are deducted in full on line 2, not under the floor
  period: 2022
  absolute_error_margin: 0.01
  input:
     other_medical_expenses: 1_000
     health_insurance_premiums: 2_000
     mt_agi_indiv: 20_000
     state_code: MT
     is_tax_unit_head_or_spouse: true
  output:
     # Line 1: max(0, 1,000 - 7.5% x 20,000) = max(0, 1,000 - 1,500) = 0.
     # Line 2: 2,000 in full.
     # Flooring the premiums with the other expenses would give
     # 3,000 - 1,500 = 1,500.
     mt_medical_expense_deduction_indiv: 2_000

