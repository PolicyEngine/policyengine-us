- name: MT subtracts US government bond interest (2023)
  period: 2023
  input:
    people:
      person1:
        us_govt_interest_person: 5_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household1:
        members: [person1]
        state_code: MT
  output:
    mt_subtractions: 5_000

- name: MT subtracts US government bond interest (2024)
  period: 2024
  input:
    people:
      person1:
        us_govt_interest_person: 5_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household1:
        members: [person1]
        state_code: MT
  output:
    # MCA 15-30-2120(3)(b)(i), Schedule I line 11=5,000, carried to
    # Form 2 line 5. With no income input, line 3=0 and line 7 remains
    # max(0, 0 - 5,000)=0. Corrected subtraction expectation: 0 -> 5,000.
    mt_subtractions: 5_000
