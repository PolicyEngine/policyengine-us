- name: MT subtracts US government bond interest (2023)
  period: 2023
  input:
    people:
      person1:
        taxable_interest_income: 5_000
        us_govt_interest_person: 5_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household1:
        members: [person1]
        state_code: MT
  output:
    mt_subtractions: 5_000

