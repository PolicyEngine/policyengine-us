# Montana taxable income (Form 2 line 7) from household inputs, 2024 onward.
# Each case runs from wages, medical, mortgage, tax and interest inputs through
# the federal model, so it also checks which federal amounts Montana reads.
# Expectations are hand computed from:
# - 2024 Form 2 and instructions, with the revised Worksheet A (V1 1/2025):
#   https://revenue.mt.gov/files/Forms/SALT-Cap-Instructions.pdf
# - 2025 Form 2 and instructions, Worksheet B (instructions PDF page 22).
# - 2026: statutory inference from MCA 15-30-2101(7), (14) and 15-30-2120
#   until a 2026 form exists.
# Worksheet line numbers: L1 Schedule A line 5e (capped SALT); L2 local income
# tax; L3 real estate tax; L4 personal property tax; L5 state income tax within
# the cap; L6 federal itemized deductions; L7 federal standard deduction;
# L8 = max(0, L6 - L7); L9 = min(L5, L8), the state income tax addback.
# Tax: 2024 single 5.9% x TI - 246 above 20,500 (joint - 492 above 41,000);
# 2025 single 5.9% x TI - 253.20 above 21,100 (joint - 506.40 above 42,200);
# 2026 single 4.7% to 47,500, then 5.65%.
# The 2025 instructions' rate table (PDF page 18) prints whole-dollar offsets
# of 253, 506 and 380. The brackets that MCA 15-30-2103(1) and (3) set give
# 253.20, 506.40 and 380.40, and these cases use the statutory amounts.

- name: 2024 medical itemizer reaches the federal standard deduction floor
  # Federal medical: 20,000 - 7.5% x 100,000 = 12,500; SALT = 5,000.
  # Worksheet A L1=5,000; L2=L3=L4=0; L5=5,000;
  # L6=17,500; L7=14,600; L8=2,900; L9=2,900; L10=14,600.
  # Form 2 L1=100,000; L2=14,600; L3=85,400; L4=L5=L6=0;
  # L7=85,400; tax=85,400 x 5.9% - 246 = 4,792.60.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
        other_medical_expenses: 20_000
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 5_000
        state_sales_tax: 0
        local_sales_tax: 0
        local_income_tax: 0
    households:
      household:
        members: [head]
        state_code: MT
  output:
    tax_unit_itemizes: true
    itemized_taxable_income_deductions: 17_500
    mt_state_income_tax_itemized_add_back: 2_900
    mt_federal_deductions: 14_600
    mt_taxable_income: 85_400
    mt_income_tax: 4_792.60

- name: 2024 federal standard deduction controls despite medical expenses
  # Federal medical: 16,000 - 7.5% x 100,000 = 8,500;
  # itemized=8,500 + 3,000 SALT=11,500 < 14,600, so Worksheet A is unused.
  # Form 2 L1=100,000; L2=14,600; L3=85,400; L4=L5=L6=0;
  # L7=85,400; tax=4,792.60. Montana's repealed 2023 Itemized Deductions
  # Schedule (2023 Form 2, page 7, lines 1a-1c) also floored medical expenses
  # at 7.5% of Montana AGI, so it too would have allowed 8,500 here.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
        other_medical_expenses: 16_000
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 3_000
        state_sales_tax: 0
        local_sales_tax: 0
        local_income_tax: 0
    households:
      household:
        members: [head]
        state_code: MT
  output:
    tax_unit_itemizes: false
    itemized_taxable_income_deductions: 11_500
    mt_state_income_tax_itemized_add_back: 0
    mt_federal_deductions: 14_600
    mt_taxable_income: 85_400
    mt_income_tax: 4_792.60

- name: 2024 joint itemizer attributes only the remaining SALT cap to state income tax
  # Federal SALT=min(15,000 + 8,000, 10,000)=10,000;
  # itemized=10,000 SALT + 20,000 mortgage + 5,000 charity=35,000.
  # Worksheet A L1=10,000; L2=0; L3=8,000; L4=0; L5=2,000;
  # L6=35,000; L7=29,200; L8=5,800; L9=2,000; L10=33,000.
  # Form 2 L1=300,000; L2=33,000; L3=267,000; L4=L5=L6=0;
  # L7=267,000; tax=267,000 x 5.9% - 492 = 15,261.00.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 300_000
        real_estate_taxes: 8_000
        home_mortgage_interest: 20_000
        charitable_cash_donations: 5_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        state_withheld_income_tax: 15_000
        state_sales_tax: 0
        local_sales_tax: 0
        local_income_tax: 0
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    filing_status: JOINT
    tax_unit_itemizes: true
    salt_deduction: 10_000
    itemized_taxable_income_deductions: 35_000
    mt_state_income_tax_itemized_add_back: 2_000
    mt_federal_deductions: 33_000
    mt_taxable_income_joint: [267_000, 0]
    mt_taxable_income: 267_000
    mt_income_tax: 15_261.00

