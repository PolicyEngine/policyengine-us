- name: 2026 federal itemized limitation and SALT phase-down flow into line 2
  # Statutory inference (MCA 15-30-2101(7) and (14); no 2026 Montana form yet).
  # SALT cap: 40,400 - 30% x (1,000,000 - 505,000) < 10,000 floor -> 10,000.
  # Charity after the 0.5%-of-AGI floor: 50,000 - 5,000 = 45,000.
  # Itemized before 26 U.S.C. 68: 10,000 + 20,000 + 45,000 = 75,000.
  # Section 68: 2/37 x min(75,000, 1,000,000 - 640,600) = 4,054.05;
  # federal itemized = 70,945.95.
  # Worksheet B L1=10,000; L3=15,000; L5=0, so no Schedule I addition.
  # Form 2 L1=1,000,000; L2=70,945.95; L3=929,054.05; L7=929,054.05;
  # tax = 47,500 x 4.7% + (929,054.05 - 47,500) x 5.65% = 52,040.30.
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 45
        employment_income: 1_000_000
        charitable_cash_donations: 50_000
        home_mortgage_interest: 20_000
        real_estate_taxes: 15_000
    tax_units:
      tax_unit:
        members: [head]
        state_withheld_income_tax: 60_000
        state_sales_tax: 0
        local_sales_tax: 0
        local_income_tax: 0
    households:
      household:
        members: [head]
        state_code: MT
  output:
    salt_cap: 10_000
    salt_deduction: 10_000
    itemized_taxable_income_deductions_reduction: 4_054.05
    itemized_taxable_income_deductions: 70_945.95
    tax_unit_itemizes: true
    mt_state_income_tax_itemized_add_back: 0
    mt_federal_deductions: 70_945.95
    mt_taxable_income: 929_054.05
    mt_income_tax: 52_040.30

