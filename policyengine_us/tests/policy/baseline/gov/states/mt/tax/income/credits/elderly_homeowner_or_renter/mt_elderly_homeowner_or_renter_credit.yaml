- name: 2024 Schedule 2EC, two eligible siblings filing separately in one household; only the larger claim is paid
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        taxable_pension_income: 10_000
        rent: 4_800
      person2:
        age: 70
        taxable_pension_income: 15_000
        rent: 7_200
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # Both siblings are 62 or older and file their own returns. Line 18
    # gross household income = 10_000 + 15_000 = 25_000 for each; line 20 =
    # 25_000 - 12_600 = 12_400; line 21 = 0.05; line 22 = 620.
    # person1: line 25 = 4_800 x 0.15 = 720; line 27 = 720 - 620 = 100.
    # person2: line 25 = 7_200 x 0.15 = 1_080; line 27 = 1_080 - 620 = 460.
    # Line 29 = 100% (under 35_000). "Only one claimant per household in a
    # claim period ... is entitled to relief" (§ 15-30-2341(1)); the
    # household claims through person2, whose credit is larger. Before the
    # limit both were paid, 560 in total.
    mt_elderly_homeowner_or_renter_credit_pre_one_claimant: [100, 460]
    mt_elderly_homeowner_or_renter_credit_selected_claimant: [false, true]
    mt_elderly_homeowner_or_renter_credit: [0, 460]
    mt_refundable_credits: [0, 460]

