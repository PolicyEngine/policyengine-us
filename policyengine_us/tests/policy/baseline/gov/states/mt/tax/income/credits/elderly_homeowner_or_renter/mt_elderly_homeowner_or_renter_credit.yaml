- name: 2024 Schedule 2EC worked case, TANF in a shared SPM unit counts once across two returns
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 1_500
      person2:
        age: 30
      person3:
        age: 5
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        tanf: 4_800
    households:
      household:
        members: [person1, person2, person3]
        state_name: MT
  output:
    # The claimant's daughter and granddaughter live with her; the daughter
    # files her own return and receives 4_800 of TANF. Line 5 pensions
    # 20_000; line 17 the TANF 4_800; line 18 = 24_800. The model holds TANF
    # for the SPM unit and counts each member's per capita share
    # (tanf_person, 1_600 each), so the household total counts it once.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [21_600, 1_600, 1_600]
    # Line 20 = 24_800 - 12_600 = 12_200; line 21 = 0.05; line 22 = 610.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [610, 0, 0]
    # Line 27 = 1_500 - 610 = 890; line 28 = 890; line 29 = 100%; line 30 =
    # 890. Without the TANF, line 18 = 20_000, line 22 = 7_400 x 0.035 = 259
    # and the credit would be the 1_150 cap. Counting the whole 4_800 for
    # each of the three members would give line 18 = 34_400 and a credit of
    # 1_500 - 1_090 = 410.
    mt_elderly_homeowner_or_renter_credit: [890, 0, 0]


