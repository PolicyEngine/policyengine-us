- name: 2024 Schedule 2EC worked case, a household member filing their own return counts
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 2_000
      person2:
        age: 45
        taxable_interest_income: 10_000
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_name: MT
  output:
    # The claimant's adult daughter lives in the household and files her
    # own return. § 15-30-2337(7)(a): a household is "an association of
    # persons who live in the same dwelling"; the 2024 instructions: "You do
    # not need to be related to be in the same household." Line 5 = 20_000;
    # line 17 = 10_000 (her interest); line 18 = 30_000; line 22 = 870;
    # line 27 = 2_000 - 870 = 1_130; line 30 = 1_130. Her tax unit has no
    # one aged 62 or older, so it claims nothing.
    mt_elderly_homeowner_or_renter_credit_net_household_income: [870, 0]
    mt_elderly_homeowner_or_renter_credit: [1_130, 0]

# Government assistance in gross household income. § 15-30-2337(9)(a)
# counts "all nontaxable income, including but not limited to ... (vi) cash
# public assistance and relief". 2024 and 2025 Schedule 2EC line 16 names
# SSI payments, workers' compensation "and any other government assistance";
# the 2014-2023 instructions list "Disability benefits including, but not
# limited to, veteran's disability, SSI payments and workers' compensation".

- name: 2024 Schedule 2EC worked case, the claimant's SSI counts on line 16
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 15_000
        ssi: 6_000
        real_estate_taxes: 1_200
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: MT
  output:
    # Line 5 pensions 15_000; line 16 SSI 6_000; line 18 = 21_000.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_000
    # Line 19 12_600; line 20 = 8_400; line 21 = 0.039 (8_000 to 8_999);
    # line 22 = 8_400 x 0.039 = 327.60.
    mt_elderly_homeowner_or_renter_credit_net_household_income: 327.60
    # Line 23 = 1_200; line 26 = 1_200; line 27 = 1_200 - 327.60 = 872.40;
    # line 28 = 872.40 (under 1_150); line 29 = 100%; line 30 = 872.40.
    # Without the SSI, line 18 = 15_000, line 22 = 2_400 x 0.006 = 14.40 and
    # the credit would be the 1_150 cap.
    mt_elderly_homeowner_or_renter_credit: 872.40


