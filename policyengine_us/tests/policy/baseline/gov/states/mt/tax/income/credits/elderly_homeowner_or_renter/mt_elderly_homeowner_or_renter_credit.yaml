  period: 2022
  input:
    people:
      person1:
        rent: 9_000
        real_estate_taxes: 1_500
        mt_elderly_homeowner_or_renter_credit_gross_household_income: 22_000
        mt_elderly_homeowner_or_renter_credit_net_household_income: 700
