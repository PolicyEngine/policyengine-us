- name: MT EHRC uses the $6,300 exclusion in 2021 (taxsim 1180)
  period: 2021
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 63
        employment_income: 20_892.60
        real_estate_taxes: 863.08
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # (863.08 - (gross_hh - 6,300) x 0.05) x 1.0, capped at $1,000.
    # 2021 instructions, line 7: "Refundable credits include the federal and
    # Montana Earned Income Tax Credit, the federal Child Tax Credits,
    # Economic Impact Payments". Federal EITC (ARPA, no qualifying child)
    # 1_502 - 15.3% x (20_892.60 - 11_610) = 81.76; Montana EITC 3% = 2.45;
    # Economic Impact Payment 1_400. Line 10 = 20_892.60 + 1_484.21 =
    # 22_376.81; line 12 = 16_076.81; line 14 = 803.84; line 19 = 863.08 -
    # 803.84 = 59.24. The earlier expected value, 133.33, counted only the
    # Montana EITC.
    mt_elderly_homeowner_or_renter_credit: 59.24

