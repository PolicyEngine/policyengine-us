        members: [person1]
        state_name: MT
  output:
    # Line 5 = 20_000; line 7 = the year's 10_000 gain; line 18 = 30_000;
    # line 22 = 870; line 30 = 1_130. Counting the 6_000 net would give line
    # 18 = 26_000, line 22 = 670 and the 1_150 cap.
    mt_elderly_homeowner_or_renter_credit: 1_130

