- name: A dependent's Montana amounts stay off the head's separate AGI
  # The dependent files their own return; only the head's own amounts
  # count: 10,000 + 500 - 3,000.
  period: 2021
  input:
    people: 
      person1:
        is_tax_unit_head: true
        adjusted_gross_income_person: 10_000
        mt_additions: 500
        mt_subtractions: 3_000
        mt_taxable_social_security: 0
        taxable_social_security: 0
        is_tax_unit_dependent: false
      person2:
        is_tax_unit_head: false
        adjusted_gross_income_person: 2_000
        mt_additions: 300
        mt_subtractions: 700
        mt_taxable_social_security: 0
        taxable_social_security: 0
        is_tax_unit_dependent: false
      person3:
        is_tax_unit_head: false
        adjusted_gross_income_person: 2_000
        mt_additions: 300
        mt_subtractions: 700
        mt_taxable_social_security: 0
        taxable_social_security: 0
        is_tax_unit_dependent: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_agi_indiv: [7_500, 1_600, 0]

- name: Test if mt_taxable_social_security works in formula 
  period: 2021
  input:
    people: 
      person1:
        is_tax_unit_head: true
        adjusted_gross_income_person: 10_000
        mt_additions: 500
        mt_subtractions: 3_000
        mt_taxable_social_security: 200
        taxable_social_security: 100
        is_tax_unit_dependent: false
      person2:
        is_tax_unit_head: false
        adjusted_gross_income_person: 2_000
        mt_additions: 300
        mt_subtractions: 700
        mt_taxable_social_security: 0
        taxable_social_security: 0
        is_tax_unit_dependent: false
      person3:
        is_tax_unit_head: false
        adjusted_gross_income_person: 2_000
        mt_additions: 300
        mt_subtractions: 700
        mt_taxable_social_security: 0
        taxable_social_security: 0
        is_tax_unit_dependent: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    # 7,500 plus the head's own 100 Montana-taxable benefit difference.
    mt_agi_indiv: [7_600, 1_600, 0]

- name: A dependent's benefits and interest stay off the filers' separate AGIs
  # Form 2 runs the Social Security worksheet on the taxpayer's and spouse's
  # income; the child's are on the child's own return.
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 40
        employment_income: 50_000
      spouse:
        is_tax_unit_spouse: true
        age: 40
        employment_income: 50_000
      child:
        age: 10
        social_security_survivors: 20_000
        tax_exempt_interest_income: 10_000
    marital_units:
      parents:
        members: [head, spouse]
      child_unit:
        members: [child]
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: MT
  output:
    mt_agi_indiv: [50_000, 50_000, 0]
