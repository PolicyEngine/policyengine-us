# The next two cases give mt_eitc as an input to check which years' refundable
# credit list includes it. Case 13's amount cannot arise; it isolates the list.
- name: Case 13, the refundable credit list excludes the Montana EITC before 2019.
  period: 2018
  input:
    mt_eitc: 50
    state_code: MT
  output:
    mt_refundable_credits_before_renter_credit: 0

- name: Case 14, the refundable credit list includes the Montana EITC from 2019.
  period: 2019
  input:
    mt_eitc: 50
    state_code: MT
  output:
    mt_refundable_credits_before_renter_credit: 50
