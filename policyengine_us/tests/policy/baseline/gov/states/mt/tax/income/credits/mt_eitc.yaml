- name: 2024 10% EITC match
  period: 2024
  input:
    eitc: 1_000
    state_code: MT
  output: 
    mt_eitc: 100

# Laws of Montana 2017, Ch. 381 (HB 391) enacted the credit at 3% of the federal
# credit (sec. 1(2)) for income tax years beginning after December 31, 2018
# (sec. 4), so tax year 2019 is the first year. Cases 6 to 9 compute the federal
# credit from the IRS revenue procedure for each year.
- name: Case 6, no Montana EITC in tax year 2018, the year before it first applies.
  # Federal EITC, Rev. Proc. 2018-18 sec. 3.05, two children: earnings of 15,000
  # exceed the 14,290 earned income amount and are below the 18,660 phase-out
  # threshold, so the credit is the 5,716 maximum (0.40 * 14,290).
  period: 2018
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 15_000
      person2:
        age: 8
      person3:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    eitc: 5_716
    mt_eitc: [0, 0, 0]

- name: Case 7, 3% Montana EITC in tax year 2019, the first year it applies.
  # Federal EITC, Rev. Proc. 2018-57 sec. 3.07, two children: earnings of 15,000
  # exceed the 14,570 earned income amount and are below the 19,030 phase-out
  # threshold, so the credit is the 5,828 maximum (0.40 * 14,570).
  # Montana EITC: 0.03 * 5,828 = 174.84, refundable (sec. 1(4)).
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 15_000
      person2:
        age: 8
      person3:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    eitc: 5_828
    mt_eitc: [174.84, 0, 0]
    mt_refundable_credits_before_renter_credit: [174.84, 0, 0]

- name: Case 8, 3% Montana EITC in tax year 2019 in the federal phase-in range.
  # Federal EITC, Rev. Proc. 2018-57 sec. 3.07, one child: earnings of 10,000 are
  # below the 10,370 earned income amount, so the credit is 0.34 * 10,000 = 3,400.
  # Montana EITC: 0.03 * 3,400 = 102.
  period: 2019
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    eitc: 3_400
    mt_eitc: [102, 0]

- name: Case 9, 3% Montana EITC in tax year 2020.
  # Federal EITC, Rev. Proc. 2019-44 sec. 3.07, two children: earnings of 15,000
  # exceed the 14,800 earned income amount and are below the 19,330 phase-out
  # threshold, so the credit is the 5,920 maximum (0.40 * 14,800).
  # Montana EITC: 0.03 * 5,920 = 177.60.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 15_000
      person2:
        age: 8
      person3:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    eitc: 5_920
    mt_eitc: [177.6, 0, 0]

