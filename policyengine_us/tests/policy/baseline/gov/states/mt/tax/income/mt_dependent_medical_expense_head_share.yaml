- name: Spouses move dependent bills until the head uses the capital gain credit
  # TY2022: each spouse has AGI 20,000 and personal exemption 2,710.
  # The child's exemption is 2,710; each medical floor is 1,500.
  # Head credit: 10,000 x 2% = 200. Tax at 8,900 is 176, so the
  # head can retain 8,900 + (200 - 176) / 4% = 9,500 of taxable income.
  # Head bills: 20,000 - 2,710 - 2,710 + 1,500 - 9,500 = 6,580.
  # Share: 6,580 / 25,000 = 0.2632. Spouse taxable income:
  # 20,000 - 2,710 - (18,420 - 1,500) = 370; tax = 370 x 1% = 3.70.
  # At an equal split, each taxable income is 4,935; the spouse owes
  # 33 + (4,935 - 3,300) x 2% = 65.70, exceeding the minimum by 62.
  period: 2022
  absolute_error_margin: 0.005
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        long_term_capital_gains: 10_000
        mt_non_medical_itemized_deductions_indiv: 0
      spouse:
        age: 40
        employment_income: 20_000
        mt_non_medical_itemized_deductions_indiv: 0
      child:
        age: 10
        is_tax_unit_dependent: true
        other_medical_expenses: 25_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        mt_agi_joint: 40_000
    households:
      household:
        members: [head, spouse, child]
        state_code: MT
  output:
    mt_dependent_medical_expense_head_share: 0.2632
    mt_taxable_income_indiv: [9_500, 370, 0]
    mt_income_tax_before_refundable_credits_indiv: [0, 3.70, 0]
    mt_tax_unit_itemizes: true

