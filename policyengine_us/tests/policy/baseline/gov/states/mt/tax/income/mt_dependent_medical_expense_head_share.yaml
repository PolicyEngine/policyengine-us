    mt_tax_unit_itemizes: true

# Moving 2.50 of bills across the optimum changes the head tax by 0.10
# and the spouse tax by 0.025, until the head tax reaches zero.
- name: A forced share of 0.2631 brackets the head credit exhaustion
  period: 2022
  absolute_error_margin: 0.005
  input:
    people:
      head:
        age: 40
        mt_agi_indiv: 20000
        long_term_capital_gains: 10000
        mt_non_medical_itemized_deductions_indiv: 0
      spouse:
        age: 40
        mt_agi_indiv: 20000
        mt_non_medical_itemized_deductions_indiv: 0
      child:
        age: 10
        is_tax_unit_dependent: true
        other_medical_expenses: 25000
    tax_units:
      tax_unit:
        members:
        - head
        - spouse
        - child
        mt_agi_joint: 40000
        mt_dependent_medical_expense_head_share: 0.2631
    households:
      household:
        members:
        - head
        - spouse
        - child
        state_code: MT
  output:
    mt_dependent_medical_expense_head_share: 0.2631
    mt_taxable_income_indiv:
    - 9502.5
    - 367.5
    - 0
    mt_income_tax_before_refundable_credits_indiv:
    - 0.1
    - 3.675
    - 0
    mt_tax_unit_itemizes: true

