- name: Amount only distributed to the head 
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 1_000
        mt_agi_indiv: 400
      person2:
        is_tax_unit_head: false
        other_medical_expenses: 1_000
        mt_agi_indiv: 600
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_medical_expense_deduction_joint: [1_925, 0]

