- name: Spouse's loss reduces the joint return's Montana AGI before the floor
  period: 2022
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
        other_medical_expenses: 10_000
      spouse:
        age: 40
        self_employment_income: -20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Form 2 page 1, line 14: 100,000 - 20,000 = 80,000, reported in one column.
    mt_agi_joint: 80_000
    # Itemized Deductions Schedule line 1: 10,000 - 7.5% x 80,000 = 4,000.
    # Flooring each spouse's Montana AGI at zero first would give
    # 10,000 - 7.5% x 90,000 = 3,250.
    mt_medical_expense_deduction_joint: [4_000, 0]

- name: Last year of the Montana schedule floors on Montana AGI, not the federal deduction
  period: 2023
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 40_000
        medical_expense_deduction: 9_999
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 10,000 - 7.5% x 40,000 = 7,000
    mt_medical_expense_deduction_joint: 7_000

- name: From 2024 the federal medical expense deduction carries through
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 50_000
        medical_expense_deduction: 2_500
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_medical_expense_deduction_joint: 2_500

- name: From 2024 the floor uses federal AGI, not Montana AGI
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 70
        medicare_enrolled: false
        employment_income: 100_000
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # The $5,500 subtraction for taxpayers 65 and older reduces Montana AGI
    # but not federal AGI.
    adjusted_gross_income: 100_000
    mt_agi_joint: 94_500
    # Form 2 line 2, Worksheet A, takes federal Schedule A:
    # 10,000 - 7.5% x 100,000 = 2,500.
    mt_medical_expense_deduction_joint: 2_500

- name: Medical insurance premiums are deducted in full on line 2, not under the floor
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        health_insurance_premiums: 4_000
        other_medical_expenses: 2_000
      person2:
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 60_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Line 1: max(0, 2,000 - 7.5% x 60,000) = max(0, 2,000 - 4,500) = 0.
    # Line 2: 4,000 in full. Line 3: 0.
    # Flooring the premiums with the other expenses would give
    # 6,000 - 4,500 = 1,500.
    mt_medical_expense_deduction_joint: [4_000, 0]

- name: Long-term care insurance premiums are deducted in full on line 3
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 5_000
        long_term_health_insurance_premiums: 3_000
      person2:
        is_tax_unit_head: false
        long_term_health_insurance_premiums: 2_500
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 40_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Line 1: 5,000 - 7.5% x 40,000 = 2,000.
    # Line 3: 3,000 + 2,500 = 5,500.
    # Total: 2,000 + 5,500 = 7,500, held by the head.
    mt_medical_expense_deduction_joint: [7_500, 0]

- name: Premiums taken as the self-employed health insurance deduction are not deducted again
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        is_self_employed: true
        self_employment_income: 50_000
        health_insurance_premiums: 6_000
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 40_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # The self-employed health insurance deduction takes all 6,000 of the
    # premiums in federal and so in Montana AGI, so line 2 is 0.
    self_employed_health_insurance_ald: 6_000
    # Line 1: 10,000 - 7.5% x 40,000 = 7,000.
    mt_medical_expense_deduction_joint: 7_000

- name: A dependent's premiums count on line 2 and other medical expenses on line 1
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        health_insurance_premiums: 3_000
      person2:
        is_tax_unit_spouse: true
        other_medical_expenses: 4_000
      person3:
        is_tax_unit_dependent: true
        health_insurance_premiums: 1_200
        other_medical_expenses: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        mt_agi_joint: 50_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    # Line 1: (4,000 + 1,000) - 7.5% x 50,000 = 5,000 - 3,750 = 1,250.
    # Line 2: 3,000 + 1,200 = 4,200.
    mt_medical_expense_deduction_joint: [5_450, 0, 0]

- name: Joint return computed from wages, with premiums and other medical expenses
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 80_000
        health_insurance_premiums: 6_000
        other_medical_expenses: 3_000
      person2:
        age: 40
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_agi_joint: 80_000
    # Line 1: max(0, 3,000 - 7.5% x 80,000) = max(0, 3,000 - 6,000) = 0.
    # Line 2: 6,000.
    # Flooring the premiums with the other expenses would give
    # 9,000 - 6,000 = 3,000.
    mt_medical_expense_deduction_joint: [6_000, 0]

- name: From 2024 medical insurance premiums stay under the federal floor
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        health_insurance_premiums: 4_000
        other_medical_expenses: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    adjusted_gross_income: 60_000
    # Federal Schedule A: (4,000 + 2,000) - 7.5% x 60,000 = 1,500.
    medical_expense_deduction: 1_500
    mt_medical_expense_deduction_joint: 1_500
