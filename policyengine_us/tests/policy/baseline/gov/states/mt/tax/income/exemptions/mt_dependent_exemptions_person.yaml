    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Montana gross income = 2,710 wages (the 3,000 of unemployment
    # compensation is excluded) <= 2,710, so one exemption of 2,710.
    mt_dependent_exemptions_person: [0, 2_710]

