- name: Dependent parent with Social Security below the taxable threshold is eligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        employment_income: 50_000
      person2:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false # Required, or the adult is inferred as the spouse and skips the income test.
        social_security_retirement: 12_000
        is_qualifying_child_dependent: false
        is_disabled: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Provisional income = 0.5 x 12,000 = 6,000 < 25,000, so no Social
    # Security is taxable; Montana gross income = 0 <= 2,710.
    mt_dependent_exemptions_person: [0, 2_710]
    # mt_income_tax is not asserted: federal dependent_gross_income counts
    # all 12,000 of Social Security, so the head files single rather than
    # head of household. With that status the tax falls from 2,246.00 to
    # 2,063.07 (-182.93).

- name: Dependent parent with taxable Social Security exactly at the 2022 exemption amount is eligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        employment_income: 50_000
      person2:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false # Required, or the adult is inferred as the spouse and skips the income test.
        social_security_retirement: 60_840
        is_qualifying_child_dependent: false
        is_disabled: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Provisional income = 0.5 x 60,840 = 30,420; taxable Social Security =
    # min(30,420, 0.5 x (30,420 - 25,000)) = 2,710 <= 2,710.
    mt_dependent_exemptions_person: [0, 2_710]

- name: Dependent parent with taxable Social Security one dollar above the 2022 exemption amount is not eligible
