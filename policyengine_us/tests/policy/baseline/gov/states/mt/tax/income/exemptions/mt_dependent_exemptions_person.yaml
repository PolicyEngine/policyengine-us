# The income test uses Montana gross income (MCA 15-30-2101(10), see
# mt_dependent_gross_income): federal gross income excluding unemployment
# compensation, only taxable Social Security, and gains but not losses. In
# these 2022 cases the taxpayer has 50,000 of wages, so one 2,710 exemption
# changes mt_income_tax by 2,710 x 6.75% = 182.925 (182.92 or 182.93 after
# rounding).

- name: Adult dependent with only unemployment compensation is eligible because Montana excludes it
  absolute_error_margin: 0.01
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        employment_income: 50_000
      person2:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false # Required, or the adult is inferred as the spouse and skips the income test.
        unemployment_compensation: 3_000
        is_qualifying_child_dependent: false
        is_disabled: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Montana gross income = 3,000 - 3,000 unemployment compensation = 0
    # <= 2,710, so one exemption of 2,710.
    mt_dependent_exemptions_person: [0, 2_710]
    # Without the exemption the tax is 1,712.07; 1,712.07 - 182.92 = 1,529.15.
    mt_income_tax: 1_529.15

- name: Adult dependent with unemployment compensation and wages exactly at the 2022 exemption amount is eligible
