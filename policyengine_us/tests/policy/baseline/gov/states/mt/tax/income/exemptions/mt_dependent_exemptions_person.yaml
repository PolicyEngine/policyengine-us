- name: Two dependents in 2022 - no eligible
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
      person3:
        # Not qualifying children, and gross income (wages of $5,000 and
        # $2,711) above the $2,710 exemption amount, so neither is a Montana
        # dependent.
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 5_000
        is_qualifying_child_dependent: false
        is_disabled: false
      person4:
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 2_711
        is_qualifying_child_dependent: false
        is_disabled: true
    tax_units:
      tax_unit:
        members: [person1, person3, person4]
    households:
      household:
        members: [person1, person3, person4]
        state_code: MT
  output:
    mt_dependent_exemptions_person: [0, 0, 0]

