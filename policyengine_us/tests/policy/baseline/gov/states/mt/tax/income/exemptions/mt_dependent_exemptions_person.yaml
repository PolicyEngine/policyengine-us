- name: Two dependents in 2021 - one eligible
  period: 2021
  input:
    people:
      person1:
        is_qualifying_child_dependent: false
        is_disabled: false
      person3:
        # Not a qualifying child, and gross income of $3,000 (wages) is above
        # the $2,580 exemption amount, so not a Montana dependent.
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 3_000
        is_qualifying_child_dependent: false
        is_disabled: false
      person4:
        is_qualifying_child_dependent: true
        is_disabled: false
    tax_units:
      tax_unit:
        members: [person1, person3, person4]
    households:
      household:
        members: [person1, person3, person4]
        state_code: MT
  output:
    mt_dependent_exemptions_person: [0, 0, 2_580]

