- name: Permanently and totally disabled adult child is a qualifying child and gets two exemptions
  absolute_error_margin: 0.01
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        employment_income: 50_000
      person2:
        # IRC 152(c)(3)(B): the age test does not apply to a child who is
        # permanently and totally disabled.
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false # Required, or the adult is inferred as the spouse and skips the income test.
        is_permanently_and_totally_disabled: true
        is_disabled: true
        employment_income: 5_000
        is_qualifying_child_dependent: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # A qualifying child skips the gross income test, and a disabled child
    # gets an additional exemption: 2 x 2,710 = 5,420.
    mt_dependent_exemptions_person: [0, 5_420]
    # Without the exemptions the tax is 1,914.57; 1,914.57 - 2 x 182.925
    # = 1,548.72.
    mt_income_tax: 1_548.72
