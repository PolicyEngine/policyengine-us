# Return-level deduction propagation, with nonmedical deductions and credits zero.
# Sources: 2022 Form 2 p. 1 (exemptions), p. 7 (deductions), p. 8 (tax table):
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2022_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=7
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2022_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=1
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2022_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=8
# The marginal tax schedule retains main's cent precision (offset 602.50);
# the printed 2022 tax table rounds its offset to 603. This PR preserves it.
# 2024 instructions p. 15, Worksheet A (adjusted federal deductions):
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2024_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf#page=15
# 2024 ordinary tax rates, instructions p. 22 (printed p. 14):
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2024_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf#page=22
# 2024 joint federal standard deduction, IRS instructions p. 6:
# https://www.irs.gov/pub/irs-prior/i1040gi--2024.pdf#page=6
# 2024 federal Schedule A p. 1, lines 1-4 (7.5% medical floor):
# https://www.irs.gov/pub/irs-prior/f1040sa--2024.pdf#page=1
# 2024 Form 2 p. 2 (ordinary income and capital-gain threshold/rates):
# https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2024_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=2

- name: 2022 pooled medical deduction at separate tax selection boundary 2812
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        adjusted_gross_income_person: 90_000
        other_medical_expenses: 29_980
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
        # Controlled alternative tax isolates the filing selection boundary.
        # This is not a derived separate-return household tax expectation.
        mt_income_tax_indiv: 2812
      spouse:
        age: 40
        adjusted_gross_income_person: -10_000
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
        mt_income_tax_indiv: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        adjusted_gross_income: 80_000
        income_tax_before_refundable_credits: 0
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    mt_agi_joint: 80_000
    # 29,980 - 7.5% * (90,000 - 10,000) = 23,980.
    # The old unpooled floor gave 23,230 and joint tax 2,863.625.
    mt_medical_expense_deduction_joint: [23_980, 0]
    mt_itemized_deductions_joint: [23_980, 0]
    mt_itemized_deductions_for_federal_itemization_joint: [23_980, 0]
    # max(joint 23,980, separate 29,980 - 7.5% * 90,000) = 23,980.
    state_itemized_deductions: 23_980
    # 20% * 80,000 = 16,000, capped at the joint maximum 10,180.
    state_standard_deduction: 10_180
    # 80,000 - 23,980 - 2 * 2,710 exemptions = 50,600.
    mt_taxable_income_joint: [50_600, 0]
    # 734 + 6.75% * (50,600 - 19,800) = 2,813.
    mt_regular_income_tax_joint: 2_813
    mt_income_tax_joint: 2_813
    # Separate filing requires strictly lower tax; ties retain joint filing.
    mt_files_separately: true
    mt_income_tax: 2812

