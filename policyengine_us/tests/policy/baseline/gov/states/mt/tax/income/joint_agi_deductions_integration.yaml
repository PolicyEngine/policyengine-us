- name: 2022 pooled standard deduction propagates to state deductions and final tax
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
      spouse:
        age: 40
        self_employment_income: -10_000
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        income_tax_before_refundable_credits: 0
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    adjusted_gross_income: 40_000
    mt_agi_joint: 40_000
    # 20% * (50,000 - 10,000) = 8,000, within [4,520, 10,180].
    mt_standard_deduction_joint: [8_000, 0]
    # max(joint 8,000, separate 5,090 + 2,260) = 8,000.
    state_standard_deduction: 8_000
    state_itemized_deductions: 0
    # 40,000 - 8,000 - 2 * 2,710 = 26,580.
    mt_taxable_income_joint: [26_580, 0]
    # 734 + 6.75% * (26,580 - 19,800) = 1,191.65.
    mt_income_tax_joint: 1_191.65
    mt_files_separately: false
    mt_income_tax: 1_191.65

- name: 2024 medical floor propagates through capital gains with wages 70100 and expenses 35000
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 70100
        long_term_capital_gains: 20_000
        other_medical_expenses: 35000
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
      spouse:
        age: 40
        mt_withheld_income_tax: 0
        mt_non_refundable_credits: 0
        mt_refundable_credits: 0
    tax_units:
      tax_unit:
        members: [head, spouse]
        income_tax_before_refundable_credits: 0
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    adjusted_gross_income: 90100
    # 35000 - 7.5% * 90100 = 28242.5 (federal AGI).
    medical_expense_deduction: 28242.5
    mt_medical_expense_deduction_joint: [28242.5, 0]
    mt_itemized_deductions_joint: [28242.5, 0]
    mt_itemized_deductions_for_federal_itemization_joint: [28242.5, 0]
    state_itemized_deductions: 28242.5
    state_standard_deduction: 29_200
    # 90100 - max(28242.5, 29,200) = 60900; no exemptions from 2024.
    mt_taxable_income_joint: [60900, 0]
    # Ordinary income = 60900 - 20,000 = 40900;
    # remaining lower-rate room = max(41,000 - 40900, 0) = 100.
    mt_capital_gains_tax_applicable_threshold_joint: 100
    # 3% * min(100, 20,000) + 4.1% * (20,000 - min(100, 20,000)).
    mt_capital_gains_tax_joint: 818.9
    # 4.7% * min(40900, 41,000) + 5.9% * max(40900 - 41,000, 0).
    mt_regular_income_tax_joint: 1922.3
    # 1922.3 + 818.9 = 2741.2.
    mt_income_tax_joint: 2741.2
    mt_files_separately: false
    mt_income_tax: 2741.2

