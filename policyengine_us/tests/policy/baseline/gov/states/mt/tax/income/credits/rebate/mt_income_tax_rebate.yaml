# Montana's 2021 income tax rebate (MCA 15-30-2191, paid in 2023, booked to the
# 2021 eligibility year). It is the lesser of the 2021 income tax liability
# (Form 2 line 20, before refundable credits) or a per-return cap. MCA
# 15-30-2191(1)(b) sets that cap at $1,250 for a single, head-of-household or
# separate return and $2,500 for a joint return. The Montana Department of
# Revenue (May 2024 rebate report, pp. 6, 10) treated a married couple filing
# separately (status 2a - two MT returns) as separate individuals, so each
# column is capped at min($1,250, its own line 20). Because the rebate is now a
# reporting-only value that does not enter the tax calculation, mt_income_tax
# equals main's Montana tax (unchanged by the rebate). Amounts are zero from
# 2022 on (amount.yaml), so the rebate only appears in 2021.

- name: Single filer above the cap receives the full single rebate
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # Line 20 = $2,339.51 exceeds the $1,250 single cap, so the rebate is the
    # $1,250 cap: min(1_250, 2_339.51) = 1_250.
    mt_income_tax_rebate: 1_250
    mt_income_tax_before_2021_rebate: 2_339.51
    # UNVERIFIED (coordinator to run): the rebate no longer reduces tax, so
    # mt_income_tax equals line 20 less refundable credits (0 here) = 2,339.51,
    # not the old post-rebate 1,089.51.
    mt_income_tax: 2_339.51

- name: Single filer below the cap is limited to her liability
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # Line 20 = $625.40 is below the $1,250 cap, so MCA 15-30-2191(2) limits the
    # reported rebate to min(1_250, 625.40) = 625.40.
    mt_income_tax_rebate: 625.40
    mt_income_tax_before_2021_rebate: 625.40
    # UNVERIFIED (coordinator to run): rebate is reporting-only, so tax is line
    # 20 less refundable credits (0 here) = 625.40, not the old 0.
    mt_income_tax: 625.40

- name: Joint filers each capped at their column's half of the joint line 20
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 45
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Joint line 20 = $2,518.22. This couple files jointly (one earner, so joint
    # is cheaper), so each column's cap base is 2_518.22 / 2 = 1_259.11, just
    # above the $1,250 half-cap. Per column: min(1_250, 1_259.11) = 1_250;
    # head + spouse = 2,500 total (equals the joint cap).
    mt_income_tax_rebate: [1_250, 1_250]
    mt_income_tax_before_2021_rebate: [1_259.11, 1_259.11]
    # UNVERIFIED (coordinator to run): tax unchanged by rebate = joint line 20.
    mt_income_tax: 2_518.22

- name: Unequal separate filers - each column capped at its own line 20 per the DOR treatment
  # Regression test for taxsim #1189 / issue 9012, updated to the per-column DOR
  # treatment. This 90k/15k couple files SEPARATELY under main (status 2a):
  # separate tax 5,099.51 + 206.80 = 5,306.31 is cheaper than joint 5,623.22, so
  # mt_files_separately is true. The rebate cap base does not enter the tax
  # calculation, so the election is unchanged from main (no cycle / no flip).
  # Per the DOR treatment each column is capped at min($1,250, its own line 20):
  # person1's line 20 ($5,099.51) exceeds the cap -> $1,250; person2's line 20
  # ($206.80) is below the cap -> its own line 20. Reported rebate does not move
  # anyone's tax.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 90_000
      person2:
        age: 45
        employment_income: 15_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Separate filing is cheaper (5,306.31 < 5,623.22), matching main's election;
    # the rebate cap base does not enter the tax calculation, so no election flip.
    mt_files_separately: true
    # Each column's own line 20 (before the rebate) under separate filing.
    mt_income_tax_before_2021_rebate: [5_099.51, 206.80]
    # min(1_250, own line 20): person1 -> 1_250; person2 -> 206.80.
    mt_income_tax_rebate: [1_250, 206.80]
    # Main's separate Montana tax, unchanged by the reporting-only rebate.
    mt_income_tax: 5_306.31

