    mt_income_tax_rebate: 0

- name: Head of household above the cap receives the full $1,250 rebate
  # Restores Max's requested head-of-household coverage. A single adult with a
  # qualifying child files as HEAD_OF_HOUSEHOLD, whose 2021 rebate cap is $1,250
  # (amount.yaml). Only the head is head_or_spouse, so the child column is 0.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # HOH cap = $1,250; the head's line 20 exceeds it, so the rebate is the cap.
    # The child is not head_or_spouse, so its column reports 0.
    # min(1_250, line_20) = 1_250 for the head; 0 for the child.
    mt_income_tax_rebate: [1_250, 0]

- name: Surviving spouse above the cap receives the full $2,500 rebate
  # Restores Max's requested qualifying-surviving-spouse coverage. A SURVIVING_
  # SPOUSE return uses the joint rate schedule and a $2,500 cap (amount.yaml).
  # The filing status is not JOINT, so per_person_cap = p.amount[SURVIVING_
  # SPOUSE] = 2_500, applied against the single surviving-spouse column.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 120_000
      person2:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # UNVERIFIED (coordinator to run): $120k on the joint schedule yields a line
    # 20 above $2,500, so min(2_500, line_20) = 2_500 for the surviving spouse;
    # the child column is 0.
    mt_income_tax_rebate: [2_500, 0]

- name: Separate filers - one column just below the $1,250 cap
  # Cap boundary for a couple that files separately (status 2a): two earners
  # where separate filing is cheaper, so mt_files_separately is true and each
  # column is capped at min($1,250, its own line 20). person2's line 20 sits
  # just below $1,250, so that column reports its own line 20, not the cap.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 90_000
      person2:
        age: 45
        employment_income: 45_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # UNVERIFIED (coordinator to run): confirm mt_files_separately is true and
    # read back each column's mt_income_tax_before_2021_rebate. Expected pattern:
    # person1 line 20 > 1,250 -> capped at 1,250; person2 line 20 < 1,250 ->
    # reports its own line 20. mt_income_tax_rebate ~= [1_250, <1_250].
    mt_files_separately: true

- name: Separate filers - one column just above the $1,250 cap
  # Cap boundary companion: raise person2's income so its separate-column line 20
  # crosses above $1,250, at which point that column is clipped to the $1,250 cap
  # rather than reporting its own (now larger) line 20.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 90_000
      person2:
        age: 45
        employment_income: 65_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # UNVERIFIED (coordinator to run): confirm mt_files_separately is true; both
    # columns' line 20 now exceed $1,250, so each is capped: rebate = [1_250,
    # 1_250], total $2,500.
    mt_files_separately: true
    mt_income_tax_rebate: [1_250, 1_250]
