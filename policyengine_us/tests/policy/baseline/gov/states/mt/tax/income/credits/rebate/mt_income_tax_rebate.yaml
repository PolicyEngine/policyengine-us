# Montana's 2021 income tax rebate (MCA 15-30-2191, paid in 2023, booked to the
# 2021 eligibility year). It is the lesser of the 2021 income tax liability or a
# per-return cap ($1,250, or $2,500 for a joint return). It is applied once per
# return - not split across a couple's separate columns - and does not affect
# the separate-vs-joint filing election (taxsim #1189). Amounts are zero from
# 2022 on (amount.yaml), so the rebate only appears in 2021.

- name: Single filer above the cap receives the full single rebate
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 2021 liability $2,339.51 exceeds the $1,250 cap, so the rebate is $1,250.
    mt_income_tax_rebate: 1_250
    mt_income_tax_before_2021_rebate: 2_339.51
    mt_income_tax: 1_089.51

- name: Single filer below the cap is limited to her liability
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 2021 liability of $625.40 is below the $1,250 cap, so MCA 15-30-2191(2)
    # limits the rebate to $625.40 and net tax is zero.
    mt_income_tax_rebate: 625.40
    mt_income_tax: 0

- name: Joint filers receive one per-return rebate, capped at the joint liability
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 45
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # $2,518.22 joint liability exceeds the $2,500 joint cap, so the full
    # $2,500 applies once (not $1,250 per spouse), leaving $18.22.
    mt_income_tax_rebate: 2_500
    mt_income_tax_before_2021_rebate: 2_518.22
    mt_income_tax: 18.22

- name: Unequal joint filers keep the full rebate without per-column clipping
  # Regression test for taxsim #1189. The lower-earning spouse's separate-column
  # liability ($206.80) is far below their $1,250 half of the cap. Modeling the
  # rebate as a per-column non-refundable credit clipped it to that column and
  # flipped the separate-vs-joint election; applied once per return it stays at
  # the full $2,500 and the couple still files separately (the cheaper choice).
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 90_000
      person2:
        age: 45
        employment_income: 15_000
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_files_separately: true
    mt_income_tax_rebate: 2_500
    mt_income_tax_before_2021_rebate: 5_306.31
    mt_income_tax_before_refundable_credits_unit: 2_806.31

- name: No rebate in 2022
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
      person2:
        age: 45
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_income_tax_rebate: 0
    mt_income_tax: 2_394.50

- name: No rebate outside Montana
  period: 2021
  input:
    people:
      person1:
        age: 45
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AR
  output:
    mt_income_tax_rebate: 0
