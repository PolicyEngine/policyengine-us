- name: Case 1, default mt_other_subtractions is zero
  period: 2024
  input:
    people:
      person1:
        employment_income: 50_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_other_subtractions: 0
    mt_subtractions: 0

- name: Case 2, mt_other_subtractions increases mt_subtractions
  period: 2024
  input:
    people:
      person1:
        employment_income: 50_000
        mt_other_subtractions: 2_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_other_subtractions: 2_000
    mt_subtractions: 2_000

- name: Case 3, mt_other_subtractions increases mt_subtractions in 2021
  period: 2021
  input:
    people:
      person1:
        employment_income: 50_000
        mt_other_subtractions: 2_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_other_subtractions: 2_000
    mt_subtractions: 2_000
