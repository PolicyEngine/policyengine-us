- name: Case 25, the phase-out uses the couple's combined Montana AGI, then each column gets half
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        mt_agi_indiv: 20_000
      person2:
        is_tax_unit_spouse: true
        mt_agi_indiv: 0
      person3:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        tax_unit_childcare_expenses: 3_000
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    # Form 2441-M (2022): line 2 = min(3_000, 2_400) = 2_400; line 3 adds
    # columns A and B of Form 2 line 14 = 20_000 + 0 = 20_000; line 5 = 2_000;
    # line 6 = 1_000; line 7 = 1_400. Filing separately on the same form, each
    # spouse enters one-half of line 7 (700). Applying the phase-out to each
    # spouse's own AGI would give 700 and 1_200.
    mt_child_dependent_care_expense_deduction_eligible_expenses: 2_400
    mt_child_dependent_care_expense_deduction: [700, 700, 0]

