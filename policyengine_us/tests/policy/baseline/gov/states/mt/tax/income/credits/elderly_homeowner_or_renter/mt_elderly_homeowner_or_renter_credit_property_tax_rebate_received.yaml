- name: Case 1, the head reports actual rebate cash received in 2024.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2023: 2_000
          2024: 2_100
        mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 675
      person2:
        age: 68
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2023: MT
          2024: MT
  output:
    # 2024 Schedule 2EC line 8: "the 2023 Montana property tax rebate",
    # min(675, 2_000) = 675.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: [675, 0]

- name: Case 2, the person reports a smaller actual rebate receipt.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2023: 500
          2024: 900
        mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2023: MT
          2024: MT
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 500

- name: Case 3, the 2024 rebate of 400 is received in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2024: 2_000
          2025: 2_000
        mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 400
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2024: MT
          2025: MT
  output:
    # 2025 Schedule 2EC line 8: "the 2024 Montana property tax rebate";
    # Ch. 767, L. 2025, sec. 3(1): $400 or the property taxes paid, if less.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 400

- name: Case 4, no actual cash receipt reported in 2026 defaults to zero.
  period: 2026
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2025: 2_000
          2026: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2025: MT
          2026: MT
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 0

- name: Case 5, no reported actual receipt defaults to zero.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # No actual cash receipt was reported; default zero.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 0

- name: Case 6, a prior tax bill does not establish rebate eligibility or receipt.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes:
          2024: 1_000
          2025: 1_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2024: MT
          2025: MT
  output:
    # Reviewer: six months owning/occupying in 2024 fails SB542 section1(3),
    # PDFp2 (minimum seven months); section3(5), PDFp3 also requires a claim.
    # No actual receipt: 1_000 - (20_000 - 12_600) * .035 = 741.
    # Inferring 400 from the old tax bill incorrectly gave 727.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 0
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000
    mt_elderly_homeowner_or_renter_credit: 741
