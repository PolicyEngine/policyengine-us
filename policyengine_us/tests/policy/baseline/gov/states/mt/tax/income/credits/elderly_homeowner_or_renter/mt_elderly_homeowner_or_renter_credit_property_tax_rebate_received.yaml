- name: Case 1, the 2023 rebate is received in 2024 and goes to the head.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2023: 2_000
          2024: 2_100
      person2:
        age: 68
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2023: MT
          2024: MT
  output:
    # 2024 Schedule 2EC line 8: "the 2023 Montana property tax rebate",
    # min(675, 2_000) = 675.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: [675, 0]

- name: Case 2, the 2023 rebate is the 2023 property tax when that is less than 675.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2023: 500
          2024: 900
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2023: MT
          2024: MT
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 500

- name: Case 3, the 2024 rebate of 400 is received in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2024: 2_000
          2025: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2024: MT
          2025: MT
  output:
    # 2025 Schedule 2EC line 8: "the 2024 Montana property tax rebate";
    # Ch. 767, L. 2025, sec. 3(1): $400 or the property taxes paid, if less.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 400

- name: Case 4, there is no rebate for 2025 property taxes to receive in 2026.
  period: 2026
  input:
    people:
      person1:
        age: 70
        real_estate_taxes:
          2025: 2_000
          2026: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code:
          2025: MT
          2026: MT
  output:
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 0

- name: Case 5, zero when only this year's property tax is known.
  period: 2024
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 2_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # Inputs never carry backwards, so last year's property tax and rebate
    # are 0.
    mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received: 0
