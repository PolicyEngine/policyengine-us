- name: Amount only distributed to the head and spouse
  period: 2021
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        mt_misc_deductions: 100
        mt_medical_expense_deduction_indiv: 200
        mt_salt_deduction: 300
        mt_federal_income_tax_deduction_for_federal_itemization_indiv: 400
      person2:
        is_tax_unit_head_or_spouse: true
        mt_misc_deductions: 100
        mt_medical_expense_deduction_indiv: 200
        mt_salt_deduction: 300
        mt_federal_income_tax_deduction_for_federal_itemization_indiv: 100
      person3:
        is_tax_unit_head_or_spouse: false
        is_tax_unit_dependent: true
        mt_misc_deductions: 100
        mt_medical_expense_deduction_indiv: 12
        mt_salt_deduction: 200
        mt_federal_income_tax_deduction_for_federal_itemization_indiv: 100
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        charitable_deduction: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_itemized_deductions_for_federal_itemization_indiv: [1_000, 700, 0]

- name: Charitable allocation agrees across separate paths at default half share
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        employment_income: 2_000
      spouse:
        age: 30
        is_tax_unit_spouse: true
        employment_income: 2_000
      dependent:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
    households:
      household:
        members: [head, spouse, dependent]
        state_code: MT
    axes:
      - - name: charitable_cash_donations
          count: 3
          min: 0
          max: 800
          index: 0
  output:
    # Donations of 0, 400 and 800 are below the charitable AGI cap.
    # Income is below both federal taxable income and MT withholding thresholds,
    # so the aggregates contain only charity; the two separate paths must agree.
    charitable_deduction: [0, 400, 800]
    mt_federal_income_tax_deduction_indiv: [0, 0, 0, 0, 0, 0, 0, 0, 0]
    mt_federal_income_tax_deduction_for_federal_itemization_indiv: [0, 0, 0, 0, 0, 0, 0, 0, 0]
    # Each spouse receives 0.5 times charity; dependents receive zero.
    mt_itemized_deductions_indiv: [0, 0, 0, 200, 200, 0, 400, 400, 0]
    mt_itemized_deductions_for_federal_itemization_indiv: [0, 0, 0, 200, 200, 0, 400, 400, 0]
    # Joint charity remains intact regardless of the separate allocation rate.
    mt_itemized_deductions_joint: [0, 0, 0, 400, 0, 0, 800, 0, 0]
    mt_itemized_deductions_for_federal_itemization_joint: [0, 0, 0, 400, 0, 0, 800, 0, 0]

