# 2022 Form 2 instructions, Itemized Deductions Schedule, line 15 (PDF pp. 35-36):
# "You may deduct a casualty and theft loss from a federally declared disaster
# (other than net qualified disaster losses). If you have a casualty and/or
# theft loss, complete federal Form 4684 to figure the amount of the Montana
# loss that you can enter on this line. To determine your casualty and/or theft
# loss, use your Montana Adjusted Gross Income in place of the Federal Adjusted
# Gross Income." and "Deductions for all other casualty and theft losses are
# suspended until tax years beginning after December 31, 2025."
# Form 4684 allows the loss above 10% of adjusted gross income. The federal
# suspension is modeled by gov.irs.deductions.itemized.casualty.active, which
# these tests switch on to exercise a deductible loss.

- name: A joint return deducts the couple's loss once, above 10% of Montana AGI
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
      person2:
        age: 40
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 30,000 - 10% x 100,000
    mt_casualty_loss_deduction_joint: 20_000

- name: Both spouses' losses go on the joint return's one Form 4684
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
      person2:
        age: 40
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 35,000 - 10% x 100,000
    mt_casualty_loss_deduction_joint: 25_000

- name: The 10% floor uses Montana AGI, not federal AGI
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        employment_income: 100_000
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 80_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 30,000 - 10% x 80,000. The federal floor would give 30,000 - 10,000.
    mt_casualty_loss_deduction_joint: 22_000

- name: A loss at or below 10% of Montana AGI is not deductible
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 8_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: Losses outside federally declared disasters are suspended
  period: 2022
  input:
    people:
      person1:
        age: 40
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: Montana discontinued its Itemized Deductions Schedule in 2024
  period: 2024
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0
