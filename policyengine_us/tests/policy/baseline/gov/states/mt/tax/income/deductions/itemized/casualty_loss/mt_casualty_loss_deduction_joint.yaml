# Montana Form 2 instructions (2022), line 15, PDF pages 35-36:
# Taxpayers calculate casualty losses using Montana AGI on Form 4684.
# Spouses filing separately calculate their own losses (also PDF page 11).
# Form 4684 lines 11-12 and 17-18 apply the $100 reduction and 10% AGI floor.
# Publication 547 (2022), PDF page 10, assigns separately owned losses to the
# owner and applies one reduction per casualty event.
# The model lacks a disaster-specific input and retains the federal casualty
# activation flag. Cases from 2021 onward enable that flag when testing
# the calculation. Earlier cases use the ordinary-loss baseline.

- name: A joint return deducts the couple's loss once, above 10% of Montana AGI
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
      person2:
        age: 40
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # (30,000 - 100) - 10% x 100,000
    mt_casualty_loss_deduction_joint: 19_900

- name: Both spouses' losses are pooled on a joint return
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
      person2:
        age: 40
        casualty_loss: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # (35,000 - 100) - 10% x 100,000; the joint return reduces by $100 once.
    mt_casualty_loss_deduction_joint: 24_900

- name: A dependent's loss is left to the dependent's own return
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        employment_income: 60_000
        casualty_loss: 30_000
      person2:
        age: 40
        employment_income: 40_000
      person3:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 5_000
        casualty_loss: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    # Montana AGI is the spouses' 100,000 (the dependent's wages are on the
    # dependent's own return), and so is the dependent's loss:
    # (30,000 - 100) - 10% x 100,000.
    mt_casualty_loss_deduction_joint: 19_900

- name: The 10% floor uses Montana AGI, not federal AGI
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        employment_income: 100_000
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 80_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # (30,000 - 100) - 10% x 80,000. A federal AGI floor would give 19,900.
    mt_casualty_loss_deduction_joint: 21_900

- name: A loss whose excess over $100 equals 10% of Montana AGI is not deductible
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 10_100
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: One dollar above the floor is deductible
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 10_101
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 1

- name: A loss under $100 is not deductible even with no Montana AGI
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 80
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 0
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: No loss is deductible while the federal casualty deduction is suspended
  period: 2022
  input:
    people:
      person1:
        age: 40
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: Montana discontinued its Itemized Deductions Schedule in 2024
  period: 2024
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 0

- name: In 2023, A joint return deducts the couple's loss once, above 10% of Montana AGI
  period: 2023
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      person1:
        age: 40
        casualty_loss: 30_000
      person2:
        age: 40
    tax_units:
      tax_unit:
        members: [person1, person2]
        mt_agi_joint: 100_000
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # (30,000 - 100) - 10% x 100,000
    mt_casualty_loss_deduction_joint: 19_900


- name: The spouse owns the entire casualty loss
  period: 2022
  input:
    gov.irs.deductions.itemized.casualty.active: true
    people:
      head:
        age: 40
        employment_income: 90_000
      spouse:
        age: 40
        employment_income: 20_000
        casualty_loss: 12_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    mt_casualty_loss_deduction_joint: 900

