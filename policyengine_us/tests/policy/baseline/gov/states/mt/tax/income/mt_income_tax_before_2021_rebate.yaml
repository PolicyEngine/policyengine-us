# Elected Montana income tax before refundable credits and the 2021 rebate
# (Form 2 line 20). While married-filing-separately-on-same-return is allowed it
# is the smaller of the separate (indiv) and joint computations; after the
# option is repealed (2024) it is always the joint computation.

- name: MFSS era picks the minimum (indiv lower)
  period: 2021
  input:
    mt_income_tax_before_refundable_credits_indiv: 1_300
    mt_income_tax_before_refundable_credits_joint: 2_000
    state_code: MT
  output:
    mt_income_tax_before_2021_rebate: 1_300

- name: MFSS era picks the minimum (joint lower)
  period: 2021
  input:
    mt_income_tax_before_refundable_credits_indiv: 6_000
    mt_income_tax_before_refundable_credits_joint: 2_000
    state_code: MT
  output:
    mt_income_tax_before_2021_rebate: 2_000

- name: Post-MFSS repeal (2024) always picks joint
  period: 2024
  input:
    mt_income_tax_before_refundable_credits_indiv: 0
    mt_income_tax_before_refundable_credits_joint: 3_500
    state_code: MT
  output:
    mt_income_tax_before_2021_rebate: 3_500
