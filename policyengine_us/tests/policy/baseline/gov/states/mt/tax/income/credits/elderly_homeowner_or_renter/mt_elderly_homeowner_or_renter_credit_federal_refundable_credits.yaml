- name: Case 1, a federal EITC and refundable CTC claimed on this year's return are not received this year.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Rev. Proc. 2023-34, one qualifying child: 34% x 10_000 = 3_400.
    # Refundable CTC: min(1_700, 15% x (10_000 - 2_500)) = 1_125.
    eitc: 3_400
    refundable_ctc: 1_125
    # Gross household income counts "all income received" during the year
    # (MCA 15-30-2337(4)); the 2023 instructions, line 7, combine "all the
    # refundable credits received by the members of the household in
    # 2023". This return's credits are paid after the year ends, so no
    # receipt is supplied and none counts.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [0, 0]

- name: Case 2, a current-return entitlement adds nothing to gross household income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        income_tax_refundable_credits: 5_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 0
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000

- name: Case 3, federal refundable credits received count once, on the person who received them.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 40
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 632
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 2024 Schedule 2EC line 8: refundable credits received by all household
    # members. The son received a 632 federal EITC refund during 2024.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 632]

- name: Case 4, the 2021 Economic Impact Payment received in 2021 counts.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        taxable_pension_income: 20_000
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 1_400
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 2021 Elderly Homeowner/Renter Credit Schedule instructions, line 7:
    # "Refundable credits include the federal and Montana Earned Income Tax
    # Credit, the federal Child Tax Credits, Economic Impact Payments". The
    # third-round payment of 1_400 was received in 2021: 20_000 + 1_400.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_400

- name: Case 5, zero by default outside Montana.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [0, 0]
