- name: Case 1, a federal EITC and refundable CTC claimed on this year's return are not received this year.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Rev. Proc. 2023-34, one qualifying child: 34% x 10_000 = 3_400.
    # Refundable CTC: min(1_700, 15% x (10_000 - 2_500)) = 1_125.
    eitc: 3_400
    refundable_ctc: 1_125
    # Gross household income counts "all income received" during the year
    # (MCA 15-30-2337(4)); the 2023 instructions, line 7, combine "all the
    # refundable credits received by the members of the household in
    # 2023". This return's credits are paid after the year ends, so no
    # receipt is supplied and none counts.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [0, 0]

- name: Case 2, a current-return entitlement adds nothing to gross household income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        income_tax_refundable_credits: 5_000
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 0
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000

- name: Case 3, federal refundable credits received count once, on the person who received them.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
      person2:
        age: 40
        # A supplied receipt: a federal EITC refund received during 2024.
        mt_elderly_homeowner_or_renter_credit_other_federal_refundable_credits: 632
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 2024 Schedule 2EC line 8: refundable credits received by all household
    # members. The son received a 632 federal EITC refund during 2024; no
    # Economic Impact Payment was made in 2024, so the default adds nothing.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [0, 632]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [20_000, 632]

- name: Case 4, the 2021 Economic Impact Payment received in 2021 counts by default.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 2021 Elderly Homeowner/Renter Credit Schedule instructions, line 7:
    # "Refundable credits include the federal and Montana Earned Income Tax
    # Credit, the federal Child Tax Credits, Economic Impact Payments". IRC
    # 6428B(g) advanced the third-round payment during 2021: 1_400 for one
    # adult with AGI 20_000, under the 75_000 single threshold. Gross
    # household income is 20_000 + 1_400.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 1_400
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_400

- name: Case 4a, the 2020 Economic Impact Payments received in 2020 count by default.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # IRC 6428(f) and 6428A(f) advanced the 2020 credits: 1_200 (CARES) and
    # 600 (CAA) for one adult with AGI 20_000, under the 75_000 single
    # threshold. Gross household income is 20_000 + 1_800.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 1_800
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 21_800

- name: Case 4b, a joint return's 2020 payments are counted once, on the head.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 30_000
      person2:
        age: 68
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # Two adults, AGI 30_000 under the 150_000 joint threshold: 1_200 x 2 +
    # 600 x 2 = 3_600, on the head. Each person's share of gross household
    # income: the head 30_000 + 3_600 = 33_600, the spouse 0.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [3_600, 0]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [33_600, 0]

- name: Case 4c, a supplied receipt replaces the 2021 default.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        taxable_pension_income: 20_000
        # A claimant who received no payment during 2021. Supplying this
        # variable replaces the default for every member, so supply it for
        # everyone in the household.
        mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 0
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000

- name: Case 4d, no default receipt in 2022, when no payment was made.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 63
        taxable_pension_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: 0
    mt_elderly_homeowner_or_renter_credit_gross_household_income: 20_000

- name: Case 4e, another member's other receipts add to the 2021 payments and leave the claimant's in place.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 2_000
      daughter:
        age: 40
        employment_income: 15_000
        # A supplied receipt: a 600 federal refund received during 2021,
        # beyond her Economic Impact Payment.
        mt_elderly_homeowner_or_renter_credit_other_federal_refundable_credits: 600
    tax_units:
      claimant_unit:
        members: [claimant]
      daughter_unit:
        members: [daughter]
    households:
      household:
        members: [claimant, daughter]
        state_code: MT
  output:
    # Each return's head received the 1_400 third-round payment during 2021
    # (IRC 6428B(g); one adult, AGI under the 75_000 single threshold). The
    # daughter's 600 adds to hers, and supplying it leaves the claimant's
    # 1_400 in place: [1_400, 1_400 + 600] = [1_400, 2_000].
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [1_400, 2_000]
    # 2021 schedule. Line 10 = 20_000 + 1_400 + 15_000 + 2_000 = 38_400;
    # line 12 = 38_400 - 6_300 = 32_100; line 13 = 0.05; line 14 = 1_605;
    # line 19 = 2_000 - 1_605 = 395 (under the 1_000 cap); line 21 = 30%
    # (37_501 to 40_000); line 22 = 395 x 0.3 = 118.50.
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [21_400, 17_000]
    mt_elderly_homeowner_or_renter_credit: [118.50, 0]

- name: Case 4f, without other receipts the same household counts both payments.
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        taxable_pension_income: 20_000
        real_estate_taxes: 2_000
      daughter:
        age: 40
        employment_income: 15_000
    tax_units:
      claimant_unit:
        members: [claimant]
      daughter_unit:
        members: [daughter]
    households:
      household:
        members: [claimant, daughter]
        state_code: MT
  output:
    # Line 10 = 20_000 + 1_400 + 15_000 + 1_400 = 37_800; line 12 = 31_500;
    # line 14 = 1_575; line 19 = 2_000 - 1_575 = 425; line 21 = 30%; line 22
    # = 425 x 0.3 = 127.50.
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [1_400, 1_400]
    mt_elderly_homeowner_or_renter_credit_gross_household_income: [21_400, 16_400]
    mt_elderly_homeowner_or_renter_credit: [127.50, 0]

- name: Case 5, zero by default outside Montana.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ID
  output:
    mt_elderly_homeowner_or_renter_credit_federal_refundable_credits: [0, 0]
