# --- 85% SMI overlay isolation (large household where 0.85*SMI < 2.0*FPG).
# Size 13 (2 parents + 11 children) January 2026, contiguous: 200% FPG = 163,300 annual
# (13,608.33/mo); 85% SMI = 140,554 annual (11,712.84/mo). Between these two the SMI
# overlay rejects an otherwise FPG-eligible continuing recipient. ---
- name: Case 10, continuing recipient above 85% SMI but below 200% FPG is ineligible (SMI overlay).
  period: 2026-01
  # 148,000 annual = 12,333.33/mo: above 0.85 SMI (11,712.84) yet below 2.0 FPG (13,608.33).
  input:
    people:
      person1:
        age: 35
        employment_income: 148_000
      person2:
        age: 34
      person3:
        age: 3
      person4:
        age: 4
      person5:
        age: 5
      person6:
        age: 6
      person7:
        age: 7
      person8:
        age: 8
      person9:
        age: 9
      person10:
        age: 10
      person11:
        age: 11
      person12:
        age: 12
      person13:
        age: 13
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        state_code: MT
  output:
    mt_ccap_income_eligible: false

- name: Case 11, continuing recipient below 85% SMI is eligible (companion to Case 10).
  period: 2026-01
  # 138,000 annual = 11,500.00/mo: below both 0.85 SMI (11,712.84) and 2.0 FPG (13,608.33).
  input:
    people:
      person1:
        age: 35
        employment_income: 138_000
      person2:
        age: 34
      person3:
        age: 3
      person4:
        age: 4
      person5:
        age: 5
      person6:
        age: 6
      person7:
        age: 7
      person8:
        age: 8
      person9:
        age: 9
      person10:
        age: 10
      person11:
        age: 11
      person12:
        age: 12
      person13:
        age: 13
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

