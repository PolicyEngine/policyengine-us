# Unit tests for mt_ccap_income_eligible (SPMUnit, MONTH).
# MCA 52-2-715(1) and the Sliding Fee Scale effective 07-01-2025: applicants eligible
# through 185% FPG. The scale's Graduated Eligibility: non-TANF continuing recipients
# (mt_ccap_enrolled) eligible at annual redetermination through 200% FPG. TANF families
# are categorically eligible. An 85% SMI overlay applies to all non-TANF families
# (rarely binds).
# January 2026 uses the scale's 2025 guideline (contiguous), size 3 (1 parent + 2
# children): FPG = 26,650 annual. The scale prints 185% as 4,109 a month (49,308 a year)
# and 200% as 4,442 a month (53,304 a year); 85% SMI = 81,374 (does not bind at size 3).
# Income inputs are annual; the MONTH formula compares monthly portions.
- name: Case 1, applicant well below 185% FPG is eligible.
  period: 2026-01
  input:
    people:
      person1:
        employment_income: 30_000  # ~113% FPG
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 2, applicant just below the 185% FPG limit is eligible.
  period: 2026-01
  # 49,000 annual (183.9% FPG) -> below the 185% initial limit.
  input:
    people:
      person1:
        employment_income: 49_000
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 3, applicant just above the 185% FPG limit is ineligible.
  period: 2026-01
  # 49,500 annual (185.7% FPG) -> above the 185% initial limit; not enrolled.
  input:
    people:
      person1:
        employment_income: 49_500
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: false

- name: Case 4, continuing recipient between 185% and 200% FPG is eligible (graduated).
  period: 2026-01
  # 51,000 annual (191.4% FPG): over the 185% applicant limit but under 200%; enrolled.
  input:
    people:
      person1:
        employment_income: 51_000
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 5, continuing recipient just below the 200% FPG limit is eligible.
  period: 2026-01
  # 53,000 annual (198.9% FPG) -> below the 200% graduated limit; enrolled.
  input:
    people:
      person1:
        employment_income: 53_000
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 6, continuing recipient just above the 200% FPG limit is ineligible.
  period: 2026-01
  # 53,500 annual (200.8% FPG) -> above the 200% graduated limit; enrolled.
  input:
    people:
      person1:
        employment_income: 53_500
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: false

# Tight boundary coverage around the scale's printed limits (size 3, January 2026):
#   185% FPG = 4,109/mo (49,308/yr); 200% FPG = 4,442/mo (53,304/yr).
# A family at the printed limit qualifies, and one dollar a month above it doesn't.
- name: Case 6a, applicant at the scale's 185% FPG limit is eligible.
  period: 2026-01
  # 49,308/yr -> 4,109/mo, the scale's Standard Eligibility top for three.
  input:
    people:
      person1:
        employment_income: 49_308
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 6b, applicant one dollar a month above the 185% FPG limit is ineligible.
  period: 2026-01
  # 49,320/yr -> 4,110/mo, just over the 4,109/mo (185% FPG) initial limit.
  input:
    people:
      person1:
        employment_income: 49_320
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: false

- name: Case 6c, continuing recipient at the scale's 200% FPG limit is eligible.
  period: 2026-01
  # 53,304/yr -> 4,442/mo, the scale's Graduated Eligibility top for three.
  input:
    people:
      person1:
        employment_income: 53_304
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 6d, continuing recipient one dollar a month above the 200% FPG limit is ineligible.
  period: 2026-01
  # 53,316/yr -> 4,443/mo, just over the 4,442/mo (200% FPG) graduated limit.
  input:
    people:
      person1:
        employment_income: 53_316
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
        mt_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: false

- name: Case 7, TANF recipient over the 185% FPG limit is still income-eligible.
  period: 2026-01
  # 52,000 annual (195% FPG): over the applicant limit, but categorically eligible.
  input:
    people:
      person1:
        employment_income: 52_000
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: true
        mt_ccap_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_income_eligible: true

- name: Case 8, zero income is income-eligible.
  period: 2026-01
  input:
    people:
      person1:
        employment_income: 0
      person2:
        age: 4
      person3:
        age: 7
