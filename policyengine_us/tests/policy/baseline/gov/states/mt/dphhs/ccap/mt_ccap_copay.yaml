        employment_income: 29_520  # 111% of size-3 FPG (2,460/mo)
      person2:
        age: 4
      person3:
        age: 7
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        is_tanf_enrolled: false
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
  output:
    mt_ccap_copay: 24.6  # 2,460.00/mo * 0.01

