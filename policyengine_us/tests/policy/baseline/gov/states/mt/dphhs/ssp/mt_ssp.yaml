- name: Case 11, disabled worker above the SGA limit receives no supplement.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 40
    meets_ssi_disability_criteria: true
    mt_ssp_payment_category: ASSISTED_LIVING_OR_GROUP_OR_COMMUNITY_HOME
    # Full-time work at the 2026 Montana minimum wage of $10.85 (Montana
    # DLI): 10.85 x 40 hours x 52 weeks = 22,568 a year, 1,880.67 a month,
    # above the 1,690 non-blind SGA limit, so the model treats this person as
    # not disabled for SSI. A recipient who keeps SSI at this level under
    # section 1619(a) is excluded by SI DEN01415.010 B.1, so neither path pays.
    employment_income: 22_568
  output:
    ssi: 0
    mt_ssp: 0

- name: Case 12, certified resident in a Medicaid facility.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 65
    mt_ssp_payment_category: ASSISTED_LIVING_OR_GROUP_OR_COMMUNITY_HOME
    ssi_lives_in_medical_treatment_facility: true
    ssi_medicaid_pays_majority_of_care: true
  output:
    # Federal code D pays the 30 reduced benefit. POMS SI 01415.058 H.2 pairs
    # code D only with state code Z, so the certified rate of 94 is not paid.
    ssi_federal_living_arrangement: MEDICAL_TREATMENT_FACILITY
    ssi: 30
    mt_ssp: 0

