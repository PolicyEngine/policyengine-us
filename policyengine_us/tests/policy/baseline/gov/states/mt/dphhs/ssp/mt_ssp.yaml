# Sources: POMS SI 01415.058 H, SI DEN01415.010, and MCA 52-1-104.
- name: Case 1, certified personal care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 65
    mt_ssp_payment_category: ASSISTED_LIVING_OR_GROUP_OR_COMMUNITY_HOME
  output:
    mt_ssp: 94

