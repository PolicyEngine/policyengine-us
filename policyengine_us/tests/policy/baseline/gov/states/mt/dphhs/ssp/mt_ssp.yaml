- name: Case 15, disabled adult in certified personal care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 40
    meets_ssi_disability_criteria: true
    mt_ssp_payment_category: ASSISTED_LIVING_OR_GROUP_OR_COMMUNITY_HOME
  output:
    # No income: the full 994 federal benefit rate plus the 94 individual
    # personal care, group or community home level.
    ssi: 994
    mt_ssp: 94

- name: Case 16, 2027 payment after the federal benefit rate increase.
  period: 2027-01
  absolute_error_margin: 0.01
  input:
    state_code: MT
    age: 65
    mt_ssp_payment_category: ASSISTED_LIVING_OR_GROUP_OR_COMMUNITY_HOME
  output:
    # The 2027 COLA raises the federal benefit rate to 1,029. The Montana
    # level is the January 2026 value of 94 carried forward; no 2027
    # Montana schedule has been verified.
    ssi: 1_029
    mt_ssp: 94
