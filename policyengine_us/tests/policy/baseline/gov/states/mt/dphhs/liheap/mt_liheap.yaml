# return. The sibling's income was not considered for the SSI grant, so the
# household is not categorical (ARM 37.70.402(3)) and takes the income test.
# Every member's income counts (ARM 37.70.401(1)): wages $40,000 + $25,000 +
# the child's $6,000 of SSI = $71,000 > $64,846 size-4 limit, so ineligible and
# no benefit.
