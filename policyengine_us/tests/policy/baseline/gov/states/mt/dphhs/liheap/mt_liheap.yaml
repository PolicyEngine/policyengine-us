# FFY2026 Yellowstone County: parents (45, $40,000 wages; 43), an SSI child
# (10, $6,000 SSI) and a 20-year-old sibling ($25,000 wages) filing his own
# return. The sibling's income was not considered for the SSI grant, so the
# household is not categorical (ARM 37.70.402(3)) and takes the income test:
# adults' income $40,000 + $25,000 = $65,000 (the child's SSI is excluded as he
# is under 18) > $64,846 size-4 limit, so ineligible and no benefit.
- name: Case 10, an SSI child's household with a separately filing adult sibling takes the income test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        employment_income: 40_000
        ssi: 0
      person2:
        age: 43
        immigration_status: CITIZEN
        ssi: 0
      person3:
        age: 10
        immigration_status: CITIZEN
        ssi: 6_000
      person4:
        age: 20
        immigration_status: CITIZEN
        employment_income: 25_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        heating_type: NATURAL_GAS
        heating_expense: 1_000
        snap: 0
        tanf: 0
    tax_units:
      tax_unit1:
        members: [person1, person2, person3]
      tax_unit2:
        members: [person4]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
      marital_unit3:
        members: [person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MT
        county: YELLOWSTONE_COUNTY_MT
        bedrooms: 3
  output:
    mt_liheap_categorical_eligibility: NONE
    mt_liheap_countable_income: 65_000
    mt_liheap_income_limit: 64_846
    mt_liheap_eligible: false
    mt_liheap: 0

# ARM 37.70.407(1)(d): OASDI benefits of full-time students aged 18 to 22 are
# excluded. FFY2026 Yellowstone County (District 7): a parent (45, $36,000
# wages) and an 18-year-old full-time high-school student with $800 a month
# ($9,600 a year) of survivors benefits. Countable income $36,000 + ($9,600 -
# $9,600) = $36,000 <= $44,095 size-2 limit (counting the benefit, $45,600
# would be over it). $36,000 / $21,150 = 170.2% -> 170%, 151-175% band ->
# 0.51. Single-family two-bedroom natural gas: $772 x 0.51 = $393.72 -> $394.
- name: Case 11, survivors benefits of an 18-year-old full-time student are excluded.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        immigration_status: CITIZEN
        employment_income: 36_000
        ssi: 0
      person2:
        age: 18
        immigration_status: CITIZEN
        is_full_time_student: true
        social_security_survivors: 9_600
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        heating_expense: 1_000
        snap: 0
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: MT
        county: YELLOWSTONE_COUNTY_MT
        bedrooms: 2
  output:
    mt_liheap_household_size: 2
    mt_liheap_countable_income: 36_000
    mt_liheap_income_limit: 44_095
    mt_liheap_categorical_eligibility: NONE
    mt_liheap_benefit_income: 36_000
    mt_liheap_multiplier: 0.51
    mt_liheap_eligible: true
    mt_liheap: 394
