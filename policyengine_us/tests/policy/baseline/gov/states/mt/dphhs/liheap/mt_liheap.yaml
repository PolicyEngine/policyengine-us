#   mobile home wood $968 x 0.92 = $890.56 -> $891;
#   non-traditional dwelling, any fuel: flat $150 with no multiplier.
- name: Case 3, each dwelling type uses its matrix and non-traditional dwellings get 150 dollars.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [MT, MT, MT]
    county: [YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT]
    age: [45, 45, 45]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    employment_income: [0, 0, 0]
    bedrooms: [2, 2, 2]
    mt_liheap_dwelling_type: [MULTI_FAMILY, MOBILE_HOME, NON_TRADITIONAL]
    heating_type: [ELECTRICITY, WOOD, PROPANE]
    heating_expense: [1_300, 900, 1_600]
    ssi: [0, 0, 0]
    snap: [0, 0, 0]
    tanf: [0, 0, 0]
  output:
    mt_liheap: [802, 891, 150]

# Appendix A 9.1 single-family two-bedroom fuels, District 7, no income (0.92):
#   coal $671 x 0.92 = $617.32 -> $617;
#   fuel oil $1,794 x 0.92 = $1,650.48 -> $1,650;
#   kerosene, a deliverable fuel (ARM 37.70.401(5)), uses the fuel oil column:
#   $1,650; solar has no matrix column: $0 although eligible.
- name: Case 4, fuels map to matrix columns and kerosene uses fuel oil while solar pays nothing.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [MT, MT, MT, MT]
    county: [YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT]
    age: [45, 45, 45, 45]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    employment_income: [0, 0, 0, 0]
    bedrooms: [2, 2, 2, 2]
    heating_type: [COAL, FUEL_OIL, KEROSENE, SOLAR]
    heating_expense: [800, 2_000, 2_000, 300]
    ssi: [0, 0, 0, 0]
    snap: [0, 0, 0, 0]
    tanf: [0, 0, 0, 0]
  output:
    mt_liheap_eligible: [true, true, true, true]
    mt_liheap: [617, 1_650, 1_650, 0]

# ARM 37.70.402(7), 37.70.601(3): subsidized housing with heat in rent gets the
# modified benefit, the greater of 5% of the regular benefit and $25.
# District 7, no income (0.92):
#   apartment electric two bedrooms, HUD assistance: regular $802 -> 5% =
#   $40.10;
#   apartment natural gas one bedroom, public housing: regular $378 x 0.92 =
#   $347.76 -> $348 -> 5% = $17.40 -> $25 minimum.
- name: Case 5, subsidized heat-in-rent households get the modified benefit with a 25 dollar minimum.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [MT, MT]
    county: [YELLOWSTONE_COUNTY_MT, YELLOWSTONE_COUNTY_MT]
    age: [45, 45]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [0, 0]
    bedrooms: [2, 1]
    mt_liheap_dwelling_type: [MULTI_FAMILY, MULTI_FAMILY]
    heating_type: [ELECTRICITY, NATURAL_GAS]
    heating_expense: [0, 0]
    heat_expense_included_in_rent: [true, true]
    pre_subsidy_rent: [10_800, 9_600]
    receives_housing_assistance: [true, false]
    is_in_public_housing: [false, true]
    ssi: [0, 0]
    snap: [0, 0]
    tanf: [0, 0]
  output:
    mt_liheap: [40.10, 25]

# ARM 37.70.607(3): an unsubsidized heat-in-rent household is paid the regular
# benefit monthly, each month at most 50% of rent, over the seven-month
# season. Silver Bow County is District 12; single-family propane two
# bedrooms, no income (1.06): $1,503 x 1.06 = $1,593.18 -> $1,593.
#   rent $450 a month: cap 50% x 7 x $5,400 / 12 = $1,575 -> $1,575;
#   rent $900 a month: cap $3,150 -> $1,593.
- name: Case 6, unsubsidized heat-in-rent benefits are capped at half of seven months of rent.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [MT, MT]
    county: [SILVER_BOW_COUNTY_MT, SILVER_BOW_COUNTY_MT]
    age: [45, 45]
    immigration_status: [CITIZEN, CITIZEN]
    employment_income: [0, 0]
    bedrooms: [2, 2]
    heating_type: [PROPANE, PROPANE]
    heating_expense: [0, 0]
    heat_expense_included_in_rent: [true, true]
    pre_subsidy_rent: [5_400, 10_800]
    ssi: [0, 0]
    snap: [0, 0]
    tanf: [0, 0]
  output:
    mt_liheap: [1_575, 1_593]

# Manual 2026-2027 Appendix A 9.8: "Single person receives SSI of $22 and SS
# of $696" uses the $994 SSI standard. Benefit income $994 x 12 = $11,928;
# $11,928 / $15,960 = 74.7% -> 75%, 75-100% band; Gallatin County is
# District 9, FFY2027 0.88. Mobile home electric one bedroom: $841 x 0.88 =
# $740.08 -> $740. Countable income is $264 + $8,352 = $8,616 (Medicaid pays
# the Part B premium).
- name: Case 7, an SSI categorical household uses the SSI standard for the multiplier in FFY2027.
  period: 2027
  absolute_error_margin: 0.01
  input:
    state_code: MT
    county: GALLATIN_COUNTY_MT
    age: 72
    immigration_status: CITIZEN
    ssi: 264
    social_security_retirement: 8_352
    medicare_part_b_premium: 0
    bedrooms: 1
    mt_liheap_dwelling_type: MOBILE_HOME
    heating_type: ELECTRICITY
    heating_expense: 1_500
    snap: 0
    tanf: 0
  output:
    mt_liheap_categorical_eligibility: SSI_TANF
    mt_liheap_countable_income: 8_616
    mt_liheap_benefit_income: 11_928
    mt_liheap_multiplier: 0.88
    mt_liheap_eligible: true
    mt_liheap: 740

