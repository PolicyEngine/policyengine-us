# ARM 37.70.601, 37.70.607; LIHEAP Manual 2025-2026 sections 3.20-3.23 and
# Appendix A 9.1-9.2; LIHEAP Manual 2026-2027 Appendix A 9.1-9.2. Regular
# benefit = base benefit (dwelling type x bedrooms 1-4 x fuel) x district
# multiplier, rounded to the nearest dollar; non-traditional dwellings get a
# flat $150.
# Manual 2025-2026 section 3.23 example: three people, two eligible, $15,000
# income, District 7 (Yellowstone County), two-bedroom single-family home
# heated with propane. $15,000 / $21,150 = 70.9% -> 71%, 51-74% band -> 0.83.
# $1,503 x 0.83 = $1,247.49 -> $1,247.
- name: Case 1, the manual example with an ineligible member pays 1,247 dollars.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        immigration_status: CITIZEN
        employment_income: 9_000
        ssi: 0
      person2:
        age: 33
        immigration_status: UNDOCUMENTED
        employment_income: 6_000
        ssi: 0
      person3:
        age: 6
        immigration_status: CITIZEN
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: PROPANE
        heating_expense: 1_800
        snap: 0
        tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: MT
        county: YELLOWSTONE_COUNTY_MT
        bedrooms: 2
  output:
    mt_liheap_household_size: 2
    mt_liheap_countable_income: 15_000
    mt_liheap_categorical_eligibility: NONE
    mt_liheap_benefit_income: 15_000
    mt_liheap_multiplier: 0.83
    mt_liheap_eligible: true
    mt_liheap: 1_247

