- name: Case 1, Wyoming supplement enters state benefit and SNAP income totals.
  period: 2026-01
  input:
    state_code: WY
    age: 65
  output:
    wy_ssp_eligible: true
    wy_ssp: 20
    snap_unearned_income: 1_014
    household_state_benefits: 20

- name: Case 2, eligible couple receives twenty dollars each.
  period: 2026-01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WY
  output:
    ssi: [745.5, 745.5]
    wy_ssp: [20, 20]
    household_state_benefits: 40

- name: Case 3, annual Wyoming supplement counts as HUD income.
  period: 2026
  input:
    state_code: WY
    age: 65
  output:
    wy_ssp: 240
    # SSI $994 * 12 = $11,928, plus the $240 supplement = $12,168.
    hud_annual_income: 12_168
