# 42 USC 8624(b)(2)(B): income LESS THAN 110% of the 2025 guideline is
# protected. Each unit enters a 17-member household; the guideline and
# limit still compute from that size. Native SMI limit 113,688;
# 110% * (15,650 + 16 * 5,500) = 114,015.
# Unit 1: 113,900 is above 113,688 but below 114,015, so it qualifies.
# Its ratio to the effective limit, 113,900 / 114,015 = .999, selects .10:
# 2,640 * .10 - round_half_up(264 * .10) = 238, below its 3,000 cost.
# Unit 2: 114,015 equals the floor, so it is not protected.
- name: Case 151, federal income protection applies only below the 110 percent poverty floor.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: [WY, WY]
    wy_lieap_household_size: [17, 17]
    wy_lieap_countable_income: [113_900, 114_015]
    heating_type: [FUEL_OIL, FUEL_OIL]
    heating_expense: [3_000, 3_000]
  output:
    wy_lieap_fpg: [103_650, 103_650]
    wy_lieap_income_limit: [113_688, 113_688]
    wy_lieap_eligible: [true, false]
    wy_lieap: [238, 0]

# Rules chapter 1, sections 3(nn) and 8(a)(i): nonexempt ordinary DoD
# retirement counts separately from pension and VA. 36000 exceeds 35829.
- name: Case 152, ordinary military retirement is counted separately from the veterans exclusion.
  period: 2026
  input:
    state_code: WY
    age: 40
    immigration_status: CITIZEN
    is_veteran: true
    years_in_military: 20
    military_retirement_pay: 36000
    pension_income: 0
    veterans_benefits: 0
    ssi: 0
    heating_type: FUEL_OIL
    fuel_oil_expense: 3000
  output:
    military_retirement_income: 36000
    pension_income: 0
    veterans_benefits: 0
    wy_lieap_countable_income: 36000
    wy_lieap_income_limit: 35829
    wy_lieap_eligible: false
    wy_lieap: 0

# Rules chapter 1, section 3(nn) counts gross non-exempt money from any
# source, and no section 8(a)(ii) exemption covers a uniformed-services
# survivor annuity. military_retirement_income adds the $40,000 Survivor
# Benefit Plan annuity, which exceeds the $35,829 one-person FY2026 limit
# and the $17,215 federal floor (110% * 15,650).
- name: Case 153, a military survivor annuity counts as military retirement income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WY
    age: 70
    immigration_status: CITIZEN
    military_retirement_pay_survivors: 40_000
    ssi: 0
    heating_type: NATURAL_GAS
    gas_expense: 1_500
  output:
    military_retirement_income: 40_000
    wy_lieap_countable_income: 40_000
    wy_lieap_income_limit: 35_829
    wy_lieap_eligible: false
    wy_lieap: 0

# Rules chapter 1, section 8(a)(ii)(U) exempts Medicare deducted from SSA,
# and FY2026 plan section 1.9 counts Social Security excluding the Medicare
# deduction. The 2026 Part B premium is 202.90 * 12 = 2,434.80; $37,000 of
# Social Security is above the Medicare Savings Program limits, so the
# person pays it: 37,000 - 2,434.80 = 34,565.20, within the $35,829 limit.
# Ratio 34,565.20 / 35,829 = .965 selects .10:
# 1,550.85 * .10 = 155.085; round_half_up(15.5085) = 16 withheld;
# 155.085 - 16 = 139.085, below the $1,500 bill.
- name: Case 154, Social Security counts net of the Medicare Part B premium.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WY
    age: 70
    immigration_status: CITIZEN
    social_security_retirement: 37_000
    ssi: 0
    heating_type: NATURAL_GAS
    gas_expense: 1_500
  output:
    medicare_part_b_premium: 2_434.8
    wy_lieap_countable_income: 34_565.2
    wy_lieap_income_limit: 35_829
    wy_lieap_eligible: true
    wy_lieap: 139.085

# Rule 3(hh) lists diesel and oil fuel types, and heating_expense reads a
# kerosene bill as fuel_oil_expense, so the $2,640 oil standard applies.
# 20,000 / 35,829 = .558 is below the .56 row start ($20,064.24), so the
# .51-.55 row pays .45: 2,640 * .45 = 1,188;
# 1,188 - round_half_up(118.8) = 1,069, below the $1,500 bill.
- name: Case 155, a kerosene bill uses the heating oil standard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WY
    age: 40
    immigration_status: CITIZEN
    employment_income: 20_000
    ssi: 0
    heating_type: KEROSENE
    fuel_oil_expense: 1_500
  output:
    heating_expense: 1_500
    wy_lieap_countable_income: 20_000
    wy_lieap_income_limit: 35_829
    wy_lieap_eligible: true
    wy_lieap: 1_069

# Rules 3(kk), 8(b)(i)(B) and 10(e) and plan section 2.3 serve a renter
# whose heat is included in rent on the standard benefit formula. With no
# separate gas bill, heating_expense is 0 and no bill caps the award.
# 20,000 / 35,829 = .558 takes the .45 fraction: 1,550.85 * .45 = 697.8825;
# 697.8825 - round_half_up(69.78825) = 697.8825 - 70 = 627.8825.
- name: Case 156, heat included in rent with no separate bill receives the standard gas formula.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WY
    age: 40
    immigration_status: CITIZEN
    employment_income: 20_000
    ssi: 0
    heating_type: NATURAL_GAS
    heat_expense_included_in_rent: true
  output:
    heating_expense: 0
    wy_lieap_countable_income: 20_000
