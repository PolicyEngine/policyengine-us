# Wyoming POWER Resources Eligibility Tests
# Formula: spm_unit_cash_assets <= $5,000 limit
# Source: Wyoming DFS Policy Manual

- name: Case 1, zero resources.
  period: 2026-01
  input:
    state_code: WY
    spm_unit_cash_assets: 0
  output:
    wy_power_resources_eligible: true

- name: Case 2, one dollar below limit.
  period: 2026-01
  input:
    state_code: WY
    spm_unit_cash_assets: 4_999
  output:
    wy_power_resources_eligible: true

- name: Case 3, exactly at limit.
  period: 2026-01
  input:
    state_code: WY
    spm_unit_cash_assets: 5_000
  output:
    # Uses <= so at limit is eligible
    wy_power_resources_eligible: true

- name: Case 4, one dollar above limit.
  period: 2026-01
  input:
    state_code: WY
    spm_unit_cash_assets: 5_001
  output:
    wy_power_resources_eligible: false

# 4,211.74 + 769.20 + 19.06 = 5,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 5,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_211.74
    stock_assets: 769.20
    bond_assets: 19.06
    state_code: WY
  output:
    wy_power_resources_eligible: true

# 4,211.74 + 769.20 + 19.07 = 5,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 4_211.74
    stock_assets: 769.20
    bond_assets: 19.07
    state_code: WY
  output:
    wy_power_resources_eligible: false
