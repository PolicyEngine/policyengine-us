- name: Case 7, court supervision is specific to the child in a mixed household.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        is_under_court_supervision: true
      person2:
        age: 17
        is_under_court_supervision: true
      person3:
        age: 17
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: WY
  output:
    wy_ccap_eligible_child: [false, true, false]

# 175% FPG is Step 4: $6.40/full day * 20 days = $128, below the 7% cap.
# Annual countable income of 3,500 x 12 = 42,000 sits exactly on the 175% FPG
# entry limit (24,000 x 1.75) and at the top of copay Step 4, which the
# inclusive limit and step ceiling both admit.
- name: Case 8, court supervision leaves the ordinary per-child copay in force.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: WY
    age: 17
    is_under_court_supervision: true
    wy_ccap_activity_eligible: true
    wy_ccap_countable_income: 3_500
    wy_ccap_gross_income: 3_500
    spm_unit_fpg: 24_000
    wy_ccap_day_length: FULL_DAY
    childcare_attending_days_per_month: 20
  output:
    wy_ccap_income_eligible: true
    wy_ccap_eligible: true
    wy_ccap_copay: 128
