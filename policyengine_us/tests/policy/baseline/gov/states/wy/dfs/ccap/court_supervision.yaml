- name: WY sibling supervision does not inherit another child care order
  period: 2026-09
  input:
    people:
      parent:
        age:
          2026: 35
        is_under_court_supervision:
          2026: true
      qualifying:
        age:
          2026: 17
        requires_childcare_under_court_order:
          2026: true
      sibling:
        age:
          2026: 17
        is_under_court_supervision:
          2026: true
    spm_units:
      spm_unit:
        members: &id001 [parent, qualifying, sibling]
    households:
      household:
        members: *id001
        state_code:
          2026: WY
  output:
    wy_ccap_eligible_child: [false, true, false]

# 175% FPG is Step 4: $6.40/full day * 20 days = $128, below the 7% cap.
- name: WY care-specific court order leaves the ordinary per-child copay in force
  period: 2026-09
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: WY
    age:
      2026: 17
    requires_childcare_under_court_order:
      2026: true
    wy_ccap_activity_eligible: true
    wy_ccap_countable_income: 3500
    wy_ccap_gross_income: 3500
    spm_unit_fpg:
      2026: 24000
    wy_ccap_day_length: FULL_DAY
    childcare_attending_days_per_month:
      2026: 20
  output:
    wy_ccap_income_eligible: true
    wy_ccap_eligible: true
    wy_ccap_copay: 128
    receives_or_needs_protective_services: false
