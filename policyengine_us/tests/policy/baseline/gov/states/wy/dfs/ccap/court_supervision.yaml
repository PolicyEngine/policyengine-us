# Court-supervision route for wy_ccap_eligible_child (Rules Ch. 1 8(e)(i)(A);
# Manual 601.B.1; CCDF Plan 2.2.1.c): a child under court supervision is
# eligible under the elected ceiling of 18. Court status does not waive income,
# activity, immigration, or copayment rules.
- name: Case 1, court supervision extends the age limit to under 18.
  period: 2026-01
  input:
    state_code: [WY, WY, WY, WY, WY, WY]
    age: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision: [true, true, true, true, true, true]
  output:
    wy_ccap_eligible_child: [true, true, true, false, false, false]

- name: Case 2, court supervision does not bypass the immigration requirement.
  period: 2026-01
  input:
    state_code: WY
    age: 17
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
  output:
    wy_ccap_eligible_child: false

# Monthly expenses of $100 are below the school-age rate, so the payment is
# capped at the $100 charge.
- name: Case 3, supervised 17-year-old receives child-care benefit through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.02
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
        weekly_hours_worked_before_lsr: 25
      person2:
        age: 17
        is_tax_unit_dependent: true
        is_in_k12_school: true
        childcare_hours_per_week: 30
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        childcare_attending_days_per_month: 20
        pre_subsidy_childcare_expenses: 1_200
        is_under_court_supervision: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 1_200
    households:
      household:
        members: [person1, person2]
        state_code: WY
        county_str: LARAMIE_COUNTY_WY
  output:
    wy_ccap_eligible_child: [false, true]
    wy_ccap_eligible: true
    wy_ccap: 100

