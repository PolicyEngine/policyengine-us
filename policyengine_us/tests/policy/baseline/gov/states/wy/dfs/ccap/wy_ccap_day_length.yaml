# Unit tests for wy_ccap_day_length (Person, MONTH, Enum).
# Table I / Manual §1101.N.1: a part day is less than five hours of care and
# a full day is five or more hours (rates/day_length_min_hours.yaml = 5).
- name: Case 1, exactly five hours of care is the full-day boundary.
  period: 2026-01
  input:
    people:
      person1:
        age: 3
        childcare_hours_per_day: 4
      person2:
        age: 3
        childcare_hours_per_day: 4.99  # just below the 5-hour cutoff
      person3:
        age: 3
        childcare_hours_per_day: 5  # exactly 5 hours is a full day
      person4:
        age: 3
        childcare_hours_per_day: 9
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_day_length: [PART_DAY, PART_DAY, FULL_DAY, FULL_DAY]

- name: Case 2, unknown hours retain full-time pricing.
  period: 2026-01
  input:
    people:
      person1:
        age: 3
    households:
      household:
        members: [person1]
        state_code: WY
  output:
    wy_ccap_day_length: [FULL_DAY]

# Both the formula and metadata default retain FULL_DAY for unknown hours.
# Outside Wyoming, defined_for returns only the metadata default.
- name: Case 3, outside Wyoming defined_for masks the formula and the FULL_DAY default shows.
  period: 2026-01
  input:
    people:
      person1:
        age: 3
        childcare_hours_per_day: 4  # would be PART_DAY if the formula ran
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    wy_ccap_day_length: [FULL_DAY]

# Alternate hours use reported attendance frequency; thresholds remain state-specific.
- name: Case 4, ten weekly hours over five care days is a short day.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    wy_ccap_day_length: PART_DAY
- name: Case 5, monthly attendance supplies frequency for weekly hours.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_week: 10
    childcare_attending_days_per_month: 20
  output:
    wy_ccap_day_length: PART_DAY
- name: Case 6, weekly hours at the daily threshold qualify for full days.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_week: 25
    childcare_days_per_week: 5
  output:
    wy_ccap_day_length: FULL_DAY
- name: Case 7, reported daily hours take precedence over weekly conversion.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_day: 5
    childcare_hours_per_week: 10
    childcare_days_per_week: 5
  output:
    wy_ccap_day_length: FULL_DAY
- name: Case 8, care days without hours retain the full-time fallback.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_days_per_week: 5
  output:
    wy_ccap_day_length: FULL_DAY
- name: Case 9, weekly hours below the daily threshold without attendance days are a part day.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_week: 4
  output:
    wy_ccap_day_length: PART_DAY
- name: Case 10, weekly hours at the daily threshold without attendance days retain the full-day fallback.
  period: 2026-01
  input:
    state_code: WY
    age: 3
    childcare_hours_per_week: 5
  output:
    wy_ccap_day_length: FULL_DAY
