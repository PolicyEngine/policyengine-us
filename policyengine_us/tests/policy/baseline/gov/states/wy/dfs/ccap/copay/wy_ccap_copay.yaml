# Unit tests for wy_ccap_copay (SPMUnit, MONTH, USD).
# Table I: a flat daily DFS parental copay per child by Sliding Fee Scale
# step and part/full day (part/full): Step 1 (<=100% FPG) 0/0, Step 2 (125%)
# 0.44/0.88, Step 3 (150%) 0.88/1.76, Step 4 (175%) 3.20/6.40, Step 5 (200%)
# 4.68/9.36, Step 6 (225%) 6.84/13.68. The family copay is capped at 7% of
# gross income (CCDF Plan 3.1.1) and waived for foster/protective-services
# children (W.S. 42-2-103(f)(i)(A), Plan 3.3.1).
# Baseline family of four (two parents, child age 3 in care 10 days per
# month, child age 8 not in care): 2026 FPG = 33_000 per year = 2_750 per
# month. Countable income = employment / 12 - 200 (one earner). The variable
# is defined_for wy_ccap_eligible; parents' default 40 weekly work hours
# keep every unit activity eligible.
- name: Case 1, a unit with no income at Step 1 owes no copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 0

- name: Case 2, Step 2 part-day copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 38_400 / 12 = 3_200 - 200 = 3_000; ratio 3_000 / 2_750 = 1.091
        # lands in Step 2 (above 100% through 125%).
        employment_income: 38_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 4  # part day
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 4.4  # 0.44 x 10 days

- name: Case 3, the full-day copay is twice the part-day copay at the same step.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 38_400  # Step 2, as in Case 2
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8  # full day
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 8.8  # 0.88 x 10 days

- name: Case 4, Step 3 full-day copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 50_400 / 12 = 4_200 - 200 = 4_000; ratio 4_000 / 2_750 = 1.455
        # lands in Step 3 (above 125% through 150%).
        employment_income: 50_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 17.6  # 1.76 x 10 days

- name: Case 5, Step 4 full-day copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 56_400 / 12 = 4_700 - 200 = 4_500; ratio 4_500 / 2_750 = 1.636
        # lands in Step 4 (above 150% through 175%).
        employment_income: 56_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 64  # 6.40 x 10 days

- name: Case 6, Step 5 full-day copay for an enrolled unit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 62_400 / 12 = 5_200 - 200 = 5_000; ratio 5_000 / 2_750 = 1.818
        # lands in Step 5 (above 175% through 200%), reachable only while
        # enrolled.
        employment_income: 62_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        wy_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 93.6  # 9.36 x 10 days

- name: Case 7, Step 6 full-day copay for an enrolled unit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 74_400 / 12 = 6_200 - 200 = 6_000; ratio 6_000 / 2_750 = 2.182
        # lands in Step 6 (above 200% through 225%).
        employment_income: 74_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        wy_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 136.8  # 13.68 x 10 days

- name: Case 8, the copay is charged per child by each child's own day length.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 50_400  # Step 3, as in Case 4
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8  # full day: 1.76 per day
        childcare_attending_days_per_month: 10
      person4:
        age: 8
        childcare_hours_per_day: 4  # part day: 0.88 per day
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 26.4  # (1.76 + 0.88) x 10 days

- name: Case 9, the copay is waived when a child is in foster care.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 56_400  # Step 4 income, would owe 64
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
        is_in_foster_care: true
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 0

- name: Case 10, the copay is waived for a protective-services child.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 56_400  # Step 4 income, would owe 64
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
        receives_or_needs_protective_services: true
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 0

- name: Case 11, the family copay is capped at 7 percent of gross income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # Single parent, three children in care: 69_000 / 12 = 5_750 gross;
        # countable 5_550; ratio 5_550 / 2_750 = 2.018 lands in Step 6.
        # Uncapped copay 3 x 13.68 x 10 = 410.40 exceeds the cap
        # 0.07 x 5_750 = 402.50.
        employment_income: 69_000
      person2:
        age: 2
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person3:
        age: 4
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 7
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        wy_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 402.5

- name: Case 12, an ineligible teenager in care adds no copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 56_400  # Step 4, as in Case 5
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 14  # not an eligible child; care days do not accrue copay
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_copay: 64  # 6.40 x 10 days for the eligible child only

# The 7% cap reads gross income floored at zero. A self-employment loss can
# drive gross negative while countable income stays positive, because the
# per-person countable-earned floor discards the loss instead of offsetting
# other earnings. Without the max_(gross, 0) floor the cap would be negative
# (0.07 x -1_800 = -126) and min_() would return that as the copay, so this
# case fails if the floor is removed. Family of three, 2026 FPG =
# 15_960 + 2 x 5_680 = 27_320 per year = 2_276.67 per month.
- name: Case 13, a negative gross income floors the 7 percent cap at zero rather than going negative.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        employment_income: 38_400  # 3_200 per month - 200 = 3_000 countable
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
        self_employment_income: -60_000  # -5_000 per month; gross goes negative
      person3:
        age: 3
        childcare_hours_per_day: 8  # full day
        childcare_attending_days_per_month: 20
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: WY
  output:
    # 3_000 / 2_276.67 = 1.318 of the guideline: Step 3, full-day 1.76 per day,
    # so the uncapped family copay would be 1.76 x 20 = 35.20.
    wy_ccap_countable_income: 3_000
    wy_ccap_gross_income: -1_800  # 3_200 - 5_000
    wy_ccap_income_eligible: true  # 3_000 <= 1.75 x 2_276.67 = 3_984.17
    wy_ccap_copay: 0  # min(35.20, 0.07 x max(-1_800, 0)) = 0

# Step-boundary cases. Table I steps are "above" bands (Step 2 = above 100%
# through 125% of the guideline), so a unit exactly on a step edge stays in the
# lower step. single_amount brackets are "at or above threshold," which is the
# opposite convention, so every threshold above the first is shifted by 0.0001
# to compensate. Cases 1-13 all land mid-band and so pass either way; these
# cases put countable income exactly on each edge, where an unshifted threshold
# (1.25 instead of 1.2501) would push the unit up a step and overcharge.
# Baseline family of four: 2026 FPG = 15_960 + 3 x 5_680 = 33_000 per year =
# 2_750 per month, and countable income = employment / 12 - 200 (one earner),
# so annual employment of (ratio x 2_750 + 200) x 12 lands exactly on the edge.
- name: Case 14, countable income exactly at 100 percent of the guideline stays in Step 1 and owes no copay.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 35_400 / 12 = 2_950 - 200 = 2_750 = 1.00 x 2_750.
        employment_income: 35_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 2_750
    # A 1.0 threshold would charge the Step 2 rate, 0.88 x 10 = 8.80.
    wy_ccap_copay: 0

- name: Case 15, countable income exactly at 125 percent of the guideline stays in Step 2 for both day lengths.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 43_650 / 12 = 3_637.50 - 200 = 3_437.50 = 1.25 x 2_750.
        employment_income: 43_650
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8  # full day: 0.88 at Step 2
        childcare_attending_days_per_month: 10
      person4:
        age: 8
        childcare_hours_per_day: 4  # part day: 0.44 at Step 2
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 3_437.5
    # Both children exercise the edge, so this case pins the 1.2501 threshold in
    # full_day.yaml and part_day.yaml at once. A 1.25 threshold in either file
    # would charge the Step 3 rates, (1.76 + 0.88) x 10 = 26.40.
    wy_ccap_copay: 13.2  # (0.88 + 0.44) x 10 days

- name: Case 16, one dollar per month above 125 percent of the guideline moves the unit to Step 3.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 43_662 / 12 = 3_638.50 - 200 = 3_438.50; ratio 1.2504 clears the
        # 1.2501 threshold.
        employment_income: 43_662
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8  # full day: 1.76 at Step 3
        childcare_attending_days_per_month: 10
      person4:
        age: 8
        childcare_hours_per_day: 4  # part day: 0.88 at Step 3
        childcare_attending_days_per_month: 10
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 3_438.5
    # Paired with Case 15: together they bound the Step 2/3 edge from both
    # sides, so an offset larger than the intended 0.0001 (1.251, say) would
    # hold this unit in Step 2 and fail here.
    wy_ccap_copay: 26.4  # (1.76 + 0.88) x 10 days

- name: Case 17, countable income exactly at 150 percent of the guideline stays in Step 3.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 51_900 / 12 = 4_325 - 200 = 4_125 = 1.50 x 2_750.
        employment_income: 51_900
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 4_125
    # A 1.5 threshold would charge the Step 4 rate, 6.40 x 10 = 64.
    wy_ccap_copay: 17.6  # 1.76 x 10 days

- name: Case 18, countable income exactly at 175 percent of the guideline stays in Step 4.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 60_150 / 12 = 5_012.50 - 200 = 4_812.50 = 1.75 x 2_750.
        employment_income: 60_150
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 4_812.5
    # This edge is also the Manual §1101.A initial income limit, which is
    # inclusive, so an un-enrolled unit sitting exactly on it is still eligible
    # and the Step 4 rate is the highest an applicant can be charged.
    wy_ccap_income_eligible: true
    # A 1.75 threshold would charge the Step 5 rate, 9.36 x 10 = 93.60.
    wy_ccap_copay: 64  # 6.40 x 10 days

- name: Case 19, an enrolled unit exactly at 200 percent of the guideline stays in Step 5.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 68_400 / 12 = 5_700 - 200 = 5_500 = 2.00 x 2_750; above the initial
        # limit, so reachable only while enrolled.
        employment_income: 68_400
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        wy_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 5_500
    # A 2.0 threshold would charge the Step 6 rate, 13.68 x 10 = 136.80.
    wy_ccap_copay: 93.6  # 9.36 x 10 days

- name: Case 20, an enrolled unit exactly at 225 percent of the guideline stays in Step 6.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 40  # working caretaker
        # 76_650 / 12 = 6_387.50 - 200 = 6_187.50 = 2.25 x 2_750.
        employment_income: 76_650
      person2:
        age: 33
        weekly_hours_worked_before_lsr: 40  # working caretaker
      person3:
        age: 3
        childcare_hours_per_day: 8
        childcare_attending_days_per_month: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        wy_ccap_enrolled: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: WY
  output:
    wy_ccap_countable_income: 6_187.5
    # Step 6 is the top band and the Manual §1201.B continued limit is also
    # inclusive, so this is the highest copay the schedule can produce; a unit
    # any higher is income-ineligible and the copay is masked to zero.
    wy_ccap_income_eligible: true
    wy_ccap_copay: 136.8  # 13.68 x 10 days
