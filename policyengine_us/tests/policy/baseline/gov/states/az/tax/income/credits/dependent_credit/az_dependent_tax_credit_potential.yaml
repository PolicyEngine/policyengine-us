# A.R.S. 43-1073.01 grants the credit for each dependent, and A.R.S.
# 43-1001(3) gives "dependent" the IRC 152 meaning. Under IRC 152(b)(1) a
# return on which the filer (or, if joint, either spouse) can be claimed as a
# dependent has no dependents. Amounts: $100 per dependent under 17 through
# 2025 and $125 from 2026 (dependent_credit/amount.yaml); no reduction below
# $200,000 single / $400,000 joint AGI.

- name: 2025 single filer who can be claimed as a dependent gets no credit for a child
  period: 2025
  input:
    people:
      filer:
        age: 19
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
    households:
      household:
        members: [filer, child]
        state_code: AZ
  output:
    az_dependent_tax_credit_potential: 0

- name: 2025 single filer who cannot be claimed gets $100 for a child
  period: 2025
  input:
    people:
      filer:
        age: 19
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
    households:
      household:
        members: [filer, child]
        state_code: AZ
  output:
    az_dependent_tax_credit_potential: 100

- name: 2025 joint return with one claimable spouse gets no dependent credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        adjusted_gross_income: 10_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: AZ
  output:
    az_dependent_tax_credit_potential: 0

