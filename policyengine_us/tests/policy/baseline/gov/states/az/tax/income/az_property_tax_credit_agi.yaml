# Per ITR 12-1, property tax credit AGI is Federal AGI minus Social Security.
# Unlike regular AZ income tax, it does NOT exclude pensions, capital gains, etc.

- name: Basic wages and interest (no Social Security)
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 3_766.08
    tax_unit_taxable_social_security: 0
  output:
    az_property_tax_credit_agi: 3_766.08

- name: Social Security is excluded from property tax credit AGI
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 20_000
    tax_unit_taxable_social_security: 8_500
  output:
    # $20,000 - $8,500 = $11,500
    az_property_tax_credit_agi: 11_500

- name: Pension income is NOT excluded (unlike regular AZ income tax)
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 15_000
    tax_unit_taxable_social_security: 0
  output:
    az_property_tax_credit_agi: 15_000

- name: Capital gains are NOT excluded (unlike regular AZ income tax)
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 25_000
    tax_unit_taxable_social_security: 0
  output:
    az_property_tax_credit_agi: 25_000

- name: Negative when losses leave other income below taxable Social Security
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 5_000
    tax_unit_taxable_social_security: 6_000
  output:
    # $5,000 - $6,000 = -$1,000. Not floored: Form 140PTC line J can be
    # negative, and az_property_tax_credit uses zero only for the schedules.
    az_property_tax_credit_agi: -1_000

- name: Combined income types with Social Security exclusion
  period: 2024
  input:
    state_code: AZ
    adjusted_gross_income: 22_250
    tax_unit_taxable_social_security: 4_250
  output:
    # $22,250 - $4,250 = $18,000
    az_property_tax_credit_agi: 18_000

# A.A.C. R15-2C-502(C)(3): each member's net capital loss is limited to
# $1,500, in place of federal AGI's $3,000 limit per return.
- name: Federal capital loss limit is replaced by the 1,500 member limit
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 10_000
        long_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    # Federal AGI: 10,000 - 3,000 = 7,000.
    adjusted_gross_income: 7_000
    # Form 140PTC line A 10,000 + line D (1,500) = 8,500.
    az_property_tax_credit_agi: 8_500

- name: A dependent's capital loss is left to dependent income
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 3_000
      child:
        age: 12
        is_tax_unit_dependent: true
        long_term_capital_gains: -2_500
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: AZ
  output:
    # Only the head's line A wages. The dependent's line D (1,500) is in
    # az_property_tax_credit_dependent_income.
    az_property_tax_credit_agi: 3_000

# Ruling us-az:ptc-above-the-line-deductions: household income does not
# subtract federal above-the-line deductions other than the business and
# capital loss deduction. A.A.C. R15-2C-502(A)(1) counts "the sum of all
# income not specifically excluded in A.R.S. § 43-1072", and Form 140PTC
# Part 1 lines A to I subtract no adjustment. 2025 Table 1 (ARS
# 43-1072(B)(1)): 2,951 - 3,050 -> 212; property taxes 0.15 x 6,000 = 900.

- name: A student loan interest deduction does not reduce household income
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 3_000
        student_loan_interest: 1_000
        rent: 6_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    student_loan_interest_ald: 1_000
    # Federal AGI: 3,000 - 1,000.
    adjusted_gross_income: 2_000
    # 2,000 + 1,000 added back. Without the add-back, 2,000 -> Table 1
    # 1,951 - 2,050 -> 435.
    az_property_tax_credit_agi: 3_000
    az_property_tax_credit_household_income: 3_000
    az_property_tax_credit: 212

- name: Half of self-employment tax does not reduce household income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        self_employment_income: 3_000
        rent: 6_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    # 3,000 x 0.9235 = 2,770.50; x 0.153 = 423.89; half = 211.94.
    self_employment_tax_ald: 211.94
    adjusted_gross_income: 2_788.06
    az_property_tax_credit_agi: 3_000
    az_property_tax_credit_household_income: 3_000
    az_property_tax_credit: 212

- name: A Schedule C loss still reduces household income
  period: 2025
  input:
    people:
      head:
        age: 70
        employment_income: 4_000
        self_employment_income: -1_000
        rent: 6_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    # loss_ald carries the business loss, which ITR 12-1 items (3) to (5)
    # count; it is not added back.
    loss_ald: 1_000
    adjusted_gross_income: 3_000
    az_property_tax_credit_agi: 3_000
    az_property_tax_credit_household_income: 3_000
    az_property_tax_credit: 212
