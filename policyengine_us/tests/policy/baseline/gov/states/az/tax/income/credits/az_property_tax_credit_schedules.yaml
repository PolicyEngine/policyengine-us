# Household path: household income computed from its components and the
# schedule chosen from the household, not given as inputs.

- name: Married couple with $2,500 of income gets the Schedule 2 $0-2,500 amount
  period: 2025
  input:
    people:
      head: {age: 70, taxable_interest_income: 2_500, real_estate_taxes: 1_000}
      spouse: {age: 70}
    tax_units: {tax_unit: {members: [head, spouse]}}
    households: {household: {members: [head, spouse], state_code: AZ}}
  output:
    az_property_tax_credit_income: 2_500
    az_property_tax_credit: 502

- name: Married couple with $2,501 of income gets the Schedule 2 $2,501-2,650 amount
  period: 2025
  input:
    people:
      head: {age: 70, taxable_interest_income: 2_501, real_estate_taxes: 1_000}
      spouse: {age: 70}
    tax_units: {tax_unit: {members: [head, spouse]}}
    households: {household: {members: [head, spouse], state_code: AZ}}
  output:
    az_property_tax_credit_income: 2_501
    az_property_tax_credit: 479

# ARS 43-1072(A)(3)(b): a single claimant living with an adult child uses
# Schedule 2, and $5,500 is less than $5,501.
- name: Single claimant living with an adult child at $5,500 gets the Schedule 2 $56
  period: 2025
  input:
    people:
      head: {age: 70, taxable_interest_income: 5_500, real_estate_taxes: 1_000}
      child: {age: 40, is_tax_unit_dependent: false}
    tax_units:
      claimant: {members: [head]}
      child_unit: {members: [child]}
    households: {household: {members: [head, child], state_code: AZ}}
  output:
    az_property_tax_credit_income: [5_500, 0]
    az_property_tax_credit: [56, 0]

- name: Single claimant living with an adult child at $5,501 gets no credit
  period: 2025
  input:
    people:
      head: {age: 70, taxable_interest_income: 5_501, real_estate_taxes: 1_000}
      child: {age: 40, is_tax_unit_dependent: false}
    tax_units:
      claimant: {members: [head]}
      child_unit: {members: [child]}
    households: {household: {members: [head, child], state_code: AZ}}
  output:
    az_property_tax_credit_income: [5_501, 0]
    az_property_tax_credit: [0, 0]

