# ARS 43-1072(B) Schedules 1 and 2 (Form 140PTC page 2, identical in
# 2021-2025): every band edge on both sides, the (A)(3) income limits
# ("less than" $3,751 living alone and $5,501 living with others), and
# cents between whole-dollar bands, which stay in the lower band (see the
# note in each schedule's parameter file). Property taxes paid ($1,000) exceed
# every table amount, so the credit equals the table amount.

# Schedule 1: ARS 43-1072(B)(1), living alone.

- name: Schedule 1 (living alone), income of $0 gets $502
  period: 2025
  input:
    state_code: AZ
    cohabitating_spouses: false
    az_property_tax_credit_eligible: true
