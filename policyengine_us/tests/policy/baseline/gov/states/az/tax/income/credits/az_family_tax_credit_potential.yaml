# A.R.S. 43-1073(B): $40 "for each person who is a resident of this state and
# who is either the taxpayer, the taxpayer's spouse who does not file a return
# or a dependent", capped at $120 single and $240 joint
# (family_tax_credits/amount). A filer who can be claimed as a dependent still
# counts as the taxpayer, but "dependent" has the IRC 152 meaning (A.R.S.
# 43-1001(3)), so a return on which either filer can be claimed counts no
# dependents (IRC 152(b)(1)).

- name: 2025 single filer who can be claimed as a dependent counts only the filer, not the child
  period: 2025
  input:
    people:
      filer:
        age: 19
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: AZ
  output:
    # $40 x 1.
    az_family_tax_credit_potential: 40

- name: 2025 single filer who cannot be claimed counts the filer and the child
  period: 2025
  input:
    people:
      filer:
        age: 19
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [filer, child]
        filing_status: SINGLE
    households:
      household:
        members: [filer, child]
        state_code: AZ
  output:
    # $40 x 2.
    az_family_tax_credit_potential: 80

- name: 2025 joint return with one claimable spouse counts both spouses but not the child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: AZ
  output:
    # $40 x 2.
    az_family_tax_credit_potential: 80

- name: 2025 joint return with one claimable spouse counts both spouses but not the child (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: AZ
  output:
    # $40 x 2.
    az_family_tax_credit_potential: 80

- name: 2025 joint return with both spouses claimable still counts both spouses
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 22
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: AZ
  output:
    # $40 x 2.
    az_family_tax_credit_potential: 80

- name: 2025 joint return with neither spouse claimable counts both spouses and the child
  period: 2025
  input:
    people:
      person_a:
        age: 20
      person_b:
        age: 22
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: AZ
  output:
    # $40 x 3.
    az_family_tax_credit_potential: 120

- name: 2025 joint return with one claimable spouse and a tax unit size input counts only the filers (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        tax_unit_size: 4
    households:
      household:
        members: [person_a, person_b]
        state_code: AZ
  output:
    # $40 x 2 filers. A tax unit size of 4 does not say who the
    # other two are; a return with a claimable filer counts no dependents.
    az_family_tax_credit_potential: 80

- name: 2025 joint return with one claimable spouse and a tax unit size input counts only the filers (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        tax_unit_size: 4
    households:
      household:
        members: [person_b, person_a]
        state_code: AZ
  output:
    # $40 x 2 filers. A tax unit size of 4 does not say who the
    # other two are; a return with a claimable filer counts no dependents.
    az_family_tax_credit_potential: 80
