- name: Case 1
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: false
      person2:
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        az_filing_status: JOINT
        members: [person1, person2]
    household:
      members: [person1, person2]
      state_code: AZ
  output:
    az_aged_exemption_eligible_person: [true, false]

- name: Case 2
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: true
      person2:
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        az_filing_status: JOINT
        members: [person1, person2]
    household:
      members: [person1, person2]
      state_code: AZ
  output:
    az_aged_exemption_eligible_person: [false, false]

- name: Case 3
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: false
      person2:
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        az_filing_status: SEPARATE
        members: [person1, person2]
    household:
      members: [person1, person2]
      state_code: AZ
  output:
    az_aged_exemption_eligible_person: [true, false]

- name: Case 4
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head: true
        claimed_as_dependent_on_another_return: false
      person2:
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: false
      person3:
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        az_filing_status: SEPARATE
        members: [person1, person2, person3]
    household:
      members: [person1, person2, person3]
      state_code: AZ
  output:
    az_aged_exemption_eligible_person: [true, false, false]

- name: Arizona aged exemption retains an unclaimed claimable filer
  period: 2025
  input:
    state_code: AZ
    age: 70
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: false
    claimable_as_dependent_on_another_return: true
  output:
    az_aged_exemption_eligible_person: true

- name: Arizona aged exemption excludes an actually claimed filer
  period: 2025
  input:
    state_code: AZ
    age: 70
    is_tax_unit_head: true
    claimed_as_dependent_on_another_return: true
    claimable_as_dependent_on_another_return: true
  output:
    az_aged_exemption_eligible_person: false
