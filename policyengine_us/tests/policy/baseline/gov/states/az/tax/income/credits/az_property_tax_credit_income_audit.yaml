# Target: policyengine_us/tests/policy/baseline/gov/states/az/tax/income/credits/az_property_tax_credit_income.yaml
# Batch D audit cases. Each fails on upstream/main 06c0dcbc54 (main's value is
# in the comment) and passes once tax-exempt retirement account distributions
# are counted.
# ARS 43-1072(H)(6)(g): income includes "The gross amount of any pension or
# annuity not otherwise exempted". A.A.C. R15-2C-502(A)(1) counts income
# "whether or not subject to Arizona income tax". 2025 Form 140PTC
# instructions, line E (page 4): "Pension income that you must enter here
# includes the following: ... any IRA distributions." ITR 12-1 item (9) leaves
# out only rollovers.

- name: Roth IRA distribution is a line E pension amount
  period: 2025
  input:
    people:
      head:
        age: 70
        tax_exempt_ira_distributions: 3_000
        rent: 5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    # Line E: IRA distributions 3,000. Line J: 3,000. Main: 0.
    az_property_tax_credit_income: 3_000
    az_property_tax_credit_household_income: 3_000
    # Line 11a: Schedule 1, 2,951 - 3,050 -> 212 (as in the existing
    # 3,000-income cases of this file). Line 13: 0.15 x 5,000 = 750.
    # Line 15: smaller of 212 and 750.
    az_property_tax_credit: 212

- name: Nontaxable 401(k) distribution counts with the taxable pension
  period: 2025
  input:
    people:
      head:
        age: 70
        taxable_private_pension_income: 2_000
        tax_exempt_401k_distributions: 1_000
        rent: 5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: AZ
  output:
    # Line E: gross pension and retirement plan payments 2,000 + 1,000 = 3,000.
    # Line J: 3,000. Main: 2,000.
    az_property_tax_credit_income: 3_000
    az_property_tax_credit_household_income: 3_000
