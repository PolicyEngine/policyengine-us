# Arizona Standard LIHEAP benefit: total points (income + energy burden +
# energy need) map to $160 for 1-4 points, $320 for 5-8, $480 for 9-12 and
# $640 for 13 or more (LIHEAP Eligibility Worksheet, $640 Limit, eff.
# 2024-10-12, section 4,
# https://liheapch.acf.gov/docs/2026/benefits-matricies/AZ_BenefitMatrix_Heating_2026.pdf#page=1;
# FY2026 plan 2.6 minimum $160 and maximum $640,
# https://liheapch.acf.gov/docs/2026/state-plans/AZ_Plan_2026.pdf#page=10;
# DES program page payment table, https://des.az.gov/liheap). The benefit is
# not capped at the bill: any remainder is credited to the Priority 1
# account (DES LIHEAP Policy rev. 16A, pp. 34-35 VII.B.3.b.iii,
# https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=34).
# A categorically eligible household with zero points receives the plan's
# $160 minimum. Annual limits: size 1 33,684; size 2 44,052; size 3 54,420.

- name: Case 1, single minimum-wage earner with a modest electric bill totals 2 points and receives 160.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 30_576
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Income 30,576 / 33,684 = 0.908 -> 1; burden 1,800 / 30,576 = 0.059 -> 1;
    # need 0; total 2 -> 160.
    az_liheap_points: 2
    az_liheap: 160

- name: Case 2, four points is the top of the 160 band.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 30_576
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 3_600
        gas_expense: 1_400
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Income 1; burden (3,600 + 1,400) / 30,576 = 0.164 -> 3; need 0;
    # total 4 -> 160.
    az_liheap_points: 4
    az_liheap: 160

- name: Case 3, five points is the bottom of the 320 band.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_veteran: true
        employment_income: 30_576
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 3_600
        gas_expense: 1_400
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Income 1; burden 3; veteran 1; total 5 -> 320.
    az_liheap_points: 5
    az_liheap: 320

- name: Case 4, eight points is the top of the 320 band.
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
      person2:
        age: 37
        employment_income: 9_000
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 4_000
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # Income 21,000 / 54,420 = 0.386 -> 4; burden 4,000 / 21,000 = 0.190 -> 3;
    # child aged 4 -> 1; total 8 -> 320.
    az_liheap_points: 8
    az_liheap: 320

- name: Case 5, nine points is the bottom of the 480 band.
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 12_000
      person2:
        age: 37
        employment_income: 9_000
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 4_000
        gas_expense: 600
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # Income 4; burden (4,000 + 600) / 21,000 = 0.219 -> 4; child 1;
    # total 9 -> 480.
    az_liheap_points: 9
    az_liheap: 480

- name: Case 6, twelve points is the top of the 480 band.
  period: 2026
  input:
    people:
      person1:
        age: 62
        employment_income: 10_000
        ssi: 0
      person2:
        age: 45
        is_disabled: true
        ssi: 0
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_400
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # Income 10,000 / 54,420 = 0.184 -> 5; burden 2,400 / 10,000 = 0.24 -> 4;
    # elderly 1 + disabled 1 + child 1 = 3; total 12 -> 480.
    az_liheap_points: 12
    az_liheap: 480

- name: Case 7, thirteen points is the bottom of the 640 band.
  period: 2026
  input:
    people:
      person1:
        age: 62
        employment_income: 10_000
        ssi: 0
      person2:
        age: 45
        is_disabled: true
        ssi: 0
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_700
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # Income 5; burden 2,700 / 10,000 = 0.27 -> 5; need 3; total 13 -> 640.
    az_liheap_points: 13
    az_liheap: 640

- name: Case 8, the maximum of seventeen points receives 640.
  period: 2026
  input:
    people:
      person1:
        age: 66
        is_disabled: true
        veterans_benefits: 8_400
        ssi: 0
      person2:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: PROPANE
        pre_subsidy_electricity_expense: 1_200
        bottled_gas_expense: 1_800
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: AZ
  output:
    # Income 8,400 / 44,052 = 0.191 -> 5; burden (1,200 + 1,800) / 8,400 =
    # 0.357 -> 6 + 2 portable; elderly + disabled + veteran + child = 4;
    # total 17 -> 640.
    az_liheap_points: 17
    az_liheap: 640

- name: Case 9, a SNAP household above the limit with zero points receives the 160 minimum.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        snap: 1_200
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Income 40,000 / 33,684 = 1.19 -> 0; burden 1,800 / 40,000 = 0.045 -> 0;
    # need 0; total 0. Plan 2.6: minimum benefit 160.
    az_liheap_eligible: true
    az_liheap_points: 0
    az_liheap: 160

- name: Case 10, the benefit is not capped at a small bill.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 300
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Income 0 -> 5; burden 300 against zero income -> 6; need 0; total 11
    # -> 480, more than the 300 bill (policy pp. 34-35: remainder credited).
    az_liheap_points: 11
    az_liheap: 480

- name: Case 11, an unspecified heating type pays nothing.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 30_576
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: UNSPECIFIED
        pre_subsidy_electricity_expense: 1_800
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    az_liheap_eligible: false
    az_liheap: 0

- name: Case 12, income over the limit without categorical eligibility pays nothing.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 40,000 > 33,684 and no SNAP or Cash Assistance.
    az_liheap_eligible: false
    az_liheap: 0

- name: Case 13, the same household in New Mexico pays nothing.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 30_576
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: NM
  output:
    az_liheap: 0

- name: Case 14, a railroad retiree's annuity puts a single person over the limit and pays nothing.
  period: 2026
  input:
    people:
      person1:
        age: 70
        railroad_benefits: 40_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Railroad Retirement is "retirement income" (policy p. 9 VI.A.6.e.ii.B):
    # countable income 40,000.
    az_liheap_countable_income: 40_000
    # Appendix A size 1: 2,807 x 12 = 33,684.
    az_liheap_income_limit: 33_684
    # 40,000 > 33,684.
    az_liheap_income_eligible: false
    # No SNAP or Cash Assistance.
    az_liheap_categorically_eligible: false
    az_liheap_eligible: false
    az_liheap: 0
