    az_liheap_income_eligible: true

- name: Case 11, mixed-status household is measured against the eligible-member size with all adult income.
  period: 2026
  input:
    people:
      person1:
        age: 34
        immigration_status: CITIZEN
        employment_income: 24_000
      person2:
        age: 36
        immigration_status: UNDOCUMENTED
        employment_income: 24_000
      person3:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_400
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # Policy p. 8 VI.A.6.d: size 2 (citizen parent and child), limit
    # 3,671 x 12 = 44,052; income 24,000 + 24,000 = 48,000 from both adults.
    az_liheap_household_size: 2
    az_liheap_countable_income: 48_000
    az_liheap_income_limit: 44_052
    # 48,000 > 44,052 (it would pass the size-3 limit of 54,420).
    az_liheap_income_eligible: false
