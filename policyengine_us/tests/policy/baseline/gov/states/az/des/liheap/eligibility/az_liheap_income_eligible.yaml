# Arizona LIHEAP income eligibility: when categorical eligibility does not
# apply, gross income must be "at or below" the Appendix A limit for the
# eligible household size (DES LIHEAP Policy rev. 13 eff. 2025-08-25, p. 8
# VI.A.6.c.i and p. 37 Appendix A,
# https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=37).
# Annual limits are twelve times the monthly limits: size 1 2,807 x 12 =
# 33,684; size 2 3,671 x 12 = 44,052; size 5 6,262 x 12 = 75,144; size 6
# 7,126 x 12 = 85,512; size 10 8,143 x 12 = 97,716; size 13 (9,518 + 687) x
# 12 = 122,460. The 30-day income snapshot is annualized by the policy's own
# arithmetic (p. 14 VII.A.1.c.v), so annual income compares with 12 x the
# monthly limit.

- name: Case 1, single adult earning exactly the size-1 limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 33_684
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    az_liheap_countable_income: 33_684
    az_liheap_income_limit: 33_684
    # 33,684 <= 33,684.
    az_liheap_income_eligible: true

- name: Case 2, single adult one dollar over the size-1 limit is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 33_685
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 33,685 > 33,684.
    az_liheap_income_eligible: false

- name: Case 3, five-person family at exactly the size-5 limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 38
        employment_income: 44_000
      person2:
        age: 36
        employment_income: 31_144
      person3:
        age: 12
      person4:
        age: 8
      person5:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 2_400
        gas_expense: 700
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: AZ
  output:
    # 44,000 + 31,144 = 75,144 <= 6,262 x 12 = 75,144.
    az_liheap_countable_income: 75_144
    az_liheap_income_eligible: true

- name: Case 4, five-person family one dollar over the size-5 limit is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 38
        employment_income: 44_000
      person2:
        age: 36
        employment_income: 31_145
      person3:
        age: 12
      person4:
        age: 8
      person5:
        age: 3
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 2_400
        gas_expense: 700
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: AZ
  output:
    # 44,000 + 31,145 = 75,145 > 75,144.
    az_liheap_income_eligible: false

