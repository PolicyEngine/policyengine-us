# Arizona LIHEAP income points: monthly gross income divided by the monthly
# income limit for the eligible household size; 0%-20% 5 points, 21%-40% 4,
# 41%-60% 3, 61%-80% 2, 81%-100% 1, above 100% none (LIHEAP Eligibility
# Worksheet, $640 Limit, eff. 2024-10-12, section 1,
# https://liheapch.acf.gov/docs/2026/benefits-matricies/AZ_BenefitMatrix_Heating_2026.pdf#page=1;
# DES program page formula and example "2,000 / 4,535 = 44%, three points",
# https://des.az.gov/liheap). Annual income over the annual limit gives the
# same ratio as the monthly figures. The ratio is continuous and a band top
# belongs to its band (exactly 20% is 5 points). Household of three (two
# adults and a child aged 4): limit 4,535 x 12 = 54,420.

- name: Case 1, the program-page example of 2,000 a month against the 4,535 limit gives 3 points.
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 14_000
      person2:
        age: 37
        employment_income: 10_000
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_400
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # 24,000 / 54,420 = 0.441 (2,000 / 4,535 = 44%): 41%-60% band.
    az_liheap_income_points: 3

- name: Case 2, a household with no income has 5 points.
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 0
      person2:
        age: 37
        employment_income: 0
      person3:
        age: 4
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_400
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: AZ
  output:
    # 0 / 54,420 = 0: 0%-20% band.
    az_liheap_income_points: 5

