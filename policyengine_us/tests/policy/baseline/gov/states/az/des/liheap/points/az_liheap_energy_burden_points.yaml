        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # (1,200 + 1,500) / 24,000 = 0.1125: 11%-15% band 2 points + 2 portable.
    az_liheap_energy_cost: 2_700
    az_liheap_energy_burden_points: 4

