# Arizona LIHEAP energy burden points: total monthly energy cost (electric,
# gas and portable fuel) divided by monthly gross income; 5% or less 0 points,
# 6%-10% 1, 11%-15% 2, 16%-20% 3, 21%-25% 4, 26%-30% 5, 31% or over 6, plus 2
# points for portable fuels (LIHEAP Eligibility Worksheet, $640 Limit, eff.
# 2024-10-12, section 2,
# https://liheapch.acf.gov/docs/2026/benefits-matricies/AZ_BenefitMatrix_Heating_2026.pdf#page=1;
# DES program page example "350 / 2,000 = 17.5%, three points",
# https://des.az.gov/liheap). Portable Fuel is propane, wood, coal, generator
# fuel and pellets (DES LIHEAP Policy rev. 13, p. 5,
# https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=5),
# modeled as heating_type PROPANE, WOOD or COAL. Annual bills over annual
# income give the same ratio as the monthly figures; a band top belongs to its
# band (exactly 5% is 0 points). Zero income with a bill is the top band; no
# bill is 0 points. Single adult earning 24,000 (2,000 a month) throughout.

- name: Case 1, the program-page example of a 350 bill on 2,000 income gives 3 points.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 24_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 4_200
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 4,200 / 24,000 = 0.175 (350 / 2,000 = 17.5%): 16%-20% band.
    az_liheap_energy_burden_points: 3

- name: Case 2, a bill at exactly 5 percent of income scores 0 points.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 24_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_200
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 1,200 / 24,000 = 0.05 exactly: "5% or less".
    az_liheap_energy_burden_points: 0

