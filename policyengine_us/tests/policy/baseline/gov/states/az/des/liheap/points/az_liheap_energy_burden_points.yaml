        pre_subsidy_electricity_expense: 0
        gas_expense: 0
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 0 / 12,000 = 0: "5% or less".
    az_liheap_energy_burden_points: 0

- name: Case 12, propane heat adds 2 portable-fuel points.
  period: 2026
  input:
