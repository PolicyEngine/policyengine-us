        pre_subsidy_electricity_expense: 1_200
        gas_expense: 600
        bottled_gas_expense: 300
        wood_expense: 200
        coal_expense: 100
        fuel_oil_expense: 150
        other_heating_fuel_expense: 450
        snap: 0
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 1,200 + 600 + 300 + 200 + 100 + 150 + 450 = 3,000.
    az_liheap_energy_cost: 3_000
    # 3,000 / 24,000 = 0.125: 11%-15% band; electric heat, no bonus.
    az_liheap_energy_burden_points: 2
