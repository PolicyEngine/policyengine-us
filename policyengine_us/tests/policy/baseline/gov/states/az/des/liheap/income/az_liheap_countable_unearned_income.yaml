# Arizona LIHEAP countable unearned income per person. Gross unearned income
# of every member aged 18 or older counts: SSA, SSI, retirement (including
# Railroad Retirement), unemployment insurance, alimony, child support, rental
# income, interest, dividends, general assistance, VA benefits, employment
# disability insurance and workers' compensation (DES LIHEAP Policy rev. 13
# eff. 2025-08-25, pp. 8-9 VI.A.6.e,
# https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=8;
# FY2026 plan 1.9,
# https://liheapch.acf.gov/docs/2026/state-plans/AZ_Plan_2026.pdf#page=6).
# Members under 18: rev. 13 p. 9 E counts none of their income; rev. 15
# (eff. 2026-03-23) p. 9 E excludes only their earned income, so a child's
# unearned income counts from period 2027 (parameters are read at the start
# of the period). Social Security is counted gross; the Medicare premium
# netting (policy p. 14 note) is deferred, as in Kansas.
# 2026 SSI federal benefit rate 994 a month: 994 x 12 = 11,928.

- name: Case 1, Social Security and pension income of a retiree are counted gross.
  period: 2026
  input:
    people:
      person1:
        age: 70
        social_security: 23_712
        pension_income: 6_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_800
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 23,712 + 6,000 = 29,712 (plan 1.9: SSA and retirement/pension checked).
    az_liheap_countable_unearned_income: 29_712

- name: Case 2, unemployment, child support, alimony and rent are counted.
  period: 2026
  input:
    people:
      person1:
        age: 45
        unemployment_compensation: 9_600
        child_support_received: 4_800
        alimony_income: 3_000
        rental_income: 6_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 1_500
        gas_expense: 600
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 9,600 + 4,800 + 3,000 + 6,000 = 23,400.
    az_liheap_countable_unearned_income: 23_400

- name: Case 3, SSI, general assistance and VA benefits of a disabled adult are counted.
  period: 2026
  input:
    people:
      person1:
        age: 50
        is_disabled: true
        ssi: 11_928
        general_assistance: 1_200
        veterans_benefits: 4_800
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_600
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 11,928 + 1,200 + 4,800 = 17,928 (plan 1.9: SSI, general assistance and
    # VA benefits checked).
    az_liheap_countable_unearned_income: 17_928

- name: Case 4, interest, dividends, strike pay and an IRA distribution each count once.
  period: 2026
  input:
    people:
      person1:
        age: 40
        taxable_interest_income: 1_200
        ordinary_dividend_income: 800
        strike_benefits: 2_000
        taxable_ira_distributions: 3_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_700
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # 1,200 + 800 + 2,000 + 3,000 = 7,000. The IRA distribution reaches the
    # total once, through retirement_distributions (contract R1).
    az_liheap_countable_unearned_income: 7_000

- name: Case 5, a child's SSI and child support are not counted in 2026 under revision 13.
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 30_000
      person2:
        age: 10
        is_disabled: true
        ssi: 11_928
        child_support_received: 4_800
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_200
    households:
      household:
        members: [person1, person2]
        state_code: AZ
  output:
    # Rev. 13 p. 9 E: "Income from Household members under the age of 18 is
    # not considered Countable Income."
    az_liheap_countable_unearned_income: [0, 0]
    az_liheap_countable_income: 30_000

- name: Case 6, the same child's SSI and child support are counted in 2027 under revision 15.
  period: 2027
  input:
    people:
      person1:
        age: 35
        employment_income: 30_000
      person2:
        age: 10
        is_disabled: true
        ssi: 11_928
        child_support_received: 4_800
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 2_200
    households:
      household:
        members: [person1, person2]
        state_code: AZ
  output:
    # Rev. 15 p. 9 E excludes only earned income of members under 18:
    # 11,928 + 4,800 = 16,728 counts.
    az_liheap_countable_unearned_income: [0, 16_728]
    # 30,000 + 16,728 = 46,728.
    az_liheap_countable_income: 46_728

- name: Case 7, a Railroad Retirement annuity is counted as retirement income.
  period: 2026
  input:
    people:
      person1:
        age: 68
        railroad_benefits: 30_000
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_500
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Policy p. 8 VI.A.6.e.ii.B "retirement income", p. 14 "retirement
    # benefits"; plan 1.9 "Retirement / pension benefits" checked: 30,000.
    az_liheap_countable_unearned_income: 30_000
    az_liheap_countable_income: 30_000

- name: Case 8, long-term disability insurance paid to the insured worker is counted.
  period: 2026
  input:
    people:
      person1:
        age: 52
        disability_benefits: 27_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        pre_subsidy_electricity_expense: 1_400
        gas_expense: 500
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Plan 1.9 "Insurance payments made directly to the insured" checked;
    # policy p. 4 Gross Income is all income before taxes and deductions.
    # 60% of a 45,000 salary = 27,000 counts.
    az_liheap_countable_unearned_income: 27_000
    az_liheap_countable_income: 27_000

- name: Case 9, workers' compensation of an injured worker is counted.
  period: 2026
  input:
    people:
      person1:
        age: 38
        workers_compensation: 24_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_700
        az_tanf: 0
    households:
      household:
        members: [person1]
        state_code: AZ
  output:
    # Policy p. 4 Gross Income and p. 8 VI.A.6.e.ii.D "Consistent income
    # received from other sources"; two-thirds of 36,000 prior wages = 24,000
    # counts.
    az_liheap_countable_unearned_income: 24_000
    az_liheap_countable_income: 24_000
