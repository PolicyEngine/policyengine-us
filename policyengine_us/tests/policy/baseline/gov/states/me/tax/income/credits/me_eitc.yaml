# 2021: 36 M.R.S. 5219-S(1) pays 20% of the federal credit, and the federal
# childless minimum age was 19, or 24 for a student, with no maximum
# (26 U.S.C. 32(n)(1)-(2)). 32(n)(3)-(4) set the phase-in rate at 15.3%, so
# $5,000 of wages gives a federal or as-if-eligible credit of $765 and a
# Maine credit of $153 at every age from 18 to 24, student or not. Filers
# who fail the federal age test take the 5219-S(5) pro forma; the rest take
# the federal credit. No filer gets both.
- name: 2021 childless non-student aged 18 gets the Maine credit through the Maine pro forma
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 18
        employment_income: 5_000
        is_full_time_student: false
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: true
    eitc: 0
    me_pro_forma_childless_eitc: 765
    me_eitc: 153

