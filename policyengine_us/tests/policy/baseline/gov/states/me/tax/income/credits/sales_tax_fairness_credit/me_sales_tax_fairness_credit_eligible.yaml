- name: DSI ineligible
  period: 2022
  input:
    state_code: ME
    claimed_as_dependent_on_another_return: true
    filing_status: JOINT
  output:
    me_sales_tax_fairness_credit_eligible: false

- name: Eligible
  period: 2022
  input:
    state_code: ME
    claimed_as_dependent_on_another_return: false
    filing_status: SINGLE
  output:
    me_sales_tax_fairness_credit_eligible: true

- name: Filing status ineligible
  period: 2022
  input:
    state_code: ME
    claimed_as_dependent_on_another_return: true
    filing_status: SEPARATE
  output:
    me_sales_tax_fairness_credit_eligible: false

- name: Joint return where only one spouse can be claimed as a dependent (the claimable spouse is the head)
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    # 36 MRSA 5213-A(6)(C) excludes the claimable individual; the other spouse
    # still qualifies for the joint credit.
    me_sales_tax_fairness_credit_eligible: true

- name: Joint return where only one spouse can be claimed as a dependent (the claimable spouse is the spouse)
  period: 2022
  input:
    people:
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: ME
  output:
    # 36 MRSA 5213-A(6)(C) excludes the claimable individual; the other spouse
    # still qualifies for the joint credit.
    me_sales_tax_fairness_credit_eligible: true

- name: Joint return where both spouses can be claimed as dependents
  period: 2022
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    me_sales_tax_fairness_credit_eligible: false
