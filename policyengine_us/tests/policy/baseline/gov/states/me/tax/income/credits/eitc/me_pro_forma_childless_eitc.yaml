# 36 M.R.S. § 5219-S(5): the credit for the 18-24 childless cohort is computed
# as if the individual were eligible for a federal earned income credit. The
# pro forma equals the federal phase-in/reduction with the age gate removed.
- name: 2025 childless couple aged 23 and 24 with $10,476 earnings gets full childless max
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 23
        employment_income: 10_476
      spouse:
        age: 24
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Earnings above the childless phase-in end and AGI below the MFJ phase-out
    # start yield the 2025 childless maximum of $649.
    me_pro_forma_childless_eitc: 649

- name: Pro forma is zero for tax units outside the expansion cohort
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 10_476
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ME
  output:
    me_pro_forma_childless_eitc: 0


- name: 2025 single filer who can be claimed as a dependent has no pro forma childless credit
  period: 2025
  input:
    people:
      filer:
        age: 20
        employment_income: 1000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: ME
  output:
    # 36 MRSA 5219-S(6) keeps IRC 32(c)(1)(A)(ii)(III).
    me_pro_forma_childless_eitc: 0

- name: 2025 joint return with one claimable spouse has no pro forma childless credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    me_pro_forma_childless_eitc: 0

- name: 2025 joint return with one claimable spouse has no pro forma childless credit (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        employment_income: 500
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        employment_income: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: ME
  output:
    me_pro_forma_childless_eitc: 0

- name: 2025 joint return with neither spouse claimable has the pro forma childless credit
  period: 2025
  input:
    people:
      person_a:
        age: 20
        employment_income: 500
      person_b:
        age: 22
        employment_income: 500
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    # 7.65% x $1,000.
    me_pro_forma_childless_eitc: 76.5
