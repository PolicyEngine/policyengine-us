# Target: policyengine_us/tests/policy/baseline/gov/states/me/tax/income/credits/fairness/me_sales_and_property_tax_fairness_credit_income.yaml
# (No such file on upstream/main 06c0dcbc54; open PR #10722 creates it.)
# Batch E audit cases. Each fails on main (main's value is in the comment).
# 36 M.R.S. 5219-KK(1)(D) and 5213-A(1)(B): income is federal adjusted gross
# income increased by listed losses, interest and "Payments received under the
# federal Social Security Act ... to the extent not included in federal
# adjusted gross income". Not run (the audit was read-only).

- name: SSI is a payment received under the federal Social Security Act. # 2025 Schedule PTFC/STFC instructions, lines 1a and 2b: "supplemental security income".
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 70
    state_code: ME
    social_security_retirement: 10_000
    ssi: 3_000
  output:
    # None of the 10,000 of Social Security is taxable (provisional income
    # 5,000). 10,000 + 3,000 SSI. Main: 10,000.
    me_sales_and_property_tax_fairness_credit_income: 13_000

- name: A rental loss absorbed by partnership income on the same federal line is not added back. # 5219-KK(1)(D)(1): "any net loss resulting from combining" them; Schedule PTFC/STFC line 2d.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 45
    state_code: ME
    employment_income: 20_000
    partnership_s_corp_income: 10_000
    rental_income: -5_000
  output:
    # Schedule 1 line 5: 10,000 - 5,000 = 5,000, not a net loss, so there is
    # no loss add-back. 20,000 wages + 5,000. Main: 30,000.
    me_sales_and_property_tax_fairness_credit_income: 25_000
