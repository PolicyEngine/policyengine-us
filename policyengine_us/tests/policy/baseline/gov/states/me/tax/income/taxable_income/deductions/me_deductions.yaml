- name: Maine deduction is $0 outside of Maine.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: NY
    me_deduction_phaseout_percentage: 0.40
    me_standard_deduction: 20_000
    me_itemized_deductions_pre_phaseout: 25_000
  output:
    me_deductions: 0

- name: Maine deduction is standard deduction minus phaseout.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: ME
    me_deduction_phaseout_percentage: 0.90
    me_standard_deduction: 25_000
    me_itemized_deductions_pre_phaseout: 20_000
  output:
    me_deductions: 2_500

- name: Maine deduction is itemized deductions minus phaseout.
  period: 2022
  absolute_error_margin: 0
  input:
    gov.simulation.branch_to_determine_itemization: true
    state_code: ME
    me_deduction_phaseout_percentage: 0.40
    me_standard_deduction: 10_000
    me_itemized_deductions_pre_phaseout: 15_000
    # Tied-federal-tax fallback uses the federal standard vs. itemized
    # comparison; provide consistent federal-level inputs to itemize.
    standard_deduction: 10_000
    itemized_taxable_income_deductions: 15_000
  output:
    tax_liability_if_itemizing: 0
    tax_liability_if_not_itemizing: 0
    me_deductions: 9_000

- name: ME single 2025 100K self-employment (TaxAct verified, taxsim issue 790)
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 54
        self_employment_income: 100_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        premium_tax_credit: 0
        local_income_tax: 0
        state_sales_tax: 0
    spm_units:
      spm_unit:
        members: [person1]
        snap: 0
        tanf: 0
    households:
      household:
        members: [person1]
        state_fips: 23
  output:
    me_deductions: 15_000
    me_taxable_income: 72_785
    me_income_tax: 4_695

- name: A federal itemizer can elect Maine itemized expenses below the state standard
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    tax_unit_itemizes: true
    state_deduction_method: ITEMIZED
    me_standard_deduction: 15_000
    me_itemized_deductions_pre_phaseout: 10_000
    me_deduction_phaseout_percentage: 0.25
    me_agi: 17_500
    me_exemptions: 0
  output:
    # Deduct 75% of the selected 10,000. Maine's first rate is 5.8%.
    me_deductions: 7_500
    me_taxable_income: 10_000
    me_income_tax_before_credits: 580
