# Isolated component premises: each position is a separate single-filer case
# with a known $2,000 benefit-base limit, $10,000 of statutory income and
# independently known qualifying rent/property tax. This does not validate
# eligibility, the income calculation or conversion of gross rent into taxes.
# The excess over 6% of income is halved before applying the age-based cap.
# 36 MRS section 5219-KK(2); P.L. 2017, c. 474, Part B, section 15.
# https://legislature.maine.gov/legis/bills/bills_128th/chapters/PUBLIC474.asp
- name: Case 18, 2017 half-excess before the age cap.
  period: 2017
  absolute_error_margin: 0.01
  input:
    state_code: [ME, ME, ME]
    filing_status: [SINGLE, SINGLE, SINGLE]
    me_fairness_credit_qualifying_children: [0, 0, 0]
    me_property_tax_fairness_credit_benefit_base: [2_000, 2_000, 2_000]
    me_sales_and_property_tax_fairness_credit_income: [10_000, 10_000, 10_000]
    me_property_tax_fairness_credit_countable_rent_property_tax: [500, 1_000, 2_000]
    age_head: [64, 64, 64]
    age_spouse: [0, 0, 0]
  output:
    me_property_tax_fairness_credit_base_cap: [0, 200, 600]

