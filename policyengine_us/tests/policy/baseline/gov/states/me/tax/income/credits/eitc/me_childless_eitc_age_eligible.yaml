- name: 2025 filer aged 20 with a dependent aged 30 is in the cohort
  # The dependent is not an EITC qualifying child, and the dependent's age
  # does not make the filer meet the federal age test.
  period: 2025
  input:
    people:
      head:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_dependent: false
      dependent:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: true

- name: 2025 filer aged 66 with a dependent aged 20 is outside the cohort
  # The dependent's age does not place the filer in Maine's 18-24 range.
  period: 2025
  input:
    people:
      head:
        age: 66
        is_tax_unit_head: true
        is_tax_unit_dependent: false
      dependent:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: false
