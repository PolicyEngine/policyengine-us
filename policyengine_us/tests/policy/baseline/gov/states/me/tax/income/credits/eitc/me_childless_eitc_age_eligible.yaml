  output:
    me_childless_eitc_age_eligible: false

- name: Filer aged 20 with a qualifying child is not in the childless expansion
  period: 2025
  input:
    people:
      head:
        age: 20
        employment_income: 8_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: false

# The added cohort is a filer or spouse aged 18 to 24 when neither meets the
# federal age test, IRC 32(c)(1)(A)(ii)(II). Dependents' ages count for
# neither test.
- name: 2021 joint return with a student aged 22 and a non-student aged 22 is outside the cohort
  # The non-student meets the 2021 federal minimum of 19.
  period: 2021
  input:
    people:
      head:
        age: 22
        is_full_time_student: true
      spouse:
        age: 22
        is_full_time_student: false
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: false

- name: 2021 joint return with students aged 22 and 20 is in the cohort
  period: 2021
  input:
    people:
      head:
        age: 22
        is_full_time_student: true
      spouse:
        age: 20
        is_full_time_student: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: true

- name: 2021 joint return with a student aged 22 and a spouse aged 70 is outside the cohort
  # 26 U.S.C. 32(n)(2) removed the federal maximum age for 2021, so the
  # 70-year-old meets the federal age test.
  period: 2021
  input:
    people:
      head:
        age: 70
      spouse:
        age: 22
        is_full_time_student: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    me_childless_eitc_age_eligible: false

