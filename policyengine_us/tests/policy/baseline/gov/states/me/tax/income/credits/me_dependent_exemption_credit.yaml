- name: Case 18, 2018 Maine dependent credit onset and nonrefundable liability limit.
  period: 2018
  absolute_error_margin: 0.01
  # P.L. 2017, c. 474, Part B, section 17 creates a $300 credit per qualifying
  # child/dependent for whom the federal section 24 credit was claimed. Section
  # 26 first applies the credit in 2018; section 5219-SS(4) forbids reducing tax
  # below zero. Maine AGI $50,000 is below the $200,000 HOH phaseout threshold.
  # Each of the first three children has independently known federal maximum
  # $2,000 and satisfies the qualifying/claim conditions, including a lawful
  # federal section 24 claim. The fourth has known maximum zero and no such
  # qualifying claim. These facts do not derive any federal award or eligibility.
  # Known pre-credit Maine liabilities isolate the unchanged nonrefundable cap;
  # other nonrefundable child-care credit is known zero. No tested raw credit,
  # aggregate credit or resulting tax is supplied as an input.
  # Raw [300,300,300,0]; applied min(raw, liability) [300,100,0,0];
  # remaining tax [700,0,0,1000]. This is not a full Maine-return calculation.
  input:
    people:
      person1:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ctc_individual_maximum: 0
      person2:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ctc_individual_maximum: 2_000
      person3:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ctc_individual_maximum: 0
      person4:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ctc_individual_maximum: 2_000
      person5:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ctc_individual_maximum: 0
      person6:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ctc_individual_maximum: 2_000
      person7:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        ctc_individual_maximum: 0
      person8:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ctc_individual_maximum: 0
    tax_units:
      tax_unit1:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        me_agi: 50_000
        me_income_tax_before_credits: 1_000
        me_non_refundable_child_care_credit: 0
      tax_unit2:
        members: [person3, person4]
        filing_status: HEAD_OF_HOUSEHOLD
        me_agi: 50_000
        me_income_tax_before_credits: 100
        me_non_refundable_child_care_credit: 0
      tax_unit3:
        members: [person5, person6]
        filing_status: HEAD_OF_HOUSEHOLD
        me_agi: 50_000
        me_income_tax_before_credits: 0
        me_non_refundable_child_care_credit: 0
      tax_unit4:
        members: [person7, person8]
        filing_status: HEAD_OF_HOUSEHOLD
        me_agi: 50_000
        me_income_tax_before_credits: 1_000
        me_non_refundable_child_care_credit: 0
    households:
      household1:
        members: [person1, person2]
        state_code: ME
      household2:
        members: [person3, person4]
        state_code: ME
      household3:
        members: [person5, person6]
        state_code: ME
      household4:
        members: [person7, person8]
        state_code: ME
  output:
    me_dependent_exemption_credit: [300, 300, 300, 0]
    me_non_refundable_credits: [300, 100, 0, 0]
    me_income_tax_before_refundable_credits: [700, 0, 0, 1_000]
