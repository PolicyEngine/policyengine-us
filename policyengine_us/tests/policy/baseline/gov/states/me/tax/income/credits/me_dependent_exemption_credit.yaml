- name: Case 15, 2017 Maine dependent exemption credit before enactment.
  period: 2017
  absolute_error_margin: 0.01
  # P.L. 2017, c. 474, Part B, sections 17 and 26 create the credit for 2018+.
  # https://www.mainelegislature.org/legis/bills/bills_128th/chapters/PUBLIC474.asp
  # Known person-level federal maximum and Maine AGI isolate the credit onset.
  # This case does not derive federal eligibility or the 2017 exemption deduction.
  input:
    people:
      person1:
        age: 35
        is_tax_unit_dependent: false
        ctc_individual_maximum: 0
      person2:
        age: 8
        is_tax_unit_dependent: true
        ctc_individual_maximum: 1_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        me_agi: 50_000
    households:
      household:
        members: [person1, person2]
        state_code: ME
  output:
    me_dependent_exemption_credit: 0

