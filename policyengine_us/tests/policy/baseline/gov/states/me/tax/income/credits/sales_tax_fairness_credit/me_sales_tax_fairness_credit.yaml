# 2026 amounts follow 36 MRS 5403(5) with the cost-of-living adjustments in
# Maine Revenue Services' 2026 Individual Income Tax Rates: 1.279 on the June
# 2017 base for the base credit and 1.303 on the June 2015 base for the income
# threshold. Base credits: single 125 x 1.279 = 159.88 -> 155; joint, head of
# household and surviving spouse 175 x 1.279 = 223.83 -> 220; with the
# smaller additional amount 200 x 1.279 = 255.80 -> 255; with the larger
# 225 x 1.279 = 287.78 -> 285. Thresholds: single 20,000 x 1.303 = 26,060 ->
# 26,050; head of household 30,000 x 1.303 = 39,090 -> 39,050; joint 40,000 x
# 1.303 = 52,120 -> 52,100. The phase-out steps ($10 per $500, $15 per $750,
# $20 per $1,000 or portion) are not indexed.
# https://www.maine.gov/revenue/sites/maine.gov.revenue/files/2026-05/ind_tax_rate_sched_2026_rev.pdf#page=1
- name: 2026 ME STFC MFJ no dependents with $30,000 of income gets the full 220
  period: 2026
  input:
    me_sales_tax_fairness_credit_eligible: true
    me_fairness_credit_qualifying_children: 0
    filing_status: JOINT
    me_sales_and_property_tax_fairness_credit_income: 30_000
  output:
    # 30,000 is below the 52,100 threshold.
    me_sales_tax_fairness_credit: 220

- name: 2026 ME STFC MFJ no dependents with $60,000 of income gets 60
  period: 2026
  input:
    me_sales_tax_fairness_credit_eligible: true
    me_fairness_credit_qualifying_children: 0
    filing_status: JOINT
    me_sales_and_property_tax_fairness_credit_income: 60_000
  output:
    # 60,000 - 52,100 = 7,900, which is 8 portions of $1,000; 220 - 8 x 20 = 60.
    me_sales_tax_fairness_credit: 60

- name: 2026 ME STFC MFJ no dependents in the last phase-out band keeps 20
  period: 2026
  input:
    me_sales_tax_fairness_credit_eligible: true
    me_fairness_credit_qualifying_children: 0
    filing_status: JOINT
    me_sales_and_property_tax_fairness_credit_income: 62_100
  output:
    # 62,100 - 52,100 = 10,000, which is 10 portions; 220 - 10 x 20 = 20.
    me_sales_tax_fairness_credit: 20

- name: 2026 ME STFC MFJ no dependents one dollar past the full phase-out gets 0
  period: 2026
  input:
    me_sales_tax_fairness_credit_eligible: true
    me_fairness_credit_qualifying_children: 0
    filing_status: JOINT
    me_sales_and_property_tax_fairness_credit_income: 62_101
  output:
    # 62,101 - 52,100 = 10,001, which is 11 portions; 220 - 11 x 20 < 0.
    me_sales_tax_fairness_credit: 0

