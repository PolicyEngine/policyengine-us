- name: 2025 joint return with one claimable spouse uses the base without qualifying children (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: ME
  output:
    # The base counts children for whom the federal child tax credit may be
    # claimed (36 MRSA 5219-KK); IRC 152(b)(1) leaves such a return none.
    me_property_tax_fairness_credit_benefit_base: 3_300

- name: 2025 joint return with one claimable spouse uses the base without qualifying children (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 8
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: ME
  output:
    me_property_tax_fairness_credit_benefit_base: 3_300

