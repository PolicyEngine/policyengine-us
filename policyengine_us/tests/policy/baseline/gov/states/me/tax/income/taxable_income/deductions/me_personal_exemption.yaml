- name: Maine 2017 personal exemption imports known lawful federal allowances
  period: 2017
  # Component premises: the adult may claim their own federal exemption and the
  # qualifying child, including the required TINs and all federal dependency facts.
  # exemptions_count is the independently known lawful count, not a test of the
  # model's federal dependency, TIN or married-filing-separately count rules.
  # P.L. 2017, c. 474, Part B-6 imports IRC 151 for 2013-2017.
  # Rev. Proc. 2016-55, section 3.24: 2 * $4,050 = $8,100; federal AGI
  # $50,000 is below the HOH phaseout threshold, so no rounding is involved.
  input:
    people:
      parent:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        claimable_as_dependent_on_another_return: false
      child:
        age: 8
        is_tax_unit_head: false
        is_tax_unit_dependent: true
        claimable_as_dependent_on_another_return: false
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: HEAD_OF_HOUSEHOLD
        exemptions_count: 2
        adjusted_gross_income: 50_000
        me_agi: 50_000
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    me_personal_exemption_deduction: 8_100

