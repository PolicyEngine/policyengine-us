- name: Outside Maine, no personal exemption.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: NY
    filing_status: SINGLE
  output:
    me_personal_exemption_deduction: 0

- name: If $0 income, personal exemption is $4,450 in 2022.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: ME
    me_agi: 0
    filing_status: SINGLE
  output:
    me_personal_exemption_deduction: 4_450

- name: If you have an income below the phaseout start, you get the full personal exemption.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: ME
    filing_status: SINGLE
    me_agi: 279_500
  output:
    me_personal_exemption_deduction: 4_450

- name: If you have an income between the phaseout start and end, you get a partial credit.
  period: 2021
  absolute_error_margin: 0
  input:
    state_code: ME
    filing_status: SINGLE
    me_agi: 400_000
  output:
    # Excess = $120,500 / $125,000 = 0.964
    me_personal_exemption_deduction: 154.8 # $4,300 - $4,289.8

- name: High income filers get no personal exemption.
  period: 2021
  absolute_error_margin: 0
  input:
    state_code: ME
    filing_status: SINGLE
    me_agi: 404_500 # $279,500 + $125,000 = $404,500
  output:
    me_personal_exemption_deduction: 0

- name: 2025 single filer who may be claimed as a dependent gets no personal exemption
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person:
        age: 20
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person]
        me_agi: 10_000
    households:
      household:
        members: [person]
        state_code: ME
  output:
    # Form 1040ME line 13: 0 if you may be claimed as a dependent.
    me_personal_exemption_deduction: 0

- name: 2025 joint return with only one spouse claimable gets one exemption (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        me_agi: 16_000
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    # Form 1040ME line 13: 1 if married filing jointly and only one spouse may
    # be claimed as a dependent; 1 x $5,150.
    me_personal_exemption_deduction: 5_150

- name: 2025 joint return with only one spouse claimable gets one exemption (the claimable spouse is the spouse)
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        me_agi: 16_000
    households:
      household:
        members: [person_b, person_a]
        state_code: ME
  output:
    me_personal_exemption_deduction: 5_150

- name: 2025 joint return with both spouses claimable gets no exemption
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        me_agi: 16_000
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    me_personal_exemption_deduction: 0

- name: 2025 joint return with neither spouse claimable gets two exemptions
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person_a:
        age: 20
      person_b:
        age: 20
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        me_agi: 16_000
    households:
      household:
        members: [person_a, person_b]
        state_code: ME
  output:
    me_personal_exemption_deduction: 10_300
