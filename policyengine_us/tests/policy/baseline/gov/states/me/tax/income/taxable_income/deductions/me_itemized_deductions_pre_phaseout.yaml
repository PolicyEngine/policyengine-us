- name: Maine starts with the federally limited itemized deduction in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ME
    filing_status: SINGLE
    adjusted_gross_income: 1_000_000
    me_agi: 100_000
    tax_unit_itemizes: true
    total_itemized_taxable_income_deductions: 20_000
    itemized_deductions_less_salt: 20_000
    itemized_taxable_income_deductions_reduction: 1_081.081081
    salt_deduction: 0
    medical_expense_deduction: 0
    real_estate_taxes: 0
  output:
    # 36 M.R.S. 5125(1): deductions claimed federally, after section 68.
    # $20,000 - $20,000 * 2/37 = $18,918.92, below the cap and above the
    # $15,700 standard deduction; Maine AGI is below the $102,250 phaseout.
    me_itemized_deductions_pre_phaseout: 18_918.918919
    me_deductions: 18_918.918919

