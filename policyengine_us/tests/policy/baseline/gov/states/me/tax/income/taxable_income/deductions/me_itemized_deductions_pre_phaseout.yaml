    me_itemized_deductions_pre_phaseout: 28_378.378378
    me_deductions: 28_378.378378

- name: Maine scales SALT, property and medical components by the 2026 section 68 ratio.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ME
    filing_status: SINGLE
    tax_unit_itemizes: true
    total_itemized_taxable_income_deductions: 50_000
    itemized_deductions_less_salt: 40_000
    itemized_taxable_income_deductions_reduction: 2_702.702703
    salt_deduction: 10_000
    state_and_local_sales_or_income_tax: 6_000
    medical_expense_deduction: 10_000
    real_estate_taxes: 4_000
  output:
    # Deduced proportional allocation: q = $47,297.30 / $50,000 = 35/37.
    # Non-SALT deductions after section 68: $40,000 * q = $37,837.84.
    # Less medical $10,000 * q = $9,459.46, giving $28,378.38.
    # Property taxes: all $4,000 was within the SALT deduction, so the
    # add-back keeps the section 68 share: $4,000 * q = $3,783.78.
    # Capped part: $32,162.16 (below the cap); plus medical $9,459.46.
    me_itemized_deductions_pre_phaseout: 41_621.621622

- name: Maine adds back property taxes the federal SALT cap excluded in full in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: ME
    filing_status: SINGLE
    tax_unit_itemizes: true
    total_itemized_taxable_income_deductions: 27_000
    itemized_deductions_less_salt: 17_000
    itemized_taxable_income_deductions_reduction: 1_000
    salt_deduction: 10_000
    state_and_local_sales_or_income_tax: 0
    medical_expense_deduction: 0
    real_estate_taxes: 12_000
  output:
    # q = $26,000 / $27,000. Non-SALT: $17,000 * q = $16,370.37.
    # Property in the SALT deduction, pro rata: $10,000 * $12,000 / $12,000
    # = $10,000, kept at $10,000 * q = $9,629.63. The $2,000 the SALT cap
    # excluded is added back in full under 5125(3)(A-1).
    # $16,370.37 + $9,629.63 + $2,000 = $28,000, below the cap.
    me_itemized_deductions_pre_phaseout: 28_000
