# Schedule PTFC/STFC line 2a (federal total income, Form 1040 line 9) plus
# line 2d, which adds back "any negative amount (net loss)" on Form 1040 line 7
# and Schedule 1 lines 3, 4, 5, 6 and 8a through 8z. 36 M.R.S.
# 5213-A(1)(B)(1) and 5219-KK(1)(D)(1) add back "any net loss resulting from
# combining" the Schedule E items that make up Schedule 1 line 5.

- name: A Schedule 1 line 5 net loss is added back only to zero.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    partnership_s_corp_income: 3_000
    rental_income: -5_000
  output:
    # Line 5: 3,000 - 5,000 = -2,000. Line 2a: 20,000 - 2,000 = 18,000.
    # Line 2d: 2,000. 18,000 + 2,000 = 20,000.
    me_fairness_credit_federal_income: 20_000

- name: Other Schedule E items net on Schedule 1 line 5.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    rental_income: 6_000
    estate_income: -1_000
    farm_rent_income: -2_000
  output:
    # Schedule E line 41: 6,000 - 1,000 - 2,000 = 3,000, not a net loss.
    me_fairness_credit_federal_income: 3_000

- name: A loss on one line does not offset income on another.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    rental_income: 5_000
    self_employment_income: -5_000
  output:
    # Schedule 1 line 3: -5,000; line 5: 5,000. Line 2a: 20,000 - 5,000 +
    # 5,000 = 20,000. Line 2d adds back the line 3 loss: 20,000 + 5,000 =
    # 25,000.
    me_fairness_credit_federal_income: 25_000

- name: Two kinds of Schedule C business net on Schedule 1 line 3.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    self_employment_income: 10_000
    sstb_self_employment_income: -3_000
  output:
    # Line 3: 10,000 - 3,000 = 7,000, not a net loss.
    me_fairness_credit_federal_income: 7_000

- name: A spouse's Schedule C loss offsets the other spouse's Schedule C profit on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 20_000
        self_employment_income: 10_000
      spouse:
        age: 45
        self_employment_income: -4_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Line 3: 10,000 - 4,000 = 6,000. 20,000 wages + 6,000 = 26,000.
    me_fairness_credit_federal_income: 26_000

- name: A spouse's farm loss offsets the other spouse's farm profit on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        farm_operations_income: 8_000
      spouse:
        age: 45
        farm_operations_income: -3_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Schedule 1 line 6: 8,000 - 3,000 = 5,000.
    me_fairness_credit_federal_income: 5_000

- name: A spouse's capital loss offsets the other spouse's capital gain on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 20_000
        long_term_capital_gains: 10_000
      spouse:
        age: 45
        short_term_capital_gains: -4_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Form 1040 line 7: 10,000 - 4,000 = 6,000. 20,000 + 6,000 = 26,000.
    me_fairness_credit_federal_income: 26_000

- name: Capital gain distributions net against a capital loss, and the net loss is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    non_sch_d_capital_gains: 2_000
    long_term_capital_gains: -5_000
  output:
    # Schedule D line 13 takes the 2,000 of distributions: 2,000 - 5,000 =
    # -3,000, the most a single filer deducts, on Form 1040 line 7. Line 2a:
    # 20,000 - 3,000 = 17,000. Line 2d: 3,000. 17,000 + 3,000 = 20,000.
    me_fairness_credit_federal_income: 20_000

- name: A dependent's rental loss is on the dependent's own return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        partnership_s_corp_income: 10_000
      child:
        age: 10
        rental_income: -5_000
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: ME
  output:
    # The parent's Schedule 1 line 5 holds only the 10,000 of partnership
    # income.
    me_fairness_credit_federal_income: 10_000
