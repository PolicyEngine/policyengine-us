# 36 M.R.S. 5213-A(1)(B)(1) and 5219-KK(1)(D)(1) add back "Trade or business
# losses; capital losses; ... and farm losses included in federal adjusted
# gross income" in full, and only "any net loss resulting from combining" the
# Schedule E items that make up Schedule 1 line 5.

- name: A Schedule 1 line 5 net loss is added back only to zero.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    partnership_s_corp_income: 3_000
    rental_income: -5_000
  output:
    # Line 5: 3,000 - 5,000 = -2,000. Line 2a: 20,000 - 2,000 = 18,000.
    # Line 2d: 2,000. 18,000 + 2,000 = 20,000.
    me_fairness_credit_federal_income: 20_000

- name: A source a reform takes out of federal gross income doesn't net on its line.
  period: 2025
  absolute_error_margin: 0.01
  input:
    # The 2025 federal gross income sources without rental_income.
    gov.irs.gross_income.sources: [irs_employment_income, taxable_dependent_care_benefits, taxable_strike_benefits, self_employment_income, sstb_self_employment_income, partnership_s_corp_income, farm_operations_income, farm_rent_income, other_net_gain_gross_income, capital_gains, non_sch_d_capital_gains, taxable_interest_income, dividend_income, taxable_pension_income, taxable_disability_benefits, debt_relief, estate_income, taxable_unemployment_compensation, taxable_social_security, illicit_income, taxable_retirement_distributions, taxable_roth_conversions, miscellaneous_income, gambling_winnings, ak_permanent_fund_dividend, taxable_alimony_income, salt_refund_income, military_retirement_income]
    state_code: ME
    employment_income: 20_000
    partnership_s_corp_income: 3_000
    rental_income: -5_000
  output:
    # The rental loss isn't in federal income, so line 5 is the 3,000
    # partnership income alone: 20,000 + 3,000 = 23,000, nothing to add back.
    me_fairness_credit_federal_income: 23_000

- name: Other Schedule E items net on Schedule 1 line 5.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    rental_income: 6_000
    estate_income: -1_000
    farm_rent_income: -2_000
  output:
    # Schedule E line 41: 6,000 - 1,000 - 2,000 = 3,000, not a net loss.
    me_fairness_credit_federal_income: 3_000

- name: A loss on one line does not offset income on another.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    rental_income: 5_000
    self_employment_income: -5_000
  output:
    # Schedule 1 line 3: -5,000; line 5: 5,000. Line 2a: 20,000 - 5,000 +
    # 5,000 = 20,000. Line 2d adds back the line 3 loss: 20,000 + 5,000 =
    # 25,000.
    me_fairness_credit_federal_income: 25_000

- name: An SSTB loss is added back in full, not netted against other Schedule C income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    self_employment_income: 10_000
    sstb_self_employment_income: -3_000
  output:
    # Business losses are added back in full: 10,000, not line 3's net 7,000.
    me_fairness_credit_federal_income: 10_000

- name: A spouse's Schedule C loss is added back in full on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 20_000
        self_employment_income: 10_000
      spouse:
        age: 45
        self_employment_income: -4_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Business losses are added back in full: 20,000 + 10,000 = 30,000, not 26,000.
    me_fairness_credit_federal_income: 30_000

- name: A spouse's farm loss is added back in full on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        farm_operations_income: 8_000
      spouse:
        age: 45
        farm_operations_income: -3_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Farm losses are added back in full: 8,000, not line 6's net 5,000.
    me_fairness_credit_federal_income: 8_000

- name: A spouse's capital loss is added back in full on a joint return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 20_000
        long_term_capital_gains: 10_000
      spouse:
        age: 45
        short_term_capital_gains: -4_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: ME
  output:
    # Capital losses are added back in full: 20,000 + 10,000 = 30,000, not 26,000.
    me_fairness_credit_federal_income: 30_000

- name: A capital loss is added back in full, including the part that offsets capital gain distributions.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    non_sch_d_capital_gains: 2_000
    long_term_capital_gains: -5_000
  output:
    # Capital losses are added back in full: 20,000 + 2,000 = 22,000, not 20,000.
    me_fairness_credit_federal_income: 22_000

- name: A dependent's rental loss is on the dependent's own return.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        partnership_s_corp_income: 10_000
      child:
        age: 10
        rental_income: -5_000
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: ME
  output:
    # The parent's Schedule 1 line 5 holds only the 10,000 of partnership
    # income.
    me_fairness_credit_federal_income: 10_000

- name: One filer's short-term capital loss is added back in full, not netted against the same filer's long-term gain.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    long_term_capital_gains: 10_000
    short_term_capital_gains: -4_000
  output:
    # Form 1040 line 7: 10,000 - 4,000 = 6,000, so AGI is 26,000. Capital
    # losses are added back in full: 26,000 + 4,000 = 30,000, as when the
    # same items are split between spouses on a joint return.
    me_fairness_credit_netted_capital_loss: 4_000
    me_fairness_credit_federal_income: 30_000

- name: A capital loss netted against the same filer's capital gain distributions on Schedule D line 13 is added back in full.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    long_term_capital_gains: -3_000
    schedule_d_capital_gain_distributions: 2_000
  output:
    # Long-term gains of -3,000 net 2,000 of line 13 distributions with a
    # 5,000 loss from sales. AGI: 20,000 - 3,000 net loss = 17,000. The whole
    # 5,000 loss is added back: 17,000 + 5,000 = 22,000, as with
    # distributions reported without Schedule D.
    me_fairness_credit_netted_capital_loss: 2_000
    me_fairness_credit_federal_income: 22_000

- name: A prior-year capital loss carryover absorbed by the same filer's long-term gain is added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    long_term_capital_gains: 5_000
    long_term_capital_loss_carryover: 3_000
  output:
    # Schedule D line 15: the year's 8,000 long-term gain less the 3,000
    # carryover on line 14 = 5,000, so AGI is 25,000. 26 U.S.C. 1212(b)(1)(B)
    # makes the carryover a long-term capital loss of the year, included in
    # AGI: 25,000 + 3,000 = 28,000.
    me_fairness_credit_netted_capital_loss: 3_000
    me_fairness_credit_federal_income: 28_000

- name: A carryover is added back when the net capital gain is supplied without its parts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: ME
    employment_income: 20_000
    capital_gains: -1_000
    long_term_capital_loss_carryover: 3_000
  output:
    # The -1,000 net includes the 3,000 carryover, so the year's own gain is
    # 2,000. AGI deducts the 1,000 net loss: 19,000. AGI deducted all 3,000
    # of the carryover, 2,000 against the year's gain and 1,000 as the net
    # loss: 19,000 + 3,000 = 22,000.
    me_fairness_credit_netted_capital_loss: 2_000
    me_fairness_credit_federal_income: 22_000

- name: A dependent's capital loss netted against the dependent's own gain is not added back.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 20_000
      child:
        age: 10
        short_term_capital_gains: -4_000
        long_term_capital_gains: 2_000
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, child]
        state_code: ME
  output:
    # The child's capital gains and losses are on the child's own return, so
    # the parent's income is the 20,000 of wages.
    me_fairness_credit_netted_capital_loss: 0
    me_fairness_credit_federal_income: 20_000
