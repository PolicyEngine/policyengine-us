- name: In 2021, the first year of subsection 7, an ITIN family gets 20% of the one-child amount
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
      child:
        age: 5
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    # 34% x $10,000, below the 2021 one-child maximum of $3,618 (Rev. Proc.
    # 2020-45); 5219-S(1) pays 20% for 2021.
    me_federal_eitc_without_ssn_requirement: 3_400
    me_eitc: 680

- name: Joint return with an ITIN spouse and a citizen child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 10_000
        ssn_card_type: CITIZEN
      spouse:
        age: 35
        ssn_card_type: NONE
        has_tin: true
      child:
        age: 5
        ssn_card_type: CITIZEN
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    families:
      family:
        members: [head, spouse, child]
    spm_units:
      spm_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: ME
  output:
    # 32(c)(1)(E) requires the spouse's number too, so no federal credit.
    eitc: 0
    me_federal_eitc_without_ssn_requirement: 3_400
    me_eitc: 850

- name: An ITIN parent who claims section 911 benefits gets no Maine EITC
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
      child:
        age: 5
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
        foreign_earned_income_exclusion: 30_000
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    # 32(c)(1)(C) bars the credit; subsection 7 changes only the number.
    me_eitc_child_count: 1
    me_federal_eitc_without_ssn_requirement: 0
    me_eitc: 0

