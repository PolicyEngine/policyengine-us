    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    families:
      family:
        members: [head, spouse, child]
    spm_units:
      spm_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: ME
  output:
    # 32(c)(1)(E) requires the spouse's number too, so no federal credit.
    eitc: 0
    me_federal_eitc_without_ssn_requirement: 3_400
    me_eitc: 850

