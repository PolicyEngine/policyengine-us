# 36 M.R.S. 5219-S(7): from tax year 2021, "notwithstanding Section 32(m) of
# the Code", the taxpayer identification number required by IRC 32(c)(1)(E)
# and (c)(3)(D) "means a federal individual taxpayer identification number ...
# or a social security number". An ITIN holder is ssn_card_type NONE with
# has_tin true; a person with no taxpayer identification number has has_tin
# false. Maine pays 25% of the federal credit with a qualifying child and 50%
# without (5219-S(1-A)). 2025 federal amounts are from Rev. Proc. 2024-40:
# childless maximum $649 (7.65%), one child $4,328 (34%).

- name: ITIN parent with an ITIN child gets 25% of the one-child federal amount
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
      child:
        age: 5
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    eitc: 0
    me_eitc_child_count: 1
    # 34% x $10,000.
    me_federal_eitc_without_ssn_requirement: 3_400
    me_eitc: 850

- name: SSN twin of the ITIN parent with an ITIN child
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: CITIZEN
      child:
        age: 5
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    eitc: 3_400
    me_eitc_child_count: 1
    me_eitc: 850

- name: Citizen parent whose only child has an ITIN gets the with-child rate on the one-child amount
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 10_000
        ssn_card_type: CITIZEN
      child:
        age: 5
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    # Federally the parent claims the childless credit (7.65% x $8,490).
    eitc: 649
    eitc_child_count: 0
    me_eitc_child_count: 1
    me_federal_eitc_without_ssn_requirement: 3_400
    # 25% x $3,400 rather than 50% x $649.
    me_eitc: 850

- name: Parent aged 20 whose only child has an ITIN is a filer with a qualifying child, not in the age cohort
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 20
        employment_income: 10_000
        ssn_card_type: CITIZEN
      child:
        age: 2
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    # Federally childless and below the minimum age.
    eitc: 0
    me_childless_eitc_age_eligible: false
    me_pro_forma_childless_eitc: 0
    me_federal_eitc_without_ssn_requirement: 3_400
    me_eitc: 850

