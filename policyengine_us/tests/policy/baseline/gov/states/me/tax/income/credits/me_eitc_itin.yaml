    me_eitc_child_count: 0
    me_federal_eitc_without_ssn_requirement: 0
    me_pro_forma_childless_eitc: 382.50
    me_eitc: 191.25

- name: The same parent, who would file to claim a refundable credit, counts the child with an ITIN
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 20
        employment_income: 5_000
        ssn_card_type: CITIZEN
      child:
        age: 3
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    # Default filing inputs. No federal credit (the child fails 32(m), and at
    # 20 the parent fails the childless age test), so tax_unit_is_filer is
    # false; the parent would file for Maine's credit.
    tax_unit_is_filer: false
    me_eitc_ssn_limitation_waived: true
    me_eitc_child_count: 1
    # 34% x $5,000; 25% of it.
    me_federal_eitc_without_ssn_requirement: 1_700
    me_pro_forma_childless_eitc: 0
    me_eitc: 425

