- name: Childless ITIN filer aged 20 required to file gets the pro forma credit
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 20
        employment_income: 17_000
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [person]
        would_file_taxes_voluntarily: false
        would_file_if_eligible_for_refundable_credit: false
    households:
      household:
        members: [person]
        state_code: ME
  output:
    # $17,000 exceeds the $15,750 standard deduction, so the filer must file.
    tax_unit_is_required_to_file: true
    me_eitc_ssn_limitation_waived: true
    # $649 - 7.65% x ($17,000 - $10,620).
    me_pro_forma_childless_eitc: 160.93
    me_eitc: 80.465

- name: Citizen parent aged 20 who files no federal return doesn't count a child with an ITIN
