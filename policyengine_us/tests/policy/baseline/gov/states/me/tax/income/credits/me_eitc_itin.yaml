        would_file_taxes_voluntarily: false
        would_file_if_eligible_for_refundable_credit: false
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    me_eitc_ssn_limitation_waived: false
    # Without subsection 7 the child doesn't qualify (32(m)), so the parent
