- name: ME supervision is specific to the child in a mixed household.
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
        is_under_court_supervision: true
      supervised_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: true
        immigration_status: CITIZEN
      other_child:
        age: 17
        is_tax_unit_dependent: true
        is_under_court_supervision: false
        immigration_status: CITIZEN
    households:
      household:
        members: [parent, supervised_child, other_child]
        state_code: ME
  output:
    me_ccap_eligible_child: [false, true, false]

- name: ME court-supervised 17-year-old receives a benefit through the full pipeline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        weekly_hours_worked_before_lsr: 40
        employment_income: 50_000
      person2:
        age: 17
        is_disabled: false
        is_under_court_supervision: true
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        me_ccap_provider_type: LICENSE_EXEMPT
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 8_000
        spm_unit_assets: 30_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ME
        county_str: OXFORD_COUNTY_ME
  output:
    # person2: age 17, not disabled, under court supervision (13-18) => eligible child
    me_ccap_eligible_child: [false, true]
    me_ccap_eligible: true
    # Age group: age 17 => SCHOOL_AGE
    me_ccap_age_group: [SCHOOL_AGE, SCHOOL_AGE]
    # Market rate: Region 2 (Oxford) License-Exempt School Age FT = $119/week
    me_ccap_market_rate: [0, 119]
    # Parent fee: same household income as the disabled-teen integration case => $208/month
    me_ccap_parent_fee: 208
    # Benefit: 119 * 52 / 12 = 515.67 - 208 = 307.67
    me_ccap: 307.67

- name: ME court supervision combines with disability and applies below 13.
  period: 2026-01
  input:
    state_code: [ME, ME, ME]
    age: [12, 18, 19]
    is_under_court_supervision: [true, true, true]
    is_disabled: [false, true, true]
    is_tax_unit_dependent: [true, true, true]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
  output:
    me_ccap_eligible_child: [true, true, false]

- name: ME court supervision does not bypass the dependency or immigration gates.
  period: 2026-01
  input:
    state_code: [ME, ME]
    age: [17, 17]
    is_under_court_supervision: [true, true]
    is_tax_unit_dependent: [false, true]
    immigration_status: [CITIZEN, UNDOCUMENTED]
  output:
    me_ccap_eligible_child: [false, false]
