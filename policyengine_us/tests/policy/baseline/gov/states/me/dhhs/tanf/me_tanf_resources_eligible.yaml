# Maine TANF Resources Eligibility Tests
# Tests resource limit of $10,000
# Source: 22 M.R.S. Section 3762; P.L. 2023 Ch. 366

- name: Case 1, resources exactly at limit.
  period: 2025-01
  input:
    state_code: ME
    spm_unit_cash_assets: 10_000
  output:
    # $10,000 <= $10,000 → eligible
    me_tanf_resources_eligible: true

- name: Case 2, resources one dollar above limit.
  period: 2025-01
  input:
    state_code: ME
    spm_unit_cash_assets: 10_001
  output:
    # $10,001 > $10,000 → ineligible
    me_tanf_resources_eligible: false

- name: Case 3, zero resources.
  period: 2025-01
  input:
    state_code: ME
    spm_unit_cash_assets: 0
  output:
    me_tanf_resources_eligible: true

# 8,688.73 + 9.74 + 1,301.53 = 10,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 10,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.53
    state_code: ME
  output:
    me_tanf_resources_eligible: true

# 8,688.73 + 9.74 + 1,301.54 = 10,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.54
    state_code: ME
  output:
    me_tanf_resources_eligible: false
