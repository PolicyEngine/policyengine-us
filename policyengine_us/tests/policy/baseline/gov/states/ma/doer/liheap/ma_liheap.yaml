# Legacy adapter precedence and the mixed-vocabulary override.
- name: Legacy adapter, person-level total takes precedence over the per-fuel bill.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    ma_liheap_heating_type: ELECTRICITY
    heating_expense_person: 300
    electricity_expense: 500
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 1_800
    state_code: MA
  output:
    # heating_expense_person > 0 wins: min(852 + 160, 300) = 300
    ma_liheap: 300

- name: Legacy adapter, an explicit zero person-level input falls through to the per-fuel bill.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    ma_liheap_heating_type: ELECTRICITY
    heating_expense_person: 0
    electricity_expense: 500
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 1_800
    state_code: MA
  output:
    # heating_expense_person == 0 is treated as unset → electricity_expense (500)
    ma_liheap: 500

- name: Legacy adapter, person-level inputs sum across members.
  period: 2023
  input:
    people:
      person1:
        age: 40
        irs_gross_income: 40_000
        rent: 0
        heating_expense_person: 500
      person2:
        age: 38
        heating_expense_person: 300
      person3:
        age: 10
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        ma_liheap_heating_type: ELECTRICITY
        heat_expense_included_in_rent: false
        receives_housing_assistance: false
        heating_expense_last_year: 1_800
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MA
  output:
    # 500 + 300 = 800 < 852 + 160 → 800
    ma_liheap: 800

- name: Mixed vocabularies, the deprecated state override moves only the rate row.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    heating_type: NATURAL_GAS
    ma_liheap_heating_type: KEROSENE
    gas_expense: 900
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 2_000
    state_code: MA
  output:
    # Direct enum input wins for the row (kerosene: deliverable 1_239, HECS 160
    # since 2_000 > 1_487); the cap follows the canonical heating_type
    # (gas bill 900): min(1_399, 900) = 900
    ma_liheap_heating_type: KEROSENE
    ma_liheap: 900
