# Every canonical heating type has a pinned MA rate row. FY2023 (period 2023)
# non-subsidized level 3: utility / heat-in-rent 852, deliverable fuel 1_239,
# HECS 160; HECS prior-year thresholds: oil/propane 1_856, gas 1_190,
# other 1_635, kerosene 1_487, electricity 1_709.
- name: Canonical no heating cannot receive the HECS supplement and has no heating cost.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    heating_type: NONE
    gas_expense: 1_000
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 1_800
    state_code: MA
  output:
    ma_liheap_heating_type: NONE
    ma_liheap_hecs_eligible: false
    ma_liheap_hecs_payment: 0
    ma_liheap_standard_payment: 0
    ma_liheap: 0

- name: Legacy kerosene reads fuel_oil_expense.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    ma_liheap_heating_type: KEROSENE
    fuel_oil_expense: 500
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 2_000
    state_code: MA
  output:
    # min(1_239 + 160, 500) = 500
    ma_liheap_hecs_payment: 160
    ma_liheap_standard_payment: 1_239
    ma_liheap: 500

- name: Canonical kerosene keeps its own MA row and reads fuel_oil_expense.
  period: 2023
  input:
    spm_unit_size: 4
    irs_gross_income: 40_000
    rent: 0
    heating_type: KEROSENE
    fuel_oil_expense: 500
    heat_expense_included_in_rent: false
    receives_housing_assistance: false
    heating_expense_last_year: 2_000
    state_code: MA
  output:
    # Same result as the legacy kerosene case above.
    ma_liheap_heating_type: KEROSENE
    ma_liheap: 500

- name: Canonical propane maps to the heating oil and propane row.
