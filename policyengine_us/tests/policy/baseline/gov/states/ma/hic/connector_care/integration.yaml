# Integration tests for Massachusetts ConnectorCare (PY2026 premium wrap).
#
# These exercise the full chain: aca_magi_fraction (income gate) and
# is_aca_ptc_eligible (member gate) -> ma_connector_care_member_eligible ->
# ma_connector_care_eligible -> ma_connector_care (residual subsidy) ->
# healthcare_benefit_value (household resource aggregation).
#
# In Scenarios 1-5 slcsp, aca_ptc, and aca_magi_fraction are supplied directly
# (slcsp as an annual value) so every expected value is fully hand-verifiable.
# slcsp is a MONTH variable; supplying it at the YEAR period sets the annual sum.
# Scenario 6 instead derives aca_magi_fraction, aca_ptc, and is_aca_ptc_eligible
# from raw employment_income (only slcsp is supplied), per the Code Integrity note
# that provided-input tests can mask derivation bugs.
#
# The ma_connector_care -> healthcare_benefit_value flow-through is verified in
# tests/policy/baseline/household/healthcare_benefit_value.yaml, where the sibling
# cost proxies (medicaid_cost, msp_cost, chip, assigned_aca_ptc, ...) are zeroed so
# the wrap is isolated; here those proxies derive to nonzero values, so this file
# asserts only the program-specific outputs.
#
# Amount formula recap:
#   n_members      = count of ma_connector_care_member_eligible (= is_aca_ptc_eligible)
#   per_person_mo  = enrollee_premium.calc(aca_magi_fraction)   # single_amount bracket
#   contribution   = 12 * per_person_mo * n_members
#   subsidy        = max(0, slcsp_annual - aca_ptc - contribution)
#   amount         = where(ma_connector_care_eligible, subsidy, 0)
# Bracket (per person per month): [1.0,1.5001)->0, [1.5001,2.0001)->53,
#   [2.0001,2.5001)->103, [2.5001,3.0001)->152, [3.0001,inf)->235.

- name: Scenario 1, single adult at 175% FPL, band 2B ($53/mo), positive residual.
  # n_members=1, band 2B -> per_person 53. contribution = 12*53 = 636.
  # subsidy = 7_200 - 5_000 - 636 = 1_564. Eligible (1.75 in [1.0, 4.0], MA, APTC member).
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.75
        slcsp: 7_200
        aca_ptc: 5_000
        assigned_aca_ptc: 5_000
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    aca_magi_fraction: 1.75
    slcsp: 7_200  # annual sum of the MONTH variable
    aca_ptc: 5_000
    ma_connector_care_member_eligible: true
    ma_connector_care_eligible: true
    ma_connector_care: 1_564

