# Unit tests for the Massachusetts ConnectorCare Person-level member gate.
#
# ma_connector_care_member_eligible (Person, YEAR, bool, defined_for StateCode.MA)
# is a pass-through of is_aca_ptc_eligible: a person counts as a ConnectorCare
# enrollee exactly when they are eligible for the federal ACA premium tax credit.
# is_aca_ptc_eligible is supplied directly here so the identity is isolated.

- name: Case 1, MA resident who is APTC-eligible is a ConnectorCare member.
  # is_aca_ptc_eligible true, state_code MA -> member_eligible true.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care_member_eligible: true

- name: Case 2, MA resident who is not APTC-eligible is not a member.
  # is_aca_ptc_eligible false -> member_eligible false (pass-through).
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: false
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care_member_eligible: false

- name: Case 3, per-person gate in a mixed MA household ([true, false]).
  # person1 APTC-eligible -> true; person2 not APTC-eligible -> false. The gate
  # is evaluated independently per person, not aggregated.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
      person2:
        age: 38
        is_aca_ptc_eligible: false
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    people:
      person1:
        ma_connector_care_member_eligible: true
      person2:
        ma_connector_care_member_eligible: false

- name: 2026 MA a spouse who can be claimed elsewhere is not a ConnectorCare member (the claimable spouse is the head)
  period: 2026
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        slcsp_age_curve_amount_person: 6000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 23_475
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: MA
  output:
    ma_connector_care_member_eligible: [false, true]

- name: 2026 MA a spouse who can be claimed elsewhere is not a ConnectorCare member (the claimable spouse is the spouse)
  period: 2026
  input:
    people:
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        slcsp_age_curve_amount_person: 6000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        aca_magi: 23_475
        tax_unit_is_filer: true
    households:
      household:
        members: [person_b, person_a]
        state_code: MA
  output:
    ma_connector_care_member_eligible: [true, false]
