        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 10_000
        tax_unit_fpg:
          2025: 10_000
        slcsp: 6_000
        aca_ptc: 5_500
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 500

