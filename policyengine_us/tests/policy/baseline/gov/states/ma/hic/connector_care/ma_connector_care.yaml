# --- Multi-member (n=2), zero-floor, and ineligibility ---

- name: Case 14, two APTC-eligible members at 175% FPL (n=2).
  # per_person_month 53. contribution = 12*53*2 = 1_272.
  # subsidy = 7_200 - 5_000 - 1_272 = 928.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi_fraction: 1.75
        slcsp: 7_200
        aca_ptc: 5_000
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    ma_connector_care: 928

- name: Case 15, mixed household counts only the APTC-eligible member (n=1).
  # person2 is not APTC-eligible, so n_members=1. band 3A ($103/mo).
  # contribution = 12*103*1 = 1_236. subsidy = 9_000 - 5_000 - 1_236 = 2_764.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        aca_magi_fraction: 2.25
        slcsp: 9_000
        aca_ptc: 5_000
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    ma_connector_care: 2_764

- name: Case 16, zero floor when APTC plus contribution exceeds SLCSP.
  # band 3C ($235/mo). contribution = 12*235 = 2_820.
  # slcsp - aca_ptc - contribution = 5_000 - 3_000 - 2_820 = -820 -> floored to 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 3.5
        slcsp: 5_000
        aca_ptc: 3_000
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 0

