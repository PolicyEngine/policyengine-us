  # subsidy = 6_000 - 5_500 - 0 = 500. Ties the eligibility boundary to a payout.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 10_000
        aca_fpg: 10_000
        slcsp: 6_000
        aca_ptc: 5_500
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 500

