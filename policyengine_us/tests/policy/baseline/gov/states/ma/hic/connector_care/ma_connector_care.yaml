    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
      person3:
        age: 20
        is_aca_ptc_eligible: true
      person4:
        age: 18
        is_aca_ptc_eligible: true
      person5:
        age: 17
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        aca_magi: 35_000
        tax_unit_fpg:
          2025: 10_000
        slcsp: 20_000
        aca_ptc: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: MA
  output:
    ma_connector_care: 5_900

