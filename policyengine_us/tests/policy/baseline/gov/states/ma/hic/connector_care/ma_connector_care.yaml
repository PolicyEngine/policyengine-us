# Unit tests for the Massachusetts ConnectorCare subsidy amount.
#
# ma_connector_care (TaxUnit, YEAR, USD, defined_for StateCode.MA):
#   n_members         = count of ma_connector_care_member_eligible (= is_aca_ptc_eligible)
#   ratio             = max(aca_magi, 0) / tax_unit_fpg(prior year)  # exact, not truncated
#   per_person_month  = enrollee_premium.calc(ratio, right=True)   # single_amount bracket
#   contribution      = MONTHS_IN_YEAR (12) * per_person_month * n_members
#   slcsp_annual      = add(tax_unit, period, ["slcsp"])           # MONTH var summed to year
#   subsidy           = max(0, slcsp_annual - aca_ptc - contribution)
#   amount            = where(ma_connector_care_eligible, subsidy, 0)
#
# slcsp / aca_ptc / is_aca_ptc_eligible are supplied directly, and income is
# aca_magi against a prior-year tax_unit_fpg pinned to $10,000, so each expected
# value is hand-verifiable. Income-derived cases at the end use the actual 2025
# one-person guideline, $15,650. slcsp is a MONTH variable;
# supplying it at the YEAR period sets the annual total, so the values below are
# annual SLCSP.
#
# Per-person monthly enrollee premium bracket (single_amount, evaluated
# right-closed; 956 CMR 12.04(3)(b): "at or below 150%", "over 150% and not over
# 200%", ...):
#   [1.0, 1.5]  -> $0     (Plan Type 2A)
#   (1.5, 2.0]  -> $53    (Plan Type 2B)
#   (2.0, 2.5]  -> $103   (Plan Type 3A)
#   (2.5, 3.0]  -> $152   (Plan Type 3B)
#   (3.0, 4.0]  -> $235   (Plan Type 3C)
# So at EXACTLY 150%/200%/250%/300% FPL the household is still in the LOWER band,
# and any income above an edge is in the higher band, even below the next whole
# percentage point.

# --- Each band exercised with a positive residual, single member (n=1) ---

- name: Case 1, band 2A ($0/mo) at 140% FPL, single member.
  # per_person_month 0 -> contribution 0. subsidy = 6_000 - 5_500 - 0 = 500.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 14_000
        tax_unit_fpg:
          2025: 10_000
        slcsp: 6_000
        aca_ptc: 5_500
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 500

- name: Case 2, band 2B ($53/mo) at 175% FPL, single member.
