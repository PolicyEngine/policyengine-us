# --- Edge cases: SLCSP=0, exact-tie floor, large household (n=5), floor+payout ---

- name: Case 20, eligible household with zero SLCSP receives nothing.
  # Edge: benchmark premium of 0. band 2A ($0/mo), aca_ptc 0.
  # subsidy = max(0, 0 - 0 - 0) = 0. Eligible (1.4 in band, MA, APTC member) but
  # nothing to wrap. Guards the SLCSP=0 input against a spurious negative/positive.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.4
        slcsp: 0
        aca_ptc: 0
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 0

- name: Case 21, exact tie where SLCSP minus APTC equals the contribution yields 0.
  # Edge: the max_(0, .) floor at EXACTLY zero (not a negative residual).
  # band 2B ($53/mo). contribution = 12*53 = 636.
  # slcsp - aca_ptc - contribution = 5_636 - 5_000 - 636 = 0 exactly.
  # Eligible but the wrap is precisely 0.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.75
        slcsp: 5_636
        aca_ptc: 5_000
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 0

- name: Case 22, large household with five APTC-eligible members at 350% FPL (n=5).
  # Entity-size edge: contribution scales by member count at the top $235 band.
  # band 3C ($235/mo). contribution = 12*235*5 = 14_100.
  # subsidy = 20_000 - 0 - 14_100 = 5_900.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_aca_ptc_eligible: true
      person2:
        age: 43
        is_aca_ptc_eligible: true
      person3:
        age: 20
        is_aca_ptc_eligible: true
      person4:
        age: 18
        is_aca_ptc_eligible: true
      person5:
        age: 17
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
        aca_magi_fraction: 3.5
        slcsp: 20_000
        aca_ptc: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: MA
  output:
    ma_connector_care: 5_900

- name: Case 23, exactly at the 100% FPL floor with a positive residual pays out.
  # Edge: floor-inclusive eligibility (1.0 >= fpl_floor 1.0) combined with a
  # nonzero amount. band 2A ($0/mo). contribution 0.
  # subsidy = 6_000 - 5_500 - 0 = 500. Ties the eligibility boundary to a payout.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_aca_ptc_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi_fraction: 1.0
        slcsp: 6_000
        aca_ptc: 5_500
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    ma_connector_care: 500
