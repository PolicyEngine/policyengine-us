- name: Head of household filer receives the head of household personal exemption
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        is_blind: false
        age: 40
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # Head of household personal exemption 6,800; no dependents, aged, blind,
    # or medical exemptions.
    ma_part_b_taxable_income_exemption: 6_800

- name: Surviving spouse filer receives head of household personal exemption
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        is_blind: false
        age: 40
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        state_code: MA
        members: [head]
  output:
    # Federal surviving spouse maps to MA head of household, so the personal
    # exemption is the head of household 6,800.
    ma_part_b_taxable_income_exemption: 6_800

- name: 2025 single filer who can be claimed as a dependent, dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, child]
    households:
      household:
        members: [person_a, child]
        state_code: MA
  output:
    # Head of household personal exemption $6,800 survives (DOR: the
    # personal exemption applies "regardless of whether you can claim a
    # personal exemption on your federal return"); the $1,000 dependent
    # exemption needs a dependent claimed on the federal return, which a
    # claimable filer has none of (IRC 152(b)(1)).
    ma_part_b_taxable_income_exemption: 6_800

