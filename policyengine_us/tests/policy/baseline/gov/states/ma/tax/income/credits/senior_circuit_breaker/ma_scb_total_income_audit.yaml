# Target: policyengine_us/tests/policy/baseline/gov/states/ma/tax/income/credits/senior_circuit_breaker/ma_scb_total_income.yaml
# Batch E audit cases. Each fails on upstream/main 06c0dcbc54 (main's value is
# in the comment). M.G.L. c.62 s.6(k)(1): total income is Part A + B + C
# adjusted gross income, increased by the listed receipts "to the extent they
# are excluded or subtracted from adjusted gross income", less the age 65,
# blindness and dependent exemptions. Not run (the audit was read-only).

- name: Deductions allowed in reaching Massachusetts AGI reduce total income. # Schedule CB line 3 worksheet, line 2: Schedule Y lines 2 through 9b and 10.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 30_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        health_savings_account_ald: 2_000
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Massachusetts AGI: 30,000 wages - 2,000 HSA deduction (Schedule Y line 8).
    ma_agi: 28_000
    # 28,000 - 700 aged exemption. Main: 29,300 (starts from gross income).
    ma_scb_total_income: 27_300

- name: A long-term capital loss deducted against a short-term gain is added back. # c.62 s.2(c)(2)(b); s.6(k)(1) "net capital losses deducted pursuant to paragraph (2) of subsection (c) of section 2".
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 20_000
        short_term_capital_gains: 10_000
        long_term_capital_gains: -10_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Part B AGI 20,000. Part A AGI: 10,000 gain - 10,000 long-term loss = 0;
    # the 10,000 loss deducted is added back. Worksheet: Schedule B line 15
    # (short-term gains before losses) 10,000.
    # 20,000 + 10,000 - 700 aged exemption. Main: 19,300.
    ma_scb_total_income: 29_300

- name: Tax-exempt retirement account distributions are added to total income. # s.6(k)(1) "the total amount of income and receipts from ... retirement"; Schedule CB line 5.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        tax_exempt_ira_distributions: 6_000
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        ma_gross_income: 25_000
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # 25,000 + 6,000 - 700 aged exemption. Main: 24,300.
    ma_scb_total_income: 30_300

