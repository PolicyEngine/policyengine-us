- name: Example 1 from Mass.gov # https://www.mass.gov/technical-information-release/tir-01-19-real-estate-tax-credit-for-certain-persons-age-65-and-older-as-revised
  period: 2021
  input:
    people:
      A:
        age: 71
        real_estate_taxes: 3_200 + 300 * 0.5
        assessed_property_value: 400_000
      B:
        age: 64
    tax_units:
      tax_unit:
        ma_scb_total_income: 30_000
        members: [A, B]
    households:
      household:
        members: [A, B]
        state_code: MA
  output:
    ma_senior_circuit_breaker: 350

- name: Case 1, 2025 homeowner with income below threshold.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 8_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 50_000
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # real_estate_taxes: 8,000
    # income threshold: 50,000 * 0.10 = 5,000
    # over threshold: 8,000 - 5,000 = 3,000
    # credit: min(3,000, 2,820) = 2,820
    ma_senior_circuit_breaker: 2_820

- name: Case 2, 2025 single filer income above threshold.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 76_000
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # income 76,000 > max_income(SINGLE) 75,000
    ma_senior_circuit_breaker: 0

- name: Case 3, 2025 renter.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 68
        rent: 24_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 40_000
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # equivalent_rent: 24,000 * 0.25 = 6,000
    # income threshold: 40,000 * 0.10 = 4,000
    # over threshold: 6,000 - 4,000 = 2,000
    # credit: min(2,000, 2,820) = 2,000
    ma_senior_circuit_breaker: 2_000

- name: Case 4, 2025 boundary flip, excluding in-kind SNAP and WIC keeps income below the ceiling.
  # M.G.L. c.62 s.6(k)(1) re-adds "cash, but not in-kind, public assistance",
  # so SNAP and WIC do not count toward total income. Re-adding the 4,200 of
  # in-kind assistance below would push total income to 75,500, over the
  # 75,000 SINGLE ceiling, and zero out the credit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        wic: 1_200
        ssi: 0
        ma_state_supplement: 0
        real_estate_taxes: 8_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_gross_income: 72_000
        members: [person1]
    spm_units:
      spm_unit:
        snap: 3_000
        tanf: 0
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # total income: 72,000 gross - 700 aged exemption = 71,300 <= 75,000
    ma_scb_total_income: 71_300
    # income threshold: 71,300 * 0.10 = 7,130
    # over threshold: 8,000 - 7,130 = 870
    # credit: min(870, 2,820) = 870
    ma_senior_circuit_breaker: 870

- name: Surviving spouse filer receives the head of household income limit in 2025.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 90_000
        filing_status: SURVIVING_SPOUSE
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # Massachusetts has no surviving spouse filing status; the filer receives
    # the head of household income limit (94,000), not the single limit
    # (75,000), so 90,000 of income remains eligible.
    # income threshold: 90,000 * 0.10 = 9,000
    # over threshold: 10,000 - 9,000 = 1,000
    # credit: min(1,000, 2,820) = 1,000
    ma_senior_circuit_breaker: 1_000

- name: Married filing separately cannot claim the credit in 2025.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 40_000
        filing_status: SEPARATE
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # Schedule CB: married taxpayers filing separately do not qualify,
    # even with income and property value under the limits.
    ma_senior_circuit_breaker: 0

- name: Married filing separately at the SEPARATE income limit still cannot claim in 2025.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 74_000
        filing_status: SEPARATE
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # Income 74,000 sits just under the SEPARATE/SINGLE 2025 ceiling of
    # 75,000, so nothing but the MFS gate zeroes the credit. Paired with the
    # SINGLE contrast below (identical inputs -> 2,600), this isolates the
    # ~separate gate as the sole cause of the zero.
    # notes: SA5 MFS boundary-income case.
    ma_senior_circuit_breaker: 0

- name: Single filer with identical inputs to the MFS boundary case claims the credit in 2025.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 74_000
        filing_status: SINGLE
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # Identical to the MFS boundary case except filing_status = SINGLE, which
    # passes the ~separate gate. income 74,000 <= SINGLE ceiling 75,000.
    # income threshold: 74,000 * 0.10 = 7,400
    # over threshold: 10,000 - 7,400 = 2,600
    # credit: min(2,600, 2,820) = 2,600
    # notes: SA5 single-filer contrast isolating the MFS gate.
    ma_senior_circuit_breaker: 2_600

- name: Surviving spouse over the head of household income limit gets no credit in 2025.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit:
        ma_scb_total_income: 95_000
        filing_status: SURVIVING_SPOUSE
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
  output:
    # Surviving spouses map to the head of household income limit (94,000 in
    # 2025). Income 95,000 > 94,000, so the credit is 0. Pins the over-limit
    # side of the surviving-spouse -> HoH mapping (the under-limit side is
    # already covered above).
    # notes: Suggestion 7a - SURVIVING_SPOUSE over the HoH income limit.
    ma_senior_circuit_breaker: 0

- name: Married couple filing as two separate tax units cannot claim the credit in 2025
  # Ziming's diagnostic: a married couple modeled as two SEPARATE tax units in
  # one MA household returns [0, 0] post-fix (was [1,000, 1,000] pre-fix). Each
  # spouse is otherwise SCB-eligible; only the SEPARATE/MFS gate zeroes both
  # units. M.G.L. c.62 s.6(k)(5): no credit unless a joint return is filed.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
      spouse:
        is_tax_unit_head: true
        age: 70
        real_estate_taxes: 10_000
        assessed_property_value: 500_000
    tax_units:
      tax_unit_head:
        members: [head]
        ma_scb_total_income: 40_000
        filing_status: SEPARATE
      tax_unit_spouse:
        members: [spouse]
        ma_scb_total_income: 40_000
        filing_status: SEPARATE
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    # Genuine two-tax-unit fixture: each spouse files SEPARATE. Absent the gate
    # each unit would earn min(10,000 - 40,000 * 0.10, 2,820)
    #   = min(10,000 - 4,000, 2,820) = min(6,000, 2,820) = 2,820.
    # The MFS/SEPARATE gate zeroes the credit in both units. The scalar
    # assertion checks per-unit credit = 0 for both units.
    ma_senior_circuit_breaker: 0

- name: A dependent's pensions do not reduce a senior renter's credit.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 50_000
        rent: 24_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        ssi: 0
        ma_state_supplement: 0
      child:
        age: 16
        taxable_public_pension_income: 5_000
        tax_exempt_private_pension_income: 10_000
        is_tax_unit_dependent: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: MA
  output:
    # Total income: 50,000 wages - 700 aged exemption - 1,000 dependent
    # exemption = 48,300; the child's pensions are neither deducted from MA
    # gross income nor re-added.
    ma_scb_total_income: 48_300
    # equivalent rent: 24,000 * 0.25 = 6,000
    # income threshold: 48,300 * 0.10 = 4,830
    # credit: min(6,000 - 4,830, 2,820) = 1,170
    ma_senior_circuit_breaker: 1_170

# DOR TIR-17-8 sections II-IV: native tax-year income/property/credit limits.
# https://www.mass.gov/technical-information-release/tir-17-8-annual-update-of-real-estate-tax-credit-for-certain-persons-age-65-and-older
# Component financial boundaries: independently known SCB total income;
# Income aggregation has separate tests; its model formula is unchanged.
# All adults are resident nondependent homeowners; the principal home and
# associated land do not exceed one acre. Net eligible property tax is 15,000.
# Joint cases include both spouses. HOH cases include a dependent grandchild
# who lives in the home all year; the head pays over half the home costs.
