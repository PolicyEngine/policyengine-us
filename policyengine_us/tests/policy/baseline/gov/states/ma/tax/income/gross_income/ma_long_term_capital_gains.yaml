# Form 4797, Part II gains and losses (other_net_gain) go on Massachusetts
# Schedule D, line 7, not on Form 1, lines 3 through 10 (Part B). Expected
# values are computed line by line from the 2023 Form 1, Schedule B and
# Schedule D. A single filer with 60,000 of wages and no other 5.0% income
# has Part B taxable income of 60,000 - 2,000 (Form 1, line 11a) - 4,400
# (line 18) = 53,600 (line 19), taxed at 5% = 2,680.

- name: Long-term amounts on Schedule D add long-term gains, distributions and Form 4797 amounts
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        long_term_capital_gains: 4_000
        non_sch_d_capital_gains: 1_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: -2_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Schedule D: line 1 = 4,000; line 6 = 1,000; line 7 = -2,000.
    ma_long_term_capital_gains: 3_000

- name: A Form 4797 gain is Part C income
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: 5_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Form 1, line 10 = line 3 = 60,000.
    ma_part_b_gross_income: 60_000
    # Schedule D, line 7 = 5,000 = lines 9, 13, 15, 17, 19 and 21.
    ma_part_c_gross_income: 5_000
    ma_part_c_agi: 5_000
    # 2,680 + 5% x 5,000.
    ma_income_tax_before_credits: 2_930

- name: A short-term loss offsets a Form 4797 gain in Part C
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: 5_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    ma_part_b_gross_income: 60_000
    # Schedule B: line 19c = -2,000; line 20 = 0 (line 9 is 0); line 21
    # = -2,000; line 22 = Schedule D, line 14 = min(2,000, 5,000) = 2,000.
    # Schedule D, line 15 = 5,000 - 2,000 = 3,000.
    ma_part_c_agi: 3_000
    # 2,680 + 5% x 3,000.
    ma_income_tax_before_credits: 2_830

- name: A Form 4797 loss offsets long-term gains on Schedule D
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        long_term_capital_gains: 5_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: -3_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    ma_part_b_gross_income: 60_000
    # Schedule D: line 1 = 5,000; line 7 = -3,000; line 9 = 2,000 = line 13
    # = line 15 = line 21.
    ma_part_c_agi: 2_000
    # 2,680 + 5% x 2,000.
    ma_income_tax_before_credits: 2_780

- name: A Form 4797 loss offsets short-term gains on Schedule B, line 25
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        short_term_capital_gains: 3_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: -1_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    ma_part_b_gross_income: 60_000
    # Schedule D, line 13 = line 7 = -1,000; line 14 = Schedule B, line 25
    # = min(1,000, 3,000) = 1,000; line 15 = 0. Schedule B, line 26
    # = 3,000 - 1,000 = 2,000 = line 28 = line 39.
    ma_part_a_agi: 2_000
    ma_part_a_taxable_capital_gains_income: 2_000
    ma_part_c_agi: 0
    # 2,680 + 8.5% x 2,000.
    ma_income_tax_before_credits: 2_850

- name: A Form 4797 loss applies against dividends on Schedule B, line 32
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        non_qualified_dividend_income: 1_000
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: -3_000
    households:
      household:
        members: [head]
        state_code: MA
  output:
    ma_part_b_gross_income: 60_000
    # Schedule D, line 13 = -3,000; Schedule B, line 24 = 0, so line 14 = 0
    # and line 15 = -3,000. Line 32 worksheet: line 2 = min(1,000, 2,000)
    # = 1,000; line 4 = 1,000; line 5 = 3,000; line 6 = 1,000. Schedule B,
    # line 33 = 1,000 - 1,000 = 0 = line 35. Schedule D, line 17 = -3,000
    # + 1,000 = -2,000 is carried over (line 23).
    ma_part_a_agi: 0
    ma_part_c_agi: 0
