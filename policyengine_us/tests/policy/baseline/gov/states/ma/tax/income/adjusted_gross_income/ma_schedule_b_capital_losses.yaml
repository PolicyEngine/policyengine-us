# Massachusetts Schedule B applies a short-term loss first against up to
# $2,000 of dividends (line 20), then against long-term gains (line 22).
# Expected tax values match the NBER TAXSIM-35 MA tax before credits
# (staxbc) for the same returns.

- name: Short-term loss below the dividends leaves the net dividends as Part A income
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        qualified_dividend_income: 1_205
        short_term_capital_gains: -1_106
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_short_term_loss_against_dividends: 1_106
    ma_part_a_agi: 99
    ma_part_a_adjusted_dividends: 99
    ma_part_a_taxable_dividend_income: 99
    ma_part_c_agi: 0
    # 5% x (49,200 Part B + 99 Part A).
    ma_income_tax_before_credits: 2_464.95

- name: The short-term loss applied against dividends is capped at $2,000
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        qualified_dividend_income: 3_000
        short_term_capital_gains: -2_500
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_short_term_loss_against_dividends: 2_000
    ma_part_a_taxable_dividend_income: 1_000
    ma_income_tax_before_credits: 2_510

- name: A long-term loss also reduces the dividends taxed in Part A
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        qualified_dividend_income: 1_205
        long_term_capital_gains: -1_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_long_term_loss_against_dividends: 1_000
    ma_part_a_taxable_dividend_income: 205
    ma_income_tax_before_credits: 2_470.25

- name: Only the short-term loss left after the dividends offsets long-term gains
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        qualified_dividend_income: 10_000
        short_term_capital_gains: -5_000
        long_term_capital_gains: 50_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_short_term_loss_against_dividends: 2_000
    ma_part_a_agi: 8_000
    # The $8,800 exemption is unused in Part B: $8,000 goes to the dividends
    # and $800 to the long-term gains.
    ma_part_a_taxable_dividend_income: 0
    ma_part_a_cg_excess_exemption: 800
    # 50,000 - (5,000 - 2,000)
    ma_part_c_agi: 47_000
    ma_part_c_taxable_income: 46_200
    ma_income_tax_before_credits: 2_310

- name: Massachusetts bank interest does not absorb the short-term loss
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        taxable_interest_income: 10_000
        qualified_dividend_income: 500
        short_term_capital_gains: -1_500
        long_term_capital_gains: 5_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_short_term_loss_against_dividends: 500
    ma_part_a_agi: 0
    # 5,000 - (1,500 - 500)
    ma_part_c_agi: 4_000
    # 5% x (59,000 Part B + 0 Part A + 4,000 Part C).
    ma_income_tax_before_credits: 3_150
