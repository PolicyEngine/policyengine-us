- name: SSTB Schedule C losses reduce Massachusetts gross income
  period: 2024
  input:
    sstb_self_employment_income: -10_000
    state_code: MA
  output:
    ma_gross_income_loss_adjustment: -10_000

- name: A dependent's Schedule C loss stays on the dependent's own Form 1
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
        rental_income: 2_000
      child:
        age: 17
        self_employment_income: -3_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MA
  output:
    # Federal gross income leaves the child out, so the child's loss is not
    # subtracted on the parent's line 6a: MA total 5.0% income is the
    # parent's wages (line 3) plus rental income (line 7).
    ma_gross_income_loss_adjustment: 0
    ma_gross_income: 42_000

- name: One spouse's Schedule C loss offsets the other spouse's Schedule C income
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        self_employment_income: -20_000
      spouse:
        age: 40
        self_employment_income: 50_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MA
  output:
    ma_gross_income_loss_adjustment: -20_000
    # 40,000 + 50,000 - 20,000
    ma_gross_income: 70_000
    # Matches NBER TAXSIM-35 staxbc for the same return.
    ma_income_tax_before_credits: 2_860

- name: An SSTB Schedule C loss offsets the same person's other Schedule C income
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        self_employment_income: 30_000
        sstb_self_employment_income: -10_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    ma_gross_income_loss_adjustment: -10_000
    ma_gross_income: 60_000
