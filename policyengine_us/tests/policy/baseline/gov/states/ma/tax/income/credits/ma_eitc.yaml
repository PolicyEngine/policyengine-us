- name: No EITC, no matched credit
  period: 2022
  absolute_error_margin: 1
  input:
    state_code: MA
    eitc: 0
  output:
    ma_eitc: 0

- name: 30% match
  period: 2022
  absolute_error_margin: 1
  input:
    state_code: MA
    eitc: 100
  output:
    ma_eitc: 30

- name: 2023 40% match
  period: 2023
  absolute_error_margin: 1
  input:
    state_code: MA
    eitc: 100
  output:
    ma_eitc: 40

# Isolated annual MA match-rate component; federal EITC amounts are known inputs.
# These inputs do not assert full household eligibility or derive federal awards.
# 2017 DOR Form 1 instructions, physical page 16, Line 42: refundable 23% match.
# https://www.mass.gov/files/documents/2018/01/18/dor-2017-inc-form-1-inst.pdf#page=16
# Acts of 2018 c.154, sections 30 and 111: 30% starts with tax year 2019.
# https://malegislature.gov/Laws/SessionLaws/Acts/2018/Chapter154
- name: Case 4, 2017_known_federal_credit_vector.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person_0: {}
      person_100: {}
      person_1000: {}
    tax_units:
      tax_unit_0:
        members: [person_0]
        eitc: 0
      tax_unit_100:
        members: [person_100]
        eitc: 100
      tax_unit_1000:
        members: [person_1000]
        eitc: 1000
    households:
      household_0:
        members: [person_0]
        state_code: MA
      household_100:
        members: [person_100]
        state_code: MA
      household_1000:
        members: [person_1000]
        state_code: MA
  output:
    ma_eitc: [0, 23, 230]

