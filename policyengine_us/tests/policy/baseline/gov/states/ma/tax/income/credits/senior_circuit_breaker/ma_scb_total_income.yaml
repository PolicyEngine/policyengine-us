- name: Interest on U.S. obligations, subtracted in reaching Massachusetts AGI, is added back. # Schedule CB line 3 worksheet, line 8 (Schedule B line 6a); s.6(k)(1) "tax-exempt interest".
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        taxable_interest_income: 10_000
        us_govt_interest_person: 4_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Massachusetts AGI: 10,000 interest - 4,000 U.S. obligation interest.
    ma_agi: 6_000
    # 6,000 + 4,000 U.S. obligation interest - 700 aged exemption.
    ma_scb_total_income: 9_300

- name: A short-term loss applied against long-term gains is added back. # c.62 s.2(c)(2)(a); Schedule B line 22; Schedule CB line 3 worksheet, lines 12 to 18 take long-term gains "not including any losses".
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 20_000
        short_term_capital_gains: -4_000
        long_term_capital_gains: 10_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Part B AGI 20,000. No dividends, so the whole 4,000 short-term loss
    # offsets long-term gains: Part C AGI 10,000 - 4,000 = 6,000.
    ma_agi: 26_000
    # 26,000 + 4,000 short-term loss added back - 700 aged exemption.
    ma_scb_total_income: 29_300

- name: A short-term loss applied against dividends is added back. # c.62 s.2(c)(2)(a) and (c)(4); Schedule B line 20; Schedule CB line 3 worksheet, line 7 (Schedule B line 9, before line 20).
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 20_000
        qualified_dividend_income: 3_000
        short_term_capital_gains: -1_500
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Part B AGI 20,000. Part A AGI: 3,000 dividends - min(2,000, 3,000,
    # 1,500) = 1,500 short-term loss = 1,500.
    ma_agi: 21_500
    # 21,500 + 1,500 short-term loss added back - 700 aged exemption.
    ma_scb_total_income: 22_300

- name: The deduction for long-term gains on collectibles is added back. # Schedule CB line 3 worksheet, line 10 takes Schedule B line 15, before the line 27 long-term gains deduction (c.62 s.2(c)(3)).
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 20_000
        short_term_capital_gains: 3_000
        long_term_capital_gains: 10_000
        long_term_capital_gains_on_collectibles: 4_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Part B AGI 20,000. Part A AGI: 3,000 short-term gain - 50% x 4,000
    # collectibles gain = 1,000. Part C AGI: 10,000 long-term gain.
    ma_agi: 31_000
    # 31,000 + 2,000 collectibles deduction added back - 700 aged exemption.
    ma_scb_total_income: 32_300

- name: The 2021 qualified unemployment deduction is added back. # St. 2021, c. 9, s.26(b); 2021 Schedule CB line 3 worksheet, "do not exclude any amount on Schedule Y, line 9 that represents a deduction for unemployment compensation".
  period: 2021
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 10_000
        unemployment_compensation: 8_000
        is_tax_unit_head: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head]
    households:
      household:
        members: [head]
        state_code: MA
  output:
    # Household income 18,000 <= 25,520 (household of 1), so the deduction is
    # min(8,000, 10,200) = 8,000 (Schedule Y line 9c).
    ma_qualified_unemployment_deduction: 8_000
    # Massachusetts AGI: 10,000 wages + 8,000 unemployment - 8,000 deduction.
    ma_agi: 10_000
    # 10,000 + 8,000 deduction added back - 700 aged exemption.
    ma_scb_total_income: 17_300

- name: Only a dependent's share of capital income comes out when gains and losses net across members. # c.62 s.6(k)(1) counts "the taxpayer's" Part A and Part C income; 2025 Schedule CB line 3 worksheet, lines 7 to 18.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 70
        employment_income: 20_000
        qualified_dividend_income: 3_000
        short_term_capital_gains: -1_500
        long_term_capital_gains: 5_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        ssi: 0
        ma_state_supplement: 0
      grandchild:
        age: 16
        short_term_capital_gains: 4_000
        long_term_capital_gains: -2_000
        is_tax_unit_dependent: true
        ssi: 0
        ma_state_supplement: 0
    tax_units:
      tax_unit:
        members: [head, grandchild]
        filing_status: HEAD_OF_HOUSEHOLD
    marital_units:
      head_marital_unit:
        members: [head]
      grandchild_marital_unit:
        members: [grandchild]
    spm_units:
      spm_unit:
        tanf: 0
        members: [head, grandchild]
    households:
      household:
        members: [head, grandchild]
        state_code: MA
  output:
    # Tax unit: short-term gains 4,000 - 1,500 = 2,500 and long-term gains
    # 5,000 - 2,000 = 3,000, so no loss offsets dividends. Part A AGI 3,000 +
    # 2,500 = 5,500; Part C AGI 3,000; Part B AGI 20,000; ma_agi 28,500.
    # The head's own: 3,000 dividends + max(0, -1,500) + 5,000 long-term gains
    # = 8,000, against 8,500 for the tax unit: the dependent's share is 500.
    # 28,500 - 500 - 700 aged exemption - 1,000 dependent exemption = 26,300,
    # as with no dependent income: 20,000 + 3,000 + 5,000 - 1,700.
    ma_scb_total_income: 26_300
