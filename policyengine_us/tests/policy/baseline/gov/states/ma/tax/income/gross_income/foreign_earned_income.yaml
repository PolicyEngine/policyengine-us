# M.G.L. c. 62 s. 2(a)(1)(C) adds foreign earned income excluded under
# section 911 of the Code to Massachusetts gross income, and s. 2(b)(2) puts
# it in Part B. Other income inputs must already exclude the excluded amount.

- name: Excluded foreign wages enter Part B and preserve Parts A and C
  period: 2025
  input:
    state_code: MA
    age: 35
    employment_income: 32_000
    foreign_earned_income_exclusion: 10_000
    dividend_income: 6_000
    short_term_capital_gains: 3_000
    long_term_capital_gains: 4_000
    ma_part_b_taxable_income_deductions: 0
    ma_part_b_taxable_income_exemption: 4_400
  output:
    # Federal: 32,000 + 6,000 + 3,000 + 4,000.
    irs_gross_income: 45_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    # MA: 45,000 + 10,000.
    ma_gross_income: 55_000
    ma_part_a_gross_income: 9_000
    ma_part_c_gross_income: 4_000
    ma_part_b_gross_income: 42_000
    ma_part_b_taxable_income: 37_600
    # (37,600 + 6,000 + 4,000) * 5% + 3,000 * 8.5%.
    ma_income_tax_before_credits: 2_635

- name: Fully excluded foreign wages remain Massachusetts income
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 0
    foreign_earned_income_exclusion: 10_000
  output:
    # 0 + 10,000.
    ma_gross_income: 10_000
    ma_part_b_gross_income: 10_000

- name: Foreign earnings addition preserves loss adjustment
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: 10_000
    ma_gross_income_loss_adjustment: -15_000
  output:
    # 50,000 - 15,000 + 10,000.
    ma_gross_income: 45_000
    ma_part_b_gross_income: 45_000

- name: Foreign earnings addition preserves existing Massachusetts exclusions
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 60_000
    foreign_earned_income_exclusion: 20_000
    taxable_social_security: 7_500
    salt_refund_income: 2_000
    taxable_public_pension_income: 10_000
  output:
    # 60,000 + 20,000 - 7,500 - 2,000 - 10,000.
    ma_gross_income: 60_500
    ma_part_b_gross_income: 60_500

- name: Gross exclusion differs from net federal stacking
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 45_000
    foreign_earned_income_exclusion: 8_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    dividend_income: 6_000
    short_term_capital_gains: 3_000
    long_term_capital_gains: 4_000
  output:
    # No housing deduction or allocable ALD; disallowed itemized expenses 2,000.
    # Stacking = 10,000 - 2,000; MA gross = 45,000 + 10,000.
    ma_gross_income: 55_000
    ma_part_a_gross_income: 9_000
    ma_part_c_gross_income: 4_000
    ma_part_b_gross_income: 42_000

- name: An entered zero addition replaces the federal stacking default
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 0
  output:
    ma_foreign_earned_income_exclusion_addback: 0
    # 50,000 + 0.
    ma_gross_income: 50_000
    ma_part_b_gross_income: 50_000

- name: The addition applies only in Massachusetts
  period: 2025
  input:
    state_code: NY
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: 10_000
  output:
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 0

- name: A negative federal exclusion cannot reduce Massachusetts gross income
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: -5_000
  output:
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 50_000
    ma_part_b_gross_income: 50_000

- name: The addition counts against losses before the zero floor
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 10_000
    foreign_earned_income_exclusion: 25_000
    ma_gross_income_loss_adjustment: -30_000
  output:
    # max(0, 10,000 - 30,000 + 25,000).
    ma_gross_income: 5_000
    ma_part_b_gross_income: 5_000

# Leaf-input regressions for ruling d1051 (Form 2555 lines 42 and 36).
# Preserve the existing legacy aggregate-input fixtures alongside these cases.

- name: Leaf exclusions enter Part B and preserve Parts A and C
  period: 2025
  input:
    state_code: MA
    age: 35
    employment_income: 32_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    dividend_income: 6_000
    short_term_capital_gains: 3_000
    long_term_capital_gains: 4_000
    ma_part_b_taxable_income_deductions: 0
    ma_part_b_taxable_income_exemption: 4_400
  output:
    irs_gross_income: 45_000
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 55_000
    ma_part_a_gross_income: 9_000
    ma_part_c_gross_income: 4_000
    ma_part_b_gross_income: 42_000
    ma_part_b_taxable_income: 37_600
    ma_income_tax_before_credits: 2_635

- name: Fully excluded wages supplied as leaves remain Massachusetts income
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 0
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
  output:
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 10_000
    ma_part_b_gross_income: 10_000

- name: Leaf exclusions preserve the Massachusetts loss adjustment
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    ma_gross_income_loss_adjustment: -15_000
  output:
    foreign_earned_income_exclusion_gross: 10_000
    ma_gross_income: 45_000
    ma_part_b_gross_income: 45_000

- name: Leaf exclusions preserve existing Massachusetts exclusions
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 60_000
    foreign_earned_income_exclusion_amount: 16_000
    foreign_housing_exclusion: 4_000
    taxable_social_security: 7_500
    salt_refund_income: 2_000
    taxable_public_pension_income: 10_000
  output:
    foreign_earned_income_exclusion_gross: 20_000
    ma_gross_income: 60_500
    ma_part_b_gross_income: 60_500

- name: Gross leaf exclusions differ from an explicit legacy federal stacking input
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 45_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    foreign_earned_income_exclusion: 8_000
    dividend_income: 6_000
    short_term_capital_gains: 3_000
    long_term_capital_gains: 4_000
  output:
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 8_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 55_000
    ma_part_a_gross_income: 9_000
    ma_part_c_gross_income: 4_000
    ma_part_b_gross_income: 42_000

- name: Leaf exclusions count against losses before the Massachusetts zero floor
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 10_000
    foreign_earned_income_exclusion_amount: 20_000
    foreign_housing_exclusion: 5_000
    ma_gross_income_loss_adjustment: -30_000
  output:
    foreign_earned_income_exclusion_gross: 25_000
    ma_gross_income: 5_000
    ma_part_b_gross_income: 5_000

- name: Section 911 earned-income exclusion alone derives the gross addback
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 10_000
  output:
    foreign_housing_exclusion: 0
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 60_000

- name: Section 911 housing exclusion alone derives the gross addback
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_housing_exclusion: 10_000
  output:
    foreign_earned_income_exclusion_amount: 0
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 60_000

- name: Explicit zero federal aggregate overrides derived stacking without overriding gross leaves
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    foreign_earned_income_exclusion: 0
  output:
    foreign_earned_income_exclusion: 0
    foreign_earned_income_exclusion_gross: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 60_000

- name: Explicit zero leaves override the Massachusetts legacy fallback
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 0
    foreign_housing_exclusion: 0
    foreign_earned_income_exclusion: 10_000
  output:
    foreign_earned_income_exclusion: 10_000
    foreign_earned_income_exclusion_gross: 0
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 50_000

- name: Federal worksheet deductions preserve gross Massachusetts exclusions
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    foreign_earned_income_exclusion_allocable_deductions: 1_000
    foreign_housing_deduction: 500
    foreign_earned_income_exclusion_disallowed_deductions: 700
  output:
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 8_800
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 60_000

- name: The derived federal worksheet amount has its own zero floor
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 1_000
    foreign_earned_income_exclusion_allocable_deductions: 2_000
  output:
    foreign_earned_income_exclusion_gross: 1_000
    foreign_earned_income_exclusion: 0
    ma_foreign_earned_income_exclusion_addback: 1_000
    ma_gross_income: 51_000

- name: Housing deduction alone stacks federally without a Massachusetts exclusion addback
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_housing_deduction: 500
  output:
    foreign_earned_income_exclusion_gross: 0
    foreign_earned_income_exclusion: 500
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 50_000

- name: An explicit Massachusetts zero overrides positive gross exclusion leaves
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
    ma_foreign_earned_income_exclusion_addback: 0
  output:
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 50_000

- name: Leaf exclusions do not create Massachusetts income outside Massachusetts
  period: 2025
  input:
    state_code: NY
    irs_gross_income: 50_000
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
  output:
    foreign_earned_income_exclusion_gross: 10_000
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 0

- name: Legacy aggregate input still supplies the Massachusetts default
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: 10_000
  output:
    foreign_earned_income_exclusion: 10_000
    ma_foreign_earned_income_exclusion_addback: 10_000
    ma_gross_income: 60_000

- name: Explicit negative legacy federal input remains directly settable
  period: 2025
  input:
    state_code: MA
    irs_gross_income: 50_000
    foreign_earned_income_exclusion: -5_000
  output:
    foreign_earned_income_exclusion: -5_000
    ma_foreign_earned_income_exclusion_addback: 0
    ma_gross_income: 50_000

- name: Leaf worksheet adjustments reproduce the federal head-of-household stacking example
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 60_000
      child1:
        age: 10
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        foreign_earned_income_exclusion_amount: 40_000
        foreign_housing_exclusion: 5_000
        foreign_earned_income_exclusion_allocable_deductions: 4_000
        foreign_housing_deduction: 500
        foreign_earned_income_exclusion_disallowed_deductions: 1_500
    households:
      household:
        members: [parent, child1, child2]
        state_code: TX
  output:
    # Same federal worksheet net as the existing $40,000 legacy fixture:
    # 45,000 - 4,000 + 500 - 1,500 = 40,000 (worksheet line 2c).
    foreign_earned_income_exclusion_gross: 45_000
    foreign_earned_income_exclusion: 40_000
    adjusted_gross_income: 60_000
    taxable_income: 36_375
    taxable_income_plus_section_911_exclusion: 76_375
    # Official 2025 brackets: tax(76,375) - tax(40,000).
    income_tax_main_rates: 5_517.50
    income_tax_before_credits: 5_517.50
    ctc_limiting_tax_liability: 5_517.50

- name: Leaf exclusions preserve the existing Form 2555 Worksheet B check
  period: 2025
  input:
    ctc_qualifying_children: 2
    foreign_earned_income_exclusion_amount: 8_000
    foreign_housing_exclusion: 2_000
  output:
    foreign_earned_income_exclusion: 10_000
    ctc_credit_limit_worksheet_b_applies: false
