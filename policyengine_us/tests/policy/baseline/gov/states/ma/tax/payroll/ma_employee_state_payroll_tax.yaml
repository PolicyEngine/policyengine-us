# Massachusetts employee PFML contributions before 2024. Contributions began
# October 1, 2019. The employee rate is 0.378% from then through 2021, 0.344%
# in 2022 and 0.318% in 2023, on wages up to the Social Security wage base.

- name: Massachusetts collects no PFML contribution in 2018, before contributions began.
  period: 2018
  input:
    employment_income: 60_000
    state_code: MA
  output:
    ma_employee_paid_leave_contribution: 0
    ma_employee_state_payroll_tax: 0
    employee_state_payroll_tax: 0

- name: Massachusetts PFML contribution in 2019 covers wages from October 1.
  period: 2019
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.378% * 3/12 * 60,000 = 56.70.
    ma_employee_paid_leave_contribution: 56.70
    ma_employee_state_payroll_tax: 56.70
    employee_state_payroll_tax: 56.70

- name: Massachusetts PFML contribution in 2021 is 0.378% of wages.
  period: 2021
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.378% * 60,000 = 226.80.
    ma_employee_paid_leave_contribution: 226.80
    ma_employee_state_payroll_tax: 226.80
    employee_state_payroll_tax: 226.80

- name: Massachusetts PFML contribution in 2021 stops at the 142,800 Social Security wage base.
  period: 2021
  absolute_error_margin: 0.01
  input:
    employment_income: 200_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 142_800
    # 0.378% * 142,800 = 539.78.
    ma_employee_paid_leave_contribution: 539.78

- name: Massachusetts PFML contribution in 2022 is 0.344% of wages.
  period: 2022
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.344% * 60,000 = 206.40.
    ma_employee_paid_leave_contribution: 206.40

- name: Massachusetts PFML contribution in 2023 is 0.318% of wages.
  period: 2023
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.318% * 60,000 = 190.80.
    ma_employee_paid_leave_contribution: 190.80
