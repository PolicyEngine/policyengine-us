# Independent 2025 expectations from M.G.L. c. 62, s. 3(B)(a)(9),
# 2025 Form 1 instructions printed page 12, and DOR rent-deduction guidance.
# https://malegislature.gov/Laws/GeneralLaws/PartI/TitleIX/Chapter62/Section3
# https://www.mass.gov/doc/2025-form-1-instructions/download
# Missing/invalid facts preserve a compatibility amount, not a verified claim.
# Integration expectations preserve all nonrent components and historical numerics.

# Rent 3,000 replaces old rent 2,000; the old term must not remain in addition.
- name: 'Case 1, the new rent component replaces the old term once.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 1_000
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
    employee_social_security_tax: 0
    employee_medicare_tax: 0
    self_employment_social_security_tax: 0
    self_employment_medicare_tax: 0
    taxable_interest_income: 0
    charitable_deduction: 0
    ma_claim_of_right_deduction: 0
    ma_529_deduction: 0
    rent: 10_000
  output:
    ma_part_b_taxable_income_deductions: 3_000

# Retirement capped at 2,000 + charity 500 + claim of right 250 + 529 deduction 800 + rent 3,000 = 6,550. Nonrent inputs are stipulated component amounts.
- name: 'Case 2, all other deduction components remain in the aggregate.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 1_000
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
    employee_social_security_tax: 4_000
    employee_medicare_tax: 0
    self_employment_social_security_tax: 0
    self_employment_medicare_tax: 0
    taxable_interest_income: 0
    charitable_deduction: 500
    ma_claim_of_right_deduction: 250
    ma_529_deduction: 800
    rent: 10_000
  output:
    ma_part_b_taxable_income_deductions: 6_550

# Compatibility only: old rent min(5,000, 2,000) plus charity 500 = 2,500.
