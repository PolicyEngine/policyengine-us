# Massachusetts PFML rate an employer may withhold from wages: the whole family
# leave rate plus 40% of the medical leave rate. Contributions began October 1,
# 2019. DFML's published rates: 0.13% family and 0.62% medical from then through
# 2021, 0.12% and 0.56% in 2022, 0.11% and 0.52% in 2023, and 0.18% and 0.70%
# from 2024. From 2027 the caps and the rates swap (Acts 2026 c. 101 ss. 25-26
# and DFML's 2027 rates): 40% of the 0.70% family rate plus all of the 0.18%
# medical rate.

- name: Massachusetts PFML employee rate is zero in 2018, before contributions began.
  period: 2018
  input:
    state_code: MA
  output:
    ma_employee_paid_leave_contribution_rate: 0

- name: Massachusetts PFML employee rate in 2019 counts only October through December.
  period: 2019
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # (0.13% + 40% * 0.62%) * 3/12 = 0.378% * 3/12 = 0.0945%.
    ma_employee_paid_leave_contribution_rate: 0.000945

- name: Massachusetts PFML employee rate in 2021 is 0.378%.
  period: 2021
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # 0.13% + 40% * 0.62% = 0.378%.
    ma_employee_paid_leave_contribution_rate: 0.00378

- name: Massachusetts PFML employee rate in 2022 is 0.344%.
  period: 2022
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # 0.12% + 40% * 0.56% = 0.344%.
    ma_employee_paid_leave_contribution_rate: 0.00344

- name: Massachusetts PFML employee rate in 2023 is 0.318%.
  period: 2023
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # 0.11% + 40% * 0.52% = 0.318%.
    ma_employee_paid_leave_contribution_rate: 0.00318

- name: Massachusetts PFML employee rate in 2024 is 0.46%.
  period: 2024
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # 0.18% + 40% * 0.70% = 0.46%.
    ma_employee_paid_leave_contribution_rate: 0.0046

- name: Massachusetts PFML employee rate stays 0.46% in 2027 after the caps and the rates swap.
  period: 2027
  absolute_error_margin: 0.0000001
  input:
    state_code: MA
  output:
    # 40% * 0.70% + 0.18% = 0.28% + 0.18% = 0.46%.
    ma_employee_paid_leave_contribution_rate: 0.0046

- name: Massachusetts PFML employee rate is zero outside Massachusetts.
  period: 2021
  input:
    state_code: NH
  output:
    ma_employee_paid_leave_contribution_rate: 0
