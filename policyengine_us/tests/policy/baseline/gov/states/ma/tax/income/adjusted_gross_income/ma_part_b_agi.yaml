- name: IRA contributions not deducted from MA Part B AGI
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: MA
    employment_income: 10_000
    traditional_ira_contributions_desired: 1_000
  output:
    ma_part_b_agi: 10_000

- name: Dependent's self-employed health insurance deduction does not reduce the parent's Part B AGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: MA
  output:
    # Part B gross income starts from federal gross income, which leaves out
    # the child's Schedule C income, so the child's self-employed health
    # insurance deduction is left out too: it is on the child's own return.
    ma_part_b_gross_income: 40_000
    ma_part_b_agi: 40_000
