- name: Surviving spouse filer receives head of household treatment in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # Massachusetts has no surviving spouse filing status; federal qualifying
    # surviving spouses generally file as head of household in Massachusetts.
    # Base 7,600 + personal exemption 6,800 + 1 dependent x 1,000 = 15,400.
    ma_income_tax_exemption_threshold: 15_400

- name: Head of household filer with one dependent in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # Base 7,600 + personal exemption 6,800 + 1 dependent x 1,000 = 15,400.
    ma_income_tax_exemption_threshold: 15_400

- name: Single filer with one dependent gets no per-dependent addition in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SINGLE
    households:
      household:
        state_code: MA
        members: [head, child]
  output:
    # The No Tax Status worksheet adds $1,000 per dependent only for head of
    # household and married filing jointly; single filers use the flat 8,000.
    ma_income_tax_exemption_threshold: 8_000

- name: Joint filers with two dependents include the per-dependent addition in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        age: 40
      child1:
        is_tax_unit_dependent: true
        age: 5
      child2:
        is_tax_unit_dependent: true
        age: 8
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
    households:
      household:
        state_code: MA
        members: [head, spouse, child1, child2]
  output:
    # Base 7,600 + personal exemption 8,800 + 2 dependents x 1,000 = 18,400.
    ma_income_tax_exemption_threshold: 18_400
