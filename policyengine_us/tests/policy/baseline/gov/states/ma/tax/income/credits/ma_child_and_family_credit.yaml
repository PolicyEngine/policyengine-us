- name: Identical household split into two separate tax units zeroes the credit in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit_head:
        members: [head, child]
        filing_status: SEPARATE
      tax_unit_spouse:
        members: [spouse]
        filing_status: SEPARATE
    households:
      household:
        state_code: MA
        members: [head, spouse, child]
  output:
    # Same people as the joint one-child case (which yields 440), but split into
    # two genuine SEPARATE tax units. The MFS gate zeroes the otherwise-440 base
    # in the child-bearing unit; the other unit has no qualifying individual.
    # Scalar assertion = per-unit 0 for both units.
    ma_child_and_family_credit: 0

- name: Disabled head on a joint return qualifies in 2024 (disabled older adult)
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 45
      spouse:
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # The disabled member is the head (older adult). Keying on
    # is_tax_unit_head_or_spouse counts 1 qualifying individual under
    # IRC Section 21(b)(1)(C): 1 x 440 (2024 amount) = 440.
    ma_child_and_family_credit: 440

