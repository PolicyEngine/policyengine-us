- name: Disabled spouse qualifies in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # IRC Section 21(b)(1)(C) qualifying individual: 1 x 440 = 440.
    ma_child_and_family_credit: 440

- name: Disabled spouse does not qualify in 2022 under the predecessor credit
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # The pre-2023 credit for eligible dependents covered only
    # IRC Section 152 dependents.
    ma_child_and_family_credit: 0

- name: Married filing separately in two tax units cannot claim the credit in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit_head:
        members: [head, child]
        filing_status: SEPARATE
      tax_unit_spouse:
        members: [spouse]
        filing_status: SEPARATE
    households:
      household:
        state_code: MA
        members: [head, spouse, child]
  output:
    # Genuine two-tax-unit fixture: each spouse files SEPARATE. The MFS gate
    # zeroes the credit in every unit, including the one with the qualifying
    # child. The scalar assertion checks per-unit credit = 0 for both units.
    ma_child_and_family_credit: 0

