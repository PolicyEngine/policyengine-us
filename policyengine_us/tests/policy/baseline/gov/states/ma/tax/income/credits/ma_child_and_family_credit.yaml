- name: Disabled spouse in a separate tax unit cannot claim the credit in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 40
    tax_units:
      tax_unit_head:
        members: [head]
        filing_status: SEPARATE
      tax_unit_spouse:
        members: [spouse]
        filing_status: SEPARATE
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # The disabled adult now files in their own SEPARATE tax unit (not a
    # same-unit override). The disabled-head-or-spouse gate requires a JOINT
    # return, so both SEPARATE units yield 0. Scalar assertion = per-unit 0.
    ma_child_and_family_credit: 0

