- name: Married filing separately in two tax units cannot claim the credit in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      spouse:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        age: 40
      child:
        is_tax_unit_dependent: true
        age: 5
    tax_units:
      tax_unit_head:
        members: [head, child]
        filing_status: SEPARATE
      tax_unit_spouse:
        members: [spouse]
        filing_status: SEPARATE
    households:
      household:
        state_code: MA
        members: [head, spouse, child]
  output:
    # Genuine two-tax-unit fixture: each spouse files SEPARATE. The MFS gate
    # zeroes the credit in every unit, including the one with the qualifying
    # child. The scalar assertion checks per-unit credit = 0 for both units.
    ma_child_and_family_credit: 0

