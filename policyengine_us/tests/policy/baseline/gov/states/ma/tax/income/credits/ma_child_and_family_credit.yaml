- name: 3 children, maximum dependent credit in 2022
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      child_1:
        age: 7
      child_2:
        age: 7
      child_3:
        age: 7
    tax_units:
      tax_unit:
        members: [child_1, child_2, child_3]
    households:
      household:
        state_code: MA
        members: [child_1, child_2, child_3]
  output:
    ma_child_and_family_credit: 360

- name: One elderly, one disabled in 2022
