- name: Both spouses disabled on a joint return count one qualifying individual in 2024
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      head:
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 45
      spouse:
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: true
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        state_code: MA
        members: [head, spouse]
  output:
    # IRC Section 21(b)(1)(C) recognizes a single "spouse of the taxpayer"
    # qualifying individual, so a both-disabled joint couple counts 1, not 2:
    # 1 x 440 (2024 amount) = 440.
    ma_child_and_family_credit: 440

