- name: Massachusetts PFML 2024 employee contribution is 0.46% of wages.
  period: 2024
  input:
    employment_income: 60_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 60_000
    # 0.18% family + 40% * 0.70% medical = 0.46%; 0.46% * 60,000 = 276.00.
    ma_employee_paid_leave_contribution: 276.00
    ma_employee_state_payroll_tax: 276.00
    employee_state_payroll_tax: 276.00

- name: Massachusetts PFML 2024 contribution stops at the 168,600 Social Security wage base.
  period: 2024
  input:
    employment_income: 200_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 168_600
    # 0.46% * 168,600 = 775.56.
    ma_employee_paid_leave_contribution: 775.56

- name: Massachusetts PFML 2025 employee contribution is 0.46% of wages.
  period: 2025
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.46% * 60,000 = 276.00.
    ma_employee_paid_leave_contribution: 276.00
    ma_employee_state_payroll_tax: 276.00
    employee_state_payroll_tax: 276.00

- name: Massachusetts PFML 2025 contribution stops at the 176,100 Social Security wage base.
  period: 2025
  input:
    employment_income: 200_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 176_100
    # 0.46% * 176,100 = 810.06.
    ma_employee_paid_leave_contribution: 810.06

- name: Massachusetts PFML 2024 employer share applies with 25 or more covered individuals.
  period: 2024
  input:
    employment_income: 60_000
    employer_headcount: 25
    state_code: MA
  output:
    # 60% * 0.70% medical = 0.42%; 0.42% * 60,000 = 252.00.
    ma_employer_paid_leave_contribution: 252.00

- name: Massachusetts PFML 2025 employer share does not apply below 25 covered individuals.
  period: 2025
  input:
    employment_income: 60_000
    employer_headcount: 24
    state_code: MA
  output:
    ma_employer_paid_leave_contribution: 0
    # The employee share does not depend on employer size.
    ma_employee_paid_leave_contribution: 276.00

- name: Massachusetts PFML 2026 keeps the 100% family and 40% medical deduction caps.
  period: 2026
  input:
    employment_income: 100_000
    state_code: MA
  output:
    # DFML applies the Acts 2026 c. 101 cap swap from 2027. Applying s. 45's
    # 2026 date to DFML's 2026 rates would give 40% * 0.18% + 0.70% = 0.772%,
    # or 772.
    # 0.18% + 40% * 0.70% = 0.46%; 0.46% * 100,000 = 460.
    ma_employee_paid_leave_contribution: 460
    # 60% * 0.70% * 100,000 = 420.
    ma_employer_paid_leave_contribution: 420

- name: Massachusetts PFML 2027 swaps the caps and the rates, leaving the employee share at 0.46%.
  period: 2027
  input:
    employment_income: 100_000
    state_code: MA
  output:
    # 40% * 0.70% family + 100% * 0.18% medical = 0.28% + 0.18% = 0.46%.
    ma_employee_paid_leave_contribution: 460
    # 60% * 0.70% family = 0.42%; nothing of medical.
    ma_employer_paid_leave_contribution: 420

- name: Massachusetts PFML 2027 small employer remits only the 0.46% it may deduct.
  period: 2027
  input:
    employment_income: 100_000
    employer_headcount: 24
    state_code: MA
  output:
    ma_employee_paid_leave_contribution: 460
    ma_employer_paid_leave_contribution: 0

- name: Massachusetts PFML 2027 employer pays the part of the employee share it does not deduct.
  period: 2027
  input:
    employment_income: 100_000
    employer_state_payroll_premium_deduction_share: 0.5
    state_code: MA
  output:
    ma_employee_paid_leave_contribution: 230
    # 420 + 230 = 650.
    ma_employer_paid_leave_contribution: 650

- name: Massachusetts PFML 2027 partial deduction share applies to wages capped at the Social Security base.
  period: 2027
  input:
    employment_income: 250_000
    employer_state_payroll_premium_deduction_share: 0.5
    state_code: MA
  output:
    # Wages are capped at the 2027 Social Security base of 192,300.
    ma_paid_leave_taxable_wages: 192_300
    # 0.46% * 192,300 = 884.58 permitted; 0.5 * 884.58 = 442.29.
    ma_employee_paid_leave_contribution: 442.29
    # 60% * 0.70% = 0.42%; 0.42% * 192,300 = 807.66; 807.66 + 442.29 = 1,249.95.
    ma_employer_paid_leave_contribution: 1_249.95
