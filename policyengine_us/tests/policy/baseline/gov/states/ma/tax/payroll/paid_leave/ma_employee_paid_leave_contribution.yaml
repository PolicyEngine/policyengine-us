- name: Massachusetts PFML 2024 employee contribution is 0.46% of wages.
  period: 2024
  input:
    employment_income: 60_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 60_000
    # 0.18% family + 40% * 0.70% medical = 0.46%; 0.46% * 60,000 = 276.00.
    ma_employee_paid_leave_contribution: 276.00
    ma_employee_state_payroll_tax: 276.00
    employee_state_payroll_tax: 276.00

- name: Massachusetts PFML 2024 contribution stops at the 168,600 Social Security wage base.
  period: 2024
  input:
    employment_income: 200_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 168_600
    # 0.46% * 168,600 = 775.56.
    ma_employee_paid_leave_contribution: 775.56

- name: Massachusetts PFML 2025 employee contribution is 0.46% of wages.
  period: 2025
  input:
    employment_income: 60_000
    state_code: MA
  output:
    # 0.46% * 60,000 = 276.00.
    ma_employee_paid_leave_contribution: 276.00
    ma_employee_state_payroll_tax: 276.00
    employee_state_payroll_tax: 276.00

- name: Massachusetts PFML 2025 contribution stops at the 176,100 Social Security wage base.
  period: 2025
  input:
    employment_income: 200_000
    state_code: MA
  output:
    ma_paid_leave_taxable_wages: 176_100
    # 0.46% * 176,100 = 810.06.
    ma_employee_paid_leave_contribution: 810.06

- name: Massachusetts PFML 2024 employer share applies with 25 or more covered individuals.
  period: 2024
  input:
    employment_income: 60_000
    employer_headcount: 25
    state_code: MA
  output:
    # 60% * 0.70% medical = 0.42%; 0.42% * 60,000 = 252.00.
    ma_employer_paid_leave_contribution: 252.00

- name: Massachusetts PFML 2025 employer share does not apply below 25 covered individuals.
  period: 2025
  input:
    employment_income: 60_000
    employer_headcount: 24
    state_code: MA
  output:
    ma_employer_paid_leave_contribution: 0
    # The employee share does not depend on employer size.
    ma_employee_paid_leave_contribution: 276.00
