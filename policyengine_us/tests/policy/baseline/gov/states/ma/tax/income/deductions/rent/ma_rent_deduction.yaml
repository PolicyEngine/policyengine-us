# Independent 2025 expectations from M.G.L. c. 62, s. 3(B)(a)(9),
# 2025 Form 1 instructions printed page 12, and DOR rent-deduction guidance.
# https://malegislature.gov/Laws/GeneralLaws/PartI/TitleIX/Chapter62/Section3
# https://www.mass.gov/doc/2025-form-1-instructions/download
# Missing/invalid facts preserve a compatibility amount, not a verified claim.

# Certified source base is zero; do not substitute generic rent.
- name: 'Case 1, known zero qualifying rent gives zero.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SINGLE'
    ma_rent_deduction_qualifying_rent_paid: 0
    ma_rent_deduction_qualifying_rent_paid_known: true
    rent: 12_000
  output:
    ma_rent_deduction: 0

# 2025 Form 1 line 14: 6,000 x 0.5 = 3,000.
- name: 'Case 2, single filer deducts half the qualified personal base.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SINGLE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
  output:
    ma_rent_deduction: 3_000

# Half of 12,000 is 6,000; ordinary cap 4,000.
- name: 'Case 3, single filer reaches the ordinary cap.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SINGLE'
    ma_rent_deduction_qualifying_rent_paid: 12_000
    ma_rent_deduction_qualifying_rent_paid_known: true
  output:
    ma_rent_deduction: 4_000

# Half of 8,000 equals the ordinary cap.
- name: 'Case 4, head of household reaches the cap exactly.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'HEAD_OF_HOUSEHOLD'
    ma_rent_deduction_qualifying_rent_paid: 8_000
    ma_rent_deduction_qualifying_rent_paid_known: true
  output:
    ma_rent_deduction: 4_000

# Half of 10,000 is 5,000; no alternative election gives cap 2,000.
- name: 'Case 5, separate filer without an alternative retains the separate cap.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 10_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'NO_ALTERNATIVE'
  output:
    ma_rent_deduction: 2_000

# Source counterexample: min(half of 6,000, 4,000 minus 1,000) = 3,000; old numerical result was 2,000.
- name: 'Case 6, documented external spouse allocation exceeds the legacy cap.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 1_000
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
    rent: 6_000
  output:
    ma_rent_deduction: 3_000

# Own half of 5,000 is 2,500, below the remaining ceiling of 3,000.
- name: 'Case 7, own qualified rent can leave the couple ceiling unused.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 5_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 1_000
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
  output:
    ma_rent_deduction: 2_500

# Remaining ceiling 4,000 minus 1,500 = 2,500.
- name: 'Case 8, actual other spouse claim limits this return.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 1_500
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
  output:
    ma_rent_deduction: 2_500

# Known zero is distinct from unknown: min(5,000, 4,000) = 4,000.
- name: 'Case 9, an actual zero spouse claim can permit the full couple ceiling.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 10_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'VERIFIED'
    ma_rent_deduction_spouse_amount_taken: 0
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
  output:
    ma_rent_deduction: 4_000

# Remaining ceiling is zero; this return needs no above-default signature.
- name: 'Case 10, an actual full spouse claim leaves no ceiling.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
    ma_rent_deduction_qualifying_rent_paid: 6_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    ma_rent_deduction_allocation_election: 'ALTERNATIVE'
    ma_rent_deduction_allocation_documentation: 'UNKNOWN'
    ma_rent_deduction_spouse_amount_taken: 4_000
    ma_rent_deduction_spouse_amount_taken_known: true
    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
  output:
    ma_rent_deduction: 0

