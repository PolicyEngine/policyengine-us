    ma_rent_deduction_allocation_election: 'UNKNOWN'
    rent: 1_000
  output:
    ma_rent_deduction: 500

# Reform test: min(10,000, reformed 6,000), not preclipped 4,000.
- name: 'Case 17, a reformed ordinary cap is not clipped to the current cap.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SINGLE'
    ma_rent_deduction_qualifying_rent_paid: 20_000
    ma_rent_deduction_qualifying_rent_paid_known: true
    gov.states.ma.tax.income.deductions.rent.cap.SINGLE: 6_000
  output:
    ma_rent_deduction: 6_000

# Reform test: own half 5,000 limited by reformed separate cap 3,000.
- name: 'Case 18, a reformed separate cap applies without an alternative.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
