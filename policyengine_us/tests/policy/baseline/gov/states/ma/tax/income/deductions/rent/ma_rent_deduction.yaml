    gov.states.ma.tax.income.deductions.rent.cap.SEPARATE: 3_000
  output:
    ma_rent_deduction: 3_000

# Reform test: 12,000 x 0.25 = 3,000, equal to the remaining ceiling.
- name: 'Case 19, a reformed rent share applies before the couple limit.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: 'MA'
    is_tax_unit_head: true
    filing_status: 'SEPARATE'
