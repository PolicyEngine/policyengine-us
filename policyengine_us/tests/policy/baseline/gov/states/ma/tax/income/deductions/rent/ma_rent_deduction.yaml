# Only head 1,000 plus joint spouse 3,000 count; half of 4,000 is 2,000. Dependent's unknown status must not poison availability.
- name: 'Case 21, joint filer includes head and spouse payments but excludes a dependent.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        ma_rent_deduction_qualifying_rent_paid: 1_000
        ma_rent_deduction_qualifying_rent_paid_known: true
      person2:
        age: 39
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        ma_rent_deduction_qualifying_rent_paid: 3_000
        ma_rent_deduction_qualifying_rent_paid_known: true
      person3:
        age: 12
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ma_rent_deduction_qualifying_rent_paid: 60_000
        ma_rent_deduction_qualifying_rent_paid_known: false
    tax_units:
      tax_unit:
        members: ['person1', 'person2', 'person3']
        filing_status: 'JOINT'
    households:
      household:
        members: ['person1', 'person2', 'person3']
        state_code: 'MA'
  output:
    ma_rent_deduction: 2_000

# Explicit separate status counts only head payments: 1,000 x 0.5 = 500, below the default cap.
- name: 'Case 22, separate filer does not receive another member''s personal rent.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        ma_rent_deduction_qualifying_rent_paid: 1_000
        ma_rent_deduction_qualifying_rent_paid_known: true
      person2:
        age: 39
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        ma_rent_deduction_qualifying_rent_paid: 10_000
        ma_rent_deduction_qualifying_rent_paid_known: true
    tax_units:
      tax_unit:
        members: ['person1', 'person2']
        filing_status: 'SEPARATE'
        ma_rent_deduction_allocation_election: 'ALTERNATIVE'
        ma_rent_deduction_allocation_documentation: 'UNKNOWN'
        ma_rent_deduction_spouse_amount_taken: 0
        ma_rent_deduction_spouse_amount_taken_known: true
        ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
    households:
      household:
        members: ['person1', 'person2']
        state_code: 'MA'
  output:
    ma_rent_deduction: 500

# Even a shared marital unit does not approve the unsupported paired-return lane; each numerical fallback uses the old 2,000 cap.
- name: 'Case 23, two separate tax units do not infer a documentary spouse relation.'
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        rent: 6_000
        ma_rent_deduction_qualifying_rent_paid: 6_000
        ma_rent_deduction_qualifying_rent_paid_known: true
      person2:
        age: 39
        is_tax_unit_head: true
        rent: 6_000
        ma_rent_deduction_qualifying_rent_paid: 6_000
        ma_rent_deduction_qualifying_rent_paid_known: true
    tax_units:
      tax_unit1:
        members: ['person1']
        filing_status: 'SEPARATE'
        ma_rent_deduction_allocation_election: 'ALTERNATIVE'
        ma_rent_deduction_allocation_documentation: 'VERIFIED'
        ma_rent_deduction_spouse_amount_taken: 1_000
        ma_rent_deduction_spouse_amount_taken_known: true
        ma_rent_deduction_spouse_facts_status: 'VERIFIED_PAIR'
      tax_unit2:
        members: ['person2']
        filing_status: 'SEPARATE'
        ma_rent_deduction_allocation_election: 'ALTERNATIVE'
        ma_rent_deduction_allocation_documentation: 'VERIFIED'
        ma_rent_deduction_spouse_amount_taken: 3_000
        ma_rent_deduction_spouse_amount_taken_known: true
        ma_rent_deduction_spouse_facts_status: 'VERIFIED_PAIR'
    marital_units:
      marital_unit:
        members: ['person1', 'person2']
    households:
      household:
        members: ['person1', 'person2']
        state_code: 'MA'
  output:
    ma_rent_deduction: [2_000, 2_000]


