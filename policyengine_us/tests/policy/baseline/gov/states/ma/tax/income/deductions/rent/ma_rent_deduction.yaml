    ma_rent_deduction_spouse_facts_status: 'VERIFIED_EXTERNAL_RETURN'
    gov.states.ma.tax.income.deductions.rent.share: 0.25
  output:
    ma_rent_deduction: 3_000

# Reform test: min(5,000, 6,000 minus 1,000) = 5,000.
