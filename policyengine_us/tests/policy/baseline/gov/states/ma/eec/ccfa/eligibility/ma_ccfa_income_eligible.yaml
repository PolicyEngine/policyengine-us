- name: Homeless families are exempt from the income test beginning October 2023.
  period: 2023
  input:
    state_code: MA
    is_homeless: true
    ma_ccfa_countable_income: 20_000 * 12
  output:
    ma_ccfa_income_eligible:
      2023-09: false
      2023-10: true
- name: A disabled eligible child permits initial eligibility up to 85 percent SMI before 2026.
  period: 2022-02
  input:
    state_code:
      2022: MA
    ma_ccfa_enrolled: false
    ma_ccfa_eligible_child: true
    is_disabled:
      2022: true
    ma_ccfa_countable_income: 7000
    hhs_smi:
      2022: 120000
  output:
    ma_ccfa_income_eligible: true
- name: Disability does not waive the 85 percent SMI limit.
  period: 2022-02
  input:
    state_code:
      2022: MA
    ma_ccfa_enrolled: false
    ma_ccfa_eligible_child: true
    is_disabled:
      2022: true
    ma_ccfa_countable_income: 8501
