- name: Case 1, preschool-age child defaults to center-based early education.
  period: 2026-01
  input:
    age: 3
    state_code: MA
  output:
    ma_ccfa_care_provider_type: CENTER_BASED_CARE_EARLY_EDUCATION

- name: Case 2, infant defaults to center-based early education.
  period: 2026-01
  input:
    age: 0.5
    state_code: MA
  output:
    ma_ccfa_care_provider_type: CENTER_BASED_CARE_EARLY_EDUCATION

- name: Case 3, school-age child defaults to center-based school age.
  period: 2026-01
  input:
    age: 6
    state_code: MA
  output:
    ma_ccfa_care_provider_type: CENTER_BASED_CARE_SCHOOL_AGE

- name: Case 4, child at the school age threshold defaults to center-based school age.
  period: 2026-01
  input:
    age: 5
    state_code: MA
  output:
    ma_ccfa_care_provider_type: CENTER_BASED_CARE_SCHOOL_AGE
