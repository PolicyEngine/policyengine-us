# These cases exercise rate lookup and the final dollar amount together, so a
# second part-time reduction in either step must fail the expected payment.
- name: Case 7, center-based before school care uses the schedule price without another reduction.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 8
    county_str: BERKSHIRE_COUNTY_MA
    ma_ccfa_schedule_type: BEFORE_ONLY
    childcare_attending_days_per_month: 20
    childcare_hours_per_day: 1
    state_code: MA
  output:
    ma_ccfa_uncapped_daily_payment: 11.8
    ma_ccfa_reimbursement_ratio: 1
    # 11.8 * 20; no additional 60% multiplier for the reported short day.
    ma_ccfa_maximum_reimbursement: 236

