# The before and after school columns are partial-day rates, so the part-time
# ratio does not apply to them.
- name: Case 8, school-age child in center-based after school care keeps the full after school rate.
  period: 2026-01
  input:
    age: 8
    ma_ccfa_schedule_type: AFTER_ONLY
    childcare_hours_per_day: 3
    state_code: MA
  output:
    ma_ccfa_reimbursement_ratio: 1

- name: Case 9, school-age child in center-based before and after school care keeps the full rate.
  period: 2026-01
  input:
    age: 8
    ma_ccfa_schedule_type: BEFORE_AND_AFTER
    childcare_hours_per_day: 4
    state_code: MA
  output:
    ma_ccfa_reimbursement_ratio: 1

- name: Case 10, school-age child on the full day rate for three hours is part time.
