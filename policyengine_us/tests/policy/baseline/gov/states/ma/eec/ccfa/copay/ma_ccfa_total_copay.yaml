- name: Case 1, applicant has an eligible child, no income. 
  period: 2025-01
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 0
      person2:
        age: 1
        ma_ccfa_eligible_child: true
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    ma_ccfa_total_copay: 0

- name: Case 2, applicant has an eligible child, $1800 monthly income. 
  period: 2025-01
  absolute_error_margin: 0.3
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 1_800 * 12
      person2:
        age: 1
        ma_ccfa_eligible_child: true
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    ma_ccfa_total_copay: 3.88

- name: Case 3, household of 4, $3800 monthly income. 
  period: 2025-01
  absolute_error_margin: 0.3
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 3_800 * 12
      person2:
        age: 1
        ma_ccfa_eligible_child: true
      person3:
        age: 3
        ma_ccfa_eligible_child: true
      person4:
        age: 5
        ma_ccfa_eligible_child: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MA
  output:
    ma_ccfa_total_copay: 112.35
    # 64.2 + 64.2*0.5 + 64.2*0.25

- name: Case 4, TAFDC recipient with children has zero copay.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
        employment_income_before_lsr: 2_000 * 12
      person2:
        age: 2
        ma_ccfa_eligible_child: true
      person3:
        age: 4
        ma_ccfa_eligible_child: true
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ma_tafdc_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
  output:
    ma_ccfa_total_copay: 0

- name: Homeless families have no parent fee starting October 2023.
  period: 2023
  input:
    state_code: MA
    is_homeless: true
    ma_tafdc_eligible: false
    ma_ccfa_base_copay: 100 * 12
    ma_ccfa_eligible_child: true
  output:
    ma_ccfa_total_copay:
      2023-09: 100
      2023-10: 0

- name: Nonparent caregiver families owe no fee even with historical dependent income.
  period: 2022-02
  input:
    state_code: {2022: MA}
    ma_ccfa_is_nonparent_caregiver_family: {2022: true}
    ma_ccfa_base_copay: 100
    ma_ccfa_eligible_child: true
    ma_tafdc_eligible: false
  output:
    ma_ccfa_total_copay: 0

- name: Part-time authorization halves each child's fee after the age-ordered sibling discount.
  period: 2026-01
  input:
    people:
      parent:
        age: 35
        ma_ccfa_eligible_child: false
      older_child:
        age: 10
        ma_ccfa_eligible_child: true
        ma_ccfa_has_part_time_authorization: true
      younger_child:
        age: 2
        ma_ccfa_eligible_child: true
      middle_child:
        age: 5
        ma_ccfa_eligible_child: true
        ma_ccfa_has_part_time_authorization: true
    spm_units:
      spm_unit:
        members: [parent, older_child, younger_child, middle_child]
        ma_ccfa_base_copay: 100
        ma_tafdc_eligible: false
    households:
      household:
        members: [parent, older_child, younger_child, middle_child]
        state_code: MA
  output:
    # Youngest 100; second youngest 100 * .5 * .5; oldest 100 * .25 * .5.
    ma_ccfa_total_copay: 137.5
