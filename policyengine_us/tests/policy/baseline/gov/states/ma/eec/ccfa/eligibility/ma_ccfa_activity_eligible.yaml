- name: Case 13, other approved activities use the existing CCDF input.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 4
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        meets_ccdf_activity_test: true
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    ma_ccfa_activity_eligible: true
    is_homeless: false

