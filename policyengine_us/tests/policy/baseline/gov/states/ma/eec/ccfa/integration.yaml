- name: Case 8, missing hours use full-time reimbursement and copay when no schedule is supplied.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 30
      person2:
        age: 3
        childcare_attending_days_per_month: 20
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 14400
        ma_ccfa_base_copay: 100
    households:
      household:
        members: [person1, person2]
        state_code: MA
        county_str: BERKSHIRE_COUNTY_MA
  output:
    ma_ccfa_eligible: true
    ma_ccfa_is_part_time_care: [false, false]
    ma_ccfa_maximum_reimbursement: [0, 1175.6]
    ma_ccfa_copay_person: [0, 100]
    ma_ccfa_total_copay: 100
    # min(14400 / 12, 58.78 * 20) - 100
    ma_ccfa: 1075.6

- name: Case 9, missing hours retain part-time reimbursement and copay for school-age family care after school.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 30
      person2:
        age: 8
        childcare_attending_days_per_month: 20
        ma_ccfa_care_provider_type: FAMILY_CHILD_CARE
        ma_ccfa_schedule_type: AFTER_ONLY
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 14400
        ma_ccfa_base_copay: 100
    households:
      household:
        members: [person1, person2]
        state_code: MA
