- name: Case 1, homeless family receives care despite assets and income.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        employment_income_before_lsr: 180000
      person2:
        age: 4
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
        ma_ccfa_uncapped_daily_payment: 50
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 18000
        ma_ccfa_base_copay: 100
        hhs_smi: 120000
        spm_unit_assets: 2000000
    households:
      household:
        members: [person1, person2]
        state_code: MA
        is_homeless: true
  output:
    ma_ccfa_countable_income: 15000
    ma_ccfa_income_eligible: true
    ma_ccfa_asset_eligible: true
    ma_ccfa_activity_eligible: true
    ma_ccfa_eligible: true
    ma_ccfa_maximum_reimbursement: [0, 1000]
    ma_ccfa_total_copay: 0
    ma_ccfa: 1000

