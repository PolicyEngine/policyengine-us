    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 12000
    households:
      household:
        members: [person1, person2]
        state_code: MA
        county_str: BERKSHIRE_COUNTY_MA
