    ma_ccfa_maximum_reimbursement: [0, 0, 1000]
    ma_ccfa_copay_person: [0, 0, 100]
    ma_ccfa_total_copay: 100
    # Full-day reimbursement: $50 x 20 days = $1,000; subtract the $100 copay.
    ma_ccfa: 900
