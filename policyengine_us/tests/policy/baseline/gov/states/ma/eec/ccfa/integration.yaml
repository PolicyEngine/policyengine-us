      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_pre_subsidy_childcare_expenses: 18000
        ma_ccfa_base_copay: 100
        hhs_smi: 120000
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
  output:
    ma_ccfa_activity_eligible: false
    ma_ccfa_asset_eligible: true
    ma_ccfa_income_eligible: true
    ma_ccfa_eligible_child: [false, false, true]
