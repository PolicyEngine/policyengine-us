- name: Case 1, youngest short day and full day siblings.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 2
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 5
      person3:
        age: 3
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
      person4:
        age: 4
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        ma_ccfa_base_copay: 100
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MA
  output:
    ma_ccfa_copay_person: [0, 50, 50, 25]
    ma_ccfa_total_copay: 125

