- name: Case 9, same-age siblings take distinct ranks and a child not attending takes none.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 1
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 0
      person3:
        age: 3
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
      person4:
        age: 3
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
      person5:
        age: 6
        ma_ccfa_maximum_reimbursement: 1000
        childcare_attending_days_per_month: 20
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4, person5]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        ma_ccfa_base_copay: 100
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: MA
  output:
    # The twins rank youngest and second youngest, so they pay the full and
    # half fee. The six-year-old is the third child and pays a quarter.
    ma_ccfa_copay_person: [0, 0, 100, 50, 25]
    ma_ccfa_total_copay: 175
