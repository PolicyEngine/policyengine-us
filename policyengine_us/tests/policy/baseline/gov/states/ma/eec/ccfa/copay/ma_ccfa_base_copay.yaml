    # level 3 spans 5,856-6,281.
    ma_ccfa_copay_level: 3
    ma_ccfa_base_copay: 25.41
    # (6000 - 5429) * 0.0445

- name: Case 16, FY2026 family of 2 far above the top bracket is capped at fee level 28.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    spm_unit_size: 2
    ma_ccfa_countable_income: 10_000
    state_code: MA
  output:
    # Level 28 starts at 7,770 (level 27 ceiling 7,769). The uncapped
    # bracket count would put 10,000 at level 37; the fee stays at the
    # level 28 rate of 15.6 percent.
    ma_ccfa_copay_level: 28
    ma_ccfa_base_copay: 1_284.97
    # (10000 - 1763) * 0.156

# === The FY2025 -> FY2026 bracket change at a second family size. ===

