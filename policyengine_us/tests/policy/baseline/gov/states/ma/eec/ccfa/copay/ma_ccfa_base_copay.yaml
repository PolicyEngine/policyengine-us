  output:
    # Level 3 spans 4,039-4,480.
    ma_ccfa_copay_level: 3
    ma_ccfa_base_copay: 19.71
    # (4039 - 3596) * 0.0445

- name: Case 15, FY2026 family of 10 uses the narrower large-family bracket.
