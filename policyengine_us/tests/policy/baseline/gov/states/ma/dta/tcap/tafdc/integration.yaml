- name: Case 1, applicant is pregnant, eaedc ineligible
  period: 2022
  input:
    people:
      person1:
        age: 20
        is_pregnant: true
        current_pregnancy_month: 6
        ma_tcap_gross_earned_income: 0
        alimony_income: 0 
        pension_income: 0 
        social_security: 0
    spm_units:
      spm_unit:
        members: [person1]
        ma_tafdc_immigration_status_eligible: true
        spm_unit_size: 1
        ma_eaedc_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MA
        is_in_public_housing: false
  output:
    # Payment standard for 2022 (1-person, private housing):
    # - Jan-Sep 2022: 506 × 9 = 4554
    # - Oct-Dec 2022: 553 × 3 = 1659
    # - Total: 6213
    ma_tafdc: 6213
    ma_tafdc_eligible: true
    ma_tafdc_payment_standard: 6213
    ma_tafdc_dependent_care_deduction: 0
    ma_tafdc_applicable_income_grant_amount: 0

- name: Case 2, applicant has a dependent child that still goes to school.
  period: 2022
  absolute_error_margin: 0.5
  input:
    people:
      person1:
        age: 40
        is_pregnant: false
        current_pregnancy_month: 0
        employment_income_before_lsr: 10_000
        alimony_income: 0
        pension_income: 0
        social_security: 0
        weekly_hours_worked_before_lsr: 10
      person2:
        age: 18
        is_in_secondary_school: true
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 3_000
        weekly_hours_worked_before_lsr: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        ma_tafdc_immigration_status_eligible: true
        spm_unit_size: 2
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
        is_in_public_housing: false
  output:
    ma_tcap_gross_earned_income: [10_000, 0]
    # person2 is an input dependent, so person1 files alone (head of
    # household), not jointly with their child. The whole dependent care
    # deduction therefore applies to person1's earnings; before the head and
    # spouse fix, person2 was inferred as spouse and the deduction was halved.
    ma_tafdc_countable_earned_income: [1_636, 0]
    ma_tafdc_applicable_income_grant_amount: 1_636
    ma_tafdc_eligible: true
    # Payment standard for 2022 (2-person, private housing):
    # - Jan-Sep 2022: 629 × 9 = 5661
    # - Oct-Dec 2022: 688 × 3 = 2064
    # - Total: 7725
    ma_tafdc_payment_standard: 7725
    ma_tafdc_eligible_dependent: [False, True]
    ma_tafdc_dependent_care_deduction: 528
    # Work-related deduction: 10000 - 200*12 = 7600
    # 50% disregard less dependent care: 7600*0.5 - 44*12 = 3800 - 528 = 3272
    # Full disregard for the first 6 months, so countable = 3272 * 6/12 = 1636
    # 7725 - 1636 + 350 = 6439 (clothing allowance is 350 for 2022)
    ma_tafdc: 6439

- name: Case 3, applicant and his spouse has 1 dependent child.
  period: 2022

  input:
    people:
      person1:
        age: 40
        is_pregnant: false
        current_pregnancy_month: 0
        employment_income_before_lsr: 30_000
        alimony_income: 0
        pension_income: 0
        social_security: 0
        weekly_hours_worked_before_lsr: 4
      person2:
        age: 40
        is_pregnant: false
        current_pregnancy_month: 0
        employment_income_before_lsr: 20_000
        alimony_income: 0
        pension_income: 0
        social_security: 0
        weekly_hours_worked_before_lsr: 4
      person3:
        age: 18
        is_in_secondary_school: true
        is_tax_unit_dependent: true
        pre_subsidy_childcare_expenses: 3_000
        weekly_hours_worked_before_lsr: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        ma_tafdc_immigration_status_eligible: true
        spm_unit_size: 3
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
        is_in_public_housing: false
  output:
    ma_tcap_gross_earned_income: [30_000, 20_000, 0]
    ma_tafdc_eligible: false
    # Payment standard for 2022 (3-person, private housing):
    # - Jan-Sep 2022: 753 × 9 = 6777
    # - Oct-Dec 2022: 823 × 3 = 2469
    # - Total: 9246
    ma_tafdc_payment_standard: 9246
    ma_tafdc_eligible_dependent: [False, False, True]
    ma_tafdc_dependent_care_deduction: 528
    ma_tafdc: 0
    # Income is too high for TAFDC
