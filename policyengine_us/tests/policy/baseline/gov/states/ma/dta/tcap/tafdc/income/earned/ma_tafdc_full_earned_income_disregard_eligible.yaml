# Conditional annual-component checks, not full TAFDC eligibility.
# Acts2016ch133 sections124/125 provide the predecessor50% disregard;
# Acts2018ch154 sections55/113 introduce six100% months from July1,2018.
# https://malegislature.gov/Laws/SessionLaws/Acts/2018/Chapter154
# The2018 annual case preserves the existing approximation. It does not
# establish Jan-June2018 legality or any employment/receipt/usage history.
# Financial income and FPG below are independent annual upstream premises;
# this file does not derive official year-specific FPG amounts.

