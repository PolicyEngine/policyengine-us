- name: One earner on a joint return, annual grant
  period: 2026
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
      child:
        age: 1
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    marital_units:
      marital_unit:
        members: [parent1, parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    # $200 a month after the deductions, counted for the 6 months after the
    # six-month 100% disregard: $200 x 6 = $1,200.
    ma_tafdc_countable_earned_income: [1_200, 0, 0]
    # Payment standard $901 x 12 = $10,812; ($901 - $1,200 / 12) x 12 = $9,612,
    # plus the $500 clothing allowance for the child.
    ma_tafdc: 10_112

- name: Two equal earners on separate returns, annual grant
  period: 2026
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 8_400
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
        employment_income_before_lsr: 8_400
        weekly_hours_worked_before_lsr: 40
      child:
        age: 1
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    # $50 (payer) and $250 a month for the 6 months after the 100% disregard:
    # $300 and $1,500.
    ma_tafdc_countable_earned_income: [300, 1_500, 0]
    # ($901 - $1,800 / 12) x 12 = $9,012, plus the $500 clothing allowance.
    ma_tafdc: 9_512

