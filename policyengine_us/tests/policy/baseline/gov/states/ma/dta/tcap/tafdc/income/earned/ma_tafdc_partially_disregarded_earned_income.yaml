- name: 10k in employment income, with a dependent care deduction
  period: 2023
  input:
    ma_tafdc_dependent_care_deduction: 400
    employment_income_before_lsr: 10_000
    self_employment_income_before_lsr: 0
    state_code: MA
  output:
    # $200 monthly disregard -> 10,000 - 2,400 = 7,600
    # 50% disregard applied -> 7,600 * 0.5 = 3,800
    # dependent care deduction -> 3,800 - 400 = 3,400
    ma_tafdc_partially_disregarded_earned_income: 3_400

- name: Income fully reduced
  period: 2023
  input:
    ma_tafdc_dependent_care_deduction: 400
    employment_income_before_lsr: 2_000
    self_employment_income_before_lsr: 500
    state_code: MA
  output:
    ma_tafdc_partially_disregarded_earned_income: 0

- name: No income
  period: 2023
  input:
    ma_tafdc_dependent_care_deduction: 1_000
    employment_income_before_lsr: 0
    self_employment_income_before_lsr: 0
    state_code: MA
  output:
    ma_tafdc_partially_disregarded_earned_income: 0

# 106 CMR 704.275(A): an employed applicant or client "may receive a deduction
# from income equal to the expenditure for the care of a dependent child", made
# after the 50% disregard, and "the amount allowed for dependent care is the
# actual expenditure for dependent care ... or the maximum allowable deduction,
# whichever is less." DTA's BEACON help uses it "as a deduction for the client
# incurring the expense". The unit's deduction is subtracted once, from the
# earnings of the member who pays (ma_tafdc_dependent_care_payer). A part above
# the payer's earnings does not reduce another member's earnings. Unless a case
# names the payer, the payer is the head or spouse with the highest gross
# earnings (the first such member when earnings are equal).
# Unless a case says otherwise, the child is age 1 and the unit works full
# time, so the maximum is $200 a month; care costs $3,000 a year ($250 a
# month), so the unit's deduction is $200 a month.

- name: One earner on a joint return, the deduction is subtracted in full once
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000  # $1,000/month
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
      child:
        age: 1
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    marital_units:
      marital_unit:
        members: [parent1, parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    ma_tafdc_dependent_care_deduction: 200
    ma_tafdc_dependent_care_payer: [true, false, false]
    # parent1: ($1,000 - $200 work expense) x 0.5 = $400; $400 - $200 = $200.
    # Before, half of the $200 was assigned to parent2, who has no earnings,
    # and was lost: $400 - $100 = $300.
    ma_tafdc_partially_disregarded_earned_income: [200, 0, 0]

- name: Two equal earners on separate returns, the deduction is subtracted once from the payer
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 8_400  # $700/month
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
        employment_income_before_lsr: 8_400  # $700/month
        weekly_hours_worked_before_lsr: 40
      child:
        age: 1
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    ma_tafdc_dependent_care_deduction: 200
    # Equal earnings, so the payer is the first of the two.
    ma_tafdc_dependent_care_payer: [true, false, false]
    # Each: ($700 - $200) x 0.5 = $250. parent1 pays: $250 - $200 = $50;
    # parent2 keeps $250. Unit total $300. Before, each earner had the full
    # $200 subtracted: $50 each, $400 deducted for a $200 cost.
    ma_tafdc_partially_disregarded_earned_income: [50, 250, 0]

- name: Two unequal earners, the payer is not named, so the higher earner pays
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000  # $1,000/month
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
        employment_income_before_lsr: 4_800  # $400/month
        weekly_hours_worked_before_lsr: 40
      child:
        age: 1
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    ma_tafdc_dependent_care_payer: [true, false, false]
    # parent1: ($1,000 - $200) x 0.5 = $400; parent2: ($400 - $200) x 0.5 = $100.
    # parent1 pays: $400 - $200 = $200; parent2 keeps $100. Unit total $300.
    ma_tafdc_partially_disregarded_earned_income: [200, 100, 0]

- name: Two unequal earners, the lower earner pays and cannot use the whole deduction
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000  # $1,000/month
        weekly_hours_worked_before_lsr: 40
        ma_tafdc_dependent_care_payer: false
      parent2:
        age: 30
        employment_income_before_lsr: 4_800  # $400/month
        weekly_hours_worked_before_lsr: 40
        ma_tafdc_dependent_care_payer: true
      child:
        age: 1
        ma_tafdc_dependent_care_payer: false
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    ma_tafdc_dependent_care_deduction: 200
    # parent1: $400 after the disregard; parent2: $100 after the disregard.
    # parent2 pays: max($100 - $200, 0) = $0. The other $100 of the deduction
    # does not reduce parent1's earnings: parent1 keeps $400. Unit total $400.
    ma_tafdc_partially_disregarded_earned_income: [400, 0, 0]

- name: Two members set as payers share the deduction equally
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000  # $1,000/month
        weekly_hours_worked_before_lsr: 40
        ma_tafdc_dependent_care_payer: true
      parent2:
        age: 30
        employment_income_before_lsr: 4_800  # $400/month
        weekly_hours_worked_before_lsr: 40
        ma_tafdc_dependent_care_payer: true
      child:
        age: 1
        ma_tafdc_dependent_care_payer: false
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    # $200 / 2 = $100 each. parent1: $400 - $100 = $300;
    # parent2: $100 - $100 = $0. Unit total $300.
    ma_tafdc_partially_disregarded_earned_income: [300, 0, 0]

- name: Two earners with two children below the cap, the higher earner pays
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 12_000  # $1,000/month
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
        employment_income_before_lsr: 4_800  # $400/month
        weekly_hours_worked_before_lsr: 40
      child1:
        age: 1
      child2:
        age: 5
    tax_units:
      tax_unit1:
        members: [parent1, child1, child2]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 4_200
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: MA
  output:
    # Care is $4,200 / 12 = $350 a month, $175 for each child. Child age 1:
    # min($200, $175) = $175; child age 5: min($175, $175) = $175; total $350.
    ma_tafdc_dependent_care_deduction: 350
    # parent1: ($1,000 - $200) x 0.5 = $400; parent2: ($400 - $200) x 0.5 = $100.
    # parent1 pays: $400 - $350 = $50; parent2 keeps $100. Unit total $150.
    # Before, each earner had the full $350 subtracted: $50 and $0.
    ma_tafdc_partially_disregarded_earned_income: [50, 100, 0, 0]

- name: Two earners whose earnings after the disregard are below the deduction
  period: 2026-01
  input:
    people:
      parent1:
        age: 30
        employment_income_before_lsr: 3_600  # $300/month
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 30
        employment_income_before_lsr: 3_600  # $300/month
        weekly_hours_worked_before_lsr: 40
      child:
        age: 1
    tax_units:
      tax_unit1:
        members: [parent1, child]
      tax_unit2:
        members: [parent2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        is_tanf_enrolled: true
        spm_unit_pre_subsidy_childcare_expenses: 3_000
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MA
  output:
    ma_tafdc_dependent_care_deduction: 200
    # Each: ($300 - $200) x 0.5 = $50. parent1 pays (first of two equal
    # earners): max($50 - $200, 0) = $0. The other $150 of the deduction does
    # not reduce parent2's earnings: parent2 keeps $50. Unit total $50.
    ma_tafdc_partially_disregarded_earned_income: [0, 50, 0]

