- name: Case 13, Income and resources belonging to SSI people are excluded.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        person_id: 1
        # 20 hours a week at the $7.25 minimum wage: 7.25 * 20 * 52 = 7,540,
        # or 628.33 a month. SSI countable earnings = (628.33 - 20 - 65) / 2
        # = 271.67, so SSI = 994 - 271.67 = 722.33.
        ssi: 722.33
        employment_income: 7_540
        # Below the $2,000 SSI resource limit, above the $1,000 CTS limit.
        ssi_countable_resources: 1_500
      person2:
        age: 8
        person_id: 2
        parent_1_id: 1
    marital_units:
      parent:
        members: [person1]
      child0:
        members: [person2]
    families:
      unit:
        members: [person1, person2]
    households:
      home:
        members: [person1, person2]
        state_code: WI
        county: DANE_COUNTY_WI
  output:
    # The SSI parent is outside the group, so the $628.33 of monthly wages
    # (above the $311 size-1 net limit) and $1,500 of resources (above the
    # $1,000 limit) are not counted: the child alone has $0, so $275.
    wi_cts: [275, 0]

