- name: Case 9, spouse in a Medicaid nursing home past 90 days leaves the other spouse on the individual rate.
  period: 2026-05
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2026: 70
      person2:
        age:
          2026: 70
        # Medicaid-paid nursing home stay without an authorized continuation.
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: WI
  output:
    # One spouse in a medical facility: benefits are computed separately
    # (20 CFR 416.414(b)(3)).
    ssi_couple_computation_applies: [false, false]
    # person1 gets the individual FBR, 994; person2 gets the facility rate, 30.
    ssi: [994, 30]
    # person2's facility stay excludes them from the state payment.
    wi_ssp_eligible: [true, false]
    # Both spouses are aged, so neither is an SSI-ineligible spouse; one
    # state-eligible spouse without an ineligible spouse gets the individual
    # rate, 92.16, not the 143.47 ineligible-spouse rate.
    wi_ssp_regular: [92.16, 0]
    wi_ssi_e: [0, 0]
    wi_cts: [0, 0]
    wi_ssp: [92.16, 0]

- name: Case 10, SPM-unit benefits include SSI, the regular supplement and SSI-E.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: WI
    age: 70
    wi_ssi_e_certified: true
    # The household does not take up FoodShare, so the benefit total holds
    # SSI and the state supplement only.
    takes_up_snap_if_eligible: false
  output:
    # 994 * 12 = 11,928.
    ssi: 11_928
    # 4 * 83.78 + 8 * 92.16 = 335.12 + 737.28 = 1,072.40.
    wi_ssp_regular: 1_072.4
    # 4 * 95.99 + 8 * 105.59 = 383.96 + 844.72 = 1,228.68.
    wi_ssi_e: 1_228.68
    # No children, so no Caretaker Supplement.
    wi_cts: 0
    # 1,072.40 + 1,228.68 = 2,301.08.
    wi_ssp: 2_301.08
    household_state_benefits: 2_301.08
    # FoodShare counts the regular supplement but not SSI-E:
    # 11,928 + 1,072.40 = 13,000.40.
    snap_unearned_income: 13_000.4
    snap: 0
    # 11,928 SSI + 2,301.08 state supplement = 14,229.08.
    spm_unit_benefits: 14_229.08
