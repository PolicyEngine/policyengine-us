- name: Case 7, small SSI payment gets full state amount.
  period: 2026-05
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: WI
    age:
      2026: 65
    # Divorced-spouse benefit at SSA's August 2026 average for spouses of retired
    # workers, $986.70 a month (Monthly Statistical Snapshot, Table 2):
    # 986.70 * 12 = 11,840.40.
    social_security_dependents:
      2026: 11_840.4
  output:
    # SSI = 994 - (986.70 - 20) = 27.30.
    ssi: 27.3
    # Any federal SSI payment brings the full individual rate.
    wi_ssp: 92.16

- name: Case 8, no federal payment no new state eligibility.
  period: 2026-05
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: WI
    age:
      2026: 65
    # SSA's August 2026 average retired-worker benefit, $2,087.52 a month
    # (Monthly Statistical Snapshot, Table 2): 2,087.52 * 12 = 25,050.24.
    social_security_retirement:
      2026: 25_050.24
  output:
    # Countable 2,087.52 - 20 = 2,067.52 exceeds the 994 FBR, so SSI is 0.
    ssi: 0
    wi_ssp: 0

