- name: Case 16, reported SSI receipt qualifies when modeled SSI is zero.
  period: 2026-05
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: WI
    # No aged, blind or disability input, so the model computes no SSI.
    age:
      2026: 45
    receives_ssi: true
  output:
    ssi: 0
    wi_ssp_eligible: true
    # Individual rate from May 2026.
    wi_ssp: 92.16

- name: Case 17, certified SSI-E recipient in the household of another gets no SSI-E.
  period: 2026-05
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: WI
    age:
      2026: 65
    ssi_lives_in_another_persons_household: true
    ssi_receives_shelter_from_others_in_household: true
    ssi_others_pay_all_meals: true
    wi_ssi_e_certified: true
  output:
    # One-third reduction: 994 * (1 - 1/3) = 662.67.
    ssi: 662.67
    # P-20679 3.1.1: the household-of-another arrangement bars SSI-E.
    wi_ssi_e: 0
    # Regular individual rate only.
    wi_ssp: 92.16
