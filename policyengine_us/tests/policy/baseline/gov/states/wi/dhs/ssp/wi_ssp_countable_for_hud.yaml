- name: Case 13, SSI disability criteria alone establish the HUD disability for the home-care exclusion.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        person_id: 1
        # SSI-disabled through the SSI criteria, with no is_disabled input.
        meets_ssi_disability_criteria: true
        is_household_head: true
        pre_subsidy_rent: 12_000
        wi_ssi_e_certified: true
        wi_ssi_e_for_home_care: true
      person2:
        age: 30
        person_id: 2
        parent_1_id: 1
        is_household_head: false
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
        receives_housing_assistance: true
    households:
      home:
        members: [person1, person2]
        state_code: WI
        county_fips: '55079'
        bedrooms: 2
        tenant_pays_utilities: false
  output:
    # Meets the SSI disability criteria with no earnings, so no SGA.
    is_ssi_disabled: [true, false]
    # 4 * 95.99 + 8 * 105.59 = 1,228.68.
    wi_ssi_e: [1_228.68, 0]
    # 1,072.40 regular + 1,228.68 SSI-E - 1,228.68 excluded = 1,072.40.
    wi_ssp_countable_for_hud: [1_072.4, 0]
    # 994 * 12 = 11,928 SSI + 1,072.40 = 13,000.40.
    hud_annual_income: 13_000.4
    # TTP = 0.3 * (13,000.40 - 550 elderly/disabled deduction) = 3,735.12;
    # assistance = 12,000 rent - 3,735.12 = 8,264.88.
    housing_assistance: 8_264.88
