# HUD PIH 2023-27 G.11 and PIH 2024-38 IV.B.1 exclude qualifying assisted-home care.
# Positive home-care flags certify that county-approved adult-child care enables continued residence.
# Annual SSI-E = 4*95.99 + 8*105.59 = 1228.68; regular SSI remains counted.
# https://www.hud.gov/sites/dfiles/OCHCO/documents/2023-27pihn.pdf#page=81
- name: Case 1, qualifying caregiver in the assisted SPM unit need not share the Census family.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        person_id: 1
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_household_head: true
        pre_subsidy_rent: 12_000
        wi_ssi_e_certified: true
        wi_ssi_e_for_home_care: true
        wi_ssi_e_caregiver_id: 2
      person2:
        age: 30
        person_id: 2
        parent_1_id: 1
        is_household_head: false
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
        receives_housing_assistance: true
    households:
      home:
        members: [person1, person2]
        state_code: WI
        county_fips: '55079'
        bedrooms: 2
        tenant_pays_utilities: false
  output:
    wi_ssi_e: [1_228.68, 0]
    wi_ssp_countable_for_hud: [1_072.4, 0]
    hud_annual_income: 13_000.4
    housing_assistance: 8_264.88

