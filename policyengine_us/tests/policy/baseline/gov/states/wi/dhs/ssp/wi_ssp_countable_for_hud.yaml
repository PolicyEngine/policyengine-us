- name: Case 4, Social Security disability benefits establish the HUD disability for an aged recipient.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        # Aged SSI recipient still on SSDI before full retirement age.
        age: 66
        person_id: 1
        is_household_head: true
        pre_subsidy_rent: 12_000
        # Wisconsin average Social Security benefit of disabled workers who also
        # receive SSI, $698.90 a month (SSA SSI Annual Statistical Report 2024,
        # Table 16): 698.90 * 12 = 8,386.80.
        social_security_disability: 8_386.8
        wi_ssi_e_certified: true
        wi_ssi_e_for_home_care: true
      person2:
        age: 30
        person_id: 2
        parent_1_id: 1
        is_household_head: false
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    tax_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    spm_units:
      unit:
        members: [person1, person2]
        receives_housing_assistance: true
    households:
      home:
        members: [person1, person2]
        state_code: WI
        county_fips: '55079'
        bedrooms: 2
        tenant_pays_utilities: false
  output:
    # SSI = 994 - (698.90 - 20) = 315.10 a month; 315.10 * 12 = 3,781.20.
    ssi: [3_781.2, 0]
    # SSDI receipt passes the HUD disability test: 2,301.08 - 1,228.68 = 1,072.40.
    wi_ssp_countable_for_hud: [1_072.4, 0]

