- name: Case 1, default to CSJ with no special conditions.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
      person2:
        age: 5
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    wi_works_placement: CSJ

- name: Case 2, CMC with a newborn.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
        is_pregnant: false
      person2:
        age: 0
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # Age 0 years = 0 months <= 2-month limit (8 weeks, Wis. Stat. 49.148(1m)(a)1)
    wi_works_placement: CMC

- name: Case 3, CMC with an infant 1.5 months old.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.125
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.125 years x 12 = 1.5 months <= 2
    wi_works_placement: CMC

- name: Case 4, CSJ with an infant 3 months old.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.25
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.25 years x 12 = 3 months > 2
    wi_works_placement: CSJ

- name: Case 5, CSJ with a child aged 1 year.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 1
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 1 year x 12 = 12 months > 2
    wi_works_placement: CSJ

- name: Case 6, CSJ with a child aged 2 years.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 2
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 2 years x 12 = 24 months > 2
    wi_works_placement: CSJ

- name: Case 7, ARP with pregnant person in third trimester.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
        is_pregnant: true
        current_pregnancy_month: 7
    households:
      household1:
        members: [person1]
        state_code: WI
  output:
    wi_works_placement: ARP

- name: Case 8, CSJ with pregnant person not in third trimester.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
        is_pregnant: true
        current_pregnancy_month: 6
    households:
      household1:
        members: [person1]
        state_code: WI
  output:
    wi_works_placement: CSJ

- name: Case 9, CMC takes priority over ARP.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
        is_pregnant: true
        current_pregnancy_month: 8
      person2:
        age: 0
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    wi_works_placement: CMC
