- name: Case 1, default to CSJ with no special conditions.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
      person2:
        age: 5
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    wi_works_placement: CSJ

- name: Case 2, CMC with a newborn.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
        is_pregnant: false
      person2:
        age: 0
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0 years x 52 = 0 weeks <= 8-week limit (Wis. Stat. 49.148(1m)(a)1)
    wi_works_placement: CMC

- name: Case 3, CMC with an infant 6.5 weeks old.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.125
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.125 years x 52 = 6.5 weeks <= 8
    wi_works_placement: CMC

- name: Case 4, CMC with an infant 56 days old.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.1533
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.1533 years (56 days) x 52 = 7.97 weeks <= 8. W-2 Manual 7.4.3.4
    # ends CMC on day 56 (7 days x 8 weeks).
    wi_works_placement: CMC

- name: Case 5, CSJ with an infant 57 days old.
  period: 2025-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.1561
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.1561 years (57 days) x 52 = 8.12 weeks > 8. A 2-month limit would
    # give CMC here (0.1561 x 12 = 1.87 months).
    wi_works_placement: CSJ

- name: Case 6, CSJ with an infant 13 weeks old.
  period: 2025-01
