- name: Case 9, CMC with an infant 10 weeks old in January 2011.
  period: 2011-01
  input:
    people:
      person1:
        age: 25
      person2:
        age: 0.19
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 0.19 years x 52 = 9.88 weeks <= 12. The limit was 12 weeks until
    # 2011 Wis. Act 32 cut it to 8 weeks from January 1, 2012.
    wi_works_placement: CMC

