- name: Case 1, a lone parent's usual hours count.
  period: 2025
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 25
      person2:
        age: 5
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    wi_works_unsubsidized_hours: 25

- name: Case 2, hours average over the weeks of the year.
  period: 2025
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
        weeks_worked: 13
      person2:
        age: 5
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    # 40 hours x 13 weeks / 52 weeks.
    wi_works_unsubsidized_hours: 10

- name: Case 3, the parent with fewer hours sets the hours.
  period: 2025
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 28
        weekly_hours_worked_before_lsr: 12
      person3:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household1:
        members: [person1, person2, person3]
        state_code: WI
  output:
    wi_works_unsubsidized_hours: 12

- name: Case 4, a working teenager's hours don't count.
  period: 2025
  input:
    people:
      person1:
        age: 30
      person2:
        age: 16
        weekly_hours_worked_before_lsr: 20
    households:
      household1:
        members: [person1, person2]
        state_code: WI
  output:
    wi_works_unsubsidized_hours: 0
