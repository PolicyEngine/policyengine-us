- name: Case 1, resources below limit.
  period: 2025
  input:
    state_code: WI
    wi_works_countable_resources: 2_000
  output:
    wi_works_resources_eligible: true

- name: Case 2, resources at exactly limit.
  period: 2025
  input:
    state_code: WI
    wi_works_countable_resources: 2_500
  output:
    wi_works_resources_eligible: true

- name: Case 3, resources above limit.
  period: 2025
  input:
    state_code: WI
    wi_works_countable_resources: 2_501
  output:
    wi_works_resources_eligible: false

- name: Case 4, zero resources.
  period: 2025
  input:
    state_code: WI
    wi_works_countable_resources: 0
  output:
    wi_works_resources_eligible: true

- name: Case 5, non-Wisconsin state.
  period: 2025
  input:
    state_code: CA
  output:
    wi_works_resources_eligible: false

# 2,105.87 + 384.60 + 9.53 = 2,500.00, at the limit.
# The float32 balances add to a fraction of a cent above 2,500 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025
  input:
    age: 30
    bank_account_assets: 2_105.87
    stock_assets: 384.60
    bond_assets: 9.53
    state_code: WI
  output:
    wi_works_resources_eligible: true

# 2,105.87 + 384.60 + 9.54 = 2,500.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025
  input:
    age: 30
    bank_account_assets: 2_105.87
    stock_assets: 384.60
    bond_assets: 9.54
    state_code: WI
  output:
    wi_works_resources_eligible: false
