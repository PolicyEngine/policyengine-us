      person1:
        age: 48
        employment_income: 42_165
      person2:
        age: 46
        employment_income: 35_000
      person3:
        age: 26
        employment_income: 30_000
      person4:
        age: 24
        employment_income: 25_000
      person5: {age: 44}
      person6: {age: 22}
      person7: {age: 19}
      person8: {age: 17}
      person9: {age: 16}
      person10: {age: 15}
      person11: {age: 14}
      person12: {age: 13}
      person13: {age: 12}
      person14: {age: 11}
      person15: {age: 10}
      person16: {age: 9}
      person17: {age: 7}
      person18: {age: 5}
      person19: {age: 3}
      person20: {age: 1}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13, person14, person15, person16, person17, person18, person19, person20]
        heating_type: NATURAL_GAS
        heating_expense: 2_000
        tanf: 0
        snap: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13, person14, person15, person16, person17, person18, person19, person20]
        state_code: WI
  output:
    # Income 132,165 is not less than the 132,165 floor (42 U.S.C.
    # 8624(b)(2)(B): "less than 110 percent"), exceeds the size 20 limit
