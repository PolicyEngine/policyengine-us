- name: WI married couple credit counts the spouse's partnership self-employment earnings
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person1:
        is_tax_unit_head: true
        employment_income: 90_000
      person2:
        is_tax_unit_spouse: true
        partnership_income: 10_000
        partnership_self_employment_net_earnings: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_married_couple_credit_potential: 300  # = 0.03 * 10_000, Schedule K-1 (Form 1065)

