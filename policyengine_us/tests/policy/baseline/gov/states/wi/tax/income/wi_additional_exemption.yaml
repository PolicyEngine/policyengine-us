- name: 2025 joint return where one spouse aged 65 can be claimed but is not gets the Wisconsin $250 exemption for each spouse (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 65
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 65
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
