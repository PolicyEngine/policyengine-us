- name: WI exemption unit test 1
  period: 2021
  input:
    exemptions_count: 5
    state_code: WI
  output:
    wi_base_exemption: 5 * 700


- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: WI
  output:
    # Form 1 instructions: "either you or your spouse (not both) can be claimed";
    # IRC 152(b)(1).
    wi_base_exemption: 700

- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: WI
  output:
    wi_base_exemption: 700

- name: 2025 joint return with neither spouse claimable counts everyone
  period: 2025
  input:
    people:
      person_a:
        age: 30
      person_b:
        age: 30
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: WI
  output:
    wi_base_exemption: 2_100
