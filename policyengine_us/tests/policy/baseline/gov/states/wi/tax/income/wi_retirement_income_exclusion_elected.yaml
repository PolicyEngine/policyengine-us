- name: Retirement election retains the standard path on a tax tie
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 68
    taxable_private_pension_income: 8000
    is_tax_unit_head: true
    wi_income_tax_before_credits: 100
    wi_non_refundable_credits: 0
    wi_retirement_income_exclusion_tax: 100
    wi_earned_income_credit: 0
    wi_homestead_credit: 0
    state_code: WI
  output:
    wi_retirement_income_exclusion_elected: false
    state_income_tax_before_refundable_credits: 100
    state_refundable_credits: 0
    state_income_tax: 100

