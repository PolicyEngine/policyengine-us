- name: Single retirement exclusion cannot subtract the same pension on lines 16 and 17
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 68
    taxable_private_pension_income: 8000
    is_tax_unit_head: true
    state_code: WI
  output:
    wi_retirement_income_subtraction: 5000
    wi_retirement_income_exclusion_amount: 8000
    wi_retirement_income_exclusion_line17_offset: 5000

- name: Pooled joint exclusion preserves the maximum remaining line 17 subtraction
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      head:
        age: 68
        taxable_private_pension_income: 45000
        farm_operations_income: -30000
        is_tax_unit_head: true
      spouse:
        age: 68
        taxable_private_pension_income: 8000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: WI
  output:
    adjusted_gross_income: 23000
    wi_retirement_income_subtraction: 10000
    wi_retirement_income_exclusion_amount: 48000
    # $5,000 remains after line 16; all of it can be retained on line 17.
    wi_retirement_income_exclusion_line17_offset: 5000

- name: Unequal spouse pensions preserve both line 17 amounts under joint pooling
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      head:
        age: 68
        taxable_private_pension_income: 53000
        farm_operations_income: -35000
        is_tax_unit_head: true
      spouse:
        age: 68
        taxable_private_pension_income: 5000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: WI
  output:
    adjusted_gross_income: 23000
    wi_retirement_income_subtraction: 10000
    wi_retirement_income_exclusion_amount: 48000
    # Allocate line 16 to the head's income above the two line 17 amounts.
    wi_retirement_income_exclusion_line17_offset: 0

