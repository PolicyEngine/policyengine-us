# Wis. Stat. 71.52(6): "Income" means the sum of Wisconsin adjusted gross
# income and the listed amounts "to the extent not included in Wisconsin
# adjusted gross income". Page numbers are PDF pages of the 2025 Schedule H
# instructions:
# https://www.revenue.wi.gov/TaxForms2025/2025-ScheduleH-inst.pdf

- name: Case 20, court-ordered child support is household income (line 9i).
  # 71.52(6): "maintenance payments ..., support money". Line 9i (page 14):
  # "Fill in the total amount of any court ordered support payments received
  # in 2025, including child support and family maintenance."
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 15_000
        child_support_received: 4_800
        ssi: 0
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
    spm_units:
      spm_unit:
        members: [head, child]
        tanf: 0
    households:
      household:
        members: [head, child]
        state_code: WI
  output:
    # Line 7: 15,000. Line 9i: 4,800. Line 12b: 1 dependent x 500.
    # 15,000 + 4,800 - 500 = 19,300.
    wi_homestead_income: 19_300

- name: Case 21, child support recorded on the child is the claimant's household income (line 9i).
  # The claimant receives the support for the child, so it counts even when
  # recorded on the child. The child's own Social Security and SSI would not
  # (line 9b, page 13).
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 15_000
        ssi: 0
      child:
        age: 8
        is_tax_unit_dependent: true
        child_support_received: 4_800
    tax_units:
      tax_unit:
        members: [head, child]
    spm_units:
      spm_unit:
        members: [head, child]
        tanf: 0
