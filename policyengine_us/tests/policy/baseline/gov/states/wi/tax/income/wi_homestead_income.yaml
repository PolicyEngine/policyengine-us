- name: Case 1, no dependents.
  absolute_error_margin: 0.01
  period: 2021
  input:
    adjusted_gross_income: 900
    tax_unit_dependents: 0
    state_code: WI
  output:
    wi_homestead_income: 900

- name: Case 2, one dependent exemption.
  absolute_error_margin: 0.01
  period: 2021
  input:
    adjusted_gross_income: 900
    tax_unit_dependents: 1
    state_code: WI
  output:
    wi_homestead_income: 400  # = 900 - 500

- name: Case 3, net capital loss is added back (Schedule H line 11j, Schedule 4 line 3).
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 84
        social_security_retirement: 11_033
        short_term_capital_gains: -7_594
        long_term_capital_gains: -624
        ssi: 0
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Federal AGI is the $3,000 allowed capital loss (no social security is taxable).
    # Household income = -3,000 + 11,033 nontaxable social security + 3,000 add-back.
    adjusted_gross_income: -3_000
    wi_homestead_disqualified_losses: 3_000
    wi_homestead_income: 11_033

- name: Case 4, Schedule F, SSTB, Form 4835, Form 4797 and partnership losses are added back.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        farm_operations_income: -1_000
        sstb_self_employment_income: -2_000
        farm_rent_income: -3_000
        partnership_income: -5_000
        s_corp_income: 5_000
        ssi: 0
    tax_units:
      tax_unit:
        members: [head]
        other_net_gain: -4_000
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Income (Schedule H line 7): -1,000 Schedule F - 2,000 Schedule C
    # - 3,000 Form 4835 - 4,000 Form 4797 + (-5,000 + 5,000) Schedule E
    # partnership and S corporation = -10,000.
    # Schedule 4: line 2 2,000 + Form 4835 3,000 + line 5 5,000 + line 6 0
    # + line 9 4,000 + line 10 1,000 = 15,000 (line 13, to line 11j).
    # Household income = -10,000 + 15,000 = 5,000, the S corporation gain.
    adjusted_gross_income: -10_000
    wi_homestead_disqualified_losses: 15_000
    wi_homestead_income: 5_000

- name: Case 5, SSTB sole proprietorship gain and non-SSTB sole proprietorship loss.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        self_employment_income: -5_000
        sstb_self_employment_income: 5_000
        ssi: 0
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Two Schedule C businesses (2023 instructions, page 16, Example 1):
    # Schedule 1 line 3 = 5,000 - 5,000 = 0, and Schedule 4 line 2 adds back
    # the 5,000 loss without netting. Household income = 0 + 5,000 = 5,000.
    # loss_ald deducts each category's loss on its own, so AGI is 0 and the
    # add-back is the 5,000 non-SSTB loss.
    wi_homestead_income: 5_000

# A household is the claimant and the claimant's spouse (Wis. Stat. 71.52(4);
# 2024 Schedule H instructions, page 8), and the instructions say to leave out
# children's social security and SSI (page 13), so a dependent's income is not
# household income. The $500 deduction for each dependent still applies.

- name: Case 6, a dependent grandchild's survivor benefits are not household income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 18_000
        taxable_pension_income: 6_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        social_security_survivors: 12_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    # No social security is taxable: 6,000 + 9,000 is under the 25,000 base.
    adjusted_gross_income: 6_000
    # Schedule H: 6,000 pension + 18,000 social security - 500 for one
    # dependent = 23,500. The grandchild's 12,000 is left out.
    wi_homestead_income: 23_500

- name: Case 7, a dependent's SSI and 2020 excluded unemployment compensation are not household income.
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 66
        social_security_retirement: 15_000
        taxable_pension_income: 5_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        unemployment_compensation: 8_000
        ssi: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    # The child's 8,000 is under the 10,200 exclusion on the child's own
    # federal return.
    tax_exempt_unemployment_compensation: [0, 8_000]
    # 5,000 pension + 15,000 social security - 500 = 19,500.
    wi_homestead_income: 19_500

- name: Case 8, a dependent's capital loss is not added back to household income.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 12_000
        taxable_pension_income: 6_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        long_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        # No W-2 payments, which would count too (Tax 14.03(4)(b)3.b).
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    # The child's loss is on the child's own return, so AGI stays 6,000 and
    # Schedule 4 line 3 adds nothing back: 6,000 + 12,000 - 500 = 17,500.
    adjusted_gross_income: 6_000
    wi_homestead_disqualified_losses: 0
    wi_homestead_income: 17_500

- name: Case 9, a dependent's capital gain does not shrink the claimant's loss add-back.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 12_000
        taxable_pension_income: 6_000
        long_term_capital_gains: -3_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        long_term_capital_gains: 2_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        # No W-2 payments, which would count too (Tax 14.03(4)(b)3.b).
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    # AGI = 6,000 - 3,000 claimant's allowed loss = 3,000; the 3,000 loss is
    # added back: 3,000 + 3,000 + 12,000 - 500 = 17,500.
    adjusted_gross_income: 3_000
    wi_homestead_disqualified_losses: 3_000
    wi_homestead_income: 17_500
