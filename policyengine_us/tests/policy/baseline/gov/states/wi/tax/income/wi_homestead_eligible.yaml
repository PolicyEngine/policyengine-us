- name: "2025 joint return where the only earner is 17 and the 18-year-old spouse has no earned income: no Wisconsin homestead claimant"
  period: 2025
  input:
    people:
      head:
        age: 18
      spouse:
        age: 17
        employment_income: 5_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        wi_homestead_income: 9_000
    households:
      household:
        members: [head, spouse]
        state_code: WI
  output:
    # Wis. Stat. 71.53(2)(c) bars a claimant under 18, and 71.54(1)(gm) bars a
    # claimant under 62 who is not disabled and has no earned income. Neither
    # spouse meets both alone.
    wi_homestead_eligible: false

- name: "2025 single parent with no earned income and an earning 19-year-old dependent: no Wisconsin homestead claimant"
  period: 2025
  input:
    people:
      parent:
        age: 40
        real_estate_taxes: 1_000
      student:
        age: 19
        is_full_time_student: true
        is_tax_unit_dependent: true
        employment_income: 3_000
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: WI
  output:
    # The parent is under 62, not disabled and has no earned income. The
    # student is 18 or older and earns, but the parent claims the student as
    # a dependent, so Wis. Stat. 71.53(2)(d) bars the student as a claimant,
    # and the student's wages aren't the parent's earned income (71.52(1g)).
    wi_homestead_eligible: false
    wi_homestead_credit: 0

# The claimant must have their own earned income; either spouse may be the
# claimant (2024 Schedule H instructions, page 10). Unemployment compensation
# is not earned income (page 7), and a dependent's wages do not qualify them.

- name: Case 8, a dependent's wages do not meet the claimant's earned income test.
  period: 2024
  input:
    people:
      person1:
        age: 40
        unemployment_compensation: 6_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 4_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_eligible: false

- name: Case 9, the claimant's own wages meet the earned income test.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 4_000
      person2:
        age: 17
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_eligible: true

# Either spouse can be the claimant, who must be 18 or older and 62 or older,
# disabled or have their own earned income (2024 Schedule H instructions,
# pages 4 and 10; Wis. Stat. 71.53(2)(c), 71.54(1)(dm)-(gm)).

- name: Case 10, one spouse's wages qualify even when the other has a larger self-employment loss.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 5_000
      person2:
        age: 40
        self_employment_income: -8_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_eligible: true

- name: Case 11, the earner must also be 18 or older.
  period: 2024
  input:
    people:
      person1:
        age: 17
        employment_income: 6_000
        is_tax_unit_head: true
      person2:
        age: 19
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_eligible: false

# Only one spouse needs earned income, and that spouse must be the claimant
# (2024 Schedule H instructions, page 10). Either tax-unit role can qualify.

- name: Case 12, only the spouse earns and can be the claimant.
  period: 2024
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        ssi: 0
      person2:
        age: 38
        employment_income: 6_000
        is_tax_unit_spouse: true
        ssi: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_income: 6_000
    wi_homestead_eligible: true

- name: Case 13, the same earning spouse can be labeled as the head.
  period: 2024
  input:
    people:
      person1:
        age: 40
        is_tax_unit_spouse: true
        ssi: 0
      person2:
        age: 38
        employment_income: 6_000
        is_tax_unit_head: true
        ssi: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        tanf: 0
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_homestead_income: 6_000
    wi_homestead_eligible: true

# The person meeting the age-62 condition can be the claimant (2024
# Schedule H instructions, page 4), whichever tax-unit role they hold.

- name: Case 14, only the spouse is 65 and can be the claimant.
