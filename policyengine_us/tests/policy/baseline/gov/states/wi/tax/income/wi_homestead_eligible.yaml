- name: "2025 single filer claimed as a dependent: Wisconsin homestead credit needs a claimant not claimed as a dependent unless 62 or older"
  period: 2025
  input:
    people:
      filer:
        age: 30
        employment_income: 1000
        real_estate_taxes: 1000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: WI
  output:
    # Wis. Stat. 71.53(2)(d): no claim by a claimant claimed as a dependent
    # by another person, unless the claimant is 62 or older.
    wi_homestead_eligible: false
    wi_homestead_credit: 0

- name: "2025 joint return with one spouse claimed as a dependent: Wisconsin homestead credit needs a claimant not claimed as a dependent unless 62 or older (the claimed spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 500
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 500
        real_estate_taxes: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WI
  output:
    # The unclaimed spouse may be the claimant (Tax 14.02). Household
    # income $1,000 is below the $8,060 phaseout start; property tax
    # $1,000 x 80% = $800.
    wi_homestead_eligible: true
    wi_homestead_credit: 800

