- name: 2025 joint return where only the claimable spouse has earned income: no Wisconsin homestead claimant (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        employment_income: 1000
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        real_estate_taxes: 500
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: WI
  output:
    # Schedule H instructions: the spouse with earned income must be the
    # claimant, and a claimant under 62 may not be claimed as a dependent;
    # the unclaimed spouse has no earned income and is not 62 or disabled.
    wi_homestead_eligible: false
    wi_homestead_credit: 0

