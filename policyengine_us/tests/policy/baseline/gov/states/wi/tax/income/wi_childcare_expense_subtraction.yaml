- name: WI childcare_expense_subtraction unit test 1
  absolute_error_margin: 0.01
  period: 2021
  input:
    tax_unit_childcare_expenses: 10_000
    count_cdcc_eligible: 3
    min_head_spouse_earned: 30_000
    state_code: WI
  output:
    wi_childcare_expense_subtraction: 6_000

- name: WI childcare_expense_subtraction unit test 2
  absolute_error_margin: 0.01
  period: 2021
  input:
    tax_unit_childcare_expenses: 10_000
    count_cdcc_eligible: 3
    min_head_spouse_earned: 2_000
    state_code: WI
  output:
    wi_childcare_expense_subtraction: 2_000

- name: WI childcare_expense_subtraction unit test 3
  absolute_error_margin: 0.01
  period: 2021
  input:
    tax_unit_childcare_expenses: 2_000
    count_cdcc_eligible: 1
    min_head_spouse_earned: 3_000
    state_code: WI
  output:
    wi_childcare_expense_subtraction: 2_000

- name: WI childcare_expense_subtraction separate filer is not eligible per Wis. Stat. 71.05(6)(b)43.e.
  absolute_error_margin: 0.01
  period: 2021
  input:
    tax_unit_childcare_expenses: 2_000
    count_cdcc_eligible: 1
    min_head_spouse_earned: 3_000
    filing_status: SEPARATE
    state_code: WI
  output:
    wi_childcare_expense_subtraction: 0

- name: WI childcare_expense_subtraction separated filer maintaining a home for a qualifying child keeps the subtraction, IRC 21(e)(4)
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        age: 35
        is_separated: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        tax_unit_childcare_expenses: 2_000
        count_cdcc_eligible: 1
        min_head_spouse_earned: 3_000
    households:
      household:
        members: [head, child]
        state_code: WI
  output:
    wi_childcare_expense_subtraction: 2_000

- name: WI childcare_expense_subtraction includes care expenses for a disabled adult qualifying individual
  absolute_error_margin: 0.01
  period: 2021
  input:
    tax_unit_childcare_expenses: 0
    care_expenses: 2_000
    count_cdcc_eligible: 1
    min_head_spouse_earned: 3_000
    state_code: WI
  output:
    wi_childcare_expense_subtraction: 2_000

# Disabled-adult care remains eligible when the filer can be claimed.
# The $2,000 childcare is excluded unless the filing exception applies
# or the child is incapable of self-care (IRC 21(b)(1)(B)).

- name: 2021 claimable filer keeps adult care and only qualifying childcare
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      filer:
        age: 22
        employment_income: 60000
        is_tax_unit_head: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: false
        dependent_claimant_filing_exception: false
      child:
        age: 4
        is_tax_unit_dependent: true
        is_incapable_of_self_care: false
      adult:
        age: 30
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_incapable_of_self_care: true
        care_expenses: 1000
    tax_units:
      tax_unit:
        members: [filer, child, adult]
        tax_unit_childcare_expenses: 2000
    households:
      household:
        members: [filer, child, adult]
        state_code: WI
  output:
    wi_childcare_expense_subtraction: 1000

