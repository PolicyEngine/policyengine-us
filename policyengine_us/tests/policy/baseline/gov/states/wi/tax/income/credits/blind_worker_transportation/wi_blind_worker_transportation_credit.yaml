  input:
    people:
      person1:
        age: 40
        is_blind: true
        tax_unit_role_input: "HEAD"
        wi_blind_worker_qualifying_transportation_expenses: 3000
    tax_units:
      tax_unit:
        members: ["person1"]
        wi_income_tax_before_credits: 3000
        wi_itemized_deduction_credit_potential: 0
        wi_childcare_expense_credit_potential: 0
        wi_property_tax_credit_potential: 0
        wi_married_couple_credit_potential: 0
    households:
      household:
        members: ["person1"]
        state_code: "WI"
  output:
    wi_blind_worker_transportation_credit: 0
    wi_blind_worker_transportation_credit_potential: 0

