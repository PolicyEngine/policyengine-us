        age: 38
        tax_unit_role_input: "SPOUSE"
        is_blind: true
        wi_blind_worker_qualifying_transportation_expenses: 3000
    tax_units:
      tax_unit:
        members: ["person1", "person2"]
        filing_status: "JOINT"
