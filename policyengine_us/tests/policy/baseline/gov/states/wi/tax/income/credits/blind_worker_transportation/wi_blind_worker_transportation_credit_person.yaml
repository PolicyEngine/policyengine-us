# Independent source-derived cases; approved shared contract 2ead16da46986b3aa3230b4c274d1ed1ac213b282bbf98291111a7045503e51b.
# Wis. Stat. 71.07(11), chapter 71 PDF pages 56 and 58; 2025 Form 1 instructions pages 17-18.
# Supplied expenses are already source-qualified net payments; this file does not classify receipts.

- name: "Case 1, no credit before the statutory 2024 onset."
  period: 2023
  input:
    people:
      person1:
        age: 40
        is_blind: true
        tax_unit_role_input: "HEAD"
        wi_blind_worker_qualifying_transportation_expenses: 3000
    tax_units:
      tax_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "WI"
  output:
    wi_blind_worker_transportation_credit_person: 0

- name: "Case 2, the credit starts in 2024."
  period: 2024
  input:
    people:
      person1:
