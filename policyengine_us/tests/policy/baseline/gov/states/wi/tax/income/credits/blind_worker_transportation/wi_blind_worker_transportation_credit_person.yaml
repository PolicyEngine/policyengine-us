# Cases 13-16 cover input/default and jurisdiction boundaries and supplied
# filing statuses. They do not validate upstream filing-status eligibility.
- name: "Case 13, omitted qualified expense input assumes the default zero."
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_blind: true
        tax_unit_role_input: "HEAD"
        # Expenses are deliberately omitted: default zero is an assumption,
        # not verification that this claimant paid no qualifying expenses.
    tax_units:
      tax_unit:
        members: ["person1"]
        filing_status: "SINGLE"
    marital_units:
      marital_unit:
        members: ["person1"]
    households:
      household:
        members: ["person1"]
        state_code: "WI"
  output:
    wi_blind_worker_transportation_credit_person: 0

