# Independent source expectations: Wis. Stat.71.07(6e), 2025 Form1 instructions pp13,27-30.
# Evidence and approved SHAREDv3 ten-input/six-output contract: wi/independent-test-design.md and scope-approved.md.

# Statute71.07(9)(b): SINGLE potential12%of2500=300; MFS ceiling150before exclusion.
# Statute(6e)(c)2/Form1 p18: own active election or counterpart valid claim blocks it, including zero/unknown own dollars.
- name: Case 1, actual family elections gate the School potential without depending on own dollars.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [WI, WI, WI, WI, WI, WI]
    wi_veterans_property_tax_credit_qualified_property_taxes: [3_000, 0, -1, 3_000, 3_000, 3_000]
    wi_veterans_property_tax_credit_claimant_type: [ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN]
    wi_veterans_property_tax_credit_wdva_verified: [true, true, true, true, true, true]
    wi_veterans_property_tax_credit_property_qualified: [true, true, true, true, true, true]
    wi_veterans_property_tax_credit_claim_permitted: [true, true, true, true, true, true]
    wi_veterans_property_tax_credit_elected: [true, true, true, false, false, true]
    wi_veterans_property_tax_credit_incompatible_credit_claimed: [false, false, false, false, false, false]
    wi_veterans_property_tax_credit_spouse_claim_status: [NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, VALID_CLAIM, VALID_CLAIM]
    wi_veterans_property_tax_credit_facts_available: [true, true, true, true, true, false]
    wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: [false, false, false, false, false, false]
    real_estate_taxes: [2_500, 2_500, 2_500, 2_500, 2_500, 2_500]
    age: [35, 35, 35, 35, 35, 35]
    filing_status: [SINGLE, SINGLE, SINGLE, SINGLE, SEPARATE, SEPARATE]
  output:
    wi_property_tax_credit_potential: [0, 0, 0, 300, 0, 0]

