- name: Case 5, a filer's own compensation on their return.
  period: 2024
  input:
    people:
      person1:
        age: 40
        employment_income: 12_000
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: WI
  output:
    # Unemployment Compensation Worksheet: line 1, 5,000; line 2, 17,000;
    # line 3, 12,000; line 7, 5,000; line 8, 2,500; line 9, 2,500; line 10,
    # 5,000 - 2,500 = 2,500.
    wi_unemployment_compensation_subtraction: 2_500

- name: Case 6, a dependent's compensation is on the dependent's own return.
  period: 2024
  input:
    people:
      person1:
        age: 45
        employment_income: 18_000
        is_tax_unit_head: true
      person2:
        age: 17
        is_tax_unit_dependent: true
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    # Line 1 takes the compensation on federal Schedule 1 of this return,
    # which has none.
    tax_unit_taxable_unemployment_compensation: 0
    wi_unemployment_compensation_subtraction: 0
