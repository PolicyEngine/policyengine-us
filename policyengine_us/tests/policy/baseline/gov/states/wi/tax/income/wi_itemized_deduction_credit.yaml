- name: WI itemized deduction credit unit test 1
  absolute_error_margin: 0.01
  period: 2021
  input:
    wi_standard_deduction: 10_000
    charitable_deduction: 3_000
    interest_deduction: 12_000
    salt_deduction: 8_000
    medical_expense_deduction: 1_000
    casualty_loss_deduction: 2_000
    state_code: WI
  output:
    wi_itemized_deduction_credit_potential: 400  # = (3K + 12K + 1K + 2K - 10K) * 5%

- name: WI itemized deduction credit unit test 2
  absolute_error_margin: 0.01
  period: 2021
  input:
    wi_standard_deduction: 20_000
    charitable_deduction: 3_000
    interest_deduction: 12_000
    salt_deduction: 8_000
    medical_expense_deduction: 1_000
    casualty_loss_deduction: 2_000
    state_code: WI
  output:
    wi_itemized_deduction_credit_potential: 0

- name: WI itemized deduction credit includes repayments unused for its separate credit
  # Wis. Stat. 71.07(5)(a)6 excludes repayments only when used for the
  # separate state credit. IRC 67(b)(9) excludes section 1341 deductions
  # from miscellaneous deductions, so paragraph 7 does not remove them.
  absolute_error_margin: 0.01
  period: 2025
  input:
    wi_standard_deduction: 10_000
    charitable_deduction: 3_000
    interest_deduction: 12_000
    claim_of_right_deduction: 20_000
    state_code: WI
  output:
    wi_itemized_deduction_credit_potential: 1_250  # = (3K + 12K + 20K - 10K) * 5%
