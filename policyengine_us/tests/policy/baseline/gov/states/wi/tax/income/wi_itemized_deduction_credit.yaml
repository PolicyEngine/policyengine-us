  input:
    people:
      person:
        age: 40
        employment_income: 150_000
        charitable_cash_donations: 10_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: WI
  output:
    wi_standard_deduction: 0
    wi_itemized_deduction_credit_potential: 500
    wi_itemized_deduction_credit: 500

# 2022 Schedule 1, lines 1-9:
# https://www.revenue.wi.gov/TaxForms2022/2022-Form1.pdf#page=4
# Medical deduction = 15,000 - (150,000 * .075) = 3,750.
# Credit = (3,750 + 10,000 interest + 10,000 charity - 0) * .05.
- name: Wisconsin 2022 medical interest and charitable credit control
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
        employment_income: 150_000
        charitable_cash_donations: 10_000
        other_medical_expenses: 15_000
        deductible_interest_expense: 10_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: WI
  output:
    medical_expense_deduction: 3_750
    wi_standard_deduction: 0
    wi_itemized_deduction_credit_potential: 1_187.50
    wi_itemized_deduction_credit: 1_187.50

# Wis. Stat. 71.07(5)(a)2 and 7 exclude SALT and miscellaneous deductions.
- name: Wisconsin credit excludes miscellaneous deductions and SALT
  period: 2022
  absolute_error_margin: 0.01
  input:
    state_code: WI
    wi_standard_deduction: 0
    misc_deduction: 5_000
    salt_deduction: 8_000
  output:
    wi_itemized_deduction_credit_potential: 0
