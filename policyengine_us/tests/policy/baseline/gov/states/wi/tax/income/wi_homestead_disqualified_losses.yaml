- name: Case 1, sole proprietorship, rental and Schedule F losses with a net capital loss; a partnership gain is not netted.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        self_employment_income: -2_000 # line 2
        rental_income: -1_000 # line 4
        partnership_income: 500 # a gain, not a loss
        farm_operations_income: -300 # line 10
    tax_units:
      tax_unit:
        members: [head]
        loss_limited_net_capital_gains: -3_000 # line 3
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Schedule 4: line 2 2,000 + line 3 3,000 + line 4 1,000 + line 10 300
    # = 6,300 (line 11). Line 12 is 0, so line 13 = 6,300.
    wi_homestead_disqualified_losses: 6_300

- name: Case 2, SSTB sole proprietorship loss.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        sstb_self_employment_income: -5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Schedule 4, line 2: net business loss from a sole proprietorship = 5,000.
    wi_homestead_disqualified_losses: 5_000

