- name: Case 5, partnership loss is not netted against S corporation income.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        partnership_income: -5_000
        s_corp_income: 5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Schedule 4, line 5: net loss from a partnership = 5,000. Line 6 is 0;
    # the S corporation gain is not netted ("Do not net a business with a
    # gain against a business with a loss", 2023 instructions, page 16).
    wi_homestead_disqualified_losses: 5_000

- name: Case 6, combined partnership and S corporation loss set directly.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        partnership_s_corp_income: -5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # Schedule 4, line 5 or 6: one pass-through net loss = 5,000.
    wi_homestead_disqualified_losses: 5_000

- name: Case 7, Schedule J farm income is not a loss included in income.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
        farm_income: -5_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: WI
  output:
    # farm_income is the Schedule J income-averaging amount, which does not
    # enter adjusted gross income. Schedule 4, line 10 takes the Schedule F
    # loss (farm_operations_income), which is 0 here.
    wi_homestead_disqualified_losses: 0

- name: Case 8, a dependent's loss is not part of household income.
  period: 2023
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 70
      child:
        age: 17
        is_tax_unit_dependent: true
        self_employment_income: -1_000
    tax_units:
      tax_unit:
        members: [head, child]
        loss_limited_net_capital_gains: 0
    households:
      household:
        members: [head, child]
        state_code: WI
  output:
    wi_homestead_disqualified_losses: 0
