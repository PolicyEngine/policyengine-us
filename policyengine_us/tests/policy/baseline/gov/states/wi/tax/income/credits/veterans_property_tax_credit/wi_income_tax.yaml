# Independent source expectations: Wis. Stat.71.07(6e), 2025 Form1 instructions pp13,27-30.
# Evidence and approved SHAREDv3 ten-input/six-output contract: wi/independent-test-design.md and scope-approved.md.
# Conditional final-tax arithmetic from actual2025Form1 pp2-3; upstream pre-credit tax is supplied explicitly.

# Statute(b)/Form1 lines22/34/37-43: net tax before refunds minus3000; zero floor applies before refundable credits only.
# School otherwise has12%of the first2500=300but is excluded by actual veterans election. No second cash benefit.
- name: Case 1, the credit offsets tax and refunds the excess once.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [WI, WI, WI]
    wi_veterans_property_tax_credit_qualified_property_taxes: [3_000, 3_000, 3_000]
    wi_veterans_property_tax_credit_claimant_type: [ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN]
    wi_veterans_property_tax_credit_wdva_verified: [true, true, true]
    wi_veterans_property_tax_credit_property_qualified: [true, true, true]
    wi_veterans_property_tax_credit_claim_permitted: [true, true, true]
    wi_veterans_property_tax_credit_elected: [true, true, true]
    wi_veterans_property_tax_credit_incompatible_credit_claimed: [false, false, false]
    wi_veterans_property_tax_credit_spouse_claim_status: [NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED]
    wi_veterans_property_tax_credit_facts_available: [true, true, true]
    wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: [false, false, false]
    age: [35, 35, 35]
    real_estate_taxes: [3_000, 3_000, 3_000]
    rent: [0, 0, 0]
    wi_homestead_income: [30_000, 30_000, 30_000]
    wi_itemized_deduction_credit: [0, 0, 0]
    wi_childcare_expense_credit: [0, 0, 0]
    wi_married_couple_credit: [0, 0, 0]
    wi_earned_income_credit: [0, 0, 0]
    wi_income_tax_before_credits: [0, 1_000, 5_000]
    filing_status: [SINGLE, SINGLE, SINGLE]
  output:
    wi_veterans_property_tax_credit: [3_000, 3_000, 3_000]
    wi_property_tax_credit_potential: [0, 0, 0]
    wi_property_tax_credit: [0, 0, 0]
    wi_non_refundable_credits: [0, 0, 0]
    wi_homestead_credit: [0, 0, 0]
    wi_refundable_credits: [3_000, 3_000, 3_000]
    wi_income_tax_before_refundable_credits: [0, 1_000, 5_000]
    wi_income_tax: [-3_000, -2_000, 2_000]
    state_property_tax_refunds: [0, 0, 0]

