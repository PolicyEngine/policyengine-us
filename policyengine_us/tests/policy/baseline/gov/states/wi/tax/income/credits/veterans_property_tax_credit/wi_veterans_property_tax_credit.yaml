# Form1 p30: first row has a written direct-tax obligation and documented municipal receipt2000.
# Second row has known ordinary rent only; third lacks required remittance/qualification proof. No percentage-of-rent proxy is authorized.
- name: Case 7, the direct municipal tax renter route differs from ordinary rent or missing remittance evidence.
  period: 2025
  input:
    state_code: [WI, WI, WI]
    wi_veterans_property_tax_credit_qualified_property_taxes: [2_000, 0, -1]
    wi_veterans_property_tax_credit_claimant_type: [ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN]
    wi_veterans_property_tax_credit_wdva_verified: [true, true, true]
    wi_veterans_property_tax_credit_property_qualified: [true, false, true]
    wi_veterans_property_tax_credit_claim_permitted: [true, true, true]
    wi_veterans_property_tax_credit_elected: [true, true, true]
    wi_veterans_property_tax_credit_incompatible_credit_claimed: [false, false, false]
    wi_veterans_property_tax_credit_spouse_claim_status: [NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED]
    wi_veterans_property_tax_credit_facts_available: [true, true, false]
    wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: [false, false, false]
