    wi_veterans_property_tax_credit_inputs_available: [true, true, false]

# Statute(c)3 and Form1 p29: total tax3000on equal co-owned principal home, allocated1500each.
# The second spouse need not independently be a disabled veteran; combined credit is3000, not6000.
- name: Case 8, separate-return spouses claim their respective halves exactly once.
  period: 2025
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
      person2:
        age: 50
        is_tax_unit_head: true
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SEPARATE
        wi_veterans_property_tax_credit_qualified_property_taxes: 1_500
        wi_veterans_property_tax_credit_claimant_type: ELIGIBLE_VETERAN
        wi_veterans_property_tax_credit_wdva_verified: true
        wi_veterans_property_tax_credit_property_qualified: true
        wi_veterans_property_tax_credit_claim_permitted: true
        wi_veterans_property_tax_credit_elected: true
        wi_veterans_property_tax_credit_incompatible_credit_claimed: false
        wi_veterans_property_tax_credit_spouse_claim_status: VALID_CLAIM
        wi_veterans_property_tax_credit_facts_available: true
        wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: false
      tax_unit2:
        members: [person2]
        filing_status: SEPARATE
        wi_veterans_property_tax_credit_qualified_property_taxes: 1_500
        wi_veterans_property_tax_credit_claimant_type: ELIGIBLE_SPOUSE_SEPARATE_RETURN
        wi_veterans_property_tax_credit_wdva_verified: true
        wi_veterans_property_tax_credit_property_qualified: true
        wi_veterans_property_tax_credit_claim_permitted: true
        wi_veterans_property_tax_credit_elected: true
        wi_veterans_property_tax_credit_incompatible_credit_claimed: false
        wi_veterans_property_tax_credit_spouse_claim_status: VALID_CLAIM
        wi_veterans_property_tax_credit_facts_available: true
        wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: false
    households:
      household:
        members: [person1, person2]
        state_code: WI
  output:
    wi_veterans_property_tax_credit: [1_500, 1_500]
    wi_veterans_property_tax_credit_incompatible_credits_disallowed: [true, true]
