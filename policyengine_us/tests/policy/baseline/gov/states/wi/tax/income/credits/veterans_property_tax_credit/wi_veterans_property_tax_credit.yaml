# Independent source expectations: Wis. Stat.71.07(6e), 2025 Form1 instructions pp13,27-30.
# Evidence and approved SHAREDv3 ten-input/six-output contract: wi/independent-test-design.md and scope-approved.md.

# Form1 p13: cents below50drop;50-99increase. Two1000.25payments total2000.50before rounding, giving2001.
# Property FAQ Q4 establishes no dollar cap;1000000is a hypothetical lawful qualified bill, not an observed amount.
- name: Case 1, whole-dollar half-up rounding is applied once to the full line total.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [WI, WI, WI, WI, WI, WI, WI, WI, WI]
    wi_veterans_property_tax_credit_qualified_property_taxes: [0, 0.49, 0.5, 0.51, 1.49, 1.5, 2000.49, 2000.5, 1_000_000]
    wi_veterans_property_tax_credit_claimant_type: [ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN]
    wi_veterans_property_tax_credit_wdva_verified: [true, true, true, true, true, true, true, true, true]
    wi_veterans_property_tax_credit_property_qualified: [true, true, true, true, true, true, true, true, true]
    wi_veterans_property_tax_credit_claim_permitted: [true, true, true, true, true, true, true, true, true]
    wi_veterans_property_tax_credit_elected: [true, true, true, true, true, true, true, true, true]
    wi_veterans_property_tax_credit_incompatible_credit_claimed: [false, false, false, false, false, false, false, false, false]
    wi_veterans_property_tax_credit_spouse_claim_status: [NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED]
    wi_veterans_property_tax_credit_facts_available: [true, true, true, true, true, true, true, true, true]
    wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: [false, false, false, false, false, false, false, false, false]
    age: [35, 35, 35, 35, 35, 35, 35, 35, 35]
    filing_status: [SINGLE, SINGLE, SINGLE, SINGLE, SINGLE, SINGLE, SINGLE, SINGLE, SINGLE]
  output:
    wi_veterans_property_tax_credit: [0, 0, 1, 1, 1, 2, 2_000, 2_001, 1_000_000]

# The explicit qualified-tax ledger and generic paid-tax expense have different semantics.
# Unknown qualified tax returns framework0; do not infer entitlement from generic5000or mutate paid-tax expenses.
- name: Case 2, generic paid taxes neither fill unknown qualification nor change an explicit full base.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: [WI, WI, WI]
    wi_veterans_property_tax_credit_qualified_property_taxes: [-1, 3_000, 3_000]
    wi_veterans_property_tax_credit_claimant_type: [ELIGIBLE_VETERAN, ELIGIBLE_VETERAN, ELIGIBLE_VETERAN]
    wi_veterans_property_tax_credit_wdva_verified: [true, true, true]
    wi_veterans_property_tax_credit_property_qualified: [true, true, true]
    wi_veterans_property_tax_credit_claim_permitted: [true, true, true]
    wi_veterans_property_tax_credit_elected: [true, true, true]
    wi_veterans_property_tax_credit_incompatible_credit_claimed: [false, false, false]
    wi_veterans_property_tax_credit_spouse_claim_status: [NOT_CLAIMED, NOT_CLAIMED, NOT_CLAIMED]
    wi_veterans_property_tax_credit_facts_available: [true, true, true]
    wi_veterans_property_tax_credit_retirement_income_exclusion_claimed: [false, false, false]
    real_estate_taxes: [5_000, 0, 5_000]
    age: [35, 35, 35]
    filing_status: [SINGLE, SINGLE, SINGLE]
  output:
    wi_veterans_property_tax_credit: [0, 3_000, 3_000]
    real_estate_taxes: [5_000, 0, 5_000]

