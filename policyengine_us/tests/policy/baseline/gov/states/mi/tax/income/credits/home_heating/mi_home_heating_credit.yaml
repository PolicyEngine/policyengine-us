# MCL 206.508(3) defines the household as "a claimant and spouse", so a
# dependent adult's own pension and SSI are both left out of household
# resources. The MI-1040CR line 21 instructions, which count amounts
# received for dependent adults, give way to the statute.
- name: A dependent adult's pension and SSI both stay out of household resources
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head_without_pension:
        age: 40
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        takes_up_ssi_if_eligible: false
      dependent_without_pension:
        age: 75
        is_tax_unit_head: false
        is_tax_unit_dependent: true
        taxable_private_pension_income: 0
        takes_up_ssi_if_eligible: true
      head_with_pension:
        age: 40
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        takes_up_ssi_if_eligible: false
      dependent_with_pension:
        age: 75
        is_tax_unit_head: false
        is_tax_unit_dependent: true
        taxable_private_pension_income: 2_400
        takes_up_ssi_if_eligible: true
    marital_units:
      head_without_pension:
        members: [head_without_pension]
      dependent_without_pension:
        members: [dependent_without_pension]
      head_with_pension:
        members: [head_with_pension]
      dependent_with_pension:
        members: [dependent_with_pension]
    tax_units:
      without_pension:
        members: [head_without_pension, dependent_without_pension]
        heating_expenses: 0
        mi_home_heating_credit_heat_included_in_rent: false
        mi_eitc: 0
        mi_homestead_property_tax_credit: 0
      with_pension:
        members: [head_with_pension, dependent_with_pension]
        heating_expenses: 0
        mi_home_heating_credit_heat_included_in_rent: false
        mi_eitc: 0
        mi_homestead_property_tax_credit: 0
    spm_units:
      without_pension:
        members: [head_without_pension, dependent_without_pension]
        tanf: 0
      with_pension:
        members: [head_with_pension, dependent_with_pension]
        tanf: 0
    families:
      without_pension:
        members: [head_without_pension, dependent_without_pension]
      with_pension:
        members: [head_with_pension, dependent_with_pension]
    households:
      without_pension:
        members: [head_without_pension, dependent_without_pension]
        state_code: MI
      with_pension:
        members: [head_with_pension, dependent_with_pension]
        state_code: MI
  output:
    # Annual SSI: 12 * $967 = $11,604. Countable annual pension:
    # $2,400 - 12 * $20 general exclusion = $2,160; $11,604 - $2,160 = $9,444.
    ssi: [0, 11_604, 0, 9_444]
    # Claimant wages only; the dependent's SSI and pension are the
    # dependent's own.
    mi_household_resources: [10_000, 10_000]
    adjusted_gross_income: [10_000, 10_000]
    mi_pension_benefit: [0, 0]
    mi_subtractions: [0, 0]
    mi_taxable_income: [0, 0]
    mi_income_tax_before_refundable_credits: [0, 0]
    # Two exemptions: $815 - 3.5% * $10,000 = $465.
    mi_standard_home_heating_credit: [465, 465]
    # Apply the 2025 60% funding factor: $465 * .60 = $279. The pension no
    # longer changes the credit through the dependent's SSI.
    mi_home_heating_credit: [279, 279]
    mi_income_tax: [-279, -279]
    state_income_tax: [-279, -279]
