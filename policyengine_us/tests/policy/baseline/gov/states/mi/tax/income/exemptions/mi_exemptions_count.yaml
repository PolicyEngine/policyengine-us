- name: 2025 single filer who can be claimed as a dependent, home heating exemptions with a child
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, child]
    households:
      household:
        members: [person_a, child]
        state_code: MI
  output:
    # Children who live with you count "even if their support comes
    # from ... someone else"; MCL 206.527a(1)(c)(i) counts them "even
    # if the exemptions may not be claimed for other income tax
    # purposes".
    mi_exemptions_count: 1

