- name: 2025 single filer who can be claimed as a dependent, home heating exemptions
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: MI
  output:
    # MI-1040CR-7: one exemption for "Yourself, unless you are eligible
    # to be claimed as a dependent on someone else's return".
    mi_exemptions_count: 0

- name: 2025 joint return with one spouse who can be claimed, home heating exemptions (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: MI
  output:
    # Only the spouse who cannot be claimed counts.
    mi_exemptions_count: 1

