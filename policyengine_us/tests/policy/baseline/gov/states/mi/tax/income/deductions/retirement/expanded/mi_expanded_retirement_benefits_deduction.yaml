        mi_expanded_retirement_benefits_deduction_eligible: true
        members: [person1]
        filing_status: SINGLE
    household:
      members: [person1]
      state_code: MI
  output: # min(0.25 * (61518 - 1000), 20000)
    mi_expanded_retirement_benefits_deduction: 15_129.5

