- name: standard allowance, exemption of 8 at 50_000 household income, non-heating items included in rent
  period: 2022
  input:
    mi_exemptions_count: 8
    # base = 1_433 + 2 * 182
    mi_household_resources: 50_000
    mi_standard_home_heating_credit_eligible: true
    utilities_included_in_rent: true
    heat_expense_included_in_rent: false
    state_code: MI
  output: # 1_433 + (8 - 6) * 182 - 50_000 * 0.035
    mi_standard_home_heating_credit: 47

- name: standard allowance, exemption of 8 at 50_000 household income, heat included in rent
  period: 2022
  input:
    mi_exemptions_count: 8
    mi_household_resources: 50_000
    mi_standard_home_heating_credit_eligible: true
    heat_expense_included_in_rent: true
    state_code: MI
  output: # (1_433 + (8 - 6) * 182 - 50_000 * 0.035) * 0.5
    mi_standard_home_heating_credit: 23.5

