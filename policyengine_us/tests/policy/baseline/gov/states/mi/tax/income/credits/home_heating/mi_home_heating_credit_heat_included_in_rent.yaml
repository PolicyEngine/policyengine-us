# MCL 206.527a(1)(c)(i) and MI-1040CR-7 lines 10 and 39: the fact is whether
# heating costs are included in the claimant's rent.
- name: Case 1, heat included in rent.
  period: 2022
  input:
    state_code: MI
    heat_expense_included_in_rent: true
  output:
    mi_home_heating_credit_heat_included_in_rent: true

- name: Case 2, non-heating items included in rent do not establish that heat is included.
  period: 2022
  input:
    state_code: MI
    utilities_included_in_rent: true
    heat_expense_included_in_rent: false
  output:
    mi_home_heating_credit_heat_included_in_rent: false

- name: Case 3, neither flag set.
  period: 2022
  input:
    state_code: MI
    heat_expense_included_in_rent: false
    utilities_included_in_rent: false
  output:
    mi_home_heating_credit_heat_included_in_rent: false

- name: Case 4, not computed outside Michigan.
  period: 2022
  input:
    state_code: TX
    heat_expense_included_in_rent: true
  output:
    mi_home_heating_credit_heat_included_in_rent: false

- name: Case 5, the broader rent flag alone does not establish that heat is included.
  period: 2022
  input:
    state_code: MI
    utilities_included_in_rent: true
  output:
    mi_home_heating_credit_heat_included_in_rent: false

- name: Case 6, claimant-specific rent arrangements override the shared default.
  period: 2022
  input:
    people:
      person1:
        age: 30
      person2:
        age: 40
    tax_units:
      tax_unit1:
        members: [person1]
        mi_home_heating_credit_heat_included_in_rent: true
      tax_unit2:
        members: [person2]
        mi_home_heating_credit_heat_included_in_rent: false
    spm_units:
      spm_unit:
        members: [person1, person2]
        heat_expense_included_in_rent: true
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    mi_home_heating_credit_heat_included_in_rent: [true, false]
