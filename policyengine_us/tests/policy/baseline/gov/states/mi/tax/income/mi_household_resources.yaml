    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 14: 60,000.
    # Line 16: Schedule C 10,000 + Schedule F -4,000 = 6,000.
    # Line 30: deduction for self-employment tax (Schedule 1 line 15), half
    # of 6,000 x 0.9235 x 15.3% = 423.89, plus the early withdrawal penalty
    # (line 18), 500: 923.89.
    # Line 33: 60,000 + 6,000 - 923.89 = 65,076.11.
    mi_household_resources: 65_076.11
  absolute_error_margin: 0.01

