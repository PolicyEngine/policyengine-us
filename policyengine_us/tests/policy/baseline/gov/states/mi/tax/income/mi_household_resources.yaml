  output:
    # The form puts Medicare premiums withheld from benefits on line 21:
    # "Medicare premiums reported on your Social Security or Railroad
    # Retirement statement should be deducted" (page 32), so line 21 is
    # 20,000 - 2,220 = 17,780 and line 31 leaves them out. MCL 206.510(1)(h)
