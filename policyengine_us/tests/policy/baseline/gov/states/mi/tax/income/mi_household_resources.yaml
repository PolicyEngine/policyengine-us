- name: Schedule 1 adjustments still reduce household resources with a business loss
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 60_000
        self_employment_income: 10_000
        farm_operations_income: -4_000
        early_withdrawal_penalty: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 14: 60,000.
    # Line 16: Schedule C 10,000 + Schedule F -4,000 = 6,000.
    # Line 30: deduction for self-employment tax (Schedule 1 line 15), half
    # of 6,000 x 0.9235 x 15.3% = 423.89, plus the early withdrawal penalty
