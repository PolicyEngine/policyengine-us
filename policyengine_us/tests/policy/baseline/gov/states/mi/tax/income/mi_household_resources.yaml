    mi_household_resources: 17_780

# MCL 206.510(1): income does not include "(a) The first $300.00 of gifts in
# cash or kind from nongovernmental sources" or "(b) The first $300.00
# received from awards, prizes, lottery, bingo, or other gambling winnings".
# The MI-1040CR enters "awards, prizes, lottery, bingo, and other gambling
# winnings over $300" on line 20 and "the value over $300 in gifts of cash or
# merchandise received, or expenses paid on your behalf ... by parents,
# relatives, or friends" on line 24 (2025 MI-1040 book, page 32), each once
# for the claimant and spouse.

