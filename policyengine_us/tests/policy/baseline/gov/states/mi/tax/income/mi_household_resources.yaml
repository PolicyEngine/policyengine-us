        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 16: Schedule C -20,000, so 0. Line 17: Schedule E Part I 15,000.
    # The two lines are floored separately. Line 30: 0.
    # Line 33: 50,000 + 0 + 15,000 = 65,000.
    mi_household_resources: 65_000

- name: A rental loss nets against farm rental income on line 17
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        rental_income: -10_000
