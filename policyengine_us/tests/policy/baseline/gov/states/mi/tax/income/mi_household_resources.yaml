      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    # The household is the claimant (MCL 206.508(3)); the dependent's
    # Schedule C belongs on the dependent's own return.
    # Line 16: Schedule E Part II 20,000. Line 30: 0.
    # Line 33: 50,000 + 20,000 = 70,000.
    mi_household_resources: 70_000

