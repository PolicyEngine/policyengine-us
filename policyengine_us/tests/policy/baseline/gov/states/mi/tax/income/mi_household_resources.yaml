# Line numbers are the MI-1040CR's (2024 and 2025 MI-1040 books, pages 31-32;
# the two years' household resources lines are the same). Total household
# resources are "AGI, excluding net business and farm losses, net rent and
# royalty losses, and any carryover of a net operating loss, plus all income
# exempt or excluded from AGI" (page 26), as in MCL 206.508(4).
# Line 16 nets U.S. Schedule C, Form 4797 Part II, Schedule E Parts II and III
# and Schedule F; line 17 nets Schedule E Parts I, IV (REMICs, no input) and V.
# "If the total is negative enter 0." Line 30 is "total adjustments from your
# U.S. Form 1040, Schedule 1", and line 31 is health insurance premiums. The
# household is "a claimant and spouse" (MCL 206.508(3)), so a dependent's
# business and rental items stay off lines 16 and 17.

- name: Cannot be negative
  period: 2024
  input:
    net_capital_gains: -2_000
    state_code: MI
    health_insurance_premiums: 0
    early_withdrawal_penalty: 1_000
  output:
    # Line 19: -2,000 (within the $3,000 loss limit).
    # Line 30: penalty on early withdrawal of savings (Schedule 1 line 18),
    # 1,000.
    # -2,000 - 1,000 = -3,000; household resources are not negative, so 0.
    mi_household_resources: 0

- name: Reduced to 0
  period: 2024
  input:
    net_capital_gains: 2_000
    state_code: MI
    health_insurance_premiums: 3_000
    early_withdrawal_penalty: 1_000
  output:
    # Line 19: 2,000. Line 30: 1,000. Line 31: 3,000.
    # 2,000 - 1,000 - 3,000 = -2,000, floored at 0.
    mi_household_resources: 0

- name: Partially reduced
  period: 2024
  input:
    net_capital_gains: 10_000
    state_code: MI
    health_insurance_premiums: 3_000
    early_withdrawal_penalty: 1_000
  output:
    # Line 19: 10,000. Line 30: 1,000. Line 31: 3,000.
    # Line 33: 10,000 - (1,000 + 3,000) = 6,000.
    mi_household_resources: 6_000

- name: Savings bond interest excluded under IRC 135 stays in household resources
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 30_000
        taxable_interest_income: 2_000
        us_bonds_for_higher_ed: 1_500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Federal: Form 8815 excludes 1,500 of the 2,000 of interest (Schedule B
    # line 3), so AGI is 30,000 + 500 = 30,500.
    adjusted_gross_income: 30_500
    # Line 14: 30,000.
    # Line 15: "All interest and dividend income (including nontaxable
    # interest)": 2,000.
    # Line 30: 0. The Form 8815 exclusion is not a Schedule 1 adjustment.
    # Line 33: 30,000 + 2,000 = 32,000.
    mi_household_resources: 32_000

- name: Employer adoption benefits excluded under IRC 137 stay in household resources
  period: 2025
  input:
    people:
      person1:
        age: 45
        # Includes 5,000 the employer paid for qualified adoption expenses.
        employment_income_before_lsr: 60_000
        qualified_adoption_assistance_expense: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Federal: the 5,000 is excluded (Form 8839 Part III) and left out of
    # W-2 box 1, so AGI is 55,000.
    adjusted_gross_income: 55_000
    # Line 14: "all compensation received as an employee ... and any other
    # amounts reported to you on Form W-2". The adoption benefits are
    # reported in W-2 box 12 (code T): 55,000 + 5,000 = 60,000.
    # Line 30: 0. The exclusion is not a Schedule 1 adjustment.
    # Line 33: 60,000.
    mi_household_resources: 60_000

- name: Puerto Rico income excluded under IRC 933 stays in household resources
  period: 2025
  input:
    people:
      person1:
        age: 45
        # Includes 15,000 earned in Puerto Rico before moving to Michigan.
        employment_income_before_lsr: 45_000
    tax_units:
      tax_unit:
        members: [person1]
        puerto_rico_income: 15_000
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Federal: section 933 excludes the 15,000, so AGI is 30,000.
    adjusted_gross_income: 30_000
    # Line 14: all wages, 45,000. Total household resources include "all
    # income exempt or excluded from AGI" (book page 26).
    # Line 30: 0. The exclusion is not a Schedule 1 adjustment.
    # Line 33: 45,000.
    mi_household_resources: 45_000

- name: Possession income excluded under IRC 931 stays in household resources
  period: 2025
  input:
    people:
      person1:
        age: 45
        # Includes 8,000 of income from a specified possession.
        employment_income_before_lsr: 40_000
    tax_units:
      tax_unit:
        members: [person1]
        specified_possession_income: 8_000
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Federal: section 931 excludes the 8,000, so AGI is 32,000.
    adjusted_gross_income: 32_000
    # Line 14: all wages, 40,000, as "all income exempt or excluded from AGI"
    # counts (book page 26).
    # Line 30: 0. The exclusion is not a Schedule 1 adjustment.
    # Line 33: 40,000.
    mi_household_resources: 40_000

- name: Schedule 1 adjustments reduce household resources and federal exclusions do not
  period: 2025
  input:
    people:
      person1:
        age: 45
        # Includes 4,000 of employer adoption benefits (W-2 box 12, code T).
        employment_income_before_lsr: 50_000
        qualified_adoption_assistance_expense: 4_000
        taxable_interest_income: 3_000
        us_bonds_for_higher_ed: 1_000
        traditional_ira_contributions: 2_000
        early_withdrawal_penalty: 300
        student_loan_interest: 1_000
        health_insurance_premiums: 1_200
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Federal: 50,000 + 3,000 - 4,000 (IRC 137) - 1,000 (IRC 135) = 48,000
    # of gross income, less Schedule 1 line 26 (2,000 + 300 + 1,000 =
    # 3,300): AGI 44,700, under the student loan interest phase-out.
    adjusted_gross_income: 44_700
    # Line 14: 50,000. Line 15: 3,000, including the excluded 1,000.
    # Line 28: 53,000.
    # Line 30: IRA deduction (Schedule 1 line 20) 2,000 + penalty on early
    # withdrawal of savings (line 18) 300 + student loan interest deduction
    # (line 21) 1,000 = 3,300.
    # Line 31: 1,200.
    # Line 33: 53,000 - (3,300 + 1,200) = 48,500.
    mi_household_resources: 48_500

- name: Negative business income floored at 0
  period: 2024
  input:
    self_employment_income: -50_000
    irs_employment_income: 100_000
    state_code: MI
  output:
    # Line 14: 100,000. Line 16: Schedule C -50,000; the total is negative,
    # so 0. The business loss is not a Schedule 1 adjustment, so line 30 is
    # 0 (no self-employment tax on a loss).
    # Line 33: 100,000.
    mi_household_resources: 100_000

- name: Negative SSTB business income floored at 0
  period: 2024
  input:
    sstb_self_employment_income: -50_000
    irs_employment_income: 100_000
    state_code: MI
  output:
    # Line 14: 100,000. Line 16: Schedule C -50,000, so 0. Line 30: 0.
    # Line 33: 100,000.
    mi_household_resources: 100_000

- name: Farm operations income counted as household resources
  period: 2024
  input:
    farm_operations_income: 50_000
    state_code: MI
  output:
    # Line 16: Schedule F 50,000.
    # Line 30: deduction for self-employment tax (Schedule 1 line 15), half
    # of 50,000 x 0.9235 x 15.3% = 3,532.39.
    # Line 33: 50,000 - 3,532.39 = 46,467.61.
    mi_household_resources: 46_467.61
  absolute_error_margin: 0.01

- name: Negative rental income floored at 0
  period: 2024
  input:
    rental_income: -30_000
    employment_income_before_lsr: 50_000
    state_code: MI
  output:
    # Line 14: 50,000. Line 17: Schedule E Part I -30,000; the total is
    # negative, so 0. The rental loss is not a Schedule 1 adjustment, so
    # line 30 is 0.
    # Line 33: 50,000.
    mi_household_resources: 50_000

- name: Large capital gains loss limited to 3000
  period: 2024
  input:
    long_term_capital_gains: -100_000
    short_term_capital_gains: -50_000
    employment_income_before_lsr: 50_000
    state_code: MI
    filing_status: JOINT
  output:
    # Line 19: "losses cannot exceed $3,000 if single or married filing
    # jointly": max(-150,000, -3,000) = -3,000.
    # The capital loss is not a Schedule 1 adjustment, so line 30 is 0.
    # Line 33: 50,000 - 3,000 = 47,000.
    mi_household_resources: 47_000

- name: Capital gains loss limited to 1500 for MFS
  period: 2024
  input:
    long_term_capital_gains: -100_000
    employment_income_before_lsr: 50_000
    state_code: MI
    filing_status: SEPARATE
  output:
    # Line 19: "$1,500 if married filing separately": max(-100,000, -1,500)
    # = -1,500. Line 30: 0.
    # Line 33: 50,000 - 1,500 = 48,500.
    mi_household_resources: 48_500

- name: Capital gain distributions net against a capital loss
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        long_term_capital_gains: -20_000
        non_sch_d_capital_gains: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 19: "net capital gains and losses ... from your U.S. Schedule D".
    # Schedule D line 16 = -20,000 + 20,000 (line 13) = 0. Line 30: 0.
    mi_household_resources: 50_000

- name: Spouses' capital gains and losses net on a joint Schedule D
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        long_term_capital_gains: 40_000
      person2:
        age: 45
        long_term_capital_gains: -40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    # Line 19: Schedule D line 16 = 40,000 - 40,000 = 0.
    mi_household_resources: 50_000

- name: A Schedule C loss nets against S corporation income on line 16
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        self_employment_income: -10_000
        s_corp_income: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 14: 50,000.
    # Line 16: Schedule C -10,000 + Schedule E Part II 30,000 = 20,000.
    # Line 30: 0 (no self-employment tax: the Schedule C result is a loss,
    # and S corporation income is not self-employment income).
    # Line 33: 50,000 + 20,000 = 70,000.
    mi_household_resources: 70_000

- name: A net business loss on line 16 is floored at 0
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        self_employment_income: -40_000
        s_corp_income: 30_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Line 16: -40,000 + 30,000 = -10,000; "If the total is negative enter
    # 0." The net business loss is excluded (MCL 206.508(4)(a)), not
    # subtracted on line 30.
    # Line 33: 50,000.
    mi_household_resources: 50_000

- name: A business loss does not reduce rental income
  period: 2025
  input:
    people:
      person1:
        age: 45
