    # Line 14: 40,000. The claimant's own pilot payment, 1,000, counts. The
    # dependent's 7,000 is the dependent's own income: nothing shows it is a
    # public assistance payment to the claimant's household (line 27).
    # Line 33: 41,000.
    mi_household_resources: 41_000

- name: A supplied net capital gains amount counts on line 19
  period: 2025
  input:
    employment_income_before_lsr: 10_000
    net_capital_gains: 5_000
    state_code: MI
  output:
    # A tax unit net_capital_gains input is the filer's Schedule D amount.
    # Line 14: 10,000. Line 19: 5,000.
    filer_loss_limited_net_capital_gains: 5_000
    mi_household_resources: 15_000

- name: A supplied net capital loss is limited to $3,000 on line 19
  period: 2025
  input:
    employment_income_before_lsr: 10_000
    net_capital_gains: -5_000
    state_code: MI
  output:
    # Line 19: "losses cannot exceed $3,000", so -3,000.
    # Line 33: 10,000 - 3,000 = 7,000.
    filer_loss_limited_net_capital_gains: -3_000
    mi_household_resources: 7_000

- name: Supplied Schedule 1 adjustment amounts come off line 30
  period: 2025
  input:
    employment_income_before_lsr: 10_000
    self_employment_tax_ald: 1_000
    self_employed_pension_contribution_ald: 1_000
    state_code: MI
  output:
    # Tax unit inputs for the deduction for self-employment tax and the SEP
    # deduction are the filer's Schedule 1 amounts.
    # Line 33: 10,000 - 1,000 - 1,000 = 8,000.
    mi_household_resources: 8_000

- name: A supplied self-employed health insurance deduction comes off line 30
  period: 2025
  input:
    employment_income_before_lsr: 10_000
    self_employed_health_insurance_ald: 1_000
    state_code: MI
  output:
    # Line 33: 10,000 - 1,000 = 9,000.
    mi_household_resources: 9_000

