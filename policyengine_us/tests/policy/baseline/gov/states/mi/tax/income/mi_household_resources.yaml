- name: Cannot be negative
  period: 2024
  input:
    net_capital_gains: -2_000
    state_code: MI
    health_insurance_premiums: 0
    above_the_line_deductions: 1_000
  output:
    # Capital gains losses are limited to -2,000 (within $3,000 limit)
    # but mi_household_resources cannot be negative, so 0
    mi_household_resources: 0

- name: Reduced to 0
  period: 2024
  input:
    net_capital_gains: 2_000
    state_code: MI
    health_insurance_premiums: 3_000
    above_the_line_deductions: 1_000
  output:
    # 2,000 - 3,000 - 1,000 = -2,000, floored at 0
    mi_household_resources: 0

- name: Partially reduced
  period: 2024
  input:
    net_capital_gains: 10_000
    state_code: MI
    health_insurance_premiums: 3_000
    above_the_line_deductions: 1_000
  output:
    # 10,000 - 3,000 - 1,000 = 6,000
    mi_household_resources: 6_000

- name: Negative business income floored at 0
  period: 2024
  input:
    self_employment_income: -50_000
    irs_employment_income: 100_000
    state_code: MI
  output:
    # Per MI-1040CR-7 Line 21: "If negative, enter 0"
    # Self-employment income floored at 0 = 0
    # But loss_ald = 50,000 (federal above-the-line deduction for business loss)
    # Total: 100,000 - 50,000 = 50,000
    mi_household_resources: 50_000

- name: Negative SSTB business income floored at 0
  period: 2024
  input:
    sstb_self_employment_income: -50_000
    irs_employment_income: 100_000
    state_code: MI
  output:
    mi_household_resources: 50_000

- name: Farm operations income counted as household resources
  period: 2024
  input:
    farm_operations_income: 50_000
    above_the_line_deductions: 0
    state_code: MI
  output:
    mi_household_resources: 50_000

- name: Negative rental income floored at 0
  period: 2024
  input:
    rental_income: -30_000
    employment_income_before_lsr: 50_000
    state_code: MI
  output:
    # Per MI-1040CR-7 Line 22: "If negative, enter 0"
    # Rental income floored at 0 for the MI source line,
    # but federal above_the_line_deductions includes loss_ald of 30,000.
    # Total: 50,000 - 30,000 = 20,000
    mi_household_resources: 20_000

- name: Large capital gains loss limited to 3000
  period: 2024
  input:
    long_term_capital_gains: -100_000
    short_term_capital_gains: -50_000
    employment_income_before_lsr: 50_000
    state_code: MI
    filing_status: JOINT
  output:
    # Per MI-1040CR-7 Line 24: losses cannot exceed $3,000 for MFJ
    # loss_limited_net_capital_gains: max(-150,000, -3,000) = -3,000
    # The capital loss is not a U.S. Schedule 1 adjustment (MI-1040CR line
    # 30), so it is not subtracted a second time.
    # Total: 50,000 + (-3,000) = 47,000
    mi_household_resources: 47_000

- name: Capital gains loss limited to 1500 for MFS
  period: 2024
  input:
    long_term_capital_gains: -100_000
    employment_income_before_lsr: 50_000
    state_code: MI
    filing_status: SEPARATE
  output:
    # Per MI-1040CR-7 Line 24: losses cannot exceed $1,500 for MFS
    # loss_limited_net_capital_gains: max(-100,000, -1,500) = -1,500
    # Not subtracted again as a Schedule 1 adjustment (line 30).
    # Total: 50,000 + (-1,500) = 48,500
    mi_household_resources: 48_500

- name: Capital gain distributions net against a capital loss
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        long_term_capital_gains: -20_000
        non_sch_d_capital_gains: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # 2025 MI-1040 book, MI-1040CR line 19: "net capital gains and losses ...
    # from your U.S. Schedule D". Schedule D line 16 = -20,000 + 20,000
    # (line 13) = 0. Line 30 (U.S. Schedule 1 adjustments) has none.
    mi_household_resources: 50_000

- name: Spouses' capital gains and losses net on a joint Schedule D
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income_before_lsr: 50_000
        long_term_capital_gains: 40_000
      person2:
        age: 45
        long_term_capital_gains: -40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    # Line 19: Schedule D line 16 = 40,000 - 40,000 = 0.
    mi_household_resources: 50_000
