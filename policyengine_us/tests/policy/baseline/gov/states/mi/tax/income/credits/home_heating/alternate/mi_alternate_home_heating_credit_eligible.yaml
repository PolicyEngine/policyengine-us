- name: Eligible for alternate home heating credit
  period: 2022
  input:
    utilities_included_in_rent: false
    mi_household_resources: 1_000
    mi_exemptions_count: 2
    state_code: MI
  output:
    mi_alternate_home_heating_credit_eligible: true

- name: Eligible for alternate home heating credit when only non-heating items are included in rent
  period: 2022
  input:
    utilities_included_in_rent: true
    heat_expense_included_in_rent: false
    mi_household_resources: 1_000
    mi_exemptions_count: 2
    state_code: MI
  output:
    mi_alternate_home_heating_credit_eligible: true

- name: Househould resource ineligible, 2 exemptions
  period: 2021
  input:
    utilities_included_in_rent: false
    mi_household_resources: 20_504
    mi_exemptions_count: 2
    state_code: MI
  output: # 20_504 >= 20_504
    mi_alternate_home_heating_credit_eligible: false

- name: Househould resource ineligible, 7 exemptions
  period: 2021
  input:
    utilities_included_in_rent: false
    mi_household_resources: 27_700
    mi_exemptions_count: 7
    state_code: MI
  output: # 27_700 >= 27_700
    mi_alternate_home_heating_credit_eligible: false

- name: Ineligible for alternate home heating credit as heat is included in rent
  period: 2022
  input:
    heat_expense_included_in_rent: true
    utilities_included_in_rent: false
    mi_household_resources: 1_000
    mi_exemptions_count: 2
    state_code: MI
  output:
    # MI-1040CR-7 lines 40-43: heat included with rent bars the alternate credit.
    mi_alternate_home_heating_credit_eligible: false
