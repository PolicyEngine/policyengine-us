- name: MI age-18 constant-care student defaults to expected graduation when none is supplied
  period: 2026-09
  input:
    state_code:
      2026: [MI, MI]
    age:
      2026: [18, 18]
    is_tax_unit_dependent:
      2026: [true, true]
    mi_ccap_requires_court_ordered_constant_care:
      2026: [true, true]
    is_in_k12_school:
      2026: [true, false]
  output:
    # Expected graduation defaults to high-school enrollment, so the enrolled
    # student meets the age-18 route while the non-enrolled child does not.
    mi_ccap_expected_to_graduate_before_19: [true, false]
    mi_ccap_eligible_child: [true, false]
