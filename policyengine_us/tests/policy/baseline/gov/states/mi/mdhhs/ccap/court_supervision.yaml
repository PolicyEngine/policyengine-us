- name: MI supervised teenager receives child-care benefit through full pipeline
  period: 2026-09
  absolute_error_margin: 0.02
  input:
    people:
      parent:
        age:
          2026: 35
        employment_income:
          2026: 12000
        weekly_hours_worked_before_lsr:
          2026: 25
      child:
        age:
          2026: 17
        is_tax_unit_dependent:
          2026: true
        is_in_k12_school:
          2026: true
        childcare_hours_per_week:
          2026: 30
        childcare_hours_per_day:
          2026: 6
        childcare_days_per_week:
          2026: 5
        childcare_attending_days_per_month:
          2026: 20
        pre_subsidy_childcare_expenses:
          2026: 1200
        is_under_court_supervision:
          2026: true
    tax_units:
      tax_unit:
        members: [parent, child]
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses:
          2026: 1200
    households:
      household:
        members: [parent, child]
        state_code:
          2026: MI
        county_str:
          2026: WAYNE_COUNTY_MI
  output:
    mi_ccap_eligible_child: [false, true]
    mi_ccap_eligible: true
    mi_ccap: 100

