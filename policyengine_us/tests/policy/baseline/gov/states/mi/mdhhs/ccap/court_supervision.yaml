    is_tax_unit_dependent:
      2026: true
    is_under_court_supervision:
      2026: true
    mi_ccap_requires_court_ordered_constant_care:
      2026: true
    is_in_secondary_school:
      2026: true
    is_in_k12_school:
      2026: false
    is_full_time_student:
      2026: true
    mi_ccap_expected_to_graduate_before_19:
      2026: true
  output:
    # is_in_k12_school is imputed only through 17, so is_in_secondary_school
    # alone establishes high-school enrollment at 18.
