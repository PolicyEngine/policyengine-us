# Verified court-supervision pathways and independent eligibility requirements.
- name: MI court supervision without age-18 facts qualifies only below 18
  period: 2026-09
  input:
    state_code:
      2026: [MI, MI, MI, MI, MI, MI]
    age:
      2026: [12, 13, 17, 18, 19, 40]
    is_under_court_supervision:
      2026: [true, true, true, true, true, true]
    is_tax_unit_dependent:
      2026: [true, true, true, true, true, true]
  output:
    mi_ccap_eligible_child: [true, true, true, false, false, false]

- name: MI age-18 court constant-care student meets all conditions
  period: 2026-09
  input:
    state_code:
      2026: MI
    age:
      2026: 18
    is_tax_unit_dependent:
      2026: true
    is_under_court_supervision:
      2026: true
    mi_ccap_requires_court_ordered_constant_care:
      2026: true
    is_in_secondary_school:
      2026: true
    is_in_k12_school:
      2026: true
    is_full_time_student:
      2026: true
    mi_ccap_expected_to_graduate_before_19:
      2026: true
  output:
    mi_ccap_eligible_child: true
    is_disabled: false
    receives_or_needs_protective_services: false

