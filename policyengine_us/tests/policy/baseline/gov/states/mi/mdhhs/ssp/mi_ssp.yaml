- name: Case 1, single eligible person sums to individual amount.
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    people:
      person1:
        is_ssi_eligible: true
        mi_ssp_living_arrangement: INDEPENDENT_LIVING
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Single person IL = $14
    mi_ssp: 14

- name: Case 2, joint couple in same arrangement sums per-person amounts.
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    people:
      person1:
        # $707/mo SSI couple half
        ssi: 707
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head_or_spouse: true
        mi_ssp_living_arrangement: INDEPENDENT_LIVING
      person2:
        # $707/mo SSI couple half
        ssi: 707
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head_or_spouse: true
        mi_ssp_living_arrangement: INDEPENDENT_LIVING
    marital_units:
      marital_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    # Couple rate $21 total ($10.50 + $10.50)
    mi_ssp: 21

- name: Case 3, no one receives SSI so SPM unit total is zero.
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    people:
      person1:
        ssi: 0
        mi_ssp_living_arrangement: INDEPENDENT_LIVING
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    mi_ssp: 0

- name: Case 4, non-Michigan SPM unit gets zero.
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    people:
      person1:
        # $943/mo SSI individual FBR
        ssi: 943
        mi_ssp_living_arrangement: INDEPENDENT_LIVING
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: OH
  output:
    mi_ssp: 0

- name: Michigan couple amount excludes a third aged adult in the default marital unit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age:
          2026: 72
        is_tax_unit_head:
          2026: true
      spouse:
        age:
          2026: 70
        is_tax_unit_spouse:
          2026: true
      dependent:
        age:
          2026: 68
        is_tax_unit_dependent:
          2026: true
    tax_units:
      unit:
        members: [head, spouse, dependent]
    spm_units:
      unit:
        members: [head, spouse, dependent]
    households:
      home:
        members: [head, spouse, dependent]
        state_code:
          2026: MI
  output:
    ssi_claim_is_joint: [true, true, false]
    mi_ssp_couple_eligible: [true, true, false]
    # Michigan RFT 248, independent living, effective January 1, 2026:
    # https://mdhhs-pres-prod.michigan.gov/olmweb/ex/RF/Public/RFT/248.pdf#page=2
    # $21 / 2 = $10.50 per spouse, plus $14 for the individual = $35.
    mi_ssp_person: [10.5, 10.5, 14]
    mi_ssp: 35
