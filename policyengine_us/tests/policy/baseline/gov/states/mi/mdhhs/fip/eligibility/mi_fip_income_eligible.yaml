- name: Enrolled recipient with income below payment standard is eligible
  period: 2025-01
  input:
    employment_income_before_lsr: 6_000  # $500/month
    is_tanf_enrolled: true
    state_code: MI
  output:
    # Enrolled uses Issuance Deficit Test (50% rate):
    # Countable = $500 - [$200 + 50%×$300] = $500 - $350 = $150
    # Payment standard (size 1) = $363
    # $150 < $363 → ELIGIBLE
    mi_fip_income_eligible: true

- name: New applicant with low income passes initial eligibility (20% test)
  period: 2025-01
  input:
    employment_income_before_lsr: 4_800  # $400/month
    is_tanf_enrolled: false
    state_code: MI
  output:
    # Initial eligibility uses 20% deduction:
    # Countable (20%) = $400 - [$200 + 20%×$200] = $400 - $240 = $160
    # Payment standard (size 1) = $363
    # $160 < $363 → ELIGIBLE
    mi_fip_income_eligible: true

- name: New applicant with high income fails initial eligibility (20% test)
  period: 2025-01
  input:
    employment_income_before_lsr: 12_000  # $1,000/month
    is_tanf_enrolled: false
    state_code: MI
  output:
    # Initial eligibility uses 20% deduction:
    # Countable (20%) = $1,000 - [$200 + 20%×$800] = $1,000 - $360 = $640
    # Payment standard (size 1) = $363
    # $640 > $363 → NOT ELIGIBLE
    mi_fip_income_eligible: false

- name: New applicant family of 3 at initial eligibility threshold
  period: 2025-01
  input:
    people:
      parent:
        employment_income_before_lsr: 9_768  # $814/month
        age: 35
      child1:
        age: 8
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: MI
  output:
    # Initial eligibility (20% deduction):
    # Countable = $814 - [$200 + 20%×$614] = $814 - $322.80 = $491.20
    # Payment standard (size 3) = $583
    # $491.20 < $583 → ELIGIBLE
    mi_fip_income_eligible: true

- name: New applicant family of 3 just above initial threshold
  period: 2025-01
  input:
    people:
      parent:
        employment_income_before_lsr: 9_900  # $825/month
        age: 35
      child1:
        age: 8
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: MI
  output:
    # Initial eligibility (20% deduction):
    # Countable = $825 - [$200 + 20%×$625] = $825 - $325 = $500
    # Payment standard (size 3) = $583
    # $500 < $583 → ELIGIBLE
    mi_fip_income_eligible: true

- name: Household with zero income is eligible
  period: 2025-01
  input:
    employment_income_before_lsr: 0
    state_code: MI
  output:
    mi_fip_income_eligible: true

- name: Household outside Michigan returns false
  period: 2025-01
  input:
    employment_income_before_lsr: 12_000
    state_code: CA
  output:
    mi_fip_income_eligible: false

- name: Enrolled recipient with an issuance deficit under $10 is not eligible
  period: 2025-01
  input:
    is_tanf_enrolled: true
    state_code: MI
    mi_fip_payment_standard: 583
    mi_fip_countable_income_for_benefit: 575
    mi_fip_countable_income_for_eligibility: 575
  output:
    # Issuance deficit = $583 - $575 = $8, under $10 (BEM 518)
    mi_fip_income_eligible: false

- name: Enrolled recipient with an issuance deficit of exactly $10 is eligible
  period: 2025-01
  input:
    is_tanf_enrolled: true
    state_code: MI
    mi_fip_payment_standard: 583
    mi_fip_countable_income_for_benefit: 573
    mi_fip_countable_income_for_eligibility: 600
  output:
    # Issuance deficit = $583 - $573 = $10
    # (the Qualifying Deficit Test does not apply to enrolled recipients)
    mi_fip_income_eligible: true

- name: Applicant passing the qualifying test with an issuance deficit under $10 is not eligible
  period: 2025-01
  input:
    is_tanf_enrolled: false
    state_code: MI
    mi_fip_payment_standard: 583
    mi_fip_countable_income_for_benefit: 575
    mi_fip_countable_income_for_eligibility: 580
  output:
    # Qualifying deficit = $583 - $580 = $3 (passes)
    # Issuance deficit = $583 - $575 = $8, under $10 (fails)
    mi_fip_income_eligible: false

- name: Applicant passing both deficit tests is eligible
  period: 2025-01
  input:
    is_tanf_enrolled: false
    state_code: MI
    mi_fip_payment_standard: 583
    mi_fip_countable_income_for_benefit: 500
    mi_fip_countable_income_for_eligibility: 580
  output:
    # Qualifying deficit = $583 - $580 = $3 (passes)
    # Issuance deficit = $583 - $500 = $83 (passes)
    mi_fip_income_eligible: true
