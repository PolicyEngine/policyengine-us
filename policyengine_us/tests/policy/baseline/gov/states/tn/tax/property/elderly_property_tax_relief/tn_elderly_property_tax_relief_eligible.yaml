- name: Case 1, senior homeowner at the 2026 income limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 65
        taxable_pension_income: 38_470
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    tn_elderly_property_tax_relief_eligible: true

