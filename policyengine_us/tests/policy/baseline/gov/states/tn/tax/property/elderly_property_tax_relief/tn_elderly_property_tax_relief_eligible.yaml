- name: Case 10, Social Security alone can exceed the income limit.
  period: 2026
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 45_000
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # Federal adjusted gross income is 0: provisional income is 22,500 (half
    # of 45,000), under the 25,000 base, so no Social Security is taxable.
    # Rule 0600-03-.08(3) counts "social security payments after the Medicare
    # deduction": 45,000 - 2,434.80 (202.90 x 12, the 2026 Part B premium)
    # = 42,565.20, above the 38,470 limit for tax year 2026.
    tn_elderly_property_tax_relief_eligible: false

- name: Case 11, the Medicare deduction brings Social Security under the income limit.
  period: 2026
  input:
    people:
      person1:
        age: 70
        social_security_retirement: 40_000
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # Provisional income is 20,000, under the 25,000 base, so adjusted gross
    # income is 0. Income: 40,000 - 2,434.80 = 37,565.20, at most 38,470.
    tn_elderly_property_tax_relief_eligible: true

- name: Case 12, nontaxable income exactly at the 2026 income limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 65
        taxable_pension_income: 8_470
        veterans_benefits: 30_000
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # Adjusted gross income 8,470 + veterans' benefits 30,000 = 38,470, the
    # 2026 limit. No Social Security, so no Medicare deduction.
    tn_elderly_property_tax_relief_eligible: true

- name: Case 13, nontaxable income one dollar above the 2026 income limit is ineligible.
  period: 2026
  input:
    people:
      person1:
        age: 65
        taxable_pension_income: 8_470
        veterans_benefits: 30_001
        real_estate_taxes: 1_000
        assessed_property_value: 25_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # 8,470 + 30,001 = 38,471, above the 38,470 limit.
    tn_elderly_property_tax_relief_eligible: false
