- name: TN court supervision applies to each child separately in a mixed family
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_under_court_supervision: true
      younger:
        age: 12
      supervised:
        age: 17
        is_under_court_supervision: true
      sibling:
        age: 17
      overage:
        age: 19
        is_under_court_supervision: true
    households:
      household:
        members:
        - parent
        - younger
        - supervised
        - sibling
        - overage
        state_code: TN
  output:
    tn_ccap_eligible_child:
    - false
    - true
    - true
    - false
    - false
