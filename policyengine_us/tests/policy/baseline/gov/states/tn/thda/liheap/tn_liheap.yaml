# The award is the benefit matrix cell for the size group (1-2, 3-5, 6-8, 9 or more),
# the income group (A-D) and the energy burden column; burden is annual energy cost
# over income rounded half up to four decimals (2026 Policy Manual 2.17), with columns starting
# at 0, 0.0510, 0.0672, 0.0828, 0.0998, 0.1215, 0.1529, 0.2182 and 1.0000, and zero
# income takes column 9. FFY2026 (2026 Benefit Matrix): income groups A-C end at 71%,
# 87% and 117% of the 2025 poverty guideline (15,650 + 5,500 per additional person),
# and a propane benefit is at least 500 (2026 Policy Manual 2.10). FFY2027 (LI-12
# matrix): income groups end at the printed amounts and propane has no minimum.
# Wages of 15,080 are full-time work (2,080 hours) at the federal 7.25 minimum wage,
# which Tennessee follows; electricity of 1,680 is about the EIA 2024 Tennessee average
# residential bill of 140 a month.

- name: Case 1, income exactly at the size-one group A top in FFY2026 receives the group A amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        # Part-time work at 7.25 an hour.
        employment_income: 11_111.50
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_680
    households:
      household:
        members: [person1]
        state_code: TN
  output:
    # Group A top 15,650 x 0.71 = 11,111.50; 1,680 / 11,111.50 = 0.1512 -> column 6
    tn_liheap: 560

