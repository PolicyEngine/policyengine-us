      person2: {age: 43}
      person3: {age: 17}
      person4: {age: 16}
      person5: {age: 15}
      person6: {age: 14}
      person7: {age: 13}
      person8: {age: 12}
      person9: {age: 11}
      person10: {age: 10}
      person11: {age: 9}
      person12: {age: 8}
      person13: {age: 7}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9, person10, person11, person12, person13]
        state_code: TN
  output:
    tn_liheap_household_size: 13
    # floor(61,641 x 1.53) = floor(94,310.73)
    tn_liheap_income_limit: 94_310

- name: Case 4, an FFY2027 eight-person household keeps the 60 percent state median income limit.
