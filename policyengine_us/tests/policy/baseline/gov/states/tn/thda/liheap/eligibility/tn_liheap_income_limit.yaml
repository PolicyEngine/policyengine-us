      person2: {age: 38}
      person3: {age: 16}
      person4: {age: 14}
      person5: {age: 12}
      person6: {age: 10}
      person7: {age: 8}
      person8: {age: 6}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        state_code: TN
  output:
    # floor(63,196 x 1.38) = floor(87,210.48)
    tn_liheap_income_limit: 87_210

- name: Case 5, an FFY2027 nine-person household switches to 150 percent of the poverty guideline.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 40}
      person2: {age: 38}
      person3: {age: 17}
      person4: {age: 16}
      person5: {age: 14}
      person6: {age: 12}
      person7: {age: 10}
      person8: {age: 8}
      person9: {age: 6}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8, person9]
        state_code: TN
  output:
    # floor(1.5 x (15,960 + 5,680 x 8)) = floor(1.5 x 61,400); 60% SMI would be 89,106
    tn_liheap_income_limit: 92_100

