# FFY2026 limit is 60% of the Tennessee state median income for every size (2026
# Policy Manual 2.10; FFY2026 plan 2.1): four-person limit floor(102,735 x 0.6) =
# 61,641, and each size uses floor(61,641 x factor), with factors 0.52 + 0.16 per
# person through six and 0.03 for each person above six.
# FFY2027 (draft 2027 manual 2.10; FFY2027 plan 2.1) keeps 60% SMI for one to eight
# members, floor(105,327 x 0.6) = 63,196 for four, and uses 150% of the 2026 poverty
# guideline (15,960 + 5,680 per additional person) for nine or more.
# Household size counts only citizens and qualified noncitizens (2026 Policy Manual 2.4).
# Electricity of 1,680 is about the EIA 2024 Tennessee average residential bill of
# 140 a month.

- name: Case 1, an undocumented member is excluded from household size so the FFY2026 size-one limit applies.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
      person2:
        age: 42
        immigration_status: UNDOCUMENTED
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_680
    households:
      household:
        members: [person1, person2]
        state_code: TN
  output:
    tn_liheap_household_size: 1
    # floor(61,641 x 0.52) = floor(32,053.32)
    tn_liheap_income_limit: 32_053

- name: Case 2, an FFY2026 eight-person household uses the rule value rather than the printed 85,064.50.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1: {age: 40}
      person2: {age: 38}
      person3: {age: 16}
      person4: {age: 14}
      person5: {age: 12}
      person6: {age: 10}
      person7: {age: 8}
      person8: {age: 6}
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        tanf: 0
        heating_type: NATURAL_GAS
        gas_expense: 900
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6, person7, person8]
        state_code: TN
  output:
    tn_liheap_household_size: 8
    # floor(61,641 x 1.38) = floor(85,064.58)
    tn_liheap_income_limit: 85_064

