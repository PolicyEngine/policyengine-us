- name: Case 14, railroad, pension, military retirement and VA benefits are counted net of Medicare Part A and Part B premiums.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi: 0
        railroad_benefits: 16_000
        taxable_private_pension_income: 4_000
        # Premium-free Part A at the default 40 quarters; 2026 standard
        # Part B premium of 202.90 a month.
        medicare_part_b_premium: 2_434.80
      person2:
        age: 68
        ssi: 0
        military_retirement_pay: 8_000
        # Survivor benefit plan annuity.
        military_retirement_pay_survivors: 2_000
        veterans_benefits: 1_000
        # 2026 reduced Part A premium of 311 a month (30-39 quarters).
        medicare_part_a_premium: 3_732
        medicare_part_b_premium: 2_434.80
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_680
    households:
      household:
        members: [person1, person2]
        state_code: TN
  output:
    # person1: 16,000 + 4,000 - (0 + 2,434.80) = 17,565.20
    # person2: (8,000 + 2,000) + 1,000 - (3,732 + 2,434.80) = 4,833.20
    # 17,565.20 + 4,833.20 = 22,398.40
    tn_liheap_countable_income: 22_398.40
