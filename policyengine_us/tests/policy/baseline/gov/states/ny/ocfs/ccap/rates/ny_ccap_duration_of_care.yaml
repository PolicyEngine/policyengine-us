- name: Case 1, care at the weekly threshold uses the weekly rate.
  period: 2025-01
  input:
    childcare_hours_per_day: 6
    childcare_days_per_week: 5
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY

- name: Case 2, care below 30 weekly hours and at six daily hours uses the daily rate.
  period: 2025-01
  input:
    childcare_hours_per_day: 6
    childcare_days_per_week: 4
    state_code: NY
  output:
    ny_ccap_duration_of_care: DAILY

- name: Case 3, care below six daily hours uses the part-day rate.
  period: 2025-01
  input:
    childcare_hours_per_day: 2
    childcare_days_per_week: 5
    state_code: NY
  output:
    ny_ccap_duration_of_care: PART_DAY

- name: Case 4, extended daily care retains the daily base category.
  period: 2025-01
  input:
    childcare_hours_per_day: 12
    childcare_days_per_week: 2
    state_code: NY
  output:
    ny_ccap_duration_of_care: DAILY

# 18 NYCRR 415.9(a): the weekly rate turns on 30 or more hours of care per
# week, so a six-day schedule reaching 30 hours is weekly. The extra day is
# priced as an additional period in ny_ccap_market_rate rather than switching
# the whole week to a daily rate.
- name: Case 5, care across six days reaching thirty weekly hours uses the weekly rate.
  period: 2025-01
  input:
    childcare_hours_per_day: 5
    childcare_days_per_week: 6
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY

# 415.9(b) allows the daily rate only below 30 hours per week; contrast with
# Case 2, where the same six daily hours over four days stay daily.
- name: Case 6, six-hour care over six days exceeds thirty weekly hours and is weekly.
  period: 2025-01
  input:
    childcare_hours_per_day: 6
    childcare_days_per_week: 6
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
