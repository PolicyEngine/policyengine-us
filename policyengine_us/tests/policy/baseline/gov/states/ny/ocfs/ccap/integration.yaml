- name: Case 5, historical New York City hourly care and county share remain available.
  period: 2023-01
  input:
    people:
      person1:
        age: 6
        childcare_provider_type_group: DCC_SACC
        childcare_hours_per_day: 2
        childcare_days_per_week: 2
        is_ccdf_eligible: true
    spm_units:
      spm_unit:
        members: [person1]
        ccdf_income: 30_000
        spm_unit_fpg: 25_000
        spm_unit_pre_subsidy_childcare_expenses: 12_000
    households:
      household:
        members: [person1]
        county_str: BRONX_COUNTY_NY
        state_code: NY
  output:
    ny_ccap_county_group: GROUP_5
    ny_ccap_age_group: SCHOOL_AGE
    ny_ccap_duration_of_care: HOURLY
    # Historical rate: $10/hour * 4 hours/week * 52 / 12.
    ny_ccap_market_rate: 10 * 4 * 52 / 12
    # Historical Bronx family share: 10% of income above FPL.
    ny_ccap_family_share: (30_000 - 25_000) * 0.1 / 12
    ny_ccap: (10 * 4 * 52 - (30_000 - 25_000) * 0.1) / 12
    # Annual aggregators reflect nine historical-share months and three
    # statewide-share months in 2023, then return the annual average here.
    ny_child_care_subsidies: 141
    child_care_subsidies: 141
  absolute_error_margin: 0.01
