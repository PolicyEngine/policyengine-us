  absolute_error_margin: 0.01

# The child receives min($900 of monthly expenses, $600 market rate) = $600 after the share waiver.
- name: Safety Net Assistance waives the share and required activity qualifies the child.
  period: 2025-01
  input:
    people:
      caretaker:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_full_time_student: false
        ny_ccap_market_rate:
          2025-01: 0
      child:
        age: 4
        childcare_hours_per_day: 6
        childcare_days_per_week: 5
        ny_ccap_market_rate:
          2025-01: 600
    spm_units:
      spm_unit:
        members: [caretaker, child]
        is_tanf_enrolled:
          2025-01: false
        meets_ccdf_activity_test: false
        ny_ccap_countable_income:
          2025: 36_000
        spm_unit_fpg:
          2025: 24_000
        hhs_smi:
          2025: 60_000
        spm_unit_pre_subsidy_childcare_expenses:
          2025: 10_800
        ny_safety_net_assistance_received:
          2025-01: true
        ny_ccap_required_activity:
          2025-01: true
    households:
      household:
        members: [caretaker, child]
        state_code: NY
  output:
    ny_ccap_activity_eligible: true
    ny_ccap_family_share_exempt: true
    ny_ccap_family_share: 0
    ny_ccap_eligible_child: [false, true]
    ny_ccap: 600
  absolute_error_margin: 0.01

