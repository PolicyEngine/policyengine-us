- name: Case 4, family share cannot make the subsidy negative.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 100
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_pre_subsidy_childcare_expenses: 1_200
        ny_ccap_family_share: 150
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_ccap: 0
  absolute_error_margin: 0.01

# 18 NYCRR 415.6(e)(3) caps payments per child, not on pooled totals. With
# $4,000 a month of expenses split evenly, child 1 is capped at its own
# $1,000 rate and child 2 draws only its $2,000 share, giving $3,000. A
# pooled cap would have paid min($4,000, $3,500) = $3,500.
- name: Case 5, the payment cap applies per child rather than to pooled totals.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 1_000
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
      person2:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 2_500
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 48_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    ny_ccap: 3_000
  absolute_error_margin: 0.01

# A child who is not in paid care must not shrink an eligible sibling's share.
- name: Case 6, expenses prorate across children in paid care only.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 3_000
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
      person2:
        ny_ccap_eligible_child: false
        ny_ccap_market_rate: 0
        childcare_hours_per_day: 0
        childcare_days_per_week: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 36_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    ny_ccap: 3_000
  absolute_error_margin: 0.01

# The income gate must be exercised in the false direction: with no case
# asserting a zero benefit through the income test, deleting the test would
# leave the suite green.
- name: Case 7, income above the state median income ceiling zeroes the benefit.
  period: 2025-01
  input:
    people:
      parent:
        age: 30
        employment_income: 400_000
        childcare_hours_per_day: 0
        childcare_days_per_week: 0
      child:
        age: 3
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
        meets_ccdf_activity_test: true
    households:
      household:
        members: [parent, child]
        state_code: NY
        county_str: NEW_YORK_COUNTY_NY
  output:
    ny_ccap_income_eligible: false
    ny_ccap: 0
  absolute_error_margin: 0.01

# The in-care gate must bite on its own: an eligible child not actually in
# paid care draws nothing, and does not dilute a sibling's expense share.
- name: Case 8, an eligible child not in care draws no subsidy.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 0
        childcare_days_per_week: 0
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_ccap: 0
  absolute_error_margin: 0.01

# An ineligible child who is in paid care keeps their own share of the
# expenses, so the eligible sibling is reimbursed for half of $3,000 rather
# than the whole amount.
- name: Case 9, an ineligible child in paid care keeps their expense share.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 3_000
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
      person2:
        ny_ccap_eligible_child: false
        ny_ccap_market_rate: 3_000
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 36_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    ny_ccap: 1_500
  absolute_error_margin: 0.01

# The lesser-of comparison at exact equality: expenses per child and the
# market rate both $1,000 a month.
- name: Case 10, expenses equal to the market rate are fully reimbursed.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 1_000
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_ccap: 1_000
  absolute_error_margin: 0.01
