- name: Case 1, actual expenses cap the subsidy before family share.
  period: 2025-01
  input:
    people:
      person1:
        ny_ccap_eligible_child: true
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
        childcare_days_per_week: 5
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 100
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_ccap: 900
  absolute_error_margin: 0.01

- name: Case 2, market rates cap the subsidy before family share.
