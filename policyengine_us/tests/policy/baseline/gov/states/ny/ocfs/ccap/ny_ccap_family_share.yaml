- name: Case 1, current family share is one percent of income above FPL.
  period: 2025-01
  input:
    ccdf_income: 60_000
    spm_unit_fpg: 25_750
    state_code: NY
  output:
    ny_ccap_family_share: (60_000 - 25_750) * 0.01 / 12
  absolute_error_margin: 0.01

- name: Case 2, income at FPL has no family share.
  period: 2025-01
  input:
    ccdf_income: 25_750
    spm_unit_fpg: 25_750
    state_code: NY
  output:
    ny_ccap_family_share: 0

- name: Case 3, income just above FPL triggers the weekly minimum.
  period: 2025-01
  input:
    ccdf_income: 25_751
    spm_unit_fpg: 25_750
    state_code: NY
  output:
    ny_ccap_family_share: 52 / 12
  absolute_error_margin: 0.01

- name: Case 4, historical Nassau share uses the county rate.
  period: 2023-01
  input:
    county_str: NASSAU_COUNTY_NY
    ccdf_income: 60_000
    spm_unit_fpg: 25_750
    state_code: NY
  output:
    ny_ccap_family_share: (60_000 - 25_750) * 0.2 / 12
  absolute_error_margin: 0.01

- name: Case 5, historical minimum remains one dollar per week.
  period: 2023-01
  input:
    county_str: ALBANY_COUNTY_NY
    ccdf_income: 20_000
    spm_unit_fpg: 21_330
    state_code: NY
  output:
    ny_ccap_family_share: 52 / 12
  absolute_error_margin: 0.01
