# 18 NYCRR 415.9(b): a sixth day earns an additional period priced at the
# weekly rate divided by five, rather than re-pricing the week as six daily
# rates.
- name: Case 6, a sixth day adds one fifth of the weekly rate.
  period: 2025-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 6
    childcare_days_per_week: 6
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_market_rate: 484 * (1 + 1 / 5) * 52 / 12
  absolute_error_margin: 0.01
