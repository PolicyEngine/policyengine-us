# 18 NYCRR 415.9(d) and 24-OCFS-LCM-22 sec. III.5: a sixth day earns an
# additional period priced at the rate for the time that day covers. Six
# hours is at the daily minimum, so the sixth day draws the daily rate.
- name: Case 6, a sixth day of full-day care adds one daily rate.
  period: 2025-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 6
    childcare_days_per_week: 6
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_market_rate: (484 + 97) * 52 / 12
  absolute_error_margin: 0.01

# 415.9(c): below six hours a day the part-day rate is mandatory whatever the
# weekly total, so five hours across six days is six part-day periods rather
# than a weekly rate plus an excess day.
- name: Case 7, six short days are priced as six part-day periods.
  period: 2025-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 5
    childcare_days_per_week: 6
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: PART_DAY
    ny_ccap_market_rate: 65 * 6 * 52 / 12
  absolute_error_margin: 0.01

# 24-OCFS-LCM-22 sec. III.5 worked example: 16 hours a day Monday through
# Friday is one weekly market rate plus five part-day rates, because the four
# hours past the daily maximum fall below the daily minimum.
- name: Case 8, hours past the daily maximum add a part-day period each day.
  period: 2025-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 16
    childcare_days_per_week: 5
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_market_rate: (484 + 5 * 65) * 52 / 12
  absolute_error_margin: 0.01

# 24-OCFS-LCM-22 sec. III.4: "12 hours or more in a day" earns the additional
# period, so exactly 12 hours draws a part-day rate on each day, priced for
# the zero hours over the maximum.
- name: Case 8a, exactly the daily maximum hours adds a part-day period each day.
  period: 2025-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 12
    childcare_days_per_week: 5
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_market_rate: (484 + 5 * 65) * 52 / 12
  absolute_error_margin: 0.01

