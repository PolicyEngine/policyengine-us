# The 2022-06-01 era added 269 rate cells that were reachable only through a
# blended annual average. These cases pin one cell per county group and
# provider type directly against 22-OCFS-LCM-14 Attachment A, and pair each
# with the 2019-era value so the era boundary is load-bearing.
- name: Case 7, 2022-era group one weekly center infant rate.
  period: 2023-01
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
    childcare_hours_per_day: 8
    childcare_days_per_week: 5
    county_str: NASSAU_COUNTY_NY
    state_code: NY
  output:
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_market_rate: 409 * 52 / 12
  absolute_error_margin: 0.01

