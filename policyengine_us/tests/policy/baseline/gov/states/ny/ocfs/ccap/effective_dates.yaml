# Boundary tests for every mid-year switch in the New York CCAP parameters.
# Each keys its outputs by month inside a whole-year period, so the month
# before and the month of each change are both asserted. Without these, a
# wrong date anywhere inside a 12-to-24 month window would still pass.

# 22-OCFS-LCM-14 abolished hourly market rates on 2022-06-01 by dropping the
# part-day minimum from three hours to zero. A legally-exempt provider is used
# so the 19-OCFS-LCM-23 §III.3.c part-day carve-out, which reaches only day
# care centers and school-age programs, does not mask the switch.
- name: The hourly rate unit disappears on 2022-06-01.
  period: 2022
  input:
    people:
      child:
        age: {2022: 6}
        childcare_provider_type_group: {2022: LE_STD}
        childcare_hours_per_day: {2022: 2}
        childcare_days_per_week: {2022: 5}
    spm_units:
      spm_unit:
        members: [child]
    households:
      household:
        members: [child]
        state_code: {2022: NY}
  output:
    ny_ccap_duration_of_care:
      2022-05: HOURLY
      2022-06: PART_DAY

# 22-OCFS-ADM-18 raised the state income standard limit from 200% to 300% on
# 2022-08-01. Income sits between the two multiples, so it flips exactly there.
- name: The income limit rises from 200 to 300 percent on 2022-08-01.
  period: 2022
  input:
    spm_units:
      spm_unit:
        members: [parent]
        ny_ccap_countable_income: {2022: 60_000}
        spm_unit_fpg: {2022: 25_000}
        hhs_smi: {2022: 500_000}
    people:
      parent:
        age: {2022: 30}
    households:
      household:
        members: [parent]
        state_code: {2022: NY}
  output:
    ny_ccap_income_eligible:
      2022-07: false
      2022-08: true

# The statutory revisions took effect on 2023-10-01, cutting the family share
# from the 10% cap to the statewide 1%.
- name: The family share falls from ten percent to one percent on 2023-10-01.
  period: 2023
  input:
    spm_units:
      spm_unit:
        members: [parent]
        ny_ccap_countable_income: {2023: 60_000}
        spm_unit_fpg: {2023: 25_000}
    people:
      parent:
        age: {2023: 30}
    households:
      household:
        members: [parent]
        state_code: {2023: NY}
  output:
    ny_ccap_family_share:
      2023-09: (60_000 - 25_000) * 0.1 / 12
      2023-10: (60_000 - 25_000) * 0.01 / 12
  absolute_error_margin: 0.01

# The same date replaces the state income standard limit with 85% of the state
# median income. Income is above 300% of the standard but below 85% of SMI.
- name: The income test switches to the state median income on 2023-10-01.
  period: 2023
  input:
    spm_units:
      spm_unit:
        members: [parent]
        ny_ccap_countable_income: {2023: 60_000}
        spm_unit_fpg: {2023: 15_000}
        hhs_smi: {2023: 100_000}
    people:
      parent:
        age: {2023: 30}
    households:
      household:
        members: [parent]
        state_code: {2023: NY}
  output:
    ny_ccap_income_eligible:
      2023-09: false
      2023-10: true

# The categorical eligibility routes begin with the same regulatory changes.
- name: Foster care becomes eligible without regard to income on 2023-10-01.
  period: 2023
  input:
    people:
      child:
        age: {2023: 3}
        is_in_foster_care: {2023: true}
    spm_units:
      spm_unit:
        members: [child]
        ny_ccap_countable_income: {2023: 400_000}
        spm_unit_fpg: {2023: 25_000}
        hhs_smi: {2023: 80_000}
        meets_ccdf_activity_test: {2023: false}
    households:
      household:
        members: [child]
        state_code: {2023: NY}
  output:
    ny_ccap_eligible_child:
      2023-09: false
      2023-10: true

# 24-OCFS-LCM-22 replaced the five historical county groups with four on
# 2024-10-01. Bronx moves from historical group 5 to current group 4.
- name: The county grouping changes on 2024-10-01.
  period: 2024
  input:
    people:
      child:
        age: {2024: 3}
    spm_units:
      spm_unit:
        members: [child]
    households:
      household:
        members: [child]
        state_code: {2024: NY}
        county_str: {2024: BRONX_COUNTY_NY}
  output:
    ny_ccap_county_group:
      2024-09: GROUP_5
      2024-10: GROUP_4
