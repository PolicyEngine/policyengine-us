# Court supervision extends this state's age test without setting disability
# or protective-services status. Cases include both age boundaries and adults.
- name: Case 1, NY court supervision age boundaries and default status.
  period: 2025
  input:
    state_code: [NY, NY, NY, NY, NY, NY, NY, NY]
    age: [12, 13, 13, 17, 18, 19, 18, 40]
    is_under_court_supervision: [false, false, true, true, true, true, false, true]
  output:
    ny_ccap_age_eligible: [true, false, true, true, false, false, false, false]
    is_disabled: [false, false, false, false, false, false, false, false]
    receives_or_needs_protective_services: [false, false, false, false, false, false, false, false]

# 18 NYCRR 415.1(b)(3) extends the court route to under 19 for a full-time
# student in secondary school (or equivalent training). is_in_secondary_school
# stands in for that enrollment, as in federal TANF, so a full-time student
# who is not in secondary school does not qualify.
- name: Case 2, NY court-supervised age-18 student must attend secondary school.
  period: 2025
  input:
    state_code:
    - NY
    - NY
    - NY
    age:
    - 18
    - 18
    - 19
    is_under_court_supervision:
    - true
    - true
    - true
    is_full_time_student:
    - true
    - true
    - true
    is_in_secondary_school:
    - true
    - false
    - true
  output:
    ny_ccap_age_eligible:
    - true
    - false
    - false
- name: Case 3, NY court supervision does not waive income eligibility.
  period: 2025-01
  input:
    state_code: NY
    age: 17
    is_under_court_supervision: true
    ny_ccap_countable_income: 400000
    hhs_smi: 80000
    ny_ccap_activity_eligible: true
  output:
    ny_ccap_age_eligible: true
    ny_ccap_eligible_child: false
# is_in_secondary_school alone stands in for the full-time secondary student
# of 18 NYCRR 415.1(b)(3); the court route does not read is_full_time_student.
- name: Case 4, NY court-supervised age 18 in secondary school without full-time flag.
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
    is_in_secondary_school: true
  output:
    ny_ccap_age_eligible: true
- name: Case 5, NY court-supervised age 18 with no school flags.
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
  output:
    ny_ccap_age_eligible: false
# is_in_k12_school is imputed only through age 17, so it must be set explicitly.
- name: Case 6, NY court-supervised age 18 with is_in_k12_school only.
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
    is_in_k12_school: true
  output:
    ny_ccap_age_eligible: true
