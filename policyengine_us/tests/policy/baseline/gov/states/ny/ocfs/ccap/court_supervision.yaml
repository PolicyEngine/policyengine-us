# Court supervision extends this state's age test without setting disability
# or protective-services status. Cases include both age boundaries and adults.
- name: NY court supervision age boundaries and default status
  period: 2025
  input:
    state_code: [NY, NY, NY, NY, NY, NY, NY, NY]
    age: [12, 13, 13, 17, 18, 19, 18, 40]
    is_under_court_supervision: [false, false, true, true, true, true, false, true]
  output:
    ny_ccap_age_eligible: [true, false, true, true, false, false, false, false]
    is_disabled: [false, false, false, false, false, false, false, false]
    receives_or_needs_protective_services: [false, false, false, false, false, false, false, false]

# 18 NYCRR 415.1(b)(3): the court route requires secondary school (or
# equivalent training), not full-time student status.
- name: NY court-supervised age-18 student must attend secondary school
  period: 2025
  input:
    state_code:
    - NY
    - NY
    - NY
    - NY
    age:
    - 18
    - 18
    - 18
    - 19
    is_under_court_supervision:
    - true
    - true
    - true
    - true
    is_full_time_student:
    - true
    - true
    - false
    - true
    is_in_secondary_school:
    - true
    - false
    - true
    - true
  output:
    ny_ccap_age_eligible:
    - true
    - false
    - true
    - false
- name: NY court supervision does not waive income eligibility
  period: 2025-01
  input:
    state_code: NY
    age: 17
    is_under_court_supervision: true
    ny_ccap_countable_income: 400000
    hhs_smi: 80000
    ny_ccap_activity_eligible: true
  output:
    ny_ccap_age_eligible: true
    ny_ccap_eligible_child: false
# 18 NYCRR 415.1(b)(3): court-supervised 18-year-old in secondary school (or
# equivalent training) is age eligible until 19; full-time status is not required.
- name: NY court-supervised age 18 in secondary school without full-time flag
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
    is_in_secondary_school: true
  output:
    ny_ccap_age_eligible: true
- name: NY court-supervised age 18 with no school flags
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
  output:
    ny_ccap_age_eligible: false
# is_in_k12_school is imputed only through age 17, so it must be set explicitly.
- name: NY court-supervised age 18 with is_in_k12_school only
  period: 2025
  input:
    state_code: NY
    age: 18
    is_under_court_supervision: true
    is_in_k12_school: true
  output:
    ny_ccap_age_eligible: true
