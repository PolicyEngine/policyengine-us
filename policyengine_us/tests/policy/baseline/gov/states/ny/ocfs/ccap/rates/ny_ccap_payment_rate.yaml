  absolute_error_margin: 0.01

# In June 2025, the 10% statutory minimum applies to homelessness and
# nontraditional hours: 10% + 10% + 10% = 30%, above the 25% limit.
# $1,473.33 * 1.25 = $1,841.67.
- name: Monroe County's combined differential stops at twenty-five percent in June 2025.
