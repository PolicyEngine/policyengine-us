# Monroe's plan took effect November 18, 2024, so November 2024 still uses
# the state defaults. A Monroe center charges $340 weekly for a preschooler,
# $340 * 52 / 12 = $1,473.33 monthly. Homelessness and nontraditional hours
# pay 5% each, and accreditation pays nothing yet: $1,473.33 * 1.10 =
# $1,620.67. Exempt care for a homeless child pays nothing yet: $185 * 52 / 12
# = $801.67.
- name: Monroe County pays state defaults in November 2024.
  period: 2024-11
  input:
    people:
      center:
        childcare_provider_type_group: {2024: DCC_SACC}
        ny_ccap_age_group: {2024: PRESCHOOLER}
        ny_ccap_duration_of_care: {2024: WEEKLY}
        ny_ccap_childcare_expenses: 3_000
        ny_ccap_nontraditional_hours: {2024: true}
        ny_ccap_accredited_provider: {2024: true}
      exempt:
        childcare_provider_type_group: {2024: LE_STD}
        ny_ccap_age_group: {2024: PRESCHOOLER}
        ny_ccap_duration_of_care: {2024: WEEKLY}
        ny_ccap_childcare_expenses: 3_000
    households:
      center:
        members: [center]
        state_code: {2024: NY}
        county_str: {2024: MONROE_COUNTY_NY}
        is_homeless: {2024: true}
      exempt:
        members: [exempt]
        state_code: {2024: NY}
        county_str: {2024: MONROE_COUNTY_NY}
        is_homeless: {2024: true}
  output:
    ny_ccap_market_rate: [1_473.33, 801.67]
    ny_ccap_differential: [0.10, 0]
    ny_ccap_payment_rate: [1_620.67, 801.67]
  absolute_error_margin: 0.01

# From December 2024, Monroe adds its 10% accreditation differential:
