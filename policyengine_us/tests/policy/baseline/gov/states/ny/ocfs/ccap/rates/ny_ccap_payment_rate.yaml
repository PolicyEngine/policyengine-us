# District that configures 30% for every differential, January 2025.
# NYC's enhanced group rate pays $382 weekly for both requirements. NYC's
# 15% nontraditional rate plus the exempt homelessness rate, capped at 15%,
# give min(.15 + .15, .25) = .25. min($3,000, $382 * 52 / 12) * 1.25
# exceeds $439 * 52 / 12, so the district pays the center rate, $1,902.33.
- name: Exempt group payment stops at the center rate after differentials.
  period: 2025-01
  input:
    gov.states.ny.ocfs.ccap.differentials.nontraditional_hours: 0.30
    gov.states.ny.ocfs.ccap.differentials.homelessness: 0.30
    gov.states.ny.ocfs.ccap.differentials.legally_exempt_homelessness: 0.30
    gov.states.ny.ocfs.ccap.differentials.accreditation: 0.30
