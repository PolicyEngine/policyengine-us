# 24-OCFS-LCM-22 applies each differential to min(expenses, market rate).
# $800 * 1.05 = $840, so the district can pay more than the $800 charge.
- name: Nontraditional hours raise payment above a charge below the market rate.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 800
    ny_ccap_market_rate: 1_000
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 840
  absolute_error_margin: 0.01

