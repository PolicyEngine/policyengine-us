# Each set of parameter overrides builds a separate tax-benefit system, so
# the cases below share two sets, each listed in the same order every time:
# - a district that configures nontraditional and homelessness rates of 0,
#   a 2% exempt homelessness rate, a 1% accreditation rate and an OCFS
#   waiver to 40%;
# - a district that configures 30% for every differential.
# Every other case uses the default parameters.

# 24-OCFS-LCM-22 applies each differential to min(expenses, market rate).
# $800 * 1.05 = $840, so the district can pay more than the $800 charge.
- name: Nontraditional hours raise payment above a charge below the market rate.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 800
    ny_ccap_market_rate: 1_000
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 840
  absolute_error_margin: 0.01

# min($1,200, $1,000) * 1.05 = $1,050.
- name: Homelessness raises payment for licensed center care.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    is_homeless: true
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 1_050
  absolute_error_margin: 0.01

# Registered family providers receive the same mandatory homelessness rate.
# min($1,200, $1,000) * 1.05 = $1,050.
- name: Homelessness raises payment for registered family care.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: FDC_GFDC
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    is_homeless: true
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 1_050
  absolute_error_margin: 0.01

# The state default pays no optional accreditation differential.
- name: Accreditation alone leaves payment unchanged under the state default.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    ny_ccap_accredited_provider: true
  output:
    ny_ccap_differential: 0
    ny_ccap_payment_rate: 1_000
  absolute_error_margin: 0.01

# The state default pays no optional homelessness differential to exempt care.
- name: Homelessness leaves standard exempt informal care unchanged by default.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: LE_STD
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    is_homeless: true
  output:
    ny_ccap_differential: 0
    ny_ccap_payment_rate: 1_000
  absolute_error_margin: 0.01

# The nontraditional-hours differential includes exempt providers:
# min($1,200, $1,000) * 1.05 = $1,050.
- name: Nontraditional hours raise payment for enhanced exempt informal care.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: LE_ENH
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 1_050
  absolute_error_margin: 0.01

# Social Services Law 410-x(10) requires at least 10% from April 1, 2025.
# March keeps the 5% minimum: $1,000 * 1.05 = $1,050.
- name: March 2025 keeps the five-percent nontraditional-hours minimum.
  period: 2025-03
  input:
    state_code: {2025: NY}
    ny_ccap_county_group: {2025: GROUP_1}
    childcare_provider_type_group: {2025: DCC_SACC}
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    ny_ccap_nontraditional_hours: {2025: true}
  output:
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 1_050
  absolute_error_margin: 0.01

# April pays the 10% statutory minimum: $1,000 * 1.10 = $1,100.
- name: April 2025 raises the nontraditional-hours minimum to ten percent.
  period: 2025-04
  input:
    state_code: {2025: NY}
    ny_ccap_county_group: {2025: GROUP_1}
    childcare_provider_type_group: {2025: DCC_SACC}
    ny_ccap_childcare_expenses: 1_200
    ny_ccap_market_rate: 1_000
    ny_ccap_nontraditional_hours: {2025: true}
  output:
    ny_ccap_differential: 0.10
    ny_ccap_payment_rate: 1_100
  absolute_error_margin: 0.01

# In June 2025, 410-x(10)(b) gives an exempt provider at least 10% for
# nontraditional hours, and 410-x(10)(a) gives licensed or registered
# providers at least 10% for homelessness: $1,000 * 1.10 = $1,100.
# Exempt homelessness care stays optional, at 0% by default.
- name: From April 2025 the mandatory differentials pay at least ten percent.
  period: 2025-06
  input:
    people:
      exempt_nontraditional:
        childcare_provider_type_group: {2025: LE_STD}
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
        ny_ccap_nontraditional_hours: {2025: true}
      center_homeless:
        childcare_provider_type_group: {2025: DCC_SACC}
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
      family_homeless:
        childcare_provider_type_group: {2025: FDC_GFDC}
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
      exempt_homeless:
        childcare_provider_type_group: {2025: LE_STD}
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
    households:
      exempt_nontraditional:
        members: [exempt_nontraditional]
        state_code: {2025: NY}
        ny_ccap_county_group: {2025: GROUP_1}
      center_homeless:
        members: [center_homeless]
        state_code: {2025: NY}
        ny_ccap_county_group: {2025: GROUP_1}
        is_homeless: {2025: true}
      family_homeless:
        members: [family_homeless]
        state_code: {2025: NY}
        ny_ccap_county_group: {2025: GROUP_1}
        is_homeless: {2025: true}
      exempt_homeless:
        members: [exempt_homeless]
        state_code: {2025: NY}
        ny_ccap_county_group: {2025: GROUP_1}
        is_homeless: {2025: true}
  output:
    ny_ccap_differential: [0.10, 0.10, 0.10, 0]
    ny_ccap_payment_rate: [1_100, 1_100, 1_100, 1_000]
  absolute_error_margin: 0.01

# For a qualifying child, $1,000 * 1.15 = $1,150 becomes the market rate.
# The district then pays min($2,000, $1,150) * 1.05 = $1,207.50.
- name: Differentials apply after the special-needs market rate.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 2_000
    ny_ccap_regular_market_rate: 1_000
    is_disabled: true
    ny_ccap_special_needs_care: true
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_market_rate: 1_150
    ny_ccap_differential: 0.05
    ny_ccap_payment_rate: 1_207.5
  absolute_error_margin: 0.01

# Actual expenses remain the differential base when they fall between the
# regular and special-needs rates: min($1,100, $1,150) * 1.05 = $1,155.
- name: The district applies differentials to costs below the special-needs rate.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_1
    childcare_provider_type_group: DCC_SACC
    ny_ccap_childcare_expenses: 1_100
    ny_ccap_regular_market_rate: 1_000
    is_disabled: true
    ny_ccap_special_needs_care: true
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_market_rate: 1_150
    ny_ccap_payment_rate: 1_155
  absolute_error_margin: 0.01

# NYC pays $382 weekly for a group program meeting both enhancements and
# $439 for a center. LCM-22 makes the special-needs rate the market rate for a
# qualifying child, so both rise by 15%: $382 * 1.15 = $439.30 and $439 * 1.15 = $504.85.
# NYC's 15% nontraditional differential gives $439.30 * 1.15 = $505.195,
# above the $504.85 center rate, so the district pays $504.85 * 52 / 12
# = $2,187.68 monthly.
- name: A special-needs child's exempt group payment stops at the special-needs center rate.
  period: 2025-01
  input:
    state_code: NY
    ny_ccap_county_group: GROUP_4
    childcare_provider_type_group: LE_GC
    ny_ccap_age_group: PRESCHOOLER
    ny_ccap_duration_of_care: WEEKLY
    ny_ccap_childcare_expenses: 3_000
    ny_ccap_enhanced_health: true
    ny_ccap_enhanced_training: true
    is_disabled: true
    ny_ccap_special_needs_care: true
    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_regular_market_rate: 382 * 52 / 12
    ny_ccap_special_needs_rate_eligible: true
    ny_ccap_market_rate: 382 * 1.15 * 52 / 12
    ny_ccap_differential: 0.15
    ny_ccap_day_care_center_rate: 439 * 1.15 * 52 / 12
    ny_ccap_payment_rate: 439 * 1.15 * 52 / 12
  absolute_error_margin: 0.01

# Annual expenses of $12,000 give $1,000 monthly. After the 5% differential
# and one $100 family share, the family receives $1,000 * 1.05 - $100 = $950.
- name: The family receives the differential before subtracting one family share.
  period: 2025-01
  input:
    people:
      child:
        ny_ccap_eligible_child: true
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
        ny_ccap_nontraditional_hours: true
    spm_units:
      unit:
        members: [child]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 100
    households:
      household:
        members: [child]
        state_code: NY
        ny_ccap_county_group: GROUP_1
  output:
    ny_ccap_childcare_expenses: 1_000
    ny_ccap_payment_rate: 1_050
    ny_ccap: 950
  absolute_error_margin: 0.01

# Both children attend paid care, so each keeps $12,000 / 12 / 2 = $500.
# Only the eligible child receives $500 * 1.05 = $525.
- name: An ineligible sibling keeps their expense share when a differential applies.
  period: 2025-01
  input:
    people:
      child:
        ny_ccap_eligible_child: true
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
        ny_ccap_nontraditional_hours: true
      sibling:
        ny_ccap_eligible_child: false
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
    spm_units:
      unit:
        members: [child, sibling]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [child, sibling]
        state_code: NY
        ny_ccap_county_group: GROUP_1
  output:
    ny_ccap_childcare_expenses: [500, 500]
    ny_ccap_payment_rate: [525, 500]
    ny_ccap: 525
  absolute_error_margin: 0.01

# $1,000 * 1.05 - $2,000 falls below zero; the district pays $0.
- name: A family share above care plus the differential cannot produce a negative benefit.
