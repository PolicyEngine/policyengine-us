# Each configured 30% differential stops at 15%; their sum stops at 25%.
# min(.15 + .15 + .15, .25) = .25; $1,000 * 1.25 = $1,250.
- name: Individual and total maxima limit excessive configured differentials.
  period: 2025-01
  input:
    gov.states.ny.ocfs.ccap.differentials.nontraditional_hours: 0.30
    gov.states.ny.ocfs.ccap.differentials.homelessness: 0.30
    gov.states.ny.ocfs.ccap.differentials.accreditation: 0.30
    people:
      nontraditional:
        childcare_provider_type_group: DCC_SACC
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
        ny_ccap_nontraditional_hours: true
      homeless:
        childcare_provider_type_group: DCC_SACC
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
      accredited:
        childcare_provider_type_group: DCC_SACC
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
        ny_ccap_accredited_provider: true
      all_three:
        childcare_provider_type_group: DCC_SACC
        ny_ccap_childcare_expenses: 1_200
        ny_ccap_market_rate: 1_000
        ny_ccap_nontraditional_hours: true
        ny_ccap_accredited_provider: true
    households:
      nontraditional:
        members: [nontraditional]
        state_code: NY
        ny_ccap_county_group: GROUP_1
      homeless:
        members: [homeless]
        state_code: NY
        ny_ccap_county_group: GROUP_1
        is_homeless: true
      accredited:
        members: [accredited]
        state_code: NY
        ny_ccap_county_group: GROUP_1
      all_three:
        members: [all_three]
        state_code: NY
        ny_ccap_county_group: GROUP_1
        is_homeless: true
  output:
    ny_ccap_differential: [0.15, 0.15, 0.15, 0.25]
    ny_ccap_payment_rate: [1_150, 1_150, 1_150, 1_250]
  absolute_error_margin: 0.01

