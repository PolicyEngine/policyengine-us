    ny_ccap_nontraditional_hours: true
  output:
    ny_ccap_market_rate: 1_150
    ny_ccap_payment_rate: 1_155
  absolute_error_margin: 0.01

# Annual expenses of $12,000 give $1,000 monthly. After the 5% differential
# and one $100 family share, the family receives $1,000 * 1.05 - $100 = $950.
- name: The family receives the differential before subtracting one family share.
  period: 2025-01
  input:
    people:
      child:
        ny_ccap_eligible_child: true
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
        ny_ccap_nontraditional_hours: true
    spm_units:
      unit:
        members: [child]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 100
    households:
      household:
        members: [child]
        state_code: NY
        ny_ccap_county_group: GROUP_1
  output:
    ny_ccap_childcare_expenses: 1_000
    ny_ccap_payment_rate: 1_050
    ny_ccap: 950
  absolute_error_margin: 0.01

# Both children attend paid care, so each keeps $12,000 / 12 / 2 = $500.
# Only the eligible child receives $500 * 1.05 = $525.
- name: An ineligible sibling keeps their expense share when a differential applies.
  period: 2025-01
  input:
    people:
      child:
        ny_ccap_eligible_child: true
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
        ny_ccap_nontraditional_hours: true
      sibling:
        ny_ccap_eligible_child: false
        childcare_provider_type_group: DCC_SACC
        ny_ccap_market_rate: 1_200
        childcare_hours_per_day: 8
    spm_units:
      unit:
        members: [child, sibling]
        spm_unit_pre_subsidy_childcare_expenses: 12_000
        ny_ccap_family_share: 0
    households:
      household:
        members: [child, sibling]
        state_code: NY
        ny_ccap_county_group: GROUP_1
  output:
    ny_ccap_childcare_expenses: [500, 500]
    ny_ccap_payment_rate: [525, 500]
    ny_ccap: 525
  absolute_error_margin: 0.01

