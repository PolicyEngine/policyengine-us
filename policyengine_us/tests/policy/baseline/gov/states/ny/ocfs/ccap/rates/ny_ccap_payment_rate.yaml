    ny_ccap_childcare_expenses: 3_000
    ny_ccap_nontraditional_hours: {2025: true}
    ny_ccap_accredited_provider: {2025: true}
    is_homeless: {2025: true}
  output:
    ny_ccap_differential: 0.25
    ny_ccap_payment_rate: 340 * 52 / 12 * 1.25
  absolute_error_margin: 0.01

# OCFS raised the combined limit to 35% from December 24, 2025, so the full
