- name: Case 6, spouse deemed income above the standard of need leaves no state payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        # Early-claimed Social Security retirement benefit of 1_550 a month.
        age: 63
        social_security_retirement: 18_600
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    # Spouse income 18_600 / 12 = 1_550 > 1_491 - 994 = 497, so deeming applies.
    is_ssi_spousal_deeming_applies: [true, false]
    # Couple countable (1_550 - 20) - own countable 0 = 1_530.
    ssi_income_deemed_from_ineligible_spouse: [1_530, 0]
    ssi_countable_income: [1_530, 0]
    # Couple FBR 1_491 - 1_530 = -39, so no federal SSI.
    uncapped_ssi: [-39, 0]
    ssi: [0, 0]
    # The ineligible spouse makes a two-person household.
    ny_ssp_living_arrangement: [LIVING_WITH_OTHERS, LIVING_WITH_OTHERS]
    # 18 NYCRR 398-4.4(b): standard 994 + 23 = 1_017 minus the greater of the
    # 994 FBR or countable income 1_530 is below zero, so no state payment.
    ny_ssp: [0, 0]

- name: Case 7, annual benefit and SNAP income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: NY
    age: 65
  output:
    ny_ssp: 1_044
    household_state_benefits: 1_044
    snap_unearned_income: 12_972
    hud_unearned_income: 12_972
    # SNAP with the 877 utility allowance: 168 a month in January to September
    # (298 - 130) and 180 in October to December (306 - 126), 2_052 a year.
    # SSI 11_928 + 1_044 + 2_052 = 15_024.
    spm_unit_benefits: 15_024

- name: Case 8, part-time earnings reduce SSI but not the state payment.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        meets_ssi_disability_criteria: true
        # 20 hours a week at the 2026 minimum wage outside New York City,
        # Long Island and Westchester ($16.00, https://dol.ny.gov/minimum-wage-0):
        # 16 * 20 * 52 = 16_640.
        employment_income: 16_640
    households:
      household:
        members: [person1]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    # 16_640 / 12 = 1_386.67 a month.
    ssi_earned_income: 1_386.67
    # 1_386.67 is below the 2026 non-blind SGA limit of 1_690.
    ssi_engaged_in_sga: false
    is_ssi_disabled: true
    # (1_386.67 - 20 general - 65 earned) / 2 = 650.83.
    ssi_countable_income: 650.83
    # Individual FBR in the person's own household.
    ssi_amount_if_eligible: 994
    # 994 - 650.83 = 343.17.
    uncapped_ssi: 343.17
    ssi: 343.17
    ny_ssp_is_minor: false
    # One-person household.
    ny_ssp_living_arrangement: LIVING_ALONE
    # Excess countable income max(650.83 - 994, 0) = 0: living alone rate 87 - 0 = 87.
    ny_ssp: 87

- name: Case 9, residential care spouses claim as individuals after the month of entry.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ny_ssp_care_setting: RESIDENTIAL_CARE
      person2:
        age: 65
        ny_ssp_care_setting: RESIDENTIAL_CARE
    # 18 NYCRR 398-4.5(d): after the month of entry into an institutional level
    # II facility, the spouses are two individuals, entered as separate units.
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    ssi: [994, 994]
    ny_ssp: [405, 405]

