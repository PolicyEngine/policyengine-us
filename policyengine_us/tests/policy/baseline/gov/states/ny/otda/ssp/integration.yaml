- name: Case 11, spouse with part-time earnings leaves the state payment unchanged under deeming.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
      person2:
        age: 63
        # 20 hours a week at the 2026 minimum wage outside New York City,
        # Long Island and Westchester ($16.00, https://dol.ny.gov/minimum-wage-0):
        # 16 * 20 * 52 = 16_640.
        employment_income: 16_640
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    # Spouse earnings 16_640 / 12 = 1_386.67 > 497, so deeming applies.
    is_ssi_spousal_deeming_applies: [true, false]
    # (1_386.67 - 20 - 65) / 2 = 650.83.
    ssi_countable_income: [650.83, 0]
    # Couple FBR 1_491 - 650.83 = 840.17.
    ssi: [840.17, 0]
    # 18 NYCRR 398-4.4(b): 1_017 - max(994, 650.83) = 23.
    ny_ssp: [23, 0]
