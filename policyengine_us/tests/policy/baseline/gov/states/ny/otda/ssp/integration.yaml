- name: Case 1, couple living alone.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
      person2:
        age: 65
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    ny_ssp: [52, 52]

- name: Case 2, family care couple.
  # Social Services Law 209(2)(c): two times the 1_260.48 downstate individual
  # standard is 2_520.96, less the 1_491 couple FBR = 1_029.96, or 514.98 each.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ny_ssp_care_setting: FAMILY_CARE
      person2:
        age: 65
        ny_ssp_care_setting: FAMILY_CARE
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: NEW_YORK_COUNTY_NY
  output:
    ny_ssp: [514.98, 514.98]

- name: Case 3, residential care couple in a small non-institutional facility.
  # 18 NYCRR 398-4.5(d): couple status continues where the facility is not an
  # institution for SSI. 2 * 1_399 - 1_491 = 1_307, or 653.50 each.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 65
        ny_ssp_care_setting: RESIDENTIAL_CARE
      person2:
        age: 65
        ny_ssp_care_setting: RESIDENTIAL_CARE
    marital_units:
      couple:
        members: [person1, person2]
    tax_units:
      unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        county: ALBANY_COUNTY_NY
  output:
    ny_ssp: [653.5, 653.5]

