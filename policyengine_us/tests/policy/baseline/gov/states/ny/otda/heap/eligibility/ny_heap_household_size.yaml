# HEAP Manual Chapter 8 D.4, PDF page 36, excludes foster members and
# federal Code C SSI recipients. D.4(7) still counts nonqualified members' income.
- name: Foster members and federal Code C SSI recipients do not affect the household award
  period: 2026
  input:
    people:
      adult:
        age: 40
        employment_income: 24000
        ssi: 0
      foster_child:
        age: 3
        is_in_foster_care:
          2026-01: true
        social_security: 6000
        ssi: 0
      ssi_child:
        age: 10
        ssi: 6000
        ssi_federal_living_arrangement:
          2026-01: CHILD_IN_PARENTAL_HOUSEHOLD
    spm_units:
      unit:
        members: [adult, foster_child, ssi_child]
        heating_type: NATURAL_GAS
        has_heating_expense: true
        tanf: 0
        snap: 0
    households:
      home:
        members: [adult, foster_child, ssi_child]
        state_code: NY
  output:
    ny_heap_household_size: 1
    ny_heap_countable_income: 24000
    ny_heap_vulnerable: false
    ny_heap_categorically_eligible: false
    ny_heap_tier_one: false
    ny_heap: 400

- name: Federal Code C without SSI receipt does not exclude a child
  period: 2026
  input:
    state_code: NY
    heating_type: NATURAL_GAS
    age: 10
    ssi: 0
    receives_ssi: false
    ssi_federal_living_arrangement:
      2026-01: CHILD_IN_PARENTAL_HOUSEHOLD
  output:
    ny_heap_household_size: 1
    ny_heap_vulnerable: false
