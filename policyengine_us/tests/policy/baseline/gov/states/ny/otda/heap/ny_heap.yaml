# https://public-inspection.federalregister.gov/2016-01450.pdf
- name: Case 44, FY2017 monthly income crosses the Tier I supplement boundary.
  period: 2017
  input:
    state_code: [NY, NY]
    age: [40, 40]
    employment_income: [15_444, 15_456]
    ssi: [0, 0]
    snap: [0, 0]
    tanf: [0, 0]
    heating_type: [NATURAL_GAS, NATURAL_GAS]
    gas_expense: [1_500, 1_500]
  output:
    ny_heap_countable_income: [15_444, 15_456]
    ny_heap_tier_one: [true, false]
    ny_heap_eligible: [true, true]
    # $1,287 monthly receives 350 + 26; $1,288 receives the $350 base.
    ny_heap: [376, 350]
