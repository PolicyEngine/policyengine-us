# FY2017 accepted state plan, Attachment 1 (PDF page 54): oil base $575,
# Tier I supplement $26, vulnerable-member supplement $25.
# https://liheapch.acf.gov/docs/NY_Plan_2017.pdf#page=54
- name: Case 17, FY2017 regular oil benefit from wages and age.
  period: 2017
  input:
    state_code: NY
    age: 65
    employment_income: 12_000
    ssi: 0
    snap: 0
    tanf: 0
    heating_type: FUEL_OIL
    fuel_oil_expense: 2_800
  output:
