# Regular attendance may be supplied when the existing full-time input cannot establish the rule.
- name: Case 1, full-time college study supplies regular attendance by default.
  period: 2026
  input:
    is_full_time_college_student: true
  output:
    ny_ssp_regularly_attends_school: true
- name: Case 2, part-time enrollment alone does not establish qualifying weekly hours.
  period: 2026
  input:
    is_part_time_college_student: true
  output:
    ny_ssp_regularly_attends_school: false
