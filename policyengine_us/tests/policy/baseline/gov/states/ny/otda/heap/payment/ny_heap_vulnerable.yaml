# HEAP Manual, Chapter 9 B.3(b) (PDF page 49): vulnerable members are children
# under six, people aged 60 or older, and people receiving SSI or Social
# Security disability payments or meeting the listed VA conditions; Chapter 8
# E.9(c) (page 45) ignores a nonqualified member's vulnerability.
# https://otda.ny.gov/programs/heap/HEAP-manual.pdf#page=49

- name: Case 1, existing qualifying benefit pathways establish HEAP disability.
  period: 2026
  input:
    state_code: [NY, NY, NY, NY, NY, NY, NY]
    heating_type: [NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS, NATURAL_GAS]
    age: [40, 40, 40, 40, 40, 40, 40]
    receives_ssi: [true, false, false, false, false, false, false]
    ssi: [0, 1_200, 0, 0, 0, 0, 0]
    social_security_disability: [0, 0, 1_200, 0, 0, 0, 0]
    is_permanently_disabled_veteran: [false, false, false, true, false, false, false]
    is_surviving_spouse_of_disabled_veteran: [false, false, false, false, true, false, false]
    is_surviving_child_of_disabled_veteran: [false, false, false, false, false, true, false]
    is_permanently_and_totally_disabled: [false, false, false, false, false, false, true]
  output:
    # B.3(b)(3): reported SSI, $100 a month of SSI, $100 a month of Social
    # Security disability and the three VA conditions each establish
    # disability; a disability flag without benefit receipt does not.
    ny_heap_vulnerable: [true, true, true, true, true, true, false]

- name: Case 2, a nonqualified disabled member does not establish vulnerability.
  period: 2026
  input:
    state_code: NY
    heating_type: NATURAL_GAS
    age: 40
    is_citizen_or_legal_immigrant: false
    ssi: 1_200
  output:
    # E.9(c) (page 45): "If the only vulnerable individual is a non-qualified
    # alien, the add-on for vulnerability is not included".
    ny_heap_vulnerable: false
