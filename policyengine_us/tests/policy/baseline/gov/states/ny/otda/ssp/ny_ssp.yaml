- name: Case 40, nursing home resident with an ineligible spouse at home receives the personal needs allowance.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
      person2:
        age: 63
        social_security_retirement: 12_000
    # 20 CFR 416.1160(a)(1) deems an ineligible spouse's income only in the
    # same household, and 416.1167(a)(2) keeps a facility resident in it only
    # while a 416.212 benefit is paid. Separate marital units keep the federal
    # model from deeming to a resident on the reduced benefit.
    marital_units:
      unit1:
        members: [person1]
      unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    ny_ssp_living_arrangement: [RESIDENTIAL_HEALTH_CARE_FACILITY, LIVING_ALONE]
    ssi: [30, 0]
    # No countable income besides the $30 SSI: the $25 allowance
    # (18 NYCRR 398-3.2(d), 398-3.4). The spouse is not aged, blind or disabled.
    ny_ssp: [25, 0]

- name: Case 41, spouse at home is living alone while the other spouse is in a facility Medicaid does not mostly pay for.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_lives_in_medical_treatment_facility: true
      person2:
        age: 70
    marital_units:
      couple:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    ny_ssp_living_arrangement: [NONE, LIVING_ALONE]
    # Known limitation: with one marital unit the federal model still computes
    # the spouses as a couple, and the shared helper averages the members'
    # couple rates, (0 + 104) / 4 = 26, instead of the 87 for an individual
    # living alone (18 NYCRR 398-2.1(l)). Enter spouses who live apart as
    # separate marital units (Case 45). The resident receives nothing.
    ssi: [745.5, 745.5]
    ny_ssp: [0, 26]

