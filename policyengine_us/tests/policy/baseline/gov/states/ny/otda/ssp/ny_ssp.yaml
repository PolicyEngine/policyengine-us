# 18 NYCRR 398-2.1(t): a minor is neither married nor a head of a household,
# under both the age and the student test.
# https://www.law.cornell.edu/regulations/new-york/18-NYCRR-398-2.1
- name: Case 32, blind seventeen-year-old household head living alone is not a minor.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NY
    age: 17
    is_blind: true
    is_household_head: true
  output:
    # Age 17 < 18, but a household head is not a minor.
    ny_ssp_is_minor: false
    # One-person household, not a minor: living alone.
    ny_ssp_living_arrangement: LIVING_ALONE
    # Living alone rate 87 - excess countable income 0 = 87.
    ny_ssp: 87

- name: Case 33, blind sixteen-year-old living with parents receives minor rate.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        own_children_in_household: 1
      person2:
        age: 43
        own_children_in_household: 1
      person3:
        age: 16
        is_blind: true
    marital_units:
      parents:
        members: [person1, person2]
      child:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NY
  output:
    # person3: age 16 < 18, unmarried and not a household head.
    ny_ssp_is_minor: [false, false, true]
    # person3 is a minor (the three-person household also rules out living alone).
    ny_ssp_living_arrangement: [LIVING_WITH_OTHERS, LIVING_WITH_OTHERS, LIVING_WITH_OTHERS]
    # Parents have no income to deem: living with others rate 23 - 0 = 23.
    # The parents are not aged, blind or disabled.
    ny_ssp: [0, 0, 23]

