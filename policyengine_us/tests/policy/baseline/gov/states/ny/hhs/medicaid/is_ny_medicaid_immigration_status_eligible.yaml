# New York gives DACA recipients state-funded Medicaid as residents
# permanently residing under color of law. The Essential Plan was due to
# take recipients aged 19 to 64 with income up to 250% of the poverty line
# from August 1, 2024, and covered them to June 30, 2026. Annual
# calculations read the status list at January 1.

- name: Case 1, DACA 30-year-old is eligible in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # DACA is on the list at 2019-01-01 (from 2015-01-01).
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 2, DACA 30-year-old is eligible in 2015.
  period: 2015
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list's first value starts on 2015-01-01.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 3, DACA 30-year-old is eligible in 2024.
  period: 2024
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list empties on 2024-08-01, after 2024-01-01.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 4, DACA 30-year-old is ineligible in 2025.
  period: 2025
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list is empty at 2025-01-01 (from 2024-08-01).
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

- name: Case 5, DACA 30-year-old is ineligible in 2026.
  period: 2026
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list is empty at 2026-01-01. DACA returns on 2026-07-01, which annual
    # calculations read from 2027.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

- name: Case 6, DACA 30-year-old is eligible in 2027.
  period: 2027
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # DACA is on the list at 2027-01-01 (from 2026-07-01).
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 7, DACA 17-year-old is eligible in 2019.
  period: 2019
  input:
    age: 17
    immigration_status: DACA
    state_code: NY
  output:
    # The list sets no age limit.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true
    # The list opens no CHIP route: DACA stays off the CHIP status lists.
    is_chip_immigration_status_eligible: false

- name: Case 8, TPS 30-year-old is not on the list in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: TPS
    state_code: NY
  output:
    # The list holds DACA alone. New York's 2014 notice counts TPS as PRUCOL
    # too, and the list does not hold it yet.
    is_ny_medicaid_immigration_status_eligible: false

- name: Case 9, undocumented 30-year-old is not on the list in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: UNDOCUMENTED
    state_code: NY
  output:
    # The list holds DACA alone.
    is_ny_medicaid_immigration_status_eligible: false

- name: Case 10, DACA 30-year-old in New Jersey is ineligible in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: DACA
    state_code: NJ
  output:
    # The variable is defined for New York alone.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

# A DACA adult with no income reaches Medicaid through the state-funded route.
- name: Case 11, DACA 30-year-old with no income is Medicaid eligible in 2019.
  period: 2019
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # No income is below New York's adult limit of 138% of the poverty line.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true
    is_medicaid_eligible: true
    is_basic_health_program_eligible: false

# In 2025 the same adult fails the Medicaid immigration test and qualifies
# for the Essential Plan below its income floor.
- name: Case 12, DACA 30-year-old with no income gets the Essential Plan in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # DACA is off the Basic Health Program's ineligible list at 2025-01-01
    # (from 2024-11-01), and the person fails the Medicaid immigration test.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false
    is_medicaid_eligible: false
    is_basic_health_program_eligible: true

# Pregnancy. The model's CHIP unborn-child route for New York starts in 2024
# and covers a pregnant person who is not eligible for Medicaid. A pregnant
# DACA recipient reaches Medicaid while DACA is on the list and the
# unborn-child route while it is not.
- name: Case 13, pregnant DACA 30-year-old with no income gets Medicaid in 2024.
  period: 2024
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # DACA is on the list at 2024-01-01, so the person is Medicaid eligible and
    # the unborn-child route does not apply.
    is_medicaid_immigration_status_eligible: true
    is_medicaid_eligible: true
    is_chip_fcep_eligible_person: false

- name: Case 14, pregnant DACA 30-year-old with no income keeps the unborn-child route in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # The list is empty at 2025-01-01, so the person fails the Medicaid
    # immigration test and the unborn-child route applies, as it did before.
    is_medicaid_immigration_status_eligible: false
    is_medicaid_eligible: false
    is_chip_fcep_eligible_person: true
    chip_category: PREGNANT_FCEP

# The list empties at every age, though the Essential Plan took ages 19 to 64.
- name: Case 15, DACA 18-year-old is ineligible in 2025.
  period: 2025
  input:
    age: 18
    immigration_status: DACA
    state_code: NY
  output:
    # The list is empty at 2025-01-01 (from 2024-08-01), whatever the age.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

# From 2027 the Medicaid work requirement applies to the adult group.
- name: Case 16, DACA 30-year-old with no work activity fails the work requirement in 2027.
  period: 2027
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
    medicaid_category: ADULT
    monthly_hours_worked: 0
    employment_income: 0
    medicaid_community_engagement_pass_through_eligible: false
  output:
    # DACA is on the list at 2027-01-01 (from 2026-07-01).
    is_medicaid_immigration_status_eligible: true
    # An adult-group member aged 19 to 64 with 0 hours (under 80), no income
    # and no exemption does not meet the requirement.
    medicaid_work_requirement_eligible: false
    is_medicaid_ineligible_due_to_work_requirement: true
    # Category AND immigration test AND work requirement: true AND true AND
    # false = false.
    is_medicaid_eligible: false
