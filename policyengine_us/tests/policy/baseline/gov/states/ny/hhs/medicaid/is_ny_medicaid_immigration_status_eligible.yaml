# New York gives DACA recipients state-funded Medicaid as residents
# permanently residing under color of law. The Essential Plan covered them
# from August 1, 2024 to June 30, 2026, and annual calculations read the
# status list at January 1.

- name: Case 1, DACA 30-year-old is eligible in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # DACA is on the list at 2019-01-01 (from 2015-01-01).
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 2, DACA 30-year-old is eligible in 2015.
  period: 2015
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list's first value starts on 2015-01-01.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 3, DACA 30-year-old is eligible in 2024.
  period: 2024
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list empties on 2024-08-01, after 2024-01-01.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 4, DACA 30-year-old is ineligible in 2025.
  period: 2025
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list is empty at 2025-01-01 (from 2024-08-01).
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

- name: Case 5, DACA 30-year-old is ineligible in 2026.
  period: 2026
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # The list is empty at 2026-01-01. DACA returns on 2026-07-01, which annual
    # calculations read from 2027.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

- name: Case 6, DACA 30-year-old is eligible in 2027.
  period: 2027
  input:
    age: 30
    immigration_status: DACA
    state_code: NY
  output:
    # DACA is on the list at 2027-01-01 (from 2026-07-01).
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 7, DACA 10-year-old is eligible in 2019.
  period: 2019
  input:
    age: 10
    immigration_status: DACA
    state_code: NY
  output:
    # The list sets no age limit.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true

- name: Case 8, TPS 30-year-old is not on the list in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: TPS
    state_code: NY
  output:
    # The list holds DACA alone. A TPS adult also fails the federal test.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

- name: Case 9, undocumented 30-year-old is not on the list in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: UNDOCUMENTED
    state_code: NY
  output:
    # The list holds DACA alone.
    is_ny_medicaid_immigration_status_eligible: false

- name: Case 10, DACA 30-year-old in New Jersey is ineligible in 2019.
  period: 2019
  input:
    age: 30
    immigration_status: DACA
    state_code: NJ
  output:
    # The variable is defined for New York alone.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false

# A DACA adult with no income reaches Medicaid through the state-funded route.
- name: Case 11, DACA 30-year-old with no income is Medicaid eligible in 2019.
  period: 2019
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # No income is below New York's adult limit of 138% of the poverty line.
    is_ny_medicaid_immigration_status_eligible: true
    is_medicaid_immigration_status_eligible: true
    is_medicaid_eligible: true
    is_basic_health_program_eligible: false

# In 2025 the same adult fails the Medicaid immigration test and qualifies
# for the Essential Plan below its income floor.
- name: Case 12, DACA 30-year-old with no income gets the Essential Plan in 2025.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        immigration_status: DACA
        employment_income: 0
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # DACA is off the Basic Health Program's ineligible list at 2025-01-01
    # (from 2024-11-01), and the person fails the Medicaid immigration test.
    is_ny_medicaid_immigration_status_eligible: false
    is_medicaid_immigration_status_eligible: false
    is_medicaid_eligible: false
    is_basic_health_program_eligible: true
