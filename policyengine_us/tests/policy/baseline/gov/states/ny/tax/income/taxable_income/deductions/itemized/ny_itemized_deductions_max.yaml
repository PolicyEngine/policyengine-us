
- name: NY excludes mortgage insurance premiums in 2021.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 80_000
    deductible_interest_expense: 10_000
    mortgage_insurance_premiums: 1_200
    second_residence_mortgage_insurance_premiums: 800
  output:
    deductible_mortgage_insurance_premiums: 2_000
    interest_deduction: 12_000
    ny_itemized_deductions_max: 10_000

