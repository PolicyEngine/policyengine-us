- name: NY public pension 100% subtracted regardless of age
  period: 2024
  input:
    people:
      person1:
        taxable_public_pension_income: 30_000
        age: 45
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_agi_subtractions: 30_000
    ny_pension_exclusion: 0

- name: NY public pension does not consume the $20,000 private pension exclusion cap
  period: 2024
  input:
    people:
      person1:
        taxable_public_pension_income: 30_000
        taxable_private_pension_income: 25_000
        age: 65
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_pension_exclusion: 20_000  # Capped at $20,000 for private pension
    ny_agi_subtractions: 50_000  # 30,000 public + 20,000 private exclusion
