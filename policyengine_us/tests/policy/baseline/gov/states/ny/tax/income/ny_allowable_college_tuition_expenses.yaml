- name: New York limits allowable college tuition expenses to $10,000 per student. Check one student.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: NY
    qualified_tuition_expenses: 12_000
  output:
    ny_allowable_college_tuition_expenses: 10_000

- name: 2025 single student claimed as a dependent elsewhere has no allowable tuition
  period: 2025
  input:
    people:
      student:
        age: 20
        qualified_tuition_expenses: 6000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [student]
    households:
      household:
        members: [student]
        state_code: NY
  output:
    # Tax Law 606(t)(2)(D); IT-272: "only the person who claims the student as a
    # dependent".
    ny_allowable_college_tuition_expenses: 0

- name: 2025 joint return keeps the tuition of the spouse who is not claimed (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        qualified_tuition_expenses: 6000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        qualified_tuition_expenses: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 6_000

- name: 2025 joint return keeps the tuition of the spouse who is not claimed (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 20
        qualified_tuition_expenses: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        qualified_tuition_expenses: 6000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 6_000

- name: 2025 joint return with neither spouse claimed counts both students
  period: 2025
  input:
    people:
      person_a:
        age: 20
        qualified_tuition_expenses: 6000
      person_b:
        age: 20
        qualified_tuition_expenses: 6000
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 12_000

# Tax Law 606(t): the tuition of a dependent counts only for a dependent for whom
# an exemption is allowed under section 616, and a return on which a filer can be
# claimed has none (IRC 152(b)(1)).
- name: 2025 dependent student's tuition does not count on a joint return with one claimable spouse (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 45
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 45
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      student:
        age: 19
        qualified_tuition_expenses: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, student]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, student]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 0

- name: 2025 dependent student's tuition does not count on a joint return with one claimable spouse (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 45
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 45
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      student:
        age: 19
        qualified_tuition_expenses: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_b, person_a, student]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, student]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 0

- name: 2025 dependent student's tuition counts on a joint return with neither spouse claimable
  period: 2025
  input:
    people:
      person_a:
        age: 45
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 45
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      student:
        age: 19
        qualified_tuition_expenses: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, student]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, student]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 6000

# Tax Law 606(t)(2)(D) bars a student who is claimed on another return; a student
# who can be claimed but is not keeps their own tuition.
- name: 2025 single student who can be claimed but is not claimed keeps their tuition
  period: 2025
  input:
    people:
      student:
        age: 20
        qualified_tuition_expenses: 6000
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [student]
    households:
      household:
        members: [student]
        state_code: NY
  output:
    ny_allowable_college_tuition_expenses: 6000
