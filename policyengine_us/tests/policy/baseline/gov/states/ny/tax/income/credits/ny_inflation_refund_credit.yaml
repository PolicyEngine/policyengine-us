- name: 2023 single filer claimed as a dependent gets no inflation refund
  period: 2023
  input:
    people:
      filer:
        age: 22
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        ny_agi: 10000
    households:
      household:
        members: [filer]
        state_code: NY
  output:
    # Tax Law 606(qqq): recipients "must not have been claimed as a dependent".
    ny_inflation_refund_credit: 0

- name: 2023 joint return with one spouse claimed gets no inflation refund (the claimable spouse is the head)
  period: 2023
  input:
    people:
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        ny_agi: 10000
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # The rule covers "taxpayers filing joint returns".
    ny_inflation_refund_credit: 0

- name: 2023 joint return with one spouse claimed gets no inflation refund (the claimable spouse is the spouse)
  period: 2023
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        ny_agi: 10000
    households:
      household:
        members: [person_b, person_a]
        state_code: NY
  output:
    ny_inflation_refund_credit: 0

