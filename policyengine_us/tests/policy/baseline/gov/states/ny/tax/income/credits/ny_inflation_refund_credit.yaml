- name: 2023 single filer who could be claimed but was not claimed gets the inflation refund
  period: 2023
  input:
    people:
      filer:
        age: 22
        claimable_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
        ny_agi: 10000
    households:
