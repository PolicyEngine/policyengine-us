# N.Y. Tax Law 615(a) computes New York itemized deductions as they existed
# immediately before P.L. 115-97, so from 2018 New York keeps the pre-TCJA
# mortgage limits of IRC 163(h)(3)(B)-(D). IRS Publication 936 (2017),
# Table 1 (PDF page 11):
#   G = grandfathered debt, 1987 or earlier; A = other acquisition debt
#   line 6 = min(max(G, $1,000,000), G + A)
#   line 7 = min(home equity debt, $100,000), where home equity debt is the
#            acquisition debt above line 6 plus non-acquisition debt, limited
#            on each home to its room: its fair market value less the debt on
#            it counted in line 6 (a value of 0 means unknown and sets no
#            limit)
#   line 8 = line 6 + line 7
#   line 11 = the larger of line 8 / total debt rounded to three places and
#             the unrounded ratio
#   line 12 = interest x line 11
# Married filing separately halves the limits. PolicyEngine's federal
# deduction uses the $750,000 limit for debt from 2018 or later, no home
# equity debt and the exact ratio.

- name: New York keeps the $1,000,000 acquisition-debt limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 36_000
    first_home_mortgage_balance: 900_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 1_200_000
    ny_first_home_non_acquisition_debt: 0
  output:
    # Federal: $36,000 x $750,000 / $900,000 = $30,000.
    deductible_mortgage_interest_tax_unit: 30_000
    # New York: the $1,000,000 limit covers all $900,000. Main allowed the
    # federal $30,000.
    ny_mortgage_interest_deduction: 36_000
    ny_interest_deduction: 36_000
    ny_itemized_deductions_max: 36_000

- name: Acquisition debt above the limit counts as home equity debt
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 2_000_000
    ny_first_home_non_acquisition_debt: 0
  output:
    # Federal: $40,000 x $750,000 / $1,500,000 = $20,000.
    deductible_mortgage_interest_tax_unit: 20_000
    # New York: ($1,000,000 + $100,000) / $1,500,000 = .7333. The worksheet's
    # .733 rounds down, so the unrounded share applies: $40,000 x 11/15.
    ny_mortgage_interest_deduction: 29_333.33

- name: Separate returns halve both limits
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SEPARATE
    home_mortgage_interest: 20_000
    first_home_mortgage_balance: 600_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 800_000
    ny_first_home_non_acquisition_debt: 0
  output:
    # Federal: $20,000 x $375,000 / $600,000 = $12,500.
    deductible_mortgage_interest_tax_unit: 12_500
    # New York: ($500,000 + $50,000) / $600,000 = .9167. The worksheet's .917
    # is the larger share: $20,000 x .917.
    ny_mortgage_interest_deduction: 18_340

- name: Without a fair market value, only the dollar limit caps home equity debt
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    deductible_mortgage_interest_tax_unit: 20_000
    # New York: a value of 0 means unknown, so the home has no room limit.
    # Line 7 = min($500,000, $100,000). ($1,000,000 + $100,000) / $1,500,000
    # = .7333 (worksheet .733); $40,000 x 11/15.
    ny_mortgage_interest_deduction: 29_333.33

- name: Fair market value limits home equity debt
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 1_040_000
  output:
    # Room for home equity debt: $1,040,000 - $1,000,000 = $40,000.
    # New York: $1,040,000 / $1,500,000 = .6933 (worksheet .693);
    # $40,000 x 1.04 / 1.5.
    ny_mortgage_interest_deduction: 27_733.33

- name: Non-acquisition debt counts as home equity debt up to the limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: JOINT
    home_mortgage_interest: 35_000
    first_home_mortgage_balance: 500_000
    first_home_mortgage_origination_year: 2015
    ny_first_home_fair_market_value: 1_000_000
    ny_first_home_non_acquisition_debt: 200_000
  output:
    # PE's federal calculation does not see the non-acquisition debt.
    deductible_mortgage_interest_tax_unit: 35_000
    # New York: ($500,000 + $100,000) / $700,000 = .8571 (worksheet .857);
    # $35,000 x 6/7.
    ny_mortgage_interest_deduction: 30_000

- name: Non-acquisition debt on the second home counts as home equity debt
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: JOINT
    home_mortgage_interest: 30_000
    first_home_mortgage_balance: 400_000
    first_home_mortgage_origination_year: 2015
    ny_second_home_non_acquisition_debt: 200_000
  output:
    # PE's federal calculation does not see the non-acquisition debt.
    deductible_mortgage_interest_tax_unit: 30_000
    # New York: ($400,000 + $100,000) / $600,000 = .8333 (worksheet .833);
    # $30,000 x 5/6.
    ny_mortgage_interest_deduction: 25_000

- name: Grandfathered debt reduces the acquisition-debt limit
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: JOINT
    home_mortgage_interest: 50_000
    first_home_mortgage_balance: 400_000
    first_home_mortgage_origination_year: 1986
    second_home_mortgage_balance: 800_000
    second_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 500_000
    ny_second_home_fair_market_value: 900_000
  output:
    # Federal: line 6 = $400,000 of grandfathered debt; the later debt
    # raises the limit only to $750,000; $50,000 x $750,000 / $1,200,000.
    deductible_mortgage_interest_tax_unit: 31_250
    # New York: line 6 = max($400,000, $1,000,000) = $1,000,000, of which
    # $600,000 is the second home's; its other $200,000 is home equity debt,
    # within its room of $900,000 - $600,000 = $300,000 and limited to
    # $100,000. ($1,000,000 + $100,000) / $1,200,000 = .9167. The worksheet's
    # .917 is the larger share: $50,000 x .917.
    ny_mortgage_interest_deduction: 45_850

- name: Each home's equity room limits its own excess debt
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: JOINT
    home_mortgage_interest: 60_000
    first_home_mortgage_balance: 900_000
    first_home_mortgage_origination_year: 2020
    second_home_mortgage_balance: 600_000
    second_home_mortgage_origination_year: 2021
    ny_first_home_fair_market_value: 3_000_000
    ny_second_home_fair_market_value: 400_000
  output:
    # Line 6 = $1,000,000, shared 9:6: $600,000 on the first home and
    # $400,000 on the second. The first home's other $300,000 fits in its
    # room; the second home has no room, so its other $200,000 does not
    # count. Line 7 = min($300,000, $100,000).
    # ($1,000,000 + $100,000) / $1,500,000 = .7333 (worksheet .733);
    # $60,000 x 11/15.
    ny_mortgage_interest_deduction: 44_000

- name: A directly supplied deduction passes through when nothing is disallowed
  period: 2025
  input:
    state_code: NY
    deductible_mortgage_interest: 12_000
  output:
    ny_mortgage_interest_deduction: 12_000

- name: A directly supplied deduction passes through even with balances
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    deductible_mortgage_interest: 12_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    # With no home_mortgage_interest, non_deductible_mortgage_interest_tax_unit
    # is 0: it takes home_mortgage_interest_tax_unit plus the points, less
    # deductible_mortgage_interest_tax_unit, and does not read the supplied
    # person-level amount. So the supplied $12,000 passes through. Without the
    # pass-through, the worksheet would limit it again: $12,000 x 11/15 = $8,800.
    ny_mortgage_interest_deduction: 12_000

- name: Without a fair market value, home equity debt keeps its interest
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 20_000
    first_home_mortgage_balance: 300_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_non_acquisition_debt: 50_000
  output:
    # PE's federal calculation does not see the $50,000.
    deductible_mortgage_interest_tax_unit: 20_000
    # New York: line 8 = $300,000 + min($50,000, $100,000) = $350,000, equal
    # to line 9, so the share is 1. A value of 0 once gave this home no room
    # and $17,140.
    ny_mortgage_interest_deduction: 20_000

- name: Before 2018 New York uses the federal amount
  period: 2017
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2010
    ny_first_home_fair_market_value: 2_000_000
  output:
    # Federal: $40,000 x $1,000,000 / $1,500,000.
    deductible_mortgage_interest_tax_unit: 26_666.67
    ny_mortgage_interest_deduction: 26_666.67

- name: When the worksheet rounds down, New York uses the unrounded share
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 60_000
    first_home_mortgage_balance: 1_200_000
    first_home_mortgage_origination_year: 2015
    ny_first_home_fair_market_value: 1_000_000
  output:
    # Federal: $60,000 x $1,000,000 / $1,200,000 = $50,000.
    # New York: room = $1,000,000 - $1,000,000 = $0, so line 7 is 0;
    # $1,000,000 / $1,200,000 = .8333. The worksheet's .833 gives $49,980,
    # the unrounded share $50,000, which applies.
    deductible_mortgage_interest_tax_unit: 50_000
    ny_mortgage_interest_deduction: 50_000

- name: An exact tie in the worksheet's share rounds up
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    filing_status: SINGLE
    home_mortgage_interest: 80_000
    first_home_mortgage_balance: 2_000_000
    first_home_mortgage_origination_year: 2020
    ny_first_home_fair_market_value: 1_001_000
  output:
    # Federal: $80,000 x $750,000 / $2,000,000 = $30,000.
    deductible_mortgage_interest_tax_unit: 30_000
    # New York: room = $1,001,000 - $1,000,000 = $1,000. $1,001,000 /
    # $2,000,000 = .5005, an exact tie, so the worksheet's share is .501.
    ny_mortgage_interest_deduction: 40_080

- name: Mortgage interest outside New York is zero
  period: 2025
  input:
    state_code: NJ
    home_mortgage_interest: 36_000
    first_home_mortgage_balance: 900_000
    first_home_mortgage_origination_year: 2020
  output:
    ny_mortgage_interest_deduction: 0
