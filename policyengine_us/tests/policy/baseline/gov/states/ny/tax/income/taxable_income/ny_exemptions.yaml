- name: Two dependents, two exemptions.
  period: 2021
  absolute_error_margin: 0
  input:
    state_code: NY
    tax_unit_child_dependents: 2
  output:
    ny_exemptions: 2_000

- name: 2025 joint return with one claimable spouse has no dependent exemptions (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
  output:
    # Tax Law 616(a) needs a dependent deduction under IRC 151(c); IRC 152(b)(1).
    ny_exemptions: 0

- name: 2025 joint return with one claimable spouse has no dependent exemptions (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NY
  output:
    ny_exemptions: 0

- name: 2025 joint return with neither spouse claimable has a dependent exemption
  period: 2025
  input:
    people:
      person_a:
        age: 22
      person_b:
        age: 22
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
  output:
    ny_exemptions: 1_000

# Publication 501, Dependent Taxpayer Test: a filer whose would-be claimant is not
# required to file and files no return or only for a refund can claim dependents.
- name: 2025 joint return whose claimable spouse is within the filing exception keeps the dependent exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
  output:
    ny_exemptions: 1000

- name: 2025 joint return whose claimable spouse is within the filing exception keeps the dependent exemption (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NY
  output:
    ny_exemptions: 1000
