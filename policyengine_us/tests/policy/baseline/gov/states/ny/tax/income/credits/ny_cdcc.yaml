# Form IT-216 line 3b: taxpayers who receive employer dependent care benefits
# complete Worksheet 1 (IT-216-I 2022, page 4); line 5 is the smallest of
# line 3a, line 3b and the New York cap.
- name: 2022 employer dependent care benefits reduce the New York cap (Worksheet 1 line 14)
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        dependent_care_employer_benefits: 5_000
        is_tax_unit_head: true
      person2:
        age: 40
        employment_income: 50_000
        is_tax_unit_spouse: true
      child1:
        age: 7
        is_tax_unit_dependent: true
      child2:
        age: 9
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 8_000
    households:
      household:
        members: [person1, person2, child1, child2]
        state_code: NY
  output:
    # Worksheet 1: line 5 = 5,000; line 6 = 8,000; line 7 = 5,000;
    # lines 8 and 9 = 50,000; line 10 = 5,000; line 11 = 5,000;
    # line 12 = 6,000 (two persons); line 13 = 5,000;
    # line 14 = 6,000 - 5,000 = 1,000; line 15 = 8,000 - 5,000 = 3,000;
    # line 16 = 1,000.
    # Form IT-216: line 3b = 1,000; line 5 = 1,000; lines 6 and 7 = 50,000;
    # line 8 = 1,000; line 10 (FAGI 100,000) = .20; line 11 = 200;
    # line 13 (NYAGI 100,000) = .600; line 14 = 200 x .600 = 120.
    ny_cdcc_max: 1_000
    ny_cdcc: 120

- name: 2022 employer dependent care benefits below the cap (Worksheet 1 line 15)
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        dependent_care_employer_benefits: 2_000
        is_tax_unit_head: true
      person2:
        age: 40
        employment_income: 50_000
        is_tax_unit_spouse: true
      child1:
        age: 7
        is_tax_unit_dependent: true
      child2:
        age: 9
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [person1, person2, child1, child2]
        state_code: NY
  output:
    # Worksheet 1: line 5 = 2,000; line 6 = 5,000; line 7 = 2,000;
    # lines 8 and 9 = 50,000; line 10 = 2,000; line 11 = 5,000;
    # line 12 = 6,000; line 13 = 2,000; line 14 = 6,000 - 2,000 = 4,000;
    # line 15 = 5,000 - 2,000 = 3,000; line 16 = 3,000.
    # Form IT-216: line 3b = 3,000; line 5 = 3,000; line 8 = 3,000;
    # line 10 (FAGI 100,000) = .20; line 11 = 600;
    # line 13 (NYAGI 100,000) = .600; line 14 = 600 x .600 = 360.
    ny_cdcc_max: 3_000
    ny_cdcc: 360

