- name: Three dependent children in NY.
  period: 2022
  input:
    count_cdcc_eligible: 3
    tax_unit_childcare_expenses: 10_000
    state_code: NY
    employment_income: 10_000
  output:
    # Form IT-216: line 5 = min(10,000, 7,500 for three persons) = 7,500;
    # line 10 (recomputed FAGI 10,000) = .35; line 13 (NYAGI 10,000) = 1.100.
    # 7,500 x .35 x 1.1 = 2,887.50
    ny_cdcc: 2_887.5

- name: Separate filer with qualifying individuals gets no credit, IT-216 applies IRC 21(e)(2).
  period: 2022
  input:
    count_cdcc_eligible: 3
    tax_unit_childcare_expenses: 10_000
    state_code: NY
    employment_income: 10_000
    filing_status: SEPARATE
  output:
    ny_cdcc: 0

- name: Separated filer maintaining a home for a qualifying child keeps the credit, IRC 21(e)(4).
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 35
        is_separated: true
        employment_income: 10_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        count_cdcc_eligible: 3
        tax_unit_childcare_expenses: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    # Same Form IT-216 computation as above: 7,500 x .35 x 1.1
    ny_cdcc: 2_887.5

- name: 2021 credit uses the New York limits, not the ARPA federal credit
  period: 2021
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 150_000
        is_tax_unit_head: true
      person2:
        age: 40
        employment_income: 73_333
        is_tax_unit_spouse: true
      child1:
        age: 7
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, child1]
        filing_status: JOINT
        tax_unit_childcare_expenses: 11_368
    households:
      household:
        members: [person1, person2, child1]
        state_code: NY
  output:
    # NY decoupled from IRC changes after March 1, 2020 (IT-216-I 2021, page 1).
    # Line 5 = 3,000; line 10 (FAGI 223,333) = .20; line 13 (NYAGI over 150,000) = .200.
    ny_cdcc: 120

