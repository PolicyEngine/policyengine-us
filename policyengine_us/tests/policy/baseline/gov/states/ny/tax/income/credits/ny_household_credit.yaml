- name: Maximum of $75 for a single filer.
  period: 2021
  input:
    state_code: NY
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 75
- name: $50 for a single filer with $7,000 income.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 7000
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 50
- name: Single filer is eligible until income exceeds $28,000
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 28001
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 0
- name: 4-person tax unit with $32,000 income receives $35.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 32000
    filing_status: JOINT
    tax_unit_size: 4
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 35
- name: 2-person married filing separately tax unit with $16,000 income receives half
    of a 4-person's with $32,000 income (above), rounded up.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 16000
    spouse_separate_adjusted_gross_income: 16000
    filing_status: SEPARATE
    tax_unit_size: 2
    spouse_separate_tax_unit_size: 2
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 18
- name: Simple ny_household_credit test
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        age: 40
      person2:
        age: 10
      person3:
        age: 11
      person4:
        age: 13
      person5:
        age: 15
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
        adjusted_gross_income: 20020
        ny_income_tax_before_credits: 1000000
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
    households:
      household:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
        state_fips: 36
  output:
    ny_household_credit: 100


- name: 2025 single filer who can be claimed as a dependent gets no household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
  output:
    # Tax Law 606(b)(3)(B); IT-201 line 40: "If you marked the Yes box at item C
    # ... you do not qualify".
    ny_household_credit_potential: 0

- name: 2025 single filer who cannot be claimed gets the household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
  output:
    ny_household_credit_potential: 45

- name: 2025 joint return with one claimable spouse counts the other spouse's exemption (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # Tax Law 606(b) counts the exemptions the couple is entitled to: one,
    # for the spouse who cannot be claimed. $60 base at $10,000 of AGI plus
    # $15 x (1 - 1). IT-201 line 40 would deny the credit because item C is
    # marked; the model follows the statute.
    ny_household_credit_potential: 60

- name: 2025 joint return with one claimable spouse counts the other spouse's exemption (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: NY
  output:
    ny_household_credit_potential: 60

- name: 2025 joint return with neither spouse claimable gets the household credit
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5000
      person_b:
        age: 22
        employment_income: 5000
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # $60 + $15 x (2 - 1).
    ny_household_credit_potential: 75

# Tax Law 606(b)(3)(B): a husband and wife, a head of household and a
# surviving spouse are households in their own right; only an unmarried
# individual is excluded for being claimable. IT-201 line 40 denies every
# return with item C marked; the model follows the statute.
- name: 2025 separate filer who can be claimed counts the couple's exemptions
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SEPARATE
    households:
      household:
        members: [person_a]
        state_code: NY
  output:
    # Combined AGI $10,000 (the spouse's separate return is assumed alike);
    # exemptions: 0 for the claimable filer plus 1 for the spouse's unit.
    # $60 base + $15 x (1 - 1) = $60, halved for a separate return.
    ny_household_credit_potential: 30

- name: 2025 joint return where both spouses can be claimed reduces the base by one additional amount
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
      person_b:
        age: 22
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # No exemptions: $60 base + $15 x (0 - 1) = $45.
    ny_household_credit_potential: 45

- name: 2025 head of household who can be claimed counts the dependent's exemption
  period: 2025
  input:
    people:
      parent:
        age: 22
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [parent, child]
        filing_status: HEAD_OF_HOUSEHOLD
        # The would-be claimant need not file, so the parent may still claim
        # the child (Publication 501, Dependent Taxpayer Test).
        head_or_spouse_is_dependent_elsewhere_without_filing_exception: false
    households:
      household:
        members: [parent, child]
        state_code: NY
  output:
    # One exemption: $60 base + $15 x (1 - 1).
    ny_household_credit_potential: 60
