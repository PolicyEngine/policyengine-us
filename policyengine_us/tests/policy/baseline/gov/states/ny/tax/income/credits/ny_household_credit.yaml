- name: Maximum of $75 for a single filer.
  period: 2021
  input:
    state_code: NY
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 75
- name: $50 for a single filer with $7,000 income.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 7000
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 50
- name: Single filer is eligible until income exceeds $28,000
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 28001
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 0
- name: 4-person tax unit with $32,000 income receives $35.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 32000
    filing_status: JOINT
    tax_unit_size: 4
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 35
- name: 2-person married filing separately tax unit with $16,000 income receives half
    of a 4-person's with $32,000 income (above), rounded up.
  period: 2021
  input:
    state_code: NY
    adjusted_gross_income: 16000
    spouse_separate_adjusted_gross_income: 16000
    filing_status: SEPARATE
    tax_unit_size: 2
    spouse_separate_tax_unit_size: 2
    ny_income_tax_before_credits: 1000000
  output:
    ny_household_credit: 18
- name: Simple ny_household_credit test
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1:
        age: 40
      person2:
        age: 10
      person3:
        age: 11
      person4:
        age: 13
      person5:
        age: 15
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
        adjusted_gross_income: 20020
        ny_income_tax_before_credits: 1000000
    spm_units:
      spm_unit:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
    households:
      household:
        members:
        - person1
        - person2
        - person3
        - person4
        - person5
        state_fips: 36
  output:
    ny_household_credit: 100


- name: 2025 single filer who can be claimed as a dependent gets no household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
  output:
    # Tax Law 606(b)(3)(B); IT-201 line 40: "If you marked the Yes box at item C
    # ... you do not qualify".
    ny_household_credit_potential: 0

- name: 2025 single filer who cannot be claimed gets the household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
  output:
    ny_household_credit_potential: 45

- name: 2025 joint return with one claimable spouse gets no household credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # Item C is one box per return; either spouse marks it.
    ny_household_credit_potential: 0

- name: 2025 joint return with one claimable spouse gets no household credit (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        employment_income: 5000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: NY
  output:
    ny_household_credit_potential: 0

- name: 2025 joint return with neither spouse claimable gets the household credit
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5000
      person_b:
        age: 22
        employment_income: 5000
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # $60 + $15 x (2 - 1).
    ny_household_credit_potential: 75
