# Form IT-272: an itemizer may choose either tuition benefit but cannot take both.
- name: Federal standard and New York itemized with the tuition credit
  period: 2025
  input:
    state_code: NY
    tax_unit_itemizes: false
    ny_itemizes: true
    ny_elects_tuition_credit_when_itemizing: true
    qualified_tuition_expenses: 6_000
  output:
    ny_college_tuition_credit: 240
    ny_college_tuition_deduction: 0

- name: Federal itemized and New York itemized with the tuition deduction
  period: 2025
  input:
    state_code: NY
    tax_unit_itemizes: true
    ny_itemizes: true
    ny_elects_tuition_credit_when_itemizing: false
    qualified_tuition_expenses: 6_000
  output:
    ny_college_tuition_credit: 0
    ny_college_tuition_deduction: 6_000

- name: A state standard filer can take the credit without an itemizer election
  period: 2025
  input:
    state_code: NY
    ny_itemizes: false
    ny_elects_tuition_credit_when_itemizing: false
    qualified_tuition_expenses: 6_000
  output:
    ny_college_tuition_credit: 240
    ny_deductions: 8_000

- name: New York itemized filing can preserve other deductions and claim the tuition credit
  period: 2025
  input:
    state_code: NY
    ny_itemizes: true
    ny_elects_tuition_credit_when_itemizing: true
    ny_agi: 18_000
    ny_exemptions: 1_000
    deductible_mortgage_interest: 16_000
    qualified_tuition_expenses: 2_000
    state_sales_tax: 0
    local_sales_tax: 0
  output:
    ny_deductions: 16_000
    ny_taxable_income: 1_000
    ny_college_tuition_deduction: 0
    ny_college_tuition_credit: 200

- name: A New York filer claimed elsewhere cannot take the tuition credit
  period: 2025
  input:
    state_code: NY
    head_is_dependent_elsewhere: true
    qualified_tuition_expenses: 6_000
    ny_itemizes: true
    ny_elects_tuition_credit_when_itemizing: true
  output:
    ny_college_tuition_credit: 0
    ny_college_tuition_deduction: 0

- name: The tuition deduction is unavailable above one million of New York AGI
  period: 2025
  input:
    state_code: NY
    ny_agi: 1_000_001
    ny_itemizes: true
    ny_elects_tuition_credit_when_itemizing: false
    qualified_tuition_expenses: 6_000
  output:
    ny_college_tuition_deduction: 0
