- name: NY pension exclusion for eligible individual
  period: 2022
  input:
    people:
      person1:
        taxable_private_pension_income: 25_000
        age: 65
    tax_units:
      tax_unit:
        members: [person1]        
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_pension_exclusion: 20_000  # Capped at 20,000

