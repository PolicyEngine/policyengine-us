  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 20_000
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # FAGI 20,000 > 18,000 income limit -> ineligible regardless of gate/table.
    ny_real_property_tax_credit: 0

# Item 2 also affects tax years through 2024 (old 50%-of-excess formula, elderly
# maximum chart). The only 65+ person is a claimed dependent -> the elderly cap
# now applies. Income measure through 2024 is household gross income.
- name: 2024 - dependent aged 66 makes the elderly maximum cap apply
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 2_000
        real_estate_taxes: 10_000
      dep1:
        age: 66
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dep1]
    households:
      household:
        members: [head, dep1]
        state_code: NY
  output:
    # Through 2024 the income measure is household gross income (13,316 here,
    # including imputed dependent income). Single excess rate at
    # 13,316 = 0.06, threshold = 13,316 x 0.06 = 799; excess = 10,000 - 799 = 9,201;
    # credit = 0.5 x 9,201 = 4,600.5, capped by the elderly maximum at 13,316
    # (13,000-14,000 band) = 154 -> 154. If ~is_dependent still applied, the
    # non-elderly cap (49) would bind instead, so this locks in item 2 for 2024.
    ny_household_gross_income: 13_316
    ny_real_property_tax_credit: 154

# Regression: nonzero ONLY under the corrected single-amount gate. This locks in
# the excess_real_property_tax type: single_amount fix - under the old summed
# (marginal) schedule the gate would sum to 0.35 at FAGI 16,000, giving a
# threshold of 5,600 and negative excess (0 credit).
- name: 2025 - single-amount gate regression, FAGI 16,000 taxes 2,000 -> 150
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 16_000
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Single excess rate at FAGI 16,000 = 0.065, threshold = 16,000 x 0.065 =
    # 1,040; excess = 2,000 - 1,040 = 960 > 0 -> gate passes. Elderly (age 71)
    # -> Table A, FAGI 16,000 (14,001-18,000) -> 150. Under the OLD summed rate
    # (0.35) threshold would be 5,600 -> excess < 0 -> 0, so this case is the
    # one that locks the single_amount gate fix.
    ny_real_property_tax_credit: 150

# --- $1-boundary regressions: Table 1 and the credit-limit chart use closed
# integer bands ($0-3,000 -> .035; then 3,001-5,000 -> .040), so an income of
# exactly $3,000 belongs to the LOWER band. These only pass when a value at a
# band top stays in its band - right=True lookups over band-top thresholds
# (2025 IT-214 p.3 Table 1; 2024 IT-214-I p.2 Table 1 and p.3 chart).

- name: 2025 - Table 1 boundary, FAGI exactly 3,000 keeps rate 0.035 (gate flip)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 3_000
        real_estate_taxes: 110
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rate at exactly 3,000 is 0.035 (last dollar of the 0-3,000 band), so the
    # threshold is 105 and RPT 110 clears the gate -> Table A 375. Under a
    # default (right=False) lookup the rate would be 0.040 (threshold 120)
    # and the gate would wrongly fail.
    ny_real_property_tax_credit: 375

- name: 2025 - Table 1 boundary, FAGI exactly 5,000 keeps rate 0.040 (gate flip)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 5_000
        real_estate_taxes: 210
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rate at exactly 5,000 is 0.040 -> threshold 200; RPT 210 clears the gate
    # -> Table B 75. A right=False lookup (0.045, threshold 225) would fail it.
    ny_real_property_tax_credit: 75

- name: 2025 - Table 1 boundary, FAGI exactly 14,000 keeps rate 0.060 (gate flip)
