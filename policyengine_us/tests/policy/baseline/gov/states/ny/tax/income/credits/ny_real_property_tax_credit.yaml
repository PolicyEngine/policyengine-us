# Tax Law 606(e)(3): the elderly amounts need a qualified taxpayer, spouse or IRC
# 152 dependent aged 65 or older. A return on which a filer can be claimed has no
# dependents (IRC 152(b)(1)), so a dependent's age does not reach the elderly
# table: non-elderly Table B at FAGI $2,000 gives $75, the elderly table $375.
- name: 2025 aged dependent of a joint return with one claimable spouse does not reach the elderly table (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 40
        employment_income: 1000
        real_estate_taxes: 500
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 40
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      relative:
        age: 66
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, relative]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, relative]
        state_code: NY
  output:
    ny_real_property_tax_credit: 75

