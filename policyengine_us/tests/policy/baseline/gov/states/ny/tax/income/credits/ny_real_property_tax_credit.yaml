# Issue item 2: the ONLY 65+ person is a claimed dependent (head under 65).
# Dropping the ~is_dependent term means the dependent's age still qualifies the
# unit for elderly Table A. If ~is_dependent were still present this would fall
# to Table B (75) and fail.
- name: 2025 - dependent aged 66 qualifies unit for elderly Table A
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 2_000
        real_estate_taxes: 500
      dep1:
        age: 66
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dep1]
    households:
      household:
        members: [head, dep1]
        state_code: NY
  output:
    # Gate: single excess rate at FAGI 2,000 = 0.035, threshold = 70;
    # excess = 500 - 70 = 430 > 0. Any member 65+ (dependent age 66) -> Table A
    # FAGI 2,000 -> 375 (not the Table B value of 75 that ~is_dependent would
    # have produced).
    ny_real_property_tax_credit: 375

- name: 2025 - FAGI over 18,000 -> 0 (income limit unchanged)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 20_000
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # FAGI 20,000 > 18,000 income limit -> ineligible regardless of gate/table.
    ny_real_property_tax_credit: 0

# Item 2 also affects tax years through 2024 (old 50%-of-excess formula, elderly
# maximum chart). The only 65+ person is a claimed dependent -> the elderly cap
# now applies. Income measure through 2024 is household gross income.
- name: 2024 - dependent aged 66 makes the elderly maximum cap apply
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 2_000
        real_estate_taxes: 10_000
      dep1:
        age: 66
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dep1]
    households:
      household:
        members: [head, dep1]
        state_code: NY
  output:
    # Through 2024 the income measure is household gross income: AGI 2,000 +
    # the dependent's 2024 SSI 943 x 12 = 11,316 (line 12) + their State
    # Supplement Program payment for living with others 23 x 12 = 276 (line
    # 14) = 13,592. Single excess rate at 13,592 = 0.06, threshold = 13,592 x
    # 0.06 = 815.52; excess = 10,000 - 815.52 = 9,184.48; credit = 0.5 x
    # 9,184.48 = 4,592.24, capped by the elderly maximum at 13,592
    # (13,001-14,000 band) = 154 -> 154. If ~is_dependent still applied, the
    # non-elderly cap (49) would bind instead, so this locks in item 2 for 2024.
    ny_household_gross_income: 13_592
    ny_real_property_tax_credit: 154

# Through 2024 the income limit and every lookup use household gross income
# (Tax Law 606(e)(1)(C); 2024 IT-214 line 16), which counts workers'
# compensation (line 15) and the income of everyone who shares the residence
# (606(e)(1)(B); 2024 IT-214-I page 2). The cases sit at the $18,000 limit
# ("If line 16 is more than $18,000, stop") and one dollar above it.
- name: 2024 - workers' compensation brings household gross income to exactly 18,000
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        workers_compensation: 8_000
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Line 9 10,000 + line 15 8,000 = 18,000, not more than 18,000. Rate
    # 0.065 (14,001-18,000) -> threshold 18,000 x 0.065 = 1,170; excess =
    # 2,000 - 1,170 = 830; 50% = 415, capped by the non-elderly maximum at
    # 17,001-18,000 = 41. Without the workers' compensation, income of 10,000
    # would give rate 0.055, excess 1,450, 50% = 725 and the 9,001-10,000 cap
    # of 57.
    ny_household_gross_income: 18_000
    ny_real_property_tax_credit: 41

- name: 2024 - workers' compensation one dollar over the household gross income limit
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        workers_compensation: 8_001
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # 10,000 + 8,001 = 18,001 > 18,000: no credit.
    ny_household_gross_income: 18_001
    ny_real_property_tax_credit: 0

- name: 2024 - an adult child's income on their own return brings the household to exactly 18,000
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      parent:
        age: 64
        employment_income: 5_000
        real_estate_taxes: 2_000
      child:
        age: 40
        employment_income: 13_000
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [child]
    households:
      household:
        members: [parent, child]
        state_code: NY
  output:
    # Household gross income 5,000 + 13,000 = 18,000 for both returns. The
    # parent: rate 0.065 -> threshold 1,170; excess = 2,000 - 1,170 = 830;
    # 50% = 415, capped by the non-elderly maximum at 17,001-18,000 = 41 (no
    # member is 65 or older). The child pays no real property tax or rent,
    # so no credit. On the parent's income alone (5,000) the credit would be
    # 0.5 x (2,000 - 5,000 x 0.04) = 900, capped at 67.
    ny_household_gross_income: [18_000, 18_000]
    ny_real_property_tax_credit: [41, 0]

- name: 2024 - an adult child's income on their own return puts the household one dollar over the limit
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      parent:
        age: 64
        employment_income: 5_000
        real_estate_taxes: 2_000
      child:
        age: 40
        employment_income: 13_001
    tax_units:
      parent_unit:
        members: [parent]
      child_unit:
        members: [child]
    households:
      household:
        members: [parent, child]
        state_code: NY
  output:
    # 5,000 + 13,001 = 18,001 > 18,000: no credit for either return.
    ny_household_gross_income: [18_001, 18_001]
    ny_real_property_tax_credit: [0, 0]

# Regression: nonzero ONLY under the corrected single-amount gate. This locks in
# the excess_real_property_tax type: single_amount fix - under the old summed
# (marginal) schedule the gate would sum to 0.35 at FAGI 16,000, giving a
# threshold of 5,600 and negative excess (0 credit).
- name: 2025 - single-amount gate regression, FAGI 16,000 taxes 2,000 -> 150
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 16_000
        real_estate_taxes: 2_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Single excess rate at FAGI 16,000 = 0.065, threshold = 16,000 x 0.065 =
    # 1,040; excess = 2,000 - 1,040 = 960 > 0 -> gate passes. Elderly (age 71)
    # -> Table A, FAGI 16,000 (14,001-18,000) -> 150. Under the OLD summed rate
    # (0.35) threshold would be 5,600 -> excess < 0 -> 0, so this case is the
    # one that locks the single_amount gate fix.
    ny_real_property_tax_credit: 150

# --- $1-boundary regressions: Table 1 and the credit-limit chart use closed
# integer bands ($0-3,000 -> .035; then 3,001-5,000 -> .040), so an income of
# exactly $3,000 belongs to the LOWER band. These only pass when a value at a
# band top stays in its band - right=True lookups over band-top thresholds
# (2025 IT-214 p.3 Table 1; 2024 IT-214-I p.2 Table 1 and p.3 chart).

- name: 2025 - Table 1 boundary, FAGI exactly 3,000 keeps rate 0.035 (gate flip)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 3_000
        real_estate_taxes: 110
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rate at exactly 3,000 is 0.035 (last dollar of the 0-3,000 band), so the
    # threshold is 105 and RPT 110 clears the gate -> Table A 375. Under a
    # default (right=False) lookup the rate would be 0.040 (threshold 120)
    # and the gate would wrongly fail.
    ny_real_property_tax_credit: 375

- name: 2025 - Table 1 boundary, FAGI exactly 5,000 keeps rate 0.040 (gate flip)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 5_000
        real_estate_taxes: 210
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rate at exactly 5,000 is 0.040 -> threshold 200; RPT 210 clears the gate
    # -> Table B 75. A right=False lookup (0.045, threshold 225) would fail it.
    ny_real_property_tax_credit: 75

- name: 2025 - Table 1 boundary, FAGI exactly 14,000 keeps rate 0.060 (gate flip)
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
