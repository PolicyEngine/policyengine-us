# Issue item 2: the ONLY 65+ person is a claimed dependent (head under 65).
# Dropping the ~is_dependent term means the dependent's age still qualifies the
# unit for elderly Table A. If ~is_dependent were still present this would fall
# to Table B (75) and fail.
- name: 2025 - dependent aged 66 qualifies unit for elderly Table A
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 40
        employment_income: 2_000
        real_estate_taxes: 500
      dep1:
        age: 66
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, dep1]
    households:
      household:
        members: [head, dep1]
        state_code: NY
  output:
    # Gate: single excess rate at FAGI 2,000 = 0.035, threshold = 70;
    # excess = 500 - 70 = 430 > 0. Any member 65+ (dependent age 66) -> Table A
    # FAGI 2,000 -> 375 (not the Table B value of 75 that ~is_dependent would
    # have produced).
    ny_real_property_tax_credit: 375

