- name: 2025 joint return with one claimable spouse keeps the real property tax credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 1000
        real_estate_taxes: 500
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 1000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
  output:
    # Tax Law 606(e)(6)(C) covers "a qualified taxpayer and their spouse";
    # non-elderly Table B at FAGI $2,000.
    ny_real_property_tax_credit: 75

