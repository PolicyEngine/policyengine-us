  output:
    # Rate at exactly 3,000 is 0.035 -> threshold 105; excess 45; 50% = 22.50,
    # below the 2,001-3,000 non-elderly cap of 71. A right=False lookup
    # (0.040, threshold 120) would yield 15 instead.
    ny_household_gross_income: 3_000
    ny_real_property_tax_credit: 22.5

# Fractional income rounds to whole dollars, half up, before any lookup
# (IT-214-I "How to fill in Form IT-214": "drop amounts below 50 cents and
# increase amounts from 50 to 99 cents to the next dollar").

- name: 2025 - FAGI 3,000.49 rounds down to 3,000 -> rate 0.035, gate passes
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 3_000.49
        real_estate_taxes: 110
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rounded FAGI 3,000: rate 0.035 -> threshold 105; RPT 110 clears the
    # gate -> Table A 375. Unrounded, 3,000.49 would fall in the next band
    # (rate 0.040, threshold ~120) and wrongly fail the gate.
    ny_real_property_tax_credit: 375

- name: 2025 - FAGI 3,000.50 rounds up to 3,001 -> rate 0.040, gate fails
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 3_000.50
        real_estate_taxes: 110
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Rounded FAGI 3,001: rate 0.040 -> threshold 120.04; RPT 110 is below
    # it, so no credit ("$2.50 becomes $3" - halves round up).
    ny_real_property_tax_credit: 0

