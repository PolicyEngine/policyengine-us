- name: Homeowner with $25k real estate taxes and $5k income.
  period: 2022
  input:
    employment_income: 5_000
    state_code: NY
    real_estate_taxes: 25_000
  output:
    # HGI exactly 5,000 sits in the 4,001-5,000 row of the credit-limit chart
    # (2022 IT-214-I page 3): non-elderly cap 67 (not the 5,001-6,000 row's 65).
    ny_real_property_tax_credit: 67

- name: Renter over the $450/month cap gets no credit (IT-214 line 21)
  period: 2022
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 6_000
        rent: 6_000  # $500/month > $450 cap
    households:
      household:
        members: [head]
        state_code: NY
  output:
    ny_real_property_tax_credit: 0

- name: Household gross income over $18,000 via nontaxable Social Security gets no credit
  period: 2022
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 6_000
        social_security: 15_000  # nontaxable, but counts toward IT-214 line 16
        rent: 3_000  # $250/month, under the cap: isolates the income gate
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # AGI 6,000 + nontaxable SS 15,000 = household gross income 21,000 > 18,000
    ny_real_property_tax_credit: 0

- name: Elderly head with pension and Social Security over cap gets no credit (taxsim 1135)
  period: 2022
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        taxable_private_pension_income: 6_600
        social_security: 15_506
        rent: 17_139  # also over the $450/month cap
      dep1:
        age: 8
        is_tax_unit_dependent: true
      dep2:
        age: 10
        is_tax_unit_dependent: true
    households:
      household:
        members: [head, dep1, dep2]
        state_code: NY
  output:
    ny_real_property_tax_credit: 0

# From tax year 2025 (Part RR of Ch. 59 of the Laws of 2025) eligibility keys
# on federal AGI, not household gross income: the same filer as the case above,
# with nontaxable Social Security, now qualifies because FAGI 6,000 <= 18,000.
# (The 2025 credit *amount* becomes a flat Table A/B lookup rather than 50% of
# excess - tracked in #9310 - so the amount here is the pre-2025 formula
# applied to FAGI.)
- name: 2025 - FAGI keying lets a filer with nontaxable Social Security qualify
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 6_000
        social_security: 15_000
        rent: 3_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    adjusted_gross_income: 6_000
    ny_household_gross_income: 21_000
    # Qualifies on FAGI 6,000 <= 18,000. Gate: rent equiv 3,000 x 0.25 = 750;
    # single excess rate at FAGI 6,000 = 0.045, threshold =
    # 6,000 x 0.045 = 270; excess = 750 - 270 = 480 > 0 -> gate passes. Elderly
    # (age 71) -> Table A, FAGI 6,000 (5,001-7,000 band) -> 300.
    ny_real_property_tax_credit: 300

- name: Negative AGI is floored at zero (IT-214 line 9, "cannot be less than zero")
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        self_employment_income: -20_000
        social_security: 15_000
        rent: 3_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    adjusted_gross_income: -20_000
    # HGI = -20,000 + 15,000 nontaxable SS = -5,000, floored to 0: rate 3.5%
    # -> threshold 0; rent equivalent 750; excess 750; 50% = 375; elderly cap
    # at income 0 = 375.
    ny_real_property_tax_credit: 375

# --- 2025 flat Table A/B coverage (Part RR of Ch. 59 of the Laws of 2025) ---
# Elderly (any member 65+) -> Table A; homeowner real_estate_taxes clears the
# gate. Gate: real_estate_taxes > FAGI x excess_real_property_tax.calc(FAGI).

- name: 2025 - elderly Table A, FAGI 2,000 -> 375
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 2_000
        real_estate_taxes: 500
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Gate: single excess rate at FAGI 2,000 = 0.035, threshold = 70;
    # excess = 500 - 70 = 430 > 0. Table A FAGI 2,000 (0-3,000) -> 375.
    ny_real_property_tax_credit: 375

- name: 2025 - elderly Table A, FAGI 10,000 -> 230
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 71
        employment_income: 10_000
        real_estate_taxes: 3_000
    households:
      household:
        members: [head]
        state_code: NY
  output:
    # Gate: excess_real_property_tax is a single-amount rate; at FAGI
    # 10,000 its calc = 0.055, threshold = 10,000 x 0.055 = 550; excess =
    # 3,000 - 550 = 2,450 > 0. Table A FAGI 10,000 (9,001-11,000) -> 230.
    ny_real_property_tax_credit: 230

- name: 2025 - elderly Table A, FAGI 16,000 -> 150
