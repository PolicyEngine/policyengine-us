        members: [head]
        state_code: NY
  output:
    # Gate: single excess rate at FAGI 16,000 = 0.065, threshold = 16,000 x
    # 0.065 = 1,040; excess = 6,000 - 1,040 = 4,960 > 0. Table A FAGI 16,000
    # (14,001-18,000) -> 150.
    ny_real_property_tax_credit: 150

