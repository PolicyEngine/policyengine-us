# 2020 Form IT-201 instructions, line 19a worksheet (file page 16): recomputed
# federal AGI is federal AGI plus the Form IT-558 addition adjustments. IT-558
# addition A-003 (instructions, file page 2) adds back the IRC 62(a)(22)
# charitable deduction, which New York did not adopt for 2020. New York AGI
# starts from line 19a (IT-201 instructions, file page 17), and Form IT-196
# lines 2 and 26 take the medical and miscellaneous floors from it.
# https://www.tax.ny.gov/pdf/2020/inc/it201i_2020.pdf#page=16

- name: Case 1, 2020 federal non-itemizer's line 10b deduction is added back on line 19a.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    # Federal AGI (IT-201 line 19) 40,000 - 300; line 19a adds the 300 back.
    adjusted_gross_income: 39_700
    ny_recomputed_federal_agi: 40_000
    ny_additions: 0
    ny_agi: 40_000

- name: Case 2, 2020 IT-196 floors use recomputed federal AGI.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 300
        other_medical_expenses: 6_000
    tax_units:
      tax_unit:
        members: [person1]
        total_misc_deductions: 10_000
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_recomputed_federal_agi: 40_000
    # IT-196 line 3: 10% of line 19a = 4,000; 6,000 - 4,000.
    ny_medical_expense_deduction: 2_000
    # IT-196 line 26-27: 2% of line 19a = 800; 10,000 - 800.
    ny_misc_deduction: 9_200

- name: Case 3, 2021 recomputed federal AGI is federal AGI.
  period: 2021
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    adjusted_gross_income: 40_000
    ny_recomputed_federal_agi: 40_000
