# 2020 Form IT-558 instructions, addition A-003: the IRC 62(a)(22)
# charitable deduction is added back to recompute federal AGI.
# https://www.tax.ny.gov/pdf/2020/inc/it558i_2020.pdf#page=2

- name: Case 1, 2020 federal non-itemizer adds back the line 10b deduction.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    adjusted_gross_income: 39_700
    ny_additions: 300
    ny_agi: 40_000

- name: Case 2, 2021 deduction for non-itemizers is below the line, so nothing is added back.
  period: 2021
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    ny_additions: 0
