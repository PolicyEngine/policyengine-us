# Kentucky K-TAP Dependent Care Disregard
# Per 921 KAR 2:016 Section 5(3)(b)
# Max per child:
# - $200/month for child under age 2
# - $175/month for child age 2-12
# Child care counts only if the case is otherwise ineligible without it
# (Section 5(3)(b)1.c; DCBS Operations Manual Vol. III MS 2840 B.1).

- name: No childcare expenses results in zero disregard.
  period: 2024-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        childcare_expenses: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    ky_ktap_dependent_care_disregard: 0

- name: One child age 5, childcare below cap.
  period: 2024-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        # $100/month * 12 = $1,200/year
        childcare_expenses: 1_200
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Max for age 5: $175/month, actual: $100/month
    # Disregard = min($100, $175) = $100
    ky_ktap_dependent_care_disregard: 100

- name: One child age 5, childcare exceeds cap.
  period: 2024-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        # $300/month * 12 = $3,600/year
        childcare_expenses: 3_600
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Max for age 5: $175/month, actual: $300/month
    # Disregard = min($300, $175) = $175
    ky_ktap_dependent_care_disregard: 175

- name: One child under age 2, childcare exceeds cap.
  period: 2024-01
  input:
    people:
      parent:
        age: 25
      infant:
        age: 1
    spm_units:
      spm_unit:
        members: [parent, infant]
        # $400/month * 12 = $4,800/year
        childcare_expenses: 4_800
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, infant]
        state_code: KY
  output:
    # Max for under 2: $200/month, actual: $400/month
    # Disregard = min($400, $200) = $200
    ky_ktap_dependent_care_disregard: 200

- name: Two children, one infant and one age 5.
  period: 2024-01
  input:
    people:
      parent:
        age: 30
      infant:
        age: 1
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, infant, child]
        # $500/month * 12 = $6,000/year
        childcare_expenses: 6_000
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, infant, child]
        state_code: KY
  output:
    # Max for infant: $200, max for age 5: $175
    # Total max: $375/month, actual: $500/month
    # Disregard = min($500, $375) = $375
    ky_ktap_dependent_care_disregard: 375

- name: Child age 13 gets no disregard.
  period: 2024-01
  input:
    people:
      parent:
        age: 35
      teen:
        age: 13
    spm_units:
      spm_unit:
        members: [parent, teen]
        # $200/month * 12 = $2,400/year
        childcare_expenses: 2_400
    households:
      household:
        members: [parent, teen]
        state_code: KY
  output:
    # Max for age 13+: $0
    # Disregard = min($200, $0) = $0
    ky_ktap_dependent_care_disregard: 0

- name: Non-KY state returns zero.
  period: 2024-01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        childcare_expenses: 2_400
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    ky_ktap_dependent_care_disregard: 0

- name: Incapacitated adult care expenses count toward the disregard.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 35
        is_incapable_of_self_care: true
        care_expenses: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Per 921 KAR 2:016 Section 5(3)(b)1.b: incapacitated adult living in
    # the home, capped at $175/month. Expenses = 1,200 / 12 = 100/month.
    ky_ktap_dependent_care_disregard: 100

- name: Incapacitated adult care expenses above the cap are limited to the age-2+ tier.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 35
        is_incapable_of_self_care: true
        care_expenses: 3_600
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Expenses = 3,600 / 12 = 300/month. The incapacitated adult's cap is
    # the $175 age-2+ tier (not the $200 under-2 tier, and not the $0
    # older-age bracket): min(300, 175) = 175.
    ky_ktap_dependent_care_disregard: 175

- name: Adult care expenses without incapacity are not disregarded.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 35
        is_tax_unit_dependent: false
        care_expenses: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Person2 is neither a dependent nor incapacitated, so the cap is $0:
    # min(100, 0) = 0.
    ky_ktap_dependent_care_disregard: 0

- name: Child care is not disregarded when the case is eligible without it.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 1_000
      child1:
        age: 5
      child2:
        age: 2
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        # $1,530/month
        childcare_expenses: 18_360
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Without the child care disregard, countable income is
    # (1,000 - 175) x 0.5 = 412.50 < 631 standard of need (size 3), so the
    # case stays eligible and CCAP, not the disregard, pays the child care
    # (MS 2840 B.1.c). No incapacitated adult, so the disregard is $0.
    ky_ktap_ineligible_without_child_care_disregard: false
    ky_ktap_dependent_care_disregard: 0

- name: Child care is disregarded when the case is otherwise ineligible.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 400
        tanf_gross_unearned_income: 550
      child1:
        age: 5
      child2:
        age: 1
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        # $300/month
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Without child care: (400 - 175) x 0.5 + 550 = 662.50 > 631, ineligible.
    # Cap: $175 (age 5) + $200 (age 1) = $375; min(300, 375) = 300
    ky_ktap_ineligible_without_child_care_disregard: true
    ky_ktap_dependent_care_disregard: 300

- name: Incapacitated adult care counts but child care does not for an eligible case.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 1_000
      child:
        age: 5
      adult:
        age: 50
        is_incapable_of_self_care: true
        care_expenses: 1_200
    spm_units:
      spm_unit:
        members: [parent, child, adult]
        # $300/month
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child, adult]
        state_code: KY
  output:
    # Adult care: min(1,200 / 12 = 100, 175) = 100 (Section 5(3)(b)1.b)
    # Without child care: (1,000 - 175 - 100) x 0.5 = 362.50 < 631, eligible,
    # so the child's care is not disregarded.
    ky_ktap_dependent_care_disregard: 100

- name: Each incapacitated adult's care is capped separately.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      adult1:
        age: 50
        is_incapable_of_self_care: true
        # $300/month
        care_expenses: 3_600
      adult2:
        age: 55
        is_incapable_of_self_care: true
        # $50/month
        care_expenses: 600
    spm_units:
      spm_unit:
        members: [parent, adult1, adult2]
    households:
      household:
        members: [parent, adult1, adult2]
        state_code: KY
  output:
    # Section 5(3)(b)2: $175 per month per individual.
    # min(300, 175) + min(50, 175) = 175 + 50 = 225 (not min(350, 2 x 175)).
    ky_ktap_dependent_care_disregard: 225

- name: An unused child cap does not absorb incapacitated adult care.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
      adult:
        age: 50
        is_incapable_of_self_care: true
        # $300/month
        care_expenses: 3_600
    spm_units:
      spm_unit:
        members: [parent, child, adult]
        childcare_expenses: 0
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, child, adult]
        state_code: KY
  output:
    # Adult: min(300, 175) = 175. Child: min(0, 175) = 0.
    # 175 + 0 = 175 (not min(300, 175 + 175) = 300).
    ky_ktap_dependent_care_disregard: 175

- name: An unused adult cap does not absorb child care.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
      adult:
        age: 50
        is_incapable_of_self_care: true
        care_expenses: 0
    spm_units:
      spm_unit:
        members: [parent, child, adult]
        # $300/month
        childcare_expenses: 3_600
        # Set as an input so the child care caps apply
        # (921 KAR 2:016 Section 5(3)(b)1.c).
        ky_ktap_ineligible_without_child_care_disregard: true
    households:
      household:
        members: [parent, child, adult]
        state_code: KY
  output:
    # Adult: min(0, 175) = 0. Child: min(300, 175) = 175.
    # 0 + 175 = 175 (not min(300, 175 + 175) = 300).
    ky_ktap_dependent_care_disregard: 175

- name: Child care is disregarded when countable income equals the standard of need.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 375
        tanf_gross_unearned_income: 452
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        # $300/month
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Without child care: (375 - 175) x 0.5 + 452 = 552 = 552 standard of
    # need (size 2). The payment is min(0.55 x (552 - 552), 450) = 0, so
    # Section 9(5) makes the case otherwise ineligible.
    ky_ktap_ineligible_without_child_care_disregard: true
    # Child care: min(300, 175 cap for age 5) = 175
    ky_ktap_dependent_care_disregard: 175
