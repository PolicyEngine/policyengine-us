# Kentucky TANF (K-TAP) Resource Eligibility
# Per 921 KAR 2:016 Section 3
# Resource Limit: $10,000 in liquid assets

- name: Case 1, no assets is resource eligible.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    ky_ktap_resource_eligible: true

- name: Case 2, assets below limit is eligible.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 5_000
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    # $5,000 < $10,000 limit
    ky_ktap_resource_eligible: true

- name: Case 3, assets at limit is eligible.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 10_000
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    # $10,000 = $10,000 limit (at threshold, still eligible)
    ky_ktap_resource_eligible: true

- name: Case 4, assets above limit is ineligible.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 10_001
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    # $10,001 > $10,000 limit
    ky_ktap_resource_eligible: false

- name: Case 5, high assets is ineligible.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 25_000
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    # $25,000 > $10,000 limit
    ky_ktap_resource_eligible: false

- name: Case 6, non-KY state returns false.
  period: 2024-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Not in Kentucky
    ky_ktap_resource_eligible: false

# 8,688.73 + 9.74 + 1,301.53 = 10,000.00, at the limit.
# The float32 balances add to a fraction of a cent above 10,000 unless rounded to cents.
- name: Three accounts that total exactly the resource limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.53
    state_code: KY
  output:
    ky_ktap_resource_eligible: true

# 8,688.73 + 9.74 + 1,301.54 = 10,000.01, a cent over the limit.
- name: Three accounts a cent over the resource limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 8_688.73
    stock_assets: 9.74
    bond_assets: 1_301.54
    state_code: KY
  output:
    ky_ktap_resource_eligible: false
