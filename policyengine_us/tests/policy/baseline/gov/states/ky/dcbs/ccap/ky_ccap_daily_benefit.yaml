# KY CCAP daily benefit per child (Section 10(4)): the DCC-300 rate (plus any
# add-ons) capped at the daily charge to the general public, floored at 0.

- name: Case 1, provider charge above the rate is capped at the rate.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 1
        # 12 months -> INFANT_TODDLER
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # Daily charge = (24_000/12)/20 = $100/day; rate (R4 LicI IT full) = $47.
    # daily benefit = min(47, 100) = $47.
    ky_ccap_daily_benefit: [0, 47]

- name: Case 2, provider charge below the rate caps the benefit at the charge.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 1
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 8_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # Daily charge = (8_000/12)/20 = $33.33/day; rate = $47.
    # daily benefit = min(47, 33.33) = $33.33.
    ky_ccap_daily_benefit: [0, 33.33]

- name: Case 3, special-needs child adds the five dollar special-care supplement.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 1
        # 12 months -> INFANT_TODDLER
        is_disabled: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # Rate (R4 LicI IT full) = $47; +$5 special-care supplement (Section
    # 10(3), $5 from 8-1-2022 under 49 Ky.R. 300) = $52.
    # Daily charge = (24_000/12)/20 = $100/day > $52 -> daily benefit = $52.
    ky_ccap_daily_benefit: [0, 52]

- name: Case 4, zero care days yields a zero daily benefit.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 1
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 0
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # No care days -> daily charge is 0 -> min(rate, 0) = $0.
    ky_ccap_daily_benefit: [0, 0]

- name: Case 5, special-care supplement stays at five dollars under the 11-18-2024 edition.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000
        weekly_hours_worked_before_lsr: 30
      person2:
        age: 4
        has_developmental_delay: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: ADAIR_COUNTY_KY
  output:
    # Region 2, Licensed Type I, Preschool, Full Day = $36 + $5 special-care
    # supplement (Section 10(3), $5 since 8-1-2022 and unchanged by the
    # 11-18-2024 edition) = $41; daily charge 24_000/12/20 = $100 > $41 ->
    # daily benefit = $41.
    ky_ccap_daily_benefit: [0, 41]

# 922 KAR 2:160E (49 Ky.R. 300) raised the special-care supplement from $1 to
# $5 effective 8-1-2022. Cases 6 and 7 check both sides of that date with the
# same disabled 15-year-old, a $30 daily rate, and a $100 daily charge
# (24_000 / 12 / 20).
- name: Case 6, special-care supplement is one dollar in July 2022.
  period: 2022-07
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2022: 15
        is_disabled:
          2022: true
        ky_ccap_daily_rate: 30
        pre_subsidy_childcare_expenses:
          2022: 24_000
        childcare_attending_days_per_month:
          2022: 20
    households:
      household:
        members: [person1]
        state_code:
          2022: KY
  output:
    # min(30 + 1, 100) = 31.
    ky_ccap_daily_benefit: 31

- name: Case 7, special-care supplement is five dollars from August 2022.
  period: 2022-08
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age:
          2022: 15
        is_disabled:
          2022: true
        ky_ccap_daily_rate: 30
        pre_subsidy_childcare_expenses:
          2022: 24_000
        childcare_attending_days_per_month:
          2022: 20
    households:
      household:
        members: [person1]
        state_code:
          2022: KY
  output:
    # min(30 + 5, 100) = 35.
    ky_ccap_daily_benefit: 35
