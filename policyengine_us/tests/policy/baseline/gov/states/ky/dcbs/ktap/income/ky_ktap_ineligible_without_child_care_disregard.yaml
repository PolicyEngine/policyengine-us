# Kentucky K-TAP: is the case ineligible without the child care disregard?
# Per 921 KAR 2:016 Section 5(3)(b)1.c and DCBS Operations Manual Vol. III
# MS 2840 B.1, the dependent care disregard covers child care only for a case
# that is otherwise ineligible without it. Per MS 2810 B, a case is ineligible
# when countable income equals or exceeds the standard of need.
# Countable earned income here applies the $175 work expense, any
# incapacitated adult care disregard, and the 50% disregard (January).

- name: Case 1, low earnings, eligible without the child care disregard.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 1_000
      child1:
        age: 5
      child2:
        age: 2
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        childcare_expenses: 18_360
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Countable earned: (1,000 - 175) x 0.5 = 412.50
    # Standard of need (size 3): 631; 412.50 < 631, so eligible.
    ky_ktap_ineligible_without_child_care_disregard: false

- name: Case 2, countable income above the standard of need.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 400
        tanf_gross_unearned_income: 550
      child1:
        age: 5
      child2:
        age: 1
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Countable earned: (400 - 175) x 0.5 = 112.50; unearned: 550
    # Countable income: 662.50 >= 631 standard of need (size 3), ineligible.
    ky_ktap_ineligible_without_child_care_disregard: true

- name: Case 3, countable income equal to the standard of need is ineligible.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 375
        tanf_gross_unearned_income: 452
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Countable earned: (375 - 175) x 0.5 = 100; unearned: 452
    # Countable income: 552 = standard of need (size 2): 552.
    # MS 2810 B: "equal to or exceeds" the standard of need is ineligible.
    ky_ktap_ineligible_without_child_care_disregard: true

- name: Case 4, incapacitated adult care disregard applies in the test.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 600
        tanf_gross_unearned_income: 450
      child:
        age: 5
      adult:
        age: 50
        is_incapable_of_self_care: true
        care_expenses: 1_200
    spm_units:
      spm_unit:
        members: [parent, child, adult]
        childcare_expenses: 3_600
    households:
      household:
        members: [parent, child, adult]
        state_code: KY
  output:
    # Incapacitated adult care: min(1,200 / 12 = 100, 175) = 100
    # Countable earned: (600 - 175 - 100) x 0.5 = 162.50; unearned: 450
    # Countable income: 612.50 < 631 standard of need (size 3), eligible.
    # Without the adult care disregard it would be 662.50 (ineligible).
    ky_ktap_ineligible_without_child_care_disregard: false

- name: Case 5, unearned income above the standard of need.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_unearned_income: 700
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Countable unearned: 700; standard of need (size 2): 552.
    ky_ktap_ineligible_without_child_care_disregard: true
