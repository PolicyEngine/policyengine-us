# Kentucky TANF (K-TAP) Integration Tests
# Per 921 KAR 2:016 - Standards of need and amount for KTAP
# Tests the complete benefit calculation pipeline
# Note: Tests use YEAR period; MONTH variables are automatically annualized
#
# Key Formulas (monthly):
#   Countable Earned = max(sum_gross_earned - $175, 0) * 0.5 (50% disregard)
#   Countable Unearned = max(gross_unearned - min(child_support, $50), 0)
#   Countable Income = countable_earned + countable_unearned
#   Benefit = payment_maximum if countable_income == 0 (per KRS 205.200(2))
#           = min(0.55 * (need_standard - countable_income), payment_maximum) otherwise

- name: Case 1, single parent with two children, no income.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 0
        self_employment_income: 0
      person2:
        age: 8
      person3:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: KY
  output:
    # Family size 3
    # Monthly values annualized (* 12)
    ky_ktap_standard_of_need: 631 * 12
    ky_ktap_payment_maximum: 524 * 12
    # Earned: max($0 - $175, 0) * 0.5 = $0/month
    ky_ktap_countable_earned_income: 0
    ky_ktap_countable_unearned_income: 0
    ky_ktap_countable_income: 0
    # Income eligibility: $0 < $1,169 limit
    ky_ktap_income_eligible: true
    # Resource eligibility: $0 < $10,000 limit
    ky_ktap_resource_eligible: true
    ky_ktap_eligible: true
    # Per KRS 205.200(2): families with no income get payment_maximum
    # Monthly benefit: $524 (payment maximum)
    # Annual benefit: $524 * 12 = $6,288
    ky_ktap: 524 * 12

- name: Case 2, adults only household, no eligible children.
  period: 2024
  input:
    people:
      person1:
        age: 45
        employment_income: 0
      person2:
        age: 42
        employment_income: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Family size 2
    ky_ktap_standard_of_need: 552 * 12
    ky_ktap_payment_maximum: 450 * 12
    ky_ktap_countable_earned_income: 0
    ky_ktap_countable_unearned_income: 0
    ky_ktap_countable_income: 0
    # Income eligible but demographically ineligible (no children)
    ky_ktap_income_eligible: true
    ky_ktap_resource_eligible: true
    ky_ktap_eligible: false
    ky_ktap: 0

- name: Case 3, single parent with one child, with earned income.
  period: 2024
  input:
    people:
      parent:
        age: 28
        # Monthly income: $600, Annual: $7,200
        # Use employment_income_before_lsr for TANF calculations
        employment_income_before_lsr: 7_200
      child:
        age: 6
    spm_units:
      spm_unit:
        members: [parent, child]
        spm_unit_cash_assets: 500
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Family size 2
    ky_ktap_standard_of_need: 552 * 12
    ky_ktap_payment_maximum: 450 * 12
    # Monthly earned after work expense: $600 - $175 = $425
    # Months 1-6 (50% disregard): countable = $425 * 0.5 = $212.50
    # Months 7-12 (no disregard): countable = $425
    # Annual: 6*212.50 + 6*425 = 3,825
    ky_ktap_countable_earned_income: 3_825
    ky_ktap_countable_unearned_income: 0
    ky_ktap_countable_income: 3_825
    # Gross income: $600/month vs limit $1,021/month = eligible
    ky_ktap_income_eligible: true
    # Resources: $500 < $10,000 limit
    ky_ktap_resource_eligible: true
    ky_ktap_eligible: true
    # Months 1-6: deficit = $552 - $212.50 = $339.50
    #   benefit = min(0.55*$339.50, $450) = $186.725
    # Months 7-12: deficit = $552 - $425 = $127
    #   benefit = min(0.55*$127, $450) = $69.85
    # Annual: 6*186.725 + 6*69.85 = 1,539.45
    ky_ktap: 1_539.45

- name: Case 4, family with child support income.
  period: 2024
  input:
    people:
      parent:
        age: 35
        employment_income: 0
        # Monthly child support: $200, Annual: $2,400
        child_support_received: 2_400
      child1:
        age: 10
      child2:
        age: 7
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Family size 3
    ky_ktap_standard_of_need: 631 * 12
    ky_ktap_payment_maximum: 524 * 12
    ky_ktap_countable_earned_income: 0
    # Monthly child support $200, pass-through exclusion $50
    # Countable: $200 - $50 = $150/month
    # Annual: $150 * 12 = $1,800
    ky_ktap_countable_unearned_income: 150 * 12
    ky_ktap_countable_income: 150 * 12
    # Gross income: $200/month < $1,169 limit
    ky_ktap_income_eligible: true
    ky_ktap_resource_eligible: true
    ky_ktap_eligible: true
    # Deficit: $631 - $150 = $481
    # Benefit: min(0.55 * $481, $524) = min($264.55, $524) = $264.55/month
    # Annual: $264.55 * 12 = $3,174.60
    ky_ktap: 264.55 * 12

- name: Case 5, child care does not raise the benefit of a case eligible without it.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 1_000
      child1:
        age: 5
      child2:
        age: 2
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        # $1,530/month
        childcare_expenses: 18_360
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Monthly period. Without the child care disregard, countable income is
    # (1,000 - 175) x 0.5 = 412.50 < 631 standard of need (size 3), so the
    # case is eligible without it and the child care is not disregarded
    # (921 KAR 2:016 Section 5(3)(b)1.c; MS 2840 B.1).
    ky_ktap_dependent_care_disregard: 0
    ky_ktap_countable_income: 412.5
    # Benefit: min(0.55 x (631 - 412.50), 524) = 120.175
    ky_ktap: 120.175

- name: Case 6, child care disregard for a case otherwise ineligible.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 400
        tanf_gross_unearned_income: 550
      child1:
        age: 5
      child2:
        age: 1
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        # $300/month
        childcare_expenses: 3_600
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child1, child2]
        state_code: KY
  output:
    # Monthly period. Without child care: (400 - 175) x 0.5 + 550 = 662.50
    # > 631 standard of need (size 3), ineligible; so the child care
    # disregard applies: min(300, 175 + 200) = 300.
    ky_ktap_dependent_care_disregard: 300
    # Earned: max(400 - 175 - 300, 0) = 0; countable: 0 + 550 = 550
    ky_ktap_countable_income: 550
    # Gross income 950 <= 631 x 1.85 = 1,167.35
    ky_ktap_eligible: true
    # Benefit: min(0.55 x (631 - 550), 524) = 44.55
    ky_ktap: 44.55

- name: Case 7, countable income equal to the standard of need pays no benefit.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        tanf_gross_earned_income: 375
        tanf_gross_unearned_income: 452
      child:
        age: 5
    spm_units:
      spm_unit:
        members: [parent, child]
        # $300/month
        childcare_expenses: 3_600
        spm_unit_cash_assets: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # Without child care: (375 - 175) x 0.5 + 452 = 552 = 552 standard of
    # need (size 2). 921 KAR 2:016 Section 4(2)(b) makes a case ineligible
    # only when income exceeds the standard, so the case is not otherwise
    # ineligible and the child care disregard does not apply.
    ky_ktap_ineligible_without_child_care_disregard: false
    ky_ktap_dependent_care_disregard: 0
    ky_ktap_countable_income: 552
    # Benefit: 0.55 x max(552 - 552, 0) = 0
    ky_ktap: 0
