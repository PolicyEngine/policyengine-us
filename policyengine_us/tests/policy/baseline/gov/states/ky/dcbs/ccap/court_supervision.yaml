# Cases 5-8 share one household: a parent working 40 hours a week and a
# court-supervised 15-year-old in full-day care at a Licensed Type I provider
# in Jefferson County (Region 4) for 20 days a month.
# Age 15 = 180 months -> SCHOOL_AGE; 8 hours a day -> FULL_DAY.
# DCC-300 Region 4, Licensed Type I, School Age, Full Day = $37 per day.
# Section 10(3)(b) adds the $5 special-care supplement for a court-supervised
# child age 13 through 18 -> $42 per day before the charge cap.
- name: Case 5, KY court-supervised 15-year-old receives the supplement through the full benefit chain.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 36_000
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 15
        is_under_court_supervision: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # Age 15 < 19 court-supervision age limit.
    ky_ccap_eligible_child: [false, true]
    # 36_000 / 12 = 3_000 per month <= 4_217 size-2 limit (85% SMI).
    ky_ccap_countable_income: 3_000
    ky_ccap_income_eligible: true
    # Single parent works 40 >= 20 hours per week.
    ky_ccap_activity_eligible: true
    ky_ccap_eligible: true
    ky_ccap_rate_region: REGION_4
    ky_ccap_daily_rate: [0, 37]
    # Daily charge = 24_000 / 12 / 20 = $100 > $42 -> min(37 + 5, 100) = 42.
    ky_ccap_daily_benefit: [0, 42]
    # 11-18-2024 chart: 3_000 falls in the [2_800, 3_100) band -> $8 per day
    # for a household of two, no size reduction, no escalation. Court
    # supervision is not a Protection and Permanency case, so the copay is
    # not waived: 8 x 20 days = 160.
    ky_ccap_copay: 160
    # 42 x 20 = 840 reimbursement; max(840 - 160, 0) = 680.
    ky_ccap: 680

- name: Case 6, KY court supervision does not waive the income test in the full chain.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 60_000
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 15
        is_under_court_supervision: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    # The child still qualifies and still carries the $42 daily maximum.
    ky_ccap_eligible_child: [false, true]
    ky_ccap_daily_benefit: [0, 42]
    # 60_000 / 12 = 5_000 per month > 4_217 size-2 limit.
    ky_ccap_countable_income: 5_000
    ky_ccap_income_eligible: false
    ky_ccap_eligible: false
    ky_ccap: 0

- name: Case 7, KY court-supervised child with a disability gets one special-care supplement.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 36_000
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 15
        is_under_court_supervision: true
        is_disabled: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 24_000
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    ky_ccap_eligible_child: [false, true]
    ky_ccap_daily_rate: [0, 37]
    # Special need and court supervision both qualify for Section 10(3), but
    # the supplement is paid once: min(37 + 5, 100) = 42, not 47.
    ky_ccap_daily_benefit: [0, 42]
    # Same $8 x 20 copay as Case 5.
    ky_ccap_copay: 160
    # 42 x 20 = 840; max(840 - 160, 0) = 680.
    ky_ccap: 680

- name: Case 8, KY provider charge between the rate and the supplemented rate caps the benefit.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 36_000
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 15
        is_under_court_supervision: true
        immigration_status: CITIZEN
        ky_ccap_provider_type: LICENSED_TYPE_I
        childcare_attending_days_per_month: 20
        childcare_hours_per_day: 8
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 9_600
    households:
      household:
        members: [person1, person2]
        state_code: KY
        county_str: JEFFERSON_COUNTY_KY
  output:
    ky_ccap_daily_rate: [0, 37]
    # Daily charge = 9_600 / 12 / 20 = $40, between the $37 rate and the
    # $42 supplemented rate. Section 10(4) caps payment at the charge:
    # min(37 + 5, 40) = 40.
    ky_ccap_daily_benefit: [0, 40]
    # Same $8 x 20 copay as Case 5.
    ky_ccap_copay: 160
    # 40 x 20 = 800; max(800 - 160, 0) = 640.
    ky_ccap: 640
