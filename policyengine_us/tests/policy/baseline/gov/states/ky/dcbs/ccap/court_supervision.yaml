# Court supervision extends this state's age test without setting disability
# or protective-services status. Cases include both age boundaries and adults.
- name: Case 1, KY court supervision age boundaries and default status.
  period: 2025-01
  input:
    state_code: [KY, KY, KY, KY, KY, KY, KY, KY]
    age: [12, 13, 13, 17, 18, 19, 18, 40]
    is_under_court_supervision: [false, false, true, true, true, true, false, true]
  output:
    ky_ccap_eligible_child: [true, false, true, true, true, false, false, false]
    # No one reports work hours, so the activity test fails for every unit.
    # Court supervision does not open the Protection and Permanency bypass of
    # Section 5, which would make the court-supervised units pass. Case 3 shows
    # the disability side: its court-supervised 12-year-old gets no supplement.
    ky_ccap_activity_eligible: [false, false, false, false, false, false, false, false]

- name: Case 2, KY court supervision does not bypass child immigration eligibility.
  period: 2025-01
  input:
    state_code: KY
    age: 17
    is_under_court_supervision: true
    immigration_status: UNDOCUMENTED
  output:
    ky_ccap_eligible_child: false

