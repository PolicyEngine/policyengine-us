# Sources: Kentucky FY2026 state plan Sections 3.1-3.6, the FY2026 heat-cool
# benefit workbook (cooling column equals the electricity heating column), and
# the FFY 2026 Summer Cooling Subsidy fact sheet (150% of the 2026 guidelines).
# Cooling uses the 2026 guidelines for both the limit and the income bands:
# one person 15,960 a year (1,330 a month), each added person 5,680.
# Points: size (capped at 5) + income points + 6 electric points; amount =
# ceil(points * 16.66); subsidized housing = ceil(amount * 0.3).
# Wages are hourly pay times hours; the 7.25 rate is the federal minimum wage
# that Kentucky applies. Electric bills of 1,560 are 130 a month.

- name: Case 1, a gas-heated home receives the electric cooling amount.
  period: 2026
  input:
    people:
      person1:
        age: 40
        # 7.25 an hour, 20 hours a week: 7.25 * 1_040 = 7_540.
        employment_income_before_lsr: 7_540
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 720
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: KY
        is_in_public_housing: false
  output:
    # 7_540 / 12 = 628.33 a month.
    ky_liheap_cooling_eligible: true
    # Cooling: 628.33 <= ceil(1_330 * 0.75 = 997.5) = 998, the 0-75% band
    # (4 points). 1 + 4 + 6 = 11 points; ceil(11 * 16.66 = 183.26) = 184.
    ky_liheap_cooling: 184
    # Heating keeps the natural gas points and the 2025 guidelines:
    # 628.33 <= ceil(15_650 / 12 * 0.75 = 978.13) = 979, so 0-75%.
    # 1 + 4 + 3 = 8 points; ceil(8 * 16.66 = 133.28) = 134.
    ky_liheap: 134

- name: Case 2, a public housing tenant receives the subsidized electric amount.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 7_540
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: KY
        is_in_public_housing: true
  output:
    # 0-75% band, subsidized income points 1: 1 + 1 + 6 = 8 points;
    # ceil(8 * 16.66 = 133.28) = 134; ceil(134 * 0.3 = 40.2) = 41, the plan's
    # $41 minimum.
    ky_liheap_cooling: 41

- name: Case 3, a family of five in the lowest band receives the 250 maximum.
  period: 2026
  input:
    people:
      person1:
        age: 38
        # 11.00 an hour, 40 hours a week: 11 * 2_080 = 22_880.
        employment_income_before_lsr: 22_880
      person2:
        age: 36
      person3:
        age: 12
      person4:
        age: 9
      person5:
        age: 6
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
        # The household does not receive K-TAP.
        tanf: 0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: KY
        is_in_public_housing: false
  output:
    # Guideline for five: 15_960 + 4 * 5_680 = 38_680, or 3_223.33 a month.
    # Limit: 38_680 * 1.5 / 12 = 4_835, the fact sheet's amount for five.
    ky_liheap_cooling_eligible: true
    # 22_880 / 12 = 1_906.67 <= ceil(3_223.33 * 0.75 = 2_417.5) = 2_418, so
    # 0-75%. 5 + 4 + 6 = 15 points; ceil(15 * 16.66 = 249.9) = 250, the plan's
    # $250 maximum.
    ky_liheap_cooling: 250

- name: Case 4, the lowest band ends at 75 percent of the 2026 guideline.
  period: 2026
  input:
    people:
      person1:
        age: 40
        # 998.00 a month.
        employment_income_before_lsr: 11_976
      person2:
        age: 40
        # 998.01 a month.
        employment_income_before_lsr: 11_976.12
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
      spm_unit2:
        members: [person2]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
    households:
      household1:
        members: [person1]
        state_code: KY
        is_in_public_housing: false
      household2:
        members: [person2]
        state_code: KY
        is_in_public_housing: false
  output:
    # The 0-75% band ends at ceil(1_330 * 0.75 = 997.5) = 998.
    # Household 1: 998.00 is in it: 1 + 4 + 6 = 11 points = 184.
    # Household 2: 998.01 is in 75.01-100% (3 points): 1 + 3 + 6 = 10 points;
    # ceil(10 * 16.66 = 166.6) = 167.
    # With the 2025 guideline (band end 979) both households would get 167.
    ky_liheap_cooling: [184, 167]

- name: Case 5, income above the 2025 heating limit but within the 2026 cooling limit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        # 11.40 an hour, 40 hours a week: 11.40 * 2_080 = 23_712.
        employment_income_before_lsr: 23_712
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
    households:
      household:
        members: [person1]
        state_code: KY
        is_in_public_housing: false
  output:
    # 23_712 / 12 = 1_976 a month.
    # Heating limit: ceil(15_650 * 1.5 / 12 = 1_956.25) = 1_957, so 1_976 is over.
    ky_liheap_income_eligible: false
    ky_liheap: 0
    # Cooling limit: 15_960 * 1.5 / 12 = 1_995, so 1_976 qualifies.
    ky_liheap_cooling_eligible: true
    # 1_976 > ceil(1_330 * 1.25 = 1_662.5) = 1_663, the 125.01-150% band
    # (1 point). 1 + 1 + 6 = 8 points; ceil(8 * 16.66 = 133.28) = 134.
    ky_liheap_cooling: 134

- name: Case 6, a home without heating receives cooling and an unspecified fuel receives nothing.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income_before_lsr: 7_540
      person2:
        age: 40
        employment_income_before_lsr: 7_540
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NONE
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
      spm_unit2:
        members: [person2]
        heating_type: UNSPECIFIED
        pre_subsidy_electricity_expense: 1_560
        has_cooling_expense: true
        receives_housing_assistance: false
    households:
      household1:
        members: [person1]
        state_code: KY
        is_in_public_housing: false
      household2:
        members: [person2]
        state_code: KY
        is_in_public_housing: false
  output:
    # Household 1: the cooling subsidy uses the electric points whatever the
    # home heats with: 1 + 4 + 6 = 11 points = 184.
    # Household 2: heating_type is a required input, so an unspecified fuel
    # is not eligible.
    ky_liheap_cooling_eligible: [true, false]
    ky_liheap_cooling: [184, 0]
    # Neither home has a heating benefit.
    ky_liheap: [0, 0]
