- name: Single person
  period: 2023
  input:
    is_tax_unit_spouse: false
    is_separated: false
    state_code: KY
  output:
    ky_filing_status: SINGLE

- name: Joint
  period: 2023
  input:
    is_tax_unit_spouse: true
    is_separated: false
    state_code: KY
  output:
    ky_filing_status: JOINT

- name: Separated filer with no spouse in the tax unit
  period: 2023
  input:
    is_tax_unit_spouse: false
    is_separated: true
    state_code: KY
  output:
    ky_filing_status: SEPARATE

- name: A separated dependent does not make a single parent file separately.
  period: 2025
  input:
    people:
      parent:
        age: 45
      dependent:
        age: 18
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [parent, dependent]
        american_opportunity_credit: 2_000
        lifetime_learning_credit: 0
    households:
      household:
        members: [parent, dependent]
        state_code: KY
  output:
    # KRS 141.066(1)(d) uses the IRC 7703 marital status of the filer. The
    # parent is unmarried, so Form 740 Filing Status 1 (Single) applies.
    ky_filing_status: SINGLE
    # KRS 141.069(4) limits the tuition credit only for a married taxpayer.
    ky_tuition_tax_credit_eligible: true
    # 25% of the 2,000 federal education credit.
    ky_tuition_tax_credit_potential: 500

- name: A separated parent who files federal head of household uses Kentucky Filing Status 1.
  period: 2025
  input:
    people:
      parent:
        age: 38
        is_tax_unit_head: true
        is_separated: true
      child:
        age: 6
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # IRC 7703(b) treats the parent as unmarried, so the parent files as head of household.
    filing_status: HEAD_OF_HOUSEHOLD
    # Form 740 instructions: Filing Status 1 (Single) covers federal head of household filers.
    ky_filing_status: SINGLE
    ky_tuition_tax_credit_eligible: true

- name: A separated filer with only a qualifying relative files separately.
  period: 2025
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
        is_separated: true
      grandparent:
        age: 78
        is_tax_unit_dependent: true
        is_related_to_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [head, grandparent]
    households:
      household:
        members: [head, grandparent]
        state_code: KY
  output:
    # IRC 7703(b) needs a child, so the head stays married and files separately.
    filing_status: SEPARATE
    ky_filing_status: SEPARATE
    ky_tuition_tax_credit_eligible: false

- name: A separated dependent does not stop a married couple filing jointly.
  period: 2025
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      spouse:
        age: 38
        is_tax_unit_spouse: true
      dependent:
        age: 18
        is_tax_unit_dependent: true
        is_separated: true
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
    households:
      household:
        members: [head, spouse, dependent]
        state_code: KY
  output:
    # Roles are inputs, so this case tests Kentucky filing status alone.
    ky_filing_status: JOINT
    ky_tuition_tax_credit_eligible: true

- name: Spouses who file separate federal returns may file a combined Kentucky return.
  period: 2025
  input:
    people:
      head:
        age: 40
        is_tax_unit_head: true
      spouse:
        age: 38
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: SEPARATE
    households:
      household:
        members: [head, spouse]
        state_code: KY
  output:
    # Form 740 instructions: spouses may file separately on a combined return
    # whether they filed jointly or separately for federal purposes. Both
    # spouses in one tax unit is that combined return, not Filing Status 4.
    ky_filing_status: JOINT
    # KRS 141.069(4) allows the credit on a combined return.
    ky_tuition_tax_credit_eligible: true

- name: A married filer who files a separate federal return alone files Kentucky separate returns.
  period: 2025
  input:
    people:
      head:
        age: 40
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
    households:
      household:
        members: [head]
        state_code: KY
  output:
    # The spouse is not in the tax unit, so this is Filing Status 4.
    ky_filing_status: SEPARATE
    # KRS 141.069(4) bars the credit on separate returns.
    ky_tuition_tax_credit_eligible: false

- name: A supplied federal head of household status uses Kentucky Filing Status 1.
  period: 2025
  input:
    people:
      head:
        age: 40
        is_separated: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head]
        state_code: KY
  output:
    ky_filing_status: SINGLE
    ky_tuition_tax_credit_eligible: true

- name: A supplied federal surviving spouse status uses Kentucky Filing Status 1.
  period: 2025
  input:
    people:
      head:
        age: 40
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SURVIVING_SPOUSE
    households:
      household:
        members: [head]
        state_code: KY
  output:
    # Form 740 instructions: federal "Qualifying Widow(er)" filers use Single.
    ky_filing_status: SINGLE
    ky_tuition_tax_credit_eligible: true

- name: A supplied federal joint status with no spouse in the tax unit uses Kentucky joint filing.
  period: 2025
  input:
    people:
      head:
        age: 40
    tax_units:
      tax_unit:
        members: [head]
        filing_status: JOINT
    households:
      household:
        members: [head]
        state_code: KY
  output:
    # A joint federal return is one return for the couple, as ky_files_separately also treats it.
    ky_filing_status: JOINT
    ky_tuition_tax_credit_eligible: true
