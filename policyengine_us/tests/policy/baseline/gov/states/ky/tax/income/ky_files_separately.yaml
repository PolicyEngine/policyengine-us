- name: Joint path cheaper after credits, so does not elect combined-separate
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        ky_income_tax_before_refundable_credits_if_separate: 200
        ky_income_tax_before_refundable_credits_if_joint: 100
    households:
      household:
        members: [head, spouse]
        state_code: KY
  output:
    ky_files_separately: false

- name: Combined-separate cheaper after credits, so elects it
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        ky_income_tax_before_refundable_credits_if_separate: 100
        ky_income_tax_before_refundable_credits_if_joint: 200
    households:
      household:
        members: [head, spouse]
        state_code: KY
  output:
    ky_files_separately: true

- name: Single filer never elects combined-separate
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        ky_income_tax_before_refundable_credits_if_separate: 100
        ky_income_tax_before_refundable_credits_if_joint: 200
    households:
      household:
        members: [head]
        state_code: KY
  output:
    ky_files_separately: false

# A5: head-of-household filer never elects combined-separate. Even though
# if_separate < if_joint (which would elect if ungated), the married-only gate
# blocks non-married statuses, so the result is false.
- name: Head-of-household filer never elects combined-separate
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
        ky_income_tax_before_refundable_credits_if_separate: 100
        ky_income_tax_before_refundable_credits_if_joint: 200
    households:
      household:
        members: [head]
        state_code: KY
  output:
    ky_files_separately: false

# A5: surviving-spouse filer never elects combined-separate. Same married-only
# gate blocks it despite if_separate < if_joint.
- name: Surviving-spouse filer never elects combined-separate
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SURVIVING_SPOUSE
        ky_income_tax_before_refundable_credits_if_separate: 100
        ky_income_tax_before_refundable_credits_if_joint: 200
    households:
      household:
        members: [head]
        state_code: KY
  output:
    ky_files_separately: false

# A6: post-credit tie for a married (joint) couple. Strict "<" means an equal
# separate and joint liability does NOT elect combined-separate.
- name: Post-credit tie does not elect combined-separate
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
      spouse:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        ky_income_tax_before_refundable_credits_if_separate: 100
        ky_income_tax_before_refundable_credits_if_joint: 100
    households:
      household:
        members: [head, spouse]
        state_code: KY
  output:
    ky_files_separately: false
