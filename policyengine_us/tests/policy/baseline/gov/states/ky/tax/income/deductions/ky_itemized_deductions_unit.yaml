- name: From 2026 Kentucky disallows second-residence interest on a joint return
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 50
        home_mortgage_interest: 9_000
      spouse:
        age: 50
        second_residence_mortgage_interest: 3_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        adjusted_gross_income: 90_000
    households:
      household:
        members: [head, spouse]
        state_code: KY
  output:
    itemized_deductions_less_salt: 12_000
    ky_disallowed_second_residence_interest: 3_000
    ky_itemized_deductions_unit: 9_000
