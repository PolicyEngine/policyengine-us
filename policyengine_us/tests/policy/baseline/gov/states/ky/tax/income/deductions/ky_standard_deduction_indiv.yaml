- name: 2023 deduction
  period: 2023
  input:
    state_code: KY
  output:
    ky_standard_deduction_indiv: 2_980

- name: 2022 deduction
  period: 2022
  input:
    state_code: KY
  output:
    ky_standard_deduction_indiv: 2_770

- name: 2021 deduction
  period: 2021
  input:
    state_code: KY
  output:
    ky_standard_deduction_indiv: 2_690

- name: 2023, head & spouse
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head: true
      person2:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    ky_standard_deduction_indiv: [2_980, 2_980]

- name: 2022, head & spouse
  period: 2022
  input:
    people:
      person1:
        is_tax_unit_head: true
      person2:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    ky_standard_deduction_indiv: [2_770, 2_770]

- name: 2026 head & spouse each get the published $3,360 standard deduction
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
      person2:
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Kentucky DOR, "Kentucky DOR Announces 2026 Standard Deduction"
    # (September 4, 2025): "the standard deduction for 2026 is $3,360".
    ky_standard_deduction_indiv: [3_360, 3_360]
