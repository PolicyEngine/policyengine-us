# KRS 141.067 sets the credit at 20% of the federal credit allowed under IRC
# section 21, and KRS 141.010(21) fixes Kentucky's Code at a reference date.
# For 2025 that date is December 31, 2024, before the One Big Beautiful Bill
# Act; from 2026 it is December 31, 2025 (2026 Ky. Acts ch. 161, sec. 6), so
# Kentucky adopts the Act's section 21 rate schedule: 50% less one point per
# $2,000 of AGI over $15,000, floored at 35%, then one point per $2,000 ($4,000
# joint) of AGI over $75,000 ($150,000 joint), floored at 20%. The pre-OBBBA
# schedule is 35% less one point per $2,000 over $15,000, floored at 20%.

- name: 2025 single parent, $50,000 earnings, $1,000 care for a child of five
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 50_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
        tax_unit_childcare_expenses: 1_000
        premium_tax_credit: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # 2025 is before the Act's section 21 change: 35% - 18 points = 17%,
    # floored at 20%, so $200 federally, under the federal liability.
    cdcc: 200
    pre_obbba_cdcc: 200
    ky_cdcc_potential: 40
    ky_cdcc: 40
    # ($50,000 - $3,270 standard deduction) x 4% = $1,869.20, less $40.
    ky_income_tax: 1_829.2

- name: 2026 single parent, $50,000 earnings, $1,000 care for a child of five
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 50_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
        tax_unit_childcare_expenses: 1_000
        premium_tax_credit: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    # The Act's schedule: 50% - 18 points = 32%, floored at 35%; AGI is under
    # the $75,000 second phase-down. 35% x $1,000 = $350, under the federal
    # liability. The pre-OBBBA schedule would give 20%, or $200.
    cdcc: 350
    pre_obbba_cdcc: 200
    # 20% of $350.
    ky_cdcc_potential: 70
    ky_cdcc: 70
    # ($50,000 - $3,360 standard deduction) x 3.5% = $1,632.40, less $70.
    ky_income_tax: 1_562.4

# The federal credit is capped at federal liability (IRC 26), and Kentucky
# matches the capped "credit allowed".
- name: 2026 joint filers with $50,000 earnings and $6,000 care get 20% of the capped federal credit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 25_000
      spouse:
        age: 35
        employment_income: 25_000
      child1:
        age: 5
      child2:
        age: 7
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 6_000
        premium_tax_credit: 0
        ky_income_tax_before_non_refundable_credits_unit: 1_000_000
        ky_personal_tax_credits: 0
        ky_family_size_tax_credit: 0
        ky_tuition_tax_credit: 0
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: KY
  output:
    # 35% x $6,000 = $2,100, capped at the $1,780 federal liability.
    cdcc_potential: 2_100
    cdcc: 1_780
    # 20% of $1,780.
    ky_cdcc_potential: 356
    ky_cdcc: 356

- name: 2026 joint filers in the Act's second phase-down
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 80_000
      spouse:
        age: 40
        employment_income: 80_000
      child1:
        age: 3
      child2:
        age: 6
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 6_000
        premium_tax_credit: 0
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: KY
  output:
    # 35% less one point per $4,000 (or part) over $150,000: $10,000 is three
    # increments, so 32%. 32% x $6,000 = $1,920. Pre-OBBBA: 20%, or $1,200.
    cdcc: 1_920
    pre_obbba_cdcc: 1_200
    # 20% of $1,920.
    ky_cdcc_potential: 384
    ky_cdcc: 384

- name: 2026 joint filers at the bottom of the Act's second phase-down
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 110_000
      spouse:
        age: 40
        employment_income: 110_000
      child1:
        age: 3
      child2:
        age: 6
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2]
        filing_status: JOINT
        tax_unit_childcare_expenses: 6_000
        premium_tax_credit: 0
    households:
      household:
        members: [head, spouse, child1, child2]
        state_code: KY
  output:
    # $70,000 over $150,000 is 18 increments: 35% - 18 = 17%, floored at 20%,
    # the same rate as the pre-OBBBA schedule. 20% x $6,000 = $1,200.
    cdcc: 1_200
    pre_obbba_cdcc: 1_200
    ky_cdcc_potential: 240
    ky_cdcc: 240

# The conformity parameter is the lever: with it off, Kentucky reads the
# pre-OBBBA credit once the Act changes section 21.
- name: 2026 single parent under a reform that keeps Kentucky's Code before the Act
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.states.ky.tax.income.irc_conformity.obbba: false
    people:
      parent:
        age: 30
        employment_income: 50_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
        tax_unit_childcare_expenses: 1_000
        premium_tax_credit: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    cdcc: 350
    # 20% of the $200 pre-OBBBA credit.
    ky_cdcc_potential: 40

# Before 2026 the Act does not change section 21, so the lever has no effect.
- name: 2025 single parent under a reform that sets Kentucky's Code to include the Act
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.states.ky.tax.income.irc_conformity.obbba: true
    people:
      parent:
        age: 30
        employment_income: 50_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
        tax_unit_childcare_expenses: 1_000
        premium_tax_credit: 0
    households:
      household:
        members: [parent, child]
        state_code: KY
  output:
    cdcc: 200
    ky_cdcc_potential: 40

# Kentucky's December 31, 2018 IRC reference excludes ARPA's 2021 expansion.
# 2021 Ky. Acts ch. 31, section 1 (KRS 141.010(21)(b)), PDF page 3:
# https://apps.legislature.ky.gov/law/acts/21RS/documents/0031.pdf#page=3
# Form 2441-K pages 1-3 confirms the conformed cap, rate, benefits, and
# federal liability limit before Kentucky's 20% match:
# https://revenue.ky.gov/Forms/2441-K-2021.pdf#page=1

- name: 2021 Kentucky retains the pre-ARPA expense cap and rate
  period: 2021
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    cdcc_filing_status_eligible: true
    capped_count_cdcc_eligible: 2
    cdcc_qualifying_childcare_expenses: 10_000
    care_expenses: 0
    min_head_spouse_earned: 50_000
    dependent_care_employer_benefits: 0
    cdcc_credit_limit: 5_000
  output:
    # 20% match x 20% rate x $6,000 conformed expense cap.
    ky_cdcc_potential: 240
    # The federal ARPA calculation continues to use 50% of $10,000.
    cdcc: 5_000

