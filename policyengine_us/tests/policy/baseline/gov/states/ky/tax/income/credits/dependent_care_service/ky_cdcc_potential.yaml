

- name: 2024 single filer who can be claimed as a dependent gets no Kentucky child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, child]
        state_code: KY
  output:
    # IRC 21(b)(1)(A) needs a dependent; IRC 152(b)(1) leaves none.
    ky_cdcc_potential: 0

- name: 2024 single filer who cannot be claimed gets the Kentucky child care credit
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 10000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, child]
        state_code: KY
  output:
    # KRS 141.067: 20% x $350 federal credit = $70.
    ky_cdcc_potential: 70

- name: 2024 joint return with one claimable spouse gets no Kentucky child care credit (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 30
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        pre_subsidy_childcare_expenses: 1000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        cdcc_credit_limit: 1000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: KY
  output:
    # Either spouse being claimable leaves the return no dependents.
    ky_cdcc_potential: 0

