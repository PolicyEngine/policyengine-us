# 2020 Form 740 instructions, Schedule M line 5: contributions claimed on
# federal Form 1040 line 10b are added back.
# https://revenue.ky.gov/Forms/740%20Instructions%20Packet%205.7.21.pdf#page=27

- name: Case 1, 2020 single federal non-itemizer adds back the line 10b deduction.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    adjusted_gross_income_person: 39_700
    ky_additions: 300
    ky_agi: 40_000

- name: Case 2, 2020 joint federal non-itemizers add back half of the deduction each.
  period: 2020
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        charitable_cash_donations: 1_000
      person2:
        age: 40
        employment_income: 30_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KY
  output:
    # Federal person AGI deducts half of the $300 from each spouse.
    adjusted_gross_income_person: [49_850, 29_850]
    ky_additions: [150, 150]
    ky_agi: [50_000, 30_000]

- name: Case 3, 2021 deduction for non-itemizers is below the line, so nothing is added back.
  period: 2021
  input:
    people:
      person1:
        age: 40
        employment_income: 40_000
        charitable_cash_donations: 500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KY
  output:
    ky_additions: 0
