- name: Kentucky allows second-residence interest before 2026
  period: 2025
  absolute_error_margin: 0
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    home_mortgage_interest: 10_000
    second_residence_mortgage_interest: 4_000
  output:
    ky_disallowed_second_residence_interest: 0

- name: Kentucky disallows second-residence interest from 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    home_mortgage_interest: 10_000
    second_residence_mortgage_interest: 4_000
  output:
    # Pool 14,000 fully deductible; principal residence 10,000.
    ky_disallowed_second_residence_interest: 4_000

- name: The Kentucky disallowance applies only to Kentucky
  period: 2026
  absolute_error_margin: 0
  input:
    state_code: OH
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    home_mortgage_interest: 10_000
    second_residence_mortgage_interest: 4_000
  output:
    ky_disallowed_second_residence_interest: 0

- name: Kentucky keeps the federal deduction when principal-residence debt alone exceeds the limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    first_home_mortgage_balance: 1_000_000
    first_home_mortgage_origination_year: 2020
    second_home_mortgage_balance: 500_000
    second_home_mortgage_origination_year: 2020
    home_mortgage_interest: 50_000
    second_residence_mortgage_interest: 25_000
  output:
    # Both loans at 5%. Federal: 75,000 * 750,000 / 1,500,000 = 37,500,
    # below the principal residence's 50,000, so nothing is disallowed.
    # A recomputation on the principal residence alone gives the same:
    # 50,000 * 750,000 / 1,000,000 = 37,500.
    ky_disallowed_second_residence_interest: 0

- name: Kentucky distinguishes principal-residence interest from second-residence interest
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    home_mortgage_interest: 8_000
    second_residence_mortgage_interest: 4_000
  output:
    # The fully deductible pool includes both residences: 8,000 + 4,000.
    home_mortgage_interest_tax_unit: 12_000
    ky_disallowed_second_residence_interest: 4_000

- name: Kentucky disallows second-residence premiums after the federal phase-out
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 100_500
    mortgage_insurance_premiums: 900
    second_residence_mortgage_insurance_premiums: 300
  output:
    # One $1,000 increment or fraction above $100,000: 10% reduction.
    # (900 + 300) * 0.9 = 1,080, of which the second residence's 300 * 0.9.
    deductible_mortgage_insurance_premiums: 1_080
    ky_disallowed_second_residence_interest: 270
    # d1070: principal-residence premiums remain deductible after phase-out.
    ky_itemized_deductions_unit: 810

- name: Kentucky disallows second-residence points beside principal-residence interest
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    home_mortgage_interest: 8_000
    second_residence_mortgage_points: 400
  output:
    # The second residence's 400 of points join the fully deductible pool
    # but exceed the principal residence's 8,000 of interest.
    home_mortgage_interest_tax_unit: 8_000
    deductible_mortgage_interest_tax_unit: 8_400
    ky_disallowed_second_residence_interest: 400

- name: Kentucky counts principal-residence interest toward the principal-residence cap
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    first_home_mortgage_balance: 1_000_000
    first_home_mortgage_origination_year: 2020
    second_home_mortgage_balance: 500_000
    second_home_mortgage_origination_year: 2020
    home_mortgage_interest: 8_000
    second_residence_mortgage_interest: 4_000
  output:
    # Federal: (8,000 + 4,000) * 750,000 / 1,500,000 = 6,000, below the
    # principal residence's 8,000, so nothing is disallowed.
    home_mortgage_interest_tax_unit: 12_000
    deductible_mortgage_interest_tax_unit: 6_000
    ky_disallowed_second_residence_interest: 0

- name: Kentucky retains uncapped grandfathered principal-residence interest and points
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    first_home_mortgage_balance: 1_200_000
    first_home_mortgage_origination_year: 1986
    home_mortgage_interest: 60_000
    home_mortgage_points: 4_000
  output:
    # Pre-October 1987 debt has no dollar limit. All 64,000 belongs to the
    # principal residence, so Kentucky's residence ceiling removes nothing.
    deductible_mortgage_interest_tax_unit: 64_000
    ky_disallowed_second_residence_interest: 0
    ky_itemized_deductions_unit: 64_000

- name: Kentucky applies the principal-residence ceiling after the mixed-vintage federal limit
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: KY
    filing_status: SINGLE
    adjusted_gross_income: 50_000
    first_home_mortgage_balance: 800_000
    first_home_mortgage_origination_year: 2016
    second_home_mortgage_balance: 900_000
    second_home_mortgage_origination_year: 2020
    home_mortgage_interest: 40_000
    second_residence_mortgage_interest: 45_000
  output:
    # The 800,000 pre-2018 debt exhausts the 750,000 limit for newer debt.
    # Federal: 85,000 * 800,000 / 1,700,000 = 40,000, equal to the
    # principal residence's interest, so the Kentucky ceiling removes zero.
    deductible_mortgage_interest_tax_unit: 40_000
    ky_disallowed_second_residence_interest: 0
    ky_itemized_deductions_unit: 40_000
