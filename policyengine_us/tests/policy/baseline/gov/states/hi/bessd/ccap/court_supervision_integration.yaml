# Court/referral approvals are child-specific; rates are fixed here to isolate eligibility and payment scope.
- name: HI age 17, care order True, CPS True
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        is_tax_unit_head_or_spouse: true
      child:
        age: 17
        is_tax_unit_dependent: true
        immigration_status: CITIZEN
        is_under_court_supervision: true
        requires_childcare_under_court_order: true
        receives_or_needs_protective_services: true
    tax_units:
      unit:
        members: &id001
        - parent
        - child
    spm_units:
      unit:
        members: *id001
    households:
      home:
        members: *id001
        state_code: HI
  output:
    hi_ccap_eligible_child:
    - false
    - true
    hi_ccap_activity_eligible: true
