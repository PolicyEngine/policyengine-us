# HI CCAP countable monthly income (HAR 17-798.2-10 counted, -11 excluded).
# Counted: employment, self-employment, Social Security (retirement,
# disability, survivors), SSI, pensions, veterans benefits, unemployment,
# workers compensation, interest, dividends, rent, alimony, child support.
# Excluded: capital gains, SNAP, WIC, EITC, lump sums, and others.
#
# hi_ccap_countable_income is MONTH-defined. YEAR-defined sources are entered
# annually (auto-divided to monthly); SSI is MONTH-defined and entered monthly.

- name: Case 1, employment income is counted.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # 2,000/month
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_ccap_countable_income: 2_000

- name: Case 2, SSI is counted.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi: 500  # monthly (SSI is month-defined)
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_ccap_countable_income: 500

- name: Case 3, capital gains are excluded.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        long_term_capital_gains: 12_000  # excluded per HAR 17-798.2-11
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_ccap_countable_income: 0

- name: Case 4, multiple counted sources sum across the unit.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 24_000  # 2,000/month
        ssi: 500  # 500/month
        social_security_retirement: 12_000  # 1,000/month
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # 2,000 + 500 + 1,000 = 3,500
    hi_ccap_countable_income: 3_500

- name: Case 5, unearned sources are counted.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 50
        unemployment_compensation: 6_000  # 500/month
        pension_income: 12_000  # 1,000/month
        child_support_received: 1_200  # 100/month
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # 500 + 1,000 + 100 = 1,600
    hi_ccap_countable_income: 1_600

# HAR 17-798.2-11(8): exclude the earnings of minor household members who are
# at least half-time students. is_full_time_student is the available proxy.

- name: Case 6, minor full-time student's earnings are excluded.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # parent, 2,000/month (counted)
      person2:
        age: 16  # minor (< 18)
        employment_income: 12_000  # 1,000/month, excluded as minor student
        is_full_time_student: true
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 2,000 parent counted; 1,000 minor-student earnings excluded -> 2,000
    hi_ccap_countable_income: 2_000

- name: Case 7, minor's earnings are counted when not a full-time student.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # parent, 2,000/month
      person2:
        age: 16  # minor but not a student -> earnings counted
        employment_income: 12_000  # 1,000/month
        is_full_time_student: false
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 2,000 + 1,000 = 3,000 (no exclusion)
    hi_ccap_countable_income: 3_000

- name: Case 8, adult full-time student's earnings are counted.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000  # parent, 2,000/month
      person2:
        age: 20  # adult (>= 18); exclusion is minors only
        employment_income: 12_000  # 1,000/month, counted
        is_full_time_student: true
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 2,000 + 1,000 = 3,000 (adult student not excluded)
    hi_ccap_countable_income: 3_000

- name: Case 9, Hawaii TANF payments are counted from August 6, 2021.
  period: 2025-04
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 12_000  # 1,000/month
      child:
        age: 5
    spm_units:
      unit:
        members: [parent, child]
        hi_tanf: 100  # monthly
    households:
      household:
        members: [parent, child]
        state_code: HI
  output:
    # HAR 17-798.3-10(b)(11): $1,000 earnings + $100 Hawaii TANF.
    hi_ccap_tanf_income: 100
    hi_ccap_countable_income: 1_100

- name: Case 10, TANF the family does not take up is not counted.
  period: 2025-04
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 12_000
      child:
        age: 5
    spm_units:
      unit:
        members: [parent, child]
        hi_tanf: 100
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [parent, child]
        state_code: HI
  output:
    hi_ccap_tanf_income: 0
    hi_ccap_countable_income: 1_000

- name: Case 11, Hawaii TANF is not added before the August 6, 2021 rules.
  period: 2021-07
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 12_000
      child:
        age: 5
    spm_units:
      unit:
        members: [parent, child]
        hi_tanf: 100
    households:
      household:
        members: [parent, child]
        state_code: HI
  output:
    # The predecessor HAR 17-798.2 edition in force before then was not
    # established, so the earlier source list applies.
    hi_ccap_countable_income: 1_000

- name: Case 12, a computed Hawaii TANF grant flows into CCAP income.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 30
        employment_income: 18_000  # 1,500/month
        weekly_hours_worked_before_lsr: 40
      child:
        age: 5
        is_tax_unit_dependent: true
    spm_units:
      unit:
        members: [parent, child]
        pre_subsidy_childcare_expenses: 1_800
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: HI
  output:
    # Hawaii TANF: countable earnings (1,500 x 0.8 - 200) x 0.45 = 450, and
    # the child care cost gives no deduction; 485.76 - 450 = 35.76. The
    # grant reaches CCAP income without a circular dependency.
    hi_tanf_dependent_care_deduction: 0
    hi_tanf: 35.76
    hi_ccap_countable_income: 1_535.76
