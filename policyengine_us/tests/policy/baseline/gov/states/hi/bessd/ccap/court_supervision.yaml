# Hawaii has no general court-supervision age extension. HAR 17-798.2-9(a)(3)
# covers a child receiving child protective services whose court-ordered case
# plan specifies child care; court supervision stands in for the court order,
# and HAR 17-798.2-2 limits a child to under 18.
- name: Case 1, court supervision alone does not extend the age limit.
  period: 2026-01
  input:
    state_code: [HI, HI, HI, HI]
    age: [12, 13, 17, 18]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [false, false, false, false]
    receives_or_needs_protective_services: [false, false, false, false]
    is_under_court_supervision: [true, true, true, true]
  output:
    hi_ccap_eligible_child: [true, false, false, false]

- name: Case 2, protective services under court supervision qualify through 17.
  period: 2026-01
  input:
    state_code: [HI, HI, HI, HI]
    age: [12, 13, 17, 18]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [false, false, false, false]
    receives_or_needs_protective_services: [true, true, true, true]
    is_under_court_supervision: [true, true, true, true]
  output:
    hi_ccap_eligible_child: [true, true, true, false]

- name: Case 3, protective services without court supervision follow the ordinary limit.
  period: 2026-01
  input:
    state_code: [HI, HI]
    age: [12, 13]
    immigration_status: [CITIZEN, CITIZEN]
    is_disabled: [false, false]
    receives_or_needs_protective_services: [true, true]
    is_under_court_supervision: [false, false]
  output:
    hi_ccap_eligible_child: [true, false]

- name: Case 4, the disabled-child route is unchanged by court supervision.
  period: 2026-01
  input:
    state_code: [HI, HI, HI]
    age: [17, 17, 18]
    immigration_status: [CITIZEN, CITIZEN, CITIZEN]
    is_disabled: [true, true, true]
    receives_or_needs_protective_services: [false, false, false]
    is_under_court_supervision: [false, true, true]
  output:
    hi_ccap_eligible_child: [true, true, false]
