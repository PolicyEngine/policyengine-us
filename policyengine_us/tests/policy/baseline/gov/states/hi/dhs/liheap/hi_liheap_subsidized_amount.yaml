- name: Case 2, flat schedule uses qualified size without an additional household share.
  period: 2026
  absolute_error_margin: 0.01
  # Three residents with one qualified child use 375, without a further 1/3
  # proration. Zero qualified size and California produce no Hawaii schedule.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person4:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person6:
        age: 30
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person7:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit2:
        members: [person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit3:
        members: [person5, person6, person7]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
    households:
      household1:
        members: [person1, person2, person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person4]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person5, person6, person7]
        state_code: CA
        county: LOS_ANGELES_COUNTY_CA
  output:
    hi_liheap_household_size: [1, 0, 0]
    hi_liheap_subsidized_amount: [375, 0, 0]

- name: Case 3, schedule remains separate from income housing and expense eligibility.
  period: 2026
  absolute_error_margin: 0.01
  # This component exposes the one-person schedule before eligibility: 375.
  # A rent-included utility share below 375 does not alter that schedule.
  # High income and private housing do not turn a schedule into an award.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 500_000
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 150
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
        heat_expense_included_in_rent: true
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit3:
        members: [person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: false
    households:
      household1:
        members: [person1]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person2]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
  output:
    hi_liheap_subsidized_amount: [375, 375, 375]
