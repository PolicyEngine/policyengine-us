# Hawaii TANF dependent care deduction: HAR 17-676-54.1(c)(4) and (d)(4)
# deduct the actual cost of care of each incapacitated adult living in the
# household and receiving financial assistance, up to $175 a month when the
# applicant is employed full time (32+ hours a week, HAR 17-676-2) and $165
# otherwise. Each adult's cost is capped separately. Child care costs are not
# part of this deduction.

- name: Case 1, no care expenses.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 0

- name: Case 2, child care does not create an incapacitated-adult deduction.
  period: 2025-04
  input:
    people:
      parent:
        age: 30
        weekly_hours_worked_before_lsr: 40
      child:
        age: 5
    spm_units:
      unit:
        members: [parent, child]
        childcare_expenses: 12_000
    households:
      household:
        members: [parent, child]
        state_code: HI
  output:
    # No qualifying adult or adult-care cost, so no deduction. Before this
    # change the model deducted min($12,000 / 12, $175) = $175 for the child.
    hi_tanf_dependent_care_deduction: 0

- name: Case 3, an amount entered for a child is not deducted.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 5
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 100
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 0

- name: Case 4, full-time applicant, adult care cost below the cap.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 100
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 40 hours is full time; $100 is below the $175 cap.
    hi_tanf_dependent_care_deduction: 100

- name: Case 5, full-time applicant, adult care cost above the cap.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 175

- name: Case 6, part-time applicant, adult care cost above the cap.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 20
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 20 hours is less than full time: $165 cap.
    hi_tanf_dependent_care_deduction: 165

- name: Case 7, exactly 32 hours is full time.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 32
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 175

- name: Case 8, 31 hours is less than full time.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 31
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 165

- name: Case 9, each incapacitated adult's cost is capped separately.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
      person3:
        age: 25
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 50
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: HI
  output:
    # min($300, $175) + min($50, $175) = $225. Pooling the costs against a
    # $350 two-adult cap would give $350.
    hi_tanf_dependent_care_deduction: 225

- name: Case 10, a full-time worker sets the cap when another adult works part time.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 28
        weekly_hours_worked_before_lsr: 20
      person3:
        age: 60
        hi_tanf_qualifying_incapacitated_adult_care_expenses: 300
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: HI
  output:
    hi_tanf_dependent_care_deduction: 175

- name: Case 11, generic care expenses are not mapped to the deduction.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 40
      person2:
        age: 25
        is_disabled: true
        care_expenses: 1_200
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # care_expenses does not establish that the adult is incapacitated and
    # receives financial assistance, so it is not deducted.
    hi_tanf_dependent_care_deduction: 0
