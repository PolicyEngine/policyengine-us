# Accepted plan uses 60% SMI and 150% Hawaii FPG for the maximum threshold.
# https://liheapch.acf.gov/docs/2026/state-plans/HI_Plan_2026.pdf#page=9,50
# FY2026 matrix verifies prior-year Hawaii FPG = 17_990 + 6_330 * (size - 1).
# https://liheapch.acf.gov/docs/2026/benefits-matricies/HI_BenefitMatrix_2026.pdf#page=3
# Federal-supported Clearinghouse verifies SMI size factors and +3% above six.
# https://liheapch.acf.gov/profiles/povertytables/FY2026/hismi.htm
# Raw four-person SMI of 134_428 is the shared-guideline contract value. Direct
# federal raw-table retrieval failed; these SMI dollar checks do not independently
# verify that shared base. They intentionally do not adopt projected rounded rows.

