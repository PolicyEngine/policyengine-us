# HCAP operational FY2026 income chart, physical page 1, annual dollar limits.
# https://www.hcapweb.org/wp-content/uploads/2026/04/H-HEAP-2026-Income-Eligibility.pdf
# All 20 published cells were independently transcribed from the original render.
# Sizes 1-10 use the printed values, including 106_454 at size 6.
# Sizes 11-20 equal 150% of the prior-year Hawaii FPG:
# (17_990 + 6_330 * (size - 1)) * 1.5.
# The earlier-year case is an unverified historical estimate, not FY2025 validation.
# IRS 2025 Form 8962 instructions, Table 1-3, independently reproduce 2024 HI FPG.
# https://www.irs.gov/instructions/i8962

