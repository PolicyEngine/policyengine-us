- name: Case 2, limits use qualified size and guard zero size and other states.
  period: 2026
  absolute_error_margin: 0.01
  # Two nonqualified residents do not enlarge the one-person limit.
  # An all-nonqualified Hawaii unit and a California unit have zero HI limit.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person4:
        age: 35
        is_citizen_or_legal_immigrant: false
        ssi: 0
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
      spm_unit2:
        members: [person4]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
      spm_unit3:
        members: [person5]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person4]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person5]
        state_code: CA
        county: LOS_ANGELES_COUNTY_CA
  output:
    hi_liheap_household_size: [1, 0, 0]
    hi_liheap_income_limit: [41_941, 0, 0]

