# Accepted FY2026 plan establishes the five categories and child through age five.
# https://liheapch.acf.gov/docs/2026/state-plans/HI_Plan_2026.pdf#page=10
# Matrix verifies point bands, size/island points and actual total income.
# https://liheapch.acf.gov/docs/2026/benefits-matricies/HI_BenefitMatrix_2026.pdf#page=2
# Historical manual section 2.10 specifies electric cost even for gas requests.
# https://humanservices.hawaii.gov/wp-content/uploads/2019/07/Policies-and-Procedures-2020.pdf#page=8
# These points are before eligibility; no final award or value per point is tested.

- name: Case 1, income points include every whole-dollar band boundary.
  period: 2026
  # Matrix p3: one-person FPG = 17_990; income points = 3,3,2,2,1,1,0.
  # Add one size point and one Oahu point; no vulnerability or electric burden.
