- name: Case 11, categorical receipt does not replace actual income for points.
  period: 2026
  # Matrix p3 uses actual total income: 6_000 wages + annual TANF 6_000 = 12_000,
  # below half the two-person FPG (12_160). Thus 3+1+1=5 points.
  # This follows the direct worksheet over conflicting notional-income text.
  input:
    people:
      person1:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 6_000
      person2:
        age: 8
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 6_000
    households:
      household1:
        members: [person1, person2]
        state_code: HI
        county: HONOLULU_COUNTY_HI
  output:
    hi_liheap_countable_income: 12_000
    hi_liheap_points: 5

