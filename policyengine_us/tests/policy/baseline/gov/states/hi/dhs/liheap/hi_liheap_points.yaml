        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
      spm_unit3:
        members: [person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
      spm_unit4:
