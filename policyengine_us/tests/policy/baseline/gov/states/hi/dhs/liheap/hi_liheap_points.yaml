- name: Case 5, multiple vulnerability conditions earn only one point.
  period: 2026
  # Income 20_000 / FPG 30_650 gives two; size three gives two; Oahu gives one.
  # All three members are vulnerable but the category gives only one: 2+2+1+1=6.
  input:
    people:
      person1:
        age: 60
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 20_000
      person2:
        age: 40
        is_citizen_or_legal_immigrant: true
        ssi: 0
        is_disabled: true
      person3:
        age: 5
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
    households:
      household1:
        members: [person1, person2, person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
  output:
    hi_liheap_points: 6

