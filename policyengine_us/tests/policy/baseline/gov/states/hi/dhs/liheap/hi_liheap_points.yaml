        ssi: 0
        employment_income: 8_996
      person4:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 17_990
      person5:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 17_991
      person6:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 26_985
      person7:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 26_986
    spm_units:
