- name: Case 3, eligibility is required and a private dwelling is paid by points.
  period: 2026
  absolute_error_margin: 0.01
  # Gas in subsidized rent pays 375. Income of 500_000 is above the limit. The
  # eligible private dwelling was 0, now 700: no income gives three points, size
  # one gives one and Oahu gives one, and 5 x 140 = 700.
  input:
    people:
      person1:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
      person2:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
        employment_income: 500_000
      person3:
        age: 35
        is_citizen_or_legal_immigrant: true
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NATURAL_GAS
        gas_expense: 150
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
        heat_expense_included_in_rent: true
      spm_unit2:
        members: [person2]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit3:
        members: [person3]
        heating_type: NATURAL_GAS
        gas_expense: 1_200
        pre_subsidy_electricity_expense: 0
        hi_tanf: 0
        receives_housing_assistance: false
    households:
      household1:
        members: [person1]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person2]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
  output:
    hi_liheap_eligible: [true, false, true]
    hi_liheap: [375, 0, 700]

- name: Case 4, public housing without a voucher receives the flat benefit.
  period: 2026
  absolute_error_margin: 0.01
  # Wages 30_000 are below the three-person limit of 67_751; size three pays 425.
  input:
    people:
      person1:
        age: 35
        ssi: 0
        employment_income_before_lsr: 30_000
      person2:
        age: 33
        ssi: 0
      person3:
        age: 8
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
        heating_type: NATURAL_GAS
        gas_expense: 900
        hi_tanf: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
        is_in_public_housing: true
  output:
    hi_liheap_countable_income: 30_000
    hi_liheap_eligible: true
    hi_liheap: 425

- name: Case 5, a subsidized household with no heating receives the flat benefit on its electric account.
  period: 2026
  absolute_error_margin: 0.01
  # Plan 3.5 (page 13) gives cooling the same flat amounts, and the matrix pays
  # one "heating and cooling energy credit". Each adult works full time at
  # Hawaii's $16 minimum wage from 2026 (HRS 387-2): 16 x 2_080 = 33_280, under the
  # one-person limit of 41_941 and the three-person limit of 67_751. The electric
  # bill is 2_016 (168 x 12, Case 5 of hi_liheap_eligible). A voucher holder pays
  # 375 for size one and a public-housing family of three pays 425. The private
  # dwelling was 0, now 280: wages above 150% of the one-person guideline
  # (26_985) give no income point, size one gives one and Oahu gives one, and
  # 2 x 140 = 280. Hawaii asks no cooling cost, so the electric bill qualifies
  # without one.
  input:
    people:
      person1:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person2:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person3:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person4:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person5:
        age: 33
        ssi: 0
      person6:
        age: 8
        ssi: 0
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit2:
        members: [person2]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: false
      spm_unit3:
        members: [person3]
        heating_type: NONE
        has_cooling_expense: false
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: true
      spm_unit4:
        members: [person4, person5, person6]
        heating_type: NONE
        has_cooling_expense: true
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
    households:
      household1:
        members: [person1]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person2]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household4:
        members: [person4, person5, person6]
        state_code: HI
        county: HONOLULU_COUNTY_HI
        is_in_public_housing: true
  output:
    hi_liheap_countable_income: [33_280, 33_280, 33_280, 33_280]
    hi_liheap_eligible: [true, true, true, true]
    hi_liheap: [375, 280, 375, 425]

- name: Case 6, a public-housing tenant whose utilities are in the rent receives the flat benefit.
  period: 2026
  absolute_error_margin: 0.01
  # One person aged 70 in Honolulu public housing with $18,000 of Social Security,
  # under the one-person limit of 41_941. Rent includes the utilities and there
  # is no separate bill; the draft's Energy Credit offsets "rent or applicant's
  # share of the electric/gas cost when rent includes electric/gas". Size one
  # receives 375.
  input:
    people:
      person1:
        age: 70
        ssi: 0
        social_security_retirement: 18_000
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: NONE
        hi_tanf: 0
    households:
      household1:
        members: [person1]
        state_code: HI
        county: HONOLULU_COUNTY_HI
        is_in_public_housing: true
        tenant_pays_utilities: false
  output:
    hi_liheap_eligible: true
    hi_liheap: 375

- name: Case 7, a neighbor-island private dwelling with four points matches the matrix's worked example.
  period: 2026
  absolute_error_margin: 0.01
  # The matrix's example pays 4 points x 140 = 560. A Maui couple with one
  # full-time worker at Hawaii's $16 minimum wage has 33_280, between 100% and
  # 150% of the two-person guideline (24_320 to 36_480): one income point, one
  # size point and two neighbor-island points. The electric bill of 2_016 is
  # under 30% of income and neither adult is vulnerable.
  input:
    people:
      person1:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person2:
        age: 33
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
        heating_type: NONE
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: false
    households:
      household:
        members: [person1, person2]
        state_code: HI
        county: MAUI_COUNTY_HI
  output:
    hi_liheap_eligible: true
    hi_liheap_points: 4
    hi_liheap: 560

- name: Case 8, a private dwelling with the ten-point maximum receives the plan's maximum benefit.
  period: 2026
  absolute_error_margin: 0.01
  # Plan 2.6 and 3.6 give a 1_400 maximum, which is 10 points x 140. A Hawaii
  # Island family of six has one adult working 15 hours a week at the $16
  # minimum wage: 16 x 15 x 52 = 12_480, under half the six-person guideline
  # (24_820), for three income points. Size six gives three, a neighbor island
  # two and the three-year-old one. The electric bill is 4_032, twice the 2_016
  # state average for this larger home and over 30% of income (3_744), for the
  # tenth point.
  input:
    people:
      person1:
        age: 35
        ssi: 0
        employment_income_before_lsr: 12_480
      person2:
        age: 33
        ssi: 0
      person3:
        age: 12
        ssi: 0
      person4:
        age: 9
        ssi: 0
      person5:
        age: 6
        ssi: 0
      person6:
        age: 3
        ssi: 0
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4, person5, person6]
        heating_type: NONE
        pre_subsidy_electricity_expense: 4_032
        hi_tanf: 0
        receives_housing_assistance: false
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: HI
        county: HAWAII_COUNTY_HI
  output:
    hi_liheap_countable_income: 12_480
    hi_liheap_eligible: true
    hi_liheap_points: 10
    hi_liheap: 1_400

- name: Case 9, photovoltaic net usage determines eligibility and the flat benefit.
  period: 2026
  absolute_error_margin: 0.01
  # All three adults earn 33_280 on Oahu. The benefit matrix pays 375 to
  # the electric-heated home with net PV usage. The solar-thermal home
  # leaves PV status blank and gets 280 (two points at 140). Draft manual
  # 4.2 requires net billed usage for PV homes, so the home with only PV
  # account fees receives 0.
  input:
    people:
      person1:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person2:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
      person3:
        age: 35
        ssi: 0
        employment_income_before_lsr: 33_280
    spm_units:
      spm_unit1:
        members: [person1]
        heating_type: ELECTRICITY
        hi_liheap_photovoltaic_status: PV_WITH_NET_USAGE
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: false
      spm_unit2:
        members: [person2]
        heating_type: SOLAR
        pre_subsidy_electricity_expense: 2_016
        hi_tanf: 0
        receives_housing_assistance: false
      spm_unit3:
        members: [person3]
        heating_type: ELECTRICITY
        hi_liheap_photovoltaic_status: PV_WITHOUT_NET_USAGE
        pre_subsidy_electricity_expense: 240
        hi_tanf: 0
        receives_housing_assistance: false
    households:
      household1:
        members: [person1]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household2:
        members: [person2]
        state_code: HI
        county: HONOLULU_COUNTY_HI
      household3:
        members: [person3]
        state_code: HI
        county: HONOLULU_COUNTY_HI
  output:
    hi_liheap_eligible: [true, true, false]
    hi_liheap_points: [2, 2, 2]
    hi_liheap: [375, 280, 0]
    liheap: [375, 280, 0]

