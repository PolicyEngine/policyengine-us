- name: Eligible household renters
  period: 2021
  input:
    state_code: HI
    claimed_as_dependent_on_another_return: false
    hi_agi: 29_000
    rent: 1_100
  output:
    hi_tax_credit_for_low_income_household_renters_eligible: true

- name: Uneligible household renters (over adjusted gross income threshold)
  period: 2021
  input:
    state_code: HI
    claimed_as_dependent_on_another_return: false
    hi_agi: 31_000
    rent: 1_100
  output:
    hi_tax_credit_for_low_income_household_renters_eligible: false

- name: Uneligible household renters (below rent payment threshold)
  period: 2021
  input:
    state_code: HI
    claimed_as_dependent_on_another_return: false
    hi_agi: 29_000
    rent: 900
  output:
    hi_tax_credit_for_low_income_household_renters_eligible: false

- name: Uneligible household renters (neither condition unsatisfied)
  period: 2021
  input:
    state_code: HI
    claimed_as_dependent_on_another_return: false
    hi_agi: 32_000
    rent: 900
  output:
    hi_tax_credit_for_low_income_household_renters_eligible: false

- name: Joint return where only one spouse can be claimed (the claimable spouse is the head)
  period: 2021
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        rent: 1_100
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        hi_agi: 29_000
    households:
      household:
        members: [person_a, person_b]
        state_code: HI
  output:
    # HRS 235-55.7(b): the spouse who cannot be claimed may claim the credit.
    hi_tax_credit_for_low_income_household_renters_eligible: true

- name: Joint return where only one spouse can be claimed (the claimable spouse is the spouse)
  period: 2021
  input:
    people:
      person_b:
        age: 20
        rent: 1_100
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        hi_agi: 29_000
    households:
      household:
        members: [person_b, person_a]
        state_code: HI
  output:
    # HRS 235-55.7(b): the spouse who cannot be claimed may claim the credit.
    hi_tax_credit_for_low_income_household_renters_eligible: true

- name: Joint return where both spouses can be claimed
  period: 2021
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        rent: 1_100
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        hi_agi: 29_000
    households:
      household:
        members: [person_a, person_b]
        state_code: HI
  output:
    hi_tax_credit_for_low_income_household_renters_eligible: false
