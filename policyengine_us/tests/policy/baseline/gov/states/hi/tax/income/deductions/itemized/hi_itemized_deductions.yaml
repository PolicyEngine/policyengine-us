- name: Total deduction amount, single
  period: 2022
  input:
    state_code: HI
    filing_status: SINGLE
    hi_agi: 166_779
    hi_total_itemized_deductions: 5_000
    hi_reduced_itemized_deductions: 1_000
  output:
    hi_itemized_deductions: 5_000


- name: Total deduction amount joint
  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    hi_agi: 166_779
    hi_total_itemized_deductions: 5_000
    hi_reduced_itemized_deductions: 4_500
  output:
    hi_itemized_deductions: 5_000

- name: Separate, have reduced deductions
  period: 2022
  input:
    state_code: HI
    filing_status: SEPARATE
    hi_agi: 166_880
    hi_total_itemized_deductions: 5_000
    hi_reduced_itemized_deductions: 4_500
  output:
    hi_itemized_deductions: 4_500

- name: Hawaii allows gambling losses and does not reduce them at high income.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    employment_income: 200_000
    gambling_winnings: 10_000
    gambling_losses: 10_000
    state_code: HI
  output:
    hi_agi: 210_000
    # 90% of 10,000 from 2026
    hi_total_itemized_deductions: 9_000
    # Total Itemized Deductions Worksheet line 4: line 3 (gambling losses)
    # is not less than line 1, so the deduction is not limited.
    hi_itemized_deductions: 9_000

- name: The Hawaii limitation reduces other deductions held with gambling losses.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 40
    employment_income: 200_000
    gambling_winnings: 10_000
    gambling_losses: 10_000
    charitable_deduction: 20_000
    state_code: HI
  output:
    hi_agi: 210_000
    hi_total_itemized_deductions: 30_000
    # Smaller of 80% x 20,000 and 3% x (210,000 - 166,800) = 1,296.
    hi_itemized_deductions: 28_704
