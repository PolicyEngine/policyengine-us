- name: Real estate taxes aggregate across spouses above the limit
  period: 2025
  input:
    people:
      head:
        age: 40
        real_estate_taxes: 2_000
      spouse:
        age: 40
        real_estate_taxes: 3_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        adjusted_gross_income: 200_000
        state_and_local_sales_or_income_tax: 12_000
    households:
      household:
        members: [head, spouse]
        state_code: HI
  output:
    hi_salt_deduction: 5_000
