- name: Hawaii taxable income
  period: 2021
  input:
    hi_agi: 50_000
    hi_deductions: 2_000
    hi_exemptions: 5_000
    state_code: HI
  output:
    hi_taxable_income: 43_000

- name: Hawaii taxable income (zero)
  period: 2021
  input:
    hi_agi: 20_000
    hi_deductions: 4_000
    hi_exemptions: 18_000
    state_code: HI
  output:
    hi_taxable_income: 0 

- name: Case 3, tipped worker deducts qualified tips from Hawaii taxable income in 2026.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 40_000
        tip_income: 8_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_agi: 40_000
    hi_tip_income_deduction: 8_000
    # 8,000 standard deduction + 8,000 tips deduction.
    hi_deductions: 16_000
    hi_exemptions: 1_144
    # 40,000 - 16,000 - 1,144 = 22,856.
    hi_taxable_income: 22_856

- name: Case 4, joint itemizers above $166,800 have limited itemized deductions in 2026.
  period: 2026
  input:
    people:
      person1:
        age: 40
      person2:
        age: 40
    tax_units:
      tax_unit:
        members: [person1, person2]
        hi_agi: 200_000
        hi_total_itemized_deductions: 30_000
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 30,000 - (200,000 - 166,800) * 3% = 29,004.
    hi_itemized_deductions: 29_004
    hi_deductions: 29_004
    hi_exemptions: 2_288
    # 200,000 - 29,004 - 2,288 = 168,708.
    hi_taxable_income: 168_708

- name: Case 5, Hawaii does not adopt the federal senior or overtime deductions in 2026.
  period: 2026
  input:
    people:
      person1:
        age: 70
        employment_income: 50_000
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # The federal return gets both deductions.
    additional_senior_deduction: 6_000
    overtime_income_deduction: 5_000
    # Act 35 keeps sections 151 and 225 inoperative for Hawaii.
    hi_deductions: 8_000
    # Regular plus aged exemption: 2 * 1,144 = 2,288.
    hi_exemptions: 2_288
    # 50,000 - 8,000 - 2,288 = 39,712.
    hi_taxable_income: 39_712
