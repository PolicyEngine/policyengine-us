- name: Case 4, Act 115 refund for 2021.
  period: 2021
  input:
    people:
      person1:
        age: 30
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # 15.3% * 8,000 under the 2021 phase-in.
    eitc: 1_224
    # 20% * 1,224
    hi_eitc_potential: 244.8
    # One exemption * $300 for federal AGI under $100,000.
    hi_act_115_rebate: 300
    # 100 food/excise + 300 Act 115
    hi_refundable_credits: 400
  absolute_error_margin: 0.01

