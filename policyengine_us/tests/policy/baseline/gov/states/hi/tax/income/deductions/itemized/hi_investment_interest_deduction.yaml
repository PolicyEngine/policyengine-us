- name: Case 5, allowed investment expenses after the two-percent floor reduce income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        investment_interest_expense: 5_000
        taxable_interest_income: 6_000
        investment_expenses: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # HI AGI is $6,000; allowed expenses are $2,000 - $120 = $1,880.
    hi_investment_interest_deduction: 4_120

