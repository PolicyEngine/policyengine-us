        taxable_interest_income: 5000
        investment_expenses: 1000
    tax_units:
      tax_unit:
        members: [parent]
        filing_status: SINGLE
        hi_agi: 100000
    households:
      household:
        members: [parent]
        state_code: HI
  output:
    # $1,000 expenses are below the $2,000 floor, so N-158 line 5 is zero.
    hi_investment_interest_deduction: 5000

