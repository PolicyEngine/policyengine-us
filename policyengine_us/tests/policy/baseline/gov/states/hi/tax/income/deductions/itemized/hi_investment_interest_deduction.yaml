- name: Case 1, qualified dividends count as investment income in Hawaii.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        investment_interest_expense: 5_000
        taxable_interest_income: 2_000
        qualified_dividend_income: 1_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # N-158 line 4a: $2,000 interest + $1,000 ordinary dividends = $3,000.
    hi_investment_interest_deduction: 3_000

- name: Case 2, interest expense below investment income is fully deductible.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        investment_interest_expense: 1_000
        taxable_interest_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_investment_interest_deduction: 1_000

- name: Case 3, net short-term gain counts as investment income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        investment_interest_expense: 5_000
