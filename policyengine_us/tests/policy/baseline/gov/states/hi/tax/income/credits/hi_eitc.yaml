    hi_eitc: 200

# A single filer, age 30, with $8,000 of wages in each year around the
# credit's start date. The federal EITC is on its plateau in each year
# tested (single, no qualifying child), and the Hawaii food/excise credit is
# $100 for federal AGI of $5,000 to $10,000 (Form N-311, 2017-2022). Act 115
# (SLH 2022) refunds went only to filers of a 2021 Form N-11 (DOTAX
# Announcement 2022-03, p.2).
- name: Single filer with $8,000 of wages gets no Hawaii EITC or Act 115 refund in 2016
  period: 2016
  input:
    people:
      person1:
        age: 30
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    hi_eitc_potential: 0
    hi_non_refundable_credits: 0
    hi_act_115_rebate: 0
    hi_refundable_credits: 100
  absolute_error_margin: 0.01

- name: Single filer with $8,000 of wages gets no Hawaii EITC or Act 115 refund in 2017
  period: 2017
  input:
    people:
      person1:
        age: 30
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    eitc: 510
    hi_eitc_potential: 0
    hi_non_refundable_credits: 0
    hi_act_115_rebate: 0
    hi_food_excise_credit: 100
    hi_refundable_credits: 100
    # Taxable income: 8,000 - 2,200 standard deduction - 1,144 exemption
    # = 4,656. Tax: 1.4% * 2,400 + 3.2% * 2,256 = 105.792.
    # 105.792 - 0 nonrefundable - 100 refundable = 5.792.
    hi_income_tax: 5.792
  absolute_error_margin: 0.01

