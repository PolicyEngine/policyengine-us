- name: 2025 single filer aged 65 or older who can be claimed as a dependent has no exemptions
  period: 2025
  input:
    people:
      filer:
        age: 70
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: HI
  output:
    # HRS 235-54(a): the exemption of a claimable individual "shall be zero".
    hi_regular_exemptions: 0

- name: 2025 aged joint return with one claimable spouse keeps the other spouse's regular and age exemptions (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 70
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 68
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: HI
  output:
    # (1 + 1) x $1,144.
    hi_regular_exemptions: 2_288

- name: 2025 aged joint return with one claimable spouse keeps the other spouse's regular and age exemptions (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 68
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 70
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: HI
  output:
    hi_regular_exemptions: 2_288

- name: 2025 aged joint return with neither spouse claimable
