- name: 2025 joint return with one claimable spouse and a child counts only the other spouse (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: HI
  output:
    # N-11: "You cannot claim any dependents" when either spouse can be
    # claimed.
    hi_regular_exemptions: 1_144

- name: 2025 joint return with one claimable spouse and a child counts only the other spouse (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: HI
  output:
    hi_regular_exemptions: 1_144
