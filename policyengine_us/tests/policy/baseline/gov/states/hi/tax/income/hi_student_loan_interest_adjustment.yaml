- name: Joint filer at $115K Hawaii MAGI receives a partial Hawaii student loan interest deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 115_000
        student_loan_interest: 2_500
        is_tax_unit_head: true
      spouse:
        age: 40
        employment_income: 0
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: HI
  output:
    # Federal AGI is $112,500 after the federal SLI deduction, but Hawaii
    # MAGI adds that deduction back because the worksheet uses Hawaii AGI
    # before any student loan interest deduction. Joint phase-out:
    # ($115,000 - $100,000) / $30,000 = 0.5.
    # Deduction = $2,500 * (1 - 0.5) = $1,250.
    hi_student_loan_interest_deduction: 1_250

- name: A dependent's pension does not lower Hawaii modified AGI for the student loan interest phase-out
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 60_000
        student_loan_interest: 2_500
        is_tax_unit_head: true
      child:
        age: 10
        taxable_public_pension_income: 10_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: HI
  output:
    # Federal AGI is $57,500 ($60,000 wages - $2,500 federal deduction; the
    # federal head of household phase-out starts at $85,000). The child's
    # pension is not in federal AGI, so it is not subtracted, and Hawaii MAGI
    # is $57,500 + $2,500 add-back = $60,000.
    hi_modified_agi: 60_000
    # Head of household phase-out: ($60,000 - $50,000) / $15,000 = 2/3.
    # Deduction = $2,500 * (1 - 2/3) = $833.33.
    hi_student_loan_interest_deduction: 833.33
    hi_student_loan_interest_adjustment: -1_666.67
    hi_subtractions: 0
    # $57,500 + $1,666.67 Hawaii addition.
    hi_agi: 59_166.67

- name: Hawaii modified AGI subtracts the head's pension but not a dependent's
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 60_000
        taxable_private_pension_income: 5_000
        student_loan_interest: 2_500
        is_tax_unit_head: true
      child:
        age: 10
        taxable_public_pension_income: 10_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
    marital_units:
      head_marital_unit:
        members: [head]
      child_marital_unit:
        members: [child]
    spm_units:
      spm_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: HI
  output:
    # Federal AGI = $60,000 + $5,000 - $2,500 = $62,500 (federal MAGI $65,000
    # is below the $85,000 phase-out start). Hawaii MAGI = $62,500 - $5,000
    # head's pension + $2,500 add-back = $60,000; the child's $10,000 is not
    # subtracted.
    hi_modified_agi: 60_000
    hi_student_loan_interest_deduction: 833.33
    hi_student_loan_interest_adjustment: -1_666.67
    hi_subtractions: 5_000
    # $62,500 + $1,666.67 addition - $5,000 pension subtraction.
    hi_agi: 59_166.67

- name: Hawaii deduction keeps the unclaimed head's interest on a joint return with a claimed spouse
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 2_000
        student_loan_interest: 1_000
        is_tax_unit_head: true
      spouse:
        age: 22
        is_full_time_student: true
        is_tax_unit_spouse: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        student_loan_interest: 700
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    spm_units:
      spm_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: HI
  output:
    # IRC 221(c) bars only the claimed spouse, so Hawaii counts the head's
    # interest only: min(1,000, 2,500 cap) = 1,000. Federal AGI is
    # 2,000 - 1,000 = 1,000; Hawaii MAGI adds back the 1,000 federal
    # deduction, giving 2,000, below the 100,000 joint phase-out start.
    student_loan_interest_ald_eligible: [true, false]
    hi_modified_agi: 2_000
    hi_student_loan_interest_deduction: 1_000
    # Hawaii deduction 1,000 - federal deduction 1,000 = 0, so Hawaii AGI
    # equals federal AGI.
    hi_student_loan_interest_adjustment: 0
    hi_agi: 1_000
