        members: [head]
        filing_status: SURVIVING_SPOUSE
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: HI
  output:
    # 2024 worksheet line 3: $50,000 if single, head of household, or qualifying
    # surviving spouse; line 5 divides by $15,000 unless married filing jointly.
    # Hawaii deduction = $2,500 * (1 - 10,000 / 15,000) = $833.33.
    hi_student_loan_interest_deduction: 833.33

