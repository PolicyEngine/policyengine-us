# Lines 2 to 8 of the Tax on Capital Gains Worksheet, 2022 Form N-11
# Instructions, page 33. Line 4 is federal Schedule D line 15 and line 7 is
# federal Schedule D line 16. Neither line includes qualified dividends.
- name: Qualified dividends are not part of the Hawaii capital gain
  period: 2022
  input:
    state_code: HI
    long_term_capital_gains: 5_000
    qualified_dividend_income: 3_000
  output:
    # min(5,000, 5,000)
    hi_capital_gain_for_alternative_tax: 5_000

- name: Net capital loss with qualified dividends gives no capital gain
  period: 2022
  input:
    state_code: HI
    long_term_capital_gains: 927
    short_term_capital_gains: -4_105
    qualified_dividend_income: 667
  output:
    # Line 7 = 927 - 4,105 = -3,178, so line 8 is a loss and the worksheet stops.
    hi_capital_gain_for_alternative_tax: 0

- name: Short-term loss reduces the net capital gain
  period: 2022
  input:
    state_code: HI
    long_term_capital_gains: 10_000
    short_term_capital_gains: -4_000
  output:
    # min(10,000, 6,000)
    hi_capital_gain_for_alternative_tax: 6_000

- name: Short-term gain does not increase the result above the long-term gain
  period: 2022
  input:
    state_code: HI
    long_term_capital_gains: 2_000
    short_term_capital_gains: 5_000
  output:
    # min(2,000, 7,000)
    hi_capital_gain_for_alternative_tax: 2_000

- name: Capital gain distributions reported without Schedule D
  period: 2022
  input:
    state_code: HI
    non_sch_d_capital_gains: 1_500
  output:
    # Form 1040 line 7 if Schedule D is not required
    hi_capital_gain_for_alternative_tax: 1_500
