    hi_employee_temporary_disability_insurance_contribution: 178.72

- name: Hawaii taxes part-year wages in full when they stay under the weekly cap.
  period: 2024
  absolute_error_margin: 0.01
  input:
    employment_income: 20_000
    weeks_worked: 26
    weekly_hours_worked_before_lsr: 40
    state_code: HI
  output:
