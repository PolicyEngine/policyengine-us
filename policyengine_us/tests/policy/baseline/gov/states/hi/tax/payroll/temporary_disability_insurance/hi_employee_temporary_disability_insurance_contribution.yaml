        employment_income:
          2026: 10_000
        weekly_hours_worked_before_lsr:
          2025: 19
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # The 2025 hours carry into 2026, where 19 hours fail the 20-hour minimum,
    # and 2025 holds no wages to pass on.
    hi_temporary_disability_insurance_qualified: false
    hi_employee_temporary_disability_insurance_contribution: 0

- name: Hawaii counts provided 2014 history for a short 2015.
