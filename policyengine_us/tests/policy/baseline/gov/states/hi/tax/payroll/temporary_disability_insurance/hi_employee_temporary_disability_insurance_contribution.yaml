    hi_employee_temporary_disability_insurance_contribution: 300.00
    employee_state_payroll_tax: 300.00

- name: Hawaii 2026 contribution stops at the 1,500.87 weekly wage base.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    state_code: HI
  output:
    # 64,471.82 rounds to 64,500, and 64,500 * 1.21 / 52 = 1,500.87.
    # 52 * 1,500.87 = 78,045.24.
    hi_temporary_disability_insurance_taxable_wages: 78_045.24
    # 0.5% * 78,045.24 = 390.23.
    hi_employee_temporary_disability_insurance_contribution: 390.23
    # Social Security 6.2% * 100,000 = 6,200.00, Medicare 1.45% * 100,000 =
    # 1,450.00, and 6,200.00 + 1,450.00 + 390.23 = 8,040.23.
    employee_payroll_tax: 8_040.23
    spm_unit_payroll_tax: 8_040.23

