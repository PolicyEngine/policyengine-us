- name: Hawaii still applies the cap when wages after a deferral exceed it.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    traditional_401k_contributions: 10_000
    state_code: HI
  output:
    # 100,000 - 10,000 = 90,000 exceeds 52 * 1,500.21 = 78,010.92.
    hi_temporary_disability_insurance_taxable_wages: 78_010.92
    # 0.5% * 78,010.92 = 390.05.
    hi_employee_temporary_disability_insurance_contribution: 390.05

