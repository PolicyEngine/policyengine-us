# Each year's maximum weekly wage base comes from the Hawaii DLIR notice for
# that year, cited in maximum_weekly_wage_base.yaml. The 0.5% rate comes from
# HRS 392-43(a), and the $400, 14-week and 20-hour test from HRS 392-43(b)(1).

- name: Hawaii 2024 contribution is 0.5% of wages under the cap.
  period: 2024
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    state_code: HI
  output:
    hi_temporary_disability_insurance_qualified: true
    hi_temporary_disability_insurance_taxable_wages: 50_000
    # 0.5% * 50,000 = 250.00.
    hi_employee_temporary_disability_insurance_contribution: 250.00
    hi_employee_state_payroll_tax: 250.00
    employee_state_payroll_tax: 250.00

- name: Hawaii 2024 contribution stops at the 1,374.78 weekly wage base.
  period: 2024
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    state_code: HI
  output:
    # 52 * 1,374.78 = 71,488.56.
    hi_temporary_disability_insurance_taxable_wages: 71_488.56
    # 0.5% * 71,488.56 = 357.44. DLIR's 6.87 weekly maximum * 52 = 357.24, and
    # the 0.20 gap comes from DLIR rounding each week's maximum to the cent.
    hi_employee_temporary_disability_insurance_contribution: 357.44
    hi_employee_state_payroll_tax: 357.44
    employee_state_payroll_tax: 357.44

- name: Hawaii 2026 contribution is 0.5% of wages under the cap.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: HI
  output:
    # 0.5% * 60,000 = 300.00.
    hi_employee_temporary_disability_insurance_contribution: 300.00
    employee_state_payroll_tax: 300.00

- name: Hawaii 2026 contribution stops at the 1,500.21 weekly wage base.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    state_code: HI
  output:
    # 52 * 1,500.21 = 78,010.92.
    hi_temporary_disability_insurance_taxable_wages: 78_010.92
    # 0.5% * 78,010.92 = 390.05. DLIR's 7.50 weekly maximum * 52 = 390.00.
    hi_employee_temporary_disability_insurance_contribution: 390.05
    # Social Security 6.2% * 100,000 = 6,200.00, Medicare 1.45% * 100,000 =
    # 1,450.00, and 6,200.00 + 1,450.00 + 390.05 = 8,040.05.
    employee_payroll_tax: 8_040.05
    spm_unit_payroll_tax: 8_040.05

- name: Hawaii 2004, the first published year, uses the 720.70 weekly wage base.
  period: 2004
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    state_code: HI
  output:
    # 52 * 720.70 = 37,476.40.
    hi_temporary_disability_insurance_taxable_wages: 37_476.40
    # 0.5% * 37,476.40 = 187.38.
    hi_employee_temporary_disability_insurance_contribution: 187.38

- name: Hawaii 2009 uses the 877.69 weekly wage base and counts pre-tax premiums out.
  period: 2009
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    pre_tax_health_insurance_premiums: 10_000
    state_code: HI
  output:
    # 50,000 - 10,000 = 40,000, under 52 * 877.69 = 45,639.88.
    hi_temporary_disability_insurance_taxable_wages: 40_000
    # 0.5% * 40,000 = 200.00.
    hi_employee_temporary_disability_insurance_contribution: 200.00
    employee_state_payroll_tax: 200.00

