- name: Hawaii caps each spouse's wages on their own.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        employment_income: 100_000
      person2:
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # 52 * 1,500.21 = 78,010.92 for person1, and 40,000 is under the cap.
    hi_temporary_disability_insurance_taxable_wages: [78_010.92, 40_000]
    # 0.5% * 78,010.92 = 390.05 and 0.5% * 40,000 = 200.00.
    hi_employee_temporary_disability_insurance_contribution: [390.05, 200.00]
    # 390.05 + 200.00 = 590.05.
    employee_state_payroll_tax: 590.05
