# Each year's maximum weekly wage base is the State's average annual wage from
# that year's DLIR notice, rounded to $100 under HRS 383-61(b), times 1.21 / 52
# (HRS 392-43(b)(2)), rounded to the cent; maximum_weekly_wage_base.yaml cites
# each notice. The 0.5% rate comes from HRS 392-43(a), and the $400, 14-week
# and 20-hour test from HRS 392-43(b)(1).

- name: Hawaii 2024 contribution is 0.5% of wages under the cap.
  period: 2024
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    state_code: HI
  output:
    hi_temporary_disability_insurance_qualified: true
    hi_temporary_disability_insurance_taxable_wages: 50_000
    # 0.5% * 50,000 = 250.00.
    hi_employee_temporary_disability_insurance_contribution: 250.00
    hi_employee_state_payroll_tax: 250.00
    employee_state_payroll_tax: 250.00

- name: Hawaii 2024 contribution stops at the 1,375.21 weekly wage base.
  period: 2024
  absolute_error_margin: 0.01
  input:
    employment_income: 100_000
    state_code: HI
  output:
    # 59,081.47 rounds to 59,100, and 59,100 * 1.21 / 52 = 1,375.21.
    # 52 * 1,375.21 = 71,510.92.
    hi_temporary_disability_insurance_taxable_wages: 71_510.92
    # 0.5% * 71,510.92 = 357.55.
    hi_employee_temporary_disability_insurance_contribution: 357.55
    hi_employee_state_payroll_tax: 357.55
    employee_state_payroll_tax: 357.55

- name: Hawaii 2026 contribution is 0.5% of wages under the cap.
  period: 2026
  absolute_error_margin: 0.01
  input:
    employment_income: 60_000
    state_code: HI
  output:
