- name: Spouses' interest is limited together
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 150_000
        home_mortgage_interest: 30_000
      spouse:
        age: 45
        employment_income: 50_000
        home_mortgage_interest: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        first_home_mortgage_balance: 1_500_000
        first_home_mortgage_origination_year: 2020
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: HI
  output:
    deductible_mortgage_interest: [15_000, 5_000]
    # $40,000 x .733.
    hi_mortgage_interest_deduction: 29_320

# Companion cases of TheAxiomFoundation/rulespec-us#1556, computed by hand
# from the 2017 Publication 936 Table 1 and the N-11 instructions.

- name: Line 11 rounds the ratio to three places before multiplying
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: HI
    filing_status: SINGLE
    home_mortgage_interest: 90_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    # round($1,100,000 / $1,500,000, 3) = .733; .733 x $90,000.
    hi_mortgage_interest_deduction: 65_970

- name: A separate filer's balance above $500,000 counts as home equity debt up to $50,000
  period: 2025
