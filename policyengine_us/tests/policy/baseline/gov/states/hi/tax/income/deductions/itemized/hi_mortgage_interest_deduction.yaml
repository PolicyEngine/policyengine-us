# 2017 Publication 936, page 2: deduct interest paid on a home owned by
# the filer (or spouse on a joint return), excluding a dependent's own home.
- name: Case 21, canonical priority depends on whether the filer paid the interest.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      legacy_filer:
        age: 45
        mortgage_interest: 90_000
      dependent_owner:
        age: 20
        is_tax_unit_dependent: true
        home_mortgage_interest: 12_000
      canonical_filer:
        age: 45
        mortgage_interest: 90_000
        home_mortgage_interest: 12_000
      control_dependent:
        age: 20
        is_tax_unit_dependent: true
    tax_units:
      dependent_interest_unit:
        members: [legacy_filer, dependent_owner]
        filing_status: SINGLE
        first_home_mortgage_balance: 1_500_000
        first_home_mortgage_origination_year: 2023
      filer_interest_unit:
        members: [canonical_filer, control_dependent]
        filing_status: SINGLE
        first_home_mortgage_balance: 1_500_000
        first_home_mortgage_origination_year: 2023
    households:
      household:
        members: [legacy_filer, dependent_owner, canonical_filer, control_dependent]
        state_code: HI
  output:
    # The same $12,000 is excluded for the dependent, but has canonical
    # priority when paid by the filer. The Hawaii debt ratio is 11/15.
    hi_mortgage_interest_deduction: [66_000, 8_800]

