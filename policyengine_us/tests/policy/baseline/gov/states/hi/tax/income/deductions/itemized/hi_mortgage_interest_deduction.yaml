- name: Line 11 is rounded from the exact ratio
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: HI
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 1_128_784
    first_home_mortgage_origination_year: 2020
  output:
    # $1,100,000 / $1,128,784 = .97449999, which rounds to .974 (single
    # precision would give .9745 and round up); .974 x $40,000.
    hi_mortgage_interest_deduction: 38_960

- name: PE's federal floor binds when worksheet rounding would allow less than federal
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: HI
    filing_status: SINGLE
    home_mortgage_interest: 40_000
    first_home_mortgage_balance: 497_550_016
    first_home_mortgage_origination_year: 1986
    second_home_mortgage_balance: 2_449_984
    second_home_mortgage_origination_year: 2020
  output:
    # Total debt is $500,000,000; the federal limit is $497,550,016.
    # $40,000 x $497,550,016 / $500,000,000 = $39,804.00128.
    deductible_mortgage_interest: 39_804
    # Hawaii's limit is $497,650,016: line 11 rounds .995300032 to .995,
    # so worksheet line 12 gives $39,800. PE's separate floor keeps the
    # federal amount, about $39,804, instead.
    hi_mortgage_interest_deduction: 39_804
    hi_interest_deduction: 39_804

- name: A deduction supplied directly is not limited a second time
  period: 2025
  input:
    state_code: HI
    filing_status: SINGLE
    deductible_mortgage_interest: 20_000
    first_home_mortgage_balance: 1_500_000
    first_home_mortgage_origination_year: 2020
  output:
    # The supplied $20,000 is already after the federal limit and no gross
    # interest is reported, so Hawaii keeps it rather than taking .733 of it.
    hi_mortgage_interest_deduction: 20_000
