- name: 2025 single dependent filer with little earned income gets the $500 minimum
  period: 2025
  input:
    state_code: HI
    filing_status: SINGLE
    claimed_as_dependent_on_another_return: true
    standard_deduction_worksheet_earned_income: 300
    hi_itemized_deductions: 0
  output:
    # HRS 235-2.4(a)(3): greater of $500 or earned income ($300).
    hi_deductions: 500

- name: 2025 single dependent filer with self-employment income uses earned income net of the self-employment tax deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 20
        self_employment_income: 3_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        hi_itemized_deductions: 0
    households:
      household:
        members: [head]
        state_code: HI
  output:
    # N-11 worksheet earned income subtracts Schedule 1 line 15:
    # $3,000 x 0.9235 x 15.3% / 2 = $211.94, so $3,000 - $211.94 = $2,788.06.
    hi_deductions: 2_788.06

- name: 2025 joint return with a claimable self-employed spouse uses earned income net of the self-employment tax deduction (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 20
        self_employment_income: 3_000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        hi_itemized_deductions: 0
    households:
      household:
        members: [person_a, person_b]
        state_code: HI
  output:
    # $3,000 - $3,000 x 0.9235 x 15.3% / 2 = $2,788.06, below the $8,800 joint amount.
    hi_deductions: 2788.06

- name: 2025 joint return with a claimable self-employed spouse uses earned income net of the self-employment tax deduction (the claimable spouse is the spouse)
