    hi_total_itemized_deductions: 0
    charitable_cash_donations: 1_500
    claimed_as_dependent_on_another_return: false
  output:
    # 8,000 standard deduction + min(1,000, 1,500) = 9,000.
    hi_deductions: 9_000

