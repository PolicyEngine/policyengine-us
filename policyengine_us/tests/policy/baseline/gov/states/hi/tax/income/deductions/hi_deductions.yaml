  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    tax_unit_earned_income: 1_000_000
    hi_agi: 1_000_000
    hi_total_itemized_deductions: 5_000
    hi_itemized_deductions_reduction: 500
    head_is_dependent_elsewhere: false
