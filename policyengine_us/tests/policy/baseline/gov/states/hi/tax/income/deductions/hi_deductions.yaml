    hi_deductions: 2788.06

- name: 2025 single dependent filer with a 401(k) deferral uses W-2 box 1 wages
  # N-11 instructions (2025), PDF page 20: earned income is federal Form 1040
  # line 1 wages, which are W-2 box 1 and leave out the $2,000 elective
  # deferral. Greater of $500 or $3,000 - $2,000 = $1,000.
  period: 2025
  input:
    people:
      head:
        age: 20
        employment_income: 3_000
        traditional_401k_contributions: 2_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        hi_itemized_deductions: 0
    households:
      household:
        members: [head]
        state_code: HI
  output:
    hi_deductions: 1_000

- name: 2025 single dependent filer with the same box 1 wages and no deferral gets the same deduction
  # Control for the case above: greater of $500 or $1,000 of wages.
  period: 2025
  input:
    people:
      head:
        age: 20
        employment_income: 1_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
        hi_itemized_deductions: 0
    households:
      household:
        members: [head]
        state_code: HI
  output:
    hi_deductions: 1_000

- name: Case 7, non-itemizer adds the charitable deduction to the standard deduction in 2026.
