- name: Integration test
  period: 2024
  input:
    state_code: HI
    filing_status: JOINT
    employment_income: 62_000
  output:
    hi_deductions: 8_800

- name: 2025 joint standard deduction limited when either spouse can be claimed (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        standard_deduction_worksheet_earned_income: 3_000
        hi_itemized_deductions: 0
    households:
      household:
        members: [person_a, person_b]
        state_code: HI
  output:
    # HRS 235-2.4(a)(3): greater of $500 or earned income ($3,000), up to $8,800.
    hi_deductions: 3_000

- name: 2025 joint standard deduction limited when either spouse can be claimed (the claimable spouse is the spouse)
