- name: get total deduction
  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    tax_unit_earned_income: 1_000
    hi_agi: 1_000
    hi_total_itemized_deductions: 5_000
    hi_itemized_deductions_reduction: 0
    head_is_dependent_elsewhere: false
  output:
    hi_deductions: 5_000
    
- name: large AGI, no eligible, have standard deduction
  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    tax_unit_earned_income: 1_000_000
    hi_agi: 1_000_000
    hi_total_itemized_deductions: 5_000
    hi_itemized_deductions_reduction: 4_000
    head_is_dependent_elsewhere: false
  output:
    hi_deductions: 4_400

- name: small AGI, no eligible, have standard deduction
  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    tax_unit_earned_income: 1_000
    hi_agi: 1_000
    hi_total_itemized_deductions: 1_000
    hi_itemized_deductions_reduction: 0
    head_is_dependent_elsewhere: false
  output:
    hi_deductions: 4_400

- name: separate, large AGI, no eligible, have standard deduction
  period: 2022
  input:
    state_code: HI
