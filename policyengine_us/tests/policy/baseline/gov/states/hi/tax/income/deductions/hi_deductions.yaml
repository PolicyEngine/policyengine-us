- name: get total deduction
  period: 2022
  input:
    state_code: HI
    filing_status: JOINT
    tax_unit_earned_income: 1_000
    hi_agi: 1_000
    hi_total_itemized_deductions: 5_000
    hi_reduced_itemized_deductions: 1_000
    claimed_as_dependent_on_another_return: false
  output:
    hi_deductions: 5_000
    
