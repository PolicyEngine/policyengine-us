- name: Reduced itemized deductions same as total
  period: 2022
  input:
    people:
      person1:
        investment_interest_expense: 100
        taxable_interest_income: 100
      person2:
        investment_interest_expense: 100
        taxable_interest_income: 100
    tax_units:
      tax_unit:
        filing_status: JOINT
        hi_medical_expense_deduction: 300
        hi_casualty_loss_deduction: 400
        hi_agi: 166_880
