- name: Only investment interest allowed after the investment income limit is excluded from the reduction.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        investment_interest_expense: 1_000
        taxable_interest_income: 200
      person2:
        age: 45
    tax_units:
      tax_unit:
        filing_status: JOINT
        hi_medical_expense_deduction: 300
        hi_casualty_loss_deduction: 400
        hi_agi: 500_000
        members: [person1, person2]
        hi_total_itemized_deductions: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # Excluded deductions: $300 + $200 + $400 = $900.
    # ($10,000 - $900) * 80% = $7,280, less than
    # ($500,000 - $166,800) * 3% = $9,996.
    # $10,000 - $7,280 = $2,720.
    hi_reduced_itemized_deductions: 2_720
