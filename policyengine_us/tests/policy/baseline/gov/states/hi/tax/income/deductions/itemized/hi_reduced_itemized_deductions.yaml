- name: base test, separate filers
  period: 2022
  input:
    people:
      person1:
        investment_interest_expense: 100
      person2:
        investment_interest_expense: 100
    tax_units:
      tax_unit:
        filing_status: SEPARATE
        hi_medical_expense_deduction: 300
        hi_casualty_loss_deduction: 400
        hi_agi: 200_000
        members: [person1, person2]
        hi_total_itemized_deductions: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    hi_reduced_itemized_deductions: 6_502


- name: AGI limit not met
  period: 2022
  input:
    people:
      person1:
        investment_interest_expense: 100
      person2:
        investment_interest_expense: 100
    tax_units:
      tax_unit:
        filing_status: JOINT
        hi_medical_expense_deduction: 300
        hi_casualty_loss_deduction: 400
        hi_agi: 166_779
        members: [person1, person2]
        hi_total_itemized_deductions: 10_000
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # Worksheet line 8: income is not over 166,800, so the deduction is not
    # limited and line 1 is entered.
    hi_reduced_itemized_deductions: 10_000

- name: Reduced itemized deductions same as total
  period: 2022
  input:
    people:
      person1:
        investment_interest_expense: 100
      person2:
        investment_interest_expense: 100
    tax_units:
      tax_unit:
        filing_status: JOINT
        hi_medical_expense_deduction: 300
        hi_casualty_loss_deduction: 400
        hi_agi: 166_880
        members: [person1, person2]
        hi_total_itemized_deductions: 900
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    # Worksheet line 4: the medical, investment interest and casualty
    # deductions (300 + 200 + 400) are not less than the total, so the
    # deduction is not limited and line 1 is entered.
    hi_reduced_itemized_deductions: 900

- name: Gambling losses are outside the limitation (worksheet line 2d).
  period: 2025
  input:
    tax_units:
      tax_unit:
        filing_status: SINGLE
        wagering_losses_deduction: 4_000
        hi_agi: 266_800
        members: [person1]
        hi_total_itemized_deductions: 10_000
    people:
      person1: {}
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    # Smaller of 80% x (10,000 - 4,000) = 4,800 and 3% x (266,800 - 166,800)
    # = 3,000.
    hi_reduced_itemized_deductions: 7_000

