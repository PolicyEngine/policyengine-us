# Joint returns: the unearned income test applies to each spouse who can be
# claimed, with that spouse's own income and additional standard deduction.

- name: 2025, joint return whose spouse can be claimed, unearned income of $1,350
  period: 2025
  input:
    people:
      head:
        age: 40
      spouse:
        age: 40
        claimed_as_dependent_on_another_return: true
        taxable_interest_income: 1_350
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    tax_unit_is_required_to_file: false

- name: 2025, joint return whose spouse can be claimed, unearned income over $1,350
  period: 2025
  input:
    people:
      head:
        age: 40
      spouse:
        age: 40
        claimed_as_dependent_on_another_return: true
        taxable_interest_income: 1_351
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    tax_unit_is_required_to_file: true

- name: 2025, the other spouse's unearned income is not the claimed spouse's
  period: 2025
  input:
    people:
      head:
        age: 70
        taxable_interest_income: 1_500
      spouse:
        age: 40
        claimed_as_dependent_on_another_return: true
        taxable_interest_income: 1_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # The claimed spouse's unearned income is $1,000, not over $1,350. The
    # couple's $2,500 would be. Gross income of $2,500 is also under the
    # joint standard deduction, whether that is the regular $31,500 plus
    # $1,600 or the limited $1,350 plus $1,600 that the Standard Deduction
    # Worksheet for Dependents gives when a spouse can be claimed.
    tax_unit_is_required_to_file: false

- name: 2025, joint return whose spouse aged 65 can be claimed, unearned income of $2,950
  period: 2025
  input:
    people:
      head:
        age: 40
      spouse:
        age: 65
        claimed_as_dependent_on_another_return: true
        taxable_interest_income: 2_950
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # Chart B, married dependents, 65 or older or blind: $1,350 + $1,600.
    tax_unit_is_required_to_file: false

- name: 2025, joint return whose spouse aged 65 can be claimed, unearned income over $2,950
