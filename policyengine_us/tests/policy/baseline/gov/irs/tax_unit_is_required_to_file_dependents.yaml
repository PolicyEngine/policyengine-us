# 2026 (Rev. Proc. 2025-32, sec. 4.14: $1,350, $450, $16,100 and $2,050):
# https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=18
# Section 6012(f) ends with 2025, so section 6012(a)(1) applies. Its unearned
# income and gross income tests for these filers say "in excess of", as Chart
# B does. Its earned income threshold comes from (a)(1)(A)(i), which says
# "less than", and the 2026 instructions are not yet published, so the earned
# income cases stay a dollar away from $16,100.

- name: 2026, single dependent with unearned income of $1,350 need not file
