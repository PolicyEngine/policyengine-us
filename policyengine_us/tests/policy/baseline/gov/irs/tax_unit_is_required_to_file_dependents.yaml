# Filing requirement for a filer who can be claimed as a dependent on another
# return, and the absence of an unearned income test for everyone else.
#
# 26 U.S.C. 6012(a)(1)(C)(i) and (f), 26 U.S.C. 63(c)(5), and Chart A and
# Chart B of the Form 1040 instructions (Tables 1 and 2 of Publication 501).
# Section 6012(f) governs 2018 to 2025 and section 6012(a)(1) governs 2026.
# For an unmarried filer who can be claimed, both give Chart B's result.
# 2025 amounts (Chart B, page 10 of
# https://www.irs.gov/pub/irs-prior/i1040gi--2025.pdf):
#   Single dependents, under 65 and not blind, must file if
#     unearned income was over $1,350, or
#     earned income was over $15,750, or
#     gross income was more than the larger of $1,350 or earned income (up to
#     $15,300) plus $450.
#   65 or older or blind: $3,350, $17,750, and the larger of $3,350 or earned
#     income (up to $15,300) plus $2,450. 65 or older and blind: $5,350,
#     $19,750, and the larger of $5,350 or earned income plus $4,450.
#   Married dependents, 65 or older or blind: unearned income over $2,950.

# Filers nobody can claim: gross income only. The cases stay a dollar away
# from the threshold itself, where Chart A ("at least") and section 6012(f)(1)
# ("does not exceed the standard deduction") differ; this change does not
# touch that comparison.

- name: 2025, a single filer nobody can claim with $600 of interest need not file
  period: 2025
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 600
  output:
    tax_unit_is_required_to_file: false

- name: 2025, unearned income under the standard deduction does not require a return
  period: 2025
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 15_749
  output:
    # Chart A: single, under 65, $15,750.
    tax_unit_is_required_to_file: false

- name: 2025, gross income over the standard deduction requires a return
  period: 2025
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 15_751
  output:
    tax_unit_is_required_to_file: true

- name: 2025, a single filer aged 70 nobody can claim with $3,000 of interest need not file
  period: 2025
  input:
    filing_status: SINGLE
    age: 70
    taxable_interest_income: 3_000
  output:
    # Before, the test was $500 plus the $2,000 additional standard deduction.
    tax_unit_is_required_to_file: false

- name: 2025, a self-employment loss is not unearned income
  period: 2025
  input:
    filing_status: SINGLE
    age: 40
    self_employment_income: -10_000
  output:
    # Before, gross income (0) less earned income (-10,000) counted as
    # $10,000 of unearned income.
    tax_unit_is_required_to_file: false

- name: 2025, the unearned income test reads the filer, not a child in the tax unit
  period: 2025
  input:
    people:
      parent:
        age: 40
        employment_income: 10_000
        claimed_as_dependent_on_another_return: true
      child:
        age: 10
        taxable_interest_income: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    # The parent has no unearned income, and gross income of $10,000 is not
    # more than earned income plus $450. The child's interest belongs on the
    # child's own return.
    tax_unit_is_required_to_file: false

