    basic_standard_deduction: 3238.06

- name: 2025 dependent filer with a 401(k) deferral uses W-2 box 1 wages on the worksheet
  # Form 1040 instructions (2025): worksheet earned income starts from line
  # 1z, and line 1a is W-2 box 1, which leaves out the $6,000 elective
  # deferral. Earned income is $10,000 - $6,000 = $4,000; $4,000 + $450 =
  # $4,450. Gross income, $4,000 of wages and $600 of interest, is more than
  # $4,450, so a return is required (Pub. 501 (2025), Table 2).
  period: 2025
  input:
    people:
      head:
        age: 20
        employment_income: 10_000
        traditional_401k_contributions: 6_000
        taxable_interest_income: 600
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: CA
  output:
    basic_standard_deduction: 4_450
    tax_unit_is_required_to_file: true

- name: 2025 dependent filer with the same W-2 box 1 wages and no deferral gets the same deduction
  # Control for the case above: $4,000 of wages with no deferral gives
