- name: H2, the dependent worksheet combines earned disability with self-employment income net of deductible tax
  # 2024 Form 1040 Standard Deduction Worksheet for Dependents: line 1h
  # includes only the $5,000 before minimum retirement age. Schedule 1
  # line 15 is $6,000 x 0.9235 x 15.3% / 2 = $423.89. Worksheet earned income is
  # $6,000 + $5,000 - $423.89 = $10,576.11, plus $450 = $11,026.11.
  # The remaining $2,000 of taxable disability is unearned.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        claimed_as_dependent_on_another_return: true
        self_employment_income: 6_000
        disability_benefits: 7_000
        disability_benefits_before_minimum_retirement_age: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
  output:
    taxable_disability_benefits: 7_000
    earned_disability_benefits: 5_000
    irs_gross_income: 13_000
    self_employment_tax_ald: 423.89
    basic_standard_deduction: 11_026.11
    standard_deduction: 11_026.11
    tax_unit_is_required_to_file: true

- name: 2025 dependent worksheet combines W-2 wages after deferrals with earned disability
  # 2025 Form 1040 instructions, pp. 25 and 35:
  # https://www.irs.gov/pub/irs-prior/i1040gi--2025.pdf#page=35
  # Line 1a is $18,000 - $6,000 = $12,000; line 1h adds the $3,000
  # disability pension, so line 1z and worksheet earned income are $15,000.
  # Worksheet line 1: no age/blindness boxes; line 2: $15,000 + $450 =
  # $15,450; line 3: $15,750; line 4a: min($15,450, $15,750) = $15,450.
  # Pub. 501 (2025), p. 4, Table 2: no unearned income; earned income
  # $15,000 < $15,750; gross income $15,000 < $15,450, so no return.
  period: 2025
  input:
    people:
      head:
        age: 30
        employment_income: 18_000
        traditional_401k_contributions: 6_000
        disability_benefits: 3_000
        disability_benefits_before_minimum_retirement_age: 3_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
  output:
    irs_employment_income: 12_000
    earned_disability_benefits: 3_000
    standard_deduction_worksheet_earned_income_person: 15_000
    standard_deduction_worksheet_earned_income: 15_000
    irs_gross_income: 15_000
    basic_standard_deduction: 15_450
    tax_unit_is_required_to_file: false
