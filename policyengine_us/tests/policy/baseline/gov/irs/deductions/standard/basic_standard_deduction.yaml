- name: 2025 dependent filer with self-employment income uses earned income net of the self-employment tax deduction
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 20
        self_employment_income: 3_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: CA
  output:
    # Worksheet earned income subtracts Schedule 1 line 15:
    # $3,000 - $3,000 x 0.9235 x 15.3% / 2 = $2,788.06; plus $450 = $3,238.06.
    basic_standard_deduction: 3238.06

- name: A dependent filer's disability pension before minimum retirement age counts as earned income
  # 2024 Form 1040 instructions, Standard Deduction Worksheet for Dependents:
  # earned income starts from line 1z, which includes disability pensions
  # reported on line 1h. max($1,300, $10,000 + $450) = $10,450, under the
  # $14,600 single amount.
  period: 2024
  input:
    people:
      head:
        age: 30
        claimed_as_dependent_on_another_return: true
        disability_benefits: 10_000
        disability_benefits_before_minimum_retirement_age: 10_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
  output:
    basic_standard_deduction: 10_450
    taxable_income: 0
    income_tax_before_credits: 0

