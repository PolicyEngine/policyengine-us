- name: Capped SALT deduction
  period: 2023
  input:
    people:
      person:
        real_estate_taxes: 100_000
    households:
      household:
        members: [person]
        state_code: DE
    tax_units:
      tax_unit:
        members: [person]
        filing_status: SINGLE
        adjusted_gross_income: 200_000
  output:
    salt_deduction: 10_000

- name: Cap does not apply
  period: 2023
  input:
    people:
      person:
        real_estate_taxes: 4_000
    households:
      household:
        members: [person]
        state_code: DE
    tax_units:
      tax_unit:
        members: [person]
        filing_status: SINGLE
        adjusted_gross_income: 200_000
  output:
    salt_deduction: 4_000

- name: Single filer with income below reduction amount
  period: 2025
  input:
    people: 
      person1:
        real_estate_taxes: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 100_000
        state_and_local_sales_or_income_tax: 1_000
  output:
    salt_deduction: 11_000

- name: Separate filer with income above reduction amount
  period: 2025
  input:
    people: 
      person1:
        real_estate_taxes: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SEPARATE
        adjusted_gross_income: 290_000
        state_and_local_sales_or_income_tax: 1_000
  output:
    salt_deduction: 8_000

- name: Fully phased out, floor applies
  period: 2026
  input:
    people: 
      person1:
        real_estate_taxes: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SEPARATE
        adjusted_gross_income: 500_000
  output:
    salt_deduction: 5_000

- name: Floor applies
  period: 2026
  input:
    people: 
      person1:
        real_estate_taxes: 10_000
      person2: 
        real_estate_taxes: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 1_000_000
  output:
    salt_cap: 10_000
    salt_deduction: 10_000

- name: The SALT itself is not subject to phase-out
  period: 2026
  input:
    people: 
      person1:
        real_estate_taxes: 11_000
      person2: 
        real_estate_taxes: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 600_000
        state_and_local_sales_or_income_tax: 0
  output:
    salt_deduction: 11_000

- name: Income excluded under section 911 counts toward the cap phase-down
  period: 2025
  input:
    people:
      person1:
        real_estate_taxes: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 490_000
        foreign_earned_income_exclusion: 20_000
  output:
    # 26 U.S.C. 164(b)(7)(B)(iv): modified AGI 510,000; 40,000 - 30% x 10,000.
    salt_cap: 37_000
    salt_deduction: 37_000

# A tax is deductible only by the person on whom it is imposed (26 CFR
# 1.164-1(a)); Schedule A line 5b covers "taxes you paid on real estate you
# own" (2025 Instructions for Schedule A, p. 6).
- name: A dependent's own real estate taxes stay off the filers' SALT deduction
  period: 2023
  input:
    people:
      head:
        age: 45
      child:
        age: 15
        real_estate_taxes: 12_000
    households:
      household:
        members: [head, child]
        state_code: DE
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 200_000
        state_and_local_sales_or_income_tax: 0
  output:
    salt: 0
    salt_deduction: 0

- name: Filers' own SALT is unchanged by a dependent's real estate taxes
  period: 2023
  input:
    people:
      head:
        age: 45
        real_estate_taxes: 3_000
      spouse:
        age: 43
        real_estate_taxes: 1_000
      child:
        age: 15
        real_estate_taxes: 50_000
    households:
      household:
        members: [head, spouse, child]
        state_code: DE
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        adjusted_gross_income: 200_000
        state_and_local_sales_or_income_tax: 2_000
  output:
    # 2_000 income tax + 3_000 + 1_000 real estate taxes, below the cap.
    salt: 6_000
    salt_deduction: 6_000
