- name: A locality's table given as input overrides the state default
  # 2025 selector, Illinois: "Aurora, Elgin, Joliet, Waukegan" -> B, while
  # the state default is A.
  period: 2025
  input:
    state_code: IL
    local_sales_tax_table: B
  output:
    local_sales_tax_table: B

# Localities the selector names. A place's row takes precedence over its
# county's, and both over the state's "any other locality" row.

- name: Aurora, Colorado, 2022, a Table B city in Table A Adams County
  # 2022 selector, Colorado: "Adams County, ... or any other locality" -> A;
  # "Arapahoe County, Arvada, Aurora, ..." -> B.
  period: 2022
  input:
    state_code: CO
    county_fips: "08001"
    place_fips: "04000"
  output:
    local_sales_tax_table: B

- name: Centennial, Colorado, 2022, a Table A city in Table B Arapahoe County
  period: 2022
  input:
    state_code: CO
    county_fips: "08005"
    place_fips: "12815"
  output:
    local_sales_tax_table: A

