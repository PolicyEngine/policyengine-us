    state_code: VT
    county_fips: "50021"
    place_fips: "61225"
  output:
    combined_sales_tax_rate: 0.06

- name: Rutland city, Vermont, July 2023 local option sales tax, day-weighted
  # 181 days at 6% and 184 days at 7%: (181 x 6 + 184 x 7) / 365.
  period: 2023
  absolute_error_margin: 0.00000001
  input:
    state_code: VT
    county_fips: "50021"
    place_fips: "61225"
  output:
    combined_sales_tax_rate: 0.0650410959

- name: Rutland city, Vermont, full year of local option sales tax
