# IRS rows run from "At least" one threshold to "But less than" the next,
# with a top row of "$300,000 or more" (2018-2025 Optional State Sales Tax
# Tables, Instructions for Schedule A (Form 1040)).

- name: Income just below $20,000 is in the $0-$20,000 row
  period: 2022
  input:
    adjusted_gross_income: 19_999
  output:
    state_sales_tax_income_bracket: 1

- name: Income of exactly $20,000 is in the $20,000-$30,000 row
  period: 2022
  input:
    adjusted_gross_income: 20_000
  output:
    state_sales_tax_income_bracket: 2

- name: Income of exactly $200,000 is in the $200,000-$225,000 row
  period: 2024
  input:
    adjusted_gross_income: 200_000
  output:
    state_sales_tax_income_bracket: 15

- name: Income just below $300,000 is in the $275,000-$300,000 row
