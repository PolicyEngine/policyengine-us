# Expected values below are read from the IRS Optional State Sales Tax Tables
# in the Instructions for Schedule A (Form 1040):
#   2022: https://www.irs.gov/pub/irs-prior/i1040sca--2022.pdf#page=13
#   2023: https://www.irs.gov/pub/irs-prior/i1040sca--2023.pdf#page=13
#   2024: https://www.irs.gov/pub/irs-prior/i1040sca--2024.pdf#page=12
#   2025: https://www.irs.gov/pub/irs-prior/i1040sca--2025.pdf#page=13
# The IRS prints the table in blocks of three states, six family-size columns
# each. Cases cover the 1st, 2nd, and 3rd state of a block in every year,
# because a column shift within blocks misassigned 30 states (#9595).

