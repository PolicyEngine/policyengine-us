- name: Texas couple with 2022 income in the $80,000-$90,000 row gets the 2022 Texas amount
  period: 2022
  input:
    people:
      head:
        age: 40
        employment_income: 87_962
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        adjusted_gross_income: 87_962
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    tax_unit_size: 2
    state_sales_tax_income_bracket: 8
    state_sales_tax: 1_001

- name: Massachusetts family of 3 deducts only the state table amount, 2024
  period: 2024
  input:
    people:
      head:
        age: 40
        employment_income: 55_000
      spouse:
        age: 40
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        adjusted_gross_income: 55_000
        state_withheld_income_tax: 0
        local_income_tax: 0
    spm_units:
      spm_unit:
        members: [head, spouse, child]
        # Public assistance counts toward the table income; pin it so the
        # case isolates the table lookup.
        tanf: 0
    households:
      household:
        members: [head, spouse, child]
        state_code: MA
  output:
    tax_unit_size: 3
    state_sales_tax_income_bracket: 5
    state_sales_tax: 691
    local_sales_tax: 0
    state_and_local_sales_or_income_tax: 691
