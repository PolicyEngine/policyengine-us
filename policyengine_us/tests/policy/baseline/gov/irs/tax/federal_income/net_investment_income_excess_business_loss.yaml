# The part of the section 461(l) excess business loss (2025 single threshold
# 313,000) that falls on losses net investment income counts. Net investment
# income adds it back (26 USC 1411(c)(1)(B): deductions allowed by chapter 1).

- name: All of the excess when net investment income losses are the only losses
  # Form 4835 loss 600,000; excess 600,000 - 313,000 = 287,000, all of it on
  # the farm rental loss.
  period: 2025
  input:
    people:
      person1:
        age: 60
        is_tax_unit_head: true
        farm_rent_income: -600_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 287_000
    net_investment_income_excess_business_loss: 287_000

- name: None of the excess when no loss is a net investment income loss
  period: 2025
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        self_employment_income: -600_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 287_000
    net_investment_income_excess_business_loss: 0

- name: A proportional share when both kinds of loss are present
  # Schedule C loss 300,000 and Form 4835 loss 300,000; excess 287,000.
  # Provisional proportional share: 287,000 x 300,000 / 600,000 = 143,500.
  # (The law does not say how to split it; see the variable documentation.)
  period: 2025
  input:
    people:
      person1:
        age: 60
        is_tax_unit_head: true
        self_employment_income: -300_000
        farm_rent_income: -300_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 287_000
    net_investment_income_excess_business_loss: 143_500

- name: Only the passive part of a partnership loss counts
  # Partnership/S-corp loss 400,000, of which 100,000 is passive; excess
  # 400,000 - 313,000 = 87,000; share 87,000 x 100,000 / 400,000 = 21,750.
  period: 2025
  input:
    people:
      person1:
        age: 60
        is_tax_unit_head: true
        partnership_s_corp_income: -400_000
        passive_partnership_s_corp_income: -100_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 87_000
    net_investment_income_excess_business_loss: 21_750

- name: A positive code H adjustment does not take an estate loss out of net investment income
  # Schedule E Part III loss 600,000 (Form 8960 line 4a) and a +600,000
  # Schedule K-1 (Form 1041) box 14 code H adjustment (line 7). Code H is
  # positive only for section 1291 fund, CFC and QEF distributions that are
  # NII but not taxable income (2025 Form 1041 instructions, Beneficiary
  # reporting), so it is separate income and the whole estate loss is still
  # a net investment income loss. Excess 600,000 - 313,000 = 287,000.
  period: 2025
  input:
    people:
      person1:
        age: 60
        is_tax_unit_head: true
        estate_income: -600_000
        estate_income_net_investment_income_adjustment: 600_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 287_000
    net_investment_income_excess_business_loss: 287_000

- name: A joint return shares the excess across both spouses' losses
  # Head Schedule E rental loss 500,000; spouse partnership loss 400,000, of
  # which 200,000 is passive. Losses 900,000; excess 900,000 - 626,000 =
  # 274,000; net investment income losses 500,000 + 200,000 = 700,000; share
  # 274,000 x 700,000 / 900,000 = 213,111.11.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 60
        is_tax_unit_head: true
        rental_income: -500_000
      spouse:
        age: 58
        is_tax_unit_spouse: true
        partnership_s_corp_income: -400_000
        passive_partnership_s_corp_income: -200_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    filing_status: JOINT
    excess_business_loss: 274_000
    net_investment_income_excess_business_loss: 213_111.11

- name: Each Schedule C category's loss counts on its own in the share
  # Non-SSTB Schedule C profit 100,000 and SSTB loss 1,000,000 are not netted
  # (limited_business_loss): gross losses 1,000,000 + 200,000 = 1,200,000,
  # limit 100,000 + 313,000 = 413,000, excess 787,000. Provisional
  # proportional share 787,000 * 200,000 / 1,200,000 = 131,166.67. Netting
  # the two categories first would give 787,000 * 200,000 / 1,100,000 =
  # 143,090.91.
  period: 2025
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        self_employment_income: 100_000
        sstb_self_employment_income: -1_000_000
        rental_income: -200_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    limited_business_loss: 413_000
    excess_business_loss: 787_000
    net_investment_income_excess_business_loss: 131_166.67

- name: A passive loss counts only as far as the netted partnership loss
  # Passive -1,000,000 inside partnership/S corporation income of -100,000
  # (nonpassive +900,000), and a rental loss of 600,000. Gross business losses
  # come to 100,000 + 600,000 = 700,000 and the excess to 700,000 - 313,000 =
  # 387,000. NII losses come to 600,000 + min(1,000,000, 100,000) = 700,000, so
  # the whole excess falls on them. Without the cap the share would read
  # 1,600,000 / 700,000 and the add-back 884,571.43.
  period: 2025
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        employment_income: 300_000
        taxable_interest_income: 900_000
        partnership_s_corp_income: -100_000
        passive_partnership_s_corp_income: -1_000_000
        rental_income: -600_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    excess_business_loss: 387_000
    net_investment_income_excess_business_loss: 387_000
    net_investment_income: -313_000

- name: A dependent's Form 4835 loss stays out of the filer's add-back
  # The filer has wages 300,000, interest 500,000 and a rental loss of 600,000,
  # so the excess reads 600,000 - 313,000 = 287,000 and falls wholly on NII
  # losses. NII reads 500,000 - 600,000 + 287,000 = 187,000. The dependent's
  # loss changes none of these.
  period: 2025
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        employment_income: 300_000
        taxable_interest_income: 500_000
        rental_income: -600_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        farm_rent_income: -1_000_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    excess_business_loss: 287_000
    net_investment_income_excess_business_loss: 287_000
    net_investment_income: 187_000
    net_investment_income_tax: 7_106
