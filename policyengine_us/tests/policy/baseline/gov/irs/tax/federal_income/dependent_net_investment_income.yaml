        passive_partnership_s_corp_income: 12_000
        long_term_capital_gains: 40_000
        non_sch_d_capital_gains: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    adjusted_gross_income: 310_000
    niit_magi: 310_000
    # Before: 10,000 + 117,000 = 127,000 and NIIT 3.8% x 110,000 = 4,180.
    net_investment_income: 10_000
    net_investment_income_tax: 380

- name: A filer with no investment income owes no NIIT on a dependent's interest
  #   AGI = MAGI = 300,000; excess MAGI 100,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 300_000
      child:
        age: 10
        taxable_interest_income: 50_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    adjusted_gross_income: 300_000
    # Before: NII 50,000 and NIIT 1,900.
    net_investment_income: 0
    net_investment_income_tax: 0

- name: Joint filers with a dependent count both spouses' investment income
  # Joint threshold 250,000. AGI = 300,000 + 5,000 = 305,000; excess 55,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 300_000
      spouse:
        age: 44
        qualified_dividend_income: 5_000
      child:
        age: 10
        taxable_interest_income: 30_000
        long_term_capital_gains: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    is_tax_unit_dependent: [false, false, true]
    filing_status: JOINT
    adjusted_gross_income: 305_000
    # Before: 5,000 + 30,000 + 20,000 = 55,000 and NIIT 2,090.
    net_investment_income: 5_000
    # 3.8% x min(5,000, 55,000)
    net_investment_income_tax: 190

- name: Control - a spouse's interest still counts on a joint return
  # AGI = 300,000 + 20,000 = 320,000; joint threshold 250,000; excess 70,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 300_000
      spouse:
        age: 44
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    adjusted_gross_income: 320_000
    net_investment_income: 20_000
    # 3.8% x min(20,000, 70,000)
    net_investment_income_tax: 760

- name: Control - spouses' capital gains and losses net on one Schedule D
  # Head long-term gain 10,000, spouse short-term loss 4,000: net gain 6,000
  # (Treas. Reg. § 1.6013-4(b)). AGI is not asserted here: it still deducts
  # the spouse's loss separately from the head's gain, a joint-return netting
  # issue unrelated to dependents. Either way, MAGI exceeds the 250,000 joint
  # threshold by more than NII.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 300_000
        long_term_capital_gains: 10_000
      spouse:
        age: 44
        short_term_capital_gains: -4_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    filer_loss_limited_net_capital_gains: 6_000
    loss_limited_net_capital_gains: 6_000
    net_investment_income: 6_000
    # 3.8% x 6,000
    net_investment_income_tax: 228

- name: A supplied net capital gains amount is net investment income
  period: 2025
  input:
    employment_income: 300_000
    net_capital_gains: 100_000
    state_code: TX
  output:
    # Form 8960 line 5a: the filer's Form 1040 line 7a, 100,000.
    filer_loss_limited_net_capital_gains: 100_000
    net_investment_income: 100_000

