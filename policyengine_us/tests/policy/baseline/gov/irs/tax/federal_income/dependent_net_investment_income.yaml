# A tax unit dependent's investment income belongs on the dependent's own
# Form 8960, not the filer's. 26 USC 1411(a)(1) taxes each individual's own net
# investment income. A parent's Form 8960 picks up a child's interest,
# dividends and capital gain distributions only through a Form 8814 election
# (Instructions for Form 8960, line 7; Instructions for Form 8814, "Net
# Investment Income Tax"), which the model does not implement, and no election
# moves a child's rents, passive income or capital gains from sales. So
# net_investment_income counts the head and spouse only, consistent with
# irs_gross_income, which already leaves every dependent's income out of AGI.
#
# Unless noted, the parent is a 45-year-old head of household in TX for 2024
# with $300,000 of wages and $10,000 of their own taxable interest:
#   AGI = MAGI = 300,000 + 10,000 = 310,000
#   NIIT threshold (single or head of household) = 200,000; excess MAGI 110,000
#   NIIT = 3.8% x min(NII, excess MAGI)
# Each "before" figure is the pre-change formula, which summed every member.

- name: A dependent's taxable interest stays off the filer's Form 8960
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 300_000
        taxable_interest_income: 10_000
      child:
        age: 10
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    is_tax_unit_dependent: [false, true]
    filing_status: HEAD_OF_HOUSEHOLD
    adjusted_gross_income: 310_000
    niit_magi: 310_000
    # Before: 10,000 + 20,000 = 30,000 and NIIT 1,140.
    net_investment_income: 10_000
    # 3.8% x min(10,000, 110,000)
    net_investment_income_tax: 380

