    # Before: 10,000 + 5,000 = 15,000 and NIIT 570.
    net_investment_income: 10_000
    net_investment_income_tax: 380

- name: A dependent's capital loss does not reduce the filer's capital gain
  # The parent also has a $10,000 long-term gain:
  #   AGI = 300,000 + 10,000 + 10,000 = 320,000; excess MAGI 120,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 300_000
        taxable_interest_income: 10_000
        long_term_capital_gains: 10_000
      child:
        age: 10
        short_term_capital_gains: -3_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    adjusted_gross_income: 320_000
    filer_loss_limited_net_capital_gains: 10_000
    # Before: 10,000 + max(-3,000, 10,000 - 3,000) = 17,000 and NIIT 646.
    net_investment_income: 20_000
    # 3.8% x min(20,000, 120,000)
    net_investment_income_tax: 760

- name: A dependent's capital gain does not absorb the filer's capital loss
  # The parent has a $10,000 net capital loss, limited to $3,000 (§ 1211(b)):
  #   AGI = 300,000 + 10,000 - 3,000 = 307,000; excess MAGI 107,000.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 300_000
        taxable_interest_income: 10_000
        long_term_capital_gains: -10_000
      child:
        age: 10
        long_term_capital_gains: 10_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    adjusted_gross_income: 307_000
    filer_loss_limited_net_capital_gains: -3_000
    # Before: the child's gain netted the loss to zero, so NII 10,000 and
    # NIIT 380.
    net_investment_income: 7_000
    # 3.8% x min(7,000, 107,000)
    net_investment_income_tax: 266

