- name: Single person, low income
  period: 2022
  input:
    filing_status: SINGLE
    amt_income_less_exemptions: 10_000
  output:
    amt_base_tax: 2_600

- name: Single person, no income
  period: 2022
  input:
    filing_status: SINGLE
    amt_income_less_exemptions: 0
  output:
    amt_base_tax: 0

- name: Joint, high income
  period: 2022
  input:
    filing_status: JOINT
    amt_income_less_exemptions: 200_000
  output:
    amt_base_tax: 52_000

- name: Married filing separately above the separate breakpoint
  period: 2025
  input:
    filing_status: SEPARATE
    amt_income_less_exemptions: 136_000
  output:
    # Form 6251 (2025) line 7 "All others" (and line 39): $136,000 is more
    # than $119,550, so 28% * $136,000 - $2,391 = $35,689.
    amt_base_tax: 35_689
