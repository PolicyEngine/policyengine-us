- name: MAGI equals AGI without estate and trust MAGI adjustments
  period: 2024
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        employment_income: 150_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    adjusted_gross_income: 150_000
    niit_magi: 150_000

- name: Positive code H raises MAGI by the same amount; a dependent's does not
  period: 2024
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 150_000
        estate_income: 10_000
        estate_income_net_investment_income_adjustment: 4_000
      spouse:
        age: 48
        is_tax_unit_spouse: true
        estate_income: 2_000
        estate_income_net_investment_income_adjustment: 1_000
      child:
        age: 10
        is_tax_unit_dependent: true
        estate_income: 3_000
        estate_income_net_investment_income_adjustment: 3_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # AGI 150,000 + 10,000 + 2,000; the child's estate income is on the
    # child's own return. MAGI adds the non-dependents' positive code H.
    adjusted_gross_income: 162_000
    niit_magi: 162_000 + 4_000 + 1_000

- name: Negative code H leaves MAGI alone unless the trust indicates a MAGI adjustment
  period: 2024
  input:
    people:
      person1:
        age: 50
        is_tax_unit_head: true
        employment_income: 150_000
        estate_income: 10_000
        estate_income_net_investment_income_adjustment: -6_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    adjusted_gross_income: 160_000
    niit_magi: 160_000

- name: The section 911(a)(1) exclusion raises MAGI by the excluded amount
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 150_000
        qualified_dividend_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 26 U.S.C. 1411(d); Form 8960 Line 13 MAGI Worksheet: line 1 AGI
    # 200,000 plus line 2c 100,000.
    adjusted_gross_income: 200_000
    niit_magi_section_911_addition: 100_000
    niit_magi: 300_000

- name: The section 911 addition and positive code H both raise MAGI
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 150_000
        estate_income: 10_000
        estate_income_net_investment_income_adjustment: 4_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 20_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    adjusted_gross_income: 160_000
    niit_magi: 160_000 + 4_000 + 20_000

- name: An entered worksheet amount replaces the default, leaving out housing amounts
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 150_000
        qualified_dividend_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        # Form 2555 line 45 is 100,000: a 70,000 foreign earned income
        # exclusion (line 42) and a 30,000 housing exclusion (line 36).
        # Section 1411(d) adds back only the line 42 amount.
        foreign_earned_income_exclusion: 100_000
        niit_magi_section_911_addition: 70_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    adjusted_gross_income: 200_000
    niit_magi: 270_000

- name: A negative entered addition leaves MAGI at AGI
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 150_000
    tax_units:
      tax_unit:
        members: [person1]
        niit_magi_section_911_addition: -5_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Section 1411(d) adds "the excess (if any)", never a negative amount.
    niit_magi: 150_000

- name: An entered worksheet amount restores itemized deductions netted out of the exclusion
  period: 2025
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 150_000
        qualified_dividend_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        # Foreign Earned Income Tax Worksheet line 2c: a 100,000 foreign
        # earned income exclusion (Form 2555 lines 42 and 45, no housing)
        # less 5,000 of itemized deductions disallowed because they relate
        # to it (line 2b). Section 1411(d)(2) subtracts only deductions
        # taken into account in computing AGI, so the addition is 100,000.
        foreign_earned_income_exclusion: 95_000
        niit_magi_section_911_addition: 100_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    adjusted_gross_income: 200_000
    niit_magi: 300_000
