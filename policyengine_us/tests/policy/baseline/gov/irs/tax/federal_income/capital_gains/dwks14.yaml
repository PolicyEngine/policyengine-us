# Schedule D Tax Worksheet line 14 (Qualified Dividends and Capital Gain Tax
# Worksheet line 5): line 1 less line 13. A Form 2555 filer enters line 3 of
# the Foreign Earned Income Tax Worksheet on line 1 and refigures line 13 for
# any capital gain excess.
- name: Line 1 less line 13 without an exclusion
  period: 2025
  input:
    taxable_income: 40_000
    long_term_capital_gains: 30_000
    foreign_earned_income_exclusion: 0
  output:
    dwks14: 10_000

- name: An exclusion raises line 1
  period: 2025
  input:
    taxable_income: 40_000
    long_term_capital_gains: 30_000
    foreign_earned_income_exclusion: 30_000
  output:
    dwks14: 40_000

- name: A capital gain excess leaves the excluded amount on line 14
  period: 2025
  input:
    taxable_income: 34_250
    long_term_capital_gains: 50_000
    foreign_earned_income_exclusion: 100_000
  output:
    # Excess 15,750: line 13 = 34,250 and line 1 = 134,250.
    section_911_capital_gain_excess: 15_750
    dwks14: 100_000

- name: With no taxable income line 14 is the excluded amount
  period: 2025
  input:
    taxable_income: 0
    qualified_dividend_income: 3_000
    foreign_earned_income_exclusion: 130_000
  output:
    # Form 6251 line 20 takes this amount. The Form 1040 worksheet is not
    # completed when taxable income is zero, but 26 U.S.C. 911(f)(2)(B)(ii)
    # points line 20 at the regular tax computation of (f)(1)(A)(i), on
    # taxable income plus the excluded amount; the Form 6251 instructions for
    # line 20 likewise use line 3 of the Foreign Earned Income Tax Worksheet
    # when neither capital gains worksheet was completed.
    dwks14: 130_000

- name: The worksheet measures the excess from line 10
  period: 2025
  input:
    taxable_income: 34_250
    long_term_capital_gains: 50_000
    investment_income_elected_form_4952: 5_000
    foreign_earned_income_exclusion: 100_000
  output:
    # Net capital gain (the statute's measure) is 45,000, so the section
    # 1(h) excess is 10,750. The worksheet footnote measures it from line 10
    # (50,000 here): 15,750, which brings line 13 to 34,250 and leaves the
    # 100,000 excluded on line 14, as in the section 1(h) formulas.
    section_911_capital_gain_excess: 10_750
    dwks14: 100_000
