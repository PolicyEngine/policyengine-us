# 26 U.S.C. 1(h)(6)(A): unrecaptured section 1250 gain less the excess, if
# any, of the 1(h)(4)(B) losses over the 1(h)(4)(A) gains. Line references are
# to the 2025 Unrecaptured Section 1250 Gain Worksheet (Instructions for
# Schedule D, page 13); line 18 is Schedule D line 19. The gain before losses
# is unrecaptured_section_1250_gain_before_losses; unrecaptured_section_1250_gain
# is Schedule D line 19 as reported, already reduced, and passes through.
- name: Without losses Schedule D line 19 is the gain entered
  period: 2025
  input:
    long_term_capital_gains: 50_000
    unrecaptured_section_1250_gain_before_losses: 20_000
  output:
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: A short-term gain does not reduce it
  period: 2025
  input:
    long_term_capital_gains: 50_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: 5_000
  output:
    # Line 15 is zero when Schedule D line 7 is a gain, so line 17 = 0.
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: A short-term loss reduces it
  period: 2025
  input:
    long_term_capital_gains: 50_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -6_000
  output:
    # Line 13 = 20,000, line 15 = (6,000), line 17 = 6,000, line 18 = 14,000.
    schedule_d_unrecaptured_section_1250_gain: 14_000

- name: The 28 percent rate gain absorbs losses first
  period: 2025
  input:
    long_term_capital_gains: 50_000
    collectibles_gain_or_loss: 10_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -8_000
  output:
    # Line 14 = 10,000, line 15 = (8,000), lines 14 to 16 combined = 2,000,
    # a gain, so line 17 = 0.
    capital_gains_28_percent_rate_gain: 2_000
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: Losses beyond the 28 percent rate gain reduce it
  period: 2025
  input:
    long_term_capital_gains: 50_000
    collectibles_gain_or_loss: 10_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -15_000
  output:
    # Lines 14 to 16 combined = (5,000), line 17 = 5,000, line 18 = 15,000.
    capital_gains_28_percent_rate_gain: 0
    schedule_d_unrecaptured_section_1250_gain: 15_000

- name: The 28 percent rate gain absorbs part of a short-term loss
  period: 2025
  input:
    long_term_capital_gains: 50_000
    collectibles_gain_or_loss: 5_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -10_000
  output:
    # Line 13 = 20,000; lines 14 + 15 = 5,000 - 10,000, so line 17 = 5,000
    # and line 18 = 15,000. Net capital gain 40,000; adjusted net capital
    # gain 40,000 - (0 + 15,000) = 25,000.
    capital_gains_28_percent_rate_gain: 0
    schedule_d_unrecaptured_section_1250_gain: 15_000
    adjusted_net_capital_gain: 25_000

- name: A carryover and a short-term loss together
  period: 2025
  input:
    long_term_capital_gains: 49_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -6_000
    long_term_capital_loss_carryover: 1_000
  output:
    # Line 15 = (6,000), line 16 = (1,000), line 17 = 7,000, line 18 = 13,000.
    schedule_d_unrecaptured_section_1250_gain: 13_000

- name: A collectibles loss reduces it
  period: 2025
  input:
    long_term_capital_gains: 50_000
    collectibles_gain_or_loss: -4_000
    unrecaptured_section_1250_gain_before_losses: 20_000
  output:
    # Line 14 = (4,000), line 17 = 4,000, line 18 = 16,000.
    schedule_d_unrecaptured_section_1250_gain: 16_000

- name: Losses above the gain leave none
  period: 2025
  input:
    long_term_capital_gains: 50_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -30_000
  output:
    # Line 17 = 30,000 is more than line 13, so line 18 = 0.
    schedule_d_unrecaptured_section_1250_gain: 0

- name: A Schedule D line 18 entered directly means no excess loss
  period: 2025
  input:
    long_term_capital_gains: 50_000
    capital_gains_28_percent_rate_gain: 3_000
    unrecaptured_section_1250_gain_before_losses: 20_000
    short_term_capital_gains: -8_000
  output:
    # With a 28 percent rate gain the gains exceeded the losses, so line 17
    # is zero whatever components produced it.
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: Amounts reported as Schedule D lines 18 and 19 are not netted again
  period: 2025
  input:
    long_term_capital_gains: 50_000
    long_term_capital_gains_on_collectibles: 2_000
    unrecaptured_section_1250_gain: 20_000
    short_term_capital_gains: -8_000
  output:
    # The microdata carry PUF E24518 and E24515, lines 18 and 19 after the
    # worksheets; netting the 8,000 loss again would give 0 and 14,000.
    capital_gains_28_percent_rate_gain: 2_000
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: A reported line 19 passes through when the loss exceeds line 18
  period: 2025
  input:
    long_term_capital_gains: 50_000
    unrecaptured_section_1250_gain: 20_000
    short_term_capital_gains: -30_000
    long_term_capital_loss_carryover: 5_000
  output:
    capital_gains_28_percent_rate_gain: 0
    schedule_d_unrecaptured_section_1250_gain: 20_000

- name: A dependent's short-term loss does not reduce the head's line 19
  period: 2025
  input:
    people:
      head:
        age: 45
        long_term_capital_gains: 50_000
      child:
        age: 12
        is_tax_unit_dependent: true
        short_term_capital_gains: -6_000
    tax_units:
      tax_unit:
        members: [head, child]
        unrecaptured_section_1250_gain_before_losses: 20_000
  output:
    # Line 15 is the head's Schedule D line 7 loss: none, so line 18 = 20,000.
    schedule_d_unrecaptured_section_1250_gain: 20_000
