- name: No phase-out, no kiddie tax
  period: 2022
  input:
    amt_income: 200_000
    amt_kiddie_tax_applies: false
    employment_income: 400_000
    filing_status: SINGLE
  output:
    # Base exemption for SINGLE in 2022 is 75,900
    # income_excess = max(0, 200,000 - 539,900) = 0
    # No phase-out, full exemption of 75,900
    amt_exemption: 75_900

- name: No phase-out, kiddie tax applies with low earnings, no child limitation after 2017
  period: 2022
  input:
    amt_income: 200_000
    amt_kiddie_tax_applies: true
    employment_income: 10_000
    filing_status: SINGLE
  output:
    # Base exemption for SINGLE in 2022 is 75,900
    # reduced_exemption = 75,900 (no phase-out)
    # IRC 55(d)(4)(A)(iii): IRC 59(j) does not apply after 2017, so the
    # earnings-plus-8,200 child cap (18,200) is not applied.
    amt_exemption: 75_900

- name: Full phase-out at high income
  period: 2022
  input:
    amt_income: 1_000_000
    amt_kiddie_tax_applies: false
    employment_income: 400_000
    filing_status: SINGLE
  output:
    # Base exemption for SINGLE in 2022 is 75,900
    # income_excess = max(0, 1,000,000 - 539,900) = 460,100
    # exemption_phase_out = 0.25 * 460,100 = 115,025
    # reduced_exemption = max(0, 75,900 - 115,025) = 0
    amt_exemption: 0

- name: Partial phase-out
  period: 2022
  input:
    amt_income: 600_000
    amt_kiddie_tax_applies: false
    employment_income: 400_000
    filing_status: SINGLE
  output:
    # Base exemption for SINGLE in 2022 is 75,900
    # income_excess = max(0, 600,000 - 539,900) = 60,100
    # exemption_phase_out = 0.25 * 60,100 = 15,025
    # reduced_exemption = max(0, 75,900 - 15,025) = 60,875
    amt_exemption: 60_875

- name: Joint filers, no phase-out
  period: 2022
  input:
    amt_income: 500_000
    amt_kiddie_tax_applies: false
    employment_income: 400_000
    filing_status: JOINT
  output:
    # Base exemption for JOINT in 2022 is 118,100
    # Phase-out starts at 1,079,800
    # income_excess = max(0, 500,000 - 1,079,800) = 0
    # Full exemption of 118,100
    amt_exemption: 118_100

- name: Child limitation applies before 2018
  period: 2017
  input:
    amt_income: 200_000
    amt_kiddie_tax_applies: true
    employment_income: 10_000
    filing_status: SINGLE
  output:
    # Base exemption for SINGLE in 2017 is 54,300
    # income_excess = max(0, 200,000 - 120,700) = 79,300
    # exemption_phase_out = 0.25 * 79,300 = 19,825
    # reduced_exemption = 54,300 - 19,825 = 34,475
    # exemption_cap = 10,000 + 7,500 (child amount) = 17,500
    # amt_exemption = min(34,475, 17,500) = 17,500
    amt_exemption: 17_500

- name: 2018 single 18-year-old receives the ordinary exemption at the transition
  period: 2018
  input:
    age_head: 18
    amt_income: 0
    employment_income: 0
    filing_status: SINGLE
  output:
    amt_kiddie_tax_applies: true
    # 2018 Form 6251 instructions (Rev. February 2020), page 10:
    # https://www.irs.gov/pub/irs-prior/i6251--2018.pdf#page=10
    # The exemption for children is computed the same as for other taxpayers.
    # 70,300 - 0.25 * max(0, 0 - 500,000) = 70,300.
    amt_exemption: 70_300

- name: 2025 single 18-year-old with no earnings gets the full exemption
