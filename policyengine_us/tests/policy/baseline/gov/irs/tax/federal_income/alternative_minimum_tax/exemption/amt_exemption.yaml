# IRC 1(g)(2)(C), 59(j); 2017 Form 6251 lines 28-35, instructions p. 11:
# https://www.irs.gov/pub/irs-prior/i6251--2017.pdf#page=11
# The model backdates some 2018 parameters into 2017. Supply the historical
# upstream return amounts to isolate the AMT formulas; wages still compute
# adjusted_earnings and the erroneous child cap, rather than supplying the cap.
# 2017 regular rates: https://www.irs.gov/pub/irs-drop/rp-16-55.pdf#page=7
# Standard deduction: https://www.irs.gov/pub/irs-drop/rp-16-55.pdf#page=15
# Personal exemptions: https://www.irs.gov/pub/irs-drop/rp-16-55.pdf#page=18
- name: A joint return by young spouses receives the ordinary 2017 AMT exemption
  absolute_error_margin: 0.01
  period: 2017
  input:
    people:
      head:
        age: 18
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        employment_income: 12_000
        taxable_interest_income: 121_000
      spouse:
        age: 17
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        employment_income: 17_000
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
        tax_unit_itemizes: false
        adjusted_gross_income: 150_000
        standard_deduction: 12_700
        taxable_income_deductions: 12_700
        exemptions: 8_100
        regular_tax_before_credits: 23_777.50
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # AGI = 12,000 + 17,000 + 121,000 = 150,000.
    # Regular taxable income = 150,000 - 12,700 - 2 * 4,050 = 129,200.
    # AMTI = 150,000; below joint phase-out threshold 160,900.
    # IRC 1(g)(2)(C) excludes joint returns, so the 59(j) cap cannot apply.
    # AMT base = 150,000 - 84,500 = 65,500; tentative tax = 17,030.
    # Regular tax = 1,865 + 8,587.50 + 13,325 = 23,777.50; AMT = 0.
    taxable_income: 129_200
    amt_income: 150_000
    amt_exemption: 84_500
    amt_income_less_exemptions: 65_500
    amt_base_tax: 17_030
    alternative_minimum_tax: 0
    amt_kiddie_tax_applies: false

