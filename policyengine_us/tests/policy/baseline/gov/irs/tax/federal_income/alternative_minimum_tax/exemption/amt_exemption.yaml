- name: 2026 single 18-year-old in the phase-out range
  period: 2026
  input:
    age_head: 18
    amt_income: 600_000
    employment_income: 0
    filing_status: SINGLE
  output:
    # income_excess = max(0, 600,000 - 500,000) = 100,000
    # exemption_phase_out = 0.5 * 100,000 = 50,000
    # amt_exemption = max(0, 90,100 - 50,000) = 40,100
    amt_exemption: 40_100
