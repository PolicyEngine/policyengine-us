- name: Dataset tax unit 1032460, an election that spills into qualified dividends
  absolute_error_margin: 0.05
  period: 2025
  input:
    people:
      person1:
        age: 76
      person2:
        age: 76
        long_term_capital_gains: 1_109.12
        short_term_capital_gains: 153.57
        qualified_dividend_income: 2_804.45
        investment_income_elected_form_4952: 2_681.56
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        taxable_income: 11_777.39
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Line 8 takes the 1,109.12 of gain and line 5 the other 1,572.44 from
    # the dividends: line 6 1,232.01, line 9 0, line 10 1,232.01.
    net_capital_gain: 1_232.01
    dwks10: 1_232.01
    dwks19: 10_545.38
    # 10% x 10,545.38; the dividends are taxed at 0 percent.
    income_tax_main_rates: 1_054.54
    capital_gains_tax: 0
    regular_tax_before_credits: 1_054.54

# 26 U.S.C. 1(h)(1): with a net capital gain, "the tax imposed by this section
# for such taxable year shall not exceed the sum of" subparagraphs (A) to (F).
# The 2025 Schedule D Tax Worksheet takes "the smaller of line 45 or line 46"
# on line 47, and the Qualified Dividends and Capital Gain Tax Worksheet "the
# smaller of line 23 or line 24" on line 25. The two differ where gain taxed at
# 15 percent falls in the 12 percent bracket: in 2025 the 0 percent rate
# amount ends $125 ($250 joint, $100 head of household) below the top of that
# bracket, and in 2026 $950 ($1,900 joint, $1,250 head of household). These
# cases put that much qualified dividend income on top of ordinary income that
# fills the 0 percent rate amount. Amounts are taxed at the rates, as the Tax
# Computation Worksheet does; the Tax Table rounds within $50 rows. Line
# numbers are the Schedule D Tax Worksheet's, which gives the same tax.
- name: 2025 single, line 45 exceeds line 46 by $3.75
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: SINGLE
    taxable_income: 48_475
    qualified_dividend_income: 125
  output:
    # Line 21 = 48,350; tax 1,192.50 + 12% x 36,425 = 5,563.50.
    income_tax_main_rates: 5_563.50
    # Line 46: tax on 48,475 = 1,192.50 + 12% x 36,550 = 5,578.50.
    tax_on_taxable_income_at_main_rates: 5_578.50
    # Line 30 = 125 at 15% = 18.75, so line 45 = 5,582.25. Line 47 = 5,578.50,
    # which leaves 15.00 for the gains.
    capital_gains_tax: 15
    regular_tax_before_credits: 5_578.50

- name: 2025 joint, line 45 exceeds line 46 by $7.50
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: JOINT
    taxable_income: 96_950
    qualified_dividend_income: 250
  output:
    # Line 44: 2,385 + 12% x (96,700 - 23,850) = 11,127. Line 46: 2,385 + 12%
    # x 73,100 = 11,157. Line 45: 11,127 + 15% x 250 = 11,164.50.
    income_tax_main_rates: 11_127
    tax_on_taxable_income_at_main_rates: 11_157
    capital_gains_tax: 30
    regular_tax_before_credits: 11_157

- name: 2026 single, line 45 exceeds line 46 by $28.50
  absolute_error_margin: 0.01
  period: 2026
  input:
    filing_status: SINGLE
    taxable_income: 50_400
    qualified_dividend_income: 950
  output:
    # Rev. Proc. 2025-32, sections 4.01 (Table 3) and 4.03: the 12 percent
    # bracket ends at 50,400 and the 0 percent rate amount at 49,450.
    # Line 44: 1,240 + 12% x 37,050 = 5,686. Line 46: 5,800. Line 45: 5,686
    # + 15% x 950 = 5,828.50.
    income_tax_main_rates: 5_686
    tax_on_taxable_income_at_main_rates: 5_800
    capital_gains_tax: 114
    regular_tax_before_credits: 5_800

