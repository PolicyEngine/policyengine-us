- name: Baseline test, single filer with 10k of income
  absolute_error_margin: 0.01
  period: 2022
  input:
    taxable_income: 10_000
    filing_status: SINGLE
    income_tax_main_rates: 1_000
  output:
    regular_tax_before_credits: 1_000

- name: A Form 2555 filer without gains pays the stacked main-rates tax
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    taxable_income: 36_375
    foreign_earned_income_exclusion: 40_000
  output:
    # Foreign Earned Income Tax Worksheet: tax on 76,375 (9,977.50) less tax
    # on 40,000 (4,460.00).
    regular_tax_before_credits: 5_517.50

- name: A Form 2555 filer with a capital gain excess
  absolute_error_margin: 0.01
  period: 2025
  input:
    filing_status: SINGLE
    taxable_income: 34_250
    long_term_capital_gains: 50_000
    foreign_earned_income_exclusion: 100_000
  output:
    # Line 1 = 134,250 and the gains are cut to 34,250, so the ordinary
    # income is the 100,000 excluded and its tax cancels against line 5 of
    # the Foreign Earned Income Tax Worksheet. The regular tax is the
    # 5,137.50 of capital gains tax.
    income_tax_main_rates: 0
    capital_gains_tax: 5_137.50
    regular_tax_before_credits: 5_137.50

# Tax units from the default dataset (populace_us_2024 at
# populace-us-2024-spm-20260909), with their 2025 inputs as the
# microsimulation uprates them. In a 2025 run before #9781, these were among
# the 18 tax units whose regular_tax_before_credits fell below
# income_tax_main_rates, which understated Form 6251 line 10. All 18 elect
# under Form 4952 line 4g. net_capital_gain applied the election but worksheet
# line 10 (dwks10) did not, so worksheet line 21 (dwks19) was too small. A
# second Schedule D Tax Worksheet, which took worksheet line 28 as the smaller
# of lines 21 and 22 instead of their sum, then taxed line 23 at 15 percent
# instead of 20. Form 6251 line 10 used the smaller of that worksheet's tax and
# income_tax_main_rates. Line 10 is now the regular tax the model charges,
# income_tax_main_rates plus capital_gains_tax.
- name: Dataset tax unit 1101624, a Form 4952 election against long-term gain
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        age: 60
        long_term_capital_gains: 110_314.59
        short_term_capital_gains: 15_101.07
        qualified_dividend_income: 917.84
      person2:
        age: 58
        long_term_capital_gains: 110_314.59
        short_term_capital_gains: 15_101.07
        qualified_dividend_income: 917.84
        investment_income_elected_form_4952: 141_871.53
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        taxable_income: 3_437_082.75
        amt_income_less_exemptions: 3_447_082.75
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Schedule D Tax Worksheet: line 7 220,629.18; line 8 141,871.53; line 9
    # 78,757.65; line 6 1,835.68; line 10 80,593.33, the net capital gain.
    net_capital_gain: 80_593.33
    dwks10: 80_593.33
    # Line 21 = line 18 = 3,437,082.75 - 80,593.33.
    dwks19: 3_356_489.42
    # Line 44: 37% x 3,356,489.42 - 75,937.50. Line 34: 20% x 80,593.33.
    income_tax_main_rates: 1_165_963.59
    capital_gains_tax: 16_118.67
    # Line 47 = line 45 = 1,182,082.26 (line 46: 1,195,768.12).
    regular_tax_before_credits: 1_182_082.26
    # Form 6251: line 17 3,366,489.42; line 18 937,835.04; line 33 80,593.33
    # (20%: 16,118.67); line 38 953,953.71, below line 10.
    amt_tax_including_cg: 953_953.71
    alternative_minimum_tax: 0

- name: Dataset tax unit 1004930, an election larger than the gains and dividends
  absolute_error_margin: 0.5
  period: 2025
  input:
    people:
      person1:
        age: 85
        investment_income_elected_form_4952: 130_193.69
      person2:
        age: 85
        long_term_capital_gains: 80_880.30
        short_term_capital_gains: 10_988.80
        qualified_dividend_income: 2_748.49
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        taxable_income: 186_864.59
        amt_income_less_exemptions: 84_564.59
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Line 8 takes all 80,880.30 of the gain and line 5 the other 49,313.39
    # from the 2,748.49 of dividends, so lines 6, 9 and 10 are zero.
    net_capital_gain: 0
    dwks10: 0
    dwks19: 186_864.59
    # 11,157 + 22% x (186,864.59 - 96,950).
    income_tax_main_rates: 30_938.21
    capital_gains_tax: 0
    regular_tax_before_credits: 30_938.21
    # Form 6251 line 39: 26% x 84,564.59 = 21,986.79, below line 10.
    alternative_minimum_tax: 0

