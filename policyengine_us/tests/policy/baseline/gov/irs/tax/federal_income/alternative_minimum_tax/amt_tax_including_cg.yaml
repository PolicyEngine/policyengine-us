    # Line 31: $15,000. Line 32: $100,000. Line 33: $100,000. Line 34:
    # $20,000. Line 35: $200,000 + $100,000 + $100,000 = $400,000.
    # Line 36: $100,000. Line 37: 25% = $25,000.
