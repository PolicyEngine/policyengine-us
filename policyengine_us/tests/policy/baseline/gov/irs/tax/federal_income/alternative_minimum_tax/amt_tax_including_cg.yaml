    amt_tax_including_cg: 46_612.50

# Form 6251 (2025), line 18: "If line 17 is $239,100 or less ($119,550 or
# less if married filing separately), multiply line 17 by 26% (0.26).
# Otherwise, multiply line 17 by 28% (0.28) and subtract $4,782 ($2,391 if
# married filing separately) from the result." 26 U.S.C. 55(b)(1)(C) halves
# the breakpoint for a married individual filing a separate return, and
# 55(b)(3)(A) figures line 18 "at the rates and in the same manner" as
# 55(b)(1)(A). Lines 19 and 25 for married filing separately are $48,350
# and $300,000.
- name: Married filing separately, line 17 above the separate 28% breakpoint
  period: 2025
  input:
    filing_status: SEPARATE
    amt_income_less_exemptions: 1_061_000
    dwks10: 925_000
    dwks13: 925_000
    dwks14: 136_000
    unrecaptured_section_1250_gain: 0
  output:
    # Line 12: $1,061,000. Line 13: $925,000 ($25,000 of qualified
    # dividends and $900,000 of long-term gain). Line 14: $0.
    # Lines 15 and 16: $925,000. Line 17: $1,061,000 - $925,000 = $136,000.
    # Line 18: $136,000 > $119,550, so 28% * $136,000 - $2,391 = $35,689.
    # (The full $239,100 breakpoint would give 26% * $136,000 = $35,360.)
    # Line 19: $48,350. Line 20: $136,000. Line 21: $0.
    # Line 22: $925,000. Line 23: $0. Line 24: $925,000.
    # Line 25: $300,000. Lines 26 to 28: $0 + $136,000 = $136,000.
    # Line 29: $164,000. Line 30: $164,000. Line 31: 15% = $24,600.
    # Line 32: $164,000. Line 33: $761,000. Line 34: 20% = $152,200.
    # Line 14 is zero, so lines 35 to 37 are skipped.
    # Line 38: $35,689 + $24,600 + $152,200 = $212,489.
    amt_tax_including_cg: 212_489

- name: Married filing separately, line 17 between the separate and full breakpoints
  period: 2025
  input:
    filing_status: SEPARATE
    amt_income_less_exemptions: 250_000
    dwks10: 50_000
    dwks13: 50_000
    dwks14: 200_000
    unrecaptured_section_1250_gain: 0
  output:
    # Line 12: $250,000. Lines 13, 15 and 16: $50,000. Line 17: $200,000.
    # Line 18: 28% * $200,000 - $2,391 = $53,609 (not 26% * $200,000 =
    # $52,000). Line 21: max(0, $48,350 - $200,000) = $0. Line 22:
    # $50,000. Line 23: $0. Line 24: $50,000. Line 29: $300,000 - $200,000
    # = $100,000. Line 30: $50,000. Line 31: $7,500. Line 33: $0.
    # Line 38: $53,609 + $7,500 = $61,109.
    amt_tax_including_cg: 61_109

- name: Married filing separately, line 17 exactly at the separate breakpoint
  period: 2025
  input:
    filing_status: SEPARATE
    amt_income_less_exemptions: 169_550
    dwks10: 50_000
    dwks13: 50_000
    dwks14: 119_550
    unrecaptured_section_1250_gain: 0
  output:
    # Line 17: $119,550, which is "$119,550 or less", so line 18 is 26% *
