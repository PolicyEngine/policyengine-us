# Form 5329 Part I: IRC 72(t) and 72(q) additional tax.
- name: '$20,000 early IRA distribution, no exception: 10%'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        taxable_ira_distributions: 20000
        early_distributions_from_retirement_plans: 20000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    early_distribution_additional_tax: 2000
    form_5329_additional_taxes: 2000
