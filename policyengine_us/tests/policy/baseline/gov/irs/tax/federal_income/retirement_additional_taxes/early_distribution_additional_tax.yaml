- name: Dependent's early distribution stays off the filer's return
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        employment_income: 50000
      person2:
        age: 19
        is_tax_unit_dependent: true
        early_distributions_from_retirement_plans: 10000
    tax_units:
      tax_unit:
        members:
        - person1
        - person2
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members:
        - person1
        - person2
        state_code: TX
  output:
    early_distribution_additional_tax:
    - 0
    - 1000
    form_5329_additional_taxes: 0
