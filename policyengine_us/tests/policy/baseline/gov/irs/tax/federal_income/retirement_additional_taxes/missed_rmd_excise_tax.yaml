# IRC 401(a)(9) required minimum distributions and IRC 4974 excise (Form 5329 Part IX).
- name: 'Age 75 (born 1951): $246,000 / 24.6 = $10,000; $5,000 short at 25%'
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 75
        is_tax_unit_head: true
        rmd_ira_prior_year_end_balance: 246000
        rmd_ira_distributions_taken: 5000
    tax_units:
      tax_unit:
        members:
        - person1
    households:
      household:
        members:
        - person1
        state_code: TX
  output:
    rmd_distribution_period: 24.6
    required_minimum_distribution: 10000
    missed_rmd_excise_tax: 1250
    form_5329_additional_taxes: 1250
