# Form 6251 line 1: when Form 1040 line 15 is zero, line 11 minus line 14,
# entered as a negative amount. Line 2a adds back the standard deduction.
- name: Single filer below the standard deduction keeps a negative line 1, 2024
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 1: 5,000 - 14,600 = -9,600. Line 2a: 14,600. Line 4: 5,000.
    taxable_income: 0
    amt_income: 5_000

- name: Single filer below the standard deduction keeps a negative line 1b, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 1a: 15,750 - 0 = 15,750. Line 1b: 5,000 - 15,750 = -10,750.
    # Line 2a: 15,750. Line 4: 5,000.
    amt_income: 5_000

# 2025 Form 6251 line 1a subtracts Schedule 1-A line 37 (enhanced deduction
# for seniors) from Form 1040 line 14, so the deduction is added back.
- name: Joint filers both 70 add back the senior deduction, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 50_000
      person2:
        age: 70
        taxable_pension_income: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Line 14: standard deduction 31,500 + 2 x 1,600 = 34,700, plus the
    # senior deduction 2 x 6,000 = 12,000 (MAGI 100,000 is below 150,000):
    # 46,700. Line 15: 53,300. Line 1a: 46,700 - 12,000 = 34,700.
    # Line 1b: 100,000 - 34,700 = 65,300. Line 2a: 34,700. Line 4: 100,000.
    additional_senior_deduction: 12_000
    taxable_income: 53_300
    amt_income: 100_000

- name: Single filer 70 below the standard deduction adds back the senior deduction, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person:
        age: 70
        taxable_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 14: 15,750 + 2,000 + 6,000 = 23,750. Line 15: 0.
    # Line 1a: 23,750 - 6,000 = 17,750. Line 1b: 10,000 - 17,750 = -7,750.
    # Line 2a: 17,750. Line 4: 10,000.
    taxable_income: 0
    amt_income: 10_000

- name: Joint filers both 70 in 2029, after the senior deduction ends
  absolute_error_margin: 0.01
  period: 2029
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 50_000
      person2:
        age: 70
        taxable_pension_income: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The senior deduction is not in line 14 and is not added back, so
    # line 4 is AGI for a filer who takes the standard deduction.
    amt_income: 100_000

# 26 U.S.C. 56(b)(1)(C); 2025 Form 6251 line 2b: refunds of state and local
# taxes included in income are subtracted.
- name: Single itemizer subtracts a state income tax refund, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    tax_unit_itemizes: true
    taxable_income: 100_000
    salt_deduction: 8_000
    salt_refund_income: 2_000
    filing_status: SINGLE
  output:
    # 100,000 + 8,000 - 2,000
    amt_income: 106_000

# 26 U.S.C. 56(b)(1)(E): section 68 does not apply, so the itemized deduction
# reduction in taxable income comes back out.
- name: Single itemizer reverses the section 68 reduction, 2026
  absolute_error_margin: 0.01
  period: 2026
  input:
    tax_unit_itemizes: true
    taxable_income: 1_000_000
    salt_deduction: 10_000
    itemized_taxable_income_deductions_reduction: 5_000
    filing_status: SINGLE
  output:
    # 1,000,000 + 10,000 - 5,000
    amt_income: 1_005_000

- name: Non-itemizer has no section 68 reduction to reverse, 2026
  absolute_error_margin: 0.01
  period: 2026
  input:
    tax_unit_itemizes: false
    taxable_income: 50_000
    standard_deduction: 1_000
    itemized_taxable_income_deductions_reduction: 5_000
    filing_status: SINGLE
  output:
    amt_income: 51_000

# 2017 Form 6251 line 6 enters line 9 of the Schedule A Itemized Deductions
# Worksheet (the section 68 reduction) as a negative amount.
- name: Single itemizer reverses the 2017 overall limitation on itemized deductions
  absolute_error_margin: 0.01
  period: 2017
  input:
    tax_unit_itemizes: true
    taxable_income: 300_000
    exemptions: 4_050
    salt_deduction: 20_000
    misc_deduction: 0
    itemized_taxable_income_deductions_reduction: 4_155
    filing_status: SINGLE
  output:
    # 300,000 + 4,050 + 20,000 - 4,155
    amt_income: 319_895

- name: A dependent's state tax refund is not subtracted from the filer's AMTI, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 45
        salt_refund_income: 1_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        salt_refund_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_itemizes: true
        taxable_income: 100_000
        salt_deduction: 8_000
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, person2]
  output:
    # 100,000 + 8,000 - 1,000
    amt_income: 107_000
