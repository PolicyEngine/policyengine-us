# Form 6251 line 1: when Form 1040 line 15 is zero, line 11 minus line 14,
# entered as a negative amount. Line 2a adds back the standard deduction.
- name: Single filer below the standard deduction keeps a negative line 1, 2024
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 1: 5,000 - 14,600 = -9,600. Line 2a: 14,600. Line 4: 5,000.
    taxable_income: 0
    amt_income: 5_000

- name: Single filer below the standard deduction keeps a negative line 1b, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person:
        age: 40
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 1a: 15,750 - 0 = 15,750. Line 1b: 5,000 - 15,750 = -10,750.
    # Line 2a: 15,750. Line 4: 5,000.
    amt_income: 5_000

# 2025 Form 6251 line 1a subtracts Schedule 1-A line 37 (enhanced deduction
# for seniors) from Form 1040 line 14, so the deduction is added back.
- name: Joint filers both 70 add back the senior deduction, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 50_000
      person2:
        age: 70
        taxable_pension_income: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Line 14: standard deduction 31,500 + 2 x 1,600 = 34,700, plus the
    # senior deduction 2 x 6,000 = 12,000 (MAGI 100,000 is below 150,000):
    # 46,700. Line 15: 53,300. Line 1a: 46,700 - 12,000 = 34,700.
    # Line 1b: 100,000 - 34,700 = 65,300. Line 2a: 34,700. Line 4: 100,000.
    additional_senior_deduction: 12_000
    taxable_income: 53_300
    amt_income: 100_000

- name: Single filer 70 below the standard deduction adds back the senior deduction, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person:
        age: 70
        taxable_pension_income: 10_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Line 14: 15,750 + 2,000 + 6,000 = 23,750. Line 15: 0.
    # Line 1a: 23,750 - 6,000 = 17,750. Line 1b: 10,000 - 17,750 = -7,750.
    # Line 2a: 17,750. Line 4: 10,000.
    taxable_income: 0
    amt_income: 10_000

- name: Joint filers both 70 in 2029, after the senior deduction ends
  absolute_error_margin: 0.01
  period: 2029
  input:
    people:
      person1:
        age: 70
        taxable_pension_income: 50_000
      person2:
        age: 70
        taxable_pension_income: 50_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The senior deduction is not in line 14 and is not added back, so
    # line 4 is AGI for a filer who takes the standard deduction.
    amt_income: 100_000

# 26 U.S.C. 56(b)(1)(C); 2025 Form 6251 line 2b: refunds of state and local
# taxes included in income are subtracted.
- name: Single itemizer subtracts a state income tax refund, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    tax_unit_itemizes: true
    taxable_income: 100_000
    salt_deduction: 8_000
    salt_refund_income: 2_000
    filing_status: SINGLE
  output:
    # 100,000 + 8,000 - 2,000
    amt_income: 106_000

# 26 U.S.C. 56(b)(1)(E): section 68 does not apply, so the itemized deduction
# reduction in taxable income comes back out.
- name: Single itemizer reverses the section 68 reduction, 2026
  absolute_error_margin: 0.01
  period: 2026
  input:
    tax_unit_itemizes: true
    taxable_income: 1_000_000
    salt_deduction: 10_000
    itemized_taxable_income_deductions_reduction: 5_000
    filing_status: SINGLE
  output:
    # 1,000,000 + 10,000 - 5,000
    amt_income: 1_005_000

- name: Non-itemizer has no section 68 reduction to reverse, 2026
  absolute_error_margin: 0.01
  period: 2026
  input:
    tax_unit_itemizes: false
    taxable_income: 50_000
    standard_deduction: 1_000
    itemized_taxable_income_deductions_reduction: 5_000
    filing_status: SINGLE
  output:
    amt_income: 51_000

# 2017 Form 6251 line 6 enters line 9 of the Schedule A Itemized Deductions
# Worksheet (the section 68 reduction) as a negative amount. 26 U.S.C.
# 56(b)(1)(F) then; (E) since P.L. 116-94. A 4,155 reduction is 3% of AGI over
# 261,500, so AGI is at least 400,000 and the personal exemption has phased
# out (it does above 384,000 for a single filer).
- name: Single itemizer reverses the 2017 overall limitation on itemized deductions
  absolute_error_margin: 0.01
  period: 2017
  input:
    tax_unit_itemizes: true
    taxable_income: 300_000
    exemptions: 0
    salt_deduction: 20_000
    misc_deduction: 0
    itemized_taxable_income_deductions_reduction: 4_155
    filing_status: SINGLE
  output:
    # 300,000 + 20,000 - 4,155
    amt_income: 315_845

- name: A dependent's state tax refund is not subtracted from the filer's AMTI, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 45
        salt_refund_income: 1_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        salt_refund_income: 500
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_itemizes: true
        taxable_income: 100_000
        salt_deduction: 8_000
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, person2]
  output:
    # 100,000 + 8,000 - 1,000
    amt_income: 107_000

# End to end from wages, with the refund in AGI. 26 U.S.C. 56(b)(1)(C); 2025
# Form 6251 line 2b. Sales taxes are set to zero so the SALT deduction is the
# real estate taxes, under the 2025 cap.
- name: Single itemizer's refund enters AGI and comes back out of AMTI, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 100_000
        salt_refund_income: 2_000
        real_estate_taxes: 8_000
        home_mortgage_interest: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_itemizes: true
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # AGI 102,000; itemized deductions 8,000 + 20,000 = 28,000.
    taxable_income: 74_000
    # Line 1b 74,000 + line 2a 8,000 - line 2b 2,000 = 80,000, which is AGI
    # less the refund less the AMT's itemized deductions (102,000 - 2,000 -
    # 20,000).
    amt_income: 80_000

# End to end from wages, with the model's own 2026 section 68 reduction.
# 26 U.S.C. 56(b)(1)(E): section 68 does not apply.
- name: Single itemizer's section 68 reduction stays out of AMTI, 2026
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income: 1_000_000
        real_estate_taxes: 10_000
        home_mortgage_interest: 30_000
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_itemizes: true
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 26 U.S.C. 164(b)(7): the 2026 SALT cap of 40,400 phases down by 30% of
    # MAGI over 505,000 to its 10,000 floor at this income.
    salt_deduction: 10_000
    total_itemized_taxable_income_deductions: 40_000
    # Section 68 as amended by P.L. 119-21: 2/37 of the lesser of the itemized
    # deductions (40,000) and taxable income over the 37% bracket threshold
    # (1,000,000 - 640,600 = 359,400): 80,000 / 37.
    itemized_taxable_income_deductions_reduction: 2_162.16
    # 1,000,000 - (40,000 - 2,162.16)
    taxable_income: 962_162.16
    # 962,162.16 + 10,000 SALT - 2,162.16 = 970,000, which is AGI less the
    # AMT's itemized deductions (1,000,000 - 30,000).
    amt_income: 970_000

# 26 U.S.C. 55(d)(2): a married individual filing separately adds the lesser
# of 25% of AMTI "determined without regard to this sentence" over the amount
# at which the exemption is zero, and the exemption. 2025 Form 6251
# instructions, line 4: 25% of line 4 over 900,350. Line 4 here is already net
# of the refund (line 2b).
- name: Separate filer's additional amount is figured after the refund, 2025
  absolute_error_margin: 0.01
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 1_000_000
        salt_refund_income: 20_000
        real_estate_taxes: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SEPARATE
        tax_unit_itemizes: true
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # AGI 1,020,000, less the 20,000 refund; the only itemized deduction is
    # the SALT deduction, which line 2a adds back.
    amt_income_before_separate_addition: 1_000_000
    # min(68,500 exemption, 25% x (1,000,000 - 900,350))
    amt_separate_addition: 24_912.5
    amt_income: 1_024_912.5
