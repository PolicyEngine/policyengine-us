- name: Income tax reduced by previous credits; the CDCC was refundable in 2021 and does not precede.
  period: 2021
  input:
    new_clean_vehicle_credit_eligible: true
    income_tax_before_credits: 3_000
    cdcc: 1_000
    savers_credit: 300
  output:
    new_clean_vehicle_credit_credit_limit: 2_700

- name: The previously owned clean vehicle credit precedes the new clean vehicle credit (Form 8936, line 11).
  period: 2025
  input:
    new_clean_vehicle_credit_eligible: true
    income_tax_before_credits: 3_000
    cdcc: 1_000
    used_clean_vehicle_credit: 800
  output:
    new_clean_vehicle_credit_credit_limit: 1_200
