- name: Ineligible if IRA is in effect and hasn't bought a used EV.
  period: 2022
  input:
    purchased_qualifying_used_clean_vehicle: false
  output:
    used_clean_vehicle_credit_eligible: false

- name: Eligible if the household has a qualifying used clean vehicle and IRA is in effect (default sale price is $0).
  period: 2023
  input:
    purchased_qualifying_used_clean_vehicle: true
  output:
    used_clean_vehicle_credit_eligible: true

- name: Eligible if the household bought a qualifying used clean vehicle for $25,000 and IRA is in effect.
  period: 2023
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_000
  output:
    used_clean_vehicle_credit_eligible: true

- name: Ineligible if the household bought a qualifying used clean vehicle for $25,001 and IRA is in effect.
  period: 2023
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_001
  output:
    used_clean_vehicle_credit_eligible: false

- name: Single filer is eligible for income up to $75,000.
  period: 2023
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_000
    adjusted_gross_income: 75_000
  output:
    used_clean_vehicle_credit_eligible: true

- name: Single filer is ineligible for income above $75,000.
  period: 2023
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_000
    adjusted_gross_income: 75_001
  output:
    used_clean_vehicle_credit_eligible: false

- name: Qualifying household is eligible in 2025, before the One Big Beautiful Bill Act termination.
  period: 2025
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_000
    adjusted_gross_income: 75_000
  output:
    used_clean_vehicle_credit_eligible: true

- name: Otherwise-qualifying household is ineligible in 2026, terminated by the One Big Beautiful Bill Act (Pub. L. 119-21).
  period: 2026
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 25_000
    adjusted_gross_income: 75_000
  output:
    used_clean_vehicle_credit_eligible: false

- name: Income excluded under section 933 counts toward the income limit.
  period: 2024
  input:
    purchased_qualifying_used_clean_vehicle: true
    adjusted_gross_income: 70_000
    puerto_rico_income: 10_000
  output:
    # 26 U.S.C. 25E(b)(3): modified AGI 80,000 is over the 75,000 limit.
    used_clean_vehicle_credit_eligible: false

- name: The preceding year's modified AGI qualifies when this year's, with the section 911 add-back, does not.
  period: 2024
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 20_000
    adjusted_gross_income: 70_000
    foreign_earned_income_exclusion: 10_000
    # Form 8936 line 4: 2023 modified AGI.
    clean_vehicle_credit_prior_year_magi: 60_000
  output:
    # 26 U.S.C. 25E(b)(1): the lesser of 80,000 and 60,000 is within the
    # 75,000 limit.
    used_clean_vehicle_credit_eligible: true

- name: Neither year's modified AGI qualifies.
  period: 2024
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 20_000
    adjusted_gross_income: 70_000
    foreign_earned_income_exclusion: 10_000
    clean_vehicle_credit_prior_year_magi: 75_001
  output:
    used_clean_vehicle_credit_eligible: false

- name: After a change in filing status, the preceding year's modified AGI is tested against that year's limit.
  period: 2024
  input:
    purchased_qualifying_used_clean_vehicle: true
    used_clean_vehicle_sale_price: 20_000
    filing_status: SINGLE
    adjusted_gross_income: 100_000
    clean_vehicle_credit_prior_year_magi: 140_000
    clean_vehicle_credit_prior_year_filing_status: JOINT
  output:
    # 26 CFR 1.25E-1(c)(3): 140,000 is within the 150,000 joint limit that
    # applied to the 2023 return.
    used_clean_vehicle_credit_eligible: true
