- name: Case 1, dependent child under age 13 qualifies.
  period: 2024
  input:
    age: 12
    is_tax_unit_head: false
    is_tax_unit_spouse: false
  output:
    is_cdcc_eligible: true

- name: Case 2, dependent child age 13 does not qualify by age.
  period: 2024
  input:
    age: 13
    is_tax_unit_head: false
    is_tax_unit_spouse: false
  output:
    is_cdcc_eligible: false

- name: Case 3, disabled single tax unit head is not their own qualifying individual.
  period: 2024
  input:
    age: 40
    is_incapable_of_self_care: true
    is_tax_unit_head: true
  output:
    is_cdcc_eligible: false

- name: Case 4, disabled spouse assigned as tax unit head qualifies.
  period: 2024
  input:
    people:
      person1:
        age: 70
        is_incapable_of_self_care: true
      person2:
        age: 50
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    is_tax_unit_head: [true, false]
    is_tax_unit_spouse: [false, true]
    is_cdcc_eligible: [true, false]

# IRC 21(e)(5): a child of divorced or separated parents is the custodial
# parent's qualifying individual even when the noncustodial parent claims
# the dependent.
- name: Case 5, non-dependent child under 13 in the custodial parent's unit qualifies.
  period: 2024
  input:
    age: 5
    is_tax_unit_dependent: false
    is_tax_unit_head: false
    is_tax_unit_spouse: false
  output:
    is_cdcc_eligible: true

- name: 2025 child under 13 is not a qualifying person when the single filer can be claimed as a dependent
  period: 2025
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    # Publication 503: "Your qualifying child who is your dependent and who
    # was under age 13"; IRC 152(b)(1).
    is_cdcc_eligible: [false, false]

- name: 2025 joint return with one claimable spouse has no under-13 qualifying person (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    is_cdcc_eligible: [false, false, false]

- name: 2025 joint return with one claimable spouse has no under-13 qualifying person (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: TX
  output:
    is_cdcc_eligible: [false, false, false]

- name: 2025 disabled person still qualifies when the filer can be claimed as a dependent
  period: 2025
  input:
    people:
      filer:
        age: 30
        claimed_as_dependent_on_another_return: true
      relative:
        age: 60
        is_incapable_of_self_care: true
    tax_units:
      tax_unit:
        members: [filer, relative]
    households:
      household:
        members: [filer, relative]
        state_code: TX
  output:
    # IRC 21(b)(1)(B) determines dependency "without regard to subsections
    # (b)(1), (b)(2), and (d)(1)(B)" of section 152; Publication 503 item
    # 3(b)(iii).
    is_cdcc_eligible: [false, true]
