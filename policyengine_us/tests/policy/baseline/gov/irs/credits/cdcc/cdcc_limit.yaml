- name: Over three people, capped at $6,000 - integration
  period: 2018
  input:
    count_cdcc_eligible: 3
  output:
    cdcc_limit: 6_000

- name: One person eligible
  period: 2018
  input:
    capped_count_cdcc_eligible: 1
  output:
    cdcc_limit: 3_000

- name: No people eligible
  period: 2018
  input:
    capped_count_cdcc_eligible: 0
  output:
    cdcc_limit: 0

# IRC section 21(c): the dollar limit is reduced by the section 129 exclusion
# (Form 2441 Part III, line 27 minus line 28).
- name: Two children, limit reduced by a $5,000 section 129 exclusion
  period: 2024
  input:
    capped_count_cdcc_eligible: 2
    dependent_care_assistance_exclusion: 5_000
  output:
    # $6,000 - $5,000 = $1,000.
    cdcc_limit: 1_000

- name: One child, exclusion exceeding the limit floors it at zero
  period: 2024
  input:
    capped_count_cdcc_eligible: 1
    dependent_care_assistance_exclusion: 5_000
  output:
    # max($3,000 - $5,000, 0) = $0.
    cdcc_limit: 0

- name: Two children, exclusion reduces but does not eliminate the limit
  period: 2024
  input:
    capped_count_cdcc_eligible: 2
    dependent_care_assistance_exclusion: 2_500
  output:
    # $6,000 - $2,500 = $3,500.
    cdcc_limit: 3_500

# Section 129(a)(2)(C): a separate filer treated as unmarried under section
# 21(e)(4) excludes up to $5,000, and the whole exclusion reduces the limit.
- name: Separate filer treated as unmarried, limit reduced by the full exclusion
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
      person3:
        age: 8
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: SEPARATE
  output:
    dependent_care_assistance_exclusion: 4_000
    # $6,000 - $4,000 = $2,000.
    cdcc_limit: 2_000

# Federal Form 2441 line 27 minus line 28, with employer benefits derived
# through section 129 rather than supplied as an already excluded amount.
- name: Two children with $12,000 benefits keep a $1,000 limit in 2020
  period: 2020
  input:
    filing_status: JOINT
    capped_count_cdcc_eligible: 2
    dependent_care_employer_benefits: 12_000
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 5_000
    # $6,000 - $5,000 = $1,000.
    cdcc_limit: 1_000

- name: Two children with $12,000 benefits keep a $5,500 limit in 2021
  period: 2021
  input:
    filing_status: JOINT
    capped_count_cdcc_eligible: 2
    dependent_care_employer_benefits: 12_000
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 10_500
    # $16,000 - $10,500 = $5,500.
    cdcc_limit: 5_500

- name: Two children with $12,000 benefits return to a $1,000 limit in 2022
  period: 2022
  input:
    filing_status: JOINT
    capped_count_cdcc_eligible: 2
    dependent_care_employer_benefits: 12_000
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 5_000
    # $6,000 - $5,000 = $1,000.
    cdcc_limit: 1_000

- name: Two children with $7,000 benefits have no remaining limit in 2026
  period: 2026
  input:
    filing_status: JOINT
    capped_count_cdcc_eligible: 2
    dependent_care_employer_benefits: 7_000
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 7_000
    # max($6,000 - $7,000, 0) = $0.
    cdcc_limit: 0

- name: Separate filer treated as unmarried reduces the 2021 limit by $10,500
  period: 2021
  input:
    people:
      head:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 12_000
        is_separated: true
      child1:
        age: 5
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [head, child1, child2]
        filing_status: SEPARATE
  output:
    cdcc_treated_as_unmarried: true
    dependent_care_assistance_exclusion: 10_500
    cdcc_limit: 5_500

- name: The 2021 earned-income limit also controls the CDCC limit reduction
  period: 2021
  input:
    filing_status: JOINT
    capped_count_cdcc_eligible: 2
    dependent_care_employer_benefits: 12_000
    min_head_spouse_earned: 6_000
  output:
    dependent_care_assistance_exclusion: 6_000
    # $16,000 - $6,000 = $10,000.
    cdcc_limit: 10_000
