# IRC 21(b)(2) and 129(e)(1); Form 2441 Part III line 16 has no
# CDCC dollar cap and does not first subtract excluded employer benefits.
- name: Case 1, no qualifying individual means no qualified care expenses.
  period: 2017
  input:
    count_cdcc_eligible: 0
    tax_unit_childcare_expenses: 5_000
    care_expenses: 2_000
  output:
    cdcc_qualified_care_expenses: 0

- name: Case 2, qualified care combines child and disabled-adult expenses before dollar limits.
  period: 2021
  input:
    count_cdcc_eligible: 2
    tax_unit_childcare_expenses: 12_000
    care_expenses: 2_000
  output:
    cdcc_qualified_care_expenses: 14_000

- name: Case 3, a qualifying disabled adult can have care expenses without childcare.
  period: 2025
  input:
    count_cdcc_eligible: 1
    tax_unit_childcare_expenses: 0
    care_expenses: 2_000
  output:
    cdcc_qualified_care_expenses: 2_000

- name: Case 4, negative reported care costs do not create negative qualified expenses.
  period: 2017
  input:
    count_cdcc_eligible: 1
    tax_unit_childcare_expenses: -100
  output:
    cdcc_qualified_care_expenses: 0

- name: Case 5, the 2025 expense and wage chains compute without a DCAP cycle.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 100_000
        dependent_care_employer_benefits: 3_000
      person2:
        age: 5
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_pre_subsidy_childcare_expenses: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    tax_unit_childcare_expenses: 5_000
    cdcc_qualified_care_expenses: 5_000
    dependent_care_assistance_exclusion: 3_000
    taxable_dependent_care_benefits: [0, 0]
    irs_employment_income: [97_000, 0]
    cdcc_relevant_expenses: 0
