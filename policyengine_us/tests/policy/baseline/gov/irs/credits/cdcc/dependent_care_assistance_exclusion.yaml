    dependent_care_assistance_exclusion: 5_250

- name: The cap returns to $5,000 for 2022
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 40_000
    tax_units:
      tax_unit:
        cdcc_qualified_care_expenses: 20_000
        members: [head, spouse]
        filing_status: JOINT
  output:
    # Section 129(a)(2)(D) covers only taxable years beginning in 2021.
    # min($9,000 benefits, $5,000 cap, $40,000 lesser earnings) = $5,000.
    dependent_care_assistance_exclusion: 5_000

