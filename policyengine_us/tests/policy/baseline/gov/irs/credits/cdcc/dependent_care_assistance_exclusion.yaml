# IRC section 129 dependent care assistance exclusion, as reconciled on
# Form 2441 Part III. Dollar/earnings-limit unit cases explicitly supply
# sufficient qualified expenses; the full-household cases also test that limit.
# The exclusion is the lesser of qualified expenses, employer benefits,
# the section 129(a)(2)(A) dollar cap (by filing status), and the section
# 129(b) earned-income limit.

- name: No employer dependent care benefits gives no exclusion
  period: 2024
  input:
    cdcc_qualified_care_expenses: 20_000
    dependent_care_employer_benefits: 0
    filing_status: JOINT
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 0

# IRC 129(e)(1) adopts 21(b)(2), which requires a qualifying individual.
# 21(b)(1)(A) uses the dependent-child test; only the disabled-person branch
# 21(b)(1)(B) disregards 152(b)(1). 2017/2025 Form 2441 instructions, PDF p1.
- name: Case 13, a claimable filer's child alone does not establish qualified DCAP expenses.
  period: 2024
  input:
    people:
      head:
        age: 22
        employment_income: 6_000
        dependent_care_employer_benefits: 5_000
        claimable_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SINGLE
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    count_cdcc_eligible: 0
    cdcc_qualified_care_expenses: 0
    dependent_care_assistance_exclusion: 0
    taxable_dependent_care_benefits: [5_000, 0]
    standard_deduction_worksheet_earned_income_person: [6_000, 0]
    basic_standard_deduction: 6_450

- name: Case 14, a claimable filer retains qualified DCAP care for an incapacitated dependent.
  period: 2024
  input:
    people:
      head:
        age: 22
        employment_income: 6_000
        dependent_care_employer_benefits: 5_000
        claimable_as_dependent_on_another_return: true
      relative:
        age: 40
        is_tax_unit_dependent: true
        is_incapable_of_self_care: true
        pre_subsidy_care_expenses: 2_000
    tax_units:
      tax_unit:
        members: [head, relative]
        filing_status: SINGLE
    households:
      household:
        members: [head, relative]
        state_code: TX
  output:
    count_cdcc_eligible: 1
    cdcc_qualified_care_expenses: 2_000
    # Box 1 wages $1,000 are the binding section 129 earned-income limit.
    dependent_care_assistance_exclusion: 1_000
    taxable_dependent_care_benefits: [4_000, 0]

