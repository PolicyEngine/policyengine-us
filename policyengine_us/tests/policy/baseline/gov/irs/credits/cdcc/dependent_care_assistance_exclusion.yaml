# Section 129(b)(1)(B): for an employee "married at the close of such taxable
# year", the exclusion cannot exceed the lesser of the employee's and the
# spouse's earned income. Section 129(a)(2)(C) imports the section 21(e)(4)
# living-apart rule only "for purposes of this paragraph" (the dollar cap),
# so a separated filer treated as unmarried for the cap is still married for
# the earned income limit. The 2025 Form 2441 line 19 instructions let that
# filer enter their own earned income; the model follows the statute.
- name: A separated filer treated as unmarried is limited by the absent spouse's earnings
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        absent_spouse_earned_income: 2_000
  output:
    cdcc_treated_as_unmarried: true
    # min($4,000 benefits, $5,000 unmarried cap, min($38,000, $2,000)).
    dependent_care_assistance_exclusion: 2_000

- name: A separate filer not living apart is limited by the spouse's earnings too
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 2_500
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
        absent_spouse_earned_income: 1_000
  output:
    cdcc_treated_as_unmarried: false
    # min($2,500 benefits, $2,500 MFS cap, min($38,000, $1,000)).
    dependent_care_assistance_exclusion: 1_000

- name: A separated head of household is limited by the absent spouse's earnings
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        absent_spouse_earned_income: 3_000
  output:
    dependent_care_assistance_exclusion: 3_000

- name: Without the absent spouse's earnings, the filer's own earnings apply
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
  output:
    absent_spouse_earned_income: 38_000
    dependent_care_assistance_exclusion: 4_000

- name: An unmarried head of household is not limited by an absent spouse's earnings
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        absent_spouse_earned_income: 0
  output:
    dependent_care_assistance_exclusion: 4_000
