# IRC section 129 dependent care assistance exclusion, as reconciled on
# Form 2441 Part III. The exclusion is the lesser of the employer benefits,
# the section 129(a)(2)(A) dollar cap (by filing status), and the section
# 129(b) earned-income limit.

- name: No employer dependent care benefits gives no exclusion
  period: 2024
  input:
    dependent_care_employer_benefits: 0
    filing_status: JOINT
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 0

- name: Benefits below the cap and earned income are excluded in full
  period: 2024
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 4_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 60_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # min($4,000 benefits, $5,000 cap, lesser earnings) = $4,000.
    dependent_care_assistance_exclusion: 4_000

- name: Section 129(a)(2)(A) dollar cap limits the exclusion (joint)
  period: 2024
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 6_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 60_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # min($6,000 benefits, $5,000 cap, lesser earnings) = $5,000.
    dependent_care_assistance_exclusion: 5_000

- name: Section 129(b) earned-income limit caps the exclusion
  period: 2024
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 5_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 2_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # min($5,000 benefits, $5,000 cap, $2,000 lesser earnings) = $2,000.
    dependent_care_assistance_exclusion: 2_000

- name: Married filing separately uses the $2,500 cap
  period: 2024
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
  output:
    # min($5,000 benefits, $2,500 MFS cap, earnings) = $2,500.
    dependent_care_assistance_exclusion: 2_500

- name: OBBBA raises the joint cap to $7,500 for 2026
  period: 2026
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 7_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 60_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # Benefits ($7,000) below the new $7,500 cap and below earnings, so the
    # full amount is excluded. (Input uprating is disabled for a clean check.)
    dependent_care_assistance_exclusion: 7_000

# Section 129(a)(2)(C) determines marital status under section 21(e)(3) and
# (4): a separate filer living apart from their spouse while maintaining a
# home for a qualifying individual is not married for the dollar cap.
- name: Separate filer treated as unmarried uses the $5,000 cap
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 4_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
  output:
    cdcc_treated_as_unmarried: true
    # min($4,000 benefits, $5,000 unmarried cap, $38,000 earnings) = $4,000.
    dependent_care_assistance_exclusion: 4_000

- name: Separate filer treated as unmarried uses the $7,500 cap for 2026
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 7_000
        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
  output:
    # min($7,000 benefits, $7,500 unmarried cap, $38,000 earnings) = $7,000.
    dependent_care_assistance_exclusion: 7_000

- name: Separate filer not living apart keeps the $3,750 cap for 2026
  period: 2026
  input:
    people:
      person1:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 7_000
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: SEPARATE
  output:
    cdcc_treated_as_unmarried: false
    # min($7,000 benefits, $3,750 MFS cap, $38,000 earnings) = $3,750.
    dependent_care_assistance_exclusion: 3_750
# Section 129(a)(2)(D) (ARPA section 9632): for taxable years beginning in
# 2021 the cap is $10,500 ($5,250 for a separate return). 2021 Form 2441
# line 21 prints "$10,500 ($5,250 if married filing separately)".
- name: ARPA raises the joint cap to $10,500 for 2021
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # min($9,000 benefits, $10,500 cap, $40,000 lesser earnings) = $9,000.
    dependent_care_assistance_exclusion: 9_000

- name: The 2021 cap binds at $10,500 for a head of household
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 12_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    # min($12,000 benefits, $10,500 cap, $60,000 earnings) = $10,500.
    dependent_care_assistance_exclusion: 10_500

- name: Married filing separately uses the $5,250 cap for 2021
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
        dependent_care_employer_benefits: 6_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
  output:
    # min($6,000 benefits, $5,250 cap, $80,000 earnings) = $5,250.
    dependent_care_assistance_exclusion: 5_250

- name: The cap returns to $5,000 for 2022
  period: 2022
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 9_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # Section 129(a)(2)(D) covers only taxable years beginning in 2021.
    # min($9,000 benefits, $5,000 cap, $40,000 lesser earnings) = $5,000.
    dependent_care_assistance_exclusion: 5_000

# Adjacent-year and exact-boundary checks isolate the temporary ARPA cap.
- name: The pre-ARPA joint cap is $5,000 for 2020
  period: 2020
  input:
    filing_status: JOINT
    dependent_care_employer_benefits: 10_500
    min_head_spouse_earned: 50_000
  output:
    # min($10,500 benefits, $5,000 cap, $50,000 earnings) = $5,000.
    dependent_care_assistance_exclusion: 5_000

- name: The pre-ARPA separate cap is $2,500 for 2020
  period: 2020
  input:
    filing_status: SEPARATE
    cdcc_treated_as_unmarried: false
    dependent_care_employer_benefits: 5_250
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 2_500

- name: Benefits exactly at the joint 2021 cap are fully excluded
  period: 2021
  input:
    filing_status: JOINT
    dependent_care_employer_benefits: 10_500
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 10_500

- name: Benefits exactly at the separate 2021 cap are fully excluded
  period: 2021
  input:
    filing_status: SEPARATE
    cdcc_treated_as_unmarried: false
    dependent_care_employer_benefits: 5_250
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 5_250

- name: The 2021 earned-income limit still binds below the raised cap
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 60_000
        dependent_care_employer_benefits: 12_000
      spouse:
        is_tax_unit_spouse: true
        employment_income: 6_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    # min($12,000 benefits, $10,500 cap, $6,000 lesser earnings) = $6,000.
    min_head_spouse_earned: 6_000
    dependent_care_assistance_exclusion: 6_000

- name: Separate filer treated as unmarried uses the full $10,500 cap in 2021
  period: 2021
  input:
    people:
      head:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 12_000
        is_separated: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
  output:
    cdcc_treated_as_unmarried: true
    # Section 129(a)(2)(C) applies the unmarried $10,500 cap.
    dependent_care_assistance_exclusion: 10_500

- name: Living apart without a qualifying individual keeps the $5,250 cap in 2021
  period: 2021
  input:
    people:
      head:
        age: 35
        employment_income: 38_000
        dependent_care_employer_benefits: 12_000
        is_separated: true
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SEPARATE
  output:
    cdcc_treated_as_unmarried: false
    dependent_care_assistance_exclusion: 5_250

- name: The separate cap returns to $2,500 for 2022
  period: 2022
  input:
    filing_status: SEPARATE
    cdcc_treated_as_unmarried: false
    dependent_care_employer_benefits: 5_250
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 2_500

- name: Benefits above the 2026 joint cap are limited to $7,500
  period: 2026
  input:
    filing_status: JOINT
    dependent_care_employer_benefits: 7_501
    min_head_spouse_earned: 50_000
  output:
    dependent_care_assistance_exclusion: 7_500

- name: Benefits exactly at the 2026 separate cap are fully excluded
  period: 2026
  input:
    filing_status: SEPARATE
    cdcc_treated_as_unmarried: false
    dependent_care_employer_benefits: 3_750
    min_head_spouse_earned: 50_000
  output:
