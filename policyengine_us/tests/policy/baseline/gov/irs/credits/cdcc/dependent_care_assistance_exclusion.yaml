        is_separated: true
      person2:
        age: 5
    tax_units:
      tax_unit:
        cdcc_qualified_care_expenses: 20_000
        members: [person1, person2]
        filing_status: SEPARATE
  output:
    # min($7,000 benefits, $7,500 unmarried cap, $38,000 earnings) = $7,000.
    dependent_care_assistance_exclusion: 7_000

- name: Separate filer not living apart keeps the $3,750 cap for 2026
  period: 2026
  input:
