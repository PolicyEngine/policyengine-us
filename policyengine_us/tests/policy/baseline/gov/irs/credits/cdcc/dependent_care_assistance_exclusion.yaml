        members: [head]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    # min($12,000 benefits, $10,500 cap, $60,000 earnings) = $10,500.
    dependent_care_assistance_exclusion: 10_500

- name: Married filing separately uses the $5,250 cap for 2021
  period: 2021
  input:
    people:
      head:
        is_tax_unit_head: true
        employment_income: 80_000
