# IRA contributions cannot exceed compensation (26 U.S.C. 219(b)(1)(B)), so each
# contributor is given compensation above their contributions.
- name: Contributions larger than distributions
  period: 2023
  input:
    ira_compensation: 10_000
    traditional_ira_contributions_desired: 1_000
    traditional_401k_contributions_desired: 3_000
    traditional_403b_contributions_desired: 2_000
    roth_ira_contributions_desired: 1_000
    roth_401k_contributions_desired: 1_000
    roth_403b_contributions_desired: 1_000
    # Enough profit for the self-employed plan limit (earned income of
    # 9,293.52) to allow the full 1,000.
    self_employment_income: 10_000
    self_employed_pension_contributions_desired: 1_000
    able_contributions_person: 100
    retirement_distributions: 1_000
  output:
    savers_credit_qualified_contributions: 9_100

- name: Contributions smaller than distributions
  period: 2023
  input:
    ira_compensation: 10_000
    traditional_ira_contributions_desired: 1_000
    traditional_401k_contributions_desired: 0
    traditional_403b_contributions_desired: 0
    roth_ira_contributions_desired: 0
    roth_401k_contributions_desired: 0
    roth_403b_contributions_desired: 0
    self_employed_pension_contributions_desired: 0
    able_contributions_person: 500
    retirement_distributions: 2_000
  output:
    savers_credit_qualified_contributions: 0

- name: Self-employed pension contributions count after applying the annual additions cap
  period: 2026
  input:
    # 20% of earned income plus the 24,500 deferral limit exceeds the 72,000
    # annual additions limit at this profit.
    self_employment_income: 500_000
    self_employed_pension_contributions_desired: 100_000
  output:
    self_employed_pension_contributions: 72_000
    savers_credit_qualified_contributions: 72_000

# Pub. L. 119-21 keeps ABLE contributions by the designated beneficiary in
# the saver's credit after 2025.
- name: ABLE contributions still count in 2026
  period: 2026
  input:
    ira_compensation: 10_000
    traditional_ira_contributions_desired: 1_000
    able_contributions_person: 500
  output:
    savers_credit_qualified_contributions: 1_500

# From 2027 the credit covers ABLE contributions only, reduced by relevant
# ABLE distributions rather than retirement-plan distributions.
- name: From 2027 only ABLE contributions count
  period: 2027
  input:
    ira_compensation: 10_000
    traditional_ira_contributions_desired: 1_000
    traditional_401k_contributions_desired: 3_000
    able_contributions_person: 800
    retirement_distributions: 5_000
  output:
    # 800 of ABLE contributions; IRA and 401(k) contributions no longer
    # count, and retirement-plan distributions don't reduce them.
    savers_credit_qualified_contributions: 800

- name: From 2027 relevant ABLE distributions reduce ABLE contributions
  period: 2027
  input:
    able_contributions_person: 800
    savers_credit_relevant_able_distributions: 300
  output:
    savers_credit_qualified_contributions: 500

- name: In 2026 relevant ABLE distributions reduce ABLE contributions too
  period: 2026
  input:
    able_contributions_person: 800
    savers_credit_relevant_able_distributions: 300
  output:
    savers_credit_qualified_contributions: 500

# These cases pin the distribution list on each side of the 2027 change.
# Through 2026 retirement-plan and relevant ABLE distributions both reduce
# qualified contributions.
- name: In 2023 retirement-plan and relevant ABLE distributions both reduce contributions
  period: 2023
  input:
    ira_compensation: 10_000
    traditional_ira_contributions_desired: 1_000
    able_contributions_person: 500
    retirement_distributions: 400
    savers_credit_relevant_able_distributions: 300
  output:
    # 1,000 + 500 - 400 - 300 = 800.
    savers_credit_qualified_contributions: 800

# From 2027 relevant ABLE distributions reduce contributions, and
# retirement-plan distributions don't.
- name: In 2027 only relevant ABLE distributions reduce contributions
  period: 2027
  input:
    able_contributions_person: 800
    retirement_distributions: 400
    savers_credit_relevant_able_distributions: 300
  output:
    # 800 - 300 = 500; the 400 of retirement-plan distributions doesn't count.
    savers_credit_qualified_contributions: 500
