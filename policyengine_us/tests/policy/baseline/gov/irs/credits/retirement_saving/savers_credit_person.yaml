        filing_status: JOINT
        adjusted_gross_income: 80_499
  output:
    savers_credit_person: [200]

- name: Case 7, 2026 joint filer at the full phase-out limit.
  # 2026 joint full phase-out limit is $80,500 (IRS Notice 2025-67).
