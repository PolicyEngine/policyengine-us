- name: Case 1, 2024 joint filer just below the 50%-to-20% rate bracket boundary.
  # 2024 joint 50%/20% boundary is $46,000 (IRS Notice 2023-75).
  # AGI of $45,999 is below the threshold, so the 50% rate applies.
  # Credit: 0.5 * $2,000 = $1,000.
  period: 2024
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 45_999
  output:
    savers_credit_person: [1_000]

- name: Case 2, 2024 joint filer exactly at the 50%-to-20% rate bracket boundary.
  # 2024 joint 50%/20% boundary is $46,000 (IRS Notice 2023-75).
  # AGI of $46,000 is the inclusive maximum, so the 50% rate applies.
  # Credit: 0.5 * $2,000 = $1,000.
  period: 2024
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 46_000
  output:
    savers_credit_person: [1_000]

- name: Case 3, 2025 joint filer just below the 20%-to-10% rate bracket boundary.
  # 2025 joint 20%/10% boundary is $51,000 (IRS Notice 2024-80).
  # AGI of $50,999 is below the threshold, so the 20% rate applies.
  # Credit: 0.2 * $2,000 = $400.
  period: 2025
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 50_999
  output:
    savers_credit_person: [400]

- name: Case 4, 2025 joint filer exactly at the 20%-to-10% rate bracket boundary.
  # 2025 joint 20%/10% boundary is $51,000 (IRS Notice 2024-80).
  # AGI of $51,000 is the inclusive maximum, so the 20% rate applies.
  # Credit: 0.2 * $2,000 = $400.
  period: 2025
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 51_000
  output:
    savers_credit_person: [400]

- name: Case 5, 2025 head of household filer at the credit phase-out limit.
  # 2025 HoH full phase-out limit is $59,250 (0.75 x joint $79,000, IRS Notice 2024-80).
  # AGI at this inclusive maximum receives the 10% rate.
  period: 2025
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 59_250
  output:
    savers_credit_person: [200]

- name: Case 6, 2026 joint filer just below the 10%-to-0% phase-out boundary.
  # 2026 joint full phase-out limit is $80,500 (IRS Notice 2025-67).
  # AGI of $80,499 is below the threshold, so the 10% rate still applies.
  # Credit: 0.1 * $2,000 = $200.
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 80_499
  output:
    savers_credit_person: [200]

- name: Case 7, 2026 joint filer at the full phase-out limit.
  # 2026 joint full phase-out limit is $80,500 (IRS Notice 2025-67).
  # AGI at this inclusive maximum receives the 10% rate.
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: JOINT
        adjusted_gross_income: 80_500
  output:
    savers_credit_person: [200]

- name: 2026 single filer exactly at the 50%-to-20% rate bracket boundary.
  # 2026 single 50%/20% boundary is $24,250 (0.5 x joint $48,500, IRS Notice 2025-67).
  # AGI of $24,250 is the inclusive maximum, so the 50% rate applies.
  # Credit: 0.5 * $2,000 = $1,000.
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_250
  output:
    savers_credit_person: [1_000]

- name: Income excluded under section 911 counts toward the rate thresholds
  period: 2024
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 22_000
        foreign_earned_income_exclusion: 2_000
  output:
    # 26 U.S.C. 25B(e): AGI without regard to section 911 is 24,000, or
    # 48,000 on the joint schedule (divided by 0.5), so the rate is 20%,
    # not the 50% that 22,000 (44,000) would give.
    savers_credit_person: 400

# Pub. L. 119-21 raises the contribution cap to $2,100 from 2027.
- name: 2027 cap of $2,100 on ABLE contributions
  period: 2027
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        able_contributions_person: 3_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
  output:
    # 50% x min(3,000, 2,100) = 1,050.
    savers_credit_person: 1_050

- name: 2026 cap stays $2,000
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        able_contributions_person: 3_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
  output:
    # 50% x min(3,000, 2,000) = 1,000.
    savers_credit_person: 1_000

# IRS Form 8880 (2017), line 9; Notice 2016-62, PDF pages 2-3.
# Each element is an independent filer with $2,000 of eligible contributions.
- name: Case 8, 2017 joint rate boundaries retain the last dollar in each band.
  period: 2017
  input:
    filing_status: [JOINT, JOINT, JOINT, JOINT, JOINT, JOINT]
    adjusted_gross_income: [37_000, 37_001, 40_000, 40_001, 62_000, 62_001]
    savers_credit_eligible_person: [true, true, true, true, true, true]
    savers_credit_qualified_contributions: [2_000, 2_000, 2_000, 2_000, 2_000, 2_000]
  output:
    savers_credit_person: [1_000, 400, 400, 200, 200, 0]

- name: Case 9, 2017 nonjoint nonhead filers use the all-other-filers column.
  # Form 8880 puts qualifying widow(er) with single and separate filers.
  period: 2017
  input:
    filing_status: [SINGLE, SINGLE, SEPARATE, SEPARATE, SURVIVING_SPOUSE, SURVIVING_SPOUSE, SINGLE, SINGLE]
    adjusted_gross_income: [18_500, 18_501, 20_000, 20_001, 31_000, 31_001, -1, 0]
    savers_credit_eligible_person: [true, true, true, true, true, true, true, true]
    savers_credit_qualified_contributions: [2_000, 2_000, 2_000, 2_000, 2_000, 2_000, 2_000, 3_000]
  output:
    savers_credit_person: [1_000, 400, 400, 200, 200, 0, 1_000, 1_000]

- name: Case 10, 2017 head-of-household rate boundaries use the published amounts.
  period: 2017
  input:
    filing_status: [HEAD_OF_HOUSEHOLD, HEAD_OF_HOUSEHOLD, HEAD_OF_HOUSEHOLD, HEAD_OF_HOUSEHOLD, HEAD_OF_HOUSEHOLD, HEAD_OF_HOUSEHOLD]
    adjusted_gross_income: [27_750, 27_751, 30_000, 30_001, 46_500, 46_501]
    savers_credit_eligible_person: [true, true, true, true, true, true]
    savers_credit_qualified_contributions: [2_000, 2_000, 2_000, 2_000, 2_000, 2_000]
  output:
    savers_credit_person: [1_000, 400, 400, 200, 200, 0]

- name: Case 11, 2018 joint thresholds remain unchanged after adding 2017 history.
