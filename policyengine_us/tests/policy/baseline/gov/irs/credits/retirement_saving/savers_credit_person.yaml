# IRA contributions cannot exceed compensation (26 U.S.C. 219(b)(1)(B)), so each
# contributor is given compensation above their contributions.
- name: joint with one eligible person
  period: 2023
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 3_000
        roth_ira_contributions_desired: 2_000
        retirement_distributions: 1_000
      person2:
        savers_credit_eligible_person: false
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 0
        roth_ira_contributions_desired: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        adjusted_gross_income: 39_000
  output:
    savers_credit_person: [1_000, 0]

