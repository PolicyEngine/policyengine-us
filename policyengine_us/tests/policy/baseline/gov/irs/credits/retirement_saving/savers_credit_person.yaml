- name: 2026 single filer exactly at the 50%-to-20% rate bracket boundary.
  # 2026 single 50%/20% boundary is $24,250 (0.5 x joint $48,500, IRS Notice 2025-67).
  # AGI of $24,250 is the inclusive maximum, so the 50% rate applies.
  # Credit: 0.5 * $2,000 = $1,000.
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 24_250
  output:
    savers_credit_person: [1_000]

- name: Income excluded under section 911 counts toward the rate thresholds
  period: 2024
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        ira_compensation: 10_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 22_000
        foreign_earned_income_exclusion: 2_000
  output:
    # 26 U.S.C. 25B(e): AGI without regard to section 911 is 24,000, or
    # 48,000 on the joint schedule (divided by 0.5), so the rate is 20%,
    # not the 50% that 22,000 (44,000) would give.
    savers_credit_person: 400

# Pub. L. 119-21 raises the contribution cap to $2,100 from 2027.
- name: 2027 cap of $2,100 on ABLE contributions
  period: 2027
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        able_contributions_person: 3_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
  output:
    # 50% x min(3,000, 2,100) = 1,050.
    savers_credit_person: 1_050

- name: 2026 cap stays $2,000
  period: 2026
  input:
    people:
      person1:
        savers_credit_eligible_person: true
        able_contributions_person: 3_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 10_000
  output:
    # 50% x min(3,000, 2,000) = 1,000.
    savers_credit_person: 1_000

