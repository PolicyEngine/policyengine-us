- name: Lots of expenditure types, eligible for rebates, below both caps.
  period: 2023
  input:
    home_energy_audit_expenditures: 1_000
    energy_efficient_door_expenditures: 1_000
    energy_efficient_insulation_expenditures: 1_000
    energy_efficient_roof_expenditures: 1_000
    energy_efficient_window_expenditures: 1_000
    heat_pump_expenditures: 1_000
    heat_pump_water_heater_expenditures: 1_000
    biomass_stove_boiler_expenditures: 1_000
    energy_efficient_central_air_conditioner_expenditures: 1_000
  output:
    # Form 5695 Part II, line 27 (the credits under the $1,200 cap):
    # Windows: $1,000 * 30% = $300, <$600 so uncapped
    # Doors: $1,000 * 30% = $300, <$500 so uncapped
    # Insulation: fully rebated
    # Central air conditioner: $1,000 * 30% = $300, uncapped
    # Audit: $1,000 * 30% = $300, capped at $150
    # Roofs no longer qualify after the Inflation Reduction Act.
    # Line 27: $300 + $300 + $0 + $300 + $150 = $1,050; line 28: $1,050.
    # Line 29h (heat pump / heat pump water heater / biomass stove/boiler):
    # Heat pump and heat pump water heater are fully rebated, biomass
    # stove/boiler $1,000 * 30% = $300 < $2,000 so uncapped.
    # Line 30: $1,050 + $300 = $1,350.
    energy_efficient_home_improvement_credit_potential: 1_350

- name: Lots of expenditure types, eligible for rebates, below both caps after rebates.
  period: 2023
  input:
    home_energy_audit_expenditures: 1_000
    energy_efficient_door_expenditures: 1_000
    energy_efficient_insulation_expenditures: 1_000
    energy_efficient_roof_expenditures: 1_000
    energy_efficient_window_expenditures: 1_000
    heat_pump_expenditures: 3_000
    heat_pump_water_heater_expenditures: 3_000
    biomass_stove_boiler_expenditures: 3_000
    energy_efficient_central_air_conditioner_expenditures: 1_000
    tax_unit_income_ami_ratio: 0
  output:
    # Line 27: as above, $1,050; line 28: $1,050.
    # Line 29h:
    # Heat pump rebate is full $3,000 (capped at $8,000)
    # Heat pump water heater is $1,750 (cap)
    # After-rebate expenditure is thus $0 + $1,250 + $3,000 = $4,250.
    # $4,250 * 30% = $1,275 < $2,000 so uncapped.
    # Line 30: $1,050 + $1,275 = $2,325.
    energy_efficient_home_improvement_credit_potential: 2_325

- name: Lots of expenditure types, ineligible for rebates, at both caps.
  period: 2023
  input:
    home_energy_audit_expenditures: 1_000
    energy_efficient_door_expenditures: 1_000
    energy_efficient_insulation_expenditures: 1_000
    energy_efficient_roof_expenditures: 1_000
    energy_efficient_window_expenditures: 1_000
    heat_pump_expenditures: 3_000
    heat_pump_water_heater_expenditures: 3_000
    biomass_stove_boiler_expenditures: 3_000
    energy_efficient_central_air_conditioner_expenditures: 1_000
    tax_unit_income_ami_ratio: 2
  output:
    # Line 27: windows $300, doors $300, insulation $1,000 * 30% = $300,
    # central air conditioner $300, audit $150, so $1,350.
    # Line 28: the smaller of $1,350 or $1,200, so $1,200.
    # Line 29h: $9,000 * 30% = $2,700, capped at $2,000.
    # Line 30: $1,200 + $2,000 = $3,200.
    energy_efficient_home_improvement_credit_potential: 3_200

- name: A furnace counts once.
  period: 2025
  input:
    qualified_furnace_or_hot_water_boiler_expenditures: 1_000
  output:
    # Form 5695 line 24d: $1,000 * 30% = $300, <$600 so uncapped.
    energy_efficient_home_improvement_credit_potential: 300

- name: Advanced main air circulating fans do not qualify after the Inflation Reduction Act.
  period: 2025
  input:
    advanced_main_air_circulating_fan_expenditures: 100
  output:
    # 26 U.S.C. 25C(d)(2) no longer lists them; Form 5695 has no line for them.
    energy_efficient_home_improvement_credit_potential: 0
