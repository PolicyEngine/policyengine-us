# Publication 525, Repayments, Example 40, in three editions. A single filer
# repaid $5,000 of income included in the prior year's income under a claim
# of right. Taxable income is $49,950 without the deduction and $44,950 with
# it; excluding the $5,000 cut the prior year's tax by $568 (2025, 2024) or
# $750 (2018). In each edition method 1, the deduction, gives less tax.
# Wages and charitable gifts are chosen to reproduce those taxable incomes:
# without the repayment, itemized deductions equal the standard deduction.
# Publication 525 figures tax with the Tax Table in 2024 and 2018 (the
# midpoint of each $50 row); PolicyEngine applies the rate schedule.

- name: Case 1, Publication 525 (2025) Example 40, the deduction gives less tax.
  # https://www.irs.gov/pub/irs-prior/p525--2025.pdf#page=36
  period: 2025
  input:
    age: 40
    employment_income: 65_700
    charitable_cash_donations: 15_750
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 568
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    claim_of_right_section_1341_eligible: true
    # Method 1: tax on $44,950 = $1,192.50 + 12% x ($44,950 - $11,925).
    # Publication 525 rounds $5,155.50 to $5,156.
    income_tax_if_claiming_claim_of_right_deduction: 5_155.5
    # Method 2: tax on $49,950, $5,903, less the $568 prior-year decrease.
    income_tax_if_claiming_claim_of_right_credit: 5_335
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    claim_of_right_credit: 0
    taxable_income: 44_950
    income_tax: 5_155.5

- name: Case 2, Publication 525 (2024) Example 40, the deduction gives less tax.
  # https://www.irs.gov/pub/irs-prior/p525--2024.pdf#page=37
  period: 2024
  input:
    age: 40
    employment_income: 64_550
    charitable_cash_donations: 14_600
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 568
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    # $1,160 + 12% x ($44,950 - $11,600) = $5,162; the Tax Table gives
    # $5,165.
    income_tax_if_claiming_claim_of_right_deduction: 5_162
    # $1,160 + $4,266 + 22% x ($49,950 - $47,150) = $6,042 (Tax Table
    # $6,048), less $568 = $5,474 (Publication 525: $5,480).
    income_tax_if_claiming_claim_of_right_credit: 5_474
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    taxable_income: 44_950
    income_tax: 5_162

- name: Case 3, Publication 525 (2018) Example 40, the deduction gives less tax.
  # https://www.irs.gov/pub/irs-prior/p525--2018.pdf#page=34
  period: 2018
  input:
    age: 40
    employment_income: 61_950
    charitable_cash_donations: 12_000
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 750
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    # $952.50 + $3,501 + 22% x ($44,950 - $38,700) = $5,828.50 (Tax Table
    # $5,834).
    income_tax_if_claiming_claim_of_right_deduction: 5_828.5
    # $4,453.50 + 22% x ($49,950 - $38,700) = $6,928.50 (Tax Table $6,934),
    # less $750 = $6,178.50 (Publication 525: $6,184).
    income_tax_if_claiming_claim_of_right_credit: 6_178.5
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    taxable_income: 44_950
    income_tax: 5_828.5

- name: Case 4, a filer who takes the standard deduction gains only from the credit.
  # Publication 525 (2025) method 2 steps: tax without the deduction, less
  # the decrease in the earlier year's tax.
  period: 2025
  input:
    age: 40
    employment_income: 40_000
    claim_of_right_repayment: 10_000
    claim_of_right_prior_year_tax_decrease: 2_200
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    # Itemizing $10,000 loses to the $15,750 standard deduction, so the
    # deduction leaves tax on $24,250 at $1,192.50 + 12% x $12,325.
    income_tax_if_claiming_claim_of_right_deduction: 2_671.5
    income_tax_if_claiming_claim_of_right_credit: 471.5
    claim_of_right_credit_applies: true
    claim_of_right_deduction: 0
    claim_of_right_credit: 2_200
    taxable_income: 24_250
    income_tax: 471.5

- name: Case 5, a prior-year decrease above the year's tax is refunded.
  # 26 U.S.C. 1341(b)(1): the excess is considered a payment of tax.
  period: 2025
  input:
    age: 40
    employment_income: 40_000
    claim_of_right_repayment: 10_000
    claim_of_right_prior_year_tax_decrease: 3_000
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    claim_of_right_credit_applies: true
    claim_of_right_credit: 3_000
    income_tax_before_refundable_credits: 2_671.5
    income_tax: -328.5

- name: Case 6, a joint return counts the spouses' repayments, not a dependent's.
  period: 2025
  input:
    people:
      person1:
        age: 45
        employment_income: 90_000
        claim_of_right_repayment: 2_000
      person2:
        age: 44
        claim_of_right_repayment: 2_000
      person3:
        age: 30
        is_tax_unit_dependent: true
        claim_of_right_repayment: 9_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        # The decrease in the couple's earlier joint tax from excluding the
        # $4,000 they repaid.
        claim_of_right_prior_year_tax_decrease: 500
        state_sales_tax: 0
        local_sales_tax: 0
    households:
      household:
        members: [person1, person2, person3]
        state_code: TX
  output:
    tax_unit_claim_of_right_repayment: 4_000
    claim_of_right_section_1341_eligible: true
    # Taxable income $90,000 - $31,500 = $58,500; tax $2,385 + 12% x
    # $34,650 = $6,543, less the $500 credit for other dependents. The
    # $4,000 deduction loses to the standard deduction.
    income_tax_if_claiming_claim_of_right_deduction: 6_043
    income_tax_if_claiming_claim_of_right_credit: 5_543
    claim_of_right_credit_applies: true
    claim_of_right_credit: 500
    income_tax: 5_543

# Combined regression for section 1341 and the charitable deduction for
# non-itemizers. Wages of $120,000 phase out all pandemic rebates. New
# Hampshire and zero sales taxes leave no state or local tax deduction.
# The single-filer rate schedules give, throughout these cases:
# 2020: $14,605.50 + 24% x (taxable income - $85,525).
# 2021: $14,751 + 24% x (taxable income - $86,375).
# https://www.irs.gov/pub/irs-prior/i1040gi--2020.pdf#page=111
# https://www.irs.gov/pub/irs-prior/i1040gi--2021.pdf

- name: Case 7, 2020 section 1341 deduction itemizes cash gifts once and forgoes line 10b.
  period: 2020
  input:
    gov.simulation.branch_to_determine_itemization: true
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 10_000
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 100
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    claim_of_right_section_1341_eligible: true
    # Deduction: Schedule A = 10,000 + 300 + 5,000 = 15,300;
    # taxable income = 120,000 - 15,300 = 104,700; tax =
    # 14,605.50 + 24% x 19,175 = 19,207.50.
    income_tax_if_claiming_claim_of_right_deduction: 19_207.5
    # Credit: line 10b = 300; AGI = 119,700; taxable income =
    # 119,700 - 12,400 = 107,300; tax = 14,605.50 + 24% x
    # 21,775 = 19,831.50, less the prior-year decrease of 100.
    income_tax_if_claiming_claim_of_right_credit: 19_731.5
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    claim_of_right_credit: 0
    tax_unit_itemizes: true
    charitable_contributions_ald: 0
    charitable_deduction_for_non_itemizers: 0
    adjusted_gross_income: 120_000
    total_itemized_taxable_income_deductions: 15_300
    taxable_income: 104_700
    # The forced-itemization branches must keep the deduction method:
    # forcing the standard deduction does not introduce a 100 credit.
    tax_liability_if_itemizing: 19_207.5
    tax_liability_if_not_itemizing: 19_831.5
    income_tax: 19_207.5

- name: Case 8, 2020 section 1341 credit preserves the above-the-line charitable deduction.
  period: 2020
  input:
    gov.simulation.branch_to_determine_itemization: true
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 10_000
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 1_000
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    # The deduction still gives Case 7's 19,207.50, but the credit now
    # gives 19,831.50 - 1,000 = 18,831.50, so it wins.
    income_tax_if_claiming_claim_of_right_deduction: 19_207.5
    income_tax_if_claiming_claim_of_right_credit: 18_831.5
    claim_of_right_credit_applies: true
    claim_of_right_deduction: 0
    claim_of_right_credit: 1_000
    tax_unit_itemizes: false
    charitable_contributions_ald: 300
    charitable_deduction_for_non_itemizers: 0
    adjusted_gross_income: 119_700
    taxable_income: 107_300
    # Keep the credit method even when forced to itemize: Schedule A =
    # 10,000 + 300 = 10,300; taxable income = 109,700; tax =
    # 14,605.50 + 24% x 24,175 - 1,000 = 19,407.50.
    tax_liability_if_itemizing: 19_407.5
    tax_liability_if_not_itemizing: 18_831.5
    income_tax: 18_831.5

- name: Case 9, 2021 section 1341 deduction itemizes cash gifts without duplicating line 12b.
  period: 2021
  input:
    gov.simulation.branch_to_determine_itemization: true
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 10_000
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 100
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    # Schedule A = 10,000 + 300 + 5,000 = 15,300; taxable income =
    # 120,000 - 15,300 = 104,700; tax = 14,751 + 24% x 18,325.
    income_tax_if_claiming_claim_of_right_deduction: 19_149
    # The standard deduction plus line 12b is 12,550 + 300 = 12,850;
    # taxable income = 107,150; tax = 14,751 + 24% x 20,775 =
    # 19,737, less the prior-year decrease of 100.
    income_tax_if_claiming_claim_of_right_credit: 19_637
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    claim_of_right_credit: 0
    tax_unit_itemizes: true
    charitable_contributions_ald: 0
    adjusted_gross_income: 120_000
    total_itemized_taxable_income_deductions: 15_300
    taxable_income_deductions: 15_300
    taxable_income: 104_700
    # Both forced-itemization branches retain the deduction method.
    tax_liability_if_itemizing: 19_149
    tax_liability_if_not_itemizing: 19_737
    income_tax: 19_149

- name: Case 10, 2021 section 1341 credit keeps cash gifts below the line.
  period: 2021
  input:
    gov.simulation.branch_to_determine_itemization: true
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 10_000
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 1_000
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    # Case 9's deduction tax is 19,149; the credit gives
    # 19,737 - 1,000 = 18,737, which is lower.
    income_tax_if_claiming_claim_of_right_deduction: 19_149
    income_tax_if_claiming_claim_of_right_credit: 18_737
    claim_of_right_credit_applies: true
    claim_of_right_deduction: 0
    claim_of_right_credit: 1_000
    tax_unit_itemizes: false
    charitable_contributions_ald: 0
    adjusted_gross_income: 120_000
    charitable_deduction_for_non_itemizers: 300
    taxable_income_deductions: 12_850
    taxable_income: 107_150
    # Forced itemization retains the credit: taxable income =
    # 120,000 - (10,000 + 300) = 109,700; tax =
    # 14,751 + 24% x 23,325 - 1,000 = 19,349.
    tax_liability_if_itemizing: 19_349
    tax_liability_if_not_itemizing: 18_737
    income_tax: 18_737

- name: Case 11, 2020 without branching counts line 10b against the section 1341 deduction.
  period: 2020
  input:
    gov.simulation.branch_to_determine_itemization: false
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 7_300
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 100
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    # With the repayment deduction, Schedule A = 7,300 + 300 + 5,000 =
    # 12,600. Not itemizing deducts 12,400 plus 300 above the line =
    # 12,700, so even the deduction method must use the standard deduction.
    # Taxable income = 120,000 - 300 - 12,400 = 107,300; tax =
    # 14,605.50 + 24% x 21,775 = 19,831.50.
    income_tax_if_claiming_claim_of_right_deduction: 19_831.5
    # The credit lowers the same tax by 100.
    income_tax_if_claiming_claim_of_right_credit: 19_731.5
    claim_of_right_credit_applies: true
    claim_of_right_deduction: 0
    claim_of_right_credit: 100
    tax_unit_itemizes: false
    charitable_contributions_ald: 300
    adjusted_gross_income: 119_700
    taxable_income: 107_300
    income_tax: 19_731.5

- name: Case 12, 2021 without branching counts line 12b against the section 1341 deduction.
  period: 2021
  input:
    gov.simulation.branch_to_determine_itemization: false
    age: 40
    employment_income: 120_000
    deductible_mortgage_interest: 7_400
    charitable_cash_donations: 300
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 100
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: NH
  output:
    # With the repayment deduction, Schedule A = 7,400 + 300 + 5,000 =
    # 12,700. The standard deduction plus line 12b is 12,550 + 300 =
    # 12,850, so neither method itemizes. Taxable income =
    # 120,000 - 12,850 = 107,150; tax = 14,751 + 24% x 20,775.
    income_tax_if_claiming_claim_of_right_deduction: 19_737
    income_tax_if_claiming_claim_of_right_credit: 19_637
    claim_of_right_credit_applies: true
    claim_of_right_deduction: 0
    claim_of_right_credit: 100
    tax_unit_itemizes: false
    charitable_contributions_ald: 0
    adjusted_gross_income: 120_000
    charitable_deduction_for_non_itemizers: 300
    taxable_income_deductions: 12_850
    taxable_income: 107_150
    income_tax: 19_637
