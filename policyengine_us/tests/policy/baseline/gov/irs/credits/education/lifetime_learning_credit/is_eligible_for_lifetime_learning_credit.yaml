- name: Student at eligible institution with TIN can qualify for LLC
  period: 2024
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
  output:
    is_eligible_for_lifetime_learning_credit: true

- name: Student must attend an eligible educational institution for LLC
  period: 2024
  input:
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
  output:
    is_eligible_for_lifetime_learning_credit: false

- name: LLC requires Form 1098-T or an exception starting in 2016
  period: 2024
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_tin: true
  output:
    is_eligible_for_lifetime_learning_credit: false

- name: LLC Form 1098-T requirement does not apply before 2016
  period: 2015
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_tin: true
  output:
    is_eligible_for_lifetime_learning_credit: true

- name: LLC accepts TIN before 2026
  period: 2025
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
    ssn_card_type: NONE
  output:
    is_eligible_for_lifetime_learning_credit: true

- name: LLC requires qualifying SSN starting in 2026
  period: 2026
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
    ssn_card_type: NONE
  output:
    is_eligible_for_lifetime_learning_credit: false

- name: Nonresident alien taxpayers cannot claim LLC
  period: 2024
  input:
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
    is_nonresident_alien_for_lifetime_learning_credit: true
  output:
    is_eligible_for_lifetime_learning_credit: false

- name: Married filing separately cannot claim LLC
  period: 2024
  input:
    filing_status: SEPARATE
    attends_eligible_educational_institution_for_lifetime_learning_credit: true
    has_lifetime_learning_credit_1098_t_or_exception: true
    has_tin: true
  output:
    is_eligible_for_lifetime_learning_credit: false


- name: 2024 student claimed as a dependent elsewhere cannot claim the credit
  period: 2024
  input:
    people:
      student:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [student]
    households:
      household:
        members: [student]
        state_code: TX
  output:
    # IRC 25A(g)(3).
    is_eligible_for_lifetime_learning_credit: false

- name: 2024 joint return with one spouse claimed elsewhere cannot claim the credit for either spouse (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    is_eligible_for_lifetime_learning_credit: [false, false]

- name: 2024 joint return with one spouse claimed elsewhere cannot claim the credit for either spouse (the claimable spouse is the spouse)
  period: 2024
  input:
    people:
      person_b:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
  output:
    is_eligible_for_lifetime_learning_credit: [false, false]

- name: 2024 joint return with neither spouse claimed keeps both students' eligibility
  period: 2024
  input:
    people:
      person_a:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
      person_b:
        age: 30
        attends_eligible_educational_institution_for_lifetime_learning_credit: true
        has_lifetime_learning_credit_1098_t_or_exception: true
        has_tin: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    is_eligible_for_lifetime_learning_credit: [true, true]
