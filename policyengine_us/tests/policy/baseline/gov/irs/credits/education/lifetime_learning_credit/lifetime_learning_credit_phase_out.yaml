- name: Income excluded under section 911 counts toward the phase-out
  period: 2024
  input:
    adjusted_gross_income: 78_000
    foreign_earned_income_exclusion: 4_000
  output:
    # 26 U.S.C. 25A(d)(2): modified AGI 82,000; (82,000 - 80,000) / 10,000.
    lifetime_learning_credit_phase_out: 0.2

- name: Income excluded under section 931 counts toward the pre-2021 phase-out
  period: 2020
  input:
    adjusted_gross_income: 58_000
    specified_possession_income: 6_000
  output:
    # Modified AGI 64,000; (64,000 - 59,000) / 10,000.
    lifetime_learning_credit_phase_out: 0.5
