- name: 2024 student claimed as a dependent elsewhere cannot claim the credit
  period: 2024
  input:
    people:
      student:
        age: 20
        is_pursuing_credential_for_american_opportunity_credit: true
        attends_eligible_educational_institution_for_american_opportunity_credit: true
        is_enrolled_at_least_half_time_for_american_opportunity_credit: true
        has_american_opportunity_credit_1098_t_or_exception: true
        has_american_opportunity_credit_institution_ein: true
        has_tin: true
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [student]
    households:
      household:
        members: [student]
        state_code: TX
  output:
    # IRC 25A(g)(3); Form 8863: "You're claimed as a dependent on another
    # person's tax return".
    is_eligible_for_american_opportunity_credit: false

- name: 2024 joint return with one spouse claimed elsewhere cannot claim the credit for either spouse (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 20
        is_pursuing_credential_for_american_opportunity_credit: true
        attends_eligible_educational_institution_for_american_opportunity_credit: true
        is_enrolled_at_least_half_time_for_american_opportunity_credit: true
        has_american_opportunity_credit_1098_t_or_exception: true
        has_american_opportunity_credit_institution_ein: true
        has_tin: true
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_pursuing_credential_for_american_opportunity_credit: true
        attends_eligible_educational_institution_for_american_opportunity_credit: true
        is_enrolled_at_least_half_time_for_american_opportunity_credit: true
        has_american_opportunity_credit_1098_t_or_exception: true
        has_american_opportunity_credit_institution_ein: true
        has_tin: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # Form 1040 instructions: "or your spouse if filing jointly".
    is_eligible_for_american_opportunity_credit: [false, false]

