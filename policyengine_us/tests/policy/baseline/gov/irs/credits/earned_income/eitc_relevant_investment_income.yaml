    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Worksheet 1: line 1 9,000 + line 13 4,000.
    # Before: 9,000 + max(0, 4,000 - 4,000) = 9,000.
    eitc_relevant_investment_income: 13_000
    eitc_investment_income_eligible: false
    eitc: 0

- name: A dependent's passive loss cannot offset the filer's passive income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 20_000
        taxable_interest_income: 9_000
        partnership_s_corp_income: 4_000
        passive_partnership_s_corp_income: 4_000
      child:
        age: 8
        is_tax_unit_dependent: true
        partnership_s_corp_income: -4_000
        passive_partnership_s_corp_income: -4_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Worksheet 1: line 1 9,000 + line 13 4,000.
    # Before: 9,000 + max(0, 4,000 - 4,000) = 9,000.
    eitc_relevant_investment_income: 13_000
    eitc_investment_income_eligible: false
    eitc: 0

- name: A negative capital gain distributions input does not offset capital gains
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 20_000
        taxable_interest_income: 7_000
        long_term_capital_gains: 5_000
        non_sch_d_capital_gains: -2_000
      child:
        age: 8
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Capital gain distributions (Form 1099-DIV box 2a) are not negative, so
    # each filer's input is floored at zero, as irs_gross_income and
    # filer_loss_limited_net_capital_gains floor it. Line 7a and AGI include
    # the full 5,000 gain: 7,000 + 5,000 = 12,000 > 11,950.
    # Before: 7,000 + max(0, 5,000 - 2,000) = 10,000, so the credit was allowed.
    eitc_relevant_investment_income: 12_000
    eitc_investment_income_eligible: false
    adjusted_gross_income: 32_000
    eitc: 0

- name: Joint filers count both spouses' income and net their capital gains, not a dependent's
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 20_000
        taxable_interest_income: 3_000
        long_term_capital_gains: 6_000
      spouse:
        age: 30
        qualified_dividend_income: 5_000
        short_term_capital_gains: -3_000
      child:
        age: 8
        is_tax_unit_dependent: true
        taxable_interest_income: 10_000
        long_term_capital_gains: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      couple:
        members: [head, spouse]
      child_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    filing_status: JOINT
    # Worksheet 1: lines 1 and 3, 3,000 + 5,000; line 7, the joint Schedule D
    # gain 6,000 - 3,000 = 3,000. Total 11,000 <= 11,950.
    # Before: 3,000 + 5,000 + 10,000 + max(0, 6,000 - 3,000 + 10,000) = 31,000,
    # so the credit was denied.
    eitc_relevant_investment_income: 11_000
    eitc_investment_income_eligible: true
    # 20,000 + 3,000 + 5,000 + 3,000
    adjusted_gross_income: 31_000
    # 4,328 - 15.98% x (31,000 - 30,470) = 4,328 - 84.694
    eitc: 4_243.31

- name: A dependent's very large gain does not move the filer across the limit from below
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 20_000
        taxable_interest_income: 11_950
        long_term_capital_gains: 1
      child:
        age: 8
        is_tax_unit_dependent: true
        long_term_capital_gains: 20_000_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # 11,950 + 1 = 11,951 > 11,950. net_capital_gains is stored in float32,
    # where 20,000,001 rounds to 20,000,000, so taking the child's gain out
    # of it would give 11,950 and allow the credit.
    eitc_relevant_investment_income: 11_951
    eitc_investment_income_eligible: false

- name: A dependent's very large gain does not move the filer across the limit from above
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 20_000
        taxable_interest_income: 11_947
        long_term_capital_gains: 3
      child:
        age: 8
        is_tax_unit_dependent: true
        long_term_capital_gains: 20_000_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # 11,947 + 3 = 11,950 <= 11,950. In float32, 20,000,003 rounds to
    # 20,000,004, so taking the child's gain out of it would give 11,951.
    eitc_relevant_investment_income: 11_950
    eitc_investment_income_eligible: true

- name: A net capital gains amount supplied for the tax unit is not read
  period: 2025
  absolute_error_margin: 0.01
  input:
    net_capital_gains: 12_000
  output:
    # Capital gains are the head's and spouse's own person-level gains, as in
    # irs_gross_income and the NIIT base, so the supplied tax unit total is
    # not read. Reading it and taking dependents' gains out of it would let a
    # dependent's large gain move the filers' amount through float32 rounding.
    # Before: 12,000.
    eitc_relevant_investment_income: 0
    adjusted_gross_income: 0

# Passive income that is also earned income, and farm rent (#9635 items 2
# and 3). 26 USC 32(i)(2)(E) determines passive income and losses "without
# regard to any amount included in earned income under subsection (c)(2)", and
# the Worksheet 1 instructions for lines 11 and 12 leave out "any income (or
# loss) included in your earned income". eitc_passive_income_also_in_earned_income
# is that amount, signed. Lines 11 and 12 name Schedule E line 40, net farm
# rental income or loss from Form 4835, which the model treats as passive.
#
# Unless noted, the household is a 35-year-old head of household in TX for
# 2025 with two qualifying children aged 15 and 5. 2025 amounts (Rev. Proc.
# 2024-40 section 2.06): investment income limit 11,950; maximum credit with
# two children 7,152; phase-out start 23,350; phase-out rate 21.06%.

- name: A general partner's passive share that is also earned income is left out
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 15_000
        taxable_interest_income: 5_000
        partnership_income: 8_000
        passive_partnership_s_corp_income: 8_000
        partnership_self_employment_net_earnings: 8_000
        eitc_passive_income_also_in_earned_income: 8_000
      child1:
        age: 15
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: TX
  output:
    # Line 1 5,000 + line 13 max(0, 8,000 - 8,000) = 5,000.
    eitc_relevant_investment_income: 5_000
    eitc_investment_income_eligible: true
    # Self-employment tax 8,000 x 0.9235 x 0.153 = 1,130.364, half deducted.
    # AGI 15,000 + 5,000 + 8,000 - 565.182 = 27,434.818 exceeds earned income
    # 22,434.818, so 7,152 - 0.2106 x (27,434.818 - 23,350) = 6,291.74.
    eitc: 6_291.74

- name: A general partner's passive loss that is also earned income does not offset rental income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        employment_income: 20_000
        taxable_interest_income: 9_000
        rental_income: 4_000
        partnership_income: -4_000
        passive_partnership_s_corp_income: -4_000
        partnership_self_employment_net_earnings: -4_000
        eitc_passive_income_also_in_earned_income: -4_000
      child1:
        age: 15
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: TX
  output:
    # 9,000 + max(0, 4,000 - 4,000 - (-4,000)) = 13,000.
    eitc_relevant_investment_income: 13_000
    eitc_investment_income_eligible: false
    eitc: 0

- name: A limited partner's passive share stays in the passive basket
