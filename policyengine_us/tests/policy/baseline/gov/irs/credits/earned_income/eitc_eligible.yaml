    filing_status: JOINT
  output:
    eitc_eligible: false

- name: Ineligible due to no ITIN nor SSN.
  period: 2022
  input:
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: true
    filer_meets_eitc_identification_requirements: false
    filing_status: JOINT
  output:
    eitc_eligible: false

- name: Demographic ineligible.
  period: 2022
  input:
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: false
    filer_meets_eitc_identification_requirements: true
    filing_status: JOINT
  output:
    eitc_eligible: false

- name: Eligible.
  period: 2022
  input:
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: true
    filer_meets_eitc_identification_requirements: true
    filing_status: JOINT
  output:
    eitc_eligible: true

# 26 U.S.C. 32(c)(1)(C): "The term 'eligible individual' does not include any
# individual who claims the benefits of section 911 (relating to citizens or
# residents living abroad) for the taxable year."
- name: Section 911 claimant is not eligible.
  period: 2025
  input:
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: true
    filer_meets_eitc_identification_requirements: true
    filing_status: JOINT
    foreign_earned_income_exclusion: 1
  output:
    eitc_eligible: false

- name: Without a section 911 exclusion the same filer is eligible.
  period: 2025
  input:
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: true
    filer_meets_eitc_identification_requirements: true
    filing_status: JOINT
    foreign_earned_income_exclusion: 0
  output:
    eitc_eligible: true

- name: Section 911 claimant is not eligible in 2021 either.
  period: 2021
  input:
    # Unlike the CTC bar, section 32(c)(1)(C) has no 2021 exception.
    eitc_investment_income_eligible: true
    eitc_demographic_eligible: true
    filer_meets_eitc_identification_requirements: true
    filing_status: SINGLE
    foreign_earned_income_exclusion: 30_000
  output:
    eitc_eligible: false
