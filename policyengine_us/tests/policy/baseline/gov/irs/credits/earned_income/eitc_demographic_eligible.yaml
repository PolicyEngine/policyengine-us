- name: No children and under 25, not eligible.
  period: 2022
  input:
    age: 24
  output:
    eitc_demographic_eligible: false

- name: No children and over 25, eligible.
  period: 2022
  input:
    age: 25
  output:
    eitc_demographic_eligible: true

- name: Children and under 25, eligible.
  period: 2022
  input:
    people:
      parent:
        age: 24
      child:
        age: 7
    tax_units:
      tax_unit:
        members: [parent, child]
  output:
    eitc_demographic_eligible: true

- name: Childless 22-year-old with a 60-year-old dependent parent is not eligible - a dependent's age does not satisfy IRC 32(c)(1)(A)(ii)(II).
  period: 2025
  input:
    people:
      filer:
        age: 22
      parent:
        age: 60
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, parent]
  output:
    eitc_demographic_eligible: false

- name: Childless 23-year-old filing jointly with a 30-year-old spouse is eligible - either spouse can satisfy the age test.
  period: 2025
  input:
    people:
      head:
        age: 30
      spouse:
        age: 23
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    eitc_demographic_eligible: true

- name: Childless 64-year-old is eligible - upper bound of the age window.
  period: 2025
  input:
    age: 64
  output:
    eitc_demographic_eligible: true

- name: Childless 65-year-old is not eligible - has attained age 65 before the close of the taxable year.
  period: 2025
  input:
    age: 65
  output:
    eitc_demographic_eligible: false

- name: Childless joint filers aged 22 and 23 are not eligible - neither spouse is in the age window.
  period: 2025
  input:
    people:
      head:
        age: 23
      spouse:
        age: 22
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    eitc_demographic_eligible: false

- name: Childless 40-year-old with a 70-year-old dependent parent is eligible - the filer's own age qualifies and the dependent's age is ignored.
  period: 2025
  input:
    people:
      filer:
        age: 40
      parent:
        age: 70
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [filer, parent]
  output:
    eitc_demographic_eligible: true

- name: 70-year-old with a qualifying child is eligible - the age test does not apply to filers with children.
  period: 2025
  input:
    people:
      parent:
        age: 70
      child:
        age: 7
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
  output:
    eitc_demographic_eligible: true

- name: Non-student in 2021 eligible at age 19.
  period: 2021
  input:
    age: 19
  output:
    eitc_demographic_eligible: true

- name: Student in 2021 not eligible at age 19.
  period: 2021
  input:
    age: 19
    is_full_time_student: true
  output:
    eitc_demographic_eligible: false

- name: 2025 childless single filer who can be claimed as a dependent is ineligible
  period: 2025
  input:
    people:
      head:
        age: 30
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [head]
  output:
    # IRC 32(c)(1)(A)(ii)(III).
    eitc_demographic_eligible: false

- name: 2025 childless joint return where one spouse can be claimed is ineligible (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: CA
  output:
    # Publication 596 (2025, p.18): "neither you nor your spouse can be claimed as a
    # dependent by another person if you claim the EIC on your joint return."
    eitc_demographic_eligible: false

- name: 2025 childless joint return where one spouse can be claimed is ineligible (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: CA
  output:
    # Publication 596 (2025, p.18): "neither you nor your spouse can be claimed as a
    # dependent by another person if you claim the EIC on your joint return."
    eitc_demographic_eligible: false

- name: 2025 joint return with a child where one spouse can be claimed (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child_1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child_1]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child_1]
        state_code: CA
  output:
    # The dependent condition in IRC 32(c)(1)(A)(ii)(III) applies only without a
    # qualifying child.
    eitc_demographic_eligible: true

- name: 2025 joint return with a child where one spouse can be claimed (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        claimed_as_dependent_on_another_return: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child_1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_b, person_a, child_1]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child_1]
        state_code: CA
  output:
    # The dependent condition in IRC 32(c)(1)(A)(ii)(III) applies only without a
    # qualifying child.
    eitc_demographic_eligible: true
