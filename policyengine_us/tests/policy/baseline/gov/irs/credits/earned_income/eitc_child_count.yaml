- name: One child meets EITC identification requirements.
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        is_qualifying_child_dependent: true
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    eitc_child_count: 1

- name: Both children meets EITC identification requirements.
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        is_qualifying_child_dependent: true
        meets_eitc_identification_requirements: true
      person3:
        is_qualifying_child_dependent: true
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
  output:
    eitc_child_count: 2

- name: Two children, one of them meet EITC identification requirements.
  period: 2023
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        is_qualifying_child_dependent: true
        meets_eitc_identification_requirements: true
      person3:
        is_qualifying_child_dependent: true
        meets_eitc_identification_requirements: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
  output:
    eitc_child_count: 1

- name: Case 4, disabled adult dependent meets the EITC child count.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        is_permanently_and_totally_disabled: true
        is_tax_unit_dependent: true
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    eitc_child_count: 1

- name: Case 5, disabled non-dependent does not meet the EITC child count.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        is_permanently_and_totally_disabled: true
        is_tax_unit_dependent: false
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    eitc_child_count: 0

- name: Case 6, disabled parent dependent fails the relationship test.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        age: 75
        is_permanently_and_totally_disabled: true
        is_tax_unit_dependent: true
        is_parent_of_filer_or_spouse: true
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    # IRC 152(c)(2): a parent is a qualifying relative, not a qualifying child.
    eitc_child_count: 0

- name: Case 7, disabled grandparent dependent fails the relationship test.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        meets_eitc_identification_requirements: true
      person2:
        age: 85
        is_permanently_and_totally_disabled: true
        is_tax_unit_dependent: true
        is_grandparent_of_filer_or_spouse: true
        meets_eitc_identification_requirements: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    eitc_child_count: 0

- name: Case 8, federal EITC uses the childless schedule for a filer supporting a disabled parent.
  period: 2023
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 6_000
      parent:
        age: 75
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        is_permanently_and_totally_disabled: true
        is_parent_of_filer_or_spouse: true
    tax_units:
      tax_unit:
        members: [head, parent]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    eitc_child_count: 0
    # Rev. Proc. 2022-38: 7.65% x 6,000 = 459, not the one-child 34% x 6,000.
    eitc: 459
