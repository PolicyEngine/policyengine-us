# IRC 32(c)(1)(A)(ii)(II): a filer without a qualifying child must have
# "attained age 25 but not attained age 65 before the close of the taxable
# year". gov.irs.credits.eitc.eligibility.age.max is the highest completed age
# that qualifies (64; no limit in 2021 under ARPA's 32(n)(2)), so the test
# compares completed years.

- name: Childless filer aged 64.0 meets the age test, 2024
  period: 2024
  input:
    people:
      filer:
        age: 64.0
        is_tax_unit_head: true
        ssn_card_type: CITIZEN
        employment_income: 8_000
    tax_units:
      unit:
        members: [filer]
        filing_status: SINGLE
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
  output:
    # Completed age 64 <= 64.
    eitc_demographic_eligible: true
    # 7.65% x $8,000 = $612, under the $632 maximum and the $10,330 phase-out start.
    eitc: 612

- name: Childless filer aged 64.5 has not attained 65 and meets the age test, 2024
  period: 2024
  input:
    people:
      filer:
        age: 64.5
        is_tax_unit_head: true
        ssn_card_type: CITIZEN
        employment_income: 8_000
    tax_units:
      unit:
        members: [filer]
        filing_status: SINGLE
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
  output:
    # Completed age 64 <= 64; main tested 64.5 <= 64 and failed.
    eitc_demographic_eligible: true
    # 7.65% x $8,000 = $612, under the $632 maximum and the $10,330 phase-out start.
    eitc: 612

- name: Childless filer aged 65.0 has attained 65 and fails the age test, 2024
  period: 2024
  input:
    people:
      filer:
        age: 65.0
        is_tax_unit_head: true
        ssn_card_type: CITIZEN
        employment_income: 8_000
    tax_units:
      unit:
        members: [filer]
        filing_status: SINGLE
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
  output:
    # Completed age 65 > 64.
    eitc_demographic_eligible: false
    eitc: 0

