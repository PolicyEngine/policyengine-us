        adjusted_gross_income: 6_000
        eitc_relevant_investment_income: 0
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
  output:
    # Before 2021 the identification-filtered count decides, as on main: the
    # filer is under the childless minimum age of 25.
    eitc_child_count: 0
    eitc_demographic_eligible: false
    eitc: 0

- name: TY2023 parent age 20 whose child has an SSN gets the one-child credit
  period: 2023
  input:
    people:
      filer:
        age: 20
        is_tax_unit_head: true
        is_full_time_student: false
        is_eitc_qualifying_child: false
        ssn_card_type: CITIZEN
      child:
        age: 2
        is_tax_unit_dependent: true
        is_eitc_qualifying_child: true
        ssn_card_type: CITIZEN
    tax_units:
      unit:
        members: [filer, child]
        filing_status: SINGLE
        eitc_earned_income: 8_000
        adjusted_gross_income: 8_000
        eitc_relevant_investment_income: 0
        would_file_taxes_voluntarily: true
        takes_up_eitc: true
  output:
    eitc_child_count: 1
    eitc_demographic_eligible: true
    eitc_eligible: true
    # One child: 34% x $8,000 = $2,720, below the $3,995 maximum.
    eitc: 2_720

