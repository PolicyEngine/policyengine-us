- name: Child of a filer without an SSN meets the qualifying child tests in 2026
  period: 2026
  input:
    people:
      parent:
        age: 35
        ssn_card_type: NONE
      child:
        age: 8
        is_tax_unit_dependent: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    ctc_qualifying_child_ignoring_filer_identification: [false, true]

- name: Child aged 17 does not meet the qualifying child tests in 2026
  period: 2026
  input:
    people:
      parent:
        age: 45
        ssn_card_type: NONE
      child:
        age: 17
        is_tax_unit_dependent: true
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    ctc_qualifying_child_ignoring_filer_identification: [false, false]

