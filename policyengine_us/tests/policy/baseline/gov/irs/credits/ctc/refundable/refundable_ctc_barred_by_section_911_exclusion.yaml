# Section 24(d)(3): "Paragraph (1) shall not apply to any taxpayer for any
# taxable year if such taxpayer elects to exclude any amount from gross
# income under section 911 for such taxable year."
- name: Any section 911 exclusion bars the refundable credit
  period: 2025
  input:
    foreign_earned_income_exclusion: 1
  output:
    refundable_ctc_barred_by_section_911_exclusion: true

- name: No section 911 exclusion, no bar
  period: 2025
  input:
    foreign_earned_income_exclusion: 0
  output:
    refundable_ctc_barred_by_section_911_exclusion: false

- name: The bar did not exist before 2015
  period: 2014
  input:
    # Public Law 114-27, section 807, applies to taxable years beginning
    # after December 31, 2014.
    foreign_earned_income_exclusion: 30_000
  output:
    refundable_ctc_barred_by_section_911_exclusion: false

- name: The bar applies from 2015
  period: 2015
  input:
    foreign_earned_income_exclusion: 30_000
  output:
    refundable_ctc_barred_by_section_911_exclusion: true

- name: No bar in the fully refundable year
  period: 2021
  input:
    # Section 24(i)(1)(A): subsection (d) does not apply to filers living in
    # the United States or Puerto Rico, which the model assumes.
    foreign_earned_income_exclusion: 30_000
  output:
    refundable_ctc_barred_by_section_911_exclusion: false

- name: The bar can be switched off
  period: 2025
  input:
    gov.irs.credits.ctc.refundable.foreign_earned_income_exclusion_bar_applies: false
    foreign_earned_income_exclusion: 30_000
  output:
    refundable_ctc_barred_by_section_911_exclusion: false
