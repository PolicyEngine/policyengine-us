- name: Applies with a qualifying child.
  period: 2025
  input:
    ctc_qualifying_children: 1
  output:
    ctc_credit_limit_worksheet_b_applies: true

- name: Does not apply without a qualifying child (Schedule 8812, line 4 is zero).
  period: 2025
  input:
    ctc_qualifying_children: 0
  output:
    ctc_credit_limit_worksheet_b_applies: false

- name: Does not apply to filers of Form 2555.
  period: 2025
  input:
    ctc_qualifying_children: 2
    foreign_earned_income_exclusion: 10_000
  output:
    ctc_credit_limit_worksheet_b_applies: false

- name: Does not apply in 2021, when the CTC was fully refundable.
  period: 2021
  input:
    ctc_qualifying_children: 2
  output:
    ctc_credit_limit_worksheet_b_applies: false

- name: Applies before 2021 too (2020 Publication 972, Line 14 Worksheet).
  period: 2020
  input:
    ctc_qualifying_children: 1
  output:
    ctc_credit_limit_worksheet_b_applies: true

- name: Before 2015 Worksheet B still applies to Form 2555 filers (the section 911 bar starts in 2015).
  period: 2014
  input:
    ctc_qualifying_children: 2
    foreign_earned_income_exclusion: 10_000
  output:
    ctc_credit_limit_worksheet_b_applies: true

# Worksheet B reads the section 24(d)(3) bar rather than repeating its test, so
# a bar set as an input decides both the refund and the worksheet.
- name: Does not apply when the section 24(d)(3) bar is set as an input, even without an exclusion.
  period: 2025
  input:
    ctc_qualifying_children: 2
    foreign_earned_income_exclusion: 0
    refundable_ctc_barred_by_section_911_exclusion: true
  output:
    ctc_credit_limit_worksheet_b_applies: false

- name: Applies to a Form 2555 filer when the section 24(d)(3) bar is set to false as an input.
  period: 2025
  input:
    ctc_qualifying_children: 2
    foreign_earned_income_exclusion: 10_000
    refundable_ctc_barred_by_section_911_exclusion: false
  output:
    ctc_credit_limit_worksheet_b_applies: true
