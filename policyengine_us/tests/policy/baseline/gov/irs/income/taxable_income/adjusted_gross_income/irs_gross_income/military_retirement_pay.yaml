# IRC § 61(a)(11) includes pensions, including military retirement pay and
# military retirement survivor benefit payments, in gross income.
# Military retirement pay is also market income, SNAP unearned income,
# and SSI unearned income.

- name: Military retirement pay flows into federal gross income, AGI, and taxable income
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 60
        is_tax_unit_head: true
        military_retirement_pay: 30_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    irs_gross_income: 30_000
    adjusted_gross_income: 30_000
    market_income: 30_000
    snap_unearned_income: 30_000
    ssi_unearned_income: 30_000

- name: Military retirement pay survivors flows into federal gross income, AGI, and taxable income
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 60
        is_tax_unit_head: true
        military_retirement_pay_survivors: 25_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    irs_gross_income: 25_000
    adjusted_gross_income: 25_000
    market_income: 25_000
    snap_unearned_income: 25_000
    ssi_unearned_income: 25_000

- name: Military retirement pay adds with employment income
  period: 2024
  input:
    people:
      person:
        age: 50
        is_tax_unit_head: true
        employment_income: 40_000
        military_retirement_pay: 20_000
        military_retirement_pay_survivors: 10_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code: TX
  output:
    irs_gross_income: 70_000
    adjusted_gross_income: 70_000
    market_income: 70_000

- name: Dependent military retirement pay is excluded from the tax unit filer gross income
  period: 2024
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      dependent:
        age: 18
        is_tax_unit_dependent: true
        military_retirement_pay_survivors: 15_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: TX
  output:
    irs_gross_income: [50_000, 0]
    adjusted_gross_income: 50_000
