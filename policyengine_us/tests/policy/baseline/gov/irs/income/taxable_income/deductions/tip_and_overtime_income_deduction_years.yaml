# The tips (26 U.S.C. 224) and overtime (26 U.S.C. 225) deductions apply to
# taxable years beginning after December 31, 2024 (Pub. L. 119-21, secs.
# 70201(j) and 70202(g)), and 224(h) and 225(g) allow neither for any taxable
# year beginning after December 31, 2028. The same single filer, below the
# $150,000 phase-out start, is run in each year.

- name: 2024, before the deductions take effect, neither is allowed.
  period: 2024
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0
    overtime_income_deduction: 0

- name: 2025, the first year, both deductions are allowed.
  period: 2025
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000
    overtime_income_deduction: 5_000

- name: 2028, the last year, both deductions are allowed.
  period: 2028
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000
    overtime_income_deduction: 5_000

- name: 2029, after 224(h) and 225(g) end the deductions, neither is allowed.
  period: 2029
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0
    overtime_income_deduction: 0

- name: 2030, later years stay at zero.
  period: 2030
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0
    overtime_income_deduction: 0

- name: 2029, a reform that keeps the deductions in effect restores them.
  period: 2029
  input:
    gov.irs.deductions.tip_income.in_effect: true
    gov.irs.deductions.overtime_income.in_effect: true
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000
    overtime_income_deduction: 5_000
