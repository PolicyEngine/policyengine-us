- name: 2022, joint return with two eligible educators, each capped at $300
  period: 2022
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
        educator_expense: 450
      spouse:
        age: 38
        employment_income: 40_000
        educator_expense: 250
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # The head's $450 is capped at $300; the spouse's $250 is below the cap.
    # The head's unused room does not carry to the spouse: 300 + 250 = 550.
    educator_expense_ald_person: [300, 250]
    educator_expense_ald: 550
    above_the_line_deductions: 550
    adjusted_gross_income: 89_450

