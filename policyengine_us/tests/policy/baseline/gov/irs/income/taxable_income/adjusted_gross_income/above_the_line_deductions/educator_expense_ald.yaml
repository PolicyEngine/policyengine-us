# Educator expense deduction, 26 USC 62(a)(2)(D) and (d): each eligible
# educator deducts their qualified expenses up to the cap, $250 through 2021
# and $300 for 2022 through 2025 (Rev. Procs. 2020-45 sec. 3.14, 2021-45
# sec. 3.13). The Form 1040 instructions for Schedule 1, line 11 (2021, p. 88;
# 2022, p. 87) give the joint return rule: "If you and your spouse are filing
# jointly and both of you were eligible educators, the maximum deduction is
# $600. However, neither spouse can deduct more than $300 of their qualified
# expenses" ($500 and $250 for 2021).

- name: 2021, expenses below the $250 cap are deducted in full
  period: 2021
  input:
    people:
      teacher:
        age: 40
        employment_income: 50_000
        educator_expense: 200
    tax_units:
      tax_unit:
        members: [teacher]
    households:
      household:
        members: [teacher]
        state_code: TX
  output:
    educator_expense_ald_person: 200
    educator_expense_ald: 200
    above_the_line_deductions: 200
    adjusted_gross_income: 49_800

- name: 2021, expenses at the $250 cap are deducted in full
  period: 2021
  input:
    people:
      teacher:
        age: 40
