- name: 2022, a dependent's educator expenses stay off the filer's return
  period: 2022
  input:
    people:
      parent:
        age: 50
        is_tax_unit_head: true
        employment_income: 60_000
        educator_expense: 100
      student:
        age: 22
        is_full_time_student: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        employment_income: 3_000
        educator_expense: 400
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: TX
  output:
    # The student's own amount is capped for their own return; only the
    # head's $100 is on this one.
    educator_expense_ald_person: [100, 300]
    educator_expense_ald: 100
    above_the_line_deductions: 100
    adjusted_gross_income: 59_900
