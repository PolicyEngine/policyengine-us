- name: Senate version of auto loan interest deduction
  period: 2026
  input:
    irs_gross_income: 220_000
    filing_status: JOINT
    qualified_passenger_vehicle_loan_interest: 20_000
    standard_deduction: 0
    tax_unit_itemizes: false
  output:
    auto_loan_interest_deduction: 6_000
    adjusted_gross_income: 220_000
    taxable_income_deductions: 6_000

- name: Senate version of auto loan interest deduction, itemizing
  period: 2026
  input:
    irs_gross_income: 220_000
    filing_status: JOINT
    qualified_passenger_vehicle_loan_interest: 20_000
    standard_deduction: 0
    tax_unit_itemizes: true
    salt_deduction: 10_000
  output:
    auto_loan_interest_deduction: 6_000
    adjusted_gross_income: 220_000
    taxable_income_deductions: 16_000

- name: Generic auto loan interest is not deductible without qualified interest
  period: 2026
  input:
    irs_gross_income: 220_000
    filing_status: JOINT
    auto_loan_interest: 20_000
    standard_deduction: 0
    tax_unit_itemizes: false
  output:
    auto_loan_interest_deduction: 0
    taxable_income_deductions: 0

- name: Income excluded under section 933 counts toward the phase-out
  period: 2025
  input:
    adjusted_gross_income: 95_000
    puerto_rico_income: 10_000
    filing_status: SINGLE
    qualified_passenger_vehicle_loan_interest: 5_000
  output:
    # 26 U.S.C. 163(h)(4)(C)(ii)(II): modified AGI 105,000; five $1,000
    # steps over 100,000 at $200 each.
    auto_loan_interest_deduction: 4_000

- name: Surviving spouse uses the $100,000 threshold
  period: 2025
  input:
    adjusted_gross_income: 120_000
    filing_status: SURVIVING_SPOUSE
    qualified_passenger_vehicle_loan_interest: 10_000
  output:
    # 26 U.S.C. 163(h)(4)(C)(ii)(I): $200,000 only for a joint return
    # (Schedule 1-A line 26). 20 steps of $1,000 at $200 each.
    auto_loan_interest_deduction: 6_000
