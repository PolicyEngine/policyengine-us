- name: Taxable income over QBI in 2024
  period: 2024
  input:
    qbid_amount: 10_000
    taxable_income_less_qbid: 30_000
    adjusted_net_capital_gain: 2_000
  output:
    qualified_business_income_deduction: 5_600

- name: Taxable income under QBI in 2024
  period: 2024
  input:
    qbid_amount: 3_000
    taxable_income_less_qbid: 30_000
    adjusted_net_capital_gain: 2_000
  output:
    qualified_business_income_deduction: 3_000

- name: Taxable reduced to 0
  period: 2024
  input:
    qbid_amount: 10_000
    taxable_income_less_qbid: 30_000
    adjusted_net_capital_gain: 32_000
  output:
    qualified_business_income_deduction: 0

# Direct active-QBI input overrides the proxy. Section 199A(i)(1)'s "greater
# of" rule produces the $400 floor even though the taxable-income cap is $120.
- name: Deduction floor in effect, income above threshold
  absolute_error_margin: 0.01
  period: 2026
  input:
    qbid_amount: 200
    taxable_income_less_qbid: 600
    adjusted_net_capital_gain: 0
    qualified_business_income: 1_000
    active_qualified_business_income: 1_000
  output:
    qualified_business_income_deduction: 400

# Direct active-QBI input overrides the proxy. At $999 the active-QBI threshold
# is not met, and the zero taxable-income cap leaves no deduction.
- name: Deduction floor in effect, income below threshold
  absolute_error_margin: 0.01
  period: 2026
  input:
    qbid_amount: 200
    taxable_income_less_qbid: 0
    adjusted_net_capital_gain: 0
    qualified_business_income: 999
    active_qualified_business_income: 999
  output:
    qualified_business_income_deduction: 0

# Direct active-QBI input overrides the proxy. Ordinary QBID is $2,000 and the
# taxable-income cap is $4,000, so the $400 floor does not bind.
- name: QBID above floor
  absolute_error_margin: 0.01
  period: 2026
  input:
    qbid_amount: 2_000
    taxable_income_less_qbid: 20_000
    adjusted_net_capital_gain: 0
    qualified_business_income: 10_000
    active_qualified_business_income: 10_000
  output:
    qualified_business_income_deduction: 2_000

# Direct active-QBI input overrides the proxy, preserving an explicit SSTB-only
# override-path test.
- name: Deduction floor in effect with SSTB-only income
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        sstb_self_employment_income: 1_000
        self_employment_tax_ald_person: 0
        self_employed_health_insurance_ald_person: 0
        self_employed_pension_contribution_ald_person: 0
        qbid_amount: 200
        active_qualified_business_income: 1_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        taxable_income_less_qbid: 600
        adjusted_net_capital_gain: 0
    families:
      family:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_fips: 6
  output:
    qualified_business_income_deduction: 400

# $1,500 gated SE income derives $1,500 of active QBI and $300 of ordinary
# QBID (20% * $1,500). Section 199A(i)(1) raises the deduction to $400.
- name: Derived active QBI triggers the deduction floor
  absolute_error_margin: 0.01
  period: 2026
  input:
    self_employment_income: 1_500
    self_employment_tax_ald_person: 0
    self_employed_health_insurance_ald_person: 0
    self_employed_pension_contribution_ald_person: 0
    taxable_income_less_qbid: 1_500
    adjusted_net_capital_gain: 0
  output:
    qualified_business_income_deduction: 400

# Section 469(c)(2) treats rental activity as passive. With taxable income
# above the phaseout and no wages or UBIA, ordinary QBID and the floor are zero.
- name: Rental-only income does not trigger the active-QBI floor
  absolute_error_margin: 0.01
  period: 2026
  input:
    rental_income: 50_000
    filing_status: SINGLE
    taxable_income_less_qbid: 300_000
    adjusted_net_capital_gain: 0
    w2_wages_from_qualified_business: 0
    unadjusted_basis_qualified_property: 0
  output:
    qualified_business_income_deduction: 0

# Direct qualified_business_income does not populate any income components, so
# the proxy derives zero active QBI and the 2026 floor remains off.
- name: No active QBI does not trigger 2026 deduction floor
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      person1:
        age: 45
        qualified_business_income: 300_000
        w2_wages_from_qualified_business: 0
        unadjusted_basis_qualified_property: 0
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        taxable_income_less_qbid: 300_000
        adjusted_net_capital_gain: 0
    families:
      family:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_name: TX
  output:
    qualified_business_income_deduction: 0

# Integration test: doctor (SSTB) with rental property (non-SSTB) above threshold.
# Demonstrates the §199A(d)(3) phaseout reaching only the SSTB component
# while the non-SSTB business still receives the W-2 capped deduction.
- name: Mixed SSTB and non-SSTB above threshold
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        employment_income: 400_000
        self_employment_income: 50_000
        sstb_self_employment_income: 50_000
        w2_wages_from_qualified_business: 100_000
        # Zero out QBI deductions so the test isolates SSTB / non-SSTB routing
        # rather than SE-tax / health-insurance / pension ALD pro-rating.
        self_employment_tax_ald_person: 0
        self_employed_health_insurance_ald_person: 0
        self_employed_pension_contribution_ald_person: 0
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    families:
      family:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_fips: 6
  output:
    # Single 2025 threshold $197,300, length $50,000.
    # Taxable income is far above the phaseout, so applicable rate = 0.
    # Non-SSTB QBI = $50,000; W-2 cap = 0.50 * $100,000 = $50,000.
    #   Non-SSTB component = min(20% * $50k, $50k) = $10,000.
    # SSTB QBI = $50,000; SSTB component fully phased out = $0.
    qualified_business_income_deduction: 10_000

- name: Pure SSTB below threshold gets full 20 percent deduction
  absolute_error_margin: 1
  period: 2025
  input:
    people:
      person1:
        employment_income: 50_000
        business_is_qualified: false
        sstb_self_employment_income: 30_000
        # Zero out QBI deductions to isolate SSTB routing.
        self_employment_tax_ald_person: 0
        self_employed_health_insurance_ald_person: 0
        self_employed_pension_contribution_ald_person: 0
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    families:
      family:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_fips: 6
  output:
    # Below the $197,300 single threshold so the SSTB phaseout does not apply.
    # SSTB QBI component = 0.20 * $30,000 = $6,000.
    qualified_business_income_deduction: 6_000
