- name: 2018 single filer
  period: 2018
  input:
    charitable_cash_donations: 400
    filing_status: SINGLE
  output:
    charitable_deduction_for_non_itemizers: 0

- name: 2020 single filer, whose deduction is above the line instead
  period: 2020
  input:
    charitable_cash_donations: 400
    filing_status: SINGLE
  # 170(p) starts in 2021. The 2020 deduction for non-itemizers is the
  # above-the-line charitable_contributions_ald (26 U.S.C. 62(a)(22)).
  output:
    charitable_deduction_for_non_itemizers: 0

- name: 2020 married filers, whose deduction is above the line instead
  period: 2020
  input:
    charitable_cash_donations: 700
    filing_status: JOINT
  output:
    charitable_deduction_for_non_itemizers: 0

- name: 2020 MFS filer, whose deduction is above the line instead
  period: 2020
  input:
    charitable_cash_donations: 400
    filing_status: SEPARATE
  output:
    charitable_deduction_for_non_itemizers: 0

