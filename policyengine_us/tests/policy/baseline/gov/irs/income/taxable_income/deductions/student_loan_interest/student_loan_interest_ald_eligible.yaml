- name: Eligible - head or spouse, not MFS
  period: 2024
  input:
    is_tax_unit_head_or_spouse: true
    filing_status: JOINT
  output:
    student_loan_interest_ald_eligible: true

- name: Eligible - single filer
  period: 2024
  input:
    is_tax_unit_head_or_spouse: true
    filing_status: SINGLE
  output:
    student_loan_interest_ald_eligible: true

- name: Eligible - head of household filer
  period: 2024
  input:
    is_tax_unit_head_or_spouse: true
    filing_status: HEAD_OF_HOUSEHOLD
  output:
    student_loan_interest_ald_eligible: true

- name: Ineligible - dependent (not head or spouse)
  period: 2024
  input:
    is_tax_unit_head_or_spouse: false
    filing_status: JOINT
  output:
    student_loan_interest_ald_eligible: false

- name: Ineligible - Married Filing Separately
  period: 2024
  input:
    is_tax_unit_head_or_spouse: true
    filing_status: SEPARATE
  output:
    student_loan_interest_ald_eligible: false

- name: 2024 single filer claimed as a dependent elsewhere cannot deduct student loan interest
  period: 2024
  input:
    people:
      filer:
        age: 24
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: TX
  output:
    # IRC 221(c).
    student_loan_interest_ald_eligible: false

- name: 2024 joint return with one spouse claimed elsewhere cannot deduct student loan interest (the claimable spouse is the head)
  period: 2024
  input:
    people:
      person_a:
        age: 24
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 24
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # Form 1040 instructions: "you, or your spouse if filing jointly, aren't
    # claimed as a dependent".
    student_loan_interest_ald_eligible: [false, false]

- name: 2024 joint return with one spouse claimed elsewhere cannot deduct student loan interest (the claimable spouse is the spouse)
  period: 2024
  input:
    people:
      person_b:
        age: 24
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 24
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
  output:
    student_loan_interest_ald_eligible: [false, false]

# IRC 221(c): the bar applies to an individual who is claimed.
- name: 2024 single filer who can be claimed but is not claimed can deduct student loan interest
  period: 2024
  input:
    people:
      person_a:
        age: 22
        claimable_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: TX
  output:
    student_loan_interest_ald_eligible: true
