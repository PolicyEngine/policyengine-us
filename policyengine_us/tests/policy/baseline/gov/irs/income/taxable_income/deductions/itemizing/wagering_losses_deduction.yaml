- name: No gambling losses, no deduction.
  absolute_error_margin: 0
  period: 2022
  input:
    people:
      person1:
        gambling_winnings: 1
        gambling_losses: 0
      person2:
        gambling_winnings: 0
        gambling_losses: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
  output:
    wagering_losses_deduction: 0

- name: Gambling losses are deducted, capped at winnings.
  absolute_error_margin: 0
  period: 2022
  input:
    people:
      person1:
        gambling_winnings: 1
        gambling_losses: 2
      person2:
        gambling_winnings: 0
        gambling_losses: 0
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
  output:
    wagering_losses_deduction: 1

- name: Combined gambling losses of household are deducted, capped at winnings.
  absolute_error_margin: 0
  period: 2022
  input:
    people:
      person1:
        gambling_winnings: 5
        gambling_losses: 4
      person2:
        gambling_winnings: 0
        gambling_losses: 4
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
    households:
      household:
        members: [person1, person2]
  output:
    wagering_losses_deduction: 5

- name: Through 2025 all losses count, up to winnings.
  absolute_error_margin: 0
  period: 2025
  input:
    gambling_winnings: 10_000
    gambling_losses: 8_000
  output:
    wagering_losses_deduction: 8_000

- name: Through 2025 losses above winnings are not deductible.
  absolute_error_margin: 0
  period: 2025
  input:
    gambling_winnings: 10_000
    gambling_losses: 12_000
  output:
    wagering_losses_deduction: 10_000

- name: From 2026 only 90% of losses count.
  absolute_error_margin: 0
  period: 2026
  input:
    gambling_winnings: 10_000
    gambling_losses: 8_000
  output:
    # 90% of 8,000
    wagering_losses_deduction: 7_200

- name: From 2026 the winnings cap applies after the 90% share.
  absolute_error_margin: 0
  period: 2026
  input:
    gambling_winnings: 10_000
    gambling_losses: 12_000
  output:
    # min(90% of 12,000, 10,000)
    wagering_losses_deduction: 10_000

- name: From 2026 equal winnings and losses leave 10% of the winnings taxed.
  absolute_error_margin: 0
  period: 2026
  input:
    gambling_winnings: 30_000
    gambling_losses: 30_000
  output:
    wagering_losses_deduction: 27_000

- name: A dependent's gambling is not on the parent's return.
  absolute_error_margin: 0
  period: 2024
  input:
    people:
      parent:
        age: 40
      child:
        age: 17
        is_tax_unit_dependent: true
        gambling_winnings: 10_000
        gambling_losses: 10_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    wagering_losses_deduction: 0

- name: A dependent's losses cannot use up the parent's winnings.
  absolute_error_margin: 0
  period: 2024
  input:
    people:
      parent:
        age: 40
        gambling_winnings: 10_000
        gambling_losses: 2_000
      child:
        age: 17
        is_tax_unit_dependent: true
        gambling_winnings: 5_000
        gambling_losses: 9_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # The parent's own 2,000, not min(11,000, 15,000).
    wagering_losses_deduction: 2_000

# Integration with gross income, itemizing and income tax. Gambling winnings
# are gross income (26 U.S.C. 61(a); Schedule 1 line 8b), and the losses are
# an itemized deduction up to the winnings (26 U.S.C. 165(d); Schedule A line
# 16), 90% of the losses from 2026 (P.L. 119-21 sec. 70114). The cases follow
# PolicyEngine/policyengine-us#9637: a single filer aged 40 in Texas with
# 60,000 of wages. The state and local tax deduction is set to zero so each
# figure can be computed by hand.

- name: 2024, no gambling.
  absolute_error_margin: 0.01
  period: 2024
  input:
    age: 40
    employment_income: 60_000
    salt_deduction: 0
    state_code: TX
  output:
    adjusted_gross_income: 60_000
    # 60,000 - 14,600 standard deduction
    taxable_income: 45_400
    # 10% x 11,600 + 12% x 33,800
    income_tax: 5_216

- name: 2024, winnings are income and losses below the standard deduction do not help.
  absolute_error_margin: 0.01
  period: 2024
  input:
    age: 40
    employment_income: 60_000
    gambling_winnings: 10_000
    gambling_losses: 8_000
    salt_deduction: 0
    state_code: TX
  output:
    irs_gross_income: 70_000
    adjusted_gross_income: 70_000
    wagering_losses_deduction: 8_000
    itemized_taxable_income_deductions: 8_000
    tax_unit_itemizes: false
    # 70,000 - 14,600
    taxable_income: 55_400
    # 1,160 + 12% x 35,550 + 22% x 8,250
    income_tax: 7_241

- name: 2024, an itemizer deducts losses against the winnings in income.
  absolute_error_margin: 0.01
  period: 2024
  input:
    age: 40
    employment_income: 60_000
    gambling_winnings: 30_000
    gambling_losses: 25_000
    salt_deduction: 0
    state_code: TX
  output:
    adjusted_gross_income: 90_000
    wagering_losses_deduction: 25_000
    itemized_taxable_income_deductions: 25_000
    tax_unit_itemizes: true
    # 90,000 - 25,000
    taxable_income: 65_000
    # 1,160 + 4,266 + 22% x 17,850
    income_tax: 9_353

- name: 2024, equal winnings and losses still raise tax by replacing the standard deduction.
  absolute_error_margin: 0.01
  period: 2024
  input:
    age: 40
    employment_income: 60_000
    gambling_winnings: 20_000
    gambling_losses: 20_000
    salt_deduction: 0
    state_code: TX
  output:
    adjusted_gross_income: 80_000
    wagering_losses_deduction: 20_000
    tax_unit_itemizes: true
    # 80,000 - 20,000, against 45,400 with no gambling
    taxable_income: 60_000
    # 1,160 + 4,266 + 22% x 12,850
    income_tax: 8_253

- name: 2026, the itemizer deducts 90% of losses.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    employment_income: 60_000
    gambling_winnings: 30_000
    gambling_losses: 25_000
    salt_deduction: 0
    state_code: TX
  output:
    adjusted_gross_income: 90_000
    # 90% of 25,000
    wagering_losses_deduction: 22_500
    itemized_taxable_income_deductions: 22_500
    tax_unit_itemizes: true
    # 90,000 - 22,500
    taxable_income: 67_500
    # 10% x 12,400 + 12% x 38,000 + 22% x 17,100
    income_tax: 9_562

- name: A dependent's winnings and losses do not change the parent's return.
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      parent:
        age: 40
        employment_income: 60_000
      child:
        age: 17
        is_tax_unit_dependent: true
        gambling_winnings: 30_000
        gambling_losses: 25_000
    tax_units:
      tax_unit:
        members: [parent, child]
        salt_deduction: 0
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    irs_gross_income: [60_000, 0]
    adjusted_gross_income: 60_000
    wagering_losses_deduction: 0
    tax_unit_itemizes: false
    # 60,000 - 21,900 head of household standard deduction
    taxable_income: 38_100
