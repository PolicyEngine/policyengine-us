        taxable_ira_distributions: 26800.0
        taxable_private_pension_income: 2030.0
        takes_up_medicaid_if_eligible: true
        takes_up_ssi_if_eligible: true
    marital_units:
      marital_unit_1:
        members: [head]
    tax_units:
