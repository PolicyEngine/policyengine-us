- name: Unspecified estate income is taxable but does not qualify as QBI
  period: 2026
  input:
    estate_income: 10000
    employment_income: 40000
  output:
    estate_income_would_be_qualified: false
    irs_gross_income: 50000
    qualified_business_income: 0
    qualified_business_income_deduction: 0

- name: Explicitly qualified estate business income remains QBI
  period: 2026
  input:
    estate_income: 10000
    estate_income_would_be_qualified: true
    employment_income: 40000
  output:
    irs_gross_income: 50000
    qualified_business_income: 10000
    qualified_business_income_deduction: 2000

- name: Explicitly nonqualified estate income remains taxable
  period: 2026
  input:
    estate_income: 10000
    estate_income_would_be_qualified: false
    employment_income: 40000
  output:
    irs_gross_income: 50000
    qualified_business_income: 0
    qualified_business_income_deduction: 0

