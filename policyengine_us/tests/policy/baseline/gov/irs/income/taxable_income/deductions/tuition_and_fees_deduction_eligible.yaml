- name: Test case 1 #Separate filing
  period: 2020
  input:
    filing_status: SEPARATE
    american_opportunity_credit: 0 
    lifetime_learning_credit: 0 
  output:
    tuition_and_fees_deduction_eligible: false
   # Married filing separate are not qualify 

- name: Test case 2
  period: 2020
  input:
    filing_status: JOINT
    american_opportunity_credit: 0 
    lifetime_learning_credit: 0 
  output:
    tuition_and_fees_deduction_eligible: true

- name: Test case 3
  period: 2020
  input:
    filing_status: JOINT
    american_opportunity_credit: 100 
    lifetime_learning_credit: 0 
  output:
    tuition_and_fees_deduction_eligible: false
  # Can't claim this deduction if the household has taken the American Oppportunity or Lifetime Learning Credit.

# IRC 222(c)(3): no deduction to an individual for whom a section 151 deduction
# may be allowed to another taxpayer.
- name: 2020 single filer who can be claimed as a dependent is not eligible
  period: 2020
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
    households:
      household:
        members: [person_a]
        state_code: TX
  output:
    tuition_and_fees_deduction_eligible: false

- name: 2020 joint return with one claimable spouse is not eligible (the claimable spouse is the head)
  period: 2020
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    tuition_and_fees_deduction_eligible: false

- name: 2020 joint return with one claimable spouse is not eligible (the claimable spouse is the spouse)
  period: 2020
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
  output:
    tuition_and_fees_deduction_eligible: false

- name: 2020 joint return with neither spouse claimable is eligible
  period: 2020
  input:
    people:
      person_a:
        age: 20
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    tuition_and_fees_deduction_eligible: true
