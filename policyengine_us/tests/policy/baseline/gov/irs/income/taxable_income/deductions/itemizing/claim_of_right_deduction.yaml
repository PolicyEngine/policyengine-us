- name: Case 1, the whole repayment is deductible under section 1341(a)(4).
  period: 2025
  input:
    tax_unit_claim_of_right_repayment: 8_000
    claim_of_right_section_1341_eligible: true
    claim_of_right_credit_applies: false
  output:
    claim_of_right_deduction: 8_000

- name: Case 2, no deduction under section 1341(a)(5).
  # 26 U.S.C. 1341(b)(3).
  period: 2025
  input:
    tax_unit_claim_of_right_repayment: 8_000
    claim_of_right_section_1341_eligible: true
    claim_of_right_credit_applies: true
  output:
    claim_of_right_deduction: 0

- name: Case 3, a repayment of $3,000 or less is not a section 1341 deduction.
  period: 2025
  input:
    tax_unit_claim_of_right_repayment: 3_000
    claim_of_right_section_1341_eligible: false
    claim_of_right_credit_applies: false
  output:
    claim_of_right_deduction: 0

- name: Case 4, the deduction is subject to the overall limitation on itemized deductions before 2018.
  # 2017 Schedule A instructions, Itemized Deductions Worksheet, PDF page 14:
  # line 2 removes only gambling and casualty or theft losses on line 28, so
  # the line 28 claim of right deduction stays in the limited base.
  period: 2017
  input:
    age: 40
    employment_income: 400_000
    claim_of_right_repayment: 50_000
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    claim_of_right_deduction: 50_000
    total_itemized_taxable_income_deductions: 50_000
    # min(3% x ($400,000 - $261,500), 80% x $50,000) = $4,155.
    itemized_taxable_income_deductions_reduction: 4_155
    itemized_taxable_income_deductions: 45_845

- name: Case 5, the deduction is subject to the limitation on itemized deductions from 2026.
  # 26 U.S.C. 68 as amended by P.L. 119-21, sec. 70111: 2/37 of the lesser
  # of itemized deductions and taxable income plus itemized deductions above
  # the $640,600 start of the 37% bracket for single filers in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 40
    employment_income: 1_000_000
    claim_of_right_repayment: 100_000
    state_sales_tax: 0
    local_sales_tax: 0
    state_code: TX
  output:
    claim_of_right_deduction: 100_000
    total_itemized_taxable_income_deductions: 100_000
    # 2/37 x min($100,000, $1,000,000 - $640,600) = $5,405.41.
    itemized_taxable_income_deductions_reduction: 5_405.41
    itemized_taxable_income_deductions: 94_594.59
