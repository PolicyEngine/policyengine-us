- name: AGI only, nothing excluded
  period: 2024
  input:
    adjusted_gross_income: 50_000
  output:
    agi_plus_section_911_931_933_exclusions: 50_000

- name: All three exclusions are added back
  period: 2024
  input:
    adjusted_gross_income: 50_000
    foreign_earned_income_exclusion: 30_000
    specified_possession_income: 20_000
    puerto_rico_income: 10_000
  output:
    agi_plus_section_911_931_933_exclusions: 110_000

- name: Built from income, the section 931 and 933 deductions are reversed
  period: 2024
  input:
    people:
      person1:
        irs_employment_income: 100_000
    tax_units:
      tax_unit:
        members: [person1]
        foreign_earned_income_exclusion: 15_000
        specified_possession_income: 20_000
        puerto_rico_income: 10_000
  output:
    # Income inputs are net of the section 911 exclusion; sections 931 and
    # 933 are above-the-line deductions. AGI 100,000 - 30,000 = 70,000.
    adjusted_gross_income: 70_000
    agi_plus_section_911_931_933_exclusions: 115_000
