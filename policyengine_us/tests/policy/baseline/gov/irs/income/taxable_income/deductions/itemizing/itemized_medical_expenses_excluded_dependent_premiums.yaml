- name: Parents exclude the medical and long-term care premiums their dependent deducts.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
        other_medical_expenses: 50_000
        is_tax_unit_head: true
      spouse:
        age: 45
        employment_income: 50_000
        is_tax_unit_spouse: true
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_self_employed: true
        self_employment_income: 10_000
        health_insurance_premiums: 3_000
        long_term_health_insurance_premiums: 500
    tax_units:
      parents:
        members: [head, spouse, dependent]
    marital_units:
      parents:
        members: [head, spouse]
      dependent:
        members: [dependent]
    households:
      household:
        members: [head, spouse, dependent]
        state_code: TX
  output:
    # The age-20 limit admits 480 of the 500 long-term care premiums.
    eligible_long_term_care_premiums: [0, 0, 480]
    # 10,000 - (10,000 x 0.9235 x 0.153 / 2) exceeds 3,000 + 480.
    self_employed_health_insurance_ald_person: [0, 0, 3_480]
    self_employed_health_insurance_ald: 0
    dependents_self_employed_health_insurance_ald: 3_480
    itemized_medical_expenses_long_term_care_premiums: 0
    # 50,000 + 3,000 + 480 - 3,480 = 50,000.
    itemized_medical_expenses: 50_000
    # The parents' AGI excludes the dependent's income and deduction.
    adjusted_gross_income: 100_000
    medical_expense_deduction: 42_500 # 50,000 - 7.5% x 100,000.
    tax_unit_itemizes: true

