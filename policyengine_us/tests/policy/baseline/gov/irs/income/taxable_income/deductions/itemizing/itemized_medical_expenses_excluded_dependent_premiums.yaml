- name: Montana preserves a supplied exclusion with a computed subtotal.
  period: 2023
  input:
    people:
      parent:
        age: 40
        employment_income: 100_000
        health_insurance_premiums: 1_000
        other_medical_expenses: 8_000
      dependent:
        age: 17
        is_tax_unit_dependent: true
        health_insurance_premiums: 3_000
        self_employed_health_insurance_ald_person: 1_000
    tax_units:
      parents:
        members: [parent, dependent]
        itemized_medical_expenses_applied_exclusion: 500
    households:
      household:
        members: [parent, dependent]
        state_code: MT
  output:
    itemized_medical_expenses: 11_000 # 1,000 + 3,000 - 1,000 + 8,000.
    itemized_medical_expenses_applied_exclusion: 500
    # Main: 12,000 - (4,000 - 500) = 8,500, then a 7,500 floor.
    # The computed subtotal removes 1,000 more premiums; Montana restores
    # that amount when separating premiums from the other expenses.
    # The parent's 1,000 premium deduction adds to the 1,000 floored amount.
    mt_medical_expense_deduction_joint: [2_000, 0]

- name: Montana preserves a supplied exclusion without a dependent deduction.
  period: 2023
  input:
    age: 40
    employment_income: 100_000
    health_insurance_premiums: 1_000
    other_medical_expenses: 8_000
    itemized_medical_expenses_applied_exclusion: 500
    state_code: MT
  output:
    itemized_medical_expenses: 9_000
    # (9,000 - (1,000 - 500) - 7,500) + 1,000 premiums = 2,000.
    mt_medical_expense_deduction_joint: 2_000
