- name: Parents retain premiums above their dependent's earnings limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
        other_medical_expenses: 50_000
        is_tax_unit_head: true
      spouse:
        age: 45
        employment_income: 50_000
        is_tax_unit_spouse: true
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_self_employed: true
        self_employment_income: 1_000
        health_insurance_premiums: 3_000
        long_term_health_insurance_premiums: 500
    tax_units:
      parents:
        members: [head, spouse, dependent]
    marital_units:
      parents:
        members: [head, spouse]
      dependent:
        members: [dependent]
    households:
      household:
        members: [head, spouse, dependent]
        state_code: TX
  output:
    # 1,000 - (1,000 x 0.9235 x 0.153 / 2) = 929.35225.
    self_employed_health_insurance_ald_person: [0, 0, 929.35225]
    self_employed_health_insurance_ald: 0
    dependents_self_employed_health_insurance_ald: 929.35225
    # The deduction consumes medical premiums first, leaving all 480 LTC.
    itemized_medical_expenses_long_term_care_premiums: 480
    # 50,000 + (3,000 - 929.35225) + 480 = 52,550.64775.
    itemized_medical_expenses: 52_550.64775
    adjusted_gross_income: 100_000
    medical_expense_deduction: 45_050.64775 # 52,550.64775 - 7,500.
    tax_unit_itemizes: true

- name: Parents retain long-term care premiums above their dependent's earnings limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
        other_medical_expenses: 50_000
        is_tax_unit_head: true
      spouse:
        age: 45
        employment_income: 50_000
        is_tax_unit_spouse: true
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_self_employed: true
        self_employment_income: 3_500
        health_insurance_premiums: 3_000
        long_term_health_insurance_premiums: 500
    tax_units:
      parents:
        members: [head, spouse, dependent]
    marital_units:
      parents:
        members: [head, spouse]
      dependent:
        members: [dependent]
    households:
      household:
        members: [head, spouse, dependent]
        state_code: TX
  output:
    # 3,500 - (3,500 x 0.9235 x 0.153 / 2) = 3,252.732875.
    self_employed_health_insurance_ald_person: [0, 0, 3_252.732875]
    self_employed_health_insurance_ald: 0
    # Medical premiums consume 3,000; LTC consumes 252.732875 of 480.
    itemized_medical_expenses_long_term_care_premiums: 227.267125
    itemized_medical_expenses: 50_227.267125
    medical_expense_deduction: 42_727.267125
    tax_unit_itemizes: true
