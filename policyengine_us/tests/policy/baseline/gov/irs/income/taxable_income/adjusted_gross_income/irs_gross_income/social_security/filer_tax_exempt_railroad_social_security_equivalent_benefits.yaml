- name: A dependent's tier 1 benefits stay out of the filer's tax-exempt amount.
  period: 2024
  input:
    people:
      person1:
        age: 70
        railroad_social_security_equivalent_benefits: 10_000
      person2:
        age: 17
        is_tax_unit_dependent: true
        railroad_social_security_equivalent_benefits: 6_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Combined income 10,000 / 2 = 5,000 is under the 25,000 base amount, so
    # none of the head's tier 1 benefits is taxable (IRC 86(a)).
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 0
    filer_tax_exempt_railroad_social_security_equivalent_benefits: 10_000
    # The tax unit total also holds the dependent's 6,000.
    tax_exempt_railroad_social_security_equivalent_benefits: 16_000

- name: The taxable part of the filer's tier 1 benefits comes out.
  period: 2024
  input:
    people:
      person1:
        age: 70
        employment_income: 30_000
        railroad_social_security_equivalent_benefits: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # Combined income 30,000 + 10,000 / 2 = 35,000. IRC 86(a)(2): the lesser
    # of 85% x 10,000 = 8,500 and 85% x (35,000 - 34,000) + 4,500 = 5,350.
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 5_350
    filer_tax_exempt_railroad_social_security_equivalent_benefits: 4_650
