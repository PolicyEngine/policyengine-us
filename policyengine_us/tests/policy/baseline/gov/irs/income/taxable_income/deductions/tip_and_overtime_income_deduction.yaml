- name: Tip and overtime income are exempt
  period: 2026
  input:
    treasury_tipped_occupation_code: 102
    tip_income: 200
    fsla_overtime_premium: 300
    standard_deduction: 0
    qualified_business_income_deduction: 0
    charitable_deduction: 0
    interest_deduction: 0
    salt_deduction: 0
    medical_expense_deduction: 0
    casualty_loss_deduction: 0
    misc_deduction: 0
  output:
    taxable_income_deductions_if_itemizing: 500
    taxable_income_deductions_if_not_itemizing: 500

- name: Test for SSN card type - only the head has a valid SSN, so only the head's amounts count
  period: 2026
  input:
    people: 
      person1:
        ssn_card_type: CITIZEN
        tip_income: 200
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 300
      person2:
        ssn_card_type: OTHER_NON_CITIZEN
        tip_income: 600
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 900
    tax_units:
      tax_unit:
        members: [person1, person2]
        standard_deduction: 0
        qualified_business_income_deduction: 0
        charitable_deduction: 0
        interest_deduction: 0
        salt_deduction: 0
        medical_expense_deduction: 0
        casualty_loss_deduction: 0
        misc_deduction: 0
  output:
    # 26 U.S.C. 224(e)(1) and 225(d)(1): the spouse who received the amounts
    # needs the SSN.
    tip_income_deduction: 200
    overtime_income_deduction: 300
    taxable_income_deductions_if_itemizing: 500
    taxable_income_deductions_if_not_itemizing: 500

- name: Test for SSN card type - only the spouse has a valid SSN, so only the spouse's amounts count
  period: 2026
  input:
