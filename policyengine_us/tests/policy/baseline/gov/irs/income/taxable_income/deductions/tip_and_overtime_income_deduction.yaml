# Both deduction lists name the tips and overtime deductions in every year; the
# deductions' in_effect parameters (26 U.S.C. 224(h) and 225(g)) set the years.

- name: 2028, both deductions reach the federal deduction lists.
  period: 2028
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
        # Every other listed deduction is set to zero, so each list sums to
        # the tips and overtime deductions alone.
        standard_deduction: 0
        qualified_business_income_deduction: 0
        charitable_deduction_for_non_itemizers: 0
        itemized_taxable_income_deductions: 0
        wagering_losses_deduction: 0
        additional_senior_deduction: 0
        auto_loan_interest_deduction: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000
    overtime_income_deduction: 5_000
    taxable_income_deductions_if_not_itemizing: 15_000
    taxable_income_deductions_if_itemizing: 15_000

