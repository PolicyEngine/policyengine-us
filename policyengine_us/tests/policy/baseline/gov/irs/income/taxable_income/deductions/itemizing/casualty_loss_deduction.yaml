# 26 U.S.C. 165(h)(1), as in effect for these years: a personal casualty loss is
# allowed "only to the extent that the amount of the loss to such individual
# arising from each casualty, or from each theft, exceeds $500 ($100 for taxable
# years beginning after December 31, 2009)". P.L. 119-108 (2026) keeps $100 for
# losses other than qualified disaster-related losses, which the model has no
# input for. 26 U.S.C. 165(h)(2)(A): the net loss is allowed only to the extent
# it exceeds 10 percent of adjusted gross income. 165(h)(4)(B): "a husband and
# wife making a joint return for the taxable year shall be treated as 1
# individual."
# 2017 Form 4684: line 11 "Enter $100 ($500 if qualified disaster loss rules
# apply; see instructions)", line 12 "Subtract line 11 from line 10. If zero or
# less; enter -0-", line 17 "Enter 10% of your adjusted gross income", line 18
# "Subtract line 17 from line 16. If zero or less, enter -0-".
# IRS Publication 547 (2017, PDF p. 10), $100 Rule: "If you and your spouse file
# a joint return, you are treated as one individual in applying the $100 rule."
# "If you and your spouse have a casualty or theft loss and you file separate
# returns, each of you must reduce your loss by $100."
# The model records one loss amount per person, not separate casualty events,
# so a return's losses are treated as one casualty. A dependent's loss belongs
# on the dependent's own return, as the dependent's income does.

- name: Case 1, a loss of exactly $100 is fully absorbed by the $100 reduction.
  period: 2017
  input:
    casualty_loss: 100
  output:
    # max(100 - 100, 0) - 10% x 0
    casualty_loss_deduction: 0

- name: Case 2, a loss of $101 leaves $1 after the $100 reduction.
  period: 2017
  input:
    casualty_loss: 101
  output:
    # max(101 - 100, 0) - 10% x 0
    casualty_loss_deduction: 1

- name: Case 3, a loss under $100 is not deductible.
  period: 2017
  input:
    casualty_loss: 80
  output:
    # max(80 - 100, 0) = 0
    casualty_loss_deduction: 0

- name: Case 4, the 10 percent floor applies after the $100 reduction.
  period: 2017
  input:
    employment_income: 50_000
    casualty_loss: 10_000
  output:
    # (10,000 - 100) - 10% x 50,000 = 9,900 - 5,000
    casualty_loss_deduction: 4_900

- name: Case 5, a loss $100 above the floor nets to zero.
  period: 2017
  input:
    employment_income: 50_000
    casualty_loss: 5_100
  output:
    # (5,100 - 100) - 10% x 50,000 = 5,000 - 5,000
    casualty_loss_deduction: 0

- name: Case 6, a loss $101 above the floor leaves $1.
  period: 2017
  input:
    employment_income: 50_000
    casualty_loss: 5_101
  output:
    # (5,101 - 100) - 10% x 50,000 = 5,001 - 5,000
    casualty_loss_deduction: 1

- name: Case 7, a joint return reduces the spouses' pooled losses by $100 once.
  period: 2017
  input:
    people:
      person1:
        age: 40
        employment_income: 30_000
        casualty_loss: 6_000
      person2:
        age: 40
        employment_income: 20_000
        casualty_loss: 4_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
  output:
    filing_status: JOINT
    # (6,000 + 4,000 - 100) - 10% x 50,000 = 9,900 - 5,000
    casualty_loss_deduction: 4_900

- name: Case 8, a dependent's loss is left to the dependent's own return.
  period: 2017
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        casualty_loss: 10_000
      person2:
        age: 10
        casualty_loss: 3_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
  output:
    is_tax_unit_dependent: [false, true]
    # The child's 3,000 is not the parent's loss.
    # (10,000 - 100) - 10% x 50,000 = 9,900 - 5,000
    casualty_loss_deduction: 4_900

- name: Case 9, a working dependent's loss stays off the parent's return.
  period: 2017
  input:
    people:
      person1:
        age: 45
        employment_income: 60_000
        casualty_loss: 8_000
      person2:
        age: 17
        employment_income: 4_000
        casualty_loss: 9_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
  output:
    is_tax_unit_dependent: [false, true]
    # The parent's AGI leaves out the dependent's wages, and the parent's loss
    # leaves out the dependent's loss.
    # (8,000 - 100) - 10% x 60,000 = 7,900 - 6,000
    adjusted_gross_income: 60_000
    casualty_loss_deduction: 1_900

- name: Case 10, the deduction is suspended from 2018.
  period: 2018
  input:
    employment_income: 50_000
    casualty_loss: 10_000
  output:
    casualty_loss_deduction: 0

- name: Case 11, a reform that restores the deduction applies the $100 reduction.
  period: 2025
  input:
    gov.irs.deductions.itemized.casualty.active: true
    employment_income: 50_000
    casualty_loss: 10_000
  output:
    # (10,000 - 100) - 10% x 50,000 = 9,900 - 5,000
    casualty_loss_deduction: 4_900

- name: Case 12, a separate return reduces its own loss by $100.
  period: 2017
  input:
    employment_income: 20_000
    casualty_loss: 5_000
    filing_status: SEPARATE
  output:
    # (5,000 - 100) - 10% x 20,000 = 4,900 - 2,000
    casualty_loss_deduction: 2_900
