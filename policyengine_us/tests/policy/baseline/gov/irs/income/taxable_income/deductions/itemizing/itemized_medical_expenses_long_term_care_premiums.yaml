- name: A computed subtotal contains no long-term care premiums
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        long_term_health_insurance_premiums: 1_000
        other_medical_expenses: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
  output:
    itemized_medical_expenses: 5_000
    itemized_medical_expenses_long_term_care_premiums: 0

- name: A supplied subtotal contains the members' eligible long-term care premiums
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        long_term_health_insurance_premiums: 1_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        long_term_health_insurance_premiums: 200
    tax_units:
      tax_unit:
        members: [person1, person2]
        itemized_medical_expenses: 10_650
    households:
      household:
        members: [person1, person2]
  output:
    # Head: min(1,000, 450). Dependent: min(200, 450).
    itemized_medical_expenses_long_term_care_premiums: 650
