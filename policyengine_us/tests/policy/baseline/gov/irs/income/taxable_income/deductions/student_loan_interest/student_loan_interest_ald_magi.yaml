- name: Section 911 adds back Form 2555 lines 45 and 50, before disallowed deductions
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        irs_employment_income: 70_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        # Form 2555 lines 45 and 50: 15,000. The rate stacking amount is
        # 5,000 after 10,000 of disallowed deductions.
        section_911_excluded_income: 15_000
        foreign_earned_income_exclusion: 5_000
  output:
    # Pub. 970 Worksheet 4-1 lines 5 and 6 take Form 2555 lines 45 and 50.
    student_loan_interest_ald_magi: 85_000
