    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
  output:
    student_loan_interest_ald_magi: [78_000, 0]

- name: Basic income is not attributed to the dependents
  period: 2021
  absolute_error_margin: 0.1
  input:
    gov.contrib.ubi_center.basic_income.taxable: true
    people:
      person1:
        is_tax_unit_head_or_spouse: true
        illicit_income: 78_000
        student_loan_interest_ald_eligible: true
      person2:
        is_tax_unit_dependent: true
        self_employment_income: 0
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
        basic_income: 1_000
  output:
    student_loan_interest_ald_magi: [79_000, 0]

- name: Section 931 possession income is added back
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        irs_employment_income: 85_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        specified_possession_income: 10_000
  output:
    # AGI is 85,000 - 10,000 = 75,000; MAGI is figured without regard to
    # section 931: 75,000 + 10,000.
    adjusted_gross_income: 75_000
    student_loan_interest_ald_magi: 85_000

- name: Section 933 Puerto Rico income is added back
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        irs_employment_income: 85_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        puerto_rico_income: 10_000
  output:
    adjusted_gross_income: 75_000
    student_loan_interest_ald_magi: 85_000

- name: Section 911 foreign earned income exclusion is added back
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        # Income inputs are net of the exclusion.
        irs_employment_income: 75_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        foreign_earned_income_exclusion: 10_000
  output:
    adjusted_gross_income: 75_000
    student_loan_interest_ald_magi: 85_000

- name: Joint return splits the section 911 and 931 add-backs between spouses
  period: 2024
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        irs_employment_income: 100_000
        student_loan_interest_ald_eligible: true
      person2:
        irs_employment_income: 80_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        foreign_earned_income_exclusion: 10_000
        specified_possession_income: 20_000
  output:
    # AGI 180,000 - 20,000 = 160,000. MAGI 160,000 + 20,000 + 10,000 =
    # 190,000; each spouse carries half of the 10,000 exclusion.
    adjusted_gross_income: 160_000
    student_loan_interest_ald_magi: [105_000, 85_000]

- name: Section 85(c) unemployment exclusion is added back in 2020
  period: 2020
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        irs_employment_income: 67_000
        unemployment_compensation: 10_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
  output:
    # Section 85(c) excludes all 10,000 (up to 10,200), so none is taxable,
    # but MAGI is figured without regard to it: 67,000 + 10,000.
    tax_unit_taxable_unemployment_compensation: 0
    student_loan_interest_ald_magi: 77_000

- name: Section 222 tuition and fees deduction is added back before 2021
  period: 2019
