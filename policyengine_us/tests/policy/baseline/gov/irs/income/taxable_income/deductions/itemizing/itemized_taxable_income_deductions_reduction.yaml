# P.L. 119-21, sec. 70111(a), rewrote section 68 for taxable years beginning
# after December 31, 2025, without the former subsection (c). Medical
# expenses therefore count toward "such amount of itemized deductions".
# The 37 percent bracket for single filers begins at $640,600 in 2026
# (Rev. Proc. 2025-32, sec. 4.01, Table 3).
- name: 2026 single filer with medical expenses - no section 68(c) exclusion
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income: 900_000
    filing_status: SINGLE
    medical_expense_deduction: 150_000
    charitable_deduction: 50_000
    interest_deduction: 0
    salt_deduction: 0
    casualty_loss_deduction: 0
    misc_deduction: 0
  output:
    # Itemized deductions: 150_000 + 50_000 = 200_000
    # Excess over the 37 percent bracket: 900_000 - 640_600 = 259_400
    # Lesser: 200_000; reduction: 200_000 * 2 / 37 = 10_810.81
    itemized_taxable_income_deductions_reduction: 10_810.81

# Section 68(a)(2) as rewritten by P.L. 119-21, sec. 70111(a): "so much of the
# taxable income of the taxpayer for the taxable year (determined without
# regard to this section and increased by such amount of itemized
# deductions) as exceeds the dollar amount at which the 37 percent rate
# bracket under section 1 begins". That is adjusted gross income less the
# deductions section 63(b) allows besides itemized deductions, such as the
# qualified business income deduction. The 37 percent bracket begins at
# $640,600 (single, head of household), $768,700 (joint, surviving spouse) and
# $384,350 (separate) in 2026 (Rev. Proc. 2025-32, sec. 4.01, Tables 1-4).
- name: 2026 single filer - the QBI deduction lowers the taxable income leg
  period: 2026
  absolute_error_margin: 0.01
  input:
    adjusted_gross_income: 700_000
    filing_status: SINGLE
    qualified_business_income_deduction: 20_000
    charitable_deduction: 50_000
    interest_deduction: 0
    salt_deduction: 0
    medical_expense_deduction: 0
    casualty_loss_deduction: 0
    misc_deduction: 0
  output:
    # Leg (1): 50_000
    # Leg (2): 700_000 - 20_000 = 680_000 (taxable income 630_000 plus the
    # 50_000 of itemized deductions); 680_000 - 640_600 = 39_400
    # Reduction: 2 / 37 * 39_400 = 2_129.73
    taxable_income_before_itemized_deductions: 680_000
    itemized_taxable_income_deductions_reduction: 2_129.73
    itemized_taxable_income_deductions: 47_870.27

