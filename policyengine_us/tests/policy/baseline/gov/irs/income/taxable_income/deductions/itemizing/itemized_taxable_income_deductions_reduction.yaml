# Section 199A(e)(1), as amended by P.L. 119-21, sec. 70111(b)(1): "taxable
# income shall be computed without regard to section 68 and without regard to
# any deduction allowable under this section." The QBI deduction caps at 20
# percent of that taxable income (section 199A(a)(2)), and section 68 then
# nets the QBI deduction out of its own taxable income leg.
- name: 2026 single filer with qualified REIT dividends - QBI deduction capped by taxable income without section 68
  period: 2026
  # Float32 spacing near $572,000 is 6.25 cents.
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 50
        non_qualified_dividend_income: 1_000_000
        qualified_reit_and_ptp_income: 1_000_000
    tax_units:
      tax_unit:
        members: [head]
        tax_unit_itemizes: true
        charitable_deduction: 300_000
        interest_deduction: 0
        salt_deduction: 0
        medical_expense_deduction: 0
        casualty_loss_deduction: 0
        misc_deduction: 0
    households:
      household:
        members: [head]
        state_code: TX
  output:
    adjusted_gross_income: 1_000_000
    # Taxable income without section 68 or 199A: 1_000_000 - 300_000 = 700_000
    taxable_income_less_qbid: 700_000
    # Section 199A(b)(1)(B): 20 percent of 1_000_000 = 200_000;
    # section 199A(a)(2): 20 percent of 700_000 = 140_000; lesser: 140_000
    qualified_business_income_deduction: 140_000
    # Leg (2): 1_000_000 - 140_000 = 860_000; 860_000 - 640_600 = 219_400
    # Lesser of 300_000 and 219_400: 219_400; 2 / 37 * 219_400 = 11_859.46
    itemized_taxable_income_deductions_reduction: 11_859.46
    itemized_taxable_income_deductions: 288_140.54
    # 1_000_000 - 288_140.54 - 140_000 = 571_859.46
    taxable_income: 571_859.46
