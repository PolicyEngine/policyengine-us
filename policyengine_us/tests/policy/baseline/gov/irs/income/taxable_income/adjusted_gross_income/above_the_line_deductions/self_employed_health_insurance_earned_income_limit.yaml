# Form 7206 lines 4-13 (Pub. 535 Worksheet 6-A before 2023). Expected values
# are hand-computed from the form: the deductible part of self-employment tax
# is net profit x 0.9235 x 15.3% / 2 below the Social Security wage base.
# One Form 7206 per plan: the limit is the earned income of the business under
# which the plan is established (self_employed_health_insurance_plan_business),
# or of the person's business with the largest earned income when that input
# is not supplied. Line 9 is the part of the Schedule 1 line 16 retirement plan
# deduction attributable to that business. A retirement plan under one named
# business (self_employed_pension_plan_business) puts all of line 16 there. By
# default every profitable business has a plan, and line 9 is the least that
# this business's plan must carry while the other plans carry all they can.
# The person is the employer for their own Schedule C business and farm, whose
# plans share one limit on employer contributions, 20% of their earned income
# at the 25% plan rate. A partnership is the employer of its partners, so its
# plan's limit is 20% of the person's earned income from the partnership. The
# person's elective deferrals can sit in any of the plans.

- name: Case 1, one business, the limit is net profit less half of self-employment tax.
  period: 2022
  absolute_error_margin: 0.01
  input:
    self_employment_income: 2_000
  output:
    # Schedule 1 line 15: 2,000 x 0.9235 x 0.153 / 2 = 141.2955.
    self_employment_tax_ald_person: 141.2955
    # Line 13: 2,000 - 141.2955.
    self_employed_health_insurance_earned_income_limit: 1_858.7045

- name: Case 2, the SEP, SIMPLE and qualified plan deduction also reduces the limit.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 20_000
    self_employed_pension_contributions_desired: 3_000
  output:
    # Schedule 1 line 15: 20,000 x 0.9235 x 0.153 / 2 = 1,412.955.
    self_employment_tax_ald_person: 1_412.955
    # Schedule 1 line 16: 3,000, within the Pub. 560 maximum of 18,587.045.
    self_employed_pension_contribution_ald_person: 3_000
    # Lines 8 to 10: 20,000 - 1,412.955 - 3,000.
    self_employed_health_insurance_earned_income_limit: 15_587.045

