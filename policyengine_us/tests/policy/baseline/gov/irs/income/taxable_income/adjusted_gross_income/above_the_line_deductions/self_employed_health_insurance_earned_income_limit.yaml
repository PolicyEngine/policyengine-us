# Form 7206 lines 4-13 (Pub. 535 Worksheet 6-A before 2023). Expected values
# are hand-computed from the form: the deductible part of self-employment tax
# is net profit x 0.9235 x 15.3% / 2 below the Social Security wage base.
# One Form 7206 per plan: the limit is the earned income of the business under
# which the plan is established (self_employed_health_insurance_plan_business),
# or of the person's business with the largest earned income when that input
# is not supplied. Line 9 is the part of the Schedule 1 line 16 retirement plan
# deduction attributable to that business: the retirement plan's businesses
# (self_employed_pension_plan_business, by default every profitable one) take
# it in proportion to their line 8 amounts.

- name: Case 1, one business, the limit is net profit less half of self-employment tax.
  period: 2022
  absolute_error_margin: 0.01
  input:
    self_employment_income: 2_000
  output:
    # Line 15: 2,000 x 0.9235 x 0.153 / 2 = 141.2955.
    self_employment_tax_ald_person: 141.2955
    # Line 13: 2,000 - 141.2955.
    self_employed_health_insurance_earned_income_limit: 1_858.7045

- name: Case 2, the SEP, SIMPLE and qualified plan deduction also reduces the limit.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 20_000
    self_employed_pension_contributions_desired: 3_000
  output:
    # Line 15: 20,000 x 0.9235 x 0.153 / 2 = 1,412.955.
    self_employment_tax_ald_person: 1_412.955
    # Line 16 (within the $66,000 annual additions limit).
    self_employed_pension_contribution_ald_person: 3_000
    # Lines 8 to 10: 20,000 - 1,412.955 - 3,000.
    self_employed_health_insurance_earned_income_limit: 15_587.045

- name: Case 3, a farm business takes its share of the self-employment tax deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 30_000
    farm_operations_income: 10_000
  output:
    # Line 15: 40,000 x 0.9235 x 0.153 / 2 = 2,825.91.
    self_employment_tax_ald_person: 2_825.91
    # Lines 5 to 8: 30,000 / 40,000 = 0.75; 30,000 - 0.75 x 2,825.91.
    self_employed_health_insurance_earned_income_limit: 27_880.5675

- name: Case 4, a partnership's self-employment earnings take their share too.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 30_000
    partnership_self_employment_net_earnings: 30_000
  output:
    # Line 15: 60,000 x 0.9235 x 0.153 / 2 = 4,238.865.
    self_employment_tax_ald_person: 4_238.865
    # Lines 5 to 8: 30,000 / 60,000 = 0.5; 30,000 - 0.5 x 4,238.865.
    self_employed_health_insurance_earned_income_limit: 27_880.5675

- name: Case 5, a farm loss is left out of line 5, so the plan business takes the whole deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 30_000
    farm_operations_income: -10_000
  output:
    # Line 15: (30,000 - 10,000) x 0.9235 x 0.153 / 2 = 1,412.955.
    self_employment_tax_ald_person: 1_412.955
    # Lines 5 to 8: line 5 is 30,000, so line 6 is 1; 30,000 - 1,412.955.
    self_employed_health_insurance_earned_income_limit: 28_587.045

- name: Case 6, wages above the Social Security wage base leave only the Medicare part.
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 200_000
    self_employment_income: 10_000
  output:
    # Wages exceed the $176,100 wage base, so line 15 is
    # 10,000 x 0.9235 x 0.029 / 2 = 133.9075.
    self_employment_tax_ald_person: 133.9075
    self_employed_health_insurance_earned_income_limit: 9_866.0925

- name: Case 7, net earnings under $400 owe no self-employment tax, so the limit is net profit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    self_employment_income: 400
  output:
    # 400 x 0.9235 = 369.40, under the $400 threshold of section 1402(b)(2).
    self_employment_tax_ald_person: 0
    self_employed_health_insurance_earned_income_limit: 400

- name: Case 8, a plan established under a Schedule C business with a loss has no limit.
  period: 2025
  absolute_error_margin: 0.01
  input:
    self_employment_income: -5_000
    partnership_self_employment_net_earnings: 20_000
    self_employed_health_insurance_plan_business: SCHEDULE_C
  output:
    self_employed_health_insurance_earned_income_limit: 0

- name: Case 9, a Schedule C loss leaves the partnership as the plan business.
  period: 2025
  absolute_error_margin: 0.01
  input:
    self_employment_income: -5_000
    partnership_self_employment_net_earnings: 20_000
  output:
    # Line 15: (20,000 - 5,000) x 0.9235 x 0.153 / 2 = 1,059.71625.
    self_employment_tax_ald_person: 1_059.71625
    # Line 5 leaves out the loss, so line 6 is 1: 20,000 - 1,059.71625.
    self_employed_health_insurance_earned_income_limit: 18_940.28375

- name: Case 10, a farm is the only business.
  period: 2024
  absolute_error_margin: 0.01
  input:
    farm_operations_income: 20_000
  output:
    # Line 15: 20,000 x 0.9235 x 0.153 / 2 = 1,412.955.
    self_employment_tax_ald_person: 1_412.955
    # Lines 4 to 8 for Schedule F: 20,000 - 1,412.955.
    self_employed_health_insurance_earned_income_limit: 18_587.045

- name: Case 11, a partnership with K-1 box 14 code A earnings is the only business.
  period: 2025
  absolute_error_margin: 0.01
  input:
    partnership_self_employment_net_earnings: 30_000
  output:
    # Line 15: 30,000 x 0.9235 x 0.153 / 2 = 2,119.4325.
    self_employment_tax_ald_person: 2_119.4325
    self_employed_health_insurance_earned_income_limit: 27_880.5675

- name: Case 12, without a named business the larger farm is the plan business.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 5_000
    farm_operations_income: 40_000
  output:
    # Line 15: 45,000 x 0.9235 x 0.153 / 2 = 3,179.14875.
    self_employment_tax_ald_person: 3_179.14875
    # Farm: 40,000 - 40,000 / 45,000 x 3,179.14875 = 37,174.09.
    # Schedule C: 5,000 - 5,000 / 45,000 x 3,179.14875 = 4,646.76125.
    self_employed_health_insurance_earned_income_limit: 37_174.09

- name: Case 13, a named Schedule C business sets the limit even when the farm earns more.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 5_000
    farm_operations_income: 40_000
    self_employed_health_insurance_plan_business: SCHEDULE_C
  output:
    self_employed_health_insurance_earned_income_limit: 4_646.76125

- name: Case 14, a named farm business takes its own share of the self-employment tax deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 30_000
    farm_operations_income: 10_000
    self_employed_health_insurance_plan_business: SCHEDULE_F
  output:
    # Line 15: 40,000 x 0.9235 x 0.153 / 2 = 2,825.91.
    # Lines 5 to 8: 10,000 / 40,000 = 0.25; 10,000 - 0.25 x 2,825.91.
    self_employed_health_insurance_earned_income_limit: 9_293.5225

- name: Case 15, a retirement plan under the Schedule C business leaves the partnership earning more.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 20_000
    self_employed_pension_contributions_desired: 15_000
    self_employed_pension_plan_business: SCHEDULE_C
    partnership_self_employment_net_earnings: 10_000
  output:
    # Line 15: 30,000 x 0.9235 x 0.153 / 2 = 2,119.4325.
    self_employment_tax_ald_person: 2_119.4325
    self_employed_pension_contribution_ald_person: 15_000
    # Schedule C: 20,000 - 2 / 3 x 2,119.4325 - 15,000 = 3,587.045.
    # Partnership (line 9 is 0): 10,000 - 1 / 3 x 2,119.4325 = 9,293.5225.
    self_employed_health_insurance_earned_income_limit: 9_293.5225

- name: Case 16, an S corporation shareholder's wages are the earned income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    s_corp_shareholder_medicare_wages: 50_000
    self_employment_income: 10_000
  output:
    # Line 11: 50,000. The Schedule C business would give
    # 10,000 - 10,000 x 0.9235 x 0.153 / 2 = 9,293.5225.
    self_employed_health_insurance_earned_income_limit: 50_000

- name: Case 17, a named Schedule C business ignores the S corporation wages.
  period: 2025
  absolute_error_margin: 0.01
  input:
    employment_income: 50_000
    s_corp_shareholder_medicare_wages: 50_000
    self_employment_income: 10_000
    self_employed_health_insurance_plan_business: SCHEDULE_C
  output:
    self_employment_tax_ald_person: 706.4775
    self_employed_health_insurance_earned_income_limit: 9_293.5225

- name: Case 18, retirement plans under both businesses split the plan deduction by earned income.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 20_000
    self_employed_pension_contributions_desired: 15_000
    partnership_self_employment_net_earnings: 10_000
  output:
    # Line 15: 30,000 x 0.9235 x 0.153 / 2 = 2,119.4325.
    self_employment_tax_ald_person: 2_119.4325
    # Line 8: Schedule C 18,587.045 and partnership 9,293.5225, together the
    # retirement plan's earned income (Pub. 560 step 3), 27,880.5675.
    self_employed_pension_earned_income: 27_880.5675
    # Within the 2023 limit of min(66,000, 5,576.11 + 22,500,
    # (27,880.57 + 22,500) / 2) = 25,190.28.
    self_employed_pension_contribution_ald_person: 15_000
    # Line 9: Schedule C 2 / 3 x 15,000 = 10,000; partnership 5,000.
    # Line 10: Schedule C 8,587.045; partnership 4,293.5225.
    self_employed_health_insurance_earned_income_limit: 8_587.045

- name: Case 19, a retirement plan under the partnership leaves the Schedule C business's earned income whole.
  period: 2023
  absolute_error_margin: 0.01
  input:
    self_employment_income: 20_000
    self_employed_pension_contributions_desired: 15_000
    self_employed_pension_plan_business: PARTNERSHIP
    partnership_self_employment_net_earnings: 10_000
  output:
    # The partnership's earned income, 9,293.5225, caps the plan deduction.
    self_employed_pension_contribution_ald_person: 9_293.5225
    # Line 10: Schedule C 18,587.045 (line 9 is 0); partnership 0.
    self_employed_health_insurance_earned_income_limit: 18_587.045

- name: Case 20, a farm's own retirement plan reduces the farm's limit.
  period: 2023
  absolute_error_margin: 0.01
  input:
    farm_operations_income: 20_000
    self_employed_pension_contributions_desired: 3_000
  output:
    # Line 8: 20,000 - 1,412.955. Line 9: the farm's plan deduction, 3,000.
    self_employed_pension_contribution_ald_person: 3_000
    self_employed_health_insurance_earned_income_limit: 15_587.045

- name: Case 21, a health plan under the farm subtracts only the farm's share of the retirement plan deduction.
  period: 2024
  absolute_error_margin: 0.01
  input:
    self_employment_income: 30_000
    farm_operations_income: 10_000
    self_employed_pension_contributions_desired: 4_000
    self_employed_health_insurance_plan_business: SCHEDULE_F
  output:
    # Line 15: 2,825.91. Line 8: Schedule C 27,880.5675 and farm 9,293.5225.
    self_employed_pension_contribution_ald_person: 4_000
    # Line 9 for the farm: 9,293.5225 / 37,174.09 x 4,000 = 1,000.
    # Line 10: 9,293.5225 - 1,000.
    self_employed_health_insurance_earned_income_limit: 8_293.5225
