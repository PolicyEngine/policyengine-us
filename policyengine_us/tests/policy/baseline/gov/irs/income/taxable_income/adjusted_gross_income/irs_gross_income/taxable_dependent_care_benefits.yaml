    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # 2026 line 15: $5,000. Line 25: $4,000 of qualified expenses (the 2026
    # cap is $7,500). Line 26: $1,000. Carrying the 2025 entry forward,
    # uprated, would leave line 26 at $0.
    dependent_care_assistance_exclusion: 4_000
    taxable_dependent_care_benefits: [1_000, 0]

