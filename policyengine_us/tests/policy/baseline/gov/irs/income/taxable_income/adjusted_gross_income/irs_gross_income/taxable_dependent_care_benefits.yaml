        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        dependent_care_assistance_qualified_expenses: 9_000
        tax_unit_childcare_expenses: 9_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Line 15: $4,000 + $5,000 = $9,000. Line 25: $5,000 cap. Line 26:
    # $4,000, split 4:5.
    dependent_care_assistance_exclusion: 5_000
    taxable_dependent_care_benefits: [1_777.78, 2_222.22, 0]
    irs_employment_income: [55_000, 55_000, 0]
    adjusted_gross_income: 114_000

- name: One spouse's line 14 cannot reduce the other spouse's line 15, 2025
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        # A forfeiture entered for a spouse with no benefits of their own.
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
      spouse:
        age: 40
        employment_income: 65_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        dependent_care_assistance_qualified_expenses: 3_000
        tax_unit_childcare_expenses: 3_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Each person's line 14 comes from their own line 12, so the head's part
    # of line 15 is floored at $0 and the spouse's stays $5,000. Line 25:
    # $3,000 of qualified expenses. Line 26: $2,000, all the spouse's.
    dependent_care_assistance_exclusion: 3_000
    taxable_dependent_care_benefits: [0, 2_000, 0]
    adjusted_gross_income: 122_000

- name: A dependent's line 14 lowers only the dependent's own line 15, 2025
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 28_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 3
      dependent:
        age: 19
        is_tax_unit_dependent: true
        employment_income: 6_000
        dependent_care_employer_benefits: 300
        # More than the dependent's own $300 of line 12.
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
    tax_units:
      tax_unit:
        members: [head, child, dependent]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 4_000
        tax_unit_childcare_expenses: 4_000
    households:
      household:
        members: [head, child, dependent]
        state_code: TX
  output:
    # The dependent's part of line 15 is max($300 - $1,000, 0) = $0; the
    # head's stays $5,000. Line 25: $4,000 of qualified expenses. Line 26:
    # $1,000, all the head's. The model sums every member's line 15, as it
    # sums line 12 on main, so without the entry line 15 would be $5,300.
    dependent_care_assistance_exclusion: 4_000
    taxable_dependent_care_benefits: [1_000, 0, 0]

- name: A negative line 12 entry counts as zero in line 15, 2025
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
      spouse:
        age: 40
        employment_income: 60_000
        # Box 10 cannot be negative; this pins how the model treats one.
        dependent_care_employer_benefits: -1_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        dependent_care_assistance_qualified_expenses: 3_000
        tax_unit_childcare_expenses: 3_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Line 15 parts: $5,000 and $0. Line 25: $3,000 of qualified expenses.
    # Line 26: $2,000, all the head's. Before line 14 was modeled, the -$1,000
    # netted against the head's $5,000: line 26 was $1,000, split $1,250 and
    # -$250.
    dependent_care_assistance_exclusion: 3_000
    taxable_dependent_care_benefits: [2_000, 0, 0]

- name: A supplied line 26 amount replaces the computed share, and the exclusion stays computed, 2025
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 44_000
        dependent_care_employer_benefits: 4_000
        # The filer also used $1,500 of 2024 benefits in the 2025 grace
        # period (line 13, not modeled). Form 2441: line 15 $5,500, line 25
        # the $5,000 cap, line 26 $500.
        taxable_dependent_care_benefits_reported: 500
      child_1:
        age: 3
      child_2:
        age: 6
    tax_units:
      tax_unit:
        members: [head, child_1, child_2]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 6_000
        tax_unit_childcare_expenses: 6_000
    households:
      household:
        members: [head, child_1, child_2]
        state_code: TX
  output:
    # Line 26 is used as entered. The exclusion stays computed from line 15
    # without line 13: $4,000, where the form's is $5,000. The credit limit
    # follows the computed exclusion: $6,000 - $4,000 = $2,000 (the form's
    # line 29 is $6,000 - $5,000 = $1,000).
    taxable_dependent_care_benefits: [500, 0, 0]
    dependent_care_assistance_exclusion: 4_000
    cdcc_limit: 2_000
    irs_employment_income: [40_000, 0, 0]
    adjusted_gross_income: 40_500

- name: A supplied line 26 of zero is used as entered, 2025
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 28_000
        dependent_care_employer_benefits: 5_000
        # The $1,000 forfeiture is not entered on line 14, but the filer's
        # Form 2441 shows line 26 of $0.
        taxable_dependent_care_benefits_reported: 0
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 4_000
        tax_unit_childcare_expenses: 4_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # The computed share would be $5,000 - $4,000 = $1,000.
    taxable_dependent_care_benefits: [0, 0]
    dependent_care_assistance_exclusion: 4_000
    adjusted_gross_income: 23_000

- name: One spouse's supplied line 26 leaves the other spouse's computed share, 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
