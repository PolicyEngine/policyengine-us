        tax_unit_childcare_expenses: 4_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Any negative amount, not only the default -1, means not supplied, so
    # the computed share applies: $5,000 - $4,000 = $1,000.
    taxable_dependent_care_benefits: [1_000, 0]

# Each input below has a formula that returns its not-supplied value, so Core
# neither carries an entry into a later year nor uprates it: a year without
# an entry uses zero on line 14 and the computed share of line 26.

