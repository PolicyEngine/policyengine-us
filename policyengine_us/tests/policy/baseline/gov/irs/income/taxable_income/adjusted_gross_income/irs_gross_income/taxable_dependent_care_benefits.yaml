# Employer dependent care benefits (W-2 box 10, Form 2441 line 12) are left
# out of box 1 wages and of FICA and FUTA wages (IRC 129(a)(1), 3121(a)(18),
# 3306(b)(13)). The part above the filer's own IRC 129 exclusion is taxable
# (Form 2441 line 26, Form 1040 line 1e).

- name: Benefits within the exclusion leave income tax and FICA wages, 2025
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        # Qualified expenses at least equal to the benefits (Form 2441 line 16).
        # Independently known current-year work-care costs, before employer
        # exclusion; no carryovers, forfeitures or disallowed reimbursement.
        dependent_care_assistance_qualified_expenses: 5_000
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # $60,000 - $5,000 = $55,000.
    irs_employment_income: [55_000, 0]
    payroll_tax_gross_wages: [55_000, 0]
    dependent_care_assistance_exclusion: 5_000
    taxable_dependent_care_benefits: [0, 0]
    adjusted_gross_income: 55_000
    # 6.2% and 1.45% of $55,000.
    employee_social_security_tax: [3_410, 0]
    employee_medicare_tax: [797.5, 0]

- name: Separate filer's benefits above the $2,500 cap return to gross income, 2025
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SEPARATE
        # Independently known current-year work-care costs, before employer
        # exclusion; no carryovers, forfeitures or disallowed reimbursement.
        dependent_care_assistance_qualified_expenses: 5_000
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    irs_employment_income: [55_000, 0]
    # FICA follows the employer's exclusion, not the filer's MFS cap.
    payroll_tax_gross_wages: [55_000, 0]
    # min($5,000, $2,500 MFS cap, earnings) = $2,500.
    dependent_care_assistance_exclusion: 2_500
    taxable_dependent_care_benefits: [2_500, 0]
    # $55,000 + $2,500.
    adjusted_gross_income: 57_500

- name: Joint return splits the taxable part by each spouse's benefits, 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 80_000
        dependent_care_employer_benefits: 4_000
      spouse:
        age: 40
        employment_income: 3_000
        dependent_care_employer_benefits: 2_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        # Independently known current-year work-care costs, before employer
        # exclusion; no carryovers, forfeitures or disallowed reimbursement.
        dependent_care_assistance_qualified_expenses: 6_000
        tax_unit_childcare_expenses: 6_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Form 2441 lines 18-19 leave out line 12 benefits: the spouse's earned
    # income is $3,000 - $2,000 = $1,000. Exclusion min($6,000, $5,000,
    # $1,000) = $1,000; taxable $5,000, split 4:2.
    dependent_care_assistance_exclusion: 1_000
    taxable_dependent_care_benefits: [3_333.33, 1_666.67, 0]
    irs_employment_income: [76_000, 1_000, 0]
    # $77,000 of box 1 wages plus $5,000 taxable benefits.
    adjusted_gross_income: 82_000

- name: Part-time worker's exclusion is capped at wages net of benefits, 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 30
        employment_income: 6_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        # Independently known current-year work-care costs, before employer
        # exclusion; no carryovers, forfeitures or disallowed reimbursement.
        dependent_care_assistance_qualified_expenses: 5_000
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Form 2441 line 18 earned income leaves out line 12 benefits:
    # $6,000 - $5,000 = $1,000. Exclusion min($5,000, $5,000, $1,000) =
    # $1,000; taxable $4,000 (Form 1040 line 1e).
    irs_employment_income: [1_000, 0]
    dependent_care_assistance_exclusion: 1_000
    taxable_dependent_care_benefits: [4_000, 0]
    # $1,000 of box 1 wages plus $4,000 taxable benefits.
    adjusted_gross_income: 5_000

- name: Claimable filer's taxable dependent care benefits are earned income, 2024
  period: 2024
  input:
    people:
      head:
        age: 22
        employment_income: 6_000
        dependent_care_employer_benefits: 5_000
        claimable_as_dependent_on_another_return: true
      child:
        age: 2
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: SINGLE
        # Isolated positive-expense component override: test the separate
        # qualifying-person gate, not whether this child's costs qualify.
        # IRC 152(b)(1) bars this child from qualifying for this return.
        dependent_care_assistance_qualified_expenses: 5_000
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # IRC 129(e)(1) adopts 21(b)(2). The ordinary-child branch of 21(b)(1)(A)
    # requires a dependent, which 152(b)(1) bars for this claimable filer.
    # Only the disabled-person branch of 21(b)(1)(B) disregards that bar.
    # Thus no exclusion applies: box 1 $1,000 plus taxable benefits $5,000.
    count_cdcc_eligible: 0
    dependent_care_assistance_exclusion: 0
    taxable_dependent_care_benefits: [5_000, 0]
    standard_deduction_worksheet_earned_income_person: [6_000, 0]
    # max($1,300, $6,000 + $450) = $6,450 (Rev. Proc. 2023-34).
    basic_standard_deduction: 6_450
    # Taxable income $6,000 - $6,450 < 0. Refundable credits are left out:
    # the model's EITC doesn't test whether the filer is claimable.
    income_tax_before_refundable_credits: 0
    tax_unit_is_required_to_file: false
    medicaid_person_is_required_to_file: [false, false]

- name: No benefits leaves wages unchanged
  period: 2025
  input:
    employment_income: 30_000
  output:
    irs_employment_income: 30_000
    payroll_tax_gross_wages: 30_000
    taxable_dependent_care_benefits: 0

# Form 2441 line 15 adds prior-year benefits used in this year's grace period
# (line 13) to the line 12 benefits and subtracts amounts forfeited or
# carried forward (line 14). Line 12 is dependent_care_employer_benefits: W-2
# box 10, not counting any amount above the plan's exclusion, which box 1
# already includes as wages. Line 26 is line 15 less the line 25 exclusion.

- name: Forfeited benefits are neither excluded nor taxable, 2025
  period: 2025
  input:
    people:
      head:
        age: 45
        # Box 1 wages of $23,000 plus $5,000 of box 10 benefits.
        employment_income: 28_000
        # Box 10 reports benefits regardless of employee forfeitures.
        dependent_care_employer_benefits: 5_000
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 4_000
        tax_unit_childcare_expenses: 4_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # The filer set aside $5,000, incurred $4,000 of qualified expenses and
    # forfeited $1,000. Line 15: $5,000 - $1,000 = $4,000. Line 25: the
    # smallest of $4,000, $4,000 of qualified expenses (line 16), $23,000 of
    # earned income and the $5,000 cap. Line 26: $0. Without line 14, line
    # 26 would be $1,000 and AGI $24,000.
    irs_employment_income: [23_000, 0]
    dependent_care_assistance_exclusion: 4_000
    taxable_dependent_care_benefits: [0, 0]
    adjusted_gross_income: 23_000

- name: Box 10 above the plan's exclusion stays in wages when part is forfeited, 2025
  period: 2025
  input:
    people:
      head:
        age: 45
        # One W-2 reports $6,000 in box 10 under a plan with a $5,000
        # exclusion. The $1,000 above it is in box 1 (W-2 instructions,
        # p. 19) and not on line 12, so box 1 is $24,000 and line 12 is
        # $5,000.
        employment_income: 29_000
        dependent_care_employer_benefits: 5_000
        # The filer incurred $5,000 of expenses and forfeited $1,000; line 14
        # enters the forfeited amount included on line 12.
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 5_000
        tax_unit_childcare_expenses: 5_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Line 15: $5,000 - $1,000 = $4,000. Line 25: $4,000. Line 26: $0. The
    # $1,000 above the plan's exclusion stays in box 1, so AGI is $24,000.
    irs_employment_income: [24_000, 0]
    dependent_care_assistance_exclusion: 4_000
    taxable_dependent_care_benefits: [0, 0]
    adjusted_gross_income: 24_000

- name: Grace-period carryover adds to the benefits, 2025
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 44_000
        dependent_care_employer_benefits: 4_000
        # Unused 2024 benefits used in the 2025 grace period (line 13).
        dependent_care_employer_benefits_prior_year_carryover: 1_500
      child:
        age: 3
    tax_units:
      tax_unit:
        members: [head, child]
        filing_status: HEAD_OF_HOUSEHOLD
        dependent_care_assistance_qualified_expenses: 6_000
        tax_unit_childcare_expenses: 6_000
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # Line 15: $4,000 + $1,500 = $5,500. Line 25: $5,000 cap. Line 26: $500.
    irs_employment_income: [40_000, 0]
    dependent_care_assistance_exclusion: 5_000
    taxable_dependent_care_benefits: [500, 0]
    adjusted_gross_income: 40_500

- name: Joint return splits the taxable part by each spouse's line 15 amount, 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
      spouse:
        age: 40
        employment_income: 60_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        dependent_care_assistance_qualified_expenses: 9_000
        tax_unit_childcare_expenses: 9_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Line 15: $4,000 + $5,000 = $9,000. Line 25: $5,000 cap. Line 26:
    # $4,000, split 4:5.
    dependent_care_assistance_exclusion: 5_000
    taxable_dependent_care_benefits: [1_777.78, 2_222.22, 0]
    irs_employment_income: [55_000, 55_000, 0]
    adjusted_gross_income: 114_000

- name: One spouse's line 14 cannot reduce the other spouse's line 15, 2025
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        # A forfeiture entered for a spouse with no benefits of their own.
        dependent_care_employer_benefits_forfeited_or_carried_forward: 1_000
      spouse:
        age: 40
        employment_income: 65_000
        dependent_care_employer_benefits: 5_000
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        dependent_care_assistance_qualified_expenses: 3_000
        tax_unit_childcare_expenses: 3_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # Each person's line 14 comes from their own line 12 and line 13, so the
    # head's part of line 15 is floored at $0 and the spouse's stays $5,000.
    # Line 25: $3,000 of qualified expenses. Line 26: $2,000, all the
    # spouse's.
    dependent_care_assistance_exclusion: 3_000
    taxable_dependent_care_benefits: [0, 2_000, 0]
    adjusted_gross_income: 122_000
