- name: Joint return cap is per return, not per spouse (IRC § 221(b)(1))
  period: 2021
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        student_loan_interest: 3_000
        student_loan_interest_ald_eligible: true
        is_tax_unit_dependent: false
      person2:
        student_loan_interest: 3_000
        student_loan_interest_ald_eligible: true
        is_tax_unit_dependent: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
  # Combined interest $6,000 caps at $2,500 (not $5,000). Evenly split
  # since both spouses have identical interest. No phase-out applies
  # (default MAGI below the phase-out start for joint filers).
  output:
    student_loan_interest_ald: [1_250, 1_250]

# 2024 phase-out: $80,000 to $95,000 single, $165,000 to $195,000 joint.
- name: Section 931 possession income counts toward the phase-out
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        student_loan_interest: 2_500
        irs_employment_income: 85_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        specified_possession_income: 10_000
  output:
    # MAGI 85,000: reduced by (85,000 - 80,000) / 15,000 = 1/3.
    student_loan_interest_ald: 1_666.67

