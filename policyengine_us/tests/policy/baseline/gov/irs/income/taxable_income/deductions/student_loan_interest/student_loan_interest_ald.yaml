- name: Joint return with section 911 and 931 exclusions is in the phase-out
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        student_loan_interest: 2_500
        irs_employment_income: 100_000
        student_loan_interest_ald_eligible: true
      person2:
        irs_employment_income: 80_000
        student_loan_interest_ald_eligible: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: JOINT
        foreign_earned_income_exclusion: 10_000
        specified_possession_income: 20_000
  output:
    # AGI 160,000; MAGI 190,000: reduced by (190,000 - 165,000) / 30,000.
    student_loan_interest_ald: [416.67, 0]
