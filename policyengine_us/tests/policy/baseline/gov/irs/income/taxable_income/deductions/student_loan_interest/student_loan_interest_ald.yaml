    student_loan_interest_ald: 1_666.67

# IRC 221(c) denies the deduction "to an individual" whom another taxpayer
# claims. On a joint return filed only to claim a refund (IRC 152(c)(1)(E)),
# the unclaimed spouse keeps the deduction for their own interest.
- name: Unclaimed spouse retains own loan-interest deduction on a refund-only joint return
  period: 2025
  input:
    people:
      unclaimed:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        employment_income: 2_000
        student_loan_interest: 1_000
      claimed_student:
        age: 22
        is_full_time_student: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        student_loan_interest: 700
    tax_units:
      joint:
        members: [unclaimed, claimed_student]
        filing_status: JOINT
    households:
      household:
        members: [unclaimed, claimed_student]
        state_code: TX
  output:
    # Eligible interest 1,000 + 0; the 2,500 cap and the 170,000 phase-out
    # start don't bind. AGI = 2,000 - 1,000.
    student_loan_interest_ald_eligible: [true, false]
    student_loan_interest_ald: [1_000, 0]
    adjusted_gross_income: 1_000

- name: Claimed head does not bar the unclaimed spouse or drop out of joint MAGI
  period: 2025
  input:
    people:
      claimed_student:
        age: 22
        is_full_time_student: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        claimable_as_dependent_on_another_return: true
        claimed_as_dependent_on_another_return: true
        employment_income: 1_000
        student_loan_interest: 700
      unclaimed:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        employment_income: 4_000
        student_loan_interest: 4_000
    tax_units:
      joint:
        members: [claimed_student, unclaimed]
        filing_status: JOINT
    households:
      household:
        members: [claimed_student, unclaimed]
        state_code: TX
  output:
    # Eligible interest 4,000, capped once at 2,500. Joint MAGI
    # 1,000 + 4,000 = 5,000. AGI = 5,000 - 2,500.
    student_loan_interest_ald_eligible: [false, true]
    student_loan_interest_ald_magi: [1_000, 4_000]
    student_loan_interest_ald: [0, 2_500]
    adjusted_gross_income: 2_500

# Mechanics only: the claim is set as an input. The joint phase-out reads
# both spouses' MAGI (IRC 221(b)(2)(B)), including a claimed spouse's.
- name: Joint phase-out counts the claimed spouse's MAGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      unclaimed:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        employment_income: 150_000
        student_loan_interest: 2_500
      claimed_spouse:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        claimed_as_dependent_on_another_return: true
        employment_income: 30_000
    tax_units:
      joint:
        members: [unclaimed, claimed_spouse]
        filing_status: JOINT
    households:
      household:
        members: [unclaimed, claimed_spouse]
        state_code: TX
  output:
    # Joint MAGI 180,000; reduced by (180,000 - 170,000) / 30,000:
    # 2,500 x (1 - 1/3) = 1,666.67.
    student_loan_interest_ald_magi: [150_000, 30_000]
    student_loan_interest_ald: [1_666.67, 0]
