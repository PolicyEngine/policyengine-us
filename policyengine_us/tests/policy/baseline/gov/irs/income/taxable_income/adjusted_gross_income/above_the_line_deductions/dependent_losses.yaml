        short_term_capital_gains: -4_000
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: TX
  output:
    limited_capital_loss: 0
    loss_ald: 0
    # TAXSIM v10 for wages 20,000 + interest 9,000 + LTCG 4,000.
    adjusted_gross_income: 33_000

