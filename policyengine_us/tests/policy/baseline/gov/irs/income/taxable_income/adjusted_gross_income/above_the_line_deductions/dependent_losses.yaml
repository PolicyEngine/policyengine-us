- name: Dependent's rental income does not raise the filer's 461(l) limit
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 35
        employment_income: 500_000
        self_employment_income: -400_000
      child1:
        age: 15
        rental_income: 50_000
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: TX
  output:
    # 461(l)(3)(A): the filer's business deductions (400,000) exceed the
    # filer's business income (0) plus the 2024 threshold (305,000,
    # Rev. Proc. 2023-34 sec. 3.32), so 305,000 is allowed.
    loss_ald: 305_000
    # 500,000 - 305,000.
    adjusted_gross_income: 195_000
