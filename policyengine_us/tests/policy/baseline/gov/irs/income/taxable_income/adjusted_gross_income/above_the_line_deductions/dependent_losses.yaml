# A tax unit dependent's losses belong on the dependent's own return, not the
# filer's. 26 USC 1(g)(7) moves only a child's interest and dividend gross
# income to a parent's return, and Form 8814 has no line for a loss.
#
# Expected AGI (all cases but the last) is the NBER taxsimtest binary's federal
# AGI (v10) for the filer's own return, build cd2026081819. The dependent's
# items are left off that record, since TAXSIM has no input for a dependent's
# income. The 461(l) case follows 26 USC 461(l)(3)(A) and Rev. Proc. 2023-34
# sec. 3.32 because TAXSIM does not apply 461(l).

- name: Dependent's rental loss does not offset the filer's rental income
  period: 2025
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 35
        employment_income: 20_000
        taxable_interest_income: 9_000
        rental_income: 4_000
      child1:
        age: 15
        rental_income: -4_000
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: TX
  output:
    is_tax_unit_dependent: [false, true, true]
    loss_ald: 0
    # TAXSIM v10 for wages 20,000 + interest 9,000 + rent 4,000.
    adjusted_gross_income: 33_000

