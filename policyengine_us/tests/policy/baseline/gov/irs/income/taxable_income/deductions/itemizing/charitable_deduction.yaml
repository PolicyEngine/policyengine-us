  output:
    # 50% org non-cash: min(400, 500) = 400
    # non-50% org: min(400, 300, 500 - 400) = 100 per Pub 526 Worksheet 2
    # total = 400 + 100 = 500
    charitable_deduction: 500

- name: Non-50% org only hits 30% cap
  period: 2024
  input:
    charitable_cash_donations: 0
