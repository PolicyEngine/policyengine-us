    charitable_capital_gain_donations_non_50_pct_orgs: 5_000
    positive_agi: 100_000
  output:
    # Cash 50% (Line 13): 20000
    # Ord 50% (Line 17): min(15000, 50000 - 20000) = 15000
    # Non-50% ord/cash (Line 24): min(10000, 30000, 50000 - 45000) = 5000
    # CG 50% (Line 30): min(10000, 30000, 50000 - 35000) = 10000
    # CG non-50% (Line 40): room under 50% is 50000 - 50000 = 0
    # Total per Pub 526 Worksheet 2: 20000 + 15000 + 5000 + 10000 + 0 = 50000
    charitable_deduction: 50_000

- name: IRS Publication 526 page 26 example (Worksheet 2 coupled limits)
  period: 2024
  input:
    charitable_cash_donations_50_pct_orgs: 2_000
    charitable_capital_gain_donations_50_pct_orgs: 28_000
    charitable_cash_donations_non_50_pct_orgs: 5_000
    positive_agi: 50_000
  output:
    # Cash 50% (Line 13): 2000
    # Ord 50% (Line 17): 0
    # Non-50% cash (Line 24): min(5000, 15000, 25000 - (28000 + 2000)) = 0
    # CG 50% (Line 30): min(28000, 15000, 25000 - 2000) = 15000
    # Total deduction per Pub 526 Worksheet 2: 2000 + 15000 = 17000
    charitable_deduction: 17_000

- name: Shared 30% capital gain ceiling (§ 170(b)(1)(D)(i)(II))
  period: 2024
  absolute_error_margin: 0.01
  input:
    charitable_capital_gain_donations_50_pct_orgs: 30_000
    charitable_capital_gain_donations_non_50_pct_orgs: 20_000
    positive_agi: 100_000
  output:
    # CG 50% takes 30000 (30% of AGI). Under § 170(b)(1)(D)(i)(II),
    # CG non-50% is limited to min(20% AGI, 30% AGI - CG 50%) = min(20000, 0) = 0.
    charitable_deduction: 30_000

- name: Fallback resolves cash total and 50% org cash without dropping dollars
  period: 2024
  input:
    charitable_cash_donations: 30_000
    charitable_cash_donations_50_pct_orgs: 20_000
    positive_agi: 100_000
  output:
    # Cash 50%: 20000; cash non-50% remainder: 10000.
    # Total deduction: 20000 + 10000 = 30000
    charitable_deduction: 30_000

