    charitable_capital_gain_donations_non_50_pct_orgs: 5_000
    positive_agi: 100_000
  output:
    # Cash 50% (Line 13): 20000
    # Ord 50% (Line 17): min(10000, 50000 - 20000) = 10000
    # Non-50% ord/cash (Line 24): min(15000, 30000, 50000 - 40000) = 10000
    # CG 50% (Line 30): min(10000, 30000, 50000 - 30000) = 10000
    # CG non-50% (Line 40): room under 50% is 50000 - 50000 = 0
