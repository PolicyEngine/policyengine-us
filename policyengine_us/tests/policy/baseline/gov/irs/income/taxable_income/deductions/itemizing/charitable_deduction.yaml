- name: 5 mutually exclusive boxes from tax software (pure independent inputs)
  period: 2024
  input:
    charitable_cash_donations_50_pct_orgs: 20_000
    charitable_non_cash_donations_50_pct_orgs: 15_000
    charitable_cash_donations_non_50_pct_orgs: 10_000
