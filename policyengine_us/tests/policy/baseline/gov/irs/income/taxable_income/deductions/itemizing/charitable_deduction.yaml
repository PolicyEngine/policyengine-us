- name: 2026 cash to church and private foundation with 10% add-back (§ 170(b)(1)(B)(ii))
  period: 2026
  absolute_error_margin: 0.01
  input:
    charitable_cash_donations_50_pct_orgs: 30_000
    charitable_cash_donations_non_50_pct_orgs: 30_000
    positive_agi: 100_000
  output:
    # 50% cash = 30,000 (cap 60,000).
    # Non-50% cash: under § 170(b)(1)(B)(ii), 50% cash only reduces room to the extent
    # it exceeds 10% of AGI (10,000). Subtracted cash = max(0, 30,000 - 10,000) = 20,000.
    # Room under 50% for non-50% = max(0, 50,000 - 20,000) = 30,000.
    # Non-50% cash allowed = min(30,000, 30,000, 30,000) = 30,000.
    # Total before floor = 30,000 + 30,000 = 60,000.
    # Post-ceiling floor = 0.005 * 100,000 = 500.
    # Total deduction: 60,000 - 500 = 59,500.
    charitable_deduction: 59_500

- name: 2020 CARES Act cash and goods to 50% orgs (Worksheet 2 line 52)
  period: 2020
  input:
    charitable_cash_donations_50_pct_orgs: 50_000
    charitable_non_cash_donations_50_pct_orgs: 30_000
    positive_agi: 100_000
  output:
    # 2020 CARES Act: goods to church allowed under 50% limit = 30,000.
    # Cash fills remaining room up to 100% of AGI: min(50,000, 100,000 - 30,000) = 50,000.
    # Total deduction: 30,000 + 50,000 = 80,000.
    charitable_deduction: 80_000

- name: Couple with spouse 1 entering total and spouse 2 entering 50% sub-box
  period: 2024
  input:
    people:
      spouse1:
        charitable_cash_donations: 10_000
      spouse2:
        charitable_cash_donations_50_pct_orgs: 5_000
    tax_units:
      tax_unit:
        members: [spouse1, spouse2]
        positive_agi: 100_000
  output:
    # Spouse 1 resolves 10,000 cash 50%; Spouse 2 resolves 5,000 cash 50%.
    # Combined cash 50% = 15,000. Deduction = 15,000.
    charitable_deduction: 15_000

- name: 2026 allowable 50% gifts reducing 30% non-50% room under § 170(b)(1)(B)(ii)
  period: 2026
  absolute_error_margin: 0.01
  input:
    charitable_cash_donations_50_pct_orgs: 30_000
    charitable_non_cash_donations_50_pct_orgs: 40_000
    charitable_cash_donations_non_50_pct_orgs: 20_000
    positive_agi: 100_000
  output:
    # 2026, Single, AGI 100,000.
    # Cash to 50% org: 30,000 allowed under (G) (cap 60,000).
    # Goods to 50% org: allowable under (A) is min(40,000, 50,000 - 30,000) = 20,000.
    # Non-50% cash: under § 170(b)(1)(B)(ii), room is 50,000 - (allowable (A) + allowable (G) - 10% AGI)
    # = 50,000 - (20,000 + 30,000 - 10,000) = 10,000.
    # Total before floor = 30,000 + 20,000 + 10,000 = 60,000.
    # Floor (0.5% * 100,000 = 500) applies after ceilings: 60,000 - 500 = 59,500.
    charitable_deduction: 59_500


