  period: 2026
  input:
    charitable_cash_donations: 10_000
    charitable_non_cash_donations: 30_000
    positive_agi: 0
  output:
    charitable_deduction: 0

- name: Charitable deduction with a 0.5% floor
  period: 2026
  input:
    charitable_cash_donations: 10_000
    charitable_non_cash_donations: 30_000
    positive_agi: 200_000
  output:
    charitable_deduction: 39_000

- name: Contributions below floor
  period: 2026
  input:
    charitable_cash_donations: 500
    charitable_non_cash_donations: 300
    positive_agi: 200_000
  output:
    charitable_deduction: 0

- name: Non cash donations are capped at 50% of AGI and cash donation increase the cap to 60%, partial cap
  period: 2026
  input:
    charitable_cash_donations: 600
    charitable_non_cash_donations: 12_000
    positive_agi: 20_000
  output:
    charitable_deduction: 10_600

- name: Non cash donations are capped at 50% of AGI and cash donation increase the cap to 60%, full cap
  period: 2026
  input:
    charitable_cash_donations: 3_000
    charitable_non_cash_donations: 12_000
    positive_agi: 20_000
  output:
    charitable_deduction: 12_000

- name: Non-cash to non-50% limit orgs capped at 30% of AGI
  period: 2024
  input:
    charitable_cash_donations: 0
    charitable_non_cash_donations: 500
    charitable_non_cash_donations_non_50_pct_orgs: 500
    positive_agi: 1_000
  output:
    # 50% org non-cash = 0
    # non-50% org: min(500, 0.3 * 1000) = 300
    # min(0 + 300, 0.6 * 1000) = 300
    charitable_deduction: 300

- name: Mix of 50% and non-50% org non-cash donations
  period: 2024
  input:
    charitable_cash_donations: 0
    charitable_non_cash_donations: 600
    charitable_non_cash_donations_non_50_pct_orgs: 200
    positive_agi: 1_000
  output:
    # 50% org: min(400, 500) = 400
    # non-50% org: min(200, 300) = 200
    # min(400 + 200, 600) = 600
    charitable_deduction: 600

- name: Overall ceiling binds with mixed org types
  period: 2024
  input:
    charitable_cash_donations: 0
    charitable_non_cash_donations: 800
    charitable_non_cash_donations_non_50_pct_orgs: 400
    positive_agi: 1_000
  output:
    # 50% org: min(400, 500) = 400
    # non-50% org: min(400, 300) = 300
    # min(400 + 300, 600) = 600
    charitable_deduction: 600

- name: Non-50% org only hits 30% cap
  period: 2024
  input:
    charitable_cash_donations: 0
    charitable_non_cash_donations: 400
    charitable_non_cash_donations_non_50_pct_orgs: 400
    positive_agi: 1_000
  output:
    # non-50% org: min(400, 300) = 300
    # min(300, 600) = 300
    charitable_deduction: 300

- name: Non-50% org with floor and cash
  period: 2026
  input:
    charitable_cash_donations: 5_000
    charitable_non_cash_donations: 20_000
    charitable_non_cash_donations_non_50_pct_orgs: 5_000
    positive_agi: 100_000
  output:
    # floor = 0.005 * 100000 = 500
    # 50% org non-cash = 15000, reduced = max(15000 - 500, 0) = 14500
    # capped 50% = min(14500, 50000) = 14500
    # remaining_floor_after_50 = max(500 - 15000, 0) = 0
    # non-50% non-cash = 5000, reduced = max(5000 - 0, 0) = 5000
    # capped 30% = min(5000, 30000) = 5000
    # remaining_floor = max(0 - 5000, 0) = 0
    # cash = max(5000 - 0, 0) = 5000
    # min(14500 + 5000 + 5000, 60000) = 24500
    charitable_deduction: 24_500

- name: Cash to non-50% limit orgs capped at 30% of AGI
  period: 2024
  input:
    charitable_cash_donations: 40_000
    charitable_cash_donations_non_50_pct_orgs: 40_000
    positive_agi: 100_000
  output:
    # cash to non-50% org: min(40000, 0.3 * 100000) = 30000
    charitable_deduction: 30_000

- name: Capital gains donations to 50% limit orgs capped at 30% of AGI (screenshot example)
  period: 2024
  input:
    charitable_capital_gain_donations_50_pct_orgs: 30_000
    positive_agi: 80_000
  output:
    # 30% of 80000 = 24000
    charitable_deduction: 24_000

- name: Capital gains donations to 50% limit orgs within 30% of AGI
  period: 2024
  input:
    charitable_capital_gain_donations_50_pct_orgs: 30_000
    positive_agi: 100_000
  output:
    # 30% of 100000 = 30000
    charitable_deduction: 30_000

- name: Capital gains donations to non-50% limit orgs capped at 20% of AGI
  period: 2024
  input:
    charitable_capital_gain_donations_non_50_pct_orgs: 25_000
    positive_agi: 100_000
  output:
    # 20% of 100000 = 20000
    charitable_deduction: 20_000

- name: Mix of 50% ordinary and 50% capital gain hitting 50% total non-cash ceiling
  period: 2024
  input:
    charitable_non_cash_donations: 40_000
    charitable_capital_gain_donations_50_pct_orgs: 20_000
    positive_agi: 100_000
  output:
    # ordinary 50% = 40000 (cap 50000), CG 50% = 20000 (cap 30000)
    # total 50% non-cash = min(40000 + 20000, 50000) = 50000
    charitable_deduction: 50_000

- name: Mix of non-50% ordinary and non-50% capital gain hitting 30% ceiling
  period: 2024
  input:
    charitable_non_cash_donations_non_50_pct_orgs: 20_000
    charitable_capital_gain_donations_non_50_pct_orgs: 20_000
    positive_agi: 100_000
  output:
    # CG non-50% = min(20000, 20000) = 20000
    # total non-50% = min(20000 + 20000, 30000) = 30000
    charitable_deduction: 30_000

- name: All 5 categories combined with overall 60% cap binding
  period: 2024
  input:
    charitable_cash_donations: 30_000
    charitable_cash_donations_non_50_pct_orgs: 10_000
    charitable_non_cash_donations: 15_000
    charitable_capital_gain_donations_50_pct_orgs: 10_000
    charitable_non_cash_donations_non_50_pct_orgs: 5_000
    charitable_capital_gain_donations_non_50_pct_orgs: 5_000
    positive_agi: 100_000
  output:
    # 50% non-cash = 15000 (ord) + 10000 (CG) = 25000
    # non-50% = min(10000 cash + 5000 ord + 5000 CG, 30000) = 20000
    # 50% cash = 20000
    # total = min(25000 + 20000 + 20000, 60000) = 60000
    charitable_deduction: 60_000

- name: Floor interaction with capital gain property
  period: 2026
  input:
    charitable_capital_gain_donations_50_pct_orgs: 10_000
    positive_agi: 100_000
  output:
    # floor = 0.005 * 100000 = 500
    # CG 50% reduced = max(10000 - 500, 0) = 9500
    # capped = min(9500, 30000) = 9500
    charitable_deduction: 9_500
