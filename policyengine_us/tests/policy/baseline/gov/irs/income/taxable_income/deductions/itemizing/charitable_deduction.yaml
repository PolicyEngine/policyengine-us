    positive_agi: 100_000
  output:
    # Pub 526 Worksheet 2:
    # Cash 50% (Line 13): 5,000.
    # Non-cash 50% (Line 17): min(15,000, 50,000 - 5,000) = 15,000.
    # Non-50% non-cash (Line 24): min(5,000, 30,000, 50,000 - (15,000 + 0)) = 5,000.
    # Total before floor = 5,000 + 15,000 + 5,000 = 25,000.
    # Post-ceiling floor = 0.005 * 100,000 = 500.
    # Total deduction: 25,000 - 500 = 24,500.
