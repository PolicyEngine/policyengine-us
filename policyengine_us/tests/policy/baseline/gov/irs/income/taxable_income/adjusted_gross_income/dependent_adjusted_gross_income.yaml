# The adjusted gross income of IRC 62 on a tax unit dependent's own return:
# gross income with losses netted, less the dependent's own above-the-line
# deductions, plus their taxable Social Security (IRC 86).

- name: 2025, a filer who is not a dependent has none
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 8_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # The head's income is on the tax unit's return, not a dependent's.
    dependent_adjusted_gross_income: [0, 8_000]

- name: 2025, a capital loss counts up to the IRC 1211(b) limit
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 8_000
        short_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # IRC 1211(b): 3,000 of the 5,000 loss offsets other income.
    dependent_adjusted_gross_income: [0, 5_000]

- name: 2025, a self-employment loss nets against wages
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 8_000
        self_employment_income: -3_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    dependent_adjusted_gross_income: [0, 5_000]

- name: 2025, an estate or trust loss nets against wages
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 8_000
        estate_income: -2_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # Schedule E, Part III: 8,000 - 2,000. The same netting sets the
    # modified adjusted gross income of IRC 86(b)(2).
    dependent_taxable_ss_magi: [0, 6_000]
    dependent_adjusted_gross_income: [0, 6_000]

- name: 2025, the dependent's own above-the-line deductions come off
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        taxable_interest_income: 10_000
        early_withdrawal_penalty: 1_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # IRC 62(a)(9): 10,000 - 1,000.
    dependent_adjusted_gross_income: [0, 9_000]

- name: 2025, taxable Social Security is part of it
  period: 2025
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      dependent:
        # A qualifying child has no gross income test (IRC 152(c)), and a
        # child disabled before 22 keeps survivors benefits past 19
        # (42 U.S.C. 402(d)(1)(B)).
        age: 20
        is_tax_unit_dependent: true
        is_full_time_student: true
        is_disabled: true
        social_security_survivors: 20_000
        taxable_interest_income: 30_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # IRC 86 with the unmarried amounts: provisional income 30,000 +
    # 20,000 / 2 = 40,000. Paragraph (1): min(10,000, (40,000 - 25,000) / 2)
    # = 7,500. Bracket: min(7,500, (34,000 - 25,000) / 2) = 4,500. Taxable:
    # min(85% x (40,000 - 34,000) + 4,500, 85% x 20,000) = min(9,600,
    # 17,000) = 9,600.
    dependent_taxable_social_security: [0, 9_600]
    dependent_adjusted_gross_income: [0, 39_600]
