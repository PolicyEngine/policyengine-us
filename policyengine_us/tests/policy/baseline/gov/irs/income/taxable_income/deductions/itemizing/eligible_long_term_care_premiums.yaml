# 26 U.S.C. 213(d)(10): premiums for a qualified long-term care insurance
# contract count as medical care up to a limit set by the insured person's
# attained age before the close of the taxable year. The limits below are the
# Rev. Proc. tables ("40 or less", "more than 40 but not more than 50", ...);
# the 2022 Schedule A instructions (PDF p. 2) restate them by "age at the end
# of 2022": 40 or under $450, 41-50 $850, 51-60 $1,690, 61-70 $4,510, 71 or
# older $5,640.

- name: 2022, age 40 is in the lowest band.
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 40
    long_term_health_insurance_premiums: 10_000
  output:
    eligible_long_term_care_premiums: 450

- name: 2022, age 41 starts the second band.
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 41
    long_term_health_insurance_premiums: 10_000
  output:
    eligible_long_term_care_premiums: 850

- name: 2022, age 50 is still in the second band.
  period: 2022
  absolute_error_margin: 0.01
  input:
    age: 50
    long_term_health_insurance_premiums: 10_000
  output:
    eligible_long_term_care_premiums: 850

- name: 2022, age 51 starts the third band.
