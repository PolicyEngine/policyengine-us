# 26 U.S.C. 224(h) allows no deduction for any taxable year beginning after
# December 31, 2028, and Pub. L. 119-21 sec. 70201(j) applies the section to
# taxable years beginning after December 31, 2024. The same single filer, below
# the $150,000 phase-out start, is computed in each year.

- name: 2024, before the deduction takes effect, no deduction is allowed.
  period: 2024
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0

- name: 2025, the first year, the deduction is allowed.
  period: 2025
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000

- name: 2028, the last year, the deduction is allowed.
  period: 2028
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 10_000

- name: 2029, after 224(h) ends it, no deduction is allowed.
  period: 2029
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0

- name: 2030, later years stay at zero.
  period: 2030
  input:
    people:
      person1:
        age: 40
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        adjusted_gross_income: 60_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    tip_income_deduction: 0

- name: Ineligible cardholder present
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: false
    tip_income: 10_000
    adjusted_gross_income: 100_000
    filing_status: JOINT
  output:
    tip_income_deduction: 0

- name: AGI below phase out start
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 10_000
    adjusted_gross_income: 100_000
    filing_status: JOINT
  output:
    tip_income_deduction: 10_000

- name: Fully phased out
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 10_000
    adjusted_gross_income: 1_000_000
    filing_status: JOINT
  output:
    tip_income_deduction: 0

- name: Joint below the $300,000 threshold is not phased out
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 10_000
    adjusted_gross_income: 190_000
    filing_status: JOINT
  output:
    tip_income_deduction: 10_000

- name: A joint return claims the tips of a spouse with a valid SSN when the other spouse has none
  period: 2025
  input:
    people:
      person1:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 1_000
        treasury_tipped_occupation_code: 102
      person2:
        ssn_card_type: OTHER_NON_CITIZEN
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    # 26 U.S.C. 224(e)(1): only the spouse who received the tips needs an SSN.
    tip_income_deduction_ssn_requirement_met: true
    tip_income_deduction: 1_000

- name: Ineligible cardholder not present
  period: 2025
  input:
    people:
      person1:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person2:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 1_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [person1, person2]
  output:
    tip_income_deduction_ssn_requirement_met: true
    tip_income_deduction: 1_000

- name: Occupation gate allows Treasury-listed tipped occupation
  period: 2025
  input:
    people:
      worker:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        adjusted_gross_income: 100_000
        filing_status: SINGLE
        members: [worker]
  output:
    tip_income_deduction_occupation_requirement_met: true
    tip_income_deduction: 10_000

- name: Occupation gate blocks unlisted occupation
  period: 2025
  input:
    people:
      worker:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 10_000
        treasury_tipped_occupation_code: 0
    tax_units:
      tax_unit:
        adjusted_gross_income: 100_000
        filing_status: SINGLE
        members: [worker]
  output:
    tip_income_deduction_occupation_requirement_met: false
    tip_income_deduction: 0

- name: SSTB exclusion blocks otherwise eligible tipped worker
  period: 2025
  input:
    people:
      worker:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 5_000
        treasury_tipped_occupation_code: 102
        business_is_sstb: true
    tax_units:
      tax_unit:
        adjusted_gross_income: 100_000
        filing_status: SINGLE
        members: [worker]
  output:
    tip_income_deduction_occupation_requirement_met: false
    tip_income_deduction: 0

- name: SSTB self-employment income blocks tip deduction even without legacy flag
  period: 2025
  input:
    people:
      worker:
        ssn_card_type: CITIZEN
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        tip_income: 5_000
        treasury_tipped_occupation_code: 102
        business_is_sstb: false
        sstb_self_employment_income: 50_000
    tax_units:
      tax_unit:
        adjusted_gross_income: 100_000
        filing_status: SINGLE
        members: [worker]
  output:
    tip_income_deduction_occupation_requirement_met: false
    tip_income_deduction: 0

- name: Income excluded under section 911 counts toward the phase-out
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 10_000
    adjusted_gross_income: 140_000
    foreign_earned_income_exclusion: 20_000
    filing_status: SINGLE
  output:
    # 26 U.S.C. 224(b)(2)(B): modified AGI 160,000, 10 whole $1,000 steps x $100.
    tip_income_deduction: 9_000

- name: Single at the phase-out threshold keeps the full deduction
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 150_000
    filing_status: SINGLE
  output:
    tip_income_deduction: 25_000

- name: Single $999 over the threshold has no full $1,000 increment
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 150_999
    filing_status: SINGLE
  output:
    # Schedule 1-A line 11: 999 / 1,000 = 0.999, decreased to 0.
    tip_income_deduction: 25_000

- name: Single $1,000 over the threshold loses $100
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 151_000
    filing_status: SINGLE
  output:
    tip_income_deduction: 24_900

- name: Single $1,001 over the threshold still loses $100
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 151_001
    filing_status: SINGLE
  output:
    # Schedule 1-A line 11: 1,001 / 1,000 = 1.001, decreased to 1.
    tip_income_deduction: 24_900

- name: Single $1,999 over the threshold still loses $100
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 151_999
    filing_status: SINGLE
  output:
    tip_income_deduction: 24_900

- name: Single $2,000 over the threshold loses $200
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 152_000
    filing_status: SINGLE
  output:
    tip_income_deduction: 24_800

- name: Single one dollar short of full phase-out keeps $100
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 399_999
    filing_status: SINGLE
  output:
    # 249 full increments: 25,000 - 24,900.
    tip_income_deduction: 100

- name: Single fully phased out at 250 increments
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 400_000
    filing_status: SINGLE
  output:
    tip_income_deduction: 0

- name: Joint $999 over the $300,000 threshold keeps the full deduction
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 300_999
    filing_status: JOINT
  output:
    tip_income_deduction: 25_000

- name: Joint $1,000 over the $300,000 threshold loses $100
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 301_000
    filing_status: JOINT
  output:
    tip_income_deduction: 24_900

- name: Head of household uses the $150,000 threshold
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 151_000
    filing_status: HEAD_OF_HOUSEHOLD
  output:
    tip_income_deduction: 24_900

- name: Surviving spouse is not married and uses the $150,000 threshold
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 151_000
    filing_status: SURVIVING_SPOUSE
  output:
    tip_income_deduction: 24_900

- name: Married filing separately below the threshold gets no deduction
  period: 2025
  input:
    tip_income_deduction_ssn_requirement_met: true
    treasury_tipped_occupation_code: 102
    tip_income: 25_000
    adjusted_gross_income: 80_000
    filing_status: SEPARATE
  output:
    # 26 U.S.C. 224(f): a married individual must file a joint return.
    tip_income_deduction: 0

- name: A married couple filing separately gets no deduction on either return
  period: 2025
  input:
    people:
      spouse1:
        age: 40
        ssn_card_type: CITIZEN
        treasury_tipped_occupation_code: 102
        tip_income: 25_000
      spouse2:
        age: 39
        ssn_card_type: CITIZEN
        treasury_tipped_occupation_code: 102
        tip_income: 10_000
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
    tax_units:
      tax_unit1:
        members: [spouse1]
        filing_status: SEPARATE
        adjusted_gross_income: 80_000
      tax_unit2:
        members: [spouse2]
        filing_status: SEPARATE
        adjusted_gross_income: 0
    households:
      household:
        members: [spouse1, spouse2]
        state_code: TX
  output:
    # 26 U.S.C. 224(f): a married individual must file a joint return.
    tip_income_deduction: [0, 0]

- name: The same couple filing jointly takes the deduction, capped at $25,000 combined
  period: 2025
  input:
    people:
      spouse1:
        age: 40
        ssn_card_type: CITIZEN
        treasury_tipped_occupation_code: 102
        tip_income: 25_000
      spouse2:
        age: 39
        ssn_card_type: CITIZEN
        treasury_tipped_occupation_code: 102
        tip_income: 10_000
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
    tax_units:
      tax_unit:
        members: [spouse1, spouse2]
        adjusted_gross_income: 80_000
    households:
      household:
        members: [spouse1, spouse2]
        state_code: TX
  output:
    filing_status: JOINT
    tip_income_deduction: 25_000

- name: Separated spouses with no qualifying person file separately and get no deduction
  period: 2025
  input:
    people:
      spouse1:
        age: 40
        ssn_card_type: CITIZEN
        is_separated: true
        treasury_tipped_occupation_code: 102
        tip_income: 25_000
      spouse2:
        age: 39
        ssn_card_type: CITIZEN
        treasury_tipped_occupation_code: 102
        tip_income: 10_000
        is_separated: true
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
    tax_units:
      tax_unit1:
        members: [spouse1]
        adjusted_gross_income: 80_000
      tax_unit2:
        members: [spouse2]
        adjusted_gross_income: 0
    households:
      household1:
        members: [spouse1]
        state_code: TX
      household2:
        members: [spouse2]
        state_code: TX
  output:
    filing_status: [SEPARATE, SEPARATE]
    tip_income_deduction: [0, 0]

- name: A separated spouse with a qualifying child files as head of household and keeps the deduction
  period: 2025
  input:
    people:
      parent:
        age: 40
        ssn_card_type: CITIZEN
        is_separated: true
        treasury_tipped_occupation_code: 102
        tip_income: 25_000
      child:
        age: 10
        ssn_card_type: CITIZEN
      spouse:
        age: 39
        ssn_card_type: CITIZEN
        is_separated: true
    marital_units:
      marital_unit:
        members: [parent, spouse]
      child_marital_unit:
        members: [child]
    tax_units:
      tax_unit1:
        members: [parent, child]
        adjusted_gross_income: 80_000
      tax_unit2:
        members: [spouse]
        adjusted_gross_income: 0
    households:
      household1:
        members: [parent, child]
        state_code: TX
      household2:
        members: [spouse]
        state_code: TX
  output:
    # 26 U.S.C. 7703(b): considered unmarried, so 224(f) does not apply.
    filing_status: [HEAD_OF_HOUSEHOLD, SEPARATE]
    tip_income_deduction: [25_000, 0]

- name: Tips received by a spouse without a valid SSN do not count
  period: 2025
  input:
    people:
      head:
        age: 40
        ssn_card_type: CITIZEN
      spouse:
        age: 38
        ssn_card_type: OTHER_NON_CITIZEN
        tip_income: 10_000
        treasury_tipped_occupation_code: 102
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
        adjusted_gross_income: 80_000
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # 26 U.S.C. 224(e)(1): the spouse who received the tips needs the SSN.
    filing_status: JOINT
    tip_income_deduction_ssn_requirement_met: true
    tip_income_deduction: 0

- name: On a joint return with tips on both sides, only the spouse with a valid SSN counts
  period: 2025
  input:
    people:
      head:
        age: 40
        ssn_card_type: CITIZEN
        tip_income: 15_000
        treasury_tipped_occupation_code: 102
      spouse:
        age: 38
        ssn_card_type: OTHER_NON_CITIZEN
        tip_income: 20_000
        treasury_tipped_occupation_code: 102
    marital_units:
      marital_unit:
        members: [head, spouse]
    tax_units:
      tax_unit:
        members: [head, spouse]
        adjusted_gross_income: 80_000
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # The $25,000 cap applies to the $15,000 that counts, not to $35,000.
    filing_status: JOINT
    tip_income_deduction_ssn_requirement_met: true
    tip_income_deduction: 15_000

- name: A dependent's tips do not count toward the filer's deduction
  period: 2025
  input:
    people:
      parent:
        age: 45
        ssn_card_type: CITIZEN
        employment_income: 60_000
      teen:
        age: 17
        ssn_card_type: CITIZEN
        employment_income: 8_000
        tip_income: 6_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 1_000
    marital_units:
      parent_marital_unit:
        members: [parent]
      teen_marital_unit:
        members: [teen]
    tax_units:
      tax_unit:
        members: [parent, teen]
    households:
      household:
        members: [parent, teen]
        state_code: TX
  output:
    # The teen's tips and wages are the teen's own income (26 U.S.C. 73(a)), outside the parent's AGI.
    filing_status: HEAD_OF_HOUSEHOLD
    is_tax_unit_dependent: [false, true]
    adjusted_gross_income: 60_000
    tip_income_deduction: 0

- name: A filer's own tips count while a dependent's do not
  period: 2025
  input:
    people:
      parent:
        age: 45
        ssn_card_type: CITIZEN
        employment_income: 60_000
        tip_income: 4_000
        treasury_tipped_occupation_code: 102
      teen:
        age: 17
        ssn_card_type: CITIZEN
        employment_income: 8_000
        tip_income: 6_000
        treasury_tipped_occupation_code: 102
        fsla_overtime_premium: 1_000
    marital_units:
      parent_marital_unit:
        members: [parent]
      teen_marital_unit:
        members: [teen]
    tax_units:
      tax_unit:
        members: [parent, teen]
    households:
      household:
        members: [parent, teen]
        state_code: TX
  output:
    # Only the parent's $4,000 counts; the teen's $6,000 does not.
    filing_status: HEAD_OF_HOUSEHOLD
    is_tax_unit_dependent: [false, true]
    adjusted_gross_income: 60_000
    tip_income_deduction: 4_000

- name: An adult input as a dependent deducts nothing even as the only adult in the unit
  period: 2025
  input:
    people:
      adult:
        age: 40
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
        tip_income: 6_000
        treasury_tipped_occupation_code: 102
    tax_units:
      tax_unit:
        members: [adult]
        filing_status: SINGLE
        adjusted_gross_income: 80_000
    households:
      household:
        members: [adult]
        state_code: TX
  output:
    # A dependent's tips stay off the unit's return, like the rest of the
    # dependent's income (irs_gross_income).
    tip_income_deduction: 0

- name: A filer under 18 deducts their own tips, not an adult dependent's
  period: 2025
  input:
    people:
      filer:
        age: 17
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: false
        tip_income: 4_000
        treasury_tipped_occupation_code: 102
      parent:
        age: 45
        ssn_card_type: CITIZEN
        is_tax_unit_dependent: true
        tip_income: 1_000
        treasury_tipped_occupation_code: 102
    marital_units:
      filer_marital_unit:
        members: [filer]
      parent_marital_unit:
        members: [parent]
    tax_units:
      tax_unit:
        members: [filer, parent]
        filing_status: HEAD_OF_HOUSEHOLD
        adjusted_gross_income: 80_000
    households:
      household:
        members: [filer, parent]
        state_code: TX
  output:
    tip_income_deduction: 4_000
