- name: 2025 single filer with a child counts both
  period: 2025
  input:
    people:
      parent:
        age: 30
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    exemptions_count: 2

- name: 2025 single filer who can be claimed as a dependent has no exemptions
  period: 2025
  input:
    people:
      parent:
        age: 20
        claimed_as_dependent_on_another_return: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    # IRC 151(d)(2) for the filer; IRC 152(b)(1) for the child.
    exemptions_count: 0

- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 20
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 20
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    exemptions_count: 1

- name: 2025 joint return with one claimable spouse counts only the other spouse (the claimable spouse is the spouse)
  period: 2025
