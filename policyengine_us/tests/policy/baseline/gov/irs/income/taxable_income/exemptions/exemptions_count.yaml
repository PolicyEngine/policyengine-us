- name: 2025 filer who can be claimed but is not claimed has no own exemption and no dependents
  period: 2025
  input:
    people:
      parent:
        age: 30
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    # Exemptions turn on whether the filer can be claimed, not on an actual claim.
    exemptions_count: 0
