# Publication 501, Dependent Taxpayer Test: a filer whose would-be claimant is not
# required to file and files no return or only for a refund can claim dependents.
# The filer's own exemption is still zero (IRC 151(d)(2)).
- name: 2025 claimable single filer within the filing exception counts the child but not themselves
  period: 2025
  input:
    people:
      parent:
        age: 30
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    exemptions_count: 1

- name: 2025 joint return whose claimable spouse is within the filing exception counts the other spouse and the child (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    exemptions_count: 2

- name: 2025 joint return whose claimable spouse is within the filing exception counts the other spouse and the child (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
