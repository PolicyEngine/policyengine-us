# Tier 1 railroad retirement benefits under IRC 86. Section 86(d)(1)(B) makes
# the social security equivalent benefit (Form RRB-1099 box 5) a social
# security benefit, so section 86 figures one taxable amount on it and title II
# benefits together (Pub. 915 Worksheet 1). Single filers: base amount $25,000,
# adjusted base amount $34,000 (86(c)(1)); joint: $32,000 and $44,000.

- name: Tier 1 railroad benefits between the base and adjusted base amounts.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 20_000
        railroad_social_security_equivalent_benefits: 20_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Combined income = 20,000 + 0.5 * 20,000 = 30,000 (86(b)(1)).
    # 86(a)(1): min(0.5 * 20,000, 0.5 * (30,000 - 25,000)) = 2,500.
    tax_unit_section_86_benefits: 20_000
    tax_unit_taxable_section_86_benefits: 2_500
    tax_unit_taxable_social_security: 0
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 2_500
    taxable_railroad_social_security_equivalent_benefits: 2_500
    tax_exempt_railroad_social_security_equivalent_benefits: 17_500
    adjusted_gross_income: 22_500

- name: The same amount of title II benefits is taxed the same way.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 20_000
        social_security_retirement: 20_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    tax_unit_section_86_benefits: 20_000
    tax_unit_taxable_section_86_benefits: 2_500
    tax_unit_taxable_social_security: 2_500
    taxable_social_security: 2_500
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 0
    adjusted_gross_income: 22_500

- name: Title II and tier 1 benefits share one section 86 amount in proportion.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 20_000
        social_security_retirement: 12_000
        railroad_social_security_equivalent_benefits: 8_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Combined income = 20,000 + 0.5 * 20,000 = 30,000, so 2,500 is taxable,
    # split 12,000 / 20,000 to title II and 8,000 / 20,000 to tier 1.
    tax_unit_taxable_section_86_benefits: 2_500
    tax_unit_taxable_social_security: 1_500
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 1_000
    tax_exempt_social_security: 10_500
    tax_exempt_railroad_social_security_equivalent_benefits: 7_000
    adjusted_gross_income: 22_500

- name: Tier 1 railroad benefits above the adjusted base amount reach the 85 percent cap.
  period: 2024
  input:
    people:
      head:
        age: 67
        employment_income: 50_000
        railroad_social_security_equivalent_benefits: 24_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Combined income = 50,000 + 12,000 = 62,000.
    # 86(a)(2)(A): 0.85 * (62,000 - 34,000) + min(12,000, 4,500) = 28,300.
    # 86(a)(2)(B): 0.85 * 24,000 = 20,400, the lesser.
    tax_unit_taxable_section_86_benefits: 20_400
    taxable_railroad_social_security_equivalent_benefits: 20_400
    adjusted_gross_income: 70_400

- name: On a joint return each spouse is allocated the taxable part of their own kind of benefit.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 67
        employment_income: 40_000
        social_security_retirement: 20_000
      spouse:
        age: 67
        railroad_social_security_equivalent_benefits: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # Combined income = 40,000 + 0.5 * 30,000 = 55,000.
    # 86(a)(1) amount: min(15,000, 0.5 * (55,000 - 32,000)) = 11,500.
    # 86(a)(2)(A): 0.85 * (55,000 - 44,000) + min(11,500, 6,000) = 15,350.
    # 86(a)(2)(B): 0.85 * 30,000 = 25,500, so 15,350 is taxable: two thirds
    # title II (10,233.33) and one third tier 1 (5,116.67).
    tax_unit_taxable_section_86_benefits: 15_350
    taxable_social_security: [10_233.33, 0]
    taxable_railroad_social_security_equivalent_benefits: [0, 5_116.67]
    adjusted_gross_income: 55_350

- name: A dependent's tier 1 benefits are taxed on the dependent's own income.
  period: 2024
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      child:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 30_000
        railroad_social_security_equivalent_benefits: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # The child's combined income = 30,000 + 5,000 = 35,000, over the 34,000
    # adjusted base amount for an unmarried individual.
    # 86(a)(2)(A): 0.85 * 1,000 + min(5,000, 4,500) = 5,350.
    # 86(a)(2)(B): 0.85 * 10,000 = 8,500, so 5,350.
    dependent_taxable_ss_magi: [0, 30_000]
    dependent_taxable_railroad_social_security_equivalent_benefits: [0, 5_350]
    dependent_taxable_social_security: [0, 0]
    dependent_gross_income: [0, 35_350]
    # The head's return holds none of the child's benefits.
    tax_unit_railroad_social_security_equivalent_benefits_for_taxability: 0
    tax_unit_taxable_railroad_social_security_equivalent_benefits: 0
    irs_gross_income: [50_000, 0]

- name: A dependent's title II and tier 1 benefits share one section 86 amount.
  period: 2024
  input:
    people:
      head:
        age: 45
        employment_income: 50_000
      child:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 30_000
        social_security_survivors: 6_000
        railroad_social_security_equivalent_benefits: 4_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # The same 5,350 on 10,000 of benefits: 60 percent title II, 40 percent
    # tier 1.
    dependent_taxable_social_security: [0, 3_210]
    dependent_taxable_railroad_social_security_equivalent_benefits: [0, 2_140]
    dependent_gross_income: [0, 35_350]
