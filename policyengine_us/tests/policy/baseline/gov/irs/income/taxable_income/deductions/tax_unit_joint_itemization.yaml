- name: Case 4, California residents can use each of the four federal and state deduction pairs.
  period: 2025
  input:
    gov.simulation.joint_federal_state_itemization: true
    state_code: [CA, CA, CA, CA]
    age: [40, 40, 40, 40]
    employment_income: [150_000, 150_000, 150_000, 150_000]
    deductible_mortgage_interest: [1_000, 9_750, 4_000, 19_500]
    real_estate_taxes: [0, 250, 0, 500]
    state_and_local_sales_or_income_tax: [0, 0, 12_000, 12_000]
  output:
    # Federal Schedule A amounts are $1,000, $10,000, $16,000, and
    # $32,000. California excludes the state and local income tax on
    # Schedule CA (540), Part II, line 5a. Its single standard is $5,706.
    # https://www.ftb.ca.gov/forms/2025/2025-540-instructions.html
    # https://www.ftb.ca.gov/forms/2025/2025-540-ca-instructions.html
    tax_unit_itemizes: [false, false, true, true]
    state_deduction_method: [STANDARD, ITEMIZED, STANDARD, ITEMIZED]
    ca_itemizes: [false, true, false, true]
    ca_deductions: [5_706, 10_000, 5_706, 20_000]
    ca_taxable_income: [144_294, 140_000, 144_294, 130_000]
    # Schedule P Part I lines 2–5 add back the property tax for these
    # state itemizers. Line 6 adds back the standard for California standard
    # filers. Acquisition mortgage interest needs no AMT add-back here.
    # https://www.ftb.ca.gov/forms/2025/2025-540-p.pdf#page=1
    ca_amti_adjustments: [5_706, 250, 5_706, 500]
    income_tax: [25_067, 25_067, 25_007, 21_167]

- name: Case 5, the chosen filing methods retain the section 1341 repayment deduction.
  period: 2025
  input:
    gov.simulation.joint_federal_state_itemization: true
    state_code: GA
    age: 40
    employment_income: 145_000
    deductible_mortgage_interest: 10_000
    state_and_local_sales_or_income_tax: 0
    claim_of_right_repayment: 5_000
    claim_of_right_prior_year_tax_decrease: 0
  output:
    # Under 26 USC 1341(a)(4)–(5), use the less expensive tax calculation
    # for the filed return. With itemization, the $5,000 repayment deduction
    # saves federal tax while the alternate method grants no credit.
    # https://www.govinfo.gov/content/pkg/USCODE-2024-title26/html/USCODE-2024-title26-subtitleA-chap1-subchapQ-partV-sec1341.htm
    # Georgia follows federal itemization and carries the $15,000 federal
    # itemized deductions. Its tax is $130,000 x 5.19% minus $300 = $6,447.
    # https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download#page=18
    # Federal tax on $130,000 taxable income is $24,047. The combined bill
    # of $30,494 is less than under the two standard deductions ($30,769.70).
    # https://www.irs.gov/instructions/i1040gi
    tax_unit_itemizes: true
    state_deduction_method: ITEMIZED
    claim_of_right_credit_applies: false
    claim_of_right_deduction: 5_000
    income_tax: 24_047
    state_income_tax: 6_447
    federal_state_income_tax: 30_494

- name: Case 6, the Virginia sales tax election minimizes combined income tax.
  period: 2025
  absolute_error_margin: 0.01
  input:
    gov.simulation.joint_federal_state_itemization: true
    state_code: VA
    age: 40
    employment_income: 150_000
    deductible_mortgage_interest: 20_000
    state_withheld_income_tax: 8_000
    state_sales_tax: 7_800
    local_sales_tax: 0
  output:
    # Federal Schedule A line 5a allows either tax. Income taxes would
    # lower the federal bill by $48, to $22,127.
    # https://www.irs.gov/instructions/i1040sca
    # Virginia Schedule A subtracts income taxes on line 18 and retains
    # sales taxes. The extra $7,800 deduction saves $448.50 at 5.75%.
    # https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-sch-a-instructions.pdf
    # https://law.lis.virginia.gov/vacode/title58.1/section58.1-320/
    tax_unit_itemizes: true
    state_deduction_method: ITEMIZED
    state_and_local_sales_tax_elected: true
    state_and_local_sales_or_income_tax: 7_800
    itemized_taxable_income_deductions: 27_800
    va_deductions: 27_800
    va_taxable_income: 121_270
    income_tax: 22_175
    state_income_tax: 6_715.525
    federal_state_income_tax: 28_890.525
