- name: Case 1, legal joint deduction choices in a mixed resident population.
  period: 2025
  input:
    gov.simulation.joint_federal_state_itemization: true
    state_code: [DC, GA, OR, GA]
    age: [40, 40, 40, 40]
    employment_income: [150_000, 145_000, 149_500, 150_000]
    filing_status: [SINGLE, SINGLE, SINGLE, SEPARATE]
    separate_filer_itemizes: [false, false, false, true]
    deductible_mortgage_interest: [13_500, 15_000, 10_000, 0]
    state_and_local_sales_or_income_tax: [2_500, 0, 0, 0]
    or_tax_before_credits_in_prior_year: [0, 0, 0, 0]
  output:
    # DC Act 26-214 sets a $15,000 single standard deduction. D-40 requires
    # the federal method and excludes the $2,500 income tax from Schedule I.
    # Federal itemization saves $60 but costs $127.50 in the District.
    # https://code.dccouncil.gov/us/dc/council/acts/26-214
    # https://otr.cfo.dc.gov/publication/2025-d-40-booklet
    # GA 500 lines 11–12 and 19 require the federal method. Itemizing costs
    # $180 federally and saves $155.70 plus the $300 GA itemizer credit.
    # A separate filer with an itemizing spouse must itemize, even at zero.
    # https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download#page=18
    # ORS 316.695(1)(c)(A) requires the larger Oregon deduction, so Oregon
    # itemizes $10,000 instead of $2,835 even when the federal method is standard.
    # https://www.oregonlegislature.gov/bills_laws/ors/ors316.html
    # https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2025.pdf
    # IRS Form 1040 tax computation uses $15,750 for the 2025 single standard
    # deduction and a 24% marginal rate at each taxable income in this case.
    # https://www.irs.gov/instructions/i1040gi
    tax_unit_itemizes: [false, true, false, true]
    state_deduction_method: [STANDARD, ITEMIZED, ITEMIZED, ITEMIZED]
    dc_deduction_joint: [15_000, 0, 0, 0]
    ga_deductions: [0, 15_000, 0, 0]
    or_deductions: [0, 0, 10_000, 0]
    income_tax: [25_067, 24_047, 24_947, 28_847]
    state_income_tax: [9_875, 6_447, 12_063, 7_485]
    federal_state_income_tax: [34_942, 30_494, 37_010, 36_332]

