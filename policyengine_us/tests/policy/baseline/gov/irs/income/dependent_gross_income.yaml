- name: Dependent with employment income.
  period: 2024
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      child:
        age: 20
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # Only dependent's income counts, head's income excluded
    dependent_gross_income: [0, 5_000]

- name: Head or spouse has zero dependent gross income.
  period: 2024
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 100_000
      spouse:
        age: 43
        is_tax_unit_spouse: true
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
  output:
    # Head and spouse are not dependents, so their dependent_gross_income is 0
    dependent_gross_income: [0, 0]

- name: Dependent with multiple income sources.
  period: 2024
  input:
    people:
      parent:
        age: 50
        is_tax_unit_head: true
      child:
        age: 22
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 3_000
        taxable_interest_income: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # Sum of all income sources
    dependent_gross_income: [0, 3_500]

- name: Dependent parent's Social Security below the IRC 86 base amount is not gross income.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 0 other gross income + 0.5 * 12,000 = 6,000,
    # below the $25,000 single base amount, so no benefits are taxable.
    # Previously all 12,000 of benefits counted.
    dependent_gross_income: [0, 0]

- name: Dependent's capital losses do not offset capital gains.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        long_term_capital_gains: 5_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # Gross income = max(0, 5,000) + max(0, -2,000) = 5,000.
    # Netting would give 5,000 - 2,000 = 3,000.
    dependent_gross_income: [0, 5_000]

- name: Dependent's net capital losses give no capital gains gross income.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        long_term_capital_gains: -1_000
        short_term_capital_gains: -500
        employment_income: 2_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # Gross income = 2,000 + max(0, -1,000) + max(0, -500) = 2,000.
    dependent_gross_income: [0, 2_000]

- name: Dependent's capital gains supplied as a net amount still count.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        capital_gains: 3_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # Long-term and short-term gains are both 0, so the larger of
    # max(0, 0) + max(0, 0) = 0 and the net 3,000 is 3,000.
    dependent_gross_income: [0, 3_000]

- name: Dependent's Social Security is partly taxable above the IRC 86 base amount.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 44_000
        taxable_interest_income: 4_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 4,000 + 0.5 * 44,000 = 26,000.
    # 26,000 is between the 25,000 base and the 34,000 adjusted base.
    # Taxable benefits = min(0.5 * 44,000, 0.5 * (26,000 - 25,000))
    # = min(22,000, 500) = 500.
    # Gross income = 4,000 + 500 = 4,500.
    dependent_gross_income: [0, 4_500]

- name: Dependent's Social Security above the IRC 86 adjusted base amount.
  period: 2024
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 50_000
        taxable_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 20,000 + 0.5 * 50,000 = 45,000,
    # above the 34,000 adjusted base amount.
    # Paragraph (1) amount = min(0.5 * 50,000, 0.5 * (45,000 - 25,000))
    # = min(25,000, 10,000) = 10,000.
    # Bracket amount = min(10,000, 0.5 * (34,000 - 25,000)) = 4,500.
    # Taxable benefits = min(0.85 * (45,000 - 34,000) + 4,500, 0.85 * 50,000)
    # = min(9,350 + 4,500, 42,500) = 13,850.
    # Gross income = 20,000 + 13,850 = 33,850.
    dependent_gross_income: [0, 33_850]

- name: Unemployment compensation and tax-exempt interest count toward a dependent's provisional income.
  period: 2024
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 20_000
        unemployment_compensation: 3_000
        tax_exempt_interest_income: 13_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Provisional income = 3,000 + 13,000 + 0.5 * 20,000 = 26,000.
    # Taxable benefits = min(0.5 * 20,000, 0.5 * (26,000 - 25,000)) = 500.
    # Tax-exempt interest is not gross income, but unemployment compensation is.
    # Gross income = 3,000 + 500 = 3,500.
    dependent_gross_income: [0, 3_500]

- name: Head's Social Security does not count toward dependent gross income.
  period: 2024
  input:
    people:
      head:
        age: 70
        is_tax_unit_head: true
        social_security_retirement: 60_000
        taxable_interest_income: 30_000
      dependent:
        age: 30
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        employment_income: 1_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
  output:
    # The head is not a dependent, so their gross income is not tested.
    # The dependent has no benefits: provisional income = 1,000 < 25,000.
    dependent_gross_income: [0, 1_000]

- name: Capital losses reduce a dependent's modified AGI for Social Security but not their gross income.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 44_000
        long_term_capital_gains: 4_000
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # IRC 86(b)(2) modified AGI = net capital gain 4,000 - 2,000 = 2,000.
    # Provisional income = 2,000 + 0.5 * 44,000 = 24,000 < 25,000 base,
    # so no benefits are taxable.
    # Gross income = 4,000 gross gains (the loss is not netted) + 0 = 4,000.
    dependent_taxable_ss_magi: [0, 2_000]
    dependent_taxable_social_security: [0, 0]
    dependent_gross_income: [0, 4_000]

- name: Married dependent parents who live together have zero IRC 86 base amounts.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      mother:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
      father:
        age: 72
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
    marital_units:
      head_marital_unit:
        members: [head]
      parents_marital_unit:
        members: [mother, father]
    tax_units:
      tax_unit:
        members: [head, mother, father]
    households:
      household:
        members: [head, mother, father]
  output:
    # Each parent: provisional income = 0 + 0.5 * 12,000 = 6,000.
    # Married, living together and not filing jointly, so the base and
    # adjusted base amounts are 0 (IRC 86(c)(1)(C), (c)(2)(C)).
    # Bracket amount = min(min(6,000, 0.5 * 6,000), 0.5 * (0 - 0)) = 0.
    # Taxable = min(0.85 * (6,000 - 0) + 0, 0.85 * 12,000)
    # = min(5,100, 10,200) = 5,100.
    dependent_lives_with_spouse: [false, true, true]
    dependent_gross_income: [0, 5_100, 5_100]

- name: Married dependent whose spouse files their own return has zero IRC 86 base amounts.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      mother:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 12_000
      father:
        age: 72
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        employment_income: 30_000
    marital_units:
      head_marital_unit:
        members: [head]
      parents_marital_unit:
        members: [mother, father]
    tax_units:
      head_tax_unit:
        members: [head, mother]
      father_tax_unit:
        members: [father]
    households:
      household:
        members: [head, mother, father]
  output:
    # The mother lives with her spouse and does not file jointly, so her
    # provisional income of 0.5 * 12,000 = 6,000 is all over the 0 base:
    # taxable = min(0.85 * 6,000, 0.85 * 12,000) = 5,100.
    # The father heads his own tax unit, so his income is not tested.
    dependent_gross_income: [0, 5_100, 0]

- name: The IRC 1211(b) capital loss limit applies to a dependent's modified AGI.
  period: 2022
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        employment_income: 50_000
      parent:
        age: 70
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
        social_security_retirement: 30_000
        taxable_pension_income: 14_000
        short_term_capital_gains: -5_000
    tax_units:
      tax_unit:
        members: [head, parent]
    households:
      household:
        members: [head, parent]
  output:
    # Modified AGI = 14,000 - min(5,000, 3,000) = 11,000.
    # Provisional income = 11,000 + 0.5 * 30,000 = 26,000.
    # Taxable = min(0.5 * 30,000, 0.5 * (26,000 - 25,000)) = 500.
    # Gross income = 14,000 + 0 gains + 500 = 14,500.
    dependent_taxable_ss_magi: [0, 11_000]
    dependent_gross_income: [0, 14_500]
