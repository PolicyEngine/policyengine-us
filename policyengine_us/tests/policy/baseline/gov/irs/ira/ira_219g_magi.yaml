# 26 U.S.C. 219(g)(3)(A)(ii) figures IRA MAGI without regard to section 85(c),
# so all unemployment compensation counts, reported or modeled. The PA inputs
# below give pa_uc = 10,218 (see the PA UC integration tests).

- name: Case 1, modeled state unemployment compensation counts in IRA MAGI.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: PA
    employment_income: 80_000
    pa_uc_highest_quarter_wages: 10_000
    pa_uc_base_year_wages: 28_000
    pa_uc_credit_weeks: 26
    weeks_unemployed: 26
    pa_uc_gross_weekly_earnings: 0
  output:
    # No reported UC, so total UC falls back to the modeled PA UC.
    total_unemployment_compensation: 10_218
    # 80,000 + 10,218 = 90,218.
    ira_219g_magi: 90_218

- name: Case 2, reported unemployment compensation counts in IRA MAGI, as the control for modeled UC.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 35
    state_code: PA
    employment_income: 80_000
    unemployment_compensation: 10_218
  output:
    total_unemployment_compensation: 10_218
    ira_219g_magi: 90_218
