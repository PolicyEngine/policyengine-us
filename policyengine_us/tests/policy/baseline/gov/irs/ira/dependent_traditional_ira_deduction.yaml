# A dependent deducts their own traditional IRA contributions on their own
# return (26 U.S.C. 219(b)(1), 219(g)); the filer's traditional_ira_deduction
# excludes them.
- name: A student dependent deducts their own contribution in full
  period: 2025
  input:
    people:
      parent:
        age: 50
        employment_income: 80_000
        is_tax_unit_head: true
      student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        employment_income: 29_000
        traditional_ira_contributions: 5_000
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: TX
  output:
    dependent_traditional_ira_deduction: [0, 5_000]
    traditional_ira_deduction: [0, 0]

- name: The dependent's deduction is limited to their compensation
  period: 2025
  input:
    people:
      parent:
        age: 50
        employment_income: 80_000
        is_tax_unit_head: true
      student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        employment_income: 3_000
        traditional_ira_contributions: 5_000
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: TX
  output:
    dependent_traditional_ira_deduction: [0, 3_000]

- name: An active-participant dependent is phased out on the single schedule
  # Notice 2024-80: the 2025 single range is $79,000 to $89,000 and the dollar
  # limit $7,000. Modified AGI of $85,000 is 60% through the range, so the
  # limit falls by $4,200 to $2,800.
  period: 2025
  input:
    people:
      parent:
        age: 50
        employment_income: 80_000
        is_tax_unit_head: true
      student:
        age: 22
        is_full_time_student: true
        is_tax_unit_dependent: true
        employment_income: 85_000
        ira_active_participant: true
        traditional_ira_contributions: 7_000
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: TX
  output:
    dependent_traditional_ira_deduction: [0, 2_800]

- name: A dependent living with a covered spouse is phased out on the separate schedule
  # Pub. 590-A Table 1-3: married filing separately, living with a spouse who
  # is covered, phases out from $0 to $10,000. Modified AGI of $10,000 leaves
  # no deduction, though the dependent is not covered.
  period: 2025
  input:
    people:
      parent:
        age: 50
        employment_income: 80_000
        is_tax_unit_head: true
      student:
        age: 20
        is_full_time_student: true
        is_tax_unit_dependent: true
        employment_income: 10_000
        traditional_ira_contributions: 5_000
      students_spouse:
        age: 22
        is_tax_unit_head: true
        employment_income: 30_000
        ira_active_participant: true
    tax_units:
      parents_unit:
        members: [parent, student]
      spouses_unit:
        members: [students_spouse]
    marital_units:
      parent_unit:
        members: [parent]
      couple:
        members: [student, students_spouse]
    households:
      household:
        members: [parent, student, students_spouse]
        state_code: TX
  output:
    dependent_traditional_ira_deduction: [0, 0, 0]

- name: The dependent's IRA modified AGI includes taxable Social Security
  # Pub. 590-A Appendix B, Worksheet 1: a covered dependent aged 67 living
  # with their spouse has $3,000 of wages and $5,000 of benefits. With a zero
  # base amount, 85% of the benefits, $4,250, is taxable before the IRA
  # deduction, so modified AGI is $7,250. That is 72.5% through the $0 to
  # $10,000 separate range, so the $8,000 limit falls by $5,800 to $2,200.
  period: 2025
  input:
    people:
      parent:
        age: 50
        employment_income: 80_000
        is_tax_unit_head: true
      elder:
        age: 67
        is_tax_unit_dependent: true
        employment_income: 3_000
        traditional_ira_contributions: 3_000
        ira_active_participant: true
        social_security_retirement: 5_000
      elders_spouse:
        age: 66
        is_tax_unit_head: true
        employment_income: 30_000
    tax_units:
      parents_unit:
        members: [parent, elder]
      spouses_unit:
        members: [elders_spouse]
    marital_units:
      parent_unit:
        members: [parent]
      couple:
        members: [elder, elders_spouse]
    households:
      household:
        members: [parent, elder, elders_spouse]
        state_code: TX
  output:
    dependent_traditional_ira_deduction: [0, 2_200, 0]
