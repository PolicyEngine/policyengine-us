# Tax Unit Is Filer Tests
# Tests the filing requirement logic based on IRS rules

- name: High income - required to file
  period: 2024
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 75_000
  output:
    tax_unit_is_filer: true

- name: Low income - gets refund so files
  period: 2024
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 5_000
  output:
    # Low earners with EITC get refunds and file
    tax_unit_is_filer: true

- name: Married filing separately - lower threshold
  period: 2024
  input:
    filing_status: SEPARATE
    age_head: 40
    employment_income: 6_000
  output:
    tax_unit_is_filer: true

- name: Low income but high unearned income
  period: 2024
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 1_000
    dividend_income: 5_000
  output:
    tax_unit_is_filer: true

- name: Senior with low income - files due to refund
  period: 2024
  input:
    filing_status: SINGLE
    age_head: 70
    employment_income: 10_000
  output:
    # Seniors may get refunds and file
    tax_unit_is_filer: true

- name: Zero income - not required
  period: 2024
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 0
  output:
    tax_unit_is_filer: false

# 26 U.S.C. 6012(c): for the filing requirement, gross income is computed
# without regard to the section 911 exclusion.
- name: Excluded foreign earnings count toward the filing threshold
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 5_000
    foreign_earned_income_exclusion: 30_000
    would_file_if_eligible_for_refundable_credit: false
    would_file_taxes_voluntarily: false
  output:
    # $35,000 of gross income under section 6012(c), over the $15,750
    # single standard deduction.
    tax_unit_is_required_to_file: true
    tax_unit_is_filer: true
    # Filing does not make a section 911 claimant eligible for the EITC
    # (section 32(c)(1)(C)).
    eitc: 0

- name: The same filer without excluded foreign earnings is under the threshold
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 5_000
    foreign_earned_income_exclusion: 0
    would_file_if_eligible_for_refundable_credit: false
    would_file_taxes_voluntarily: false
  output:
    tax_unit_is_required_to_file: false
    tax_unit_is_filer: false

- name: Excluded foreign earnings do not count as unearned income
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    foreign_earned_income_exclusion: 10_000
    would_file_if_eligible_for_refundable_credit: false
    would_file_taxes_voluntarily: false
  output:
    # $10,000 is under the $15,750 threshold, and none of it is unearned.
    tax_unit_is_required_to_file: false

# Treas. Reg. 1.911-7(a)(1): the section 911 election is filed with the return,
# and Form 2555 is attached to Form 1040 when filed, so a tax unit with an
# exclusion files even below the filing threshold and with no credit to claim.
- name: Section 911 claimant below the filing threshold files to claim the exclusion
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 5_000
    foreign_earned_income_exclusion: 1_000
  output:
    # $6,000 of gross income under section 6012(c), under $15,750. Section
    # 32(c)(1)(C) denies the EITC, so the exclusion is the reason to file.
    tax_unit_is_required_to_file: false
    eitc: 0
    tax_unit_is_filer: true

- name: Section 911 claimant below the filing threshold who would not file does not
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 5_000
    foreign_earned_income_exclusion: 1_000
    would_file_if_eligible_for_refundable_credit: false
    would_file_taxes_voluntarily: false
  output:
    # A continuing election needs no return below the filing threshold
    # (Treas. Reg. 1.911-7(a)(1)).
    tax_unit_is_required_to_file: false
    tax_unit_is_filer: false

- name: Section 911 parents under the threshold keep filing without the refundable credits
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 28_000
      spouse:
        age: 40
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        foreign_earned_income_exclusion: 1_000
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    # $29,000 of gross income under section 6012(c), under $31,500.
    tax_unit_is_required_to_file: false
    refundable_ctc: 0
    eitc: 0
    tax_unit_is_filer: true

- name: Section 911 parents under the threshold who would not file do not
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 28_000
      spouse:
        age: 40
      child:
        age: 5
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        foreign_earned_income_exclusion: 1_000
        would_file_if_eligible_for_refundable_credit: false
        would_file_taxes_voluntarily: false
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    tax_unit_is_required_to_file: false
    tax_unit_is_filer: false

- name: A housing-only leaf claimant with zero aggregates files according to tax-benefit propensity
  period: 2025
  input:
    tax_unit_is_required_to_file: false
    eligible_for_refundable_credits: false
    would_file_if_eligible_for_refundable_credit: true
    would_file_taxes_voluntarily: false
    foreign_earned_income_exclusion_amount: 0
    foreign_housing_exclusion: 5_000
    foreign_earned_income_exclusion_allocable_deductions: 5_000
  output:
    foreign_earned_income_exclusion: 0
    section_911_excluded_income: 0
    tax_unit_is_filer: true

- name: A housing-only leaf claimant with zero aggregates and no filing propensity does not file
  period: 2025
  input:
    tax_unit_is_required_to_file: false
    eligible_for_refundable_credits: false
    would_file_if_eligible_for_refundable_credit: false
    would_file_taxes_voluntarily: false
    foreign_earned_income_exclusion_amount: 0
    foreign_housing_exclusion: 5_000
    foreign_earned_income_exclusion_allocable_deductions: 5_000
  output:
    foreign_earned_income_exclusion: 0
    section_911_excluded_income: 0
    tax_unit_is_filer: false
