  period: 2025
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 15_750
  output:
    # (f)(1): gross income does not exceed the standard deduction. Chart A of
    # the 2025 instructions says "at least" $15,750 (decision d1403).
    tax_unit_is_required_to_file: false

