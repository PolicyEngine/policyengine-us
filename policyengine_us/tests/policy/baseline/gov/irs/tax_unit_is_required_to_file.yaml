        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # $32,200 + $1,650.
    tax_unit_is_required_to_file: false

- name: Case 11, 2026, joint return with one spouse aged 65 and gross income of $33,850.
