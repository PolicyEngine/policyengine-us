  output:
    # $32,200 + 2 x $1,650.
    tax_unit_is_required_to_file: false

- name: Case 13, 2026, joint return with both spouses aged 65 and blind at $35,500.
  period: 2026
  input:
    people:
      person1:
        age: 70
        is_blind: true
        taxable_interest_income: 35_500
      person2:
        age: 68
        is_blind: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Two age additions only. The standard deduction is $38,800 with the two
    # blindness additions, which (a)(1)(B) leaves out.
    standard_deduction: 38_800
    tax_unit_is_required_to_file: true

- name: Case 14, 2026, head of household aged 65 with gross income of $26,199.
  period: 2026
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    age: 66
    taxable_interest_income: 26_199
  output:
    # $24,150 + $2,050.
    tax_unit_is_required_to_file: false

- name: Case 15, 2026, head of household aged 65 with gross income of $26,200.
  period: 2026
  input:
    filing_status: HEAD_OF_HOUSEHOLD
    age: 66
    taxable_interest_income: 26_200
  output:
    tax_unit_is_required_to_file: true

- name: Case 16, 2026, surviving spouse aged 65 with gross income of $33,849.
  period: 2026
  input:
    filing_status: SURVIVING_SPOUSE
    age: 66
    taxable_interest_income: 33_849
  output:
    # $32,200 + $1,650: a surviving spouse takes the married addition.
    tax_unit_is_required_to_file: false

- name: Case 17, 2026, surviving spouse aged 65 with gross income of $33,850.
  period: 2026
  input:
    filing_status: SURVIVING_SPOUSE
    age: 66
    taxable_interest_income: 33_850
  output:
    tax_unit_is_required_to_file: true

- name: Case 18, 2026, married individual filing separately with $1 of gross income.
  period: 2026
  input:
    filing_status: SEPARATE
    age: 70
    is_blind: true
    taxable_interest_income: 1
  output:
    # The spouse files a separate return, so (a)(1)(A)(iv) does not apply,
    # and the exemption amount is zero. Age and blindness do not matter.
    tax_unit_is_required_to_file: true

- name: Case 19, 2026, married individual filing separately with no gross income.
  period: 2026
  input:
    filing_status: SEPARATE
    age: 40
  output:
    # With a zero exemption amount, (a)(1)(A) read literally reaches even
    # $0 of gross income; the IRS set $5 for 2018 to 2025. The model, as
    # before, requires a return only for positive gross income (decision
    # d1403).
    tax_unit_is_required_to_file: false

