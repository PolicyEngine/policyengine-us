# Federal filing requirement for a tax unit nobody can claim as a dependent.
#
# 2018 to 2025, 26 U.S.C. 6012(f): no return is required of an unmarried
# individual whose gross income "does not exceed the standard deduction
# applicable to such individual ... under section 63", or of a couple whose
# combined gross income does not exceed the joint standard deduction. The
# standard deduction includes the additional standard deduction for age and
# for blindness (section 63(c)(1) and (f)).
#
# From 2026, 26 U.S.C. 6012(a)(1): subsection (f) covers only taxable years
# "before January 1, 2026", and Pub. L. 119-21 does not amend section 6012.
# No return is required when gross income is "less than" the exemption amount
# (zero, section 151(d)(5)) plus the basic standard deduction. Subparagraph
# (B) raises that by one additional standard deduction for each spouse aged
# 65 or older, "by reason of section 63(f)(1)", and not for blindness. A
# married individual filing separately has no exception.
# https://www.law.cornell.edu/uscode/text/26/6012
#
# 2026 amounts, Rev. Proc. 2025-32, sec. 4.14: basic standard deduction
# $16,100 single, $32,200 joint and surviving spouse, $24,150 head of
# household; additional standard deduction $1,650, or $2,050 if unmarried and
# not a surviving spouse. https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=18
# Chart A of the 2017 Form 1040 instructions, the last year under (a)(1), has
# the same form: age only, and "at least".
# https://www.irs.gov/pub/irs-prior/i1040gi--2017.pdf#page=8
#
# 2025 amounts, Rev. Proc. 2024-40 as amended by Pub. L. 119-21 sec. 70102:
# $15,750 single, $31,500 joint, $23,625 head of household; additional
# standard deduction $1,600, or $2,000 if unmarried and not a surviving spouse.

- name: Case 1, 2026, single filer under 65 with gross income a dollar under $16,100.
  period: 2026
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 16_099
  output:
    tax_unit_is_required_to_file: false

- name: Case 2, 2026, single filer under 65 with gross income of exactly $16,100.
  period: 2026
  input:
    filing_status: SINGLE
    age: 40
    taxable_interest_income: 16_100
  output:
    # (a)(1)(A)(i): excused only if gross income is less than $16,100.
    tax_unit_is_required_to_file: true

- name: Case 3, 2026, blind single filer under 65 with gross income of $16,100.
  period: 2026
  input:
    filing_status: SINGLE
    age: 40
    is_blind: true
    employment_income: 16_100
  output:
    # Blindness does not raise the (a)(1) threshold.
    tax_unit_is_required_to_file: true

- name: Case 4, 2026, blind single filer under 65 with gross income a dollar under $16,100.
  period: 2026
  input:
    filing_status: SINGLE
    age: 40
    is_blind: true
    employment_income: 16_099
  output:
    tax_unit_is_required_to_file: false

- name: Case 5, 2026, single filer aged 65 with gross income a dollar under $18,150.
  period: 2026
  input:
    filing_status: SINGLE
    age: 65
    taxable_interest_income: 18_149
  output:
    # $16,100 + $2,050.
    tax_unit_is_required_to_file: false

- name: Case 6, 2026, single filer aged 65 with gross income of exactly $18,150.
  period: 2026
  input:
    filing_status: SINGLE
    age: 65
    taxable_interest_income: 18_150
  output:
    tax_unit_is_required_to_file: true

- name: Case 7, 2026, blind single filer aged 65 gets only the age addition.
  period: 2026
  input:
    filing_status: SINGLE
    age: 70
    is_blind: true
    taxable_interest_income: 18_150
  output:
    # $16,100 + $2,050 for age; nothing for blindness.
    tax_unit_is_required_to_file: true

- name: Case 8, 2026, joint return under 65 with combined gross income a dollar under $32,200.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
      person2:
        age: 40
        taxable_interest_income: 12_199
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    filing_status: JOINT
    tax_unit_is_required_to_file: false

- name: Case 9, 2026, joint return under 65 with combined gross income of exactly $32,200.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
      person2:
        age: 40
        taxable_interest_income: 12_200
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # (a)(1)(A)(iv): excused only if combined gross income is less than
    # $32,200.
    tax_unit_is_required_to_file: true

- name: Case 10, 2026, joint return with one spouse aged 65 and gross income of $33,849.
  period: 2026
  input:
    people:
      person1:
        age: 67
        taxable_interest_income: 33_849
      person2:
        age: 60
