# A tax unit whose head or spouse can be claimed as a dependent keeps the
# standard deduction test from 2026 too: (a)(1)(C)(i)(II), "total gross income
# in excess of the standard deduction", which is what Chart B applies.
# Whether the (A) threshold, which leaves out blindness and requires a return
# at equality, also binds these filers is decision d1395. These cases pin the
# model's reading until it is ruled.

- name: Case 28, 2026, blind single filer who can be claimed keeps the blindness addition.
  period: 2026
  input:
    filing_status: SINGLE
    age: 19
    is_blind: true
    claimed_as_dependent_on_another_return: true
    employment_income: 17_000
  output:
    # Limited standard deduction min($16,100, $17,000 + $450) + $2,050 =
    # $18,150, over gross income. Nobody can claim the filer in Case 3.
    standard_deduction: 18_150
    tax_unit_is_required_to_file: false

- name: Case 29, 2026, joint return whose spouse can be claimed, at exactly the joint amount.
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 32_200
      person2:
        age: 40
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Gross income does not exceed the $32,200 standard deduction. Compare
    # Case 9, where nobody can be claimed.
    tax_unit_is_required_to_file: false

# 26 U.S.C. 6012(c): for the filing requirement, gross income is computed
# without regard to the section 911 exclusion. With Form 2555 leaf inputs,
# that is Form 2555 line 43 (the line 36 housing exclusion plus the line 42
# foreign earned income exclusion), not the Foreign Earned Income Tax
# Worksheet line 2c stacking amount. Line 2c is net of the line 44 deductions
# and worksheet line 2b, and it includes the line 50 housing deduction, which
# is a deduction rather than an exclusion. The 2025 single threshold is the
# $15,750 standard deduction (Form 1040 instructions, Chart A).

- name: Housing exclusion offset by allocable deductions still counts toward the threshold
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 10_000
    foreign_housing_exclusion: 10_000
    foreign_earned_income_exclusion_allocable_deductions: 10_000
  output:
    # Line 2c is max(0, 10,000 - 10,000) = 0, but line 43 is 10,000.
    foreign_earned_income_exclusion: 0
    foreign_earned_income_exclusion_gross: 10_000
    # $20,000 of gross income, over $15,750.
    tax_unit_is_required_to_file: true

- name: Worksheet line 2b disallowed deductions do not reduce filing gross income
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 10_000
    foreign_earned_income_exclusion_amount: 10_000
    foreign_earned_income_exclusion_disallowed_deductions: 10_000
  output:
    foreign_earned_income_exclusion: 0
    # $20,000 of gross income, over $15,750.
    tax_unit_is_required_to_file: true

- name: The line 50 housing deduction is not an excluded amount
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 10_000
    foreign_earned_income_exclusion_amount: 5_000
    foreign_housing_deduction: 5_000
  output:
    # Line 2c adds the deduction (10,000); line 43 does not (5,000).
    foreign_earned_income_exclusion: 10_000
    foreign_earned_income_exclusion_gross: 5_000
    # $15,000 of gross income, under $15,750.
    tax_unit_is_required_to_file: false

- name: Supplied leaves replace an explicit zero legacy amount
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 10_000
    foreign_earned_income_exclusion: 0
    foreign_housing_exclusion: 10_000
  output:
    # $20,000 of gross income, over $15,750.
    tax_unit_is_required_to_file: true

- name: Without leaf inputs the legacy amount is the fallback
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 10_000
    foreign_earned_income_exclusion: 10_000
  output:
    # $20,000 of gross income, over $15,750.
    tax_unit_is_required_to_file: true

- name: A negative legacy amount does not lower filing gross income
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    employment_income: 18_000
    foreign_earned_income_exclusion: -5_000
  output:
    # An exclusion cannot be negative (worksheet line 2c is floored at zero),
    # so gross income stays $18,000, over $15,750.
    tax_unit_is_required_to_file: true

- name: Joint filers add line 43 from both spouses' forms
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 20_000
      spouse:
        age: 40
    tax_units:
      tax_unit:
        members: [head, spouse]
        foreign_housing_exclusion: 12_000
        foreign_earned_income_exclusion_allocable_deductions: 12_000
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    foreign_earned_income_exclusion: 0
    # $32,000 of gross income, over the $31,500 joint threshold.
    tax_unit_is_required_to_file: true

- name: Excluded amounts from leaves do not count as unearned income
  period: 2025
  input:
    filing_status: SINGLE
    age_head: 40
    foreign_housing_exclusion: 10_000
    foreign_earned_income_exclusion_allocable_deductions: 10_000
  output:
    # $10,000 of gross income, under $15,750, and none of it is unearned.
    tax_unit_is_required_to_file: false

- name: Gross section 911 exclusion reaches the 2026 age-only threshold for a blind filer
  period: 2026
  input:
    filing_status: SINGLE
    age: 40
    is_blind: true
    employment_income: 10_000
    foreign_housing_exclusion: 6_100
    foreign_earned_income_exclusion_allocable_deductions: 6_100
  output:
    # Line 2c = max(0, $6,100 - $6,100) = $0; line 43 = $6,100.
    foreign_earned_income_exclusion: 0
    foreign_earned_income_exclusion_gross: 6_100
    # Section 6012(c): $10,000 + $6,100 = $16,100 of filing gross income.
    # Section 6012(a)(1): $16,100 >= $16,100 basic + $0 age addition.
    # Blindness does not raise the filing threshold; the standard deduction
    # is $16,100 + $2,050 = $18,150 and would not require a return under (f).
    standard_deduction: 18_150
    tax_unit_is_required_to_file: true
