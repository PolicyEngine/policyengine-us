    tax_unit_is_required_to_file: true

- name: Case 12, 2026, joint return with both spouses aged 65 and gross income of $35,499.
  period: 2026
  input:
    people:
      person1:
        age: 70
        taxable_interest_income: 35_499
      person2:
        age: 68
    tax_units:
