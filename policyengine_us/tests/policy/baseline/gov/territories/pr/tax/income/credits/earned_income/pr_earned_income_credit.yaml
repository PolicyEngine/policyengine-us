- name: Eligible HEAD_OF_HOUSEHOLD filer gets the individual phase-out threshold
  period: 2023
  input:
    people:
      person1:
        pr_gross_income_person: 17_660
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: HEAD_OF_HOUSEHOLD
        eitc_child_count: 0
        pr_earned_income_credit_eligible: true
    households:
      household:
        members: [person1]
        state_code: PR
  # Previously, HoH fell through the `select` (only covered SINGLE and
  # JOINT) to a default phase-out threshold of 0, which eliminated any
  # credit. After the fix, HoH uses the `single` threshold and receives
  # the same max credit (1,656) as a SINGLE filer with identical income.
  output:
    pr_earned_income_credit: 1_656

- name: Eligible SURVIVING_SPOUSE filer gets the joint phase-out threshold
  period: 2023
  input:
    people:
      person1:
        pr_gross_income_person: 19_000
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SURVIVING_SPOUSE
        eitc_child_count: 0
        pr_earned_income_credit_eligible: true
    households:
      household:
        members: [person1]
        state_code: PR
  # SURVIVING_SPOUSE uses the joint threshold (consistent with US
  # federal convention for two years post-bereavement). At
  # pr_gross_income 19_000 the phase-out has not begun
  # (joint threshold = 19_870), so the full max credit applies.
  output:
    pr_earned_income_credit: 1_656

# Section 1052.01(i) indexes the credit "según ajustado por el Servicio de
# Rentas Internas Federal"; Hacienda publishes the adjusted amounts in BI RI
# 24-04 (2024) and BI RI 26-01 (2025).
- name: 2024 three or more children, single, phase-out under the 2024 threshold
  period: 2024
  input:
    people:
      person1:
        pr_gross_income_person: 25_000
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        eitc_child_count: 3
        pr_earned_income_credit_eligible: true
    households:
      household:
        members: [person1]
        state_code: PR
  output:
    # 2024 maximum $7,563 less 34.21% of ($25,000 - $24,430) = $194.997.
    pr_earned_income_credit: 7_368.003

- name: 2025 three or more children, single, under the 2025 threshold
  period: 2025
  input:
    people:
      person1:
        pr_gross_income_person: 25_000
        is_tax_unit_head_or_spouse: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        eitc_child_count: 3
        pr_earned_income_credit_eligible: true
    households:
      household:
        members: [person1]
        state_code: PR
  output:
    # $25,000 is under the $25,110 threshold, so the $7,774 maximum applies
    # (the 2023 schedule would give $7,173 - 34.21% x $1,820 = $6,550.378).
    pr_earned_income_credit: 7_774

