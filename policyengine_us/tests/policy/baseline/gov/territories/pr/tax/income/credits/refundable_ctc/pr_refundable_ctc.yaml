- name: Basic case
  period: 2024
  input:
    eitc: 2_000
    uncapped_ssi: 1_000
    pr_refundable_ctc_social_security_tax: 6_600
    refundable_ctc: 2_800
    ctc: 3_000
  output:
    pr_refundable_ctc: 3_000

- name: Uncapped SSI below 0
  period: 2024
  input:
    eitc: 1_000
    uncapped_ssi: -1_000
    pr_refundable_ctc_social_security_tax: 500
    refundable_ctc: 2_000
    ctc: 1_000
  output:
    pr_refundable_ctc: 1_000

# Section 24(k)(2)(B)(ii) drops only the three-children condition for residents
# of Puerto Rico; section 24(d)(3) still denies the refundable credit to a
# filer electing a section 911 exclusion.
- name: Section 911 exclusion denies the credit despite social security taxes
  period: 2024
  input:
    eitc: 0
    uncapped_ssi: 0
    pr_refundable_ctc_social_security_tax: 1_530
    refundable_ctc: 0
    ctc: 2_000
    foreign_earned_income_exclusion: 1
  output:
    pr_refundable_ctc: 0

- name: The same filer without a section 911 exclusion gets the social security tax amount
  period: 2024
  input:
    eitc: 0
    uncapped_ssi: 0
    pr_refundable_ctc_social_security_tax: 1_530
    refundable_ctc: 0
    ctc: 2_000
    foreign_earned_income_exclusion: 0
  output:
    pr_refundable_ctc: 1_530

- name: In 2021, a section 911 exclusion does not deny the credit
  period: 2021
  input:
    # Section 24(i)(1) switched off subsection (d) for bona fide residents
    # of Puerto Rico, so the whole credit was refundable.
    eitc: 0
    uncapped_ssi: 0
    pr_refundable_ctc_social_security_tax: 1_530
    refundable_ctc: 2_000
    ctc: 2_000
    foreign_earned_income_exclusion: 30_000
  output:
    pr_refundable_ctc: 2_000

- name: Puerto Rico section 911 filer remains barred in 2040 under current law
  period: 2040
  input:
    people:
      head:
        age: 40
        employment_income: 8_000
      child1:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1]
        foreign_earned_income_exclusion: 1_000
    households:
      household:
        members: [head, child1]
        state_code: PR
  output:
    refundable_ctc_barred_by_section_911_exclusion: true
    refundable_ctc: 0
    pr_refundable_ctc: 0
