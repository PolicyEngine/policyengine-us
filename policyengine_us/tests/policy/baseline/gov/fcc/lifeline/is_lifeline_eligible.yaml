- name: Default family qualifies because of low income and SNAP eligibility
  period: 2022
  output:
    is_lifeline_eligible: true

- name: Family with no categorical eligibility and income >135% of FPG is ineligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    snap: 0
    medicaid_enrolled: false
  output:
    is_lifeline_eligible: false

- name: Family with income >135% of FPG that participates in SNAP is eligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    snap: 100
    medicaid_enrolled: false
  output:
    is_lifeline_eligible: true

- name: Tribal family with no categorical eligibility and income >135% of FPG is ineligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    is_on_tribal_land: true
    head_start: false
    fdpir: 0
    tanf: 0
  output:
    is_lifeline_eligible: false

- name: Tribal family with income >135% of FPG that participates in TANF is eligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    is_on_tribal_land: true
    head_start: false
    fdpir: 0
    tanf: 1
  output:
    is_lifeline_eligible: true

- name: Family with no categorical eligibility and income >135% of FPG is ineligible, but in Texas
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    snap: 0
    medicaid_enrolled: false
    state_code: TX
  output:
    is_lifeline_eligible: true

- name: Family reporting SNAP receipt with a zero modeled allotment is eligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    snap: 0
    receives_snap: true
    medicaid_enrolled: false
  output:
    is_lifeline_eligible: true

- name: Family reporting SSI receipt with a zero modeled payment is eligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    snap: 0
    ssi: 0
    receives_ssi: true
    medicaid_enrolled: false
  output:
    is_lifeline_eligible: true

- name: Tribal family reporting TANF receipt with a zero modeled benefit is eligible
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    is_on_tribal_land: true
    head_start: false
    fdpir: 0
    tanf: 0
    receives_tanf: true
  output:
    is_lifeline_eligible: true

- name: Tribal family reporting SSI receipt is not qualified via the non-tribal list
  period: 2022
  input:
    fcc_fpg_ratio: 1.5
    is_on_tribal_land: true
    head_start: false
    fdpir: 0
    tanf: 0
    snap: 0
    ssi: 0
    receives_ssi: true
    medicaid_enrolled: false
  output:
    # SSI is only in the non-tribal list, which tribal households do not read.
    is_lifeline_eligible: false
