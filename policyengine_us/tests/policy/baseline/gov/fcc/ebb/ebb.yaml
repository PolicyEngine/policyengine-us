- name: Ineligible family gets $0
  period: 2022
  input:
    is_ebb_eligible: false
  output:
    ebb: 0

- name: Eligible non-Tribal family gets its $20 monthly cost for two funded EBB months
  period: 2022
  input:
    is_ebb_eligible: true
    broadband_cost_after_lifeline: 20 * 12
  output:
    ebb: 20 * 2

- name: Eligible Tribal family gets the $75 cap for two funded EBB months
  period: 2022
  input:
    people:
      person:
        age: 30
    spm_units:
      spm_unit:
        is_ebb_eligible: true
        broadband_cost_after_lifeline: 100 * 12
        members: person
    households:
      household:
        is_on_tribal_land: true
        members: person
  output:
    ebb: 75 * 2
