- name: Previously enrolled family with a Pell Grant receives two EBB funding months
  period: 2022
  input:
    pell_grant: 100
    broadband_cost_after_lifeline: 100 * 12
    enrolled_in_ebb: true
  output:
    # Qualified legacy control: two EBB months and ten ACP months.
    ebb: 50 * 2
    acp: 30 * 10

- name: Not-previously-enrolled family with a Pell Grant and $100/mo broadband costs gets $0
  period: 2022
  input:
    pell_grant: 100
    broadband_cost_after_lifeline: 100 * 12
  output:
    ebb: 0

- name: Family with no eligibility flags gets $0
  period: 2022
  output:
    ebb: 0 * 12
