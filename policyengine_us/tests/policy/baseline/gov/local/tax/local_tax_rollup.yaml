# End-to-end rollup tests: confirm the jurisdiction-specific local taxes flow
# through the aggregation variables (local_income_tax,
# local_income_tax_before_refundable_credits, local_occupational_tax) and into
# household_tax_before_refundable_credits / household_tax. Guards the `adds`
# wiring at the aggregation layer.

- name: Wilmington earned income tax flows into the local income tax aggregates
  period: 2025
  input:
    state_code: DE
    in_wilmington: true
    employment_income: 40_000
  output:
    de_wilmington_earned_income_tax: 500  # 40,000 * 1.25%
    # SALT-deductible measure includes Wilmington.
    local_income_tax: 500
    # Pre-refundable aggregate also includes Wilmington.
    local_income_tax_before_refundable_credits: 500
    local_tax: 500

- name: KY Jefferson occupational tax flows into the local occupational aggregate
  period: 2025
  input:
    state_code: KY
    county_str: JEFFERSON_COUNTY_KY
    employment_income: 50_000
  output:
    ky_jefferson_occupational_tax: 1_100  # 50,000 * 2.20%
    local_occupational_tax: 1_100
    local_tax: 1_100

- name: KY Fayette occupational tax flows into the local occupational aggregate
  period: 2025
  input:
    state_code: KY
    county_str: FAYETTE_COUNTY_KY
    employment_income: 50_000
  output:
    ky_fayette_occupational_tax: 1_125  # 50,000 * 2.25%
    local_occupational_tax: 1_125
    local_tax: 1_125

# Boundary case: a household with earnings but no local-tax nexus (no modeled
# local income or occupational jurisdiction) owes nothing in any of the three
# local aggregates. Guards against a jurisdiction rule firing outside its
# locality (e.g. a missing residence gate leaking into the national aggregate).
- name: Household with no local-tax nexus owes zero in every local aggregate
  period: 2025
  input:
    state_code: TX
    employment_income: 50_000
  output:
    local_income_tax: 0
    local_income_tax_before_refundable_credits: 0
    local_occupational_tax: 0
    local_tax: 0

# household_tax wiring guard: with only ny_income_tax provided as a direct
# input and no earnings/children/state income, every other component of the
# household total is zero, so the household total before refundable credits
# reduces to the local income tax aggregate (the Yonkers surcharge). This
# confirms local_income_tax_before_refundable_credits is summed into
# household_tax_before_refundable_credits via `adds`. (If a residual
# federal/state/credit component is nonzero, the ci-fixer should adjust the
# household-level expected values; local_income_tax_before_refundable_credits
# is the robust guard for the local `adds` wiring.)
- name: Yonkers surcharge flows into the household tax total
  period: 2025
  input:
    state_code: NY
    in_yonkers: true
    ny_income_tax: 1_000
  output:
    ny_yonkers_income_tax: 167.5  # 1,000 * 16.75%
    local_income_tax_before_refundable_credits: 167.5
    local_tax: 167.5
    household_tax_before_refundable_credits: 167.5
    household_tax: 167.5

- name: Indiana county tax flows into local income tax aggregates
  period: 2021
  input:
    state_code_str: IN
    in_agi: 10_000
    county_str: BOONE_COUNTY_IN
  output:
    in_county_tax: 150  # 10,000 * 1.5%
    local_income_tax: 150
    local_income_tax_before_refundable_credits: 150
    local_tax: 150

- name: Indiana county tax flows from earnings to household and SPM totals
  period: 2021
  input:
    state_code: IN
    county_str: BOONE_COUNTY_IN
    employment_income: 50_000
  output:
    in_agi: 49_000
    in_county_tax: 735  # 49,000 * 1.5%
    local_income_tax: 735
    local_income_tax_before_refundable_credits: 735
    local_tax: 735
    household_tax: 9_037.7
    household_net_income: 40_962.3
    spm_unit_local_tax: 735
    spm_unit_taxes: 9_037.7
    spm_unit_net_income: 36_824.8

- name: Indiana county tax reduces federal taxable income via SALT deduction for itemizers
  period: 2021
  input:
    state_code: IN
    county_str: BOONE_COUNTY_IN
    employment_income: 100_000
    interest_deduction: 15_000
    tax_unit_itemizes: true
  output:
    in_county_tax: 1_485  # (100,000 - 1,000) * 1.5%
    local_income_tax: 1_485
    state_withheld_income_tax: 3_197.7
    salt: 4_682.7  # 3,197.7 + 1,485
    salt_deduction: 4_682.7
    taxable_income: 80_317.3  # 100,000 - 15,000 - 4,682.7
    income_tax: 13_418.306

- name: Multnomah County PFA tax flows from earnings to local and SPM totals
  period: 2025
  input:
    state_code: OR
    in_multnomah_county_or: true
    employment_income: 200_000
    filing_status: SINGLE
  output:
    or_taxable_income: 197_165
    or_multnomah_pfa_tax: 1_082.475  # 1.5% * (197,165 - 125,000)
    local_income_tax: 0  # excluded from SALT measure to prevent circular dependency
    local_income_tax_before_refundable_credits: 1_082.475
    local_tax: 1_082.475
    spm_unit_local_tax: 1_082.475
    household_tax: 68_758.03
    household_net_income: 131_241.97

