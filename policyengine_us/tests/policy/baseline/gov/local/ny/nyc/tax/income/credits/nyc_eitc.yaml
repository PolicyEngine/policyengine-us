- name: NYC EITC, fraction of federal EITC (NYAGI=18k)
  period: 2022
  absolute_error_margin: 1
  input:
    state_code: NY
    in_nyc: true
    eitc: 100
    ny_agi: 18_000
  output:
    # NYC EIC rate worksheet
    # 1. Enter the amount from Form IT-201, line 33 or Form IT-203, line 32,
    #    New York adjusted gross income.
    #    = 18_000
    # 2. Enter the appropriate dollar amount from the NYC EIC rate table below
    #    for your NYAGI (if applicable).
    #    [Skip lines 2-5]
    # 3. Subtract line 2 from line 1.
    #    N/A 
    # 4. Multiply line 3 by .00002 (round the result to four decimal places).
    #    N/A
    # 5. Enter the decimal from the NYC EIC rate table.
    #    N/A
    # 6. Subtract line 4 from line 5 or enter the decimal from the NYC EIC
    #    rate table. Also enter on Worksheet C, line 2.
    #    = .2
    #
    # Worksheet C, New York City earned income credit
    #
    # 1. Enter the amount from Form IT-215, line 10.
    #    Federal EITC: 100
    # 2. Enter the decimal from line 6 of the NYC EIC rate Worksheet
    #    0.2
    # 3. Allowable NYC EIC (multiply line 1 by line 2)
    nyc_eitc: 20

- name: NYC EITC, fraction of federal EITC (NYAGI=21k)
  period: 2022
  absolute_error_margin: 0.0001
  input:
    state_code: NY
    in_nyc: true
    eitc: 100
    ny_agi: 21_000
  output:
    # NYC EIC rate worksheet
    # 1. Enter the amount from Form IT-201, line 33 or Form IT-203, line 32,
    #    New York adjusted gross income.
    #    = 21_000
    # 2. Enter the appropriate dollar amount from the NYC EIC rate table below
    #    for your NYAGI (if applicable).
    #    = 19_999
    # 3. Subtract line 2 from line 1.
    #    = 1_001
    # 4. Multiply line 3 by .00002 (round the result to four decimal places).
    #    = 0.0200
    # 5. Enter the decimal from the NYC EIC rate table.
    #    = 0.20
    # 6. Subtract line 4 from line 5 or enter the decimal from the NYC EIC
    #    rate table. Also enter on Worksheet C, line 2.
    #    = 0.18
    #
    # Worksheet C, New York City earned income credit
    #
    # 1. Enter the amount from Form IT-215, line 10.
    #    Federal EITC: 100
    # 2. Enter the decimal from line 6 of the NYC EIC rate Worksheet
    #    0.18
    # 3. Allowable NYC EIC (multiply line 1 by line 2)
    nyc_eitc: 18

- name: 2020 NYC EITC matches the federal credit recomputed with line 19a
  period: 2020
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 40_800
        taxable_interest_income: 1_000
        charitable_cash_donations: 300
      person2:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
        in_nyc: true
  output:
    # Recomputed federal AGI 41,800 is over the $41,756 one-child limit.
    ny_recomputed_federal_agi: 41_800
    nyc_eitc: 0

- name: NYC EIC rounds the reduction for a parent earning $21,000 in 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 21_000
      child:
        age: 10
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: NY
        in_nyc: true
  output:
    ny_agi: 21_000
    eitc: 4_328
    # (21,000 - 19,999) * .00002 = .02002; line 4 rounds to .0200.
    # Line 6: .20 - .0200 = .1800; Worksheet C: 4,328 * .1800 = 779.04.
    nyc_eitc: 779.04

- name: NYC EIC rounds each reduction band's boundaries in 2022
  period: 2022
  absolute_error_margin: 0.001
  input:
    state_code: NY
    in_nyc: true
    eitc: 10_000
    ny_agi: [4999, 5000, 5001, 5002, 7498, 7499, 7500, 14999, 15000, 15001, 15002, 17498, 17499, 17500, 19999, 20000, 20001, 20002, 22498, 22499, 22500, 39999, 40000, 40001, 40002, 42498, 42499, 42500, 43000]
  output:
    # At each lower bound, excess is $1 and .00002 rounds to .0000.
    # Excesses of $2 and $3 round to .0000 and .0001, respectively.
    # At the last two dollars, .04998 and .05000 both round to .0500.
    # The next band uses its flat rate; $43,000 keeps the .10 rate.
    nyc_eitc: [3000, 3000, 3000, 2999, 2500, 2500, 2500, 2500, 2500, 2500, 2499, 2000, 2000, 2000, 2000, 2000, 2000, 1999, 1500, 1500, 1500, 1500, 1500, 1500, 1499, 1000, 1000, 1000, 1000]

