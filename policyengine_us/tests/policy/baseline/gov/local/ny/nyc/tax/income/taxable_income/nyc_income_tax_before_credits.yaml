    nyc_income_tax_before_credits: 2_873.42

# Invariant: the brackets are not indexed and the rates are unchanged through
# 2029, so the same nominal wages give the same NYC tax in 2026 and 2027.
# NY taxable income = $275,000 - $8,000 NY standard deduction = $267,000.
# 12,000 * 3.078% + 13,000 * 3.762% + 25,000 * 3.819% + 217,000 * 3.876%
# = 369.36 + 489.06 + 954.75 + 8,410.92 = 10,224.09
- name: Single filer with $275,000 of wages in 2026.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 275_000
    households:
      household:
        members: [head]
        state_code: NY
        in_nyc: true
  output:
    nyc_taxable_income: 267_000
    nyc_income_tax_before_credits: 10_224.09

- name: Single filer with the same $275,000 of wages in 2027 owes the same NYC tax.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 275_000
    households:
      household:
        members: [head]
        state_code: NY
        in_nyc: true
  output:
    nyc_taxable_income: 267_000
    nyc_income_tax_before_credits: 10_224.09

