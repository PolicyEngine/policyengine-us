# Form IT-270, Part 2, line 2: applicable income threshold from the 2025
# Form IT-270-I line 2 table, which reproduces Tax Law § 1310(h)(1)(B).
#
# Married filing jointly or qualifying surviving spouse (§ 1310(h)(1)(B)(i)):
#   1: 36,789  2: 46,350  3: 54,545  4: 61,071  5: 68,403  6: 75,204
#   7 or more: 91,902
# Single, married filing separately or head of household
# (§ 1310(h)(1)(B)(ii)):
#   1: 31,503  2: 36,824  3: 46,512  4: 53,711  5: 59,928  6: 65,712
#   7: 74,565  8 or more: 88,361
#
# Neither table has a row for 0 dependents: § 1310(h)(1)(A) and IT-270
# line A require at least one dependent, so a tax unit without dependents
# has no threshold and the model returns 0.

# Single filers.

- name: Case 1, single filer with 0 dependents has no threshold.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    in_nyc: true
    filing_status: SINGLE
    tax_unit_dependents: 0
  output:
    # No 0-dependent row in § 1310(h)(1)(B)(ii).
    nyc_income_tax_elimination_credit_income_threshold: 0

- name: Case 2, single filer with 1 dependent.
