- name: Share of childcare expenses on children under four.
  period: 2022
  absolute_error_margin: 0
  input:
    people:
      person1:
        age: 3
      person2:
        age: 13
      person3:
        age: 39
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        tax_unit_childcare_expenses: 8_000
        tax_unit_children: 2
    households:
      household:
        members: [person1, person2, person3]
        in_nyc: true
  output:
    nyc_cdcc_age_restricted_expenses: 4_000

- name: If no childcare expenses, should be zero.
  period: 2022
  input:
    in_nyc: true
  output:
    nyc_cdcc_age_restricted_expenses: 0


- name: 2025 joint return with one claimable spouse has no NYC child care dependent (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
        pre_subsidy_childcare_expenses: 1000
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
        in_nyc: true
  output:
    # NYC Admin Code 11-1706(e)(1): children "who are dependents of the
    # taxpayer"; IRC 152(b)(1).
    nyc_cdcc_age_restricted_expenses: 0

- name: 2025 joint return with one claimable spouse has no NYC child care dependent (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 22
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 22
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 3
        pre_subsidy_childcare_expenses: 1000
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
    households:
      household:
        members: [person_b, person_a, child]
        state_code: NY
        in_nyc: true
  output:
    nyc_cdcc_age_restricted_expenses: 0

- name: 2025 joint return with neither spouse claimable counts the child under 4
  period: 2025
  input:
    people:
      person_a:
        age: 22
      person_b:
        age: 22
      child:
        age: 3
        pre_subsidy_childcare_expenses: 1000
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
        in_nyc: true
  output:
    nyc_cdcc_age_restricted_expenses: 1_000
