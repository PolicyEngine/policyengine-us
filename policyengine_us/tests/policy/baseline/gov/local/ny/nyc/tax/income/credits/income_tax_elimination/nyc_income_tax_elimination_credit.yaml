- name: Case 19, the NYC school tax credit does not reduce line 10.
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: NY
    in_nyc: true
    filing_status: HEAD_OF_HOUSEHOLD
    tax_unit_dependents: 1
