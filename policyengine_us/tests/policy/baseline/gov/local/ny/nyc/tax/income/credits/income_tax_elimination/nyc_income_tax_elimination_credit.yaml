    nyc_eitc: 400
  output:
    # Line 5: 1.0000 (as in Case 7)
    # Line 9: 250 + 400 = 650
    # Line 10: 650 - 650 = 0; 0 or less -> not eligible (IT-270-I)
    # Line 11: 0
    nyc_income_tax_elimination_credit: 0

