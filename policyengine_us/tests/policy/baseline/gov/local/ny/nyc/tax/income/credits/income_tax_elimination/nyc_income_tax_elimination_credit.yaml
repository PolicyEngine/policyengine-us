    nyc_cdcc: 0
    nyc_eitc: 150
    nyc_school_tax_credit: 63
  output:
    # Same as Case 1. IT-270 lines 7 to 9 subtract only the NYC CDCC and
    # NYC EIC; the NYC school tax credit (IT-201 line 69) is a State
    # credit under Tax Law § 606(ggg), not a credit under Article 30.
    # Line 10: 600 - (0 + 150) = 450
    # Line 11: 450 x 1.0000 = 450
    nyc_income_tax_elimination_credit: 450
