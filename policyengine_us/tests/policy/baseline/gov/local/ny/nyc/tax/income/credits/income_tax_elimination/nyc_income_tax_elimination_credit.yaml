    nyc_income_tax_before_refundable_credits: 50
    nyc_cdcc: 0
    nyc_eitc: 0
  output:
    # Line 1: -2,000
    # Line 2: 31,503
    # Line 3: -2,000 <= 31,503 -> 0
    # Line 4: 5,000; line 5: 1.0000
    # Line 10: 50
    # Line 11: 50 x 1.0000 = 50
    # (Without the line 3 floor the fraction would be
    # (5,000 + 33,503) / 5,000 = 7.7006 and the credit 385.03.)
