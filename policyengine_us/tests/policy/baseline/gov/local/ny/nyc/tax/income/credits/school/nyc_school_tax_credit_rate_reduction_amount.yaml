- name: Mixed filing statuses are computed together.
  period: 2025
  absolute_error_margin: 0.001
  input:
    people:
      person1: {}
      person2: {}
      person3: {}
    tax_units:
      tax_unit1:
        members: [person1]
        nyc_school_tax_credit_rate_reduction_amount_eligible: true
        nyc_taxable_income: 10_000
        filing_status: SINGLE
      tax_unit2:
        members: [person2]
        nyc_school_tax_credit_rate_reduction_amount_eligible: true
        nyc_taxable_income: 14_401
        filing_status: HEAD_OF_HOUSEHOLD
      tax_unit3:
        members: [person3]
        nyc_school_tax_credit_rate_reduction_amount_eligible: true
        nyc_taxable_income: 100_000
        filing_status: JOINT
    households:
      household:
        members: [person1, person2, person3]
  output:
    # Single below its threshold: 0.00171 * 10_000 = 17.1.
    # Head of household $1 above: 25 + 0.00228 = 25.00228.
    # Joint: 37 + 0.00228 * (100_000 - 21_600) = 37 + 178.752 = 215.752.
    nyc_school_tax_credit_rate_reduction_amount: [17.1, 25.00228, 215.752]
