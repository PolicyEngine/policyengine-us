- name: Household head gets $25 plus .228% of taxable income above $14,400 for total income not over $500,000.
  period: 2022
  absolute_error_margin: 0.01
  input:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true
    nyc_taxable_income: 500_000
    filing_status: HEAD_OF_HOUSEHOLD
  output:
    # NYC School Tax Instructions
    # See Page 27 for rate reduction amount
    # https://www.tax.ny.gov/pdf/2022/printable-pdfs/inc/it201i-2022.pdf#page=27
    # Tax Law § 606(ggg)(4-b)(B): 25 + 0.00228 * (500_000 - 14_400) = 1_132.168.
    nyc_school_tax_credit_rate_reduction_amount: 1_132.168

# Tax Law § 606(ggg)(4-b), as amended by L.2017, ch. 59, Part C, § 2 for tax
# years beginning on and after January 1, 2017 (S.2009-C, PDF pages 8-9 and
# 14), sets the amount above each threshold as a statutory base plus 0.228%
# of the excess. The bases ($37 joint and surviving spouse, $25 head of
# household, $21 single and separate) are fixed in the statute; they are not
# 0.171% of the threshold (36.936, 24.624 and 20.52). City taxable income
# equal to the threshold is "not over" it and stays in the lower branch.
# 2025 IT-201-I line 69a tables (PDF page 21) give the same values.

- name: 2017 head of household above the threshold gets the statutory $25 base.
  period: 2017
  absolute_error_margin: 0.001
  input:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true
    nyc_taxable_income: 20_000
    filing_status: HEAD_OF_HOUSEHOLD
  output:
    # 25 + 0.00228 * (20_000 - 14_400) = 25 + 12.768 = 37.768.
    nyc_school_tax_credit_rate_reduction_amount: 37.768

- name: 2025 joint filers above the threshold get the statutory $37 base.
  period: 2025
  absolute_error_margin: 0.001
  input:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true
    nyc_taxable_income: 30_000
    filing_status: JOINT
  output:
    # 37 + 0.00228 * (30_000 - 21_600) = 37 + 19.152 = 56.152.
    nyc_school_tax_credit_rate_reduction_amount: 56.152

