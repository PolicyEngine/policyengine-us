# NY Tax Law § 606(ggg)(4-b) denies the rate reduction amount to any taxpayer
# with income, as defined in § 606(ggg)(2), over $500,000, and its tables make
# the amount not applicable when city taxable income exceeds $500,000.
# https://www.nysenate.gov/legislation/laws/TAX/606
# https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf#page=20

- name: Single filer with income of exactly $500,000 and city taxable income below the limit is eligible.
  period: 2025
  input:
    in_nyc: true
    filing_status: SINGLE
    nyc_school_credit_income: 500_000
    nyc_taxable_income: 400_000
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true

- name: Single filer with income just over $500,000 is ineligible even with city taxable income below the limit.
  period: 2025
  input:
    in_nyc: true
    filing_status: SINGLE
    nyc_school_credit_income: 500_001
    nyc_taxable_income: 400_000
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: false

- name: Single filer with city taxable income of exactly $500,000 and income below the limit is eligible.
  period: 2025
  input:
    in_nyc: true
    filing_status: SINGLE
    nyc_school_credit_income: 400_000
    nyc_taxable_income: 500_000
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true

- name: Single filer with city taxable income just over $500,000 is ineligible even with income below the limit.
  period: 2025
  input:
    in_nyc: true
    filing_status: SINGLE
    nyc_school_credit_income: 400_000
    nyc_taxable_income: 500_001
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: false

- name: Joint filers with income and city taxable income both exactly $500,000 are eligible.
  period: 2025
  input:
    in_nyc: true
    filing_status: JOINT
    nyc_school_credit_income: 500_000
    nyc_taxable_income: 500_000
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: true

- name: Joint filers with income just over $500,000 are ineligible even with city taxable income just under the limit.
  period: 2025
  input:
    in_nyc: true
    filing_status: JOINT
    nyc_school_credit_income: 500_001
    nyc_taxable_income: 499_999
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: false

- name: Joint filers with city taxable income just over $500,000 are ineligible even with income just under the limit.
  period: 2025
  input:
    in_nyc: true
    filing_status: JOINT
    nyc_school_credit_income: 499_999
    nyc_taxable_income: 500_001
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: false

- name: Filers outside of NYC are not eligible.
  period: 2025
  input:
    in_nyc: false
    filing_status: JOINT
    nyc_school_credit_income: 0
    nyc_taxable_income: 0
  output:
    nyc_school_tax_credit_rate_reduction_amount_eligible: false
