        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
        in_nyc: true
  output:
    nyc_household_credit: 15

- name: 2025 joint return with one claimable spouse counts the other spouse's exemption for the NYC credit (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5000
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 22
        employment_income: 5000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b]
        state_code: NY
        in_nyc: true
  output:
    # Tax Law 1310(d) counts the exemptions the couple is entitled to: one.
    # $30 x 1. IT-201 line 48 would deny the credit; the model follows the
    # statute.
    nyc_household_credit: 30

- name: 2025 joint return with one claimable spouse counts the other spouse's exemption for the NYC credit (the claimable spouse is the spouse)
