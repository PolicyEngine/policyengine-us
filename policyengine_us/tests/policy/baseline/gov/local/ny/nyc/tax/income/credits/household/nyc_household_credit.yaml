- name: 2025 single filer who can be claimed as a dependent gets no NYC household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [filer]
    households:
      household:
        members: [filer]
        state_code: NY
        in_nyc: true
  output:
    # Tax Law 1310(d); IT-201 line 48.
    nyc_household_credit: 0

- name: 2025 single filer who cannot be claimed gets the NYC household credit
  period: 2025
  input:
    people:
      filer:
        age: 22
        employment_income: 10000
    tax_units:
