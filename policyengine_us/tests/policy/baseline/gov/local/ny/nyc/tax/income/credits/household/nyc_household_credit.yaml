# Tax Law 1310(d): only an unmarried individual is excluded for being
# claimable; other households count the exemptions they are entitled to.
- name: 2025 separate filer who can be claimed gets half the household credit for the spouse's exemption
  period: 2025
  input:
    people:
      person_a:
        age: 22
        employment_income: 5_000
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SEPARATE
    households:
      household:
        members: [person_a]
        state_code: NY
        in_nyc: true
  output:
    # Household AGI $10,000 (the spouse's return is assumed alike); the
    # couple's exemptions: 0 for the claimable filer plus 1 for the spouse.
    # $30 x 1, halved.
    nyc_household_credit: 15

