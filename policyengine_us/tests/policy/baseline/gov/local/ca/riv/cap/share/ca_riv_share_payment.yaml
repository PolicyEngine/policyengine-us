- name: Case 10, annual credits in 2027 across the July water and trash steps.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 20_000
    households:
      household:
        members: [person1]
        in_riv: true
    spm_units:
      spm_unit:
        members: [person1]
        pre_subsidy_electricity_expense: 1_200
        water_expense: 120
        trash_expense: 120
  output:
    # Electric 29 x 12 = 348; water 5.75 x 6 + 6.25 x 6 = 72;
    # trash 5.75 x 6 + 7.12 x 6 = 77.22.
    ca_riv_share_payment: 497.22

