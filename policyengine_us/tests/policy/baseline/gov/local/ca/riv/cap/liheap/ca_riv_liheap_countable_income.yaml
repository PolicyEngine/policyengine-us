- name: Case 1, railroad retirement benefits count as income.
  # The LIHEAP application lists pension and annuities as countable income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    state_code: CA
    in_riv: true
    railroad_benefits: 12_000
  output:
    ca_riv_liheap_countable_income: 12_000
