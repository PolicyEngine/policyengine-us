    people:
      person1:
        age: 30
        employment_income: 500 * 12
        ssi: 0
      person2:
        age: 65
        employment_income: 0
        ssi: 0
    households:
      household:
        members: [person1, person2]
        in_riv: true
    spm_units:
      spm_unit:
        members: [person1, person2]
        ca_tanf: 0
        housing_cost: 300 * 12
  output:
    state_withheld_income_tax: 0.38
    # person2 has no wages or withholding of their own.
    ca_riv_general_relief_earned_income_deductions: [38.63, 0]
    ca_riv_general_relief_countable_income: 461.37 # 500 - 38.63
    ca_riv_general_relief_needs_standards: 436
    ca_riv_general_relief_income_eligible: false 

