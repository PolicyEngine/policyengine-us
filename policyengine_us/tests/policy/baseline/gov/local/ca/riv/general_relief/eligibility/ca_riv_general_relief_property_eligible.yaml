- name: Case 1, eligible.
  period: 2024
  input:
    ca_riv_general_relief_countable_property_value: 499
    in_riv: true
  output:
    ca_riv_general_relief_property_eligible: true

- name: Case 2, ineligible.
  period: 2024
  input:
    ca_riv_general_relief_countable_property_value: 500
    in_riv: true
  output:
    ca_riv_general_relief_property_eligible: false

- name: Case 3, cash held by one member of a two-person unit counts once.
  period: 2024
  input:
    people:
      person1:
        age: 30
        bank_account_assets: 300
      person2:
        age: 65
    households:
      household:
        members: [person1, person2]
        in_riv: true
    spm_units:
      spm_unit:
        members: [person1, person2]
  output:
    # Countable property is $300, below the $500 limit.
    ca_riv_general_relief_property_eligible: true

- name: Case 4, the limit applies to the members' combined cash.
  period: 2024
  input:
    people:
      person1:
        age: 30
        bank_account_assets: 300
      person2:
        age: 65
        bank_account_assets: 300
    households:
      household:
        members: [person1, person2]
        in_riv: true
    spm_units:
      spm_unit:
        members: [person1, person2]
  output:
    # Countable property is $600, above the $500 limit.
    ca_riv_general_relief_property_eligible: false

- name: Case 5, countable vehicle value counts once in a three-person unit.
  period: 2024
  input:
    people:
      person1:
        age: 30
      person2:
        age: 40
      person3:
        age: 65
    households:
      household:
        members: [person1, person2, person3]
        in_riv: true
        household_vehicles_value: 4_850
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
  output:
    # Countable property is 4,850 - 4,650 = $200, below the $500 limit.
    ca_riv_general_relief_property_eligible: true
