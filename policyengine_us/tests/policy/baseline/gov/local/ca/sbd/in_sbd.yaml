- name: Case 1, San Bernardino County is identified from the county string.
  period: 2026
  input:
    county_str: SAN_BERNARDINO_COUNTY_CA
  output:
    in_sbd: true

- name: Case 2, a different California county is not San Bernardino County.
  period: 2026
  input:
    county_str: RIVERSIDE_COUNTY_CA
  output:
    in_sbd: false
