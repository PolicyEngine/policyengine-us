# The GR 101 brochure's broader list governs: citizens,
# legal permanent residents, and other non-citizens authorized to live in
# the United States (mapped to all lawfully present statuses). Only
# undocumented people are excluded.
- name: Case 1, a citizen is immigration-status eligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        immigration_status: CITIZEN
    households:
      household:
        members: [person1]
        in_sbd: true
  output:
    ca_sbd_general_relief_immigration_status_eligible: true

