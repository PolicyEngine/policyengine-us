# Real property is the combined assessed value with no encumbrance
# deductions. The county's vehicle-as-residence real-property treatment
# (Banda settlement change) is not modeled; vehicles are always evaluated
# under the personal property test.
- name: Case 1, assessed property value passes through.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        assessed_property_value: 20_000
    households:
      household:
        members: [person1]
        in_sbd: true
  output:
    ca_sbd_general_relief_real_property_value: 20_000

- name: Case 2, vehicles do not enter real property.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        assessed_property_value: 10_000
    households:
      household:
        members: [person1]
        in_sbd: true
        household_vehicles_owned: 2
        household_vehicles_value: 8_000
  output:
    ca_sbd_general_relief_real_property_value: 10_000

- name: Case 3, assessed values sum across members.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        assessed_property_value: 20_000
      person2:
        age: 32
        assessed_property_value: 11_000
    households:
      household:
        members: [person1, person2]
        in_sbd: true
  output:
    # 20,000 + 11,000 = 31,000.
    ca_sbd_general_relief_real_property_value: 31_000
