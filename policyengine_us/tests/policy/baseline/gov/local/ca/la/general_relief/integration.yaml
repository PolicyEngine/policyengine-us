- name: Couple with one ineligible person due to immigration status should still receive GR
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      you:
        age: 44
        immigration_status_str: CITIZEN
        other_medical_expenses: 600
        is_aca_eshi_eligible: false
        is_pregnant: false
        ca_calworks_child_care_time_category: MONTHLY
      member1:
        age: 55
        immigration_status_str: UNDOCUMENTED
        is_aca_eshi_eligible: false
        ca_calworks_child_care_time_category: MONTHLY
    households:
      household:
        members: [you, member1]
        zip_code: 90034
        household_vehicles_owned: 1
        household_vehicles_value: 5000
        is_homeless: true
        state_code_str: CA
        ca_tanf_region1: true
        in_la: true
    tax_units:
      tax_unit:
        members: [you, member1]
        tax_unit_is_joint: false
    families:
      family:
        members: [you, member1]
    spm_units:
      spm_unit:
        members: [you, member1]
  output:
    la_general_relief_eligible: true
    la_general_relief_base_amount: 2_652 # 221 monthly
    la_general_relief: 2_652

- name: Adult living with a sister and her child on CalWORKs counts the grant once and receives GR
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      adult:
        age: 25
        immigration_status_str: CITIZEN
      sister:
        age: 30
        immigration_status_str: CITIZEN
      child:
        age: 3
    tax_units:
      adult_tax_unit:
        members: [adult]
      sister_tax_unit:
        members: [sister, child]
    spm_units:
      spm_unit:
        members: [adult, sister, child]
        # The sister's and child's CalWORKs grant, $150 a month.
        tanf: 1_800
        la_general_relief_recipient: false
    families:
      family:
        members: [adult, sister, child]
    households:
      household:
        members: [adult, sister, child]
        state_code: CA
        in_la: true
  output:
    la_general_relief_net_income: 1_800
    # $150 a month is under the $221 single applicant limit.
    la_general_relief_eligible: true
    la_general_relief_base_amount: 2_652 # 221 monthly
    la_general_relief: 2_652

- name: Recipient's grant is not phased out by another member's CalWORKs counted per member
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      recipient:
        age: 40
        immigration_status_str: CITIZEN
      other_adult:
        age: 35
        immigration_status_str: CITIZEN
    tax_units:
      recipient_tax_unit:
        members: [recipient]
      other_adult_tax_unit:
        members: [other_adult]
    spm_units:
      spm_unit:
        members: [recipient, other_adult]
        # The other adult's CalWORKs grant, $200 a month.
        tanf: 2_400
        la_general_relief_recipient: true
    families:
      family:
        members: [recipient, other_adult]
    households:
      household:
        members: [recipient, other_adult]
        state_code: CA
        in_la: true
  output:
    la_general_relief_net_income: 2_400
    la_general_relief_eligible: true
    # $200 a month is under the $201 phase-out start, so there is no reduction.
    la_general_relief_base_amount: 2_652 # 221 monthly
    la_general_relief: 2_652
