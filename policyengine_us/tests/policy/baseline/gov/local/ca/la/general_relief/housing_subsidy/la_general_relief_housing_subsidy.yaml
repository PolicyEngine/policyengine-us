      recipient:
        age: {2024: 40}
        immigration_status_str: {2024: CITIZEN}
        veterans_benefits: {2024: 5_148}
        rent: {2024: 7_200}
      other_adult:
        age: {2024: 35}
        immigration_status_str: {2024: CITIZEN}
        rent: {2024: 0}
    tax_units:
      recipient_tax_unit:
        members: [recipient]
        tax_unit_dependents: {2024: 0}
      other_tax_unit:
        members: [other_adult]
        tax_unit_dependents: {2024: 0}
    families:
      recipient_family:
        members: [recipient]
        is_married: {2024: false}
      other_family:
        members: [other_adult]
        is_married: {2024: false}
    spm_units:
      unit:
        members: [recipient, other_adult]
        tanf: {2024: 0}
        spm_unit_paycheck_withholdings: {2024: 0}
        la_general_relief_recipient: {2024: true}
        la_general_relief_housing_subsidy_program_eligible: {2024: true}
    households:
      household:
        members: [recipient, other_adult]
        state_code: {2024: CA}
        in_la: {2024: true}
        is_homeless: {2024: true}
  output:
    # Net = 5,148 / 12 = 429.
    la_general_relief_net_income: 429
