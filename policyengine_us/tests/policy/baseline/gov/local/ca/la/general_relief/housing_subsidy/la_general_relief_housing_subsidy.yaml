- name: CalWORKs counted once activates housing eligibility without rent
  absolute_error_margin: 0.0001
  period: 2024-01
  input:
    people:
      recipient:
        age: {2024: 40}
        immigration_status_str: {2024: CITIZEN}
        veterans_benefits: {2024: 5_148}
        rent: {2024: 0}
      other_adult:
        age: {2024: 35}
        immigration_status_str: {2024: CITIZEN}
        rent: {2024: 0}
    tax_units:
      recipient_tax_unit:
        members: [recipient]
        tax_unit_dependents: {2024: 0}
      other_tax_unit:
        members: [other_adult]
        tax_unit_dependents: {2024: 0}
    families:
      recipient_family:
        members: [recipient]
        is_married: {2024: false}
      other_family:
        members: [other_adult]
        is_married: {2024: false}
    spm_units:
      unit:
        members: [recipient, other_adult]
        tanf: {2024: 12}
        spm_unit_paycheck_withholdings: {2024: 0}
        la_general_relief_recipient: {2024: true}
        la_general_relief_housing_subsidy_program_eligible: {2024: true}
    households:
      household:
        members: [recipient, other_adult]
        state_code: {2024: CA}
        in_la: {2024: true}
        is_homeless: {2024: true}
  output:
    # Net = (5,148 + 12) / 12 = 430.
    la_general_relief_net_income: 430
    la_general_relief_eligible: true
    # Base = 221 * (1 - (430 - 201) / (620 - 201)) = 100.214797.
    la_general_relief_base_amount: 100.214797
    la_general_relief_housing_subsidy_eligible: true
    # No rent means min(0, 475 + 100) = 0; no contribution is deducted.
    la_general_relief_housing_subsidy: 0
    la_general_relief_rent_contribution: 0
    la_general_relief: 100.214797

- name: CalWORKs counted once activates housing subsidy and rent contribution
  absolute_error_margin: 0.0001
  period: 2024-01
  input:
    people:
      recipient:
        age: {2024: 40}
        immigration_status_str: {2024: CITIZEN}
        veterans_benefits: {2024: 5_148}
        rent: {2024: 7_200}
      other_adult:
        age: {2024: 35}
        immigration_status_str: {2024: CITIZEN}
        rent: {2024: 0}
    tax_units:
      recipient_tax_unit:
        members: [recipient]
        tax_unit_dependents: {2024: 0}
      other_tax_unit:
        members: [other_adult]
        tax_unit_dependents: {2024: 0}
    families:
      recipient_family:
        members: [recipient]
        is_married: {2024: false}
      other_family:
        members: [other_adult]
        is_married: {2024: false}
    spm_units:
      unit:
        members: [recipient, other_adult]
        tanf: {2024: 12}
        spm_unit_paycheck_withholdings: {2024: 0}
        la_general_relief_recipient: {2024: true}
        la_general_relief_housing_subsidy_program_eligible: {2024: true}
    households:
      household:
        members: [recipient, other_adult]
        state_code: {2024: CA}
        in_la: {2024: true}
        is_homeless: {2024: true}
  output:
    # Net = (5,148 + 12) / 12 = 430.
    la_general_relief_net_income: 430
    la_general_relief_eligible: true
    # Base = 221 * (1 - (430 - 201) / 419) = 100.214797 >= 100.
    la_general_relief_base_amount: 100.214797
    la_general_relief_housing_subsidy_eligible: true
    # Housing = min(7,200 / 12, 475 + 100) = 575.
    la_general_relief_housing_subsidy: 575
    la_general_relief_rent_contribution: 100
    # GR cash = 100.214797 - 100 = 0.214797.
    la_general_relief: 0.214797

