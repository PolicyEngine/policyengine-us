- name: Case 1, homeowner with income less than ami, eligible, get $1800. 
  period: 2023
  input:
    spm_unit_size: 1 
    co_denver_property_tax_relief_income: 52_000
    real_estate_taxes: 1_000
    rent: 0
    has_co_denver_dhs_elderly_disabled: true
    tax_unit_dependents: 0 
    in_denver: true
    county_fips: "08031"
  output:
    co_denver_property_tax_relief_income: 52_000
    co_denver_property_tax_relief_homeowner_eligible: true
    co_denver_property_tax_relief_renter_eligible: false
    co_denver_homeowner_property_tax_relief: 1_800
    co_denver_renter_property_tax_relief: 0
    co_denver_property_tax_relief: 1_800

- name: Case 2, renter with income more than ami, ineligible. 
  period: 2023
  input:
    spm_unit_size: 1 
    co_denver_property_tax_relief_income: 25_000
    real_estate_taxes: 0
    rent: 2_000
    has_co_denver_dhs_elderly_disabled: true
    tax_unit_dependents: 0 
    in_denver: true
    county_fips: "08031"
  output:
    co_denver_property_tax_relief_income: 25_000
    co_denver_property_tax_relief_homeowner_eligible: false
    co_denver_property_tax_relief_renter_eligible: false
    co_denver_homeowner_property_tax_relief: 0
    co_denver_renter_property_tax_relief: 0
    co_denver_property_tax_relief: 0

- name: Case 3, homeowner, has elderly, no disabled, no dependent, income less than ami. 
  period: 2023
  input:
    people:
      person1:
        employment_income: 30_000
        age: 66
        real_estate_taxes: 1_000
        rent: 0 
      person2:
        employment_income: 20_000
        age: 36
        real_estate_taxes: 0
        rent: 0 
    spm_units:
      spm_unit:
        members: [person1, person2]
        has_co_denver_dhs_elderly_disabled: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_dependents: 0
    households:
      household:
        members: [person1, person2]
        in_denver: true
        county_fips: "08031"

  output:
    co_denver_property_tax_relief_income: 50_000
    co_denver_property_tax_relief_homeowner_eligible: true
    co_denver_property_tax_relief_renter_eligible: false
    co_denver_homeowner_property_tax_relief: 1_800
    co_denver_renter_property_tax_relief: 0
    co_denver_property_tax_relief: 1_800

# Cases 4 and 5: the 2025 renter limit for one person is the 4-person AMI
# (140,100 for Denver County) x HUD moderate income factor for one person (0.7)
# x renter rate for one person (0.25) = 24,517.50.

- name: Case 4, renter whose military retired pay puts income just over the limit, ineligible.
  period: 2025
  input:
    people:
      person1:
        age: 70
        rent: 6_000
        real_estate_taxes: 0
        taxable_pension_income: 10_000
        military_retirement_pay: 14_600
        social_security_retirement: 12_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CO
        in_denver: true
        county_fips: "08031"
  output:
    # 10,000 pension + 14,600 military retired pay = 24,600 > 24,517.50.
    # Social Security is excluded.
    co_denver_property_tax_relief_income: 24_600
    co_denver_property_tax_relief_renter_eligible: false
    co_denver_property_tax_relief: 0

- name: Case 5, renter whose IRA distributions leave income just under the limit, eligible.
  period: 2025
  input:
    people:
      person1:
        age: 70
        rent: 6_000
        real_estate_taxes: 0
        taxable_pension_income: 10_000
        taxable_ira_distributions: 14_500
        social_security_retirement: 12_000
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CO
        in_denver: true
        county_fips: "08031"
  output:
    # 10,000 pension + 14,500 IRA distribution = 24,500 <= 24,517.50.
    # Social Security is excluded.
    co_denver_property_tax_relief_income: 24_500
    co_denver_property_tax_relief_renter_eligible: true
    co_denver_property_tax_relief: 1_000
