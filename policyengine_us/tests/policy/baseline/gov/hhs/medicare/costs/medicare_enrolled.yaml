- name: Non-eligible person is not enrolled when enrollment is omitted.
  period: 2025
  input:
    age: 64
  output:
    medicare_enrolled: false

- name: Eligible person defaults to enrolled.
  period: 2025
  input:
    age: 65
  output:
    medicare_enrolled: true

- name: Eligible person declining take-up is not enrolled.
  period: 2025
  input:
    age: 65
    takes_up_medicare_if_eligible: false
  output:
    medicare_enrolled: false

- name: Explicit false enrollment input overrides default take-up.
  period: 2025
  input:
    age: 65
    medicare_enrolled: false
  output:
    medicare_enrolled: false

- name: Explicit enrollment input overrides eligibility gate.
  period: 2025
  input:
    age: 64
    medicare_enrolled: true
  output:
    medicare_enrolled: true

# 8 U.S.C. 1611(b)(3) limits Medicare benefits to noncitizens lawfully present.
- name: Undocumented person aged 65 or older is not enrolled.
  period: 2026
  input:
    age: 70
    immigration_status: UNDOCUMENTED
    pension_income: 10_000
    state_code: TX
  output:
    medicare_enrolled: false

# Allowed in 2026 because the model treats everyone as grandfathered under
# 42 U.S.C. 1395mmm(b)(1) through 2026.
- name: Person with temporary protected status and Part A work history is enrolled.
  period: 2026
  input:
    age: 70
    immigration_status: TPS
    medicare_quarters_of_coverage: 40
    pension_income: 10_000
    state_code: TX
  output:
    medicare_enrolled: true
