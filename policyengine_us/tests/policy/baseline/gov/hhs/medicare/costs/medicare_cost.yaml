# The Part D premium is the average per Medicare enrollee, the Part D
# enrollment share times Part D premiums per Part D enrollee (2025: 0.8191 x
# $220.25 = $180.41), plus the person's own Part D IRMAA. Sources: 2026
# Medicare Trustees Report, Tables III.D3, V.B3 and V.E4.

- name: unit test 1 - enrolled, premium-free Part A
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    adjusted_gross_income:
      2023: 50_000  # IRMAA uses income from 2 years prior
    tax_exempt_interest_income:
      2023: 0
  output:
    # $17,751 spending - $2,220 Part B premium - $180.41 Part D (2025)
    medicare_cost: 15_350.59

- name: unit test 2 - enrolled, pays full Part A premium
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 20
    adjusted_gross_income:
      2023: 50_000  # IRMAA uses income from 2 years prior
    tax_exempt_interest_income:
      2023: 0
  output:
    # $17,751 - $6,216 Part A - $2,220 Part B - $180.41 Part D (2025)
    medicare_cost: 9_134.59

- name: unit test 3 - enrolled with IRMAA
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    adjusted_gross_income:
      2023: 500_000  # IRMAA uses income from 2 years prior
    tax_exempt_interest_income:
      2023: 0
    filing_status: SINGLE
  output:
    # $17,751 - $7,546.80 Part B with IRMAA - $180.41 Part D - $85.80 x 12
    # = $1,029.60 Part D IRMAA (2025)
    medicare_cost: 8_994.19

- name: unit test 4 - eligible but not enrolled
  period: 2025
  input:
    age: 65
    is_medicare_eligible: true
    takes_up_medicare_if_eligible: false
  output:
    medicare_cost: 0

- name: unit test 5 - 2021 data, premium-free
  period: 2021
  absolute_error_margin: 0.01
  input:
    age: 70
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    adjusted_gross_income:
      2019: 50_000  # IRMAA uses income from 2 years prior
    tax_exempt_interest_income:
      2019: 0
  output:
    # $14,293 - $1,782 Part B (2021: $148.50*12) - 0.7811 x $306.15 Part D
    medicare_cost: 12_271.87

- name: unit test 6 - direct Part B premium input
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 3_000
  output:
    # $17,751 spending - $3,000 Part B premium - $180.41 Part D
    medicare_cost: 14_570.59

- name: unit test 7 - Part D IRMAA in the 50 percent tier
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    filing_status: SINGLE
    adjusted_gross_income:
      2023: 150_000  # Single, $133,001 to $167,000: $35.30 a month in 2025
    tax_exempt_interest_income:
      2023: 0
    gross_medicare_part_b_premium: 2_220
  output:
    income_adjusted_part_d_premium_surcharge: 423.6
    # $17,751 - $2,220 Part B - $180.41 Part D - $423.60 Part D IRMAA
    medicare_cost: 14_926.99

- name: unit test 8 - projected year
  period: 2027
  absolute_error_margin: 0.01
  input:
    age: 67
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 2_500
    income_adjusted_part_d_premium_surcharge: 0
  output:
    # $20,096 - $2,500 Part B - 0.8255 x $373.53 = $308.35 Part D (2027)
    medicare_cost: 17_287.65

- name: unit test 9 - Inflation Reduction Act premium reset year, with IRMAA
  period: 2030
  absolute_error_margin: 0.01
  input:
    age: 70
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 3_000
    income_adjusted_part_d_premium_surcharge: 1_000
  output:
    # $23,789 - $3,000 Part B - 0.8382 x $637.06 = $533.98 Part D - $1,000
    # Part D IRMAA (2030)
    medicare_cost: 19_255.02

- name: unit test 10 - premiums above spending floor the value at zero
  period: 2025
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 30_000
  output:
    medicare_cost: 0

- name: unit test 11 - gross cost does not subtract the Part D premium
  period: 2025
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 2_220
    income_adjusted_part_d_premium_surcharge: 1_029.6
  output:
    medicare_gross_cost: 17_751

# From 2036 the premium grows at its 2034-2035 rate, and the share holds its
# 2035 value until 2040.
- name: unit test 13 - the premium extension starts after 2035
  period: 2036
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    gross_medicare_part_b_premium: 3_000
    income_adjusted_part_d_premium_surcharge: 0
  output:
    # Premium 722.05 x 722.05 / 699.07 = 745.79, times the 2035 share 0.8485
    # gives 632.80. 33,488.47 gross - 3,000 Part B - 632.80 Part D = 29,855.67.
    medicare_gross_cost: 33_488.47
    medicare_cost: 29_855.67

# A Medicare enrollee whose drug coverage is not Part D owes no Part D IRMAA
# (income_adjusted_part_d_premium_surcharge is defined for
# medicare_part_d_enrolled), but still has the average Part D premium
# subtracted, because the spending averages Part D over every enrollee.
- name: unit test 12 - high income, not enrolled in Part D
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 65
    is_medicare_eligible: true
    medicare_quarters_of_coverage: 40
    takes_up_medicare_part_d_if_eligible: false
    adjusted_gross_income:
      2023: 500_000  # IRMAA uses income from 2 years prior
    tax_exempt_interest_income:
      2023: 0
    filing_status: SINGLE
  output:
    income_adjusted_part_d_premium_surcharge: 0
    # $17,751 - $7,546.80 Part B with IRMAA - $180.41 Part D (2025)
    medicare_cost: 10_023.79

- name: unit test 14 - undocumented person is not enrolled and has no cost
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    immigration_status: UNDOCUMENTED
    pension_income: 10_000
    state_code: TX
  output:
    medicare_cost: 0

- name: unit test 15 - person with temporary protected status, premium-free Part A
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    immigration_status: TPS
    medicare_quarters_of_coverage: 40
    pension_income: 10_000
    state_code: TX
  output:
    # $18,983 spending - $2,434.80 Part B premium ($202.90 * 12) - 0.8195 x
    # $289.79 = $237.48 Part D (2026)
    medicare_cost: 16_310.72
