# The subsidy goes only to people in a Part D plan. Medicaid enrollees and
# SSI recipients are enrolled without an application; other eligible people
# are enrolled if they take up the subsidy.

- name: Medicaid enrollee who would not apply is enrolled anyway.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: true
        medicare_part_d_enrolled: true
        medicaid_enrolled: true
        ssi: 0
        takes_up_part_d_lis_if_eligible: false
  output:
    part_d_lis_enrolled: true

- name: SSI recipient who would not apply is enrolled anyway.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: true
        medicare_part_d_enrolled: true
        medicaid_enrolled: false
        ssi: 1_200
        takes_up_part_d_lis_if_eligible: false
  output:
    part_d_lis_enrolled: true

- name: Other eligible person who does not take it up.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: true
        medicare_part_d_enrolled: true
        medicaid_enrolled: false
        ssi: 0
        takes_up_part_d_lis_if_eligible: false
  output:
    part_d_lis_enrolled: false

- name: Other eligible person who takes it up.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: true
        medicare_part_d_enrolled: true
        medicaid_enrolled: false
        ssi: 0
        takes_up_part_d_lis_if_eligible: true
  output:
    part_d_lis_enrolled: true

- name: Medicaid enrollee who opted out of Part D gets no subsidy.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: true
        medicare_part_d_enrolled: false
        medicaid_enrolled: true
        ssi: 1_200
        takes_up_part_d_lis_if_eligible: true
  output:
    part_d_lis_enrolled: false

- name: Medicaid enrollee who is not eligible (not in Medicare) is not enrolled.
  period: 2026
  input:
    people:
      person:
        part_d_lis_eligible: false
        medicare_part_d_enrolled: true
        medicaid_enrolled: true
        ssi: 0
  output:
    part_d_lis_enrolled: false

- name: A Medicaid enrollee whose Part D input is false gets no subsidy.
  period: 2026
  input:
    people:
      person:
        age: 70
        part_d_lis_eligible: true
        medicaid_enrolled: true
        ssi: 0
        # CMS enrolls Medicaid enrollees in a plan unless they decline Part D
        # or are qualifying covered retirees (42 CFR 423.34(d), (e)); the
        # microdata mark those people with this input.
        takes_up_medicare_part_d_if_eligible: false
  output:
    medicare_part_d_enrolled: false
    part_d_lis_enrolled: false
    part_d_lis: 0
