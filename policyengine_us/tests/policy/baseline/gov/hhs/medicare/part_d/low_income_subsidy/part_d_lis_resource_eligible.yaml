# Countable resources of the person and a spouse living with them must not
# exceed the limit plus $1,500 per person for burial funds (POMS HI
# 03030.025, 20 CFR 418.3425(j)).

- name: Single person at the 2026 limit with the burial exclusion.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: 18_090
  output:
    # 16,590 + 1,500 = 18,090.
    part_d_lis_resource_eligible: true

- name: Single person one dollar over the 2026 limit.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: 18_091
  output:
    part_d_lis_resource_eligible: false

- name: Married couple at the 2026 couple limit, resources combined.
  period: 2026
  input:
    people:
      spouse1:
        bank_account_assets: 20_000
      spouse2:
        stock_assets: 10_120
        bond_assets: 6_000
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
  output:
    # 20,000 + 10,120 + 6,000 = 36,120 = 33,120 + 2 x 1,500. The statute's
    # formula gives $33,120; CMS published $33,100 (see the couple limit's
    # parameter file).
    part_d_lis_resource_eligible: [true, true]

- name: Married couple one dollar over the 2026 couple limit.
  period: 2026
  input:
    people:
      spouse1:
        bank_account_assets: 20_001
      spouse2:
        stock_assets: 16_120
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
  output:
    part_d_lis_resource_eligible: [false, false]

- name: 2023 uses the higher (partial subsidy) limit.
  period: 2023
  input:
    people:
      person:
        bank_account_assets: 16_660
  output:
    # 15,160 + 1,500 = 16,660, CMS's published 2023 partial subsidy limit.
    # The 2023 full subsidy limit was 9,090 + 1,500 = 10,590.
    part_d_lis_resource_eligible: true

- name: Single person at the projected 2027 limit.
  period: 2027
  input:
    people:
      person:
        bank_account_assets: 18_710
  output:
    # 16,590 x 336.940 / 324.800 = 17,210.08, rounded to 17,210; plus 1,500.
    part_d_lis_resource_eligible: true

- name: Single person one dollar over the projected 2027 limit.
  period: 2027
  input:
    people:
      person:
        bank_account_assets: 18_711
  output:
    part_d_lis_resource_eligible: false

- name: Married couple at the projected 2027 couple limit.
  period: 2027
  input:
    people:
      spouse1:
        bank_account_assets: 37_360
      spouse2:
        bank_account_assets: 0
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
  output:
    # 33,120 x 336.940 / 324.800 = 34,357.92, rounded to 34,360; plus 2 x
    # 1,500 = 37,360.
    part_d_lis_resource_eligible: [true, true]

- name: Non-home real estate counts for the household head's couple only.
  period: 2026
  input:
    people:
      head:
        age: 70
        is_household_head: true
        bank_account_assets: 20_000
      spouse:
        age: 68
        bank_account_assets: 7_000
      mother:
        age: 92
        bank_account_assets: 9_000
    marital_units:
      couple:
        members: [head, spouse]
      mother_unit:
        members: [mother]
    households:
      household:
        members: [head, spouse, mother]
        household_other_real_estate_equity: 10_000
  output:
    # The couple: 20,000 + 7,000 + 10,000 = 37,000 > 33,120 + 3,000 =
    # 36,120. The mother: 9,000 <= 16,590 + 1,500 = 18,090.
    part_d_lis_resource_eligible: [false, false, true]

- name: With two flagged heads, the older one holds the real estate.
  period: 2026
  input:
    people:
      younger:
        age: 70
        is_household_head: true
        bank_account_assets: 9_000
      older:
        age: 80
        is_household_head: true
        bank_account_assets: 9_000
    marital_units:
      younger_unit:
        members: [younger]
      older_unit:
        members: [older]
    households:
      household:
        members: [younger, older]
        household_other_real_estate_equity: 10_000
  output:
    # The younger: 9,000 <= 16,590 + 1,500 = 18,090. The older: 9,000 +
    # 10,000 = 19,000 > 18,090.
    part_d_lis_resource_eligible: [true, false]

- name: Without a designated head, the oldest member holds the real estate.
  period: 2026
  input:
    people:
      head:
        age: 70
        bank_account_assets: 20_000
      spouse:
        age: 68
        bank_account_assets: 7_000
      mother:
        age: 92
        bank_account_assets: 9_000
    marital_units:
      couple:
        members: [head, spouse]
      mother_unit:
        members: [mother]
    households:
      household:
        members: [head, spouse, mother]
        household_other_real_estate_equity: 10_000
  output:
    # The couple: 27,000 <= 36,120. The mother: 9,000 + 10,000 = 19,000 >
    # 18,090.
    part_d_lis_resource_eligible: [true, true, false]

- name: Rental property equity counts above its exclusion, at the limit.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: 10_000
        rental_income: 1_000
    households:
      household:
        members: [person]
        household_rental_property_equity: 14_090
  output:
    # 1,000 >= 6% x 6,000 = 360, so 14,090 - 6,000 = 8,090 counts: 10,000 +
    # 8,090 = 18,090 <= 16,590 + 1,500.
    part_d_lis_resource_eligible: true

- name: Rental property equity one dollar over the limit.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: 10_000
        rental_income: 1_000
    households:
      household:
        members: [person]
        household_rental_property_equity: 14_091
  output:
    # 10,000 + 8,091 = 18,091 > 18,090.
    part_d_lis_resource_eligible: false

- name: Real estate worth less than its debt does not offset bank accounts.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: 18_091
    households:
      household:
        members: [person]
        household_other_real_estate_equity: -5_000
  output:
    # The real estate counts as zero: 18,091 > 18,090. Netting it would give
    # 13,091.
    part_d_lis_resource_eligible: false

- name: An overdrawn bank account does not offset stocks.
  period: 2026
  input:
    people:
      person:
        bank_account_assets: -1_000
        stock_assets: 18_091
  output:
    # 18,091 > 18,090. Netting the overdraft would give 17,091.
    part_d_lis_resource_eligible: false
