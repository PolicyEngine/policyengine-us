# Households computed from their inputs, through the Medicare Savings
# Program and the subsidy's own income and resource tests. 2026 guidelines:
# $15,960 for one person and $21,640 for two (contiguous states); the
# subsidy limit is 150% of them: $23,940 and $32,460. Medicare Savings
# Program QI limit: 135%, $21,546 for one person and $29,214 for two.

- name: Single retiree deemed eligible through a Medicare Savings Program.
  period: 2026
  input:
    people:
      person:
        age: 70
        social_security: 20_000
        bank_account_assets: 5_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Medicare Savings Program countable income (20,000 / 12 - 20) x 12 =
    # 19,760 is above the SLMB limit (120%, 19,152) and below the QI limit,
    # with resources under the $9,950 limit.
    msp_eligible: true
    part_d_lis_deemed_eligible: true
    part_d_lis_countable_income: 19_760
    part_d_lis_income_eligible: true
    part_d_lis_resource_eligible: true
    part_d_lis_eligible: true
    part_d_lis_enrolled: true
    part_d_lis: 1_254

- name: Interest is excluded for the subsidy but not for the Medicare Savings Program.
  period: 2026
  input:
    people:
      person:
        age: 70
        social_security: 20_000
        interest_income: 5_000
        bank_account_assets: 15_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Medicare Savings Program countable income (25,000 / 12 - 20) x 12 =
    # 24,760 is over the QI limit, and $15,000 is over its $9,950 resource
    # limit. The subsidy excludes interest: 19,760 < 23,940, and $15,000 <=
    # 16,590 + 1,500.
    msp_eligible: false
    part_d_lis_deemed_eligible: false
    part_d_lis_countable_income: 19_760
    part_d_lis_eligible: true
    part_d_lis: 1_254

- name: Single retiree with resources over the limit is not eligible.
  period: 2026
  input:
    people:
      person:
        age: 68
        social_security: 22_000
        bank_account_assets: 50_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Countable income (22,000 / 12 - 20) x 12 = 21,760 is under 23,940, but
    # $50,000 is over $18,090.
    part_d_lis_income_eligible: true
    part_d_lis_resource_eligible: false
    part_d_lis_deemed_eligible: false
    part_d_lis_eligible: false
    part_d_lis: 0

- name: Married couple eligible through the income and resource tests.
  period: 2026
  input:
    people:
      spouse1:
        age: 70
        social_security: 18_000
        bank_account_assets: 20_000
      spouse2:
        age: 70
        social_security: 12_000
        bank_account_assets: 10_000
    marital_units:
      marital_unit:
        members: [spouse1, spouse2]
    tax_units:
      tax_unit:
        members: [spouse1, spouse2]
    spm_units:
      spm_unit:
        members: [spouse1, spouse2]
    households:
      household:
        members: [spouse1, spouse2]
        state_code: TX
  output:
    # Combined countable income (30,000 / 12 - 20) x 12 = 29,760 is over the
    # couple QI limit (29,214) but under 32,460; combined resources $30,000
    # are under 33,120 + 3,000 = 36,120.
    msp_eligible: [false, false]
    part_d_lis_family_size: [2, 2]
    part_d_lis_countable_income: [29_760, 29_760]
    part_d_lis_income_eligible: [true, true]
    part_d_lis_resource_eligible: [true, true]
    part_d_lis_eligible: [true, true]
    part_d_lis: [1_254, 1_254]

- name: Not taking it up leaves an applicant-path eligible person without it.
  period: 2026
  input:
    people:
      person:
        age: 70
        social_security: 20_000
        interest_income: 5_000
        bank_account_assets: 15_000
        takes_up_part_d_lis_if_eligible: false
    households:
      household:
        members: [person]
        state_code: TX
  output:
    part_d_lis_eligible: true
    part_d_lis_enrolled: false
    part_d_lis: 0

- name: An eligible person outside Part D gets no subsidy.
  period: 2026
  input:
    people:
      person:
        age: 70
        social_security: 20_000
        bank_account_assets: 5_000
        # For example, drug coverage from TRICARE for Life instead.
        takes_up_medicare_part_d_if_eligible: false
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Deemed eligible through a Medicare Savings Program, as in the first
    # case, but the subsidy pays only for people in a Part D plan.
    part_d_lis_eligible: true
    medicare_part_d_enrolled: false
    part_d_lis_enrolled: false
    part_d_lis: 0

- name: 2023, a person in the former partial-subsidy range gets the average.
  period: 2023
  input:
    people:
      person:
        age: 70
        social_security: 20_500
        bank_account_assets: 12_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # Countable income (20,500 / 12 - 20) x 12 = 20,260: above 135% (19,683)
    # and below 150% (21,870) of the 2023 guideline ($14,580). Resources
    # $12,000 are above the 2023 full-subsidy limit (9,090 + 1,500 = 10,590)
    # and within the partial limit (15,160 + 1,500 = 16,660).
    part_d_lis_countable_income: 20_260
    part_d_lis_eligible: true
    part_d_lis: 3_092

- name: Under-65 Medicare enrollee with a disability on SSI.
  period: 2026
  input:
    people:
      person:
        age: 50
        is_disabled: true
        medicare_enrolled: true
        ssi: 6_000
        bank_account_assets: 1_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    part_d_lis_deemed_eligible: true
    part_d_lis_enrolled: true
    part_d_lis: 1_254

- name: Person aged 70 not enrolled in Medicare gets nothing.
  period: 2026
  input:
    people:
      person:
        age: 70
        medicare_enrolled: false
        social_security: 10_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    part_d_lis_eligible: false
    part_d_lis: 0

- name: Non-home real estate counts toward the resource limit.
  period: 2026
  input:
    people:
      person:
        age: 72
        social_security: 22_800
        bank_account_assets: 1_000
    households:
      household:
        members: [person]
        state_code: TX
        household_other_real_estate_equity: 200_000
  output:
    # Countable income (22,800 / 12 - 20) x 12 = 22,560 is over the QI limit
    # (21,546), so no Medicare Savings Program deems the person eligible, and
    # under 23,940. Resources 1,000 + 200,000 exceed 16,590 + 1,500 = 18,090
    # (20 CFR 418.3405(b)).
    msp_eligible: false
    part_d_lis_income_eligible: true
    part_d_lis_resource_eligible: false
    part_d_lis_eligible: false
    part_d_lis: 0

- name: The same person without the real estate gets the subsidy.
  period: 2026
  input:
    people:
      person:
        age: 72
        social_security: 22_800
        bank_account_assets: 1_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    msp_eligible: false
    part_d_lis_resource_eligible: true
    part_d_lis_eligible: true
    part_d_lis: 1_254

- name: A rental loss does not offset Social Security.
  period: 2026
  input:
    people:
      person:
        age: 70
        social_security: 30_000
        rental_income: -8_000
        bank_account_assets: 5_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # SSI counts net rental income but does not let excess expenses offset
    # other income (POMS SI 00830.505), so the subsidy counts (30,000 / 12 -
    # 20) x 12 = 29,760, over 23,940. Netting the loss would give 21,760.
    part_d_lis_countable_income: 29_760
    part_d_lis_income_eligible: false
    part_d_lis: 0

- name: Spouses filing separately share one family size.
  period: 2026
  input:
    people:
      spouse1:
        age: 70
        social_security: 24_000
      spouse2:
        age: 68
        social_security: 9_000
      grandchild:
        age: 10
        is_tax_unit_dependent: true
    marital_units:
      couple:
        members: [spouse1, spouse2]
      grandchild_unit:
        members: [grandchild]
    tax_units:
      spouse1_return:
        members: [spouse1]
      spouse2_return:
        members: [spouse2, grandchild]
    spm_units:
      spm_unit:
        members: [spouse1, spouse2, grandchild]
    households:
      household:
        members: [spouse1, spouse2, grandchild]
        state_code: TX
  output:
    # The grandchild is a dependent on the second spouse's separate return,
    # so the couple's family is 3 for both spouses. Combined countable
    # income (33,000 / 12 - 20) x 12 = 32,760 is under 150% of the 3-person
    # guideline, 1.5 x (15,960 + 2 x 5,680) = 40,980, but over the 2-person
    # 32,460, so counting only the first spouse's return would deny that
    # spouse. The couple's 2,730 a month exceeds the couple QI limit of
    # 29,214 / 12 = 2,434.50, so no Medicare Savings Program deems them.
    msp_eligible: [false, false, false]
    part_d_lis_family_size: [3, 3, 1]
    part_d_lis_countable_income: [32_760, 32_760, 0]
    part_d_lis_income_eligible: [true, true, true]
    part_d_lis_eligible: [true, true, false]
    part_d_lis: [1_254, 1_254, 0]

- name: 2027 uses the CPI-indexed resource limit.
  period: 2027
  input:
    people:
      person:
        age: 70
        social_security: 18_000
        bank_account_assets: 18_500
    households:
      household:
        members: [person]
        state_code: TX
  output:
    # The 2027 limit is 16,590 x 336.940 / 324.800 = 17,210.08, rounded to
    # 17,210 (September 2026 and 2025 CPI-U), so resources may reach 17,210
    # + 1,500 = 18,710. $18,500 is over the Medicare Savings Program's
    # resource limit, and countable income 17,760 is under 150% of the
    # projected 2027 guideline.
    msp_eligible: false
    part_d_lis_income_eligible: true
    part_d_lis_resource_eligible: true
    part_d_lis_eligible: true
    part_d_lis: 1_384
