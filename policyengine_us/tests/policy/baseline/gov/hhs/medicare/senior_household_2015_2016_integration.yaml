# Households with a member aged 65 or older in 2015 and 2016. Medicare IRMAA
# looks two years back, to 2013 and 2014, which precede the first modeled year;
# these calculations raised ParameterNotFoundError before (issue #9613).
#
# Single 66-year-old in Texas with $10,000 of wages:
# - Payroll tax: 7.65% x $10,000 = $765.
# - Income tax: $0. Wages are below the standard deduction plus the aged
#   addition and the personal exemption, and EITC eligibility ends at 64.
# - SSI: $733 monthly federal benefit rate in 2015 and 2016, less countable
#   earnings of ($10,000 / 12 - $20 - $65) / 2 = $374.17, is $358.83 per month,
#   or $4,306 per year.
# - SNAP: the $16 monthly minimum for one- and two-person households, or $192
#   per year. Net income (earnings plus SSI, less the 20% earned income
#   deduction and the $155 standard deduction, $157 from October 2016) is
#   about $870 a month. That is under the net income limit in every month of
#   both years ($973 through September 2015, $981 through September 2016,
#   then $990), but 30% of it exceeds the $194 maximum allotment.
# - Net income: $10,000 - $765 + $4,306 + $192 = $13,733.

- name: Case 1, 2015 household with a 66-year-old.
  period: 2015
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 66
        employment_income: 10_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    medicare_irmaa_magi_two_years_prior: 0
    income_tax: 0
    ssi: 4_306
    snap: 192
    household_net_income: 13_733

- name: Case 2, 2016 household with a 66-year-old.
  period: 2016
  absolute_error_margin: 1
  input:
    people:
      person:
        age: 66
        employment_income: 10_000
    households:
      household:
        members: [person]
        state_code: TX
  output:
    medicare_irmaa_magi_two_years_prior: 0
    income_tax: 0
    ssi: 4_306
    snap: 192
    household_net_income: 13_733
