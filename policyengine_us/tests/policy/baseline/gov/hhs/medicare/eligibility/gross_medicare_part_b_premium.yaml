# Part B premiums for 2015-2023, from the Federal Register notices of the
# Part B premium rates for each year: the standard premium plus the
# income-related monthly adjustment amount for the tier, times 12. Each person
# is a separate tax unit with MAGI from two years prior provided directly.
# Thresholds are "more than $X" for the first four tiers and "at least $X" for
# the 85% tier, which the Bipartisan Budget Act of 2018 added for 2019.

- name: 2015 single filers across the Part B premium tiers.
  period: 2015
  input:
    people:
      person1:
        age: 66
      person2:
        age: 66
      person3:
        age: 66
      person4:
        age: 66
      person5:
        age: 66
      person6:
        age: 66
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 85_000
      tax_unit2:
        members: [person2]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 85_001
      tax_unit3:
        members: [person3]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 107_001
      tax_unit4:
        members: [person4]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 160_001
      tax_unit5:
        members: [person5]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 214_001
      tax_unit6:
        members: [person6]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 2_000_000
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
  output:
    # MAGI 85,000, at the threshold: $104.90 a month
    # MAGI 85,001, lowest income in the 35% tier: $146.90 (35%) a month
    # MAGI 107,001, lowest income in the 50% tier: $209.80 (50%) a month
    # MAGI 160,001, lowest income in the 65% tier: $272.70 (65%) a month
    # MAGI 214,001, lowest income in the 80% tier: $335.70 (80%) a month
    # MAGI 2,000,000, no 85% tier before 2019: $335.70 (80%) a month
    gross_medicare_part_b_premium: [1_258.8, 1_762.8, 2_517.6, 3_272.4, 4_028.4, 4_028.4]

