- name: A Part A-only enrollee pays no Part B premium.
  # $40,000 of interest is above the 135% FPL MSP limit, so with Part B
  # this person would pay the $185 standard premium: $2,220 a year.
  period: 2025
  input:
    age: 70
    taxable_interest_income: 40_000
    medicare_part_b_enrolled: false
    state_code: TX
  output:
    medicare_enrolled: true
    msp_part_b_premium_coverage: 0
    gross_medicare_part_b_premium_if_enrolled: 0
    medicare_part_b_premium: 0
    medical_expense_health_insurance_premiums: 0

- name: The same person enrolled in Part B pays the standard premium.
  period: 2025
  input:
    age: 70
    taxable_interest_income: 40_000
    state_code: TX
  output:
    medicare_part_b_enrolled: true
    msp_part_b_premium_coverage: 0
    medicaid_part_b_buy_in_premium_coverage: 0
    gross_medicare_part_b_premium_if_enrolled: 2_220
    medicare_part_b_premium: 2_220
    medical_expense_health_insurance_premiums: 2_220

- name: A Part A-only enrollee's other premiums still count.
  period: 2025
  input:
    age: 70
    taxable_interest_income: 40_000
    medicare_part_b_enrolled: false
    health_insurance_premiums_without_medicare_part_b: 1_500
    state_code: TX
  output:
    medicare_part_b_premium: 0
    medical_expense_health_insurance_premiums: 1_500

- name: The state buy-in pays the standard premium for an SSI recipient above the MSP limits.
  # Reported SSI receipt in California, a Section 1634 state, gives Medicaid
  # as an SSI recipient; $30,000 of interest is above 135% FPL, so no MSP.
  period: 2025
  input:
    age: 70
    taxable_interest_income: 30_000
    receives_ssi: true
    state_code: CA
  output:
    msp_part_b_premium_coverage: 0
    medicaid_part_b_buy_in_premium_coverage: 2_220
    medicare_part_b_premium: 0
    medical_expense_health_insurance_premiums: 0

- name: MSP and buy-in coverage of the same premium are not added twice.
  period: 2025
  input:
    age: 70
    gross_medicare_part_b_premium: 4_440
    msp_part_b_premium_coverage: 2_220
    medicaid_part_b_buy_in_premium_coverage: 2_220
  output:
    # The income-related amount above the standard premium stays:
    # 4,440 - 2,220 = 2,220.
    medicare_part_b_premium: 2_220

- name: Coverage above the gross premium leaves no negative premium.
  period: 2025
  input:
    age: 70
    gross_medicare_part_b_premium: 2_220
    msp_part_b_premium_coverage: 3_000
  output:
    medicare_part_b_premium: 0
