# Projected years: 42 U.S.C. 1395w-113(a)(7)(B) applied to the Trustees'
# projected base beneficiary premium (Table V.E2). The base beneficiary
# premium percent falls from 25.5 to 20 percent in 2030, so the 35 percent
# tier's adjustment jumps from $46.44 * 9.5 / 25.5 = $17.30 to $68.93 * 15 /
# 20 = $51.70, as in the Trustees' Table V.E4. Joint 35 percent tier: $238,001
# to $300,000 in 2029 and $242,001 to $306,000 in 2030.
- name: 2029 joint filers in the 35 percent tier.
  period: 2029
  input:
    age: 65
    filing_status: JOINT
    adjusted_gross_income:
      2027: 270_000
    tax_exempt_interest_income:
      2027: 0
  output:
    income_adjusted_part_d_premium_surcharge: 207.6  # $17.30 * 12 months

- name: 2030 joint filers in the 35 percent tier, after the 20 percent reset.
  period: 2030
  input:
    age: 65
    filing_status: JOINT
    adjusted_gross_income:
      2028: 270_000
    tax_exempt_interest_income:
      2028: 0
  output:
    income_adjusted_part_d_premium_surcharge: 620.4  # $51.70 * 12 months
