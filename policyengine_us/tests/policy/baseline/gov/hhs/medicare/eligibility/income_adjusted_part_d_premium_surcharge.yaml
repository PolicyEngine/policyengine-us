      tax_unit6:
        members: [person6]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 2_000_000
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
  output:
    # MAGI 85,000, at the threshold: $0 a month
