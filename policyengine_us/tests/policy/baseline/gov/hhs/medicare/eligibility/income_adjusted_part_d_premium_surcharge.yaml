  period: 2015
  input:
    people:
      person1:
        age: 66
        medicare_enrolled: true
      person2:
        age: 66
        medicare_enrolled: true
      person3:
        age: 66
        medicare_enrolled: true
      person4:
        age: 66
        medicare_enrolled: true
      person5:
        age: 66
        medicare_enrolled: true
      person6:
        age: 66
        medicare_enrolled: true
    tax_units:
      tax_unit1:
        members: [person1]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 85_000
      tax_unit2:
        members: [person2]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 85_001
      tax_unit3:
        members: [person3]
        filing_status: SINGLE
        medicare_irmaa_magi_two_years_prior: 107_001
      tax_unit4:
        members: [person4]
