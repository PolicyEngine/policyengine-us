# IRMAA uses MAGI from two years before the benefit year. When the simulation
# holds no input for that year or any earlier one, the MAGI of the earliest
# year with inputs (no earlier than 2015, the first modeled year) stands in,
# deflated to the year two years prior by
# calibration.gov.cbo.income_by_source.adjusted_gross_income_per_capita (CBO
# AGI divided by population). That index starts in 2015 and is held at its
# 2015 value before then:
#   2015: 9,033,840,000,000 / 326,078,000 = 27,704.54
#   2016: 9,033,840,000,000 / 328,964,000 = 27,461.49
#   2022: 14,821,800,000,000 / 339,654,000 = 43,637.94
#   2023: 15,347,400,000,000 / 342,835,000 = 44,766.14
#   2024: 16,685,900,000,000 / 346,588,000 = 48,143.33
# For 2015 and 2016 benefit years the income year (2013, 2014) precedes the
# model: income provided for it counts, and only that.

- name: Case 1, 2015 benefit year with only 2015 inputs uses 2015 income.
  period: 2015
  input:
    age: 66
    employment_income: 500_000
  output:
    # 500,000 x 27,704.54 (2013, held at 2015) / 27,704.54 (2015).
    medicare_irmaa_magi_two_years_prior: 500_000

- name: Case 2, 2016 benefit year with only 2016 inputs uses 2016 income.
  period: 2016
  absolute_error_margin: 0.01
  input:
    age: 66
    employment_income: 500_000
  output:
    # 500,000 x 27,704.54 (2014, held at 2015) / 27,461.49 (2016).
    medicare_irmaa_magi_two_years_prior: 504_425.34

- name: Case 3, 2015 benefit year counts 2013 income that is provided.
  period: 2015
  input:
    age: 66
    employment_income: 30_000
    adjusted_gross_income:
      2013: 500_000
  output:
    medicare_irmaa_magi_two_years_prior: 500_000

- name: Case 4, 2016 benefit year counts 2014 income that is provided.
  period: 2016
  input:
    age: 66
    adjusted_gross_income:
      2014: 200_000
    tax_exempt_interest_income:
      2014: 5_000
      2016: 0
  output:
    medicare_irmaa_magi_two_years_prior: 205_000

- name: Case 5, 2017 benefit year reads 2015 income, the first modeled year.
  period: 2017
  input:
    age: 66
    adjusted_gross_income:
      2015: 150_000
    tax_exempt_interest_income:
      2015: 5_000
  output:
    medicare_irmaa_magi_two_years_prior: 155_000

- name: Case 6, 2015 Part B premium has no IRMAA for 2015 income below the first threshold.
  period: 2015
  input:
    age: 66
    employment_income: 100_000
    is_medicare_eligible: true
    # 2015 standard Part B premium of $104.90 per month, supplied directly so
    # the case tests only the IRMAA amount.
    base_part_b_premium: 1_258.8
  output:
    medicare_irmaa_magi_two_years_prior: 100_000
    gross_medicare_part_b_premium: 1_258.8

- name: Case 7, 2016 Part D IRMAA is zero for an enrolled earner below the first threshold.
  period: 2016
  absolute_error_margin: 0.01
  input:
    age: 66
    employment_income: 100_000
    is_medicare_eligible: true
    medicare_enrolled: true
  output:
    # 100,000 x 27,704.54 / 27,461.49, under the first threshold of 103,001.
    medicare_irmaa_magi_two_years_prior: 100_885.07
    income_adjusted_part_d_premium_surcharge: 0

- name: A 2025 household with only 2024 inputs has IRMAA set on deflated 2024 income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age:
          2024: 66
        employment_income:
          2024: 200_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code:
          2024: TX
  output:
    # 2024 MAGI of 200,000 x 44,766.14 (2023) / 48,143.33 (2024).
    medicare_irmaa_magi_two_years_prior: 185_970.28
    medicare_irmaa_magi: 185_970.28
    # 2025 single brackets: 167,001 up to 200,001 adds $295.90 a month to the
    # $185 standard premium: 12 x (185 + 295.90) = 5,770.80.
    gross_medicare_part_b_premium: 5_770.8
    # Part D adds $57.00 a month in the same bracket.
    income_adjusted_part_d_premium_surcharge: 684

- name: The same household in 2026 reads its 2024 income without deflation.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age:
          2024: 66
        employment_income:
          2024: 200_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code:
          2024: TX
  output:
    medicare_irmaa_magi_two_years_prior: 200_000
    # 2026 single brackets: 171,001 up to 205,001 adds $324.60 a month to the
    # $202.90 standard premium: 12 x (202.90 + 324.60) = 6,330.
    gross_medicare_part_b_premium: 6_330
    income_adjusted_part_d_premium_surcharge: 724.8

- name: The data year itself as the benefit year looks back to deflated income too.
  period: 2024
  # MAGI is stored as float32, so allow for its rounding.
  absolute_error_margin: 0.1
  input:
    people:
      person:
        age:
          2024: 66
        employment_income:
          2024: 200_000
    tax_units:
      tax_unit:
        members: [person]
    households:
      household:
        members: [person]
        state_code:
          2024: TX
  output:
    # 200,000 x 43,637.94 (2022) / 48,143.33 (2024).
    medicare_irmaa_magi_two_years_prior: 181_283.42
    # 2024 single brackets: 161,001 up to 193,001 adds $279.50 a month to the
    # $174.70 standard premium: 12 x (174.70 + 279.50) = 5,450.40.
    gross_medicare_part_b_premium: 5_450.4

- name: Income provided for the year two years prior is used as given.
  period: 2025
  input:
    people:
      person:
        age:
          2024: 66
        employment_income:
          2024: 200_000
    tax_units:
      tax_unit:
        members: [person]
        adjusted_gross_income:
          2023: 50_000
    households:
      household:
        members: [person]
  output:
    medicare_irmaa_magi_two_years_prior: 50_000
    gross_medicare_part_b_premium: 2_220

- name: A provided IRMAA MAGI overrides the fallback.
  period: 2025
  input:
    people:
      person:
        age:
          2024: 66
        employment_income:
          2024: 200_000
    tax_units:
      tax_unit:
        members: [person]
        medicare_irmaa_magi_two_years_prior:
          2025: 90_000
    households:
      household:
        members: [person]
  output:
    medicare_irmaa_magi: 90_000
    gross_medicare_part_b_premium: 2_220

- name: Amounts excluded under IRC sections 135, 911, 931 and 933 are added back.
  period: 2026
  input:
    age: 66
    adjusted_gross_income:
      2024: 100_000
    tax_exempt_interest_income:
      2024: 2_000
    us_bonds_for_higher_ed:
      2024: 1_000
    foreign_earned_income_exclusion:
      2024: 10_000
    specified_possession_income:
      2024: 3_000
    puerto_rico_income:
      2024: 4_000
  output:
    # 42 U.S.C. 1395r(i)(4)(A): 100,000 + 2,000 + 1,000 + 10,000 + 3,000 + 4,000.
    medicare_irmaa_magi_two_years_prior: 120_000

- name: Excluded amounts provided for an unmodeled lag year are added back too.
  period: 2016
  input:
    age: 66
    adjusted_gross_income:
      2014: 100_000
    us_bonds_for_higher_ed:
      2014: 1_000
      2016: 0
    foreign_earned_income_exclusion:
      2014: 10_000
    puerto_rico_income:
      2014: 4_000
  output:
    medicare_irmaa_magi_two_years_prior: 115_000

- name: Section 911 adds back Form 2555 lines 45 and 50, before disallowed deductions.
  period: 2026
  input:
    age: 66
    adjusted_gross_income:
      2024: 100_000
    section_911_excluded_income:
      2024: 25_000
    # The rate stacking amount after 10,000 of disallowed deductions.
    foreign_earned_income_exclusion:
      2024: 15_000
  output:
    medicare_irmaa_magi_two_years_prior: 125_000

- name: Form 2555 amounts provided for an unmodeled lag year are added back in full.
  period: 2016
  input:
    age: 66
    adjusted_gross_income:
      2014: 100_000
    section_911_excluded_income:
      2014: 25_000
    foreign_earned_income_exclusion:
      2014: 15_000
  output:
    medicare_irmaa_magi_two_years_prior: 125_000

- name: A section 135 exclusion recorded on a dependent is added back, as AGI deducts it.
  period: 2026
  input:
    people:
      parent:
        age:
          2024: 64
          2026: 66
        employment_income:
          2024: 100_000
          2026: 0
      child:
        age:
          2024: 13
          2026: 15
        # The parent's bond, cashed for the child's tuition: a bond issued
        # in the name of a child under 24 does not qualify (Form 8815).
        us_bonds_for_higher_ed:
          2024: 1_000
          2026: 0
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # 2024 AGI 99,000 deducts the 1,000; IRMAA MAGI is AGI without it.
    medicare_irmaa_magi_two_years_prior: 100_000

- name: Every member's section 135 exclusion is added back to a provided AGI.
  period: 2026
  input:
    people:
      head:
        age: 66
        us_bonds_for_higher_ed:
          2024: 1_000
      spouse:
        age: 64
        us_bonds_for_higher_ed:
          2024: 2_000
      child:
        age: 15
        us_bonds_for_higher_ed:
          2024: 4_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        adjusted_gross_income:
          2024: 100_000
    marital_units:
      marital_unit:
        members: [head, spouse]
      child_marital_unit:
        members: [child]
    households:
      household:
        members: [head, spouse, child]
  output:
    # The 4,000 recorded on the child is the couple's exclusion too
    # (gov.irs.ald.filer_amounts_recorded_on_dependents).
    medicare_irmaa_magi_two_years_prior: 107_000

- name: A dependent's tax-exempt interest is on the dependent's own return.
  period: 2026
  input:
    people:
      parent:
        age:
          2024: 64
          2026: 66
        employment_income:
          2024: 100_000
          2026: 0
        tax_exempt_interest_income:
          2024: 3_000
          2026: 0
      child:
        age:
          2024: 13
          2026: 15
        tax_exempt_interest_income:
          2024: 2_000
          2026: 0
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
  output:
    # 2024 AGI 100,000 leaves out the child's income; only the parent's
    # 3,000 of tax-exempt interest is added.
    medicare_irmaa_magi_two_years_prior: 103_000

- name: A dependent's tax-exempt interest provided for an unmodeled lag year is not added.
  period: 2016
  input:
    people:
      parent:
        age: 66
        tax_exempt_interest_income:
          2014: 3_000
          2016: 0
      child:
        age: 15
        tax_exempt_interest_income:
          2014: 2_000
          2016: 0
    tax_units:
      tax_unit:
        members: [parent, child]
        adjusted_gross_income:
          2014: 100_000
    households:
      household:
        members: [parent, child]
  output:
    medicare_irmaa_magi_two_years_prior: 103_000

- name: Every member's section 135 exclusion for an unmodeled lag year is added back.
  period: 2016
  input:
    people:
      parent:
        age: 66
        us_bonds_for_higher_ed:
          2014: 1_000
          2016: 0
      child:
        age: 15
        us_bonds_for_higher_ed:
          2014: 4_000
          2016: 0
    tax_units:
      tax_unit:
        members: [parent, child]
        adjusted_gross_income:
          2014: 100_000
    households:
      household:
        members: [parent, child]
  output:
    medicare_irmaa_magi_two_years_prior: 105_000
