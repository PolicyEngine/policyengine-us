# IRMAA uses MAGI from two years before the benefit year. PolicyEngine models
# 2015 onward, so for 2015 and 2016 benefit years the income year (2013, 2014)
# is outside the model and the MAGI is zero unless provided directly.

- name: Case 1, 2015 benefit year reads no 2013 income.
  period: 2015
  input:
    age: 66
    employment_income: 500_000
  output:
    medicare_irmaa_magi_two_years_prior: 0

- name: Case 2, 2016 benefit year reads no 2014 income.
  period: 2016
  input:
    age: 66
    employment_income: 500_000
  output:
    medicare_irmaa_magi_two_years_prior: 0

- name: Case 3, 2017 benefit year reads 2015 income, the first modeled year.
  period: 2017
  input:
    age: 66
    adjusted_gross_income:
      2015: 150_000
    tax_exempt_interest_income:
      2015: 5_000
  output:
    medicare_irmaa_magi_two_years_prior: 155_000

- name: Case 4, 2015 Part B premium is the base premium with no IRMAA.
  period: 2015
  input:
    age: 66
    employment_income: 500_000
    is_medicare_eligible: true
    # 2015 standard Part B premium of $104.90 per month, supplied directly so
    # the case tests only the IRMAA amount.
    base_part_b_premium: 1_258.8
  output:
    gross_medicare_part_b_premium: 1_258.8

- name: Case 5, 2016 Part D IRMAA is zero for an enrolled high earner.
  period: 2016
  input:
    age: 66
    employment_income: 500_000
    is_medicare_eligible: true
    medicare_enrolled: true
  output:
    income_adjusted_part_d_premium_surcharge: 0
