# MSP uses individual (1 person) or couple (2 persons) FPL,
# not the full SPM unit size per 42 U.S.C. 1396d(p)
# 2024 FPL: individual = $15,060, couple = $20,440
# Note: Published limits are $20 higher (FPL + $20 exclusion built in)
# Our implementation applies $20 exclusion to income instead - mathematically equivalent

- name: Case 1, single person gets individual FPL.
  period: 2024-01
  input:
    spm_unit_is_married: false
  output:
    # Individual FPL = $15,060/year, monthly = $1,255
    msp_fpg: 1_255

- name: Case 2, married couple both on Medicare gets couple FPL.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
      person2:
        age: 66
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    # Couple FPL = $20,440/year, monthly = $1,703.33
    msp_fpg: [1_703.33, 1_703.33]

- name: Case 3, spouses separated by a facility each keep the one-person guideline.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        is_tax_unit_head: true
        ssi_unearned_income: 12_000
      person2:
        age: 62
        is_tax_unit_spouse: true
        meets_ssi_disability_criteria: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
        ssi_unearned_income: 18_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    # 20 CFR 416.414(b)(3) computes the spouses separately, though each one's income
    # is above the 497 rate difference. One-person guideline: 15,960 / 12 = 1,330.
    msp_fpg: [1_330, 1_330]

- name: Case 4, the guideline and income test change in the month a spouse enters a facility.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        is_tax_unit_head: true
        ssi_unearned_income: 12_000
      person2:
        age: 62
        is_tax_unit_spouse: true
        meets_ssi_disability_criteria: true
        ssi_lives_in_medical_treatment_facility:
          2026-07: true
        ssi_medicaid_pays_majority_of_care:
          2026-07: true
        ssi_unearned_income: 18_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # The stay runs from July through December.
    # June, both at home: SSI combines the couple's income (20 CFR
    # 416.1802(b)(1)), 1,000 + 1,500 - 20 = 2,480, above the 1,491 couple rate,
    # so neither spouse is eligible for SSI. Each spouse's income is above 497
    # and is deemed: 2,480, above 1.35 x 21,640 / 12 = 2,434.50.
    # July, person2 in a facility (20 CFR 416.414(b)(3)): each is tested alone.
    # person1: 1,000 - 20 = 980, at or below 15,960 / 12 = 1,330, so QMB.
    # person2: 1,500 - 20 = 1,480, and not on Medicare.
    msp_fpg:
      2026-06: [1_803.33, 1_803.33]
      2026-07: [1_330, 1_330]
    msp_countable_income:
      2026-06: [2_480, 2_480]
      2026-07: [980, 1_480]
    msp_category:
      2026-06: [NONE, NONE]
      2026-07: [QMB, NONE]
