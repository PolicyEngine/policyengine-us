- name: Case 5, QMB cost sharing switches fiscal year in October.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: CA
    age: 67
    is_medicare_eligible: true
    medicaid_enrolled: false
    msp_category: QMB
    base_part_a_premium: 0
    base_part_b_premium: 1_978.8
  output:
    # Part B premium: $164.90 * 12 = $1,978.80. QMB cost sharing: nine
    # months of FY 2023 ($132.92 / 12) and three of FY 2024 ($137.70 / 12)
    # = $99.69 + $34.425 = $134.115.
    msp_cost: 2_112.915
