- name: Case 1, single applicant under the MSP asset limit.
  period: 2024-01
  input:
    age: 67
    bank_account_assets: 5_000
    spm_unit_is_married: false
    state_code: TX
  output:
    msp_asset_eligible: true

- name: Case 2, couple resources use the spouses' combined assets.
  period: 2024-01
  input:
    people:
      person1:
        age: 68
        bank_account_assets: 8_000
      person2:
        age: 66
        bank_account_assets: 8_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: true
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    msp_asset_eligible: [false, false]

- name: Case 3, non-spouse household members' assets are excluded.
  period: 2024-01
  input:
    people:
      person1:
        age: 67
        bank_account_assets: 5_000
      person2:
        age: 30
        bank_account_assets: 20_000
    tax_units:
      tax_unit:
        members: [person1]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: false
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    msp_asset_eligible: [true, false]

- name: Case 4, 2026 individual asset limit uses the current Medicare.gov value.
  period: 2026-01
  input:
    age: 67
    bank_account_assets: 9_950
    spm_unit_is_married: false
    state_code: TX
  output:
    msp_asset_eligible: true

- name: Case 5, 2026 individual asset limit rejects amounts above the current threshold.
  period: 2026-01
  input:
    age: 67
    bank_account_assets: 9_951
    spm_unit_is_married: false
    state_code: TX
  output:
    msp_asset_eligible: false

- name: Case 6, Maine does not apply an MSP asset test.
  period: 2024-01
  input:
    age: 67
    bank_account_assets: 100_000
    spm_unit_is_married: false
    state_code: ME
  output:
    msp_asset_eligible: true

- name: Case 7, Massachusetts does not apply an MSP asset test.
  period: 2024-01
  input:
    age: 67
    bank_account_assets: 100_000
    spm_unit_is_married: false
    state_code: MA
  output:
    msp_asset_eligible: true

# Policy examples moved from Python; retain their original inputs and outputs.
- name: Historical msp asset eligibility uses federal default
  period: 2014-01
  absolute_error_margin: 0
  input:
    ssi_countable_resources:
      '2014': 0
    state_code: AR
  output:
    msp_asset_eligible: true
- name: Historical msp asset limits before 2013
  period: 2012-01
  absolute_error_margin: 0
  input:
    people:
      below_limit:
        ssi_countable_resources:
          '2012': 6940
      above_limit:
        ssi_countable_resources:
          '2012': 7000
      spouse_1:
        ssi_countable_resources:
          '2012': 5000
      spouse_2:
        ssi_countable_resources:
          '2012': 5500
    households:
      household:
        members:
        - below_limit
        - above_limit
        - spouse_1
        - spouse_2
        state_code: AR
    tax_units:
      tax_unit_1:
        members:
        - below_limit
      tax_unit_2:
        members:
        - above_limit
      tax_unit_3:
        members:
        - spouse_1
        - spouse_2
    spm_units:
      spm_unit_1:
        members:
        - below_limit
      spm_unit_2:
        members:
        - above_limit
      spm_unit_3:
        members:
        - spouse_1
        - spouse_2
    families:
      family_1:
        members:
        - below_limit
      family_2:
        members:
        - above_limit
      family_3:
        members:
        - spouse_1
        - spouse_2
    marital_units:
      marital_unit_1:
        members:
        - below_limit
      marital_unit_2:
        members:
        - above_limit
      marital_unit_3:
        members:
        - spouse_1
        - spouse_2
  output:
    msp_asset_eligible:
    - true
    - false
    - false
    - false
