    msp_asset_eligible:
      2022-06: [false, false]
      2022-07: [true, true]

- name: Case 22, California's MSP individual asset limit falls to 21,000 in July 2027.
  period: 2027
  input:
    age: 67
    bank_account_assets: 21_001
    spm_unit_is_married: false
    state_code: CA
  output:
    # 21,001 is under 130,000 in June and over 21,000 from July; the federal
    # limit is lower than both.
    msp_asset_eligible:
      2027-06: true
      2027-07: false

