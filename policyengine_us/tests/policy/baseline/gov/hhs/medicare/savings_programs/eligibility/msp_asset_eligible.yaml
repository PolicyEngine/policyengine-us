- name: Case 11, Minnesota's couple asset limit is above the federal limit.
  period: 2026-01
  input:
    people:
      person1:
        age: 70
        bank_account_assets: 9_000
      person2:
        age: 68
        bank_account_assets: 9_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: true
    households:
      household:
        members: [person1, person2]
        state_code: MN
  output:
    # Combined 18,000 is at Minnesota's 18,000 couple limit and above the
    # federal 14,910.
    msp_asset_eligible: [true, true]

- name: Case 12, Washington applied the MSP asset test through December 2022.
  period: 2022
  input:
    age: 67
    bank_account_assets: 100_000
    spm_unit_is_married: false
    state_code: WA
  output:
    # WSR 22-21-043 removed the resource test effective January 1, 2023.
    msp_asset_eligible:
      2022-12: false

- name: Case 13, California raised the MSP asset limit to 130,000 dollars in July 2022.
  period: 2022
  input:
    age: 67
    bank_account_assets: 100_000
    spm_unit_is_married: false
    state_code: CA
  output:
    # Federal 2022 limit 8,400 through June; ACWDL 21-31 limit 130,000 from July 1, 2022.
    msp_asset_eligible:
      2022-06: false
      2022-07: true

- name: Case 14, California had no MSP asset test in December 2025.
  period: 2025
  input:
    age: 67
    bank_account_assets: 130_001
    spm_unit_is_married: false
    state_code: CA
  output:
    # ACWDL 25-27: no MSP asset limit from January 1, 2024, through December 31, 2025.
    msp_asset_eligible:
      2025-12: true

