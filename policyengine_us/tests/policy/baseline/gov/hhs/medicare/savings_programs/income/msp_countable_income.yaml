    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 20 CFR 416.1801(c): 1,400 - 20 = 1,380 is below the 1,491 couple rate, so each
    # spouse is eligible for SSI: (1,491 - 1,380) / 2 = 55.50.
    # Only person1 is on Medicare, so the two are not tested together (CMS memorandum
    # of October 2, 1997), and neither is an ineligible spouse, so nothing is deemed
    # either way (20 CFR 416.1160(d)). person1 alone: 1,380 against the one-person
    # 1,330 is SLMB. Tested together on the two-person 1,803.33, it would be QMB.
    uncapped_ssi: [55.50, 55.50]
    msp_tests_as_couple: [false, false]
    msp_countable_income: [1_380, 0]
    msp_fpg: [1_330, 1_330]
    msp_category: [SLMB, NONE]

