- name: Case 1, couple income is combined for married MSP applicants.
  period: 2024-01
  input:
    people:
      person1:
        age: 68
        ssi_unearned_income: 12_000
      person2:
        age: 66
        ssi_unearned_income: 12_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: true
  output:
    msp_countable_income: [1_980, 1_980]
  absolute_error_margin: 0.01

- name: Case 2, spouse-to-spouse deeming counts an ineligible spouse's earnings.
  period: 2025-01
  input:
    people:
      person1:
        age: 65
        is_tax_unit_spouse: true
      person2:
        age: 60
        is_tax_unit_head: true
        ssi_earned_income: 31_080
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: true
  output:
    msp_countable_income: [1_252.50, 1_252.50]
  absolute_error_margin: 0.01

- name: Spouse deeming with moderate income still allows QMB eligibility.
  period: 2024-01
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 67
        is_medicare_eligible: true
        is_ssi_aged_blind_disabled: true
        ssi_unearned_income: 0
        ssi_earned_income: 0
      person2:
        age: 60
        is_medicare_eligible: false
        is_ssi_aged_blind_disabled: false
        ssi_earned_income: 12_000
        ssi_unearned_income: 0
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    # Spouse earned $12,000/yr deemed to person1. Monthly: $1,000.
    # SSI exclusions: $20 general shifted to earned (unearned=0),
    # $65 earned excl => flat $85, remainder $915, 50% excluded => $457.50/mo.
    # Person2 own income also $12,000 earned, same exclusions => $457.50/mo.
    # Both under 100% FPL (~$1,255/mo) so person1 still qualifies for QMB.
    msp_countable_income: [457.50, 457.50]

- name: MSP excludes qualified salary-reduction health premiums before SSI income exclusions.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    age: 70
    employment_income: 12_000
    pre_tax_health_insurance_premiums: 2_400
  output:
    # 42 USC 1396d(p)(1)(B) uses SSI income methodology.
    # POMS SI 00820.102C.2: (12,000 - 2,400) / 12 = 800 SSI wages.
    # 20 CFR 416.1112(c)(4), (5), (7): (800 - 20 - 65) / 2 = 357.50.
    msp_countable_income: 357.50

- name: MSP combines both Medicare spouses' wages after excluding their pretax premiums.
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        employment_income: 12_000
        pre_tax_health_insurance_premiums: 2_400
      person2:
        age: 66
        employment_income: 24_000
        pre_tax_health_insurance_premiums: 3_600
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    # POMS SI 00820.102C.2 removes each spouse's salary reduction.
    # 42 USC 1396d(p)(1)(B) and 20 CFR 416.1160(a)(1) combine the wages:
    # (12,000 - 2,400 + 24,000 - 3,600) / 12 = 2,500 monthly.
    # Apply the couple's exclusions once: (2,500 - 20 - 65) / 2 = 1,207.50.
    msp_countable_income: [1_207.50, 1_207.50]

- name: Case 6, Illinois exempts the first 25 dollars of income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 70
    social_security_retirement: 12_000
    state_code: IL
  output:
    # 12,000 / 12 - 25 = 975.
    msp_countable_income: 975

- name: Case 7, Mississippi raises the general income exclusion to 50 dollars.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    age: 70
    social_security_retirement: 12_000
    state_code: MS
  output:
    # 12,000 / 12 - 50 = 950.
    msp_countable_income: 950

- name: Case 8, Illinois gives each Medicare spouse with income a 25 dollar exemption.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 72
        social_security_retirement: 13_200
      person2:
        age: 70
        social_security_retirement: 8_880
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
        spm_unit_is_married: true
    households:
      household:
        members: [person1, person2]
        state_code: IL
  output:
    # PM 15-04-03-a: both spouses apply and both have income, so two exemptions.
    # (13,200 + 8,880) / 12 - 2 x 25 = 1,790.
    msp_countable_income: [1_790, 1_790]

