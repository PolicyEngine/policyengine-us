- name: Case 24, allocations for ineligible children come off the spouse's income before deeming.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        is_tax_unit_head: true
        ssi_unearned_income: 12_000
      person2:
        age: 62
        is_tax_unit_spouse: true
        meets_ssi_disability_criteria: true
        ssi_unearned_income: 18_000
      person3:
        age: 12
      person4:
        age: 10
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    marital_units:
      marital_unit:
        members: [person1, person2]
      child1_marital_unit:
        members: [person3]
      child2_marital_unit:
        members: [person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    # 20 CFR 416.1163(b): two allocations of 1,491 - 994 = 497 total 994.
    # person1: 1,500 - 994 = 506, above 497, so it is deemed (416.1163(d)(2)):
    # 1,000 + 506 - 20 = 1,486, at or below the two-person 21,640 / 12 = 1,803.33.
    # person2: 1,000 - 994 = 6, not above 497, so 1,500 - 20 = 1,480 alone.
    msp_countable_income: [1_486, 1_480, 0, 0]
    msp_fpg: [1_803.33, 1_330, 1_330, 1_330]
    msp_category: [QMB, NONE, NONE, NONE]

