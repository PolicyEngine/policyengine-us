# Idaho's 5,000 BBCE asset limit: 4,338.99 + 609.03 + 51.98 = 5,000.00.
# The float32 balances add to 5,000.0005 unless rounded to cents.
- name: Three accounts that total exactly the Idaho limit pass
  period: 2026
  input:
    state_code_str: ID
    bank_account_assets: 4_338.99
    stock_assets: 609.03
    bond_assets: 51.98
  output:
    meets_tanf_non_cash_asset_test: true

# 4,338.99 + 609.03 + 51.99 = 5,000.01, a cent over the limit.
- name: Three accounts a cent over the Idaho limit fail
  period: 2026
  input:
    state_code_str: ID
    bank_account_assets: 4_338.99
    stock_assets: 609.03
    bond_assets: 51.99
  output:
    meets_tanf_non_cash_asset_test: false
