- name: Default small household is exempt from California's BBCE net income test.
  period: 2022
  output:
    meets_tanf_non_cash_net_income_test: true

- name: California three-person household with net income exactly at the standard meets the net income test.
  period: 2022
  input:
    snap_unit_size: 3
    snap_fpg: 12_000
    snap_net_income: 12_000
  output:
    # Monthly standard is ceil(1.0 x 1,000) = 1,000; net income of 1,000
    # per month is exactly at it.
    meets_tanf_non_cash_net_income_test: true

- name: California three-person household with net income above the standard fails the net income test.
  period: 2022
  input:
    snap_unit_size: 3
    snap_fpg: 12_000
    snap_net_income: 12_120
  output:
    # Net income of 1,010 per month exceeds the 1,000 standard.
    meets_tanf_non_cash_net_income_test: false

- name: California three-person household at the rounded-up whole-dollar standard meets the net income test.
  period: 2022
  input:
    snap_unit_size: 3
    # Monthly poverty guideline of 2,220.83 yields a whole-dollar standard
    # of ceil(2,220.83) = 2,221, so a rounded net income of exactly 2,221
    # still passes; a raw ratio comparison (2,221 / 2,220.83 > 1) would
    # wrongly deny this household.
    snap_fpg: 26_650
    snap_net_income: 26_652
  output:
    meets_tanf_non_cash_net_income_test: true

- name: California nine-person household at the published FY 2026 net standard meets the net income test.
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 9
        # The eight-person standard of $4,513 plus a rounded-up $459
        # increment gives $4,972 under 7 CFR 273.9(a)(3)(ii), not the $4,971
        # from rounding up the whole nine-person guideline.
        snap_net_income: 4_972
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    meets_tanf_non_cash_net_income_test: true

- name: California nine-person household just above the FY 2026 net standard fails the net income test.
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 9
        # FY 2026 uses the 2025 contiguous-state guidelines ($15,650 first
        # person, $5,500 each additional). The eight-person standard is
        # ($15,650 + 7 x $5,500) / 12 = $4,512.50, rounded up to $4,513;
        # adding the rounded-up $5,500 / 12 = $458.33 -> $459 increment gives
        # $4,972 under 7 CFR 273.9(a)(3)(ii). Net income of $4,973 is $1
        # above it.
        snap_net_income: 4_973
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    meets_tanf_non_cash_net_income_test: false
