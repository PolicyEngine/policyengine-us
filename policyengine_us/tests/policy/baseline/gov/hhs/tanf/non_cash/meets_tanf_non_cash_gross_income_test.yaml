- name: NC full-count alien income flips the BBCE gross screen where the prorated income would pass
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 35
        employment_income: 48_000
        employment_income_before_lsr: 48_000
        immigration_status: UNDOCUMENTED
      person2:
        age: 33
      person3:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: NC
  output:
    # North Carolina fully counts the alien's income under gross screens
    # (7 CFR 273.11(c)(3)(i)) while prorating it on the net side. The
    # full $4,000 monthly income exceeds NC's 200% FPL BBCE limit for the
    # 2-person unit, though the prorated $2,666.67 would have passed.
    snap_gross_income: 2_666.67
    snap_gross_test_income: 4_000
    meets_tanf_non_cash_gross_income_test: false

# Washington boundary tests: WAC 388-414-0001(2)(a)(ii) re-bases the
# 200% standard on the current-year poverty guidelines each April 1
# (whole-dollar limits), not the federal October fiscal-year schedule.
- name: WA March 2025, income at the $2,510 limit passes
  period: 2025-03
  input:
    people:
      person1:
        age:
          2025: 30
    spm_units:
      spm_unit:
        members: [person1]
        snap_gross_test_income:
          2025-03: 2_510
    households:
      household:
        members: [person1]
        state_code:
          2025: WA
  output:
    meets_tanf_non_cash_gross_income_test: true

