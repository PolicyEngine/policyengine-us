- name: "Default SPM unit is eligible because they have no income and assets"
  period: 2022
  output:
    is_tanf_non_cash_eligible: true

# Arkansas adopted BBCE by emergency rule effective April 4, 2025 (SNAP
# Certification Manual 1919 and Appendix AA): a $5,500 resource limit and
# gross income at or below 130% of the poverty guideline, with the net test
# kept. The parameters apply from the first full month, May 2025. Annual
# inputs are spread evenly over the months.
- name: AR one-person household with $4,000 in assets is eligible from May 2025
  period: 2025
  input:
    age: 30
    weekly_hours_worked_before_lsr: 40
    state_code: AR
    snap_assets: 4_000
    snap_gross_test_income: 18_000  # 1,500 a month; the 130% standard is 1,631.50
    snap_net_income: 12_000  # 1,000 a month; the net standard is 1,255
  output:
    is_tanf_non_cash_eligible:
      2025-04: false
      2025-05: true
      2025-12: true
