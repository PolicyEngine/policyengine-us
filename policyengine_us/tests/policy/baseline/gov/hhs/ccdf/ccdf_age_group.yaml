- name: Child age, 1, center-based care
  period: 2022
  input:
    age: 1
    childcare_provider_type_group: DCC_SACC
  output:
    ccdf_age_group: INFANT

- name: Child age, 1.5, home-based care
  period: 2022
  input:
    age: 1.5
    childcare_provider_type_group: FDC_GFDC
  output:
    ccdf_age_group: INFANT

- name: Child age, 1.5, center-based care
  period: 2022
  input:
    age: 1.5
    childcare_provider_type_group: DCC_SACC
  output:
    ccdf_age_group: TODDLER

- name: Child age, 2, home-based care
  period: 2022
  input:
    age: 2
    childcare_provider_type_group: LE_STD
  output:
    ccdf_age_group: TODDLER

- name: Child age, 3
  period: 2022
  input:
    age: 3
  output:
    ccdf_age_group: PRESCHOOLER

- name: Child age, 10
  period: 2022
  input:
    age: 10
  output:
    ccdf_age_group: SCHOOL_AGE

# Everyone in the simulation gets an age group, not only eligible children.
# Ages at or above the CCDF age limit (13) fall through to SCHOOL_AGE; without
# an explicit select default they used to become an integer 0 that could not
# be encoded as a CCDFAgeGroup, crashing every household with an adult in it.
- name: Age 13, the CCDF age limit, still resolves to school age
  period: 2026
  input:
    age: 13
  output:
    ccdf_age_group: SCHOOL_AGE

- name: Adult resolves to school age rather than an unencodable value
  period: 2026
  input:
    age: 35
  output:
    ccdf_age_group: SCHOOL_AGE

- name: Household with two adults and a preschooler, adults listed first
  period: 2026
  input:
    people:
      worker:
        age: 35
      home:
        age: 33
      kid:
        age: 3
    households:
      household:
        members: [worker, home, kid]
        state_code: VA
  output:
    ccdf_age_group: [SCHOOL_AGE, SCHOOL_AGE, PRESCHOOLER]
