- name: Case 1, eligible for head start in CA.
  period: 2022
  absolute_error_margin: 0.5
  input:
    state_code: CA
    is_head_start_eligible: true
  output:
    head_start: 14_656.07 # 855,093,837 / 58,344

- name: Case 2, ineligible for head start in CA.
  period: 2022
  absolute_error_margin: 0.5
  input:
    state_code: CA
    is_head_start_eligible: false
  output:
    head_start: 0

- name: Case 3, eligible but does not take up head start.
  period: 2022
  absolute_error_margin: 0.5
  input:
    state_code: CA
    is_head_start_eligible: true
    takes_up_head_start_if_eligible: false
  output:
    head_start: 0

- name: Case 4, eligible in KS using FY2024 data (2023-09-01 entry).
  period: 2024
  absolute_error_margin: 1
  input:
    state_code: KS
    is_head_start_eligible: true
  output:
    # FY2024 (2023-09-01): 66,709,446 / 4,590 = 14,533.65 per child,
    # uprated to the 2024 period by gov.hhs.uprating.
    head_start: 14_958.16

- name: 2025 Texas per-slot amount uses the published calendar-2025 CPI-U average.
  period: 2025
  absolute_error_margin: 0.5
  input:
    state_code: TX
    is_head_start_eligible: true
  output:
    head_start: 12_076.41 # 540,532,752 x (321.9 / 304.7) / 47,286

# Case 1's full-year value, 14,656.07, times 3 / 12 = 3,664.02. The parent is
# not in Head Start's age range.
- name: SNAP from October gives three months of Head Start in California.
  period: 2022
  absolute_error_margin: 0.5
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2022-01: 0
          2022-02: 0
          2022-03: 0
          2022-04: 0
          2022-05: 0
          2022-06: 0
          2022-07: 0
          2022-08: 0
          2022-09: 0
          2022-10: 100
          2022-11: 100
          2022-12: 100
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    head_start: [0, 3_664.02]
