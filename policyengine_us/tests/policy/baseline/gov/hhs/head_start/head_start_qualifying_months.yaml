          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 100
          2025-11: 100
          2025-12: 100
        tanf: 1_000
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
