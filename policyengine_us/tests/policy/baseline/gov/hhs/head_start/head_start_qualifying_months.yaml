# Each case sets TANF to zero except the TANF case, so only the assistance
# each case names qualifies the family.

- name: SNAP in every month covers the whole year.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 100
          2025-02: 100
          2025-03: 100
          2025-04: 100
          2025-05: 100
          2025-06: 100
          2025-07: 100
          2025-08: 100
          2025-09: 100
          2025-10: 100
          2025-11: 100
          2025-12: 100
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [12, 12]

# 45 CFR 1302.12(j)(1): eligibility continues from the first month of SNAP,
# so October, November and December count.
- name: SNAP from October covers October to December.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 100
          2025-11: 100
          2025-12: 100
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [3, 3]

