# The foster care test reads the child's own status, so the parent keeps
# the three months that SNAP from October gives.
- name: Foster care covers the whole year for the foster child only.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
        was_in_foster_care: true
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 100
          2025-11: 100
          2025-12: 100
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [3, 12]

