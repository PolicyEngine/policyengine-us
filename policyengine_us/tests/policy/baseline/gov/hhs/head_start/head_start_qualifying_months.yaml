          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 500
          2025-08: 500
          2025-09: 500
          2025-10: 500
          2025-11: 500
          2025-12: 500
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 0
          2025-11: 0
          2025-12: 0
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [6, 6]

# receives_snap counts for a household the model gives a $0 allotment.
- name: Reported SNAP receipt from October covers October to December.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 0
          2025-11: 0
          2025-12: 0
        receives_snap:
          2025-01: false
          2025-02: false
          2025-03: false
          2025-04: false
          2025-05: false
          2025-06: false
          2025-07: false
          2025-08: false
          2025-09: false
          2025-10: true
          2025-11: true
          2025-12: true
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [3, 3]

