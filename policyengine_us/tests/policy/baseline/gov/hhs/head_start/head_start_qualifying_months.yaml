        state_code: GA
  output:
    head_start_qualifying_months: [10, 10]

# Eligibility continues after the assistance stops (45 CFR 1302.12(j)), so
# April to December count too.
- name: SNAP from January to March covers the whole year.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 80_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 100
          2025-02: 100
          2025-03: 100
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 0
          2025-11: 0
          2025-12: 0
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [12, 12]

# The income test reads the year's income, so it covers every month.
- name: Income at or below the poverty line covers the whole year, even with SNAP from October.
  period: 2025
  input:
    people:
      parent:
        age: 30
        employment_income: 10_000
      child:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child]
        tanf: 0
        snap:
          2025-01: 0
          2025-02: 0
          2025-03: 0
          2025-04: 0
          2025-05: 0
          2025-06: 0
          2025-07: 0
          2025-08: 0
          2025-09: 0
          2025-10: 100
          2025-11: 100
          2025-12: 100
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    head_start_qualifying_months: [12, 12]

- name: SSI from July covers July to December.
  period: 2025
