- name: Case 13, child adopted out of foster care is not categorically eligible on that basis.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 200_000
      person2:
        age: 4
        was_in_foster_care: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 45 CFR 1302.12(c)(1)(iv) covers a child who is in foster care. A child
    # who has left care, with no other route, does not qualify.
    is_head_start_categorically_eligible: [false, false]

- name: Case 14, child in foster care from January through June is categorically eligible.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 200_000
      person2:
        age: 4
        is_in_foster_care:
          2024-01: true
          2024-02: true
          2024-03: true
          2024-04: true
          2024-05: true
          2024-06: true
          2024-07: false
          2024-08: false
          2024-09: false
          2024-10: false
          2024-11: false
          2024-12: false
    tax_units:
      tax_unit:
        members: [person1, person2]
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Reunified in July: a placement in any month of the year counts, not
    # only December.
    is_head_start_categorically_eligible: [false, true]
