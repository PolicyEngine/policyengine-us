# The national flag is true when any state eligibility variable listed in
# gov.hhs.liheap.regular_eligibility is true. 2026 poverty guidelines
# (contiguous US): 15,960 for one person plus 5,680 for each additional person.

- name: Case 1, a household eligible for its state's program is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 34
        # 12 an hour for 30 hours a week: 12 * 30 * 52 = 18,720.
        employment_income_before_lsr: 18_720
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        has_cooling_expense: true
        # 165 a month for heating and air conditioning.
        pre_subsidy_electricity_expense: 1_980
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 18,720 / 15,960 = 117% of the guideline, within Texas's 150%.
    tx_ceap_eligible: true
    liheap_eligible: true

- name: Case 2, a household over its state's income limit is not eligible.
  period: 2026
  input:
    people:
      person1:
        age: 34
        # 15 an hour full time: 15 * 40 * 52 = 31,200.
        employment_income_before_lsr: 31_200
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: ELECTRICITY
        has_cooling_expense: true
        # 165 a month for heating and air conditioning.
        pre_subsidy_electricity_expense: 1_980
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # 31,200 / 15,960 = 195% of the guideline, over Texas's 150%.
    tx_ceap_eligible: false
    liheap_eligible: false

- name: Case 3, cooling eligibility alone makes a household eligible, with no payment where the state sets no amount.
  period: 2027
  absolute_error_margin: 0.01
  input:
    state_code: DE
    de_liheap_eligible: false
    de_liheap_cooling_eligible: true
  output:
    # Delaware pays cooling bills up to a maximum, with no fixed amount, so
    # the national total has nothing to add.
    liheap: 0
    liheap_eligible: true

- name: Case 4, Michigan's Home Heating Credit is not in the flag.
  period: 2027
  input:
    people:
      person1:
        age: 41
        # Part-time wages.
        employment_income_before_lsr: 9_000
    spm_units:
      spm_unit:
        members: [person1]
        heating_type: NATURAL_GAS
        has_cooling_expense: true
        # 85 a month for gas heat.
        gas_expense: 1_020
    households:
      household:
        members: [person1]
        state_code: MI
  output:
    # Michigan's regular heating help is a refundable tax credit, which the
    # list leaves out, and Michigan has no regular cooling payment.
    mi_standard_home_heating_credit_eligible: true
    liheap_eligible: false
