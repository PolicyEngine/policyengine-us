# CMS SHO #12-002 excludes DACA from the CHIPRA lawfully residing option.
# https://www.medicaid.gov/federal-policy-guidance/downloads/sho-12-002.pdf
- name: Case 7, standard pregnancy CHIP excludes only DACA and undocumented applicants; citizens, refugees and asylees remain covered.
  period: 2023
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: DACA
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person2:
        age: 30
        is_pregnant: true
        immigration_status: UNDOCUMENTED
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person3:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person4:
        age: 30
        is_pregnant: true
        immigration_status: REFUGEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person5:
        age: 30
        is_pregnant: true
        immigration_status: ASYLEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: CO
  output:
    is_chip_eligible_standard_pregnant_person: [false, false, true, true, true]

# Colorado elected the lawfully residing option for pregnant individuals in both
# Medicaid and CHIP; Missouri did not. Income of 230% FPL is above both states'
# Medicaid pregnancy limits (200% and 201%) and below their CHIP limits.
- name: Case 8, recent permanent resident pregnant applicant qualifies for standard CHIP in Colorado but not Missouri, where FCEP still applies.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        medicaid_income_level: 2.3
      person2:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        medicaid_income_level: 2.3
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: MO
  output:
    is_medicaid_eligible: [false, false]
    is_chip_eligible_standard_pregnant_person: [true, false]
    # FCEP covers the unborn child, so it has no immigration test; both states
    # offer it (Colorado since October 30, 2023).
    is_chip_fcep_eligible_person: [true, true]
    is_chip_eligible_pregnant: [true, true]

# Targeted low-income pregnant women stay eligible through the postpartum period
# (42 USC 1397ll(d)(2)(A)). Colorado had not yet elected the 12-month extension
# in 2021, so coverage ends at the model's 60-day postpartum limit. Income of
# 230% FPL is above Colorado's Medicaid pregnancy limit and below its CHIP
# pregnancy limit.
- name: Case 9, Colorado standard pregnancy CHIP covers 60 days postpartum before the 12-month extension.
  period: 2021
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_60_days_postpartum: true
        medicaid_income_level: 2.3
      person2:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        medicaid_income_level: 2.3
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: CO
  output:
    is_chip_eligible_standard_pregnant_person: [true, false]

# Virginia's FAMIS MOMS demonstration extends CHIP pregnancy coverage to 12
# months postpartum along with Medicaid (section 1115 approval of November 18,
# 2021, implemented July 1, 2022). Income of 180% FPL is above Virginia's
# Medicaid pregnancy limit (148%) and below its CHIP limit (205%).
- name: Case 10, Virginia standard pregnancy CHIP covers 12 months postpartum.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_60_days_postpartum: true
        medicaid_income_level: 1.8
      person2:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        medicaid_income_level: 1.8
      person3:
        age: 30
        is_pregnant: false
        medicaid_income_level: 1.8
    households:
      household1:
        members: [person1]
        state_code: VA
      household2:
        members: [person2]
        state_code: VA
      household3:
        members: [person3]
        state_code: VA
  output:
    is_chip_eligible_standard_pregnant_person: [true, true, false]

# The unborn-child (FCEP) option gets no 12-month extension (SHO 21-007, pages
# 2, 4 and 7), and its limited postpartum care is not modeled, so postpartum
# coverage continues through the standard pathway alone.
- name: Case 11, postpartum Colorado person keeps standard pregnancy CHIP but not FCEP.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_60_days_postpartum: true
        medicaid_income_level: 2.3
    households:
      household:
        members: [person1]
        state_code: CO
  output:
    is_chip_eligible_standard_pregnant_person: true
    is_chip_fcep_eligible_person: false
    chip_category: PREGNANT_STANDARD

# Medicaid covers the postpartum period up to its own pregnancy limit, so CHIP
# applies only above it. Virginia's Medicaid pregnancy limit is 148% FPL and
# its adult limit 138%; its CHIP limit is 205%.
- name: Case 12, Virginia postpartum person stays in Medicaid below its pregnancy limit and moves to CHIP above it.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        medicaid_income_level: 1.4
      person2:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        medicaid_income_level: 1.8
    households:
      household1:
        members: [person1]
        state_code: VA
      household2:
        members: [person2]
        state_code: VA
  output:
    medicaid_category: [PREGNANT, NONE]
    is_medicaid_eligible: [true, false]
    is_chip_eligible_standard_pregnant_person: [false, true]

# Missouri's 12-month extension took effect July 7, 2023 (CHIP SPA MO-23-0021).
# The annual model reads January 1, so the extension starts in 2024.
- name: Case 13, Missouri standard pregnancy CHIP does not yet cover 12 months postpartum in 2023.
  period: 2023
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        medicaid_income_level: 2.3
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_chip_eligible_standard_pregnant_person: false
