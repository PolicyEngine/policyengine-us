# CMS SHO #12-002 excludes DACA from the CHIPRA lawfully residing option.
# https://www.medicaid.gov/federal-policy-guidance/downloads/sho-12-002.pdf
- name: Case 7, standard pregnancy CHIP excludes only DACA and undocumented applicants; citizens, refugees and asylees remain covered.
  period: 2023
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: DACA
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person2:
        age: 30
        is_pregnant: true
        immigration_status: UNDOCUMENTED
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person3:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person4:
        age: 30
        is_pregnant: true
        immigration_status: REFUGEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
      person5:
        age: 30
        is_pregnant: true
        immigration_status: ASYLEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: CO
  output:
    is_chip_eligible_standard_pregnant_person: [false, false, true, true, true]

# Colorado elected the lawfully residing option for pregnant individuals in both
# Medicaid and CHIP; Missouri did not. Income of 230% FPL is above both states'
# Medicaid pregnancy limits (200% and 201%) and below their CHIP limits.
- name: Case 8, recent permanent resident pregnant applicant qualifies for standard CHIP in Colorado but not Missouri, where FCEP still applies.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        medicaid_income_level: 2.3
      person2:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        medicaid_income_level: 2.3
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: MO
  output:
    is_medicaid_eligible: [false, false]
    is_chip_eligible_standard_pregnant_person: [true, false]
    # FCEP covers the unborn child, so it has no immigration test; both states
    # offer it (Colorado since January 1, 2025).
    is_chip_fcep_eligible_person: [true, true]
    is_chip_eligible_pregnant: [true, true]

# The CHIP state plans have set these pregnancy bands since before 2018:
# Colorado 260% (CO-13-0015), New Jersey 200% (NJ-13-0018) and Rhode Island
# 253% (RI-13-023), each plus the 5 percentage point MAGI disregard.
# Kentucky's 213% band takes effect July 1, 2022 (KY-21-0001), and this
# YEAR-defined variable reads the January value, so Kentucky has no group in
# 2022.
- name: Case 9, pregnancy bands in Colorado, New Jersey and Rhode Island include the disregard in 2022, before Kentucky's group starts.
  period: 2022
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.63
      person2:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.03
      person3:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.55
      person4:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.1
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: NJ
      household3:
        members: [person3]
        state_code: RI
      household4:
        members: [person4]
        state_code: KY
  output:
    is_chip_eligible_standard_pregnant_person: [true, true, true, false]

# 907 KAR 4:030 Section 2(1)(e)1 sets 213% plus a five percent cushion (218%).
# The limit is inclusive, so income exactly at 218% FPL qualifies.
- name: Case 10, Kentucky pregnancy group covers income up to and including 218% FPL in 2023.
  period: 2023
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.1
      person2:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.25
      person3:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.18
    households:
      household1:
        members: [person1]
        state_code: KY
      household2:
        members: [person2]
        state_code: KY
      household3:
        members: [person3]
        state_code: KY
  output:
    is_chip_eligible_standard_pregnant_person: [true, false, true]

