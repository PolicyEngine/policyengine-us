- name: Pregnant woman eligible for standard CHIP
  period: 2023
  input:
    people:
      head:
        is_pregnant: True
        immigration_status: CITIZEN
        is_medicaid_eligible: False
        medicaid_income_level: 2.00
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        state_code: CO
        members: [head]
  output:
    is_chip_eligible_standard_pregnant_person: True

- name: Not pregnant
  period: 2023
  input:
    people:
      head:
        is_pregnant: False
        immigration_status: CITIZEN
        is_medicaid_eligible: False
        medicaid_income_level: 2.00
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        state_code: CO
        members: [head]
  output:
    is_chip_eligible_standard_pregnant_person: False

- name: Income too high for standard pregnant woman CHIP
  period: 2023
  input:
    people:
      head:
        is_pregnant: True
        immigration_status: CITIZEN
        is_medicaid_eligible: False
        medicaid_income_level: 3.00  # Above CO limit of 2.65
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        state_code: CO
        members: [head]
  output:
    is_chip_eligible_standard_pregnant_person: False

