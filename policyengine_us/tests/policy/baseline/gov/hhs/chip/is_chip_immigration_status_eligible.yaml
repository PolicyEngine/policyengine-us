# Separate CHIP covers citizens and qualified aliens who are exempt from or past
# the five-year bar (8 USC 1611(a) and 1613). The lawfully residing option
# reaches CHIP only where the state elected it in both CHIP and Medicaid
# (42 USC 1397gg(e)(1)(Q)). Arizona elected neither; Texas elected it for
# children; Colorado elected it for children and pregnant individuals.
- name: Case 1, citizen is eligible in a state without the option.
  period: 2025
  input:
    state_code: AZ
    immigration_status: CITIZEN
    age: 10
  output:
    is_chip_immigration_status_eligible: true

- name: Case 2, Arizona permanent resident child becomes eligible when the five-year bar ends.
  period: 2025
  input:
    people:
      person1:
        age: 10
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 4
      person2:
        age: 10
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 5
    households:
      household1:
        members: [person1]
        state_code: AZ
      household2:
        members: [person2]
        state_code: AZ
  output:
    is_chip_immigration_status_eligible: [false, true]

- name: Case 2b, Arizona permanent resident child without years_since_us_entry is inside the five-year bar.
  period: 2025
  input:
    state_code: AZ
    age: 10
    immigration_status: LEGAL_PERMANENT_RESIDENT
    # years_since_us_entry is omitted, so its default of 0 applies.
  output:
    is_chip_immigration_status_eligible: false

- name: Case 3, Texas option covers recent permanent resident children under 19 only.
  period: 2025
  input:
    people:
      person1:
        age: 18
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 19
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: TX
      household2:
        members: [person2]
        state_code: TX
  output:
    is_chip_immigration_status_eligible: [true, false]

- name: Case 4, pregnancy option applies in Colorado but not Texas.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: TX
  output:
    is_chip_immigration_status_eligible: [true, false]

- name: Case 5, DACA and undocumented children are excluded even where the state elected the option.
  period: 2025
  input:
    people:
      person1:
        age: 10
        immigration_status: DACA
      person2:
        age: 10
        immigration_status: UNDOCUMENTED
      person3:
        age: 10
        immigration_status: TPS
    households:
      household1:
        members: [person1]
        state_code: TX
      household2:
        members: [person2]
        state_code: TX
      household3:
        members: [person3]
        state_code: TX
  output:
    is_chip_immigration_status_eligible: [false, false, true]

- name: Case 6, refugee child in Arizona remains bar-exempt in 2026 annual simulations.
  period: 2026
  input:
    state_code: AZ
    immigration_status: REFUGEE
    age: 10
  output:
    is_chip_immigration_status_eligible: true

# Section 71109 limits federal CHIP funding to citizens, permanent residents and
# Cuban and Haitian entrants from October 1, 2026, except under the option.
- name: Case 7, after section 71109 only permanent residents, Cuban and Haitian entrants and option groups remain eligible.
  period: 2027
  input:
    people:
      person1:
        age: 10
        immigration_status: REFUGEE
      person2:
        age: 10
        immigration_status: REFUGEE
      person3:
        age: 10
        immigration_status: CUBAN_HAITIAN_ENTRANT
      person4:
        age: 10
        immigration_status: LEGAL_PERMANENT_RESIDENT
        # Past the five-year bar; this case checks the eligible status list.
        years_since_us_entry: 5
    households:
      household1:
        members: [person1]
        state_code: AZ
      household2:
        members: [person2]
        state_code: TX
      household3:
        members: [person3]
        state_code: AZ
      household4:
        members: [person4]
        state_code: AZ
  output:
    is_chip_immigration_status_eligible: [false, true, true, true]

- name: Case 8, CHIP elections before they apply in Georgia, Kentucky and Rhode Island.
  period: 2022
  input:
    people:
      person1:
        age: 10
        is_pregnant: false
        immigration_status: TPS
      person2:
        age: 30
        is_pregnant: true
        immigration_status: TPS
      person3:
        age: 30
        is_pregnant: true
        immigration_status: TPS
    households:
      household1:
        members: [person1]
        state_code: GA
      household2:
        members: [person2]
        state_code: KY
      household3:
        members: [person3]
        state_code: RI
  output:
    is_chip_immigration_status_eligible: [false, false, false]

# Rhode Island's Medicaid and CHIP pregnancy elections took effect on October 1,
# 2022 (SPAs RI-22-0024 and RI-22-0025), so they first apply in 2023.
- name: Case 9, Kentucky and Rhode Island CHIP pregnancy elections apply in 2023.
  period: 2023
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: TPS
      person2:
        age: 30
        is_pregnant: true
        immigration_status: TPS
      person3:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: KY
      household2:
        members: [person2]
        state_code: RI
      household3:
        members: [person3]
        state_code: RI
  output:
    is_chip_immigration_status_eligible: [true, true, true]

- name: Case 10, Georgia children and Rhode Island pregnancy CHIP elections apply in 2024.
  period: 2024
  input:
    people:
      person1:
        age: 10
        is_pregnant: false
        immigration_status: TPS
      person2:
        age: 30
        is_pregnant: true
        immigration_status: TPS
    households:
      household1:
        members: [person1]
        state_code: GA
      household2:
        members: [person2]
        state_code: RI
  output:
    is_chip_immigration_status_eligible: [true, true]

# Illinois covered lawfully residing children in its separate CHIP until that
# program ended for children on July 1, 2022; CMS now lists them under
# Medicaid-expansion CHIP.
- name: Case 11, Illinois separate CHIP election applies in 2022 annual simulations.
  period: 2022
  input:
    state_code: IL
    immigration_status: TPS
    age: 10
  output:
    is_chip_immigration_status_eligible: true

- name: Case 12, Illinois separate CHIP election no longer applies in 2023.
  period: 2023
  input:
    state_code: IL
    immigration_status: TPS
    age: 10
  output:
    is_chip_immigration_status_eligible: false

- name: Case 13, CHIP option requires the matching Medicaid election.
  period: 2025
  input:
    gov.hhs.medicaid.eligibility.lawfully_residing.child.TX: false
    state_code: TX
    immigration_status: TPS
    age: 10
  output:
    is_chip_immigration_status_eligible: false

# From October 1, 2026, 42 USC 1397gg(e)(1)(R) applies the 1396b(v)(5) limit to
# CHIP, which ends federal CHIP funding for asylees, people granted withholding
# of deportation, parolees and conditional entrants outside the option (SHO
# #26-001 Appendix A). Arizona elected neither option. Asylees and people granted
# withholding are exempt from the five-year bar, and the parolee and conditional
# entrant state five years since entry to clear it, so only the status limit
# applies.
- name: Case 14, after section 71109 asylees, withheld deportations, parolees and conditional entrants lose CHIP in Arizona.
  period: 2027
  input:
    people:
      person1:
        age: 10
        immigration_status: ASYLEE
      person2:
        age: 10
        immigration_status: DEPORTATION_WITHHELD
      person3:
        age: 10
        immigration_status: PAROLED_ONE_YEAR
        years_since_us_entry: 5
      person4:
        age: 10
        immigration_status: CONDITIONAL_ENTRANT
        years_since_us_entry: 5
    households:
      household1:
        members: [person1]
        state_code: AZ
      household2:
        members: [person2]
        state_code: AZ
      household3:
        members: [person3]
        state_code: AZ
      household4:
        members: [person4]
        state_code: AZ
  output:
    is_chip_immigration_status_eligible: [false, false, false, false]

# Lawfully residing pregnant people covered under the option keep it through
# the extended postpartum period (SHO 21-007 Q11). Virginia elected the option
# in Medicaid and CHIP, and its FAMIS MOMS demonstration covers them for 12
# months postpartum (implemented July 1, 2022).
- name: Case 15, Virginia pregnancy option covers a recent permanent resident 12 months postpartum.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 30
        is_pregnant: false
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: VA
      household2:
        members: [person2]
        state_code: VA
  output:
    is_chip_immigration_status_eligible: [true, false]

# The 12-month extension reaches lawfully residing pregnant people only in a
# state that has also elected it (SHO 21-007 Q11). Colorado's 12-month
# extension took effect July 1, 2022 (CHIP SPA CO-22-0039); the annual model
# reads January 1, so 2022 still uses the 60-day period.
- name: Case 16, Colorado pregnancy option covers a recent permanent resident 60 days postpartum, not 12 months, in 2022.
  period: 2022
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        under_60_days_postpartum: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 30
        is_pregnant: false
        under_12_months_postpartum: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: CO
      household2:
        members: [person2]
        state_code: CO
  output:
    is_chip_immigration_status_eligible: [true, false]
