# Missouri applies the CHIP 75 limit (300% FPL plus the 5% disregard) as the
# Appendix A monthly-dollar maximum, rounded up to the next whole dollar:
# household of 2 in 2026, 21,640 x 3.05 / 12 = 5,500.17 -> $5,501.
- name: MO child at exactly the $5,501 CHIP 75 maximum is CHIP-eligible although the exact ratio is 3.0505
  period: 2026
  input:
    people:
      head:
        age: 30
        employment_income: 66_012
      child:
        age: 8
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: MO
  output:
    is_medicaid_eligible: [false, false]
    is_chip_eligible_child: [false, true]

- name: MO child $1 above the $5,501 CHIP 75 maximum is not CHIP-eligible
  period: 2026
  input:
    people:
      head:
        age: 30
        employment_income: 66_024
      child:
        age: 8
        immigration_status: CITIZEN
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: MO
  output:
    is_chip_eligible_child: [false, false]

# CMS SHO #12-002 excludes DACA from the CHIPRA lawfully residing option.
# https://www.medicaid.gov/federal-policy-guidance/downloads/sho-12-002.pdf
- name: Case 15, CHIP excludes only DACA and undocumented children; citizens, refugees and asylees remain covered.
  period: 2023
  input:
    people:
      person1:
        age: 17
        immigration_status: DACA
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
        has_chip_disqualifying_health_coverage: false
      person2:
        age: 17
        immigration_status: UNDOCUMENTED
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
        has_chip_disqualifying_health_coverage: false
      person3:
        age: 17
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
        has_chip_disqualifying_health_coverage: false
      person4:
        age: 17
        immigration_status: REFUGEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
        has_chip_disqualifying_health_coverage: false
      person5:
        age: 17
        immigration_status: ASYLEE
        is_medicaid_eligible: false
        medicaid_income_level: 2.0
        has_chip_disqualifying_health_coverage: false
    households:
      household:
        members: [person1, person2, person3, person4, person5]
        state_code: TX
  output:
    is_chip_eligible_child: [false, false, true, true, true]
    chip_category: [NONE, NONE, CHILD, CHILD, CHILD]
    is_chip_eligible: [false, false, true, true, true]

