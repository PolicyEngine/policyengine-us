# Separate CHIP applies the five-year bar and the qualified-alien limit (8 USC
# 1611(a) and 1613) unless the state elected the lawfully residing option in both
# CHIP and Medicaid (42 USC 1397gg(e)(1)(Q)). Arizona did not elect it; Texas did.
- name: Case 17, recent permanent resident child in Arizona fails CHIP inside the five-year bar and qualifies after it.
  period: 2025
  input:
    people:
      person1:
        age: 10
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
        medicaid_income_level: 2.0
      person2:
        age: 10
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 5
        medicaid_income_level: 2.0
    households:
      household1:
        members: [person1]
        state_code: AZ
      household2:
        members: [person2]
        state_code: AZ
  output:
    is_medicaid_eligible: [false, false]
    is_chip_eligible_child: [false, true]

