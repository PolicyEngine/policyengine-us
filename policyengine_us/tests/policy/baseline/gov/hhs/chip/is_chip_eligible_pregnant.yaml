- name: Pregnant woman eligible for CHIP through standard pathway
  period: 2023
  input:
    people:
      head:
        is_chip_eligible_standard_pregnant_person: True
        is_chip_fcep_eligible_person: False
  output:
    is_chip_eligible_pregnant: True

- name: Pregnant woman eligible for CHIP through FCEP pathway
  period: 2023
  input:
    people:
      head:
        is_chip_eligible_standard_pregnant_person: False
        is_chip_fcep_eligible_person: True
  output:
    is_chip_eligible_pregnant: True

- name: Pregnant woman eligible for CHIP through both pathways
  period: 2023
  input:
    people:
      head:
        is_chip_eligible_standard_pregnant_person: True
        is_chip_fcep_eligible_person: True
  output:
    is_chip_eligible_pregnant: True

- name: Not eligible for CHIP through either pathway
  period: 2023
  input:
    people:
      head:
        is_chip_eligible_standard_pregnant_person: False
        is_chip_fcep_eligible_person: False
  output:
    is_chip_eligible_pregnant: False

- name: Case 1, pregnant woman with employer coverage is not eligible for standard pregnancy CHIP.
  period: 2026
  input:
    people:
      head:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        is_medicaid_eligible: false
        medicaid_income_level: 2
        has_esi: true
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NJ
  output:
    # New Jersey covers pregnant women up to 205% FPL through CHIP and has no
    # FCEP option, but a targeted low-income pregnant woman must be uninsured
    # (42 USC 1397ll(d)(2)(C)).
    is_chip_eligible_standard_pregnant_person: false
    is_chip_fcep_eligible_person: false
    is_chip_eligible_pregnant: false
