- name: Fill a missing singleton premium with 1 and retain unrelated household indices.
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      person1:
        age: 40
      person2:
        age: 40
      person3:
        age: 40
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
      tax_unit3:
        members: [person3]
    households:
      # Missing SLCSP premium data gives a zero index and a household fallback of 1.
      household1:
        members: [person1]
        state_code: TX
        slcsp_age_0:
          2026-01: 0
      household2:
        members: [person2]
        state_code: TX
        slcsp_age_0:
          2026-01: 1_000
      household3:
        members: [person3]
        state_code: TX
        slcsp_age_0:
          2026-01: 2_000
  output:
    # No positive index gives person1 a fallback of 1.
    # Retain 1,000 * 1.6706 = 1,670.6 and 2,000 * 1.6706 = 3,341.2 for the peers.
    medicaid_slcsp_cost_index_filled: [1, 1_670.6, 3_341.2]
