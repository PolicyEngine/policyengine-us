- name: Single household scales state enrollment by the state-average index.
  period: 2026
  absolute_error_margin: 1_000
  input:
    people:
      person1:
        age: 40
    households:
      household:
        members: [person1]
        state_code: TX
        slcsp_age_0:
          2026-01: 1_000
  output:
    # TX January 2024 enrollment (4,295,157) x the household's index (1,670.6).
    # Main had 6,980,976,640 from October 2024 enrollment (4,178,724).
    medicaid_slcsp_state_denominator: 7_175_489_284

- name: Missing premium falls back to a unit index, so the denominator stays positive.
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 40
    households:
      household:
        members: [person1]
        state_code: TX
        slcsp_age_0:
          2026-01: 0
  output:
    # No positive index -> state average falls back to 1, so denominator = TX enrollment.
    # January 2024 (4,295,157); main had October 2024 (4,178,724).
    medicaid_slcsp_state_denominator: 4_295_157
