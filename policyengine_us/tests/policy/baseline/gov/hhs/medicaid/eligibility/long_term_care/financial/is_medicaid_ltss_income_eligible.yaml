- name: Washington monthly source reports preserve other applicants annual defaults
  period: 2026-07
  input:
    people:
      reported:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          '2026': true
        medicaid_ltss_non_delaware_assistance_unit_size: 1
        taxable_pension_income:
          '2026': 34800
        taxable_interest_income:
          '2026': 1200
        ordinary_dividend_income:
          '2026': 1200
        medicaid_ltss_reported_gross_unearned_income: 3000
        medicaid_ltss_reported_interest_income: 50
        medicaid_ltss_reported_dividend_income: 50
      annual_defaults:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          '2026': true
        medicaid_ltss_non_delaware_assistance_unit_size: 1
        taxable_pension_income:
          '2026': 34800
        taxable_interest_income:
          '2026': 1200
        ordinary_dividend_income:
          '2026': 1200
    marital_units:
      reported:
        members: [reported]
      annual_defaults:
        members: [annual_defaults]
    households:
      household:
        members: [reported, annual_defaults]
        state_code:
          '2026': WA
  output:
    medicaid_ltss_gross_unearned_income: [3000, 3100]
    medicaid_ltss_interest_income: [50, 100]
    medicaid_ltss_dividend_income: [50, 100]
    medicaid_ltss_countable_income: [2900, 2900]
    medicaid_ltss_financial_pathway: [SPECIAL_INCOME, SPECIAL_INCOME]
    is_medicaid_ltss_income_eligible: [true, true]


- name: Delaware derives work expenses from payment facts and the allocation election
  period: 2026-07
  input:
    people:
      elected_allocation:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 5455
          2026-07: 5455
        # The durable item is paid for in June; there is no July payment.
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 4800
        medicaid_ltss_irwe_allocate_over_12_months:
          2026-06: true
        medicaid_ltss_irwe_working_when_paid:
          2026-06: true
      no_allocation_election:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 5455
          2026-07: 5455
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 4800
        medicaid_ltss_irwe_working_when_paid:
          2026-06: true
      full_payment_in_current_month:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income: 5455
        medicaid_ltss_irwe_nonrecurring_payment: 4800
        medicaid_ltss_irwe_working_when_paid: true
      net_both_payment_sources:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 5455
          2026-07: 5455
        medicaid_ltss_irwe_monthly_payments: 600
        medicaid_ltss_irwe_monthly_reimbursements: 100
        medicaid_ltss_irwe_monthly_business_expenses: 100
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 6000
        medicaid_ltss_irwe_nonrecurring_reimbursement:
          2026-06: 600
        medicaid_ltss_irwe_nonrecurring_business_expenses:
          2026-06: 600
        medicaid_ltss_irwe_allocate_over_12_months:
          2026-06: true
        medicaid_ltss_irwe_working_when_paid:
          2026-06: true
          2026-07: true
      fully_reimbursed:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 5455
          2026-07: 5455
        medicaid_ltss_irwe_monthly_payments: 400
        medicaid_ltss_irwe_monthly_reimbursements: 400
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 4800
        # Reimbursement cannot create a negative allowable expense.
        medicaid_ltss_irwe_nonrecurring_reimbursement:
          2026-06: 5000
        medicaid_ltss_irwe_allocate_over_12_months:
          2026-06: true
        medicaid_ltss_irwe_working_when_paid:
          2026-06: true
          2026-07: true
      not_working_when_paid:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 5455
          2026-07: 5455
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 4800
        medicaid_ltss_irwe_allocate_over_12_months:
          2026-06: true
        medicaid_ltss_irwe_working_when_paid:
          2026-06: false
      no_earnings_received_when_paid:
        age:
          2026: 60
        meets_ssi_disability_criteria:
          2026: true
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_setting: INSTITUTIONAL
        medicaid_ltss_reported_gross_earned_income:
          2026-06: 0
          2026-07: 5455
        medicaid_ltss_irwe_nonrecurring_payment:
          2026-06: 4800
        medicaid_ltss_irwe_allocate_over_12_months:
          2026-06: true
        medicaid_ltss_irwe_working_when_paid:
          2026-06: true
    marital_units:
      elected_allocation:
        members: [elected_allocation]
      no_allocation_election:
        members: [no_allocation_election]
      full_payment_in_current_month:
        members: [full_payment_in_current_month]
      net_both_payment_sources:
        members: [net_both_payment_sources]
      fully_reimbursed:
        members: [fully_reimbursed]
      not_working_when_paid:
        members: [not_working_when_paid]
      no_earnings_received_when_paid:
        members: [no_earnings_received_when_paid]
    households:
      household:
        members: [elected_allocation, no_allocation_election, full_payment_in_current_month,
          net_both_payment_sources, fully_reimbursed, not_working_when_paid,
          no_earnings_received_when_paid]
        state_code:
          2026: DE
  output:
    medicaid_ltss_impairment_related_work_expenses: [400, 0, 4800, 800, 0, 0, 0]
    # The elected June purchase gives (5,455 - 20 - 65 - 400) / 2 = 2,485.
    # The same purchase without an election leaves July's income at 2,685.
    medicaid_ltss_countable_income: [2485, 2685, 285, 2285, 2685, 2685, 2685]
    is_medicaid_ltss_income_eligible: [true, false, true, true, false, false, false]


