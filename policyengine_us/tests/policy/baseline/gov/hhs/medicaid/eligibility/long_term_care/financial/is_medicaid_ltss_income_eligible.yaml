- name: Case 43, Delaware budgets reuse the SSI general earned and excluded-share parameters.
  period: 2026-07
  input:
    gov.ssa.ssi.income.exclusions.general: 25
    gov.ssa.ssi.income.exclusions.earned: 75
    gov.ssa.ssi.income.exclusions.earned_share: 0.75
    people:
      earned_only:
        medicaid_ltss_reported_gross_earned_income: 5055
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled: {2026: true}
      mixed:
        medicaid_ltss_reported_gross_earned_income: 1000
        medicaid_ltss_reported_gross_unearned_income: 20
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled: {2026: true}
    marital_units:
      earned_only:
        members: [earned_only]
      mixed:
        members: [mixed]
    households:
      household:
        members: [earned_only, mixed]
        state_code: {2026: DE}
  output:
    # (5,055 - 25 - 75) x (1 - 0.75) = 1,238.75.
    # The 20 unearned uses 20 of the 25 general disregard, leaving 5:
    # (1,000 - 5 - 75) x 0.25 = 230.
    medicaid_ltss_individual_countable_income: [1238.75, 230]
    is_medicaid_ltss_income_eligible: [true, true]


