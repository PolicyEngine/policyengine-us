# G-6120: $2,982 + $2,982 = $5,964 is a valid couple budget. Adding
# $1 gives $5,965, so individual $2,983/$2,982 budgets fail/pass. The
# $5,000 + $1,500 = $6,500 couple also falls back to fail/pass. Resources
# $1,500.50 + $1,500.50 = $3,001 exceed the $3,000 couple limit, so each
# $1,500.50 individual inventory passes the $2,000 limit after fallback.


