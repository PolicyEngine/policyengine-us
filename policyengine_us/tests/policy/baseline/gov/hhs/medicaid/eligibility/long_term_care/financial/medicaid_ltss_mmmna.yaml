- name: Case 1, Texas pays the federal maximum flat regardless of shelter expenses.
  period: 2026-07
  absolute_error_margin: 0.01
  input:
    people:
      no_shelter:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
        medicaid_ltss_assistance_unit_size: 1
        medicaid_ltss_has_community_spouse: true
        medicaid_ltss_community_spouse_shelter_expenses: 0
      at_shelter_threshold:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
        medicaid_ltss_assistance_unit_size: 1
        medicaid_ltss_has_community_spouse: true
        medicaid_ltss_community_spouse_shelter_expenses: 811.5
      high_shelter:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
        medicaid_ltss_assistance_unit_size: 1
        medicaid_ltss_has_community_spouse: true
        medicaid_ltss_community_spouse_shelter_expenses: 2_173
    tax_units:
      no_shelter:
        members: [no_shelter]
      at_shelter_threshold:
        members: [at_shelter_threshold]
      high_shelter:
        members: [high_shelter]
    marital_units:
      no_shelter:
        members: [no_shelter]
      at_shelter_threshold:
        members: [at_shelter_threshold]
      high_shelter:
        members: [high_shelter]
    spm_units:
      no_shelter:
        members: [no_shelter]
      at_shelter_threshold:
        members: [at_shelter_threshold]
      high_shelter:
        members: [high_shelter]
    households:
      no_shelter:
        members: [no_shelter]
        state_code:
          2026: TX
      at_shelter_threshold:
        members: [at_shelter_threshold]
        state_code:
          2026: TX
      high_shelter:
        members: [high_shelter]
        state_code:
          2026: TX
  output:
    medicaid_ltss_mmmna: [4_066.5, 4_066.5, 4_066.5]

