- name: Child under 6 and FPL limit, eligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.65
  output:
    is_young_child_for_medicaid: true

- name: Child under 6 but not FPL limit, ineligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.66
  output:
    is_young_child_for_medicaid: false

- name: Child over 6, ineligible in CA
  period: 2022
  input:
    age: 6
  output:
    is_young_child_for_medicaid: false

- name: MO child at 152% FPL, within the 148% base plus 5% disregard, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.52
    state_code: MO
  output:
    is_young_child_for_medicaid: true

- name: MO child at 154% FPL, above the 153% effective standard, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.54
    state_code: MO
  output:
    is_young_child_for_medicaid: false
