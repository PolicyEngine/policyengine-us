- name: Child under 6 and FPL limit, eligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.65
  output:
    is_young_child_for_medicaid: true

- name: Child under 6 at the inclusive FPL limit, eligible in CA
  period: 2022
  input:
    age: 3
    medicaid_income_level: 2.66
  output:
    is_young_child_for_medicaid: true

- name: Child over 6, ineligible in CA
  period: 2022
  input:
    age: 6
  output:
    is_young_child_for_medicaid: false

- name: MO child at 152% FPL, within the 148% base plus 5% disregard, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.52
    state_code: MO
  output:
    is_young_child_for_medicaid: true

# The published monthly ceiling includes income exactly at 153% FPL.
- name: MO child at exactly 153% FPL, the income maximum, eligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.53
    state_code: MO
  output:
    is_young_child_for_medicaid: true

- name: MO child at 154% FPL, above the 153% effective standard, ineligible
  period: 2026
  input:
    age: 3
    medicaid_income_level: 1.54
    state_code: MO
  output:
    is_young_child_for_medicaid: false

# Missouri applies the MHK ages 1-18 limit (148% FPL plus the 5% disregard)
# as the Appendix A monthly-dollar maximum, rounded up to the next whole
# dollar: household of 2 in 2026, 21,640 x 1.53 / 12 = 2,759.10 -> $2,760.
- name: MO child at exactly the Appendix A $2,760 monthly maximum, eligible although the exact ratio is 1.5305
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 33_120
      person2:
        age: 3
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    is_young_child_for_medicaid: [false, true]

- name: MO child $1 above the Appendix A monthly maximum ($2,761), ineligible
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 33_132
      person2:
        age: 3
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    is_young_child_for_medicaid: [false, false]
