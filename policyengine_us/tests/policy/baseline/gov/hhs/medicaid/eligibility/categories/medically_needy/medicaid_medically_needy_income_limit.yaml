- name: Case 1, Connecticut couple and individual dollar limits from 2023 to 2027.
  period: 2027
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
      person2:
        age: 68
      person3:
        age: 74
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: {2023: CT, 2024: CT, 2025: CT, 2026: CT, 2027: CT}
  output:
    # Outputs are [couple, couple, individual]. The annual variable reads the
    # amount in force on January 1, times 12: 2023 879 / 653 (2022-07-01);
    # 2024 946 / 700 (2024-01-01); 2025 980 / 723 (2024-03-01);
    # 2026 1,128 / 835 (2025-03-01); 2027 1,153 / 851 (2026-03-01).
    medicaid_medically_needy_income_limit:
      2023: [10_548, 10_548, 7_836]
      2024: [11_352, 11_352, 8_400]
      2025: [11_760, 11_760, 8_676]
      2026: [13_536, 13_536, 10_020]
      2027: [13_836, 13_836, 10_212]

