# 12 x 1,836 = 22,032 for one and 12 x 2,489 = 29,868 for two.
- name: Case 1, New York follows SSI's rule, so a spouse with no income leaves the applicant alone.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
      person2:
        is_tax_unit_spouse: true
        age: 50
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: NY
  output:
    medicaid_medically_needy_uses_couple_standard: [false, true]
    medicaid_medically_needy_income_limit: [22_032, 29_868]


