- name: low income, eligible for Medicaid
  period: 2022
  input:
    medicaid_optional_senior_or_disabled_countable_income: 600
    state_code: CT
  output:
    is_optional_senior_or_disabled_income_eligible: true

- name: high income, ineligible for Medicaid
  period: 2022
  input:
    medicaid_optional_senior_or_disabled_countable_income: 1_000_000
    state_code: FL
  output:
    is_optional_senior_or_disabled_income_eligible: false
    

- name: Joint filers over Connecticut's couple limit are ineligible.
  period: 2022
  input:
    people:
      person1:
        medicaid_optional_senior_or_disabled_countable_income: 9_000
      person2:
        medicaid_optional_senior_or_disabled_countable_income: 9_000
    households:
      household:
        members: [person1, person2]
        state_code: CT
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_income_eligible: [false, false]

- name: Joint filers under Connecticut's couple limit are eligible.
  period: 2022
  input:
    people:
      person1:
        medicaid_optional_senior_or_disabled_countable_income: 6_700
      person2:
        medicaid_optional_senior_or_disabled_countable_income: 6_700
    households:
      household:
        members: [person1, person2]
        state_code: CT
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_income_eligible: [true, true]

- name: Earned income below Connecticut's 2025 limit is eligible.
  period: 2025
  input:
    age: 70
    employment_income: 20_000
    state_code: CT
  output:
    is_optional_senior_or_disabled_income_eligible: true

- name: Earned income over Connecticut's 2025 limit is ineligible.
  period: 2025
  input:
    age: 70
    employment_income: 34_000
    state_code: CT
  output:
    is_optional_senior_or_disabled_income_eligible: false

# Issue #9125: Missouri MHABD applies an 85% FPL non-spend-down standard to
# old-age and disability-based eligibility but a 100% FPL standard to
# blindness-based eligibility (DSS Manual § 0805.015.45).
- name: Missouri blind applicant between 85% and 100% FPL is income-eligible
  period: 2025
  input:
    people:
      person1:
        is_blind: true
        medicaid_optional_senior_or_disabled_countable_income: 13_500
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_fpg: 15_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_optional_senior_or_disabled_income_eligible: [true]

- name: Missouri non-blind applicant with the same income fails the 85% standard
  period: 2025
  input:
    people:
      person1:
        medicaid_optional_senior_or_disabled_countable_income: 13_500
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_fpg: 15_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_optional_senior_or_disabled_income_eligible: [false]

- name: Missouri blind applicant above 100% FPL is ineligible
  period: 2025
  input:
    people:
      person1:
        is_blind: true
        medicaid_optional_senior_or_disabled_countable_income: 15_100
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_fpg: 15_000
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_optional_senior_or_disabled_income_eligible: [false]
