# New Jersey's approved state plan S25 (NJ-13-0011-MM1) elects the
# 42 CFR 435.4 paragraph (3) option counting any adult who lives with a
# dependent child and assumes primary responsibility for the child's care
# as a caretaker relative, and the 18-year-old full-time student option.
# The Missouri counterparts, where foster children stay excluded, are in
# ../is_parent_for_medicaid.yaml.

# Issue 10775: a Household API partner reported this household (an adult
# with $3,600 of employment income caring for a child in foster care) in
# New Jersey for 2026; the adult got the adult group, not the parent and
# caretaker relative group.
- name: Case 1, New Jersey counts an unrelated adult caring for a foster child as a caretaker.
  period: 2026
  input:
    people:
      foster_parent:
        age: 40
        is_tax_unit_head: true
        employment_income: 3_600
      foster_child:
        age: 8
        is_tax_unit_dependent: true
        is_in_foster_care: true
    tax_units:
      tax_unit:
        members: [foster_parent, foster_child]
    households:
      household:
        members: [foster_parent, foster_child]
        state_code: NJ
  output:
    is_parent_for_medicaid_nfc: [true, false]

# A grandmother is a caretaker relative by blood under 42 CFR 435.4 in
# every state; in New Jersey the any-adult election also lifts the foster
# exclusion that reaches her in Missouri. Part-time work: 20 hours a week
# at New Jersey's 2026 minimum wage of $15.92 (20 x 52 x 15.92).
- name: Case 2, New Jersey counts a grandmother fostering her grandchild as a caretaker.
  period: 2026
  input:
    people:
      grandmother:
        age: 60
        is_tax_unit_head: true
        employment_income: 16_556.8
      grandchild:
        age: 8
        is_tax_unit_dependent: true
        is_in_foster_care: true
    tax_units:
      tax_unit:
        members: [grandmother, grandchild]
    households:
      household:
        members: [grandmother, grandchild]
        state_code: NJ
  output:
    is_parent_for_medicaid_nfc: [true, false]

# An 18-year-old high school senior attending full time. Full-time work at
# New Jersey's 2026 minimum wage of $15.92 (2,080 x 15.92).
- name: Case 3, New Jersey counts an 18-year-old full-time student as a dependent child.
  period: 2026
  input:
    people:
      parent:
        age: 45
        is_tax_unit_head: true
        employment_income: 33_113.6
      student:
        age: 18
        is_tax_unit_dependent: true
        is_full_time_student: true
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: NJ
  output:
    is_parent_for_medicaid_nfc: [true, false]
