# Texas Works Handbook C-131.2, revision 15-4 effective October 1, 2015:
# https://fhb.hhs.texas.gov/handbooks/texas-works-handbook/c-130-medical-programs
# One-parent base: size 2 $196/month, size 3 $230/month. Add five points
# of the annual FPG once (A-1341); convert wages to months (A-1353).
# HHS first/additional-person series:
# https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines/prior-hhs-poverty-guidelines-federal-register-references
# Each safe inside income is floor(base + FPG/240); each safe outside income
# is ceil(base + FPG/240) + $1. These avoid Texas's unresolved cents band.
# The existing generic monthly ceiling remains an explicit model convention;
# these tests do not certify exact-cent or March FPG adoption behavior.
# Independent annual examples hold age/relationships constant and represent
# new applicants, without injecting financial/category/enrollment flags.
# Parent financial-criteria assertions address the adult applicant; the full
# household assertions below separately check child eligibility and enrollment.
