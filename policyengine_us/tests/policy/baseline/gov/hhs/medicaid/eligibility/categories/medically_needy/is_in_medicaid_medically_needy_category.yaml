- name: Senior in MA is in a medically needy category
  period: 2022
  input:
    age: 66
    state_code: MA
  output:
    is_in_medicaid_medically_needy_category: true

- name: Childless adult in MA is not in a medically needy category
  period: 2022
  input:
    age: 30
    state_code: MA
  output:
    is_in_medicaid_medically_needy_category: false

- name: Disabled adults in Arkansas, Iowa, Illinois, North Dakota and New Jersey are in a medically needy category.
  period: 2026
  input:
    people:
      person1:
        age: 50
        meets_ssi_disability_criteria: true
      person2:
        age: 50
        meets_ssi_disability_criteria: true
      person3:
        age: 50
        meets_ssi_disability_criteria: true
      person4:
        age: 50
        meets_ssi_disability_criteria: true
      person5:
        age: 50
        meets_ssi_disability_criteria: true
    households:
      household1:
        members: [person1]
        state_code: AR
      household2:
        members: [person2]
        state_code: IA
      household3:
        members: [person3]
        state_code: IL
      household4:
        members: [person4]
        state_code: ND
      household5:
        members: [person5]
        state_code: NJ
  output:
    # Iowa 441-75.8(2)"c" (SSI-related persons), the NJ fact sheet (blind or
    # disabled), NDAC 75-02-02.1-26(1) (aged, blind and disabled groups), the
    # AR AABD spend down and IL PM 15-06-02-c cover disabled people.
    is_in_medicaid_medically_needy_category: [true, true, true, true, true]

- name: Senior and disabled adult in Arizona, which has no medically needy pathway for them, are not in a medically needy category.
  period: 2026
  input:
    people:
      person1:
        age: 70
      person2:
        age: 40
        meets_ssi_disability_criteria: true
    households:
      household:
        members: [person1, person2]
        state_code: AZ
  output:
    # KFF 2026 lists no medically needy pathway for older adults or people
    # with disabilities in Arizona (likewise ID, IN, NM and NV).
    is_in_medicaid_medically_needy_category: [false, false]
