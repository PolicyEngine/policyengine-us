- name: Senior in MA is in a medically needy category
  period: 2022
  input:
    age: 66
    state_code: MA
  output:
    is_in_medicaid_medically_needy_category: true

- name: Childless adult in MA is not in a medically needy category
  period: 2022
  input:
    age: 30
    state_code: MA
  output:
    is_in_medicaid_medically_needy_category: false

- name: Case 1, blind adult under 65 who is not SSI-disabled is in the medically needy disabled group.
  period: 2026
  input:
    age: 40
    is_blind: true
    state_code: MA
  output:
    is_in_medicaid_medically_needy_category: true

- name: Case 2, blind adult is not in a medically needy category in a state without the disabled group.
  period: 2026
  input:
    age: 40
    is_blind: true
    state_code: TX
  output:
    is_in_medicaid_medically_needy_category: false
