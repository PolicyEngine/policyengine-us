# 42 USC 1396b(v)(4)(A): states may cover lawfully residing children (California
# under 21, Texas under 19) and pregnant individuals without the five-year bar.
# State elections follow the CMS list updated April 2, 2026.
- name: Case 1, recent permanent resident child in California qualifies through the option.
  period: 2025
  input:
    state_code: CA
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 10
    years_since_us_entry: 2
  output:
    is_medicaid_lawfully_residing_option_eligible: true

- name: Case 2, child age limits are 21 in California and 19 in Texas.
  period: 2025
  input:
    people:
      person1:
        age: 20
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 20
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person3:
        age: 18
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: CA
      household2:
        members: [person2]
        state_code: TX
      household3:
        members: [person3]
        state_code: TX
  output:
    is_medicaid_lawfully_residing_option_eligible: [true, false, true]

- name: Case 3, Wyoming elected the option only for pregnant individuals and Texas only for children.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 30
        is_pregnant: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person3:
        age: 10
        is_pregnant: false
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: TX
      household2:
        members: [person2]
        state_code: WY
      household3:
        members: [person3]
        state_code: WY
  output:
    is_medicaid_lawfully_residing_option_eligible: [false, true, false]

- name: Case 4, Alabama has not elected the option.
  period: 2025
  input:
    state_code: AL
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 10
    years_since_us_entry: 2
  output:
    is_medicaid_lawfully_residing_option_eligible: false

- name: Case 5, option covers temporary protected status but not DACA recipients or undocumented immigrants.
  period: 2025
  input:
    people:
      person1:
        age: 10
        immigration_status: TPS
      person2:
        age: 10
        immigration_status: DACA
      person3:
        age: 10
        immigration_status: UNDOCUMENTED
    households:
      household1:
        members: [person1]
        state_code: NY
      household2:
        members: [person2]
        state_code: NY
      household3:
        members: [person3]
        state_code: FL
  output:
    is_medicaid_lawfully_residing_option_eligible: [true, false, false]

- name: Case 6, adult who is not pregnant is outside the option, and past-bar children qualify either way.
  period: 2025
  input:
    people:
      person1:
        age: 40
        is_pregnant: false
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 10
        is_pregnant: false
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 5
    households:
      household1:
        members: [person1]
        state_code: CA
      household2:
        members: [person2]
        state_code: CA
  output:
    is_medicaid_lawfully_residing_option_eligible: [false, true]
    is_medicaid_immigration_status_eligible: [false, true]

# The pregnancy category runs through the state's Medicaid postpartum period.
# New Jersey and Illinois both extend it to 365 days (12 months).
- name: Case 7, postpartum coverage at 90 days follows New Jersey's 12-month extension.
  period: 2025
  input:
    state_code: NJ
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 30
    years_since_us_entry: 2
    is_pregnant: false
    count_days_postpartum: 90
  output:
    is_medicaid_lawfully_residing_option_eligible: true

- name: Case 8, postpartum coverage at 90 days needs the pregnancy election, which Illinois has not made.
  period: 2025
  input:
    state_code: IL
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 30
    years_since_us_entry: 2
    is_pregnant: false
    count_days_postpartum: 90
  output:
    is_medicaid_lawfully_residing_option_eligible: false

- name: Case 9, New Jersey postpartum coverage holds at 364 days and ends at 365.
  period: 2025
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        count_days_postpartum: 364
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person2:
        age: 30
        is_pregnant: false
        count_days_postpartum: 365
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
    households:
      household1:
        members: [person1]
        state_code: NJ
      household2:
        members: [person2]
        state_code: NJ
  output:
    is_medicaid_lawfully_residing_option_eligible: [true, false]

