# H.R.1 section 71109 drops refugees from federal Medicaid funding from
# October 1, 2026 (read from 2027 in annual simulations) but leaves the option.
- name: Case 17, after section 71109 refugee children keep Medicaid only in electing states.
  period: 2027
  input:
    people:
      person1:
        age: 10
        is_pregnant: false
        immigration_status: REFUGEE
      person2:
        age: 40
        is_pregnant: false
        immigration_status: REFUGEE
      person3:
        age: 10
        is_pregnant: false
        immigration_status: REFUGEE
      person4:
        age: 30
        is_pregnant: true
        immigration_status: REFUGEE
    households:
      household1:
        members: [person1]
        state_code: NY
      household2:
        members: [person2]
        state_code: NY
      household3:
        members: [person3]
        state_code: AL
      household4:
        members: [person4]
        state_code: FL
  output:
    is_medicaid_lawfully_residing_option_eligible: [true, false, false, false]
    is_medicaid_immigration_status_eligible: [true, false, false, false]

- name: Case 18, refugees are bar-exempt qualified aliens before section 71109 applies.
  period: 2026
  input:
    people:
      person1:
        age: 40
        immigration_status: REFUGEE
      person2:
        age: 10
        immigration_status: REFUGEE
    households:
      household1:
        members: [person1]
        state_code: NY
      household2:
        members: [person2]
        state_code: AL
  output:
    is_medicaid_lawfully_residing_option_eligible: [false, false]
    is_medicaid_immigration_status_eligible: [true, true]

