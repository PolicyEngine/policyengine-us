- name: An 18-year-old full-time student counts as a dependent child
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      student:
        age: 18
        is_tax_unit_dependent: true
        is_full_time_student: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, student]
    households:
      household:
        members: [head, student]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false]

- name: An 18-year-old who is not a student is not a dependent child
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      non_student:
        age: 18
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, non_student]
    households:
      household:
        members: [head, non_student]
        state_code: MO
  output:
    is_parent_for_medicaid: [false, false]
