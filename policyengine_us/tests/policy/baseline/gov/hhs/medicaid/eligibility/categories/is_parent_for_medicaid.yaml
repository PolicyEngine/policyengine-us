- name: No dependents, ineligible
  period: 2022
  input:
    tax_unit_count_dependents: 0
  output:
    is_parent_for_medicaid: false

- name: 1 dependent child, under FPL limit, eligible in CA
  period: 2022
  input:
    people:
      parent:
        age: 30
        is_tax_unit_head: true
        medicaid_income_level: 1.13
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_income_level: 1.13
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    is_parent_for_medicaid: [true, false]

