  input:
    people:
      person1:
        age: 34
        is_tax_unit_head: true
        medicaid_income_level: 1.5
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_income_level: 1.5
    tax_units:
      tax_unit:
        members: [person1, child]
    households:
      household:
        members: [person1, child]
        state_code: DC
  output:
    is_parent_for_medicaid: [false, false]

# Restructured from PR #9200 with an actual dependent child, which the
# caretaker-relative check requires.
# $300/month is just below the size-3 MHF limit of $301/month.
- name: Missouri parent just below the size-3 MHF limit is eligible
  period: 2025
  input:
    people:
      person1:
        age: 34
        is_tax_unit_head: true
        medicaid_household_size: 3
        employment_income: 3_600
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_household_size: 3
    tax_units:
      tax_unit:
        members: [person1, child]
    households:
      household:
        members: [person1, child]
        state_code: MO
        state_group_str: CONTIGUOUS_US
  output:
    is_parent_for_medicaid: [true, false]

# Issue #9128: 42 CFR 435.110 restricts the parent category to parents and
# other caretaker relatives (42 CFR 435.4) living with a dependent child.
- name: Non-filer adult in the tax unit is not a caretaker relative in MO
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      roommate:
        age: 28
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        medicaid_income_level: 0.1
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [parent, roommate, child]
    households:
      household:
        members: [parent, roommate, child]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false, false]

# Tax-unit dependency here encodes the living arrangement, not filing
# behavior, so this also covers the non-filer caretaker of Missouri DSS
# § 1805.030.10.25 (the Jon/Gavin uncle-nephew example): a caretaker
# relative need not claim, or file at all (42 CFR 435.4).
- name: An aunt claiming her nephew as a dependent qualifies as a caretaker relative in MO
  period: 2025
  input:
    people:
      aunt:
        age: 40
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      nephew:
        age: 10
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [aunt, nephew]
    households:
      household:
        members: [aunt, nephew]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false]

- name: An adult dependent does not qualify the filer for the parent category
  period: 2025
  input:
    people:
      head:
        age: 50
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      adult_dependent:
        age: 24
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, adult_dependent]
    households:
      household:
        members: [head, adult_dependent]
        state_code: MO
  output:
    is_parent_for_medicaid: [false, false]

# An unrelated foster parent is not a relative by blood, adoption, or
# marriage even when claiming the foster child as a tax dependent.
- name: A foster child does not make the foster parent a caretaker relative
  period: 2025
  input:
    people:
      foster_parent:
        age: 40
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      foster_child:
        age: 8
        is_tax_unit_dependent: true
        is_in_foster_care: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [foster_parent, foster_child]
    households:
      household:
        members: [foster_parent, foster_child]
        state_code: MO
  output:
    is_parent_for_medicaid: [false, false]

# Known limitation: a kinship foster caregiver's blood relationship
# legally survives the foster placement, but the model cannot
# distinguish kinship from unrelated foster placements, so the foster
# exclusion also reaches this grandmother.
- name: A grandmother fostering her grandchild is excluded by the foster proxy
  period: 2025
  input:
    people:
      grandmother:
        age: 60
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      grandchild:
        age: 8
        is_tax_unit_dependent: true
        is_in_foster_care: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [grandmother, grandchild]
    households:
      household:
        members: [grandmother, grandchild]
        state_code: MO
  output:
    is_parent_for_medicaid: [false, false]

# Missouri elects the 42 CFR 435.4 18-year-old student option
# (DSS Manual § 1810.020.20.20).
- name: An 18-year-old full-time student counts as a dependent child
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      student:
        age: 18
        is_tax_unit_dependent: true
        is_full_time_student: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, student]
    households:
      household:
        members: [head, student]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false]

- name: An 18-year-old who is not a student is not a dependent child
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      non_student:
        age: 18
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, non_student]
    households:
      household:
        members: [head, non_student]
        state_code: MO
  output:
    is_parent_for_medicaid: [false, false]

