# Georgia applies a plain under-19 rule with no student condition:
# "there must be a child in the assistance unit under the age of 19"
# (DFCS Manual § 2255).
- name: An 18-year-old non-student qualifies the parent in Georgia
  period: 2025
  input:
    people:
      head:
        age: 45
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      non_student:
        age: 18
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, non_student]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [head, non_student]
        state_code: GA
  output:
    is_parent_for_medicaid: [true, false]

