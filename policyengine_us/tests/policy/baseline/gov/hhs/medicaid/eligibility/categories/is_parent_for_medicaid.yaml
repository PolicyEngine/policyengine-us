- name: Two-parent household under the income limit is eligible in TX
  period: 2025
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_dependent: false
        medicaid_income_level: 0.1
      spouse:
        age: 30
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        medicaid_income_level: 0.1
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [head, spouse, child]
        filing_status: JOINT
        tax_unit_count_dependents: 1
    households:
      household:
        members: [head, spouse, child]
        state_code: TX
  output:
    is_parent_for_medicaid: [true, true, false]

- name: DC parent above the Medicaid ceiling is not parent-eligible after Healthy DC Plan starts
  period: 2026
  input:
    people:
      person1:
        age: 34
        medicaid_income_level: 1.5
    tax_units:
      tax_unit:
        members: [person1]
        tax_unit_count_dependents: 1
    households:
      household:
        members: [person1]
        state_code: DC
  output:
    is_parent_for_medicaid: [false]

# Restructured from PR #9200 with an actual dependent child, which the
# caretaker-relative check requires.
- name: Missouri parent just below the size-3 MHF limit is eligible
  period: 2025
  input:
    people:
      person1:
        age: 34
        is_tax_unit_head: true
        medicaid_household_size: 3
        medicaid_income_level: 0.13553
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_household_size: 3
        medicaid_income_level: 0.13553
    tax_units:
      tax_unit:
        members: [person1, child]
    households:
      household:
        members: [person1, child]
        state_code: MO
        state_group_str: CONTIGUOUS_US
  output:
    is_parent_for_medicaid: [true, false]

# Issue #9128: 42 CFR 435.110 restricts the parent category to parents and
# other caretaker relatives (42 CFR 435.4) living with a dependent child.
- name: Non-filer adult in the tax unit is not a caretaker relative in MO
  period: 2025
  input:
    people:
      parent:
        age: 30
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      roommate:
        age: 28
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        medicaid_income_level: 0.1
      child:
        age: 5
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [parent, roommate, child]
    households:
      household:
        members: [parent, roommate, child]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false, false]

- name: An aunt claiming her nephew as a dependent qualifies as a caretaker relative in MO
  period: 2025
  input:
    people:
      aunt:
        age: 40
        is_tax_unit_head: true
        medicaid_income_level: 0.1
      nephew:
        age: 10
        is_tax_unit_dependent: true
        medicaid_income_level: 0.1
    tax_units:
      tax_unit:
        members: [aunt, nephew]
    households:
      household:
        members: [aunt, nephew]
        state_code: MO
  output:
    is_parent_for_medicaid: [true, false]

