# Annual results read January 1, so a pregnancy that ends on January 1 starts
# the continuation in time for that year's result.
- name: Case 20, a Rhode Island pregnancy that ends on January 1 keeps Medicaid in that year's annual result.
  period: 2024
  input:
    state_code: RI
    age: 30
    immigration_status: CITIZEN
    is_pregnant: false
    ri_pregnancy_coverage: MEDICAID
    ri_pregnancy_end_date: "2024-01-01"
    medicaid_household_size: 2
    medicaid_income_level: 4
  output:
    is_pregnant_for_medicaid: true
    is_medicaid_eligible: true
