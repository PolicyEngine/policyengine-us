# equal to or less than the QMBP standards for a couple." Budgeting together keeps
# only the second test, so Oklahoma follows SSI's rule, which tests this applicant
# alone: 16,800 - 240 = 16,560 is above the one-person 15,960, though within the
# two-person 21,640.
- name: Case 16, Oklahoma applicant with a spouse who has no income is tested against the individual standard.
  period: 2026
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        social_security_retirement: 16_800
      person2:
        is_tax_unit_spouse: true
        age: 50
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    medicaid_optional_senior_or_disabled_uses_couple_standard: [false, true]
    medicaid_optional_senior_or_disabled_income_limit: [15_960, 21_640]
    medicaid_optional_senior_or_disabled_countable_income: [16_560, 0]
    is_optional_senior_or_disabled_income_eligible: [false, true]

