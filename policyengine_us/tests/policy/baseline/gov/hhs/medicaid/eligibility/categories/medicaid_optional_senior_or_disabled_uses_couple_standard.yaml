        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: HI
  output:
    is_ssi_spousal_deeming_applies: [false, false]
    medicaid_optional_senior_or_disabled_income_deemed_from_ineligible_spouse: [5_000, 0]
    medicaid_optional_senior_or_disabled_countable_income: [16_760, 0]
    is_optional_senior_or_disabled_income_eligible: [true, true]
    medicaid_category: [SSI_RECIPIENT, ADULT]

