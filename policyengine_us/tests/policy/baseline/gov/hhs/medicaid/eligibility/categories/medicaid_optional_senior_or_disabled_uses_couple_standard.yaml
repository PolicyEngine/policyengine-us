# 12,000 - 240 = 11,760 is below 12 x 994 = 11,928, so the applicant receives SSI.
- name: Case 15, Hawaii counts spouse income below SSI's deeming threshold.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        is_tax_unit_head: true
        age: 70
        social_security_retirement: 12_000
      person2:
        is_tax_unit_spouse: true
        age: 50
        taxable_interest_income: 5_000
    marital_units:
