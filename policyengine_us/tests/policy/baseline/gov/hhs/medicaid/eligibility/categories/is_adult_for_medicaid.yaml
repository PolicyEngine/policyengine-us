# Issue #9124: 42 CFR 435.119(b) excludes people entitled to or enrolled in
# Medicare Part A or B from the adult group; Missouri's Adult Expansion
# Group also requires an applicant not to be receiving SSI (DSS Manual
# § 1865.020.00).
- name: SSDI-based Medicare enrollee is excluded from the adult group
  period: 2025
  input:
    age: 55
    medicaid_income_level: 0.5
    social_security_disability: 12_000
    months_receiving_social_security_disability: 30
  output:
    is_adult_for_medicaid: false

- name: SSDI recipient still in the Medicare waiting period stays in the adult group
  period: 2025
  input:
    age: 55
    medicaid_income_level: 0.5
    social_security_disability: 12_000
    months_receiving_social_security_disability: 12
  output:
    is_adult_for_medicaid: true

- name: SSI recipient is excluded from the adult group in Missouri
  period: 2025
  input:
    state_code: MO
    age: 40
    medicaid_income_level: 0.5
    ssi: 11_000
  output:
    is_adult_for_medicaid: false

- name: Reported SSI receipt also excludes a Missouri adult from the adult group
  period: 2025
  input:
    state_code: MO
    age: 40
    medicaid_income_level: 0.5
    receives_ssi: true
  output:
    is_adult_for_medicaid: false

- name: Otherwise identical Missouri adult without SSI stays in the adult group
  period: 2025
  input:
    state_code: MO
    age: 40
    medicaid_income_level: 0.5
  output:
    is_adult_for_medicaid: true
