- name: Otherwise identical Missouri adult without SSI stays in the adult group
  period: 2025
  input:
    state_code: MO
    age: 40
    medicaid_income_level: 0.5
  output:
    is_adult_for_medicaid: true

# In a Section 1634 state, an SSI recipient is eligible for and enrolled
# in mandatory SSI-recipient coverage (42 CFR 435.120), so 42 CFR
# 435.119(b)(4) excludes them from the adult group.
- name: SSI recipient in a Section 1634 state is excluded from the adult group
  period: 2025
  input:
    state_code: CA
    age: 40
    medicaid_income_level: 0.5
    ssi: 11_000
  output:
    is_adult_for_medicaid: false

# Connecticut's 209(b) resource limit ($1,600) is more restrictive than
# SSI's ($2,000), so a recipient with $1,800 in countable resources
# receives SSI yet fails the state's mandatory-coverage criteria
# (42 CFR 435.121). 42 CFR 435.119(b)(4) then leaves them in the adult
# group, and HUSKY D's own criteria carry no SSI-receipt test
# (DSS UPM 2540 chart, X02).
- name: SSI recipient failing a 209(b) state's criteria stays in the adult group
  period: 2025
  input:
    state_code: CT
    age: 40
    medicaid_income_level: 0.5
    receives_ssi: true
    ssi_countable_resources: 1_800
  output:
    is_adult_for_medicaid: true

# Minnesota excludes by receipt - "Is not a Supplemental Security
# Income (SSI) recipient" (EPM § 2.2.2.1) - so even an SSI recipient
# failing the state's 209(b) criteria is excluded, unlike in CT.
- name: SSI recipient is excluded from Minnesota's adult group regardless of 209(b) status
  period: 2025
  input:
    state_code: MN
    age: 40
    medicaid_income_level: 0.5
    receives_ssi: true
    ssi_countable_resources: 100_000
  output:
    is_adult_for_medicaid: false

# At year granularity 2021 reads the January 1 parameter values, before
# Missouri's adult expansion took effect (Mo. Const. art. IV, § 36(c),
# effective July 1, 2021; DSS Manual § 1865.010.00): the SSI-receipt
# bar is not yet read, so the non-financial criteria pass, but the
# adult group itself does not exist yet, so full adult-group
# eligibility is still false.
- name: Missouri SSI receipt bar and adult group both start with the 2021 expansion
  period: 2021
  input:
    state_code: MO
    age: 40
    medicaid_income_level: 0.5
    receives_ssi: true
    ssi_countable_resources: 100_000
  output:
    is_adult_for_medicaid_nfc: true
    is_adult_for_medicaid: false

# Missouri applies the AEG adult limit (133% FPL plus the 5% disregard) as
# the Appendix A monthly-dollar maximum, rounded up to the next whole
# dollar: household of 1 in 2026, 15,960 x 1.38 / 12 = 1,835.40 -> $1,836.
- name: MO adult at exactly the Appendix A $1,836 monthly maximum, eligible although the exact ratio is 1.3805
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 22_032
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_adult_for_medicaid_fc: true
    is_adult_for_medicaid: true

- name: MO adult $1 above the Appendix A monthly maximum ($1,837), ineligible
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 22_044
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_adult_for_medicaid_fc: false
    is_adult_for_medicaid: false

# For a household of 4 in 2026 the exact AEG threshold is already a whole
# dollar, 33,000 x 1.38 / 12 = $3,795.00, so no rounding occurs and $3,795 is
# the last eligible dollar.
- name: MO adult at exactly the $3,795 monthly maximum, eligible
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 45_540
      person2:
        age: 40
      person3:
        age: 12
      person4:
        age: 12
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MO
  output:
    is_adult_for_medicaid_fc: [true, true, true, true]

# KNOWN LIMITATION: medicaid_income_level measures Missouri income from the
# whole dollar just below monthly income (ceil(m) - 1). When the exact
# threshold is a whole dollar, the household $1 above it measures at exactly
# the limit ($3,795 x 12 / 33,000 = 1.38), and the strict-less-than test
# still passes because the float32 level compares below the float64
# parameter, although Missouri would find $3,796 ineligible. This case pins
# that behavior so a change to it is deliberate rather than silent.
- name: MO adult $1 above the whole-dollar maximum ($3,796) still measures at the limit (known limitation)
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 45_552
      person2:
        age: 40
      person3:
        age: 12
      person4:
        age: 12
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MO
  output:
    is_adult_for_medicaid_fc: [true, true, true, true]

