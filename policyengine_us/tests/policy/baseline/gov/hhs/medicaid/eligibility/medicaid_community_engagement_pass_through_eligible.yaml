  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 15
    spm_units:
      spm_unit:
        members: [person1]
        snap: 100
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    medicaid_community_engagement_pass_through_eligible: true

