# California began full-scope Medi-Cal for undocumented residents aged 19 to
# 25 on January 1, 2020. Before that, no route in the formula covers a
# nonpregnant one: the federal test fails, California reads false in
# undocumented_immigrant and 0 in child_age_limit, and
# is_ca_medicaid_immigration_status_eligible is false.
- name: Undocumented 22-year-old in California is ineligible in 2018, before the 2020 expansion
  period: 2018
  input:
    immigration_status: UNDOCUMENTED
    age: 22
    is_pregnant: false
    state_code: CA
  output:
    # false OR false OR (22 < 0 = false) OR false = false
    is_medicaid_immigration_status_eligible: false

- name: Undocumented 22-year-old in California is eligible in 2020
  period: 2020
  input:
    immigration_status: UNDOCUMENTED
    age: 22
    is_pregnant: false
    state_code: CA
  output:
    # false OR false OR (22 < 0 = false) OR true = true
    is_medicaid_immigration_status_eligible: true

# 42 USC 1396b(v)(4): states that elected the lawfully residing option cover
# children and pregnant individuals inside the five-year bar.
- name: Case 15, recent permanent resident child in California is eligible through the lawfully residing option.
  period: 2025
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    age: 10
    state_code: CA
  output:
    is_medicaid_immigration_status_eligible: true

- name: Case 16, recent permanent resident child in Alabama stays barred because Alabama did not elect the option.
  period: 2025
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    age: 10
    state_code: AL
  output:
    is_medicaid_immigration_status_eligible: false

