- name: Arkansas applicant at the 2026 Medicare Savings Program individual resource limit is eligible.
  period: 2026
  input:
    age: 70
    ssi_countable_resources: 9_950
    state_code: AR
  output:
    # MS 23110(6): resources "equal to but not exceeding" the MSP standard.
    # 9,950 equals the 2026 limit of 9,950.
    is_optional_senior_or_disabled_asset_eligible: true

- name: Arkansas applicant one dollar over the 2026 Medicare Savings Program individual resource limit is ineligible.
  period: 2026
  input:
    age: 70
    ssi_countable_resources: 9_951
    state_code: AR
  output:
    # 9,951 exceeds the 2026 limit of 9,950.
    is_optional_senior_or_disabled_asset_eligible: false

- name: South Carolina applicant at the 2026 Medicare Savings Program individual resource limit is eligible.
  period: 2026
  input:
    age: 70
    ssi_countable_resources: 9_950
    state_code: SC
  output:
    # MPPM 303.06.02: countable resources "must be at or below" 9,950.
    is_optional_senior_or_disabled_asset_eligible: true

- name: Oklahoma couple at the 2026 Medicare Savings Program couple resource limit is eligible.
  period: 2026
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 7_455
      person2:
        age: 68
        ssi_countable_resources: 7_455
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: OK
  output:
    # C-1 Schedule VI: resources "equal to or less than" 14,910.
    # 7,455 + 7,455 = 14,910 combined.
    is_optional_senior_or_disabled_asset_eligible: [true, true]

