  period: 2024
  input:
    ssi_countable_resources: 1_000_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: high assets, still eligible for Medicaid in CA in 2025
  period: 2025
  input:
    ssi_countable_resources: 1_000_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: assets below the reinstated CA limit in 2026, eligible
  period: 2026
  input:
    ssi_countable_resources: 100_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: assets above the reinstated CA limit in 2026, ineligible
  period: 2026
  input:
    ssi_countable_resources: 150_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: false

- name: joint filers below the reinstated CA couple limit in 2026, eligible
  period: 2026
  input:
    people:
      person1:
        ssi_countable_resources: 90_000
      person2:
        ssi_countable_resources: 90_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_asset_eligible: [true, true]

# Each spouse is under the 130,000 individual limit; only the 195,000
# couple limit applied to combined resources makes them ineligible.
- name: joint filers above the reinstated CA couple limit in 2026, ineligible
  period: 2026
  input:
    people:
      person1:
        ssi_countable_resources: 100_000
      person2:
        ssi_countable_resources: 100_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_asset_eligible: [false, false]

# Missouri's limits from July 1, 2025 are 6,068.80 for one person and
# 12,137.55 for a couple. One spouse holds more than the individual limit,
# but the couple's combined resources are tested against the couple limit.
- name: Missouri spouse over the individual limit is eligible when combined resources are under the couple limit
  period: 2026
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 6_500
      person2:
        age: 68
        ssi_countable_resources: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # 11,500 combined is under 12,137.55.
    is_optional_senior_or_disabled_asset_eligible: [true, true]

- name: Missouri couple at the couple resource limit is ineligible
  period: 2026
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 6_000
      person2:
        age: 68
        ssi_countable_resources: 6_137.55
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # 12,137.55 combined is not under the 12,137.55 couple limit.
    is_optional_senior_or_disabled_asset_eligible: [false, false]

- name: Missouri's July 2026 individual limit applies from 2027.
  period: 2027
  input:
    age: 70
