- name: low assets, eligible for Medicaid
  period: 2022
  input:
    ssi_countable_resources: 1_000
    state_code: TX
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: high assets, ineligible for Medicaid
  period: 2022
  input:
    ssi_countable_resources: 1_000_000
    state_code: TX
  output:
    is_optional_senior_or_disabled_asset_eligible: false


- name: high assets, eligible for Medicaid in CA
  period: 2024
  input:
    ssi_countable_resources: 1_000_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: high assets, still eligible for Medicaid in CA in 2025
  period: 2025
  input:
    ssi_countable_resources: 1_000_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: assets below the reinstated CA limit in 2026, eligible
  period: 2026
  input:
    ssi_countable_resources: 100_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: true

- name: assets above the reinstated CA limit in 2026, ineligible
  period: 2026
  input:
    ssi_countable_resources: 150_000
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: false

- name: joint filers below the reinstated CA couple limit in 2026, eligible
  period: 2026
  input:
    people:
      person1:
        ssi_countable_resources: 90_000
      person2:
        ssi_countable_resources: 90_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_asset_eligible: [true, true]

# Each spouse is under the 130,000 individual limit; only the 195,000
# couple limit applied to combined resources makes them ineligible.
- name: joint filers above the reinstated CA couple limit in 2026, ineligible
  period: 2026
  input:
    people:
      person1:
        ssi_countable_resources: 100_000
      person2:
        ssi_countable_resources: 100_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_asset_eligible: [false, false]

# Missouri's 2026 limits are 5,726 for one person and 11,452 for a couple.
# One spouse holds more than the individual limit, but the couple's
# combined resources are tested against the couple limit.
- name: Missouri spouse over the individual limit is eligible when combined resources are under the couple limit
  period: 2026
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 6_000
      person2:
        age: 68
        ssi_countable_resources: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # 11,000 combined is under 11,452.
    is_optional_senior_or_disabled_asset_eligible: [true, true]

- name: Missouri couple at the couple resource limit is ineligible
  period: 2026
  input:
    people:
      person1:
        age: 70
        ssi_countable_resources: 6_000
      person2:
        age: 68
        ssi_countable_resources: 5_452
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    # 11,452 combined is not under the 11,452 couple limit.
    is_optional_senior_or_disabled_asset_eligible: [false, false]

# California's limit falls to 21,000 for one person and 31,000 for two on
# July 1, 2027. This annual variable reads the January 1 value, so the lower
# limits first apply in 2028.
- name: assets above the July 2027 CA limit in 2028, ineligible
  period: 2028
  input:
    ssi_countable_resources: 21_001
    state_code: CA
  output:
    is_optional_senior_or_disabled_asset_eligible: false

# Each spouse is under the 21,000 individual limit; combined resources of
# 31,001 are over the 31,000 couple limit.
- name: joint filers above the July 2027 CA couple limit in 2028, ineligible
  period: 2028
  input:
    people:
      person1:
        ssi_countable_resources: 15_500
      person2:
        ssi_countable_resources: 15_501
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    is_optional_senior_or_disabled_asset_eligible: [false, false]

- name: assets below the July 2027 CA limit in 2028, eligible
  period: 2028
  input:
    ssi_countable_resources: 20_000
    state_code: CA
  output:
    # 20,000 is under the 21,000 limit that applies from July 2027.
    is_optional_senior_or_disabled_asset_eligible: true

- name: joint filers below the July 2027 CA couple limit in 2028, eligible
  period: 2028
  input:
    people:
      person1:
        ssi_countable_resources: 15_000
      person2:
        ssi_countable_resources: 15_000
    marital_units:
      marital_unit1:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
  output:
    # 15,000 + 15,000 = 30,000 is under the 31,000 couple limit.
    is_optional_senior_or_disabled_asset_eligible: [true, true]
