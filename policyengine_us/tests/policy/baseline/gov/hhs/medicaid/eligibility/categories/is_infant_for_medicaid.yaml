# The CA limit is 266% FPL. With the size-1 2022 FPG of 13,590 the modeled
# ceiling is ceil(round(13,590 x 2.66 / 12, 2)) = ceil(3,012.45) = $3,013, an
# effective ratio of 3,013 x 12 / 13,590 = 2.6605, so 2.66 is inclusive and
# 2.67 (the second case above) is out.
- name: Child under 1 and exactly at the FPL limit, eligible in CA
  period: 2022
  input:
    state_code: CA
    age: 0
    medicaid_income_level: 2.66
  output:
    is_infant_for_medicaid: true

# GIS 17 MA/005 attachments 3-4, effective January 1, 2017:
# an infant in a household of two qualifies through $3,018/month (223% FPL,
# with the five-point MAGI disregard already included).
- name: Case 11, New York infant at the published 2017 monthly income ceiling.
  period: 2017
  input:
    state_code: NY
    age: 0
    medicaid_household_size: 2
    medicaid_household_income: 36_216
  output:
    is_infant_for_medicaid_fc: true
    is_infant_for_medicaid: true

- name: Case 12, New York infant one dollar above the published 2017 monthly income ceiling.
  period: 2017
  input:
    state_code: NY
    age: 0
    medicaid_household_size: 2
    medicaid_household_income: 36_228
  output:
    is_infant_for_medicaid_fc: false
    is_infant_for_medicaid: false

