- name: Case 21, Missouri SSI recipient earning exactly the SGA amount qualifies.
  period: 2026
  input:
    state_code: MO
    age: 40
    # 1,690 x 12; SGA requires earnings above the threshold.
    employment_income: 20_280
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

- name: Case 22a, Missouri section 1619(a) recipient earning above SGA keeps MHABD.
  period: 2026
  input:
    state_code: MO
    age: 40
    # $1,700 a month exceeds SGA, but countable income of
    # (20,400 - 1,020) / 2 = 9,690 is below the 11,928 benefit rate, so
    # SSI cash continues under section 1619(a).
    employment_income: 20_400
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

- name: Case 22b, Missouri SSI claimant whose wages exhaust the benefit rate is excluded.
  period: 2026
  input:
    state_code: MO
    age: 40
    # $2,500 a month: countable income of (30,000 - 1,020) / 2 = 14,490
    # exceeds the 11,928 benefit rate, so no SSI cash is payable and the
    # asserted receipt cannot be a 1619(a) continuation.
    employment_income: 30_000
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: false

- name: Case 22c, Missouri disabled student under 22 keeps SSI cash through the student earned income exclusion.
  period: 2026
  input:
    state_code: MO
    age: 20
    is_full_time_college_student: true
    is_disabled: true
    # The 9,730 annual student exclusion leaves 20,270 of wages; after the
    # standard exclusions, (20,270 / 12 - 85) / 2 x 12 = 9,625 is below the
    # 11,928 benefit rate, so SSI cash continues under section 1619(a).
    employment_income: 30_000
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

