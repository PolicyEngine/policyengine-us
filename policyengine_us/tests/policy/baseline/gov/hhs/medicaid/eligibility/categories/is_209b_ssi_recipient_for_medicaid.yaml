- name: Case 13, Illinois SSI recipient qualifies after medical spenddown.
  period: 2026
  input:
    state_code: IL
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: false
    medicaid_optional_senior_or_disabled_countable_income: 30_000
    # 30,000 - 15,000 = 15,000, within Illinois' 100% FPL individual
    # standard of 15,960 in 2026.
    medicaid_medically_needy_medical_expenses: 15_000
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

- name: Case 14, Missouri SSI recipient qualifies after medical spenddown.
  period: 2026
  input:
    state_code: MO
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: false
    # 25,000 - 12,000 = 13,000, within the 2026 individual standard
    # of ceil(0.85 x 15,960 / 12) = 1,131 monthly (13,572).
    medicaid_optional_senior_or_disabled_countable_income: 25_000
    medicaid_medically_needy_medical_expenses: 12_000
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

