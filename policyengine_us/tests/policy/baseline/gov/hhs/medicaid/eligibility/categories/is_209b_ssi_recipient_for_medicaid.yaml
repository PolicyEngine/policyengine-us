# Missouri denies MHABD to earners above the substantial gainful activity
# threshold (DSS MHABD Manual § 0840.010.35; 2026 non-blind SGA $1,690 a
# month). The screen belongs to the disability category, so the blind
# and the aged are exempt, and other 209(b) states apply no screen.
- name: Case 18, Missouri non-blind adult SSI recipient earning above SGA is excluded.
  period: 2026
  input:
    state_code: MO
    age: 40
    employment_income: 56_220
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: false

- name: Case 19, Missouri blind SSI recipient earning above SGA is not screened.
  period: 2026
  input:
    state_code: MO
    age: 40
    is_blind: true
    employment_income: 56_220
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

- name: Case 20, Missouri aged SSI recipient earning above SGA is not screened.
  period: 2026
  input:
    state_code: MO
    age: 66
    employment_income: 56_220
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

- name: Case 21, Missouri SSI recipient earning exactly the SGA amount qualifies.
  period: 2026
  input:
    state_code: MO
    age: 40
    # 1,690 x 12; SGA requires earnings above the threshold.
    employment_income: 20_280
    ssi: 12_000
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_asset_eligible: true
  output:
    is_209b_ssi_recipient_for_medicaid: true

