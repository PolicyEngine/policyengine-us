# Emergency Medicaid waives only the receipt of SSI (42 U.S.C.
# 1396b(v)(2)(B)), so a blind or disabled noncitizen who fails the
# immigration test keeps the group in Arkansas when they meet SSI's
# income and resource tests. With no income and no resources, this person
# meets both: $0 countable income is below the $994 SSI rate, and $0 is
# within the $2,000 resource limit.
- name: Case 12, disabled undocumented Arkansan under 65 keeps the group for emergency Medicaid.
  period: 2026
  input:
    age: 50
    state_code: AR
    immigration_status: UNDOCUMENTED
    meets_ssi_disability_criteria: true
  output:
    is_medicaid_immigration_status_eligible: false
    is_optional_senior_or_disabled_for_medicaid: true

