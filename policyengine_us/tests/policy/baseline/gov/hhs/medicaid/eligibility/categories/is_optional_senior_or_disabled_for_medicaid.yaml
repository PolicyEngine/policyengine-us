# MHABD 0805.020.15 deems the parent's income to the child: (70,000 / 12 - 20
# - 65) / 2 x 12 = 34,490, less the parent's allowance of 994 x 12 = 11,928,
# is 22,562. The child's budget takes off the 20 exemption and rounds down:
# 22,562 / 12 - 20 = 1,860.17, so 1,860 a month or 22,320 a year. The same
# section counts the parent's incurred medical expenses toward the child's
# spend down: 22,320 - 10,000 = 12,320, within the standard.
- name: Case 28, Missouri blind child spends down on the parent's medical expenses.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        own_children_in_household: 1
        employment_income_before_lsr: 70_000
        other_medical_expenses: 10_000
      person2:
        age: 8
        is_tax_unit_dependent: true
        is_blind: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    medicaid_optional_senior_or_disabled_countable_income: [0, 22_320]
    medicaid_parental_medical_expense_share: [0, 10_000]
    is_optional_senior_or_disabled_for_medicaid: [false, true]
    medicaid_category: [NONE, SENIOR_OR_DISABLED]

# Without expenses, 22,320 is above the 15,960 blind standard.
- name: Case 29, Missouri blind child with no medical expenses in the family stays above the standard.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        own_children_in_household: 1
        employment_income_before_lsr: 70_000
      person2:
        age: 8
        is_tax_unit_dependent: true
        is_blind: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    is_optional_senior_or_disabled_for_medicaid: [false, false]
    medicaid_category: [NONE, NONE]

# Two disabled children divide the deemed income equally (MHABD 0805.020.15):
# (100,000 / 12 - 85) / 2 x 12 = 49,490, less 11,928, is 37,562, or 18,781
# each. Each child's budget is 18,781 / 12 - 20 = 1,545.08, so 1,545 a month or
# 18,540 a year. SSI countable income of 18,781 - 240 = 18,541 is above the
# 11,928 SSI rate, so neither child receives SSI. Each child must spend down
# 18,540 - 13,572 = 4,968, which is exactly half of the parent's 9,936.
- name: Case 30, two Missouri disabled children each reach the standard on half of the parent's medical expenses.
  period: 2026
  input:
    people:
      person1:
        age: 42
        is_tax_unit_head: true
        own_children_in_household: 2
        employment_income_before_lsr: 100_000
        other_medical_expenses: 9_936
      person2:
        age: 11
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
      person3:
        age: 8
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    ssi: [0, 0, 0]
    medicaid_optional_senior_or_disabled_countable_income: [0, 18_540, 18_540]
    medicaid_parental_medical_expense_share: [0, 4_968, 4_968]
    is_optional_senior_or_disabled_for_medicaid: [false, true, true]
    medicaid_category: [NONE, SENIOR_OR_DISABLED, SENIOR_OR_DISABLED]

# Half of 9,934 is 4,967, which leaves each child at 13,573, a dollar above the
# 13,572 standard. Deducting the whole 9,934 from each child would pass.
- name: Case 31, two Missouri disabled children stay a dollar above the standard on half of the parent's medical expenses.
