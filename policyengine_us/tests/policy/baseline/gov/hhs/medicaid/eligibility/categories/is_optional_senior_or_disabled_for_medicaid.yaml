# $994 x 12.
- name: Case 15, disabled Arkansan in the five-year bar with countable income equal to the SSI rate keeps the group.
  period: 2026
  input:
    age: 50
    state_code: AR
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    meets_ssi_disability_criteria: true
    social_security_disability: 12_168
  output:
    is_medicaid_immigration_status_eligible: false
    is_optional_senior_or_disabled_income_eligible: true
    is_optional_senior_or_disabled_for_medicaid: true

