        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    medicaid_parental_medical_expense_share: [0, 4_967, 4_967]
    is_optional_senior_or_disabled_for_medicaid: [false, false, false]
    medicaid_category: [NONE, NONE, NONE]

# The child passes the income test: 22,320 - 10,000 = 12,320. MHABD 0805.020.10
# adds the entire 100,000 to the child's resources, above the 6,068.80 limit.
- name: Case 32, Missouri blind child with a parent's savings above the limit is ineligible after spending down.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        own_children_in_household: 1
        employment_income_before_lsr: 70_000
        bank_account_assets: 100_000
      person2:
        age: 8
        is_tax_unit_dependent: true
        is_blind: true
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    is_209b_ssi_recipient_income_eligible_for_medicaid: [true, true]
    is_optional_senior_or_disabled_asset_eligible: [false, false]
    is_optional_senior_or_disabled_for_medicaid: [false, false]
    medicaid_category: [NONE, NONE]

# Missouri covers a nonblind disabled child (MHABD 0805.020.00). 22,320 - 9,000
# = 13,320 is within the 13,572 standard.
- name: Case 33, Missouri nonblind disabled child spends down on the child's own medical expenses.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        own_children_in_household: 1
        employment_income_before_lsr: 70_000
      person2:
        age: 8
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
        other_medical_expenses: 9_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    is_optional_senior_or_disabled_for_medicaid: [false, true]
    medicaid_category: [NONE, SENIOR_OR_DISABLED]

# Countable income is 24,000 - 240 = 23,760, and 23,760 - 13,572 = 10,188.
- name: Case 34, Missouri disabled adult under 65 spends down exactly to the standard.
  period: 2026
  input:
    age: 50
    meets_ssi_disability_criteria: true
    social_security_disability: 24_000
    other_medical_expenses: 10_188
    state_code: MO
  output:
    is_optional_senior_or_disabled_for_medicaid: true
    medicaid_category: SENIOR_OR_DISABLED

- name: Case 35, Missouri disabled adult under 65 stays a dollar above the standard after expenses.
  period: 2026
  input:
    age: 50
    meets_ssi_disability_criteria: true
    social_security_disability: 24_000
    other_medical_expenses: 10_187
    state_code: MO
  output:
    is_optional_senior_or_disabled_for_medicaid: false
    medicaid_category: NONE

# The couple's income is the aged spouse's 24,000 - 240 = 23,760. The other
# spouse's 5,364 of expenses bring it to 18,396, exactly 12 x 1,533. The
# 60-year-old is not aged, blind or disabled, so stays outside the group.
- name: Case 36, Missouri couple with one aged spouse spends down on the other spouse's medical expenses.
  period: 2026
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        social_security_retirement: 24_000
      person2:
        age: 60
        is_tax_unit_spouse: true
        other_medical_expenses: 5_364
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    medicaid_optional_senior_or_disabled_income_limit: [18_396, 18_396]
    is_optional_senior_or_disabled_for_medicaid: [true, false]

# The household of Case 28 with 7,000 of the parent's medical expenses:
# 22,320 - 7,000 = 15,320. Appendix K lists one standard for a child under 18 who is
# "permanently and totally disabled, or blind": 12 x 1,131 = 13,572, so the child is
# not eligible. Appendix J's blind standard of 12 x 1,330 = 15,960 applies from age 18
# (candidate us-mo:mhdc-blind-child-income-standard).
- name: Case 37, Missouri blind child is tested against the standard for disabled children.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        own_children_in_household: 1
        employment_income_before_lsr: 70_000
        other_medical_expenses: 7_000
      person2:
        age: 8
        is_tax_unit_dependent: true
        is_blind: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    medicaid_optional_senior_or_disabled_countable_income: [0, 22_320]
    medicaid_parental_medical_expense_share: [0, 7_000]
    medicaid_optional_senior_or_disabled_income_limit: [13_572, 13_572]
    is_optional_senior_or_disabled_for_medicaid: [false, false]
    medicaid_category: [NONE, NONE]
