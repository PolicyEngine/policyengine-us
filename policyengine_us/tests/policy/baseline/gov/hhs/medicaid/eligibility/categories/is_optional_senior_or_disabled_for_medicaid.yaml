# Missouri has no medically needy program, so 42 CFR 435.121(e)(4) requires a
# spend down to its MHABD standard. Countable income is 16,800 - 240 = 16,560.
# The aged standard is 12 x 1,131 = 13,572, so 2,988 of expenses reach it.
- name: Case 21, Missouri aged person not on SSI spends down exactly to the standard.
  period: 2026
  input:
    age: 70
    social_security_retirement: 16_800
    other_medical_expenses: 2_988
    state_code: MO
  output:
    is_optional_senior_or_disabled_income_eligible: false
    is_optional_senior_or_disabled_for_medicaid: true
    medicaid_category: SENIOR_OR_DISABLED

