- name: Case 15, disabling the COPES waiver leaves the other named waivers modeled.
  period: 2026-07
  input:
    gov.hhs.medicaid.eligibility.long_term_care.financial.wa.waivers.copes.enabled: false
    people:
      copes:
        medicaid_ltss_setting: HCBS
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: WA_COPES
        medicaid_ltss_non_delaware_assistance_unit_size: 1
      new_freedom:
        medicaid_ltss_setting: HCBS
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: WA_NEW_FREEDOM
        medicaid_ltss_non_delaware_assistance_unit_size: 1
    households:
      household:
        members: [copes, new_freedom]
        state_code:
          2026: WA
  output:
    medicaid_ltss_financial_pathway: [UNMODELED, SPECIAL_INCOME]
