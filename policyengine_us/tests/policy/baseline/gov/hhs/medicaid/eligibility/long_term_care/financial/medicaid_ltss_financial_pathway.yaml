- name: Case 13, Delaware models institutional couples but no HCBS waiver.
  period: 2026-07
  input:
    people:
      institutional_couple:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
      hcbs_named_waiver:
        medicaid_ltss_setting: HCBS
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: WA_COPES
      hcbs_no_waiver:
        medicaid_ltss_setting: HCBS
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
      institutional_couple_spouse:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
        medicaid_ltss_reported_gross_unearned_income: 0
        medicaid_ltss_individual_countable_resources: 0
    households:
      household:
        members: [institutional_couple, hcbs_named_waiver, hcbs_no_waiver, institutional_couple_spouse]
        state_code:
          2026: DE
    marital_units:
      institutional_couple:
        members: [institutional_couple, institutional_couple_spouse]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
      hcbs_named_waiver:
        members: [hcbs_named_waiver]
      hcbs_no_waiver:
        members: [hcbs_no_waiver]
  output:
    medicaid_ltss_financial_pathway: [SPECIAL_INCOME, UNMODELED, UNMODELED, SPECIAL_INCOME]

