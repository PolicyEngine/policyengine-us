- name: Texas institutional assistance unit of one uses the special income pathway.
  period: 2026-07
  input:
    state_code:
      2026: TX
    medicaid_ltss_setting: INSTITUTIONAL
    medicaid_ltss_waiver: NONE
    medicaid_ltss_assistance_unit_size: 1
  output:
    medicaid_ltss_financial_pathway: SPECIAL_INCOME

