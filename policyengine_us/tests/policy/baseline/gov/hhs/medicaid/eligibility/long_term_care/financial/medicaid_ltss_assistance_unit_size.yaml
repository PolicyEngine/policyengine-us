        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 0
        medicaid_ltss_individual_countable_resources: 500
      individual_resources_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 1_000
        medicaid_ltss_individual_countable_resources: 1_900
      individual_resources_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 1_000
        medicaid_ltss_individual_countable_resources: 1_900
      couple_resources_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 1_000
        medicaid_ltss_individual_countable_resources: 2_500
      couple_resources_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 1_000
        medicaid_ltss_individual_countable_resources: 500
      mixed_budget_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 3_000
        medicaid_ltss_individual_countable_resources: 500
      mixed_budget_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
