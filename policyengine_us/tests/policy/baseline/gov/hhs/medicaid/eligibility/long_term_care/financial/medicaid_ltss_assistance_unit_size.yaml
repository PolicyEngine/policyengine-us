        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
      individual_resources:
        members: [individual_resources_a, individual_resources_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
      couple_resources:
        members: [couple_resources_a, couple_resources_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
      mixed_budget:
        members: [mixed_budget_a, mixed_budget_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
      reversed_mixed:
        members: [reversed_mixed_b, reversed_mixed_a]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
      tie:
        members: [tie_a, tie_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 6
    households:
      delaware:
        members:
          [five_month_a, five_month_b, six_month_income_a, six_month_income_b,
           couple_income_a, couple_income_b, individual_resources_a,
           individual_resources_b, couple_resources_a, couple_resources_b,
           mixed_budget_a, mixed_budget_b, reversed_mixed_b, reversed_mixed_a,
           tie_a, tie_b]
        state_code:
          2026: DE
  output:
    # At five months couple budgeting is compulsory even if both individual
    # budgets would pass. At exactly six months the favorable election applies.
    medicaid_ltss_assistance_unit_size:
      [2, 2, 1, 1, 2, 2, 1, 1, 2, 2, 2, 2, 2, 2, 1, 1]
    medicaid_ltss_countable_income:
