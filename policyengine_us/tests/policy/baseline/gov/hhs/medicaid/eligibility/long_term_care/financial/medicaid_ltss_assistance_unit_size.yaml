- name: Case 7, elections before six completed months or without supplied duration leave compulsory couple budgets unchanged.
  period: 2026-09
  input:
    people:
      five_month_individual_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
      five_month_individual_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
      five_month_couple_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
      five_month_couple_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
      duration_unspecified_a:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
      duration_unspecified_b:
        medicaid_ltss_setting: INSTITUTIONAL
        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_reported_gross_unearned_income: 2_000
        medicaid_ltss_individual_countable_resources: 1_000
    marital_units:
      five_month_individual:
        members: [five_month_individual_a, five_month_individual_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 5
        medicaid_ltss_de_post_six_month_budget_election: INDIVIDUAL
      five_month_couple:
        members: [five_month_couple_a, five_month_couple_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_spouses_months_in_same_institutional_facility: 5
        medicaid_ltss_de_post_six_month_budget_election: COUPLE
      duration_unspecified:
        members: [duration_unspecified_a, duration_unspecified_b]
        medicaid_ltss_spouses_requesting_or_receiving_institutional_services_in_same_facility: true
        medicaid_ltss_de_post_six_month_budget_election: INDIVIDUAL
    households:
      delaware:
        members:
          [five_month_individual_a, five_month_individual_b, five_month_couple_a, five_month_couple_b, duration_unspecified_a, duration_unspecified_b]
        state_code:
          2026: DE
  output:
    medicaid_ltss_assistance_unit_size: [2, 2, 2, 2, 2, 2]
    medicaid_ltss_countable_income: [3_980, 3_980, 3_980, 3_980, 3_980, 3_980]
    medicaid_ltss_countable_resources: [2_000, 2_000, 2_000, 2_000, 2_000, 2_000]
    is_medicaid_ltss_income_eligible: [false, false, false, false, false, false]
    medicaid_ltss_csra_resource_eligible: [true, true, true, true, true, true]
    is_medicaid_ltss_financial_threshold_eligible: [false, false, false, false, false, false]

