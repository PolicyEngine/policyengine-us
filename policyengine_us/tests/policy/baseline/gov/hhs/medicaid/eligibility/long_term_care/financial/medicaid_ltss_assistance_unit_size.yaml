    medicaid_ltss_countable_resources: [2_000, 2_000, 1_000, 1_000, 1_000, 1_000, 1_000]
    medicaid_ltss_financial_pathway:
      [UNMODELED, UNMODELED, SPECIAL_INCOME, SPECIAL_INCOME, SPECIAL_INCOME, SPECIAL_INCOME, SPECIAL_INCOME]
