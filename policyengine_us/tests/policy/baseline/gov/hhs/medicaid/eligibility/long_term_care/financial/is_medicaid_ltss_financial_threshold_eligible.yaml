- name: MMMNA does not convert above-SIL applicant income into eligibility.
  period: 2026-07
  absolute_error_margin: 0.01
  input:
    state_code:
      2026: TX
    medicaid_ltss_setting: INSTITUTIONAL
    medicaid_ltss_waiver: NONE
    medicaid_ltss_assistance_unit_size: 1
    medicaid_ltss_qit_adjusted_income: 3_000
    medicaid_ltss_countable_resources: 2_000
    medicaid_ltss_has_community_spouse: true
    medicaid_ltss_couple_countable_resources_at_first_institutionalization: 0
    medicaid_ltss_community_spouse_shelter_expenses: 3_000
  output:
    medicaid_ltss_financial_pathway: SPECIAL_INCOME
    medicaid_ltss_mmmna: 4_066.50
    is_medicaid_ltss_income_eligible: false
    is_medicaid_ltss_financial_threshold_eligible: false

