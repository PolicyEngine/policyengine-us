# R.I. Gen. Laws § 42-12.3-3(g): from October 1, 2022, people eligible for
# https://webserver.rilegislature.gov/Statutes/TITLE42/42-12.3/42-12.3-3.htm
# Medicaid or CHIP while pregnant keep full Medicaid through the postpartum
# period. $47,000 is about 230% FPL for a household of 2 in 2024 ($20,440).
# Use the mother's underlying indicator so the newborn's postpartum days
# derive as infinity rather than being filled with a zero partial input.
- name: Case 15, Rhode Island postpartum parent and newborn retain their distinct Medicaid categories.
  period: 2024
  input:
    people:
      person1:
        age: 28
        is_pregnant: false
        under_60_days_postpartum: true
        ri_pregnancy_coverage: CHIP
        ri_medicaid_pregnancy_end_date: "2023-12-01"
        employment_income: 47_000
      person2:
        age: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: RI
  output:
    is_pregnant_for_medicaid: [true, false]
    medicaid_category: [PREGNANT, INFANT]
    is_medicaid_eligible: [true, true]
    medicaid_enrolled: [false, true]
    chip_enrolled: [true, false]
    is_chip_eligible_standard_pregnant_person: [true, false]

# While pregnant, the same income is above RI's 190% Medicaid standard (195%
# with the disregard), so an uninsured applicant is in CHIP rather than
# Medicaid (210-RICR-30-00-1 § 1.6(A)(2)(b)(1)).
- name: Case 16, Rhode Island uninsured pregnant applicant at 230 percent FPL receives CHIP.
  period: 2024
  input:
    people:
      person1:
        age: 28
        is_pregnant: true
        immigration_status: CITIZEN
        employment_income: 47_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    is_pregnant_for_medicaid: false
    is_medicaid_eligible: false
    is_chip_eligible_standard_pregnant_person: true

# 210-RICR-30-00-1 § 1.6(A)(2)(a)(2) covers pregnant applicants with
# https://rules.sos.ri.gov/regulations/part/210-30-00-1
# third-party insurance through the upper 253% standard (258% with the
# disregard). Employer, individual and Medicare/military coverage are
# independent of Medicaid enrollment, so the eligibility calculation must
# also work without a circular dependency on medicaid_enrolled.
- name: Case 17, Rhode Island pregnancy Medicaid covers applicants with each modeled third-party insurance source.
  period: 2024
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        has_esi: true
      person2:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        has_marketplace_health_coverage_at_interview: true
      person3:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        has_non_marketplace_direct_purchase_health_coverage_at_interview: true
      person4:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        medicare_enrolled: true
      person5:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        has_tricare_health_coverage_at_interview: true
      person6:
        age: 30
        is_pregnant: true
        immigration_status: CITIZEN
        medicaid_household_size: 2
        medicaid_income_level: 2.3
        has_champva_health_coverage_at_interview: true
    households:
      household:
        members: [person1, person2, person3, person4, person5, person6]
        state_code: RI
  output:
    is_pregnant_for_medicaid: [true, true, true, true, true, true]
    is_medicaid_eligible: [true, true, true, true, true, true]
    is_chip_eligible_standard_pregnant_person: [false, false, false, false, false, false]

# The ordinary standard is 190% plus the five-point disregard; the insured
