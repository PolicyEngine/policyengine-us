# The 200% standard (SPA NV-25-0006) takes effect 2025-07-01; the
# YEAR-defined variable resolves the January value for 2025.
- name: Pregnancy above the pre-July FPL limit confers ineligibility in NV
  period: 2025
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 1.95
  output:
    is_pregnant_for_medicaid: false

- name: Pregnancy under the pre-July FPL limit confers eligibility in NV
  period: 2025
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 1.89
  output:
    is_pregnant_for_medicaid: true

- name: Pregnancy and just under updated FPL limit confers eligibility in NV
  period: 2026
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 2.0499
  output:
