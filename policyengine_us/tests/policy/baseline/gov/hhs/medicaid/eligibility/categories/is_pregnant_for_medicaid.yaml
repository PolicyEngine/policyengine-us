# continuation period and the November 2022 pregnancies have expired.
# Pregnancy Medicaid requires a qualifying immigration status, so the
# undocumented parents had unborn-child CHIP (FCEP) coverage while pregnant
# (210-RICR-30-00-1 § 1.6(A)(2)(a)). Their continuation is state-funded.
- name: Case 38, Rhode Island citizen and undocumented postpartum parents receive coverage within the extended period.
  period: 2024
  input:
    people:
      person1:
        age: 30
        is_pregnant: false
        immigration_status: CITIZEN
        count_days_postpartum: 300
        ri_pregnancy_coverage: MEDICAID
        ri_medicaid_pregnancy_end_date: "2023-03-07"
        medicaid_household_size: 2
        medicaid_income_level: 2.3
      person2:
        age: 30
        is_pregnant: false
        immigration_status: CITIZEN
        count_days_postpartum: 400
        ri_pregnancy_coverage: MEDICAID
        ri_medicaid_pregnancy_end_date: "2022-11-27"
        medicaid_household_size: 2
