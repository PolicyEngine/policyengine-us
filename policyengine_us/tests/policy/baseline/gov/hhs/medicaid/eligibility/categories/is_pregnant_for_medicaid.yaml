    is_pregnant: true
    medicaid_income_level: 2.06
  output:
    is_pregnant_for_medicaid: false

# Missouri applies the MPW limit (196% FPL plus the 5% disregard) as the
# Appendix A monthly-dollar maximum, rounded up to the next whole dollar.
# The unborn child counts in the applicant's household, so a pregnant
# person living alone is a household of 2 in 2026:
# 21,640 x 2.01 / 12 = 3,624.67 -> $3,625.
- name: MO pregnant person at exactly the Appendix A $3,625 monthly maximum, eligible although the exact ratio is 2.0102
  period: 2026
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        employment_income: 43_500
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    medicaid_household_size: 2
    is_pregnant_for_medicaid_fc: true
    is_pregnant_for_medicaid: true

- name: MO pregnant person $1 above the Appendix A monthly maximum ($3,626), ineligible
  period: 2026
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        employment_income: 43_512
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    is_pregnant_for_medicaid_fc: false
    is_pregnant_for_medicaid: false

# 42 USC 1396a(e)(16) lets a state cover pregnant people through the month in
# which a 12-month postpartum period ends. count_days_postpartum maps
# under_12_months_postpartum to 60 days, which is below the 365-day parameter
# value of electing states. Texas elects the option through SPA TX-23-0028
# from 2024-03-01; this YEAR-defined variable reads the parameter on January 1,
# so annual 2024 still applies the 60-day rule.
- name: TX mother between 60 days and 12 months postpartum is not covered as pregnant in annual 2024, before the March 2024 election
  period: 2024
  input:
    people:
      person1:
        age: 28
        employment_income: 20_000
        under_12_months_postpartum: true
      person2:
        age: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    is_pregnant_for_medicaid_nfc: [false, false]
    is_pregnant_for_medicaid: [false, false]

- name: TX mother between 60 days and 12 months postpartum is covered as pregnant in 2025 under SPA TX-23-0028
  period: 2025
  input:
    people:
      person1:
        age: 28
        employment_income: 20_000
        under_12_months_postpartum: true
      person2:
        age: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    is_pregnant_for_medicaid_nfc: [true, false]
    is_pregnant_for_medicaid: [true, false]

# Coverage runs while count_days_postpartum is below 365 in an electing state.
- name: CA postpartum coverage holds at 364 days and stops at 365 days under SPA CA-22-0030
  period: 2023
  input:
    people:
      person1:
        count_days_postpartum: 364
        medicaid_income_level: 1
      person2:
        count_days_postpartum: 365
        medicaid_income_level: 1
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    spm_units:
      spm_unit1:
        members: [person1]
      spm_unit2:
        members: [person2]
    families:
      family1:
        members: [person1]
      family2:
        members: [person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household1:
        members: [person1]
        state_code: CA
      household2:
        members: [person2]
        state_code: CA
  output:
    is_pregnant_for_medicaid: [true, false]

