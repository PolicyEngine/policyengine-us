  period: 2024
  input:
    people:
      person1:
        age: 30
        is_pregnant: true
        medicaid_household_size: 2
        medicaid_income_level: 1.95
      person2:
        age: 30
        is_pregnant: true
        medicaid_household_size: 2
        medicaid_income_level: 1.96
      person3:
        age: 30
        is_pregnant: true
        has_esi: true
        medicaid_household_size: 2
        medicaid_income_level: 2.58
      person4:
        age: 30
        is_pregnant: true
        has_esi: true
        medicaid_household_size: 2
        medicaid_income_level: 2.59
      person5:
        age: 30
        is_pregnant: false
        has_esi: true
        medicaid_household_size: 2
        medicaid_income_level: 2.3
      person6:
        age: 30
        is_pregnant: true
        has_esi: true
        medicaid_household_size: 2
        medicaid_income_level: 2.3
    households:
      household1:
        members: [person1, person2, person3, person4, person5]
