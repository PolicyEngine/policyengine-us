# The YEAR-defined formula reads January 1, so the October 2022 extension
# is reflected in 2023 annual results. The parameter retains its legal date.
- name: Case 39, Rhode Island annual postpartum eligibility reflects the October 2022 extension in 2023.
  period: 2023
  input:
    state_code:
      2022: RI
      2023: RI
    count_days_postpartum:
      2022: 90
      2023: 90
    ri_pregnancy_coverage:
      2022: MEDICAID
      2023: MEDICAID
    ri_medicaid_pregnancy_end_date:
      2022: "2021-10-03"
      2023: "2022-10-03"
    medicaid_household_size:
      2022: 2
      2023: 2
    medicaid_income_level:
      2022: 2.3
      2023: 2.3
  output:
    is_pregnant_for_medicaid:
      2022: false
      2023: true

# The state-funded postpartum continuation does not change the citizenship
# rules for someone seeking Medicaid during pregnancy. An undocumented
# pregnant applicant instead has the existing unborn-child CHIP pathway.
- name: Case 40, Rhode Island state-funded postpartum coverage does not bypass pregnancy immigration requirements.
  period: 2024
  input:
    state_code: RI
    age: 30
    is_pregnant: true
    immigration_status: UNDOCUMENTED
    medicaid_household_size: 2
    medicaid_income_level: 1.8
  output:
    is_pregnant_for_medicaid: true
    is_medicaid_eligible: false
    is_chip_eligible_standard_pregnant_person: false
    is_chip_fcep_eligible_person: true
