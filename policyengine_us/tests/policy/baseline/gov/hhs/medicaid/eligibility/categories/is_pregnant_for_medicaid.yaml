# The state-funded postpartum continuation does not change the citizenship
# rules for someone seeking Medicaid during pregnancy. An undocumented
# pregnant applicant instead has the existing unborn-child CHIP pathway.
- name: Case 21, Rhode Island state-funded postpartum coverage does not bypass pregnancy immigration requirements.
  period: 2024
  input:
    state_code: RI
    age: 30
    is_pregnant: true
    immigration_status: UNDOCUMENTED
    medicaid_household_size: 2
    medicaid_income_level: 1.8
  output:
    is_pregnant_for_medicaid: true
    is_medicaid_eligible: false
    is_chip_eligible_standard_pregnant_person: false
