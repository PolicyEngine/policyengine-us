- name: Pregnancy and under FPL limit confers eligibility in CA
  period: 2022
  input:
    is_pregnant: true
    medicaid_income_level: 2.12
  output:
    is_pregnant_for_medicaid: true

- name: Pregnancy and over FPL limit confers ineligibility in CA
  period: 2022
  input:
    is_pregnant: true
    medicaid_income_level: 2.13
  output:
    is_pregnant_for_medicaid: false

- name: Under FPL limit, 59 days postpartum, eligible in CA.
  period: 2022
  input:
    medicaid_income_level: 2.12
    count_days_postpartum: 59
  output:
    is_pregnant_for_medicaid: true

- name: Under FPL limit, 60 days postpartum, ineligible in CA.
  period: 2022
  input:
    medicaid_income_level: 2.12
    count_days_postpartum: 60
  output:
    is_pregnant_for_medicaid: false

# The 200% standard (SPA NV-25-0006) takes effect 2025-07-01; the
# YEAR-defined variable resolves the January value for 2025.
- name: Pregnancy above the pre-July FPL limit confers ineligibility in NV
  period: 2025
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 1.95
  output:
    is_pregnant_for_medicaid: false

- name: Pregnancy under the pre-July FPL limit confers eligibility in NV
  period: 2025
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 1.89
  output:
    is_pregnant_for_medicaid: true

- name: Pregnancy and just under updated FPL limit confers eligibility in NV
  period: 2026
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 2.0499
  output:
    is_pregnant_for_medicaid: true

# Exactly at the limit is ineligible under the strict-less-than financial test.
# medicaid_income_level is float32, so 2.0500001 is the closest YAML input
# that remains on the ineligible side of the 2.05 parameter.
- name: Pregnancy at the updated FPL limit confers ineligibility in NV
  period: 2026
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 2.0500001
  output:
    is_pregnant_for_medicaid: false

- name: Pregnancy and just over updated FPL limit confers ineligibility in NV
  period: 2026
  input:
    state_code: NV
    is_pregnant: true
    medicaid_income_level: 2.06
  output:
    is_pregnant_for_medicaid: false
