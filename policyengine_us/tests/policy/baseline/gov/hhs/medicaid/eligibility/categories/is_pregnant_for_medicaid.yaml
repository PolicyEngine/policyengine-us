# The YEAR-defined formula reads January 1, so the October 2022 extension
# is reflected in 2023 annual results. The parameter retains its legal date.
- name: Case 20, Rhode Island annual postpartum eligibility reflects the October 2022 extension in 2023.
  period: 2023
  input:
    state_code:
      2022: RI
      2023: RI
    count_days_postpartum:
      2022: 90
      2023: 90
    ri_pregnancy_coverage:
      2022: MEDICAID
      2023: MEDICAID
    ri_medicaid_pregnancy_end_date:
      2022: "2021-10-03"
