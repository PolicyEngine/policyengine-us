- name: Case 12, New York senior with resources exactly at each year's level qualifies.
  period: 2026
  input:
    people:
      person1:
        age: {2022: 70, 2023: 71, 2024: 72, 2025: 73, 2026: 74}
        is_adult_for_medicaid: {2022: false, 2023: false, 2024: false, 2025: false, 2026: false}
        is_optional_senior_or_disabled_for_medicaid: {2022: false, 2023: false, 2024: false, 2025: false, 2026: false}
        is_ssi_recipient_for_medicaid: {2022: false, 2023: false, 2024: false, 2025: false, 2026: false}
        ssi_countable_income: {2022: 25_000, 2023: 25_000, 2024: 25_000, 2025: 25_000, 2026: 25_000}
        medicaid_medically_needy_medical_expenses: {2022: 15_000, 2023: 5_000, 2024: 5_000, 2025: 5_000, 2026: 5_000}
        ssi_countable_resources: {2022: 16_800, 2023: 30_182, 2024: 31_175, 2025: 32_396, 2026: 33_038}
    households:
      household:
        members: [person1]
        state_code: {2022: NY, 2023: NY, 2024: NY, 2025: NY, 2026: NY}
  output:
    # 2022: 25,000 - 15,000 = 10,000 <= 934 x 12 = 11,208.
    # 2023-2026: 20,000 <= 1.38 x FPG (20,120.40, 20,782.80, 21,597, 22,024.80).
    # Resources equal each year's level (GIS 22 MA/11 p2; the 2023-2026 GIS
    # attachments).
    is_medically_needy_for_medicaid:
      2022: true
      2023: true
      2024: true
      2025: true
      2026: true

