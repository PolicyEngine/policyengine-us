    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    is_ssi_recipient_for_medicaid: false
    ssi_countable_income: 18_000
    medicaid_medically_needy_medical_expenses: 14_000
    ssi_countable_resources: 4_000
    state_code: NJ
  output:
    # 18,000 is over NJ's 100% FPL optional limit (15,960) and the SSI rate (11,928).
    # Limit 367 x 12 = 4,404; 18,000 - 14,000 = 4,000. Assets 4,000 equal the limit.
    is_in_medicaid_medically_needy_category: true
    is_medically_needy_for_medicaid: true

