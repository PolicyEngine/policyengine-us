# ND 510-05-85-40 publishes $1,174 per month from April 1, 2025,
# and $1,197 from April 1, 2026. Calendar-year calculations read the
# standard at January 1; a rolling year beginning in April reads the update.
- name: Case 3, North Dakota calendar 2026 retains the previous April individual standard.
  period: 2026
  input:
    age: 70
    state_code: ND
    ssi: 0
    receives_ssi: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 14_088
  output:
    is_medically_needy_for_medicaid: true

- name: Case 4, North Dakota calendar 2026 excludes income above the previous April individual standard.
  period: 2026
  input:
    age: 70
    state_code: ND
    ssi: 0
    receives_ssi: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 14_089
  output:
    is_medically_needy_for_medicaid: false

