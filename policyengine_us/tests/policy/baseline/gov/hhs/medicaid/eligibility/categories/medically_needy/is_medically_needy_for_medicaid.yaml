    is_medically_needy_for_medicaid: [false, false, false]

- name: Case 9, a parent's medical expenses reduce a disabled child's countable income.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
        medicaid_medically_needy_medical_expenses: 8_000
      person2:
        age: 38
        is_tax_unit_spouse: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
      person3:
        age: 10
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        ssi_countable_income: 21_358
        medicaid_medically_needy_medical_expenses: 10_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
  output:
    # 42 CFR 435.831(d): 21,358 - (10,000 own + 8,000 parent's) = 3,358
    # <= 522 x 12 = 6,264. Resources: nothing deemed (2,400 < 3,000).
    is_medically_needy_for_medicaid: [false, false, true]

- name: Case 10, blind adult under 65 who is not SSI-disabled qualifies after spenddown.
  period: 2026
  input:
    age: 40
    is_blind: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 12_000
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    # 12,000 - 6,000 = 6,000 <= 6,264; resources 1,000 <= 2,000.
    is_in_medicaid_medically_needy_category: true
    is_medically_needy_for_medicaid: true
