- name: MA, 2 people, under asset and income limits and seniors but qualifies as senior (medicaidscreener.com)
  period: 2022
  input:
    people:
      person_1:
        age: 77
        employment_income: 200
        ssi_countable_resources: 1_000
        other_medical_expenses: 500
      person_2:
        age: 66
        employment_income: 100
        ssi_countable_resources: 800
    tax_units:
      tax_unit:
        members: [person_1, person_2]
    households:
      household:
        members: [person_1, person_2]
        state_code: MA
  output:
    is_medically_needy_for_medicaid: false

- name: Case 1, disabled person qualifies after medical spenddown.
  period: 2026
  input:
    is_disabled: true
    meets_ssi_disability_criteria: true
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 12_000
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    is_medically_needy_for_medicaid: true

- name: Case 2, disabled person above spenddown income limit is ineligible.
  period: 2026
  input:
    is_disabled: true
    meets_ssi_disability_criteria: true
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 13_000
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    is_medically_needy_for_medicaid: false

- name: Case 3, aged permanent resident without 40 SSI quarters has pension counted.
  period: 2026
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 10
    ssi_qualifying_quarters_earnings: 20
    pension_income: 60_000
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    # 60,000 - 20 x 12 = 59,760; 59,760 - 6,000 = 53,760 > 522 x 12 = 6,264.
    is_medically_needy_for_medicaid: false

- name: Case 4, aged permanent resident without 40 SSI quarters qualifies after medical spenddown.
  period: 2026
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 10
    ssi_qualifying_quarters_earnings: 20
    pension_income: 18_000
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    medicaid_medically_needy_medical_expenses: 12_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    # 18,000 - 20 x 12 = 17,760; 17,760 - 12,000 = 5,760 <= 522 x 12 = 6,264.
    is_medically_needy_for_medicaid: true
