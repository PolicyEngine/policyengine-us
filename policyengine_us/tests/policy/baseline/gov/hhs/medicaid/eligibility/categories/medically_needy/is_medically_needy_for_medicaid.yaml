- name: Case 13, an aged noncitizen dependent parent's pension does not count against the head.
  period: 2026
  input:
    people:
      head:
        age: 70
        immigration_status: CITIZEN
        pension_income: 20_000
        medicaid_medically_needy_medical_expenses: 15_000
        ssi_countable_resources: 1_000
        is_in_medicaid_medically_needy_category: true
        is_optional_senior_or_disabled_for_medicaid: false
      parent:
        age: 90
        is_tax_unit_dependent: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 20
        pension_income: 30_000
        ssi_countable_resources: 0
    tax_units:
      tax_unit:
        members: [head, parent]
    marital_units:
      head_unit:
        members: [head]
      parent_unit:
        members: [parent]
    households:
      household:
        members: [head, parent]
        state_code: MA
  output:
    # The parent's 30,000 - 240 = 29,760 now counts (this PR), but a parent's
    # income is never deemed to an adult child aged 70 (42 CFR
    # 435.602(a)(2)(i)). The head: 20,000 - 240 - 15,000 = 4,760 <= 522 x 12
    # = 6,264.
    ssi_countable_income: [19_760, 29_760]
    is_medically_needy_for_medicaid: [true, false]

