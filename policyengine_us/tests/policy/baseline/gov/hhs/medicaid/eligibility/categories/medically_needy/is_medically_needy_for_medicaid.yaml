- name: Case 8, California senior with assets exactly at the reinstated 2026 limit qualifies.
  period: 2026
  input:
    age: 70
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    is_ssi_recipient_for_medicaid: false
    ssi_countable_income: 26_400
    medicaid_medically_needy_medical_expenses: 19_500
    ssi_countable_resources: 130_000
    state_code: CA
  output:
    # 26,400 is over the Aged and Disabled FPL limit (138% FPL, 22,024.80) and the
    # SSI and SSP payment level. Limit 600 x 12 = 7,200; 26,400 - 19,500 = 6,900.
    # Assets equal the 130,000 limit.
    is_in_medicaid_medically_needy_category: true
    is_medically_needy_for_medicaid: true

