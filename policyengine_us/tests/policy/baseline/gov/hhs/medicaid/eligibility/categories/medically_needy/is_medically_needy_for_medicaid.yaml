- name: Case 3, Arkansas senior qualifies after medical spenddown.
  period: 2026
  input:
    age: 70
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    is_ssi_recipient_for_medicaid: false
    ssi_countable_income: 14_160
    medicaid_medically_needy_medical_expenses: 13_000
    ssi_countable_resources: 1_500
    state_code: AR
  output:
    # Limit 108 x 12 = 1,296. 14,160 is over it; 14,160 - 13,000 = 1,160 is not.
    is_in_medicaid_medically_needy_category: true
    is_medically_needy_for_medicaid: true

