# The April 2026 couple standard is $1,623 per month, or $19,476 annually.
- name: Case 7, North Dakota couple at the April 2026 medically needy standard qualifies.
  period: year:2026-04
  input:
    people:
      person1:
        age: 70
        ssi: 0
        receives_ssi: false
        is_optional_senior_or_disabled_for_medicaid: false
        ssi_countable_income: 9_738
      person2:
        age: 68
        ssi: 0
        receives_ssi: false
        is_optional_senior_or_disabled_for_medicaid: false
        ssi_countable_income: 9_738
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_is_joint: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: ND
  output:
    is_medically_needy_for_medicaid: [true, true]

