- name: MA, 2 people, under asset and income limits and seniors but qualifies as senior (medicaidscreener.com)
  period: 2022
  input:
    people:
      person_1:
        age: 77
        employment_income: 200
        ssi_countable_resources: 1_000
        other_medical_expenses: 500
      person_2:
        age: 66
        employment_income: 100
        ssi_countable_resources: 800
    tax_units:
      tax_unit:
        members: [person_1, person_2]
    households:
      household:
        members: [person_1, person_2]
        state_code: MA
  output:
    is_medically_needy_for_medicaid: false

- name: Case 1, disabled person qualifies after medical spenddown.
  period: 2026
  input:
    is_disabled: true
    meets_ssi_disability_criteria: true
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 12_000
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    is_medically_needy_for_medicaid: true

- name: Case 2, disabled person above spenddown income limit is ineligible.
  period: 2026
  input:
    is_disabled: true
    meets_ssi_disability_criteria: true
    is_in_medicaid_medically_needy_category: true
    is_adult_for_medicaid: false
    is_optional_senior_or_disabled_for_medicaid: false
    ssi_countable_income: 13_000
    medicaid_medically_needy_medical_expenses: 6_000
    ssi_countable_resources: 1_000
    state_code: MA
  output:
    is_medically_needy_for_medicaid: false

- name: Case 3, aged parent claimed as a tax dependent does not add income or resources to the filer's test.
  period: 2026
  input:
    people:
      person1:
        age: 70
        # $18,000 Social Security - $240 general exclusion.
        ssi_countable_income: 17_760
        medicaid_medically_needy_medical_expenses: 13_000
        ssi_countable_resources: 500
        is_optional_senior_or_disabled_for_medicaid: false
      person2:
        age: 92
        is_tax_unit_dependent: true
        # $4,000 pension - $240 general exclusion.
        ssi_countable_income: 3_760
        ssi_countable_resources: 1_800
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    # person1: 17,760 - 13,000 = 4,760 <= 522 x 12 = 6,264; resources 500 <= 2,000.
    # Summing over the tax unit would give 8,520 and 2,300, both over the limits.
    # person2 receives SSI (3,760 < 994 x 12), so is covered through SSI instead.
    is_medically_needy_for_medicaid: [true, false]

- name: Case 4, married couple filing separately is tested on combined income against the couple limit.
  period: 2026
  input:
    people:
      person1:
        age: 68
        # Couple's $26,400 Social Security - $240 general exclusion, split
        # equally between the two aged spouses.
        ssi_countable_income: 13_080
        medicaid_medically_needy_medical_expenses: 8_000
        ssi_countable_resources: 1_000
        is_optional_senior_or_disabled_for_medicaid: false
      person2:
        age: 66
        ssi_countable_income: 13_080
        medicaid_medically_needy_medical_expenses: 8_000
        ssi_countable_resources: 1_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    # 2 x (13,080 - 8,000) = 10,160 > 650 x 12 = 7,800.
    # Each spouse alone would pass the individual limit: 5,080 <= 6,264.
    is_medically_needy_for_medicaid: [false, false]

- name: Case 5, disabled child's resource test counts the parents' savings above the SSI couple allowance.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 10_000
      person2:
        age: 38
        is_tax_unit_spouse: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 10_000
      person3:
        age: 10
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        # Parents' $6,666.67 monthly wages deemed to the child (20 CFR 416.1165):
        # (6,666.67 - 20 - 65) / 2 - 1,491 couple allowance = 1,799.83, less
        # the child's $20 general exclusion = 1,779.83 a month.
        ssi_countable_income: 21_358
        medicaid_medically_needy_medical_expenses: 16_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
  output:
    # person3: income 21,358 - 16,000 = 5,358 <= 522 x 12 = 6,264, but resources
    # 0 + (20,000 - 3,000 two-parent allowance) = 17,000 > 2,000 (20 CFR 416.1202(b)).
    is_medically_needy_for_medicaid: [false, false, false]

- name: Case 6, disabled child qualifies when the parents' savings are within the SSI couple allowance.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
      person2:
        age: 38
        is_tax_unit_spouse: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
      person3:
        age: 10
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        # Deemed parental income as in Case 5.
        ssi_countable_income: 21_358
        medicaid_medically_needy_medical_expenses: 16_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MA
  output:
    # person3: income 5,358 <= 6,264; resources 0 + max(2,400 - 3,000, 0) = 0 <= 2,000.
    # Counting the parents' full 2,400 would exceed the child's 2,000 limit.
    is_medically_needy_for_medicaid: [false, false, true]

- name: Case 7, married couple filing separately qualifies on the couple limit when combined net income is between the two limits.
  period: 2026
  input:
    people:
      person1:
        age: 68
        ssi_countable_income: 10_000
        medicaid_medically_needy_medical_expenses: 6_500
        ssi_countable_resources: 1_000
        is_optional_senior_or_disabled_for_medicaid: false
      person2:
        age: 66
        ssi_countable_income: 10_000
        medicaid_medically_needy_medical_expenses: 6_500
        ssi_countable_resources: 1_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit1:
        members: [person1]
      tax_unit2:
        members: [person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MA
  output:
    # 2 x (10,000 - 6,500) = 7,000: above 6,264, at or below 7,800.
    is_medically_needy_for_medicaid: [true, true]

- name: Case 8, disabled child in a joint tax unit is tested against the individual limit.
  period: 2026
  input:
    people:
      person1:
        age: 40
        is_tax_unit_head: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
      person2:
        age: 38
        is_tax_unit_spouse: true
        is_parent: true
        employment_income_before_lsr: 40_000
        ssi_countable_resources: 1_200
      person3:
        age: 10
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        ssi_countable_income: 21_358
        medicaid_medically_needy_medical_expenses: 15_000
        is_optional_senior_or_disabled_for_medicaid: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
