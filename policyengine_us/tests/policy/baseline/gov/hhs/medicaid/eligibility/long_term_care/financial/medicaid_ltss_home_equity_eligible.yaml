        is_ssi_aged_blind_disabled:
          2026: true
        medicaid_ltss_waiver: NONE
        medicaid_ltss_assistance_unit_size: 1
        medicaid_ltss_home_market_value: 752_001
        medicaid_ltss_home_encumbrances: 0
        medicaid_ltss_home_ownership_share: 1
    tax_units:
      below_tax_unit:
        members: [below]
      at_tax_unit:
        members: [at]
      above_tax_unit:
        members: [above]
    families:
      below_family:
        members: [below]
