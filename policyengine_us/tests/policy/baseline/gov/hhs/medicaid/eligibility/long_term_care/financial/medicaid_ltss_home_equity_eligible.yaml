        members: [at]
      above_spm_unit:
        members: [above]
    marital_units:
      below_marital_unit:
        members: [below]
      at_marital_unit:
        members: [at]
      above_marital_unit:
        members: [above]
    households:
      below_household:
        members: [below]
        state_code:
          2026: TX
      at_household:
        members: [at]
        state_code:
          2026: TX
      above_household:
        members: [above]
        state_code:
          2026: TX
