# Adult limit 138% FPL in CA, MO and OH, household of 3 in 2026 (FPG 15,960 +
# 2 x 5,680 = 27,320): 27,320 x 1.38 / 12 = 3,141.80 -> $3,142 -> 37,704/yr;
# 37,710 is $0.50 per month above that ceiling.
- name: mixed states all reject income above the same modeled monthly ceiling.
  period: 2026
  input:
    people:
      ca_adult:
        medicaid_household_size: 3
        medicaid_household_income: 37710
      mo_adult:
        medicaid_household_size: 3
        medicaid_household_income: 37710
      oh_adult:
        medicaid_household_size: 3
        medicaid_household_income: 37710
    households:
      ca_household:
        members: [ca_adult]
        state_code: CA
      mo_household:
        members: [mo_adult]
        state_code: MO
      oh_household:
        members: [oh_adult]
        state_code: OH
  output:
    is_adult_for_medicaid_fc: [false, false, false]
    is_young_adult_for_medicaid_fc: [false, false, false]

