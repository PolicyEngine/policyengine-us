# ACWDL 26-01 Enclosure 1 (2026 monthly FPL chart) publishes $4,799 for 266%
# FPL at household size 2 because DHCS rounds the monthly FPG before
# multiplying. The modeled ceiling is ceil(round(21,640 x 2.66 / 12, 2)) =
# ceil(4,796.87) = $4,797 -> 57,564/yr, so income at the published
# $4,799 x 12 = 57,588 is modeled ineligible. This pins the disclosed
# rounding-order approximation so any change to it is deliberate.
# https://www.dhcs.ca.gov/services/medi-cal-resources/medi-cal-eligibility-division/all-county-welfare-directors-medi-cal-eligibility-division-information-letters/2026-fpl-calculation-chart-monthly-values-enclosure-1/
- name: CA at the published ACWDL 26-01 4,799 monthly limit in 2026 is modeled ineligible.
  period: 2026
  input:
    state_code: CA
    medicaid_household_size: 2
    medicaid_household_income: 57_588
  output:
    is_older_child_for_medicaid_fc: false

# Territories carry a zero federal poverty guideline in gov/hhs/fpg.yaml and
# have no row in the category income-limit tables, so the effective limit is
# undefined (NaN) and the inclusive comparison is false rather than an error.
- name: PR territory with a zero FPG is gracefully ineligible in 2026.
  period: 2026
  input:
    state_code: PR
    medicaid_household_size: 2
    medicaid_household_income: 10_000
  output:
    is_older_child_for_medicaid_fc: false
    is_young_child_for_medicaid_fc: false

# Zero income is a ratio of 0, at or below any finite ceiling: CA young child
# at size 1 in 2026, 15,960 x 2.66 / 12 = 3,537.80 -> $3,538 -> 42,456/yr.
- name: CA young child with zero income is eligible in 2026.
  period: 2026
  input:
    state_code: CA
    medicaid_household_size: 1
    medicaid_household_income: 0
  output:
    is_young_child_for_medicaid_fc: true

