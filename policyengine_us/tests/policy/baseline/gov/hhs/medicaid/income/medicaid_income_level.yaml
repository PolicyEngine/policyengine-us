# Monthly ceiling rounding belongs in eligibility tests, not applicant income.
- name: Case 5, Missouri retains the actual income-to-FPG ratio.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 33_120
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    medicaid_household_size: [2, 2]
    medicaid_household_income: [33_120, 33_120]
    medicaid_income_level: [1.53049, 1.53049]
  absolute_error_margin: 0.00001

- name: Case 6, Kansas also retains the actual income-to-FPG ratio.
