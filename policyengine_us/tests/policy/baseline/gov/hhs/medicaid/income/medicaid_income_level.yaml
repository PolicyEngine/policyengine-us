- name: Case 3, a child living with both parents uses the non-filer household while parents still use their own tax households.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 12_000
        own_children_in_household: 1
      person2:
        age: 32
        employment_income: 8_000
        own_children_in_household: 1
      person3:
        age: 10
    tax_units:
      tax_unit1:
        members: [person1, person3]
        cohabitating_spouses: true
      tax_unit2:
        members: [person2]
        cohabitating_spouses: true
    households:
      household:
        members: [person1, person2, person3]
        state_group_str: CONTIGUOUS_US
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
  output:
    medicaid_uses_non_filer_rules: [false, false, true]
    medicaid_household_size: [3, 2, 3]
    medicaid_household_income: [20_000, 20_000, 20_000]
    medicaid_income_level: [0.774593, 0.978474, 0.774593]
  absolute_error_margin: 0.001

- name: Case 4, the pregnant applicant gets the pregnancy household-size adjustment but the spouse does not by default.
  period: 2024
  input:
    people:
      person1:
        age: 30
        employment_income: 25_820
        current_pregnancies: 1
      person2:
        age: 30
        employment_income: 0
        current_pregnancies: 0
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_group_str: CONTIGUOUS_US
    families:
      family:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    medicaid_household_size: [3, 2]
    medicaid_household_income: [25_820, 25_820]
    medicaid_income_level: [1, 1.262231]
    tax_unit_medicaid_income_level: 1
  absolute_error_margin: 0.001

# Monthly ceiling rounding belongs in eligibility tests, not applicant income.
- name: Case 5, Missouri retains the actual income-to-FPG ratio.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 33_120
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: MO
  output:
    medicaid_household_size: [2, 2]
    medicaid_household_income: [33_120, 33_120]
    medicaid_income_level: [1.53049, 1.53049]
  absolute_error_margin: 0.00001

- name: Case 6, Kansas also retains the actual income-to-FPG ratio.
  period: 2026
  input:
    people:
      person1:
        age: 30
        employment_income: 33_120
      person2:
        age: 5
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: KS
  output:
    medicaid_income_level: [1.53049, 1.53049]
  absolute_error_margin: 0.00001

# Shared eligibility comparisons use the unmodified income ratio and a monthly
# dollar ceiling, calculated uniformly as ceil(round(annual FPG * limit / 12, 2)).
# CA tables additionally round monthly FPG, so the modeled size-2 child ceiling
# below is $4,797 rather than the published $4,799. This is an approximation.
# Annual inputs at and just above each ceiling check eligibility independently
# of floating-point artifacts or a broad isclose tolerance.

- name: CA at the modeled 4,797 monthly limit in 2026.
  period: 2026
  input:
    state_code: CA
    medicaid_household_size: 2
    medicaid_household_income: 57564
  output:
    is_infant_for_medicaid_fc: true
    is_young_child_for_medicaid_fc: true
    is_older_child_for_medicaid_fc: true

- name: CA ten cents above the modeled 4,797 monthly limit in 2026.
  period: 2026
  input:
    state_code: CA
    medicaid_household_size: 2
    medicaid_household_income: 57565.2
  output:
    is_infant_for_medicaid_fc: false
    is_young_child_for_medicaid_fc: false
    is_older_child_for_medicaid_fc: false

