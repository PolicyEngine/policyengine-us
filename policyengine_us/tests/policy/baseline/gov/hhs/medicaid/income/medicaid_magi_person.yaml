- name: Case 1, each spouse's MAGI is their own AGI plus their own additions, unfloored.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 30_000
        tax_exempt_interest_income: 1_000
        is_tax_unit_head: true
      spouse:
        age: 40
        self_employment_income: -20_000
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [head, spouse]
        foreign_earned_income_exclusion: 4_000
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # The head's tax-exempt interest is the head's own. The foreign earned
    # income exclusion is recorded only for the tax unit, so it is divided
    # equally. Head: 30,000 + 1,000 + 2,000 = 33,000. Spouse: -20,000 + 2,000
    # = -18,000. They add up to the couple's MAGI, 10,000 + 1,000 + 4,000.
    medicaid_magi: 15_000
    medicaid_magi_person: [33_000, -18_000]
    medicaid_household_income: [15_000, 15_000]

- name: Case 2, a dependent's own tax-exempt interest is in the dependent's MAGI.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        employment_income: 40_000
        is_tax_unit_head: true
      child:
        age: 16
        employment_income: 16_000
        tax_exempt_interest_income: 500
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TX
  output:
    # The child's wages exceed the 15,000 standard deduction, so the child is
    # required to file and counts: 40,000 + 16,000 + 500.
    medicaid_magi_person: [40_000, 16_500]
    medicaid_household_income: [56_500, 56_500]
