# Medicaid MAGI household size (42 CFR 435.603(b) and (f)). Outside California
# a pregnant person counts herself plus her expected children only in her own
# household; California (DHCS ACWDL 20-10, page 3) counts the unborn children of
# every member of the applicant's MAGI household, see
# ca_medicaid_household_pregnancies.
- name: Case 1, Kansas joint filers with one child count the pregnancy only in the pregnant member's household.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
        current_pregnancies: 1
      person2:
        age: 35
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: KS
  output:
    # Tax household of 3; only person1 adds her 1 expected child.
    medicaid_household_size: [4, 3, 3]

- name: Case 2, California joint filers with one child count the pregnancy for every member.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 80_000
        current_pregnancies: 1
      person2:
        age: 35
      person3:
        age: 8
    families:
      family:
        members: [person1, person2, person3]
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    spm_units:
      spm_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    # Tax household of 3 plus the 1 expected child for all three members.
    ca_medicaid_household_pregnancies: [1, 1, 1]
    medicaid_household_size: [4, 4, 4]

- name: Case 3, Kansas single filer without a pregnancy is a household of one.
  period: 2025
  input:
    people:
      person1:
        age: 30
        employment_income: 30_000
    families:
      family:
        members: [person1]
    marital_units:
      marital_unit:
        members: [person1]
    tax_units:
      tax_unit:
        members: [person1]
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: KS
  output:
    medicaid_household_size: 1

# 42 CFR 435.603(f)(3): a non-filer's household is the individual and, if
# living with them, their spouse, their children under 19 and, for an
# individual under 19, their parents and siblings under 19. Each person counts
# once, even when they fit more than one of those groups, such as a spouse who
# is also under 19 or a parent who is also under 19. Without parent ids the
# parents and children come from the family (is_parent and age). Cases 4-11
# are the household examples in issue 9562.
- name: Case 4, non-filing adults and their child keep the ordinary household size.
  period: 2025
  input:
    people:
      person1:
        age: 35
      person2:
        age: 35
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true, false]
    # Each adult: self, spouse and child. The child: the tax household of 3.
    medicaid_household_size: [3, 3, 3]

- name: Case 5, filing adults and their child keep the ordinary household size.
  period: 2025
  input:
    people:
      person1:
        age: 35
        employment_income: 50_000
      person2:
        age: 35
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: true
    medicaid_uses_non_filer_rules: [false, false, false]
    medicaid_household_size: [3, 3, 3]

- name: Case 6, non-filing 18-year-old spouses without parent-count inputs are each counted once.
  period: 2025
  input:
    people:
      person1:
        age: 18
      person2:
        age: 18
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true, false]
    # Each spouse: self, spouse and child. Main also counted the spouse as a
    # family member under 19, giving 4.
    medicaid_household_size: [3, 3, 3]

- name: Case 7, filing 18-year-old spouses keep their tax household size.
  period: 2025
  input:
    people:
      person1:
        age: 18
        employment_income: 50_000
      person2:
        age: 18
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: true
    medicaid_uses_non_filer_rules: [false, false, false]
    medicaid_household_size: [3, 3, 3]

- name: Case 8, non-filing 18-year-old parents and their child are each counted once.
  period: 2025
  input:
    people:
      person1:
        age: 18
        own_children_in_household: 1
      person2:
        age: 18
        own_children_in_household: 1
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true, false]
    # Each parent: self, spouse and child. Main gave 6: the spouse, both
    # parents and the three people under 19.
    medicaid_household_size: [3, 3, 3]

- name: Case 9, non-filing 18-year-old parents add an expected child after counting members once.
  period: 2025
  input:
    people:
      person1:
        age: 18
        own_children_in_household: 1
      person2:
        age: 18
        own_children_in_household: 1
        current_pregnancies: 1
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true, false]
    # Case 8's 3 members plus the 1 expected child, which California counts in
    # every member's household (ca_medicaid_household_pregnancies).
    medicaid_household_size: [4, 4, 4]

- name: Case 10, a non-filing adult and an 18-year-old spouse are each counted once.
  period: 2025
  input:
    people:
      person1:
        age: 35
        own_children_in_household: 1
      person2:
        age: 18
        own_children_in_household: 1
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_size: 3
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true, false]
    # Each parent: self, spouse and child. Main gave the adult 4 (the spouse
    # again as a member under 19) and the 18-year-old 5.
    medicaid_household_size: [3, 3, 3]

- name: Case 11, non-filing 18-year-old spouses on separate tax returns are each counted once.
  period: 2025
  input:
    people:
      person1:
        age: 18
        own_children_in_household: 1
      person2:
        age: 18
        own_children_in_household: 1
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    tax_units:
      tax_unit1:
        members: [person1, person3]
        cohabitating_spouses: true
      tax_unit2:
        members: [person2]
        cohabitating_spouses: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    tax_unit_is_filer: [false, false]
    # The cohabiting spouse on the other return is the spouse (42 CFR
    # 435.603(f)(4)), counted once with the child.
    medicaid_household_size: [3, 3, 3]

# A Household API partner reported this household (issue 9562): a New Jersey
# parent and an 18-year-old child with no relationship or tax-role inputs.
- name: Case 12, a New Jersey parent and an 18-year-old with no role inputs are a household of two.
  period: 2026
  input:
    people:
      person1:
        age: 45
        employment_income: 31_000
      person2:
        age: 18
    households:
      household:
        members: [person1, person2]
        state_code: NJ
  output:
    # The model builds the omitted marital units by the tax-role rules: the
    # 18-year-old, under 19 and younger than the parent, gets their own and is
    # the parent's dependent. $31,000 is above the head of household filing
    # threshold, so both use the parent's tax household of 2 (42 CFR
    # 435.603(f)(1)-(2)). Before those units were built, the model took the
    # 18-year-old as the spouse, and the non-filer rules counted them twice,
    # giving the parent 3.
    medicaid_uses_non_filer_rules: [false, false]
    medicaid_household_size: [2, 2]

- name: Case 13, an 18-year-old in the spouse role on a head of household return counts once as the parent's child.
  period: 2026
  input:
    people:
      person1:
        age: 45
        own_children_in_household: 1
        is_tax_unit_head: true
      person2:
        age: 18
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person1, person2]
        filing_status: HEAD_OF_HOUSEHOLD
    households:
      household:
        members: [person1, person2]
        state_code: NJ
  output:
    # The 18-year-old is input as the tax unit spouse, but the supplied filing
    # status isn't joint, so neither is counted as the other's spouse. With no
    # income neither files. The 18-year-old is the parent's
    # child under 19 (435.603(f)(3)(ii)) and the parent is the 18-year-old's
    # parent ((f)(3)(iii)).
    is_tax_unit_spouse: [false, true]
    tax_unit_is_filer: false
    medicaid_uses_non_filer_rules: [true, true]
    medicaid_household_size: [2, 2]

- name: Case 14, a marital unit that also lists the child leaves the cohabiting spouse unidentified and counts each member once.
  period: 2025
  input:
    people:
      person1:
        age: 35
        own_children_in_household: 1
      person2:
        age: 35
        own_children_in_household: 1
      person3:
        age: 1
    marital_units:
      marital_unit:
        members: [person1, person2, person3]
    tax_units:
      tax_unit1:
        members: [person1, person3]
        cohabitating_spouses: true
      tax_unit2:
        members: [person2]
        cohabitating_spouses: true
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    # A parent's separate-return spouse is the other member of their marital
    # unit, which here also lists the child, so no member is identified as the
    # spouse. Each parent counts self, the cohabiting spouse once through the
    # spouse count, and the child once as a member under 19. Taking the last
    # member as the spouse would drop the child and give each parent 2. The
    # child, claimed by one parent while living with both, uses the non-filer
    # rules: self and both parents.
    medicaid_uses_non_filer_rules: [true, true, true]
    medicaid_household_size: [3, 3, 3]
