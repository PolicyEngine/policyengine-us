        age: 1
    marital_units:
      couple:
        members:
        - parent1
        - parent2
      child_unit:
        members:
        - child
    tax_units:
      return1:
        members:
        - parent1
        - child
        cohabitating_spouses: true
      return2:
        members:
        - parent2
        cohabitating_spouses: true
    households:
      household:
        members:
        - parent1
        - parent2
        - child
        state_code: CA
  output:
    tax_unit_is_filer:
    - false
    - false
    medicaid_household_size:
    - 3
    - 3
    - 3
