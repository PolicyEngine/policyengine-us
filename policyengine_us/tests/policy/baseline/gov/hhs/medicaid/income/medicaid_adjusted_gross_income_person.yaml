- name: Case 1, single filer subtracts person and shared above-the-line deductions.
  period: 2024
  input:
    people:
      person1:
        is_tax_unit_head: true
        medicaid_irs_gross_income: 50_000
        self_employment_tax_ald_person: 1_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        puerto_rico_income: 2_000
  output:
    medicaid_adjusted_gross_income_person: 47_000
  absolute_error_margin: 0.01

- name: Case 2, joint filers split shared deductions and taxable basic income.
  period: 2024
  input:
    gov.contrib.ubi_center.basic_income.taxable: true
    people:
      person1:
        is_tax_unit_head: true
        medicaid_irs_gross_income: 60_000
      person2:
        is_tax_unit_spouse: true
        medicaid_irs_gross_income: 40_000
      person3:
        is_tax_unit_dependent: true
        medicaid_irs_gross_income: 5_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
        filing_status: JOINT
        basic_income: 900
        puerto_rico_income: 2_000
  output:
    medicaid_adjusted_gross_income_person: [59_450, 39_450, 5_000]
  absolute_error_margin: 0.01

- name: Case 3, a dependent's own deductions reduce the dependent's AGI, not the head's.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 50
        is_tax_unit_head: true
        employment_income: 50_000
      student:
        age: 23
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_full_time_student: true
        employment_income: 6_000
        taxable_interest_income: 500
        traditional_ira_contributions: 2_000
        early_withdrawal_penalty: 100
        educator_expense: 300
    tax_units:
      tax_unit:
        members: [parent, student]
    households:
      household:
        members: [parent, student]
        state_code: TX
  output:
    # Each person's own Form 1040, line 11. Parent: 50,000 - 0. Student:
    # line 9 = 6,000 + 500 = 6,500; Schedule 1, line 11 = 300, line 18 = 100,
    # line 20 = 2,000, line 26 = 2,400; line 11 = 4,100.
    medicaid_adjusted_gross_income_person: [50_000, 4_100]
