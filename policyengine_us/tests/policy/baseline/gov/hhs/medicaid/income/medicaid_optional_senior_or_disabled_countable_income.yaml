# Missouri MHABD budgets in the order of DSS Manual § 0805.015.00: the
# $65-plus-one-half earned income exemption first (§ 0805.015.25), then
# the $20 standard exemption from the combined total, then round down to
# the nearest whole dollar (§ 0805.015.40). Under the SSI order, the
# unused $20 would shift to earned income before the 50-percent
# exclusion, yielding (2,368 - 85) x 0.5 = $1,141.50 monthly instead.
- name: Missouri applies the earned income exemption before the standard exemption.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    employment_income: 28_416
    state_code: MO
  output:
    # Monthly, (2,368 - 65) x 0.5 - 20 = 1,131.50, rounded down to 1,131.
    medicaid_optional_senior_or_disabled_countable_income: 13_572
    # 1,131 equals the 2026 aged standard, and the standards are maxima.
    is_optional_senior_or_disabled_income_eligible: true

- name: Missouri rounds adjusted income down to the whole dollar.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    ssi_marital_unearned_income: 13_821
    state_code: MO
  output:
    # Monthly, 1,151.75 - 20 = 1,131.75, rounded down to 1,131. Without
    # rounding, 1,131.75 would exceed the $1,131 standard.
    medicaid_optional_senior_or_disabled_countable_income: 13_572
    is_optional_senior_or_disabled_income_eligible: true

- name: Connecticut couple with each spouse above the individual disregard gets twice the individual disregard.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        ssi_unearned_income: 15_600
      person2:
        age: 68
        is_tax_unit_spouse: true
        ssi_unearned_income: 7_800
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
    # UPM 5030.15 A: (1,300 - 535) + (650 - 535) = 880 a month.
    # 880 x 12 / 2 = 5,280 each.
    medicaid_optional_senior_or_disabled_countable_income: [5_280, 5_280]

- name: Connecticut couple gets the disregard only up to a spouse's own unearned income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        ssi_unearned_income: 18_000
      person2:
        age: 68
        is_tax_unit_spouse: true
        ssi_unearned_income: 3_600
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
    # UPM 5030.15 A: (1,500 - 535) + max(300 - 535, 0) = 965 a month.
    # 965 x 12 / 2 = 5,790 each. Subtracting the 1,070 couple disregard from
    # the combined 1,800 would give 4,380 each.
    medicaid_optional_senior_or_disabled_countable_income: [5_790, 5_790]
