- name: California does not deduct a non-applicant spouse's premiums, as in ACWDL 20-24 Example 5.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        medicare_enrolled: true
        ssi_unearned_income: 18_000
      person2:
        age: 60
        is_tax_unit_spouse: true
        ssi_unearned_income: 12_000
        employment_income: 8_400
        health_insurance_premiums_without_medicare_part_b: 1_200
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    # SSI deeming: the spouse's 1,000 unearned plus (700 - 65) / 2 = 317.50
    # earned, so 1,317.50 a month is deemed. Monthly countable income is
    # 1,500 + 1,317.50 - 20 - 202.90 = 2,594.60, over the limit, which is
    # the letter's result.
    medicaid_optional_senior_or_disabled_income_deemed_from_ineligible_spouse: [15_810, 0]
    medicaid_optional_senior_or_disabled_countable_income: [31_135.2, 0]

