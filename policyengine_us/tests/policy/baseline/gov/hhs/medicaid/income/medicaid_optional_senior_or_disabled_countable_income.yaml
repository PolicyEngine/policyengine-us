- name: California deducts both spouses' Part B premiums and other health insurance premiums from a couple's combined income.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        medicare_enrolled: true
        ssi_unearned_income: 15_600
      person2:
        age: 68
        is_tax_unit_spouse: true
        medicare_enrolled: true
        ssi_unearned_income: 7_800
        health_insurance_premiums_without_medicare_part_b: 360
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
