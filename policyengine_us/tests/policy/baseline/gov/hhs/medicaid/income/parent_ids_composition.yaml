    families:
      family:
        members: [parent_p, parent_q, child]
    marital_units:
      parent_p:
        members: [parent_p]
      parent_q:
        members: [parent_q]
      child:
        members: [child]
    households:
      household:
        members: [parent_p, parent_q, child]
        state_code: OH
  output:
    # The child is claimed by P and lives with both unmarried parents, so
