- name: Without parent ids, an explicit is_parent input still marks the claiming parent.
  period: 2026
  input:
    people:
      parent:
        age: 55
        employment_income: 20_000
        is_parent: true
      adult_child:
        age: 26
        is_tax_unit_spouse: false
    tax_units:
      unit:
        members: [parent, adult_child]
        tax_unit_is_filer: true
