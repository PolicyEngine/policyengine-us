# Below-ceiling controls retain $497 monthly allocations: $11,832 - $5,964
# = $5,868, or $9,312 - $5,964 = $3,348 in California. Wisconsin includes
# full-time secondary students at 18 regardless of tax role; Texas includes students below 21.
# The Wisconsin seniors each earn $9,000, excluded under MEH 15.5.8.
# Secondary enrollment proxies expected completion before 19 (MEH 1.1.3.3).
# The disabled siblings are immigration-ineligible for both programs, so
# their Medicaid allocation must be excluded by the state's nonblind and
# nondisabled definition, independently of the Medicaid recipient mask.
