- name: Case 1, Connecticut applies its unearned disregard only to unearned parental income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 12
        is_ssi_disabled: true
      person2:
        is_parent: true
        ssi_earned_income: 36_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [6_006, 0]

# Missouri MHDC deems only a natural or adoptive parent's income, never a
# stepparent's (DSS MHABD Manual § 0805.020.15), and divides the deemed
# amount equally among the disabled children applying. Parent status
# comes from is_parent, so the stepparent is simply not a deeming source.
- name: Case 2, Missouri deems the natural parent's income but not the stepparent's.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 10
        is_ssi_disabled: true
      person2:
        age: 35
        is_parent: true
        ssi_earned_income: 48_000
      person3:
        age: 38
        is_parent: false
        ssi_earned_income: 120_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    # Mother only, SSI order (§ 0805.020.15 steps 4-6, no rounding shown):
    # (4,000 - 20 - 65) / 2 = 1,957.50 x 12 = 23,490; less the parent living
    # allowance (994 x 12 = 11,928, the one-person SSI federal benefit
    # rate) -> 11,562. The stepfather's 120,000 is
    # not deemed.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [11_562, 0, 0]

- name: Case 3, Missouri splits deemed parental income equally between two disabled children.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 8
        is_ssi_disabled: true
      person2:
        age: 12
        is_ssi_disabled: true
      person3:
        age: 40
        is_parent: true
        ssi_earned_income: 45_000
      person4:
        age: 39
        is_parent: true
        ssi_earned_income: 30_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MO
  output:
    # Both parents: (6,250 - 20 - 65) / 2 = 3,082.50 x 12 = 36,990; less
    # the parents' living allowance (1,491 x 12 = 17,892, the couple SSI
    # federal benefit rate) -> 19,098, split equally -> 9,549 each.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [9_549, 9_549, 0, 0]

# DSS Manual 0805.020.15 Example #1 (2022 SSI maximums: $841 for one,
# $1,261 for two). Mrs. Boulanger applies for MHDC for Marie; Jane has no
# income.
- name: Case 4, Missouri manual Example 1, the Boulangers.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      mrs_boulanger:
        age: 40
        own_children_in_household: 2
        ssi_unearned_income: 441 * 12
        ssi_earned_income: 2_297 * 12
      marie:
        age: 12
        is_ssi_disabled: true
        ssi_unearned_income: 140 * 12
      jane:
        age: 10
    tax_units:
      tax_unit:
        members: [mrs_boulanger, marie, jane]
    marital_units:
      mrs_boulanger_alone:
        members: [mrs_boulanger]
      marie_alone:
        members: [marie]
      jane_alone:
        members: [jane]
    households:
      household:
        members: [mrs_boulanger, marie, jane]
        state_code: MO
  output:
    # $441 - $420 for Jane = $21; - $20 = $1. $2,297 - $65 = $2,232; half =
    # $1,116; + $1 = $1,117; less $841 = $276 deemed to Marie.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [0, 3_312, 0]

# DSS Manual 0805.020.15 Example #2 (2022). Cindy has $258 of OASDI;
# Denise has no income.
- name: Case 5, Missouri manual Example 2, the Johnsons.
  period: 2022
  absolute_error_margin: 0.01
  input:
    people:
      mr_johnson:
        age: 42
        person_id: 1
        ssi_unearned_income: 452 * 12
      mrs_johnson:
        age: 40
        person_id: 2
        ssi_earned_income: 2_382 * 12
      kay:
        age: 12
        is_ssi_disabled: true
        person_id: 3
        parent_1_id: 1
        parent_2_id: 2
      cindy:
        age: 10
        person_id: 4
        parent_1_id: 1
        parent_2_id: 2
        ssi_unearned_income: 258 * 12
      denise:
        age: 8
        person_id: 5
        parent_1_id: 1
        parent_2_id: 2
    tax_units:
      tax_unit:
        members: [mr_johnson, mrs_johnson, kay, cindy, denise]
    marital_units:
      parents:
        members: [mr_johnson, mrs_johnson]
      kay_alone:
        members: [kay]
      cindy_alone:
        members: [cindy]
      denise_alone:
        members: [denise]
    households:
      household:
        members: [mr_johnson, mrs_johnson, kay, cindy, denise]
        state_code: MO
  output:
    # Allocations $162 + $420 = $582 exceed the $452 unearned income by $130.
    # $2,382 - $130 = $2,252; - $20 - $65 = $2,167; half = $1,083.50, below
    # the $1,261 allowance for two parents: nothing is deemed.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [0, 0, 0, 0, 0]

# 0805.020.15: 'Do not deem the income of any other persons in the home,
# including a stepparent.' The child's id names his mother; she is married
# to his stepfather. Federal SSI deeming includes the stepparent
# (20 CFR 416.1160(d)).
- name: Case 6, Missouri deems the mother but not her husband when parent ids are set.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      child:
        age: 10
        is_ssi_disabled: true
        person_id: 1
        parent_1_id: 2
        parent_2_id: 99
      mother:
        age: 35
        person_id: 2
        ssi_earned_income: 48_000
      stepfather:
        age: 38
        person_id: 3
        ssi_earned_income: 120_000
    tax_units:
      tax_unit:
        members: [child, mother, stepfather]
    marital_units:
      child_alone:
        members: [child]
      couple:
        members: [mother, stepfather]
    households:
      household:
        members: [child, mother, stepfather]
        state_code: MO
  output:
    # Mother only: ($4,000 - $20 - $65) / 2 = $1,957.50, less $994 =
    # $963.50 a month.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [11_562, 0, 0]
    # SSI: ($14,000 - $85) / 2 = $6,957.50, less the $1,491 couple rate =
    # $5,466.50 a month.
    ssi_unearned_income_deemed_from_ineligible_parent: [65_598, 0, 0]

