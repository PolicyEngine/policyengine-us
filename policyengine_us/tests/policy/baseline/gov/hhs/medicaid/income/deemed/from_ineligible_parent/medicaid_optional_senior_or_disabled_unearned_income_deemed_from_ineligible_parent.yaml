- name: Case 1, Connecticut applies its unearned disregard only to unearned parental income.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 12
        is_ssi_disabled: true
      person2:
        is_parent: true
        ssi_earned_income: 36_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: CT
  output:
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [6_006, 0]

- name: Optional Medicaid parental deeming inherits the SSI exclusion for qualified pretax premiums.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      recipient:
        age: 12
        is_ssi_disabled: true
      sibling:
        age: 14
        # Isolate pretax premiums from the student earned-income exclusion.
        is_in_k12_school: false
        employment_income: 2_400
        pre_tax_health_insurance_premiums: 1_200
      parent:
        age: 40
        is_parent: true
        employment_income: 36_000
        pre_tax_health_insurance_premiums: 3_600
    tax_units:
      tax_unit:
        members: [recipient, sibling, parent]
    # A parent and children are not a married couple. Explicit singleton
    # units prevent default grouping from also applying spousal deeming.
    marital_units:
      recipient_unit:
        members: [recipient]
      sibling_unit:
        members: [sibling]
      parent_unit:
        members: [parent]
    households:
      household:
        members: [recipient, sibling, parent]
        state_code: NC
  output:
    # 42 USC 1396a(m) uses SSI methodology for this optional pathway.
    # POMS SI 00820.102C.2: parent wages 32,400; sibling wages 1,200.
    # 20 CFR 416.1165(b), (d): sibling allocation = 4,596, so
    # (32,400 - 4,596 - 20 * 12 - 65 * 12) / 2 - 967 * 12 = 1,788 deemed.
    # Under (e)(1), apply child's general exclusion: 1,788 - 20 * 12 = 1,548.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [1_788, 0, 0]
    is_ssi_spousal_deeming_applies: [false, false, false]
    medicaid_optional_senior_or_disabled_income_deemed_from_ineligible_spouse: [0, 0, 0]
    medicaid_optional_senior_or_disabled_countable_income: [1_548, 0, 0]

# Missouri MHDC deems only a natural or adoptive parent's income, never a
# stepparent's (DSS MHABD Manual § 0805.020.15), and divides the deemed
# amount equally among the disabled children applying. Parent status
# comes from is_parent, so the stepparent is simply not a deeming source.
- name: Case 2, Missouri deems the natural parent's income but not the stepparent's.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 10
        is_ssi_disabled: true
      person2:
        age: 35
        is_parent: true
        ssi_earned_income: 48_000
      person3:
        age: 38
        is_parent: false
        ssi_earned_income: 120_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: MO
  output:
    # Mother only, SSI order (§ 0805.020.15 steps 4-6, no rounding shown):
    # (4,000 - 20 - 65) / 2 = 1,957.50 x 12 = 23,490; less the parent living
    # allowance (994 x 12 = 11,928, the one-person SSI federal benefit
    # rate) -> 11,562. The stepfather's 120,000 is
    # not deemed.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [11_562, 0, 0]

- name: Case 3, Missouri splits deemed parental income equally between two disabled children.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 8
        is_ssi_disabled: true
      person2:
        age: 12
        is_ssi_disabled: true
      person3:
        age: 40
        is_parent: true
        ssi_earned_income: 45_000
      person4:
        age: 39
        is_parent: true
        ssi_earned_income: 30_000
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: MO
  output:
    # Both parents: (6,250 - 20 - 65) / 2 = 3,082.50 x 12 = 36,990; less
    # the parents' living allowance (1,491 x 12 = 17,892, the couple SSI
    # federal benefit rate) -> 19,098, split equally -> 9,549 each.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [9_549, 9_549, 0, 0]

- name: Missouri does not allocate to a co-resident adult student.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        person_id: 1
        is_tax_unit_head: true
        is_parent: true
        ssi_unearned_income: 24_000
      claimant:
        age: 10
        person_id: 2
        parent_1_id: 1
        is_tax_unit_dependent: true
        is_ssi_disabled: true
        immigration_status: CITIZEN
      student:
        age: 20
        person_id: 3
        parent_1_id: 1
        is_tax_unit_dependent: true
        is_full_time_student: true
    tax_units:
      family:
        members: [parent, claimant, student]
    marital_units:
      parent_unit:
        members: [parent]
      claimant_unit:
        members: [claimant]
      student_unit:
        members: [student]
    households:
      home:
        members: [parent, claimant, student]
        state_code: MO
  output:
    # DSS 0805.020.15 step 1 restricts allocations to children under 18:
    # https://dssmanuals.mo.gov/mo-healthnet-for-the-aged-blind-and-disabled/0805-000-00/0805-020-00/0805-020-15/
    # SSI still allocates for this student, but Missouri must not deduct it.
    ssi_ineligible_child_allocation: [0, 0, 5_964]
    # ($2,000 - $20 - $994) * 12 = $11,832, not $5,868.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [0, 11_832, 0]

# Current state manual definitions constrain SSI's newly supported adult-student
# allocations before the common deduction sequence. Each household has one
# parent with $2,000 monthly unearned income and a disabled citizen claimant.
# At the state's age ceiling there is no Medicaid child allocation:
# ($2,000 - $20 - $994) * 12 = $11,832. California retains its existing
# $230 general disregard, giving ($2,000 - $230 - $994) * 12 = $9,312.
# SSI still gives each unmarried full-time student a $497 monthly allocation.
