# 0805.020.15 step 1 allocates for 'each minor child (under age 18) who is
# living in the home and who is not applying for MA', not only siblings.
# Federal SSI allocates only for the child's siblings (20 CFR 416.1160(d)).
- name: Case 8, Missouri allocates for a cousin under 18 in the home.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      mother:
        age: 35
        person_id: 1
        ssi_earned_income: 3_000 * 12
      child:
        age: 8
        is_ssi_disabled: true
        person_id: 2
        parent_1_id: 1
      cousin:
        age: 10
        person_id: 3
        parent_1_id: 50
    tax_units:
      tax_unit:
        members: [mother, child, cousin]
    marital_units:
      mother_alone:
        members: [mother]
      child_alone:
        members: [child]
      cousin_alone:
        members: [cousin]
    households:
      household:
        members: [mother, child, cousin]
        state_code: MO
  output:
    # $3,000 - $497 = $2,503; - $85 = $2,418; half = $1,209; less $994 =
    # $215 a month.
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [0, 2_580, 0]
    # SSI: $3,000 - $85 = $2,915; half = $1,457.50; less $994 = $463.50.
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 5_562, 0]
