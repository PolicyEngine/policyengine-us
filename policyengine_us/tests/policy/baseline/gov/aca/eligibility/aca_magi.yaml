- name: 2025 VT  - one adult esi #same test at second esi integration
  absolute_error_margin: .01  #but to test aca magi and medicaid % fpl
  period: 2025
  input:
    people:
      person1:
        age: 50
        employment_income: 50_000
        is_aca_eshi_eligible: true
        own_children_in_household: 1
      person2:
        age: 45
        employment_income: 40_000
        is_aca_eshi_eligible: false
        own_children_in_household: 1
      person3:
        age: 15
        is_aca_eshi_eligible: false
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_fips: 50  # VT state code 
        slcsp_rating_area: 1 #vt is only one rating area, use 05403 for example
  output:
    is_medicaid_eligible: [false, false, false]
    is_aca_ptc_eligible: [false, true, true]
    tax_unit_medicaid_income_level: 3.37
    aca_magi_fraction: 3.48

- name: Section 911 adds back Form 2555 lines 45 and 50, before disallowed deductions
  period: 2025
  input:
    adjusted_gross_income: 40_000
    section_911_excluded_income: 25_000
    # The rate stacking amount after 10,000 of disallowed deductions.
    foreign_earned_income_exclusion: 15_000
  output:
    # Form 8962 Worksheet 1-1 line 3 takes Form 2555 lines 45 and 50.
    medicaid_magi: 65_000
    aca_magi: 65_000

- name: 2025 joint return with a claimable spouse leaves the child's tax-exempt interest out of household income (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        employment_income: 10_000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        employment_income: 10_000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        tax_exempt_interest_income: 20_000
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    # 26 CFR 1.36B-1(e)(1): household income counts other individuals only
    # if they are in the family; this return's child is not (IRC 152(b)(1)).
    adjusted_gross_income: 20_000
    medicaid_magi: 40_000
    aca_magi: 20_000

