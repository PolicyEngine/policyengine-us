- name: 2025 single filer who can be claimed elsewhere has tax family size 0
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: TX
  output:
    # Form 8962 line 1 (2025 instructions p.8): if someone can claim you, or
    # your spouse on a joint return, you or your spouse is not included in
    # the tax family size.
    aca_tax_family_size: 0
    tax_unit_size: 2

