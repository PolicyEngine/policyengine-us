- name: "2025 joint return with one claimable spouse: the coverage family is the other spouse (the claimable spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        aca_magi: 30_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    # 26 CFR 1.36B-3(b)(2): members of the taxpayer's family who enroll.
    pays_aca_premium: [true, true, true]
    is_aca_coverage_family_member: [false, true, false]

- name: "2025 joint return with one claimable spouse: the coverage family is the other spouse (the claimable spouse is the spouse)"
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_b, person_a, child]
        filing_status: JOINT
        aca_magi: 30_000
    households:
      household:
