        state_code: TX
  output:
    pays_aca_premium: [true, true, true]
    is_aca_coverage_family_member: [true, false, false]

- name: "2025 joint return with neither spouse claimable: a Medicaid-eligible child is not in the coverage family"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        aca_magi: 30_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    is_aca_coverage_family_member: [true, true, false]
