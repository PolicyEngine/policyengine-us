- name: 2025 single filer who can be claimed elsewhere, and their child, are outside the tax family
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, child]
        filing_status: SINGLE
    households:
      household:
        members: [person_a, child]
        state_code: TX
  output:
    # 26 CFR 1.36B-1(d)(2): the family is the taxpayer, both spouses on a
    # joint return, except for individuals who qualify as a dependent of
    # another taxpayer; IRC 152(b)(1): such a return claims no dependents.
    is_aca_tax_family_member: [false, false]

