# ACA MAGI as a fraction of the poverty guideline, floored to two decimals.
# 26 U.S.C. 36B(d)(3)(B) measures income against the guideline for the year
# before the coverage year. The model's guidelines start in 2015.

- name: Coverage in 2016 uses the 2015 guideline.
  # 30,000 / 11,770 = 2.5488, floored to 2.54. The 2016 guideline (11,880)
  # would give 2.52.
  period: 2016
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_magi_fraction: 2.54

- name: Coverage in 2015, the first modeled year, uses the coverage year's guideline.
  # The year before is not modeled, so the 2015 guideline stands in for the
  # 2014 guideline the statute calls for: 30,000 / 11,770 = 2.5488, floored
  # to 2.54.
  period: 2015
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_magi_fraction: 2.54

- name: Coverage in 2026 in Alaska uses Alaska's 2025 guideline.
  # 30,000 / 19,550 = 1.5345, floored to 1.53. The contiguous states'
  # guideline (15,650) would give 1.91.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 1.53

- name: Coverage in 2026 in Hawaii uses Hawaii's 2025 guideline.
  # 30,000 / 17,990 = 1.6676, floored to 1.66. The contiguous states'
  # guideline (15,650) would give 1.91.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: HI
  output:
    aca_magi_fraction: 1.66

- name: Coverage in 2026 for an Alaska family of three uses Alaska's per-person increment.
  # 19,550 + 2 x 6,880 = 33,310; 50,000 / 33,310 = 1.5011, floored to 1.50.
  period: 2026
  input:
    people:
      parent:
        age: 40
      child1:
        age: 10
      child2:
        age: 8
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
        aca_magi: 50_000
    households:
      household:
        members: [parent, child1, child2]
        state_code: AK
  output:
    aca_magi_fraction: 1.5

- name: A household that moves from Alaska in 2025 to Texas in 2026 uses Texas's guideline for 2026 coverage.
  # The state of residence in the coverage year decides the guideline, not
  # the state in the guideline year. 30,000 / 15,650 = 1.9169, floored to
  # 1.91. Alaska's 2025 guideline (19,550) would give 1.53.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code:
          2025: AK
          2026: TX
  output:
    aca_magi_fraction: 1.91

- name: Family size is the coverage year's.
  # aca_tax_family_size is 3 for 2026 only; 2025 counts the one listed
  # member. Alaska's 2025 guideline for three: 19,550 + 2 x 6,880 = 33,310.
  # 50,000 / 33,310 = 1.5011, floored to 1.50. The 2025 size of one would
  # give 50,000 / 19,550 = 2.55.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 50_000
        aca_tax_family_size:
          2026: 3
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 1.5

- name: Coverage in 2025 in Alaska uses Alaska's 2024 guideline.
  # 30,000 / 18,810 = 1.5949, floored to 1.59.
  period: 2025
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 1.59

- name: Households in Alaska and Texas in one simulation each use their own state's guideline.
  # 30,000 / 19,550 = 1.53 and 30,000 / 15,650 = 1.91.
  period: 2026
  input:
    people:
      person1:
        age: 40
      person2:
        age: 40
    tax_units:
      tax_unit1:
        members: [person1]
        aca_magi: 30_000
      tax_unit2:
        members: [person2]
        aca_magi: 30_000
    households:
      household1:
        members: [person1]
        state_code: AK
      household2:
        members: [person2]
        state_code: TX
  output:
    aca_magi_fraction: [1.53, 1.91]

- name: Income exactly on a whole percentage of the guideline is not floored one point low.
  # 100 x 35,369 / 15,650 = 226 exactly, so Worksheet 2 gives 226. Dividing
  # first gives 35,369 / 15,650 = 2.2599999..., which floors to 2.25.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 35_369
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_magi_fraction: 2.26

- name: Negative ACA MAGI gives a fraction of 0.
  # MAGI is floored at 0 before dividing (Form 8962 line 3 enters -0- for a
  # negative total). From PR 10413's cases.
  period: 2026
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: -5_000
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 0

- name: 2025 joint return with one claimable spouse measures income against the one-person line (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # 22,590 / 15,060 = 1.50
    aca_magi_fraction: 1.5

- name: 2025 joint return with one claimable spouse measures income against the one-person line (the claimable spouse is the spouse)
  period: 2025
  input:
    people:
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        aca_magi: 22_590
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
  output:
    aca_magi_fraction: 1.5

- name: 2025 joint return with neither spouse claimable measures income against the two-person line
  period: 2025
  absolute_error_margin: 0.001
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # 22,590 / 20,440 = 1.105, truncated to 1.10 (Form 8962 Worksheet 2)
    aca_magi_fraction: 1.1

- name: 2025 single filer who can be claimed keeps the one-person line
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
        aca_magi: 22_590
    households:
      household:
        members: [person_a]
        state_code: TX
  output:
    aca_magi_fraction: 1.5
