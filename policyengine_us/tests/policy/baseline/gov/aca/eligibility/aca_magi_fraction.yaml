# ACA MAGI as a fraction of the poverty guideline, floored to two decimals.
# 26 U.S.C. 36B(d)(3)(B) measures income against the guideline for the year
# before the coverage year. The model's guidelines start in 2015.

- name: Coverage in 2016 uses the 2015 guideline.
  # 30,000 / 11,770 = 2.5488, floored to 2.54. The 2016 guideline (11,880)
  # would give 2.52.
  period: 2016
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_magi_fraction: 2.54

- name: Coverage in 2015, the first modeled year, uses the coverage year's guideline.
  # The year before is not modeled, so the 2015 guideline stands in for the
  # 2014 guideline the statute calls for: 30,000 / 11,770 = 2.5488, floored
  # to 2.54.
  period: 2015
  input:
    people:
      person1:
        age: 40
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_magi_fraction: 2.54

# IRS 2017 Form 8962 instructions, line 4 and Tables 1-1 to 1-3 use 2016.
# https://www.irs.gov/pub/irs-prior/i8962--2017.pdf#page=6
# Stable memberships and residence isolate the guideline table from PRs 10413/10860.
# Real wages supply MAGI. No eligibility or income-fraction inputs are supplied.
- name: A stable Texas family of three at the 2016 guideline has the correct 2017 ACA income
    floor.
  period: 2017
  input:
    people:
      parent:
        age:
          2016: 40
          2017: 41
        employment_income:
          2016: 20160
          2017: 20160
        immigration_status:
          2016: CITIZEN
          2017: CITIZEN
        has_tin:
          2016: true
          2017: true
      spouse:
        age:
          2016: 39
          2017: 40
        immigration_status:
          2016: CITIZEN
          2017: CITIZEN
        has_tin:
          2016: true
          2017: true
      child:
        age:
          2016: 9
          2017: 10
        is_tax_unit_dependent:
          2016: true
          2017: true
        immigration_status:
          2016: CITIZEN
          2017: CITIZEN
    tax_units:
      tax_unit:
        members:
        - parent
        - spouse
        - child
    marital_units:
      couple:
        members:
        - parent
        - spouse
      child:
        members:
        - child
    spm_units:
      spm_unit:
        members:
        - parent
        - spouse
        - child
    households:
      household:
        members:
        - parent
        - spouse
        - child
        state_code:
          2016: TX
          2017: TX
  output:
    tax_unit_size:
      2016: 3
      2017: 3
    tax_unit_fpg:
      2016: 20160
      2017: 20420
    aca_magi: 20160
    aca_magi_fraction: 1
    people:
      parent:
        is_medicaid_eligible: false
        medicaid_enrolled: false
        pays_aca_premium: true
        is_aca_ptc_eligible: true
      spouse:
        is_medicaid_eligible: false
        medicaid_enrolled: false
        pays_aca_premium: true
        is_aca_ptc_eligible: true
