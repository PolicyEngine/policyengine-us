- name: 2024 Puerto Rico single adult pays no Marketplace premium and is not eligible
  # HHS defines no guideline for Puerto Rico, and no Exchange operates there
  # (26 U.S.C. 36B(c)(2)(A); 42 U.S.C. 18024(d)), so pays_aca_premium is
  # false. Without the no-Exchange test, the infinite fraction (the
  # placeholder guideline is 0) is outside the coverage gap and
  # pays_aca_premium would be true. On main, with the state supplied for 2024
  # only, the 2023 guideline year fell back to the default state's guideline
  # (30,000 / 14,580, floored to 2.05), so the household was eligible.
  period: 2024
  input:
    people:
      person1:
        age: 30
        is_medicaid_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_chip_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 30_000
    households:
      household:
        members: [person1]
        state_code: PR
  output:
    pays_aca_premium: false
    is_aca_ptc_eligible: false

- name: 2026 Puerto Rico single adult with no income has a required contribution of 0
  # The guideline is 0, so the fraction is infinite rather than 0 / 0. An
  # infinite fraction falls in the top bracket, above the 400% limit, and
  # 2026 has no income eligibility there, so the percentage is capped out
  # to 0. Plain division would give NaN here, and a fraction of 0 would give
  # the 2026 initial rate of 0.021.
  period: 2026
  input:
    people:
      person1:
        age: 30
        is_medicaid_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_chip_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 0
    households:
      household:
        members: [person1]
        state_code: PR
  output:
    aca_required_contribution_percentage: 0
    pays_aca_premium: false
    is_aca_ptc_eligible: false
