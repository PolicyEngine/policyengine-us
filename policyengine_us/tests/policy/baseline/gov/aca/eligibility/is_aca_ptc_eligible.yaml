    is_aca_ptc_eligible: [false]

- name: "2025 joint return with one claimable spouse: only the other spouse is eligible (the claimable spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # IRC 36B(c)(1)(D); 26 CFR 1.36B-2(b)(3): someone another taxpayer may
    # claim is not an applicable taxpayer.
    aca_magi_fraction: 1.5
    is_aca_ptc_eligible: [false, true]

