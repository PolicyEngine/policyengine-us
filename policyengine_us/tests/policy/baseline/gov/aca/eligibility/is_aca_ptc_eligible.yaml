    is_aca_ptc_eligible: [false]

# 42 U.S.C. 1395o(a)(2): a permanent resident of two years without Part A can't enroll
# in Medicare at 70, so Medicare doesn't block the credit. The five-year bar in
# 8 U.S.C. 1613(a) also rules out Medicaid.
# $30,000 / 2025 individual FPL of $15,650 = 1.91, inside the 1.00 to 4.00 income range.
- name: Permanent resident barred from Medicare at age 70 qualifies for ACA PTC
  period: 2026
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 2
    medicare_quarters_of_coverage: 0
    taxable_private_pension_income: 30_000
    state_code: TX
  output:
    is_medicare_eligible: false
    is_aca_ptc_eligible: true

- name: 2026 Alaska single adult at $70,000 is under 400% of Alaska's guideline
  # 70,000 / 19,550 (Alaska's 2025 guideline for one) = 3.58, inside the
  # 1.00 to 4.00 range. The contiguous states' guideline (15,650) would give
  # 4.47, above it.
  period: 2026
  input:
    people:
      person1:
        age: 30
        is_medicaid_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_chip_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 70_000
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 3.58
    is_aca_ptc_eligible: true

- name: 2026 Alaska single adult just under Alaska's guideline is below the 100% floor
  # 19,549 / 19,550 = 0.99995, floored to 0.99, below the 1.00 floor; the
  # below-poverty exception ends in 2026. The contiguous states' guideline
  # (15,650) would give 1.24.
  period: 2026
  input:
    people:
      person1:
        age: 30
        is_medicaid_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_chip_eligible: false
    tax_units:
      tax_unit:
        members: [person1]
        aca_magi: 19_549
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    aca_magi_fraction: 0.99
    is_aca_ptc_eligible: false

