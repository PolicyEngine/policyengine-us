- name: 2025 joint return with one claimable spouse and a child uses the one-person poverty line (the claimable spouse is the head)
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    # 2024 contiguous guideline for one person (parameters/gov/hhs/fpg.yaml).
    aca_tax_family_size: 1
    aca_fpg: 15_060

