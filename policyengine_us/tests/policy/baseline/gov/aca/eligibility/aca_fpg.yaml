- name: 2025 the poverty line uses the tax year's family size, not a supplied prior-year size
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        tax_unit_size: {2024: 2, 2025: 3}
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    # Form 8962 line 1 is the tax year's family; line 4 takes the 2024
    # guideline for it: 15,060 + 2 * 5,380. tax_unit_fpg for 2024 would
    # have used the supplied 2024 size of 2 (20,440).
    aca_tax_family_size: 3
    aca_fpg: 25_820

- name: A 2015 Alaska joint return uses the prior guideline with coverage-year household inputs
  period: 2015
  absolute_error_margin: 0.001
  input:
    people:
      head:
        age: 40
        takes_up_ak_permanent_fund_dividend_if_eligible: false
        employment_income: 49_150
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      spouse:
        age: 40
        takes_up_ak_permanent_fund_dividend_if_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: AK
  output:
    # IRS 2015 Form 8962 line 4, Table 1-2: 14,580 + 5,080 = 19,660.
    # Line 5: floor(49,150 / 19,660 * 100) / 100 = 2.50.
    # https://www.irs.gov/pub/irs-prior/i8962--2015.pdf#page=7
    aca_fpg: 19_660
    aca_magi: 49_150
    aca_tax_family_size: 2
    aca_magi_fraction: 2.5

- name: A 2014 Alaska return uses the 2013 guideline for its tax family
  period: 2014
  input:
    aca_tax_family_size: 2
    state_code: AK
  output:
    # IRS 2014 Form 8962 line 4, Table 1-2: 14,350 + 5,030 = 19,380.
    # https://www.irs.gov/pub/irs-prior/i8962--2014.pdf#page=6
    aca_fpg: 19_380

- name: Coverage in 2015 uses current residence with the 2014 guideline
  period: 2015
  input:
    aca_tax_family_size: 2
    state_code:
      2014: TX
      2015: AK
  output:
    # IRS 2015 Form 8962 line 4 uses 2015 residence and the 2014 table:
    # Alaska, two people = 14,580 + 5,080 = 19,660.
    # https://www.irs.gov/pub/irs-prior/i8962--2015.pdf#page=7
    aca_fpg: 19_660

- name: Coverage in 2016 uses coverage-year residence when the household supplies no earlier state
  period: 2016
  input:
    aca_tax_family_size: 2
    state_code: AK
  output:
    # IRS 2016 Form 8962 line 4 uses 2016 residence and the 2015 table:
    # Alaska, two people = 14,720 + 5,200 = 19,920.
    # https://www.irs.gov/pub/irs-prior/i8962--2016.pdf#page=6
    aca_fpg: 19_920

- name: Coverage in 2017 uses current residence with the 2016 guideline
  period: 2017
  input:
    aca_tax_family_size: 2
    state_code:
      2016: TX
      2017: AK
  output:
    # IRS 2017 Form 8962 line 4 uses 2017 residence and the 2016 table:
    # Alaska, two people = 20,020 (Table 1-2). HHS listed 20,020 for two
    # people in 2016, 20 below 14,840 + 5,200.
    # https://www.irs.gov/pub/irs-prior/i8962--2017.pdf#page=7
    aca_fpg: 20_020
