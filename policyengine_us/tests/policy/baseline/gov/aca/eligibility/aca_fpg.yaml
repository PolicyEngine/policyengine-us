- name: 2025 single filer who can be claimed keeps the tax unit's one-person line
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
    tax_units:
      tax_unit:
        members: [person_a]
        filing_status: SINGLE
    households:
      household:
        members: [person_a]
        state_code: TX
  output:
    # No tax family, so the line for the whole tax unit (1 person).
    aca_tax_family_size: 0
    aca_fpg: 15_060

