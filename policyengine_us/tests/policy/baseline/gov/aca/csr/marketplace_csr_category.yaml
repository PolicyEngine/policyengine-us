# Tiers follow 42 U.S.C. 18071(c)(2) and 45 CFR 155.305(g)(2): household income
# "not more than" (the regulation: "less than or equal to") 150, 200 and 250
# percent of the FPL, on the exact ratio of ACA MAGI to the prior-year guideline,
# not the truncated aca_magi_fraction. Supplied-income cases pin the prior-year
# guideline to $10,000; income-derived cases use the 2025 one-person guideline,
# $15,650.

- name: Case 1, silver enrollee at 125 percent FPL receives 94 percent AV CSR.
  absolute_error_margin: 0.001
  period: 2026
  input:
    pays_aca_premium: true
    is_aca_ptc_eligible: true
    aca_magi: 12_500
    tax_unit_fpg:
      2025: 10_000
    selected_marketplace_plan_category: SILVER
  output:
    person_receives_aca: true
    marketplace_csr_eligible: true
    marketplace_csr_category: AV_94
    selected_marketplace_plan_actuarial_value: 0.7
    marketplace_csr_actuarial_value: 0.94
    marketplace_effective_actuarial_value: 0.94

