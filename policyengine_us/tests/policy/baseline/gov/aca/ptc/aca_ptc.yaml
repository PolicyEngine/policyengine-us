- name: "2017 joint return with one claimable spouse: credit for the other spouse's benchmark (the claimable spouse is the head)"
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 17_820
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
        # Annual base: adults cost 6,000 and children cost 3,000.
        slcsp_age_0: 6000
  output:
    # 150% FPL for one: 17,820 / 11,880 = 1.50.
    # Credit = 6,000 - 17,820 * 0.0408 = 5,272.944.
    aca_tax_family_size: 1
    aca_ptc_slcsp: 6000
    aca_ptc: 5272.944


