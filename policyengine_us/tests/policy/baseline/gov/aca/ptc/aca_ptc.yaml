        members: [person1]
        state_code: TX
        state_fips: 48
  output:
    aca_ptc_below_fpl_immigration_exception: true
    is_aca_ptc_eligible: [true]
    aca_required_contribution_percentage: 0
    aca_ptc: 1_200

