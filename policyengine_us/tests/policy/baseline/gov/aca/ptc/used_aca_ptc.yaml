- name: Case 1, benchmark-plan selection uses the full ACA PTC.
  absolute_error_margin: 0.01
  period: 2025
  input:
    is_aca_ptc_eligible: true
    pays_aca_premium: true
    slcsp: 1_200
    aca_magi: 25_000
    aca_required_contribution_percentage: 0.04
    tax_unit_is_filer: true
  output:
    aca_ptc: 200
    used_aca_ptc: 200
    unused_aca_ptc: 0

- name: Case 2, a lower-than-benchmark selected-plan ratio leaves some ACA PTC unused.
  absolute_error_margin: 0.01
  period: 2025
  input:
    is_aca_ptc_eligible: true
    pays_aca_premium: true
    slcsp: 10_000
    aca_magi: 20_000
    aca_required_contribution_percentage: 0.04
    selected_marketplace_plan_benchmark_ratio: 0.8
    tax_unit_is_filer: true
  output:
    aca_ptc: 9_200
    selected_marketplace_plan_premium_proxy: 8_000
    used_aca_ptc: 8_000
    unused_aca_ptc: 1_200

- name: Case 3, used and unused ACA PTC are zero when ACA PTC is zero.
  absolute_error_margin: 0.01
  period: 2025
  input:
    is_aca_ptc_eligible: true
    slcsp: 1_200
    aca_magi: 25_000
    aca_required_contribution_percentage: 0.05
    selected_marketplace_plan_benchmark_ratio: 0.8
  output:
    aca_ptc: 0
    used_aca_ptc: 0
    unused_aca_ptc: 0

- name: Case 4, a non-takeup tax unit uses no ACA PTC.
  absolute_error_margin: 0.01
  period: 2025
  input:
    aca_ptc: 200
    slcsp: 1_200
    selected_marketplace_plan_benchmark_ratio: 0.8
    takes_up_aca_if_eligible: false
  output:
    selected_marketplace_plan_premium_proxy: 0
    used_aca_ptc: 0
    unused_aca_ptc: 200

- name: Case 5, bronze selected plan uses actual bronze premium before applying PTC.
  absolute_error_margin: 0.01
  period: 2026
  input:
    is_aca_ptc_eligible: true
    pays_aca_premium: true
    selected_marketplace_plan_category: BRONZE
    slcsp: 10_000
    lcbp: 7_000
    aca_magi: 20_000
    aca_required_contribution_percentage: 0.04
    tax_unit_is_filer: true
  output:
    aca_ptc: 9_200
    selected_marketplace_plan_premium_proxy: 7_000
    used_aca_ptc: 7_000
    unused_aca_ptc: 2_200

- name: 2025 credit is capped at the coverage family's share of the premium (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
        tax_unit_is_filer: true
        selected_marketplace_plan_benchmark_ratio: 0.75
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
        # Annual base: adults cost 6,000 and children cost 3,000.
        slcsp_age_0: 6000
  output:
    # min(6,000, 4,500); before, the cap was the whole 9,000 premium.
    aca_ptc: 6000
    used_aca_ptc: 4500

- name: 2025 credit is capped at the coverage family's share of the premium (the claimable spouse is the spouse)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_multiplier: 1
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        aca_magi: 22_590
        tax_unit_is_filer: true
        selected_marketplace_plan_benchmark_ratio: 0.75
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
        # Annual base: adults cost 6,000 and children cost 3,000.
        slcsp_age_0: 6000
  output:
    aca_ptc: 6000
    used_aca_ptc: 4500
