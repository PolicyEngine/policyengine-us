- name: Marketplace net premium equals plan cost minus used PTC.
  period: 2024
  input:
    selected_marketplace_plan_premium_proxy: 6_000
    used_aca_ptc: 4_000
  output:
    marketplace_net_premium: 2_000

- name: Marketplace net premium is zero when the household does not take up coverage.
  period: 2024
  input:
    selected_marketplace_plan_premium_proxy: 0
    used_aca_ptc: 0
  output:
    marketplace_net_premium: 0

- name: Marketplace net premium floors at zero when PTC exceeds plan cost.
  period: 2024
  input:
    selected_marketplace_plan_premium_proxy: 2_000
    used_aca_ptc: 3_000
  output:
    marketplace_net_premium: 0

- name: High-income Marketplace household pays the full selected plan premium when PTC-ineligible.
  absolute_error_margin: 0.01
  period: 2026
  input:
    age: 40
    aca_magi_fraction: 5
    is_medicaid_eligible: false
    is_chip_eligible: false
    is_basic_health_program_eligible: false
    is_aca_eshi_eligible: false
    is_medicare_eligible: false
    slcsp: 10_000
    selected_marketplace_plan_benchmark_ratio: 0.8
  output:
    pays_aca_premium: true
    is_aca_ptc_eligible: false
    selected_marketplace_plan_premium_proxy: 8_000
    used_aca_ptc: 0
    marketplace_net_premium: 8_000

- name: Bronze selected plan net premium uses actual bronze premium.
  absolute_error_margin: 0.01
  period: 2026
  input:
    pays_aca_premium: true
    selected_marketplace_plan_category: BRONZE
    slcsp: 10_000
    lcbp: 5_000
    aca_ptc: 3_000
  output:
    selected_marketplace_plan_premium_proxy: 5_000
    used_aca_ptc: 3_000
    marketplace_net_premium: 2_000

- name: 2025 the claimable spouse's share of the premium stays unsubsidized (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
        tax_unit_is_filer: true
        selected_marketplace_plan_benchmark_ratio: 0.75
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # 9,000 - 4,500.
    marketplace_net_premium: 4500

- name: 2025 the claimable spouse's share of the premium stays unsubsidized (the claimable spouse is the spouse)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_b, person_a]
        filing_status: JOINT
        aca_magi: 22_590
        tax_unit_is_filer: true
        selected_marketplace_plan_benchmark_ratio: 0.75
    households:
      household:
        members: [person_b, person_a]
        state_code: TX
  output:
    marketplace_net_premium: 4500
