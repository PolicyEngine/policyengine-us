# A tax unit files a return that can claim the premium tax credit if it files
# for any reason, or if it takes up the credit (26 CFR 1.6011-8(a); Form 1040
# instructions, Chart C, item 5).

- name: A filer that does not take up the credit
  period: 2025
  input:
    tax_unit_is_filer: true
    takes_up_aca_if_eligible: false
  output:
    files_return_for_aca_ptc: true

- name: A non-filer that takes up a positive credit
  period: 2025
  input:
    is_aca_ptc_eligible: true
    slcsp: 1_200
    aca_magi: 25_000
    aca_required_contribution_percentage: 0.04
    tax_unit_is_filer: false
    takes_up_aca_if_eligible: true
  output:
    aca_ptc_before_filing_gate: 200  # 1200 - 0.04 * 25000
    files_return_for_aca_ptc: true

- name: A non-filer that takes up coverage when the credit is zero does not file for it
  # $5,500 benchmark less 9.96% of $60,000 ($5,976) is below zero: there is
  # no credit to claim and no advance payment to reconcile.
  period: 2026
  input:
    is_aca_ptc_eligible: true
    slcsp: 5_500
    aca_magi: 60_000
    aca_required_contribution_percentage: 0.0996
    tax_unit_is_filer: false
    takes_up_aca_if_eligible: true
  output:
    aca_ptc_before_filing_gate: 0
    files_return_for_aca_ptc: false

- name: A non-filer that does not take up the credit
  period: 2025
  input:
    tax_unit_is_filer: false
    takes_up_aca_if_eligible: false
  output:
    files_return_for_aca_ptc: false

- name: Retired couple with only Social Security is not required to file but files to claim the credit
  # Social Security of $30,000 and nothing else: none of it is taxable (the
  # provisional income of $15,000 is under the $32,000 joint base amount), so
  # gross income is zero and no return is required, and there is no earned
  # income for an EITC. Taking up the credit makes it a filer for the credit.
  period: 2025
  input:
    people:
      head:
        age: 62
        social_security_retirement: 15_000
      spouse:
        age: 62
        social_security_retirement: 15_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    taxable_social_security: [0, 0]
    tax_unit_is_required_to_file: false
    tax_unit_is_filer: false
    files_return_for_aca_ptc: true
