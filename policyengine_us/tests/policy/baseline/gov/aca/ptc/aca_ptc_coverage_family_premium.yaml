- name: "2025 joint return with a claimable spouse on the policy: half the premium is the coverage family's (the claimable spouse is the head)"
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimable_as_dependent_on_another_return: true
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
    tax_units:
      tax_unit:
        members: [person_a, person_b]
        filing_status: JOINT
        aca_magi: 22_590
        tax_unit_is_filer: true
        selected_marketplace_plan_benchmark_ratio: 0.75
    households:
      household:
        members: [person_a, person_b]
        state_code: TX
  output:
    # Silver plan at 0.75 of the 12,000 benchmark: 9,000. 26 CFR 1.36B-3(h)(1):
    # the coverage family's share is 6,000 / 12,000, so 4,500.
    selected_marketplace_plan_premium_proxy: 9000
    aca_ptc_coverage_family_premium: 4500

