        age: 40
        is_aca_marketplace_enrollee: false
    tax_units:
      tax_unit:
        members: [person1]
        selected_marketplace_plan_premium_proxy: 5_000
        aca_ptc: 1_000
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    aca_ptc_coverage_family_premium: 0
    used_aca_ptc: 0

