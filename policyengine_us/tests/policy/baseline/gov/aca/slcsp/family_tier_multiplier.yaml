- name: NY single adult multiplier
  period: 2023-01
  input:
    people:
      person1:
        age: 30
    tax_units:
      tax_unit:
        members: [person1]
        slcsp_family_tier_category: ONE_ADULT
        slcsp_family_tier_applies: true
    households:
      household:
        members: [person1]
        state_code_str: NY
        state_fips: 36
  output:
    slcsp_family_tier_multiplier: 1.0

- name: NY two adults multiplier
  period: 2023-01
  input:
    people:
      person1:
        age: 30
      person2:
        age: 32
    tax_units:
      tax_unit:
        members: [person1, person2]
        slcsp_family_tier_category: TWO_ADULTS
        slcsp_family_tier_applies: true
    households:
      household:
        members: [person1, person2]
        state_code_str: NY
        state_fips: 36
  output:
    slcsp_family_tier_multiplier: 2.0

