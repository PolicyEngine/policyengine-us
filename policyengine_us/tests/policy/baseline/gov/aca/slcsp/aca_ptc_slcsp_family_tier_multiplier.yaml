- name: "2025 NY joint return with one claimable spouse and a child: one-adult multiplier (the claimable spouse is the head)"
  period: 2025-01
  input:
    people:
      person_a:
        age: 30
        monthly_age: 30
        pays_aca_premium: true
        claimed_as_dependent_on_another_return: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        monthly_age: 30
        pays_aca_premium: true
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 5
        monthly_age: 5
        pays_aca_premium: true
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
    households:
      household:
        members: [person_a, person_b, child]
        state_code: NY
        state_code_str: NY
        slcsp_rating_area: 3
        slcsp_age_0: 760
  output:
    slcsp_family_tier_multiplier: 2.85
    aca_ptc_slcsp_family_tier_multiplier: 1.0

