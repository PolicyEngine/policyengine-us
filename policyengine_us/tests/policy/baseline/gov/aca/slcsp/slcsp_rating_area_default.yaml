# From 2026, counties in aca_rating_area_corrections.csv take CMS's rating area
# (state geographic rating area pages); earlier years keep aca_rating_areas.csv.
# Counties whose key aca_rating_areas.csv misspells or lacks take theirs from 2014.
- name: Orange County CA is in rating area 15 before 2026
  period: 2025
  input:
    county_str: ORANGE_COUNTY_CA
  output:
    slcsp_rating_area_default: 15

