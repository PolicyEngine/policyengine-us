- name: Case 1, default age curve for a child.
  period: 2026-01
  input:
    people:
      person1:
        age: 0
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    slcsp_age_curve_multiplier: 1

- name: Case 2, default age curve for a forty-year-old.
  period: 2026-01
  input:
    people:
      person1:
        age: 40
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    slcsp_age_curve_multiplier: 1.6706

- name: Case 3, New York uses a flat adult multiplier.
  period: 2026-01
  input:
    people:
      person1:
        age: 40
    households:
      household:
        members: [person1]
        state_code: NY
  output:
    slcsp_age_curve_multiplier: 1

- name: Children share the federal age curve before 2018.
  period: 2017-12
  absolute_error_margin: 0.000001
  input:
    monthly_age: [0, 14, 15, 20, 21, 40, 64]
    state_code:
      2017: [TX, TX, TX, TX, TX, TX, TX]
  output:
    # CMS 2013 child ratio / the 2018 base ratio = 0.635 / 0.765.
    # Adult multipliers retain the model's 2018 normalization.
    slcsp_age_curve_multiplier: [0.8300653595, 0.8300653595, 0.8300653595, 0.8300653595, 1.3072, 1.6706, 3.9216]

- name: Federal age curves support the first marketplace year.
  period: 2014-01
  absolute_error_margin: 0.000001
  input:
    monthly_age: [20, 21, 40]
    state_code: [TX, TX, TX]
  output:
    # 0.635 / 0.765 = 0.8300653595 for every child under 21.
    slcsp_age_curve_multiplier: [0.8300653595, 1.3072, 1.6706]

- name: Children move to the revised federal age curve in 2018.
  period: 2018-01
  input:
    monthly_age: [0, 14, 15, 20, 21, 40, 64]
    state_code: [TX, TX, TX, TX, TX, TX, TX]
  output:
    slcsp_age_curve_multiplier: [1, 1, 1.0889, 1.268, 1.3072, 1.6706, 3.9216]

