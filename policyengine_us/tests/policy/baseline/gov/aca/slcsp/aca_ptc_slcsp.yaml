- name: 2025 coverage family's three oldest children are charged once a claimable 19-year-old spouse is out (the claimable spouse is the head)
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person_a:
        age: 19
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        claimable_as_dependent_on_another_return: true
        dependent_claimant_filing_exception: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
      child2:
        age: 8
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
      child3:
        age: 6
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        is_basic_health_program_eligible: false
    tax_units:
      tax_unit:
        members: [person_a, person_b, child, child2, child3]
        filing_status: JOINT
        aca_magi: 40_000
        tax_unit_is_filer: true
    households:
      household:
        members: [person_a, person_b, child, child2, child3]
        state_code: TX
        slcsp_age_0: 1000
        slcsp_rating_area: 1
  output:
    # 45 CFR 147.102(c)(1): the three oldest covered children. The whole
    # tax unit ranks the 19-year-old first, so the youngest child pays no
    # premium in slcsp; the coverage family (the other spouse and all
    # three children) charges all three. Default age curve on 1,000.
    pays_aca_premium: [true, true, true, true, false]
    is_aca_marketplace_enrollee: [true, true, true, true, true]
    slcsp: 4713.8
    aca_ptc_slcsp: 4483.7

