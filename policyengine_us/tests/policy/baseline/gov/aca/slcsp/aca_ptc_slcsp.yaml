- name: "2025 joint return with one claimable spouse: the benchmark covers only the other spouse (the claimable spouse is the head)"
  period: 2025
  input:
    people:
      person_a:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        claimed_as_dependent_on_another_return: true
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: true
        is_tax_unit_spouse: false
      person_b:
        age: 30
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_amount_person: 6000
        is_tax_unit_head: false
        is_tax_unit_spouse: true
      child:
        age: 10
        is_medicaid_eligible: false
        is_chip_eligible: false
        is_aca_eshi_eligible: false
        is_medicare_eligible: false
        slcsp_age_curve_amount_person: 3000
    tax_units:
      tax_unit:
        members: [person_a, person_b, child]
        filing_status: JOINT
        aca_magi: 30_000
    households:
      household:
        members: [person_a, person_b, child]
        state_code: TX
  output:
    # 26 CFR 1.36B-3(f): the benchmark offered to the coverage family;
    # slcsp still counts every enrollee.
    slcsp: 15_000
    aca_ptc_slcsp: 6000

