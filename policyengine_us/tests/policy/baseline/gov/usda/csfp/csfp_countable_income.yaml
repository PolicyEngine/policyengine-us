- name: The independent income approximations include educational assistance.
  period: 2026
  input:
    age: 35
    state_code: TN
    employment_income: 36_000
    educational_assistance: 7_000
  output:
    # Preserve the existing approximation: 36,000 + 7,000 = 43,000.
    csfp_countable_income: 43_000
    tx_dta_csfp_countable_income: 43_000
    ca_cvrp_countable_income: 43_000

- name: The independent income approximations retain self-employment losses.
