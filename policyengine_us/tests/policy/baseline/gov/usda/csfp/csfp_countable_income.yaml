- name: The independent income approximations retain their existing state supplement omission.
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      parent:
        age: 45
        employment_income: 38_114
      adult_child:
        age: 19
        is_ssi_disabled: true
      child:
        age: 10
    marital_units:
      parent_unit:
        members: [parent]
      adult_child_unit:
        members: [adult_child]
      child_unit:
        members: [child]
    spm_units:
      spm_unit:
        members: [parent, adult_child, child]
    households:
      household:
        members: [parent, adult_child, child]
        state_code: WI
  output:
    # Preserve the existing approximation: 38,114 wages + 11,928 federal SSI.
    csfp_countable_income: 50_042
    tx_dta_csfp_countable_income: 50_042
    ca_cvrp_countable_income: 50_042
