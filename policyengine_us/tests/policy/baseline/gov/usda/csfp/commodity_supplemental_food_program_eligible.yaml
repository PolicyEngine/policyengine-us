- name: Person under 60 is not eligible regardless of income
  period: 2024
  input:
    people:
      person:
        age: 59
      spouse:
        age: 62
    spm_units:
      spm_unit:
        members: [person, spouse]
        csfp_countable_income: 10_000  # Below the 130% limit
        spm_unit_fpg: 10_000
        tx_dta_csfp_countable_income: 10_000
  output:
    commodity_supplemental_food_program_eligible: [false, true]

- name: Person exactly 60 is eligible with low income
  period: 2024
  input:
    people:
      person:
        age: 60
    spm_units:
      spm_unit:
        members: [person]
        csfp_countable_income: 12_000  # Below the 130% limit
        spm_unit_fpg: 10_000
        tx_dta_csfp_countable_income: 12_000
  output:
    commodity_supplemental_food_program_eligible: true

- name: Elderly person eligible with income at exactly 130% FPG
  period: 2024
  input:
    people:
      person:
        age: 65
    spm_units:
      spm_unit:
        members: [person]
        csfp_countable_income: 13_000  # Exactly at the limit
        spm_unit_fpg: 10_000
        tx_dta_csfp_countable_income: 13_000
  output:
    commodity_supplemental_food_program_eligible: true

- name: Elderly person not eligible with income above 130% FPG
  period: 2024
  input:
    people:
      person:
        age: 70
    spm_units:
      spm_unit:
        members: [person]
        csfp_countable_income: 13_100  # Just above the limit
        spm_unit_fpg: 10_000
        tx_dta_csfp_countable_income: 13_100
  output:
    commodity_supplemental_food_program_eligible: false

- name: Multiple household members with different eligibility
  period: 2024
  input:
    people:
      child:
        age: 10
      adult:
        age: 45
      senior1:
        age: 60
      senior2:
        age: 75
    spm_units:
      spm_unit:
        members: [child, adult, senior1, senior2]
        csfp_countable_income: 12_000  # Below the 130% limit
        spm_unit_fpg: 10_000
        tx_dta_csfp_countable_income: 12_000
  output:
    commodity_supplemental_food_program_eligible: [false, false, true, true]

- name: 2025 period with higher FPG limit of 150%
  period: 2025
  input:
