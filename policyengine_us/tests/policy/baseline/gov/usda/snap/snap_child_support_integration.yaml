# A single adult earning $36,275.59 a year ($3,022.97 a month) who pays
# $5,200 a year ($433.33 a month) in legally obligated child support and
# $10,560 a year in rent, based on PolicyBench scenario_045. Gross income is
# 232% of the poverty guideline before subtracting child support and 199%
# after.

- name: Michigan deducts child support from net income, so the household fails the 200% of poverty BBCE gross income limit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 44
        employment_income: 36_275.59
        employment_income_before_lsr: 36_275.59
        weekly_hours_worked_before_lsr: 40
        child_support_expense: 5_200
        pre_subsidy_rent: 10_560
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: MI
  output:
    snap_child_support_gross_income_deduction: 0
    snap_gross_income: 3_022.97
    snap_child_support_deduction: 433.33
    meets_snap_categorical_eligibility: false
    is_snap_eligible: false
    snap: 0

- name: California excludes child support from gross income, so the same household meets the 200% of poverty BBCE gross income limit.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 44
        employment_income: 36_275.59
        employment_income_before_lsr: 36_275.59
        weekly_hours_worked_before_lsr: 40
        child_support_expense: 5_200
        pre_subsidy_rent: 10_560
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: CA
  output:
    snap_child_support_gross_income_deduction: 433.33
    snap_gross_income: 2_589.63
    snap_child_support_deduction: 0
    # Without deemed SUA, net is $2,589.63 - $604.59 - $209 = $1,776.04.
    # Rent $880 is below half-net $888.02, so there is no shelter deduction.
    # Main's California net screen denies SNAP at $1,776 > $1,305.
    # The independent California MCE correction is tracked in #10036.
    snap_utility_allowance: 0
    snap_excess_shelter_expense_deduction: 0
    snap_net_income: 1_776
    meets_tanf_non_cash_net_income_test: false
    meets_snap_categorical_eligibility: false
    is_snap_eligible: false
    snap: 0

- name: New York excludes child support from gross income and does not deduct it again from net income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 44
        employment_income: 36_275.59
        employment_income_before_lsr: 36_275.59
        weekly_hours_worked_before_lsr: 40
        child_support_expense: 5_200
        pre_subsidy_rent: 10_560
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: NY
  output:
    snap_child_support_gross_income_deduction: 433.33
    snap_gross_income: 2_589.63
    snap_child_support_deduction: 0
