- name: FY2026 large-household allotment follows USDA's published table, which set no 18+ cap
  period: 2026-09
  input:
    snap_region_str:
      2026: [CONTIGUOUS_US, CONTIGUOUS_US, CONTIGUOUS_US]
    snap_unit_size: [17, 18, 30]
  output:
    # USDA's FY2026 table listed the $1,789 eight-person maximum plus $218 per
    # additional person, with no 18+ row; the cap first appears in FY2027.
    snap_max_allotment: [3751, 3969, 6585]

- name: FY2027 published minimum allotments in every region
  period: 2026-10
  input:
    snap_region_str:
      2026: [CONTIGUOUS_US, AK_URBAN, AK_RURAL_1, AK_RURAL_2, GU, HI, VI]
    state_code:
      2026: [CA, AK, AK, AK, GU, HI, VI]
    snap_unit_size: [1, 1, 1, 1, 1, 1, 1]
  output:
    # Page 5. Rounding 8% of the published $306 one-person maximum gives
    # $24; min_allotment.published_adjustment supplies the published $25.
    snap_min_allotment: [25, 31, 40, 49, 36, 40, 32]

