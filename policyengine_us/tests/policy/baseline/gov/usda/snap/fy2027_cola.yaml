- name: FY2026 large-household allotment is capped under the amended statute
  period: 2026-09
  input:
    snap_region_str:
      2026: [CONTIGUOUS_US, CONTIGUOUS_US, CONTIGUOUS_US]
    snap_unit_size: [17, 18, 30]
  output:
    # 7 U.S.C. 2012(u)(2)(I) caps the additional percentage at 200 percent
    # of the unrounded 4-person TFP cost from FY2026:
    # $1,789 + floor(2 x $994.40) = $3,777 (USDA cost workbook, I1552).
    # USDA's FY2026 table listed $218 per additional person with no cap,
    # which would give $3,969 and $6,585; the model follows the statute.
    # 17 members: $1,789 + 9 x $218 = $3,751, under the cap.
    snap_max_allotment: [3751, 3777, 3777]

