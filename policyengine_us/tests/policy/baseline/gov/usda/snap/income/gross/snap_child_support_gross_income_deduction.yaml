# The cases below are before 2015. policyengine-us backdates parameters only to
# 2015-01-01 (backdate_parameters in system.py), and
# gov.usda.snap.eligibility.eligible_immigration_statuses starts in 2018, so
# snap_income_counted_share cannot be computed for these years. Each case sets
# it to 1, counting the payer's child support in full.

- name: Arizona excludes child support payments from gross income in 2012, as the 8th to 10th editions list.
  period: 2012
  absolute_error_margin: 0.01
  input:
    state_code: AZ
    child_support_expense: 1_200
    snap_income_counted_share: 1
  output:
    snap_child_support_gross_income_deduction: 1_200

- name: Arizona excludes child support payments from January to August 2013 and deducts them from September, when the 11th edition first lists a deduction.
  period: 2013
  absolute_error_margin: 0.01
  input:
    state_code: AZ
    child_support_expense: 1_200
    snap_income_counted_share: 1
  output:
    # $100 a month for January through August.
    snap_child_support_gross_income_deduction: 800

- name: Delaware deducts child support payments in June 2010, because a monthly period reads the parameter on its first day (2010-06-01), before DSSM 9059(26) takes effect on 2010-06-10; it excludes them in July.
  period: 2010
  absolute_error_margin: 0.01
  input:
    state_code: DE
    child_support_expense: 1_200
    snap_income_counted_share: 1
  output:
    # Monthly outputs under a yearly test period: a test period of 2010-06
    # would store the yearly inputs under a 12-month period starting in June,
    # which policyengine-core's simulation builder cannot read back.
    snap_child_support_gross_income_deduction:
      2010-06: 0
      2010-07: 100

- name: Delaware excludes child support payments from July 2010, the first month that starts after DSSM 9059(26) takes effect on 2010-06-10.
