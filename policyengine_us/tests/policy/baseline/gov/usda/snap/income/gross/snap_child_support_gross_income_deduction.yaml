- name: California excludes child support payments from gross income.
  period: 2022
  input:
    state_code: CA
    child_support_expense: 100
    weekly_hours_worked_before_lsr: 40
  output:
    snap_child_support_gross_income_deduction: 100

- name: Alaska deducts child support payments from net income instead of excluding them from gross income.
  period: 2022
  input:
    state_code: AK
    child_support_expense: 100
    weekly_hours_worked_before_lsr: 40
  output:
    snap_child_support_gross_income_deduction: 0

- name: Michigan deducts child support payments from net income in 2026.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: MI
    child_support_expense: 5_200
    weekly_hours_worked_before_lsr: 40
  output:
    snap_child_support_gross_income_deduction: 0

- name: New York excludes child support payments from gross income in 2026.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    state_code: NY
    child_support_expense: 5_200
    weekly_hours_worked_before_lsr: 40
  output:
    # $5,200 / 12 = $433.33 per month.
    snap_child_support_gross_income_deduction: 433.33

- name: Oregon deducts child support payments before its exclusion rule takes effect on 2023-01-19.
  period: 2022
  absolute_error_margin: 0.01
  input:
    state_code: OR
    child_support_expense: 1_200
    weekly_hours_worked_before_lsr: 40
  output:
    snap_child_support_gross_income_deduction: 0

- name: Oregon excludes child support payments from February 2023, after its exclusion rule takes effect on 2023-01-19.
  period: 2023
  absolute_error_margin: 0.01
  input:
    state_code: OR
    child_support_expense: 1_200
    weekly_hours_worked_before_lsr: 40
  output:
    # $100 a month for February through December.
    snap_child_support_gross_income_deduction: 1_100

- name: Virginia excludes child support payments in fiscal year 2024 under 22VAC40-601-70.
  period: 2024-01
  absolute_error_margin: 0.01
  input:
    state_code: VA
    child_support_expense: 1_200
    weekly_hours_worked_before_lsr: 40
  output:
    snap_child_support_gross_income_deduction: 100
