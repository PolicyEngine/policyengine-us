# PolicyBench snapshot facts and takeup defaults. Leaf input aliases mirror
# the US Simulation adapter, which Core's YAML SimulationBuilder bypasses.
- name: Case 1, PolicyBench scenario_080 PA household receives SNAP without the heat-and-eat SUA.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 41
        employment_income_before_lsr: 0
        bank_account_assets: 19_827.646484375
        financial_assistance: 3_600
        is_disabled: true
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        long_term_capital_gains_before_response: 924
        other_medical_expenses: 12
        over_the_counter_health_expenses: 100
        qualified_dividend_income: 16
        takes_up_medicaid_if_eligible: true
        takes_up_ssi_if_eligible: true
    marital_units:
      marital_unit_1:
        members: [person1]
    tax_units:
      tax_unit:
        members: [person1]
        first_home_mortgage_balance: 93_000
        takes_up_aca_if_eligible: true
        takes_up_dc_ptc: true
        takes_up_eitc: true
        would_file_if_eligible_for_refundable_credit: true
        would_file_taxes_voluntarily: true
    spm_units:
      spm_unit:
        members: [person1]
        spm_unit_energy_subsidy: 2_000
        takes_up_snap_if_eligible: true
    families:
      family:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: PA
        household_vehicles_value: 3_570
  output:
    snap: 3_270

