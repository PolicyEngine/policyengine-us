- name: Farm rent counts toward SNAP gross income alongside wages and other unearned income.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 31
        weekly_hours_worked_before_lsr: 40
        employment_income: 5_923
        financial_assistance: 13_000
        farm_rent_income: 1_920
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    # ($5,923 + $13,000 + $1,920) / 12 = $1,736.92. Without farm rent the
    # result would be $1,576.92.
    snap_earned_income: 493.58
    snap_unearned_income: 1_243.33
    snap_gross_income: 1_736.92
