- name: Case 20, California FY2017 utility allowance preserves a benefit near exhaustion.
  period: 2017-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income:
          2017: 37_980
        rent:
          2017: 12_000
      person2:
        age: 35
      person3:
        age: 8
      person4:
        age: 6
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        tanf:
          2017: 0
        has_heating_cooling_expense: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: CA
  output:
    # ACIN I-68-16 pp.1-2,4 supplies the FY2017 amounts.
    # ACL 14-56 pp.4,6 allows positive MCE allotments above the regular
    # net-income limit but denies zero allotments for three or more people.
    # This continuing-household example avoids initial-month issuance rules.
    # $3,165 - $633 - $168 = $2,364 before shelter.
    # Shelter = $1,000 + $389 - $1,182 = $207.
    # Net = $2,157; ceil(30% * $2,157) = $648; $649-$648 = $1.
    # January 2017 7 CFR 273.10(e)(2)(ii)(C) increases this $1 to $2.
    snap_gross_income: 3_165
    snap_earned_income_deduction: 633
    snap_standard_deduction: 168
    snap_standard_utility_allowance: 389
    snap_net_income_pre_shelter: 2_364
    snap_excess_shelter_expense_deduction: 207
    snap_net_income: 2_157
    snap_expected_contribution: 648
    snap: 2

- name: Case 21, five more dollars of monthly earnings exhaust the California FY2017 allotment.
  period: 2017-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income:
          2017: 38_040
        rent:
          2017: 12_000
      person2:
        age: 35
      person3:
        age: 8
      person4:
        age: 6
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        tanf:
          2017: 0
        has_heating_cooling_expense: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: CA
  output:
    # $3,170 - $634 - $168 = $2,368 before shelter.
    # Shelter = $1,389 - $1,184 = $205; net = $2,163.
    # ceil(30% * $2,163) = $649, exhausting the $649 maximum.
    # ACL 14-56 p.6 denies three-plus-person MCE zero-allotment cases.
    snap_gross_income: 3_170
    snap_earned_income_deduction: 634
    snap_standard_utility_allowance: 389
    snap_net_income_pre_shelter: 2_368
    snap_excess_shelter_expense_deduction: 205
    snap_net_income: 2_163
    snap_expected_contribution: 649
    snap: 0

