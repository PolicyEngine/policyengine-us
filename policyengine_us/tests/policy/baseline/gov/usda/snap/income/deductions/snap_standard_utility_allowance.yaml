- name: Case 14, California FY2017 utility allowance reaches the final earned-income benefit.
  period: 2017
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 30
        employment_income: 24_000
        rent: 4_800
      person2:
        age: 35
      person3:
        age: 8
      person4:
        age: 6
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
        tanf: 0
        has_heating_cooling_expense: true
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: CA
  output:
    # CDSS ACIN I-68-16 pp. 1-2,4: FY2017 SUA $389, standard
    # deduction $168 for four people, maximum allotment $649.
    # $2,000 - 20% earnings deduction - $168 = $1,432 before shelter.
    # Shelter = $400 rent + $389 SUA - 50% * $1,432 = $73.
    # Net = $1,359; ceil(30% * $1,359) = $408; $649 - $408 = $241.
    snap_earned_income:
      2017-01: 2_000
    snap_gross_income:
      2017-01: 2_000
    snap_earned_income_deduction:
      2017-01: 400
    snap_standard_deduction:
      2017-01: 168
    snap_net_income_pre_shelter:
      2017-01: 1_432
    snap_standard_utility_allowance:
      2017-01: 389
      2017-09: 389
      2017-10: 397
    snap_excess_shelter_expense_deduction:
      2017-01: 73
    snap_net_income:
      2017-01: 1_359
    snap_expected_contribution:
      2017-01: 408
    snap_max_allotment:
      2017-01: 649
    snap_normal_allotment:
      2017-01: 241
    snap:
      2017-01: 241

