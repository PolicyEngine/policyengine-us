# Telephone-in-LUA state option under 7 CFR 273.9(d)(6)(iii)(A)(3).
# Missouri excludes telephone from its Non-Heating/Cooling Standard (the
# LUA) and adds the telephone standard on top for households with phone
# costs (MO DSS manual 1115.035.25.15). FY2026 values: NHCS $373,
# telephone $81, single utility standards $162.

- name: Missouri household with electricity, water, and phone stacks the telephone standard on the NHCS
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 80
        water_expense: 40
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: MO
  output:
    snap_utility_allowance_type: LUA
    # NHCS $373 + telephone standard $81.
    snap_utility_allowance: 454

- name: Missouri household with electricity and phone does not qualify for the NHCS and receives the single standards
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 80
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: MO
  output:
    # Phone does not count toward the two-utility NHCS qualification, so
    # the household gets the electricity single standard ($162) plus the
    # telephone standard ($81).
    snap_utility_allowance_type: IUA
    snap_utility_allowance: 243

- name: Missouri household with only a phone bill receives the telephone standard
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: MO
  output:
    snap_utility_allowance_type: IUA
    snap_utility_allowance: 81

- name: Missouri household with electricity and water but no phone receives the NHCS alone
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 80
        water_expense: 40
    households:
      household:
        members: [person]
        state_code: MO
  output:
    # No phone cost, so nothing stacks on the $373 NHCS.
    snap_utility_allowance_type: LUA
    snap_utility_allowance: 373
