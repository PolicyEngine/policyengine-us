- name: Nevada household with only a phone bill receives the summed FY2026 individual standards
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: NV
  output:
    snap_utility_allowance_type: IUA
    # snap_individual_utility_allowance sums every single-utility standard:
    # 5 x $77 (electricity, gas, water, sewage, trash) + $52 phone = $437.
    snap_utility_allowance: 437

- name: Wisconsin household with only a phone bill receives the summed individual standards, which rise mid-year on May 1, 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        phone_expense: 600
    households:
      household:
        members: [person]
        state_code: WI
  output:
    # snap_individual_utility_allowance sums every single-utility standard.
    # Through April 2026 (WI DHS Ops Memo 25-13): 155 + 48 + 106 + 106
    # + 28 + 31 = $474. From May 2026 (Ops Memos 26-22/26-30): 139 + 34
    # + 112 + 112 + 47 + 106 = $550.
    snap_utility_allowance:
      2026-04: 474
      2026-05: 550

