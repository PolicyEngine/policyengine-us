# New York, Maine, and Maryland apply the standard allowance to all
# households with utility costs, so their LUA and individual standards are
# pinned directly, following the convention of the other files here.
- name: Nassau and Suffolk Counties FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: LUA
    snap_utility_region_str: NY_NAS
  output:
    # OTDA GIS 25DC059 Attachment 1: Basic Utility $388 for Nassau/Suffolk
    # effective 10/1/2025 (the FNS FY2026 table's NY LUA column misstates
    # this as $419, New York City's value).
    snap_limited_utility_allowance: 388

- name: Rest of New York State FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: LUA
    snap_utility_region_str: NY_ONY
  output:
    # OTDA GIS 25DC059 Attachment 1: Basic Utility $355 for the rest of the
    # state effective 10/1/2025 (the FNS FY2026 table's NY LUA column
    # misstates this as $388, Nassau/Suffolk's value).
    snap_limited_utility_allowance: 355

- name: Maine FY2026 individual utility allowance is zero because the phone standard is eliminated
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: IUA
    snap_utility_region_str: ME
  output:
    snap_individual_utility_allowance: 0

# Maryland's SUAs are effective January 1 (FNS FY2026 table footnote), so
# its FY2026 values start 2026-01-01 and its 2025 values run through
# December 2025.
- name: Maryland FY2026 phone standard takes effect January 1, 2026
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: IUA
    snap_utility_region_str: MD
  output:
    snap_individual_utility_allowance: 41

- name: Maryland phone standard stays at its 2025 value through December 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: IUA
    snap_utility_region_str: MD
  output:
    snap_individual_utility_allowance:
      2025-12: 40

