# FY2026 utility allowances validated against the official FNS table
# (effective October 1, 2025 - September 30, 2026):
# https://www.fna.usda.gov/sites/default/files/resource-files/2026-05-21-SUA-Table-FY26.xlsx
# Wisconsin revised its SUAs mid-year: the FNS table shows the revised
# values, which took effect May 1, 2026 (WI DHS Ops Memos 26-22 and 26-30);
# the October 1, 2025 values are from WI DHS Ops Memo 25-13.

- name: Wisconsin household with heating costs receives the HCSUA, which rises mid-year on May 1, 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        heating_cooling_expense: 2_400
    households:
      household:
        members: [person]
        state_code: WI
  output:
    # WI DHS Ops Memo 25-13: $553 HSUA effective 10/1/2025;
    # Ops Memos 26-22/26-30: $870 effective 5/1/2026.
    snap_utility_allowance:
      2026-04: 553
      2026-05: 870

- name: Wisconsin household with electricity and water but no heating receives the LUA, which rises mid-year on May 1, 2026
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 960
        water_expense: 480
    households:
      household:
        members: [person]
        state_code: WI
  output:
    # WI DHS Ops Memo 25-13: $385 LUA effective 10/1/2025;
    # Ops Memos 26-22/26-30: $436 effective 5/1/2026.
    snap_utility_allowance:
      2026-04: 385
      2026-05: 436

