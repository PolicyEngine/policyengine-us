# FY2026 utility allowances validated against the official FNS table
# (effective October 1, 2025 - September 30, 2026):
# https://www.fna.usda.gov/sites/default/files/resource-files/2026-05-21-SUA-Table-FY26.xlsx

- name: Wisconsin household with heating costs receives the FY2026 HCSUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        heating_cooling_expense: 200
    households:
      household:
        members: [person]
        state_code: WI
  output:
    snap_utility_allowance_type: SUA
    snap_utility_allowance: 870

- name: Wisconsin household with electricity and water but no heating receives the FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        electricity_expense: 80
        water_expense: 40
    households:
      household:
        members: [person]
        state_code: WI
  output:
    snap_utility_allowance_type: LUA
    snap_utility_allowance: 436

- name: Idaho household with two non-heating utilities receives the FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        electricity_expense: 80
        trash_expense: 30
    households:
      household:
        members: [person]
        state_code: ID
  output:
    snap_utility_allowance_type: LUA
    snap_utility_allowance: 133

- name: Louisiana household with two non-heating utilities falls to individual standards because the LUA is discontinued in FY2026
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        electricity_expense: 80
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: LA
  output:
    # The FY2026 FNS table lists no LUA for Louisiana; the phone standard
    # is $76 and all other single-utility standards are $0.
    snap_utility_allowance_type: IUA
    snap_utility_allowance: 76

