# New York, Maine, and Maryland apply the standard allowance to all
# households with utility costs, so their LUA and individual standards are
# pinned directly, following the convention of the other files here.
- name: Nassau and Suffolk Counties FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: LUA
    snap_utility_region_str: NY_NAS
  output:
    snap_limited_utility_allowance: 419

- name: Rest of New York State FY2026 LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: LUA
    snap_utility_region_str: NY_ONY
  output:
    snap_limited_utility_allowance: 388

- name: Maine FY2026 individual utility allowance is zero because the phone standard is eliminated
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: IUA
    snap_utility_region_str: ME
  output:
    snap_individual_utility_allowance: 0

- name: Maryland FY2026 phone standard
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    snap_utility_allowance_type: IUA
    snap_utility_region_str: MD
  output:
    snap_individual_utility_allowance: 41
