        members: [person]
        state_code: ID
  output:
    snap_utility_allowance_type: LUA
    snap_utility_allowance: 133

- name: Louisiana household with two non-heating utilities receives the LUA
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 80
        phone_expense: 50
    households:
      household:
        members: [person]
        state_code: LA
  output:
    # The 2026-05-21 FNS table shows $0, but no Louisiana source confirms
    # a 10/1/2025 discontinuation (LAC 67:III.1966(A) still mandates the
    # BUA), so the FY2025 value times the simplified-process CPI factor
    # ($251 x 1.027 = $258) is kept.
    snap_utility_allowance_type: LUA
    snap_utility_allowance: 258

- name: Louisiana LUA rises with the fiscal-year change in October 2025
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person:
        age: 40
    spm_units:
      spm_unit:
        members: [person]
        pre_subsidy_electricity_expense: 960
        water_expense: 480
    households:
      household:
        members: [person]
        state_code: LA
  output:
    # FY2025 LUA of $251 through September; $258 from October 1, 2025.
    snap_utility_allowance:
      2025-09: 251
      2025-10: 258

