# SNAP ABAWD area waivers — 7 U.S.C. 2015(o)(4), 7 CFR 273.24(f).
# Alaska: from 2024-11-01 through 2025-10-31, the FY2025 waiver covered
# every borough and census area except the Municipality of Anchorage
# (FIPS 02020). From 2025-11-01 through 2026-10-31, the FY2026 waiver (20
# boroughs and census areas) and the 7 U.S.C. 2015(o)(7) good-faith
# exemption (every area except Anchorage) together keep the same 29 areas
# waived. FNS has posted no approval document for Alaska's good-faith
# exemption, so the geographic scope rests on the Alaska Division of Public
# Assistance FAQ (all areas except Anchorage).
# From 2025-11-01 through 2026-10-31, FNS waived the time limit in seven
# California counties (CDSS ACL 25-79 and ACL 26-15).
# Statewide waivers (CA, DC, IL, NV, NM through 2024-12-31, and NY through
# 2025-02-28) are modeled in waived_states, including the period litigation
# kept them in effect (Rhode Island State Council of Churches v. Rollins,
# D.R.I. No. 1:25-cv-00569).
# FY2025 county waivers are modeled in waived_counties for New York (61 of
# 62 counties, all but Saratoga, 2025-03-01 through 2026-02-28), New Mexico
# (29 of 33 counties, 2025-01-01 through 2025-12-31), and Delaware (Kent and
# Sussex counties, 2024-10-01 through 2025-09-30), as is New Mexico's FY2026
# Luna County waiver (2026-01-01 through 2026-12-31). Their sub-county parts
# (NM and NY reservation areas, the city of Wilmington) are not modeled.
# FY2024 county waivers still in effect on 2024-11-01 are modeled from that
# date: Kentucky (98 counties, through 2024-11-30), Michigan (82, through
# 2025-02-28), New Jersey (17, through 2025-01-31), Washington (38, through
# 2025-01-31), and Oregon (31, through 2024-12-31).
# FY2026 county waivers under the P.L. 119-21 criteria are modeled for
# Arizona (Yuma, 2026-03-01 through 2027-02-28), Kentucky (five counties,
# 2025-12-01 through 2026-11-30), Michigan (15 counties, through
# 2026-10-31, listed from 2026-03-01 when its FY2025 list ends), Minnesota
# (Clearwater, through 2026-11-30, listed from 2026-07-01 when its FY2025
# list ends), New Jersey (Cape May, 2026-02-01 through 2027-01-31), and
# Nevada (Mineral, 2026-02-01 through 2027-01-31).

- name: Case 1, post-HR1 AK resident of Fairbanks North Star Borough, listed only through the good-faith exemption and not the FY2026 area waiver, meets ABAWD requirements.
