    is_snap_alien_military_connected: [true, true, true]
    is_snap_alien_waiting_period_exempt: [true, true, true]
    meets_snap_qualified_alien_waiting_period: [true, true, true]
    is_snap_immigration_status_eligible: [true, true, true]
    is_snap_excluded_member: [false, false, false]
    snap_unit_size: 3
    snap_earned_income: 2_000
    # $2,000 - $400 - $209 = $1,391; $785 - $418 = $367, as in Case 2.
    snap_net_income: 1_391
    snap: 367

- name: Case 9, elderly LPR inside the waiting period does not confer elderly household status.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 48_000
        employment_income_before_lsr: 48_000
      person2:
        age: 33
      person3:
        age: 62
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 2
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    # person3 is 62, receives no SSI or disability benefits, and has no
    # other exception, so the waiting period bars them. As an excluded
    # member they do not make the household elderly (7 CFR 271.2),
    # mirroring the undocumented grandparent in
    # income/ineligible_members/integration.yaml Case 13.
    is_snap_alien_waiting_period_exempt: [false, false, false, true]
    meets_snap_qualified_alien_waiting_period: [true, true, false, true]
    is_snap_excluded_member: [false, false, true, false]
    snap_unit_size: 3
    # 3 eligible / 4 household members.
    snap_prorated_income_fraction: 0.75
    has_snap_elderly_disabled_member: false
    # The $4,000 monthly gross income faces, and fails, the gross income
    # test.
    snap_gross_income: 4_000
    meets_snap_gross_income_test: false
    snap: 0

- name: Case 10, elderly LPR past the waiting period confers elderly household status.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 48_000
        employment_income_before_lsr: 48_000
      person2:
        age: 33
      person3:
        age: 62
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 5
      person4:
        age: 8
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    meets_snap_qualified_alien_waiting_period: [true, true, true, true]
    is_snap_excluded_member: [false, false, false, false]
    snap_unit_size: 4
    # The eligible 62-year-old makes the household elderly, which waives
    # the gross income test.
    has_snap_elderly_disabled_member: true
    meets_snap_gross_income_test: true
    # The household fails the net income test but is categorically
    # eligible in Texas.
    meets_snap_net_income_test: false
    meets_snap_categorical_eligibility: true
    # $4,000 - $800 earned income deduction - $223 four-person standard
    # deduction = $2,977.
    snap_net_income: 2_977
    # 30% of $2,977 = $893.10, rounded up to $894.
    snap_expected_contribution: 894
    # Four-person maximum allotment $994 - $894 = $100.
    snap_max_allotment: 994
    snap: 100

- name: Case 11, adult sibling of an LPR veteran inside the waiting period is excluded while the veteran's spouse is not.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        employment_income: 24_000
        employment_income_before_lsr: 24_000
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_veteran: true
        is_tax_unit_head: true
      person2:
        age: 33
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_tax_unit_spouse: true
      person3:
        age: 30
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_tax_unit_dependent: true
      person4:
        age: 8
        is_tax_unit_dependent: true
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
      marital_unit3:
        members: [person4]
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    # person1 is a veteran and person2 is the veteran's spouse (same marital
    # unit). person3, the veteran's adult sibling, has a separate marital unit
    # and, as a dependent, is 18 or older, not a full-time student, and not
    # disabled, so no military connection reaches them. person4 is a citizen
    # child (also a dependent child of the veteran).
    is_snap_alien_military_connected: [true, true, false, true]
    is_snap_alien_waiting_period_exempt: [true, true, false, true]
    meets_snap_qualified_alien_waiting_period: [true, true, false, true]
    is_snap_immigration_status_eligible: [true, true, false, true]
    is_snap_excluded_member: [false, false, true, false]
    snap_unit_size: 3
    # 3 eligible / 4 household members; person3 has no income to prorate.
    snap_prorated_income_fraction: 0.75
    snap_earned_income: 2_000
    # $2,000 - $400 earned income deduction - $209 standard deduction
    # = $1,391.
    snap_net_income: 1_391
    # 30% of $1,391 = $417.30, rounded up to $418.
    snap_expected_contribution: 418
    # Three-person maximum allotment $785 - $418 = $367, as in Cases 2 and 8.
    snap_max_allotment: 785
    snap: 367

- name: Case 12, LPR siblings age 17 and 18 inside the waiting period split at the under-18 exception.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        employment_income: 24_000
        employment_income_before_lsr: 24_000
        is_tax_unit_head: true
      person2:
        age: 17
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_tax_unit_dependent: true
      person3:
        age: 18
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 1
        is_tax_unit_dependent: true
        is_tax_unit_spouse: false
      person4:
        age: 8
        is_tax_unit_dependent: true
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
      marital_unit4:
        members: [person4]
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    spm_units:
      spm_unit:
        members: [person1, person2, person3, person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: TX
  output:
    # person1 is a citizen earner and person4 a citizen child. The child
    # under 14 keeps every adult clear of the ABAWD time limit, so person3's
    # exclusion comes only from the waiting period.
    is_snap_alien_waiting_period_exempt: [false, true, false, true]
    meets_snap_qualified_alien_waiting_period: [true, true, false, true]
    is_snap_immigration_status_eligible: [true, true, false, true]
    is_snap_excluded_member: [false, false, true, false]
    snap_unit_size: 3
    snap_earned_income: 2_000
    # $2,000 - $400 - $209 = $1,391. Were person3 eligible, the four-person
    # unit would have $2,000 - $400 - $223 = $1,377 and receive
    # $994 - $414 = $580.
    snap_net_income: 1_391
    snap_expected_contribution: 418
    snap_max_allotment: 785
    snap: 367
