# ABAWD disqualification is an eligibility LIMITATION (7 U.S.C. 2015(o)); it
# must never make an otherwise-ineligible household eligible or raise its
# benefit. The model excludes a work-requirement-ineligible member's needs
# (snap_unit_size) while counting the member's income in full (the
# 7 CFR 273.11(c)(1) treatment), so disqualification can only reduce
# eligibility and benefits. A prior 273.11(c)(2) proration of the member's
# income let households over the limits at full composition qualify at the
# reduced size on the disqualified earner's halved income — failing a work
# requirement CREATED a ~$288/yr benefit in Case 2 and inverted the sign of
# ABAWD reforms at population scale (switching the time limit ON raised
# SNAP spending +$0.12B on the first release-scale run).
#
# Case 1 pins the loss direction for a zero-income noncompliant member;
# Cases 2-3 jointly pin the no-gain invariant for an earning noncompliant
# member (2 = failing, 3 = the compliant counterfactual).

- name: Case 1, noncompliant zero-income ABAWD shrinks the unit and lowers the benefit.
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      worker:
        # age (YEAR) rather than monthly_age: setting monthly_age at a year
        # period divides the value across months (273.24(c)(4) gotcha).
        age: 30
        employment_income: 12_000
        weekly_hours_worked_before_lsr: 25
      abawd:
        age: 30
        employment_income: 0
        weekly_hours_worked_before_lsr: 0
    spm_units:
      unit:
        members: [worker, abawd]
    households:
      household:
        members: [worker, abawd]
        state_code: TX
  output:
    snap_unit_size: 1
    is_snap_eligible: true
    # 1-person allotment on the compliant worker's full income; strictly
    # below the ~4,466 the unit receives when both members comply.
    snap: 1_473

- name: Case 2, household over-income at full size stays ineligible when the earner fails the time limit.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      elder:
        age: 66
        social_security_retirement: 9_600
      abawd:
        age: 30
        employment_income: 30_000
        weekly_hours_worked_before_lsr: 0
    spm_units:
      unit:
        members: [elder, abawd]
    households:
      household:
        members: [elder, abawd]
        state_code: TX
  output:
    # The same household with the earner COMPLYING (25h/week) is ineligible:
    # $30,000 wages + $9,600 Social Security exceed the 2-person limits.
    # His failing the ABAWD time limit cannot qualify it. Current
    # implementation: is_snap_eligible flips true and snap = ~288.
    is_snap_eligible: false
    snap: 0

- name: Case 3, benefit with a noncompliant earning member never exceeds the compliant counterfactual.
  period: 2026
  absolute_error_margin: 0
  input:
    people:
      elder:
        age: 66
        social_security_retirement: 9_600
      abawd:
        age: 30
        employment_income: 30_000
        weekly_hours_worked_before_lsr: 25
    spm_units:
      unit:
        members: [elder, abawd]
    households:
      household:
        members: [elder, abawd]
        state_code: TX
  output:
    # Compliant counterfactual for Case 2: same unit, earner works 25h/week.
    # Pinned so Cases 2 and 3 together assert the no-gain invariant
    # (snap[noncompliant] <= snap[compliant]).
    is_snap_eligible: false
    snap: 0
