- name: California MCE household of four with rent and no utility allowance receives SNAP above the net standard.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      parent1:
        age: 35
        employment_income: 45_000
        weekly_hours_worked_before_lsr: 40
      parent2:
        age: 33
      child1:
        age: 8
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
        housing_cost: 10_200
        # Isolate MCE from the separate federal heat-and-eat change. The
        # household has no utility costs and this case assumes no allowance.
        snap_utility_allowance: 0
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: CA
  output:
    # Monthly wages $45,000 / 12 = $3,750 are within the $5,360 MCE ceiling.
    snap_gross_income: 3_750
    is_tanf_non_cash_eligible: true
    # Net before shelter: $3,750 - 20% x $3,750 - $223 = $2,777.
    snap_earned_income_deduction: 750
    snap_standard_deduction: 223
    snap_net_income_pre_shelter: 2_777
    # Rent $10,200 / 12 = $850 is below half-net $1,388.50, with no SUA.
    snap_excess_shelter_expense_deduction: 0
    snap_net_income: 2_777
    meets_snap_net_income_test: false
    # CDSS June 30, 2014 MCE letter, page 3: households of three or more
    # receive their issuance-table allotment even above the net standard.
    meets_snap_categorical_eligibility: true
    is_snap_eligible: true
    # $994 - ceil(30% x $2,777 = $833.10) = $994 - $834 = $160.
    snap: 160
