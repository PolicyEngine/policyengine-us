      2026: 20_000
  output:
    # 20,000 / 52 = 384.62 >= 217.50. Before this change: fails (0 hours).
    is_snap_work_registration_exempt_non_age: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

- name: Case 17, 14 weeks unemployed from an October start rounds up to a fourth month in January.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    unemployment_compensation:
      2026: 5_000
    weeks_unemployed:
      2026: 14
    person_id:
      2026: 14
  output:
    # months = ceil(14 x 12 / 52) = ceil(3.23) = 4; person_id 14 starts in
    # October -> Oct, Nov, Dec, Jan (the rounded-up fourth month)
    is_receiving_unemployment_compensation: true
    meets_snap_abawd_work_requirements: true

- name: Case 18, one week unemployed from a December start covers December only.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    unemployment_compensation:
      2026: 5_000
    weeks_unemployed:
      2026: 1
    person_id:
      2026: 19
  output:
    # months = ceil(1 x 12 / 52) = 1; person_id 19 starts in December -> Dec
    # only; no hours -> fails the 80-hour test in January
    is_receiving_unemployment_compensation: false
    meets_snap_abawd_work_requirements: false

- name: Case 19, toggle off restores usual-hours behavior for a 10-week 40-hour worker.
  period: 2026-01
  input:
    gov.simulation.snap_work_hours_use_weeks_worked: false
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 40
    weeks_worked:
      2026: 10
    employment_income_before_lsr:
      2026: 6_000
  output:
    # hours = 40 >= 30 (earnings per week worked = 6,000 / 10 = 600 also >= 217.50)
    is_snap_work_registration_exempt_employed: true
    meets_snap_abawd_work_requirements: true

- name: Case 20, UI block start rotates with person_id across household members.
  period: 2026-01
  input:
    people:
      person1:
        age:
          2026: 30
        is_disabled:
          2026: false
        unemployment_compensation:
          2026: 5_000
        weeks_unemployed:
          2026: 13
      person2:
        age:
          2026: 30
        is_disabled:
          2026: false
        unemployment_compensation:
          2026: 5_000
        weeks_unemployed:
          2026: 13
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: TX
  output:
    # person_id = [0, 1] -> starts Jan and Feb; 3 months each.
    # person1: Jan-Mar covers January; person2: Feb-Apr does not.
    # (A January-anchored block would give [true, true].)
    is_receiving_unemployment_compensation: [true, false]
    meets_snap_abawd_work_requirements: [true, false]

- name: Case 21, second member's 11-month UI block from February does not wrap into January.
  period: 2026-01
  input:
    people:
      person1:
        age:
          2026: 30
        is_disabled:
          2026: false
      person2:
        age:
          2026: 30
        is_disabled:
          2026: false
        unemployment_compensation:
          2026: 15_000
        weeks_unemployed:
          2026: 47
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: TX
  output:
    # person2: months = ceil(47 x 12 / 52) = 11 -> Feb through Dec, so January
    # is outside the block; person1 has no UI.
    is_receiving_unemployment_compensation: [false, false]

