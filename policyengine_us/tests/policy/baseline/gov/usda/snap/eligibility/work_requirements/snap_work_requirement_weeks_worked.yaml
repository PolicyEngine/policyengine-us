# SNAP work tests with weeks worked, the earnings-equivalent 30-hour prong
# and months of unemployment compensation receipt (issue #9660).
#
# Every case is a childless 30-year-old without a disability in TX, which has
# no ABAWD area waiver (the default state, CA, is statewide-waived through
# 2026-01-31), at 2026-01, where the post-HR1 rules apply in TX.
#
# - Averaged weekly hours = usual hours x min(weeks worked, 52) / 52, or usual
#   hours when weeks worked are 0 or absent.
# - ABAWD test (7 CFR 273.24(a)(1)(i)): 20 hours a week averaged monthly
#   means 80 hours a month: (averaged hours + work program hours) x 52 / 12
#   >= 80.
# - 30-hour exemption (7 CFR 273.7(b)(1)(vii)): averaged hours >= 30, or
#   earnings / 52 >= 7.25 x 30 = 217.50 a week (11,310 a year).
# - UI exemption (7 CFR 273.7(b)(1)(v)): months = ceil(weeks unemployed x
#   12 / 52), placed from the start month splitmix64(person_id) mod 12.
#   Start months used: person_id 0 -> Jan, 1 -> Feb, 6 -> May, 14 -> Oct,
#   19 -> Dec.
#
# The issue ran some of these cases in March, April, May or July. They run
# here in January, and the month placement is set through person_id instead.

# --- 7 CFR 273.24(a)(1)(i): 20 hours per week, averaged monthly ---

- name: Case 1, full-year 25-hour worker passes the ABAWD 20-hour test.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 25
    weeks_worked:
      2026: 52
    employment_income_before_lsr:
      2026: 9_425
  output:
    # hours = 25 x 52 / 52 = 25 < 30; 25 x 52 / 12 = 108.3 >= 80
    # earnings = 9,425 / 52 = 181.25 < 217.50
    is_snap_work_registration_exempt_employed: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: true

- name: Case 2, 10-week worker at 40 usual hours fails the ABAWD 20-hour test.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 40
    weeks_worked:
      2026: 10
    employment_income_before_lsr:
      2026: 6_000
  output:
    # hours = 40 x 10 / 52 = 7.69 < 30; 7.69 x 52 / 12 = 33.3 < 80
    # earnings = 6,000 / 52 = 115.38 < 217.50
    # Before this change: 40 >= 30 -> exempt and passing in every month.
    is_snap_work_registration_exempt_employed: false
    is_snap_work_registration_exempt_non_age: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: false

# --- 7 CFR 273.7(b)(1)(vii): 30 hours weekly ---

- name: Case 3, full-year 30-hour worker is exempt from work registration and the time limit.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 30
    weeks_worked:
      2026: 52
  output:
    # hours = 30 x 52 / 52 = 30 >= 30
    is_snap_work_registration_exempt_employed: true
    is_snap_work_registration_exempt_non_age: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

# --- 7 CFR 273.7(b)(1)(vii): earnings equivalent ---

- name: Case 4, 15-hour worker earning above the minimum wage times 30 is exempt.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 15
    weeks_worked:
      2026: 52
    employment_income_before_lsr:
      2026: 12_000
  output:
    # hours = 15 < 30; earnings = 12,000 / 52 = 230.77 >= 217.50
    # Before this change: fails (15 x 52 / 12 = 65 < 80, earnings prong not modeled).
    is_snap_work_registration_exempt_employed: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

# --- 7 CFR 273.7(b)(1)(v): receiving unemployment compensation ---

- name: Case 5, UI recipient with 13 weeks unemployed from a January start is exempt in January.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    unemployment_compensation:
      2026: 5_000
    weeks_unemployed:
      2026: 13
  output:
    # months = ceil(13 x 12 / 52) = 3; person_id 0 starts in January -> Jan-Mar
    is_receiving_unemployment_compensation: true
    is_snap_work_registration_exempt_non_age: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

- name: Case 6, UI recipient whose 13-week block starts in February is not exempt in January.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    unemployment_compensation:
      2026: 5_000
    weeks_unemployed:
      2026: 13
    person_id:
      2026: 1
  output:
    # 3 months from February -> Feb-Apr, so January is outside the block;
    # no hours -> 0 x 52 / 12 = 0 < 80. Before this change: exempt in every month.
    is_receiving_unemployment_compensation: false
    is_snap_work_registration_exempt_non_age: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: false

# --- Inertness: no weeks_worked / weeks_unemployed reproduces usual-hours results ---

- name: Case 7, no weeks worked keeps usual hours, so 40 hours is still exempt.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 40
  output:
    # hours = 40 (weeks not reported) >= 30
    is_snap_work_registration_exempt_employed: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

- name: Case 8, no weeks worked keeps usual hours, so 25 hours passes but is not exempt.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 25
  output:
    # hours = 25 < 30; 25 x 52 / 12 = 108.3 >= 80
    is_snap_work_registration_exempt_employed: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: true

- name: Case 9, no weeks worked keeps usual hours, and 19 hours meets 80 hours a month.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 19
  output:
    # 7 CFR 273.24(a)(1)(i): 20 hours a week averaged monthly means 80 hours
    # a month. 19 x 52 / 12 = 82.3 >= 80, so this passes (the issue expected a
    # failure under a weekly 20-hour threshold).
    is_snap_work_registration_exempt_employed: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: true

- name: Case 10, UI with no weeks unemployed still exempts every month, even from a May start.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    unemployment_compensation:
      2026: 5_000
    person_id:
      2026: 6
  output:
    # weeks_unemployed = 0 -> 12 months; person_id 6 starts in May, and a
    # 12-month block covers January as well.
    is_receiving_unemployment_compensation: true
    is_snap_work_registration_exempt_non_age: true
    meets_snap_abawd_work_requirements: true

# --- Boundaries and additional paths ---

- name: Case 11, 30 usual hours for 51 weeks is not 30-hour exempt but passes 80 hours a month.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    weekly_hours_worked_before_lsr:
      2026: 30
    weeks_worked:
      2026: 51
  output:
    # hours = 30 x 51 / 52 = 29.42 < 30; 29.42 x 52 / 12 = 127.5 >= 80
    is_snap_work_registration_exempt_employed: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: true

- name: Case 12, annual earnings of exactly 11,310 meet the earnings equivalent.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    employment_income_before_lsr:
      2026: 11_310
  output:
    # 11,310 / 52 = 217.50 >= 7.25 x 30 = 217.50 ("at least equal")
    is_snap_work_registration_exempt_employed: true
    is_subject_to_snap_abawd: false
    meets_snap_abawd_work_requirements: true

- name: Case 13, annual earnings of 11,300 fall just short.
  period: 2026-01
  input:
    age:
      2026: 30
    is_disabled:
      2026: false
    state_code:
      2026: TX
    employment_income_before_lsr:
      2026: 11_300
  output:
    # 11,300 / 52 = 217.31 < 217.50; no hours -> 0 < 80
    is_snap_work_registration_exempt_employed: false
    is_subject_to_snap_abawd: true
    meets_snap_abawd_work_requirements: false

