# Cases 11 onward apply the qualified alien waiting period of 8 USC
# 1612(a)(2)(L) and 7 CFR 273.4(a)(6) on top of the 7 USC 2015(f) status
# list. years_since_us_entry defaults to 5, which satisfies the waiting
# period, so Cases 1-10 are unchanged and every case below that exercises
# the waiting period sets it explicitly.

- name: Case 11, adult LPR inside the five-year waiting period is ineligible.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 30
    years_since_us_entry: 2
    state_code: TX
  output:
    is_snap_immigration_status_eligible: false

- name: Case 12, adult LPR with five years in qualified status is eligible.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 30
    years_since_us_entry: 5
    state_code: TX
  output:
    is_snap_immigration_status_eligible: true

- name: Case 13, LPR child inside the waiting period is eligible.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 10
    years_since_us_entry: 1
    state_code: TX
  output:
    is_snap_immigration_status_eligible: true

- name: Case 14, adult LPR receiving disability benefits inside the waiting period is eligible.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 45
    years_since_us_entry: 2
    social_security_disability: 12_000
    state_code: TX
  output:
    is_snap_immigration_status_eligible: true

- name: Case 15, adult LPR with 40 qualifying quarters inside the waiting period is eligible.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 40
    years_since_us_entry: 3
    snap_alien_qualifying_quarters: 40
    state_code: TX
  output:
    is_snap_immigration_status_eligible: true

- name: Case 16, California LPR inside the waiting period is ineligible during the delayed implementation.
  period: 2026-01
  input:
    immigration_status: LEGAL_PERMANENT_RESIDENT
    age: 30
    years_since_us_entry: 2
    state_code: CA
  output:
    # The California status list still includes LPRs, but the waiting
    # period applies after the California override (CDSS ACL 25-92).
    ca_snap_immigration_status_eligible: true
    is_snap_immigration_status_eligible: false

- name: Case 17, California refugee remains eligible before April 2026 regardless of years in status.
