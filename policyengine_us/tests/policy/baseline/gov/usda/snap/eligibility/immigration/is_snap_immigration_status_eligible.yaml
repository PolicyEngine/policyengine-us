  period: 2025-01
  input:
    people:
      person1:
        immigration_status: PAROLED_ONE_YEAR
        age: 30
      person2:
        immigration_status: CONDITIONAL_ENTRANT
        age: 30
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # Default inertness: unchanged from the result before the waiting
    # period was added.
    is_snap_immigration_status_eligible: [true, true]

- name: Case 52, California parolee child inside the waiting period is eligible during the delayed implementation.
  period: 2026-01
  input:
    immigration_status: PAROLED_ONE_YEAR
    age: 10
    years_since_us_entry: 2
    state_code: CA
  output:
    # The California status list still admits parolees before 2026-04-01,
    # and the under-18 exception lifts the waiting period.
    ca_snap_immigration_status_eligible: true
    is_snap_alien_waiting_period_exempt: true
    is_snap_immigration_status_eligible: true

- name: Case 53, California conditional entrant receiving disability benefits inside the waiting period is eligible during the delayed implementation.
  period: 2026-01
  input:
    immigration_status: CONDITIONAL_ENTRANT
