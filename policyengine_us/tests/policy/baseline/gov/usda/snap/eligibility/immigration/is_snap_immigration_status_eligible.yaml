  input:
    immigration_status: PAROLED_ONE_YEAR
    age: 30
    years_since_us_entry: 2
    snap_alien_qualifying_quarters: 40
    snap_lpr_waiting_period_exempt_category: true
    state_code: CA
  output:
    # Both exceptions are limited to LPRs, and the California override does
    # not widen them.
    ca_snap_immigration_status_eligible: true
    is_snap_immigration_status_eligible: false

