- name: Case 31, Missouri three children under six still allow only one caregiver claim.
  period: 2025
  input:
    people:
      person1: {age: 30, is_tax_unit_head_or_spouse: true, is_full_time_college_student: true}
      person2: {age: 32, is_tax_unit_head_or_spouse: true, is_full_time_college_student: true}
      person3: {age: 1, is_tax_unit_head_or_spouse: false}
      person4: {age: 3, is_tax_unit_head_or_spouse: false}
      person5: {age: 5, is_tax_unit_head_or_spouse: false}
    tax_units:
      tax_unit: {members: [person1, person2, person3, person4, person5]}
    spm_units:
      spm_unit: {members: [person1, person2, person3, person4, person5], tanf: 0}
    households:
      household: {members: [person1, person2, person3, person4, person5], state_code: MO}
  output:
    meets_snap_parent_exception: [true, false, false, false, false]
    is_snap_ineligible_student: [false, true, false, false, false]

