# Two-parent household cases - requires child under 6 only
# The default test state (California) caps the claim at one adult per
# child (Alameda CalFresh Handbook 63-04.05 § G); the claim goes to the
# first parent listed when neither is a student.
- name: Two-parent household with child under 6 lets one adult claim the exception
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        age: 28
      parent2:
        is_tax_unit_head_or_spouse: true
        age: 30
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
  output:
    meets_snap_parent_exception: [true, false, false]

- name: Two-parent household with child exactly 6 does not meet exception
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        age: 32
      parent2:
        is_tax_unit_head_or_spouse: true
        age: 34
      child:
        age: 6
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
  output:
    meets_snap_parent_exception: [false, false, false]

- name: Two-parent household with child between 6 and 12 does not meet exception
