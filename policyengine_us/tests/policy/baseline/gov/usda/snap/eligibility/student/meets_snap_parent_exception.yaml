# Missouri lets only one adult in the SNAP household claim the care of a
# child under six, however many young children live there (DSS SNAP
# Manual § 1135.025.00). The claim goes to the parent who is a student.
- name: Missouri two-parent household lets only one adult claim the child-care exception
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 32
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MO
  output:
    meets_snap_parent_exception: [true, false, false]

- name: Missouri gives the single child-care claim to the parent who is a student
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 32
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
        tanf: 0
    households:
      household:
        members: [parent1, parent2, child]
        state_code: MO
  output:
    meets_snap_parent_exception: [false, true, false]

- name: Missouri keeps the cap at one adult even with two children under six
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 32
      child1:
        age: 4
      child2:
        age: 2
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: MO
  output:
    meets_snap_parent_exception: [true, false, false, false]

# Texas caps the claim per child, not per household: two children under six
# let both parents qualify (Texas Works Handbook B-412(7); North Carolina
# FNS 235.04(E) says the same). The claim goes to the student who has no
# other exception, whichever parent is listed first.
# TANF is zeroed in the ordering cases: a zero-income family would be
# computed as receiving TANF, which gives every parent the TANF exception
# and would hide the ordering.
- name: Texas two-parent household with one child under six lets one adult claim the exception
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 32
      child:
        age: 4
    tax_units:
      tax_unit:
        members: [parent1, parent2, child]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child]
    households:
      household:
        members: [parent1, parent2, child]
        state_code: TX
  output:
    meets_snap_parent_exception: [true, false, false]

- name: Texas two-parent household with two children under six lets both adults claim the exception
  period: 2024
  input:
    people:
      parent1:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        age: 32
      child1:
        age: 4
      child2:
        age: 2
    tax_units:
      tax_unit:
        members: [parent1, parent2, child1, child2]
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: TX
  output:
    meets_snap_parent_exception: [true, true, false, false]

- name: Texas gives the single claim to the student without another exception when the working student is listed first
