      parent1:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        weekly_hours_worked_before_lsr: 0
        age: 30
      parent2:
        is_tax_unit_head_or_spouse: true
        is_full_time_college_student: true
        weekly_hours_worked_before_lsr: 20
