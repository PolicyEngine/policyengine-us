# Federal HR1 effective date: 2025-07-04
# CA delays to 2026-06-01 per ACL 25-93
# HI delays to 2025-11-01
# AK delays to 2025-11-01 (same as HI). HR1 is then in effect statewide,
# including Anchorage, so the new Alaska Native/Indian exception applies.
# Alaska's 7 U.S.C. 2015(o)(7) good-faith window (the temporary retained
# pre-HR1 exceptions, 2025-11-01 through 2026-10-31) is tracked separately
# by is_snap_abawd_in_good_faith_exemption_window, not by this toggle.

- name: Case 1, non-CA after federal effective date.
  period: 2026-01
  input:
    state_code: TX
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 2, non-CA before federal effective date.
  period: 2024-01
  input:
    state_code: TX
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 3, CA before state adoption date.
  period: 2026-01
  input:
    state_code: CA
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 4, CA after state adoption date.
  period: 2027-01
  input:
    state_code: CA
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 5, HI before federal effective date.
  period: 2025-06
  input:
    state_code:
      2025: HI
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 6, AK before federal effective date.
  period: 2025-06
  input:
    state_code:
      2025: AK
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 7, default state in effect between federal and HI/AK adoption dates.
  period: 2025-08
  input:
    state_code:
      2025: TX
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 8, HI not in effect between federal and state adoption dates.
  period: 2025-08
  input:
    state_code:
      2025: HI
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 9, AK not in effect between federal effective date and exemption window.
  period: 2025-08
  input:
    state_code:
      2025: AK
  output:
    is_snap_abawd_hr1_in_effect: false

- name: Case 10, HI in effect at state adoption date.
  period: 2025-11
  input:
    state_code:
      2025: HI
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 11, AK in effect at its 2025-11-01 adoption date (window tracked separately).
  period: 2025-11
  input:
    state_code:
      2025: AK
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 12, HI in effect in 2026 steady state.
  period: 2026-01
  input:
    state_code: HI
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 13, AK in effect during the good-faith exemption window.
  period: 2026-01
  input:
    state_code: AK
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 14, AK still in effect after the good-faith exemption window closes.
  period: 2026-11
  input:
    state_code:
      2026: AK
  output:
    is_snap_abawd_hr1_in_effect: true

- name: Case 15, AK in effect in 2027 steady state.
  period: 2027-01
  input:
    state_code: AK
  output:
    is_snap_abawd_hr1_in_effect: true

# AK adopts HR1 at 2025-11-01, so hr1_in_effect is true for every month from
# then on, including the good-faith window. The window itself (the retained
# pre-HR1 exceptions) is a separate variable; see
# is_snap_abawd_in_good_faith_exemption_window.yaml for its 2026-10 -> 2026-11
# boundary. state_code is a YEAR variable read via period.this_year, so
# non-January month periods require year-keyed inputs (2026: AK) to avoid a
# period-parsing error in policyengine-core input storage.
- name: Case 16, AK in effect in the last month of the good-faith window.
  period: 2026-10
  input:
    state_code:
      2026: AK
  output:
    is_snap_abawd_hr1_in_effect: true
