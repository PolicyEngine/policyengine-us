- name: No assets, passes test
  period: 2022-01
  input:
    snap_assets:
      2022: 0
  output:
    meets_snap_asset_test: true

- name: Assets over limit for a non-elderly/disabled household
  period: 2022-01
  input:
    snap_assets:
      2022: 2_600
  output:
    meets_snap_asset_test: false

- name: Assets under limit for an elderly/disabled household
  period: 2022-01
  input:
    snap_assets:
      2022: 2_600
    has_snap_elderly_disabled_member: true
  output:
    meets_snap_asset_test: true

- name: Assets over limit for an elderly/disabled household
  period: 2022-01
  input:
    snap_assets:
      2022: 3_800
    has_snap_elderly_disabled_member: true
  output:
    meets_snap_asset_test: false

- name: Excluded elderly member does not confer the elderly/disabled resource limit.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 70
        immigration_status: UNDOCUMENTED
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap_assets:
          2026: 4_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # $4,000 exceeds the $3,000 standard limit, and the excluded elderly
    # member does not confer the $4,500 elderly/disabled limit
    # (7 CFR 273.11(c)(2)(iv)(D)).
    meets_snap_asset_test: false

- name: Eligible elderly member confers the elderly/disabled resource limit.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
      person2:
        age: 70
        immigration_status: CITIZEN
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap_assets:
          2026: 4_000
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # $4,000 is between the $3,000 standard and $4,500 elderly/disabled
    # limits, and the eligible elderly member confers the higher limit.
    meets_snap_asset_test: true

# 7 U.S.C. 2014(g)(1): 2,607.87 + 29.87 + 362.26 = 3,000.00, at the FY2025
# standard limit. The float32 balances add to 3,000.0002 unless rounded.
- name: Three accounts that total exactly the standard limit pass
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 2_607.87
    stock_assets: 29.87
    bond_assets: 362.26
  output:
    meets_snap_asset_test: true

# 2,607.87 + 29.87 + 362.27 = 3,000.01, a cent over the limit.
- name: Three accounts a cent over the standard limit fail
  period: 2025-01
  input:
    age: 30
    bank_account_assets: 2_607.87
    stock_assets: 29.87
    bond_assets: 362.27
  output:
    meets_snap_asset_test: false
