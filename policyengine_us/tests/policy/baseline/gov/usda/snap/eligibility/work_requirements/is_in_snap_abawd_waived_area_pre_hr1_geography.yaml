# Snapshot boundary. For July 2025 the lists are read at 2025-07-01, the
# earlier of the period start and 2025-07-03. A waiver that ended on
# 2025-06-30 is on neither list, so it is not revived in July 2025 or
# later. A waiver still active on 2025-07-03 stays waived after its actual
# end (Pennsylvania's ended 2025-08-31).

- name: Case 18, MA resident of Berkshire County is not waived in the enactment month or in 2026 because the waiver ended on 2025-06-30.
  period: 2025
  input:
    gov.usda.snap.work_requirements.abawd.hr1_waiver_criteria.in_effect: false
    state_code:
      2025: MA
      2026: MA
    county_fips:
      2025: "25003"
      2026: "25003"
  output:
    is_in_snap_abawd_waived_area:
      2025-07: false
      2026-01: false

