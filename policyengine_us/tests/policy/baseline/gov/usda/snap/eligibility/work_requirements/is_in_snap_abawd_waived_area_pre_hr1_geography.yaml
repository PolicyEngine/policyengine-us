# snapshot but was not waived in June 2025; reading the snapshot for every
# month with the switch off would wrongly waive it in June.

- name: Case 3, MN resident of Norman County is not waived before the 2025-07-01 replacement waiver and is waived after enactment.
  period: 2025
  input:
    gov.usda.snap.work_requirements.abawd.hr1_waiver_criteria.in_effect: false
    age: 30
    weekly_hours_worked_before_lsr: 1
    is_disabled: false
    state_code: MN
    county_fips: "27107"
  output:
    is_in_snap_abawd_waived_area:
      2025-06: false
      2025-08: true

