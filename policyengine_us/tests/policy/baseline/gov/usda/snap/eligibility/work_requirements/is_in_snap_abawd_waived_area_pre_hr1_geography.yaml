# SNAP ABAWD area waivers under the pre-P.L. 119-21 waiver criteria.
# P.L. 119-21 section 10102(b), effective on enactment (2025-07-04), struck
# the "does not have a sufficient number of jobs" criterion from
# 7 U.S.C. 2015(o)(4)(A)(ii). Setting
# gov.usda.snap.work_requirements.abawd.hr1_waiver_criteria.in_effect to
# false keeps every area waived on 2025-07-03, the last day before
# enactment, waived indefinitely, in addition to the areas waived under
# current law. The 2025-07-03 geography is statewide CA, DC, IL, and NV plus
# the county lists in effect that day (including NY's 61 counties, NM's 29,
# and DE's Kent and Sussex). Months before 2025-07-04 keep current law.
# The switch is federal: it does not depend on the CA, HI, or AK dates for
# adopting the other HR1 ABAWD rules.

- name: Case 1, IL single adult with no work stays waived after the statewide waiver's 2026-01-31 expiration when the pre-HR1 waiver criteria apply.
  period: 2026
  input:
    gov.usda.snap.work_requirements.abawd.hr1_waiver_criteria.in_effect: false
    age: 30
    weekly_hours_worked_before_lsr: 0
    is_disabled: false
    state_code: IL
  output:
    is_in_snap_abawd_waived_area:
      2026-01: true
      2026-07: true
    meets_snap_abawd_work_requirements:
      2026-01: true
      2026-07: true
    meets_snap_work_requirements:
      2026-01: true
      2026-07: true
    snap_unit_size:
      2026-01: 1
      2026-07: 1

- name: Case 2, IL single adult with no work (2030-01) is still waived because the pre-enactment geography is frozen indefinitely.
  period: 2030-01
  input:
    gov.usda.snap.work_requirements.abawd.hr1_waiver_criteria.in_effect: false
    age: 30
    weekly_hours_worked_before_lsr: 0
    is_disabled: false
    state_code: IL
  output:
    is_in_snap_abawd_waived_area: true
    meets_snap_abawd_work_requirements: true

# Months before enactment keep current law. Minnesota's replacement waiver
