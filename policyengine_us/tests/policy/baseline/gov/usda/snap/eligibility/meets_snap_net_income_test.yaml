- name: Nine-person Missouri household at the published FY 2026 net limit passes
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 9
        # 7 CFR 273.9(a)(3)(ii) adds a separately rounded-up increment to
        # the eight-person standard: $54,150 / 12 = $4,512.50, rounded up to
        # $4,513, plus $5,500 / 12 = $458.33, rounded up to $459, gives
        # $4,972, matching the USDA FY 2026 table. Rounding up the whole
        # nine-person guideline ($59,650 / 12 = $4,970.83) gives only $4,971.
        snap_net_income: 4_972
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    meets_snap_net_income_test: true

