- name: Net income of exactly 50 cents over the one-person FY 2026 net limit rounds up and fails
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        # $2,048.65 - $743.15 = $1,305.50, which 7 CFR 273.10(e)(1)(ii)(A)
        # rounds up to $1,306, above the $1,305 standard. In single
        # precision the difference is $1,305.4999, which must not round
        # down to $1,305.
        snap_gross_income: 2_048.65
        snap_deductions: 743.15
    households:
      household:
        members: [person1]
        state_code: MO
  output:
    snap_net_income: 1_306
    meets_snap_net_income_test: false

- name: Nine-person Alaska household at the FY 2026 net limit passes
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 9
        # FY 2026 uses the 2025 Alaska guidelines ($19,550 first person,
        # $6,880 each additional). The eight-person guideline is $19,550 +
        # 7 x $6,880 = $67,710; $67,710 / 12 = $5,642.50, rounded up to
        # $5,643, plus $6,880 / 12 = $573.33, rounded up to $574, gives
        # $6,217 under 7 CFR 273.9(a)(3)(ii). Rounding up the whole
        # nine-person guideline ($74,590 / 12 = $6,215.83) gives only $6,216.
        snap_net_income: 6_217
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    meets_snap_net_income_test: true

