        # 7 x $6,330 = $62,300; 130% x $62,300 / 12 = $6,749.17, rounded up
        # to $6,750, plus 130% x $6,330 / 12 = $685.75, rounded up to $686,
        # gives $7,436 under 7 CFR 273.9(a)(3)(i). Rounding up the whole
