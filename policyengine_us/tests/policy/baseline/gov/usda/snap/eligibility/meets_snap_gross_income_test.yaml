- name: Twelve-person North Carolina household at the published FY 2026 gross limit passes
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 12
        # $5,867 + 4 x $596 = $8,251 under 7 CFR 273.9(a)(3)(i); rounding
        # up the whole twelve-person amount (130% x $76,150 / 12 =
        # $8,249.58) would give $8,250.
        snap_gross_test_income: 8_251
    households:
      household:
        members: [person1]
        state_code: NC
  output:
    meets_snap_gross_income_test: true

- name: Nine-person Alaska household at the FY 2026 gross limit passes
  period: 2026-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 9
        # FY 2026 uses the 2025 Alaska guidelines ($19,550 first person,
        # $6,880 each additional). The eight-person guideline is $19,550 +
        # 7 x $6,880 = $67,710; 130% x $67,710 / 12 = $7,335.25, rounded up
        # to $7,336, plus 130% x $6,880 / 12 = $745.33, rounded up to $746,
        # gives $8,082 under 7 CFR 273.9(a)(3)(i). Rounding up the whole
        # nine-person amount (130% x $74,590 / 12 = $8,080.58) gives only
        # $8,081.
        snap_gross_test_income: 8_082
    households:
      household:
        members: [person1]
        state_code: AK
  output:
    meets_snap_gross_income_test: true

