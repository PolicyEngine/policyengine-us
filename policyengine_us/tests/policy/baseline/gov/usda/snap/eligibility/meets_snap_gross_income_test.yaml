        members: [person1]
        state_code: HI
  output:
    meets_snap_gross_income_test: true

- name: Ten-person Pennsylvania household at the FY 2027 gross limit passes
  period: 2027-01
  input:
    people:
      person1: {}
    spm_units:
      spm_unit:
        members: [person1]
        snap_unit_size: 10
        # FY 2027 uses the 2026 contiguous-state guidelines ($15,960 first
        # person, $5,680 each additional). The eight-person guideline is
        # $15,960 + 7 x $5,680 = $55,720; 130% x $55,720 / 12 = $6,036.33,
        # rounded up to $6,037, plus 2 x (130% x $5,680 / 12 = $615.33,
        # rounded up to $616) gives $7,269 under 7 CFR 273.9(a)(3)(i).
        # Rounding up the whole ten-person amount (130% x $67,080 / 12 =
        # $7,267.00) gives only $7,267.
        snap_gross_test_income: 7_269
    households:
      household:
        members: [person1]
        state_code: PA
  output:
    meets_snap_gross_income_test: true

- name: Guam two-person household passes the FY 2027 gross income test
  period: 2026-10
  input:
    people:
      person1: {}
      person2: {}
    spm_units:
      spm_unit:
        members: [person1, person2]
        snap_unit_size: 2
        has_snap_elderly_disabled_member: false
        # 7 CFR 273.9(a)(1)(i): Guam uses 130% of the poverty guidelines
        # for the 48 contiguous States. FY 2027 uses the 2026 guidelines
        # ($15,960 + $5,680 = $21,640 for two people); 130% x $21,640 / 12
        # = $2,344.33, rounded up to $2,345.
        snap_gross_test_income: 1_000
    households:
      household:
        members: [person1, person2]
        state_code:
          2026: GU
  output:
    meets_snap_gross_income_test: true

