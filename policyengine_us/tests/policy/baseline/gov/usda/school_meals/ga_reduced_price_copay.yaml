# GaDOE funds both copays in SY2023-24 through federal ESSER funds.
# Date that school year from July 1 under 7 CFR 210.2. Annual formulas
# read January 1, so 2023 stays reduced and 2024 first receives coverage.
# https://gagains.org/wp-content/uploads/2024/05/GAINS-2024-Final-DOAA.pdf#page=86
# https://content.myconnectsuite.com/api/documents/5c99a830aac74fd7aaac6bfedd1b0ca0#page=27
# https://www.ecfr.gov/current/title-7/section-210.2
# For every annual case below, 16,000 / 10,000 = 1.60, between the
# federal free limit of 1.30 and reduced-price limit of 1.85.
- name: Georgia retains reduced-price charges at the start of 2023.
  period: 2023
  input:
    state_code: GA
    spm_unit_fpg: 10_000
    school_meal_countable_income: 16_000
    meets_school_meal_categorical_eligibility: false
  output:
    school_meal_tier: REDUCED
    school_meal_breakfast_tier: REDUCED
    school_meal_lunch_tier: REDUCED

- name: Georgia funds both reduced-price copays with federal funds in 2024.
  period: 2024
  input:
    state_code: GA
    spm_unit_fpg: 10_000
    school_meal_countable_income: 16_000
    meets_school_meal_categorical_eligibility: false
  output:
    school_meal_tier: FREE
    school_meal_breakfast_tier: FREE
    school_meal_lunch_tier: FREE

