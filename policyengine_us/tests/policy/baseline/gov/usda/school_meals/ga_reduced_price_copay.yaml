# Federal limits: ceil(1.30 * 10,000) = 13,000 and
# ceil(1.85 * 10,000) = 18,500. Test $1 below, at and above each limit.
# Georgia pays both copays throughout the existing reduced-price band.
# Florida retains the federal tiers at the same incomes.
- name: Georgia covers the reduced-price band and preserves its upper boundary.
  period: 2026
  input:
    state_code: [GA, GA, GA, GA, GA, GA, FL, FL, FL, FL, FL, FL]
    spm_unit_fpg: [10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000, 10_000]
    school_meal_countable_income: [12_999, 13_000, 13_001, 18_499, 18_500, 18_501, 12_999, 13_000, 13_001, 18_499, 18_500, 18_501]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false, false, false, false, false, false]
  output:
    school_meal_tier: [FREE, FREE, FREE, FREE, FREE, PAID, FREE, FREE, REDUCED, REDUCED, REDUCED, PAID]
    school_meal_breakfast_tier: [FREE, FREE, FREE, FREE, FREE, PAID, FREE, FREE, REDUCED, REDUCED, REDUCED, PAID]
    school_meal_lunch_tier: [FREE, FREE, FREE, FREE, FREE, PAID, FREE, FREE, REDUCED, REDUCED, REDUCED, PAID]

# Categorical eligibility provides free meals regardless of state copay
# funding or income: 30,000 / 10,000 = 3.00, above the income limits.
- name: Georgia keeps categorical eligibility before the first funded school year.
  period: 2023
  input:
    state_code: GA
    spm_unit_fpg: 10_000
    school_meal_countable_income: 30_000
    meets_school_meal_categorical_eligibility: true
  output:
    school_meal_tier: FREE
    school_meal_breakfast_tier: FREE
    school_meal_lunch_tier: FREE

