    school_meal_lunch_tier: FREE

# For two people, the model's 2026 guideline equals 15,960 + 5,680 =
# 21,640. Income of 34,624 / 21,640 = 1.60 falls in the reduced-price band.
# The January 1 rates give 4.60 lunch + 2.46 breakfast = 7.06 a day.
# Paid reimbursement equals 0.44 + 0.40 = 0.84 a day.
# One child * 180 days * (7.06 - 0.84) = 1,119.60 of net meal value.
# https://www.govinfo.gov/content/pkg/FR-2025-07-24/pdf/2025-13879.pdf#page=3
- name: Georgia gives both meals at no charge to a child in the reduced-price band.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      child:
        age: 10
    spm_units:
      unit:
        members: [parent, child]
        school_meal_countable_income: 34_624
        meets_school_meal_categorical_eligibility: false
    households:
      household:
        members: [parent, child]
        state_code: GA
  output:
    spm_unit_fpg: 21_640
    school_meal_fpg_ratio: 1.6
    school_meal_tier: FREE
    school_meal_breakfast_tier: FREE
    school_meal_lunch_tier: FREE
    school_meal_daily_subsidy: 7.06
    school_meal_paid_daily_subsidy: 0.84
    school_meal_net_subsidy: 1_119.60
    free_school_meals: 1_119.60
    reduced_price_school_meals: 0
