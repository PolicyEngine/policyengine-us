# Per-meal split: each meal's value is its rate above the paid rate, and
# free_school_meals takes the FREE meals' share of school_meal_net_subsidy.
# Calendar 2025 contiguous rates: breakfast FREE 2.37, PAID 0.39; lunch
# REDUCED 4.03, PAID 0.42. Breakfast 2.37 - 0.39 = 1.98; lunch
# 4.03 - 0.42 = 3.61; total 5.59. 1,006.20 * 1.98 / 5.59 = 356.40.
- name: Free breakfast with reduced-price lunch takes the breakfast share of the net subsidy.
  period: 2025
  absolute_error_margin: 0.01
  input:
    school_meal_breakfast_tier: FREE
    school_meal_lunch_tier: REDUCED
    school_meal_net_subsidy: 1_006.20
  output:
    free_school_meals: 356.40

# Both meals at the paid rate have no value above it, so the share is 0
# rather than a division by zero.
- name: No free value when both meals are paid, even with a net subsidy input.
  period: 2025
  input:
    school_meal_breakfast_tier: PAID
    school_meal_lunch_tier: PAID
    school_meal_net_subsidy: 1
  output:
    free_school_meals: 0

# State per-meal policies from income and state, one K-12 child, 180 school
# days, no categorical eligibility. Each meal counts here only when its own
# tier is FREE: (meal rate - paid rate) * 180.

# Calendar 2020 rates: breakfast (SBP) FREE 1.84, REDUCED 1.54,
# PAID 0.31; lunch (NSLP) FREE 3.41, REDUCED 3.01, PAID 0.32.
# NC at 180% of FPG: breakfast FREE, lunch REDUCED.
#   breakfast (1.84 - 0.31) * 180 = 275.40.
# WA at 180% of FPG: breakfast FREE, lunch REDUCED.
#   breakfast (1.84 - 0.31) * 180 = 275.40.
- name: Only breakfast counts as free in North Carolina and Washington in 2020.
  period: 2020
  absolute_error_margin: 0.01
  input:
    state_code: [NC, WA]
    school_meal_fpg_ratio: [1.8, 1.8]
    meets_school_meal_categorical_eligibility: [false, false]
    is_in_k12_school: [true, true]
  output:
    free_school_meals: [275.40, 275.40]

