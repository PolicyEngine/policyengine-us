# Edge case: the per-meal split uses each state group's own rates. Calendar
# 2027, one K-12 child, 180 school days. Each meal's value is its rate above
# the paid rate:
# AK breakfast FREE 4.09 - 0.64 = 3.45, REDUCED 3.79 - 0.64 = 3.15;
#   lunch FREE 7.72 - 0.74 = 6.98, REDUCED 7.32 - 0.74 = 6.58.
# HI breakfast FREE 3.29 - 0.52 = 2.77, REDUCED 2.99 - 0.52 = 2.47;
#   lunch FREE 6.19 - 0.59 = 5.60, REDUCED 5.79 - 0.59 = 5.20.
# Free value is the FREE meals' value * 180:
#   AK free breakfast, reduced-price lunch: 3.45 * 180 = 621.00.
#   AK reduced-price breakfast, free lunch: 6.98 * 180 = 1,256.40.
#   AK free breakfast, paid lunch: 3.45 * 180 = 621.00.
#   HI free breakfast, reduced-price lunch: 2.77 * 180 = 498.60.
#   HI reduced-price breakfast, free lunch: 5.60 * 180 = 1,008.00.
#   HI free breakfast, paid lunch: 2.77 * 180 = 498.60.
- name: Free meal values in Alaska and Hawaii use their own rates for mixed meal tiers in 2027.
  period: 2027
  absolute_error_margin: 0.01
  input:
    state_code: [AK, AK, AK, HI, HI, HI]
    school_meal_breakfast_tier: [FREE, REDUCED, FREE, FREE, REDUCED, FREE]
    school_meal_lunch_tier: [REDUCED, FREE, PAID, REDUCED, FREE, PAID]
    is_in_k12_school: [true, true, true, true, true, true]
  output:
    free_school_meals: [621.00, 1_256.40, 621.00, 498.60, 1_008.00, 498.60]
