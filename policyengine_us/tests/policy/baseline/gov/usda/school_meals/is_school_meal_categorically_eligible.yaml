# 42 USC 11434a(2)(A) defines a homeless child as one who lacks a fixed,
# regular and adequate nighttime residence, so every child in a household
# that lacks one qualifies at any income (1758(b)(12)(A)(iv)).
# At 300% FPG both children would otherwise pay.
# Free value = 2 children * (2.46 + 4.60 - 0.40 - 0.44) * 180
#            = 2 * 6.22 * 180 = 2,239.20.
- name: A homeless household gives every child free meals above the income limits.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      first_child:
        age: 10
      second_child:
        age: 12
    spm_units:
      unit:
        members:
        - parent
        - first_child
        - second_child
        snap: 0
        tanf: 0
        fdpir: 0
        school_meal_fpg_ratio: 3
    households:
      home:
        members:
        - parent
        - first_child
        - second_child
        state_code: AL
        is_homeless: true
  output:
    meets_school_meal_categorical_eligibility: true
    school_meal_tier: FREE
    is_school_meal_categorically_eligible:
    - true
    - true
    - true
    school_meal_child_breakfast_tier:
    - FREE
    - FREE
    - FREE
    school_meal_child_lunch_tier:
    - FREE
    - FREE
    - FREE
    school_meal_daily_subsidy: 7.06
    free_school_meals: 2239.2
    reduced_price_school_meals: 0

# 42 USC 9840(a)(1)(B)(iii)(I) lets a program enroll children above the
# income limit, and 1758(b)(12)(A)(iii) covers every child enrolled under
# 9840(a)(1)(B). Alabama, three people, 2026: FPG = 15,960 + 2 * 5,680
# = 27,320. Wages of 100,000 exceed it, so the five-year-old fails the
# Head Start income test, and no family member receives public assistance.
# The fixed 300% FPG ratio leaves the sibling paying.
# Free value = (2.46 + 4.60 - 0.40 - 0.44) * 180 = 1,119.60.
- name: Head Start enrollment qualifies a child above the Head Start income limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 100_000
        ssi: 0
      participant:
        age: 5
        is_enrolled_in_head_start: true
        ssi: 0
      sibling:
        age: 10
        ssi: 0
    spm_units:
      unit:
        members:
        - parent
        - participant
        - sibling
        snap: 0
        tanf: 0
        fdpir: 0
        school_meal_fpg_ratio: 3
    households:
      home:
        members:
        - parent
        - participant
        - sibling
        state_code: AL
  output:
    is_head_start_eligible:
    - false
    - false
    - false
    school_meal_tier: PAID
    is_school_meal_categorically_eligible:
    - false
    - true
    - false
    school_meal_child_breakfast_tier:
    - PAID
    - FREE
    - PAID
    school_meal_child_lunch_tier:
    - PAID
    - FREE
    - PAID
    free_school_meals: 1119.6
    reduced_price_school_meals: 0

# Pub. L. 111-296, section 102(b), added 42 USC 1758(b)(12)(A)(vii) for
# foster children, and section 445 makes it effective October 1, 2010.
# Calendar 2010 reads the list in force on January 1, 2010.
- name: Foster care does not qualify a child before the foster clause took effect.
  period: 2010
  input:
    age: 10
    is_in_foster_care:
      2010-12: true
    snap: 0
    tanf: 0
    fdpir: 0
  output:
    is_school_meal_categorically_eligible: false

- name: Foster care qualifies a child once the foster clause took effect.
  period: 2011
  input:
    age: 10
    is_in_foster_care:
      2011-12: true
    snap: 0
    tanf: 0
    fdpir: 0
  output:
    is_school_meal_categorically_eligible: true
