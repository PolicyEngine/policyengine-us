# 42 USC 1758(b)(12)(A)(iii); 7 CFR 245.6(b)(7)-(8):
# Head Start enrollment qualifies that child; SNAP qualifies every child.
# https://www.ecfr.gov/current/title-7/section-245.6#p-245.6(b)(8)
# The income ratio stays fixed to isolate categorical eligibility.
# At 300% FPG, a sibling pays; at 100% FPG, a sibling qualifies by income.
# Calendar 2026 contiguous rates, USDA SY 2025-26:
# https://www.govinfo.gov/content/pkg/FR-2025-07-24/pdf/2025-13879.pdf
# Free value per K12 child = (2.46 + 4.60 - 0.40 - 0.44) * 180 = 1,119.60.
# A four-year-old defaults outside K12, so contributes no school-meal value.
# A five-year-old defaults in K12. Each child counts once in the unit total.
# Mixed free/reduced annual value = 1,119.60 + 993.60 = 2,113.20.
# PolicyEngine's Head Start eligibility counts SSI receipt, but
# 42 USC 1758(b)(12)(A)(iii) qualifies a child only through enrollment.
- name: Head Start enrollment qualifies a preschooler without changing an older sibling.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
      participant:
        age: 4
        is_enrolled_in_head_start: true
      sibling:
        age: 10
    spm_units:
      unit:
        members:
        - parent
        - participant
        - sibling
        snap: 0
        tanf: 0
        fdpir: 0
        school_meal_fpg_ratio: 3
    households:
      home:
        members:
        - parent
        - participant
        - sibling
        state_code: AL
  output:
    is_school_meal_categorically_eligible:
    - false
    - true
    - false
    school_meal_child_breakfast_tier:
    - PAID
    - FREE
    - PAID
    school_meal_child_lunch_tier:
    - PAID
    - FREE
    - PAID
    school_meal_net_subsidy: 0.0
    free_school_meals: 0.0
    reduced_price_school_meals: 0
