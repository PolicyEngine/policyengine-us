# Edge case: the same Alaska and Hawaii inputs as the free_school_meals case.
# Calendar 2027, one K-12 child, 180 school days. Reduced-price value is the
# REDUCED meals' value above the paid rate * 180:
#   AK free breakfast, reduced-price lunch: (7.32 - 0.74) * 180 = 1,184.40.
#   AK reduced-price breakfast, free lunch: (3.79 - 0.64) * 180 = 567.00.
#   AK free breakfast, paid lunch: no reduced-price meal, 0.
#   HI free breakfast, reduced-price lunch: (5.79 - 0.59) * 180 = 936.00.
#   HI reduced-price breakfast, free lunch: (2.99 - 0.52) * 180 = 444.60.
#   HI free breakfast, paid lunch: no reduced-price meal, 0.
# With the free values, each pair sums to the net subsidy, for example
# AK 621.00 + 1,184.40 = (11.41 - 1.38) * 180 = 1,805.40.
- name: Reduced-price meal values in Alaska and Hawaii use their own rates for mixed meal tiers in 2027.
  period: 2027
  absolute_error_margin: 0.01
  input:
    state_code: [AK, AK, AK, HI, HI, HI]
    school_meal_breakfast_tier: [FREE, REDUCED, FREE, FREE, REDUCED, FREE]
    school_meal_lunch_tier: [REDUCED, FREE, PAID, REDUCED, FREE, PAID]
    is_in_k12_school: [true, true, true, true, true, true]
  output:
    reduced_price_school_meals: [1_184.40, 567.00, 0, 936.00, 444.60, 0]
