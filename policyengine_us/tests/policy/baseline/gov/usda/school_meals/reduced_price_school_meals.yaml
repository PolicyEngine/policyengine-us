# Per-meal split: reduced_price_school_meals takes the REDUCED meals' share
# of school_meal_net_subsidy. Calendar 2026 contiguous rates: breakfast
# REDUCED 2.16, PAID 0.40; lunch FREE 4.60, PAID 0.44. Breakfast
# 2.16 - 0.40 = 1.76; lunch 4.60 - 0.44 = 4.16; total 5.92.
# 1,065.60 * 1.76 / 5.92 = 316.80.
- name: Reduced-price breakfast with free lunch takes the breakfast share of the net subsidy.
  period: 2026
  absolute_error_margin: 0.01
  input:
    school_meal_breakfast_tier: REDUCED
    school_meal_lunch_tier: FREE
    school_meal_net_subsidy: 1_065.60
  output:
    reduced_price_school_meals: 316.80

# Both meals at the paid rate have no value above it, so the share is 0
# rather than a division by zero.
- name: No reduced-price value when both meals are paid, even with a net subsidy input.
  period: 2026
  input:
    school_meal_breakfast_tier: PAID
    school_meal_lunch_tier: PAID
    school_meal_net_subsidy: 1
  output:
    reduced_price_school_meals: 0

# State per-meal policies from income and state, one K-12 child, 180 school
# days, no categorical eligibility. Each meal counts here only when its own
# tier is REDUCED: (meal rate - paid rate) * 180.

# Calendar 2020 rates: breakfast (SBP) FREE 1.84, REDUCED 1.54,
# PAID 0.31; lunch (NSLP) FREE 3.41, REDUCED 3.01, PAID 0.32.
# NC at 180% of FPG: breakfast FREE, lunch REDUCED.
#   lunch (3.01 - 0.32) * 180 = 484.20.
# WA at 180% of FPG: breakfast FREE, lunch REDUCED.
#   lunch (3.01 - 0.32) * 180 = 484.20.
- name: Lunch stays reduced price in North Carolina and Washington in 2020.
  period: 2020
  absolute_error_margin: 0.01
  input:
    state_code: [NC, WA]
    school_meal_fpg_ratio: [1.8, 1.8]
    meets_school_meal_categorical_eligibility: [false, false]
    is_in_k12_school: [true, true]
  output:
    reduced_price_school_meals: [484.20, 484.20]

