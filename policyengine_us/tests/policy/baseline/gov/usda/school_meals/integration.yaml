# North Carolina pays the reduced-price copay, so a household in the
# reduced-price income band gets the free-tier value.
- name: North Carolina household in the reduced-price income band gets free meals.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        # Full-time at $15 per hour: 2,080 hours * $15.
        employment_income_before_lsr: 31_200
      child:
        age: 10
        is_in_k12_school: true
    spm_units:
      spm_unit:
        members: [parent, child]
        meets_school_meal_categorical_eligibility: false
    households:
      household:
        members: [parent, child]
        state_code: NC
  output:
    # 31,200 / (15,650 + 5,500) = 1.475, between 130% and 185% of FPG.
    school_meal_fpg_ratio: 1.475
    school_meal_tier: FREE
    school_meal_daily_subsidy: 6.80  # NSLP 4.43 + SBP 2.37 (SY 2024-25 rates)
    school_meal_paid_daily_subsidy: 0.81  # NSLP 0.42 + SBP 0.39
    # 180 days * (6.80 - 0.81 paid-tier subsidy)
    free_school_meals: 1_078.20
    reduced_price_school_meals: 0

