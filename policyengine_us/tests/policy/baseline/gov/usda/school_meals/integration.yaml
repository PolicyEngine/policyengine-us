- name: No income, one parent, one child, contiguous_US
  period: 2022
  absolute_error_margin: 0.01 # Floating point issue.
  input:
    people:
      parent: {}
      child:
        is_in_k12_school: true
    spm_units:
      spm_unit:
        members: [parent, child]
        school_meal_fpg_ratio: 0
        snap: 0
    households:
      household:
        state_group: CONTIGUOUS_US
  output:
    school_meal_daily_subsidy: 3.66 + 1.97
    school_meal_paid_daily_subsidy: 0.35 + 0.33
    school_meal_net_subsidy: 180 * ((3.66 + 1.97) - (0.35 + 0.33))
    free_school_meals: 180 * (3.66 + 1.97 - 0.35 - 0.33)
    reduced_price_school_meals: 0

# Calendar 2025 reads the rates in force on January 1, 2025: SY 2024-25.
- name: 2025 values test - Contiguous US FREE tier
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent: {}
      child:
        age: 10
        is_in_k12_school: true
    spm_units:
      spm_unit:
        members: [parent, child]
        school_meal_fpg_ratio: 1.2  # FREE tier
        snap: 0
    households:
      household:
        members: [parent, child]
        state_code: FL
  output:
    school_meal_tier: FREE
    school_meal_daily_subsidy: 6.80  # NSLP 4.43 + SBP 2.37 (SY 2024-25 rates)

# High-income California household qualifies under the state universal meals policy.
- name: California universal meals makes a high-income household FREE with no reduced-price subsidy.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      parent: {}
      child:
        age: 10
        is_in_k12_school: true
    spm_units:
      spm_unit:
        members: [parent, child]
        school_meal_fpg_ratio: 4  # Far above the 185% paid threshold
        meets_school_meal_categorical_eligibility: false
    households:
      household:
        members: [parent, child]
        state_code: CA
  output:
    state_has_universal_free_school_meals: true
    school_meal_tier: FREE
    reduced_price_school_meals: 0

