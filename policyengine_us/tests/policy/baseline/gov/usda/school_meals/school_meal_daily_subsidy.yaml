#   REDUCED 5.79, PAID 0.59.
# AK: 4.09 + 7.32 = 11.41; 3.79 + 7.72 = 11.51; 4.09 + 0.74 = 4.83.
# HI: 3.29 + 5.79 = 9.08; 2.99 + 6.19 = 9.18; 3.29 + 0.59 = 3.88.
