# The standard uprater first projects rates on July 1, 2027, so calendar 2028
# uses the CPI-U proxy ratio 340.3 / 333.979. Round each meal and tier down
# separately to cents. These are model projections, not published USDA rates.
# Contiguous FREE: floor(4.76 * ratio * 100) / 100 +
# floor(2.54 * ratio * 100) / 100 = 4.85 + 2.58 = 7.43.
# Contiguous REDUCED: 4.44 + 2.28 = 6.72; PAID: 0.45 + 0.42 = 0.87.
- name: Calendar 2028 uses standard CPI-U projections rounded down by meal and tier.
  period: 2028
  absolute_error_margin: 0.001
  input:
    state_code: [NC, NC, NC, AK, AK, AK, HI, HI, HI]
    school_meal_tier: [FREE, REDUCED, PAID, FREE, REDUCED, PAID, FREE, REDUCED, PAID]
  output:
    school_meal_daily_subsidy: [7.43, 6.72, 0.87, 12.02, 11.31, 1.40, 9.65, 8.93, 1.12]

# Per-meal tiers: the School Breakfast Program rate follows
# school_meal_breakfast_tier and the National School Lunch Program rate
# follows school_meal_lunch_tier. Calendar 2026 uses SY 2025-26 rates:
# contiguous SBP FREE 2.46, REDUCED 2.16; NSLP FREE 4.60, REDUCED 4.20,
# PAID 0.44. AK SBP FREE 3.95, NSLP PAID 0.71. HI SBP REDUCED 2.88, NSLP
# FREE 5.98.
# NC FREE breakfast, REDUCED lunch: 2.46 + 4.20 = 6.66.
# NC REDUCED breakfast, FREE lunch: 2.16 + 4.60 = 6.76.
# NC FREE breakfast, PAID lunch: 2.46 + 0.44 = 2.90.
# AK FREE breakfast, PAID lunch: 3.95 + 0.71 = 4.66.
# HI REDUCED breakfast, FREE lunch: 2.88 + 5.98 = 8.86.
- name: Daily subsidy adds the breakfast rate at the breakfast tier and the lunch rate at the lunch tier.
  period: 2026
  absolute_error_margin: 0.001
  input:
    state_code: [NC, NC, NC, AK, HI]
    school_meal_breakfast_tier: [FREE, REDUCED, FREE, FREE, REDUCED]
    school_meal_lunch_tier: [REDUCED, FREE, PAID, PAID, FREE]
  output:
    school_meal_daily_subsidy: [6.66, 6.76, 2.90, 4.66, 8.86]

# State per-meal policies from income and state, with no categorical
