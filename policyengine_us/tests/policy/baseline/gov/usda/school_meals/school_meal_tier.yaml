# Threshold edge: 185% of the 2026 guideline for two people is
# 1.85 * (15,960 + 5,680) = 40,034. In North Carolina that line is now the
# boundary between free and full price.
- name: North Carolina household exactly at 185% of FPG is free.
  period: 2026
  input:
    people:
      person1: {age: 35, employment_income_before_lsr: 40_034}
      person2: {age: 10}
    spm_units:
      spm_unit:
        members: [person1, person2]
        meets_school_meal_categorical_eligibility: false
    households:
      household:
        members: [person1, person2]
        state_code: NC
  output:
    school_meal_tier: FREE

- name: North Carolina household one dollar above 185% of FPG pays full price.
  period: 2026
  input:
