# limits; every law is inclusive ("at or below", "not more than").
# Limits read on January 1 of each calendar year:
#   NJ: 1.99 in 2024 (from 2023-09-01); 2.24 in 2025-2027 (from 2024-07-01);
#       none from 2028 (lunch funding ends 2027-06-30; breakfast continues in
#       state_free_income_limit_breakfast_only).
#   ND: 2.00 in 2024-2025 (from 2023-07-01); 2.25 in 2026-2027 (from
#       2025-07-01); none from 2028 (biennium ends 2027-06-30).
#   OR: 3.00 from 2022 (from 2021-07-01).
#   HI: 3.00 from 2027 (from 2026-07-01).
# Each case repeats NJ, ND, OR, HI and FL (no state limit) once per ratio.

# OR's 300% limit starts 2021-07-01, so 2.90 is above 185% and PAID everywhere.
