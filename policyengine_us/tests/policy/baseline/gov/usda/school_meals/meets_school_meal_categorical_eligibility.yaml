# 42 USC 1758(b)(12)(A)(iii) requires Head Start enrollment.
# 7 CFR 245.6(b)(8) limits that category to the enrolled child.
# Alabama, three people, 2026: FPG = 15,960 + 2 * 5,680 = 27,320.
# Head Start counts 26,000 in wages, below 27,320, so the preschooler
# meets its income test. School meals count 26,000 + 20,000 rent = 46,000.
# ceil(1.30 * 27,320) = 35,516 < 46,000 <= 50,542 = ceil(1.85 * 27,320).
# The older child qualifies for reduced-price meals through income alone.
- name: A preschooler's Head Start eligibility does not give a sibling free meals.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 35
        employment_income: 26_000
        rental_income: 20_000
        ssi: 0
      preschooler:
        age: 4
        ssi: 0
      sibling:
        age: 10
        ssi: 0
    spm_units:
      unit:
        members: [parent, preschooler, sibling]
        snap: 0
        tanf: 0
        fdpir: 0
    households:
      household:
        members: [parent, preschooler, sibling]
        state_code: AL
  output:
    is_head_start_eligible: [false, true, false]
    school_meal_countable_income: 46_000
    meets_school_meal_categorical_eligibility: false
    school_meal_tier: REDUCED
    # (SBP 2.16 + NSLP 4.20 - paid 0.84) * 180 * 1 = 993.60.
    free_school_meals: 0
    reduced_price_school_meals: 993.60
