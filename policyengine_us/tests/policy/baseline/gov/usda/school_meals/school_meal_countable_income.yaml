# Federal SSI = 12 * 994 = 11,928.
# Wisconsin SSP = 4 * 83.78 + 8 * 92.16 = 1,072.40.
# 38,114 wages + 11,928 SSI + 1,072.40 SSP = 51,114.40 > 50,542.
- name: A Wisconsin parent lives with an adult SSI recipient and a younger child who pays full price.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 45
        employment_income: 38_114
      adult_child:
        age: 19
        is_ssi_disabled: true
      child:
        age: 10
    families:
      family:
        members: [parent, adult_child, child]
    tax_units:
      tax_unit:
        members: [parent, adult_child, child]
    spm_units:
      spm_unit:
        members: [parent, adult_child, child]
    marital_units:
      parent_unit:
        members: [parent]
      adult_child_unit:
        members: [adult_child]
      child_unit:
        members: [child]
    households:
      household:
        members: [parent, adult_child, child]
        state_code: WI
  output:
    ssi: [0, 11_928, 0]
    wi_ssp: [0, 1_072.4, 0]
    spm_unit_fpg: 27_320
    school_meal_countable_income: 51_114.4
    meets_school_meal_categorical_eligibility: false
    school_meal_tier: PAID

