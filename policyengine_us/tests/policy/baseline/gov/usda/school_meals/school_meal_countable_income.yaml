- name: Default gross/market income is zero.
  period: 2022
  output:
    school_meal_countable_income: 0

- name: School meal income for one person is their market income.
  period: 2022
  input:
    employment_income: 10_000
  output:
    school_meal_countable_income: 10_000

- name: Sums market income.
  period: 2022
  input:
    people:
      p1:
        self_employment_income: 10_000
      p2:
        dividend_income: 20_000
        gi_cash_assistance: 500
    spm_units:
      spm_unit:
        members: [p1, p2]
  output:
    school_meal_countable_income: 30_500

- name: Includes SSTB self-employment income.
  period: 2024
  input:
    sstb_self_employment_income: 100_000
  output:
    school_meal_countable_income: 100_000

- name: Includes child support received.
  period: 2026
  input:
    employment_income: 10_000
    child_support_received: 3_000
  output:
    school_meal_countable_income: 13_000

- name: Includes general assistance.
  period: 2026
  input:
    employment_income: 10_000
    general_assistance: 3_000
  output:
    school_meal_countable_income: 13_000

- name: Without general assistance, income is the other income only.
  period: 2026
  input:
    employment_income: 10_000
    general_assistance: 0
  output:
    school_meal_countable_income: 10_000

# 36,000 of wages count; 28,132 < 36,000 < 40,034.
- name: A Tennessee parent earns 36,000 and the child receives reduced-price meals.
  period: 2026
  input:
    people:
      parent:
        age: 35
        employment_income: 36_000
      child:
        age: 10
    spm_units:
      spm_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: TN
  output:
    school_meal_countable_income: 36_000
    meets_school_meal_categorical_eligibility: false
    school_meal_tier: REDUCED

