# Edge case: single-meal copay coverage spans the whole reduced-price band and
# stops at the federal 185% limit. No categorical eligibility. Just above 130%
# (1.3001) and exactly at 185% the tier for both meals is REDUCED; just above
# 185% (1.8501) it is PAID, and no single-meal policy applies. NH covers only
# the reduced-price breakfast copay; UT covers only the lunch copay.
- name: New Hampshire's breakfast-only coverage applies from just above 130% to exactly 185% of FPG, but not above, in 2026.
  period: 2026
  input:
    state_code: [NH, NH, NH, UT, UT, UT]
    school_meal_fpg_ratio: [1.3001, 1.85, 1.8501, 1.3001, 1.85, 1.8501]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, PAID, REDUCED, REDUCED, PAID]

# Categorical eligibility (SNAP, TANF and so on) makes the tier for both meals
# FREE, so both meals are free even where a state covers only one meal: UT
# (lunch only) and NH (breakfast only) at 180% of FPG, and AR (universal free
# breakfast) at 300% of FPG. The last three repeat the inputs without
# categorical eligibility for contrast: only UT breakfast changes, since NH
# and AR breakfast is free either way. The lunch-tier case tests NH and AR.
- name: Categorical eligibility makes breakfast free in Utah in 2026, while New Hampshire and Arkansas breakfast is free with or without it.
  period: 2026
  input:
    state_code: [UT, NH, AR, UT, NH, AR]
    school_meal_fpg_ratio: [1.8, 1.8, 3, 1.8, 1.8, 3]
    meets_school_meal_categorical_eligibility: [true, true, true, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, FREE, REDUCED, FREE, FREE]

# Federal free-meal limit in single-meal states, no categorical eligibility.
# At exactly 130% of FPG the tier for both meals is FREE, so breakfast is free
# in NH (breakfast-only coverage) and UT (lunch-only coverage). Just above
# (1.3001) the tier is REDUCED: NH breakfast stays free, UT breakfast is
# reduced price. Only UT tests the inclusive 130% limit here: NH breakfast
# would be free at 1.3 through its breakfast-only coverage even with a
# REDUCED tier. The lunch-tier case tests NH.
- name: Breakfast is free at exactly 130% of FPG in New Hampshire and Utah, and just above it only in New Hampshire, in 2026.
  period: 2026
  input:
    state_code: [NH, UT, NH, UT]
    school_meal_fpg_ratio: [1.3, 1.3, 1.3001, 1.3001]
    meets_school_meal_categorical_eligibility: [false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, FREE, REDUCED]

