# school_meal_breakfast_tier starts from school_meal_tier (the tier for both
# meals) and adds the breakfast-only state policies: universal free
# breakfast, coverage of only the reduced-price breakfast copay, and a
# breakfast-only free-meal income limit (New Jersey from 2027-07-01). Annual
# periods read parameters on January 1, so a start or end between July 1 and
# December 31 first changes the next calendar year.

# Universal free breakfast at 300% of FPG (PAID tier for both meals) with no
# categorical eligibility. Every case lists AR, DE, DC, PA, CT, SC and FL.
# DC: D.C. Law 18-209, from 2010-08-01. PA: the Governor's Universal Free
# Breakfast Program from 2022-10-01, then 24 P.S. 13-1337.1(c.2) from
# 2023-07-01. AR (Act 123 of 2025) and DE (85 Del. Laws c. 110 and c. 65,
# section 33): from 2025-07-01. CT: SMART universal meals in SY 2022-23,
# then STABLE for SY 2023-24 and RISE for SY 2026-27. SC: FY2026-27 Proviso
# 1.103(B), SY 2026-27 only. FL has none.

# PA starts 2022-10-01. CT's SMART universal meals (2022-07-01 to
# 2023-06-30) make its tier for both meals FREE; STABLE starts 2023-07-01.
- name: District of Columbia and Pennsylvania universal free breakfast, and Connecticut universal meals, make breakfast free in 2023.
  period: 2023
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [PAID, PAID, FREE, FREE, FREE, PAID, PAID]

