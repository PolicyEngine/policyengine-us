# exactly 2.24 are FREE through the breakfast-only limit; 2.25 is above it.
# FL has no breakfast-only limit, so 2.0 is PAID.
- name: New Jersey's 224% free-breakfast income limit continues in 2028.
  period: 2028
  input:
    state_code: [NJ, NJ, NJ, NJ, FL]
    school_meal_fpg_ratio: [1.8, 2.0, 2.24, 2.25, 2.0]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, FREE, PAID, PAID]

# The breakfast-only income limit applies with a tier input too: NJ at 200%
# of FPG is FREE (limit 2.24) and at 250% PAID. FL (no limit) keeps the PAID
# input tier at 200%; the next case covers ratios at or below 0.
- name: New Jersey's breakfast-only income limit applies to a paid input tier in 2028, but no limit applies in Florida.
  period: 2028
  input:
    state_code: [NJ, NJ, FL]
    school_meal_tier: [PAID, PAID, PAID]
    school_meal_fpg_ratio: [2.0, 2.5, 2.0]
  output:
    school_meal_breakfast_tier: [FREE, PAID, PAID]

# Guard on the breakfast-only income limit: a limit of 0 means no limit, so a
# ratio at or below 0 (zero or negative income) must not make breakfast free.
# A school_meal_tier input keeps the ratio from setting the tier, so only the
# guard decides. FL and NC have no breakfast-only limit, so their PAID and
# REDUCED inputs are unchanged at ratios 0 and -1. New Jersey's limit (2.24
# from 2027-07-01) is above 0, so ratios 0 and -1 are within it.
- name: A breakfast-only income limit of 0 does not make breakfast free at zero or negative income in 2028.
  period: 2028
  input:
    state_code: [FL, FL, NC, NJ, NJ]
    school_meal_tier: [PAID, REDUCED, PAID, PAID, REDUCED]
    school_meal_fpg_ratio: [0, -1, 0, 0, -1]
  output:
    school_meal_breakfast_tier: [PAID, REDUCED, PAID, FREE, FREE]

# New Jersey in 2028 within 0.0001 of its cutoffs, no categorical
# eligibility. The limit for both meals is 0, so the tier is FREE up to 185%
# (reduced-price copay coverage) and PAID above it. Breakfast is FREE up to
# the breakfast-only limit, 2.24: 2.2399 and 2.24 are FREE and 2.2401 is
# PAID. At 1.85 both meals are FREE; at 1.8501 breakfast is FREE through the
# breakfast-only limit while the tier and lunch are PAID.
- name: New Jersey ratios at and just above 185% and just below, at and just above its 224% breakfast-only limit in 2028.
  period: 2028
  input:
    state_code: [NJ, NJ, NJ, NJ, NJ]
    school_meal_fpg_ratio: [1.85, 1.8501, 2.2399, 2.24, 2.2401]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false]
  output:
    school_meal_tier: [FREE, PAID, PAID, PAID, PAID]
    school_meal_breakfast_tier: [FREE, FREE, FREE, FREE, PAID]
    school_meal_lunch_tier: [FREE, PAID, PAID, PAID, PAID]
