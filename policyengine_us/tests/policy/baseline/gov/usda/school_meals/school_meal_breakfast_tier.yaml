# A school_meal_tier input still flows to breakfast. NC has no breakfast-only
# coverage after 2022-06-30; FL has none; DC has universal free breakfast;
# NH covers only reduced-price breakfast, so a PAID tier stays PAID; UT
# covers only lunch.
- name: An input tier for both meals flows to the breakfast tier in 2026.
  period: 2026
  input:
    state_code: [NC, FL, DC, NH, NH, UT]
    school_meal_tier: [REDUCED, FREE, PAID, REDUCED, PAID, REDUCED]
  output:
    school_meal_breakfast_tier: [REDUCED, FREE, FREE, FREE, PAID, REDUCED]

# Users can override the universal breakfast flag, for example for a
# student whose school does not take part in the state program.
- name: The universal free breakfast flag can be overridden in 2026.
  period: 2026
  input:
    state_code: [DC, FL]
    school_meal_tier: [PAID, PAID]
    state_has_universal_free_school_breakfast: [false, true]
  output:
    school_meal_breakfast_tier: [PAID, FREE]

# Edge case: single-meal copay coverage spans the whole reduced-price band and
# stops at the federal 185% limit. No categorical eligibility. Just above 130%
# (1.3001) and exactly at 185% the tier for both meals is REDUCED; just above
# 185% (1.8501) it is PAID, and no single-meal policy applies. NH covers only
# the reduced-price breakfast copay; UT covers only the lunch copay.
- name: New Hampshire's breakfast-only coverage applies from just above 130% to exactly 185% of FPG, but not above, in 2026.
  period: 2026
  input:
    state_code: [NH, NH, NH, UT, UT, UT]
    school_meal_fpg_ratio: [1.3001, 1.85, 1.8501, 1.3001, 1.85, 1.8501]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, PAID, REDUCED, REDUCED, PAID]
