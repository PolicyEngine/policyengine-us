# school_meal_breakfast_tier starts from school_meal_tier (the tier for both
# meals) and adds the breakfast-only state policies: universal free
# breakfast and coverage of only the reduced-price breakfast copay. Annual
# periods read parameters on January 1, so a start or end between July 1 and
# December 31 first changes the next calendar year.

# Universal free breakfast at 300% of FPG (PAID tier for both meals) with no
# categorical eligibility. Every case lists AR, DE, DC, PA, CT, SC and FL.
# DC: D.C. Law 18-209, from 2010-08-01. PA: 24 P.S. 13-1337.1(c.2), from
# 2023-07-01. AR (Act 123 of 2025) and DE (85 Del. Laws c. 110 and c. 65,
# section 33): from 2025-07-01. CT: STABLE for SY 2023-24 and RISE for
# SY 2026-27. SC: FY2026-27 Proviso 1.103(B), SY 2026-27 only. FL has none.

# PA and CT STABLE start 2023-07-01.
- name: Only the District of Columbia has universal free breakfast in 2023.
  period: 2023
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [PAID, PAID, FREE, PAID, PAID, PAID, PAID]

# PA from 2023-07-01; CT STABLE covers SY 2023-24.
- name: Pennsylvania and Connecticut add universal free breakfast in 2024.
  period: 2024
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [PAID, PAID, FREE, FREE, FREE, PAID, PAID]

# CT STABLE ended 2024-06-30; AR and DE start 2025-07-01.
- name: Connecticut has no universal free breakfast in 2025.
  period: 2025
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [PAID, PAID, FREE, FREE, PAID, PAID, PAID]

# CT RISE and SC start 2026-07-01.
- name: Arkansas and Delaware add universal free breakfast in 2026.
  period: 2026
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, FREE, FREE, PAID, PAID, PAID]

# CT RISE and SC Proviso 1.103(B) cover SY 2026-27.
- name: Connecticut and South Carolina add universal free breakfast in 2027.
  period: 2027
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
    school_meal_fpg_ratio: [3, 3, 3, 3, 3, 3, 3]
    meets_school_meal_categorical_eligibility: [false, false, false, false, false, false, false]
  output:
    school_meal_breakfast_tier: [FREE, FREE, FREE, FREE, FREE, FREE, PAID]

# Both are funded for SY 2026-27 only and end 2027-07-01.
- name: Connecticut and South Carolina universal free breakfast ends before 2028.
  period: 2028
  input:
    state_code: [AR, DE, DC, PA, CT, SC, FL]
