# A woman reported as breastfeeding is matched before the tax-unit heuristic:
# here the grandmother claims the infant, and the infant's mother files alone.
- name: Breastfeeding mother in her own tax unit keeps her infant claimed by the grandmother
  period: 2025
  input:
    people:
      grandmother:
        age: 45
        is_female: true
        own_children_in_household: 1
      mother:
        age: 20
        is_female: true
        is_breastfeeding: true
      infant:
        age: 0.3
    tax_units:
