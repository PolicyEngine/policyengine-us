# 7 CFR 246.2: postpartum women are "women up to six months after termination
# of pregnancy" and breastfeeding women are "women up to one year postpartum
# who are breastfeeding their infants", so an infant makes only its own mother
# postpartum or breastfeeding, not a grandmother who has her own child at home.
- name: Three generations in separate tax units, only the infant's mother is postpartum
  period: 2025
  input:
    people:
      grandmother:
        age: 50
        is_female: true
        own_children_in_household: 1
      mother:
        age: 25
        is_female: true
        own_children_in_household: 1
      infant:
        age: 0.2
    tax_units:
      grandmother_tax_unit:
        members: [grandmother]
      mother_tax_unit:
        members: [mother, infant]
    spm_units:
      spm_unit:
        members: [grandmother, mother, infant]
    families:
      family:
        members: [grandmother, mother, infant]
    households:
      household:
        members: [grandmother, mother, infant]
        state_code: TX
  output:
    wic_category: [NONE, POSTPARTUM, INFANT]

