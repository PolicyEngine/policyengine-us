- name: Earned income is combined if both eligible
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_earned_income: 10
      spouse:
        ssi_couple_computation_applies: true
        ssi_earned_income: 20
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_earned_income: [30, 30]

- name: Earned income is not combined if not both eligible
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: false
        ssi_earned_income: 10
      spouse:
        ssi_couple_computation_applies: false
        ssi_earned_income: 20
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_earned_income: [10, 20]

- name: Earned income is shared if head has income
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_earned_income: 10
      spouse:
        ssi_couple_computation_applies: true
        ssi_earned_income: 0
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_earned_income: [10, 10]

- name: Earned income is shared if spouse has income
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_earned_income: 0
      spouse:
        ssi_couple_computation_applies: true
        ssi_earned_income: 10
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_earned_income: [10, 10]

- name: Earned income is combined only in the months before one spouse enters a medical facility
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        ssi_earned_income: 12_000
      person2:
        age: 62
        meets_ssi_disability_criteria: true
        ssi_lives_in_medical_treatment_facility:
          2026-07: true
        ssi_medicaid_pays_majority_of_care:
          2026-07: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 20 CFR 416.1802(b)(1) combines an eligible couple's income through
    # June, so person1's 1,000 a month of wages counts for both spouses.
    # 20 CFR 416.414(b)(3) counts each spouse's own income from July, the
    # first month person2 spends throughout in the facility (416.414(a)(1)).
    ssi_marital_earned_income:
      2026-06: [1_000, 1_000]
      2026-07: [1_000, 0]
