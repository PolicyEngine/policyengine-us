- name: Unearned income is combined if both eligible
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 10
      spouse:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 20
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_unearned_income: [30, 30]

- name: Unearned income is not combined if not both eligible
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: false
        ssi_unearned_income: 10
      spouse:
        ssi_couple_computation_applies: false
        ssi_unearned_income: 20
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_unearned_income: [10, 20]

- name: Unearned income is shared if head has income
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 10
      spouse:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 0
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_unearned_income: [10, 10]

- name: Unearned income is shared if spouse has income
  period: 2023
  input:
    people:
      head:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 0
      spouse:
        ssi_couple_computation_applies: true
        ssi_unearned_income: 10
    marital_units: 
      unit:
        members: [head, spouse]
  output:
    ssi_marital_unearned_income: [10, 10]

- name: Unearned income is combined only in the months before one spouse's first full month in a medical facility
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 68
        ssi_unearned_income: 12_000
      person2:
        age: 62
        meets_ssi_disability_criteria: true
        ssi_unearned_income: 18_000
        ssi_lives_in_medical_treatment_facility:
          2026-07: true
        ssi_medicaid_pays_majority_of_care:
          2026-07: true
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # 20 CFR 416.1802(b)(1) combines an eligible couple's income through
    # June: 1,000 + 1,500 = 2,500 a month for each spouse.
    # 20 CFR 416.414(b)(3) counts each spouse's own income from July, the
    # first month person2 spends throughout in the facility
    # (416.414(a)(1)). The stay runs through December, and the months
    # before it are still combined.
    ssi_marital_unearned_income:
      2026-06: [2_500, 2_500]
      2026-07: [1_000, 1_500]
