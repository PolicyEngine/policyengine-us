- name: Case 1, own household without shelter support has zero ISM.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
  output:
    ssi_in_kind_support_and_maintenance: 0

- name: Case 2, own household with outside shelter support triggers PMV.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi_receives_outside_shelter_support: true
  output:
    # PMV monthly = (1/3 x 967) + 20 = 322.33 + 20 = 342.33
    # PMV annual = 342.33 x 12 = 4_108
    ssi_in_kind_support_and_maintenance: 4_108

- name: Case 3, own household with in-household shelter support triggers PMV.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi_receives_shelter_from_others_in_household: true
        # Not in another's household, so not Status B
  output:
    # PMV monthly = (1/3 x 967) + 20 = 342.33
    # PMV annual = 342.33 x 12 = 4_108
    ssi_in_kind_support_and_maintenance: 4_108

- name: Case 4, another person's household has zero ISM (VTR is an FBR adjustment, not income).
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi_lives_in_another_persons_household: true
        ssi_receives_shelter_from_others_in_household: true
        ssi_others_pay_all_meals: true
  output:
    ssi_in_kind_support_and_maintenance: 0

- name: Case 5, medical treatment facility has zero ISM.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
        ssi_lives_in_medical_treatment_facility: true
        ssi_medicaid_pays_majority_of_care: true
  output:
    ssi_in_kind_support_and_maintenance: 0

- name: Case 6, food-only support does not trigger PMV in October 2024.
  period: 2024-10
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi_federal_living_arrangement: OWN_HOUSEHOLD
        ssi_receives_food_from_others: true
        ssi_receives_outside_shelter_support: false
        ssi_receives_shelter_from_others_in_household: false
  output:
    # Food stopped counting as ISM on September 30, 2024 (89 FR 21199).
    ssi_pmv_applies: false
    ssi_in_kind_support_and_maintenance: 0

- name: Case 7, food-only support triggers PMV before the exclusion.
  period: 2024-08
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi_federal_living_arrangement: OWN_HOUSEHOLD
        ssi_receives_food_from_others: true
        ssi_receives_outside_shelter_support: false
        ssi_receives_shelter_from_others_in_household: false
        ssi_pmv_amount: 334.33
  output:
    # $943 / 3 + $20 = $334.33 monthly PMV (20 CFR 416.1140(a)(1)).
    ssi_pmv_applies: true
    ssi_in_kind_support_and_maintenance: 334.33

- name: Case 8, shelter support continues to trigger PMV after the exclusion.
  period: 2024-10
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        ssi_federal_living_arrangement: OWN_HOUSEHOLD
        ssi_receives_food_from_others: false
        ssi_receives_outside_shelter_support: true
        ssi_receives_shelter_from_others_in_household: false
        ssi_pmv_amount: 334.33
  output:
    ssi_pmv_applies: true
    ssi_in_kind_support_and_maintenance: 334.33

- name: Case 9, monthly PMV amount for an individual in 2024.
  period: 2024-10
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
  output:
    # $943 / 3 + $20, a monthly amount.
    ssi_pmv_amount: 334.33
