# Resource eligibility examples are hand computed from 20 CFR 416.1202(a)-(b)
# and 416.1205: own plus deemed resources <= the applicable limit.
# https://www.ecfr.gov/current/title-20/section-416.1202
# https://www.ecfr.gov/current/title-20/section-416.1205
# The parental allowance follows the same individual/couple resource limit parameters.

# 20 CFR 416.1202(a), 416.1205: combined3001 exceeds couple limit3000.
- name: Ineligible spouse holds all resources above the couple limit
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          2026: 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          2026: 3001
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
  output:
    ssi_claim_is_joint: [false, false]
    meets_ssi_resource_test: [false, false]

# 20 CFR 416.1202(a), 416.1205: apply couple limit even when spouse has zero assets.
- name: Ineligible spouse with no assets still permits the couple limit
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 2001
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      family_couple_0:
        members: [claimant, spouse]
    households:
      family:
        members: [claimant, spouse]
  output:
    meets_ssi_resource_test: [true, true]

