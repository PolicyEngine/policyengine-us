- name: Shelter support in July leaves other months unchanged and annual deeming sums the months.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        ssi_receives_outside_shelter_support:
          2026-07: true
      spouse:
        age: 60
        employment_income: 2_000 * 12
    tax_units:
      couple:
        members: [claimant, spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [claimant, spouse]
        state_code: FL
  output:
    # Without support: ($2,000 - $20 - $65) / 2 = $957.50 deemed;
    # SSI = $1,491 - $957.50 = $533.50.
    # July: ($258.50 - $20) + ($2,000 - $65) / 2 = $1,206 countable;
    # deemed = $1,206 - $238.50 = $967.50; SSI = $285.
    # Annual deemed: 11 x $957.50 + $967.50 = $11,500.
    # Annual SSI: 11 x $533.50 + $285 = $6,153.50.
    ssi_income_deemed_from_ineligible_spouse_monthly:
      2026-01: [957.50, 0]
      2026-07: [967.50, 0]
    ssi_income_deemed_from_ineligible_spouse: [11_500, 0]
    ssi_countable_income:
      2026-01: [957.50, 0]
      2026-07: [1_206, 0]
    ssi:
      2026-01: [533.50, 0]
      2026-07: [285, 0]
      2026: [6_153.50, 0]

- name: A dated legacy abolition switch still zeroes the monthly deemed amount.
  period: 2026
  absolute_error_margin: 0.01
  input:
    gov.abolitions.ssi_income_deemed_from_ineligible_spouse:
      2026-01-01: false
      2026-07-01: true
    people:
      claimant:
        age: 70
      spouse:
        age: 60
        employment_income: 2_000 * 12
    tax_units:
      couple:
        members: [claimant, spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [claimant, spouse]
        state_code: FL
  output:
    # January: ($2,000 - $20 - $65) / 2 = $957.50 deemed;
    # SSI = $1,491 - $957.50 = $533.50.
    # July: the supplied abolition switch removes deemed income; the
    # individual-only limit holds SSI to $994.
    ssi_income_deemed_from_ineligible_spouse_monthly:
      2026-01: [957.50, 0]
      2026-07: [0, 0]
    ssi:
      2026-01: [533.50, 0]
      2026-07: [994, 0]
