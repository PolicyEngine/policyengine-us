# POMS SI 01320.150 B.1.a and SI 01320.400 B.1.e: include claimant ISM
# in combined unearned income before applying one general exclusion.
# https://secure.ssa.gov/poms.nsf/lnx/0501320150
# https://secure.ssa.gov/poms.nsf/lnx/0501320400

- name: Claimant cash unearned income shares one exclusion with shelter support.
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      claimant:
        age: 70
        pension_income: 100 * 12
        employment_income: 0 * 12
        ssi_receives_outside_shelter_support: true
      spouse:
        age: 60
        pension_income: 0 * 12
        employment_income: 2000 * 12
    tax_units:
      couple:
        members: [claimant, spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [claimant, spouse]
        state_code: FL
  output:
    # Unearned: 100 + 0 + 258.5; earned: 0 + 2000.
    # Subtract $20 from unearned, carry any remainder to earnings,
    # then subtract $65 from earnings and count half the remainder.
    # Couple: $1306; alone: $338.5; deemed: $1306 - $338.5 = $967.5.
    # SSI: min($1,491 - $1306, $562.6667) = $185.
    ssi_income_deemed_from_ineligible_spouse_monthly: [967.5, 0]
    ssi_countable_income: [1306, 0]
    ssi: [185, 0]

