  period: 2026
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 12_168
      person2:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, false]

