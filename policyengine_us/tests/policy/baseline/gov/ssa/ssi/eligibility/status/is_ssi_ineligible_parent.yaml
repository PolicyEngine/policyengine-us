# A California disabled parent with an 18,000 pension, a spouse earning 36,000 and a
# disabled child. The spouse's income is deemed to the parent: (1,500 - 20) +
# (3,000 - 65) / 2 = 2,947.50 a month, above California's at-home couple standard of
# 1,491 + 607.83 = 2,098.83 (POMS SI 01415.058 B), so the parent is due neither SSI
# nor the supplement and both parents are ineligible parents. They share the federal
# couple rate plus the supplement (POMS SI 01320.630 B.1): (17,892 + 7,293.96) / 2 =
# 12,592.98 each. The child is deemed 35,370 - 25,185.96 = 10,184.04, as 20 CFR
# 416.1166(e)(2) gives, and SSI is 11,928 - (10,184.04 - 240) = 1,983.96.
- name: Case 17, California parent whose income rules out the supplement deems the excess over the federal and state couple standard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 18_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        employment_income_before_lsr: 36_000
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    is_ssi_ineligible_parent: [true, true, false]
    ssi_ineligible_parent_allocation: [12_592.98, 12_592.98, 0]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 10_184.04]
    ssi: [0, 0, 1_983.96]

