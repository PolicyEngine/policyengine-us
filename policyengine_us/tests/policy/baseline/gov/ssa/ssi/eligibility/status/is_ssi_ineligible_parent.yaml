# Joint claim: 20,000 - 240 = 19,760 is above the couple rate of 1,491 x 12 =
# 17,892, so neither parent is eligible. 20 CFR 416.1165(d)(3)(i) deems
# 19,760 - 17,892 = 1,868, and the child's SSI is 11,928 - (1,868 - 240) = 10,300.
- name: Case 8, disabled couple with income over the couple rate are both ineligible parents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 20_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [true, true, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 1_868]
    ssi: [0, 0, 10_300]

