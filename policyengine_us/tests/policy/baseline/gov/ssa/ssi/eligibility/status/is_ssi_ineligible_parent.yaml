# Two disabled parents in California on a joint claim, each with a 14,000 pension.
# Their 28,000 - 240 = 27,760 is above the at-home couple standard of 17,892 +
# 607.83 x 12 = 25,185.96 (POMS SI 01415.058 B), so both are ineligible parents and
# share it: 12,592.98 each (POMS SI 01320.630 B.1). The child is deemed 27,760 -
# 25,185.96 = 2,574.04, and SSI is 11,928 - (2,574.04 - 240) = 9,593.96.
- name: Case 23, California parents on a joint claim share the couple's federal and state standard.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 14_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 14_000
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: CA
  output:
    is_ssi_ineligible_parent: [true, true, false]
    ssi_ineligible_parent_allocation: [12_592.98, 12_592.98, 0]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 2_574.04]
    ssi: [0, 0, 9_593.96]

# A lone California disabled parent with a 60,000 pension. 20 CFR 416.1165(d)(3)(ii)
# subtracts the federal rate alone, which would deem 59,760 - 11,928 = 47,832. The
# model follows POMS SI 01320.630 B.1 and subtracts the federal rate plus the
# supplement, 11,928 + 239.94 x 12 = 14,807.28, as the project lead ruled on
# 2026-11-12 (candidate us:ssi-parent-allowance-state-supplement): 59,760 -
# 14,807.28 = 44,952.72.
- name: Case 24, lone California parent's allowance includes the at-home supplement.
  period: 2026
