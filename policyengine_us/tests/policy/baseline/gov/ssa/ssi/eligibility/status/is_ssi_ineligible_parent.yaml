      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 60_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: MI
  output:
    is_ssi_ineligible_parent: [true, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 47_832]
    ssi: [0, 0]

# The model's California supplement rates start in 1991, so before then a California
# parent is tested on the federal rate alone. In 1986 that is 336 x 12 = 4,032: a
# disabled parent with a 6,000 pension has 6,000 - 240 = 5,760 and deems 5,760 -
# 4,032 = 1,728.
- name: Case 20, California parent before the model's supplement rates start is tested on the federal rate.
  period: 1986
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 6_000
      person2:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
    households:
      household:
        members: [person1, person2]
        state_code: CA
  output:
    is_ssi_ineligible_parent: [true, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 1_728]

