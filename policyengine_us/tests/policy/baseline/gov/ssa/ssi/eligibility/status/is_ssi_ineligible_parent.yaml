# Joint claim: 20,000 - 240 = 19,760 is above the couple rate of 1,491 x 12 =
# 17,892, so neither parent is eligible. 20 CFR 416.1165(d)(3)(i) deems
# 19,760 - 17,892 = 1,868, and the child's SSI is 11,928 - (1,868 - 240) = 10,300.
- name: Case 8, disabled couple with income over the couple rate are both ineligible parents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 20_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [true, true, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 1_868]
    ssi: [0, 0, 10_300]

# Joint claim: 15,000 - 240 = 14,760 is within the couple rate of 17,892, so both
# parents stay eligible and each receives (17,892 - 14,760) / 2 = 1,566. Nothing
# is deemed, and the child's SSI is 994 x 12 = 11,928.
- name: Case 9, disabled couple with income within the couple rate are not ineligible parents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        taxable_pension_income: 15_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, false, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 0]
    ssi: [1_566, 1_566, 11_928]

# 20 CFR 416.1205: 2,500 is above the 2,000 limit for an individual and within
# the 3,000 limit for a couple, which is the one that applies. With no income each
# parent receives 1,491 x 12 / 2 = 8,946.
- name: Case 10, disabled couple within the couple resource limit are not ineligible parents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        bank_account_assets: 2_500
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, false, false]
    ssi: [8_946, 8_946, 11_928]

# 20 CFR 416.1205: 2,000 + 1,001 = 3,001 is over the 3,000 couple limit, though
# each parent alone is within 2,000. 416.1202(b) deems the 1 over the limit to the
# child, whose resources stay within 2,000, so the child's SSI stays 11,928.
- name: Case 11, disabled couple over the couple resource limit are both ineligible parents.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        bank_account_assets: 2_000
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        bank_account_assets: 1_001
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [true, true, false]
    ssi: [0, 0, 11_928]

# Parent ids name the daughter as the child's parent and the grandparent as the
# daughter's. 20 CFR 416.1160(d) limits an ineligible parent to a natural or
# adoptive parent or that parent's spouse, so the aged grandparent's 40,000
# pension is not deemed although it rules out the grandparent's own SSI. The
# daughter has no income, so the child's SSI is 994 x 12 = 11,928.
- name: Case 12, aged grandparent is not an ineligible parent when parent ids name the daughter.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        person_id: 1
        is_tax_unit_head: true
        own_children_in_household: 1
        taxable_pension_income: 40_000
      person2:
        age: 40
        person_id: 2
        parent_1_id: 1
        is_tax_unit_dependent: true
        own_children_in_household: 1
      person3:
        age: 8
        person_id: 3
        parent_1_id: 2
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, true, false]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 0]
    ssi: [0, 0, 11_928]

# 20 CFR 416.1163(b) allocates (1,491 - 994) x 12 = 5,964 to the ineligible child
# before the parent's test in 416.1163(d)(2): 22,000 - 5,964 - 240 = 15,796 is
# within the couple rate of 17,892, though 22,000 - 240 = 21,760 is not. The parent
# stays eligible with SSI of 17,892 - 15,796 = 2,096, and 416.1166(e)(1) deems
# nothing to the disabled child, whose SSI is 994 x 12 = 11,928.
- name: Case 13, ineligible child allocation comes before the parent's income test.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 2
        meets_ssi_disability_criteria: true
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 2
        taxable_pension_income: 22_000
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
      person4:
        age: 10
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3, person4]
    marital_units:
      marital_unit1:
        members: [person1, person2]
      marital_unit2:
        members: [person3]
      marital_unit3:
        members: [person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, true, false, false]
    ssi_ineligible_child_allocation: [0, 0, 0, 5_964]
    ssi_income_deemed_from_ineligible_spouse: [15_796, 0, 0, 0]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 0, 0]
    ssi: [2_096, 0, 11_928, 0]

# With no marital units everyone shares one default unit of three people. The head
# and spouse of the tax unit are still a couple, so 20 CFR 416.1205 applies the
# 3,000 limit to the head's 2,500. Each parent receives 1,491 x 12 / 2 = 8,946.
- name: Case 14, couple in a default marital unit gets the couple resource limit.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 45
        is_tax_unit_head: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
        bank_account_assets: 2_500
      person2:
        age: 45
        is_tax_unit_spouse: true
        own_children_in_household: 1
        meets_ssi_disability_criteria: true
      person3:
        age: 10
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, false, false]
    ssi: [8_946, 8_946, 11_928]
