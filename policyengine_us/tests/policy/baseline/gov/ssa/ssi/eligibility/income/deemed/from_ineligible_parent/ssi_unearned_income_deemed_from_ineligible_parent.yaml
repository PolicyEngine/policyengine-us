# 20 CFR 416.1165 deems the income of an eligible child's ineligible parents
# to the child. An ineligible parent is 'a natural or adoptive parent, or the
# spouse ... of a natural or adoptive parent, who lives with you and is not
# eligible for SSI benefits' (416.1160(d)). The steps (416.1165(a)-(e), POMS
# SI 01320.500 C):
# 1. Deduct an allocation for each ineligible child: 'the natural or adopted
#    child of your parent or of your parent's spouse ... who lives in the
#    same household with you, and is not eligible for SSI benefits'
#    (416.1160(d), 416.1165(b)), from unearned income first, then earned.
# 2. Apply the $20 general exclusion, then $65 and one-half of the rest of
#    earned income (416.1165(d)(1)-(2)).
# 3. Subtract the living allowance: the couple rate for two parents, the
#    individual rate for one, and both rates for two natural parents and a
#    stepparent (416.1165(d)(3), POMS SI 01320.500 B.4).
# 4. Divide equally among the parents' eligible children under 18 in the
#    household (416.1165(e)(2)).
# Federal benefit rates: 2025 individual $967, couple $1,450, so the
# ineligible child allocation is $483 a month.

- name: POMS SI 01320.500 F.1, Bill Sanders, parents with only earned income
  # Earnest earns $4,500 in January 2025; Bill has two ineligible siblings.
  # $4,500 - 2 x $483 = $3,534; - $85 = $3,449; half = $1,724.50; less the
  # $1,450 couple allowance = $274.50 deemed a month. The POMS text then
  # calls Bill ineligible, which does not follow from its own figures: $274.50
  # less $20 is $254.50, below the $967 rate.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      earnest:
        age: 40
        person_id: 1
        ssi_earned_income: 4_500 * 12
      sarah:
        age: 38
        person_id: 2
      bill:
        age: 10
        is_ssi_disabled: true
        person_id: 3
        parent_1_id: 1
        parent_2_id: 2
      first_sibling:
        age: 8
        person_id: 4
        parent_1_id: 1
        parent_2_id: 2
      second_sibling:
        age: 6
        person_id: 5
        parent_1_id: 1
        parent_2_id: 2
    tax_units:
      tax_unit:
        members: [earnest, sarah, bill, first_sibling, second_sibling]
    marital_units:
      parents:
        members: [earnest, sarah]
      bill_alone:
        members: [bill]
      first_sibling_alone:
        members: [first_sibling]
      second_sibling_alone:
        members: [second_sibling]
    households:
      household:
        members: [earnest, sarah, bill, first_sibling, second_sibling]
        state_code: TX
  output:
    is_ssi_income_deeming_child: [false, false, true, false, false]
    is_ssi_ineligible_parent: [true, true, false, false, false]
    ssi_parental_deeming_child_allocations: [0, 0, 11_592, 0, 0] # 2 x $483 x 12
    ssi_parental_deeming_parent_allocation: [0, 0, 17_400, 0, 0] # $1,450 x 12
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 0, 3_294, 0, 0] # $274.50 x 12
    ssi_countable_income: [0, 0, 3_054, 0, 0] # ($274.50 - $20) x 12

