# 20 CFR 416.1202(a): an eligible individual living with an ineligible spouse.
# https://www.ecfr.gov/current/title-20/section-416.1202
# The resource rule is independent of the income deeming threshold.

# 20 CFR 416.1202(a): resources are deemed independently of an income threshold.
- name: ABD claimant with an ineligible spouse applies resource deeming without income
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      family_couple_0:
        members: [claimant, spouse]
    households:
      family:
        members: [claimant, spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [true, false]

# 20 CFR 416.1202(a): the spouse must be ineligible; joint claims retain the couple test.
- name: Both ABD spouses jointly claiming do not apply ineligible spouse resource deeming
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      family_couple_0:
        members: [claimant, spouse]
    households:
      family:
        members: [claimant, spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]

# 20 CFR 416.1202(c): an eligible individual must be aged, blind, or disabled.
- name: Neither spouse ABD does not apply resource deeming
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      family_couple_0:
        members: [claimant, spouse]
    households:
      family:
        members: [claimant, spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]

# 20 CFR 416.1202(a): the other adult must be the claimant spouse.
- name: An unrelated adult in a tax unit is not an ineligible spouse
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      adult:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_dependent: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, adult]
    marital_units:
      family_claimant:
        members: [claimant]
      family_adult:
        members: [adult]
    households:
      family:
        members: [claimant, adult]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]

# 20 CFR 416.1202(a): the spouses must be living together.
- name: Spouses living in separate households do not deem resources
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members: [claimant, spouse]
    marital_units:
      family_couple_0:
        members: [claimant, spouse]
    households:
      first:
        members: [claimant]
      second:
        members: [spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]

# Keep SSI tax head/spouse roles: an omitted marital unit is not evidence
# that a parent and adult dependent are spouses under 416.1202(a).
- name: Omitted marital units do not make a tax head parent an adult dependent spouse
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_household_head: false
        ssi_countable_resources:
          '2026': 5000
        is_parent: true
      adult_child:
        age: 25
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_household_head: false
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members:
        - parent
        - adult_child
    households:
      home:
        members:
        - parent
        - adult_child
  output:
    is_ssi_spousal_resource_deeming_applies:
    - false
    - false
    ssi_resources_deemed_from_ineligible_spouse:
    - 0
    - 0
    meets_ssi_resource_test:
    - false
    - true

# 416.1160 and 416.1205(a): a married claimant who is a tax dependent still
# lives with an ineligible spouse; tax roles do not decide marriage.
- name: Married dependents in a parent's tax unit deem the ineligible spouse's resources
  period: 2026-01
  input:
    people:
      mother:
        age: 55
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        ssi_countable_resources:
          '2026': 0
      claimant:
        age: 25
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 25
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ssi_countable_resources:
          '2026': 3001
    tax_units:
      family:
        members: [mother, claimant, spouse]
    marital_units:
      mother_unit:
        members: [mother]
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [mother, claimant, spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, true, false]
    ssi_resources_deemed_from_ineligible_spouse: [0, 3001, 0]
    meets_ssi_resource_test: [true, false, false]

# A situation that omits marital units puts everyone in one default unit; a
# co-resident head of another tax unit is not thereby a spouse (416.1160).
- name: Omitted marital units do not make a co-resident head of another tax unit a spouse
  period: 2026-01
  input:
    people:
      claimant:
        age: 70
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 2500
      son:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      claimant_unit:
        members: [claimant]
      son_unit:
        members: [son]
    households:
      home:
        members: [claimant, son]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]
    ssi_resources_deemed_from_ineligible_spouse: [0, 0]
    meets_ssi_resource_test: [false, true]

# Spouses filing separately are spouses when the tax unit records that they
# live together (cohabitating_spouses), as for Medicaid and Social Security
# taxation; 416.1205(a) then applies the couple limit to their combined
# resources.
- name: Cohabiting spouses filing separately deem the ineligible spouse's resources
  period: 2026-01
  input:
    people:
      claimant:
        age: 70
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 68
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 3001
    tax_units:
      claimant_unit:
        members: [claimant]
        cohabitating_spouses: true
      spouse_unit:
        members: [spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [claimant, spouse]
  output:
    is_ssi_spousal_resource_deeming_applies: [true, false]
    ssi_resources_deemed_from_ineligible_spouse: [3001, 0]
    meets_ssi_resource_test: [false, false]

# Without that record, separate filers in one marital unit are not shown to
# be married, for the claimant's spouse as for a parent's spouse.
- name: Separate filers without cohabitation evidence do not deem resources
  period: 2026-01
  input:
    people:
      claimant:
        age: 70
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      partner:
        age: 68
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 3001
    tax_units:
      claimant_unit:
        members: [claimant]
      partner_unit:
        members: [partner]
    marital_units:
      couple:
        members: [claimant, partner]
    households:
      home:
        members: [claimant, partner]
  output:
    is_ssi_spousal_resource_deeming_applies: [false, false]
    ssi_resources_deemed_from_ineligible_spouse: [0, 0]
    meets_ssi_resource_test: [true, false]
