# Hand-computed cases: 20 CFR 416.1202(b), excess over the same individual
# or couple resource limit used for SSI resource eligibility, never negative.
# https://www.ecfr.gov/current/title-20/section-416.1202
# https://www.ecfr.gov/current/title-20/section-416.1205
# POMS SI 01330.200.A includes a parent spouse; .200.B equally divides excess
# and reallocates a child share once that child is ineligible.
# https://secure.ssa.gov/poms.nsf/lnx/0501330200
# Official Blake and Goode examples (including cascading ineligibility):
# https://secure.ssa.gov/poms.nsf/lnx/0501330280
# Official White and Ryder examples include an ABD parent and use 2024 limits:
# https://secure.ssa.gov/poms.nsf/lnx/0501330340
# Blake/Goode use the unchanged 2026 resource limits; stock amounts are those
# in the 2024 example. Ryder aggregates cash and second-car countable value
# into the published countable resource input because these assets have no
# separate SSI stock input. Waiver input certifies all .1202(b)(2) conditions.
# Optional parent links identify co-resident parents across tax units. Without
# links, tax units remain a relationship proxy and cannot distinguish grandparents.

