# deems 35,478. The child's countable income is above 11,928. Ohio's Medicaid deeming
# pools the pension the same way and applies the SSI exclusions with its 20 disregard,
# so it deems 35,478 too.
- name: Without parent ids, a father with a pension in his own tax unit is counted with the mother.
