        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, true, true]
    ssi_ineligible_parent_allocation: [0, 17_892, 17_892]
    ssi_unearned_income_deemed_from_ineligible_parent: [35_478, 0, 0]
    ssi: [0, 0, 0]
    medicaid_optional_senior_or_disabled_unearned_income_deemed_from_ineligible_parent: [35_478, 0, 0]

