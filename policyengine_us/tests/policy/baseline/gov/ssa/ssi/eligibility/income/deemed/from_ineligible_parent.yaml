# Married parents in separate tax units, with parent ids naming the mother. Both
# live with the child, so 20 CFR 416.1165(d)(3)(i) subtracts the whole couple rate
# from the mother's wages: (48,000 - 240 - 780) / 2 = 23,490, less 1,491 x 12 =
# 17,892, deems 5,598. The child's countable income is 5,598 - 240 = 5,358 and SSI
# is 994 x 12 - 5,358 = 6,570.
- name: Married parents in separate tax units subtract the whole couple rate from the mother's wages.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 10
        person_id: 1
        parent_1_id: 2
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
      person2:
        age: 35
        person_id: 2
        is_tax_unit_head: true
        employment_income_before_lsr: 48_000
      person3:
        age: 38
        person_id: 3
        is_tax_unit_head: true
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3]
    marital_units:
      marital_unit1:
        members: [person2, person3]
      marital_unit2:
        members: [person1]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, true, true]
    ssi_ineligible_parent_allocation: [0, 17_892, 17_892]
    ssi_unearned_income_deemed_from_ineligible_parent: [5_598, 0, 0]
    ssi_countable_income: [5_358, 0, 0]
    ssi: [6_570, 0, 0]

