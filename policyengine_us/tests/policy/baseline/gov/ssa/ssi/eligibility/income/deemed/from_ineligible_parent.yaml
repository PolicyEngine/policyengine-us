# less 17,892, deems 5,598, and the child's SSI is 11,928 - (5,598 - 240) = 6,570.
# Two individual rates would total 23,856 and deem nothing.
- name: Unmarried parents in one tax unit share the couple rate.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 10
        person_id: 1
        parent_1_id: 2
        parent_2_id: 3
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
      person2:
        age: 35
        person_id: 2
        is_tax_unit_head: true
        employment_income_before_lsr: 48_000
      person3:
        age: 38
        person_id: 3
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [person1, person2, person3]
    marital_units:
      marital_unit1:
        members: [person1]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person3]
    households:
      household:
        members: [person1, person2, person3]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [false, true, true]
    ssi_ineligible_parent_allocation: [0, 8_946, 8_946]
    ssi_unearned_income_deemed_from_ineligible_parent: [5_598, 0, 0]
    ssi_countable_income: [5_358, 0, 0]
    ssi: [6_570, 0, 0]

# Married parents in separate tax units, each with a disabled child in their own unit,
# with no parent ids. Each unit pools both parents' wages: (78,000 - 240 - 780) / 2 =
# 38,490, less the couple rate of 17,892, leaves 20,598. 20 CFR 416.1165(e)(2) divides
# it "equally among those eligible children", here both units' children: 10,299 each.
# Each child's SSI is 11,928 - (10,299 - 240) = 1,869.
- name: Married parents in separate tax units divide the pooled income among both units' children.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 35
        is_tax_unit_head: true
