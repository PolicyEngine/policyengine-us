      person4:
        age: 8
        is_tax_unit_dependent: true
        meets_ssi_disability_criteria: true
    tax_units:
      tax_unit1:
        members: [person1, person2]
      tax_unit2:
        members: [person3, person4]
    marital_units:
      marital_unit1:
        members: [person1, person3]
      marital_unit2:
        members: [person2]
      marital_unit3:
        members: [person4]
    households:
      household:
        members: [person1, person2, person3, person4]
        state_code: OH
  output:
    is_ssi_ineligible_parent: [true, false, true, false]
    ssi_ineligible_parent_allocation: [17_892, 0, 17_892, 0]
    ssi_unearned_income_deemed_from_ineligible_parent: [0, 10_299, 0, 10_299]
    ssi: [0, 1_869, 0, 1_869]

# Without parent ids, the mother's spouse in his own tax unit is still an ineligible
# parent (20 CFR 416.1160(d)), as on the resource side, so his 30,000 pension joins
