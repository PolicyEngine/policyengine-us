  output:
    is_ssi_ineligible_parent: [false, true, true]
    ssi_ineligible_parent_allocation: [0, 17_892, 17_892]
    ssi_unearned_income_deemed_from_ineligible_parent: [20_598, 0, 0]
    ssi_countable_income: [20_358, 0, 0]
    ssi: [0, 0, 0]

# Unmarried parents in one tax unit, both named by the child's parent ids. Both
# live with the child, so 20 CFR 416.1165(d)(3)(i) subtracts the couple rate, which
