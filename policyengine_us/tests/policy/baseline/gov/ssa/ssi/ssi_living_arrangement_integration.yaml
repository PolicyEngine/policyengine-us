      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
  output:
    ssi_federal_living_arrangement: OWN_HOUSEHOLD
    ssi_pmv_applies: true
    # PMV monthly = 342.33
    # Actual = 100 < PMV → use actual
    ssi_in_kind_support_and_maintenance: 100
    # Countable = (100 - 20) = 80 (after $20 general exclusion)
    ssi_countable_income: 80
    # uncapped = 967 - 80 = 887
    uncapped_ssi: 887
    ssi: 887

