      person1:
        age: 40
        is_disabled: true
        meets_ssi_disability_criteria: true
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
  output:
    ssi_federal_living_arrangement: OWN_HOUSEHOLD
    ssi_amount_if_eligible: 967
    ssi_countable_income: 0
    uncapped_ssi: 967
    ssi: 967

