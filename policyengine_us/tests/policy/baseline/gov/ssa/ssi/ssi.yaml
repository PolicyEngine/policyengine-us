# Unit tests for SSI variable (final benefit calculation)
# The first tests only use the direct inputs to the ssi variable; the Texas
# self-employment and railroad retirement cases after them run the full income
# calculation.

# Note: The 'abolish_ssi' parameter test would need a reform, which is not
# supported in the current test framework for YAML tests. This would need to be
# tested with a Python test instead.

- name: Zero when uncapped_ssi is zero
  period: 2022
  input:
    uncapped_ssi: 0
  output:
    ssi: 0

- name: Returns uncapped_ssi when positive
  period: 2022
  input:
    uncapped_ssi: 8892
  output:
    ssi: 8892

- name: Returns zero when uncapped_ssi is negative
  period: 2022
  input:
    uncapped_ssi: -100
  output:
    ssi: 0

- name: Texas senior with Schedule C profit receives no SSI or MSP premium coverage.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 67
    state_code: TX
    self_employment_income: 60_000
  output:
    ssi_earned_income: 60_000
    ssi_countable_income: 29_490
    ssi: 0
    msp_eligible: false
    msp_part_b_premium_coverage: 0
    medicare_part_b_premium: 2_434.80

- name: Texas senior with farm profit receives no SSI or MSP premium coverage.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 67
    state_code: TX
    farm_operations_income: 60_000
  output:
    ssi_earned_income: 60_000
    ssi_countable_income: 29_490
    ssi: 0
    msp_eligible: false
    msp_part_b_premium_coverage: 0
    medicare_part_b_premium: 2_434.80

- name: Texas senior with partnership earnings receives no SSI or MSP premium coverage.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 67
    state_code: TX
    partnership_self_employment_net_earnings: 60_000
  output:
