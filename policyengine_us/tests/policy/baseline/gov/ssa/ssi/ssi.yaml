- name: Farm income of an ineligible spouse is deemed to a Texas senior.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 67
      spouse:
        age: 60
        farm_operations_income: 60_000
    households:
      household:
        members: [applicant, spouse]
        state_code: TX
    marital_units:
      couple:
        members: [applicant, spouse]
    tax_units:
      tax_unit:
        members: [applicant, spouse]
    spm_units:
      spm_unit:
        members: [applicant, spouse]
  output:
    ssi_earned_income: [0, 60_000]
    ssi_earned_income_deemed_from_ineligible_spouse: [60_000, 0]
    ssi_income_deemed_from_ineligible_spouse: [29_490, 0]
    ssi: [0, 0]
