    ssi_countable_income: 29_490
    ssi: 0
    msp_eligible: false
    msp_part_b_premium_coverage: 0
    medicare_part_b_premium: 2_434.80

- name: Farm income of an ineligible spouse is deemed to a Texas senior.
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      applicant:
        age: 67
      spouse:
        age: 60
        farm_operations_income: 60_000
    households:
      household:
        members: [applicant, spouse]
        state_code: TX
    marital_units:
      couple:
        members: [applicant, spouse]
    tax_units:
      tax_unit:
        members: [applicant, spouse]
    spm_units:
      spm_unit:
        members: [applicant, spouse]
  output:
    ssi_earned_income: [0, 60_000]
    ssi_earned_income_deemed_from_ineligible_spouse: [60_000, 0]
    ssi_income_deemed_from_ineligible_spouse: [29_490, 0]
    ssi: [0, 0]

- name: A railroad retirement annuity reduces an aged divorced spouse's SSI.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    # 900 a month, near the RRB's September 2025 average divorced spouse
    # annuity of 893.35 (Quarterly Benefit Statistics, Table 1).
    railroad_benefits: 10_800
  output:
    # (900 - 20 general exclusion) x 12 = 10,560.
    ssi_countable_income: 10_560
    # 2026 federal benefit rate of 994 x 12 = 11,928; 11,928 - 10,560 = 1,368.
    uncapped_ssi: 1_368
    ssi: 1_368

- name: The average railroad retirement employee annuity leaves an aged retiree no SSI.
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 70
    # RRB News Release 25-8: the average regular employee annuity is 3,636 a
    # month in January 2026; 3,636 x 12 = 43,632.
    railroad_benefits: 43_632
  output:
    # (3,636 - 20 general exclusion) x 12 = 43,392.
    ssi_countable_income: 43_392
    # 11,928 - 43,392 = -31,464.
    uncapped_ssi: -31_464
    ssi: 0
