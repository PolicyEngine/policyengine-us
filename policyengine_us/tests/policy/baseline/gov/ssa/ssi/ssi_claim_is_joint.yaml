- name: Case 5, martial unit, both head and spouse eligible, and a eligible child.
  period: 2025-01
  input:
    people:
      person1:
        age: 30
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_head: true
      person2:
        age: 22
        is_disabled: true
        meets_ssi_disability_criteria: true
        is_tax_unit_spouse: true
      person3:
