- name: ISM shelter support adds to unearned income before exclusions.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        is_ssi_aged_blind_disabled: true
        ssi_receives_outside_shelter_support: true
  output:
    # PMV monthly = (1/3 x 967) + 20 = 342.33
    # PMV annual = 342.33 x 12 = 4_108
    # ISM enters unearned pool: total unearned = 4_108
    # After $20 general exclusion: 4_108 - 240 = 3_868
    # No earned income, so earned exclusions don't apply
    # Countable = 3_868
    ssi_countable_income: 3_868

- name: An aged permanent resident without 40 SSI quarters has their pension counted.
  period: 2025
  absolute_error_margin: 0.01
  input:
    age: 70
    immigration_status: LEGAL_PERMANENT_RESIDENT
    years_since_us_entry: 10
    ssi_qualifying_quarters_earnings: 20
    pension_income: 60_000
  output:
    # The noncitizen test bars SSI itself but does not zero the income
    # that Medicaid and state programs count: 60,000 - 20 x 12 = 59,760.
    ssi_countable_income: 59_760
    ssi: 0

- name: Spouse income is deemed to an aged permanent resident without 40 SSI quarters.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        is_tax_unit_head: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        years_since_us_entry: 10
        ssi_qualifying_quarters_earnings: 20
        pension_income: 6_000
      person2:
        age: 55
        is_tax_unit_spouse: true
        employment_income: 40_000
    tax_units:
      tax_unit:
        members: [person1, person2]
    marital_units:
      marital_unit:
        members: [person1, person2]
  output:
    # Own: (500 - 20) x 12 = 5,760. Deemed from the spouse who is not aged,
    # blind, or disabled: 19,610 (20 CFR 416.1163). The spouse's own
    # countable income stays 0.
    ssi_countable_income: [25_370, 0]
    ssi: [0, 0]

- name: A couple is paid as a couple through the month one spouse enters a Medicaid facility and as individuals from the first full month.
  period: 2000
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 70
        ssi_unearned_income: 4_800
        ssi_lives_in_medical_treatment_facility:
          2000-07: true
        ssi_medicaid_pays_majority_of_care:
          2000-07: true
      person2:
        age: 70
        ssi_unearned_income: 2_400
    marital_units:
      marital_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    # POMS SI 02005.050 D.1: Allen (person1) has $400 a month of Social
    # Security and Martha (person2) a $200 spouse's benefit. Allen enters a
    # Title XIX facility on June 10, 2000 and stays.
    # June, "the last month for which payment is computed for a couple":
    # 400 + 200 - 20 = 580 of countable income against the 769 couple rate
    # leaves 189, or 94.50 each.
    # July, "computed as if Allen and Martha are individuals": Allen has
    # 30 - 380, so no payment. Martha has 513 - 180 = 333. POMS shows 332
    # from the 512 individual rate first set for 2000; SSA's rate table has
    # 513 for 2000 after Public Law 106-554.
    ssi_countable_income:
      2000-06: [290, 290]
      2000-07: [380, 180]
    ssi:
      2000-06: [94.5, 94.5]
      2000-07: [0, 333]
