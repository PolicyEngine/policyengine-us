# State supplement regressions for an eligible couple sharing a household
# and tax unit with a third adult, without explicit marital units.
# Each case cites the state rule and computes its expectation independently.

# co/ssa/oap/co_oap_three_adult.yaml
# 9 CCR 2503-5 3.533(A)(2)(c): married clients split the $20 disregard.
# 3.534(C) exempts spouses receiving SSI/OAP within the $1,032 OAP limit.
# https://www.sos.state.co.us/CCR/GenerateRulePdf.do?fileName=9+CCR+2503-5&ruleVersionId=12428#page=76
# SSI = (1,491 - (300 + 200 - 20)) / 2 = $505.50 each; third = $614.
# Own OAP incomes = $290/$190/$380. No spouse income is deemed.
# Monthly OAP = 1,032 - 505.50 - 290/190 = $236.50/$336.50;
# third = 1,032 - 614 - 380 = $38, raised to the $189 payment floor.
- name: CO OAP counts only the spouse in a default marital unit
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      husband:
        age: 70
        pension_income: 3_600
        is_tax_unit_head: true
      wife:
        age: 70
        pension_income: 2_400
        is_tax_unit_spouse: true
      third_adult:
        age: 70
        pension_income: 4_800
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [husband, wife, third_adult]
    households:
      household:
        members: [husband, wife, third_adult]
        state_code: CO
  output:
    co_oap_own_countable_income: [3_480, 2_280, 4_560]
    co_oap_deemed_income: [0, 0, 0]
    co_oap: [2_838, 4_038, 2_268]

# ct/dss/ssp/third_adult.yaml
# Conn. Gen. Stat. 17b-600(c): a co-resident couple has a $2,400 combined asset limit; a single person has $1,600. Couple resources are $1,000 + $1,000 = $2,000; the third adult has $1,000 separately.
# https://www.cga.ct.gov/current/pub/chap_319s.htm#sec_17b-600
- name: Connecticut excludes a third adult from the couple resource test
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    people:
      husband:
        age:
          2026: 70
        is_tax_unit_head:
          2026: true
        ssi_countable_resources:
          2026: 1000
      wife:
        age:
          2026: 70
        is_tax_unit_spouse:
          2026: true
        ssi_countable_resources:
          2026: 1000
      third_adult:
        age:
          2026: 70
        is_tax_unit_dependent:
          2026: true
        ssi_countable_resources:
          2026: 1000
    tax_units:
      tax_unit:
        members: [husband, wife, third_adult]
    households:
      household:
        members: [husband, wife, third_adult]
        state_code:
          2026: CT
  output:
    ct_ssp_resource_eligible: [true, true, true]

