      husband:
        age:
          2026: 70
        is_tax_unit_head:
          2026: true
        in_ssp_sapn_eligible: true
        ssi: 30
        ssi_countable_income:
          2026: 0
      wife:
        age:
          2026: 70
        is_tax_unit_spouse:
          2026: true
        in_ssp_sapn_eligible: true
        ssi: 30
        ssi_countable_income:
          2026: 0
      third_adult:
        age:
          2026: 70
        is_tax_unit_dependent:
          2026: true
        in_ssp_sapn_eligible: false
        ssi: 0
        ssi_countable_income:
          2026: 1_200
    tax_units:
      tax_unit:
        members: [husband, wife, third_adult]
    households:
      household:
        members: [husband, wife, third_adult]
        state_code:
          2026: IN
  output:
    in_ssp_sapn: [22, 22, 0]

