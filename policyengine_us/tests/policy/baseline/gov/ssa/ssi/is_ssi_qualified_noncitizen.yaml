- name: SSI citizenship tests
  period: 2024
  input:
    people:
      person0:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 30
      person1:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: LEGAL_PERMANENT_RESIDENT
        ssi_qualifying_quarters_earnings: 50
      person2:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: REFUGEE
      person3:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: ASYLEE
      person4:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: DEPORTATION_WITHHELD
      person5:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: CUBAN_HAITIAN_ENTRANT
      person6:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: CONDITIONAL_ENTRANT
      person7:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: PAROLED_ONE_YEAR
      person8:
        is_disabled: true
        meets_ssi_disability_criteria: true
        immigration_status: UNDOCUMENTED
    # Each person is single and files alone. Without units, the model would
    # make person0 and person1 the head and spouse of one tax unit, and so a
    # married couple.
    tax_units:
      unit0:
        members: [person0]
      unit1:
        members: [person1]
      unit2:
        members: [person2]
      unit3:
        members: [person3]
      unit4:
        members: [person4]
      unit5:
        members: [person5]
      unit6:
        members: [person6]
      unit7:
        members: [person7]
      unit8:
        members: [person8]
    marital_units:
      unit0:
        members: [person0]
      unit1:
        members: [person1]
      unit2:
        members: [person2]
      unit3:
        members: [person3]
      unit4:
        members: [person4]
      unit5:
        members: [person5]
      unit6:
        members: [person6]
      unit7:
        members: [person7]
      unit8:
        members: [person8]
  output:
    is_ssi_qualified_noncitizen: [false, true, true, true, true, true, true, true, false]
    is_ssi_eligible_individual: [false, true, true, true, true, true, true, true, false]
