    households:
      home:
        members: [claimant, spouse]
        state_code: FL
  output:
    uncapped_ssi_without_spousal_deeming: [714, 0]

- name: A low ISM rebuttal transfers unused general exclusion to claimant earnings.
  period: 2026-01
  absolute_error_margin: 0.01
