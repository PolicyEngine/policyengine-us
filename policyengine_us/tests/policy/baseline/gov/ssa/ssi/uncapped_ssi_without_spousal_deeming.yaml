      spouse:
        age: 60
        employment_income: 500 * 12
    tax_units:
      couple:
        members: [claimant, spouse]
    marital_units:
      couple:
        members: [claimant, spouse]
    households:
      home:
        members: [claimant, spouse]
        state_code: FL
  output:
    uncapped_ssi_without_spousal_deeming: [931.5, 0]
