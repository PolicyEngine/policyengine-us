# Unit tests for tob_revenue_medicare_hi
# Tests Medicare HI trust fund revenue allocation from SS benefit taxation
# Uses double-branching methodology per 42 U.S.C. 401 note

- name: No SS benefits - zero Medicare revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 0
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    tob_revenue_medicare_hi: 0

- name: Below threshold - zero Medicare revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 20_000
        employment_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    tob_revenue_medicare_hi: 0

- name: Tier 1 only - zero Medicare revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 20_000
        employment_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Current and pre-1993 law both include $2,500, so HI receives zero.
    tob_revenue_medicare_hi: 0

- name: High income single - branching allocation
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 30_000
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Pre-1993 inclusion = min($15,000, 50% * ($65,000 - $25,000)) = $15,000.
    # Tax with current SS is $8,022; tax with pre-1993 SS is $5,712.
    tax_unit_taxable_social_security: 25_500
    tob_revenue_total: 4_240
    tob_revenue_oasdi: 1_930
    tob_revenue_medicare_hi: 2_310

- name: Very high income - branching allocation
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 30_000
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Taxable income without SS = $100,000 - $16,550 = $83,450.
    # Tax without / old-law / current-law SS = $13,412 / $16,712 / $19,190.50.
    tax_unit_taxable_social_security: 25_500
    tob_revenue_total: 5_778.50
    tob_revenue_oasdi: 3_300
    tob_revenue_medicare_hi: 2_478.50

- name: Zero taxable SS - zero revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 15_000
        employment_income: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    tax_unit_taxable_social_security: 0
    tob_revenue_oasdi: 0
    tob_revenue_medicare_hi: 0
