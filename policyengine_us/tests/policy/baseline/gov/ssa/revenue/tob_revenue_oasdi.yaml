# Unit tests for tob_revenue_oasdi
# Tests OASDI trust fund revenue allocation from SS benefit taxation
# Uses double-branching methodology per 42 U.S.C. 401 note

- name: No SS benefits - zero OASDI revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 0
        employment_income: 100_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    tob_revenue_oasdi: 0

- name: Below threshold - zero OASDI revenue
  period: 2024
  input:
    people:
      person1:
        age: 67
        social_security: 20_000
        employment_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Combined income below threshold - no taxable SS
    tob_revenue_oasdi: 0

- name: Tier 1 only - all revenue to OASDI
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 20_000
        employment_income: 20_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Taxable SS = $2,500 (in tier 1 only)
    # Pre-1993 inclusion is also $2,500; tax rises from $345 to $595.
    tax_unit_taxable_social_security: 2_500
    tax_unit_taxable_social_security_pre_1993: 2_500
    tob_revenue_oasdi: 250
    tob_revenue_medicare_hi: 0
    tob_revenue_total: 250

- name: Second-tier witness allocates the pre-1993 excess-over-base amount to OASDI
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      retiree:
        age: 70
        social_security: 20_000
        taxable_interest_income: 30_000
    tax_units:
      tax_unit:
        members: [retiree]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [retiree]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [retiree]
  output:
    tax_unit_combined_income_for_social_security_taxability: 40_000
    # Old law: min(50% * $20,000, 50% * ($40,000 - $25,000)) = $7,500.
    # Current law: 85% * ($40,000 - $34,000) + $4,500 = $9,600.
    tax_unit_taxable_social_security_pre_1993: 7_500
    tax_unit_taxable_social_security: 9_600
    # Deductions = $16,100 + $2,050 + $6,000 = $24,150.
    # Tax without SS: 10% * $5,850 = $585.
    # Old-law tax: $1,240 + 12% * $950 = $1,354.
    # Current-law tax: $1,240 + 12% * $3,050 = $1,606.
    tob_revenue_oasdi: 769
    tob_revenue_medicare_hi: 252
    tob_revenue_total: 1_021

- name: Provisional income below the base leaves all TOB revenue zero
  period: 2026
  input:
    people:
      retiree:
        age: 70
        social_security: 20_000
        taxable_interest_income: 10_000
    tax_units:
      tax_unit:
        members: [retiree]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [retiree]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [retiree]
  output:
    tax_unit_combined_income_for_social_security_taxability: 20_000
    tax_unit_taxable_social_security_pre_1993: 0
    tax_unit_taxable_social_security: 0
    tob_revenue_oasdi: 0
    tob_revenue_medicare_hi: 0
    tob_revenue_total: 0

- name: Joint return uses the statutory 32000 old-law base
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 60
        social_security: 20_000
        taxable_interest_income: 40_000
      spouse:
        age: 60
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    spm_units:
      spm_unit:
        members: [head, spouse]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [head, spouse]
  output:
    tax_unit_combined_income_for_social_security_taxability: 50_000
    # Old law: min($10,000, 50% * ($50,000 - $32,000)) = $9,000.
    # Current law: 85% * ($50,000 - $44,000) + $6,000 = $11,100.
    tax_unit_taxable_social_security_pre_1993: 9_000
    tax_unit_taxable_social_security: 11_100
    # Deduction $29,200; taxable income $10,800 / $19,800 / $21,900.
    # All remain in the joint 10% bracket.
    tob_revenue_oasdi: 900
    tob_revenue_medicare_hi: 210
    tob_revenue_total: 1_110

- name: Married filing separately while cohabitating uses the zero old-law base
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      retiree:
        age: 60
        social_security: 20_000
        taxable_interest_income: 30_000
    tax_units:
      tax_unit:
        members: [retiree]
        filing_status: SEPARATE
        cohabitating_spouses: true
    spm_units:
      spm_unit:
        members: [retiree]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [retiree]
  output:
    tax_unit_taxable_social_security_pre_1993: 10_000
    tax_unit_taxable_social_security: 17_000
    # Deduction $14,600; tax without SS is $1,616.
    # Old-law and current-law additions are entirely in the 12% bracket.
    tob_revenue_oasdi: 1_200
    tob_revenue_medicare_hi: 840
    tob_revenue_total: 2_040

- name: Married filing separately living apart uses the 25000 old-law base
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      retiree:
        age: 60
        social_security: 20_000
        taxable_interest_income: 30_000
    tax_units:
      tax_unit:
        members: [retiree]
        filing_status: SEPARATE
        cohabitating_spouses: false
    spm_units:
      spm_unit:
        members: [retiree]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [retiree]
  output:
    # Same provisional income as the cohabitating case, with the single base.
    tax_unit_taxable_social_security_pre_1993: 7_500
    tax_unit_taxable_social_security: 9_600
    # Tax is $1,616 / $2,516 / $2,768 without / old-law / current-law SS.
    tob_revenue_oasdi: 900
    tob_revenue_medicare_hi: 252
    tob_revenue_total: 1_152

- name: High income single - branching allocation
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 30_000
        employment_income: 50_000
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
        takes_up_tanf_if_eligible: false
    households:
      household:
        members: [person1]
  output:
    # Pre-1993 inclusion = min($15,000, 50% * ($65,000 - $25,000)) = $15,000.
    # With $16,550 deductions, tax is $3,782 / $5,712 / $8,022
    # without SS / with pre-1993 SS / with current-law SS.
    tax_unit_taxable_social_security: 25_500
    tob_revenue_total: 4_240
    tob_revenue_oasdi: 1_930
    tob_revenue_medicare_hi: 2_310

- name: Very high income - branching allocation
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 67
        social_security: 30_000
        employment_income: 100_000
    tax_units:
      tax_unit:
