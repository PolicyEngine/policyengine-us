  output:
    # Taxable income without SS = $100,000 - $16,550 = $83,450.
    # Tax without / old-law / current-law SS = $13,412 / $16,712 / $19,190.50.
    tax_unit_taxable_social_security: 25_500
    tob_revenue_total: 5_778.50
    tob_revenue_oasdi: 3_300
    tob_revenue_medicare_hi: 2_478.50

