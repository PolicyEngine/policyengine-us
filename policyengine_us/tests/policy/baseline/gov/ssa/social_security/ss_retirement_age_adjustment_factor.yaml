    ss_claiming_age: 70
  output:
    ss_full_retirement_age_months: 786
    # 840 - 786 = 54 months at 7 percent a year (7/12 of 1 percent a month)
    # 54 * 0.07 / 12 = 0.315
    ss_retirement_age_adjustment_factor: 1.315

