- name: At full retirement age - no adjustment
  period: 2024
  input:
    age: 66  # Born 1958, FRA is 66 years 8 months
  output:
    ss_full_retirement_age_months: 800  # 66 years 8 months
    # Age 66 = 792 months, FRA = 800 months, so 8 months early
    # 8 * 0.00556 = 0.04448 reduction
    # Factor: 1 - 0.04448 = 0.95552
    ss_retirement_age_adjustment_factor: 0.955

- name: Early retirement at 62 for someone with FRA 67
  period: 2024
  input:
    age: 62  # Born 1962, FRA is 67
  output:
    ss_full_retirement_age_months: 804  # 67 years
    # 60 months early:
    # First 36 months: 36 * 0.00556 = 0.20016
    # Next 24 months: 24 * 0.00417 = 0.10008
    # Total reduction: 0.30024
    # Factor: 1 - 0.30024 = 0.69976
    ss_retirement_age_adjustment_factor: 0.700

- name: Early retirement at 64 for someone with FRA 66
  period: 2024
  input:
    age: 64  # Born 1960, but using age that would have FRA 66 for test
  output:
    ss_full_retirement_age_months: 804  # Actually 67 for 1960
    # 36 months early (64 to 67):
    # 36 * 0.00556 = 0.20016
    # Factor: 1 - 0.20016 = 0.79984
    ss_retirement_age_adjustment_factor: 0.800

- name: Delayed retirement at 70 for someone born 1954
  period: 2024
  input:
    age: 70  # Born 1954, FRA is 66
  output:
    ss_full_retirement_age_months: 792  # 66 years
    # 4 years delayed = 48 months / 12 = 4 years
    # Born 1954 gets 8% per year
    # 4 * 0.08 = 0.32
    # Factor: 1 + 0.32 = 1.32
    ss_retirement_age_adjustment_factor: 1.32

- name: Delayed retirement at 68 for someone born 1956
  period: 2024
  input:
    age: 68  # Born 1956, FRA is 66 years 4 months
  output:
    ss_full_retirement_age_months: 796  # 66 years 4 months
    # 20 months delayed = 1.667 years
    # Born 1956 gets 8% per year
    # 1.667 * 0.08 = 0.133
    # Factor: 1 + 0.133 = 1.133
    ss_retirement_age_adjustment_factor: 1.133


- name: Delayed retirement at 69 for someone born 1916 earns 1 percent a year
  period: 2026
  input:
    age: 110  # Born 1916, first eligible (age 62) in 1978
    ss_claiming_age: 69
  output:
    ss_full_retirement_age_months: 780  # 65 years
    # 69 years = 828 months, so 48 months delayed = 4 years
    # 42 USC 402(w)(6)(A) and POMS RS 00615.692D: births before
    # 01/02/1917 get 1/12 of 1 percent a month, 1 percent a year
    # 4 * 0.01 = 0.04
    # Factor: 1 + 0.04 = 1.04
    ss_retirement_age_adjustment_factor: 1.04

- name: Delayed retirement at 69 for someone born 1917 earns 3 percent a year
  period: 2026
  input:
    age: 109  # Born 1917, first eligible (age 62) in 1979
    ss_claiming_age: 69
  output:
    ss_full_retirement_age_months: 780  # 65 years
    # 69 years = 828 months, so 48 months delayed = 4 years
    # 42 USC 402(w)(6)(B) and POMS RS 00615.692D: births from
    # 01/02/1917 through 01/01/1925 get 1/4 of 1 percent a month,
    # 3 percent a year
    # 4 * 0.03 = 0.12
    # Factor: 1 + 0.12 = 1.12
    ss_retirement_age_adjustment_factor: 1.12

- name: Born 1930 claiming at 70 gets 60 increment months at FRA 65
  period: 2026
  input:
    age: 96  # Born 1930
    ss_claiming_age: 70
  output:
    ss_full_retirement_age_months: 780  # 65 years
    # POMS RS 00615.692E: 60 maximum increment months (age 65 to 70).
    # POMS RS 00615.692D: 3/8 of 1 percent a month, 4.5 percent a year.
    # 60 * 0.00375 = 0.225
    ss_retirement_age_adjustment_factor: 1.225

- name: Born 1916 claiming at 70 gets 60 increment months at 1 percent a year
