- name: Default will have zero income and be especially low.
  period: 2022
  input:
    ami: 10_000
  output:
    hud_income_level: ESPECIALLY_LOW

- name: 1-person household with 100% income/AMI.
  period: 2022
  input:
    ami: 10_000
    hud_annual_income: 10_000
  output:
    # Moderate threshold for a one-person household is 70% of AMI.
    hud_income_level: ABOVE_MODERATE

- name: 6-person household with 100% income/AMI.
  period: 2022
  input:
    ami: 10_000
    hud_annual_income: 10_000
    spm_unit_size: 6
  output:
    # Low limit for 6 is 80% + 2 * 6.4% = 92.8%.
    # Moderate limit is 100% + 2 * 8% = 116%.
    hud_income_level: MODERATE

- name: 4-person household with 80% income/AMI. 
  period: 2022
  input:
    ami: 10_001 # Floating point issue causes it to fail is $10,000.
    hud_annual_income: 7_000
    spm_unit_size: 4
  output:
    # Low limit for 4 is 80%.
    hud_income_level: LOW

- name: 1-person household with 35% income/AMI. 
  period: 2022
  input:
    ami: 10_001 # Floating point issue causes it to fail is $10,000.
    hud_annual_income: 3_500
  output:
    # Limit is 35%.
    hud_income_level: ESPECIALLY_LOW

- name: 2-person household with 40% income/AMI. 
  period: 2022
  input:
    ami: 10_001 # Floating point issue causes it to fail is $10,000.
    hud_annual_income: 4_000
    spm_unit_size: 2
  output:
    # Limit is 40%.
    hud_income_level: ESPECIALLY_LOW

- name: 3-person household with 45% income/AMI. 
  period: 2022
  input:
    ami: 10_001 # Floating point issue causes it to fail is $10,000.
    hud_annual_income: 4_500
    spm_unit_size: 3
  output:
    # Limit is 45%.
    hud_income_level: ESPECIALLY_LOW

- name: Missing AMI and missing income limits are above moderate.
  period: 2024
  input:
    county_fips: "99999"
    hud_annual_income: 0
    spm_unit_size: 4
  output:
    hud_income_level: ABOVE_MODERATE

- name: Real HUD income limits classify a LA four-person SPM unit.
  period: 2024
  input:
    county_fips: "06037"
    hud_annual_income: 50_000
    spm_unit_size: 4
  output:
    hud_income_level: VERY_LOW
- name: Los Angeles FY2017 new renter one cent above the published low-income limit.
  period: 2017
  input:
    people:
      parent1:
        age: 40
        employment_income: 72_100.01
      parent2:
        age: 38
      child1:
        age: 8
      child2:
        age: 6
    spm_units:
      spm_unit:
        members: [parent1, parent2, child1, child2]
        spm_unit_tenure_type: RENTER
        receives_housing_assistance: false
    households:
      household:
        members: [parent1, parent2, child1, child2]
        state_code: CA
        county_fips: "06037"
  output:
    # HUD Section8-FY17, Los Angeles County, published l80_4 = $72,100.
    # The annual FY-label convention does not reproduce April 14 adoption.
    # This published high-cost low-income limit exceeds the $64,300 AMI;
    # just above it also exceeds the unchanged four-person moderate limit.
    hud_low_income_limit: 72_100
    spm_unit_size: 4
    hud_income_level: ABOVE_MODERATE
    is_eligible_for_housing_assistance: false


