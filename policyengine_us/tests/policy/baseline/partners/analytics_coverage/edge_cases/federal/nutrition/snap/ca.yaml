# California (CalFresh) cases that differ from the federal.yaml (TX) baseline
# for state-policy reasons:
# - CA MCE waives the net income test and uses a 200% poverty gross limit.
#   Units with three or more members also need a positive allotment.
# - CA's FY2026 SUA is $663, but after the federal heat-and-eat restriction
#   it requires heating/cooling expenses or elderly/disabled deeming.
#   The households below have no qualifying utility expenses.
# - CA extends CalFresh to additional immigration statuses (CFAP) and delays
#   the OBBB refugee exclusion to 2026-04-01 (ACL 25-92).
# SNAP uses the poverty guideline in effect at the preceding Oct 1:
# Jan-Sep 2026 use the 2025 FPG (3-person $26,650); Oct-Dec use the 2026 FPG
# ($27,320). The MCE gross limits are twice those guidelines.
- name: snap_ca_net_income_just_below_fy2026_net_limit (ca)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 36_000
      spouse:
        age: 33
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
      child1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
    households:
      household:
        members: &id001
        - head
        - spouse
        - child1
        state_code: CA
        zip_code: '90001'
        county_str: LOS_ANGELES_COUNTY_CA
    spm_units:
      spm_unit:
        members: *id001
        snap_assets: 500
    tax_units:
      tax_unit:
        members: *id001
        tax_unit_is_joint: true
    families:
      family:
        members: *id001
    marital_units:
      mu_couple:
        members:
        - head
        - spouse
      mu_child1:
        members:
        - child1
  output:
    spm_units:
      spm_unit:
        # Gross ratio 36,000/26,650 = 1.35 fails the federal 130% test, but CA
        # MCE's 200% gross limit and waived net test permit participation.
        # Net = 36,000/12 x 0.8 - 209 = 2,191.00, with no utility allowance
        # or shelter deduction. EC = ceil(2,191 x
        # 0.3) = 658 -> 785 - 658 = 127.00/month Jan-Sep; Oct-Dec (FY2027): net
        # 2,400 - 217 = 2,183 -> EC ceil(654.90) = 655 -> 808 - 655 = 153.00.
        # Annual = 9 x 127.00 + 3 x 153.00 = 1,602.00.
        snap: 1602.0
        is_snap_eligible: true
