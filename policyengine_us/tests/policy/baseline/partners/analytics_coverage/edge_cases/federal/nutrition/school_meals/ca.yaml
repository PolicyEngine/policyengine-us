# California universal school meals (Cal. Educ. Code sec. 49501.5).
# https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=EDC&sectionNum=49501.5
# Assume a public school participating in both meal programs and the state
# program. Calendar 2026 uses published SY 2025-26 reimbursement rates;
# see federal.yaml for the sources and annual-period assumptions.
- name: school_meals_universal_free_meals_above_185pct (ca)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 60_000
      spouse:
        age: 33
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
      child1:
        age: 8
        is_in_k12_school: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
    households:
      household:
        members: [head, spouse, child1]
        state_code: CA
        zip_code: '90001'
        county_str: LOS_ANGELES_COUNTY_CA
    spm_units:
      spm_unit:
        members: [head, spouse, child1]
    tax_units:
      tax_unit:
        members: [head, spouse, child1]
        tax_unit_is_joint: true
    families:
      family:
        members: [head, spouse, child1]
    marital_units:
      mu_couple:
        members: [head, spouse]
      mu_child1:
        members: [child1]
  output:
    spm_units:
      spm_unit:
        # 60,000 / 27,320 = 219.6% FPG: above the federal reduced-price
        # threshold, with no categorical route. State coverage makes both
        # meals free at the child's participating public school.
        meets_school_meal_categorical_eligibility: false
        state_has_universal_free_school_meals: true
        school_meal_countable_income: 60_000
        school_meal_daily_subsidy: 7.06
        school_meal_tier: 0  # FREE
        # (Combined FREE - PAID) x one enrolled child x 180 modeled days.
        school_meal_net_subsidy: 1119.60
        free_school_meals: 1119.60
        reduced_price_school_meals: 0
