# School meals (NSLP + SBP) federal edge cases.
# Each child attends a school participating in both meal programs. The model
# assigns one combined tier and values one breakfast plus one lunch per school
# day; it does not model the school's menu prices or actual family cash savings.
# Annual tests retain calendar-year FPG thresholds and January 1 rate lookup.
# 2026 FPG (3-person, contiguous US) = 15,960 + 2 x 5,680 = 27,320.
#   FREE <= 130% = 35,516; REDUCED <= 185% = 50,542; otherwise PAID,
#   unless categorical eligibility or state coverage makes both meals free.
# Calendar 2026 uses the published SY 2025-26 rates in force on January 1:
# NSLP (<60% free/reduced) plus SBP (non-severe-need), with no CPI adjustment.
#   FREE = 4.60 + 2.46 = 7.06;
#   REDUCED = 4.20 + 2.16 = 6.36; PAID = 0.44 + 0.40 = 0.84.
# Annual net benefits subtract the PAID subsidy and use one child x 180 days.
# Published base rates (pages 3, 4):
# https://www.govinfo.gov/content/pkg/FR-2025-07-24/pdf/2025-13879.pdf
# 2025 uses July 2024 base rates (page 4):
# https://www.govinfo.gov/content/pkg/FR-2024-07-10/pdf/2024-15175.pdf
# Use MO for federal reduced-price scenarios: TX covers breakfast copays and,
# from September 2025, lunch copays. That TX coverage is not yet modeled.
# https://squaremeals.org/Programs/School-Breakfast-Program/Reduced-Price-School-Meals-Now-Free
# These MO fixtures assume a participating school without CEP or another
# schoolwide subsidy. District sources match the January 1 school year:
# Rockwood's SY 2025-26 free/reduced policy (Ellisville 63011, calendar 2026):
# https://www.rsdmo.org/news/article/~board/rsd/post/free-and-reduced-meal-applications-available-for-2025-2026-school-year
# Mount Vernon's SY 2024-25 meal program/prices (65712, calendar 2025):
# https://www.mtvernon.k12.mo.us/apps/news/article/1943811
# These dated sources establish the district/program context, not exact
# historical reduced-price charges. Expected benefits use the federal
# reimbursement differences above, not district menu prices or cash savings.
- name: school_meals_free_tier_just_below_130pct (federal)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 35_500
      spouse:
        age: 33
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
      child1:
        age: 8
        is_in_k12_school: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
    households:
      household:
        members: [head, spouse, child1]
        state_code: TX
        zip_code: '75201'
        county_str: DALLAS_COUNTY_TX
    spm_units:
      spm_unit:
        members: [head, spouse, child1]
    tax_units:
      tax_unit:
        members: [head, spouse, child1]
        tax_unit_is_joint: true
    families:
      family:
        members: [head, spouse, child1]
    marital_units:
      mu_couple:
        members: [head, spouse]
      mu_child1:
        members: [child1]
  output:
    spm_units:
      spm_unit:
        # 35,500 / 27,320 = 129.9% <= 130% -> FREE on the income route
        # (SNAP also fires here via TX BBCE, so FREE is dual-caused; the
        # income-only boundary is pinned by the MO SNAP-blocked cases below).
        # FREE = (NSLP 4.60 + SBP 2.46) = 7.06.
        school_meal_daily_subsidy: 7.06
        school_meal_tier: 0  # FREE
        school_meal_net_subsidy: 1119.60
        free_school_meals: 1119.60
        reduced_price_school_meals: 0.00
- name: school_meals_free_tier_exactly_at_130pct_snap_blocked (federal)
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 35
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 35_516
        # Over the SNAP liquid-asset limit (3,000 standard) so SNAP cannot
        # spill into the FREE tier via categorical eligibility; MO is
        # non-BBCE, so the asset test binds.
        bank_account_assets: 10_000
      spouse:
        age: 33
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
      child1:
        age: 8
        is_in_k12_school: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
    households:
      household:
        members: [head, spouse, child1]
        state_code: MO
        zip_code: '63011'
        county_str: ST_LOUIS_COUNTY_MO
    spm_units:
      spm_unit:
        members: [head, spouse, child1]
    tax_units:
      tax_unit:
        members: [head, spouse, child1]
        tax_unit_is_joint: true
    families:
      family:
        members: [head, spouse, child1]
    marital_units:
      mu_couple:
        members: [head, spouse]
      mu_child1:
        members: [child1]
  output:
    spm_units:
      spm_unit:
        meets_school_meal_categorical_eligibility: false
        state_has_universal_free_school_meals: false
        # 35,516 / 27,320 = exactly 1.30; the tier formula uses <=, so
        # at-threshold resolves to FREE. SNAP = 0 (assets over limit,
        # no BBCE in MO), so this pins the pure income route inclusively.
        # FREE = (NSLP 4.60 + SBP 2.46) = 7.06.
        school_meal_daily_subsidy: 7.06
        school_meal_tier: 0  # FREE
        school_meal_net_subsidy: 1119.60
        free_school_meals: 1119.60
        reduced_price_school_meals: 0.00
