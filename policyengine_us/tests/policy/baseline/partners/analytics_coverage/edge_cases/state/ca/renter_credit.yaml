# California renter credit (R&TC 17053.5) edge cases, 2026 parameters:
# $60 single/separate, $120 joint/HOH/surviving spouse; CA AGI cap $55,830
# (single) / $111,660 (joint). Nonrefundable: it only reduces liability via
# ca_non_refundable_credits inside ca_income_tax_before_refundable_credits.
- name: ca_renter_credit_joint_fully_usable_against_liability (ca)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 50_000
        long_term_capital_gains_before_response: 0
        rent: 12_000
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
      spouse:
        age: 28
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
        long_term_capital_gains_before_response: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
    households:
      household:
        members: &id001
        - head
        - spouse
        state_code: CA
        zip_code: '90001'
        county_str: LOS_ANGELES_COUNTY_CA
    spm_units:
      spm_unit:
        members: *id001
    tax_units:
      tax_unit:
        members: *id001
        tax_unit_is_joint: true
    families:
      family:
        members: *id001
    marital_units:
      mu_couple:
        members:
        - head
        - spouse
  output:
    tax_units:
      tax_unit:
        # Joint, CA AGI 50,000 < 111,660 cap, positive rent -> $120.
        ca_renter_credit: 120.0
        # CA taxable = 50,000 - 11,800 std deduction = 38,200;
        # tax = 1% x 22,912 + 2% x (38,200 - 22,912) = 229.12 + 305.76
        # = 534.88.
        ca_income_tax_before_credits: 534.88
        # Two personal exemption credits (2 x 158) + renter 120 = 436.00.
        ca_non_refundable_credits: 436.0
        # 534.88 - 436.00 = 98.88 > 0: the renter credit is fully usable.
        ca_income_tax_before_refundable_credits: 98.88
