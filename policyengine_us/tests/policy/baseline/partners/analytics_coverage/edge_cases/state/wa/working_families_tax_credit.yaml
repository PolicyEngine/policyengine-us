# WA Working Families Tax Credit (RCW 82.08.0206), pinned to the federal
# EITC rules as in effect 2022-06-09. 2026 maximum amounts (2025 statutory
# values uprated by gov.irs.uprating and rounded to the nearest $5):
# 0 kids $345, 1 kid $675, 2 kids $1,020, 3+ kids $1,360;
# $50 minimum. Income ceiling = the current-year federal EITC maximum AGI
# (indexed each year, e.g. $19,539.74 childless / $51,593.38 head-of-household
# one child in 2026); the credit phases from the maximum down to $50 over the
# last $2,500 (0 kids) / $5,000 (1+ kids) of income below that ceiling.
- name: wa_wftc_joint_1_child_max_amount (wa)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 20_000
        capital_gains: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
      spouse:
        age: 28
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
        capital_gains: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
      child1:
        age: 5
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
        capital_gains: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
    households:
      household:
        members: &id001
        - head
        - spouse
        - child1
        state_code: WA
        zip_code: '98101'
        county_str: KING_COUNTY_WA
    spm_units:
      spm_unit:
        members: *id001
    tax_units:
      tax_unit:
        members: *id001
        tax_unit_is_joint: true
    families:
      family:
        members: *id001
    marital_units:
      mu_couple:
        members:
        - head
        - spouse
      mu_child1:
        members:
        - child1
  output:
    tax_units:
      tax_unit:
        # Income $20,000 is well below the 2026 one-child joint phase-out
        # start, so the credit is the full 2026 maximum: $660 (2025) x 1.02266
        # uprating = 674.96, rounded to the nearest $5 = $675.
        wa_working_families_tax_credit: 675
        adjusted_gross_income: 20_000.0
- name: wa_wftc_childless_mid_phase_out (wa)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 18_000
        capital_gains: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
    households:
      household:
        members: &id002
        - head
        state_code: WA
        zip_code: '98101'
        county_str: KING_COUNTY_WA
    spm_units:
      spm_unit:
        members: *id002
    tax_units:
      tax_unit:
        members: *id002
        tax_unit_is_joint: false
    families:
      family:
        members: *id002
    marital_units:
      mu_head:
        members:
        - head
  output:
    tax_units:
      tax_unit:
        # 2026 childless ceiling $19,539.74; phase-out starts $2,500 below at
        # $17,039.74; rate = (345 - 50)/2,500 = 0.118;
        # 345 - (18,000 - 17,039.74) x 0.118 = 231.69.
        wa_working_families_tax_credit: 231.69
        adjusted_gross_income: 18_000.0
