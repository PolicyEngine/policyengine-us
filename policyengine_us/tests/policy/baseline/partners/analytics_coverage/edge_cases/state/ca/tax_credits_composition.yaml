# California credit-stacking composition cases (2026). These pin how CA's
# refundable credits (CalEITC + YCTC + FYTC) and nonrefundable credits
# (exemptions + renter + CDCC) combine in ca_income_tax:
# nonrefundable credits cap at liability; refundable credits can push
# ca_income_tax negative.
- name: ca_credits_refundable_stack_foster_parent (ca)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 24
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 20_000
        long_term_capital_gains_before_response: 0
        rent: 0
        was_in_foster_care: true
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
      child1:
        age: 3
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
        long_term_capital_gains_before_response: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
    households:
      household:
        members: &id001
        - head
        - child1
        state_code: CA
        zip_code: '90001'
        county_str: LOS_ANGELES_COUNTY_CA
    spm_units:
      spm_unit:
        members: *id001
    tax_units:
      tax_unit:
        members: *id001
        tax_unit_is_joint: false
    families:
      family:
        members: *id001
    marital_units:
      mu_head:
        members:
        - head
      mu_child1:
        members:
        - child1
  output:
    tax_units:
      tax_unit:
        # 1 child, earnings 20,000: 656 x (32,901 - 20,000) / 20,702.14
        # = 408.80.
        ca_eitc: 408.80
        # Child age 3, earnings below 28,351.35 -> full 1,229.16.
        ca_yctc: 1_229.16
        # Former foster youth head age 24 -> full 1,229.16.
        ca_foster_youth_tax_credit: 1_229.16
        # Refundable stack: 408.80 + 1,229.16 + 1,229.16 = 2,867.12.
        ca_refundable_credits: 2_867.12
        # HOH taxable = 20,000 - 11,800 = 8,200 -> tax 82.00; exemption
        # credits 649.00 cap it to 0.
        ca_income_tax_before_refundable_credits: 0.0
        # Refundable credits push CA income tax negative: 0 - 2,867.12.
        ca_income_tax: -2_867.12
- name: ca_credits_nonrefundable_capped_renter_family (ca)
  period: 2026
  absolute_error_margin: 0.1
  input:
    people:
      head:
        age: 30
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 18_000
        long_term_capital_gains_before_response: 0
        rent: 12_000
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
      spouse:
        age: 28
        is_tax_unit_head: false
        is_tax_unit_spouse: true
        is_tax_unit_dependent: false
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 12_000
        long_term_capital_gains_before_response: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
      child1:
        age: 4
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_disabled: false
        immigration_status_str: CITIZEN
        employment_income_before_lsr: 0
        long_term_capital_gains_before_response: 0
        rent: 0
        was_in_foster_care: false
        is_full_time_student: false
        ssi_countable_resources: 0
        co_care_worker_credit_eligible_care_worker: false
    households:
      household:
        members: &id002
        - head
        - spouse
        - child1
        state_code: CA
        zip_code: '90001'
        county_str: LOS_ANGELES_COUNTY_CA
    spm_units:
      spm_unit:
        members: *id002
        childcare_expenses: 3_000
    tax_units:
      tax_unit:
        members: *id002
        tax_unit_is_joint: true
    families:
      family:
        members: *id002
    marital_units:
      mu_couple:
        members:
        - head
        - spouse
      mu_child1:
        members:
        - child1
  output:
    tax_units:
      tax_unit:
        # 1 child, joint earnings 30,000: 656 x (32,901 - 30,000) / 20,702.14
        # = 91.93.
        ca_eitc: 91.93
        # Child age 4: 1,229.16 - (30,000 - 28,351.35) / 100 x 21.71 = 871.24.
        ca_yctc: 871.24
        # Joint AGI 30,000 under the 111,660 cap with rent -> 120.
        ca_renter_credit: 120.0
        # Federal CDCC is 0 (federal taxable income is 0 -> liability cap),
        # so the CA match is 0 despite $3,000 of childcare expenses.
        ca_cdcc: 0.0
        # Exemptions (2 x 158 + 491 = 807.00) + renter 120
        # = 927.00.
        ca_non_refundable_credits: 927.0
        # Joint taxable = 30,000 - 11,800 = 18,200 -> tax 182.00; the
        # 927.00 nonrefundable stack caps it at 0 (renter credit partially
        # wasted).
        ca_income_tax_before_refundable_credits: 0.0
        # Refundable stack still pays out: 91.93 + 871.24 = 963.17.
        ca_refundable_credits: 963.17
        ca_income_tax: -963.17
