- name: Household with increased medicare and NII tax 
  period: 2024
  reforms: policyengine_us.reforms.biden.budget_2025.medicare_and_investment_tax_increase.medicare_and_investment_tax_increase
  input:
    gov.contrib.biden.budget_2025.medicare.rate: 0.012
    gov.contrib.biden.budget_2025.net_investment_income.rate: 0.012
    # Household.
    people:
      head:
        age: 36
        is_tax_unit_head: True
        employment_income: 500_000
    tax_units:
      tax_unit:
        members: [head]
        adjusted_gross_income: 500_000
        net_investment_income: 1_000
        filing_status: SINGLE
  output:
    additional_medicare_tax: 2_700 + 1_200
    net_investment_income_tax: 50 

- name: Traditional retirement deferrals do not reduce increased Additional Medicare wages
  period: 2024
  reforms: policyengine_us.reforms.biden.budget_2025.medicare_and_investment_tax_increase.medicare_and_investment_tax_increase
  input:
    gov.contrib.biden.budget_2025.medicare.rate: 0.012
    people:
      head:
        employment_income: 450_000
        traditional_401k_contributions_desired: 50_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
  output:
    additional_medicare_tax: 2_850 # (450k - 200k) * 0.9% + (450k - 400k) * 1.2%

- name: The additional NIIT uses MAGI, including positive code H
  period: 2024
  reforms: policyengine_us.reforms.biden.budget_2025.medicare_and_investment_tax_increase.medicare_and_investment_tax_increase
  input:
    gov.contrib.biden.budget_2025.net_investment_income.rate: 0.012
    people:
      head:
        age: 50
        is_tax_unit_head: true
        employment_income: 395_000
        estate_income: 10_000
        estate_income_net_investment_income_adjustment: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # AGI 405,000; NII 15,000; MAGI 410,000.
    # Base: 3.8% of min(15,000, 410,000 - 200,000) = 570.
    # Additional: 1.2% of min(15,000, 410,000 - 400,000) = 120.
    net_investment_income_tax: 570 + 120
