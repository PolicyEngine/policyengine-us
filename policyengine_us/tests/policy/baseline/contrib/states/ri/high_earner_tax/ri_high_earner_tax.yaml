# Test RI H7317 Additional Tax on High-Income Filers
# For 2027+: 3% additional tax on income above $640,000 (inflation-adjusted).
# Retain the original fixture's synthetic 2027 forecast assumptions:
# baseline bracket thresholds of $84,450 / $192,000 and a proposed surtax
# threshold of $659,050. These inputs isolate reform activation and tax
# stacking; they are not published Rhode Island tax-year amounts.

- name: RI high earner tax - income below threshold (no surtax)
  period: 2027
  reforms: policyengine_us.reforms.states.ri.high_earner_tax.ri_high_earner_tax_reform.ri_high_earner_tax
  input:
    gov.contrib.states.ri.high_earner_tax.in_effect: true
    gov.contrib.states.ri.high_earner_tax.brackets[1].threshold: 659_050
    gov.states.ri.tax.income.rate[1].threshold: 84_450
    gov.states.ri.tax.income.rate[2].threshold: 192_000
    people:
      person1:
        age: 45
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ri_taxable_income: 500_000
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Income below the synthetic threshold - only baseline tax applies, surtax = 0.
    # Baseline: .0375*84,450 + .0475*(192,000-84,450) + .0599*(500,000-192,000) = 26,724.70
    ri_income_tax_before_non_refundable_credits: 26_724.70

- name: RI high earner tax - income above threshold
  period: 2027
  reforms: policyengine_us.reforms.states.ri.high_earner_tax.ri_high_earner_tax_reform.ri_high_earner_tax
  input:
    gov.contrib.states.ri.high_earner_tax.in_effect: true
    gov.contrib.states.ri.high_earner_tax.brackets[1].threshold: 659_050
    gov.states.ri.tax.income.rate[1].threshold: 84_450
    gov.states.ri.tax.income.rate[2].threshold: 192_000
    people:
      person1:
        age: 45
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ri_taxable_income: 750_000
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Baseline tax (41,699.70) + 3% surtax above the synthetic $659,050 threshold.
    # Baseline: .0375*84,450 + .0475*(192,000-84,450) + .0599*(750,000-192,000) = 41,699.70
    # Surtax: (750,000 - 659,050) * 0.03 = 90,950 * 0.03 = 2,728.5
    # Total: 41,699.70 + 2,728.5 = 44,428.20
    ri_income_tax_before_non_refundable_credits: 44_428.20

- name: RI high earner tax - income well above threshold
  period: 2027
  reforms: policyengine_us.reforms.states.ri.high_earner_tax.ri_high_earner_tax_reform.ri_high_earner_tax
  input:
    gov.contrib.states.ri.high_earner_tax.in_effect: true
    gov.contrib.states.ri.high_earner_tax.brackets[1].threshold: 659_050
    gov.states.ri.tax.income.rate[1].threshold: 84_450
    gov.states.ri.tax.income.rate[2].threshold: 192_000
    people:
      person1:
        age: 45
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ri_taxable_income: 1_000_000
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Baseline tax (56,674.70) + 3% surtax above the synthetic $659,050 threshold.
    # Baseline: .0375*84,450 + .0475*(192,000-84,450) + .0599*(1,000,000-192,000) = 56,674.70
    # Surtax: (1,000,000 - 659,050) * 0.03 = 340,950 * 0.03 = 10,228.5
    # Total: 56,674.70 + 10,228.5 = 66,903.20
    ri_income_tax_before_non_refundable_credits: 66_903.20

- name: RI high earner tax - reform not in effect
  period: 2027
  reforms: policyengine_us.reforms.states.ri.high_earner_tax.ri_high_earner_tax_reform.ri_high_earner_tax
  input:
    gov.contrib.states.ri.high_earner_tax.in_effect: false
    gov.contrib.states.ri.high_earner_tax.brackets[1].threshold: 659_050
    gov.states.ri.tax.income.rate[1].threshold: 84_450
    gov.states.ri.tax.income.rate[2].threshold: 192_000
    people:
      person1:
        age: 45
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
        ri_taxable_income: 750_000
    households:
      household:
        members: [person1]
        state_code: RI
  output:
    # Reform not in effect - only baseline tax applies (no surtax)
    # Baseline: .0375*84,450 + .0475*(192,000-84,450) + .0599*(750,000-192,000) = 41,699.70
    ri_income_tax_before_non_refundable_credits: 41_699.70
