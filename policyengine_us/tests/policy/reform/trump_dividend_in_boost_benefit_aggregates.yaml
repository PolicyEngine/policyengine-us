# The Trump dividend must survive stacking with BOOST, which replaces
# household_benefits and spm_unit_benefits with its own static lists. With
# administered_through_ssa false, both BOOST aggregates are the static list
# alone, so the asserted totals isolate the dividend. Two adult citizens at
# $500,000 of employment income so no other benefit fires.
#
# NOTE: This lives under tests/policy/reform (one subprocess per file) rather
# than contrib/congress/tlaib because the congress structural batch runs each
# proposal directory in a single process at its memory ceiling, and the extra
# reformed-system variants these stacked cases need stalled that job.

- name: Without the dividend, the BOOST benefit aggregates are empty for this household.
  period: 2027
  reforms: policyengine_us.reforms.congress.tlaib.boost.boost_middle_class_tax_credit.boost_middle_class_tax_credit
  input:
    gov.contrib.harris.lift.middle_class_tax_credit.in_effect: true
    gov.contrib.congress.tlaib.boost.middle_class_tax_credit.administered_through_ssa: false
    people:
      adult_one:
        age: 40
        employment_income: 500_000
      adult_two:
        age: 38
    spm_units:
      spm_unit:
        members: [adult_one, adult_two]
  output:
    trump_dividend: [0, 0]
    household_benefits: 0
    spm_unit_benefits: 0

- name: Stacked with BOOST, the dividend counts in both benefit aggregates.
  period: 2027
  reforms: policyengine_us.reforms.congress.tlaib.boost.boost_middle_class_tax_credit.boost_middle_class_tax_credit
  input:
    gov.contrib.harris.lift.middle_class_tax_credit.in_effect: true
    gov.contrib.congress.tlaib.boost.middle_class_tax_credit.administered_through_ssa: false
    gov.contrib.trump.dividend.in_effect: true
    people:
      adult_one:
        age: 40
        employment_income: 500_000
      adult_two:
        age: 38
    spm_units:
      spm_unit:
        members: [adult_one, adult_two]
  output:
    trump_dividend: [5_000, 5_000]
    household_benefits: 10_000
    spm_unit_benefits: 10_000
