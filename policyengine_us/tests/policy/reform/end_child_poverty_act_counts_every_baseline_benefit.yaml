- name: Under ECPA, health benefits count in household benefits when the switch is on.
  period: 2024
  reforms: policyengine_us.reforms.congress.tlaib.end_child_poverty_act.end_child_poverty_act
  input:
    gov.contrib.congress.tlaib.end_child_poverty_act.in_effect: true
    age: 40
    employment_income: 500_000
    gov.simulation.include_health_benefits_in_net_income: true
    chip: 2_000
    state_code: NY
  output:
    household_health_benefits: 2_000
    household_benefits: 2_000
