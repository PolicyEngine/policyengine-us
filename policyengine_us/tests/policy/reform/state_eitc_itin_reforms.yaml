- name: Streamlined EITC, Maryland, a second child with an ITIN lowers the basis as it lowers the SSN twin's federal credit
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.eitc.streamlined_eitc.streamlined_eitc
  input:
    gov.contrib.streamlined_eitc.in_effect: true
    people:
      parent:
        age: 35
        employment_income: 30_000
        ssn_card_type: CITIZEN
      child1:
        age: 3
        ssn_card_type: CITIZEN
      child2:
        age: 7
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: MD
  output:
    # Under this reform the two-child credit at $30,000 is below the
    # one-child credit. Maryland counts the ITIN child, so the basis is the
    # two-child amount the SSN twin gets federally, not the larger one-child
    # federal credit.
    eitc: 2_932.33
    md_eitc_child_count: 2
    md_federal_eitc_without_ssn_requirement: 2_594.51
    md_eitc: 1_167.53

# The childless pro formas evaluate the final federal eitc, so a reform of
# that formula reaches them: the individual EITC's AGI limit and the End
# Child Poverty Act, which neutralizes eitc. Each case runs an ITIN filer and
# an SSN filer; without the reform both get $649 in Maryland (age 35) and
# $324.50 in Maine (age 20).

- name: Individual EITC with a $10,000 AGI limit, Maryland, childless filers aged 35 get no credit
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.winship.winship_reform
  input:
    gov.contrib.individual_eitc.in_effect: true
    gov.contrib.individual_eitc.agi_eitc_limit: 10_000
    people:
      itin_filer:
        age: 35
        employment_income: 10_000
        ssn_card_type: NONE
        has_tin: true
      ssn_filer:
        age: 35
        employment_income: 10_000
        ssn_card_type: CITIZEN
    tax_units:
      itin_unit:
        members: [itin_filer]
      ssn_unit:
        members: [ssn_filer]
    households:
      itin_household:
        members: [itin_filer]
        state_code: MD
      ssn_household:
        members: [ssn_filer]
        state_code: MD
  output:
    eitc: [0, 0]
    federal_eitc_without_age_minimum: [0, 0]
    md_eitc: [0, 0]

