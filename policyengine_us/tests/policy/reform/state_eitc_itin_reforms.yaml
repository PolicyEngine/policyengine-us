- name: Streamlined EITC, Maryland, a second child with an ITIN lowers the basis as it lowers the SSN twin's federal credit
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.eitc.streamlined_eitc.streamlined_eitc
  input:
    gov.contrib.streamlined_eitc.in_effect: true
    people:
      parent:
        age: 35
        employment_income: 30_000
        ssn_card_type: CITIZEN
      child1:
        age: 3
        ssn_card_type: CITIZEN
      child2:
        age: 7
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: MD
  output:
    # Under this reform the two-child credit at $30,000 is below the
    # one-child credit. Maryland counts the ITIN child, so the basis is the
    # two-child amount the SSN twin gets federally, not the larger one-child
    # federal credit.
    eitc: 2_932.33
    md_eitc_child_count: 2
    md_federal_eitc_without_ssn_requirement: 2_594.51
    md_eitc: 1_167.53
