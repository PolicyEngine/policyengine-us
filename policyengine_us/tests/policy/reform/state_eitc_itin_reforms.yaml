# Maryland (Md. Code Tax-Gen. 10-704) and Maine (36 M.R.S. 5219-S(7)) base
# their credits on the federal EITC computed without the 26 U.S.C. 32(m)
# Social Security number limitation. A reform of the federal credit carries
# through: an ITIN family gets what its SSN twin gets under the same reform.

- name: Streamlined EITC, Maine, citizen parent with an ITIN child, matches the SSN twin
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.eitc.streamlined_eitc.streamlined_eitc
  input:
    gov.contrib.streamlined_eitc.in_effect: true
    people:
      parent:
        age: 35
        employment_income: 15_000
        ssn_card_type: CITIZEN
      child:
        age: 3
        ssn_card_type: NONE
        has_tin: true
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    me_eitc_child_count: 1
    # The reform's one-child maximum, $3,995, not the baseline $4,328.
    me_federal_eitc_without_ssn_requirement: 3_995
    me_eitc: 998.75

- name: Streamlined EITC, Maine, SSN twin
  period: 2025
  absolute_error_margin: 0.01
  reforms: policyengine_us.reforms.eitc.streamlined_eitc.streamlined_eitc
  input:
    gov.contrib.streamlined_eitc.in_effect: true
    people:
      parent:
        age: 35
        employment_income: 15_000
        ssn_card_type: CITIZEN
      child:
        age: 3
        ssn_card_type: CITIZEN
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: ME
  output:
    eitc: 3_995
    me_eitc: 998.75

