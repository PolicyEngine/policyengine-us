- id: oasdi-family-maximum-saving-clause
  jurisdiction: us
  program: social-security
  question: Does the 1972 family-payment saving clause protect a family total in every later month in
    which it falls, or only when a PIA increase itself lowers the total?
  texts:
  - corpus_citation_path: us/statute/42/403/a/5
    excerpt: for any such subsequent month
  pending_texts:
  - citation: POMS RS 00630.400
    url: https://secure.ssa.gov/poms.nsf/lnx/0300630400
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: 0154fed56e91a7c8a5b93d6315b57512bf2b00f4
      path: tests/data/track_b/gross_benefit_sources/poms_rs_00630_400.html
      sha256: e6242ec12c64aafba782e5c37a8cfea09f65820ef05b30b8a3bf2a50ecc03d61
    excerpt: Total family payment is less after the PIA increase than it was before
  - citation: POMS RS 00630.400
    url: https://secure.ssa.gov/poms.nsf/lnx/0300630400
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: 0154fed56e91a7c8a5b93d6315b57512bf2b00f4
      path: tests/data/track_b/gross_benefit_sources/poms_rs_00630_400.html
      sha256: e6242ec12c64aafba782e5c37a8cfea09f65820ef05b30b8a3bf2a50ecc03d61
    excerpt: at least one beneficiary is reduced for age
  reading: 'SSA''s operational reading: protection starts only when a PIA increase itself lowers the family
    total, with two or more entitled, a binding maximum and an age-reduced beneficiary; the literal reading
    stays available behind a switch.'
  alternatives:
  - reading: 'The Act''s literal "any such subsequent month": once a total is protected, any later month
      whose total falls below it is raised (the reference refuses those months and every later governed
      month).'
    effect: After a child ages out, every later month on the record is refused instead of computed.
  basis: SSA's chart conditions the clause on the PIA increase lowering the total; under that reading
    a COLA alone never triggers it for families that are not dually entitled, so almost every month computes.
  status: ruled
