- id: claim-of-right-deduction-floor
  jurisdiction: us-hi
  program: income-tax
  question: From 2022 through 2025, which claim of right repayments fall under Hawaii's 2% floor on miscellaneous
    itemized deductions? The statute keeps a section 1341 repayment over $3,000 outside the floor and one of $3,000
    or less inside it. The Form N-11 instructions list them the other way round.
  texts:
  - corpus_citation_path: us-hi/statute/235-2.4
    excerpt: Section 67 (with respect to the 2-percent floor on miscellaneous itemized deductions) of the Internal
      Revenue Code shall be operative for purposes of this chapter, except that the suspension in section 67(g)
      shall not be operative for purposes of this chapter.
  - corpus_citation_path: us/statute/26/67/b/9
    excerpt: the deduction under section 1341 (relating to computation of tax where taxpayer restores substantial
      amount held under claim of right),
  pending_texts:
  - citation: 2025 Form N-11 instructions, p. 19 (Worksheet A-6, Other Expenses and Expenses NOT Subject to the
      2% Limit)
    kind: instructions
    url: https://files.hawaii.gov/tax/forms/2025/n11ins.pdf#page=19
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-hi/n11-instructions-2025-p19.txt
      sha256: 9e806165b035da92b1a533b12ee8a1899deae007e404f62067b39fba04501296
    excerpt: Deduction for repayment of amounts under a claim of right over $3,000. See Repayments in the 2017 federal
      Publication 525
  - citation: 2025 Form N-11 instructions, p. 19 (Expenses NOT Subject to the 2% Limit)
    kind: instructions
    url: https://files.hawaii.gov/tax/forms/2025/n11ins.pdf#page=19
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-hi/n11-instructions-2025-p19.txt
      sha256: 9e806165b035da92b1a533b12ee8a1899deae007e404f62067b39fba04501296
    excerpt: Deduction for repayment of amounts under a claim of right of $3,000 or less.
  - citation: 2022 Form N-11 instructions, p. 19
    kind: instructions
    url: https://files.hawaii.gov/tax/forms/2022/n11ins.pdf#page=19
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-hi/n11-instructions-2022-p19.txt
      sha256: d49a31bc696484a3c756360b129c94f9b34a5463cc2821937c5cacace9ddc6e1
    excerpt: Deduction for repayment of amounts under a claim of right over $3,000. See Repayments in the 2017 federal
      Publication 525
  reading: Section 67(b)(9), operative through HRS 235-2.4(b), keeps a section 1341 deduction (a repayment over
    $3,000) outside the 2% floor; a repayment of $3,000 or less is a miscellaneous itemized deduction above 2% of
    Hawaii AGI.
  alternatives:
  - id: n11-instruction-lists
    reading: Follow the 2022-2025 N-11 lists, which put the over-$3,000 repayment among expenses subject to the
      2% floor and the $3,000-or-less repayment among expenses not subject to it.
    effect: A $10,000 repayment by a filer with $50,000 of Hawaii AGI deducts $9,000 instead of $10,000; a $3,000
      repayment deducts $3,000 instead of $2,000.
  basis: Section 1341 became operative in Hawaii for taxable years beginning after December 31, 2021 (Act 56, SLH
    2023), so section 67(b)(9)'s exception for the section 1341 deduction applies through HRS 235-2.4(b). The N-11
    lists match the federal Schedule A categories transposed, and no Hawaii statute or rule adopts them.
