    excerpt: Beginning in 1/78, if a reduced spouse is terminated and then reentitled, (months in which
      the spouse's benefits were terminated will be eliminated from the reduction factor when the spouse
      is reentitled.
  reading: Refuse a reduced spouse reentitled before FRA (named refusal), and count the refusal.
  alternatives:
