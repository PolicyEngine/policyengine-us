- id: oap-interest-and-dividends
  jurisdiction: us-co
  program: old-age-pension
  question: For Colorado's Old Age Pension, are interest and dividends countable unearned income under 3.520.785(B)(10),
    or exempt under 3.520.786(K), which exempts the unearned income SSA excludes, including interest and dividends
    on countable resources?
  texts:
  - corpus_citation_path: us-co/regulation/9-ccr-2503-5/3.520.785
    excerpt: 10. Dividends and interest received on financial accounts, savings bonds, leases, etc.
  - corpus_citation_path: us-co/regulation/9-ccr-2503-5/3.520.786
    excerpt: K. Unearned income as defined in the Social Security Program Operations Manual System (POMS), Section
      SI 00830.099 Guide to Unearned Income Exclusions
  - corpus_citation_path: us-co/regulation/9-ccr-2503-5/3.520.781
    excerpt: C. Certain income shall be exempt and shall not be considered as countable income, in part or in whole,
      as outlined in Section 3.520.786.
  reading: Exempt interest and dividends on countable resources, because 3.520.781(C) makes the 3.520.786 exemptions
    govern countable income and 3.520.786(K) incorporates SSA's exclusions (20 CFR 416.1124).
  alternatives:
  - id: countable-unearned-income
    reading: Count interest and dividends as unearned income under 3.520.785(B)(10).
    effect: A client's interest and dividends reduce the pension, after the unearned income disregard.
  basis: The two sections of the same rule disagree; 3.520.781(C) says exempt income is not countable, so the exemption
    in 3.520.786(K) controls the listing in 3.520.785(B)(10).
  status: open
  outcome: computed
  years:
    from: 2026
    type: calendar
  implementations:
  - repo: PolicyEngine/policyengine-us
    commit: 9697377898aa6324967ddbdc4691c88ca34137de
    path: policyengine_us/parameters/gov/states/co/ssa/oap/income/sources/unearned.yaml
    follows: reading
    adopts: reading
    basis: Follows 3.520.781(C), under which the 3.520.786 exemptions decide what is countable.
    cites_entry: false
  tests:
  - repo: PolicyEngine/policyengine-us
    commit: 9697377898aa6324967ddbdc4691c88ca34137de
    path: policyengine_us/tests/policy/baseline/gov/states/co/ssa/oap/co_oap_own_countable_income.yaml
    name: Case 12, interest and dividends on countable resources are exempt.
