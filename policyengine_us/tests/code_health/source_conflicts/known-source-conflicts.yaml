- id: oasdi-arf-spouse-reentitlement-credits
  jurisdiction: us
  program: social-security
  question: When a reduced spouse is terminated and reentitled before FRA, are the terminated months removed
    from the reduction at FRA or at reentitlement?
  texts: []
  pending_texts:
  - citation: POMS RS 00615.201A.1
    url: https://secure.ssa.gov/poms.nsf/lnx/0300615201
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: 0154fed56e91a7c8a5b93d6315b57512bf2b00f4
      path: tests/data/track_b/gross_benefit_sources/poms_rs_00615_201.html
      sha256: d2a38cb3b36bc3f1637106805a6c39037b7e421f2b434364dbcf207eeaa5bc92
    excerpt: After 12/72 a spouse reentitled prior to FRA as a spouse on the same earnings is reduced
      the same number of months as the earlier entitlement. An ARF at FRA will remove all months of nonentitlement.
  - citation: POMS RS 00615.491A
