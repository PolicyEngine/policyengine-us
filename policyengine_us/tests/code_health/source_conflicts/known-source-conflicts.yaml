- id: claim-of-right-deduction-floor
  jurisdiction: us-ar
  program: income-tax
  question: Does Arkansas's deduction for restoring more than $3,000 held under a claim of right (Ark. Code 26-51-457)
    count toward the 2% floor on miscellaneous itemized deductions, whose list of exceptions does not name it, or
    sit outside the floor as the Department of Finance and Administration treats the volunteer firefighter deduction
    enacted in the same session?
  texts: []
  pending_texts:
  - citation: Act 1284 of 2013, section 1 (Ark. Code 26-51-457(a))
    kind: statute
    url: https://www.arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F2013R%2FPublic%2F&file=1284.pdf&ddBienniumSession=2013%2F2013R
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-ar/act-1284-2013.txt
      sha256: 204ebea7f4b244c1c24975da0c00747fd6e7d7f7f56171f85a3ea9c064a702d4
    excerpt: Title 26 U.S.C. § 1341(a)(1)-(3) and (b)(2), as they existed on January 1, 2013, regarding the computation
      of income tax when a taxpayer restores a substantial amount held under a claim of right, is adopted for purposes
      of computing income tax liability under this chapter.
  - citation: Act 382 of 1987, section 28(a) (now Ark. Code 26-51-437)
    kind: statute
    url: https://www.arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F1987R%2FPublic%2F&file=382.pdf&ddBienniumSession=1987%2F1987R#page=9
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-ar/act-382-1987-p9.txt
      sha256: 87cf3f82736130bbfe305d7664f690b5ac90a412888a9d6c3b7bec64cdcfe12e
    excerpt: the miscellaneous itemized deductions for any taxable year shall be allowed only to the extent that
      the aggregate of such deductions exceeds two percent (2%) of adjusted gross income.
  - citation: 2014 Form AR3, lines 26 and 28
    kind: form
    url: https://www.dfa.arkansas.gov/wp-content/uploads/AR3_2014_RE.pdf#page=1
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-ar/ar3-2014.txt
      sha256: 411d4b1a366f9e6b0f35a119482af4fd161833f5a5defdd961e5a4d208e2fc41
    excerpt: 'TOTAL MISCELLANEOUS DEDUCTIONS NOT SUBJECT TO THE 2% AGI LIMITATION: (Add lines 26 and 27)'
  reading: Count the claim of right deduction among miscellaneous itemized deductions, so only the part above 2%
    of Arkansas AGI is deducted.
  alternatives:
  - id: dfa-firefighter-analog
    reading: Deduct it in full outside the floor, as the department's forms treat the volunteer firefighter deduction
      (AR3 line 26, totaled with lines not subject to the 2% limitation), which the same 2013 session enacted without
      an express exception either.
    effect: A filer with $60,000 of wages who repays $10,000 deducts $10,000 instead of $8,800.
  - id: character-of-repayment
    reading: Place the deduction by the character of the repayment, outside the floor when deductible as a loss
      (the 26-51-437(b) exception for losses) and inside it when deductible as an employee expense.
    effect: Needs an input the model does not have; for a repayment deductible as a loss it equals the dfa-firefighter-analog
      reading.
  basis: The statute's list of exceptions to the floor does not include the claim of right deduction, and where
    the legislature meant to exempt a deduction it said so (Act 708 of 1991). No department form, instruction or
    rule names the claim of right deduction; the firefighter treatment is practice for a different deduction.
  status: open
  outcome: computed
  years:
    from: 2013
    type: tax
