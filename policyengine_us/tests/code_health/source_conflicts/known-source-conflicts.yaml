      path: policyengine_us/tests/code_health/source_conflicts/sources/us-oh/rc-5747.01.html
      sha256: 9981a8f73a9c4a1301620fe6cd3df4ecee4de11bacf120caf545a6814ffef276
    excerpt: 'Deduct any portion of the deduction described in section 1341(a)(2) of the Internal Revenue Code,
      for repaying previously reported income received under a claim of right, that meets both of the following
      requirements:'
  - citation: R.C. 5747.01(A)(12)(a)
    kind: statute
    url: https://codes.ohio.gov/ohio-revised-code/section-5747.01
    snapshot:
      repo: PolicyEngine/policyengine-us
      commit: 73da6d2fac6da9a3632204dd15577f7db158fe99
      path: policyengine_us/tests/code_health/source_conflicts/sources/us-oh/rc-5747.01.html
      sha256: 9981a8f73a9c4a1301620fe6cd3df4ecee4de11bacf120caf545a6814ffef276
    excerpt: It is allowable for repayment of an item that was included in the taxpayer's adjusted gross income
      for a prior taxable year
  - citation: 2025 Ohio IT 1040 instructions, Schedule of Adjustments line 29, p. 23
    kind: instructions
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf#page=23
    snapshot:
