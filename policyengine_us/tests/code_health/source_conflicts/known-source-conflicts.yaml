      repo: PolicyEngine/microcosm-dynamics
      commit: d76379f2363c893afc04c91c93d266a46f824545
      path: tests/data/track_b/arf_recompute_sources/poms_rs_00615_003.html
      sha256: 935b391658a9f94117fde850fa4eb88293eb9ac5f19e05a5b9f946c4e15e6c2d
    excerpt: People Born from 1/2/1911 Through 1/1/40
  - citation: 20 CFR 404.409(b)
    kind: regulation
    url: https://www.ecfr.gov/api/versioner/v1/full/2026-10-07/title-20.xml?part=404&section=404.409
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: d76379f2363c893afc04c91c93d266a46f824545
      path: tests/data/track_b/arf_recompute_sources/ecfr_20cfr_404_409.xml
      sha256: f5545ff658026f9926715cbc75d032ab1d502833d828c552e303bef494e9dce9
    excerpt: Before 1/2/1912 62 years.
  - citation: 20 CFR 404.409(b)
    kind: regulation
    url: https://www.ecfr.gov/api/versioner/v1/full/2026-10-07/title-20.xml?part=404&section=404.409
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: d76379f2363c893afc04c91c93d266a46f824545
      path: tests/data/track_b/arf_recompute_sources/ecfr_20cfr_404_409.xml
      sha256: f5545ff658026f9926715cbc75d032ab1d502833d828c552e303bef494e9dce9
    excerpt: 1/2/1912—1/1/1940 65 years.
  reading: Refuse widow(er) claims for births from 1911-01-02 to 1912-01-01, including the full-retirement-age
    helper; the refusals are counted.
  alternatives:
