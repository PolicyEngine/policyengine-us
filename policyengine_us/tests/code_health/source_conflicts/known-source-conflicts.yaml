    be allowable, as the statute says, or must the federal return also have claimed the section 1341 credit or a
    Schedule A deduction for the repayment, as the IT 1040 instructions require?
  texts: []
  pending_texts:
  - citation: R.C. 5747.01(A)(12)
    kind: statute
    url: https://codes.ohio.gov/ohio-revised-code/section-5747.01
    snapshot:
