- id: oasdi-arf-widow-child-in-care-credits
  jurisdiction: us
  program: social-security
  question: When a reduced widow(er)'s benefit is adjusted at FRA, are months with an entitled child in
    care credited even if the benefit was never raised to the mother's or father's rate?
  texts:
  - corpus_citation_path: us/statute/42/402/q/7
    excerpt: any month in which the reduction in the amount of such benefit was determined under paragraph
      (5)(D)
  pending_texts:
  - citation: 20 CFR 404.412(a)(4)
    url: https://www.ecfr.gov/api/versioner/v1/full/2026-10-07/title-20.xml?part=404&section=404.412
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: d76379f2363c893afc04c91c93d266a46f824545
      path: tests/data/track_b/arf_recompute_sources/ecfr_20cfr_404_412.xml
      sha256: e560ab4ca39a5281573578ad89fcc64ef59edb6c3876bc2c75dd828bdac1aa89
    excerpt: any month in which she or he had in her or his care a child of the deceased insured individual
      and for which the child was entitled to child's benefits;
  - citation: POMS RS 00615.482
    url: https://secure.ssa.gov/poms.nsf/lnx/0300615482
    snapshot:
      repo: PolicyEngine/microcosm-dynamics
      commit: d76379f2363c893afc04c91c93d266a46f824545
      path: tests/data/track_b/arf_recompute_sources/poms_rs_00615_482.html
      sha256: 8b579019f4e8d0111175b9756ddaa688317026c7db68faefbdf7b322571cdad0
    excerpt: widow(er)’s benefits were increased to the mother or father's rate.
  reading: Credit only certified months in which the benefit was raised to the mother's or father's rate;
    refuse a history with child-in-care months that were not, and count the refusal.
  alternatives:
  - reading: '20 CFR 404.412(a)(4): credit every month with an entitled child in care.'
    effect: $898.20 a month in the invented case.
  - reading: 'POMS RS 00615.482 and Act 202(q)(7)(D): credit only months raised to the mother''s or father''s
      rate.'
    effect: $877.80 a month in the invented case.
  basis: The Act ties the credit to months whose reduction was determined under 202(q)(5)(D), as POMS
    does; the regulation's care category is broader.
  status: ruled
  ruling:
    by: Axiom Foundation
    date: '2026-10-12'
    record: https://github.com/TheAxiomFoundation/rulespec-us/pull/1710#issuecomment-6126429754
  outcome: refused
  implementations:
  - repo: PolicyEngine/microcosm-dynamics
    commit: d76379f2363c893afc04c91c93d266a46f824545
    path: src/populace_dynamics/track_b/arf.py
    follows: reading
    cites_entry: false
  tests:
  - repo: PolicyEngine/microcosm-dynamics
    commit: d76379f2363c893afc04c91c93d266a46f824545
    path: tests/test_track_b_arf.py
    name: test_widow_nonbinding_child_care_readings_are_explicit
    pins:
    - reading
    - alternatives[0]
    - alternatives[1]
  money_case:
    description: 'Widow at 64, FRA 67, $1,000 PIA, six child-in-care months never raised to the mother''s
      rate: $898.20 crediting them, $877.80 not.'
