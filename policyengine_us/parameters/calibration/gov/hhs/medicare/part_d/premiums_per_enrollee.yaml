description: The Medicare Trustees report and project these Part D premiums from enrollees per Part D enrollee, excluding the income-related monthly adjustment amount.
metadata:
  unit: currency-USD
  period: year
  label: Medicare Part D premiums per Part D enrollee
  reference:
  # Each value is (premium income - aggregate income-related premiums) /
  # Part D enrollment, from the 2026 Medicare Trustees Report (transmitted
  # 2026-06-09, retrieved 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8):
  # - Premium income, Table III.D3 (file page 116), in billions. Footnote 1:
  #   "Premiums include both amounts withheld from Social Security benefits or
  #   other Federal payments, direct payments to the Federal government, and
  #   those paid directly to Part D plans." The table is on a cash basis, and
  #   footnote 6 (file page 117) credits one January's withheld premiums on
  #   December 31 of the year before: about $0.2 billion in 2015, $0.1 billion
  #   in 2020 and an estimated $0.2 billion in 2026. Those amounts are moved
  #   back to 2016, 2021 and 2027.
  # - Income-related premiums, Table V.E4 (file page 218), "Aggregate
  #   premiums", the amount paid "in excess of the Part D plan premium". They
  #   are part of premium income: they are withheld from benefits (42 U.S.C.
  #   1395w-113(c)(4)) and deposited into the Part D account (footnote 73,
  #   file page 151). medicare_cost subtracts each person's own adjustment
  #   amount instead.
  # - Part D enrollment, Table V.B3 (file page 196), in thousands. It equals
  #   the total of Table IV.B7 (file page 153), which includes retiree drug
  #   subsidy beneficiaries.
  # Low-income subsidy enrollees pay reduced premiums or none (file page 219);
  # Medicare's low-income subsidy payments are expenditures of the Part D
  # account, not enrollee premiums (file page 114). So the average is below
  # the base beneficiary premium.
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table III.D3
    href: https://www.cms.gov/oact/tr/2026#page=116
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.E4
    href: https://www.cms.gov/oact/tr/2026#page=218
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.B3
    href: https://www.cms.gov/oact/tr/2026#page=196
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Part D revenue and expenditures
    href: https://www.cms.gov/oact/tr/2026#page=109
  - title: 42 U.S.C. § 1395w-113(c)(4) - Collection of monthly adjustment amount
    href: https://www.law.cornell.edu/uscode/text/42/1395w-113#c_4
