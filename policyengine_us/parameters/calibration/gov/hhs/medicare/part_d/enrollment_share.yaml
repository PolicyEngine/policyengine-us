description: The Medicare Trustees report and project this share of Medicare enrollees, people with Part A or Part B coverage, who are enrolled in Part D.
metadata:
  unit: /1
  period: year
  label: Medicare Part D enrollment share
  reference:
  # Table V.B3, "Medicare Enrollment": Part D enrollment over total
  # enrollment, which footnote 2 defines as the "Number of beneficiaries with
  # HI and/or SMI coverage". Part D enrollment includes retiree drug subsidy
  # beneficiaries (it equals the total of Table IV.B7, file page 153).
  # Annual through 2035, then every fifth year through 2100; each value holds
  # until the next. 2026 Medicare Trustees Report, transmitted 2026-06-09,
  # retrieved 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8.
