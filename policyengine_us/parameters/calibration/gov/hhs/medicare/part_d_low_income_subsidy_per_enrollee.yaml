  2026-01-01: 255.86
  2027-01-01: 283.45
  2028-01-01: 298.54
  2029-01-01: 324.78
  2030-01-01: 377.29
  2031-01-01: 396.02
  2032-01-01: 404.71
  2033-01-01: 409.83
  2034-01-01: 417.15
  2035-01-01: 431.59
