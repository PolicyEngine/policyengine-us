description: The Medicare Trustees report and project this Part D premium income per Medicare enrollee, which counts premiums withheld from benefits, paid to the federal government or paid directly to plans, including income-related premiums.
metadata:
  unit: currency-USD
  period: year
  label: Medicare Part D premium income per enrollee
  # From 2036, each value is the 2035 value times the growth in Medicare
  # spending per enrollee, so premiums keep their 2035 share of spending.
  uprating: calibration.gov.hhs.medicare.per_capita_cost
  reference:
  # Each value is Table III.D3's "Premium income" (file page 116, $
  # billions, cash basis) over Table V.B3's total enrollment (file page 196,
  # thousands), people with Part A and/or Part B coverage. Footnote 1:
  # "Premiums include both amounts withheld from Social Security benefits or
  # other Federal payments, direct payments to the Federal government, and
  # those paid directly to Part D plans." Footnote 6 (file page 117) credits
  # one January's withheld premiums on December 31 of the year before: about
  # $0.2 billion in 2015, $0.1 billion in 2020 and an estimated $0.2 billion
  # in 2026, which are moved to 2016, 2021 and 2027. Premium income includes
  # income-related premiums, which are deposited into the Part D account
  # (footnote 73, file page 151). So each value equals the Part D enrollment
  # share times calibration.gov.hhs.medicare.part_d.premiums_per_enrollee,
  # plus Table V.E4's aggregate income-related premiums (file page 218) per
  # Medicare enrollee. 2026 Medicare Trustees Report, transmitted
  # 2026-06-09, retrieved 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8.
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table III.D3
    href: https://www.cms.gov/oact/tr/2026#page=116
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.B3
    href: https://www.cms.gov/oact/tr/2026#page=196
