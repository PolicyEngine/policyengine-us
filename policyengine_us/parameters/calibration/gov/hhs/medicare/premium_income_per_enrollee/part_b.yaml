description: The Medicare Trustees report and project this Part B premium income per Medicare enrollee, which counts premiums paid by or on behalf of enrollees, including income-related premiums and premiums that state Medicaid programs pay.
metadata:
  unit: currency-USD
  period: year
  label: Medicare Part B premium income per enrollee
  # From 2036, each value is the 2035 value times the growth in Medicare
  # spending per enrollee, so premiums keep their 2035 share of spending.
  uprating: calibration.gov.hhs.medicare.per_capita_cost
  reference:
  # Each value is premium income over Table V.B3's total enrollment (file
  # page 196, thousands), people with Part A and/or Part B coverage.
  # - 2015 to 2026: Table III.C7 (file page 102), "Premium income", $
  #   millions, incurred basis.
  # - 2027 to 2035: Table III.C4 (file page 96), "Premium income", $
  #   billions, cash basis. Footnote 7 credits premiums withheld from the
  #   benefits due January 3, 2027 on December 31, 2026; their amount is
  #   III.C4's 2026 cash value less III.C7's 2026 incurred value (174.8 -
  #   173.228 = 1.572), which is added back to 2027. Cash and incurred
  #   premium income agree in every year from 2017 to 2025 except 2020 and
  #   2021, the other footnote 7 years.
  # Premium income is "premium payments by (or on behalf of) enrollees"
  # (file page 88). It includes income-related premiums: in 2019 the
  # standard premium, $135.50 a month (Table III.C2, file page 89), times
  # 56.019 million Part B enrollees plus Table V.E3's $8.4 billion of
  # income-related premiums (file page 215) is $99.5 billion, against $99.4
  # billion of premium income.
  # 2026 Medicare Trustees Report, transmitted 2026-06-09, retrieved
  # 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8.
