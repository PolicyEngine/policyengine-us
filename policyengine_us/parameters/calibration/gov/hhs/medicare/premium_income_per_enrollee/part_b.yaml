    href: https://www.cms.gov/oact/tr/2026#page=102
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table III.C4
    href: https://www.cms.gov/oact/tr/2026#page=96
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.B3
    href: https://www.cms.gov/oact/tr/2026#page=196
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Part B premium income
    href: https://www.cms.gov/oact/tr/2026#page=88
