description: The Medicare Trustees report and project this Part A premium income per Medicare enrollee, which counts premiums paid by or on behalf of people without premium-free Part A who enroll voluntarily.
metadata:
  unit: currency-USD
  period: year
  label: Medicare Part A premium income per enrollee
  # From 2036, each value is the 2035 value times the growth in Medicare
  # spending per enrollee, so premiums keep their 2035 share of spending.
  uprating: calibration.gov.hhs.medicare.per_capita_cost
  reference:
  # Each value is Table III.B4's "Premiums from voluntary enrollees" (file
  # page 64, $ billions, cash basis) over Table V.B3's total enrollment
  # (file page 196, thousands), which footnote 2 defines as the "Number of
  # beneficiaries with HI and/or SMI coverage". The Part A premium is paid
  # "by or on behalf of" these enrollees (glossary, file page 257), so state
  # Medicaid buy-in payments are included. 2026 Medicare Trustees Report,
  # transmitted 2026-06-09, retrieved 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8.
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table III.B4
    href: https://www.cms.gov/oact/tr/2026#page=64
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.B3
    href: https://www.cms.gov/oact/tr/2026#page=196
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, glossary, Part A premium
    href: https://www.cms.gov/oact/tr/2026#page=257
