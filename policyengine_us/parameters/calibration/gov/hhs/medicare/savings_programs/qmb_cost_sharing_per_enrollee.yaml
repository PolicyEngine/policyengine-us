description: Medicaid spending on Medicare deductibles and coinsurance for Qualified Medicare Beneficiaries, per Qualified Medicare Beneficiary enrollee per year.
# Each value is a federal fiscal year (October through September): national
# CMS-64 net expenditures on line 17D, "Coinsurance" (total computable), over
# Qualified Medicare Beneficiary person-years (QMB only plus QMB plus) from CMS
# Program Statistics. Fiscal year Y takes 0.25 times calendar year Y-1 and
# 0.75 times calendar year Y person-years. The latest value holds afterwards.
values:
  2014-10-01: 145.14 # FY 2015: $964,276,592 / 6,643,568.5
  2015-10-01: 160.07 # FY 2016: $1,088,990,259 / 6,803,362.5
  2016-10-01: 149.87 # FY 2017: $1,044,519,254 / 6,969,459.1
  2017-10-01: 143.55 # FY 2018: $1,023,074,055 / 7,126,922.3
  2018-10-01: 142.54 # FY 2019: $1,036,646,026 / 7,272,591.8
  2019-10-01: 138.65 # FY 2020: $1,040,603,350 / 7,505,377.9
  2020-10-01: 133.70 # FY 2021: $1,046,566,216 / 7,827,817.8
  2021-10-01: 128.05 # FY 2022: $1,037,693,614 / 8,103,524.3
  2022-10-01: 132.92 # FY 2023: $1,118,400,599 / 8,413,952.4
  2023-10-01: 137.70 # FY 2024: $1,153,227,651 / 8,374,811.6

metadata:
  unit: currency-USD
  period: year
  label: Medicaid spending on QMB Medicare cost sharing per enrollee
