description: The Centers for Medicare and Medicaid Services (CMS) reports and projects this Medicare spending per enrollee, which is all Medicare spending, including payments to Medicare Advantage plans, Part D and program administration, divided by average enrollment in Part A, Part B or both.
metadata:
  unit: currency-USD
  period: year
  label: CMS Medicare spending per enrollee
  reference:
  # Table17 Health Insurance Enrollment and Enrollment Growth Rates,
  # "Spending per Enrollee ($)", "Medicare" row: Medicare spending (the same
  # row as Table03's Medicare source of funds) divided by Medicare
  # enrollment. Historical for 2013-2024, projected for 2025-2034. ZIP
  # Last-Modified 2026-09-03, sha256
  # 264f822618a5e1829138aea57cc6c8bf45bbaf072a72898fef5547f7ece6cd70,
  # retrieved 2026-10-11 from
  # https://www.cms.gov/data-research/statistics-trends-and-reports/national-health-expenditure-data/projected
  - title: CMS National Health Expenditure Projections 2025-2034, Table 17
    href: https://www.cms.gov/files/zip/nhe-projections-tables.zip
  # Medicare enrollment is Part A and/or B enrollment by "a person-year
  # methodology, which sums the number of months each beneficiary is enrolled
  # during the year and divides by 12", with U.S. territories removed.
  - title: "CMS National Health Expenditure Accounts: Methodology Paper, 2024, Medicare enrollment"
    href: https://www.cms.gov/files/document/definitions-sources-and-methods.pdf#page=34
  # Medicare spending covers Parts A, B, C (Medicare Advantage) and D (file
  # page 15) and, as program spending, federal administration and the
  # non-medical expenditures of Part C and Part D private plans (file page
  # 23). Premiums finance part of that spending rather than reduce it: the
  # sponsor analysis counts SMI premiums as household spending on Medicare
  # (file page 30).
  - title: "CMS National Health Expenditure Accounts: Methodology Paper, 2024, Medicare spending"
    href: https://www.cms.gov/files/document/definitions-sources-and-methods.pdf#page=23
  # "Projections of Medicare spending and enrollment used in the NHE
  # projections were generated for the most recent Trustees Report", here
  # the 2026 report. Last Updated June 24, 2026, sha256
  # ce62fe2c236cc96ce287027784b141584ddf39e62c5fd8ddc3e771a014944817.
  - title: "Projections of National Health Expenditures and Enrollment: Methodology and Model Specification"
    href: https://www.cms.gov/research-statistics-data-and-systems/statistics-trends-and-reports/nationalhealthexpenddata/downloads/projectionsmethodology.pdf#page=7
values:
  # Historical.
  2013-01-01: 11_483
