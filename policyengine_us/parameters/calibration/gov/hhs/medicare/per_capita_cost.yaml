  2020-01-01: 13_547
  2021-01-01: 14_293
  2022-01-01: 14_921
  2023-01-01: 15_915
  2024-01-01: 16_779
  # Projections.
  2025-01-01: 17_751
  2026-01-01: 18_983
  2027-01-01: 20_096
  2028-01-01: 21_310
  2029-01-01: 22_543
  2030-01-01: 23_789
  2031-01-01: 25_185
  2032-01-01: 26_552
  2033-01-01: 28_277
  2034-01-01: 30_129
  # 2035 to 2100 grow at the 2031-2032 rate (26_552 / 25_185, 5.4% a year),
  # not the 2033-2034 rate, which carries the end of Medicare sequestration
  # on August 31, 2033; later years hold the 2100 value. See
  # set_all_uprating_parameters in uprating_extensions.py.
