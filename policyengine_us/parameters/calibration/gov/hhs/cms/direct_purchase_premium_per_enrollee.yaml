description: The Centers for Medicare and Medicaid Services (CMS) reports and projects this direct purchase insurance spending per enrollee, which is the premium per covered person for private plans bought outside an employer, before any premium tax credit.
metadata:
  unit: currency-USD
  label: CMS direct purchase insurance premium per enrollee
  reference:
  # Table17 Health Insurance Enrollment and Enrollment Growth Rates,
  # "Spending per Enrollee ($)", "Direct Purchase" row: direct purchase
  # spending divided by direct purchase enrollment. Its footnote 2: direct
  # purchase "includes those with Medicare supplemental coverage and
  # individually-purchased plans, including coverage purchased through the
  # Marketplaces." ZIP Last-Modified 2026-09-03, sha256
  # 264f822618a5e1829138aea57cc6c8bf45bbaf072a72898fef5547f7ece6cd70,
  # retrieved 2026-10-11 from
  # https://www.cms.gov/data-research/statistics-trends-and-reports/national-health-expenditure-data/projected
  - title: CMS National Health Expenditure Projections 2025-2034, Table 17
    href: https://www.cms.gov/files/zip/nhe-projections-tables.zip
  # Direct purchase "includes premiums paid by individuals for policies that
  # are not available through an employer or a union-based plan. This
  # includes Medigap policies, Marketplace plans, and other directly purchased
  # health insurance."
  - title: "CMS National Health Expenditure Accounts: Methodology Paper, 2024"
    href: https://www.cms.gov/files/document/definitions-sources-and-methods.pdf#page=29
