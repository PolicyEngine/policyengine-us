description: The Centers for Medicare and Medicaid Services (CMS) sets, and the Medicare Trustees project, this Medicare Part D base beneficiary premium per enrollee.
metadata:
  unit: currency-USD
  period: month
  label: Medicare Part D base beneficiary premium per enrollee
  reference:
  # Table V.E2, "SMI Cost-Sharing and Premium Amounts", "Part D, Base
  # beneficiary premium" column (file page 213): historical amounts through
  # 2026 and intermediate estimates for 2027-2035. The 2030 jump is the
  # Inflation Reduction Act's reset of the base beneficiary premium percent
  # to 20 percent (file page 154). Report transmitted 2026-06-09, retrieved
  # 2026-10-11, sha256
  # ffa56b9137006872300b0346149eae1613d09a172b6ba118aad48e66dfc48fa8.
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Table V.E2
    href: https://www.cms.gov/oact/tr/2026#page=213
  - title: 2026 Annual Report of the Boards of Trustees of the Federal Hospital Insurance and Federal Supplementary Medical Insurance Trust Funds, Part D premiums
    href: https://www.cms.gov/oact/tr/2026#page=154
