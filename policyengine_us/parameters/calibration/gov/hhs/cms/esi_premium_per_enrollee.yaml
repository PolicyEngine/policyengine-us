description: The Centers for Medicare and Medicaid Services (CMS) reports and projects this employer-sponsored insurance spending per enrollee, which is the premium per covered person, employer and employee shares together.
metadata:
  unit: currency-USD
  label: CMS employer-sponsored insurance premium per enrollee
  reference:
  # Data underlying figures:
  # https://www.cms.gov/files/zip/nhe-projections-tables.zip
  # Last-Modified 2026-09-03; sha256
  # 264f822618a5e1829138aea57cc6c8bf45bbaf072a72898fef5547f7ece6cd70.
  # Table17 Health Insurance Enrollment and Enrollment Growth Rates,
  # "Spending per Enrollee ($)", "Employer-sponsored Insurance" row: ESI
  # spending divided by ESI enrollment. Retrieved 2026-10-11.
  - title: CMS National Health Expenditure Projections 2025-2034, Table 17
    href: https://www.cms.gov/data-research/statistics-trends-and-reports/national-health-expenditure-data/projected
  # Page 28: ESI "includes premiums paid by employers and/or employees for
  # health insurance plans offered by the employer", for active employees,
  # COBRA enrollees and retirees.
  - title: "CMS National Health Expenditure Accounts: Methodology Paper, 2024, p. 28"
    href: https://www.cms.gov/files/document/definitions-sources-and-methods.pdf
