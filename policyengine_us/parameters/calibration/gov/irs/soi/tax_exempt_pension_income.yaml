description: Total tax-exempt pension income.
values:
  # IRS SOI Publication 1304 Table 1.4, all returns: pensions and annuities,
  # total less taxable. Amounts are published in thousands of dollars. Each
  # value is for the tax year of its date.
  2015-01-01: 479_075_149_000
  2016-01-01: 414_400_590_000
  2017-01-01: 442_604_495_000
  # The 2018 Form 1040 combined IRA distributions with pensions and annuities,
  # so SOI has no separate figure for 2018 (Table 1.4, tax year 2019, note 3).
  # Geometric mean of 2017 and 2019.
  2018-01-01: 473_418_497_000
  2019-01-01: 506_377_761_000
  2020-01-01: 580_350_454_000
  2021-01-01: 648_909_722_000
  2022-01-01: 616_711_706_000
  2023-01-01: 662_770_341_000
