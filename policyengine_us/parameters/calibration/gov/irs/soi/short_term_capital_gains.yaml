description: Total short-term capital gains, summed over returns with a net short-term capital gain on Form 1040 Schedule D line 7.
values:
  # IRS SOI Publication 1304 Table 1.4A, all returns: net short-term capital
  # gain, which like the long-term series counts returns with a gain and leaves
  # out net losses. Amounts are published in thousands of dollars. Each value
  # is for the tax year of its date.
  2015-01-01: 38_164_189_000
  2016-01-01: 38_950_727_000
  2017-01-01: 56_760_447_000
  2018-01-01: 50_073_309_000
  2019-01-01: 58_699_967_000
  2020-01-01: 150_302_155_000
  2021-01-01: 208_522_006_000
  2022-01-01: 77_731_595_000
  2023-01-01: 70_482_448_000
