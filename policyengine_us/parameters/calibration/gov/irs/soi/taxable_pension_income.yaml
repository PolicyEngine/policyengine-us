description: Total taxable pension income.
values:
  # IRS SOI Publication 1304 Table 1.4, all returns: pensions and annuities,
  # taxable. Amounts are published in thousands of dollars. Each value is for
  # the tax year of its date.
  2015-01-01: 689_991_999_000
  2016-01-01: 693_626_543_000
  2017-01-01: 729_187_412_000
  # The 2018 Form 1040 combined IRA distributions with pensions and annuities,
  # so SOI has no separate figure for 2018 (Table 1.4, tax year 2019, note 3).
  # Taxable IRA distributions, pensions and annuities for 2018 times the mean
  # of the pension share of that total in 2017 and 2019.
  2018-01-01: 774_661_125_000
  2019-01-01: 784_497_673_000
  2020-01-01: 827_597_726_000
  2021-01-01: 858_038_339_000
  2022-01-01: 911_698_884_000
  2023-01-01: 932_130_236_000
