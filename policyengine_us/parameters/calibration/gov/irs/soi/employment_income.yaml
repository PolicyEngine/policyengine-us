description: Total employment income.
values:
  # IRS SOI Publication 1304 Table 1.4, all returns: salaries and wages, Form
  # 1040 line 1. From tax year 2022 the form splits line 1 into lines 1a to
  # 1z and the table labels the line 1z total "total wages, total". Line 1z
  # leaves out three amounts that line 1 included and that moved to Schedule 1
  # that year: scholarships not reported on Form W-2, pensions from
  # nonqualified deferred compensation and section 457 plans, and wages earned
  # while incarcerated. Amounts are published in thousands of dollars. Each
  # value is for the tax year of its date.
  2015-01-01: 7_112_222_959_000
  2016-01-01: 7_217_425_529_000
  2017-01-01: 7_577_563_943_000
  2018-01-01: 7_907_550_652_000
  2019-01-01: 8_273_071_046_000
  2020-01-01: 8_416_495_535_000
  2021-01-01: 9_022_352_941_000
  2022-01-01: 9_738_950_972_000
  2023-01-01: 10_204_095_705_000
