metadata:
  unit: list
  period: year
  label: CBO social insurance benefits
  reference:
    # "Social insurance benefits consist of benefits provided through Social
    # Security (Old Age, Survivors, and Disability Insurance); Medicare
    # (measured as the average cost to the government of providing those
    # benefits, net of offsetting receipts); regular unemployment insurance
    # ...; and workers' compensation." (Appendix A, note 3, PDF page 27.)
    # Appendix D (PDF page 39) defines Medicare as "measured by the average
    # cost to the government of providing those benefits", with no netting
    # clause.
    - title: "Congressional Budget Office, The Distribution of Household Income in 2021, Appendixes A and D #page 27,39"
      href: https://www.cbo.gov/system/files/2024-09/60341-income.pdf#page=27
    # "The measure of Medicare benefits in The Distribution of Household
    # Income includes the federal government's average cost per enrollee of
    # providing Medicare, net of premiums paid by enrollees." (Report PDF,
    # 61910-DOHI-health.pdf, page 27; the same report lists "Medicare (net
    # of premiums paid by enrollees)" on PDF pages 5 and 37.) CBO calls that
    # measure plus enrollee premiums "gross Medicare spending".
    - title: Congressional Budget Office, Sensitivity of the Distribution of Household Income to the Treatment of Health Insurance From 1979 to 2021
      href: https://www.cbo.gov/system/files/2026-01/61910-DOHI-health.pdf#page=27
