description: The Census Bureau counts these sources as pension or retirement income, source 10 of 18 in money income.
values:
  0000-01-01:
    # Pensions, annuities and paid-up insurance policies.
    - pension_income
    # Military retirement pay. Survivor annuities under the military
    # retirement plans count as survivor benefits.
    - military_retirement_pay
    # IRA, Keogh and 401(k) payments, at the ages Census counts them.
    - census_retirement_distributions
    # Railroad retirement, one of the eight sources Appendix A lists here.
    # railroad_benefits also holds the Railroad Retirement Board's disability
    # and survivor annuities, which Appendix A counts as disability and
    # survivor benefits; the model does not split that variable.
    - railroad_benefits
metadata:
  unit: list
  period: year
  label: Census money income pension or retirement income sources
  reference:
    - title: "Census Bureau, Current Population Reports P60-200, Appendix A, source 10 (pension or retirement income) #page 1,3"
      href: https://www2.census.gov/programs-surveys/cps/methodology/Appendix%20A%20P60-200%20income%20measurement%20definition.pdf#page=1
    - title: "Census Bureau, 2026 Current Population Survey Annual Social and Economic Supplement data dictionary, retirement distributions by age (DST_VAL1, DST_VAL1_YNG, DBTN_VAL) #page 57-58"
      href: https://www2.census.gov/programs-surveys/cps/datasets/2026/march/asec2026_ddl_pub_full.pdf#page=57
