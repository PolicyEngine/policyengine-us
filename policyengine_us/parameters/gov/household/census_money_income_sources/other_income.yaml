description: The Census Bureau counts these sources as other income, source 18 of 18 in money income.
# Appendix A's other income covers payments received regularly that no
# other source covers, such as state foster child payments, military
# family allotments and foreign government pensions. The model has no
# variables for the last two, and of foster payments only the two Los
# Angeles County payments below.
values:
  0000-01-01:
    # Guaranteed income pilot payments.
    - gi_cash_assistance
    # Alaska's annual dividend and the energy relief paid with it.
    - ak_permanent_fund_dividend
    - ak_energy_relief
    # Contributed cash payments that are zero unless a reform turns them on.
    - basic_income
    - trump_dividend
    # Los Angeles County payments to parenting and expectant foster youth.
    - ca_la_infant_supplement
    - ca_la_expectant_parent_payment
metadata:
  unit: list
  period: year
  label: Census money income other income sources
  reference:
    - title: "Census Bureau, Current Population Reports P60-200, Appendix A, source 18 (other income) #page 2-3"
      href: https://www2.census.gov/programs-surveys/cps/methodology/Appendix%20A%20P60-200%20income%20measurement%20definition.pdf#page=2
