description: The Census Bureau counts these sources as survivor benefits, source 8 of 18 in money income.
# Railroad Retirement Board survivor annuities sit in railroad_benefits,
# under pension or retirement income, because the model does not split
# that variable by type of annuity.
values:
  2022-01-01:
    - survivor_benefits
    # Survivor annuities under the uniformed services retirement plans:
    # Appendix A lists military survivor pensions here.
    - military_retirement_pay_survivors
metadata:
  unit: list
  period: year
  label: Census money income survivor benefits sources
  reference:
