description: The Census Bureau counts these sources as disability benefits, source 9 of 18 in money income.
# pfml_benefits holds state paid family and medical leave benefits;
# Appendix A lists state temporary sickness payments among the sources
# of disability benefits. The model has no separate variable for Black
# lung payments, another source Appendix A lists here. The default data
# fills disability_benefits from the survey's disability income other than
# workers' compensation, so it holds the survey's Black lung and railroad
# retirement disability payments (DIS_SC codes 8 and 6). A Railroad
# Retirement Board disability annuity entered as railroad_benefits counts
# under pension or retirement income instead.
values:
  0000-01-01:
    - disability_benefits
    - pfml_benefits
metadata:
  unit: list
  period: year
  label: Census money income disability benefits sources
  reference:
    - title: "Census Bureau, Current Population Reports P60-200, Appendix A, source 9 (disability benefits) #page 1,3"
      href: https://www2.census.gov/programs-surveys/cps/methodology/Appendix%20A%20P60-200%20income%20measurement%20definition.pdf#page=1
