description: State governments limit standard Children's Health Insurance Program pregnancy eligibility to these incomes, as a share of the federal poverty line, including the five percentage point income disregard of 42 CFR 435.603(d)(4). A value of -inf indicates the state does not operate a standard separate CHIP program for pregnant people; these states cover pregnancy through Medicaid or through the from-conception-to-end-of-pregnancy option, reflected in the Medicaid pregnant and CHIP FCEP income limit parameters.
