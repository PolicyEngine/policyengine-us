description: State governments limit Children's Health Insurance Program from-conception-to-end-of-pregnancy eligibility to these incomes, as a share of the federal poverty line, including the five percentage point income disregard of 42 CFR 435.603(d)(4). A value of -inf indicates the state has not adopted the from-conception-to-end-of-pregnancy option.
metadata:
  unit: /1
  period: year
  label: CHIP FCEP pregnant income limit
  breakdown:
  - state_code
  reference:
    # KFF's January 2026 table adds the disregard only at each state's highest
    # pregnancy level, so lower levels omit it (for example, West Virginia
    # Medicaid 185% and Colorado CHIP 260%). 42 CFR 435.603(d)(4) applies the
    # disregard in each Title.
    - title: Medicaid and CHIP Income Eligibility Limits for Pregnant Women as a Percent of the Federal Poverty Level | KFF State Health Facts
      href: https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/?currentTimeframe=0&sortModel=%7B%22colId%22:%22Location%22,%22sort%22:%22asc%22%7D
    - title: Medicaid, Children's Health Insurance Program, & Basic Health Program Eligibility Levels | CMS
      href: https://www.medicaid.gov/medicaid/national-medicaid-chip-program-information/medicaid-childrens-health-insurance-program-basic-health-program-eligibility-levels
    - title: MACStats Medicaid and CHIP Data Book, Exhibit 35 | MACPAC
      href: https://www.macpac.gov/publication/medicaid-and-chip-income-eligibility-levels-as-a-percentage-of-the-federal-poverty-level-for-children-and-pregnant-women-by-state/
    - title: 42 CFR 435.603(d)(4), five percentage point MAGI income disregard
      href: https://www.law.cornell.edu/cfr/text/42/435.603#d_4
    - title: 42 CFR 457.315(a), MAGI financial methodologies apply to CHIP
      href: https://www.law.cornell.edu/cfr/text/42/457.315#a
    - title: Colorado CHIP State Plan Amendment CO-24-0041, state plan amendment history (Amendment 40)
      href: https://www.medicaid.gov/CHIP/Downloads/CO-24-0041.pdf#page=3
    - title: "Colorado CHIP State Plan Amendment CO-25-0044, companion letter and section 3.1.1.1 #page 3,6"
      href: https://www.medicaid.gov/CHIP/Downloads/CO-25-0044.pdf#page=3
    - title: Colorado CHIP State Plan Amendment CO-26-0047, superseding pages table (CO-24-0040-0002 CS9, Coverage From Conception to Birth, effective January 1, 2025)
      href: https://www.medicaid.gov/CHIP/Downloads/CO-26-0047.pdf#page=5
