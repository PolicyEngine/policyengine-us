description: States cover undocumented children under the Children's Health Insurance Program if this is true.
# is_chip_immigration_status_eligible applies gov.hhs.chip.child.max_age, and
# chip_federal_share gives a child enrolled in CHIP's child category through
# this route no federal match.
# These children pass the Medicaid immigration test only through the
# pregnancy term. States that cover them under both programs use
# gov.hhs.medicaid.eligibility.regardless_of_immigration_status.child_age_limit.
# States other than New York read false until researched.
metadata:
  unit: bool
  period: year
  label: CHIP undocumented child coverage
  breakdown:
    - state_code
  reference:
    - title: New York Public Health Law section 2510
      href: https://www.nysenate.gov/legislation/laws/PBH/2510
    - title: New York Public Health Law section 2511
      href: https://www.nysenate.gov/legislation/laws/PBH/2511
    - title: "New York State Department of Health, GIS 08 MA/009 attachment (March 3, 2008)"
      href: https://www.health.ny.gov/health_care/medicaid/publications/docs/gis/08ma009att.pdf

