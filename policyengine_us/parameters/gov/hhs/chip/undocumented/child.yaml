NY:
  # Child Health Plus covers children "under the age of nineteen" (Public
  # Health Law section 2510(4)). Section 2511(2) sets the criteria for a
  # subsidy payment: household income at or below 400% of the poverty level,
  # no Medicaid eligibility, no other coverage and New York residence. None
  # of the criteria tests immigration status. The reference list also holds
  # the Department of Health's 2008 documentation guide (GIS 08 MA/009),
  # cited as listing Child Health Plus among the programs open at any
  # status; that reading of the guide is unverified. The model's New York
  # CHIP income limit of 405% is a separate modeling choice. Between the
  # 400% premium threshold and that limit the model applies its
  # full-premium schedule, whose full-premium rates start in 2024. The 2021
  # date follows the all-ages Medicaid flag this route replaces, and
  # backdating carries it to 2015. The route takes the national CHIP age
  # limit (gov.hhs.chip.child.max_age) because section 2510(4) sets the
  # same 19.
  2021-01-01: true
