description: States provide the lawfully residing pregnant individuals option under the Children's Health Insurance Program if this is true.
# The option reaches separate CHIP only where the state also elected it in Medicaid
# for the same group (42 U.S.C. 1397gg(e)(1)(Q)). States that cover their option
# population through Medicaid-expansion CHIP are false, because this model treats
# that coverage as Medicaid.
# Values before 2022 extrapolate from the January 1, 2022 KFF and Georgetown CCF
# 50-state survey, the earliest state-level source. Later changes come from state
# plan amendments, bulletins and testimony, and current values match the CMS list
# updated April 2, 2026.
