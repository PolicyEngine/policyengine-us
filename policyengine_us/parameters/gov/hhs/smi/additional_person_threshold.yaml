description: The Department of Health and Human Services sets this threshold for when the additional person rate applies under the State Median Income program.

values:
  2013-10-01: 6

metadata:
  unit: person
  period: year
  label: HHS SMI additional person threshold
  reference:
    - title: 45 CFR 96.85(b), Adjustment of annual median income for household size
      href: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-A/part-96/subpart-H/section-96.85#p-96.85(b)
    - title: Estimated State Median Income for Four-Person Families, by State, FFY 2014 (78 FR 28597), footnote 3
      href: https://www.govinfo.gov/content/pkg/FR-2013-05-15/pdf/2013-11575.pdf#page=3
    - title: State Median Income (SMI) by household size FFY 2022
      href: https://www.acf.hhs.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM03%20Attachment1%20SMITable_FY2022.pdf

# 45 CFR 96.85(b)(7) has added the per-person adjustment above six persons since
# the 1988 rule (53 FR 6827); the 1999 amendment (64 FR 55858) changed only
# paragraph (a). It starts with the earliest State Median Income table in
# amount.yaml.
