description: Income sources not included in AGI but included in Medicaid/CHIP/ACA-related MAGI.
values:
  2010-01-01:
    - foreign_earned_income_exclusion
    - tax_exempt_interest_income
    # The taxpayer's own Social Security benefits not in AGI (26 USC
    # 36B(d)(2)(B)(iii)). A dependent's benefits are the dependent's MAGI,
    # counted only when the dependent is required to file (36B(d)(2)(A)(ii),
    # 42 CFR 435.603(d)(2)); medicaid_magi_person gives each person their own.
    - filer_tax_exempt_social_security
metadata:
