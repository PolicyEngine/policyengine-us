description: Whether the state excludes anyone receiving Supplemental Security Income from the Medicaid adult expansion group, beyond the federal exclusion of people eligible for and enrolled in mandatory coverage.
metadata:
  unit: bool
  period: year
  label: Medicaid adult group excludes all SSI recipients
  breakdown:
    - state_code
  reference:
    - title: 42 CFR 435.119(b)(4) - adult group mandatory-coverage exclusion
      href: https://www.law.cornell.edu/cfr/text/42/435.119
    - title: Missouri DSS Manual § 1865.020.00 - Adult Expansion Group ("Not receiving SSI")
      href: https://dssmanuals.mo.gov/family-mo-healthnet-magi/1865-000-00/1865-020-00/
    - title: North Dakota Medicaid Policy Manual § 510-03-30-05 - adult expansion group "may include SSI recipients ... who fail the Medicaid asset limits"
      href: https://www.nd.gov/dhs/policymanuals/51003/Content/510-03-30-05.htm
    - title: New Hampshire Medical Assistance Manual § 230.01 - Granite Advantage criteria (mandatory-group and Medicare exclusions only, no SSI-receipt test)
      href: https://www.dhhs.nh.gov/mam_htm/html/230_01_granite_advantage_eligibility_criteria_mam.htm
    - title: Virginia DMAS Eligibility Manual M0330.250.B - MAGI Adults ("not be eligible in a Medicaid mandatory covered group")
      href: https://www.dmas.virginia.gov/media/ifujac10/m03-7-1-24.pdf#page=125
    - title: Hawaii Administrative Rules § 17-1718-10(a)(3) - Adults Group, "Not in receipt of Supplemental Security Income (SSI)"
      href: https://humanservices.hawaii.gov/wp-content/uploads/2016/12/HAR-17-1718-ADULT-GROUP-Final-10-31-16-1.pdf#page=3
    - title: Minnesota Health Care Programs Eligibility Policy Manual § 2.2.2.1 - "Is not a Supplemental Security Income (SSI) recipient"
      href: https://hcopub.dhs.state.mn.us/epm/2_2_2_1.htm
    - title: Connecticut DSS UPM 2540 coverage groups chart - HUSKY D (X02) criteria, no SSI test
      href: https://portal.ct.gov/-/media/Departments-and-Agencies/DSS/HIT/MedCoverageGroupsOLD.pdf#page=17
    - title: Illinois HFS Medical Policy PM 06-25-01 - ACA Adult nonfinancial requirements, no SSI test
      href: https://www.dhs.state.il.us/page.aspx?item=61206
