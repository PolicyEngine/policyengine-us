description: Medicaid denies adult group coverage to a parent or other caretaker relative living with a child younger than this age, unless the child has Medicaid, Children's Health Insurance Program, Marketplace or other minimum essential coverage.
metadata:
  unit: year
  period: year
  label: Medicaid adult group child coverage requirement age limit
  breakdown:
    - state_code
  reference:
    - title: 42 CFR 435.119(c) - coverage for dependent children
      href: https://www.law.cornell.edu/cfr/text/42/435.119#c
    - title: Colorado approved state plan S32 (CO-13-0045-MM1), under age 19 selected
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/CO/CO-13-0045-MM1.pdf#page=30
    - title: New Jersey approved state plan S32 (NJ-13-0011-MM1), under age 21 selected
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/NJ/NJ-13-0011-MM1.pdf#page=16
# 42 CFR 435.119(c)(2) sets the age at under 19, unless the state covered
# individuals under 20 or 21 under 42 CFR 435.222 on March 23, 2010, in
# which case the higher age applies. Colorado and New Jersey are sourced
# from their state plan S32 pages. The other states carry the federal
# default of 19 and are not yet researched.
