description: Illinois rounds the monthly medically needy income limit to the nearest whole dollar under the Medicaid program, if this is true.
values:
  # KFF 2018 ($1,012 / $1,372) and IDHS 2019-2024 tables round to the nearest dollar
  # ($1,133 / $1,526 in 2022; $2,072 for $2,071.67 for three in 2023).
  2018-01-01: true
  2025-01-01: false
