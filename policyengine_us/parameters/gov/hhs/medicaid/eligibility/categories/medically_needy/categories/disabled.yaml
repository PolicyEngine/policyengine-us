description: Whether people with disabilities can qualify for Medicaid under the 'medically needy' pathway.
# NOTE: Like every other state's, the AR, IA, IL, ND and NJ switches date from 2015-01-01, while their income and asset limits start in 2018, so 2015-2017 use the 2018 limits.
