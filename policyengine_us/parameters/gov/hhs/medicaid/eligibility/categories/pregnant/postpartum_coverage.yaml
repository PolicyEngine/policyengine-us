description: States provide pregnancy-related coverage for this number of days after a pregnancy ends under the Medicaid program.
# NOTE: is_pregnant_for_medicaid_nfc is YEAR-defined and reads this parameter
# on January 1, so a mid-year effective date applies from the next calendar
# year. 60 and 365 are the statutory minimum day counts: 42 USC 1396a(e)(5)
# and (e)(16) run coverage through the last day of the month in which the
# 60-day or 12-month period ends, but count_days_postpartum has no calendar
# date, so the model stops coverage at day 60 or day 365.
metadata:
