      href: https://www.dhhs.nh.gov/mam_htm/html/209_aid_to_the_permanently_and_totally_disabled_aptd_mam.htm
    - title: New Hampshire DHHS SR 26-01 (January 2026) - New Substantial Gainful Activity (SGA) Income Ceiling
      href: https://www.dhhs.nh.gov/sr_htm/html/sr_26-01_dated_01_26.htm
    - title: New Hampshire Admin. Rules He-W 504.02 - MEAD Medical Eligibility (SGA not considered)
      href: https://regulations.justia.com/states/new-hampshire/he/subtitle-he-w/chapter-he-w-500/part-he-w-504/section-he-w-504-02
    - title: 42 CFR 435.121 - Individuals in States using more restrictive requirements for Medicaid than the SSI requirements
      href: https://www.law.cornell.edu/cfr/text/42/435.121
    - title: Missouri DSS MHABD Manual § 0850.005.00 - Eligibility Requirements for MO HealthNet Based on Section 1619 Status
      href: https://dssmanuals.mo.gov/mo-healthnet-for-the-aged-blind-and-disabled/0850-005-00/
    - title: 42 U.S.C. § 1382h(a) - Section 1619(a) continuing SSI cash benefits above SGA
      href: https://www.law.cornell.edu/uscode/text/42/1382h
# Missouri accepts an SSA disability finding in place of its Medical
# Review Team, but § 1060.005.00 adds: "An MRT decision is required if:
# The individual's earned income exceeds the SGA", and § 0840.010.35
# says MRT cases over SGA "are not eligible for Spend Down or Non-Spend
# Down coverage". The screen sits under the permanent-and-total-disability
# rules, so the model exempts the blind (vision-based category) and the
# aged (no SGA test). The other 209(b) states were checked 2026-09-04;
# six treat SSI receipt as proof of disability with no earnings screen:
#   CT: HUSKY C coverage groups take SSI recipients as categorically
#       disabled (DSS Medical Coverage Groups summary of UPM 2540).
#   HI: HAR 17-1719-10.2(b)(1), proof of disability includes "eligibility
#       for or receipt of SSI or RSDI benefits based on disability".
#   IL: PM 03-08-01, "A person who receives Social Security disability
#       benefits or SSI ... is considered disabled for AABD".
#   MN: EPM 2.3.2.2, SSA certification of disability satisfies MA-ABD;
#       SMRT screens only people who are not SSI-eligible.
#   ND: NDAC 75-02-02.1-01, "Disabled" has the SSA meaning; the agency
#       may not make an independent determination where SSA has.
#   VA: M0310.112 B, individuals receiving SSI disability benefits meet
#       the definition and are not referred to DDS.
# NH is true: MAM Part 209 requires an APTD medical assistance applicant
# to be unable to "engage in a substantial gainful employment activity";
# the caseworker applies the SGA test and "If the net income exceeds
# $1,690, the application must be denied" (2026), with no exception for
# SSI recipients. SGA "applies to initial eligibility only" and does not
# reach ongoing recipients or MEAD (He-W 504.02); we do not distinguish
# new applicants from recipients, so the screen applies to both.
# Computed SSI already fails is_ssi_disabled above SGA, so the screen only
# reaches SSI receipt supplied as an input. A continuing recipient keeps
# SSI cash above SGA under section 1619(a), and 42 CFR 435.121(b)(3) and
# § 0850.005.00 keep 1619 recipients on MHABD, so the screen applies only
# once countable income exhausts the SSI benefit rate, where no cash is
# payable and the asserted receipt cannot be a 1619(a) continuation.
# Section 1619(b) status (no cash, Medicaid retained) is not observed.
# Section 1634 and SSI-criteria states must cover every SSI recipient
# (42 CFR 435.120), so no earnings screen can apply there; the variable
# is limited to 209(b) states and the other 43 values are inert.
