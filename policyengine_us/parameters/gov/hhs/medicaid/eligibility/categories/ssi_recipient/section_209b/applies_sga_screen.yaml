    - title: Missouri DSS MHABD Manual § 0840.010.35 - Change in Coverage, Spend Down and Ticket to Work
      href: https://dssmanuals.mo.gov/mo-healthnet-for-the-aged-blind-and-disabled/0840-000-00/0840-010-00/0840-010-35/
    - title: Missouri DSS December 1973 Eligibility Requirements Manual § 1060.005.12 - Submitting Information to MRT for Individuals Engaged in Substantial Gainful Activity
      href: https://dssmanuals.mo.gov/december-1973-eligibility-requirements/1060-000-00/1060-005-00/1060-005-12/
    - title: Missouri DSS December 1973 Eligibility Requirements Manual, Appendix D - Substantial Gainful Activity
      href: https://dssmanuals.mo.gov/december-1973-eligibility-requirements/substantial-gainful-activity/
