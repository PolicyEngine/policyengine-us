description: Whether the state elects the federal option to count any adult who lives with a dependent child and assumes primary responsibility for the child's care as a caretaker relative for the Medicaid parent and other caretaker relative category.
metadata:
  unit: bool
  period: year
  label: Medicaid parent category caretaker relative any-adult option
  breakdown:
    - state_code
  reference:
    - title: 42 CFR 435.4 - definition of caretaker relative, paragraph (3)
      href: https://www.law.cornell.edu/cfr/text/42/435.4
    - title: New Jersey approved state plan S25 (NJ-13-0011-MM1), any-adult caretaker option checked
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/NJ/NJ-13-0011-MM1.pdf#page=31
# Sourced elections only. States marked false without a comment are not
# verified non-elections: their state plan S25 pages have not been
# reviewed for this option, and the formula keeps excluding foster
# children there as a proxy for an unrelated foster placement.
