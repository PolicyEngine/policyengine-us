# Sourced: New Jersey's approved S25 checks "The definition of caretaker
# relative includes any adult with whom the child is living and who
# assumes primary responsibility for the dependent child's care"
# (NJ-13-0011-MM1, approved 02/28/2014, effective 01/01/2014; no later
# New Jersey amendment replaces the page). N.J.A.C. 10:69, readopted in
# 2024 for AFDC-related Medicaid, still confines the parent role to
# listed relatives (10:69-1.5 "Dependent child" and "Parent-person";
# 10:69-3.10(a)1); this file follows the approved state plan.
