SC:
  2018-01-01: 0.67
  # SCDHHS publishes the Parent/Caretaker Relative limit as 67% of the
  # guidelines, shown as $1,842.50/month for a family of four (effective
  # March 1, 2026). No 2021 entry: the 1.00 once stored for that year came
  # from the section 1115 waiver South Carolina later resubmitted as
  # Palmetto Pathways to Independence, which would have covered parents
  # above 67% and up to 95% of the guidelines with a 5-point disregard,
  # that is up to 100%. CMS approved the original waivers in December
  # 2019, SCDHHS paused implementation during the COVID-19 federal public
  # health emergency to comply with the Families First Coronavirus
  # Response Act, and CMS withdrew the approval on August 10, 2021, so the
  # 100% level never took effect (SCDHHS, Palmetto Pathways to
  # Independence application, June 23, 2025). 0.67 therefore runs unbroken
  # from 2018.
  #
  # MACPAC Exhibit 36 (July 2025), cited above, still lists South Carolina
  # parents at 95%, which is that same 100% once the 5-point disregard is
  # added. Its source note gives the exhibit as a 2025 analysis of CMS's
  # 2023 eligibility levels, so it carries the waiver-era level forward
  # rather than SCDHHS's current table. Do not re-add the 1.00 on the
  # strength of that row.
  #
  # SCDHHS resubmitted the demonstration to CMS on June 23, 2025 as a
  # five-year request for the same 67% to 100% band. It was pending when
  # this entry was written, and the March 1, 2026 eligibility table above
  # still shows 67%. If CMS approves it and SCDHHS implements, add a dated
  # entry at the implementation date rather than restoring a 2021 value.
