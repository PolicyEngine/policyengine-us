# Most of the states carrying a 2026 entry below set the section 1931
# parent/caretaker standard as a frozen dollar amount, so its share of the
# federal poverty guidelines falls each January as the guidelines rise. South
# Carolina is not one of them: it publishes the limit as a percentage, so its
# value does not drift.
#
# Each frozen-dollar entry converts the state's published standard for a
# family of three against that year's guidelines, inclusive of the 5-point
# MAGI disregard. That single fraction is an approximation. These states
# publish a dollar standard for every household size, while
# medicaid_income_level divides income by the guidelines for the actual
# Medicaid household size, so no one fraction fits every size. The
# family-of-three fraction is too strict for a single parent with one child:
# the published size-two standard works out about 0.8 points higher in Texas
# ($196/month) and about 2.6 points higher in Wyoming ($737/month).
