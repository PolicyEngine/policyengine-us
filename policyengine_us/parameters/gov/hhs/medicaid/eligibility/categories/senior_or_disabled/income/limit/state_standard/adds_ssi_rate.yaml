description: The state's Medicaid income standard for aged, blind, or disabled people who do not receive SSI is the SSI federal benefit rate plus the state's amount, rather than the state's amount alone, if this is true.
metadata:
  unit: bool
  period: year
  label: Medicaid senior or disabled state standard adds the SSI rate
  breakdown:
  - state_code
  reference:
    - title: 7 AAC 40.310(a) and (c) - Income Eligibility Standards (dollar amounts raised each January by the Social Security cost-of-living percentage)
      href: https://www.law.cornell.edu/regulations/alaska/7-AAC-40.310
    - title: IDAPA 16.03.05.501 - Basic Allowance (raised by the dollar amount of each SSI cost-of-living increase)
      href: https://adminrules.idaho.gov/rules/current/16/160305.pdf#page=39
    - title: N.H. Code Admin. R. He-W 858.03(c)-(e) - Adult Category Standard of Need (set from the SSI maximum benefit amount)
      href: https://gc.nh.gov/rules/state_agencies/he-w800.html
    - title: Vermont DVHA, Standards Change for Healthcare 2026, SSI/AABD Payment Maximums (SSI plus the AABD supplement)
      href: https://dvha.vermont.gov/sites/dvha/files/documents/Standards_Change_for_Healthcare_2026.pdf#page=7
    - title: Wis. Admin. Code DHS 103.04(1)(c) - SSI-related categorically needy income standard ("the maximum SSI payment including state supplement")
      href: https://docs.legis.wisconsin.gov/code/admin_code/dhs/101/103/04/1/c

