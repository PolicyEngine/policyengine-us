    - title: Oklahoma Administrative Code 317:35-7-40 - Eligibility as Qualified Medicare Beneficiary Plus
      href: https://oklahoma.gov/ohca/policies-and-rules/xpolicy/medical-assistance-for-adults-and-children-eligibility/medical-services/determination-of-eligibility-for-medical-services/eligibility-as-qualified-medicare-beneficiary-plus.html
