description: The state sets the Medicaid asset limit for aged, blind, or disabled people who do not receive SSI at the Medicare Savings Program resource limit, if this is true.
metadata:
  unit: bool
  period: year
  label: Medicaid senior or disabled asset limit is the Medicare Savings Program limit
  breakdown:
  - state_code
  reference:
