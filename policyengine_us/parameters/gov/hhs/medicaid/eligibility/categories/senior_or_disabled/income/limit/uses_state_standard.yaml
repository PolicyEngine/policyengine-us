description: The state tests the Medicaid income of aged, blind, or disabled people who do not receive SSI against a monthly dollar standard of its own, rather than a share of the federal poverty guideline, if this is true.
metadata:
  unit: bool
  period: year
  label: Medicaid senior or disabled income limit is a state dollar standard
  breakdown:
  - state_code
  reference:
    - title: 42 CFR 435.210 - Optional eligibility for individuals who meet the income and resource requirements of the cash assistance programs
      href: https://www.ecfr.gov/current/title-42/section-435.210
    - title: 7 AAC 100.400(a)(17) - Applies the Adult Public Assistance income eligibility standards of 7 AAC 40.310 to Medicaid for aged and disabled people
      href: https://www.law.cornell.edu/regulations/alaska/7-AAC-100.400
    - title: 7 AAC 100.410(c) - Medicaid for an individual eligible for SSI or Adult Public Assistance who chooses not to receive the cash benefit
      href: https://www.law.cornell.edu/regulations/alaska/7-AAC-100.410
    - title: Alaska Aged, Disabled and Long Term Care Medicaid Manual 530 C - Use of the Refused Cash Medicaid subtype (from January 2020)
      href: http://dpaweb.hss.state.ak.us/manuals/adltc/530_ssi_and_apa_related_categories/530_ssi_and_apa_related_categories.htm
    - title: "IDAPA 16.03.05.301.01 (AABD-Medicaid without applying for SSI), 16.03.05.500 (financial need) and 16.03.05.501 (basic allowance) #page 28,39"
      href: https://adminrules.idaho.gov/rules/current/16/160305.pdf#page=28
    - title: "Idaho Medicaid State Plan TN 18-0002, Supplement 6 to Attachment 2.6-A, Income Limits by Living Situation #page 5-6"
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/ID/ID-18-0002.pdf#page=5
    - title: N.H. Code Admin. R. He-W 802.04(b)(1) (categorically needy group of 42 CFR 435.210) and He-W 858.03 (adult category standard of need)
      href: https://gc.nh.gov/rules/state_agencies/he-w800.html
    - title: "Vermont Health Benefits Eligibility and Enrollment Rules § 8.05(b) - Individual who is SSI-eligible (income \"at or below the SSI/AABD payment level\") #page 10-11"
      href: https://humanservices.vermont.gov/sites/ahsnew/files/documents/HBEE-Part-2-Eligibility-Standards.pdf#page=10
    - title: Wis. Admin. Code DHS 103.04(1)(c) - SSI-related categorically needy income standard ("the maximum SSI payment including state supplement")
      href: https://docs.legis.wisconsin.gov/code/admin_code/dhs/101/103/04/1/c
    - title: "Wisconsin DHS Operations Memo 20-13, SSI-Related Medicaid Categorically Needy Income Limit Changes (fixed amounts from the August 2020 benefit month) #page 1-2"
      href: https://www.dhs.wisconsin.gov/dms/memos/ops/dms-ops-2020-13.pdf#page=1
    - title: Wisconsin Medicaid Eligibility Handbook 39.4.1, Release 18-01 (2018 categorically needy limits, $583.78 and $882.05 plus actual shelter up to $250.00 and $375.00)
      href: https://www.emhandbooks.wisconsin.gov/meh-ebd/history/18-01/18-01_39.4.htm
    - title: Wisconsin Medicaid Eligibility Handbook 39.4.1, Release 19-02 (2019 categorically needy limits, $597.78 and $903.38 plus actual shelter up to $257.00 and $385.67; SSI payment level with the supplement $854.78 and $1,289.05)
      href: https://www.emhandbooks.wisconsin.gov/meh-ebd/history/19-02/19-02_39.4.htm

