# Alaska: the 7 AAC 40.310 standard. Until 2019 it was the Adult Public
# Assistance need standard; since January 2020 the state plan disregards
# income between the Adult Public Assistance standard and this amount.
AK:
  2018-01-01: 1_393
  2019-01-01: 1_432
  2020-01-01: 1_455
  2021-01-01: 1_474
  2022-01-01: 1_561
  2023-01-01: 1_697
  2024-01-01: 1_751
  2025-01-01: 1_795
  2026-01-01: 1_845
# Idaho: the AABD basic allowance, $33 above the SSI rate.
ID:
  2018-01-01: 33
# New Hampshire: the standard of need, $14 above the SSI rate in every year from 2018.
NH:
  2018-01-01: 14
# Vermont: the AABD supplement for independent living.
VT:
  2018-01-01: 52.04
  2024-01-01: 55.68
# Wisconsin: the state supplementary payment for an eligible individual.
WI:
  2020-08-01: 83.78
  2026-05-01: 92.16
