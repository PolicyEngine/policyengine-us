description: States limit parental Medicaid income allocations to ineligible children below these ages. These overrides constrain the shared SSI allocation definition; states absent from this parameter retain the existing shared allocation behavior.
# The dates mark the shared Medicaid income model's 2015 coverage baseline,
# not an assertion that the states changed their allocation rules in 2015.
# Sources were checked for the current rules in October 2026.
