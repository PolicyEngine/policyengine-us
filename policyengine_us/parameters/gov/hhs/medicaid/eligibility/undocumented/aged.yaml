NY:
  # Social Services Law section 366(1)(g)(4) covers people "age sixty-five or
  # older, who are otherwise eligible for medical assistance under this
  # section, but for their immigration status". Part AAA of chapter 56 of
  # the Laws of 2022 added it from January 1, 2023. Part H of chapter 57 of
  # the Laws of 2023 reset its start to "no later than January 1, 2024", and
  # section 7 of that part deems the change in force from January 1, 2023.
  # Informational letter 23 OHIP/INF-2 makes the coverage effective January
  # 1, 2024, paid with state funds.
  2021-01-01: false
  2024-01-01: true
