description: States cover undocumented immigrants aged 65 or older under the Medicaid program if this is true.
# is_medicaid_immigration_status_eligible tests age with is_ssi_aged, the
# age-65 test of the Medicaid aged group. States that cover undocumented
# immigrants of every age read true in undocumented_immigrant.yaml and false
# here. States other than New York read false until researched.
metadata:
  unit: bool
  period: year
  label: Medicaid undocumented immigrant aged coverage
  breakdown:
    - state_code
  reference:
    - title: New York Social Services Law section 366
      href: https://www.nysenate.gov/legislation/laws/SOS/366
    - title: "New York Laws of 2022, chapter 56, part AAA"
      href: https://nyassembly.gov/leg/?default_fld=&leg_video=&bn=A09006&term=2021&Summary=Y&Actions=Y&Text=Y
    - title: "New York Laws of 2023, chapter 57, part H"
      href: https://nyassembly.gov/leg/?default_fld=&leg_video=&bn=A03007&term=2023&Summary=Y&Actions=Y&Text=Y
    - title: "New York State Department of Health, 23 OHIP/INF-2 (December 29, 2023)"
      href: https://www.health.ny.gov/health_care/medicaid/publications/docs/inf/23inf-02.pdf

