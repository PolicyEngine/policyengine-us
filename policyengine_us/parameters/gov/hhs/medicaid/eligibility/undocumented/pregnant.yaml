MA:
  # 130 CMR 504.006(D)(1) gives undocumented residents ("other
  # noncitizens") MassHealth Standard if they are pregnant. 130 CMR
  # 505.002(D) sets that coverage at up to 200% of the poverty level. Its
  # 2014 text (Eligibility Letter 213) continues the coverage for 60 days
  # after the pregnancy ends, and its text revised February 13, 2026 for 12
  # months. The formula applies the state's postpartum period, which reads
  # 365 days from 2023. No text cited here dates the longer period for
  # undocumented residents. The 2014 and 2022 texts of 504.006(D) read the
  # same. The 2021 date follows the all-ages flag this value replaces, and
  # backdating carries it to 2015.
  2021-01-01: true
