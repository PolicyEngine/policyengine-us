NY:
  # The Department of Health's notice D61-C0332, dated October 10, 2014,
  # gives people without satisfactory immigration status Medicaid "for
  # medical services provided to pregnant women" and ends it when "the
  # sixty-day postpartum period has ended". From March 1, 2023, part CCC of
  # chapter 56 of the Laws of 2022 continues for one year the eligibility of
  # a pregnant woman eligible under Social Services Law section 366(1)(b)(2)
  # or (4) (section 366(4)(b)(1)). The formula applies the state's postpartum
  # period to undocumented residents too, which the notice supports for the
  # sixty-day period only. The 2021 date follows the all-ages flag this
  # value replaces, and backdating carries it to 2015.
  2021-01-01: true
