description: States cover undocumented immigrants during pregnancy and the postpartum period under the Medicaid program if this is true.
# is_medicaid_immigration_status_eligible applies each state's postpartum
# period through is_pregnant_for_medicaid_nfc. States that cover undocumented
# immigrants of every age read true in undocumented_immigrant.yaml and false
# here. States other than New York read false until researched.
metadata:
  unit: bool
  period: year
  label: Medicaid undocumented immigrant pregnancy coverage
  breakdown:
    - state_code
  reference:
    - title: New York State Department of Health, client notice D61-C0332
      href: https://ohipdocs.health.ny.gov/ohipdocs/web/system/files/ohiprepos/shared_documents/2019-11/D61C0332.pdf
    - title: New York Social Services Law section 366
      href: https://www.nysenate.gov/legislation/laws/SOS/366
    - title: "New York Laws of 2022, chapter 56, part CCC"
      href: https://nyassembly.gov/leg/?default_fld=&leg_video=&bn=A09006&term=2021&Summary=Y&Actions=Y&Text=Y

