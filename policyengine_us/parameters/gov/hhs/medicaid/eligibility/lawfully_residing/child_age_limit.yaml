description: States limit the lawfully residing children option to individuals younger than this age under the Medicaid program.
# The statute covers individuals under 21, and states may elect a lower age. The
# CMS list marks the states that cover children up to age 19. States that have not
# elected the option carry the statutory 21, which the election parameter keeps
# from applying. No source shows a state changing its age limit.
