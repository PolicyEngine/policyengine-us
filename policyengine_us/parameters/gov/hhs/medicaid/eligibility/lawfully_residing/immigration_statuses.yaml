description: The United States limits the lawfully residing children and pregnant individuals option to these immigration statuses under the Medicaid program.
# CMS treats qualified aliens and other lawfully present noncitizens, including
# Temporary Protected Status holders, as lawfully residing, and excludes Deferred
# Action for Childhood Arrivals recipients. Section 71109 of Public Law 119-21
# leaves this option unchanged.
values:
  2009-04-01:
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT
    - CONDITIONAL_ENTRANT
    - PAROLED_ONE_YEAR
    - TPS

