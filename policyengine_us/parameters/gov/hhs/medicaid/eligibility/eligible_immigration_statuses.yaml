    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT
    - CONDITIONAL_ENTRANT
    - PAROLED_ONE_YEAR

  2026-10-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - CUBAN_HAITIAN_ENTRANT


