description: The Department of Health and Human Services limits non-agricultural home equity to this amount for Medicaid long-term care eligibility.
values:
  2025-01-01: 1_097_000
  2026-01-01: 1_130_000
  # CMS has not published 2027 standards. This is the 2026 value indexed by
  # the September 2025 to September 2026 change in CPI-U, rounded to the
  # nearest $1,000, the method that reproduces CMS's 2026 value from 2025.
  # It must equal the uprated 2027 agricultural_limit; replace it with the
  # CMS figure when the 2027 bulletin is released.
  2027-01-01: 1_159_000
  2028-01-01: 1_000_000

