description: The Department of Health and Human Services limits agricultural home equity to this amount for Medicaid long-term care eligibility.
values:
  2025-01-01: 1_097_000
  2026-01-01: 1_130_000

metadata:
  unit: currency-USD
  period: year
  label: Medicaid long-term care agricultural home equity limit
  # Years after the last CMS-published value are projected in
  # parameters/uprating_extensions.py (extend_medicaid_home_equity_limits) by
  # CMS's method under 42 USC 1396p(f)(1)(C): the prior year's limit times the
  # September-to-September CPI-U increase rounded to 0.1%, then rounded to the
  # nearest $1,000, effective January 1. P.L. 119-21 section 71108 exempts this
  # limit from the $1,000,000 cap on other homes from 2028.
  reference:
    - title: Updated 2025 SSI and Spousal Impoverishment Standards, CMCS Informational Bulletin, May 28, 2025
      href: https://www.medicaid.gov/federal-policy-guidance/downloads/cib05282025.pdf#page=2
    - title: Updated 2026 SSI and Spousal Impoverishment Standards, CMCS Informational Bulletin, April 27, 2026
      href: https://www.medicaid.gov/federal-policy-guidance/downloads/cib04272026.pdf#page=2
    - title: 2026 SSI, Spousal Impoverishment, and Medicare Savings Program Resource Standards, CMCS Informational Bulletin, December 9, 2025
      href: https://www.medicaid.gov/federal-policy-guidance/downloads/cib12092025.pdf#page=3
    - title: CMCS Informational Bulletin, November 18, 2025, Section 71108 - Revising Home Equity Limit
      href: https://www.medicaid.gov/federal-policy-guidance/downloads/cib11182025.pdf#page=9
    - title: H.R. 1, 119th Congress, Sec. 71108 - Revising home equity limit for determining eligibility for long-term care services under the Medicaid program
      href: https://www.congress.gov/bill/119th-congress/house-bill/1/text
