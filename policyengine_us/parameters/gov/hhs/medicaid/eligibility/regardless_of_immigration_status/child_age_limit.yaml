NJ:
  # N.J.S.A. 30:4J-11 limits NJ FamilyCare to children under 19 who are
  # citizens or lawful permanent residents, and N.J.A.C. 10:78-3.2(a) still
  # requires citizenship or an eligible alien status. Each appropriations act
  # from FY2023 through FY2027 authorizes enrolling "any child who, except for
  # immigration status, meets financial and other eligibility provisions of the
  # program", notwithstanding any law or regulation to the contrary. The
  # Department of Human Services began enrollment on January 1, 2023, with
  # state funds only.
  # Candidate: us-nj:medicaid-cover-all-kids-immigration-status until registered.
  2021-01-01: 0
  2023-01-01: 19
