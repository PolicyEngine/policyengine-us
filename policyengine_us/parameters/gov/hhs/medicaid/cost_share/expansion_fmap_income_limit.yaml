  - title: 42 U.S.C. § 1396a(e)(14)(I) — 5 percentage point income disregard
    href: https://www.law.cornell.edu/uscode/text/42/1396a#e_14_I
  - title: 42 U.S.C. § 1396d(y)(2)(A) — newly eligible individuals are those described in subclause (VIII)
    href: https://www.law.cornell.edu/uscode/text/42/1396d#y_2_A
