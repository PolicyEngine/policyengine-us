description: The federal government pays the Medicaid expansion FMAP for adult-group enrollees with income at or below this multiple of the federal poverty guideline, in states that do not cover a higher-income optional adult group.
metadata:
  unit: /1
  period: year
  label: Medicaid expansion FMAP income limit
  breakdown:
  - state_code
  reference:
  - title: 42 U.S.C. § 1396a(a)(10)(A)(i)(VIII) — adult group with income not exceeding 133 percent of the poverty line
    href: https://www.law.cornell.edu/uscode/text/42/1396a#a_10_A_i_VIII
  - title: 42 U.S.C. § 1396a(e)(14)(I) — 5 percentage point income disregard
    href: https://www.law.cornell.edu/uscode/text/42/1396a#e_14_I
  - title: 42 U.S.C. § 1396d(y)(1) — expansion FMAP for newly eligible individuals described in subclause (VIII)
    href: https://www.law.cornell.edu/uscode/text/42/1396d#y_1
  - title: 42 CFR § 435.218 — optional group for adults with income above 133 percent FPL (section 1902(a)(10)(A)(ii)(XX))
    href: https://www.ecfr.gov/current/title-42/section-435.218
  - title: KFF, Medicaid and CHIP Eligibility as of January 2019, Table 5 — Indiana other adults at 139 percent FPL, with a state-specific disregard of five percent of the income threshold (note 5)
    href: https://files.kff.org/attachment/Report-Medicaid-and-CHIP-Eligibility-as-of-Jan-2019-Table-5
  - title: Indiana FSSA, 5% Federal Poverty Level (FPL) Disregard (May 16, 2016) — the disregard is 5 percent of the income standard
    href: https://web.archive.org/web/20230517153228/https://www.in.gov/fssa/thehub/files/5-per-disregard.pdf
# 133 percent of the poverty line plus the 5 percentage point MAGI disregard,
# in the same units as gov.hhs.medicaid.eligibility.categories.adult.income_limit.
# Indiana applied a disregard of 5 percent of the 133 percent standard, about
# 139.65 percent; its values match that adult income limit, 1.39 through 2020.
