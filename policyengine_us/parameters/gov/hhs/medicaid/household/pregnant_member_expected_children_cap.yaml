description: Medicaid counts at most this number of a pregnant woman's expected children in the household size of each other member of her household, under the state's election in 42 CFR 435.603(b).
metadata:
  unit: person
  period: year
  label: Medicaid MAGI household cap on a pregnant member's expected children
  breakdown:
    - state_code
  reference:
    - title: 42 CFR 435.603(b), family size
      href: https://www.law.cornell.edu/cfr/text/42/435.603#b
    - title: California Medicaid State Plan Amendment 13-0023-MM, S10 MAGI-Based Income Methodologies
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/CA/CA-13-0023-MM.pdf#page=7
    - title: California DHCS All County Welfare Directors Letter 20-10
      href: https://www.dhcs.ca.gov/wp-content/uploads/2025/10/c20-10.pdf#page=3
    - title: New Jersey Medicaid State Plan Amendment 13-0016-MM3, S10 MAGI-Based Income Methodologies
      href: https://www.medicaid.gov/State-resource-center/Medicaid-State-Plan-Amendments/Downloads/NJ/NJ-13-0016-MM3.pdf#page=5

# 42 CFR 435.603(b) lets each state count a pregnant woman in the household of
# the other members as herself (0 here), herself plus one (1) or herself plus
# the number of children she is expected to deliver (.inf). Her own household
# always counts every expected child. States other than California and New
# Jersey are not yet researched (issue 5251); they keep 0, the treatment the
# model applied before this parameter.
