description: The Administration for Children and Families limits Head Start and Early Head Start income eligibility to families with income at or below this share of the federal poverty guidelines.

values:
  2021-01-01: 1

metadata:
  unit: /1
  period: year
  label: Head Start income limit as a share of the federal poverty guidelines
  reference:
    - title: 45 CFR 1302.12(c)(1)(i) Determining, verifying, and documenting eligibility
      href: https://www.ecfr.gov/current/title-45/subtitle-B/chapter-XIII/subchapter-B/part-1302/subpart-A/section-1302.12#p-1302.12(c)(1)(i)
    # 45 CFR 1302.12(d) lets grantees fill up to 35% of slots with families
    # between 100% and 130% of the poverty guidelines; that slot-share cap is
    # a grantee enrollment-composition rule that cannot be modeled at the
    # household level, so the discretionary ceiling is represented by
    # reforming this parameter to 1.3.
