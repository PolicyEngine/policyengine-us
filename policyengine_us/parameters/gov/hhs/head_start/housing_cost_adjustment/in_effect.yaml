description: Head Start grantees adjust family gross income for excessive housing costs when determining income eligibility if this is true.

values:
  2021-01-01: false

metadata:
  unit: bool
  period: year
  label: Head Start excessive housing cost adjustment in effect
  reference:
    # The 2024 final rule (effective October 2024) allows, but does not
    # require, programs to deduct excessive housing costs from gross income
    # when determining eligibility. Because adoption is at grantee
    # discretion, the baseline leaves the adjustment off; reforms and
    # screeners can activate it with this switch.
    - title: Supporting the Head Start Workforce and Consistent Quality Programming, 89 FR 67720 (August 21, 2024)
      href: https://www.federalregister.gov/documents/2024/08/21/2024-18279/supporting-the-head-start-workforce-and-consistent-quality-programming
