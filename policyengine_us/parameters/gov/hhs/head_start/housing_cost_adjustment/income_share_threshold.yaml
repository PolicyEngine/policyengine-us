description: Head Start grantees applying the excessive housing cost adjustment deduct housing costs exceeding this share of family gross income.

values:
  2021-01-01: 0.3

metadata:
  unit: /1
  period: year
  label: Head Start excessive housing cost income share threshold
  reference:
    # Housing costs above 30% of gross income are the excessive portion a
    # program may deduct. The adjustment took effect in October 2024; the
    # in_effect switch (off in the baseline) gates whether it applies, so
    # this threshold is defined alongside the other Head Start parameters.
    - title: Supporting the Head Start Workforce and Consistent Quality Programming, 89 FR 67720 (August 21, 2024)
      href: https://www.federalregister.gov/documents/2024/08/21/2024-18279/supporting-the-head-start-workforce-and-consistent-quality-programming
