description: Medicare limits the Part D low-income subsidy to residents of the 50 states and the District of Columbia, so residents of these other jurisdictions are ineligible.
values:
  2006-01-01:
    # Territories and freely associated states.
    - GU
    - MP
    - PR
    - PW
    - VI
    # Armed Forces mail codes, which are addresses abroad.
    - AA
    - AE
    - AP

