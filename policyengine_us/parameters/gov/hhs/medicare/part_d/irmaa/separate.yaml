description: Income-Related Monthly Adjustment Amount (IRMAA) surcharges for Medicare Part D for married filing separately, based on modified adjusted gross income (MAGI) from two years prior.
metadata:
  threshold_unit: currency-USD
  amount_unit: currency-USD
  period: month
  type: single_amount
  label: Medicare Part D IRMAA brackets for married filing separately
  # After the last announced year, the thresholds are indexed to CPI-U under
  # 42 U.S.C. 1395r(i)(5) and each adjustment amount is computed from the
  # Medicare Trustees' projected base beneficiary premium under 42 U.S.C.
  # 1395w-113(a)(7)(B); see extend_medicare_irmaa_thresholds and
  # extend_medicare_part_d_irmaa_amounts in uprating_extensions.py.
