description: Income-Related Monthly Adjustment Amount (IRMAA) surcharges for Medicare Part B for surviving spouse filers, based on modified adjusted gross income (MAGI) from two years prior.
metadata:
  threshold_unit: currency-USD
  amount_unit: currency-USD
  type: single_amount
  period: month
  label: Medicare Part B income brackets for surviving spouse filers
  # After the last announced year, each income-related adjustment amount
  # follows the Medicare Trustees' projected standard Part B premium: 42
  # U.S.C. 1395r(i)(3)(A) makes each a fixed multiple of the same
  # unsubsidized premium amount. The thresholds are indexed to CPI-U under
  # 1395r(i)(5); see extend_medicare_irmaa_thresholds in
  # uprating_extensions.py.
  reference:
    - title: 42 U.S.C. § 1395r(i)
      href: https://www.law.cornell.edu/uscode/text/42/1395r#i
    - title: 2024 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2024-medicare-parts-b-premiums-and-deductibles
    - title: 2025 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2025-medicare-parts-b-premiums-and-deductibles
    - title: 2026 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles
