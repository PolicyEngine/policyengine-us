description: The Centers for Medicare & Medicaid Services (CMS) requires this annual deductible for Medicare Part A inpatient hospital coverage.
metadata:
  unit: currency-USD
  period: year
  label: Medicare Part A deductible
  # After the last announced year, the deductible follows the Medicare
  # Trustees' projected deductible, rounded to the nearest multiple of $4 as 42
  # U.S.C. 1395e(b)(1) requires.
  uprating:
    parameter: calibration.gov.hhs.cms.medicare_part_a_deductible
    rounding:
      type: nearest
      interval: 4
  reference:
    - title: 42 U.S.C. § 1395e(b)(1)
      href: https://www.law.cornell.edu/uscode/text/42/1395e#b_1
    - title: 2024 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2024-medicare-parts-b-premiums-and-deductibles
    - title: 2025 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2025-medicare-parts-b-premiums-and-deductibles
    - title: 2026 Medicare Parts A & B Premiums and Deductibles
      href: https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles
values:
  2024-01-01: 1_632
  2025-01-01: 1_676
  2026-01-01: 1_736
