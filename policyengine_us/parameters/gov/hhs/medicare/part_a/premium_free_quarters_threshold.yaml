description: The Centers for Medicare & Medicaid Services (CMS) requires this many quarters of Medicare-covered employment for beneficiaries to qualify for premium-free Part A coverage.
metadata:
  unit: quarters
  period: year
  label: Premium-free Part A quarters threshold
  reference:
    - title: Medicare.gov - Part A costs
      href: https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles
    - title: 42 U.S. Code § 426(a) - Entitlement to hospital insurance benefits
      href: https://www.law.cornell.edu/uscode/text/42/426
    - title: 42 U.S. Code § 414(a) - Fully insured individual (no more than 40 quarters of coverage required)
      href: https://www.law.cornell.edu/uscode/text/42/414
# 40 is the ceiling under 42 USC 414(a), which requires one quarter for each year after
# 1950 and before the year a person reaches 62, and at least 6, so people reaching 62
# before 1991 needed fewer. It is applied backward to 1966 as an approximation.
values:
  1966-01-01: 40
