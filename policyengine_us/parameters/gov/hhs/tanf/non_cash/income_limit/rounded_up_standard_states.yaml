description: States publishing their TANF non-cash (SNAP BBCE) gross income standard rounded up to the next whole dollar.
values:
  2015-10-01:
    # Connecticut DSS Program Standards Chart rounds the 200% standard up
    # (e.g., 7-person 8,108.33 -> 8,109 effective 2025-10-01).
    # Maine 10-144 CMR Ch. 301 Sec. 999-3 Chart 4 rounds up (CY2025
    # 1-person 2,608.33 -> 2,609).
    # Minnesota Combined Manual October 2025 revisions and New Hampshire
    # BFA program income limits both publish 2,608.33 -> 2,609.
    # Louisiana DCFS B-640 and Oregon OAR 461-155-0180 both publish the
    # ceiling of the exact computation (2,608.33 -> 2,609; Oregon 2-person
    # 3,606.67 -> 3,607).
    # New Jersey (NJ SNAP eligibility chart) and Vermont (3SquaresVT
    # income guidelines) publish the 185% computation rounded up
    # (4,956.46 -> 4,957).
    # Arizona's CNAP expanded categorical eligibility standard rounds the
    # exact computation up (185%: 2,412.71 -> 2,413).
    - AZ
    - CT
    - LA
    - ME
    - MN
    - NH
    - NJ
    - OR
    - VT
