description: Whether the SNAP net income limit applies to elderly/disabled households seeking BBCE.
# Non-BBCE states skipped.
AL:
  2015-10-01: true
AZ:
  2015-10-01: false
AR:
  # SNAP Certification Manual Appendix AA: "While households may meet the
  # BBCE resource limit, they will still need to meet all other financial
  # and non-financial eligibility rules to receive SNAP benefits."
  2025-04-04: true
CA:
  # Elderly or disabled households with gross income at or below 200% of the
  # poverty line are conferred MCE like any other household, and MCE has no
  # net income test (CDSS ACL 13-32 note; ACL 15-42). Those above 200% are
  # not MCE and face the regular net income and resource tests instead,
  # which gross_hheod.yaml routes them to.
  # ACL 11-11 expanded MCE to all non-assistance CalFresh households on
  # 2011-02-01. Retain 2015-10-01 as this model's BBCE baseline, matching
  # the surrounding California gross, asset, and poverty-year parameters;
  # this flag alone does not establish modeled eligibility in 2011.
  2015-10-01: false
CO:
  # Expanded Categorical Eligibility households need only gross income
  # within 200% of the poverty level (10 CCR 2506-1 4.401(A)(1)); the net
  # income standard applies under Standard Eligibility (4.401(A)(3)). That
  # is the text of the version effective 11/30/2022. Dated from the start
  # of the 200% limit in gross.yaml, when 4.206 and 4.401 took this form.
  2015-10-01: true
  2018-06-01: false
CT:
  2015-10-01: false
DC:
  2015-10-01: false
DE:
  2015-10-01: false
FL:
  2015-10-01: false
GA:
  2015-10-01: false
GU:
  2015-10-01: false
HI:
  2015-10-01: false
  2022-07-01: true
IA:
  2015-10-01: false
ID:
  # Idaho exempts a household with an elderly or disabled member from the
  # gross income limit (IDAPA 16.03.04.532) and holds it to the net income
  # limit (16.03.04.549); broad-based categorically eligible households
  # stay subject to the net income standard (16.03.04.010). The archived
  # 2017 and 2022 chapters carry the same text, so the test applies from
  # the start of the series.
  2015-10-01: true
IL:
  2015-10-01: false
IN:
  2018-01-01: true
KY:
  2015-10-01: false
LA:
  2020-04-01: true
MA:
  2015-10-01: false
MD:
  2015-10-01: false
ME:
  2015-10-01: false
MI:
  2015-10-01: false
MN:
  # Units that meet BBCE are exempt from the net income test (Combined
  # Manual 0013.06, 12/2016 and 05/2025 issues). Elderly or disabled units
  # above the BBCE gross limit are not BBCE and take the regular net income
  # and asset tests, which gross_hheod.yaml routes them to. The section's
  # revision log records no policy change in 2024.
  2015-10-01: false
MS:
  # BBCE removed only the resource test: "BBCE households are subject to
  # meeting all other eligibility criteria" (MDHS SNAP Manual, Volume V,
  # Chapter 5 page 5000), and all households except "regular" categorically
  # eligible ones, where every member receives public assistance or SSI,
  # must meet the net income standard (Chapter 6 page 6101).
  2015-10-01: true
