description: Asset limit for TANF non-cash benefit used for SNAP BBCE, by state.

AL:
  # In Alabama, households with seniors or people with disabilities and gross income under 200 percent of poverty
  # do not face an asset limit. Those over 200 percent of poverty are not categorically eligible and do face a $3,500 asset
  # limit.
  # This is not yet modeled.
  # Other states with this rule are marked with a *.
  2015-10-01: .inf
AK:
  # Alaska is not in the list, indicating it has not elected to BBCE.
  # Non-BBCE states are entered as negative infinity asset limit.
  2015-10-01: -.inf
  2025-07-01: .inf
AZ:
  2015-10-01: .inf
AR:
  2015-10-01: -.inf # Non-BBCE.
  # Arkansas adopted BBCE by emergency rule effective 2025-04-04 (SNAP
  # Certification Manual 1919 and Appendix AA), made permanent on
  # 2025-07-01. Appendix D: "All Households five thousand five hundred
  # ($5,500) for twelve (12) months".
  # The $5,500 limit lasts 12 consecutive months and can be granted once
  # every five years; the standard limits apply afterward. The model has no
  # input for that clock and assumes the increase is available. Act 675 of
  # 2023 grants the increase to an enrolled household that accumulates
  # assets and the manual also grants it at application; the model cannot
  # tell the two apart.
  # Candidate: us-ar:snap-bbce-resource-increase-at-application until registered.
  2025-04-04: 5_500
CA: # *
  2015-10-01: .inf
CO: # *
  2015-10-01: .inf
