description: The US Department of Health and Human Services limits income eligibility to this percentage of the poverty guideline under the Low Income Home Energy Assistance Program.
# Section 2605(b)(2)(B) of Pub. L. 97-35 set this ceiling, or 60 percent of the
# state median income if greater, from fiscal year 1982.
values:
  1981-10-01: 1.5
