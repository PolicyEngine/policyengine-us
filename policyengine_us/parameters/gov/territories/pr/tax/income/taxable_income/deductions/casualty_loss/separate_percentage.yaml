# SEPARATE means Puerto Rico filing status 3: spouses living together at the
# end of the year who file separately. A married person not living with the
# spouse files as an individual taxpayer and claims the whole loss.
description: Puerto Rico allows each spouse filing a separate return this share of the couple's casualty losses on the principal residence and on household personal property.
values:
  2011-01-01: 0.5
