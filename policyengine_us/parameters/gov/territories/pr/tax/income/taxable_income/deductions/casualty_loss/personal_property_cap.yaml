# SEPARATE means Puerto Rico filing status 3: spouses living together at the
# end of the year who file separately. A married person not living with the
# spouse files as an individual taxpayer under the $5,000 cap.
description: Puerto Rico limits the deduction for casualty losses of automobiles, furniture and other household goods to this amount, based on filing status.
