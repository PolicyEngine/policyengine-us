description: Puerto Rico assigns this unemployment insurance contribution rate to each new employer.
values:
  # The Employment Security Act sets a new employer rate for each of eight
  # schedules, from 2.7% to 3.4%. We found no Puerto Rico agency source that
  # names the schedule in force each year, so the yearly values come from the
  # U.S. Department of Labor; for 2018 its tax measures report lists 3.1% and
  # its Significant Provisions report lists 3.2%. These rates leave out the 1%
  # special contribution, which goes to Puerto Rico's General Fund.
  2018-01-01: 0.031
  2019-01-01: 0.029
  2020-01-01: 0.028
  2022-01-01: 0.027
  2023-01-01: 0.033
  2024-01-01: 0.034
  2025-01-01: 0.031
  2026-01-01: 0.028

