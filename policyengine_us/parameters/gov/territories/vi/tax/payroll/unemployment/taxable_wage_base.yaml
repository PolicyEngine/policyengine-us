description: The Virgin Islands limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # We found no Virgin Islands Department of Labor announcement for 2018, 2020
  # or 2023, so those three years come from the U.S. Department of Labor's
  # Significant Provisions reports.
  2018-01-01: 24_200
  2019-01-01: 26_500
  2020-01-01: 28_900
  2021-01-01: 32_500
  2022-01-01: 30_800
  2023-01-01: 30_200
  2024-01-01: 31_000
  2025-01-01: 31_100
  2026-01-01: 32_100

