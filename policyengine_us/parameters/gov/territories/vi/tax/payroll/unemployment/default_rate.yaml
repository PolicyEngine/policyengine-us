description: The Virgin Islands assigns this unemployment insurance contribution rate to each new employer.
values:
  # The Legislature set this 2% rate in 24 V.I.C. Section 308(b)(2) in Act
  # 7410 (2012). In Acts 8209 (2019) and 8827 (2024) it moved experience-rated
  # employers to a payroll variation system from 2024 and left Section
  # 308(b)(2) as it stood.
  2018-01-01: 0.02

