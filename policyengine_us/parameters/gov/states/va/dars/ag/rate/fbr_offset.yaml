description: Virginia sets the maximum monthly care rate outside Planning District Eight at this amount above the federal Supplemental Security Income benefit rate under the Auxiliary Grant program.
values:
  # Derived, not stated in law: 2,130 - 994 = 1,136 (2,103 - 967 and
  # 2,079 - 943 also give 1,136). Tying the rate to the FBR passes through
  # federal increases (Item 332 A.3; 20 CFR 416.2096); a reform that lowered
  # the FBR would also lower this rate below the appropriated amount.
  2026-01-01: 1_136

metadata:
