description: Virginia excludes these sources from countable unearned income under the Auxiliary Grant program.
values:
  # Section 24.1.1 excludes interest and dividends earned on countable resources.
  # Section 24.1.2 counts interest on some excluded resources, which the inputs
  # do not identify, so all interest and dividends are excluded.
  2019-07-01:
    - dividend_income
    - interest_income

metadata:
  unit: list
  label: Virginia Auxiliary Grant non-SSI excluded unearned income sources
  reference:
