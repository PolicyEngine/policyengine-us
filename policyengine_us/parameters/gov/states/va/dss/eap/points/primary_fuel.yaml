description: Virginia awards this many benefit points for the primary heating fuel under the Energy Assistance Program.
# PLACEHOLDER: this value is a PolicyEngine placeholder set pending VDSS
# publication, not a published figure. VDSS sets the primary fuel points each
# year from an annual vendor price survey and a Virginia Tech cost and
# consumption study: the highest-cost fuel receives 20 points and each other
# fuel receives points by its cost as a percentage of all fuel costs. The
# survey results and the resulting points are not published, so 10 points
# apply to every eligible household and fuel. Plan Section 2.5 reports that
# the published FFY2025 benefits ran from $181.26 (40 points) to $634.43 (140
# points); with these placeholders the model ranges from $271.90 (60 points)
# to $557.39 (123 points).
values:
  2022-10-01: 10

