description: Virginia awards these benefit points by countable income as a whole percent of the maximum income level for the household size under the Energy Assistance Program.
# Appendix B: "Income as % of Max Level" 0 to 19 25 points, 20 to 29 20, 30 to
# 39 18, 40 to 49 15, 50 to 59 13, 60 to 69 10, 70 to 79 8, 80 to 89 5, 90 to
# 94 3, 95 to 100 1. The bands are whole percents, so thresholds are the band
# starts and the formula floors the percent before the default (lower
# inclusive) lookup; flooring is an inference, as the table gives no rule for
# fractions. The table has no row above 100 percent: only a household in which
# all members receive SSI can exceed the maximum, and it is given 0 points
# (inference).
