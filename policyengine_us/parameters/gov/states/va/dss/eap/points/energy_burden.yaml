description: Virginia awards this many benefit points for energy burden under the Energy Assistance Program.
# PLACEHOLDER: this value is a PolicyEngine placeholder set pending VDSS
# publication, not a published figure. The energy burden is the average fuel
# cost for the household's fuel type from the annual vendor survey divided by
# household income, scored 0-19% 0 points, 20-29% 5, 30-39% 8, 40-49% 10,
# 50-69% 13, 70-79% 18, 80-89% 20, 90-94% 24 and 95-100% 25. The average fuel
# costs and the income period are not published, so the 50%-69% band value of
# 13 points applies to every eligible household. Plan Section 2.5 reports that
# the published FFY2025 benefits ran from $181.26 (40 points) to $634.43 (140
# points); with these placeholders the model ranges from $271.90 (60 points)
# to $557.39 (123 points).
values:
  2022-10-01: 13

