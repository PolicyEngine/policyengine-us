description: Virginia limits fuel assistance to households whose primary heating fuel is one of these types under the Energy Assistance Program.
# Manual B.5.c.1.a: "The primary fuel will be one of the following:
# electricity, oil, kerosene, natural gas, LP gas, wood, or coal." The
# application lists clear and dyed kerosene and liquid propane (LP) or bottled
# gas. SOLAR, OTHER and NONE are not eligible primary fuels. UNSPECIFIED is
# left out, so callers must send heating_type, including households whose heat
# is included in rent.
values:
  2011-06-01:
    - ELECTRICITY
    - NATURAL_GAS
    - FUEL_OIL
    - KEROSENE
    - PROPANE
    - WOOD
    - COAL

