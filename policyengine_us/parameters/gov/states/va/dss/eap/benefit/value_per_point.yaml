description: Virginia pays this amount per benefit point under the Energy Assistance Program.
# The value per point is the season's heating allocation divided by the total
# points of all approved households, computed in December and reported in the
# following year's state plan (Section 2.5). Each value is dated to the start
# of its federal fiscal year. The FFY2026 value is not yet published, so the
# model carries the latest published (FFY2025) value forward for period 2026.
values:
  2022-10-01: 4.226444
  2023-10-01: 4.957075
  2024-10-01: 4.531665

