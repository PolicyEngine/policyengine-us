description: Virginia counts these unearned income sources under the Energy Assistance Program.
# Manual C.5.a.3.c: "Gross unearned income (regardless of deductions such as
# recoupments) received by individuals is the countable income"; C.5.a.4.c:
# "Unearned income includes all other income received by the household that is
# not received in exchange for labor, services, or produce." Plan Section 1.9
# checks unemployment insurance, strike pay, SSA benefits excluding the
# Medicare deduction, SSI, retirement and pensions, General Assistance, TANF,
# rental income, alimony, child support and VA benefits. The plan leaves
# interest, dividends and royalties unchecked, but the manual counts all gross
# unearned income and its 27 exemptions do not include them, so the manual
# controls and they count.
values:
  2025-05-01:
    - total_unemployment_compensation
    - strike_benefits
    # Exemption 15 lets the worker deduct Medicare premiums from Social
    # Security or Railroad Retirement; there is no premium input, so these
    # benefits are counted gross.
    - social_security
    - railroad_benefits
    - ssi
    - pension_income
    # Military retirement pay and survivor benefit payments.
    - military_retirement_income
    - retirement_distributions
    - survivor_benefits
    - general_assistance
    # TANF the household receives: the take-up-gated aggregate, which
    # includes va_tanf.
    - tanf
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    # Manual C.5.a.4.c names "cash contributions" as unearned income, so
    # recurring cash help from outside the household counts.
    - financial_assistance
    # Exemption 23 (VA Aid and Attendance) cannot be separated from other
    # veterans' benefits and is counted.
    - veterans_benefits
    - interest_income
    - ordinary_dividend_income
    - workers_compensation
    - disability_benefits
    # Exemption 19 excludes only non-recurring one-time income such as a
    # one-time gift, so financial_assistance should hold recurring
    # contributions only. Loans, tax refunds, scholarships, SNAP, WIC, foster
    # care payments, utility or rental allowances and the other exemptions are
    # not counted.

metadata:
  unit: list
  period: year
  label: Virginia EAP countable unearned income sources
  reference:
