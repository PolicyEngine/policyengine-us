description: Virginia counts these earned income sources under the Energy Assistance Program.
# Manual C.5.a.3: "Gross earned income or gross pay (not the 'take home' pay)
# regardless of deductions or garnisheed wages, withholding, or work expenses
# is the countable income" and "Profit from self-employment is the countable
# income." Contract income and commissions (plan Section 1.9) are reported as
# wages. The existing net self-employment, farm and pass-through inputs stand
# for profit without a further business-expense deduction, and each source is
# floored at zero in the formula so a business loss does not offset other
# income. Rental income is counted with the unearned sources.
values:
  2025-05-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

