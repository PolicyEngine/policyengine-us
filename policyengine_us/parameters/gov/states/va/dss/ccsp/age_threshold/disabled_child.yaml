description: Virginia limits the Child Care Subsidy Program to children with special needs younger than this age.
# 8VAC20-790-20(A)(1) applies the same under-18 limit to a child "under court
# supervision", so the court-supervision route shares this ceiling (CCDF Plan
# FFY 2025-2027 section 2.2.1(c), upper age 17.00).
values:
  2023-01-01: 18

metadata:
  unit: year
  period: year
  label: Virginia CCSP disabled child age threshold
