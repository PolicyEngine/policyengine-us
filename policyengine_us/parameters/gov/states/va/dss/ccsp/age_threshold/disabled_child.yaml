description: Virginia limits the Child Care Subsidy Program to children younger than this age if they are physically or mentally unable to care for themselves or are under court supervision.
# 8VAC20-790-20(A)(1) and Guidance Manual 3.3 G apply the same under-18 limit
# to both routes, matching the CCDF Plan's upper age of 17.00.
values:
  2023-01-01: 18

metadata:
  unit: year
  period: year
  label: Virginia CCSP special needs or court supervision child age threshold
