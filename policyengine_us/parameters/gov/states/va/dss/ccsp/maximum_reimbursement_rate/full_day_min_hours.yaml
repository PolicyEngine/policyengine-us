description: Virginia treats child care of at least this many hours per day as a full day under the Child Care Subsidy Program.
# The threshold applies to the full-day and part-day rate schedule modeled
# from August 2023. An explicit authorization can establish a different rate.
values:
  2023-08-01: 5

