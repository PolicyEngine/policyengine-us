description: Virginia adds this amount for each additional person under the Medicaid Low Income Families With Children program.
# Source conflict: use DMAS's dated MAGI tables for 2017-2020.
# DMAS staff apply these schedules; 12VAC30-40-220 lists lower amounts.
values:
  # Retain the existing backdated 2025 amounts outside 2018-2020.
  2015-01-01: 2_256
  2017-07-01: 1_668
  2018-07-01: 1_704
  2019-07-01: 1_752
  2020-07-01: 1_788
  2021-01-01: 2_256
  2025-07-01: 2_256
