description: Virginia assigns this unemployment insurance tax rate, including the pool cost charge and any fund building charge, to each new employer.
values:
  # Code of Virginia Section 60.2-526(B) sets 2.5%; Sections 60.2-532 and
  # 60.2-533(C) add the pool cost charge and, when the fund balance factor is
  # 50% or less, a 0.2% fund building charge. The Virginia Employment
  # Commission's rate table lists 2.53% for 2018, but its own pool-charge row,
  # the Governor's December 2017 release and the Commission's July 2026
  # presentation all give a 0.01% pool charge for 2018, which makes 2.51%.
  2018-01-01: 0.0251
  2020-01-01: 0.025
  # A 0.03% pool cost charge and the 0.2% fund building charge, for 2021 and
  # 2022.
  2021-01-01: 0.0273
  # Budget action ended the fund building charge for 2023; the 0.03% pool cost
  # charge remained.
  2023-01-01: 0.0253
  2024-01-01: 0.025
  # From 2025, Item 356 K.1 of the 2024 budget (Special Session I, Chapter 2),
  # carried in later budgets, cuts each rate by 0.05% and adds a separate
  # administrative fee of 0.05% of taxable wages, which PE-US leaves out. The
  # Commission's July 2026 presentation shows no pool cost or fund building
  # charge for 2025 or 2026.
  2025-01-01: 0.0245

