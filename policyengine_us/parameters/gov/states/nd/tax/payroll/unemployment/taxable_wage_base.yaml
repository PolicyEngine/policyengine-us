description: North Dakota limits employer unemployment insurance taxes to this amount of each worker's annual wages.
values:
  # North Dakota Century Code Section 52-04-03(3) sets the base at 70% of the
  # statewide average annual wage, rounded to the nearest $100, which Job
  # Service North Dakota computes by October 1 of the preceding year from the
  # four quarters ending that June 30; Section 52-04-03(4) keeps it at least
  # at the federal unemployment tax base. These are the bases Job Service
  # North Dakota published.
  2018-01-01: 35_500
  2019-01-01: 36_400
  2020-01-01: 37_900
  2021-01-01: 38_500
  2022-01-01: 38_400
  2023-01-01: 40_800
  2024-01-01: 43_800
  2025-01-01: 45_100
  2026-01-01: 46_600

