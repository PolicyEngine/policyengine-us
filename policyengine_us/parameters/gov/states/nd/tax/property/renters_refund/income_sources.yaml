description: North Dakota counts these income sources under the Renter's Refund program.
values:
  2025-01-01:
    - market_income
    - social_security
    - total_unemployment_compensation
    # NDCC 57-02-08.1(5)(c) counts "any county, state, or federal public
    # assistance benefits". The IRS leaves general assistance, SSI and TANF out
    # of gross income under its general welfare exclusion, which rests on IRS
    # rulings, not a statute or regulation, so no federal or state law
    # excludes them from income. SNAP (7 U.S.C. 2017(b)) and LIHEAP, including
    # nd_liheap (42 U.S.C. 8624(f)(1)), stay out because federal law excludes
    # them from income for any purpose under state law.
    - general_assistance
    - ssi
    - tanf
