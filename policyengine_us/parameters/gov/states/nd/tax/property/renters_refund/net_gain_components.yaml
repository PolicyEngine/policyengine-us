description: North Dakota counts these market income components only as a net gain under the Renter's Refund program, so a net loss doesn't reduce income.
values:
  2025-01-01:
    # Gains and losses from sales of capital assets. The applicant's and
    # spouse's amounts net together, as on line 7, and each dependent's amount
    # nets on its own, as on line 8; a net loss counts as zero.
    - capital_gains
