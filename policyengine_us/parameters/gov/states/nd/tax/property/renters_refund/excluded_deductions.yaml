description: North Dakota subtracts these federal exclusions from income under the Renter's Refund program, because the model deducts them above the line and market income still holds the income they exclude.
values:
  2025-01-01:
    # Savings bond interest spent on higher education.
    - us_bonds_for_higher_ed
    # Employer adoption assistance.
    - qualified_adoption_assistance_expense
    # Income of bona fide residents of American Samoa from sources there or
    # from a business there. IRC 931 reaches only a possession with an
    # implementing agreement in effect (26 CFR 1.931-1(c)(1)), and IRS
    # Publication 570 applies it only to American Samoa.
    - specified_possession_income
    # Income of bona fide residents of Puerto Rico from sources there.
    - puerto_rico_income
