description: North Dakota exempts the second caretaker in a Workforce Benefit household from the allowable-activity requirement under the Child Care Assistance Program if this is true.

# From June 1, 2024 (ML 3819), North Dakota exempted the second caretaker of a
# Workforce Benefit household from the activity requirement, and it kept that
# rule in ML 3862 and ML 3909. From January 1, 2026 (Release 26.1), North
# Dakota requires the second caretaker's activity. North Dakota started the
# Workforce Benefit on June 1, 2024, so the earlier false value has no effect.
values:
  0000-01-01: false
  2024-06-01: true
  2026-01-01: false

metadata:
  unit: bool
  period: year
