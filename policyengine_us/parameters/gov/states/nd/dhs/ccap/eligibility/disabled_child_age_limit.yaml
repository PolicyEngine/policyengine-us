description: North Dakota limits eligibility to children incapable of self-care or under court supervision below this age under the Child Care Assistance Program.

# Children who are physically or mentally incapable of self-care, or in need of
# supervised care as specified in a court order, are eligible through the month
# of their 19th birthday (400-28-35-02, ML 3909). Annual age cannot resolve the
# birthday month, so the model applies an exclusive under-19 ceiling.
values:
  2020-01-01: 19

