      href: https://www.nd.gov/dhs/policymanuals/415/415_25_05_20_05.htm
    - title: Energy Assistance Policy Manual 415-25-05-27-15, Treatment of Self-Employment Income
      href: https://www.nd.gov/dhs/policymanuals/415/415_25_05_27_15.htm
