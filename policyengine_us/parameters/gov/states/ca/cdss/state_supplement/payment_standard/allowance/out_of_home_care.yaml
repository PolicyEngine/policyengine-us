values:
  1991-01-01: 302 # $709 - $407
  # Shares for 1992 through 2012 are not added yet, so the 1991 share carries forward (issue 10480).
  2013-01-01: 412
  2017-01-01: 423.37
  2022-01-01: 524.77
  2023-01-01: 578.82
  # SSA POMS, the CDSS 2026 May Revision and ACIN I-59-25 list $3,252.14 for couples,
  # twice the $1,626.07 individual rate (WIC 12200(g) sets the amount per recipient).
  # The CDSS monthly payment table and SSA pamphlet EN-05-11125 list $3,239.14.
  # The share holds for January 2024 through 2026, and CDSS projects it for January 2027.
  2024-01-01: 632.07
