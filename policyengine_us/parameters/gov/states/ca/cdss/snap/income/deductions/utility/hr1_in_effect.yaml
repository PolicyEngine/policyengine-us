description: California limits qualification for the Standard Utility Allowance through receipt of energy assistance, including the State Utility Assistance Subsidy, to households with an elderly or disabled member under the Supplemental Nutrition Assistance Program when this is true. The 2025-11-01 date is a proxy. California applies the change upon completion of CalSAWS automation, at initial certification and at the next recertification, and has not published that date; 2025-11-01 is the end of the federal 120-day Quality Control variance exclusion for section 10103 named in ACL 25-68. Switching on at a month boundary for every household also approximates the certification and recertification timing, which is not modelled.

values:
  0000-01-01: false
  2025-11-01: true

metadata:
  unit: bool
  period: month
