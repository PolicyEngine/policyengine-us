description: California extends CalWORKs Stage One child care to disabled or court-supervised children below this age under the California Work Opportunity and Responsibility to Kids program.
# MPP 47-201.2 limits both routes to the MPP 42-101 age: under 18, with an
# extension for 18-year-old students (see student_age_threshold).
values:
  2017-11-16: 18

