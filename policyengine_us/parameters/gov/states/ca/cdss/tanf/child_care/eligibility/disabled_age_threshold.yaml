description: California limits CalWORKs Stage One child care for a disabled or court-supervised child to children younger than this age, or of this age and a full-time high school student, under the CalWORKs program.
# MPP 47-201.2 limits both routes to the MPP 42-101 age: under 18, or 18 and a
# full-time high school or vocational student expected to finish before 19.
values:
  2017-11-16: 18

