description: California extends CalWORKs Stage One child care to disabled or court-supervised full-time students below this age under the California Work Opportunity and Responsibility to Kids program.
# MPP 42-101.2 covers an 18-year-old full-time high school or vocational
# student expected to finish before 19; MPP 42-101.4-.6 cover a disabled
# 18-year-old who attends school full-time until 19.
values:
  2017-11-16: 19

