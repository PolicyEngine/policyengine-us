description: California provides CalWORKs Stage One child care to children below this age under the California Work Opportunity and Responsibility to Kids program.
# WIC 11323.2(a)(1)(A) covers a child "12 years of age or under"; MPP 47-201.2
# and .3 cover children 10 or younger and 11- and 12-year-olds.
values:
  2017-11-16: 13

