description: California limits the County Children's Health Initiative Program to children whose household income is at or below this fraction of the federal poverty guideline.
values:
  # The state plan expresses the band as "above 261 percent of the FPL up to and
  # including 317 percent of the FPL" before the MAGI conversion; DHCS publishes
  # the converted limits as 266 to 322 percent. The lower bound is not a separate
  # parameter because CCHIP only covers children who are not eligible for
  # no-cost Medi-Cal, so the model's Medi-Cal child limit for California
  # (gov.hhs.medicaid.eligibility.categories.*.income_limit.CA, 2.66) is the
  # effective floor.
  2014-01-01: 3.22
