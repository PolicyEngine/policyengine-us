description: California limits employee State Disability Insurance contributions to wages up to this amount per employee.
values:
  # DE 3395 Rev. 55 lists limits from 2006; earlier years reuse the 2006 limit.
  0000-01-01: 79_418
  2007-01-01: 83_389
  2008-01-01: 86_698
  2009-01-01: 90_669
  2010-01-01: 93_316
  2012-01-01: 95_585
  2013-01-01: 100_880
  2014-01-01: 101_636
  2015-01-01: 104_378
  2016-01-01: 106_742
  2017-01-01: 110_902
  2018-01-01: 114_967
  2019-01-01: 118_371
  2020-01-01: 122_909
  2021-01-01: 128_298
  2022-01-01: 145_600
  2023-01-01: 153_164
