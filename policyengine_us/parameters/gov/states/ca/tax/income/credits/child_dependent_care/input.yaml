description: California uses this input for the state child/dependent care credit, based on year.
values:
  # FTB 3506 applies the federal decimal (line 7) to California's own
  # expense and earned income limits (lines 3-6), not to the federal credit.
  # R&TC 17052.6 has done so since 2000, so the California computation
  # applies in every year, including years before 2021.
  2012-01-01:
  - ca_federal_capped_cdcc
