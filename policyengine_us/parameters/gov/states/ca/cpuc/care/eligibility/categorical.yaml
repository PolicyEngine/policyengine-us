description: California provides CARE eligibility to households that are enrolled in these programs.
values:
  2022-06-01:
    - medicaid_enrolled
    - wic
    - receives_wic # Reported WIC receipt, for people the model gives a $0 benefit.
    - snap
    - receives_snap # Reported SNAP receipt, for households the model gives a $0 allotment.
    - ssi
    - receives_ssi # Reported SSI receipt, for people the model gives a $0 payment.
    - tanf
    - receives_tanf # Reported TANF receipt, for households the model gives a $0 benefit.
    # Also these, not in our model:
    # National School Lunch Program free lunch. free_school_meals cannot stand
    # in for it: California has provided free school meals to every student
    # since July 2022, so the model gives every household with school-age
    # children the free tier regardless of income.
    # Healthy Families A & B
    # LIHEAP
    # Bureau of Indian Affairs General Assistance
metadata:
  reference:
    # Legal code establishes categorical eligibility in general, not specific programs.
    - title: California Public Utilities Code 739.1(f)(1)
      href: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PUC&sectionNum=739.1
    # Program defines categorical eligibility programs; only Head Start is
    # limited to tribal households.
    - title: CPUC CARE/FERA Program, Public Assistance Eligibility
      href: https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/electric-costs/care-fera-program
    - title: PG&E Form 01-9077, CARE/FERA Program Application, Section 2A
      href: https://www.pge.com/assets/pge/localized/en/docs/account/billing-and-assistance/care-fera-application.pdf#page=2
    # TANF has been a CARE categorical program since D.06-12-038; D.08-11-031
    # lists it among the existing programs, before the 2022-06-01 start here.
    - title: CPUC Decision 08-11-031, CARE categorical eligibility programs approved in D.06-12-038
      href: https://docs.cpuc.ca.gov/word_pdf/FINAL_DECISION/93648.pdf#page=36
  unit: list
  label: California CARE categorical eligibility programs
