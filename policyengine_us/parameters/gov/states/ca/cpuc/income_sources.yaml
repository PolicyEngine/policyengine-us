description: >-
  Income sources counted toward CA CPUC CARE/FERA eligibility.
  Total gross annual household income includes all taxable and
  non-taxable revenues from all people living in the home, from
  whatever sources derived, including, but not limited to, wages,
  salaries, interest, dividends, spousal and child support payments,
  public assistance payments, Social Security and pensions, housing
  and military subsidies, rental income, income from self-employment
  and all employment-related, non-cash income.
# Quoted verbatim from the footnote to the CARE and FERA Income Guidelines
# tables on PG&E Form 01-9077, CARE/FERA Program Application (Rev. 6.26); the
# same footnote appears on the CPUC-filed tariff sheet. Each entry below names
# the phrase it implements.
values:
  0000-01-01:
  # Wages, salaries
  - employment_income
  # Self-employment
  - self_employment_income
  - sstb_self_employment_income
  - partnership_s_corp_income
  - farm_operations_income
  # Interest
  - interest_income
  # Dividends
  - dividend_income
  # Spousal support
  - alimony_income
  # Child support
  - child_support_received
  # Public assistance payments
  - tanf
  - ssi
  - snap
  - wic
  # Social Security
  - social_security
  # Pensions
  - pension_income
  - retirement_distributions
  # Housing subsidies
  #
  # The form lists "housing and military subsidies" among the revenues that
  # make up total gross annual household income, with no netting against rent,
  # no cap and no poverty-measurement valuation anywhere on it - so the entry
  # is the housing subsidy itself, at the amount the model computes for the
  # household, exactly as snap, tanf, ssi and wic above are this model's
  # amounts rather than an applicant's reported ones.
  #
  # It was spm_unit_capped_housing_subsidy, the Census SPM's housing subsidy
  # capped at the housing portion of the SPM threshold less the tenant
  # payment. That cap belongs to the poverty measure, not to this form, and it
  # made a utility discount depend on which SPM geography the request
  # selected: a Los Angeles renter earning $40,700 with $23,790 of housing
  # assistance had a $0 capped subsidy under national selection and $310.88
  # under county selection, moving countable income across the CARE limit and
  # flipping ca_care_eligible from true to false. Requesting CARE with no SPM
  # configuration at all raised SPM_GEOGRAPHY_REQUIRED.
  - housing_assistance
  # Military subsidies
  - veterans_benefits
  - military_service_income
  # Rental income
  - rental_income
  - farm_rent_income
  # Other income sources (from whatever sources derived)
  - capital_gains
  - unemployment_compensation
  - miscellaneous_income
  - gi_cash_assistance
  - debt_relief
  - illicit_income


