description: California limits the Family Electric Rate Assistance program to households with at least this many people.
values:
  2022-06-01: 3
  # SB 1130 removed the three-person minimum from Public Utilities Code
  # 739.12(a) effective January 1, 2025; the utilities began enrolling one- and
  # two-person households on June 1, 2025. ca_fera_eligible is defined by year
  # and reads this value at January 1, so model year 2025 still applies the
  # three-person minimum and one- and two-person households qualify from 2026.
  2025-06-01: 1
