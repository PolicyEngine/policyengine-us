description: PolicyEngine applies this age schedule to Temporary Protected Status holders under California's Medi-Cal program.
metadata:
  period: year
  amount_unit: bool
  threshold_unit: year
  type: single_amount
  label: California state-funded Medicaid TPS eligibility
  reference:
    - title: California Welfare and Institutions Code Section 14007.8
      href: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=14007.8.&lawCode=WIC
    - title: Los Angeles County Department of Public Social Services, Coverage For Immigrants Under Health Care Reform
      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/medi-cal/general/cov-imm.html

# The model applied these ages and dates to TPS holders while they shared
# the undocumented schedule. The references do not date their coverage
# this way. Los Angeles County's manual gives TPS holders restricted scope
# unless they declare PRUCOL, and full scope to minors under 19 through SB
# 75. Both point to the undocumented schedule for TPS holders who declare
# no PRUCOL. DACA recipients read eligible_with_daca.
# The formula never reads the 2026-01-01 values at baseline: from 2026 it
# returns true for TPS holders at every age.
brackets:
  - threshold:
      2016-01-01: 0
    amount:
      2016-01-01: true
  - threshold:
      2016-01-01: 19
    amount:
      2016-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 26
    amount:
      2016-01-01: false
      2024-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 50
    amount:
      2016-01-01: false
      2022-01-01: true
      2026-01-01: false
