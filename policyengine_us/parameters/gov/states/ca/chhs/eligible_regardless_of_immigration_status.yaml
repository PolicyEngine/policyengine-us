description: California provides state-funded Medicaid to undocumented immigrants, based on the age.
metadata:
  period: year
  amount_unit: bool
  threshold_unit: year
  type: single_amount
  label: California state-funded Medicaid undocumented immigrant eligibility
  reference:
    # We currently do not include pregnancy/emergency services 
    - title: California Welfare and Institutions Code Section 14007.8
      href: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=14007.8.&lawCode=WIC
    - title: California 2017-18 Governor's Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2017-18/pdf/BudgetSummary/HealthandHumanServices.pdf#page=9
    - title: California 2019-20 Enacted Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2019-20/pdf/Enacted/BudgetSummary/HealthandHumanServices.pdf#page=4
    - title: California 2021-22 Enacted Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2021-22/pdf/Enacted/BudgetSummary/HealthandHumanServices.pdf#page=1
    - title: California 2022-23 Governor's Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2022-23/pdf/BudgetSummary/HealthandHumanServices.pdf#page=16
    - title: California 2024-25 Enacted Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2024-25/pdf/Enacted/BudgetSummary/HealthandHumanServices.pdf#page=2
    - title: California 2025-26 Enacted Budget Summary, Health and Human Services
      href: https://www.ebudget.ca.gov/2025-26/pdf/Enacted/BudgetSummary/HealthandHumanServices.pdf#page=2
    - title: "Legislative Analyst's Office, The 2022-23 Budget: Health Care Access and Affordability"
      href: https://lao.ca.gov/reports/2022/4560/Health-Care-Access-Affordability-022322.pdf#page=4
    - title: Los Angeles County Department of Public Social Services, Full Scope Medi-Cal for Children and Young Adults
      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/medi-cal/general/fullscope.html
    - title: Los Angeles County Department of Public Social Services, Full Scope Medi-Cal For Older Adult Expansion
      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/medi-cal/general/oae.html

brackets:
  - threshold:
      2016-01-01: 0    
    amount:
      # Section 14007.8 (a)(1) covers ages 25 and under and gives no date.
      # Children under 19: full scope from May 1, 2016 (Los Angeles County's
      # Medi-Cal manual).
      # YEAR-defined formulas read January 1, so this value first applies in 2017.
      2016-01-01: false
      2016-05-01: true
  - threshold:
      2016-01-01: 19
    amount:
      # Ages 19 to 25: full scope from January 1, 2020 (Los Angeles County's
      # Medi-Cal manual). Section 14007.8 (a)(1) covers them and gives no date.
      # Section 14007.8 (b)(1) limits people aged 19 and over who apply on or
      # after January 1, 2026 to pregnancy-related and emergency services.
      2016-01-01: false
      2020-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 26
    amount:
      # Ages 26 to 49: full scope from January 1, 2024 (2024-25 Enacted Budget
      # Summary). Section 14007.8 (a)(2)(B) sets that day as the latest start:
      # "no later than January 1, 2024".
      2016-01-01: false
      2024-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 50
    amount:
      # Ages 50 and over: full scope from May 1, 2022 (2022-23 Governor's
      # Budget Summary and Los Angeles County's Medi-Cal manual). Section
      # 14007.8 (a)(2)(A) sets that day as the earliest start: "no sooner than
      # May 1, 2022".
      # YEAR-defined formulas read January 1, so this value first applies in 2023.
      2016-01-01: false
      2022-05-01: true
      2026-01-01: false
