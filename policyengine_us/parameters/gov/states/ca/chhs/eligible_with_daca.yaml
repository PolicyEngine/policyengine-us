description: California covers Deferred Action for Childhood Arrivals recipients at these ages under the Medi-Cal program.
metadata:
  period: year
  amount_unit: bool
  threshold_unit: year
  type: single_amount
  label: California state-funded Medicaid DACA eligibility
  reference:
    - title: "California Department of Finance, 2015-16 May Revision, Health and Human Services"
      href: https://www.ebudget.ca.gov/2015-16/pdf/Revised/BudgetSummary/HealthandHumanServices.pdf#page=1
    - title: "Office of the Governor of California, statement on health care access for DACA recipients, April 13, 2023"
      href: https://www.gov.ca.gov/2023/04/13/governor-newsom-on-biden-administration-announcement-expanding-health-care-access-to-daca-recipients/
    - title: "California Department of Health Services, form MC 13 (11/99), Statement of Citizenship, Alienage, and Immigration Status"
      href: https://smcgov.org/media/63316/download#page=2
    - title: "Assembly Budget Subcommittee No. 1 on Health and Human Services, agenda, February 11, 2010"
