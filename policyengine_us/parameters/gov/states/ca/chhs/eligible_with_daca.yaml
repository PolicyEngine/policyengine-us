      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/calworks/reception-and-application/mc-for-cw-ineligible-members.html

# California counts deferred action as permanent residence under color of
# law (PRUCOL). Its general PRUCOL sources give PRUCOL residents
# state-funded full-scope Medi-Cal and state no age ceiling. Form MC 13
# (11/99) lists deferred action among the PRUCOL
# categories. The 2015-16 May Revision says PRUCOL status "qualifies
# individuals for state-funded full-scope Medi-Cal". The Governor's office
# said in April 2023 that DACA recipients "are currently covered", and
# Covered California said the same in July 2025. The one state source cited
# here from 2016 to 2022, a 2021 public health memo, speaks of PRUCOL. Los
# Angeles County's 2016 page names DACA. Its 2019 page gives state-funded
# full scope to PRUCOL parents and siblings aged 19 or older in CalWORKs
# families, DACA recipients among them.
# The model applies the all-age DACA route from its first year, 2015, based
# on the earlier statewide PRUCOL rule and later DACA-specific guidance. The
# 2016 date matches the other California schedules, and backdating carries
# it to 2015.
brackets:
  - threshold:
      2016-01-01: 0
    amount:
      2016-01-01: true
