description: PolicyEngine applies this age schedule to Deferred Action for Childhood Arrivals and Temporary Protected Status holders under California's Medi-Cal program.
metadata:
  period: year
  amount_unit: bool
  threshold_unit: year
  type: single_amount
  label: California state-funded Medicaid DACA and TPS eligibility
  reference:
    - title: California Welfare and Institutions Code Section 14007.8
      href: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=14007.8.&lawCode=WIC
    - title: Los Angeles County Department of Public Social Services, Coverage For Immigrants Under Health Care Reform
      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/medi-cal/general/cov-imm.html
    - title: Los Angeles County Department of Public Social Services, 40-103.44 Medi-Cal for CalWORKs Ineligible Members
      href: https://my.dpss.lacounty.gov/public/en/home/epolicy/program/calworks/reception-and-application/mc-for-cw-ineligible-members.html
    - title: Office of the Governor of California, statement on health care access for DACA recipients, April 13, 2023
      href: https://www.gov.ca.gov/2023/04/13/governor-newsom-on-biden-administration-announcement-expanding-health-care-access-to-daca-recipients/

# The model applied these ages and dates to DACA and TPS holders while they
# shared the undocumented schedule. The references do not date their
# coverage this way.
# DACA: Los Angeles County's manual treats DACA as PRUCOL and gives PRUCOL
# adults state-funded full-scope Medi-Cal, and the Governor's office said in
# April 2023 that the state already covered DACA recipients. Both conflict
# with the false values at ages 26 to 49 before 2024.
# TPS: the county's manual gives TPS holders restricted scope unless they
# declare PRUCOL, and full scope to minors under 19 through SB 75. Both point
# to the undocumented schedule for TPS holders who declare no PRUCOL, under
# the rules of 2016 and 2019. Neither shows how the later expansions or the
# freeze treat TPS holders.
# From 2026, the freeze branch ignores the calculated age result for DACA
# and TPS holders.
brackets:
  - threshold:
      2016-01-01: 0
    amount:
      2016-01-01: true
  - threshold:
      2016-01-01: 19
    amount:
      2016-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 26
    amount:
      2016-01-01: false
      2024-01-01: true
      2026-01-01: false
  - threshold:
      2016-01-01: 50
    amount:
      2016-01-01: false
      2022-01-01: true
      2026-01-01: false
