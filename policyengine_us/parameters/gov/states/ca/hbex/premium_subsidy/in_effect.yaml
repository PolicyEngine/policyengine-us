description: California provides state premium subsidies when this is true under the California Premium Subsidy program.
values:
  # The provision runs from PY2026, matching the New Mexico and Maryland approach
  # (ending 2028-01-01). PY2026 and PY2027 both have board-adopted, verified
  # program designs: the PY2027 Program Design V4 (adopted Board Resolution
  # 2026-22, June 18 2026; funded by the 2026 Budget Act $300M HCARF) changes the
  # schedule, so PY2027 is NOT a carry-forward of PY2026 (see the applicable
  # percentage and fpl_limit files). Section 100800(c) has the Exchange adopt the
  # design annually upon appropriation and Section 100825 creates no entitlement,
  # so the provision ends 2028-01-01 absent a verified PY2028 design.
  #
  # The Program Design's enhanced-PTC trigger ("state subsidy applies if the
  # federal enhanced PTC is not extended by Sept 30 2025") fired, so the residual
  # state subsidy is live. For filers this residual self-extinguishes under an
  # enhanced-PTC-restoration reform via the direct residual formula, so no
  # conditioning logic on the federal enhanced PTC is needed here.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

