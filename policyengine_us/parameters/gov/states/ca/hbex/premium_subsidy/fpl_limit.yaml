description: California limits income eligibility to this share of the federal poverty line under the California Premium Subsidy program.
values:
  # Each limit is inclusive and applies to the exact income-to-FPL ratio, not
  # the truncated aca_magi_fraction.
  # PY2026 Program Design (d)(7): "at or below 165 percent".
  2026-01-01: 1.65
  # Final 2027 Program Design (d)(7): "at or below 200 percent".
  # The OE27 enroller deck conflicts with (d)(7) at 200%: its summary slide says
  # the subsidy "applies only to enrollees up to under 200% FPL", while its own
  # worked example at exactly 200% FPL applies the 5.28% rate. Follow the
  # adopted Design.
  # Candidate: us-ca:premium-subsidy-200-fpl-limit until registered.
  2027-01-01: 2.0

metadata:
