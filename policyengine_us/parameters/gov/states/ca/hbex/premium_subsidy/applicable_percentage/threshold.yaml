description: California sets the federal poverty line thresholds for the applicable percentage brackets under the California Premium Subsidy program.
values:
  # 150% is untiered in the Program Design prose but sits in the 3.19% band:
  # the Explainer labels the band "150% - At or Below 165%", and under
  # 26 CFR 1.36B-3(g)(2) FPL-percentage truncation to 2 decimals collapses
  # [150%, 151%) to 1.50, so 150% takes the 150-165% bracket rate.
  2026-01-01:
    - 1
    - 1.5
    - 1.65
  # PY2027 Program Design V4 (adopted Board Res. 2026-22) widens the top band
  # to under 200% FPL, adding a 165-200% bracket.
  2027-01-01:
    - 1
    - 1.5
    - 1.65
    - 2.0

