description: California sets this share of the federal poverty line as the income eligibility floor under the California Premium Subsidy program.
values:
  # The 2026 and Final 2027 Program Designs (d)(7) both start the band "at or
  # above 100 percent" of the federal poverty level.
  2026-01-01: 1

