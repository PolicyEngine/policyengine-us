description: California truncates poverty guideline income thresholds to the cent, instead of rounding them to the nearest cent, if this is true under the Low Income Home Energy Assistance Program.
# Inferred from the published rows, not an express rounding direction. The
# FY2026 table rounds to the nearest cent ($2,203.13 for two people at 125% of
# the guideline); the FY2027 table truncates ($2,254.16, not $2,254.17).
values:
  2025-10-01: false
  2026-10-01: true

