description: California uses these federal poverty guideline rates as ordinary poverty-group upper boundaries under the Low Income Home Energy Assistance Program.
# Upper bounds are inclusive after monthly-cent rounding. Above-SMI categorically eligible households use the fourth group even when their ordinary fourth-group interval is empty.
values:
  2025-10-01:
    - 1
    - 1.25
    - 1.5

