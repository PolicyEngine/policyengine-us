description: California uses federal poverty guidelines from this many years before the modeled heating season for poverty groups and the federal income floor under the Low Income Home Energy Assistance Program.
# The FY2026 matrix uses the 2025 guidelines, which HHS made mandatory from
# October 1, 2025. The same lag applies to the income floor. Other years are
# unverified and use their corresponding lagged guidelines.
values:
  2025-10-01: 1

metadata:
  unit: year
  period: year
  label: California LIHEAP federal poverty guideline year lag
