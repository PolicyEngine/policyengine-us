description: California counts these unearned income sources under the Low Income Home Energy Assistance Program.
# SSI and state SSP are monthly and are annualized once by aggregation. TANF counts actual take-up once per household; unemployment uses reported or modeled payments. Pension and retirement-distribution aggregates include their own subcomponents, but military retirement pay is separate. Interest use, housing-directed cash aid, royalties, jury pay and unusual insurance receipts need more detail than existing inputs provide. SNAP and friends/relative cash gifts are excluded.
