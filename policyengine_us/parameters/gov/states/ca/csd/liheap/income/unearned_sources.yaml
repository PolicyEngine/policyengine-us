description: California counts these unearned income sources under the Low Income Home Energy Assistance Program.
# SSI and state SSP are monthly and are annualized once by aggregation. Pension and retirement-distribution aggregates include their own subcomponents. Interest use, housing-directed cash aid, royalties, jury pay and unusual insurance receipts need more detail than existing inputs provide. SNAP and friends/relative cash gifts are excluded.
