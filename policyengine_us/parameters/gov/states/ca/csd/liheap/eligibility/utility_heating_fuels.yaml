description: California treats heat included in rent as a utility cost for households heating with these fuels under the Low Income Home Energy Assistance Program.
# The guide computes a solar customer's energy cost from the electric and gas
# charges and requires an out-of-pocket cost such as a minimum delivery charge.
values:
  2025-10-01:
    - ELECTRICITY
    - NATURAL_GAS
    - SOLAR

