description: Oklahoma counts these sources in gross household income for its sales tax credit and property tax credit.
values:
  2021-01-01:
    - irs_employment_income
    # Form 538-S line 1 counts wages "including nontaxable income from your
    # W-2s", and its definition names "a dependent care reimbursement
    # account" (2025 Form 511 packet, pages 50 and 52). Box 1 wages
    # (irs_employment_income) leave these benefits out. Elective deferrals to
    # a 401(k) or traditional IRA stay out: the definition excludes income
    # "deferred for federal income tax purposes".
    - dependent_care_employer_benefits
    - self_employment_income
    - sstb_self_employment_income
    - partnership_s_corp_income
    - farm_operations_income
    - farm_rent_income
    - short_term_capital_gains
    - long_term_capital_gains
    - interest_income
    - rental_income
    # Forms 538-S and 538-H, line 11: gross (positive) income from rentals,
    # royalties, partnerships, estates and trusts.
    - estate_income
    - dividend_income
    - pension_income
    # OAC 710:50-15-96(c) and Form 538-S line 6: pensions and annuities, taxable
    # or not, including military retired pay and survivor annuities, which
    # pension_income leaves out.
    - military_retirement_income
    # Form 538-S line 6: "Other pensions, annuities, and Individual
    # Retirement Accounts (IRAs)" (2025 Form 511 packet, page 50); deferred
    # income counts "when distributed", and a Roth IRA's distributed earnings
    # count (page 52). retirement_distributions covers IRA, 401(k), 403(b),
    # SEP and Keogh distributions, which pension_income leaves out. It counts
    # a Roth distribution in full, since the inputs don't separate returned
    # contributions from earnings.
    - retirement_distributions
    - debt_relief
    - total_unemployment_compensation
    - workers_compensation
    - social_security
    - alimony_income
    - child_support_received
    - illicit_income
    - miscellaneous_income
    - ssi
    - ok_ssp
    - general_assistance
    # 68 O.S. 2904(3) and 5012 and Form 538-S's definition: "public assistance
    # payments" (Title 68, pages 1373 and 1635; 2025 Form 511 packet, page
    # 52); Form 538-H line 10: public assistance (page 1). The sales tax
    # credit denies the credit to TANF recipients (ok_stc), so this matters
    # for the property tax credit.
    - tanf
    # 68 O.S. 2904(3) and 5012, OAC 710:50-15-96(c) and Form 538-S's
    # definition: "veterans' disability compensation" (Title 68, pages 1373
    # and 1635; 2025 Form 511 packet, page 52).
    - veterans_benefits
    # Same sources: "loss-of-time insurance payments".
    - disability_benefits
    # Form 538-S's definition and Form 538-H's Part 2 instructions: "school
    # grants or scholarships" (2025 Form 511 packet, page 52; Form 538-H,
    # page 3).
    - educational_assistance
    # 68 O.S. 2904(3) and 5012: "income of every type, regardless of the
    # source" (Title 68, pages 1373 and 1635); OAC 710:50-15-96(c): "any
    # other type of income"; Form 538-S line 13, other income (2025 Form 511
    # packet, page 51).
    - gambling_winnings
    # 68 O.S. 2904(3) and 5012: income counts "whether such income was taxable
    # or nontaxable for federal or state income tax purposes" (Title 68,
    # pages 1373 and 1635); OAC 710:50-15-96(c). The IRC 911 exclusion leaves
    # foreign earned income out of the wage inputs.
    - section_911_excluded_income
    # Form 538-S line 9: "Earned Income Credit (EIC) received in 2025 (if
    # applicable, combine federal and Oklahoma amounts)" (2025 Form 511
    # packet, page 51). PolicyEngine counts the credits on the year's own
    # return rather than the credits received during the year. The Oklahoma
    # credit was nonrefundable in 2021, so it lowered tax rather than being
    # income received; it joins the list in 2022.
    - eitc
  2022-01-01:
    # The 2021 list (see the comments there), plus the Oklahoma earned
    # income credit.
    - irs_employment_income
    - dependent_care_employer_benefits
    - self_employment_income
    - sstb_self_employment_income
    - partnership_s_corp_income
    - farm_operations_income
    - farm_rent_income
    - short_term_capital_gains
    - long_term_capital_gains
    - interest_income
    - rental_income
    - estate_income
    - dividend_income
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - debt_relief
    - total_unemployment_compensation
    - workers_compensation
    - social_security
    - alimony_income
    - child_support_received
    - illicit_income
    - miscellaneous_income
    - ssi
    - ok_ssp
    - general_assistance
    - tanf
    - veterans_benefits
    - disability_benefits
    - educational_assistance
    - gambling_winnings
    - section_911_excluded_income
    - eitc
    # The Oklahoma earned income credit was made refundable in 2022 (2022 Form
    # 511 packet, "What's new", page 3). Form 538-S line 9 asks to "combine
    # federal and Oklahoma amounts" only from 2024 (2024 Form 511 packet,
    # page 51); for 2022 and 2023 it counts under 68 O.S. 2904(3) and 5012,
    # income "of every type, regardless of the source" (Title 68, pages 1373
    # and 1635).
    - ok_eitc

