description: Oklahoma counts these sources when determining gross income for its sales tax credit.
values:
  2021-01-01:
    - irs_employment_income
    - self_employment_income
    - sstb_self_employment_income
    - partnership_s_corp_income
    - farm_operations_income
    - farm_rent_income
    - short_term_capital_gains
    - long_term_capital_gains
    - interest_income
    - rental_income
    # Forms 538-S and 538-H, line 11: gross (positive) income from rentals,
    # royalties, partnerships, estates and trusts.
    - estate_income
    - dividend_income
    - pension_income
    - debt_relief
    - unemployment_compensation
    - workers_compensation
    - social_security
    - alimony_income
    - child_support_received
    - illicit_income
    - miscellaneous_income
    - ssi
    # - ok_state_supplement
    - general_assistance
    - eitc

