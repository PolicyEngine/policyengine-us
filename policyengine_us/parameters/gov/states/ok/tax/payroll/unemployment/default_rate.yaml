description: Oklahoma assigns this unemployment insurance tax rate, including the Technology Reinvestment Apportionment, to each new employer.
values:
  # 40 O.S. Section 3-110.1 assigns 1.5% to each employer without enough
  # experience for an earned rate. Section 3-109.3 cuts each rate by 5% for
  # 2018 through 2022 and again for 2023 through 2027, and Section 6-204(B)
  # charges assigned-rate employers a Technology Reinvestment Apportionment
  # equal to that cut, so a new employer pays 1.5% of taxable wages in all.
  2018-01-01: 0.015

