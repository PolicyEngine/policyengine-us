description: Oklahoma sets the annual unemployment insurance taxable wage base at this amount under the Unemployment Insurance program.

values:
  # 40 O.S. §1-223 sets the taxable wage base as a conditional-factor share of
  # the state's average annual wage. The pre-Laws-2025 ladder ran 40 / 42.5 /
  # 45 / 47.5 / 50% across factors A-D; conditional factor "D" applies for
  # 2022-2025 and factor "A" for 2026. The Laws 2025 ladder (effective
  # Nov. 1, 2025) resets these shares, which is why the 2026 base falls below
  # the 2025 base rather than rising. Values below are the OESC-published
  # taxable wage bases, so no recomputation from the ladder is required.
  0000-01-01: 27_000
  2022-01-01: 24_800
  2023-01-01: 25_700
  2024-01-01: 27_000
  2025-01-01: 28_200
  2026-01-01: 25_000

