description: Oklahoma limits employer unemployment insurance taxes to this amount of each worker's annual wages.
values:
  # 40 O.S. Section 1-201(48) sets taxable wages at a percentage of the
  # state's average annual wage for the second preceding year, as the Oklahoma
  # Employment Security Commission determines it, rounded to the nearest $100;
  # Section 1-223 sets the percentage by the conditional factor in place.
  # Through 2025 these are the bases the Commission published.
  2018-01-01: 17_600
  2019-01-01: 18_100
  2020-01-01: 18_700
  # Conditional factor D, with its 50% share, applied from 2021 through 2025.
  2021-01-01: 24_000
  2022-01-01: 24_800
  2023-01-01: 25_700
  2024-01-01: 27_000
  2025-01-01: 28_200
  # The Commission's 2026 notice gives conditional factor A and a $58,765.95
  # average annual wage. Laws 2025, chapter 140 (Senate Bill 911), in force
  # from November 1, 2025, set condition A's share at 41.25%, so the base is
  # $24,200 ($24,240.95 rounded to the nearest $100). The notice lists
  # $25,000, which equals the earlier 42.5% share.
  2026-01-01: 24_200

