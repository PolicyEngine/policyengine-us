description: Oklahoma limits unemployment compensation benefits to this amount within a benefit year under the Unemployment Insurance program.

values:
  # 40 O.S. §2-106(2) defines the statutory cap as a conditional-factor
  # percentage of the state's average annual wage. From 2023 onward the
  # OESC-published values below are the 16 x maximum-WBA proxies OESC
  # publishes rather than the statutory %-of-average-annual-wage figure; this
  # parameter never binds after 2023 because the 16-week duration cap on WBA
  # is the lesser amount.
  2022-01-01: 9_900
  2023-01-01: 7_888
  2024-01-01: 8_304
  2025-01-01: 8_656
  2026-01-01: 10_384

