description: Oklahoma assigns this payment band based on net monthly income under the Low Income Home Energy Assistance Program.
# Printed lower bounds are inclusive; retained cents remain in the lower
# band until income reaches 401 or 701.
brackets:
  - threshold:
      2021-10-01: 0
    amount:
      2021-10-01: 1
  - threshold:
      2021-10-01: 401
    amount:
      2021-10-01: 2
  - threshold:
      2021-10-01: 701
    amount:
      2021-10-01: 3

metadata:
  type: single_amount
  threshold_unit: currency-USD
  amount_unit: /1
  period: month
  label: Oklahoma LIHEAP net monthly income band
