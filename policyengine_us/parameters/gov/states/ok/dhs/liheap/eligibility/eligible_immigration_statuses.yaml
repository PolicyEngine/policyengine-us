description: Oklahoma allows these represented citizenship and immigration statuses, subject to the incorporated qualified-alien waiting rule, under the Low Income Home Energy Assistance Program.
# The current OAC incorporates 7 CFR 273.4, whose FY2026/FY2027 text is
# unchanged. SNAP's later statutory status exclusions are not applied here.
# The model lacks precise enum categories for noncitizen nationals and
# several special eligible groups; their absence is an input limitation.
values:
  2025-09-15:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT
    - PAROLED_ONE_YEAR
    - CONDITIONAL_ENTRANT

