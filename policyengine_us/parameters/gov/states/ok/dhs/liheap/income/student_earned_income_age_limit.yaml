description: Oklahoma excludes earned income of elementary or high school students under adult control below this age under the Low Income Home Energy Assistance Program.
# The current LIHEAP rule incorporates program-dependent exclusions and
# defaults to Oklahoma SNAP exclusions. is_in_k12_school represents elementary
# or high school attendance and tax dependency approximates adult control;
# excluded training income is not separately identified.
values:
  2025-09-15: 18

