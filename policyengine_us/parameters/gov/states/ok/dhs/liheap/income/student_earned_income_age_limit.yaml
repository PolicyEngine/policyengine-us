description: Oklahoma excludes earned income of secondary-school students under adult control below this age under the Low Income Home Energy Assistance Program.
# The current LIHEAP rule incorporates program-dependent exclusions and
# defaults to Oklahoma SNAP exclusions. Tax dependency approximates control;
# separate elementary attendance and excluded training income are unavailable.
values:
  2025-09-15: 18

