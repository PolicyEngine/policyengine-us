description: Oklahoma uses these sources as earned income under the Low Income Home Energy Assistance Program.
# Existing net business inputs stand in for gross receipts less the 50%
# business-expense deduction (OAC 340:20-1-11(c)(4)); no new expense input.
# partnership_s_corp_income mixes active partners' self-employment earnings,
# earned under 340:20-1-11(a)(2), with S corporation and passive partnership
# shares that Oklahoma SNAP counts as unearned (340:50-7-29(b)(2), (c)(8)).
# The input cannot separate them; only the $240 earned deduction differs.
values:
  2025-09-15:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

metadata:
  unit: list
  period: year
  label: Oklahoma LIHEAP earned income sources
