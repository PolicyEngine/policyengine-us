      href: https://oklahoma.gov/content/dam/ok/en/omma/content/rulemaking-process/rules/Register_Volume-42_Issue-20.pdf#page=576
    - title: OAC 340:50-7-22, Incorporated SNAP income exclusions
      href: https://www.law.cornell.edu/regulations/oklahoma/OAC-340-50-7-22
