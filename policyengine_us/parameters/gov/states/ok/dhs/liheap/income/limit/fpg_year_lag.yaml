description: Oklahoma uses the federal poverty guideline from this many years before the heating benefit year under the Low Income Home Energy Assistance Program.
# HHS makes each January's poverty guidelines mandatory for LIHEAP from the
# next October 1 (LIHEAP IM 2024-02, IM 2025-02 and IM 2026-01), so FY2025
# uses the 2024 guidelines, FY2026 the 2025 and FY2027 the 2026. Plan item
# 2.1 names only the "HHS Poverty Guidelines"; the printed Appendix C-7
# limits confirm the mandatory year. FY2025: 1.3 x 15,060 / 12 = 1,631.50,
# rounded up to the printed $1,632 (the 2025 guideline would give $1,696).
# FY2026: 1.3 x 15,650 / 12 = 1,695.42 -> $1,696. FY2027:
# 1.3 x 15,960 / 12 = 1,729.00 -> $1,729.
values:
  2024-10-01: 1

