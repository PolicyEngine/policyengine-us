description: Oklahoma deducts up to this monthly amount from each employed member's earned income under the Low Income Home Energy Assistance Program.
# Eligible members receive this deduction after the gross income test.
# Ineligible members receive it within deeming before that test.
# Quest operational guidance updated August 12, 2026 states $240 per worker;
# this is the earliest recovered evidence date, not a proven policy start.
# C-7 independently confirms $240 effective October 1, 2026. Earlier periods,
# including annual 2026 evaluated at January 1, remain backfilled estimates.
values:
  2026-08-12: 240
  2026-10-01: 240

metadata:
