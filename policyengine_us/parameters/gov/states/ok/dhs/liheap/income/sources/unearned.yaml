description: Oklahoma uses these sources as unearned income under the Low Income Home Energy Assistance Program.
# OAC 340:20-1-11(a) counts earned and unearned income unless excluded.
# Income sources represent regular receipts, not excluded asset principal,
# loans, nonrecurring lump sums or restricted trust distributions. The
# September 2025 rule replaces the old 38-item list with program-specific
# exclusions, defaulting to Oklahoma SNAP exclusions. Aggregate inputs cannot
# distinguish every exclusion, including irregular small gifts, qualified
# educational/VA aid, restricted tribal trust receipts, redirected support
# and third-party payments. Those detailed pathways remain unverified.
# State SSP receipts are not modeled; SSI is federal, and TANF is added once
# at SPMUnit level through the take-up-gated tanf aggregate.
values:
  2025-09-15:
    # Reported unemployment compensation, otherwise modeled Oklahoma UI (ok_ui).
    - total_unemployment_compensation
    - strike_benefits
    # OAC 340:20-1-11(a) counts "All gross earned and unearned income", and
    # 340:20-1-11(c) requires the gross income standard to be met "before
    # allowing applicable income deductions". The model reads the (c)(1)
    # medical deduction with SNAP's list, which names "Medicare premiums"
    # (340:50-7-31(a)(3)(A)(vi), applied by analogy). Plan item 1.9
    # (FY2025-FY2027, PDF page 6) checks "Excluding MediCare deduction" for SSA
    # benefits; the regulation governs, and the plan narrative (FY2026, PDF
    # page 7) also uses gross income.
    - social_security
    - ssi
    # Military retirement income (retiree pay plus Survivor Benefit Plan
    # annuities) is a separate input from the pension inputs that
    # pension_income adds, so both are listed; a household reports the amount
    # in one or the other. A military survivor annuity belongs in
    # military_retirement_pay_survivors, not survivor_benefits.
    - pension_income
    - military_retirement_income
    # Plan Section 1.9 counts retirement benefits; IRA, 401(k), 403(b), SEP
    # and Keogh distributions are separate inputs from pension_income.
    - retirement_distributions
    - survivor_benefits
    - railroad_benefits
    - workers_compensation
    - disability_benefits
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    - veterans_benefits
    - financial_assistance
    - estate_income

