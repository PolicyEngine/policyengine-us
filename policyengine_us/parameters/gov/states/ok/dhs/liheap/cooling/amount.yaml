description: Oklahoma provides this summer cooling payment by net monthly income band and household size group under the Low Income Home Energy Assistance Program.
# The same amount applies to every cooling energy source and to renters,
# roomers and boarders with utilities included in their rent (OAC
# 340:20-1-20(d)(1)). The FY2026 and FY2027 plans' $650 maximum is the
# largest cell; their $150 minimum is the cooling equipment reimbursement cap.

# Net monthly income band 1: $0 - $700.
1:
  # Household size 1.
  1:
    2021-10-01: 500
  # Household size 2 or more.
  2:
    2021-10-01: 650
# Net monthly income band 2: $701 to the income limit.
2:
  1:
    2021-10-01: 385
  2:
    2021-10-01: 425

