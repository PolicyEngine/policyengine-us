description: Maine assigns this unemployment insurance contribution rate to each new employer.
values:
  # Maine lists the Competitive Skills Scholarship Fund contribution and, from
  # 2021, the Unemployment Program Administrative Fund contribution on top of
  # this rate; PE-US leaves both out.
  2018-01-01: 0.018
  2019-01-01: 0.0183
  2020-01-01: 0.0186
  2021-01-01: 0.0211
  2022-01-01: 0.0224
  2023-01-01: 0.0197
  2024-01-01: 0.0204
  2025-01-01: 0.0211
  2026-01-01: 0.0223

metadata:
