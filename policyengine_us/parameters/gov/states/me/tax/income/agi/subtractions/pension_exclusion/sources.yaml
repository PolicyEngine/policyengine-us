description: Maine excludes these pension and retirement income sources under the individual income tax pension income deduction program. Distributions subject to IRC § 72(t) early-distribution tax are excluded under 36 M.R.S. § 5122(2)(M-2)(2)(f) (approximated via age 59½ threshold in formula).
