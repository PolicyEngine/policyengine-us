description: Maine combines these income sources, which share federal Form 1040 line 7, and adds back only their net loss under the sales and property tax fairness credits.
values:
  2021-01-01:
    # Net capital gain or loss and capital gain distributions, which net
    # against capital losses on Schedule D line 13.
    - capital_gains
    - non_sch_d_capital_gains
