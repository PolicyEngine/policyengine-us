description: Maine combines these income sources, which share federal Schedule 1 line 5, and adds back only their net loss under the sales and property tax fairness credits.
values:
  2021-01-01:
    # Schedule E line 41 combines rental real estate and royalties (line 26),
    # partnerships and S corporations (line 32), estates and trusts (line 37),
    # REMICs (line 39, no input) and net farm rental income from Form 4835
    # (line 40), and carries the total to Schedule 1 line 5.
    - rental_income
    - partnership_s_corp_income
    - estate_income
    - farm_rent_income
