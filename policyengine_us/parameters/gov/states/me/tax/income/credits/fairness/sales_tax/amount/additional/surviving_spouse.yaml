description: Maine provides this additional sales tax fairness credit amount to surviving spouse filers, based on the number of dependents.
brackets:
  - threshold:
      2021-01-01: 0
    amount:
      2021-01-01: 0
  - threshold:
      2021-01-01: 1
    amount:
      2021-01-01: 25
      2024-01-01: 30
      2025-01-01: 35
      # (175 + 25) x 1.279 = 255.80, rounded down to 255, less the 220 base.
      2026-01-01: 35
  - threshold:
      2021-01-01: 2
    amount:
      2021-01-01: 55
      2024-01-01: 60
      2025-01-01: 65
      # (175 + 50) x 1.279 = 287.78, rounded down to 285, less the 220 base.
      2026-01-01: 65

