description: Maine excludes this share of rent paid as attributable to heat, utilities, furniture, or similar items when the amount is not known under the property tax fairness credit.
# §5219-KK(1)(E) is cited only for the utilities-exclusion concept, not for the
# 15% value: the statute contains no unknown-amount estimate (that 15% is
# form-instructions-only).
values:
  2014-01-01: 0.15
