    - irs_gross_income
    # Social Security "to the extent not included in federal adjusted gross
    # income": the filers' own, Form 1040 line 6a less line 6b (Schedule
    # PTFC/STFC line 2b). A tax unit dependent's benefits are the dependent's
    # own.
    - filer_tax_exempt_social_security
    - tax_exempt_interest_income
