description: Maine accounts for the following income sources for the sales and property tax credits.
values:
  2021-01-01:
    # Federal total income (Schedule PTFC/STFC line 2a) with each federal
    # line's net loss added back (line 2d).
    - me_fairness_credit_federal_income
    - tax_exempt_social_security
    - tax_exempt_interest_income
    # "Payments received under the federal Social Security Act" include
    # supplemental security income (Schedule PTFC/STFC lines 1a and 2b).
    - ssi
