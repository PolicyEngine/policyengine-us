description: Maine accounts for the following income sources for the sales and property tax credits.
values:
  2021-01-01:
    # Federal gross income: trade or business, capital and farm losses are
    # added back in full, and the Schedule E items only for their net loss.
    - me_fairness_credit_federal_income
    - tax_exempt_social_security
    - tax_exempt_interest_income
    # "Payments received under the federal Social Security Act" include
    # supplemental security income (Schedule PTFC/STFC lines 1a and 2b): the
    # head's and spouse's.
    - me_fairness_credit_ssi
