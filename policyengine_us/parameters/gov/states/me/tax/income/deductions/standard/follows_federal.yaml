    - title: 36 M.R.S. Sec. 5124-C (Standard deduction; resident on or after January 1, 2018)
      href: https://www.mainelegislature.org/legis/statutes/36/title36sec5124-C.html
    - title: Maine Revenue Services 2026 Legislative Changes Summary, standard deduction for tax years beginning on or after January 1, 2027 (page 9)
      href: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/legischange26.pdf#page=9
