description: Maine additional standard deduction per aged or blind box checked, by filing status. 36 M.R.S. Sec. 5124-C(1-B)(B) and (1-C)(B) set the Maine additional standard deduction equal to the amount allowed under IRC Section 63(c)(3), so these amounts track the federal additional standard deduction for the aged or the blind. The One Big Beautiful Bill Act changed the basic standard deduction under IRC Section 63(c)(2) and (c)(7), not the aged or blind amount under Section 63(f).
