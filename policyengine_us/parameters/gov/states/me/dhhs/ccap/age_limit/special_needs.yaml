description: Maine limits special needs child eligibility to this threshold under the Child Care Affordability Program.
# Definition 19(f) makes a child 13 through 18 who is incapable of self-care or
# under court supervision a Child with Special Needs, so the court-supervision
# route shares this ceiling (CCDF Plan 2.2.1(c) upper age 18.00). The 2019
# rule in force on 2024-01-01 (Definition 22, Section 3.A.6) set the same age.
values:
  2024-01-01: 19

