description: Maine limits special needs child eligibility to this threshold under the Child Care Affordability Program.
# Definition 19(f) applies the same 13-through-18 range to children under
# court supervision, so the court-supervision route shares this ceiling
# (CCDF Plan FFY 2025-2027 section 2.2.1(c), upper age 18.00).
values:
  2024-01-01: 19

