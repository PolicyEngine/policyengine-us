description: Maine deducts these medical expenses, up to the amount needed to reach the income limit, from the income of a household over the limit under the Low Income Home Energy Assistance Program.
# Rule 3(C)(1) defines medical expenses by IRS Publication 502 and allows only
# the amount necessary to make the household eligible. Annual expenses stand in
# for those paid during the income period.
values:
  2024-07-03:
    - medical_expense_health_insurance_premiums
    - other_medical_expenses

