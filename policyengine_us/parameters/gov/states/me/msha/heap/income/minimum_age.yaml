description: Maine counts the income of household members at or above this age under the Low Income Home Energy Assistance Program.
# Rule 3(C)(1) counts the income of "all Household Members over the age of 18"
# in both the 2025 edition and the June 29, 2026 replacement. The model counts
# members aged 18 and older.
values:
  2024-07-03: 18

metadata:
  unit: year
  period: year
  label: Maine HEAP minimum income age
