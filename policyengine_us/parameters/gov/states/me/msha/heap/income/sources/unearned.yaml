description: Maine counts these sources as unearned income under the Low Income Home Energy Assistance Program.
# Rule 3(C)(1)(c)-(n). Social Security (retirement and SSDI) and SSI count
# gross, including Medicare deductions. financial_assistance stands for cash
# gifts from someone outside the household. disability_benefits stands for
# long-term disability payments, item (n) of the June 29, 2026 replacement; the
# 2025 edition's list "includes, but is not limited to" the items it names.
# Royalties, contract income and payments from mortgage or sales contracts
# have no specific inputs.
# Not counted: TANF and General Assistance, which the rule does not list and
# the FY2026 plan's Section 1.9 leaves unchecked (General Assistance vouchers
# are excluded non-cash income), and retirement_distributions, since assets
# drawn down from financial institutions are excluded.
values:
  2024-07-03:
    - social_security
    - ssi
    - total_unemployment_compensation
    - workers_compensation
    - strike_benefits
    - alimony_income
    - child_support_received
    - veterans_benefits
    - financial_assistance
    - pension_income
    # Government pensions include military retired pay, a separate input from
    # the pension inputs that pension_income adds.
    - military_retirement_income
    - disability_benefits
    - interest_income
    - ordinary_dividend_income
    - estate_income
    - rental_income
    - farm_rent_income

