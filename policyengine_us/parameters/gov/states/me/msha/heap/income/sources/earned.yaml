description: Maine counts these sources as earned income under the Low Income Home Energy Assistance Program.
# Rule 3(C)(1)(a)-(b): wages, salaries, commissions, tips and bonuses before
# taxes or deductions, and self-employment income. The model has only net
# business income, so each source is floored at zero and a loss in one source
# cannot offset another. Contract income counts when reported as wages or
# self-employment income. Earnings of a full-time high school student who is
# not the primary applicant are excluded in me_heap_income.
values:
  2024-07-03:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    # Partnership and S corporation income is self-employment income (item b).
    - partnership_s_corp_income

