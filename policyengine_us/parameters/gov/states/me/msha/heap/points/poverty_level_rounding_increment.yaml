description: Maine rounds the poverty level, as a share of the federal poverty guideline, to this increment under the Low Income Home Energy Assistance Program.
# The 2025 edition rounds to the whole percent ("income at 75.1% will be
# rounded to 75%; income at 100.6% will be rounded to 101%"), an increment of
# 0.01. The June 29, 2026 replacement prints bands such as 0-10.99% and
# 11-33.99%, so the poverty level is kept to hundredths of a percent, an
# increment of 0.0001. Rounding is half up.
values:
  2024-07-03: 0.01
  2026-06-29: 0.0001

metadata:
