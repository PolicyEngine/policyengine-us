description: Maine assigns these priority points to a household with a member aged 60 or older, a disabled member or a child aged 6 or younger under the Low Income Home Energy Assistance Program.
# The June 29, 2026 replacement awards the points once, for the first at-risk
# member in the house.
values:
  2024-07-03: 5

