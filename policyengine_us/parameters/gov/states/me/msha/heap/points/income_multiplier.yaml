description: Maine multiplies the household's points by this factor based on its poverty level, as a share of the federal poverty guideline, under the Low Income Home Energy Assistance Program.
# Thresholds are band starts as a share of the poverty guideline, applied
# after rounding the poverty level (poverty_level_rounding_increment). The
# 2025 edition's 70% band covers income above 150% up to the income limit.
# The eighth band starts with the June 29, 2026 replacement and is
# unreachable before.
