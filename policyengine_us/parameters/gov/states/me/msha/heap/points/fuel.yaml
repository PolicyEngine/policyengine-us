description: Maine assigns these points by primary heating fuel under the Low Income Home Energy Assistance Program.
# The wood row is cordwood. Bio-fuel (6), corn (5) and wood pellets (5) in the
# 2025 edition and wood pellets (4) and biobrick (3) in the June 29, 2026
# replacement have no heating_type value and are not stored.
electricity:
  2024-07-03: 14
  2026-06-29: 8
lp_gas:
  2024-07-03: 10
  2026-06-29: 5
kerosene:
  2024-07-03: 8
  2026-06-29: 5
oil:
  2024-07-03: 7
  2026-06-29: 4
coal:
  2024-07-03: 5
  2026-06-29: 4
natural_gas:
  2024-07-03: 5
  2026-06-29: 3
wood:
  2024-07-03: 4
  2026-06-29: 3

