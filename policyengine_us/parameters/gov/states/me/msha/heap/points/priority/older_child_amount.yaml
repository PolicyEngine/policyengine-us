description: Maine assigns these priority points to a household whose only priority member is a child older than the young child age and younger than the child age limit under the Low Income Home Energy Assistance Program.
# The 2025 edition awards 3 points for a child aged 7 to 17. The June 29, 2026
# replacement lists only members aged 60 or older, children aged 6 or younger
# and disabled members.
values:
  2024-07-03: 3
  2026-06-29: 0

