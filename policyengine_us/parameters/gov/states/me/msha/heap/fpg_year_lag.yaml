description: Maine uses the federal poverty guidelines from this many years before the model year for the income limit and the poverty level under the Low Income Home Energy Assistance Program.
# Model period 2026 (FFY2026, the 2025-26 season) uses the 2025 guidelines,
# which HHS made mandatory for LIHEAP from October 1, 2025, and 2027 (FFY2027)
# the 2026 guidelines. Earlier years are unverified backfill.
values:
  2024-10-01: 1

metadata:
  unit: year
  period: year
  label: Maine HEAP poverty guideline year lag
  reference:
    - title: 99-346 CMR ch. 24, section 3(C) Income Eligibility
      href: https://www.mainehousing.org/docs/default-source/msha-rules/ch24-home-energy-assistance-program-rule.pdf#page=11
    - title: LIHEAP IM 2025-02, Attachment 2, poverty guidelines for mandatory use in FY26
      href: https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM2025-02_FPGSte-Table_Att2.pdf#page=1
    - title: LIHEAP IM 2026-01, poverty guidelines for optional use in FY26 and mandatory use in FY27
      href: https://acf.gov/ocs/policy-guidance/liheap-im2026-01-federal-poverty-guidelines-fpg-and-state-median-income-smi
