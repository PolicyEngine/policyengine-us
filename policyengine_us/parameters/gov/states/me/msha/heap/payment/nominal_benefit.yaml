description: Maine provides this benefit to tenants of subsidized housing whose heat is included in rent under the Low Income Home Energy Assistance Program.
# Rule 4(C) of the 2025 edition and 4(B) of the June 29, 2026 replacement limit
# these tenants to a benefit that maximizes SNAP benefits; the FY2026 plan sets
# the nominal payment at $21.
values:
  2024-10-01: 21

