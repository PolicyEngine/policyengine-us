description: Idaho limits the retirement benefits deduction for military retirement benefits to disabled recipients this age or older.
values:
  # Before 2025, a disabled recipient qualified at 62, as for the other
  # retirement benefits in Idaho Code 63-3022A(1).
  2021-01-01: 62
  # From 2025, 63-3022A(1)(b)(i) admits a recipient who "Is classified as
  # disabled", at any age.
  2025-01-01: 0
