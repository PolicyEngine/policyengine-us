description: Idaho caps the retirement benefits deduction to this amount, based on filing status.

metadata:
  label: Idaho retirement benefit deduction cap
  period: year
  uprating: gov.irs.uprating
  propagate_metadata_to_children: true
  unit: currency-USD
  breakdown:
    - filing_status
  reference:
    # The cap is specified in legal code as the maximum retirement benefits under the social security act adjusted for inflation.
    - title: TITLE 63 REVENUE AND TAXATION CHAPTER 30 INCOME TAX 63-3022A 
      href: https://legislature.idaho.gov/statutesrules/idstat/title63/t63ch30/sect63-3022a/
    - title: IDAPA 35 – IDAHO STATE TAX COMMISSION Tax Policy – Taxpayer Resources Unit 35.01.01 – Income Tax Administrative Rules
      href: https://adminrules.idaho.gov/rules/current/35/350101.pdf#page=22
    - title: Individual Income Tax Forms and Instructions 2021
      href: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_11-15-2021.pdf#page=33
    - title: Individual Income Tax General Information 2022
      href: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_03-01-2023.pdf#page=32
    - title: Form 39R Resident Supplemental Schedule 2022
      href: https://tax.idaho.gov/wp-content/uploads/forms/EFO00088/EFO00088_12-30-2022.pdf#page=1
    - title: Individual Income Tax Forms and Instructions 2023
      href: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_11-06-2023.pdf#page=32
    - title: Idaho Individual Income Tax Instructions Packet 2024
      href: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_10-23-2024.pdf#page=32
    - title: Idaho Individual Income Tax Instructions Packet 2025
      href: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_03-02-2026.pdf#page=45
    - title: Social Security Administration, 2026 Cost-of-Living Adjustment (COLA) Fact Sheet
      href: https://www.ssa.gov/news/en/cola/factsheets/2026.html
    - title: Social Security Administration, 2027 Cost-of-Living Adjustment (COLA) Fact Sheet
      href: https://www.ssa.gov/news/en/cola/factsheets/2027.html
    - title: 42 U.S.C. § 402(b)(2) and (c)(2)
      href: https://www.law.cornell.edu/uscode/text/42/402#b_2
    - title: 42 U.S.C. § 415(g)
      href: https://www.law.cornell.edu/uscode/text/42/415#g

SINGLE:
  2021-01-01: 37_776
  2022-01-01: 40_140
  2023-01-01: 43_524
  2024-01-01: 45_864
  2025-01-01: 48_216
  # The 2026 and 2027 amounts are derived, pending the Tax Commission's own
  # amounts in the 2026 and 2027 Form 39R instructions: 12 times SSA's
  # maximum monthly benefit for a worker retiring at full retirement age
  # ($4,152 in 2026 and $4,188 in 2027), as 63-3022A(2)(b) defines it. Each
  # of the Commission's 2021-2025 amounts equals 12 times SSA's figure for
  # that year.
  2026-01-01: 49_824
  2027-01-01: 50_256
JOINT:
  2021-01-01: 56_664
  2022-01-01: 60_210
  2023-01-01: 65_286
  2024-01-01: 68_796
  2025-01-01: 72_324
  # The 2026 and 2027 amounts are derived, pending the Tax Commission's own:
  # 1.5 times the single amount. 63-3022A(2)(a) sets the joint amount for a
  # worker whose spouse draws benefits only on the worker's record, and 42
  # U.S.C. 402(b)(2) and (c)(2) set that spouse's benefit at one-half of the
  # worker's primary insurance amount. Each of the Commission's 2021-2025
  # joint amounts equals 1.5 times its single amount.
  # SSA rounds each monthly benefit down to a whole dollar (42 U.S.C.
  # 415(g)), so 12 times the two rounded benefits falls $6 short of 1.5
  # times the single amount when the monthly maximum is odd: in 2022,
  # 1.5 x 40,140 = 60,210, and 12 x (3,345 + 1,672) = 60,204. The 2026 and
  # 2027 maximums are even, so both computations give these amounts.
  2026-01-01: 74_736
  2027-01-01: 75_384
SEPARATE:
  # Per Idaho Form 39R instructions: "If you're married, you can't claim
  # this deduction if you file separately." (Idaho Code 63-3022A(2)(e))
  2021-01-01: 0
SURVIVING_SPOUSE:
  # Per Idaho Code 63-3022A(2)(c): unremarried widow/widower amount
  # tracks the single-equivalent social security cap
  2021-01-01: 37_776
  2022-01-01: 40_140
  2023-01-01: 43_524
  2024-01-01: 45_864
  2025-01-01: 48_216
  # Derived as the SINGLE amounts are, pending the Tax Commission's own.
  2026-01-01: 49_824
  2027-01-01: 50_256
HEAD_OF_HOUSEHOLD:
  # Per Idaho Code 63-3022A(2)(b): "not married" taxpayers use single cap
  2021-01-01: 37_776
  2022-01-01: 40_140
  2023-01-01: 43_524
  2024-01-01: 45_864
  2025-01-01: 48_216
  # Derived as the SINGLE amounts are, pending the Tax Commission's own.
  2026-01-01: 49_824
  2027-01-01: 50_256
