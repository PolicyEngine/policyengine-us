description: Idaho limits the retirement benefits deduction for military retirement benefits to recipients this age or older.
values:
  # Before 2025, military retirement benefits shared the age test of the
  # other retirement benefits in Idaho Code 63-3022A(1).
  2021-01-01: 65
  # From 2025, 63-3022A(1)(b)(ii): "Has attained the age of sixty-two (62)
  # years by the end of the tax year".
  2025-01-01: 62
