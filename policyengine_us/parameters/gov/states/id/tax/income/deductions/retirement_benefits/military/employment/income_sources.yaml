description: Idaho counts these income sources as income from employment in the employment test of the military retirement benefits deduction.
values:
  # The list applies from 2021 so the formula can read it in every year;
  # in_effect.yaml turns the employment test on from 2025. Each source is
  # gross income as the section 6012 test that 63-3022A(1)(b)(iii) borrows
  # measures it.
  2021-01-01:
    # Wages (Form 1040 line 1a). irs_employment_income leaves out all
    # employer dependent care benefits.
    - irs_employment_income
    # The part of those benefits over the section 129 exclusion, which
    # section 129(a)(2)(B) includes in gross income (Form 2441 line 26, Form
    # 1040 line 1e).
    - taxable_dependent_care_benefits
    # Idaho Code 63-3022A(1)(b)(iii) ("Was employed during the tax year and
    # received sufficient income from such employment") doesn't define
    # employment, and the Form 39R line 8e instructions repeat its words.
    # PolicyEngine counts income from a business or farm as income from
    # employment: the section 6012 gross income test that the statute
    # borrows counts it, and a self-employed recipient works for the income
    # as an employee does. Chart A of the Form 1040 instructions measures it
    # as gross income, Schedule C line 7 and Schedule F line 9, before
    # business expenses.
    - business_gross_income
    - farm_gross_income
    # Foreign earned income and housing amounts the person excludes under
    # section 911 (own Form 2555 line 43): section 6012(c) computes gross
    # income for the filing requirement without the exclusion.
    - foreign_earned_income_exclusion_gross_person
metadata:
  unit: list
  period: year
  label: Idaho military retirement benefits deduction employment income sources
  reference:
