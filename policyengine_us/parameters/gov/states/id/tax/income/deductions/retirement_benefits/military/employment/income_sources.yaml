    - title: 26 U.S. Code § 6012(c) - gross income without the section 911 exclusion
      href: https://www.law.cornell.edu/uscode/text/26/6012#c
    - title: 26 U.S. Code § 129(a)(2)(B) - dependent care benefits over the exclusion
      href: https://www.law.cornell.edu/uscode/text/26/129#a_2_B
    - title: 2025 Form 1040 instructions, Chart A (gross income from a business)
      href: https://www.irs.gov/pub/irs-prior/i1040gi--2025.pdf#page=9
