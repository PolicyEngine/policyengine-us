description: Idaho limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  2018-01-01: 38_200
  2019-01-01: 40_000
  2020-01-01: 41_600
  2021-01-01: 43_000
  2022-01-01: 46_500
  2023-01-01: 49_900
  2024-01-01: 53_500
  2025-01-01: 55_300
  2026-01-01: 58_300

