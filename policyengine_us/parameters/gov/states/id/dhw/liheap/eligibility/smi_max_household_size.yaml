description: Idaho uses state median income limits for households up to this size under the Low Income Home Energy Assistance Program.
# The accepted FY2027 plan lists 60% of state median income through size nine.
# The FY2027 income charts of the agencies that take applications switch to
# 150% of the poverty guideline at size nine, and the charts are followed
# (register candidate us-id:liheap-fy2027-size-nine-limit).
values:
  2025-10-01: 7
  2026-10-01: 8

