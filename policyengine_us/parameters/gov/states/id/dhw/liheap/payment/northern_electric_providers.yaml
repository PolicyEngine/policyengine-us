description: Idaho groups these electricity providers in the northern utilities column under the Low Income Home Energy Assistance Program.
# The FY2026 chart names the Avista and Northern Utilities column. Its named
# membership is recovered from Appendix C's historical heating-cost matrix.
# Current state and utility directories confirm these companies' identities,
# while current LIHEAP group membership remains a documented historical proxy.
values:
  2025-10-01:
    - AVISTA
    - BONNERS_FERRY_LIGHT_AND_WATER
    - CLEARWATER_POWER
    - IDAHO_COUNTY_LIGHT_AND_POWER
    - INLAND_POWER_AND_LIGHT
    - KOOTENAI_ELECTRIC
    - NORTHERN_LIGHTS
    - PLUMMER_ELECTRIC
