description: Idaho uses these estimated heating-season costs by fuel and heating area under the Low Income Home Energy Assistance Program.

# User-approved assumption: use the PY2007 estimated nine-month heating costs.
# We have not confirmed that this table is still current for FY2026.
# The FY2026 anchor records this modeling assumption, not a verified update.
# Preserve the published amounts without inflation or a twelve-month uplift.
# Provider groups are not distinguished. Electricity uses Idaho Power &
# Southern Utilities; natural gas uses the complete Intermountain Gas column.
# The old rent-cost column and old benefit percentages are not used.
oil_or_propane:
  1:
    2025-10-01: 1_625
  2:
    2025-10-01: 1_845
  3:
    2025-10-01: 2_145
natural_gas:
  1:
    2025-10-01: 977
  2:
    2025-10-01: 1_100
  3:
    2025-10-01: 1_207
electricity:
  1:
    2025-10-01: 1_335
  2:
    2025-10-01: 1_455
  3:
    2025-10-01: 1_605
coal_or_wood:
  1:
    2025-10-01: 1_200
  2:
    2025-10-01: 1_600
  3:
    2025-10-01: 1_800

