description: Idaho provides this base benefit to households without a specific heating-cost obligation under the Low Income Home Energy Assistance Program.

# FY2025 paid the minimum rent benefit before any target supplement.
# This category became ineligible in FY2026; zero is not an unknown amount.
# This rule does not exclude all renters or all subsidized households.
values:
  2024-10-01: 75
  2025-10-01: 0

