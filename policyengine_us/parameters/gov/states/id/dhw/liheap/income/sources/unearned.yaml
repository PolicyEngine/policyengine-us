description: Idaho counts these unearned income sources under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    - social_security
    - ssi
    - pension_income
    - survivor_benefits
    - unemployment_compensation
    - strike_benefits
    - rental_income
    - farm_rent_income
    - alimony_income
    - interest_income
    - ordinary_dividend_income
    - estate_income
    - disability_benefits
    - workers_compensation
    - id_tafi

