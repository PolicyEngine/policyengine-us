description: Idaho counts these earned income sources under the Low Income Home Energy Assistance Program.
# Every member's earnings count: IDAPA 16.04.14.010.06 counts moneys "from all
# sources" and 151.02 does not exclude a minor's, although plan 1.9 leaves them
# unchecked.
values:
  2025-10-01:
    - employment_income
    # Plan 1.9 checks "Wages". Basic pay is an input apart from employment_income;
    # enter it in one of the two.
    - military_basic_pay
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

metadata:
  unit: list
  period: year
  label: Idaho LIHEAP countable earned income sources
  reference:
    - title: "Idaho FY2026 LIHEAP State Plan #page 5-7"
      href: https://liheapch.acf.gov/docs/2026/state-plans/ID_Plan_2026.pdf#page=5
    - title: IDAPA 16.04.14.010.06 as of September 10, 2025
      href: https://web.archive.org/web/20250910171431id_/https://adminrules.idaho.gov/rules/current/16/160414.pdf#page=3
