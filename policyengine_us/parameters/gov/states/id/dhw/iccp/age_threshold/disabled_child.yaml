description: Idaho limits eligibility to children incapable of self-care or under court supervision below this age under the Idaho Child Care Program.
# IDAPA 16.06.12.105.03.a-b: eligible "until the month of their nineteenth
# birthday" if incapable of self-care or if a court order, probation order,
# child protection, or mental health case plan requires constant supervision.
# Non-court case plans have no separate input and are entered through
# is_under_court_supervision. The birthday-month cutoff is approximated with
# annual age.
values:
  2022-03-17: 19

metadata:
  unit: year
  period: year
  label: Idaho Child Care Program incapacity or court supervision age threshold
  reference:
    - title: IDAPA 16.06.12.105.03.a-b, Child's Age Requirement
      href: https://files.dfm.idaho.gov/dfm-admin-website/rules/current/16/160612.pdf#page=12
