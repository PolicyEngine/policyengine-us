description: Idaho limits initial income to this share of the federal poverty guidelines under the Idaho Child Care Program.
# IDAPA 16.06.12.070.01 still prints 175%. The department moved new applicants
# to 130% when it reopened applications on January 13, 2025, and posts its
# limits at that rate. The model follows what the department applies.
values:
  2023-04-06: 1.75
  2025-01-13: 1.3

