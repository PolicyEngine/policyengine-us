description: Idaho limits initial income to this share of the federal poverty guidelines under the Idaho Child Care Program.
# IDAPA 16.06.12.070 set the limit at 130% from at least 2013 and raised it to 175%
# on April 6, 2023. Until March 2, 2017, the rule required income below 130%; the
# model tests at or below the limit in every year.
# The department moved new applicants back to 130% when it reopened applications on
# January 13, 2025, to keep the program within its appropriation, and posts its
# limits at that rate. IDAPA 16.06.12.070.01 still prints 175%, and IDAPA
# 16.06.12.705 lets the department reduce child care benefits when it projects a
# funding shortfall. The model follows the department's 130% from that date.
values:
  2015-01-01: 1.3
  2023-04-06: 1.75
  2025-01-13: 1.3

