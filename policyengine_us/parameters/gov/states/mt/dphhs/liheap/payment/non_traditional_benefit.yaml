description: Montana provides this full-season benefit to households living in non-traditional dwellings under the Low Income Home Energy Assistance Program.
# The 2025-2026 and 2026-2027 matrices print one flat amount for every fuel
# and bedroom count. Manual section 3.36 pays it for each allowable fuel
# (section 8.1 Fuel Types) with no income and heating degree day multiplier.
values:
  2025-10-01: 150
