description: Montana multiplies the base benefit by this income and heating degree day factor, by percent of the poverty guideline, for households in District 12 under the Low Income Home Energy Assistance Program.
# Thresholds are whole percentages of the poverty guideline at the start of
# each printed band (0-25%, 26-50%, 51-74%, 75-100%, 101-125%, 126-150%,
# 151-175%, 176-200% and >201%).
# Sub-grantee column: Action Inc.
