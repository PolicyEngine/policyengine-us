description: Montana uses this threshold as the Supplemental Security Income minor child age under the Low Income Home Energy Assistance Program.
# Members whose income Supplemental Security Income considers are
# categorically eligible (ARM 37.70.401(23), numbered (24) from May 23, 2026).
# A parent's income is considered only for a child below this age.
values:
  2025-10-01: 18
