description: Montana counts a household member's monetary gifts in full when they reach this monthly amount under the Low Income Home Energy Assistance Program.
# ARM 37.70.407(1)(w), effective May 27, 2023, excludes gifts of up to $50 per
# month per household member and counts the entire gift when it is $50 or
# more. As amended effective May 23, 2026, (w) excludes all monetary gifts
# (funds received as a gift are a resource until spent) and 37.70.401(1) no
# longer lists gifts as income, so the infinite minimum counts none.
# Manual section 3.15 (2025-2026 and 2026-2027 editions) counts recurring
# monetary gifts of $500 or more per household (received three or more months
# in a row) and excludes nonrecurring gifts. The model applies the
# administrative rule in force to each member's annual gifts divided by 12.
values:
  2025-10-01: 50
  2026-05-23: .inf
