description: Montana excludes Social Security child benefits of full-time students below this age under the Low Income Home Energy Assistance Program.
# ARM 37.70.407(1)(d) excludes the extension of Old-Age, Survivors, and
# Disability Insurance benefits for full-time students aged 18 to 22, that is,
# below the twenty-third birthday. The lower bound is the adult income age,
# below which no income counts.
values:
  2025-10-01: 23
