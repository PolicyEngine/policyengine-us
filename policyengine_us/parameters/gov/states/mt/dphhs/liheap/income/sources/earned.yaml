description: Montana counts these sources as earned income under the Low Income Home Energy Assistance Program.
# Existing net business inputs are used without another expense deduction;
# each source is floored at zero. The depreciation add-back and the optional
# prior-year tax-return method are not modeled.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
