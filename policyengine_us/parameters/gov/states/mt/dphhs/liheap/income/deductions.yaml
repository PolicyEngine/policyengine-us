description: Montana deducts these health insurance premiums from the income of households that are not categorically eligible under the Low Income Home Energy Assistance Program.
# Out-of-pocket and payroll-deducted medical, dental and vision premiums are
# deducted. The premium inputs are disjoint, so each premium is deducted once.
# The Medicare Part B premium is netted from Social Security in the formula.
values:
  2025-10-01:
    - health_insurance_premiums_without_medicare_part_b
    - pre_tax_health_insurance_premiums
