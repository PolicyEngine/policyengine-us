description: Montana counts these sources as unearned income under the Low Income Home Energy Assistance Program.
# Social Security net of the Medicare Part A and Part B premiums, monetary
# gifts (none from May 23, 2026; see gift_minimum.yaml) and the unit's TANF
# cash assistance are added in the countable income formula. The Montana
# State Supplementary Payment is paid with SSI and counted with it.
# Military retirement income is a separate input from the pension inputs that
# pension_income adds, so both are listed. Excluded receipts such as SNAP,
# educational grants and loans, the earned income tax credit, nonrecurring
# lump sums and in-kind income are not listed.
values:
  2025-10-01:
    - total_unemployment_compensation
    - strike_benefits
    - ssi
    - mt_ssp
    - pension_income
    - retirement_distributions
    - military_retirement_income
    - railroad_benefits
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    - rental_income
    - farm_rent_income
    - general_assistance
    - capital_gains
