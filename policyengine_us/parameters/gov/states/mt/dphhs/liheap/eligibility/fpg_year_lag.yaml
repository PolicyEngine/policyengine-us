description: Montana uses federal poverty guidelines from this many years before the modeled benefit year under the Low Income Home Energy Assistance Program.
# Model year 2026 is the 2025-2026 heating season and uses the 2025
# guidelines ($21,150 for two people); model year 2027 uses the 2026
# guidelines ($21,640 for two people). The same guidelines set the percent of
# poverty for the benefit multiplier.
values:
  2025-10-01: 1
metadata:
  unit: year
  period: year
  label: Montana LIHEAP federal poverty guideline year lag
