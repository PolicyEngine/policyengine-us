description: Montana limits the equity value of a household's business assets to this amount under the Low Income Home Energy Assistance Program.
# ARM 37.70.408(2) and the FY2026 plan set $25,000. The 2025-2026 manual
# lists $29,290 (section 3.13 and the glossary), and the 2026-2027 manual
# lists $31,524 in section 3.13 and $29,290 in the glossary. The model
# applies the administrative rule.
values:
  2025-10-01: 25_000
