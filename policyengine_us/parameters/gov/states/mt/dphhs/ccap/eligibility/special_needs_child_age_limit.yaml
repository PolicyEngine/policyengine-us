description: Montana limits eligibility for children with special needs or under court supervision to those under this age under the Best Beginnings Child Care Scholarship program.
# Standard CCDF eligible-child age cap from 45 CFR 98.20(a)(1)(ii): a child who
# is physically or mentally incapable of self-care, or under court supervision,
# may remain eligible until under age 19.
values:
  2016-11-01: 19

