description: Montana limits gross income to this share of the federal poverty guideline for graduated eligibility at redetermination under the Best Beginnings Child Care Scholarship program.
# ARM 37.80.202(2) still prints 185%. The department's scale effective July 1, 2025
# runs Graduated Eligibility to 200% for families already on the Non-TANF program at
# annual redetermination. That scale is the earliest dated source for 200%, so the
# list moves on its date; with the initial share at 185% from July 2023, the two match
# until then. We proxy "at redetermination / continuing recipient" with the
# mt_ccap_enrolled input; first-time applicants use the initial share (see initial.yaml).
values:
  2016-11-01: 1.85
  2025-07-01: 2

