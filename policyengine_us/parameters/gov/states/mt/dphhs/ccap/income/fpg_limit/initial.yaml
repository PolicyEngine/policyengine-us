description: Montana limits gross income to this share of the federal poverty guideline for initial eligibility under the Best Beginnings Child Care Scholarship program.
# ARM 37.80.202(1) still prints 150%. MCA 52-2-715, enacted by House Bill 648 in 2023,
# requires a threshold of no less than 185%, and the department has applied 185% since
# July 1, 2023; its scale ends Standard Eligibility there. The model follows the statute
# and the scale from that date. The Legislative Fiscal Division's timeline, adapted from
# the department's communications, also lists 185% from July 2021 through December 2022
# under pandemic CCDF policies; the model keeps the rule's 150% for that period. This is
# the initial / first-time applicant standard; continuing recipients at annual
# redetermination use the higher graduated share (see graduated.yaml), selected via the
# mt_ccap_enrolled input.
values:
  2016-11-01: 1.5
  2023-07-01: 1.85

