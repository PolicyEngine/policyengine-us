description: Montana limits gross income to this share of the federal poverty guideline for initial eligibility under the Best Beginnings Child Care Scholarship program.
# ARM 37.80.202(1) still prints 150%. MCA 52-2-715, enacted by House Bill 648 in 2023,
# requires a threshold of no less than 185%, and the department's scale ends Standard
# Eligibility at 185%. The model follows the statute and the scale. This is the initial /
# first-time applicant standard; continuing recipients at annual redetermination use
# the higher graduated share (see graduated.yaml), selected via the mt_ccap_enrolled input.
values:
  2016-11-01: 1.5
  2023-07-01: 1.85

metadata:
