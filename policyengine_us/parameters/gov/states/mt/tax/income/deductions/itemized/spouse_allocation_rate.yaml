description: Montana allocates this share of jointly paid itemized deductions to each spouse when married couples file separately on the same form.
values:
  # A modeling convention, not a rate in the law. On the same form (status
  # 2a), ARM 42.15.524(3)(b) defers to the form, which lets the couple
  # allocate payments from accounts both spouses own "in any proportional
  # amount"; an equal division is required only on separate forms, absent a
  # written agreement (ARM 42.15.524(3)(c)). The model splits the charitable
  # deduction equally by this rate, and uses it as the tie-break and starting
  # candidate for the tax-minimizing split of dependents' medical bills
  # (mt_dependent_medical_expense_head_share). The federal rule for separate
  # returns also treats payments from a joint account as paid equally.
  2021-01-01: 0.5
