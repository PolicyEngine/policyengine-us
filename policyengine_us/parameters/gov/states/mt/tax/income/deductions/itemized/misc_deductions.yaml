description: Montana counts these sources as miscellaneous deductions. 
values:
  2021-01-01:
    - mt_child_dependent_care_expense_deduction  
    - casualty_loss_deduction  
    # Gambling losses, up to gambling winnings (2023 Form 2 instructions).
    - mt_wagering_losses_deduction
  # From 2024 Montana starts from federal taxable income, which carries the
  # federal itemized deductions.
  2024-01-01:
    - mt_wagering_losses_deduction
    
