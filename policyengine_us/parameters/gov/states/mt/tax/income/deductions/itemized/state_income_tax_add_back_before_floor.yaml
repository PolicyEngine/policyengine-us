description: Montana adds back the state income tax included in federal itemized deductions before flooring federal taxable income at zero if this is true; otherwise it adds it back after the floor, with the other Montana additions.
# 2024: Worksheet A reduces the federal deduction on Form 2 line 2, before the
# line 3 zero floor. 2025: line 2 is the unadjusted federal deduction and the
# addback is reported on Schedule I, line 4 (from Worksheet B line 11), after
# the floor. By convention, 2026 follows the 2025 form until a 2026 form exists.
values:
  2024-01-01: true
  2025-01-01: false
metadata:
  unit: bool
  period: year
  label: Montana state income tax addback precedes the taxable income floor
