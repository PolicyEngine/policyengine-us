description: Montana excludes this amount of net household income when computing net household income for elderly homeowner or renter credit.
values:
  2009-01-01: 6_300
  # HB 191 (2021 session, Ch. 476) doubled the exclusion to $12,600 effective
  # tax year 2022 (the 2021 Form 2 still uses $6,300).
  2022-01-01: 12_600

metadata:
  period: year
  unit: currency-USD
