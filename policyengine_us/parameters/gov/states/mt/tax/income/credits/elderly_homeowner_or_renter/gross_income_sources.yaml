values:
  2009-01-01:
    - adjusted_gross_income_person # Federal AGI baseline; covers taxable
      # pensions, IRA, wages, interest, dividends, etc.
    - tax_exempt_interest_income # § 15-30-2337(9)(a)(vii)
    # AGI already includes taxable IRA distributions via
    # taxable_retirement_distributions; only the tax-exempt portion
    # (Roth distributions) is added back here.
    - tax_exempt_ira_distributions
    # AGI already includes taxable pension income; only the tax-exempt
    # portion is added back here per § 15-30-2337(9)(a)(i).
    - tax_exempt_pension_income
    - veterans_benefits # § 15-30-2337(9)(a)(i) – veterans' disability benefits
    - child_support_received # § 15-30-2337(9)(a)(iv) – support money
    - strike_benefits # § 15-30-2337(9)(a)(v) – nontaxable strike benefits
    - general_assistance # § 15-30-2337(9)(a)(vi) – cash public assistance
    # Government assistance (Schedule 2EC line 16 from 2024; "disability
    # benefits including ... SSI payments and workers' compensation" and
    # "cash public assistance and relief" in earlier instructions). TANF is
    # held for the SPM unit; tanf_person is each member's per capita share,
    # so the household sum counts the unit's TANF once. LIEAP and SNAP are
    # not cash public assistance (2014-2017 Form 2EC instructions).
    - ssi
    - tanf_person
    - workers_compensation
    # Guaranteed income pilot payments are outside federal AGI here, and
    # (9)(a) counts all nontaxable income; a government-funded pilot is also
    # "any other government assistance" (Schedule 2EC line 16).
    - gi_cash_assistance
    # Only nontaxable employment disability benefits are added here. The
    # taxable part is already in federal AGI or a dependent's own gross
    # income. The 2014-2023 instructions list disability benefits among
    # other income; from 2024, Schedule 2EC uses line 1 for taxable pay
    # reported as wages, line 5 for a disability pension after minimum
    # retirement age, and line 15 for nontaxable disability benefits.
    - tax_exempt_disability_benefits
    # Unemployment compensation that neither federal AGI nor a dependent's
    # own gross income counts, such as the 2020 IRC 85(c) exclusion (2020
    # line 8, "all items of income ... not reported on lines 1 through 7";
    # 2014-2017 worksheets, "Alimony, cash public assistance,
    # unemployment"; Schedule 2EC line 14 from 2024, the total received).
    - mt_elderly_homeowner_or_renter_credit_unemployment_compensation_addback
    # Refundable credits received (2023 schedule line 7, Schedule 2EC line 8
    # from 2024): Montana's refundable credits other than this credit,
    # and this credit as received during the year (ARM 42.4.301(2)(c)).
    - mt_refundable_credits_before_renter_credit
    - mt_elderly_homeowner_or_renter_credit_received
  # ARM 42.4.301(2)(b), amended effective 11/10/2017, counts "federal
  # refundable credits received"; the 2017 Form 2EC worksheet counts "any
  # federal or state refundable credits".
  2017-01-01:
    - adjusted_gross_income_person
    - tax_exempt_interest_income
    - tax_exempt_ira_distributions
    - tax_exempt_pension_income
    - veterans_benefits
    - child_support_received
    - strike_benefits
    - general_assistance
    - ssi
    - tanf_person
    - workers_compensation
    - gi_cash_assistance
    - tax_exempt_disability_benefits
    - mt_elderly_homeowner_or_renter_credit_unemployment_compensation_addback
    - mt_refundable_credits_before_renter_credit
    - mt_elderly_homeowner_or_renter_credit_received
    - mt_elderly_homeowner_or_renter_credit_federal_refundable_credits
  # Actual rebate receipts count under the statutory nontaxable-income
  # definition and ARM 42.4.301(2)(c). The 2023 form's illustrative list
  # establishes no exemption for 2022 rebates received in 2023. The
  # 2024/2025 schedules explicitly name the prior property-year rebates.
  2023-01-01:
    - adjusted_gross_income_person
    - tax_exempt_interest_income
    - tax_exempt_ira_distributions
    - tax_exempt_pension_income
    - veterans_benefits
    - child_support_received
    - strike_benefits
    - general_assistance
    - ssi
    - tanf_person
    - workers_compensation
    - gi_cash_assistance
    - tax_exempt_disability_benefits
    - mt_elderly_homeowner_or_renter_credit_unemployment_compensation_addback
    - mt_refundable_credits_before_renter_credit
    - mt_elderly_homeowner_or_renter_credit_received
    - mt_elderly_homeowner_or_renter_credit_federal_refundable_credits
    - mt_elderly_homeowner_or_renter_credit_property_tax_rebate_received
# mt_elderly_homeowner_or_renter_credit_gross_household_income.py adds three
# items separately: a tax unit dependent's own gross income (their income is
# on their own return, not in adjusted_gross_income_person); the untaxed
# portion of Social Security under § 15-30-2337(9)(a)(viii), computed as
# social_security less the taxable part already counted; and the losses
# deducted in federal AGI.
# This year's elderly homeowner/renter credit is excluded to avoid a circular
# reference; the credit received during the year counts instead.
