description: Montana matches this fraction of the federal earned income tax credit.
values:
  # Ch. 381, L. 2017 enacted the credit for income tax years beginning after
  # December 31, 2018, so no credit applies before tax year 2019.
  2000-01-01: 0
  2019-01-01: 0.03
  2024-01-01: 0.1
  2026-01-01: 0.2
