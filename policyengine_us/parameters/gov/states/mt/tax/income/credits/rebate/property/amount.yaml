description: Montana provides the following property tax rebate amount.
values:
  # The property tax rebate was only offered in the 2022 and 2023 tax years,
  # so it is zero before 2022 and from 2024 onward.
  # $675 = HB 222 $500 limit + HB 816 $175 bonus
  # ($100,000,000 / 284,343 / 2 = 175.84, rounded down to $175).
  2021-01-01: 0
  2022-01-01: 675
  2024-01-01: 0
