description: Montana provides the following property tax rebate amount.
values:
  # Tax years 2022 and 2023: $500 (HB 222, Ch. 47, L. 2023) plus the $175
  # bonus (HB 816, Ch. 764, L. 2023).
  2022-01-01: 675
  # Tax year 2024: $400 (SB 542, Ch. 767, L. 2025, sec. 3).
  2024-01-01: 400
  # No rebate has been enacted for tax year 2025 or later; the tax year 2024
  # rebate terminates June 30, 2026 (Ch. 767, L. 2025, sec. 29(2)).
  2025-01-01: 0
