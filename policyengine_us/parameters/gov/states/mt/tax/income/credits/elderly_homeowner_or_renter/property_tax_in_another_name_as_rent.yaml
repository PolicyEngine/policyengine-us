description: Montana counts the property tax billed for a home in another person's name as the claimant's rent under the elderly homeowner or renter credit, if this is true.
values:
  # The 2009 and 2010 instructions let only property tax billed to an
  # irrevocable or family trust "qualify as rent only"; the 2011
  # instructions first extend this to any property "in a name other than
  # your own", the wording of ARM 42.4.302(2)(b).
  2009-01-01: false
  2011-01-01: true

metadata:
  unit: bool
  period: year
  label: Montana elderly homeowner or renter credit property tax in another name as rent
