description: Montana counts these income sources as the Montana source wage income that limits the working military retirement exemption.
values:
  2024-01-01:
    # 15-30-2120(8)(b)(i); Form WMRE line 2: wages on Form 1040 line 1z.
    - irs_employment_income
    # (8)(b)(ii); line 3: Schedule 1 line 3, which nets all Schedule C
    # income, including a specified service trade or business.
    - total_self_employment_income
    # (8)(b)(ii); line 4: partnership and S corporation income.
    - partnership_s_corp_income
    # (8)(b)(iii); line 5: net farming income, which PolicyEngine holds as
    # Schedule F income.
    - farm_operations_income
