description: Montana counts these sources as subtractions.
values:
  2010-01-01:
    - mt_disability_income_exclusion_person
    - mt_unemployment_compensation_subtraction
  2021-01-01:
    - mt_interest_exemption_person
    - us_govt_interest_person
    - mt_tuition_subtraction_person
    - mt_disability_income_exclusion_person
    # Former 15-30-2110, MCA exempted unemployment compensation;
    # SB 399 (2021) repealed the exemption effective tax year 2024.
    - mt_unemployment_compensation_subtraction
    - salt_refund_income # Form 2 Subtractions Schedule
  2024-01-01:
    - mt_interest_exemption_person
    - us_govt_interest_person # MCA 15-30-2120(3)(b)(i); Schedule I line 11.
    - mt_tuition_subtraction_person
    - mt_old_age_subtraction
    # Partial retirement disability deduction was repealed from 2024.
    - salt_refund_income # MCA 15-30-2120 / Form 2 Subtractions Schedule
  2025-01-01:
    # Schedule 1-A deductions are already included on Form 2 line 2;
    # subtracting them again here would double count them.
    - mt_interest_exemption_person
    - us_govt_interest_person # MCA 15-30-2120(3)(b)(i); Schedule I line 9.
    - mt_tuition_subtraction_person
    - mt_old_age_subtraction
    - salt_refund_income # MCA 15-30-2120 / Form 2 Subtractions Schedule
