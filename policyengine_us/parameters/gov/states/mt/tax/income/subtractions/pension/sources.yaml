description: Montana counts these sources as pension, annuity, and IRA income for the partial pension, annuity, and IRA income exemption.
values:
  2021-01-01:
    # Form 2, page 1, lines 4b (IRA distributions) and 5b (pensions and
    # annuities). Premature distributions do not qualify (MCA 15-30-2101(25)(d))
    # but are not separately modeled.
    - taxable_pension_income
    - taxable_retirement_distributions
    # Roth conversions are IRA or plan distributions included on line 4b or
    # 5b (MCA 15-30-2101(25)(d)).
    - taxable_roth_conversions
    # Uniformed services retired pay (MCA 15-30-2101(25)(b)), reported on
    # line 5b. Survivor Benefit Plan annuities
    # (military_retirement_pay_survivors) are left out: the line 34
    # instructions exclude death benefits, and Form 1099-R code 4 is for
    # payments to a decedent's beneficiary.
    - military_retirement_pay
