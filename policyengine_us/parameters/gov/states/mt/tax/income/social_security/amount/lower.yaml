description: Montana uses this amount when calculating the taxable social security benefits, based on filing status.
metadata:
  propagate_metadata_to_children: true
  period: year
  unit: currency-USD
  label: Montana social security benefits amount
  breakdown:
    - filing_status
  reference:
    - title: 2021 Montana Individual Income Tax Return (Taxable Social Security Benefits Schedule)
      href: https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2021_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=6
    - title: 2022 Montana Individual Income Tax Return (Taxable Social Security Benefits Schedule)
      href: https://revenuefiles.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2022_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=6
    - title: 2023 Montana Individual Income Tax Return (Taxable Social Security Benefits Schedule)
      href: https://revenuefiles.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2023_Montana_Individual_Income_Tax_Return_Form_2.pdf#page=6
      # Montana adjusts the federal social security parameters by using the halved joint amount for separate 
      # filers as opposed to the single amount, which is used in the federal computation. 
      # Starting in 2024 all Social Security is taxable, this is reflected in mt_agi_indiv.py
SINGLE:
  2021-01-01: 25_000
HEAD_OF_HOUSEHOLD:
  2021-01-01: 25_000
JOINT:
  2021-01-01: 32_000
SEPARATE:
  2021-01-01: 16_000 
SURVIVING_SPOUSE:
  2021-01-01: 25_000
