description: Mississippi sets these income bands for an eligible household of 10 members under the Low Income Home Energy Assistance Program.
brackets:
  - threshold:
      2025-10-01: -.inf
    amount:
      2025-10-01: 1
  - threshold:
      2025-10-01: 16_288
    amount:
      2025-10-01: 2
  # The matrix prints 35,325 as the second-band top; encoded as published.
  - threshold:
      2025-10-01: 35_325
    amount:
      2025-10-01: 3
  - threshold:
      2025-10-01: 48_863
    amount:
      2025-10-01: 4
  - threshold:
      2025-10-01: 65_150
    amount:
      2025-10-01: 5
