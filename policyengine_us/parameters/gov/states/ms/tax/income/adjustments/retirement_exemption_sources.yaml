description: Mississippi exempts these retirement income sources from income tax under Miss. Code Ann. § 27-7-15(4)(k)-(l) and Form 80-105 Line 46. Under Miss. Code Ann. § 27-7-15(4)(l), early/premature retirement distributions are not exempt; modeled without early distribution restriction.
