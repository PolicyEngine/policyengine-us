max_household_size:
  description: Mississippi publishes verified parent Medicaid income limits through this household size in the source charts.
  # This bounds the verified table route, not legal household eligibility.
  values:
    2017-01-01: 20
  metadata:
    unit: person
    period: year
    label: Mississippi Medicaid parent maximum verified table household size
    reference:
      - title: 'Mississippi DOM Eligibility Policy and Procedures Manual Appendix A-3, household-size and disregard charts #page 1-10'
        href: https://medicaid.ms.gov/wp-content/uploads/2026/03/Appendix-A-3-MAGI-Income-Limits.-2014-to-present.pdf#page=1
annual_reference_month:
  description: Mississippi annual Medicaid model comparisons select this month's parent income table for the modeled year.
  # The source tables take effect March 1. YEAR comparisons retain the
  # current-year table convention; this is not actual January eligibility.
  values:
    2017-01-01: 3
  metadata:
    unit: month
    period: year
    label: Mississippi Medicaid parent annual comparison reference month
    reference:
      - title: 'Mississippi DOM Eligibility Policy and Procedures Manual Appendix A-3, March 1 effective dates #page 1-10'
        href: https://medicaid.ms.gov/wp-content/uploads/2026/03/Appendix-A-3-MAGI-Income-Limits.-2014-to-present.pdf#page=1
