description: Maryland uses this indicator to determine whether the State Median Income base year is frozen for the Child Care Scholarship initial income scale.
# MSDE's scholarship page, captured October 9, 2026, still posts the Initial Income Scale
# effective December 15, 2024 as the table for new applications: 75% of the federal
# fiscal 2025 median, $94,026 a year for three. The model holds that median from October
# 1, 2025, when HHS's fiscal 2026 estimates took effect; a new posted table adds a date here.
values:
  2016-01-01: false
  2018-07-01: true
  2024-12-15: false
  2025-10-01: true

metadata:
  unit: bool
  period: year
  label: Maryland CCS SMI freeze in effect
