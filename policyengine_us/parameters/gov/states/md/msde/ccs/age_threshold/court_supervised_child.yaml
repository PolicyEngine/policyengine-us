description: Maryland limits the Child Care Scholarship program to court-supervised children under this age.
values:
  # The FFY 2019-2021 plan, section 3.1.1(c), elected No for court-supervised
  # children, so before 2021-10-01 this threshold equals the ordinary child
  # ceiling of 13 and the court route is inert.
  2018-01-01: 13
  # The FFY 2022-2024 plan, effective October 1, 2021, and the FFY 2025-2027
  # plan elected Yes with an upper age of 18 (under 19).
  2021-10-01: 19

