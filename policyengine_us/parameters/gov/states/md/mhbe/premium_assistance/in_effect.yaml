description: Maryland provides state premium assistance under the State-Based Health Insurance Subsidies Program when this is true.
values:
  # Ins. Art. 31-125(d) authorizes the program only for calendar years 2026
  # and 2027, so in effect is false at 2028-01-01. The PY2027 parameters deck
  # and the 8-4-2026 Board minutes confirm that continuing it in 2028 needs
  # new legislation. Abrogation trigger: COMAR 14.35.21.01B and Ch.468 of 2025 §2
  # abrogate the program "with no further action" if the federal enhanced APTC
  # is extended for plan years 2026-2027.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

