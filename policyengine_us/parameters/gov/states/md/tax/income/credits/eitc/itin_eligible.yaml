description: Maryland computes its state and local earned income credits without the Social Security number limitation of IRC 32(m), accepting an individual taxpayer identification number or any Social Security number for the filer, spouse and qualifying children, if this is true.
values:
  2014-01-01: false
  # Chapter 40 of 2021 (SB 218) applies to taxable years beginning after
  # December 31, 2019. It was to end with 2022; Chapters 3 and 4 of 2023
  # (SB 552, HB 547) struck the end date.
  2020-01-01: true
