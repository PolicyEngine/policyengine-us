description: Maryland assigns this unemployment insurance contribution rate to each new employer outside the construction industry.
values:
  2018-01-01: 0.026
  # The Division of Unemployment Insurance's January 2021 page gave 2.6%; its
  # May 2021 pages and its January 2022 presentation give 2.3% for 2021.
  2021-01-01: 0.023
  2024-01-01: 0.026
  # From 2026, Labor and Employment Article Section 8-605.1(b)(2) subtracts
  # 0.15% from each contribution rate, with a 1% floor for new employers, and
  # Section 8-605.1(b)(1) adds a separate 0.15% administrative fee, which
  # PE-US leaves out. The Maryland Department of Labor's 2026 pages give only
  # a 1.0% to 2.6% range for new employers, so PE-US starts from the 2.6% that
  # the U.S. Department of Labor's July 2026 Significant Provisions report
  # lists.
  2026-01-01: 0.0245

