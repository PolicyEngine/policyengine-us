description: Maryland limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # The General Assembly set this $8,500 base in Labor and Employment Article
  # Section 8-607(b)(1) in Chapter 554 of 1992, raising it from $7,000.
  2018-01-01: 8_500

