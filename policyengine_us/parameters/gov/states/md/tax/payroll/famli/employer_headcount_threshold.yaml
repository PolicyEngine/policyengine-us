description: Maryland requires employers with at least this many employees to pay the employer share under the Family and Medical Leave Insurance program.
values:
  0000-01-01: 0
  # A smaller employer owes no employer share but still remits the employee
  # share. The count covers every employee paid wages, inside or outside
  # Maryland.
  2027-01-01: 15

