description: Maryland applies this total contribution rate to wages up to the Social Security wage base under the Family and Medical Leave Insurance program.
values:
  0000-01-01: 0
  # The Secretary of Labor sets the rate; the statute caps it at 1.2% of wages
  # and fixes no number. Maryland Labor set 0.9% for wages paid in 2027. The
  # Secretary sets the 2028 rate by November 1, 2027.
  2027-01-01: 0.009

