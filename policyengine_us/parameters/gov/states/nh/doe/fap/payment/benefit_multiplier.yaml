description: New Hampshire provides this share of the delivered-fuel scheduled benefit under the Fuel Assistance Program.
# Whole-dollar half-up rounding reproduces all 24 published utility cells.
# Unsupported fuels have no published multiplier; zero marks an unsupported
# amount, not a legal zero benefit.
UNSPECIFIED:
  2026-10-01: 0
ELECTRICITY:
  2026-10-01: 0.75
NATURAL_GAS:
  2026-10-01: 0.75
FUEL_OIL:
  2026-10-01: 1
KEROSENE:
  2026-10-01: 1
PROPANE:
  2026-10-01: 1
# Existing WOOD also represents pellets, bio-bricks and winter blends, which
# share the 1.000 multiplier.
WOOD:
  2026-10-01: 1
COAL:
  2026-10-01: 1
SOLAR:
  2026-10-01: 0
OTHER:
  2026-10-01: 0
NONE:
  2026-10-01: 0

