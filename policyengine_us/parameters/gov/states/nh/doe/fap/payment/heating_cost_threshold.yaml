description: New Hampshire uses these inclusive lower annual heating cost thresholds for benefit bands above the lowest band under the Fuel Assistance Program.
# The PY26 chart and the PY2027 manual both start band CC at $1,000.
CC:
  2026-10-01: 1_000
BB:
  2025-10-01: 1_500
  2026-10-01: 1_750
AA:
  2025-10-01: 1_750
  2026-10-01: 3_500

# Page 78 utility labels overlap at the endpoints; the non-overlapping
# page 77 Heating Cost Tiers table and delivered schedule establish the tiers.
# The PY26 chart's labels ("$1,000 OR LESS", "$1,000 UP TO $1,500",
# "$1,500 UP TO $1,750", "$1,750 & UP") also overlap at the endpoints. The
# model reads each lower bound as inclusive, as "$1,750 & UP" and the PY2027
# tiers do, so a cost of exactly $1,000 falls in band CC.
metadata:
  unit: currency-USD
  period: year
  label: New Hampshire FAP heating cost band thresholds
  reference:
    - title: PY26 New Hampshire Fuel Assistance Program Benefits, Annual Heating Costs
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/NH_BenefitMatrix_2026.pdf#page=1
    - title: "PY2027 New Hampshire Fuel Assistance Program Procedures Manual, Benefit Determination, Heating Cost Tiers and Benefits #page 76-78"
      href: https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf#page=76
