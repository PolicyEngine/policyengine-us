description: PolicyEngine applies this annual exclusion once to each SPM unit's combined interest and dividend income under the New Hampshire Fuel Assistance Program.
# Modeling convention: apply one $50 annual exclusion per SPM unit to
# combined interest and dividends, as requested by the user.
# The PY2027 manual lists the first $50 of interest and dividends separately
# on pages 15-16, but page 17 combines them as interest "and/or" dividends.
# It does not specify whether the allowance applies per person or household.
# The combined-source, SPM-unit basis is an explicit modeling assumption
# pending agency clarification.
values:
  2026-10-01: 50

