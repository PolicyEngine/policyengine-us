description: New Hampshire counts these unearned income sources under the Fuel Assistance Program.
# nh_fap_countable_income adds adult SSI, FANF and interest and dividends
# above the $50 exclusion to these sources.
values:
  2026-10-01:
    - social_security
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - railroad_benefits
    - survivor_benefits
    - veterans_benefits
    - total_unemployment_compensation
    - workers_compensation
    - disability_benefits
    - nh_ssp
    - strike_benefits
    - financial_assistance
    - alimony_income
    - rental_income
    - farm_rent_income
    - estate_income
    - gambling_winnings

# Broad receipts approximate the source's regular payments. Inputs do not
# identify VA Aid and Attendance, educational VA benefits, special-needs
# trusts, or irregular injury/insurance payments. Financial assistance lacks
# the required six-month regularity flag. nh_ssp holds the APTD, ANB and OAA
# state welfare payments, FANF is included separately once per SPM unit, and
# RCA has no input. Page 15's state welfare payments are APTD, ANB, FANF, OAA
# and RCA, and plan item 1.9 leaves General Assistance benefits unchecked, so
# municipal general assistance (RSA 165) is not counted.
# Rental inputs are treated as net and nonnegative without reconstructing
# business expenses. Pension income includes annuities and insurance income.
# Gambling winnings approximate the taxable gambling and lottery category.
# Missing taxable grants, adoption subsidies, royalties and tribal receipts
# are not imputed; balances, capital gains and regular child support received
# are not counted as income.
metadata:
  unit: list
  period: year
  label: New Hampshire FAP unearned income sources
  reference:
