description: New Hampshire includes these unearned income sources under the Fuel Assistance Program before its source-specific SSI and investment income exclusions.
values:
  2026-10-01:
    - social_security
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - railroad_benefits
    - survivor_benefits
    - veterans_benefits
    - total_unemployment_compensation
    - workers_compensation
    - disability_benefits
    - general_assistance
    - strike_benefits
    - financial_assistance
    - alimony_income
    - rental_income
    - farm_rent_income
    - estate_income
    - gambling_winnings

# Broad receipts approximate the source's regular payments. Inputs do not
# identify VA Aid and Attendance, educational VA benefits, special-needs
# trusts, or irregular injury/insurance payments. Financial assistance lacks
# the required six-month regularity flag. General assistance approximates
# non-FANF state welfare; FANF is included separately once per SPM unit.
# Rental inputs are treated as net and nonnegative without reconstructing
# business expenses. Pension income includes annuities and insurance income.
# Gambling winnings approximate the taxable gambling and lottery category.
# Military pay is part of wages and is not added again. Missing taxable grants,
# adoption subsidies, royalties and tribal receipts are not imputed; balances,
# capital gains and regular child support received are not counted as income.
metadata:
  unit: list
  period: year
  label: New Hampshire FAP unearned income sources
  reference:
    - title: "PY2027 New Hampshire Fuel Assistance Program Procedures Manual, Countable Income, Non-countable Income, and Rental Property Income #page 15-17,23,29"
      href: https://www.energy.nh.gov/sites/g/files/ehbemt551/files/inline-documents/sonh/fuel-assistance-program-procedures-manual.pdf#page=15
