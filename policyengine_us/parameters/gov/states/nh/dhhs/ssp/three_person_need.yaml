description: 'New Hampshire uses this standard of need for an adult, spouse and needy essential person. The 2026 value is calculated under He-W 658.03(e): the published 2025 standard of $1,934 plus the SSI couple increase of $41 and essential-person increase of $14.'
values:
  2026-01-01: 1_989

