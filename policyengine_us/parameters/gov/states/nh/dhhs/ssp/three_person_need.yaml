description: New Hampshire sets this standard of need for a three-person independent-living assistance group under the adult category financial assistance program.
values:
  # NOTE: NH's three-person standard is DHHS's stated SSI maximum for a couple
  # and needy essential person less $12 ($1,988 - $12 = $1,976 in 2026). That
  # maximum usually equals the couple rate plus the SSI essential person
  # increment, but not in 2026 ($1,491 + $498 = $1,989), so the published
  # standard is kept and needs a new value each January.
  2026-01-01: 1_976

metadata:
