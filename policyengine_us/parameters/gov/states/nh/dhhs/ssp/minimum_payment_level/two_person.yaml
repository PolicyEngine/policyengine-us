description: New Hampshire maintains this minimum supplemental payment level for a two-person independent-living assistance group under the adult category financial assistance program.
values:
  # SR 26-01: the $1,492 standard less the $1,491 SSI maximum for an individual
  # and either a spouse or needy essential person, plus the $20 standard
  # disregard. SSA's January 1998 and January 2011 tables print the same $21
  # couple supplement, and NH's January releases match it from 1999 to 2026.
  1998-01-01: 21

