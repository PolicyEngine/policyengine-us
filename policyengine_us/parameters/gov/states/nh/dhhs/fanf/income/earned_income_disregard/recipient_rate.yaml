description: New Hampshire excludes this share of earnings from countable income for recipients under the Financial Assistance to Needy Families program.
# The Cliff Effect Initiative's 75% (and 100% for high-demand jobs) earned
# income disregard was a two-year pilot (October 2022 - September 2024) for
# participants who started or moved to full-time work. It did not amend
# He-W 654.13(e), which keeps the 50% rate for recipients, and it is not
# modeled here.
values:
  1997-02-01: 0.5

