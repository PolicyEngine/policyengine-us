description: New Hampshire excludes this share of earnings from countable income in the eligibility test for applicants under the Financial Assistance to Needy Families program.
# He-W 654.13(b) and (c) limit this rate to the eligibility test of applicants
# who have not received FANF in any of the previous 6 months. The benefit
# amount of an eligible applicant uses the recipient rate (He-W 654.13(d)).
values:
  1997-02-01: 0.2

