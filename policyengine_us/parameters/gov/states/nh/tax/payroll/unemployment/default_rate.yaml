description: New Hampshire assigns this unemployment compensation contribution rate, including the administrative contribution, to each new employer.
values:
  # New employers pay 2.7% less the fund balance reduction that RSA 282-A:82
  # applies that quarter.
  2018-01-01: 0.017
  2018-10-01: 0.012
  2020-04-01: 0.017
  # Adds the 0.5% emergency power surcharge of the third and fourth quarters
  # of 2020.
  2020-07-01: 0.032
  2021-01-01: 0.027
  2022-10-01: 0.022
  2023-04-01: 0.017

metadata:
  period: year
  unit: /1
  label: New Hampshire default unemployment tax rate
