description: Income sources in US AGI but not taxable under the PA income tax.
values:
  2021-01-01:
    - pa_nontaxable_pension_income
    - pa_nontaxable_retirement_distributions
    - pa_nontaxable_roth_conversions
    - taxable_unemployment_compensation
    - taxable_social_security
    - us_govt_interest
    - salt_refund_income
    - military_retirement_income
    # Sick pay and disability benefits other than regular wages, including
    # third-party insurer payments, and disability distributions (61 Pa.
    # Code 101.6(c)(1)). Regular sick leave pay is in employment income.
    - taxable_disability_benefits
    # Strike benefits are never taxable as PA compensation: the PIT Guide
    # lists them among the income items never taxable as compensation. Only
    # the part federal gross income holds (the part that is not a gift) is
    # subtracted, so a federal reform that drops it leaves PA income as it is.
    - strike_benefits_in_gross_income
metadata:
  unit: currency-USD
  label: PA nontaxable income sources
  reference:
    - title: 2021 Pennsylvania PIT Return Instructions (PA-40 IN) 
      href: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2021/2021_pa-40in.pdf#page=8
    - title: 61 Pa. Code § 101.6(c)(1) - Compensation excludes periodic sickness and disability payments other than regular wages
      href: https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/061/chapter101/s101.6.html
    - title: "2024 Pennsylvania PIT Return Instructions (PA-40 IN), nontaxable sick pay and disability benefits and Code 3 disability distributions #page 8,13"
      href: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2024/2024_pa-40in.pdf#page=8
    # Compensation is remuneration "received for services rendered" (72 P.S.
    # 7301(d)), which a union's strike benefit is not, and the guide lists
    # strike benefits among the "Income Items Never Taxable as PA
    # Compensation". Pennsylvania taxable income starts here from federal
    # gross income, so the part of strike benefits it holds is subtracted.
    - title: Pennsylvania Personal Income Tax Guide, Gross Compensation - income items never taxable as PA compensation
      href: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/gross-compensation.html#IncomeItemsNeverTaxablePA
