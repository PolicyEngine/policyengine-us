description: Proxy retirement age applied where a plan's own retirement criteria are not modeled. The Pennsylvania Personal Income Tax Guide applies this age to plans that are not employer provided and have no specific retirement criteria, such as an IRA. Employer-plan payments are exempt once the recipient retires after meeting the plan's own age or years-of-service condition, which the model approximates with this age.
values:
  2021-01-01: 59.5
