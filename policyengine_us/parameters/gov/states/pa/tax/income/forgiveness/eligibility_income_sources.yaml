description: Pennsylvania defines eligibility income based on these sources
values:
  2004-01-01:
    - pa_total_taxable_income # Not adjusted, i.e. no deductions.s
    - alimony_income
    - tax_exempt_interest_income
    # non-taxable dividends and gains
    # insurance proceeds and inheritances (Schedule SP line 4, includes survivor annuities)
    - military_retirement_pay_survivors
    # Strike benefits a union pays, which PA taxable income leaves out.
    # Eligibility income is "all moneys or property ... received of whatever
    # nature and from whatever source derived" (72 P.S. 7301(o.2)). Its (vi)
    # exclusion covers "payments made by employers or labor unions for
    # programs covering ... strike benefits", which 61 Pa. Code 101.6(c)(9)
    # reads, for the same words in the compensation definition, as payments
    # to a strike benefit plan. The Tax Forgiveness guide repeats the (vi)
    # words in its exclusions and counts employee payments to a cafeteria
    # plan for strike benefits. Schedule SP (2025) line 10 counts "any
    # payments received from other persons outside your household", line 5
    # counts gifts, and the list of income not to include leaves strike
    # benefits out. So the whole union payment counts, gift part included
    # (us-pa:tax-forgiveness-strike-benefits in candidates.yaml).
    - strike_benefits
    # gifts awards and prizes
    # non-PA income
    # nontaxable military income (military pension benefits excluded per PA-40 SP)
    # gain excluded from the sale of a residence
    # nontaxable education assistance
    # cash received for personal use outside your home
