description: Pennsylvania excludes this amount of monthly interest and dividends from countable income under the Low Income Home Energy Assistance Program.
# Handbook 650.3(9) counts interest and dividends "of more than $25 per month"
# (example: $25 of $50 counts). Plan section 601.82(4)(ix) (FY2026 page 51,
# FY2027 page 48) sets no threshold; the handbook governs.
values:
  2025-11-03: 25

metadata:
  unit: currency-USD
  period: month
  label: Pennsylvania LIHEAP monthly interest and dividend disregard
