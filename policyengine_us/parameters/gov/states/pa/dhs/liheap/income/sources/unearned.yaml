description: Pennsylvania counts these unearned income sources before the support disregard under the Low Income Home Energy Assistance Program.
values:
  2025-11-03:
    - social_security
    - ssi
    - pension_income
    - survivor_benefits
    - unemployment_compensation
    - strike_benefits
    - workers_compensation
    - disability_benefits
    - veterans_benefits
    - general_assistance
    - financial_assistance
    - pa_tanf
    - interest_income
    - ordinary_dividend_income
    - child_support_received
    - alimony_income
    - rental_income
    - farm_rent_income
    - retirement_distributions
# Pension subcomponents and auxiliary military retirement amounts are not added
# again. Actual IRA distributions are counted; capital gains are not a proxy for
# the source's broader CD withdrawals and stock sale proceeds.
metadata:
  unit: list
  period: year
  label: Pennsylvania LIHEAP unearned income sources
  reference:
    - title: Pennsylvania FY2026 LIHEAP State Plan, section 601.82(4), pages 50-51
      href: https://www.pa.gov/content/dam/copapwp-pagov/en/dhs/documents/services/assistance/documents/heating-assistance_liheap/2026-liheap-state-plan.pdf#page=50
    - title: Pennsylvania FY2027 LIHEAP State Plan, section 601.82(4), page 48
      href: https://www.pa.gov/content/dam/copapwp-pagov/en/dhs/documents/services/assistance/documents/heating-assistance_liheap/2027-liheap-state-plan.pdf#page=48
    - title: Pennsylvania FY2026 federally filed LIHEAP plan, section 1.9, page 6 (strike pay and General Assistance counted)
      href: https://liheapch.acf.gov/docs/2026/state-plans/PA_Plan_2026.pdf#page=6
