description: Pennsylvania counts these unearned income sources before the support disregard under the Low Income Home Energy Assistance Program.
# The formula counts Social Security net of the Medicare premium (section
# 601.84(10)) and the take-up-gated tanf aggregate. It floors each source
# listed here at zero (section 601.82(2)(ii)).
values:
  2024-11-04:
    - ssi
    # The state supplement counts with SSI (section 601.82(4)(iv)); no
    # section 601.84 exclusion covers it.
    - pa_ssp
    # pension_income already adds its taxable and tax-exempt components.
    - pension_income
    # Military retirement income adds retiree pay and Survivor Benefit Plan
    # annuities, separate inputs from the pension inputs that pension_income
    # adds and from survivor_benefits.
    - military_retirement_income
    # Railroad retirement annuities are pensions (section 601.82(4)(viii)).
    - railroad_benefits
    - survivor_benefits
    # Reported unemployment compensation, or modeled state unemployment
    # compensation when none is reported.
    - total_unemployment_compensation
    - strike_benefits
    - workers_compensation
    - disability_benefits
    - veterans_benefits
    - general_assistance
    - financial_assistance
    - child_support_received
    - alimony_income
    - rental_income
    - farm_rent_income
    # Actual IRA distributions are counted; capital gains are not a proxy for
    # the source's broader CD withdrawals and stock sale proceeds.
    - retirement_distributions
    # Section 601.82(4)(ix) counts interest and dividends in full.
    - interest_income
    - ordinary_dividend_income
