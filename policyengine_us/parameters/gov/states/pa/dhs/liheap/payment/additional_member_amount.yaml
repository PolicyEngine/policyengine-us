description: Pennsylvania adds this amount to the heating base for each household member after the first under the Low Income Home Energy Assistance Program.
# Read from the printed tables: within an income bracket, each added member
# raises the payment by this amount times the bracket multiplier, in every
# county and for every fuel (for example, $7 per member at $3,000-$3,999,
# where the multiplier is 1.4).
values:
  2024-11-04: 5
metadata:
  unit: currency-USD
  period: year
  label: Pennsylvania LIHEAP heating base amount per additional household member
