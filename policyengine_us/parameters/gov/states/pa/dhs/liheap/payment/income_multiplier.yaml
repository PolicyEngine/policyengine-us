description: Pennsylvania multiplies the heating base by this factor based on annual benefit income under the Low Income Home Energy Assistance Program.
# Handbook 638.3 groups income in $1,000 brackets, each with its own
# multiplier, higher for lower incomes; DHS does not print the multipliers.
# These values, read from the printed tables, are the same in the Energy Year
# 2024-2025 and 2025-2026 charts and the current lookup. From $20,000 every
# printed cell is the payment minimum, so the last bracket uses 0.
