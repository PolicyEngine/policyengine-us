description: Pennsylvania sets this electricity and propane heating base by heating region under the Low Income Home Energy Assistance Program.
# DHS publishes only the resulting payments. With the income multipliers, the
# additional member amount, half-up rounding to whole dollars and the payment
# minimum and maximum, these bases reproduce every printed electricity and
# propane cell in the Energy Year 2024-2025 and 2025-2026 charts and the current
# lookup. Each season starts on its Cash opening date: November 4, 2024,
# November 3, 2025 and November 2, 2026. The lookup has no season label; it is
# dated to the FY2027 season. The adopted FY2027 plan points to it through the
# DHS LIHEAP page. Propane shares the electricity row in every county and
# season.
