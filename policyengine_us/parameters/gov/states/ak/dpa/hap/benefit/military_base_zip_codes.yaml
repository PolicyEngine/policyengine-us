description: Alaska excludes residents of these military base ZIP codes under the Heating Assistance Program.
# The ZIP codes Addendum A prints beside the four installations it marks
# 0/USA. Kodiak Station CDP, the housing area of Coast Guard Base Kodiak,
# shares ZIP 99615 with the city of Kodiak, so its residents cannot be
# identified.
values:
  2026-10-01:
    - "99505"  # Fort Richardson
    - "99506"  # Elmendorf AFB
    - "99702"  # Eilson AFB
    - "99731"  # Fort Greely

