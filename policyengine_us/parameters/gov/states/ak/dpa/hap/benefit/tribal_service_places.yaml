description: Alaska excludes all residents of these tribe-served Census places under the Heating Assistance Program.
# Places whose every Addendum A row is marked 0 (the tribe serves all
# residents), matched by Census place name. The 0/USA military bases are in
# military_base_places instead. Approximated places inherit the all-resident
# tribal routing of the community whose oil points they take: the community
# that is the main listing for their ZIP code, or else the nearest listed
# community.
