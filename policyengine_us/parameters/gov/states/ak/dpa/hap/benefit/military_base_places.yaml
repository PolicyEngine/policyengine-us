description: Alaska excludes residents of these military base Census places under the Heating Assistance Program.
# Census delineates Eielson AFB CDP (21370) and Fort Greely CDP (26100) from
# the installations themselves, so their residents live on base. Addendum A
# marks both installations 0/USA. Kodiak Station CDP (41210) is the housing
# area of Coast Guard Base Kodiak, and Addendum A says Coast Guard members
# living on base in provided housing do not qualify. Eareckson Station CDP
# (20716) is drawn on Shemya Island around Eareckson Air Station, an Air Force
# installation; Addendum A lists no community there. Elmendorf AFB and Fort Richardson, also
# 0/USA, lie inside the Anchorage municipality with no separate Census place,
# so their residents cannot be identified.
values:
  2026-10-01: ["20716", "21370", "26100", "41210"]

