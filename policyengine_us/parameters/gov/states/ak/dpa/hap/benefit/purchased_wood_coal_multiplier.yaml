description: Alaska applies this share of community oil heating points for purchased wood or coal under the Heating Assistance Program.
# The model uses this purchased-fuel rule as an approved approximation for
# existing WOOD/COAL inputs without procurement or pellet detail. Actual
# self-harvested fuel and wood pellets use different published factors.
values:
  2026-10-01: 0.8

metadata:
  unit: /1
  period: year
  label: Alaska HAP purchased wood or coal point multiplier
  reference:
    - title: Alaska HAP Manual 3004-5, Grant Computation, Step 1
      href: http://dpaweb.hss.state.ak.us/manuals/HAP/3004/3004-5_grant_computation.htm
