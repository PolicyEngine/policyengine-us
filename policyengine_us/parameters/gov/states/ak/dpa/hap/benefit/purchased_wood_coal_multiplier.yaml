description: Alaska applies this share of community oil heating points for purchased wood or coal under the Heating Assistance Program.
# The model applies this purchased-fuel factor to every WOOD or COAL
# household, since heating_type cannot identify self-harvested fuel or wood
# pellets, whose factors differ under 7 AAC 44.080(c) and (e).
values:
  2026-10-01: 0.8

metadata:
  unit: /1
  period: year
  label: Alaska HAP purchased wood or coal point multiplier
  reference:
