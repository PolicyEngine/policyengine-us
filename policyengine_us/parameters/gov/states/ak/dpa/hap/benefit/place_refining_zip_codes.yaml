description: Alaska assigns separate heating points to a community inside a larger Census place in these ZIP codes under the Heating Assistance Program.
# For these ZIP codes the ZIP code table, not the place table, supplies the
# points and routing. Chugiak has 7 oil points in Addendum A and Appendix A to
# 7 AAC 44 and lies inside the Anchorage municipality (place 03000, 8 points),
# which has no separate Census place for it.
values:
  2026-10-01:
    - "99567"  # Chugiak

