description: Alaska limits a household sharing its dwelling to this share of its calculated award under the Heating Assistance Program.
# Approved manual-based convention: section 3002-1 A.3-5 divides each award
# by the number of eligible households, with this maximum share even when
# only one sharing household is eligible. Actual heating payments do not
# determine the share. This conflicts with 7 AAC 44.035(c) actual-cost sharing
# and the earlier points adjustment in 44.080(h) and grant manual step 2.
# This selection does not establish a regulatory amendment or verify
# historical years before FY2027.
values:
  2026-10-01: 0.5

metadata:
  unit: /1
  period: year
  label: Alaska HAP maximum shared household benefit share
