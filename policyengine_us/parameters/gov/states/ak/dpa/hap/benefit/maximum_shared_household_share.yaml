description: Alaska limits a household sharing its dwelling to this share of its heating points under the Heating Assistance Program.
# 7 AAC 44.080(h) reduces a sharing household's points to its proportionate
# share of the dwelling's heating expenses. When no household in the dwelling
# reports a heating expense, as with heat included in rent, that share cannot
# be measured, so manual 3002-1 A.5 fills the gap: an equal share for each
# eligible household, at most this share.
values:
  2026-10-01: 0.5

metadata:
  unit: /1
  period: year
  label: Alaska HAP maximum shared household share
