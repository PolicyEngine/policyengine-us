description: Alaska assigns these oil heating points to the largest community in each ZIP code under the Heating Assistance Program.
# Derived ZIP code crosswalk for a household with no listed Census place
# (community_points); this is not a state-issued table. Addendum A assigns
# points to communities and prints one ZIP code beside each. Here each ZIP
# code takes the points of the community where most of its residents live,
# from 2020 Census block counts by Census place and ZIP Code Tabulation Area,
# with each place's points taken from community_points.
# - 227 ZIP codes are both Census areas and Addendum A listings. Each takes
#   the points of a community Addendum A lists under it, except 99613, which
#   takes King Salmon's 13 (Addendum A lists King Salmon under 99549).
#   ZIP 99567 lies wholly inside the Anchorage municipality, so Census counts
#   cannot rank the three communities Addendum A lists there. It takes 7, the
#   points of Chugiak, the Postal Service's city name for the ZIP code;
#   Eklutna and Peters Creek are listed at 8, the value community_points
#   gives the whole municipality.
# - 15 Census ZIP codes are not in Addendum A (99502, 99503, 99504, 99507,
#   99508, 99515, 99516, 99517 and 99518 in Anchorage, and 99519, 99635,
#   99652, 99694, 99734 and 99775) and take their largest Census place's
#   points.
# - Six Addendum A ZIP codes have no Census area (99545, 99716, 99731, 99821,
#   99928 and 99950) and take the points Addendum A lists for them.
# 30 ZIP codes hold communities with different points, and every household
# there gets the largest community's points; outside ZIP 99567, about 97% of
# Alaskans in a Census place keep their own community's points. ZIP 99901
# follows Ketchikan (4) and 99780 follows Tok (12), so a Loring or Tetlin
# household that sends only its ZIP code gets those points, not the 5 and 16
# community_points holds for the two places.
# A household whose ZIP code is not listed takes its borough's points
# (county_points).
