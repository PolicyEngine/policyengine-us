description: Alaska deducts this share of heating points for subsidized households that pay heating costs directly under the Heating Assistance Program.
# 7 AAC 44.080(l) halves the points determined under (a)-(k), regardless of
# the allowance amount, before the 2.0-point minimum in (m) and the rounding
# in (n).
values:
  2026-10-01: 0.5

