description: Alaska includes these supplied net business income sources under the Heating Assistance Program.
values:
  2026-10-01:
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

# Existing net sources, each floored at zero, stand in for gross less
# allowable current costs.
# No second 50% standard expense deduction is applied. Partnership/S-corporation
# aggregate includes its components, which must not also be added separately.
metadata:
