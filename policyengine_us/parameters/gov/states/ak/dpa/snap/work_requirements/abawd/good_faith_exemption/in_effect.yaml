# FNS approved Alaska's good-faith-effort exemption under
# 7 U.S.C. 2015(o)(7) effective 2025-11-01 through 2026-10-31. During this
# window Alaska is approved to temporarily retain a specified set of
# pre-HR1 ABAWD exceptions (see the good_faith_exemption parameters and
# meets_snap_abawd_work_requirements) on top of the post-HR1 exception set,
# while HR1's new Alaska Native/Indian exception remains in effect. This
# toggle is TRUE only during that window; the geographic area waiver for
# the 29 non-Anchorage boroughs is carried separately by waived_counties.
description: Alaska temporarily retains the approved pre-HR1 Able-Bodied Adult Without Dependents exceptions under its Supplemental Nutrition Assistance Program good-faith-effort exemption when this is true.

values:
  0000-01-01: false
  2025-11-01: true
  2026-11-01: false

