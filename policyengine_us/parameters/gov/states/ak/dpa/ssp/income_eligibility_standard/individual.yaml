description: Alaska sets this amount as the income eligibility standard for an individual living independently under the Adult Public Assistance program.
values:
  # The 2018 and 2019 amounts are the Adult Public Assistance need standard.
  # Since January 2020, Medicaid disregards income between the Adult Public
  # Assistance payment standard and this amount (ADLTC 530 C; AK-26-0001).
  2018-01-01: 1_393
  2019-01-01: 1_432
  2020-01-01: 1_455
  2021-01-01: 1_474
  2022-01-01: 1_561
  2023-01-01: 1_697
  2024-01-01: 1_751
  2025-01-01: 1_795
  2026-01-01: 1_845

metadata:
  unit: currency-USD
  period: month
  label: Alaska APA income eligibility standard (individual)
  # 7 AAC 40.310(c) raises the standards each January 1 by the Social Security
  # cost-of-living percentage.
  uprating:
    parameter: gov.ssa.uprating
    rounding:
      type: nearest
      interval: 1
  reference:
    - title: 7 AAC 40.310(a) and (c) - Income Eligibility Standards ($1,047 for an individual and $1,551 for a couple, raised each January by the Social Security cost-of-living percentage)
      href: https://www.law.cornell.edu/regulations/alaska/7-AAC-40.310
    - title: Alaska DPA, Adult Public Assistance Need and Maximum Payment Standards, 2018-2021 (need standards for 2018 and 2019)
      href: https://web.archive.org/web/20210102211125/http://dpaweb.hss.state.ak.us/POLICY/PDF/APA-Standards.pdf
    - title: Alaska Aged, Disabled and Long Term Care Medicaid Manual, Addendum 1 - Expanded Refused Cash Income Limits, 2020-2021 (archived January 2, 2021)
      href: https://web.archive.org/web/20210102215241/http://dpaweb.hss.state.ak.us/manuals/adltc/addenda/addendum_1.htm
    - title: Alaska Aged, Disabled and Long Term Care Medicaid Manual, Addendum 1 - Expanded Refused Cash Income Limits, 2022-2024 (archived March 9, 2024)
      href: https://web.archive.org/web/20240309020647/http://dpaweb.hss.state.ak.us/manuals/adltc/addenda/addendum_1.htm
    - title: Alaska Aged, Disabled and Long Term Care Medicaid Manual, Addendum 1 - Expanded Refused Cash Income Limits, 2024-2026
      href: http://dpaweb.hss.state.ak.us/manuals/adltc/addenda/addendum_1.htm
    - title: Alaska Medicaid State Plan Amendment AK-26-0001, income disregard between the Adult Public Assistance standard and $1,845 (individual) or $2,732 (couple), effective January 1, 2026
      href: https://www.medicaid.gov/medicaid/spa/downloads/AK-26-0001.pdf#page=13
