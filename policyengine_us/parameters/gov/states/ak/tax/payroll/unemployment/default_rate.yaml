description: Alaska assigns each new employer the rate for its industry, so this parameter uses the state's average employer contribution rate on taxable wages; from 2025 every industry's new-employer rate is 1 percent.
values:
  # Average employer tax rate as a percent of taxable wages, which leaves out
  # the employee contributions that Alaska also collects.
  2018-01-01: 0.01
  2021-01-01: 0.0141
  2022-01-01: 0.0153
  2023-01-01: 0.0104
  # 2024 average, then the uniform 1 percent new-employer rate for 2025 and 2026.
  2024-01-01: 0.01

metadata:
  period: year
  unit: /1
  label: Alaska default unemployment tax rate
