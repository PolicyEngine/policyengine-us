description: Alaska taxes each employee's wages up to this amount a year for unemployment insurance, on both the employer and the employee contributions.
values:
  2018-01-01: 39_500
  2019-01-01: 39_900
  2020-01-01: 41_500
  2021-01-01: 43_600
  2022-01-01: 45_200
  2023-01-01: 47_100
  2024-01-01: 49_700
  2025-01-01: 51_700
  2026-01-01: 54_200

