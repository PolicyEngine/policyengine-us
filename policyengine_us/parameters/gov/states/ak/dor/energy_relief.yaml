description: Alaska provides this one-time energy relief payment with the Permanent Fund Dividend. The amount is zero in years without a payment.

values:
  2015-01-01: 0
  2022-01-01: 662
  2023-01-01: 0
  2024-01-01: 298.17
  2025-01-01: 0
  2026-01-01: 200
  # Each payment needs its own appropriation, and no budget has made one for
  # 2027 or later.
  2027-01-01: 0

