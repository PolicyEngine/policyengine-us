description: Alaska limits the Permanent Fund Dividend to people with these immigration statuses.

values:
  # 15 AAC 23.154(a) counts conditional permanent residents and aliens on
  # indefinite parole as lawfully admitted for permanent residence.
  # PolicyEngine has no status for either, so code them as
  # LEGAL_PERMANENT_RESIDENT. PAROLED_ONE_YEAR stays out because it does not
  # say whether a parole is indefinite.
  2015-01-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE

