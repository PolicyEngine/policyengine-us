description: Alaska limits the Permanent Fund Dividend to people with these immigration statuses.

values:
  # In State v. Andrade, 23 P.3d 58 (Alaska 2001), the Alaska Supreme Court
  # held that "lawfully admitted for permanent residence" in AS
  # 43.23.005(a)(5)(B) does not incorporate the federal definition: an alien
  # must be legally present and able to form the intent to remain in Alaska.
  # In 15 AAC 23.154(a), the Department of Revenue applies that reading to a
  # status under 8 U.S.C. 1101 to 1189 that lets the alien adopt the United
  # States as their domicile: an immigrant, a nonimmigrant whose status
  # requires no foreign residence, a person on indefinite parole, or a
  # conditional permanent resident. PolicyEngine has no status for the last
  # three, so code them as LEGAL_PERMANENT_RESIDENT.
  #
  # PolicyEngine leaves the other statuses out. PAROLED_ONE_YEAR does not say a
  # parole runs indefinitely, and in OAH No. 25-3180-PFD an administrative law
  # judge upheld the Permanent Fund Dividend Division's denial of a fixed-term
  # parolee's dividend. TPS (8 U.S.C. 1254a) and DEPORTATION_WITHHELD (8 U.S.C.
  # 1231(b)(3)) fall outside 8 U.S.C. 1101 to 1189, and a person coded DACA
  # holds no status under those sections. A person coded UNDOCUMENTED lacks the
  # legal presence the court required in Andrade. CUBAN_HAITIAN_ENTRANT and
  # CONDITIONAL_ENTRANT do not say whether the person may adopt the United
  # States as their domicile.
  2015-01-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE

