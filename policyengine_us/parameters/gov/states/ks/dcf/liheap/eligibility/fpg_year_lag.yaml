description: Kansas uses federal poverty guidelines from this many years before the modeled heating season for the income limit under the Low Income Energy Assistance Program.
# Verified for FY2025 and FY2026: their limits use the 2024 and 2025
# guidelines, respectively. This is a relative year selection, not a fixed
# guideline year. Earlier and later Kansas policy remains unverified.
values:
  2024-10-01: 1

