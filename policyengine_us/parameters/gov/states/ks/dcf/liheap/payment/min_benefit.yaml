description: Kansas pays at least this annual benefit to eligible households under the Low Income Energy Assistance Program.
# The state plans also report a maximum benefit ($2,232 for FY2025, $4,301 for
# FY2026) that is at least every matrix cell in its year, so an additional cap cannot bind.
values:
  2024-10-01: 100
  2025-10-01: 130

metadata:
  unit: currency-USD
  period: year
  label: Kansas LIEAP minimum benefit
  reference:
    - title: Kansas LIHEAP FY2026 State Plan, Section 2.6 (minimum benefit $130, maximum benefit $4,301)
      href: https://liheapch.acf.gov/docs/2026/state-plans/KS_Plan_2026.pdf#page=9
    - title: Kansas LIHEAP FY2025 State Plan, Section 2.6 (minimum benefit $100, maximum benefit $2,232)
      href: https://liheapch.acf.gov/docs/2025/state-plans/KS_Plan_2025.pdf#page=9
    - title: LIHEAP Clearinghouse Kansas state profile (heating $130 minimum, $4,301 maximum)
      href: https://liheapch.acf.gov/profiles/Kansas.htm
