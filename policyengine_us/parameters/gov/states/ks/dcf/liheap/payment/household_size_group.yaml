description: Kansas assigns households to this benefit matrix size group based on the number of countable household members under the Low Income Energy Assistance Program.
brackets:
  # Household size 1-4.
  - threshold:
      2024-10-01: 0
    amount:
      2024-10-01: 1
  # Household size 5 and over.
  - threshold:
      2024-10-01: 5
    amount:
      2024-10-01: 2

metadata:
  type: single_amount
  threshold_unit: person
  amount_unit: /1
  period: year
  label: Kansas LIEAP household size group
