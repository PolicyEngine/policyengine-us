description: Kansas counts these unearned income sources in gross household income under the Low Income Energy Assistance Program.
values:
  2024-10-01:
    - unemployment_compensation
    - strike_benefits
    # SSA benefits are counted gross, including the Medicare deduction.
    - social_security
    - ssi
    - pension_income
    - general_assistance
    - ks_tanf
    - rental_income
    - alimony_income
    - child_support_received
    # Plan counts "insurance payments made directly to the insured".
    - workers_compensation
    # KEESM 13361 exempts only the incomes it lists; employer disability benefits are not among them.
    - disability_benefits
    - veterans_benefits
    - ks_liheap_countable_interest_dividend_income
    # KEESM 13360-13361 explicitly count interest except for specific
    # exemptions; the plan's unchecked combined interest/dividend/royalty
    # box is not a blanket exclusion. Other irregular receipts and source-
    # specific exclusions require a direct countable-income input.
    # Contract or mortgage payments, legal settlements and adoption support
    # have no model input and also require a direct countable-income input.

metadata:
