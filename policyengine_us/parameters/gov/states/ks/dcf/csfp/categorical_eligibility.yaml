description: Kansas provides categorical income eligibility for the Commodity Supplemental Food Program to participants in these programs.
# Any positive amount or reported receipt in a listed variable confers
# eligibility for the month. fdpir is annual and enters the monthly sum as
# one twelfth of the yearly amount.
values:
  2000-01-01: []
  2025-04-11:
    - ssi
    - receives_ssi
    - snap
    - receives_snap
    - fdpir
    # msp reflects computed Medicare Savings Program eligibility gated only by
    # takes_up_msp_if_eligible, which defaults to true; there is no reported-
    # receipt input, unlike receives_ssi and receives_snap. Until the microdata
    # assigns MSP take-up, this leg is modeled at full take-up and the Kansas
    # CSFP figure is an upper bound.
    - msp
    # Low Income Subsidy also qualifies under the state plan but is not modeled.

metadata:
  unit: list
  period: month
  label: Kansas Commodity Supplemental Food Program categorical income eligibility programs
  reference:
    - title: Kansas CSFP State Plan - Categorical eligibility program list
