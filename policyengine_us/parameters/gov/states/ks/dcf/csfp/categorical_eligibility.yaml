    - title: Kansas CSFP State Plan - Effective date
      href: https://www.dcf.ks.gov/services/ees/Documents/Food_Distribution_Programs/CSFPStatePlan.pdf#page=2
    - title: 7 CFR 247.9(b)(1) and (3) - Eligibility requirements
