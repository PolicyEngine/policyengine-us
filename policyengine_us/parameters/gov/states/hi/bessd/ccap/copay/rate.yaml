description: Hawaii sets this co-payment percentage under the Child Care Subsidy program, by the family's gross income as a share of the federal poverty guidelines.

metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: /1
  period: year
  label: Hawaii CCAP co-payment rate by FPG ratio
  reference:
    # HAR 17-798.3-14(3) (eff. 2021-08-06, page 35 of the chapter PDF)
    # determines the co-payment tier from Exhibit II, dated January 2,
    # 2020, attached at the end of the chapter; step (4) multiplies the
    # tier by the family unit's monthly gross income. The percentages
    # below are the Exhibit II column headings. The superseded
    # 17-798.2-14(b)(4) used the same tier scale but multiplied it by the
    # department's maximum rate allowable (see income_based_in_effect.yaml).
    - title: HAR 17-798.3, Exhibit II Child Care Gross Income Eligibility Limits and Sliding Fee Scale (dated January 2, 2020), applied under 17-798.3-14(3) (tier selection; the multiply is step (4))
      href: https://humanservices.hawaii.gov/bessd/files/2021/09/CHAPTER-17-798.3-Child-Care-Payments.pdf#page=73
    # The same Exhibit II scale as a standalone scanned chart (eff
    # 2020-01-02), mapping each FPG band to its co-payment percentage.
    - title: Hawaii DHS Child Care Gross Income Eligibility Limits and Sliding Fee Scale (Exhibit II), effective 2020-01-02
      href: https://childcaresubsidyapplication.dhs.hawaii.gov/Child-Care-Gross-Income-Eligibility-Limits-and-Sliding-Fee-Scale

# Bands are "above X%" boundaries (e.g., 101-115% means above 100% up to
# 115% FPG), so each threshold is shifted by 0.0001 to keep families at
# exactly the band top in the lower band.
brackets:
  - threshold:
