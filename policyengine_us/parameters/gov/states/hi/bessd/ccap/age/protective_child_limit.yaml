description: Hawaii limits the Child Care Subsidy program for a child receiving child protective services under court supervision to children younger than this age.
# HAR 17-798.3-9(a)(5) (17-798.2-9(a)(3) before August 6, 2021) covers a child
# receiving child protective services whose court-ordered case plan specifies
# child care; HAR 17-798.3-2 (17-798.2-2) defines a child as under 18.
values:
  2008-03-08: 18
