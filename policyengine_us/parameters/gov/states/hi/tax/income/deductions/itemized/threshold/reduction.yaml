description: Hawaii reduces itemized deductions for filers with Hawaii adjusted gross income above this amount, based on filing status, under the overall limitation on itemized deductions.


SINGLE:
  2021-01-01: 166_800
JOINT:
  2021-01-01: 166_800
HEAD_OF_HOUSEHOLD:
  2021-01-01: 166_800
SEPARATE:
  2021-01-01: 83_400
SURVIVING_SPOUSE:
  2021-01-01: 166_800

