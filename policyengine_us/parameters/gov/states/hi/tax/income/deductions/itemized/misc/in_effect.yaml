description: Hawaii allows miscellaneous itemized deductions above the adjusted gross income floor if this is true.
values:
  # HRS 235-2.4 made section 67 operative except for the section 67(g)
  # suspension for 2018 through 2025. Act 35, SLH 2026 strikes that exception
  # for taxable years beginning after December 31, 2025.
  2021-01-01: true
  2026-01-01: false
