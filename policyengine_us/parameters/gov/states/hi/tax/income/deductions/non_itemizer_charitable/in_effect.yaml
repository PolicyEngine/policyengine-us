description: Hawaii allows the federal charitable deduction for taxpayers who do not itemize if this is true.
values:
  # Act 13, SLH 2020 adopted the 2020 deduction, which reduced federal
  # adjusted gross income for taxpayers who did not itemize on their federal
  # return; PolicyEngine applies it to Hawaii non-itemizers below the line.
  # Act 89, SLH 2021 adopted section 170(p) for 2021. The federal amount is
  # zero for 2022 to 2025. Act 35, SLH 2026 conforms to section 170(p) as
  # amended by P.L. 119-21 for taxable years beginning after December 31, 2025.
  2020-01-01: true
metadata:
  unit: bool
  period: year
  label: Hawaii non-itemizer charitable deduction in effect
  reference:
    - title: 2020 Hawaii N-11 Instructions, Changes to Note
      href: https://files.hawaii.gov/tax/forms/2020/n11ins.pdf#page=2
    - title: 2021 Hawaii N-11 Instructions, Line 23
