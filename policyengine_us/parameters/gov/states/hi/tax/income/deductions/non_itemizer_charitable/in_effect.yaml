    - title: Hawaii Department of Taxation Announcement No. 2026-06, Act 35
      href: https://files.hawaii.gov/tax/news/announce/ann26-06.pdf#page=2
    - title: 26 U.S. Code 170(p)
      href: https://www.law.cornell.edu/uscode/text/26/170#p
