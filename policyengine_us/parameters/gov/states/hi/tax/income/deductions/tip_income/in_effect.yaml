description: Hawaii allows the federal deduction for qualified tips if this is true.
values:
  # For 2025, HRS 235-2.3(a) conforms to the Internal Revenue Code as amended
  # as of December 31, 2024, before P.L. 119-21 added section 224.
  2025-01-01: false
  # Act 35, SLH 2026 conforms to the Internal Revenue Code as amended as of
  # December 31, 2025 and does not make section 224 inoperative.
  2026-01-01: true
  # Section 224(h) allows no deduction for taxable years beginning after
  # December 31, 2028.
  2029-01-01: false
