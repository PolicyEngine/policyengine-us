description: >-
  Hawaii provides the following refundable tax credits. One-time rebates are included
  for the eligibility tax year identified by the return, even when payment occurs later.
  A standalone rebate value does not establish inclusion in this total.
values:
  # Model years start in 2015. The Act 115 refund went only to filers of a
  # 2021 Form N-11.
  2000-01-01:
    - hi_food_excise_credit
    - hi_cdcc
    - hi_tax_credit_for_low_income_household_renters

  2021-01-01:
    - hi_food_excise_credit
    - hi_cdcc
    - hi_tax_credit_for_low_income_household_renters
    - hi_act_115_rebate

  2022-01-01:
    - hi_food_excise_credit
    - hi_cdcc
    - hi_tax_credit_for_low_income_household_renters
    - hi_claim_of_right_credit

  2023-01-01:
    - hi_food_excise_credit
    - hi_cdcc
    - hi_tax_credit_for_low_income_household_renters
    - hi_eitc
    - hi_claim_of_right_credit

