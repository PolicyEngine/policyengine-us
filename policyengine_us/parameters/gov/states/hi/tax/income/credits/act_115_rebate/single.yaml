description: >-
  Hawaii provides this ACT 115 rebate amount per qualified exemption for single, head of
  household, and separate filers, based on federal adjusted gross income. PolicyEngine
  attributes the one-time Act 115 refund paid in 2022 to eligibility tax year 2021.
  These schedules can persist for later standalone calculations; the dated
  refundable-credit total determines whether they affect income tax.
