description: Hawaii counts an employee's weekly wages toward the temporary disability insurance contribution only if the employee worked at least this many qualifying weeks in the prior 52 weeks.
values:
  # Act 30 of 1999 applies from 2000 and left this count in place. Later acts
  # did not change it. Zero marks earlier years, which this program does not model.
  0000-01-01: 0
  2000-01-01: 14

metadata:
  period: year
  unit: week
  label: Hawaii TDI minimum qualifying weeks to count weekly wages
  reference:
