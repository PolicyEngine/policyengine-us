description: Hawaii counts weekly wages up to this amount toward the employee temporary disability insurance contribution.
values:
  # Zero marks years before the first notice read (2003), not a law without a
  # wage base. The Director publishes one amount a year under HRS 392-43(b)(2):
  # the State's average annual wage / 52 * 1.21.
  0000-01-01: 0
  2003-01-01: 702.38
  2004-01-01: 720.70
  2005-01-01: 752.44
  2006-01-01: 791.70
  2007-01-01: 820.26
  2008-01-01: 842.56
  2009-01-01: 877.69
  2010-01-01: 901.70
  2011-01-01: 884.29
  2012-01-01: 903.28
  2013-01-01: 921.78
  2014-01-01: 940.05
  2015-01-01: 951.23
  2016-01-01: 982.36
  2017-01-01: 1_023.31
  2018-01-01: 1_068.62
  2019-01-01: 1_088.08
  2020-01-01: 1_119.44
  2021-01-01: 1_102.90
  2022-01-01: 1_200.30
  2023-01-01: 1_318.48
  2024-01-01: 1_374.78
  2025-01-01: 1_441.72
