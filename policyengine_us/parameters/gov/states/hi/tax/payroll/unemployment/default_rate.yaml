description: Hawaii assigns this unemployment insurance contribution rate to each new employer.
values:
  # These rates leave out the 0.01% employment and training assessment that
  # Section 383-129 adds to contributions.
  2018-01-01: 0.024
  2021-01-01: 0.03
  2023-01-01: 0.04
  2024-01-01: 0.03
  2025-01-01: 0.024

