description: Hawaii counts these represented income sources under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    - employment_income
    # Draft 5.2 counts military base pay, an input apart from employment_income;
    # enter it in one of the two.
    - military_basic_pay
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
    - total_unemployment_compensation
    - strike_benefits
    - social_security
    - ssi
    - pension_income
    - military_retirement_income
    - railroad_benefits
    - retirement_distributions
    - survivor_benefits
    - general_assistance
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - estate_income
    - life_insurance_benefits
    - financial_assistance
    - gambling_winnings
    - gi_cash_assistance
    # Jury pay, legal settlements and other receipts the plan checks.
    - miscellaneous_income
# Pension, Social Security and retirement-distribution components enter once.
# Military retirement includes Survivor Benefit Plan annuities.
# TANF is added once at household level; monthly SSI is annualized by aggregation.
# No minor-earnings exclusion applies. Receipts without a separate input, such as
# mortgage principal, are not policy exclusions. Royalties are in rental_income.
# Military housing and subsistence allowances have no input.
metadata:
  unit: list
  period: year
  label: Hawaii LIHEAP countable income sources
  reference:
    - title: "Hawaii FY2026 LIHEAP State Plan, countable income #page 6-7"
      href: https://liheapch.acf.gov/docs/2026/state-plans/HI_Plan_2026.pdf#page=6
