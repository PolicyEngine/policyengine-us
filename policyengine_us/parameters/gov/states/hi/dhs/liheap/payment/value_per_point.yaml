description: Hawaii gives this amount as an example value for each private-dwelling point under the Low Income Home Energy Assistance Program.
# Hawaii sets the final value after the June application month: the Energy Credit
# funds left after the flat-rate payments, divided by all private-dwelling points
# statewide (draft manual 6.4). That value is not published. The matrix's worked
# example uses 140, and the plan's 1,400 maximum benefit is ten points at 140.
# At 140 a two-point household receives 280, below the 375 minimum benefit that
# plan sections 2.6 and 3.6 estimate for FY2026. Draft manual 6.4 sets no floor,
# so none applies.
values:
  2025-10-01: 140
metadata:
  unit: currency-USD
  period: year
  label: Hawaii LIHEAP private dwelling value per point
  reference:
    - title: Hawaii FY2026 LIHEAP benefit matrix
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/HI_BenefitMatrix_2026.pdf#page=2
    - title: "Hawaii FY2026 LIHEAP State Plan, sections 2.6 and 3.6 #page 10,14"
      href: https://liheapch.acf.gov/docs/2026/state-plans/HI_Plan_2026.pdf#page=10
    - title: Hawaii draft FY2026 Policies and Procedures, section 6.4
      href: https://humanservices.hawaii.gov/wp-content/uploads/2025/07/Model-Plan-Packet-2026.pdf#page=70
