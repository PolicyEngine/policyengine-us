description: Hawaii waives the income test for households receiving nutrition assistance, cash assistance or Supplemental Security Income when this is true under the Low Income Home Energy Assistance Program.
# The FY2026 plan answers yes to categorical eligibility and the FY2027 plan
# answers no. The draft FY2027 policies replace section 2.8, categorical
# eligibility, with an income limit that every household must meet.
values:
  2025-10-01: true
  2026-10-01: false
metadata:
  unit: bool
  period: year
  label: Hawaii LIHEAP categorical eligibility in effect
