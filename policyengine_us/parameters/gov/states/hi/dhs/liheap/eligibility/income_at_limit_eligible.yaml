description: Hawaii treats a household with income equal to its income limit as income eligible when this is true under the Low Income Home Energy Assistance Program.
# The draft FY2026 policies calculate eligibility as "equal to or less than" the
# limit. The FY2027 income chart and draft policies require income below it.
