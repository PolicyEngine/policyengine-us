# The FY2026 entries are operational provider amounts, including the published six-person
# amount. No single SMI rounding rule reproduces all ten of them.
# The FY2027 entries are 60% of the FY2027 four-person state median income for
# Hawaii (138_463), truncated to 83_077, times the federal household-size
# factor and truncated again.
