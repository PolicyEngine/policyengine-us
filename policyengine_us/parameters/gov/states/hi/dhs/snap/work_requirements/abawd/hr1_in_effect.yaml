# P.L. 119-21 grants Hawaii preferential waiver authority (150% of the
# national average unemployment threshold and good-faith exemptions)
# per 7 U.S.C. 2015(o)(4)(A)(ii) and 2015(o)(7). Section 10102 has no
# later effective date, and USDA's implementation memorandum applies the
# amended exceptions from enactment, 2025-07-04. Hawaii DHS announced the
# changes as effective 2025-11-01, but a good-faith exemption requires a
# request and a federal determination, and none covering July through
# October 2025 was found; the model follows the statute.
description: Hawaii implements the HR1 changes to Able-Bodied Adult Without Dependents work requirements under the Supplemental Nutrition Assistance Program when this is true.

values:
  0000-01-01: false
  2025-07-04: true

