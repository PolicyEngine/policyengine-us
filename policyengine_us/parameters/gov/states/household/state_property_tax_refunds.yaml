description: States pay these property tax and rent refunds in cash, outside the income tax return.
values:
  # Each refund appears from the year it enters state_property_tax_credits,
  # so this list stays inside that one in every year. The empty first block
  # shares that list's first date; without it, PE-US would copy the 2021
  # block back to 2015, its first modeled year.
  # The other members of state_property_tax_credits either sit in a state's
  # income tax credit lists, which reach net income through state income tax,
  # or reduce the property tax bill, which no net income total subtracts.
  1977-01-01: []
  2021-01-01:
    # Vermont pays the renter credit on its own claim, Form RCC-146. Schedule
    # IN-112 carries only other refundable credits to Form IN-111.
    - vt_renter_credit
  2022-01-01:
    # Montana's Department of Revenue pays the rebate on its own claim.
    - mt_property_tax_rebate
    - vt_renter_credit
  2024-01-01:
    # Minnesota pays the homestead credit refund on Form M1PR, its own return.
    - mn_homestead_credit_refund
    - mt_property_tax_rebate
    # North Dakota's Tax Commissioner pays the renter's refund on SFN 24777.
    - nd_renters_refund
    - vt_renter_credit
  2025-01-01:
    - mn_homestead_credit_refund
    - mt_property_tax_rebate
    - nd_renters_refund
    # Pennsylvania's Department of Revenue pays the rebate on Form PA-1000.
    - pa_property_tax_or_rent_rebate
    # Utah's Tax Commission pays the renter's credit, the cash part of
    # ut_homeowner_renter_relief; counties apply the homeowner's credit to
    # the property tax bill.
    - ut_renters_credit
    - vt_renter_credit

