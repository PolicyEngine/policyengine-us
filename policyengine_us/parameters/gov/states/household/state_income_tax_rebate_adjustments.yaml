description: >-
  The pre-rebate state income tax comparison output restores these state
  adjustments. Each covers payments that state law provides for named tax
  years only and that the model credits against that year's state income tax.
  Standing refund mechanisms, such as Colorado's residual TABOR sales tax
  refund and Oregon's kicker, and ordinary credits stay in liability. Dated
  credit lists and amount gates decide whether a registered payment counts in
  a given year.
