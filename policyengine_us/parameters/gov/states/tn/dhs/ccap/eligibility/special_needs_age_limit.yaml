description: Tennessee limits eligibility to children at or below this age when they are incapable of self-care or under court supervision under the Child Care Certificate Program.
values:
  # tn_ccap_eligible_child compares the State Plan's upper age of 18.00 with
  # age <= 18, so eligibility runs through age 18.0 and excludes age 18.5.
  2024-06-01: 18

metadata:
  unit: year
  period: year
  label: Tennessee CCAP special needs or court-supervised age limit
