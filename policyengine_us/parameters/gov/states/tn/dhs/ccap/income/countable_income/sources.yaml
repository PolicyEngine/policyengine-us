description: Tennessee counts these income sources under the Child Care Certificate Program.
# The Section 2.2.4 checklist counts gross wages or salary; self-employment
# is a qualifying employment activity under Section 2.2.2.a.ii, so its
# earnings are counted as gross wages.
values:
  2024-06-01:
    - employment_income
    - self_employment_income

metadata:
  unit: list
  period: year
  label: Tennessee CCAP countable income sources
