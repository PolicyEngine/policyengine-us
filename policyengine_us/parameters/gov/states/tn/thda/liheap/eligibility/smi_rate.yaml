description: Tennessee limits regular assistance income to this share of state median income under the Low Income Home Energy Assistance Program.
# FY2026 applies this rate to every household size. FY2027 applies it to
# sizes 1-8; fpg_rate sets 150% of the poverty guideline for sizes 9 and over.
values:
  2025-10-01: 0.6

