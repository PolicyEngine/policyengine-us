description: Tennessee uses the federal poverty guidelines from this many years before the model year for the poverty-based income limit, matrix income groups and federal income floor under the Low Income Home Energy Assistance Program.
# HHS made the 2025 guidelines mandatory for LIHEAP from October 1, 2025, so
# model period 2026 (FY2026) uses the 2025 guidelines and 2027 (FY2027) the
# 2026 guidelines. The FY2026 matrix income groups and the FY2027 size 9-12
# ceilings reproduce from these guideline years.
values:
  2025-10-01: 1

metadata:
  unit: year
  period: year
  label: Tennessee LIHEAP poverty guideline year lag
