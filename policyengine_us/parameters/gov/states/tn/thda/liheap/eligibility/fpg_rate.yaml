description: Tennessee sets the regular assistance income limit at this multiple of the federal poverty guideline, by household size, under the Low Income Home Energy Assistance Program.
# A zero rate means the state median income limit applies. FY2026 uses 60% of
# state median income for every size. FY2027 uses 150% of the poverty
# guideline for sizes 9 and over, with upper limits rounded down to the
# nearest dollar. The draft plan lists sizes 9-15 and the draft manual sizes
# 9-16; larger households carry the same rate. The LI-12 matrix prints size
# 13-16 ceilings of $125,910 to $150,660, below 150% of the 2026 guideline
# ($126,180 to $151,740); these sizes follow the stated 150% rule.
brackets:
  - threshold:
      2025-10-01: 0
    amount:
      2025-10-01: 0
  - threshold:
      2025-10-01: 9
    amount:
      2025-10-01: 0
      2026-10-01: 1.5

metadata:
