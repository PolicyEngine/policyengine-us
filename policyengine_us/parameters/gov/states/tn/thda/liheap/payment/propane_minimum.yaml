description: Tennessee raises the regular benefit to this minimum for households that apply it to propane under the Low Income Home Energy Assistance Program.
# FY2026 sets a $500 minimum propane payment because of utility company
# payment requirements, for an applicant whose home uses propane as a
# deliverable fuel and who applies a smaller benefit to propane. The draft
# 2027 manual's deliverable fuel rules omit the minimum, so FY2027 has none.
# A household with propane heat or a propane bill is assumed to apply its
# benefit to propane. A heat-in-rent benefit is paid on the landlord's energy
# vendor account named on the LI-05 agreement, so a rental heated with propane
# included in the rent is treated the same way.
values:
  2025-10-01: 500
  2026-10-01: 0

