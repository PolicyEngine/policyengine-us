description: Tennessee uses these household energy bills for the active energy account test and the energy burden under the Low Income Home Energy Assistance Program.
# Applicants without an active energy account are not eligible, so a positive
# bill of any fuel with a reported heating type, or energy included in the
# rent, meets the account test (tn_liheap_eligible).
# The energy burden uses the annual average of all household energy usage
# (electric, gas, propane and other fuels), preferably over 12 months, and the
# bill data includes service, usage and delivery charges and taxes. Annual
# expense inputs stand in for the 12-month usage; deposits, optional charges
# and non-energy services cannot be separated from these totals. Public
# housing and Section 8 tenants enter their overage charges as bills. Heat
# included in the rent has no landlord-cost input, so its burden counts only
# separately billed energy and is a lower bound.
values:
  2025-10-01:
    - pre_subsidy_electricity_expense
    - gas_expense
    - bottled_gas_expense
    - fuel_oil_expense
    - wood_expense
    - coal_expense
    - other_heating_fuel_expense

