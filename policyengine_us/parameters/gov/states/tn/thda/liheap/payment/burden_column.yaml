description: Tennessee assigns this benefit matrix energy burden column from the rounded ratio of energy cost to countable income under the Low Income Home Energy Assistance Program.
# The matrix prints each column as a four-decimal range, so lower-inclusive
# cutoffs at each column start match the rounded burden. Households with zero
# income receive column 9 in tn_liheap.
brackets:
  # 0.0000 - 0.0509.
  - threshold:
      2025-10-01: 0
    amount:
      2025-10-01: 1
  # 0.0510 - 0.0671.
  - threshold:
      2025-10-01: 0.051
    amount:
      2025-10-01: 2
  # 0.0672 - 0.0827.
  - threshold:
      2025-10-01: 0.0672
    amount:
      2025-10-01: 3
  # 0.0828 - 0.0997.
  - threshold:
      2025-10-01: 0.0828
    amount:
      2025-10-01: 4
  # 0.0998 - 0.1214.
  - threshold:
      2025-10-01: 0.0998
    amount:
      2025-10-01: 5
  # 0.1215 - 0.1528.
  - threshold:
      2025-10-01: 0.1215
    amount:
      2025-10-01: 6
  # 0.1529 - 0.2181.
  - threshold:
      2025-10-01: 0.1529
    amount:
      2025-10-01: 7
  # 0.2182 - 0.9999.
  - threshold:
      2025-10-01: 0.2182
    amount:
      2025-10-01: 8
  # 1.0000 or greater.
  - threshold:
      2025-10-01: 1
    amount:
      2025-10-01: 9

