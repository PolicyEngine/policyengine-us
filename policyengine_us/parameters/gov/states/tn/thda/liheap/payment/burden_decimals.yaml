description: Tennessee rounds the energy burden ratio to this many decimal places before selecting the benefit matrix column under the Low Income Home Energy Assistance Program.
# The manual's examples divide the energy expense by countable income
# ($89.24 / $1,015.45 = 0.0878822197, or 8.79%), and the matrix prints its
# energy burden columns to four decimals (0.0000-0.0509, 0.0510-0.0671).
values:
  2025-10-01: 4

metadata:
  unit: int
  period: year
  label: Tennessee LIHEAP energy burden rounding decimals
