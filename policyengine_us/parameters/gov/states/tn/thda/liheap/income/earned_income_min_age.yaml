description: Tennessee counts the earned income of household members at least this age who are not tax-unit dependents under the Low Income Home Energy Assistance Program.
# The FY2026 plan leaves the earned income of a child under 18 unchecked, and
# the manual defines a child as any member under 18. The manual also excludes
# the earned income of a dependent 18 or older and of a dependent in school
# living with a parent or guardian; tax-unit dependency stands in for both,
# because no input records the dependency relationship the manual names.
values:
  2025-10-01: 18

