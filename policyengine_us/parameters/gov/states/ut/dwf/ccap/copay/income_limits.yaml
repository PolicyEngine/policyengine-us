description: Utah sets these monthly countable income upper limits for each copayment income group under the Child Care Assistance program.

# Table 4. The 2020-01-01 entry holds the April 1, 2026 edition at
# PolicyEngine's backdating floor; earlier editions of Table 4 are not
# encoded, so prior periods use that table as an approximation. The
# 2026-10-01 entry holds the October 1, 2026 edition.
#
# Each value is the inclusive upper bound of a countable income group;
# income above a group's upper bound falls in the next group. Household
# sizes run from 2 (the smallest possible unit, one parent and one child)
# through 12, where the size 12 column covers households of 12 or more.
# Group 16 is the maximum income range to qualify for child care
# assistance (85% of the state median income). The April 2026 edition's
# published lower bound of household size 5 group 3 reads 3,644.01, an
# apparent typo for 3,664.01, since the size 5 group 2 upper bound is
# 3,664; only upper bounds are encoded here (the October 2026 edition
# similarly prints the size 6 group 16 range as 10,940-11,445, omitting
# the usual .01 lower-bound offset). The October 2026 size 10 group 16
# bound is encoded as published (12,846), although the uniform steps of
# the surrounding sizes (size 9: 12,225, size 11: 12,746, size 12:
# 13,006) suggest 12,486 was intended; the group 16 bound only separates
# group 15 from group 16 in ut_ccap_income_group, so the discrepancy has
# no behavioral effect.
#
# The October 2026 edition also introduces entry and exit eligibility
# thresholds (entry at group 6 for applications, exit at group 10 for
# reviews, and open child care at group 16 between review cycles); that
# structure is not yet modeled in ut_ccap_income_eligible.
metadata:
  propagate_metadata_to_children: true
  unit: currency-USD
  period: month
  label: Utah CCAP copayment income group upper limits
  breakdown:
    - range(2, 13)
    - range(1, 17)
  breakdown_labels:
    - Household size
    - Income group
  reference:
    - title: Utah DWS Table 4 - Child Care Income Eligibility and Co-Payment (effective April 1, 2026)
      # Archived capture of the Infosource page, which Utah
      # overwrites in place at each reissue of Table 4.
      href: http://web.archive.org/web/20260901174900/https://jobs.utah.gov/Infosource/eligibilitymanual/Tables,_Appendicies,_and_Charts/Tables,_Appendicies,_and_Charts/Table_4_-_Child_Care_Income_Eligibility_and_Co-Payment.htm
    - title: Utah DWS Table 4 - Child Care Income Eligibility and Co-Payment (effective October 1, 2026)
      href: https://jobs.utah.gov/occ/provider/table1026.pdf#page=1
    - title: Utah Admin. Code R986-700-710(6)(d)
      href: https://www.law.cornell.edu/regulations/utah/Utah-Admin-Code-R986-700-710

