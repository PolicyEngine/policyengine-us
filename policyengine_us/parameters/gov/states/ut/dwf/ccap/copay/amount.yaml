description: Utah sets these monthly child care copayment amounts under the Child Care Assistance program.

# Table 4. The 2020-01-01 entry holds the April 1, 2026 edition at
# PolicyEngine's backdating floor; earlier editions of Table 4 are not
# encoded, so prior periods use that table as an approximation. The
# 2026-10-01 entry holds the October 1, 2026 edition.
#
# The copayment is a sliding scale by household size (2 through 12 or
# more), countable income group (1 through 16, classified with
# copay/income_limits), and the number of children receiving the subsidy
# (one, two, or more than two). Group 1 (income at or below 100% of the
# federal poverty level) has no copayment (R986-700-707(5)(a)).
#
# Child-count columns that exceed the possible number of children in the
# household size (household size 2: two or more children; size 3: more
# than two) are printed as n/a in the April 2026 edition and as 0 in the
# October 2026 edition. Neither the n/a nor the 0 is stored: in both
# layers these structurally impossible cells repeat the row's largest
# published column so every lookup is defined; they can never bind (a
# two-person household cannot have two subsidized children).
metadata:
  unit: currency-USD
  period: month
  label: Utah CCAP monthly copayment amount
  breakdown:
    - range(2, 13)
    - range(1, 17)
    - ut_ccap_child_count_group
  breakdown_labels:
    - Household size
    - Income group
    - Children receiving subsidy
  reference:
    - title: Utah DWS Table 4 - Child Care Income Eligibility and Co-Payment (effective April 1, 2026)
      # Archived capture of the Infosource page, which Utah
      # overwrites in place at each reissue of Table 4.
      href: http://web.archive.org/web/20260901174900/https://jobs.utah.gov/Infosource/eligibilitymanual/Tables,_Appendicies,_and_Charts/Tables,_Appendicies,_and_Charts/Table_4_-_Child_Care_Income_Eligibility_and_Co-Payment.htm
    - title: Utah DWS Table 4 - Child Care Income Eligibility and Co-Payment (effective October 1, 2026)
      href: https://jobs.utah.gov/occ/provider/table1026.pdf#page=1
    - title: Utah Admin. Code R986-700-707(1)
      href: https://www.law.cornell.edu/regulations/utah/Utah-Admin-Code-R986-700-707

