description: Utah grants an additional benefit for these primary heating fuels under the Home Energy Assistance Target program.
values:
  2023-03-01:
    - PROPANE
    - KEROSENE
    - FUEL_OIL
# Section 605 names propane and fuel oil. Table III groups kerosene with
# propane, and the March 2026 worksheet's fuel list (GAS, PROPANE, OIL,
# ELECTRICITY, COAL/STEAM, WOOD) has no kerosene entry, so a kerosene household
# is entered as propane or oil, both of which carry the credit.
