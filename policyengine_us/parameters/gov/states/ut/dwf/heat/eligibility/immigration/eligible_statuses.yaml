description: Utah treats these observable citizenship or immigration statuses as eligible without an additional waiting period under the Home Energy Assistance Target program.
values:
  2025-10-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT
