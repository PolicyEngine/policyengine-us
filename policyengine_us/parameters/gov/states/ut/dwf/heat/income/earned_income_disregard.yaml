description: Utah excludes this share of earned income from countable income under the Home Energy Assistance Target program.
values:
  2022-06-14: 0.2
# R982-403-6(2) applies the disregard to self-employment income after the
# cost of doing business; the business inputs are already net amounts.
# Worksheet cell C8 ("20% disregard") is B8*0.2, and TOTAL INCOME B11 is
# B8+B9-C8-B10. The worksheet's print area is A1:B67, so the PDF copy omits
# column C.
