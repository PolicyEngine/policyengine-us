description: Utah counts these unearned income sources under the Home Energy Assistance Target program.
values:
  2024-10-01:
    - social_security
    - ssi
    - railroad_benefits
    - pension_income
    - military_retirement_pay
    - retirement_distributions
    - survivor_benefits
    - veterans_benefits
    - total_unemployment_compensation
    - workers_compensation
    - disability_benefits
    - strike_benefits
    - financial_assistance
    - alimony_income
    - child_support_received
    - ordinary_dividend_income
    - estate_income
    - gambling_winnings
# The cash contribution input represents private gifts. Section 405 exempts
# TANF/FEP/GA and nonprofit/government aid, ordinary bank interest, educational
# aid and enumerated nonrecurring receipts. Existing inputs do not separately
# represent adoption payments, passive royalties or foster-child elections.
metadata:
  unit: list
