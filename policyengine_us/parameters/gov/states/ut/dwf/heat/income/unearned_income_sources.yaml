description: Utah counts these unearned income sources under the Home Energy Assistance Target program.
values:
  2024-10-01:
    - social_security
    - ssi
    - railroad_benefits
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - survivor_benefits
    - veterans_benefits
    - total_unemployment_compensation
    - workers_compensation
    - disability_benefits
    - strike_benefits
    - financial_assistance
    - alimony_income
    - child_support_received
    # Trust payments, which R982-403-3(2)(h) counts.
    - estate_income
    - gambling_winnings
# R982-403-5(12) excludes interest and dividend income, and plan item 1.9
# leaves "Interest, dividends, or royalties" unchecked, so ordinary dividends
# are not listed. The cash contribution input represents private gifts.
# Section 405 exempts TANF/FEP/GA, financial payments made by the Department
# of Workforce Services and financial assistance from other government
# agencies, so the Utah state supplement (ut_ssp) is not listed either
# (candidate us-ut:heat-tanf-dws-payments). Section 405 also exempts ordinary
# bank interest, educational aid and enumerated nonrecurring receipts.
# Existing inputs do not separately represent adoption payments, passive
# royalties or foster-child elections.
