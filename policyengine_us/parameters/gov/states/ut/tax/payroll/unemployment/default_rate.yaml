description: Utah assigns each new employer a rate based on its industry, at least 1.1%, so this parameter applies the new-employer rule to the statewide average benefit cost rate.
values:
  # A new employer whose industry's benefit cost rate does not exceed 1% pays a
  # basic rate of 1% times the reserve factor, plus the social cost rate, and
  # at least 1.1%. The Department of Labor's average employer contribution
  # rates on taxable wages, 0.41% to 0.68% from 2018 to 2026, leave the
  # statewide average benefit cost rate below 1%. The Department of Workforce
  # Services set the reserve factor and social cost rate at 1.00 and 0.1% for
  # 2018 to 2020, 1.05 and 0.2% for 2021, 1.15 and 0.3% for 2022, 1.10 and
  # 0.3% for 2023 and 2024, 1.10 and 0.2% for 2025, and 1.10 and 0.1% for
  # 2026.
  2018-01-01: 0.011
  2021-01-01: 0.012
  2022-01-01: 0.014
  2025-01-01: 0.013
  2026-01-01: 0.012

