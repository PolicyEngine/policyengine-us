description: Utah assigns each new employer a rate based on its industry, so this parameter uses the average employer contribution rate on taxable wages.
values:
  # The Department of Labor's average employer contribution rates on taxable
  # wages; the Department of Workforce Services publishes no comparable
  # series.
  2018-01-01: 0.0049
  2019-01-01: 0.0043
  2020-01-01: 0.0041
  2021-01-01: 0.005
  2022-01-01: 0.0068
  2023-01-01: 0.0062
  2024-01-01: 0.0061
  2025-01-01: 0.0054
  # Department of Labor estimate.
  2026-01-01: 0.0042

