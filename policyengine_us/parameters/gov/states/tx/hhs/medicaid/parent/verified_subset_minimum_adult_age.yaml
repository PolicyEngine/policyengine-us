description: Texas Medicaid uses this age to restrict the source-verified one-adult, one-parent model route to an adult subset.
# This is a model scope convention, not a legal minimum age for parents.
# Younger parents keep their existing route; they are not declared ineligible.
values:
  2017-01-01: 19
