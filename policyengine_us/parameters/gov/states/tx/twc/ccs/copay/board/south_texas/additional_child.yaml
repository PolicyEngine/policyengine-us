description: Workforce Solutions for South Texas sets this monthly parent share of cost for each additional child in care, by income as a share of state median income, under the Texas Child Care Services program.

# Each bracket covers income more than its threshold share of state median
# income and not more than the next threshold, with the limits rounded to
# whole dollars as in TWC's income ranges.
# No South Texas chart or Board action on the parent share of cost for BCY
# 2025 was found. WD 20-24 let a Board continue its BCY 2024 amounts without
# Board action, and TWC's statewide scale took effect only with TX3C, so the
# model continues the BCY 2024 amounts, with TWC's BCY 2025 income ranges,
# until TX3C.
metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: currency-USD
  period: month
  label: Texas CCS South Texas Board additional child parent share of cost
  reference:
    - title: Workforce Solutions for South Texas, SMI Monthly Income Scale and Parent Share of Cost Sliding Fee Scale Chart, effective 10/1/2023 - 9/30/2024
      href: https://web.archive.org/web/20240305024635/https://southtexasworkforce.org/wp-content/uploads/2023/10/ParentShareofCostSlidingFeeScale-10.01.2023.pdf#page=1
    - title: Workforce Solutions for South Texas, Child Care Services for Parents, March 5, 2024 capture (links the chart)
      href: https://web.archive.org/web/20240305024635/https://southtexasworkforce.org/child-care/parents/
    - title: TWC WD Letter 20-24 - Board Contract Year Federal Poverty Guidelines and State Median Income Amounts for Determining Eligibility and Parent Share of Cost for Child Care Services (Boards may continue BCY 2024 amounts)
      href: https://www.twc.texas.gov/sites/default/files/wf/policy-letter/wd/20-24-twc.pdf#page=2

