description: Texas Workforce Boards reduce the parent share of cost by this share under the Child Care Services program when every child in care has a part-time or blended schedule.

# A Board's reduction applies only while its own scale does (applies.yaml).
# A family that qualifies for both this and a Texas Rising Star reduction
# receives the greater of the two (40 TAC 809.19 as amended in 2022).
# Boards could keep part-time reductions under the statewide scale after
# TX3C (WD 06-24, Change 2); the model does not apply them there yet.

# Panhandle's policy CC 3.1 took effect December 6, 2023 and prints its new
# text in bold. Its reduction text isn't bold, so it predates that update, and
# the model applies the reduction from October 1, 2023.
# Panhandle grants 25% "for each part-time/blended/part-week referral". The
# model applies it as 25% of the parent share of cost for a family whose
# children are all in part-time care.
PANHANDLE:
  2023-10-01: 0.25
SOUTH_PLAINS:
  2023-10-01: 0
NORTH_TEXAS:
  2023-10-01: 0
NORTH_CENTRAL:
  2023-10-01: 0
TARRANT_COUNTY:
  2023-10-01: 0
DALLAS_COUNTY:
  2023-10-01: 0
NORTHEAST_TEXAS:
  2023-10-01: 0
EAST_TEXAS:
  2023-10-01: 0
WEST_CENTRAL:
  2023-10-01: 0

# On September 21, 2023 Borderplex's Board removed its discounts of 45% for
# a Texas Rising Star provider and 35% for part-time care, with its BCY 2024
# scale.
BORDERPLEX:
  2023-10-01: 0
PERMIAN_BASIN:
  2023-10-01: 0
CONCHO_VALLEY:
  2023-10-01: 0
HEART_OF_TEXAS:
  2023-10-01: 0
CAPITAL_AREA:
  2023-10-01: 0
RURAL_CAPITAL:
  2023-10-01: 0

# Texas's CCDF State Plan for FFY 2025-2027 (section 3.2.1) lists Brazos
# Valley among the 12 Boards with a policy to reduce the parent share of
# cost for part-time or blended care, and Brazos Valley's FY24 chart says
# "No discount may be applied for After school (Blended) care." The
# reduction's size wasn't found, so the model applies none.
BRAZOS_VALLEY:
  2023-10-01: 0
DEEP_EAST:
  2023-10-01: 0
SOUTHEAST:
  2023-10-01: 0
GOLDEN_CRESCENT:
  2023-10-01: 0
ALAMO:
  2023-10-01: 0
SOUTH_TEXAS:
  2023-10-01: 0
COASTAL_BEND:
  2023-10-01: 0
LOWER_RIO:
  2023-10-01: 0
CAMERON_COUNTY:
  2023-10-01: 0
TEXOMA:
  2023-10-01: 0
CENTRAL_TEXAS:
  2023-10-01: 0
MIDDLE_RIO:
  2023-10-01: 0
GULF_COAST:
  2023-10-01: 0

