description: Workforce Solutions Alamo sets this monthly parent share of cost for each additional child in care, by income as a share of state median income, under the Texas Child Care Services program.

# Each bracket covers income more than its threshold share of state median
# income and not more than the next threshold, with the limits rounded to
# whole dollars as in TWC's income ranges.
metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: currency-USD
  period: month
  label: Texas CCS Alamo Board additional child parent share of cost
  reference:
    - title: Workforce Solutions Alamo, Child Care Services (CCS) Sliding Fee Scale, effective October 1, 2023 through September 30, 2024
      href: https://www.workforcesolutionsalamo.org/wp-content/uploads/Sliding-Fee-Scale-BCY24-Website.png
    - title: Workforce Solutions Alamo, Child Care Services (CCS) Sliding Fee Scale, for care authorized October 1, 2024 - January 12, 2025
      href: https://www.workforcesolutionsalamo.org/wp-content/uploads/ChildCare.png
    - title: Workforce Solutions Alamo, Apply For Child Care, April 19, 2024 capture (shows the BCY 2024 chart)
      href: https://web.archive.org/web/20240419150417/https://www.workforcesolutionsalamo.org/apply-for-child-care/
    - title: Workforce Solutions Alamo, Apply For Child Care, February 19, 2025 capture (shows the October 1, 2024 - January 12, 2025 chart)
      href: https://web.archive.org/web/20250219044915/https://www.workforcesolutionsalamo.org/apply-for-child-care/

