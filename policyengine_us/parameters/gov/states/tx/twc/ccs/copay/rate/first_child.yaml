# The BCY2025 chart shows 9 brackets starting at 5% SMI (2.27%, 3.27%, ..., 7.00%).
# The BCY2026 chart shows 9 brackets starting at 1% SMI (2.00%, 2.93%, ..., 7.00%).
# Both represent the same linear formula: rate = base + slope * (SMI% - min_SMI%).
# Only the first (1%) and last uncapped (75%) brackets are stored here;
# the formula derives slope = (0.0693 - 0.02) / (0.75 - 0.01) at runtime.
# The 85% bracket (7.00%) is the cap, handled separately by maximum.yaml.
#
# In September 2022, TWC's Commission amended 40 TAC §809.19 so that from
# December 1, 2023, it would establish the parent share of cost on a statewide
# sliding fee scale. On November 7, 2022, it adopted a statewide method to
# assess each family's share. TWC put both off until it launched its TX3C case
# management system (WD 06-24, Change 2), so each Board kept setting its own
# scale (WD 24-23 for BCY 2024, WD 20-24 for BCY 2025). From TX3C's launch on
# January 13, 2025, TWC phased in this statewide scale as families enrolled or
# recertified. PolicyEngine applies it to every earlier month back to 2015,
# except where copay/board/applies.yaml turns on a Board's own scale.
# Actual effective date of every value below: 2025-01-13.
brackets:
  - threshold:
      2025-01-01: 0.01
    amount:
      2025-01-01: 0.02
  - threshold:
      2025-01-01: 0.75
    amount:
      2025-01-01: 0.0693
