description: Texas Workforce Boards reduce the parent share of cost by this share under the Child Care Services program when at least one child in care attends a Texas Rising Star provider.

# A Board's reduction applies only while its own scale does (applies.yaml).
# A family that qualifies for both this and a part-time reduction receives
# the greater of the two (40 TAC 809.19 as amended in 2022).
# TWC's July 29, 2024 amendments to 809.19 removed this option. WD 06-24,
# Change 2 had Boards discontinue the discounts with the statewide parent
# share of cost policy that came with TX3C, while a family already receiving
# one kept it through its eligibility period. The model ends the reduction
# with the Board scales.
