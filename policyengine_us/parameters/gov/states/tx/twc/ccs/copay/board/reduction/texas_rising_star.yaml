description: Texas Workforce Boards reduce the parent share of cost by this share under the Child Care Services program when at least one child in care attends a Texas Rising Star provider.

# A Board's reduction applies only while its own scale does (applies.yaml).
# A family that qualifies for both this and a part-time reduction receives
# the greater of the two (40 TAC 809.19 as amended in 2022).
# TWC's July 29, 2024 amendments to 809.19 removed this option. WD 06-24,
# Change 2 had Boards discontinue the discounts with the statewide parent
# share of cost policy that came with TX3C, while a family already receiving
# one kept it through its eligibility period. The model ends the reduction
# with the Board scales.

# Panhandle's policy CC 3.1 took effect December 6, 2023 and prints its new
# text in bold. Its reduction text isn't bold, so it predates that update, and
# the model applies the reduction from October 1, 2023.
PANHANDLE:
  2023-10-01: 0.3
SOUTH_PLAINS:
  2023-10-01: 0
NORTH_TEXAS:
  2023-10-01: 0
NORTH_CENTRAL:
  2023-10-01: 0
TARRANT_COUNTY:
  2023-10-01: 0
DALLAS_COUNTY:
  2023-10-01: 0
NORTHEAST_TEXAS:
  2023-10-01: 0
EAST_TEXAS:
  2023-10-01: 0
WEST_CENTRAL:
  2023-10-01: 0

# On September 21, 2023 Borderplex's Board removed its discounts of 45% for
# a Texas Rising Star provider and 35% for part-time care, with its BCY 2024
# scale.
BORDERPLEX:
  2023-10-01: 0
PERMIAN_BASIN:
  2023-10-01: 0
CONCHO_VALLEY:
  2023-10-01: 0
HEART_OF_TEXAS:
  2023-10-01: 0
CAPITAL_AREA:
  2023-10-01: 0
RURAL_CAPITAL:
  2023-10-01: 0
BRAZOS_VALLEY:
  2023-10-01: 0
DEEP_EAST:
  2023-10-01: 0
SOUTHEAST:
  2023-10-01: 0
GOLDEN_CRESCENT:
  2023-10-01: 0

# Alamo's policy CCS 12, Change 2 gives a family that enrolls in a Texas
# Rising Star provider "a 10% discount on their assigned PSOC", and its
# charts print the discounted amounts rounded to the dollar
# (rounds_to_dollar.yaml). The Board approved removing the discount on July
# 19, 2024, and its charts from October 1, 2024 print no discounted amounts.
ALAMO:
  2023-10-01: 0.1
  2024-10-01: 0
SOUTH_TEXAS:
  2023-10-01: 0
COASTAL_BEND:
  2023-10-01: 0
LOWER_RIO:
  2023-10-01: 0
CAMERON_COUNTY:
  2023-10-01: 0
TEXOMA:
  2023-10-01: 0
CENTRAL_TEXAS:
  2023-10-01: 0
MIDDLE_RIO:
  2023-10-01: 0
GULF_COAST:
  2023-10-01: 0

