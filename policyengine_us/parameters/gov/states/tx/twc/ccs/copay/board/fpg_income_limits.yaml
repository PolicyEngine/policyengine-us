description: Texas sets these monthly income limits for the federal poverty guideline income ranges, by family size, that a Board parent share of cost scale can use under the Child Care Services program.

# Each value is the upper monthly income limit of the range that ends at
# that percent of the federal poverty guidelines; income above it falls in
# the next range. TWC's printed limits follow no single rounding rule, so
# these are the limits as printed. Where a limit would exceed 85 percent of
# state median income, the eligibility limit, TWC prints * instead; the
# range that starts below the first * runs to that income, so the limits
# TWC replaced with * are .inf here. The tables cover family sizes 2 to 15,
# and the model reads size 15's limits for a larger family.
# TWC's BCY 2025 table ran from October 1 to December 8, 2024, when TX3C was
# due to launch. TX3C launched on January 13, 2025, and the model keeps this
# table for as long as Board scales apply (applies.yaml).
metadata:
  propagate_metadata_to_children: true
  unit: currency-USD
  period: month
  label: Texas CCS Board federal poverty guideline income range limits
  breakdown:
    - range(2, 16)
    - [50, 75, 100, 125, 150, 175, 185, 200]
  breakdown_labels:
    - Family size
    - Percent of the federal poverty guidelines
  reference:
    - title: TWC WD Letter 24-23, Attachment 2 - Income Ranges for Parent Share of Cost Assessment, effective October 1, 2023 to September 30, 2024
      href: https://web.archive.org/web/20240309105212/https://www.twc.texas.gov/sites/default/files/wf/policy-letter/wd/wd-24-23-att2-twc.pdf#page=1
    - title: TWC, Income Ranges for Parent Share of Cost Assessment, effective October 1 to December 8, 2024
      href: https://www.twc.texas.gov/sites/default/files/ccel/docs/bvy25-income-ranges-for-parent-share-of-cost-assessment-twc.pdf#page=1

