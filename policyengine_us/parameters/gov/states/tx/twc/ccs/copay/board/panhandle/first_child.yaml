description: Workforce Solutions Panhandle sets this monthly parent share of cost for the first child in care, by income as a share of state median income, under the Texas Child Care Services program.

# Each bracket covers income more than its threshold share of state median
# income and not more than the next threshold, with the limits rounded to
# whole dollars as in TWC's income ranges.
metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: currency-USD
  period: month
  label: Texas CCS Panhandle Board first child parent share of cost
  reference:
    - title: Workforce Solutions Panhandle, Panhandle Parent Share of Cost, effective 10/01/2023 - 9/30/2024
      href: https://wspanhandle.com/wp-content/uploads/2023/10/PSoC-2023-2024.png
    - title: Workforce Solutions Panhandle, Panhandle Parent Share of Cost, effective 10/01/2024 - 09/30/2025
      href: https://wspanhandle.com/wp-content/uploads/2024/09/PSoC-2024-2025-1.png
    - title: Workforce Solutions Panhandle, Child Care - For Parents (links both charts)
      href: https://web.archive.org/web/20241006070549/https://wspanhandle.com/child-care/for-parents/

