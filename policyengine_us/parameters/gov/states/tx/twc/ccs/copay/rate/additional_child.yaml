description: Texas uses this share as the additional child copayment factor under the Child Care Services program.

# The BCY2025 chart says "Add 0.15% for each additional child", which is
# the rate increment per 10% SMI bracket step (e.g., 0.30% at 20%, 0.45% at 30%).
# The BCY2026 chart shows the rate at each bracket explicitly (0.015% at 1% SMI).
# Both describe the same linear formula: rate = SMI% * 1.5%, so the factor is 0.015.
# At higher SMI brackets, the 7% total cap reduces the effective rate.
#
# Each Board set its own parent share of cost scale until TWC launched its TX3C
# case management system on January 13, 2025 (WD 24-23 for BCY 2024). TWC then
# phased in the statewide scale as families enrolled or recertified. TWC set no
# statewide scale for earlier periods, so for them the model applies a Board's
# own scale where copay/board/applies.yaml marks one and this one elsewhere.

values:
  2025-01-01: 0.015  # Actual effective date: 2025-01-13
metadata:
  unit: /1
  period: month
  label: Texas CCS additional child copayment factor
  reference:
