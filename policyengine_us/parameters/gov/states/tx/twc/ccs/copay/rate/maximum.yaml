description: Texas limits the total copayment to this share of family income under the Child Care Services program.

# In September 2022, TWC's Commission amended 40 TAC §809.19 so that from
# December 1, 2023, it would establish the parent share of cost on a statewide
# sliding fee scale. In July 2024, it adopted this 7% cap in §809.19, effective
# July 29, 2024. TWC put the statewide scale off until it launched its TX3C
# case management system (WD 06-24, Change 2), and the cap with it (WD 20-24),
# so each Board kept setting its own scale. From TX3C's launch on January 13,
# 2025, TWC phased in the statewide scale and this cap as families enrolled or
# recertified. PolicyEngine applies the cap to every earlier month back to
# 2015, except where copay/board/applies.yaml turns on a Board's own scale,
# which has no 7% cap.
values:
  2025-01-01: 0.07  # Actual effective date: 2025-01-13
