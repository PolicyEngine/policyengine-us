description: Texas limits the total copayment to this share of family income under the Child Care Services program.

# Each Board set its own parent share of cost scale until TWC's TX3C case
# management system launched on January 13, 2025 (WD 24-23 for BCY 2024). TWC
# then phased in the statewide scale and this cap as families enrolled or
# recertified. Before then the model applies each Board's scale where one was
# found (copay/board/applies.yaml) and this one for the other Boards.
values:
  2025-01-01: 0.07  # Actual effective date: 2025-01-13
metadata:
  unit: /1
  period: month
  label: Texas CCS maximum copayment rate
  reference:
    - title: 40 TAC §809.19 - Parent Share of Cost
      href: https://www.law.cornell.edu/regulations/texas/40-Tex-Admin-Code-SS-809-19
    - title: TWC WD Letter 24-23 - BCY 2024 Income Amounts for Determining Parent Share of Cost
      href: https://web.archive.org/web/20240908233001/https://www.twc.texas.gov/sites/default/files/wf/policy-letter/wd/wd-24-23-twc.pdf#page=2
    - title: TWC Child Care and Development Fund Waiver Request, December 17, 2024 Commission Meeting
      href: https://www.twc.texas.gov/sites/default/files/ogc/mtg24/commission-meeting-material-121724-item10-dp-ccdf-waiver-request-twc.pdf#page=2
    - title: Texas CCDF State Plan FFY 2025-2027, section 3.1.1 (cap implemented with TX3C)
      href: https://www.twc.texas.gov/sites/default/files/ccel/docs/tx-ccdf-state-plan-ffy2025-2027-approved.pdf#page=48
