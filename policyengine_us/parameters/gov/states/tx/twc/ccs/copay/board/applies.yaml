description: Texas applies the Local Workforce Development Board's own parent share of cost scale under the Child Care Services program for the Boards where this is true.

# Each Board set its own parent share of cost scale until TWC's TX3C case
# management system launched on January 13, 2025 and brought in the statewide
# scale. TWC phased the statewide scale in as families enrolled or recertified
# through February 1, 2026, and a family could ask for the statewide amount
# sooner if it was lower. The model applies the statewide scale to every family
# from TX3C's launch, as for a family determined then. Where no Board scale
# was found for a period, the model applies the statewide scale instead.
# TWC applied the 7 percent of income cap from its July 2024 rule amendments
# with the statewide scale (CCDF State Plan FFY 2025-2027, section 3.1.1), so
# Board scales carry no such cap.
