# Alamo's BCY 2024 chart for Texas Rising Star providers, by family size,
# prints each discounted share of cost as 90% of the regular total for that
# number of children, rounded to the nearest dollar with halves up: $68 for
# a regular $75 and $432 for $480. Its chart by child rounds each child's
# amount instead, which comes to up to $3 more for a family with three or
# more children; the model follows the chart by family size, as the policy
# takes the discount off the family's assigned share of cost.
