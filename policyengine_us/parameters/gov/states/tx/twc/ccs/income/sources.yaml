description: Texas counts these income sources as countable income under the Child Care Services program.
values:
  2020-01-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - dividend_income
    - interest_income 
    - rental_income
    - pension_income
    - alimony_income
    # 40 TAC 809.44(c) counts all income that (b) doesn't exclude. Item (b)(17)
    # excludes "Regular payments from Social Security", and the Railroad
    # Retirement Board, not the Social Security Administration, pays railroad
    # annuities, so they count.
    - railroad_benefits
    # The statute defines excluded sources rather than included sources:
    # Medicare, Medicaid, SNAP, school meals, housing assistance
    # TANF, social_security, ssi, general assistance, general relief
    # unemployment_compensation
    # child_support_received

metadata:
  unit: list
  period: year
  label: Texas CCS countable income sources
  reference:
