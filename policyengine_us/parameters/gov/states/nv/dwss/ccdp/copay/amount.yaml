description: Nevada sets the monthly family copayment at this amount based on income as a share of state median income under the Child Care and Development Program.

metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: currency-USD
  period: month
  label: Nevada CCDP monthly family copayment
  reference:
    - title: Nevada CCDF State Plan FFY 2025-2027, Section 2.5.5.v — Flat rate copayments during graduated phase-out
      href: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/ACF-118_CCDF_FFY_2025-2027_For_Nevada__3.pdf#page=36
    - title: Nevada DWSS Policy Transmittal CC PT 06-25 (Oct 2, 2025) — Annual Income Changes
      href: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/CC_PT_06-25_ANNUAL_INCOME_CHANGES_10.02.2025.pdf#page=1

# Before October 2024 the formula reads reimbursed and percent_of_income instead.
# Before July 2022 Nevada set the copayment by income, county, age of child and type
# of care (FFY 2022-2024 plan, Section 3.2.2). The model does not carry that schedule,
# so this one stands in for those dates.
# The flat $0/$90/$150 copay and two-tier copay structure took effect
# Oct 1, 2024 (State Plan Section 2.4.v); CC PT 06-25 is the Oct 1, 2025 annual
# income-chart refresh that restates the same percentages and bands.
# Each threshold gives, as a share of SMI, the top of the band below it: income up to
# 33% SMI pays $0, up to 42% SMI pays $90, and above 42% SMI pays $150. The charts
# print each top as the nearest dollar ($2,326 and $2,890 a month for three in October
# 2025), and nv_ccdp_copay rounds them the same way. The State Plan summary prose
# ("33%-42% -> $90, 43%-49% -> $150") leaves an undefined 42%-43% gap; the operational
# fee charts resolve it, with the $90 band topping out at 42% SMI.
brackets:
  - threshold:
      2024-10-01: 0
    amount:
      2024-10-01: 0
  - threshold:
      2024-10-01: 0.33
    amount:
      2024-10-01: 90
  - threshold:
      2024-10-01: 0.42
    amount:
      2024-10-01: 150
