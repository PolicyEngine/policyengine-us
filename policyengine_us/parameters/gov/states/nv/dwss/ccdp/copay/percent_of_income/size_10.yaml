description: Nevada sets the family copayment at this share of gross income for a ten-person household under the Child Care and Development Program.
# Chart effective October 1, 2023. Each threshold sits just above the top of the
# printed row, so income at a row's top stays in that row. Income tops out at 85% of
# SMI ($9,111.15 a month), where the copayment reaches 7%.
