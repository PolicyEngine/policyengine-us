description: Nevada reimburses family copayments under the Child Care and Development Program when this indicator is true.
# Urban's 2022 Book of Tables says families received reimbursement from March 2023 for
# copayments paid back to July 1, 2022. DWSS's letter of March 27, 2024 says American
# Rescue Plan funds let the program eliminate copayments, and that most families pay a
# copayment again as of April 1, 2024.
values:
  2015-01-01: false
  2022-07-01: true
  2024-04-01: false

metadata:
  unit: bool
  period: month
