description: Nevada limits new applicants to income at or below this multiple of the federal poverty guideline under the Child Care and Development Program, while the poverty-guideline intake limit applies.

# The state's figures for a family of three all equal 130% of the guideline Nevada had
# taken up that October: $27,012 a year in February 2019 (2018 guideline), $27,729 from
# October 2019, $2,353 a month from October 1, 2020 and $2,379 on October 1, 2021.
values:
  2018-10-01: 1.3

metadata:
  unit: /1
  period: month
  label: Nevada CCDP poverty-guideline intake rate
