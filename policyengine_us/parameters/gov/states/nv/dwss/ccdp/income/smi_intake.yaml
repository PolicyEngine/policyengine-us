description: Nevada limits new applicants to income at or below this share of state median income under the Child Care and Development Program.
# Nevada has moved the limit for new applicants three times:
# - Through 2017 Urban's CCDF Policies Database prints 85% of SMI each October ($3,954,
#   $4,104 and $4,127 a month for three in 2015, 2016 and 2017). No Nevada document
#   from those years survives on its site.
# - By October 2018 Urban shows a lower first tier with 85% kept for families already
#   enrolled. The state's plan documents and NWLC print 130% of the poverty guideline
#   ($27,012 a year for three in February 2019; $2,353 a month from October 2020; $2,379
#   in October 2021, which the FFY 2022-2024 plan reports as 41% of SMI). 41% stands in
#   for that guideline-based limit, which ran up to about four points higher for three
#   in earlier years (NWLC prints 45% for February 2019).
# - The FFY 2022-2024 plan moves new applicants to 85% of SMI effective July 1, 2022
#   ($5,066 for three), and CC PT 07-23 keeps 85% for October 2023 ($5,314.84).
# - From October 1, 2024 new applicants face 41% and renewals 49%. The chart effective
#   October 1, 2026 keeps both shares.
values:
  2015-01-01: 0.85
  2018-10-01: 0.41
  2022-07-01: 0.85
  2024-10-01: 0.41

