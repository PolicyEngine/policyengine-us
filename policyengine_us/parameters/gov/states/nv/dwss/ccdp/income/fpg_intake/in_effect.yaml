description: Nevada uses this indicator to determine whether new applicants face a limit set as a share of the federal poverty guideline under the Child Care and Development Program.

# Urban's CCDF Policies Database prints 85% of state median income for new applicants
# in October 2017 and a lower limit by October 2018, so the start date falls between
# those two snapshots. The state's own figures from February 2019 through October 2021
# all equal 130% of the poverty guideline. The FFY 2022-2024 plan moves new applicants
# to 85% of state median income on July 1, 2022.
values:
  2015-01-01: false
  2018-10-01: true
  2022-07-01: false

metadata:
  unit: bool
  period: month
