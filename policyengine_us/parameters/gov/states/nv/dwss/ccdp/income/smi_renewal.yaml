description: Nevada limits renewing households to income at or below this share of state median income under the Child Care and Development Program.
# Urban's CCDF Policies Database prints 85% of SMI for enrolled families every October
# from 2015 through 2022 ($4,260 a month for three in 2018, while new applicants faced
# $2,366). The FFY 2022-2024 plan and CC PT 07-23 keep 85% through September 2024.
# From October 1, 2024 renewals face 49%. The Nevada DWSS copay Q&A of November 2024
# says the change reaches a family only at its first renewal after that date. The model
# has no certificate dates, so every enrolled family moves on October 1, 2024.
values:
  2015-01-01: 0.85
  2024-10-01: 0.49

