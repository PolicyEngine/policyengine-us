description: Nevada extends Child Care and Development Program age eligibility to children under court supervision up to the special needs child age limit if this is true.
values:
  # The FFY 2014-2015 plan (effective October 1, 2013) declines the 45 CFR
  # 98.20(a)(1)(ii) court-supervision option; the FFY 2016-2018 plan (effective
  # June 1, 2016) elects it with an upper age of 18; the FFY 2019-2021 and FFY
  # 2022-2024 plans decline it; the FFY 2025-2027 plan elects it again with an
  # upper age of 18.
  2013-10-01: false
  2016-06-01: true
  2018-10-01: false
  2024-10-01: true

