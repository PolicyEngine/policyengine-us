description: Nevada limits eligibility to children younger than this age who have a special need or, where the court-supervision extension applies, are under court supervision under the Child Care and Development Program.
# The FFY 2025-2027 CCDF Plan 2.2.1(b)-(c) enters an upper age of 18.00 for both
# routes (under 19).
values:
  2024-01-01: 19

metadata:
  unit: year
  period: year
  label: Nevada CCDP special needs or court supervision child age limit
  reference:
    - title: Nevada Child Care Policy Manual, MS 210 — Age (special-needs children eligible until age 19; special need defined in MS 211)
      href: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/Child_Care_Manual_July_2024.pdf#page=36
    - title: Nevada CCDF Plan FFY 2025-2027, Section 2.2.1(b)-(c), upper age 18.00
      href: https://www.dss.nv.gov/siteassets/dwss.nv.gov/content/care/ACF-118_CCDF_FFY_2025-2027_For_Nevada__3.pdf#page=18
