description: Nevada excludes from eligibility income, but counts toward the Fixed Annual Credit, the earned income of school-attending household members younger than this age under the Low Income Home Energy Assistance Program.
# Section 707 N covers children under 18 who attend elementary or high school
# or GED classes at least half time, or are too young to attend school, and
# live with the applicant parent or legal guardian. is_in_k12_school stands
# in for school attendance, SPM membership for living with the parent, and
# children too young for school are assumed to have no earnings.
values:
  2025-07-01: 18

