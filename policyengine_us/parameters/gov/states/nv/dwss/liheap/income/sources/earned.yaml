description: Nevada counts these sources as earned income of household members under the Low Income Home Energy Assistance Program.
# Gross wages, salaries, commissions, tips and military pay, and income from
# self-employment, a farm or a partnership. Section 707 K budgets
# self-employment on gross income; the model's net business inputs stand in,
# each floored at zero, so a loss in one source cannot offset another. The
# earnings of a school-attending member under the children's earned income
# age limit count toward the Fixed Annual Credit only. Travel and uniform
# reimbursements and an earned income tax credit paid with wages, deducted
# from gross earnings by Section 703 A, have no separate inputs.
values:
  2025-07-01:
    - employment_income
    # Military pay (Sections 703 A and 705), entered apart from
    # employment_income; enter it in one of the two.
    - military_basic_pay
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

