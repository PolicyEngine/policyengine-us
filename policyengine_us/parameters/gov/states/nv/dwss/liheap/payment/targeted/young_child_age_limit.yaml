description: Nevada treats household members younger than this age as young children for the targeted household benefit cap supplement under the Low Income Home Energy Assistance Program.
# "Children under six (6) years of age"; the glossary defines a child as a
# household member less than six years of age.
values:
  2025-07-01: 6

