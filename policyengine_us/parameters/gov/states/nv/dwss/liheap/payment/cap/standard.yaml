description: Nevada caps the Fixed Annual Credit at this amount by household size and income band for households whose primary heating fuel is not propane, fuel oil or kerosene under the Low Income Home Energy Assistance Program.
# "ALL ENERGY SOURCES (except propane and oil)", the same in SFY2026 and
# SFY2027. Income bands 1-4 are "<75%", ">75-100%", ">100-125%" and
# ">125-150%"; household size 8 covers the "8+" row.
