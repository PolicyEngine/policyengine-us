description: Nevada caps the Fixed Annual Credit at this amount by household size and income band for households whose primary heating fuel is propane, fuel oil or kerosene under the Low Income Home Energy Assistance Program.
# "IF ENERGY SOURCE INCLUDES PROPANE AND OIL", the same in SFY2026 and
# SFY2027. Kerosene uses the oil table. Every cell is $200 above the
# standard table and is stored as published. The plans' $3,136 maximum
# benefit is the size 8+ band 1 cell plus the $100 targeted household
# supplement.
