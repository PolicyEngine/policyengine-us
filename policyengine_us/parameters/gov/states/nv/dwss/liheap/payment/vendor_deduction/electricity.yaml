description: Nevada deducts this annual service fee amount from the electricity bill of each electric vendor's customers when it measures energy cost under the Low Income Home Energy Assistance Program.
# Appendix A lists these amounts under "Use deductions below unless vendor
# provides usage only". It publishes no dollar deduction for NV Energy and
# lists unit charges for Nevada Power and Sierra Pacific, and for Southwest
# Gas North and South. Treating an NV Energy bill as carrying no deductible
# fee is an inference from that table. Nothing is deducted from the bill of
# another vendor or an unreported vendor either.
