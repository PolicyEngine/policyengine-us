description: Nevada pays at least this Fixed Annual Credit to eligible households, including those with a negative credit and those with all utilities included in unsubsidized rent, under the Low Income Home Energy Assistance Program.
# Section 803 V and both plans set a $360 minimum; the SFY2026 manual's
# sections 504 A, 505 D, F and G and 702 III print $240. The $360 amount is
# used, as printed throughout the SFY2027 manual.
values:
  2025-07-01: 360

