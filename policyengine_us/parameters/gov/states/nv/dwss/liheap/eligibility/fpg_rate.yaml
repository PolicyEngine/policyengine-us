description: Nevada limits household income to this multiple of the federal poverty guideline under the Low Income Home Energy Assistance Program.
# Appendix A prints annual limits of $23,475 to $81,225 for household sizes
# 1-8 in SFY2026 (150% of the 2025 guideline) and $23,940 to $83,580 in
# SFY2027 (2026 guideline). The 110% floor of 42 U.S.C. 8624(b)(2)(B) lies
# below this limit for every size.
values:
  2025-07-01: 1.5

