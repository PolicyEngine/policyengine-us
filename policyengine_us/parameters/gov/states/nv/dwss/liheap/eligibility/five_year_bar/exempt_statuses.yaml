description: Nevada excludes these immigration statuses from the five-year bar on qualified non-citizens under the Low Income Home Energy Assistance Program.
# Section 302 C VI exempts refugees, asylees, non-citizens whose deportation is
# being withheld, Amerasians, Cuban and Haitian entrants and victims of a
# severe form of trafficking. Amerasians and trafficking victims have no
# immigration_status value. The federal Medicaid list holds the same four
# statuses, but this list is sourced to the Nevada manual and kept separate.
values:
  2025-07-01:
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT

