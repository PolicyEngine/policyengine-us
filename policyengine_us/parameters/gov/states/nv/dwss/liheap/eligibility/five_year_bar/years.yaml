description: Nevada sets the bar on qualified non-citizens to this threshold of years after entry under the Low Income Home Energy Assistance Program.
# Section 302 C makes qualified non-citizens who entered the United States after
# August 22, 1996 ineligible for the years beginning on the date of entry,
# unless an exemption applies. Section 302 A I applies the bar to lawful
# permanent residents.
values:
  2025-07-01: 5

metadata:
  unit: year
  period: year
  label: Nevada LIHEAP five-year bar duration
