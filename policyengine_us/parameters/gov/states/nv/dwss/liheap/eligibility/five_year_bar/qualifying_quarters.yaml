description: Nevada excludes lawful permanent residents with this threshold of qualifying quarters from the five-year bar under the Low Income Home Energy Assistance Program.
# Section 302 C VIII counts quarters worked by a parent while the person was a
# child and by a spouse during the marriage, and no quarter after December 31,
# 1996 in which the person received a federal means-tested public benefit. The
# snap_alien_qualifying_quarters input holds that 8 U.S.C. 1645 count.
values:
  2025-07-01: 40

