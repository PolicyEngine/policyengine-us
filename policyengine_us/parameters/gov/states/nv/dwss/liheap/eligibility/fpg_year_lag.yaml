description: Nevada uses the federal poverty guidelines from this many years before the model year for the income limit and the benefit cap income bands under the Low Income Home Energy Assistance Program.
# The program year is the state fiscal year (July-June). Model period 2026
# (SFY2026) uses the 2025 guidelines ($15,650 plus $5,500 per added person)
# and 2027 (SFY2027) the 2026 guidelines ($15,960 plus $5,680), which
# reproduces both Appendix A income tables. HHS made the 2025 guidelines
# mandatory for LIHEAP from October 1, 2025.
values:
  2025-07-01: 1

