description: Nevada limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  2018-01-01: 30_500
  2019-01-01: 31_200
  2020-01-01: 32_500
  2021-01-01: 33_400
  2022-01-01: 36_600
  # The Department of Employment, Training and Rehabilitation set $40,100 for
  # 2023; the July 2023 Department of Labor compilation lists $40,600, the
  # 2024 base.
  2023-01-01: 40_100
  2024-01-01: 40_600
  2025-01-01: 41_800
  2026-01-01: 43_700

