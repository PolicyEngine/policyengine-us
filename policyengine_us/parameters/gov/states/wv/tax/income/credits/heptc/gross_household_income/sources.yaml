description: West Virginia counts these sources as gross household income for the homestead excess property tax credit.  
metadata:
  period: year
  unit: list
  label: West Virginia homestead property excess tax credit gross household income sources
  reference:
  - title: West Virginia Personal Income Tax Forms And Instructions 2025, Homestead Excess Property Tax Credit Worksheet
    href: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf#page=11
  - title: West Virginia Personal Income Tax Forms And Instructions 2024, Homestead Excess Property Tax Credit Worksheet
