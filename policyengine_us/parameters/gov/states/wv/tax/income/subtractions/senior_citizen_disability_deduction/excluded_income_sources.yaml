description: West Virginia excludes these person-level Schedule M amounts from the income base for the senior citizen or disability modification before applying the cap.

values:
  # The equivalent income exclusion is verified from the 2014 form.
  # Preserve unverified earlier direct-variable calculations.
  1986-01-01: []
  2014-01-01:
    # Line numbers below are from the 2025 form.
    - military_service_income # Line 36
    - salt_refund_income # Line 38
    # Line 39 is a contribution deduction, not an income receipt. Its amount
    # removes income within the form's excluded range. Use the contributor's
    # own amount rather than projecting the tax-unit 529 deduction to spouses.
    - investment_in_529_plan_indv # Line 39
  2017-01-01:
    - military_service_income # Line 36
    - salt_refund_income # Line 38
    - investment_in_529_plan_indv # Line 39
    # The IRC 1341 repayments line is inside the excluded range from 2017
    # (line 50 of lines 39-51 in 2017; line 42 of lines 35-46 in 2025).
    - wv_claim_of_right_subtraction # Line 42

metadata:
  unit: list
  period: year
