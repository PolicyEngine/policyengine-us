description: West Virginia assigns this unemployment insurance contribution rate to each new employer.
values:
  # West Virginia Code Section 21A-5-5(b) sets each employer's contribution
  # rate at 2.7% of wages until it completes 36 consecutive months as an
  # employer, ending on the computation date; Section 21A-5-5(c) sets a higher
  # rate for foreign businesses in the construction trades. WorkForce West
  # Virginia's employer handbooks give the 2.7% initial rate.
  2018-01-01: 0.027
  # From July 1, 2026, Section 21A-5-5(d), which Senate Bill 1053 of 2026
  # added, cuts each employer's otherwise applicable rate by seven percent, so
  # a new employer pays 2.511%. Section 21A-9-10, which the same act added,
  # charges a separately billed annual automation and administration fee,
  # which PE-US leaves out, and has the commissioner reimpose full
  # rates once fee collections reach $60 million or on July 1, 2031, whichever
  # comes first.
  2026-07-01: 0.02511

