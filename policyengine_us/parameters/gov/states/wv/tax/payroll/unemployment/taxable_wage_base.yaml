description: West Virginia limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # Before July 1, 2024, West Virginia Code Section 21A-1A-28 limited
  # contribution wages to a threshold wage. It set that wage at $12,000 from
  # 2009, cut it to $9,000 once the unemployment fund reached $220 million on
  # a February 15, and then moved it each year by the same percentage as the
  # state's average wage. WorkForce West Virginia's July 2016 employer
  # handbook gives the $12,000 base.
  2018-01-01: 12_000
  # The threshold wage fell to $9,000 from 2022; the employer handbook that
  # WorkForce West Virginia posted in February 2023 gives the $9,000 base.
  2022-01-01: 9_000
  # WorkForce West Virginia's June 2024 employer handbook gives a 2024 base of
  # $9,521.
  2024-01-01: 9_521
  # Senate Bill 841 of 2024 set the base at $9,500 in Section 21A-1A-28(b)(1)
  # from July 1, 2024, and WorkForce West Virginia applies it from 2025.
  2025-01-01: 9_500

