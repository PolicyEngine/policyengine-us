description: West Virginia limits income to this share of the state median income under the Child Care Assistance Program.
# Federal rules cap child care eligibility at 85% of the state median income, and the
# CCDF plan allows no higher limit. Appendix A ends the ten- and eleven-person scales at
# that cap, below 185% of the guideline: $9,247 and $9,440 a month on the October 2024
# state median income table.
values:
  2015-01-01: 0.85

