description: West Virginia limits eligibility for children with special needs or under court supervision to those under this age under the Child Care Assistance Program.
values:
  # Manual 3.1.2 ("13 years through 17 years of age") and 1.0.1 ("under the
  # age of eighteen") read the State Plan's upper age of 18.00 as under 18;
  # the "13 to 18" wording of the 1.1.6 definition is read the same way.
  2024-01-01: 18

