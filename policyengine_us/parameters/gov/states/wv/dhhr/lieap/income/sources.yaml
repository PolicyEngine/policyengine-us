description: West Virginia counts these represented recurring income sources under the Low Income Energy Assistance Program.
values:
  2025-10-01:
    - employment_income
    # Active-duty basic pay, entered apart from employment_income; enter it in one
    # of the two.
    - military_basic_pay
    # The source deducts 20% from gross receipts. Existing inputs are already net;
    # using them without another deduction is an explicit modeling approximation.
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
    - estate_income
    - total_unemployment_compensation
    - strike_benefits
    - pension_income
    - military_retirement_income
    # Railroad retirement is paid by the Railroad Retirement Board, not SSA.
    - railroad_benefits
    - retirement_distributions
    - survivor_benefits
    - general_assistance
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - financial_assistance
    # The only input able to carry contract, mineral-rights, jury-duty or settlement
    # receipts, which the manual's all-source rule counts.
    - miscellaneous_income
# All members' income counts, regardless of age or immigration qualification.
# Take-up-gated TANF is counted separately once at the household level.
# Military retirement includes Survivor Benefit Plan annuities.
# RSDI, SSI and nonrecurring lump sums are excluded. Aggregate annual receipts
# are treated as recurring; VA Aid and Attendance cannot be separated from
# veterans_benefits.
metadata:
  unit: list
  period: year
  label: West Virginia LIEAP recurring income sources
  reference:
    - title: "West Virginia Income Maintenance Manual, Chapter 21.3.1.A #page 1732-1735"
      href: https://web.archive.org/web/20260302130424/https://bfa.wv.gov/media/39948/download?inline#page=1732
    - title: "West Virginia Income Maintenance Manual, October 2026 edition, Chapter 21.3.1.A #page 1726-1729"
      href: https://web.archive.org/web/20261023203756/https://bfa.wv.gov/media/40005/download?inline#page=1726
