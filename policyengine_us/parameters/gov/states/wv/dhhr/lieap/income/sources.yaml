description: West Virginia counts these represented recurring income sources, in addition to net business and estate income, under the Low Income Energy Assistance Program.
values:
  2025-10-01:
    - employment_income
    - total_unemployment_compensation
    - strike_benefits
    - pension_income
    - military_retirement_pay
    - retirement_distributions
    - survivor_benefits
    - general_assistance
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - financial_assistance
# All members' income counts, regardless of age or immigration qualification.
# Take-up-gated TANF is counted separately once at the household level.
# RSDI, SSI and nonrecurring lump sums are excluded. Aggregate annual receipts
# are treated as recurring; VA Aid and Attendance cannot be separated from
# veterans_benefits. These input limitations are documented in the README.
metadata:
  unit: list
  period: year
  label: West Virginia LIEAP recurring income sources
  reference:
