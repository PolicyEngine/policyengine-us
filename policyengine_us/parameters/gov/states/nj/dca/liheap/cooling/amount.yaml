description: New Jersey provides this one-time medically necessary cooling benefit, in addition to heating assistance, under the Low Income Home Energy Assistance Program.
# The FY2026 and FY2027 handbooks print $300.00 in section 3.4.A and cap
# medically necessary cooling at $300.00 in section 3.7.D, citing N.J.A.C.
# 10:89-3.3. The codified rule, now N.J.A.C. 5:49-3.3(a), still prints $100.00
# (the amount set in 1992) after the chapter was readopted without change
# effective September 22, 2025. The model follows the handbooks, as it does for
# the 60% SMI income test. No handbook before FY2026 was found, so the value
# starts with FY2026; earlier periods back to FY2022 (eligibility/in_effect)
# read this first value and are unverified.
values:
  2025-10-01: 300
