description: New Jersey provides regular heating assistance under the modeled rules when this is true under the Low Income Home Energy Assistance Program.
# The modeled rules begin with FY2022, when the income standard moved from a
# poverty-level test to 60 percent of state median income (BPU announcement of
# October 19, 2021). The earlier standard is not encoded, so the program is not
# modeled before 2021-10-01; the explicit early false stops backdating.
values:
  0000-01-01: false
  2021-10-01: true
metadata:
  unit: bool
  period: year
  label: New Jersey LIHEAP modeled rules in effect
