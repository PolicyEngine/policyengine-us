description: New Jersey uses these sources as unearned income under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
  - unemployment_compensation
  # The FY2027 plan (1.9, page 6) leaves Strike Pay and General Assistance
  # unchecked where the FY2026 plan checks them; handbook 2.2 (page 6) counts GA
  # grants toward the standard and 2.2.3 makes striker households ineligible,
  # so the handbook controls and both stay listed.
  - strike_benefits
  - ssi
  - pension_income
  # Handbook 2.3.D counts pensions and annuities; 2.3.E.10 excludes veterans'
  # benefits, but VA survivor payments cannot be separated and count here.
  - survivor_benefits
  - general_assistance
  - rental_income
  - farm_rent_income
  - alimony_income
  - child_support_received
  - interest_income
  - ordinary_dividend_income
  - workers_compensation
  - disability_benefits
metadata:
  unit: list
  period: year
  label: New Jersey LIHEAP unearned sources
