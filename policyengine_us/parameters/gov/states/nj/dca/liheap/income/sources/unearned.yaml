description: New Jersey counts these available unearned income sources under the Low Income Home Energy Assistance Program.
values:
  '2025-10-01':
  - unemployment_compensation
  - strike_benefits
  - ssi
  - pension_income
  # Handbook 2.3.D counts pensions and annuities; 2.3.E.10 excludes veterans'
  # benefits, but VA survivor payments cannot be separated and count here.
  - survivor_benefits
  - general_assistance
  - rental_income
  - farm_rent_income
  - alimony_income
  - child_support_received
  - interest_income
  - ordinary_dividend_income
  - workers_compensation
  - disability_benefits
