# The published rows "$0 - $1000" and "$1001 - $2000" print identical payments
# in every year and are combined. The row "$2001 - $6439" is its own band
# because the FY2027 matrix prints a different renters amount there in one cell.
description: New Jersey uses these monthly income band boundaries under the Low Income Home Energy Assistance Program.
