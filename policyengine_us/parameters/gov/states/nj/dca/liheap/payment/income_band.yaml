- threshold:
    2025-10-01: 0
  amount:
    2025-10-01: 1
- threshold:
    2025-10-01: 2_001
  amount:
    2025-10-01: 2
- threshold:
    2025-10-01: 6_440
  amount:
    2025-10-01: 3
- threshold:
    2025-10-01: 8_887
  amount:
    2025-10-01: 4
- threshold:
    2025-10-01: 9_660
  amount:
    2025-10-01: 5
