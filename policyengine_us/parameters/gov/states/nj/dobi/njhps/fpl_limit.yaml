description: New Jersey limits income to this share of the federal poverty line under the New Jersey Health Plan Savings program.
values:
  # NJHPS extends premium assistance up to 600% FPL, applied as a "<=" comparison.
  # The dollar ceilings ($93,900 individual / $192,900 family of four in 2026)
  # auto-derive from the federal poverty line and are not hard-coded. The DOBI
  # FY2025-2026 budget response said the Department "intends to continue"
  # NJHPS to 600% FPL if the enhanced federal credits were extended; they were
  # not, and the FY2026-2027 response (p.4) states the outcome: "While the
  # enhanced APTCs were not extended by the federal government in 2026, the
  # Department continued providing NJ Health Plan Savings subsidies up to 600%
  # FPL." The 2026-08-18 letter to the Assembly Budget Committee (p.5) fixes the
  # poverty-guideline vintage: "For plan year 2026 (using 2025 FPL levels), for
  # a family of four, the 400 percent of FPL is $128,600, and 600 percent of
  # FPL is $192,900".
  2026-01-01: 6

