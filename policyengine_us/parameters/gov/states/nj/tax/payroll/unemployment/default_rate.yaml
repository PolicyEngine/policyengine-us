description: New Jersey assigns new employers this unemployment insurance contribution rate for each July-June fiscal year, excluding the workforce development and supplemental workforce fund contributions.
values:
  # The fiscal year that began July 1, 2017, and the next four fiscal years
  # through June 30, 2022, all used 2.6825 percent.
  2018-01-01: 0.026825
  2022-07-01: 0.029825
  2023-07-01: 0.032825
  2024-07-01: 0.029825
  2025-07-01: 0.026825

metadata:
  period: year
  unit: /1
  label: New Jersey default unemployment tax rate
