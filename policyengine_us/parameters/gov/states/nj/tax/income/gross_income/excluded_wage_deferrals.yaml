description: New Jersey subtracts these elective deferrals from employment income to get the wages it taxes (NJ-1040 line 15, W-2 box 16).
values:
  1984-01-01:
    # N.J.S.A. 54A:6-21 leaves 401(k) elective deferrals out of gross income.
    # Employee contributions to 403(b), 457 and SEP plans, to the federal
    # Thrift Savings Plan and to any other retirement plan stay in New Jersey
    # wages, so they are not listed.
    - traditional_401k_contributions
metadata:
