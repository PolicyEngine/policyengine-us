description: New Jersey includes these income sources in gross income without loss clamping, as they cannot produce a net loss under N.J.S. 54A:5-1. Under N.J.S.A. 54A:5-1(j) and N.J.A.C. 18:35-1.5, employee contributions to 403(b) plans are not tax-deferred for NJ purposes, so NJ taxable distributions differ from federal amounts due to basis recovery; modeled using federal taxable_403b_distributions as an approximation.
