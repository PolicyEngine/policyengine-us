description: New Jersey limits the Child Care Assistance Program to children younger than this age who have special needs or, where the court-supervision extension applies, are under court supervision.
# CCDF Plan 2.2.1(b)-(c) sets the same upper age of 18 (under 19) for both routes.
values:
  2024-01-01: 19

