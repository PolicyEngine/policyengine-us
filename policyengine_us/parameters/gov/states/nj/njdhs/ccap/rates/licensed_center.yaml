description: New Jersey provides these weekly reimbursement rates for licensed child care centers under the Child Care Assistance Program.
metadata:
  period: week
  unit: currency-USD
  label: New Jersey CCAP licensed center weekly rates
  breakdown:
    - nj_ccap_time_category
    - nj_ccap_grow_nj_kids_rating
    - nj_ccap_age_group
  reference:
    - title: CC-230 (03/26) Maximum Child Care Payment Rates, Licensed Child Care Centers, effective April 1, 2026
      href: https://www.childcarenj.gov/ChildCareNJ/media/media_library/Max_CC_Payment_Rates.pdf#page=1
    - title: CC-230 (02/25) Maximum Child Care Payment Rates, Licensed Child Care Centers, effective March 1, 2025 (Bergen County mirror)
      href: https://bergencountynj.gov/wp-content/uploads/2025/03/CC-230-March-2025-Rate-Chart.pdf#page=1
    - title: CC-230 (07/24) Maximum Child Care Payment Rates, Licensed Child Care Centers, effective August 1, 2024 (archived)
      href: http://web.archive.org/web/20250208062925/https://www.childcarenj.gov/ChildCareNJ/media/media_library/Max_CC_Payment_Rates.pdf#page=1
    - title: CC-230 (02/24) Maximum Child Care Payment Rates, Licensed Child Care Centers
      href: http://www.bccap.org/wp-content/uploads/2024/03/Maximum-Child-Care-Payment-Rates-March-2024.pdf#page=1

# 2024-01-01 values are CC-230 (02/24) rates effective March 1, 2024,
