description: New Jersey provides these weekly reimbursement rates for ACA summer youth camps under the Child Care Assistance Program.
metadata:
  period: week
  unit: currency-USD
  label: New Jersey CCAP ACA summer camp weekly rates
  breakdown:
    - nj_ccap_time_category
    - nj_ccap_age_group
  reference:
    - title: CC-230 (03/26) Maximum Child Care Payment Rates, ACA Summer Youth Camps, effective April 1, 2026
      href: https://www.childcarenj.gov/ChildCareNJ/media/media_library/Max_CC_Payment_Rates.pdf#page=4
    - title: CC-230 (02/25) Maximum Child Care Payment Rates, ACA Summer Youth Camps, effective March 1, 2025 (Bergen County mirror)
      href: https://bergencountynj.gov/wp-content/uploads/2025/03/CC-230-March-2025-Rate-Chart.pdf#page=4
    - title: CC-230 (07/24) Maximum Child Care Payment Rates, ACA Summer Youth Camps, effective August 1, 2024 (archived)
      href: http://web.archive.org/web/20250208062925/https://www.childcarenj.gov/ChildCareNJ/media/media_library/Max_CC_Payment_Rates.pdf#page=4
    - title: CC-230 (02/24) Maximum Child Care Payment Rates, ACA Summer Youth Camps
      href: http://www.bccap.org/wp-content/uploads/2024/03/Maximum-Child-Care-Payment-Rates-March-2024.pdf#page=4

# 2024-01-01 values are CC-230 (02/24) rates effective March 1, 2024,
# backdated to January 1 for microsimulation coverage.
# The prior (March 2023) rates could not be sourced.
# The CC-230 (07/24) edition effective August 1, 2024 left camp rates unchanged.
# 2025-03-01 values are CC-230 (02/25) rates effective March 1, 2025; the
# state overwrites the CC-230 PDF in place, so that edition is cited from
# the Bergen County program-instruction mirror.
# 2026-04-01 values are CC-230 (03/26) rates effective April 1, 2026.
