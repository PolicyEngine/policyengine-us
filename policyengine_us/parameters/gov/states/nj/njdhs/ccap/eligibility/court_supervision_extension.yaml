description: New Jersey extends Child Care Assistance Program age eligibility to children under court supervision.
values:
  # The FFY 2019-2021 (effective October 1, 2018), FFY 2022-2024 and FFY
  # 2025-2027 plans each elect the 45 CFR 98.20(a)(1)(ii) court-supervision
  # extension with an upper age of 18 (under 19). N.J.A.C. 10:15-1.3(a) lists
  # only the under-13 and under-19 disabled definitions. Earlier plans were not
  # reviewed.
  2018-10-01: true
