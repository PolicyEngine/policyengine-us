description: New Jersey extends child-care subsidy age eligibility to children under court supervision.
values:
  # The approved FFY 2025-2027 plan, section 2.2.1(c), elects the 45 CFR
  # 98.20(a)(1)(ii) court-supervision extension through age 18 from the plan
  # period start. The FFY 2022-2024 election was not verified, so the earlier
  # calculation is retained before October 2024.
  2021-10-01: false
  2024-10-01: true
metadata:
  unit: bool
  period: year
  label: New Jersey CCAP court-supervision age extension
  reference:
