description: New Jersey extends Child Care Assistance Program age eligibility to children under court supervision up to the special needs child age threshold if this is true.
values:
  # The FFY 2016-2018 plan (effective June 1, 2016; earlier periods follow it)
  # and the FFY 2019-2021, FFY 2022-2024 and FFY 2025-2027 plans each elect the
  # 45 CFR 98.20(a)(1)(ii) court-supervision extension with an upper age of 18
  # (under 19). N.J.A.C. 10:15-1.3(a) lists the under-13 and under-19 disabled
  # children and the SSI, Title IV-E and N.J.A.C. 10:90-2.7 dependent-child
  # cases, but no court-supervision route.
  2016-06-01: true
