description: Louisiana caps the retirement income exemption at this amount for filers, based on age.

brackets:
  - threshold:
      2021-01-01: 0
    amount:
      2021-01-01: 0
  - threshold:
      2001-01-01: 65
    amount:
      2001-01-01: 6_000
      2025-01-01: 12_000
      # RIB 26-019 applies a 2.7% CPI-U multiplier (BLS reported the December
      # 2024 to December 2025 increase as 2.7%): 12,000 * 1.027 = 12,324.
      # Later years follow R.S. 47:44.1(A)'s annual CPI-U adjustment,
      # computed by extend_la_cpi_u_indexed_amounts in
      # policyengine_us/parameters/uprating_extensions.py.
      2026-01-01: 12_324

