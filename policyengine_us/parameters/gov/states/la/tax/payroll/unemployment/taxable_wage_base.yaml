description: Louisiana limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # Procedure 2 of the Section 23:1474(I) table sets the $7,700 base; Acts 2020
  # (2nd Extraordinary Session) No. 40, Acts 2021 No. 91 and Acts 2022 No. 116
  # kept Procedure 2 for 2021 to 2023.
  2018-01-01: 7_700
  # Procedure 3 of the Section 23:1474(I) table sets the $7,000 base.
  2026-01-01: 7_000

