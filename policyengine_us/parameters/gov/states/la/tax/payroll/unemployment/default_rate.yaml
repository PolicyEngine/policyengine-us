description: Louisiana assigns each new employer its industry's average rate, at least 1%, so this parameter uses the average employer contribution rate on taxable wages.
values:
  # The Department of Labor's average employer contribution rates on taxable
  # wages; the Workforce Commission publishes no comparable series.
  2018-01-01: 0.0154
  2019-01-01: 0.0144
  2020-01-01: 0.0131
  2021-01-01: 0.0128
  2022-01-01: 0.0133
  2023-01-01: 0.0129
  2024-01-01: 0.013
  2025-01-01: 0.0123
  # Department of Labor estimate.
  2026-01-01: 0.0125

