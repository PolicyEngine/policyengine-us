description: Louisiana counts the income of household members at least this age, while members under it count only Social Security and Supplemental Security Income, under the Low Income Home Energy Assistance Program.
# The guide counts "Any income of a household member age 18 and older".
# Appendix E counts Social Security benefits, including SSI, "paid to minors",
# and FAQ A4 counts the Social Security a parent receives for a minor child;
# no other income of a minor is counted. Appendix E also excludes income earned
# by members 18 and over still enrolled in high school (is_in_k12_school).
values:
  2025-10-01: 18

