description: Louisiana counts these sources as unearned income of adult members under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    # Government and private pensions, annuities and insurance payments.
    - pension_income
    # Includes survivor benefit plan annuities.
    - military_retirement_income
    - railroad_benefits
    - survivor_benefits
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - total_unemployment_compensation
    - strike_benefits
    - alimony_income
    - interest_income
    - ordinary_dividend_income
    # The guide counts net rental income.
    - rental_income
    - farm_rent_income
    # Periodic receipts from estates or trusts.
    - estate_income
    # Regular contributions that are not loans; existing inputs do not
    # separate regular from irregular gifts.
    - financial_assistance
# Social Security net of the Medicare Part B premium and SSI count for every
# member, and net gambling winnings and FITAP are added, in
# la_liheap_countable_income. The guide excludes child support, capital gains,
# bank and retirement-account withdrawals, tax refunds and SNAP. Royalties,
# jury duty pay, military family allotments, training stipends and informal
# income have no existing input.
