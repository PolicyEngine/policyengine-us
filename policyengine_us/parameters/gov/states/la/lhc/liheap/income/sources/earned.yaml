description: Louisiana counts these sources as earned income of adult members not enrolled in high school under the Low Income Home Energy Assistance Program.
# The guide counts gross wages, salaries and commissions, military pay and net
# receipts from self-employment (self-employment income less business
# expenses). The existing net business inputs get no further deduction, and
# each source is floored at zero, so a loss in one source cannot offset another.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

