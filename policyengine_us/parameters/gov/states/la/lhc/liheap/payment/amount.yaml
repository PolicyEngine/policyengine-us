description: Louisiana provides this regular heating benefit by energy burden band and household size group under the Low Income Home Energy Assistance Program.
# The matrix prints one amount for sizes 1-3 and another for sizes 4 through
# "8 or More". The FY2026 plan's $200 minimum and $800 maximum (Section 2.6)
# equal the lowest cell and the highest cell plus the $100 priority supplement.
# Energy burden band 1: 9.9% and less.
1:
  1:
    2025-10-01: 200
  2:
    2025-10-01: 250
# Energy burden band 2: 10% to 17.9%.
2:
  1:
    2025-10-01: 350
  2:
    2025-10-01: 400
# Energy burden band 3: 18% to 24.9%.
3:
  1:
    2025-10-01: 500
  2:
    2025-10-01: 550
# Energy burden band 4: 25% and greater.
4:
  1:
    2025-10-01: 650
  2:
    2025-10-01: 700

