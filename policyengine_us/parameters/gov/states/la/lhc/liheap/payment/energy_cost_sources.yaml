description: Louisiana adds these residential energy bills to compute the total energy cost under the Low Income Home Energy Assistance Program.
# The guide adds the bills of every energy vendor. Annual amounts stand in for
# the application-month bill; the ratio to annual income gives the same
# burden. Bill line items the guide includes or excludes (taxes, customer
# charges, franchise fees, arrears, deposits) cannot be separated from these
# totals. Community solar participants report their electric bill.
values:
  2025-10-01:
    - pre_subsidy_electricity_expense
    - gas_expense
    - bottled_gas_expense
    - fuel_oil_expense
    - wood_expense
    - coal_expense
    - other_heating_fuel_expense

