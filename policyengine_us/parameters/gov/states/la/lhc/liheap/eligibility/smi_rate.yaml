description: Louisiana limits heating assistance income to this share of state median income under the Low Income Home Energy Assistance Program.
# The FFY2026 notice prints the resulting limits for household sizes 1-10.
# No adopted FFY2027 plan is available; later years carry this rate forward
# as unverified estimates.
values:
  2025-10-01: 0.6

