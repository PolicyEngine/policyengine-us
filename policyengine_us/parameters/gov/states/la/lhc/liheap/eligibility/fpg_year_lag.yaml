description: Louisiana uses the federal poverty guidelines from this many years before the model year for the federal income floor under the Low Income Home Energy Assistance Program.
# HHS made the 2025 guidelines mandatory for LIHEAP from October 1, 2025, so
# model period 2026 (FY2026) uses the 2025 guidelines and 2027 the 2026
# guidelines. Louisiana sets its limit at 60% of state median income; the
# guidelines enter only through the 110% floor of 42 U.S.C. 8624(b)(2)(B).
values:
  2025-10-01: 1

metadata:
  unit: year
  period: year
  label: Louisiana LIHEAP poverty guideline year lag
  reference:
    - title: LIHEAP IM 2025-02, Attachment 2, poverty guidelines for mandatory use in FY26
      href: https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM2025-02_FPGSte-Table_Att2.pdf#page=1
    - title: 42 U.S.C. 8624(b)(2)(B)
      href: https://www.law.cornell.edu/uscode/text/42/8624#b_2_B
