description: Louisiana treats household members at least this age as elderly for the priority group supplement and the utility allowance exemption under the Low Income Home Energy Assistance Program.
# The guide exempts "Applicants 60 years or older" from the utility allowance
# rule and names "Persons 60 years or older" as a priority group. Plan item 2.3
# words the exemption as "over 60 years old"; the guide's 60-or-older wording
# is followed for both uses. No input names the applicant, so any counted
# member of this age qualifies.
values:
  2025-10-01: 60

