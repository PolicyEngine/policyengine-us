description: North Carolina provides this amount as the maximum monthly basic rate under the State-County Special Assistance program.
values:
  2026-01-01: 1_397
  # 1,397 * 1.036 = 1,447.29, with the 3.6% COLA.
  2027-01-01: 1_447

metadata:
  unit: currency-USD
  period: month
  label: North Carolina SA basic rate
  # G.S. 108A-42.1(a) adjusts the rate each January 1 by the federally approved
  # Social Security COLA: SSA's percentage, rounded to a tenth, not the
  # unrounded CPI-W ratio in gov.ssa.uprating. Years after the last listed one
  # are projected from gov.ssa.uprating until SSA announces the COLA.
  uprating:
    parameter: gov.ssa.uprating
    rounding:
      type: nearest
      interval: 1
  reference:
    - title: North Carolina General Statutes § 108A-42.1(a)
      href: https://www.ncleg.gov/EnactedLegislation/Statutes/PDF/BySection/Chapter_108A/GS_108A-42.1.pdf
    - title: Social Security Administration 2027 Cost-of-Living Adjustment (COLA) Fact Sheet
      href: https://www.ssa.gov/news/en/cola/factsheets/2027.html
    - title: "North Carolina Special Assistance Manual SA-3220 II.A and VIII #page 204,219"
      href: https://policies.ncdhhs.gov/wp-content/uploads/Special-Assistance-Manual-Rev-June-2026.pdf#page=204
    - title: North Carolina Change Notice EFS-SA-CN-01-2026 I
      href: https://policies.ncdhhs.gov/wp-content/uploads/EFS-SA-CN-01-2026.pdf#page=1
