description: North Carolina counts these rental income sources as earned income under the Low Income Energy Assistance Program.
values:
  2025-10-01:
    # Section 300.09 B.3 gives rental income the earned income deduction.
    - rental_income
    # Farm rent (Form 4835) is not named in the manual. It is rent from
    # property the person owns, so it is treated as rental income.
    - farm_rent_income
metadata:
  unit: list
  period: year
