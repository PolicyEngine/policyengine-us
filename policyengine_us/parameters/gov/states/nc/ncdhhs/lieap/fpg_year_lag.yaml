description: North Carolina uses the federal poverty guidelines published this many years before the year in which the heating season ends under the Low Income Energy Assistance Program.
# The change notices put each federal fiscal year's poverty level into effect
# on October 1 (FY2026 on October 1, 2025 and FY2027 on October 1, 2026). The
# income limit tables for those years equal the 2025 and 2026 guidelines, the
# latest ones published on each effective date.
values:
  2025-10-01: 1
metadata:
  unit: year
  period: year
  label: North Carolina LIEAP federal poverty guideline year lag
  reference:
    - title: North Carolina Energy Programs Manual Change Notice 05-2025, FY2026 federal poverty level effective October 1, 2025, page 1
      href: https://policies.ncdhhs.gov/wp-content/uploads/EP-CN-05-2025.pdf#page=1
    - title: North Carolina Energy Programs Manual Change Notice 03-2026, FY2027 federal poverty level effective October 1, 2026, page 1
      href: https://policies.ncdhhs.gov/wp-content/uploads/EP-CN-03-2026.pdf#page=1
    - title: North Carolina Energy Programs Manual, Section 300.09, maximum countable income tables, pages 14-15
      href: https://policies.ncdhhs.gov/wp-content/uploads/EP-300-5.1.2026.pdf#page=14
