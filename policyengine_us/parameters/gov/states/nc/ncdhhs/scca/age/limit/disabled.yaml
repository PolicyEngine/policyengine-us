      href: https://policies.ncdhhs.gov/wp-content/uploads/Chapter-4-RED-CN-26-03-Application-Eligibility-Determination-Documentation-2.pdf#page=10
    - title: Child Care and Development Fund (CCDF) Plan for North Carolina FFY 2022-24 Amendment 1, Sections 3.1.1(b)-(c)
      href: https://ncchildcare.ncdhhs.gov/Portals/0/documents/pdf/A/ACF-118_CCDF_FFY_2022-2024_For_North_Carolina_Amendment_1.pdf?ver=C9YfIUPAFekeBA3I1mN8aA%3d%3d#page=83
    - title: Child Care and Development Fund (CCDF) Plan for North Carolina FFY 2025-27, Section 2.2.1(b)-(c), upper age 17.00
      href: https://ncchildcare.ncdhhs.gov/Portals/0/documents/pdf/A/ACF-118_CCDF_FFY_2025-2027_For_North_Carolina_November_2024.pdf?ver=5Qk3uXFjaCh3xyBqG3faZg%3d%3d#page=18
  label: North Carolina Subsidized Child Care Assistance program special needs or court supervision child age limit
  unit: year
  period: year
# Chapter 4 Section IX serves children "13 through 17" with a special need or
# under court-ordered supervision, so both routes share this exclusive limit
# of 18 (confirmed with our benefits specialist and both CCDF Plans).
values:
  2022-10-01: 18
