description: Arizona uses federal poverty guidelines from this many years before the modeled program year for the income limit under the Low Income Home Energy Assistance Program.
# Verified for FFY2026: revision 13's Appendix A household sizes 10 to 12 and
# its $687 additional-person increment reproduce with the 2025 guideline
# (15,650 plus 5,500 per additional person), not the 2026 guideline. Revision
# 16A's Appendix A prints the FFY2027 limits, whose sizes 10 to 12 and $710
# increment reproduce with the 2026 guideline, the same one-year lag. This is a
# relative year selection, not a fixed guideline year. Earlier Arizona policy
# is unverified.
values:
  2025-08-25: 1

metadata:
  unit: year
  period: year
  label: Arizona LIHEAP federal poverty guideline year lag
