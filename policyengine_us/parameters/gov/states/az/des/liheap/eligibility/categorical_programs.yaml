description: Arizona treats a household as categorically eligible when a member receives one of these benefits under the Low Income Home Energy Assistance Program.
# Section VI.A.6.b.i: "If one (1) Household member's current enrollment in Cash
# Assistance or Nutrition Assistance is verified, the Household will be
# considered categorically eligible." A positive modeled benefit stands for
# current enrollment; snap and tanf are take-up gated, and tanf includes
# Arizona Cash Assistance (az_tanf). The FY2026 plan (Section 1.4) answers No
# for SSI and for means-tested veterans programs.
values:
  2025-08-25:
    - snap
    - tanf

