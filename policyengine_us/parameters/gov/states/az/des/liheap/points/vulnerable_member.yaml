description: Arizona awards this many benefit matrix points for each energy need category present in the household under the Low Income Home Energy Assistance Program.
# Worksheet Section 3: Elderly 1 point, Disabled 1 point, Veteran 1 point,
# Child age 6 or younger 1 point, "(Only one point per category allowed)".
values:
  2024-10-12: 1

