description: Arizona awards an energy need point when a household member is younger than this age under the Low Income Home Energy Assistance Program.
# The worksheet row is "Child age 6 or younger" and the policy says "Aged six
# (6) and under", so the point applies below age 7.
values:
  2024-10-12: 7

metadata:
  unit: year
  period: year
  label: Arizona LIHEAP young child age limit
  reference:
    - title: Arizona LIHEAP Eligibility Worksheet, $640 Limit (effective October 12, 2024), Section 3 Energy Need (Child age 6 or younger, 1 point)
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/AZ_BenefitMatrix_Heating_2026.pdf#page=1
    - title: Arizona DES LIHEAP Policy, revision 13 (effective August 25, 2025), Section VI.B.1.d.i (household members "Aged six (6) and under")
      href: https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=10
    - title: Arizona LIHEAP FY2026 State Plan, Section 2.4 (additional points for children 6 years old and under)
      href: https://liheapch.acf.gov/docs/2026/state-plans/AZ_Plan_2026.pdf#page=10
