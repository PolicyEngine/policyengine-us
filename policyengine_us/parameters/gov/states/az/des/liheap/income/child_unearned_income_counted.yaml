description: Arizona counts the unearned income of household members under the adult age when this is true under the Low Income Home Energy Assistance Program.
# Revision 13, Section VI.A.6.e.ii.E: "Income from Household members under the
# age of 18 is not considered Countable Income." Revision 15 (effective March
# 23, 2026) rewrote the sentence to "Earned income from Household members under
# the age of 18 is not considered Countable Income", and revision 16A keeps
# that wording. Earned income of members under 18 is excluded under every
# revision.
# NOTE: Counting a child's unearned income (SSI, survivor benefits, child
# support) from March 23, 2026 is an inference from that narrowed exclusion.
# The revisions do not say so directly, and Section VI.A.6.d.ii still says
# that the income of members aged 18 and older is household income.
values:
  2025-08-25: false
  2026-03-23: true

metadata:
  unit: bool
