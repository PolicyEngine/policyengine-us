description: Arizona uses these earned income sources to approximate countable household earnings under the Low Income Home Energy Assistance Program.
# Section VI.A.6.e.ii.A counts "Earned income from employment, including
# self-employment (includes wages, salaries, tips, etc.)"; the plan's Section
# 1.9 also checks contract income, commissions, WIA employment income and work
# study, which existing inputs report as wages. Section VII.A.1.c.ii.B counts
# "Income from self-employment or sole-proprietorship" and Section
# VII.A.1.c.iii.B.1 accepts a "Schedule C (Profit and Loss Statement)"; neither
# says whether a loss offsets other income, so the existing net self-employment
# inputs are used without a further expense deduction and each is floored at
# zero in the formula.
values:
  2025-08-25:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - partnership_s_corp_income
    - farm_operations_income

