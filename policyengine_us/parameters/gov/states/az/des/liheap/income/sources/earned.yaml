      href: https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=8
    - title: Arizona LIHEAP FY2026 State Plan, Section 1.9 (wages, self-employment income, contract income, commissions, WIA employment income and work study counted), pages 6-7
      href: https://liheapch.acf.gov/docs/2026/state-plans/AZ_Plan_2026.pdf#page=6
