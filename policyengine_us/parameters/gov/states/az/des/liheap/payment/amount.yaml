    - title: "Arizona DES LIHEAP Policy, revision 16A (effective July 1, 2026), Section VII.B.1.a (up to $640 for a standard payment), Section VII.B.4.b and Appendix B Section 4 Benefit Calculation #page 31,35,41"
      href: https://des.az.gov/sites/default/files/dl/CCSD-LIHEAP-Policy.pdf#page=31
