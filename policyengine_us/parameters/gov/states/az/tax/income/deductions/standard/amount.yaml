description: Arizona provides filers a standard deduction of this amount, depending on their filing status.
metadata:
  label: Arizona standard deduction
  period: year
  unit: currency-USD
  breakdown:
  - az_filing_status
  reference:
  - title: 2025 Arizona Form 140 Resident Personal Income Tax Instructions
    href: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf#page=21
  - title: 2024 Arizona Form 140A - Arizona Resident Personal Income Tax Booklet
    href: https://azdor.gov/forms/individual/form-140a-arizona-resident-personal-income-tax-booklet
  - title: 2023 Arizona Form 140A - Arizona Resident Personal Income Tax Booklet
    href: https://azdor.gov/forms/individual/form-140a-arizona-resident-personal-income-tax-booklet
  - title: 2022 Arizona Form 140 Resident Personal Income Tax Booklet
    href: https://azdor.gov/forms/individual/form-140-arizona-resident-personal-income-tax-booklet
  - title: 2021 Arizona Form 140 Resident Personal Income Tax Booklet
    href: https://azdor.gov/sites/default/files/2023-03/FORMS_INDIVIDUAL_2021_140BOOKLET.pdf#page=43
  - title: A.R.S. 43-1041(A) and (H)
    href: https://www.azleg.gov/ars/43/01041.htm
  - title: Laws 2026, ch. 140 (HB 4168), secs. 16 and 35(A)
    href: https://www.azleg.gov/legtext/57leg/2R/laws/0140.htm
  # 2026: 43-1041(H) indexes the subsection A amounts "in the same manner in
  # which the federal basic standard deduction is adjusted for inflation
  # pursuant to section 63". The Arizona and federal 2025 bases are equal, so
  # the 2026 amounts equal the federal ones.
  - title: Rev. Proc. 2025-32, sec. 4.14(1) (2026 federal standard deduction)
    href: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=18
  # Each filing-status amount below carries its own uprating, because
  # policyengine-core uprates only parameters whose own metadata names one.

JOINT:
