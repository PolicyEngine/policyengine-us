  label: Arizona property tax credit cohabitating amount
# Each threshold is the lower bound of a band in ARS 43-1072(B)(2), and a
# band runs up to, but not including, the next band's lower bound. The
# statute lists whole-dollar bands ($0-2,500, 2,501-2,650, ...) and sets
# the income limit in (A)(3)(b) as "less than" $5,501, one dollar above the
# last band's upper bound, so the last band covers every income below $5,501.
# Reading every band the same way puts cents between two whole-dollar bands
# in the lower one: $2,500.50 gets the $0-2,500 amount, as if the cents
# were dropped. Form 140PTC line 10 takes whole dollars, and the 2025 Form
# 140 instructions (page 4) round to the nearest dollar, which would instead
# move 50 cents or more into the next band.
