description: >-
  Arizona provides this rebate amount per dependent based on the dependent's age.
  PolicyEngine attributes this one-time rebate to eligibility tax year 2021 rather than
  to its 2023 payment year. It enters refundable-credit totals only in 2021, even if a
  standalone calculation returns a positive amount in another year.
