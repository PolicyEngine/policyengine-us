description: Missouri counts these income sources as unearned income under the Temporary Assistance for Needy Families program.
values:
  2010-07-01:
    # 0210.015.05: VA, disability, workers compensation, and OASDI benefits.
    - veterans_benefits
    - disability_benefits
    - workers_compensation
    - social_security
    - survivor_benefits
    # Annuities, pensions, retirement payments, and railroad retirement.
    - pension_income
    - retirement_distributions
    - military_retirement_pay
    - railroad_benefits
    # Rental income is unearned when management is less than 20 hours/week.
    - rental_income
    - farm_rent_income
    # Recurring estate income is available income under 0210.015.00;
    # 0210.015.05 also includes trust payments.
    - estate_income
    - child_support_received
    - alimony_income
    # Contributions are generally counted, subject to the exclusions below.
    - financial_assistance
    - gi_cash_assistance
    - dividend_income
    - unemployment_compensation
    - strike_benefits
    - gambling_winnings
    - miscellaneous_income

metadata:
  unit: list
  period: month
  label: Missouri TANF unearned income sources
  reference:
