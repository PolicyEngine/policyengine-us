      href: https://dssmanuals.mo.gov/temporary-assistance-case-management/0210-015-00/
    - title: Missouri DSS Manual 0210.015.05 - Sources of Earned, Unearned, and Educational Income
      href: https://dssmanuals.mo.gov/temporary-assistance-case-management/0210-015-05/
    - title: Missouri DSS Manual 0210.015.35.20 - Supplementary Assistance
      href: https://dssmanuals.mo.gov/temporary-assistance-case-management/0210-015-35-20/
    - title: Missouri DSS Manual 0210.015.35.45 - Interest Income
      href: https://dssmanuals.mo.gov/temporary-assistance-case-management/0210-015-35-45/
    - title: Missouri DSS Manual 0210.015.35.50 - Other Income
      href: https://dssmanuals.mo.gov/temporary-assistance-case-management/0210-015-35-50/
    - title: Missouri DSS IM-67 (May 22, 2003) - Income Exclusion, Interest
      href: https://dssmanuals.mo.gov/wp-content/themes/mogovwp_dssmanuals/public/memos/memos_03/im67_03.html
  # Interest and General Relief are excluded; dividends remain countable.
  # Do not add general_assistance wholesale: 0210.015.05 excludes General
  # Relief but includes Refugee Cash Assistance. The generic input cannot
  # distinguish them. Foster/adoption subsidies, RCA, and several other
  # named sources also lack dedicated inputs; this list is not exhaustive.
  # The available gift/pilot inputs do not distinguish small nonrecurring
  # gifts, nonprofit donations, and specific-purpose supplementary aid
  # from regular countable contributions. Those exclusions need richer
  # inputs, as do rental management hours/expenses, education aid funding,
  # restricted trust principal, and exempt components of veterans benefits.
  # Retirement and estate inputs are treated as recurring cash receipts;
  # lump sums, asset conversions and rollovers require separate treatment.
