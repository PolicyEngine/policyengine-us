description: Missouri counts these unearned income sources under the Low Income Home Energy Assistance Program.
# Social Security counts net of the Medicare Part B premium in
# mo_liheap_countable_income_person, and Missouri TANF is added at the
# household level in mo_liheap_countable_income. Short- and long-term
# disability payments count only for members 18 or older
# (adult_unearned_sources).
# Interest and dividends are excluded (October 2025 manual, page 38), as are
# capital gains, which page 38 treats as lump sums; page 32 lists the Form 1040
# capital gains line among self-employment documents. Foster care payments,
# royalties, roomer and boarder payments, armed forces allotments and
# installment income have no inputs.
# Retirement-account (IRA, Keogh or 401(k)) withdrawals are not counted: the
# income lists name pensions but not account withdrawals, and IRA and Keogh
# balances count as resources (manual page 40; 13 CSR 40-19.020(2)(N)), so
# the model treats a withdrawal as a change in resources, not income.
values:
  2023-10-01:
    - total_unemployment_compensation
    # Union funds or strike benefits.
    - strike_benefits
    - ssi
    # Supplemental Aid to the Blind, Blind Pension and Supplemental State
    # Payments.
    - mo_ssp
    - pension_income
    - military_retirement_income
    - railroad_benefits
    # Rent received from land or buildings, including farm rent and
    # Conservation Reserve Program payments.
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - veterans_benefits
    - workers_compensation
    # Contributions: money received from friends, family or organizations.
    - financial_assistance

