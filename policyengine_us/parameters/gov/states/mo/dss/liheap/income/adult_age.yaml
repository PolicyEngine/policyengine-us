description: Missouri excludes the earned income and the disability income of household members below this age under the Low Income Home Energy Assistance Program.
# The October 2025 manual leaves out the earned income and the disability
# income of a household member under 18 but counts the member's SSA income
# (adult_unearned_sources lists the disability payments). The FFY2026 plan does
# not count the earned income of a child under 18, and the 8-2026 application
# asks for job income only from members 18 or older.
values:
  2023-10-01: 18

