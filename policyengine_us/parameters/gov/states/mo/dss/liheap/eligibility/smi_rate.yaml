description: Missouri limits household income to this share of the state median income under the Low Income Home Energy Assistance Program.
# The published monthly limits equal the HHS LIHEAP limit for the household
# size divided by twelve and rounded to the nearest dollar (FFY2026 sizes 1-20,
# FFY2027 sizes 1-10). 13 CSR 40-19.020(6)(D) refers to the income ranges of
# section (14), a 2017 table that runs from 0 to 135 percent of the poverty
# level; the FFY2026 plan, Appendix K, the October 2025 manual and the 8-2026
# application set this share of state median income.
values:
  2023-10-01: 0.6

