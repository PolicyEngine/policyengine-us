description: Missouri provides this one-time Energy Assistance payment by primary heating fuel under the Low Income Home Energy Assistance Program.
# The same amounts appear in the October 2025 manual (its Appendix K), the
# FFY2026 Appendix K matrix and the FFY2027 application. 13 CSR 40-19.020(14)
# bases payments on household size, income range and fuel source, using
# metrics established by the division, and prints a 2017 table of payments
# that decline across income ranges from 0 to 135 percent of the poverty level.
# The FFY2026 plan, the Appendix K matrix, the October 2025 manual and the
# 8-2026 application set one amount per fuel for incomes up to 60 percent of
# state median income; the model applies those amounts.
NATURAL_GAS:
  2023-10-01: 326
# Tank propane. The schedule also pays $177 for cylinder propane, which is not
# reachable because heating_type has a single propane value.
PROPANE:
  2023-10-01: 495
ELECTRICITY:
  2023-10-01: 318
FUEL_OIL:
  2023-10-01: 326
WOOD:
  2023-10-01: 219
KEROSENE:
  2023-10-01: 153
# Solar-heated homes are paid on their electric account at the electric amount.
SOLAR:
  2023-10-01: 318
# Households that heat with coal are denied (October 2025 manual Appendix E,
# denial code O); mo_liheap_eligible applies that denial.
COAL:
  2023-10-01: 0
# The schedule has no row for other fuels.
OTHER:
  2023-10-01: 0
NONE:
  2023-10-01: 0
UNSPECIFIED:
  2023-10-01: 0

