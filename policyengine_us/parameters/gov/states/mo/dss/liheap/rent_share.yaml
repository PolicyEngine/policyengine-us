description: Missouri pays a renter household whose heating costs are included in the rent this share of its annual rent, up to the Energy Assistance amount for its heating fuel, under the Low Income Home Energy Assistance Program.
# 13 CSR 40-19.020(13) sets a payment of no more than eight percent of annual
# rent, applied here. The October 2025 manual (page 63), the FFY2024-FFY2026
# plans and the DSS draft FFY2027 plan (section 2.3) describe 16 percent; the
# manual caps the payment at the Energy Assistance amount for the household's
# energy source. RSMo 660.115.2 separately limits renter payments from the
# state Utilicare stabilization fund to the lesser of eight percent of annual
# rent or $100; Energy Assistance is paid from federal LIHEAP funds.
values:
  2017-05-30: 0.08

