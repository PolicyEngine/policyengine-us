description: Missouri sets this number of years after entry as the waiting period for other qualified immigrants under the Supplemental Aid to the Blind and Supplemental Nursing Care programs.
values:
  # These lists follow MO HealthNet for Families § 1805.020.10 (IM-97), which
  # has not been amended for the October 2026 federal Medicaid changes.
  # Revisit them if the Family Support Division amends that section.
  1996-08-22: 5
