description: Missouri excludes these qualified immigrant statuses from the waiting period under the Supplemental Aid to the Blind and Supplemental Nursing Care programs.
values:
  # These lists follow MO HealthNet for Families § 1805.020.10 (IM-97), which
  # has not been amended for the October 2026 federal Medicaid changes.
  # Revisit them if the Family Support Division amends that section.
  # Amerasian immigrants, American Indians born in Canada, Iraqi and Afghan
  # special immigrants, and trafficking victims also have no waiting period
  # but have no immigration_status value.
  1996-08-22:
    - REFUGEE
    - ASYLEE
    - DEPORTATION_WITHHELD
    - CUBAN_HAITIAN_ENTRANT
