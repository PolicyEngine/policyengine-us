description: Missouri provides this amount as the consolidated standard under the Supplemental Aid to the Blind program.
values:
  2011-01-01: 510
  # 13 CSR 40-2.120(3)(A)2 raises the standard by each Title II COLA and
  # rounds to the next highest dollar, but DSS publishes nearest-dollar
  # figures ($1,019 x 1.025 = $1,044.48, published as $1,044).
  2022-01-01: 908
  2023-01-01: 987
  2024-01-01: 1_019
  2025-01-01: 1_044
  2026-01-01: 1_073
