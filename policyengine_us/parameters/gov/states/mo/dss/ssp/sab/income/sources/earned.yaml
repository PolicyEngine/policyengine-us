description: Missouri uses these sources of earned income under the Supplemental Aid to the Blind program.
values:
  # SAB began on January 1, 1974 (SSA, State Assistance Programs for SSI
  # Recipients, January 2011); the manual section is undated. Boarder income
  # and income in kind for services are not captured.
  1974-01-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
