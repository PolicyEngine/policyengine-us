description: Missouri uses these sources of unearned income under the Supplemental Aid to the Blind program.
values:
  # SAB began on January 1, 1974 (SSA, State Assistance Programs for SSI
  # Recipients, January 2011); the manual section is undated. SSI is not
  # income for the need test (§ 0410.020.00). Child support received is
  # added in mo_sab_countable_income only when no child is in the home
  # (§ 0410.015.10). Veterans benefits count in full because the excluded
  # Aid and Attendance portion (§ 0410.015.15) is not separable. Rent from
  # property the claimant actively manages is earned income under 13 CSR
  # 40-2.050(1)(C) but is counted here as unearned.
  1974-01-01:
    - pension_income
    - social_security
    - disability_benefits
    - veterans_benefits
    - survivor_benefits
    - workers_compensation
    - unemployment_compensation
    - retirement_distributions
    - railroad_benefits
    - strike_benefits
    - gi_cash_assistance
    - financial_assistance
    - alimony_income
    - dividend_income
    - interest_income
    - rental_income
    - gambling_winnings
