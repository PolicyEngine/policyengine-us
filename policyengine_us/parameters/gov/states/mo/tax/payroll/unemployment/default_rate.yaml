description: Missouri assigns this unemployment insurance contribution rate, after its contribution rate adjustment, to each new employer outside mining and construction.
values:
  # Missouri Revised Statutes Section 288.090.2 assigns each new employer the
  # greater of its industry's average rate and 2.7%. Section 288.122 cuts each
  # rate by 7% when the trust fund's average balance exceeds $600 million and
  # by 12% when it exceeds $750 million; the 2006 text of Sections 288.036 and
  # 288.122 governs, because Pestka v. State (2016) held the 2015 veto
  # override of House Bill 150 invalid. The Division of Employment Security's
  # rate tables, which include that adjustment, list 2.511% (2.7% less 7%) for
  # 2018 and 2023 and 2.376% (2.7% less 12%) for the other years.
  2018-01-01: 0.02511
  2019-01-01: 0.02376
  2023-01-01: 0.02511
  2024-01-01: 0.02376

