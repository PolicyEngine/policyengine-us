description: Missouri limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # Missouri Revised Statutes Section 288.036.2 raises the base by $1,000 when
  # the trust fund's average balance is $350 million or less and cuts it by
  # $500 when the balance is $650 million or more, within $7,000 to $13,000.
  # The Division of Employment Security publishes each year's base.
  2018-01-01: 12_500
  2019-01-01: 12_000
  2020-01-01: 11_500
  2021-01-01: 11_000
  2023-01-01: 10_500
  2024-01-01: 10_000
  2025-01-01: 9_500
  2026-01-01: 9_000

