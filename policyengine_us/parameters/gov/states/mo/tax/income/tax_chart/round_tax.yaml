description: Missouri rounds each filer's tax from the tax rate chart to the nearest whole dollar, rounding 50 cents up, if this is true.
metadata:
  unit: bool
  period: year
  label: Missouri tax rate chart tax rounded to whole dollars
  reference:
    - title: 2019 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2019.pdf#page=22
    - title: 2020 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2020.pdf#page=22
    - title: 2021 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2021.pdf#page=26
    - title: 2022 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2022.pdf#page=26
    - title: "2023 MO-1040 Book - Individual Income Tax Long Form, Dollars and Cents and Tax Chart #page 4,26"
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2023.pdf#page=4
    - title: 2024 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2024.pdf#page=26
    - title: 2025 MO-1040 Book - Individual Income Tax Long Form, Tax Chart
      href: https://dor.mo.gov/forms/MO-1040%20Instructions_2025.pdf#page=21
    - title: 2026 Form MO-1040ES, Declaration of Estimated Tax for Individuals, Rounding and Tax Rate Chart
      href: https://dor.mo.gov/forms/MO-1040ES_2026.pdf#page=2

values:
  # Each booklet's tax chart says to "Round to the nearest whole dollar" and
  # enter the tax for each spouse on its own line (Lines 30Y and 30S in 2023).
  # The "Dollars and Cents" instructions round 1 to 49 cents down and 50 to 99
  # cents up.
  2019-01-01: true
