values:
  # Every published chart sets each base amount to the sum of the lower
  # brackets' taxes, each rounded to the nearest whole dollar. For example, the
  # 2023 chart's 2% bracket of $1,207 taxes $24.14 and its 2.5% bracket
  # $30.175, giving bases of $24 and $24 + $30 = $54. Rounding the running
  # total instead would give $91 rather than the chart's $90 at $4,828.
  2019-01-01: true
