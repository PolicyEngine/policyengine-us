description: Arkansas uses the regular income tax table for net taxable income below this amount.
# Each value is the "But Less Than" bound of the table's last row, where the
# table's note starts ("For $100,001 and over, your tax is ..."). At and above
# it, the model applies the bracket formula to the exact income.
values:
  2014-01-01: 50_000
  2016-01-01: 86_001
  2019-01-01: 87_001
  2020-01-01: 88_001
  2021-01-01: 91_001
  2022-01-01: 94_001
  2023-01-01: 100_001
metadata:
  unit: currency-USD
  period: year
