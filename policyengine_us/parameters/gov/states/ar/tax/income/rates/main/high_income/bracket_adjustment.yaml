description: Arkansas subtracts this bracket adjustment amount from the high-income tax table result, based on net taxable income.
metadata:
  type: single_amount
  threshold_unit: currency-USD
  amount_unit: currency-USD
  label: Arkansas high-income bracket adjustment
  reference:
  - title: A.C.A. § 26-51-201(a)(4)(C), as amended by Act 1 of 2026 (1st Extraordinary Session), § 1
    href: https://www.arkleg.state.ar.us/Home/FTPDocument?path=%2FACTS%2F2026S1%2FPublic%2FACT1.pdf#page=2
  - title: A.C.A. § 26-51-201(d)(1), as amended by Act 532 of 2023, § 2 (bracket amounts indexed annually, rounded to the nearest $100)
    href: https://www.arkleg.state.ar.us/Home/FTPDocument?path=%2FACTS%2F2023R%2FPublic%2FACT532.pdf#page=4
# Each threshold is the "Less Than or Equal To" bound of the row before, and
# the amount applies to net income ABOVE it (the formula calls calc with
# right=True): the statute's first row, $94,701-$94,800, is threshold 94,700.
# Keying rows on these round bounds lets each one be indexed and rounded to the
# nearest $100 like the high-income threshold, which the first row shares.
# The dollar amounts are not indexed: 26-51-201(d)(1) indexes only bracket
# bounds, and DFA's 2022-2025 cards kept each Act's $10 steps.
brackets:
