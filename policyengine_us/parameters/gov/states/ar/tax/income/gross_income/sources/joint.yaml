description: Arkansas accounts for these sources when calculating the gross income.
values:
  # Act 141 of 2017 added unemployment compensation to gross income for tax
  # years beginning on or after January 1, 2018. Act 154 of 2021 then exempted
  # it for calendar years 2020 and 2021, after which it is taxable again.
  2018-01-01:
    - irs_employment_income # Line 8
    - self_employment_income # Line 8
    - sstb_self_employment_income
    - interest_income # Line 10
    - dividend_income # Line 11
    - alimony_income # Line 12
    - ar_taxable_capital_gains_joint # Line 13
    - taxable_ira_distributions # Line 16
    - taxable_roth_conversions # Line 16
    - military_retirement_pay # Line 17
    - taxable_pension_income # Line 18
    - disability_benefits # Line 18b
    - rental_income # Line 19
    - farm_rent_income # Line 20
    - unemployment_compensation # Line 21
  2020-01-01:
    - irs_employment_income # Line 8
    - self_employment_income # Line 8
    - sstb_self_employment_income
    - interest_income # Line 10
    - dividend_income # Line 11
    - alimony_income # Line 12
    - ar_taxable_capital_gains_joint # Line 13
    - taxable_ira_distributions # Line 16
    - taxable_roth_conversions # Line 16
    - military_retirement_pay # Line 17
    - taxable_pension_income # Line 18
    - disability_benefits # Line 18b
    - rental_income # Line 19
    - farm_rent_income # Line 20
  2022-01-01:
    - irs_employment_income # Line 8
    - self_employment_income # Line 8
    - sstb_self_employment_income
    - interest_income # Line 10
    - dividend_income # Line 11
    - alimony_income # Line 12
    - ar_taxable_capital_gains_joint # Line 13
    - taxable_ira_distributions # Line 16
    - taxable_roth_conversions # Line 16
    - military_retirement_pay # Line 17
    - taxable_pension_income # Line 18
    - taxable_401k_distributions # Line 18
    - taxable_403b_distributions # Line 18
    - taxable_sep_distributions # Line 18
    - keogh_distributions # Line 18
    - disability_benefits # Line 18b
    - rental_income # Line 19
    - farm_rent_income # Line 20
    - unemployment_compensation # Line 21

