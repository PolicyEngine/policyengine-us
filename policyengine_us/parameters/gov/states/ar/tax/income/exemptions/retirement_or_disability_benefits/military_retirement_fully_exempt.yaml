description: Arkansas fully exempts military retirement pay from income tax if this is true; otherwise military retirement shares the retirement benefits exemption cap with employment-related pensions and IRA distributions.
values:
  2015-01-01: false
  # Act 141 of 2017 exempts military retirement from tax year 2018.
  2018-01-01: true
