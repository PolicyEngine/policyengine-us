description: Arkansas uses this index to adjust its income tax bracket boundaries for annual increases in the Consumer Price Index for All Urban Consumers, capped at three percent.
values:
  # 1 through 2025, so the tax year 2026 statutory tables are the base.
  # extend_ar_income_tax_uprating compounds each year's adjustment from 2026:
  # A.C.A. 26-51-201(a)(5) indexes the Act 1 of 2026 tables under (d), and
  # DFA indexed each newly enacted table in its first year (2022-2024 cards).
  2014-01-01: 1
metadata:
  unit: /1
  label: Arkansas income tax uprating index
  economy: false
  reference:
