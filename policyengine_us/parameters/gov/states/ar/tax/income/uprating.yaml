description: Arkansas tracks cumulative unrounded CPI-U adjustments in this index, with each annual increase capped at three percent. Bound metadata identifies the indexed parameters; the extension adjusts and rounds each preceding bound annually.
values:
  # PolicyEngine selects 2026 as the first adjustment year under candidate
  # us-ar:first-indexed-year-after-act-1-2026; (a)(5) and (d) name no first year.
  # DFA indexed each new table in its 2022-2024 cards, but lists unindexed
  # bounds in its January 2026 withholding formula, before August CPI.
  # We follow the cards' timing pending DFA's 2026 card. The index compounds
  # unrounded adjustments; each bound separately rounds every annual step.
  2014-01-01: 1
metadata:
