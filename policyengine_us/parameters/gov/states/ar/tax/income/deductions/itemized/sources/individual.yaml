description: Arkansas accounts for the following itemized deduction when married couples file separately on the same return.
values:
  2021-01-01:
    - ar_post_secondary_education_tuition_deduction
    - ar_medical_expense_deduction_indiv
    - ar_misc_deduction_indiv
    # Gambling losses are outside the 2% floor on miscellaneous deductions.
    - ar_gambling_loss_deduction
    - real_estate_taxes
    - charitable_deduction
    - interest_deduction
    - casualty_loss_deduction
