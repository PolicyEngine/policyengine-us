description: >-
  Arkansas excludes these federal interest components from itemized deductions
  under its fixed January 1, 2017, Internal Revenue Code conformity. Act 155 of
  2017 section 19 replaced the earlier January 1, 2015, conformity date, but
  section 25 applies the change retroactively from tax year 2015. Premiums
  therefore remain deductible for 2015 and 2016 under the federal extension
  enacted in P.L. 114-113, division Q, section 152.
values:
