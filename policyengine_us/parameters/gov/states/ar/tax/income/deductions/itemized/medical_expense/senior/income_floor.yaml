description: Arkansas deducts medical and dental expenses exceeding this share of Arkansas adjusted gross income when the filer or spouse is at or above the senior age threshold.
values:
  2011-01-01: 0.075
  # The adopted 26 U.S.C. § 213(f) senior rule covers only 2013 through 2016.
  2017-01-01: 0.1
