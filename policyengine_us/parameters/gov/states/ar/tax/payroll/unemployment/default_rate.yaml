description: Arkansas assigns this unemployment insurance tax rate, including the stabilization tax or administrative assessment, to each new employer.
values:
  # Arkansas Code Section 11-10-704 sets each employer's rate at 2.9% until it
  # has had three years in which its workers could have drawn benefits, and
  # Section 11-10-706 adds a stabilization tax that rises as the Unemployment
  # Compensation Fund's assets fall relative to total payrolls. The Division
  # of Workforce Services counts the two together as the total tax rate. The
  # stabilization tax came to 0.3% for 2018 and 2019.
  2018-01-01: 0.032
  # The stabilization tax came to 0.2% from 2020 through June 2023; Act 369 of
  # 2021 capped it at 0.2% for 2022.
  2020-01-01: 0.031
  # From July 1, 2023, Act 196 of 2023 replaced the stabilization tax with an
  # administrative assessment of 0.125% of taxable wages, through June 30,
  # 2024.
  2023-07-01: 0.03025
  # Act 196 cut the 2.9% rate to 1.9% from January 1, 2024.
  2024-01-01: 0.02025
  # The administrative assessment fell to 0.1% from July 1, 2024. From January
  # 1, 2026, Act 740 of 2025 sets the rate at 1.8% and the assessment at 0.2%,
  # the same 2.0% in all.
  2024-07-01: 0.02

