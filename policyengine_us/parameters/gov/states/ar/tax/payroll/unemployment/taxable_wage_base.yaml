description: Arkansas limits employer unemployment insurance taxes to this amount of each worker's annual wages.
values:
  # Act 734 of 2017 set the base at $10,000 from 2018. These are the bases
  # that the Division of Workforce Services and, for 2026, the Division of
  # Reemployment published.
  2018-01-01: 10_000
  # From 2020, Arkansas Code Section 11-10-215(a)(2)(A)(i)(d), which Act 512
  # of 2019 added, sets the base by the average insured unemployment rate for
  # the last state fiscal year: $7,000 at up to 1%, then $8,000, $9,000 and,
  # at 2.2% or more, $10,000. The base rises to $11,000 when the year's
  # disbursements from the trust fund exceed $200 million and the fund holds
  # less than $600 million, and to $12,000 when they exceed $250 million and
  # the fund holds less than $400 million.
  2020-01-01: 7_000
  # Act 368 of 2021 held the 2022 base to the lesser of the computed base and
  # $10,000.
  2021-01-01: 10_000
  # From 2024, Act 196 of 2023 sets the base at $7,000 whenever the trust fund
  # holds more than $600 million on June 30 of the last state fiscal year, and
  # limits each year's increase to $2,000.
  2023-01-01: 7_000

