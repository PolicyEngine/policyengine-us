description: Arkansas counts these unearned income sources under the Low Income Home Energy Assistance Program.
# Each source is floored at zero in the income formula, so a loss in one source
# cannot offset other income. The formula also counts Social Security and
# railroad retirement net of the Medicare Part B premium, interest above the
# monthly disregard, and TEA. Rental income is in the earned list.
# Where the plan and the FY2025 draft manual differ, the manual is followed.
# Counted loans, jury duty, royalties and foster care receipts lack
# sufficiently specific inputs and are not represented here.
values:
  2024-10-01:
    - unemployment_compensation
    - strike_benefits
    - ssi
    # Military retirement pay is a separate input from the pension inputs that
    # pension_income adds, so both are listed; a household reports the amount
    # in one or the other (manual Appendix F, page 141).
    - pension_income
    - military_retirement_pay
    # Non-Social-Security survivor receipts.
    - survivor_benefits
    - alimony_income
    - child_support_received
    - ordinary_dividend_income
    - veterans_benefits
    # Cash gifts from friends and relatives outside the household.
    - financial_assistance
    # Manual Appendices E (page 130) and F (page 144) and the application
    # (page 2) count workers' compensation; plan Section 1.9 leaves "Insurance
    # payments made directly to the insured" unchecked.
    - workers_compensation
    # Manual Appendix F (page 135) counts all gaming or gambling winnings; plan
    # Section 1.9 (page 7) counts lottery winnings as the only one-time lump sum.
    - gambling_winnings
    # Manual Appendix F (page 132) counts capital gains and excludes capital
    # losses; plan Section 1.9 has no capital gains item.
    - capital_gains

