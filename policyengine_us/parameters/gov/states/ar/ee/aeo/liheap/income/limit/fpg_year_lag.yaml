description: Arkansas uses the federal poverty guideline from this many years before the benefit year under the Low Income Home Energy Assistance Program.
# The FY2025, FY2026 and FY2027 published thresholds match the 2024, 2025 and
# 2026 federal poverty guidelines. Other years use their corresponding guideline year but
# are unverified.
values:
  2024-10-01: 1

metadata:
  unit: year
  period: year
  label: Arkansas LIHEAP federal poverty guideline year lag
  reference:
    - title: Arkansas FY2027 Income Eligibility Chart, poverty guideline rows reproduced by the 2026 federal poverty guidelines
      href: https://www.adeq.state.ar.us/energy/assistance/pdfs/liheap-income-eligibility-chart-fy-2027.pdf
    - title: Arkansas FY2026 Income Eligibility Chart, poverty guideline rows reproduced by the 2025 federal poverty guidelines
      href: https://www.adeq.state.ar.us/energy/assistance/pdfs/LIHEAP_Eligibility-Chart_2026.pdf
    - title: Arkansas FY2025 Income Eligibility Chart, poverty guideline rows reproduced by the 2024 federal poverty guidelines
      href: https://www.adeq.state.ar.us/energy/assistance/pdfs/LIHEAP_Eligibility-Chart_2025.pdf
