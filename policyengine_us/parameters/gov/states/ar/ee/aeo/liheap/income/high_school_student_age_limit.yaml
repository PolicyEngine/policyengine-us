description: Arkansas excludes the earned income of high school students who are this age or younger under the Low Income Home Energy Assistance Program.
# Section 4.7 excludes the earned income of household members "aged 18 and
# enrolled in an institution of secondary education (high school)" unless
# "working full time or the individual is emancipated and applying as the head
# of household"; those exceptions are not modeled. This exclusion applies
# whether or not the student is a dependent. Members younger than
# earned_minimum_age have all earnings excluded. The section 17.0 Full-time
# Student definition (page 141) also covers "High school students over age
# eighteen (18)" who are dependents of a household member, so their earnings
# are excluded through full_time_student_age_limit; a high school student older
# than this age who is not a dependent has earnings counted.
values:
  2024-10-01: 18

metadata:
  unit: year
  period: year
  label: Arkansas LIHEAP high school student earned income exclusion age limit
