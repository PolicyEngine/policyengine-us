      href: https://liheapch.acf.gov/docs/2026/state-plans/AR_Plan_2026.pdf#page=5
    - title: Arkansas LIHEAP Application, Section III Household Income
      href: https://www.adeq.state.ar.us/energy/assistance/pdfs/fillable_aeo-9495_liheap-long-application.pdf#page=2
