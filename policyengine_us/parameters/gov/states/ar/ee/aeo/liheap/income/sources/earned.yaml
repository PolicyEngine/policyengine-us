description: Arkansas counts these earned income sources under the Low Income Home Energy Assistance Program.
# Existing net business income approximates gross receipts; no additional
# business-expense deduction or new gross-receipts input is modeled.
# Active and passive partnership income cannot be separated by existing inputs.
values:
  2024-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
    # Manual Appendix F (page 141) treats rental property as a self-employment
    # enterprise, so rental income, including farm rent, takes the earned
    # disregard. Plan Section 1.8 (page 5) subtracts 20% from work income only
    # and Section 1.9 (page 6) lists rental income as its own item; the manual
    # is followed.
    - rental_income
    - farm_rent_income

