description: Arkansas excludes earnings of high school students of this age under the Low Income Home Energy Assistance Program.
# Manual Section 4.7 (page 41) excludes the earned income of members "aged 18
# and enrolled in an institution of secondary education (high school)" unless
# the member works full time or is emancipated and applying as the head of
# household. Neither exception is modeled: the manual sets no full-time hours
# threshold, and no input records emancipation.
values:
  2024-10-01: 18

metadata:
  unit: year
  period: year
  label: Arkansas LIHEAP high school student earnings exclusion age
  reference:
    - title: Arkansas LIHEAP draft manual FY2025, Section 4.7, Income verification
      href: https://liheapch.acf.gov/sites/default/files/webfiles/docs/2025/manuals/AR_Manual%5Bdraft%5D_2025.pdf#page=41
