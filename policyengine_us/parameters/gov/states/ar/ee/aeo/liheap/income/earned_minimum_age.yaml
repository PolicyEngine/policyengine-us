description: Arkansas excludes the earned income of household members younger than this age under the Low Income Home Energy Assistance Program.
# Application Section III (FY2025 form R 01/FY2025 and current form R 11/2025)
# requests work income only from members 18 and older, and the accepted plans
# leave a child's earnings unchecked. Full-time students of any age are
# excluded in the formula.
values:
  2024-10-01: 18

