description: Arkansas excludes the earned income of household members younger than this age under the Low Income Home Energy Assistance Program.
# Both application forms (AEO 9495 R 01/FY2025 and LIHEAP 9495 R 11/2025)
# request work income only from members "18 and older & not a full-time
# student", and the accepted plans leave a child's earnings unchecked. Manual
# Appendix F (page 158) excludes the earnings of a child "under eighteen (18)
# years of age and who is attending at least half time" a school or training
# program; the attendance condition is not applied, so every younger member's
# earnings are excluded. Students 18 and older are handled by
# full_time_student_age_limit and high_school_student_age_limit.
values:
  2024-10-01: 18

