description: Arkansas uses state median income for households up to this size under the Low Income Home Energy Assistance Program.
values:
  # FY2025 plan Section 2.1: sizes 1-6 use state median income, size 7 and up
  # use the HHS poverty guidelines.
  2024-10-01: 6
  # FY2026 plan Section 2.1: sizes 1-7 use state median income.
  2025-10-01: 7

