description: Arkansas uses this increment to round monthly income limits under the Low Income Home Energy Assistance Program.
# Half-up rounding of the monthly base limit reproduces every FY2025 through
# FY2027 row for sizes 1 to 20. This is a reconciled numerical pattern, not an
# express rounding instruction.
values:
  2024-10-01: 1

