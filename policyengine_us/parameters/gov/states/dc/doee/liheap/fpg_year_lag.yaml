description: The District of Columbia uses the poverty guidelines from this many years before the model year for the federal income floor under the Low Income Home Energy Assistance Program.
# HHS makes each January's guidelines mandatory for LIHEAP from the next
# October 1, so model period 2024 (FY2024) uses the 2023 guidelines and 2026
# (FY2026) the 2025 guidelines. The District's own limit uses state median
# income.
values:
  2021-10-01: 1
metadata:
  unit: year
  period: year
  label: DC LIHEAP poverty guideline year lag
