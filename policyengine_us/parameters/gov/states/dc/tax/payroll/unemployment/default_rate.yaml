description: The District of Columbia assigns this unemployment insurance contribution rate to each new employer.
values:
  # D.C. Code Section 51-103(c)(3)(A) assigns the greater of 2.7% and the
  # average rate on taxable wages for the 12 months ending June 30. The
  # Department of Employment Services gives that rule but no rate for 2018 and
  # 2019, so those two years rest on the U.S. Department of Labor's
  # Significant Provisions reports, which list 2.7%. PE-US leaves out the 0.2%
  # administrative funding assessment, which Section 51-103(m) keeps separate
  # from contributions.
  2018-01-01: 0.027

