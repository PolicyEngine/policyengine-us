description: The District of Columbia limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  # The Council set this $9,000 base for 1997 and every later year in D.C.
  # Code Section 51-103(e)(6), which D.C. Law 12-175 added in 1999.
  2018-01-01: 9_000

