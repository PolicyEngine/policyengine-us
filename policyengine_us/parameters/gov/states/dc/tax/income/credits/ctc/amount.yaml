    - title: D.C. Law 26-89, sections 2(j) and 6(b)
      href: https://code.dccouncil.gov/us/dc/council/laws/26-89
    - title: "DC Attorney General, February 24, 2026 #page 1-2"
      href: https://oag.dc.gov/sites/default/files/2026-02/AG-Opinion-Decoupling-Retroactivity-and-Validity-.pdf#page=1

values:
