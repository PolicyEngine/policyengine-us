values:
  2015-01-01: 0.4 # (f)(1)(A) and (f)(1)(B)
  2022-01-01: 0.7 # (f)(1)(B-1)
  # D.C. Act 26-214 § 2(i) (emergency, Dec. 3, 2025 to Mar. 3, 2026) and
  # D.C. Law 26-89 § 2(i) (temporary, Feb. 12 to Sep. 25, 2026) set (B-2) to
  # 100% for taxable years after 2024 and repealed (B-3).
  2025-01-01: 1
  # With the temporary law expired, the permanent (B-2) gives 85% for taxable
  # years beginning after December 31, 2024, and (B-3) gives 100% after
  # December 31, 2028.
  2026-01-01: 0.85 # (f)(1)(B-2)
  2029-01-01: 1 # (f)(1)(B-3)
