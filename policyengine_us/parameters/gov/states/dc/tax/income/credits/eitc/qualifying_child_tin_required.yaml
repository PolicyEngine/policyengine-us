description: The District of Columbia treats a filer whose qualifying children all lack a Social Security number or individual taxpayer identification number as a filer without a qualifying child under its earned income tax credit if this is true.
values:
  # Before 2023 a qualifying child without a Social Security number stays a
  # qualifying child (D.C. Code 47-1806.04(f)(4) and IRC 32(c)(3)(D)); the
  # 2021 and 2022 D-40 instructions add no identification test for children.
  2015-01-01: false
  # From 2023 the D-40 instructions for the (f)(1)(D)(ii) ITIN extension send
  # a filer whose children have neither number to the childless schedule.
  2023-01-01: true
metadata:
