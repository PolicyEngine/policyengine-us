description: The District of Columbia treats a filer whose qualifying children all lack a Social Security number or individual taxpayer identification number as a filer without a qualifying child under its earned income tax credit if this is true.
values:
  # From 2023 the D-40 Line 27a instructions require each qualifying child to
  # have a Social Security number or ITIN and send a filer whose children have
  # neither to the childless schedule. No DC source settles earlier years;
  # the 2021 and 2022 booklets' qualifying-child rules have no identification
  # test. Read alone, D.C. Code 47-1806.04(f)(4) and IRC 32(c)(3)(D) keep such
  # a child a qualifying child, which closes the (f)(1)(C) childless
  # schedule; setting this to false applies that reading. ARPA section 9622,
  # "Taxpayer eligible for childless earned income credit in case of
  # qualifying children who fail to meet certain identification
  # requirements", struck former IRC 32(c)(1)(F) from 2021, and the 2021
  # booklet's "New for 2021" note repeats it. PolicyEngine applies the
  # childless treatment in every year, so a child with neither number never
  # counts.
  2015-01-01: true
