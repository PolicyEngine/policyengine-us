description: The District of Columbia allows these federal deductions as additional deductions from gross income in computing net income.
values:
  # D.C. Code 47-1803.04(d)(6) to (9) deny all four for taxable years
  # beginning before January 1, 2026.
  2021-01-01: []
  # D.C. Code 47-1803.04(e)(3) to (6) allow each "for taxable years beginning
  # after December 31, 2025", to any individual, whether the filer takes the
  # standard deduction or itemizes.
  2026-01-01:
    - tip_income_deduction
    - overtime_income_deduction
    - auto_loan_interest_deduction
    - additional_senior_deduction
  # (e)(5) and (e)(6) allow only the deduction "allowed under" IRC 163(h)(4)
  # and 151(d)(5)(C), and those sections allow none for taxable years
  # beginning after December 31, 2028. The federal variables carry no date gate of their own,
  # so the list drops them here, as the federal lists do. The tips and
  # overtime deductions stay listed: their in_effect parameters zero them
  # from 2029.
  2029-01-01:
    - tip_income_deduction
    - overtime_income_deduction
metadata:
  unit: list
  period: year
  label: DC additional deductions from federal Schedule 1-A
  reference:
