description: The District of Columbia counts these income sources as countable income under the Child Care Subsidy Program.
values:
  2020-01-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - dividend_income
    - interest_income 
    - rental_income
    - pension_income
    # OSSE counts railroad retirement under Manual 2.5.2 and exempts
    # permanent disability payments under 2.5.3.
    - dc_ccsp_countable_railroad_benefits
    - veterans_benefits
    - military_retirement_income
    - alimony_income
    # The following are exempted income
    # DC_TANF, SNAP, WIC, DC_LIHEAP, CHIP
    # social_security, ssi
    # disability_benefits
    # unemployment_compensation
    # child_support_received
    # eitc
    # capital_gains


metadata:
  unit: list
  period: year
  label: DC CCSP countable income sources
  reference:
    - title: "DC Child Care Subsidy Program Policy Manual, Sections 2.5.2-2.5.3 #page 13"
      href: https://osse.dc.gov/sites/default/files/dc/sites/osse/publication/attachments/DC%20Child%20Care%20Subsidy%20Program%20Policy%20Manual.pdf#page=13
