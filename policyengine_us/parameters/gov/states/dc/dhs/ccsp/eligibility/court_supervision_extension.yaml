description: The District of Columbia extends Child Care Subsidy Program age eligibility to children under court supervision up to the disabled child age threshold if this is true.
values:
  # The FFY 2019-2021 and FFY 2022-2024 plans answer No to the 45 CFR
  # 98.20(a)(1)(ii) court-supervision option; the FFY 2025-2027 plan elects it
  # with an upper age of 18 (under 19).
  2018-10-01: false
  2024-10-01: true

