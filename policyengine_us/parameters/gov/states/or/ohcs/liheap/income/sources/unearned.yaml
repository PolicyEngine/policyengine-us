description: Oregon counts these person-level unearned income sources under the Low Income Home Energy Assistance Program.
# Person-level sources, each floored at zero per member. TANF, a unit-level
# amount, is added in the formula.
values:
  2024-10-01:
  - rental_income
  - farm_rent_income
  - social_security
  - railroad_benefits
  - ssi
  - unemployment_compensation
  - workers_compensation
  - veterans_benefits
  - pension_income
  # Retirement pay counts as a pension. military_retirement_pay includes
  # survivor payments, so report a survivor annuity in only one of the two.
  - military_retirement_pay
  - survivor_benefits
  - disability_benefits
  - alimony_income
  - child_support_received
  - ordinary_dividend_income
  - strike_benefits
  - general_assistance
  - estate_income
metadata:
  unit: list
  period: year
  label: Oregon LIHEAP unearned income sources
