description: Oregon pays a nursing facility resident the difference between countable income and this amount under the State Supplemental Payment program.
values:
  # NOTE: 461-155-0250(4)(c) prints $79.07, while (4)(b) (effective 1-01-26)
  # and transmittal OEP-PT-25-045 (effective 1/1/2026) raise the personal
  # incidentals allowance to $81.28. Every version with subsection (c), from
  # 7-01-14 to 1-01-25, used one figure in (b) and (c). The model follows the
  # text of (4)(c).
  2026-01-01: 79.07

metadata:
