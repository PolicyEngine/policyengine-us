description: Oregon reduces the federal income tax liability it subtracts by these federal refundable credits.
values:
  # Federal tax worksheet, Part A, of each year's Publication OR-17. The earned
  # income credit is never listed (ORS 316.685(1)(b)), and outside 2021 neither
  # is the additional child tax credit.
  2017-01-01:
    - refundable_american_opportunity_credit # Line 6
    - assigned_aca_ptc # Line 7 (Form 8962, line 24)
  2020-01-01:
    - refundable_american_opportunity_credit # Line 6
    - assigned_aca_ptc # Line 7 (Form 8962, line 24)
    - recovery_rebate_credit # Line 8, with the stimulus payments received
  2021-01-01:
    # Line 8 is the child tax credit on Schedule 8812, line 14e. Line 2 adds
    # back the nonrefundable part that line 1 already nets out.
    - refundable_ctc
    - refundable_american_opportunity_credit # Line 9
    - recovery_rebate_credit # Line 10, with the stimulus payments received
    - assigned_aca_ptc # Line 11 (Form 8962, line 24)
    - cdcc # Line 12 (Schedule 3, line 13g)
  2022-01-01:
    - refundable_american_opportunity_credit # Line 6
    - assigned_aca_ptc # Line 7 (Form 8962, line 24)
    # From 2025, line 7 is the refundable adoption credit (Form 1040, line 30),
    # which is not modeled, and the premium tax credit moves to line 8.
