description: Oregon counts these household income additions for the retirement income credit when they are recorded on a dependent, because the taxpayer receives them.
values:
  2018-01-01:
    # ORS 316.157(2)(c)(A)(ii): "Child support received by the taxpayer."
    # Support paid to the custodial parent for a child may be recorded on the
    # child.
    - child_support_received
