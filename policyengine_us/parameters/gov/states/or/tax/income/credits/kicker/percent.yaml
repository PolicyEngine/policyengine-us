description: Oregon returns this portion of the filer's prior-year tax liability before credits via its kicker credit.
values:
  # Even year, no kicker; the zero also stops the first rate from applying
  # backward to earlier years, which are not modeled.
  2018-01-01: 0
  2019-01-01: 0.17171
  2020-01-01: 0
  2021-01-01: 0.17341
  2022-01-01: 0
  2023-01-01: 0.4428
  2024-01-01: 0
  2025-01-01: 0.09863
  # Even year, and no later kicker has been certified; without this zero the
  # 2025 rate would carry forward into every later year.
  2026-01-01: 0
metadata:
  unit: /1
  period: year  
  label: Oregon kicker rate
  reference:
