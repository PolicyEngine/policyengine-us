description: Oregon adds these amounts excluded from adjusted gross income to qualifying income for its Kids Credit.
values:
  2023-01-01: []
  # Oregon Laws 2025, chapter 321, section 16 adds ORS 315.273(1)(c)(A)(ii):
  # "Foreign earned income, as defined in section 911 of the Internal Revenue
  # Code, that is excluded from adjusted gross income." Section 17(2) applies
  # it to tax years beginning on or after January 1, 2025.
  2025-01-01:
    - section_911_excluded_income
