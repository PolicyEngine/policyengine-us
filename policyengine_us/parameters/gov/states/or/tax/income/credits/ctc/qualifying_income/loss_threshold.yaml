description: Oregon adds the losses of a filer exceeding this amount back to qualifying income for its Kids Credit.
values:
  # ORS 315.273(5) adjusts only the credit amount and the phase-out start in
  # subsections (3) and (4) for inflation, so this amount is fixed.
  2023-01-01: 20_000
