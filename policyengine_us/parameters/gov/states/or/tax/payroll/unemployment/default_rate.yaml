description: Oregon assigns this unemployment insurance tax rate, set by the tax schedule in effect for the year, to each new employer.
values:
  2018-01-01: 0.024
  2020-01-01: 0.021
  2021-01-01: 0.026
  2022-01-01: 0.024
  2023-01-01: 0.021
  2024-01-01: 0.024

