description: Wyoming limits countable income to this share of the federal poverty guideline for continued assistance under the Child Care, Purchase of Service program.
# A unit already receiving assistance may continue through Sliding Fee Scale
# Steps 5-6 (the transitional/graduated phaseout, Step 6 = 225% of the federal
# poverty guideline). Rules §8(e)(i)(N)(II) conditions this on gross income
# having "increased due to employment"; Manual §1201.B carries no such
# condition, requiring only that countable income stay within Step 6 with no
# 30-or-more-day break in aid. Proxied by the wy_ccap_enrolled input, which
# tracks neither the cause of the increase nor the break in aid; first-time
# applicants use the initial Step 4 share (see initial.yaml).
values:
  2024-04-01: 2.25

