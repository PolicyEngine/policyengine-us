description: Wyoming caps the total family copayment at this share of gross family income under the Child Care, Purchase of Service program.
# CCDF Plan §3.1.1: no family is charged more than 7% of gross income
# "regardless of the number of children", which is why the cap binds on the
# family total rather than per child; §3.2.1.a.i sets the fee per child up to a
# family maximum. Wyoming adopts the federal ceiling at 45 CFR 98.45(l)(3)
# unchanged.
values:
  2024-04-01: 0.07

metadata:
  unit: /1
  period: year
  label: Wyoming CCAP family copayment cap rate
  reference:
    - title: Wyoming CCDF State Plan FFY 2025-2027 §3.1.1 - family copayment does not exceed 7% of gross family income (PDF p. 34); §3.2.1 - the fee is per child up to a maximum per family (PDF p. 36)
      href: https://drive.google.com/file/d/10TJ3S8d_nwyNxdkkbyk2gzCfHTk7CTcA/view#page=34
