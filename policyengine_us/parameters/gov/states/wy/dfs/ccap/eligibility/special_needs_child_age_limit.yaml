description: Wyoming limits eligibility to children with special needs or under court supervision below this age under the Child Care, Purchase of Service program.
# Rules §8(e)(i)(A) extends eligibility past 13 for special needs or court
# supervision but states no upper age. The 18 is Wyoming's elected ceiling in
# CCDF Plan §2.2.1.b.i and §2.2.1.c, where §2.2.1.b.ii reads "less than 18
# years old", so the limit is exclusive; federal law allows up to under 19
# (45 CFR 98.20(a)(1)(ii)). Physician verification is not modeled.
values:
  2024-04-01: 18

