description: Wyoming excludes veterans disability benefits up to this share of the federal poverty guideline under the Low Income Energy Assistance Program.
# Approved assumptions: one household-size exclusion per SPM unit and
# total veterans_benefits as the proxy for service-connected disability income.
# The rule does not settle multiple recipients, and the proxy can exclude
# other VA benefits that the service-connected rule does not cover.
values:
  2025-10-01: 1

metadata:
  unit: /1
  period: year
  label: Wyoming LIEAP veterans income exclusion rate
  reference:
    - title: "LIEAP Rules, Chapter 1, section 8(a)(ii)(S)"
      href: https://rules.wyo.gov/Search.aspx?mode=7
