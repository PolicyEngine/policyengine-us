description: Wyoming uses the federal poverty guideline from this many years before the modeled fiscal year for the veterans exclusion and the federal income floor under the Low Income Energy Assistance Program.
# Annual FY2026 represents the season starting in October 2025; use the
# guideline at season start. Earlier and later policy remains unverified.
values:
  2025-10-01: 1

