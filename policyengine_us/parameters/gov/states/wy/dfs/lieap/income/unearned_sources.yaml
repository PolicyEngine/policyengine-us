description: Wyoming counts these nonnegative unearned income sources before separate Social Security, interest, gifts and veterans adjustments under the Low Income Energy Assistance Program.
values:
  2025-10-01:
    - ssi
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - railroad_benefits
    - survivor_benefits
    - total_unemployment_compensation
    - workers_compensation
    - disability_benefits
    - general_assistance
    - alimony_income
    - rental_income
    - farm_rent_income
    - estate_income
    - ordinary_dividend_income

# TANF and child support received are excluded under the FY2026 plan.
# Adopted section 8(a)(ii)(L) excludes lump sums despite the plan's checked
# lump-sum box. Refunds, tax credits, balances and settlements are not added.
# Generic annual sources (including retirement and Social Security) cannot
# identify embedded lump sums or exempt reimbursements. Supply adjusted
# countable income directly for those cases. No new subtype input is added.
# Regular disability/worker/survivor income approximates nonexempt receipts;
# pension_income already includes annuities. No duplicate pension components.
# military_retirement_income adds retirement pay and survivor annuities.
# Social Security is counted in the formula, net of the Medicare Part B
# premium deducted from it (rules 8(a)(ii)(U)).
# Contract payments and royalties lack dedicated inputs and are not imputed.
