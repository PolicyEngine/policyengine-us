description: Wyoming counts earnings from people at or above this age under the Low Income Energy Assistance Program.
# Approved convention follows the plan's unchecked under-18 earnings category.
# The adopted rule excludes only under-14 earnings or under-18 student earnings.
values:
  2025-10-01: 18

