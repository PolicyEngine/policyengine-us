description: Wyoming counts earnings from people at or above this age under the Low Income Energy Assistance Program.
# Follows FY2026 plan section 1.9, which leaves the earned income of a child
# under 18 unchecked; rule 8(a)(ii)(A) exempts only the earnings of a child
# under 14 or of a full-time student under 18.
values:
  2025-10-01: 18

metadata:
  unit: year
  period: year
  label: Wyoming LIEAP minimum age for countable earnings
