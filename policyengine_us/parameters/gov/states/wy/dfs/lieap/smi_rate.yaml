description: Wyoming uses this share of state median income for its ordinary income limit under the Low Income Energy Assistance Program.
# The FY2026 plan uses 60% SMI. Current Title 42 retains its eligibility
# guarantee at the lesser of 215% FPG or 60% SMI and permits federal-compliance
# modifications. Federal 110% FPG income protection is applied separately.
values:
  2025-10-01: 0.6

