description: Wyoming uses this share of state median income for its ordinary income limit under the Low Income Energy Assistance Program.
# The FY2026 plan uses 60% SMI for every household size. W.S. 42-2-501(c)
# requires eligibility up to the lesser of 215% FPG or 60% of state median
# household income, read here as a coverage minimum that a 60% SMI limit
# always meets. 2017 SF0063 replaced "greater" with "lesser" after a 2016 DFS
# request to drop the 215% clause; rules 3(oo) and 7(a)(ii) date from the
# earlier "greater of" text. Federal 110% FPG income protection is applied
# separately.
values:
  2025-10-01: 0.6

