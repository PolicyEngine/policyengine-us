description: Wyoming applies these modeled entitlement fractions by household income relative to the income limit under the Low Income Energy Assistance Program.
# Table 1 prints rows "0 - .20", ".21- .25", ... ".86 - .99" and "1.00 +".
# Each threshold is the printed start of its row, so a ratio exactly at a
# start takes that row's fraction and a ratio of 1.00 or more takes zero.
# A ratio between printed rows takes the earlier row (.205 takes the
# "0 - .20" fraction), as if truncated to two decimals; the matrix gives no
# rounding instruction.
# The formula compares equivalent income ceilings at the precision of stored
# monetary inputs.
