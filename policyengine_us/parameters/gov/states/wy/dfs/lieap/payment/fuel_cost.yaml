description: Wyoming uses these seasonal primary fuel cost standards under the Low Income Energy Assistance Program.
# Exact source cells retain electricity and natural-gas decimals.
# KEROSENE takes the heating oil standard: rule 3(hh) lists diesel and oil
# fuel types, the oil worksheet is "Diesel Heating Oil", and heating_expense
# reads a kerosene bill as fuel_oil_expense.
# SOLAR takes the electricity standard because heating_expense reads a solar
# home's bill as its grid electricity bill.
# OTHER takes the wood standard as the closest published worksheet. DFS pays
# unregulated and other fuel types (plan section 2.3; DFS LIEAP page) but
# publishes standards only for the six worksheets.
UNSPECIFIED:
  2025-10-01: 0
ELECTRICITY:
  2025-10-01: 1_712.997
NATURAL_GAS:
  2025-10-01: 1_550.85
FUEL_OIL:
  2025-10-01: 2_640
KEROSENE:
  2025-10-01: 2_640
PROPANE:
  2025-10-01: 1_300
WOOD:
  2025-10-01: 1_225
COAL:
  2025-10-01: 525
SOLAR:
  2025-10-01: 1_712.997
OTHER:
  2025-10-01: 1_225
NONE:
  2025-10-01: 0

