description: Indiana counts these available income sources for adults who are not exempt students under the Energy Assistance Program; Social Security and SSI are handled separately because benefits paid for children also count.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - unemployment_compensation
    - pension_income
    - retirement_distributions
    - railroad_benefits
    - alimony_income
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - financial_assistance
    - dividend_income
    - interest_income
    - rental_income
    - gambling_winnings
metadata:
  unit: list
  label: Indiana EAP adult income sources
  reference:
    - title: Indiana PY2026 EAP Intake and Operations Manual, Sections 6.1 and 6.2
