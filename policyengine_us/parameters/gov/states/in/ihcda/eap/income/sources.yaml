description: Indiana uses these income sources to compute countable income for adult members who are not exempt students under the Energy Assistance Program.
# Social Security and SSI are not listed here. The income variable adds them
# separately because benefits paid for children also count.
values:
  2025-10-01:
    - employment_income
    # Section 6.1 (pages 51-52) asks for gross business, farm and rental income before
    # expenses. The business, farm and rental inputs below are net amounts, so
    # countable income is understated for those households.
    - self_employment_income
    - sstb_self_employment_income
    # Section 6.1 defines self-employment to include farming (Schedule F) and lists
    # the Schedule E partnership and S corporation, estate and trust, and farm
    # rental lines.
    - farm_operations_income
    - partnership_s_corp_income
    - estate_income
    - farm_rent_income
    - unemployment_compensation
    - strike_benefits
    - pension_income
    # Section 6.1 (pages 54-55) and Section 6.2 (page 59) exclude lump-sum retirement
    # payments of the employee's contributions and interest, and withdrawals of
    # principal. This input cannot separate them from recurring payments, so every
    # distribution counts and income is overstated for those households.
    - retirement_distributions
    # Section 6.1 (pages 53-54) counts regular life insurance payments to a survivor,
    # Black Lung benefits awarded to a survivor, and retirement funds paid to a
    # surviving spouse or child. Social Security survivor benefits are added with
    # Social Security, not here.
    - survivor_benefits
    - railroad_benefits
    - alimony_income
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - financial_assistance
    - ordinary_dividend_income
    - interest_income
    - rental_income
    - gambling_winnings
metadata:
  unit: list
  period: year
  label: Indiana EAP adult income sources
