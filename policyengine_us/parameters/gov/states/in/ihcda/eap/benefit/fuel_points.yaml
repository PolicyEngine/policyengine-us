description: Indiana provides these regular heating points by primary fuel under the Energy Assistance Program.
UNSPECIFIED:
  2025-10-01: 0
# The PY2024-25 matrix awarded zero points for natural gas and electric heat.
ELECTRICITY:
  2024-10-01: 0
  2025-10-01: 1
NATURAL_GAS:
  2024-10-01: 0
  2025-10-01: 1
FUEL_OIL:
  2025-10-01: 6
# Section 1.1 bars EAP funds for kerosene, and Section 8.5 does not list it as a
# bulk fuel, so a kerosene-primary household receives the electric allowance only.
KEROSENE:
  2025-10-01: 0
PROPANE:
  2025-10-01: 6
WOOD:
  2025-10-01: 6
COAL:
  2025-10-01: 6
# Assumption: neither the manual nor the matrix lists solar heat, so it is given
# no fuel points.
SOLAR:
  2025-10-01: 0
# Assumption: Section 8.5 has no zero-point fuel outside rent. The remaining named
# fuels (wood pellets, corn and biofuels) are bulk fuels that the heating type
# input cannot separate within OTHER, so OTHER receives the bulk-fuel points.
OTHER:
  2025-10-01: 6
NONE:
  2025-10-01: 0
