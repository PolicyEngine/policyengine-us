# Section 1.1 bars EAP funds for kerosene, and Section 8.5 does not list it as a
# bulk fuel, so a kerosene-primary household receives the electric allowance only.
KEROSENE:
  2025-10-01: 0
PROPANE:
  2025-10-01: 6
WOOD:
  2025-10-01: 6
COAL:
  2025-10-01: 6
SOLAR:
  2025-10-01: 0
# Section 8.5 has no zero-point fuel outside rent. The remaining named fuels (wood
# pellets, corn and biofuels) are bulk fuels that the heating type input cannot
# separate within OTHER, so OTHER receives the bulk-fuel points.
OTHER:
  2025-10-01: 6
NONE:
  2025-10-01: 0
