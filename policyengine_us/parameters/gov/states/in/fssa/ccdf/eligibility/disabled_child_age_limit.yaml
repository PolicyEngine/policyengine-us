description: Indiana limits eligibility to children with special needs or court-ordered supervision below this age under the Child Care and Development Fund program.
# Section 1.6: a child over 13 with documented special needs or court-ordered
# supervision who is under 18 at application or reapplication may participate
# until the Sunday following their 19th birthday. The application-age test and
# the Sunday grace are approximated with an annual under-19 ceiling.
values:
  2024-10-14: 19

metadata:
  unit: year
  period: year
  label: Indiana CCDF special needs or court supervision child age limit
  reference:
