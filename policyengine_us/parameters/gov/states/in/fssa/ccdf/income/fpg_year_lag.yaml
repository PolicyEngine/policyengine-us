description: Indiana uses the federal poverty guideline from this many years before the current date under the Child Care and Development Fund program.
# Indiana moves to a new year's guideline when FSSA posts that year's income eligibility
# and fee schedule, and the old guideline holds until then. Each schedule prints its
# effective date:
# - March 12, 2023: 127% of the 2023 guideline ($2,631 a month for three).
# - March 31, 2024: 150% of the 2024 guideline ($3,228 for three).
# - March 23, 2025: 150% of the 2025 guideline ($3,331 for three).
# - April 5, 2026: 135% of the 2026 guideline ($3,074 for three).
# Before March 12, 2023 the model reads the 2022 guideline, and before 2023 the current
# year's, since no earlier dated schedule is available. From 2027 a lag of 1 extrapolates:
# the model keeps the prior year's guideline because no 2027 schedule exists yet.
values:
  2015-01-01: 0
  2023-01-01: 1
  2023-03-12: 0
  2024-01-01: 1
  2024-03-31: 0
  2025-01-01: 1
  2025-03-23: 0
  2026-01-01: 1
  2026-04-05: 0
  2027-01-01: 1

metadata:
