description: Indiana uses the federal poverty guideline from this many years before the current date under the Child Care and Development Fund program.
# Indiana moves to a new year's guideline when it posts a new eligibility package,
# months into that year, and the old guideline holds until then:
# - March 31, 2024: the state plan prints 150% limits on the 2024 guideline ($3,228 for three).
# - May 1, 2025: FSSA's 2025 sliding fee schedule carries that date in its file name
#   (CCDFSlidingFeeSchedule_w-Copays_2025_050125.pdf).
# - April 5, 2026: FSSA's chart prints 135% of the 2026 guideline ($3,074 for three).
# So a family of three faces 150% of the 2025 guideline ($3,331) through April 4, 2026.
values:
  2015-01-01: 0
  2024-01-01: 1
  2024-03-31: 0
  2025-01-01: 1
  2025-05-01: 0
  2026-01-01: 1
  2026-04-05: 0
  2027-01-01: 1

