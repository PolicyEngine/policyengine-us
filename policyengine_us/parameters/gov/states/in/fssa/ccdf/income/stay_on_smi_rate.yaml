description: Indiana limits income to this share of the state median income under the Child Care and Development Fund program.
# Enrolled families stay eligible up to this share. New applicants face the lower of
# this share and the get-on share of the guideline; on the April 5, 2026 schedule this
# share binds from 19 people ($13,028 a month). Each schedule rounds this limit up to
# the next dollar.
values:
  2023-08-01: 0.85

