description: Indiana applies its static-conformity-to-Internal-Revenue-Code branch for the Earned Income Tax Credit if this indicator is true. The branch refers to Section 32 as in effect on January 1, 2023 (IC 6-3.1-21-6(a)), whose amounts are indexed to the taxable year.

values:
  2010-01-01: false
  2023-01-01: true

