description: Nebraska permits this monthly summer activity fee per approved child under the Child Care Subsidy program.
# The flat $50 monthly fee took effect with the July 2023 rate restructure and
# carried unchanged into the 2025-2027 schedule. Before July 2023 the activity
# fee varied by provider type ($25/month centers, $5/month homes); that
# structure is not modeled, so pre-2023 periods pay no activity fee.
values:
  2000-01-01: 0
  2023-07-01: 50

