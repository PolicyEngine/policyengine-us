description: Nebraska applies updated federal poverty guideline standards to the Child Care Subsidy program from this month of each year.
# Neb. Rev. Stat. § 68-1206(3) places the subsidy rate schedule on an annual
# October 1 cycle, and the DHHS guidance publishes the income standards
# "[b]eginning October 1st, 2023". Later-year standards tables corroborating a
# recurring October refresh have not been located; revisit if DHHS publishes an
# off-cycle table.
values:
  2000-01-01: 10

metadata:
  unit: /1
  period: year
  label: Nebraska Child Care Subsidy FPG update month
  reference:
