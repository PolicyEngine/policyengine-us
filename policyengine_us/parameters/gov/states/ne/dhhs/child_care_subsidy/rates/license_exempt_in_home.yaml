description: Nebraska sets this maximum hourly rate for license-exempt in-home providers under the Child Care Subsidy program.
# The in-home hourly rate is pegged to the Nebraska minimum wage (FFY 2025-2027
# CCDF State Plan § 4.3.1), which Initiative 433 (2022) stepped to $10.50
# (2023), $12.00 (2024), $13.50 (2025), and $15.00 (2026); LB258 (2025)
# replaces CPI indexing with 1.75% annual increases from 2027 — encode each
# year's wage when it takes effect. The DHHS rate sheet still prints $13.50
# as of its 2026-07-31 refresh; the statutory wage controls the peg.
values:
  2000-01-01: 0
  2023-01-01: 10.5
  2024-01-01: 12
  2025-01-01: 13.5
  2026-01-01: 15

metadata:
