description: Nebraska assigns this combined tax rate to each new employer outside the construction industry.
values:
  # The Department of Labor's live combined tax rate table lists 1.39% for new
  # employers in 2022, but its fiscal year 2021-2022 annual report lists
  # 1.25%, the statutory floor, which applies because the 2022 average
  # combined tax rate came to 0.49%.
  2018-01-01: 0.0125

metadata:
  period: year
  unit: /1
  label: Nebraska default unemployment tax rate
  reference:
