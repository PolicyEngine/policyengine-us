description: Alabama sets this seasonally-adjusted statewide average unemployment rate under the Unemployment Compensation program.
# The statutory measure (§ 25-4-74(d)) is the seasonally-adjusted statewide
# average unemployment rate for the three months of the most recently completed
# calendar quarter ending before the benefit year; this parameter approximates it
# with the benefit year's January value. Values past the end of the FRED series
# are carried forward by PolicyEngine.

