description: Alabama counts these expenses toward the miscellaneous itemized deduction, which applies only above a percentage of Alabama adjusted gross income.
values:
  2017-01-01:
    # Section (a)(1): unreimbursed employee business expenses.
    - unreimbursed_business_employee_expenses
    # Section (a)(14): expenses in connection with the determination, collection, or refund of any tax (26 U.S.C. 212(3)).
    - tax_preparation_fees
