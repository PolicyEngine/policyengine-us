description: Alabama counts these income sources for the state gross income.
values:
  2021-01-01:
    - irs_employment_income
    - self_employment_income
    - sstb_self_employment_income
    - interest_income
    - dividend_income
    - alimony_income
    - taxable_ira_distributions
    - taxable_401k_distributions
    - taxable_sep_distributions
    - taxable_403b_distributions
    - keogh_distributions # Keogh plans don't have a Roth option.
    - taxable_roth_conversions
    - pension_income
    - rental_income
    - capital_gains
    - partnership_s_corp_income
    - farm_operations_income
    - farm_rent_income
    # Form 40, Part I, line 5: rents, royalties, partnerships, S corporations,
    # trusts and estates. Estate and trust losses do not pass through.
    - al_estate_and_trust_income

