description: Alabama provides this amount as an Infrastructure Investment and Jobs Act supplement with each regular heating or cooling assistance award under the Low Income Home Energy Assistance Program.
# Award 2601ALLIEI funds the FY2026 supplement: $1,248,405 (November 26, 2025) plus
# $111,300 (August 13, 2026), or $1,359,705, roughly 13,600 supplements across heating
# and cooling. The plan pays it "if funding is available"; the model assumes the award
# does not run out, so population totals overstate funded supplements.
values:
  2025-10-01: 100
  # The draft and accepted FY2027 plans (sections 2.5 and 3.5) omit the supplement;
  # IIJA's last tranche was FY2026, although award 2601ALLIEI runs to September 30, 2027.
  2026-10-01: 0
