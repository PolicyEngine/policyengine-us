description: Alabama counts these earned income sources for adult household members under the Low Income Home Energy Assistance Program.
# Existing net business inputs approximate net farm and nonfarm income without
# a separate LIHEAP expense deduction. The formula floors each source at zero.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
metadata:
  unit: list
  period: year
  label: Alabama LIHEAP earned income sources
