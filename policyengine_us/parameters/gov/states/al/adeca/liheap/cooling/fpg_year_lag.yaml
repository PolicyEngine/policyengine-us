description: Alabama uses federal poverty guidelines from this many years before the benefit year for regular cooling assistance under the Low Income Home Energy Assistance Program.
# The May-September cooling season runs on the chart ADECA updates to the
# calendar year's guidelines (May 15, 2026 for summer 2026). The model applies
# that chart to the whole season, including May 1-14 applications.
values:
  2025-10-01: 0
