description: Florida uses state median income limits truncated to whole dollars, as in the federal table, rather than rounded half up when this is true under the Low Income Home Energy Assistance Program.
# Neither matrix states a rounding rule; the pattern is inferred from the
# printed amounts. FY2025 rounds 60% of state median income for each size to
# the nearest dollar (one person: $98,038 x 60% x 52% = $30,587.856, printed
# $30,588, where the federal FY2025 table prints $30,587). FY2026 reprints the
# federal FY2026 table, which truncates 60% of the four-person amount and then
# each size ($32,155 for one person).
values:
  2024-10-01: false
  2025-10-01: true
