description: Florida waives the LIHEAP income test for households receiving a positive amount from any of these programs.
values:
  # The FY2025 plan also lists means-tested veterans programs, which no
  # existing input identifies.
  2024-10-01:
    # Each entry is take-up gated, so it reflects receipt rather than
    # entitlement; tanf includes Florida Temporary Cash Assistance (fl_tca).
    - snap
    - tanf
    - ssi
