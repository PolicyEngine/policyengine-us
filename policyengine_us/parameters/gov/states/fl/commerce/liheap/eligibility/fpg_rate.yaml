description: Florida sets the alternative heating income limit to this percentage of the federal poverty guidelines under the Low Income Home Energy Assistance Program.
# The heating maximum income value is the greater of the state median income
# limit and this share of the poverty guidelines. In FY2025 this gives 60% of
# state median income for sizes 1-8 and 150% of the guidelines for sizes 9 and
# above. FY2026 uses 60% of state median income for every size, so the
# poverty-guideline alternative is zero.
values:
  2024-10-01: 1.5
  2025-10-01: 0
