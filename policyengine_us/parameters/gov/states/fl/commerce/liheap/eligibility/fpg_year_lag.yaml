description: Florida uses the federal poverty guidelines from this number of years before the heating year under the Low Income Home Energy Assistance Program.
# The FY2025 matrix uses the 2024 guidelines published on January 17, 2024.
# HHS makes each January's guidelines mandatory for LIHEAP from the next
# October 1, so model period 2025 (FY2025) uses the 2024 guidelines, 2026
# (FY2026) the 2025 guidelines and 2027 the 2026 guidelines. The same lag sets
# the guideline year of the federal 110% floor.
values:
  2024-10-01: 1
metadata:
  unit: year
  period: year
  label: Florida LIHEAP federal poverty guideline year lag
  reference:
    - title: Florida FY2025 LIHEAP Payment Matrix, guideline footnote
      href: https://liheapch.acf.gov/docs/2025/benefits-matricies/FL_BenefitMatrix_2025.pdf
    - title: LIHEAP IM 2024-02, Attachment 2, poverty guidelines for mandatory use in FY25
      href: https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM%202024-02_Att2FPGTables_States.pdf#page=1
    - title: LIHEAP IM 2025-02, Attachment 2, poverty guidelines for mandatory use in FY26
      href: https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM2025-02_FPGSte-Table_Att2.pdf#page=1
