description: Florida uses this threshold as the age at which nonstudents' income counts under the Low Income Home Energy Assistance Program.
# Follows manual 1200.01D for earned and unearned income; plan item 1.9 leaves
# under-18 earnings unchecked (see fl_liheap_countable_income).
values:
  2024-10-01: 16
metadata:
  unit: year
  period: year
  label: Florida LIHEAP nonstudent income minimum age
  reference:
