description: Florida uses this threshold as the age at which all members' income counts under the Low Income Home Energy Assistance Program.
# The statewide application and portal FAQ exclude all minors' income.
# The March 2025 application metadata does not establish a policy-change date;
# FY2025 uses this current rule as a backfilled assumption.
values:
  2024-10-01: 18
metadata:
  unit: year
  period: year
  label: Florida LIHEAP adult income age
  reference:
    - title: Florida FY2026 LIHEAP State Plan, section 1.9
      href: https://liheapch.acf.gov/docs/2026/state-plans/FL_Plan_2026.pdf#page=6
    - title: Florida statewide LIHEAP application, Monthly Household Income
      href: https://storage.googleapis.com/florida-liheap-relief-static-assets/Florida_LIHEAP_Application_English.pdf#page=1
    - title: Florida statewide LIHEAP portal, What qualifies as income
      href: https://floridaliheap.com/faq
    - title: Florida FY2025 LIHEAP State Plan, Section 1.9
      href: https://liheapch.acf.gov/docs/2025/state-plans/FL_Plan_2025.pdf#page=6
