description: Florida provides this base regular heating payment by income band under the Low Income Home Energy Assistance Program.
# Source conflict: FY2026 plan item 2.6 (page 9) prints an estimated $400
# minimum and $1,350 maximum, the FY2025 figures. The October 2025 matrix pays
# $200 to $700 with all additions, and manual Part 200 Q.4 (page 9) and
# contract D(10)b (page 9) require the current matrix, so FY2026 follows it.
# The draft FFY2027 plan (Section 2.6) estimates a $200 minimum and $700
# maximum, matching these bases with all additions; no FY2027 matrix is
# published.
1:
  2024-10-01: 1_000
  2025-10-01: 350
2:
  2024-10-01: 750
  2025-10-01: 300
3:
  2024-10-01: 550
  2025-10-01: 250
4:
  2024-10-01: 400
  2025-10-01: 200
