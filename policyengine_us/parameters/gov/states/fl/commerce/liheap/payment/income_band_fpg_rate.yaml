description: Florida sets the poverty-guideline heating income-band upper bounds at this percentage of the federal poverty guidelines under the Low Income Home Energy Assistance Program.
# The FY2025 matrix prints the first band one dollar below 75% (for example,
# $43,574 at size 9), and the second band reads "At least 75%", so the first
# band excludes its upper bound.
first:
  2024-10-01: 0.75
second:
  2024-10-01: 1
third:
  2024-10-01: 1.25
metadata:
  unit: /1
  period: year
  label: Florida LIHEAP heating income-band poverty guideline rates
  propagate_metadata_to_children: true
  reference:
    - title: Florida FY2025 LIHEAP Payment Matrix, income bands for 9 to 20 people
      href: https://liheapch.acf.gov/docs/2025/benefits-matricies/FL_BenefitMatrix_2025.pdf
