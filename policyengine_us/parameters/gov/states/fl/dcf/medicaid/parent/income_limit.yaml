    unit: currency-USD
    period: month
    label: Florida Medicaid parent income standard additional person
    reference:
      - title: Florida DCF ESS Policy Manual Appendix A-7, additional person MNIL amount
        href: https://ffic.myflfamilies.com/manual/essfiles/30446.pdf
max_household_size:
  description: Florida publishes this maximum household size in the parent and caretaker monthly dollar standard table under Medicaid.
  values:
    2014-01-01: 24
