description: South Carolina exempts a family with a court-supervised child from the copay under the Child Care Scholarship Program if this is true.
# The protective services definition, whose families have no copay, includes
# children under court supervision from the FFY 2025-2027 CCDF Plan.
values:
  2022-10-01: false
  2024-10-01: true

