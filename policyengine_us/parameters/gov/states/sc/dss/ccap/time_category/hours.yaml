description: South Carolina determines care schedule from weekly childcare hours under the Child Care Scholarship Program.
# 0 = HALF_TIME, 1 = FULL_TIME
# Per the Policy Manual, 30+ hours = Full Time through 2024-09-30 and
# 25+ hours = Full Time from 2024-10-01 (Section 2.1.6); below that = Half Time.
metadata:
  type: single_amount
  threshold_unit: hour
  amount_unit: /1
  period: year
  label: South Carolina CCAP time category by hours
  reference:
    - title: SC Child Care Scholarship Program Policy Manual, Vol 034 (Rev. 12/01/2022), Glossary
      href: https://www.scchildcare.org/media/grfn5fd0/12012022policymanual.pdf#page=230
    - title: SC Child Care Scholarship Program Policy Manual, Vol 038 (Rev. 01/13/2025), Section 2.1.6
      href: https://www.scchildcare.org/media/ubhdm1at/1-13-2025_policy-manual.pdf#page=37

brackets:
  - threshold:
      2022-10-01: 0
    amount:
      2022-10-01: 0
  - threshold:
      2022-10-01: 30
      2024-10-01: 25
    amount:
      2022-10-01: 1
