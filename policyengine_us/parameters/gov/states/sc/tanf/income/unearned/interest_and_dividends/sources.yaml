description: South Carolina counts these income sources as unearned income after the interest, dividend and royalty exclusion under the Temporary Assistance for Needy Families program.
values:
  1996-07-01:
    - interest_income
    - dividend_income
    # Royalties are included in rental income, which has no separate
    # royalty input, so they are counted without this exclusion.
