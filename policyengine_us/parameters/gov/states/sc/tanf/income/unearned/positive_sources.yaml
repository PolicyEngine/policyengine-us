description: South Carolina counts the positive amount of each of these income sources as unearned income under the Temporary Assistance for Needy Families program.
values:
  1996-07-01:
    # These are net amounts that can be losses. Income is money received
    # (Section 7.1), so a net loss counts as zero rather than offsetting other
    # income; Section 8.16 allows no deduction for one.
    - capital_gains # Capital gains (other)
    - rental_income # Rent payments, after the cost of doing business; includes royalties
    - farm_rent_income
    - partnership_s_corp_income
    - estate_income # Trust and estate income; estate settlements are resources (Section 6.6)
    - miscellaneous_income
metadata:
  unit: list
  period: month
  label: South Carolina TANF unearned income sources counted when positive
  reference:
    - title: "SC DSS TANF Policy Manual (Volume 67), Sections 6.6, 7.1, 7.7 and 8.16 #page 92,102,108,116,134"
      href: https://dss.sc.gov/media/bxwc1jdj/tanf-policy-manual-volume-67-final.pdf#page=92
