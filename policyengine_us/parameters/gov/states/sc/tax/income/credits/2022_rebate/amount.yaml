description: South Carolina limits the income tax rebate to this amount under the South Carolina 2022 Income Tax Rebate program.
values:
  # S.1087 (Act 228 of 2022) Section 6(B) paid a one-time rebate on 2021
  # returns in 2022, so it is booked to 2021. The rebate equals 2021 tax
  # liability up to a $700 cap, which the Department of Revenue could raise if
  # funds allowed; it raised the cap to $800 ($700 statutory + $100 increase).
  # The explicit zeros keep it out of other years. Without the 2020 zero,
  # backdating would copy the 2021 value into 2015-2020, where the backdated
  # 2021 non-refundable credits list would pay it.
  2020-01-01: 0
  2021-01-01: 800
  2022-01-01: 0
metadata:
  unit: currency-USD
  period: year
  label: South Carolina 2022 rebate amount
