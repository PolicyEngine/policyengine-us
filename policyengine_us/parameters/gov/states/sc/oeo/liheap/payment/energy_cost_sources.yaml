description: South Carolina uses these represented home-energy bills for the energy-bill requirement and the energy-burden calculation under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    - pre_subsidy_electricity_expense
    - gas_expense
    - bottled_gas_expense
    - fuel_oil_expense
    - wood_expense
    - coal_expense
    - other_heating_fuel_expense
