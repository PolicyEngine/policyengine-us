description: South Carolina counts these unearned income sources of adult household members under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    - total_unemployment_compensation
    - social_security
    - ssi
    # Optional State Supplementation, paid with SSI to care-facility residents.
    - sc_ssi_state_supplement
    - pension_income
    # Military retirement includes Survivor Benefit Plan annuities.
    - military_retirement_income
    - railroad_benefits
    # Ongoing IRA/401k receipts are separate from pension_income.
    # Annual inputs cannot identify excluded one-time retirement lump sums.
    - retirement_distributions
    - survivor_benefits
    - rental_income
    - farm_rent_income
    - alimony_income
    - child_support_received
    - veterans_benefits
    - financial_assistance
metadata:
  unit: list
  period: year
  label: South Carolina LIHEAP unearned income sources
  reference:
    - title: South Carolina FY2026 LIHEAP Detailed Model Plan, item 1.9
      href: https://oeo.sc.gov/managedsites/prd/oeo/documents/2026%20LIHEAP%20State%20Plan.pdf#page=6
