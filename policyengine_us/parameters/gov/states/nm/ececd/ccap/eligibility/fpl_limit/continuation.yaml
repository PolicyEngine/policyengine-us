description: New Mexico limits continuing income eligibility to this percentage of the federal poverty guideline under the Child Care Assistance Program.
# Codified vs. operative layering. The NMAC rule (8.15.2.12, then 8.9.3.12 from
# 2022-11-01) codifies a 250% FPG recertification/exit ceiling, or 425% for
# essential workers in priority four plus (8.9.3.9.G). Since May 1, 2022,
# however, ECECD has operated CCAP under broader expansion policies: the
# Legislative Finance Committee's December 2025 policy brief documents an
# operative continuation/exit ceiling of 425% FPG from May 1, 2022 (held at 425%
# through the July 1, 2023 copay-waiver expiration), and no income limit at all
# once Universal Child Care took effect November 1, 2025. The 2025-11-04
# amendment removed the ceilings from 8.9.3.12 and added category four C with
# no income cap (8.9.3.9.H), and the rule that replaced 8.9.3 NMAC on
# 2026-09-09 sets no income limit. We encode the operative ceilings (which is
# what actually determined continued eligibility) rather than the superseded
# codified 250%, and set the limit to infinity from 2025-11-01
# (income_limit_in_effect also turns off then). Earlier operative expansions
# (200%/400% before May 2022) predate CCAP coverage in PolicyEngine and are not
# encoded.
values:
  2016-10-01: 2.5
  2022-05-01: 4.25
  2025-11-01: .inf

