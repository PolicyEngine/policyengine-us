description: New Mexico limits initial income eligibility to this percentage of the federal poverty guideline under the Child Care Assistance Program.
# Codified vs. operative layering. The NMAC rule (8.15.2.9.F, then 8.9.3.9.F
# from 2022-11-01) codifies a 200% FPG initial-certification ceiling, or 400%
# for essential workers in priority four plus (Subsection G). Since May 1,
# 2022, however, ECECD has operated CCAP under successively broader
# emergency/expansion policies: the Legislative Finance Committee's December
# 2025 policy brief documents an operative initial ceiling of 400% FPG from May
# 1, 2022 (held at 400% through the July 1, 2023 copay-waiver expiration), and
# no income limit at all once Universal Child Care took effect November 1,
# 2025. The 2025-11-04 amendment added category four C with no income cap
# (8.9.3.9.H), and the rule that replaced 8.9.3 NMAC on 2026-09-09 sets no
# income limit. We encode the operative ceilings (which is what actually
# determined eligibility) rather than the superseded codified 200%, and set the
# limit to infinity from 2025-11-01 (income_limit_in_effect also turns off
# then, short-circuiting the income test). Earlier operative expansions
# (150%/350% before May 2022) predate CCAP coverage in PolicyEngine and are not
# encoded.
values:
  2016-10-01: 2
  2022-05-01: 4
  2025-11-01: .inf

