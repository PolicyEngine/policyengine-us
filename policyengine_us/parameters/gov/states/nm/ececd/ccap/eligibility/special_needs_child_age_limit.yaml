description: New Mexico limits child care assistance for children with special supervision needs to those under this age under the Child Care Assistance Program.
values:
  # "Between the ages of 13 and 18" (8.15.2.11.G, then 8.9.3.11.G) and the
  # Parents' Guide's "up to 18 years of age" are read as under 18, so an
  # 18-year-old is excluded.
  2016-10-01: 18
  # The amendment of 8.9.3.11.G effective 2025-11-04 changed the range to
  # "between the ages of 13 and 19", read the same way as under 19.
  # 8.9.3.10.G keeps it from 2026-09-09, and 2026 Laws, Ch. 63 (SB 241),
  # Section 4(B), sets the same under-19 limit in statute from May 20, 2026.
  # Monthly periods resolve parameters at the first of the month, so the
  # monthly model first applies the age-19 limit for December 2025; November
  # 2025 still uses 18.
  2025-11-04: 19

