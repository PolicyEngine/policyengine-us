    - title: 8.9.3.9 NMAC (2022-11-01 to 2025-11-03)
      href: https://www.srca.nm.gov/parts/title08/08.009.0003.html
    - title: 8.9.3.9.H NMAC, as amended effective 2025-11-04 (category four C has no income cap)
