description: New Mexico uses this indicator to determine whether an income limit applies under the Child Care Assistance Program.
# New Mexico's Universal Child Care initiative (a state ECECD program, the
# first in the nation; effective November 1, 2025) removes all income limits;
# New Mexico families are eligible regardless of income from that date forward.
# The 2025-11-04 amendment added category four C with no income cap
# (8.9.3.9.H NMAC), and the rule that replaced 8.9.3 NMAC on 2026-09-09 sets
# no income limit.
values:
  2016-10-01: true
  2025-11-01: false

metadata:
  unit: bool
  period: month
  label: New Mexico CCAP income limit in effect
  reference:
