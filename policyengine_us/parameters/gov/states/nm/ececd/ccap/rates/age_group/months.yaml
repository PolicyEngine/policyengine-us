description: New Mexico assigns children to these reimbursement age categories by age in months under the Child Care Assistance Program.
# Maps age in months to an nm_ccap_age_group enum index:
# 0 = INFANT (0-23 months), 1 = TODDLER (24-35 months),
# 2 = PRESCHOOL (three to five year olds, 36-71 months),
# 3 = SCHOOL_AGE (six year olds and older, 72+ months).
# The rule that replaced 8.9.3 NMAC makes a child school age once the child is
# five years old by September 1 of the school year (8.9.3.7(I)(3)).
# 8.9.3.19(D) dates the move of preschool children to school age September 1,
# 2026, but the rule took effect on its publication on 2026-09-09 (8.9.3.5
# NMAC; NMSA 14-4-5: no rule is valid or enforceable until it is published in
# the New Mexico Register). The new threshold therefore starts 2026-09-09, and
# the monthly model first applies it in October 2026. From then PRESCHOOL is
# 36-59 months and SCHOOL_AGE is 60+ months.
# Age in whole years only approximates the September 1 cutoff: every child of
# age five is school age, although a child who turns five after September 1
# stays preschool for that school year (8.9.3.7(I)(3)(c), 8.9.3.19(D)). Late
# in the school year, that covers most five-year-olds.
metadata:
  type: single_amount
  threshold_unit: month
  amount_unit: /1
  period: year
  label: New Mexico CCAP age group by months
  reference:
    - title: 8.15.2.7(I)(2)(a)-(d) NMAC (before 2022-11-01)
      href: https://www.srca.nm.gov/parts/title08/08.015.0002.html
    - title: 8.9.3.7(I)(2)(a)-(d) NMAC (2022-11-01 to 2026-09-08)
      href: https://www.srca.nm.gov/parts/title08/08.009.0003.html
    - title: "8.9.3.7(I)(3)(a)-(d) and 8.9.3.19(D) NMAC (from 2026-09-09) #page 3,18"
      href: https://prod-rf-lambda.rtssaas.com/PublicFiles/d89c47bd0d70402dba89b03a22bda6d1/b0e207a9-a1a3-412d-9660-0a6e925f6f25/8.9.3.pdf#page=3

brackets:
  - threshold:
      2016-10-01: 0
    amount:
      2016-10-01: 0
  - threshold:
      2016-10-01: 24
    amount:
      2016-10-01: 1
  - threshold:
      2016-10-01: 36
    amount:
      2016-10-01: 2
  - threshold:
      2016-10-01: 72
      2026-09-09: 60
    amount:
      2016-10-01: 3
