description: New Mexico counts these sources as earned income of household members over the earned income age under the Low Income Home Energy Assistance Program.
# Wages, pay for irregular work and self-employment income, with the net
# income of a business counted as gross income. The existing net business
# inputs get no further deduction, and each source is floored at zero, so a
# loss in one source cannot offset another. Rental income counts as earned
# income for a landlord working 20 or more hours a week; no input records
# landlord hours, so rental income is listed with unearned income.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

