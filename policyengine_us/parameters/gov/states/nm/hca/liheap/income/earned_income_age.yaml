description: New Mexico counts the earned income of household members older than this age under the Low Income Home Energy Assistance Program.
# 8.150.520.12 B NMAC counts "the gross earned income of all household members
# over the age of 18", so the earnings of a member aged 18 or younger are not
# counted. The FY2026 plan leaves "Earned income of a child under the age of
# 18" unchecked (Section 1.9).
values:
  2025-10-01: 18

