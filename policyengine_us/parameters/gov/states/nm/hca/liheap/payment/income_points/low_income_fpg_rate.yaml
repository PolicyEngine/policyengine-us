description: New Mexico sets the low-income cutoff for income points at this multiple of the federal poverty guideline under the Low Income Home Energy Assistance Program.
# 8.150.620.9 B NMAC gives three points up to 100% of the guideline; HCA's
# FFY2025-FFY2027 point and income guides and the FFY2026 ISD 017 card use
# 110%, which is followed; the choice is listed in the conflict register
# backlog (candidates.yaml) as us-nm:liheap-three-income-points. The FFY2026
# guide prints monthly cutoffs of $1,435 to $4,964 for household sizes 1-8
# and the FFY2027 guide $1,463 to $5,108, each 110% of the guideline over 12
# months rounded to the nearest dollar.
values:
  2025-10-01: 1.1

