description: New Mexico assigns these energy points by the household's monthly energy bill as a share of monthly countable income under the Low Income Home Energy Assistance Program.
# The rule prints whole-percent bands: zero to five, six to ten, eleven to
# fifteen, and sixteen percent or more. The unrounded burden uses
# lower-inclusive cutoffs at 6%, 11% and 16%. Households with zero income
# receive the top band in nm_liheap.
brackets:
  # Zero to five percent.
  - threshold:
      2025-10-01: 0
    amount:
      2025-10-01: 0
  # Six to ten percent.
  - threshold:
      2025-10-01: 0.06
    amount:
      2025-10-01: 1
  # Eleven to fifteen percent.
  - threshold:
      2025-10-01: 0.11
    amount:
      2025-10-01: 2
  # Sixteen percent or more.
  - threshold:
      2025-10-01: 0.16
    amount:
      2025-10-01: 3

