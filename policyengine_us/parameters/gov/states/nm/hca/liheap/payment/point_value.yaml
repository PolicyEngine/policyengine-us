description: New Mexico multiplies the household's point total by this amount to compute the benefit under the Low Income Home Energy Assistance Program.
# 8.150.620.10 C NMAC lets the HCA secretary adjust the point value each year.
# The resulting FFY2026 benefits run from $70 to $490 (2 to 14 points) and
# the FFY2027 benefits from $80 to $560.
values:
  2025-10-01: 35
  2026-10-01: 40

