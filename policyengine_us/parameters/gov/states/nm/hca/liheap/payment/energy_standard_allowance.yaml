description: New Mexico uses this monthly energy standard allowance as the minimum monthly energy bill for the energy burden under the Low Income Home Energy Assistance Program.
# 8.150.620.9 A(4) NMAC applies the allowance when the applicant's monthly
# utility costs are less than the standard or are not available. The FFY2027
# guide labels the $298 amount the Standard Utility Allowance, and the FFY2027
# ISD 017 card lists it as the LIHEAP Energy Standard Allowance (ESA).
values:
  2025-10-01: 291
  2026-10-01: 298

