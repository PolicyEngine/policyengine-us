description: New Mexico uses the federal poverty guidelines from this many years before the model year for the income limit and income points under the Low Income Home Energy Assistance Program.
# HHS made the 2025 guidelines mandatory for LIHEAP from October 1, 2025, so
# model period 2026 (FFY2026) uses the 2025 guidelines and 2027 (FFY2027) the
# 2026 guidelines. Both income tables of the FFY2026 and FFY2027 guides
# reproduce from these guideline years.
values:
  2025-10-01: 1

