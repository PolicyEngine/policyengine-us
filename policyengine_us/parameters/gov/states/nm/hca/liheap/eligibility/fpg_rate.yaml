description: New Mexico limits household income to this multiple of the federal poverty guideline under the Low Income Home Energy Assistance Program.
# The FFY2026 guide prints monthly limits of $1,956 to $6,769 for household
# sizes 1-8 (150% of the 2025 guideline over 12 months, rounded to the nearest
# dollar), and the FFY2027 guide $1,995 to $6,965 (2026 guideline). The 110%
# floor of 42 U.S.C. 8624(b)(2)(B) lies below this limit for every size.
values:
  2025-10-01: 1.5

