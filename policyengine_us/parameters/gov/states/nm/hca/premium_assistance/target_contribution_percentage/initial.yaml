description: New Mexico sets this initial target contribution percentage for each bracket under the Health Insurance Marketplace Affordability Program.
values:
  # Bands: 0-150%, 150-200%, 200-250%, 250-300%, 300-400% FPL.
  # PY2027 uses the same scale per the FINAL PY2027 MAP Manual (HCA, issued
  # 2026-06-16), Table 1 (p.4).
  2026-01-01:
    - 0     # 0-150%: flat 0%
    - 0     # 150-200%: flat 0%
    - 0     # 200-250%: 0% -> 2%
    - 0.02  # 250-300%: 2% -> 5%
    - 0.05  # 300-400%: 5% -> 8.5%

