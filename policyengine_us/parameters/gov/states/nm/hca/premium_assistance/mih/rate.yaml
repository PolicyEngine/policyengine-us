description: New Mexico caps the benchmark plan premium at this share of household income for Middle Income Households under the Health Insurance Marketplace Affordability Program.
values:
  # PY2026 value; the FINAL PY2027 MAP Manual (HCA, issued 2026-06-16) sets the
  # same flat 8.5% cap at >=400% FPL (p.4). The MIH assistance nets out the
  # federal premium tax credit per 8.401.2.8(D)(1)(a) NMAC ("minus monthly
  # federal premium tax credit"), which the formula implements as - aca_ptc.
  2026-01-01: 0.085

metadata:
