description: New Mexico provides Middle Income Household premium assistance above 400% of the federal poverty line under the Health Insurance Marketplace Affordability Program when this is true.
values:
  # The Addendum contains a sunset clause: if the federal government extended the
  # program capping premiums at 8.5% of income for individuals over 400% FPL
  # before January 1, 2026, the Addendum would not take effect. Congress did not
  # extend the enhanced federal premium tax credit, so the Middle Income
  # Household component is in effect for PY2026. PY2026 values carried forward
  # through PY2027.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

metadata:
  unit: bool
