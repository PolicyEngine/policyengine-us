description: New Mexico limits the base income eligibility to this share of the federal poverty line under the Health Insurance Marketplace Affordability Program.
values:
  # Dual use: this ceiling is the base-program cutoff via <= (units at or below
  # 400% FPL qualify for base assistance) and simultaneously the Middle Income
  # Household floor via > (units above 400% FPL route to the MIH component).
  # PY2027 uses the same 400% ceiling per the FINAL PY2027 MAP Manual (HCA,
  # issued 2026-06-16), Table 1 (p.4) and the flat 8.5% cap at >=400% FPL (p.4).
  2026-01-01: 4

