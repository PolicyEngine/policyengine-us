description: New Mexico applies the benchmark gross-up up to this share of the federal poverty line under the Health Insurance Marketplace Affordability Program.
# PY2026 treats this limit as inclusive (at or below 200% FPL); PY2027 treats it
# as strict (below 200% FPL). The inclusive-vs-strict switch lives in the
# boundary_inclusive parameter; this file stores only the 200% FPL threshold.
values:
  2026-01-01: 2

