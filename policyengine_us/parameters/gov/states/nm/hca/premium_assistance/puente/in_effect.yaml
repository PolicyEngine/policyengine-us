description: New Mexico provides Puente Health premium assistance to lawfully present non-citizens who lost the federal premium tax credit under Public Law 119-21 when this is true.
values:
  # Addendum 2 starts Puente Health with coverage on January 1, 2026. 8.401.2
  # NMAC is permanent (8.401.2.4), but 8.401.2.11(B) has the Secretary publish
  # the income eligibility parameters annually for the ensuing plan year, and
  # HCA has published them only through plan year 2027 (the FINAL PY2027 MAP
  # manual). The program therefore ends with plan year 2027 here, as the base
  # New Mexico Premium Assistance does, until PY2028 guidance is published.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

