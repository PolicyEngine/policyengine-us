description: New Mexico limits Puente Health to household income at or below this share of the federal poverty line.
values:
  # PY2026: "at or below 100% of the FPL" (Addendum 2, Section I.A(3)). The
  # Section 71302 group it serves is below 100% by definition, since the
  # repealed 26 U.S.C. 36B(c)(1)(B) covered income under the poverty line.
  # PY2027: "household income <= 400% of the FPL" (manual p.7, eligibility
  # item 3), with no Puente Health above 400% (manual p.8).
  2026-01-01: 1
  2027-01-01: 4

