description: New Mexico excludes these immigration statuses, which do not allow a person to buy a qualified health plan on the exchange, from Puente Health.
values:
  # Puente Health covers a "lawfully present individual", defined at
  # 8.401.2.7(I) NMAC as a non-citizen "who has an immigration status that
  # allows them to purchase a QHP on the exchange". 45 CFR 155.305(a)(1)
  # limits QHP enrollment to citizens, nationals and lawfully present people,
  # and 45 CFR 155.20 has excluded DACA recipients from lawful presence since
  # August 25, 2025 (paragraph (14)). New Mexico serves DACA recipients
  # through a separate off-exchange program (8.401.2.12 NMAC). Every other
  # non-citizen status that the federal credit excludes is a lawfully present
  # status and so a Puente Health status.
  2026-01-01:
    - DACA
    - UNDOCUMENTED

