description: New Mexico provides state premium assistance under the Health Insurance Marketplace Affordability Program when this is true.
values:
  # PY2026 comes from the PY2026 MAP Manual and PY2027 from the FINAL PY2027 MAP
  # Manual (HCA, issued 2026-06-16), whose Table 1 (p.4) confirms the same
  # effective schedule. The LFC "Program Cost Estimate (2024)" table confirms the
  # same scale for PY2025, but no 2025 backdating is applied here. The
  # 2028-01-01: false entry is the "no PY2028 guidance yet" convention.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

