description: >-
  New Mexico provides the following supplemental 2021 income tax rebate amount, based on
  filing status. PolicyEngine attributes this rebate to eligibility tax year 2021,
  determined from the 2021 return. The value can persist in later standalone
  calculations; inclusion in the dated refundable-credit total determines whether it
  affects income tax.
