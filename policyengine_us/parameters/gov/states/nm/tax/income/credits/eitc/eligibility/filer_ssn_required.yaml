description: New Mexico applies the federal filer Social Security number condition under its Working Families Tax Credit when this is true.
values:
  # The inspected 2015 law supplies a coverage anchor, not an enactment date.
  2015-01-01: true
  # The SSN exception does not remove other return identification requirements.
  2021-01-01: false
