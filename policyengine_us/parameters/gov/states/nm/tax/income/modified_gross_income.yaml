description: New Mexico includes these income sources in its modified gross income concept.
values:
  2021-01-01:
    - tax_unit_social_security
    - capital_gains
    - tanf
    - ssi
    - interest_income
    - dividend_income
    - alimony_income
    - child_support_received
    - rental_income
    - pension_income
    # NMSA 1978 § 7-2-2(L)(9), (11): annuities and pensions, including military
    # retired pay and survivor annuities, which pension_income leaves out.
    - military_retirement_income
    - retirement_distributions
    - total_unemployment_compensation
    - irs_employment_income
    - self_employment_income
    - sstb_self_employment_income
    - veterans_benefits
    # NMSA 1978 § 7-2-2(L)(15): income from an interest in an estate or a trust
    - estate_income
    # income such as gambling winnings, insurance settlements, scholarships,
    # grants and inheritance,
metadata:
  unit: list
