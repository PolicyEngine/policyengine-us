description: New Mexico excludes short-term capital gains from net capital gains under the net capital gains deduction if this is true.
values:
  2021-01-01: false
  # From tax year 2023 the instructions define "net capital gains" by IRC
  # Section 1222(11): net long-term capital gains less any net short-term
  # capital losses. Earlier instructions use the net capital gains reported and
  # claimed on the federal return.
  2023-01-01: true
metadata:
  unit: bool
  period: year
  label: New Mexico net capital gains deduction excludes short-term capital gains
