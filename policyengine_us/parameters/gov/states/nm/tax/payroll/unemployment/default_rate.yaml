description: New Mexico assigns each new employer a rate based on its industry, so this parameter uses the average employer contribution rate on taxable wages.
values:
  # The Department of Labor's average employer contribution rates on taxable
  # wages; the Department of Workforce Solutions publishes no annual series.
  2018-01-01: 0.009
  2019-01-01: 0.0081
  2020-01-01: 0.0073
  2021-01-01: 0.0076
  2022-01-01: 0.0073
  2023-01-01: 0.0085
  2024-01-01: 0.0087
  2025-01-01: 0.0093
  # Department of Labor estimate.
  2026-01-01: 0.0099

