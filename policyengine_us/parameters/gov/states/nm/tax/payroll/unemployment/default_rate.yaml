description: New Mexico assigns each new employer the average rate of its industry, from 1% to 5.4%, so this parameter holds the statewide average employer contribution rate on taxable wages within those limits.
values:
  # The Department of Labor's average employer contribution rates on taxable
  # wages, 0.73% to 0.99% from 2018 to 2026 (its estimate for 2026), all fall
  # below the 1% minimum; the Department of Workforce Solutions publishes no
  # annual series.
  2018-01-01: 0.01

