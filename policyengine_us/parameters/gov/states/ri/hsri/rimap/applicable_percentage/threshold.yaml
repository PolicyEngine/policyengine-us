description: Rhode Island sets these federal poverty line thresholds for the applicable percentage bands under the Marketplace Affordability Program.
values:
  # Bands: 100-133%, 133-150% and 150-200% of the poverty line. Each band
  # includes its lower edge ("at least") and excludes its upper edge ("less
  # than").
  2027-01-01:
    - 1
    - 1.33
    - 1.5
    - 2

