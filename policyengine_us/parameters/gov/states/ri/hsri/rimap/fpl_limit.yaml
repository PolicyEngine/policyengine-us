description: Rhode Island limits the main Marketplace Affordability Program subsidy to household income below this share of the federal poverty line.
values:
  # The Plan Year 2027 table gives a RIMAP applicable percentage up to the
  # band "at least 150% but less than 200%" and none ("--") from 200% to 400%,
  # so income must be strictly below 200% of the poverty line.
  2027-01-01: 2

