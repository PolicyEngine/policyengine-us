description: Rhode Island counts these unearned income sources under the Low Income Home Energy Assistance Program.
# Interest and rental receipts have separate allowances; RI Works is added
# once at its SPMUnit entity, so none of those sources is duplicated here.
# pension_income includes public/military pensions; military_retirement_pay
# is a tax-classification input and must not be added independently.
# SSI is the federal benefit; a separate RI state supplement is not modeled.
# disability_benefits approximates employment-related TDI/TCI receipts.
# The manual expressly counts workers compensation in Section III.E.
# VA education and Aid and Attendance exclusions cannot be separated from
# the broad veterans input. Jury duty, royalties, foster receipts and legal
# settlements also lack sufficiently specific existing inputs.
values:
  2025-10-01:
    - unemployment_compensation
    - strike_benefits
    - social_security
    - ssi
    - pension_income
    - survivor_benefits
    - railroad_benefits
    - alimony_income
    - child_support_received
    - workers_compensation
    - disability_benefits
    - financial_assistance
    - ordinary_dividend_income
    - veterans_benefits
    # Manual Section III.E, Estate or Trust Income, page 17.
    - estate_income

