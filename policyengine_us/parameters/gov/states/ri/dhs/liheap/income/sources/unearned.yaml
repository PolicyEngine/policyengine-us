description: Rhode Island uses these sources as unearned income under the Low Income Home Energy Assistance Program.
# Interest and rental receipts have separate allowances, and TANF (RI Works)
# is added once through the SPM-unit tanf aggregate, so none of those
# sources is duplicated here. Each listed source is floored at zero.
# SSI is the federal benefit; a separate RI state supplement is not modeled.
# disability_benefits approximates employment-related TDI/TCI receipts.
# VA education and Aid and Attendance exclusions cannot be separated from
# the broad veterans input. Strike pay and VA benefits are counted under FY2026
# plan Section 1.9 (page 6) and the DHS FY2026 plan summary (page 1). Payments
# from mortgages or sales contracts, AmeriCorp living allowances, jury duty pay,
# royalties, foster care receipts and legal settlements lack specific existing
# inputs and are not counted; contract income counts only when reported as
# wages or self-employment income.
values:
  2025-10-01:
    - total_unemployment_compensation
    - strike_benefits
    - social_security
    - ssi
    # Military retirement income (retiree pay plus Survivor Benefit Plan
    # annuities) is a separate input from the pension inputs that
    # pension_income adds, so both are listed; a household reports the amount
    # in one or the other. A military survivor annuity belongs in
    # military_retirement_pay_survivors, not survivor_benefits.
    - pension_income
    - military_retirement_income
    - retirement_distributions
    - survivor_benefits
    - railroad_benefits
    - alimony_income
    - child_support_received
    # Manual Section III.E counts "Temporary Disability Insurance (TDI),
    # Temporary Caregivers Insurance (TCI)" (page 15) and "Workers'
    # Compensation" (page 16); FY2026 plan Section 1.9, page 6, leaves
    # "Insurance payments made directly to the insured" unchecked. This
    # follows the manual.
    - workers_compensation
    - disability_benefits
    - financial_assistance
    - ordinary_dividend_income
    - veterans_benefits
    # Manual Section III.E, Estate or Trust Income, page 17.
    - estate_income
    # Manual Section III.E, page 17, lists "Cash Prizes and Lottery Winnings" as
    # income. FY2026 plan Section 1.9, page 6, leaves "winnings from lotteries"
    # unchecked, and DHS's FY2026 and draft FFY2027 plan summaries and the
    # application instructions do not list them. This follows the manual.
    - gambling_winnings

