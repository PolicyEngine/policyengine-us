description: Rhode Island uses these expenses as income deductions under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    # Amounts approximate verified court orders. Existing inputs cannot
    # establish the allowable court-ordered maximum or whether every payment
    # was made.
    - child_support_expense
    - alimony_expense
    # Manual Section III.H, page 21, deducts "All Medicare expenses, including
    # prescriptions." FY2026 plan Section 1.9, page 6, counts Social Security
    # "Including MediCare deduction", which DHS's draft FFY2027 plan summary glosses
    # as "meaning the Medicare amount deducted is not counted", so the sources agree.
    # The Part B premium is the only Medicare expense with an input; prescription
    # and other Medicare costs are not deducted.
    - medicare_part_b_premium

