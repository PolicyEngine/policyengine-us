description: Rhode Island excludes full-time student income below this age when the student is not the household head under the Low Income Home Energy Assistance Program.
# Age 18 through 23 means below the twenty-fourth birthday.
# The newer application omits the manual household-head exception without
# expressly repealing it. Current student-head treatment remains unverified.
values:
  2025-10-01: 24

