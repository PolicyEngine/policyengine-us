description: Rhode Island excludes the income of full-time students below this age under the Low Income Home Energy Assistance Program.
# Ages 18 through 23 means below the twenty-fourth birthday. The FY2026 and
# FY2027 application instructions exclude every full-time student aged 18-23.
# The 2020 manual excluded only a child who was not the household head; the
# current instructions govern.
values:
  2025-10-01: 24

