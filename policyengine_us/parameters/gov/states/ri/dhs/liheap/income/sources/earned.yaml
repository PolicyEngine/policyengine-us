description: Rhode Island uses these sources as earned income under the Low Income Home Energy Assistance Program.
# Existing net business income is used without an additional 40% deduction.
# The manual (Section III.H, page 20) deducts 40% of gross self-employment
# receipts, and DHS's FY2026 plan summary (page 1) lists "Self-employment
# income (60%)". Gross business receipts and business-expense inputs remain deferred.
# Active versus passive partnership receipts are not separately identifiable.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

