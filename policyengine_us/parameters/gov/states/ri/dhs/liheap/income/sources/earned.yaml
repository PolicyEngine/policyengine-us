description: Rhode Island counts these earned income sources under the Low Income Home Energy Assistance Program.
# Existing net business income is used without an additional 40% deduction.
# Gross business receipts and business-expense inputs remain deferred.
# Active versus passive partnership receipts are not separately identifiable.
values:
