description: Rhode Island uses these sources as earned income under the Low Income Home Energy Assistance Program.
# Manual Section III.H (page 20) deducts 40% of gross self-employment receipts,
# and DHS's FY2026 plan summary (page 1) lists "Self-employment income (60%)".
# The model has only net business income and counts it in full, as Kansas LIHEAP
# does; this equals 60% of receipts only when expenses are 40% of receipts, and
# otherwise over- or understates countable income by receipts x (0.4 - expense
# ratio). No gross-receipts or business-expense input is added.
# Active versus passive partnership receipts are not separately identifiable.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income

