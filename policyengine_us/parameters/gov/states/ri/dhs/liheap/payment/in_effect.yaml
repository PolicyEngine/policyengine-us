description: Rhode Island provides the regular heating payment under the Low Income Home Energy Assistance Program when this is true.
# Payment amounts are sourced from the FY2026 grant matrix onward. The FY2025
# grant matrix and enhancement amount were not located, and FY2025 used a
# different $64 minimum and $1,148 maximum (FY2025 plan Section 2.6), so the
# modeled payment starts October 1, 2025. Zero before then means no modeled
# award, not legal ineligibility.
values:
  2000-01-01: false
  2025-10-01: true

metadata:
  unit: bool
  period: year
  label: Rhode Island LIHEAP payment in effect
  reference:
    - title: Rhode Island FY2026 Grant Amounts, primary heating rows A-F
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/RI_BenefitMatrix_2026.pdf
    - title: Rhode Island FY2025 State Plan, Section 2.6 Benefit Levels
      href: https://liheapch.acf.gov/docs/2025/state-plans/RI_Plan_2025.pdf#page=9
