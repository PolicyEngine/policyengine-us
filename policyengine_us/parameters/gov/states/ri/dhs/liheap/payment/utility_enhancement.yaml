description: Rhode Island provides this enhancement with a primary heating grant credited to a gas or electric distribution-company account under the Low Income Home Energy Assistance Program.
# The FY2026 and FY2027 amounts are sourced for their heating seasons; earlier
# periods backfill the FY2026 amount as an unverified estimate. DHS's FFY2027
# filing (Docket 26-34-GE, October 2, 2026, page 2) gives one additional credit to
# accounts receiving a 2027 primary benefit, and DHS's response to the Division's
# data request 1-1 (issued October 14, 2026) sets it at $400. It is not part of
# the federal fuel matrix or a crisis/cooling grant. The formula excludes Block
# Island Utility District and Clear River Electric and Water District electric
# accounts (R.I. Gen. Laws 39-1-27.12(f)); which account receives the federal
# grant stays an assumption.
values:
  2025-10-01: 350
  2026-10-01: 400

