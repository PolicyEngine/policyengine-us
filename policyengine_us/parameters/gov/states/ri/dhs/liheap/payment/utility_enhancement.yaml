description: Rhode Island provides this enhancement with a primary heating grant credited to a gas or electric distribution-company account under the Low Income Home Energy Assistance Program.
# DHS sets the enhancement separately for each heating season. Its October 28,
# 2026 response to DIV 1-1 establishes the FY2027 amount. Earlier periods
# backfill the FY2026 amount as an unverified estimate.
# Block Island and Clear River electric accounts are excluded in the formula.
# Actual federal-grant account routing remains assumed from the payment route.
values:
  2025-10-01: 350
  2026-10-01: 400

