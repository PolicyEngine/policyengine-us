description: Rhode Island uses the federal poverty guidelines from this many years before the model year for payment bands and the federal income floor under the Low Income Home Energy Assistance Program.
# The FY2026 matrix uses the 2025 guidelines, which HHS made mandatory for LIHEAP
# from October 1, 2025, so model period 2026 (FY2026) uses the 2025 guidelines
# and 2027 (FY2027) the 2026 guidelines, for both the bands and the floor.
# Backfilled years use their corresponding lagged guidelines and are unverified.
values:
  2025-10-01: 1

metadata:
  unit: year
  period: year
  label: Rhode Island LIHEAP poverty guideline year lag
  reference:
    - title: Rhode Island FY2026 Grant Amounts and Income Eligibility Matrix, note 2
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/RI_BenefitMatrix_2026.pdf
    - title: LIHEAP IM 2025-02, Attachment 2, poverty guidelines for mandatory use in FY26
      href: https://acf.gov/sites/default/files/documents/ocs/COMM_LIHEAP_IM2025-02_FPGSte-Table_Att2.pdf#page=1
    - title: LIHEAP IM 2026-01, poverty guidelines for optional use in FY26 and mandatory use in FY27
      href: https://acf.gov/ocs/policy-guidance/liheap-im2026-01-federal-poverty-guidelines-fpg-and-state-median-income-smi
