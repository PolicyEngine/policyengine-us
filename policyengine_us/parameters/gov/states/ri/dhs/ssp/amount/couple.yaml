# Category D applies to adult individuals only and has no couple rate
# (POMS SI BOS01415.012 B.1; 218-RICR-20-00-5 Section 5.6.A lists N/A), so
# ri_ssp pays a member of an eligible couple the Category A rate instead.
# This entry equals the individual rate so that the ineligible-spouse
# comparison of the higher couple or individual rate (20 CFR 416.2025(b)(3);
# POMS SI 01320.430 C.7) uses the individual rate.
RESIDENTIAL_CARE:
  2026-01-01: 332

# Category E covers an individual or couple in a Title XIX facility
# (218-RICR-20-00-5 Section 5.1.1.A.3.c) and pays the personal needs
# allowance to each individual (R.I. Gen. Laws § 40-6-27(a)(3)), so the
# couple entry is twice the individual rate.
MEDICAID_INSTITUTION:
  2026-01-01: 90

