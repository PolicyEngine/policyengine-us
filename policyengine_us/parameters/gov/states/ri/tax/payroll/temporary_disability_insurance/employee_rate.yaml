description: Employee-side Rhode Island TDI contribution rate.
values:
  # Rhode Island TDI contributions existed before 2018. The model does not encode
  # earlier years, so it carries the 2018 value back to 2015, its first year.
  2018-01-01: 0.011
  2019-01-01: 0.011
  2020-01-01: 0.013
  2021-01-01: 0.013
  2022-01-01: 0.011
  2023-01-01: 0.011
  2024-01-01: 0.012
  2025-01-01: 0.013
  2026-01-01: 0.011

