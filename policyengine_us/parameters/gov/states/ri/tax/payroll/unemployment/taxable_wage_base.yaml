description: Rhode Island limits employer unemployment insurance contributions to this amount of each worker's annual wages, for employers below the highest experience rate.
values:
  2018-01-01: 23_000
  2019-01-01: 23_600
  2020-01-01: 24_000
  2021-01-01: 24_600
  2022-01-01: 24_600
  2023-01-01: 28_200
  2024-01-01: 29_200
  2025-01-01: 29_800
  2026-01-01: 30_800

