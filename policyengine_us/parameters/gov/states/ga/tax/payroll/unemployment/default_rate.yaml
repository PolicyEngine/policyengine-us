description: Georgia assigns this unemployment insurance contribution rate to each new employer.
values:
  # Georgia also charges new employers a separate 0.06% administrative
  # assessment in every year but 2023, which these rates leave out.
  2018-01-01: 0.0264
  # Before Senate Bill 160 (2023), Section 34-8-151 set 2.7% for periods after
  # 2022, and the Department of Labor assigned 2023 rates on that basis on
  # January 3, 2023. Senate Bill 160 extended the 2.64% rate through 2026 from
  # May 1, 2023, with no transition rule for the rates already assigned, so
  # 2023 keeps 2.7%; the U.S. Department of Labor's tax measures reports list
  # 2.70% for 2023 and 2.64% for 2024.
  2023-01-01: 0.027
  2024-01-01: 0.0264

