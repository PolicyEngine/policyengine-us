description: Georgia treats an employee who usually works at least this many hours a week as full-time under the qualified overtime compensation exclusion.

# O.C.G.A. § 48-7-27(a)(16)(A) says "full-time employee" and does not define
# the term. The value follows the income tax chapter's own usage: Chapter 7's
# job credits set the term at "a minimum of 35 hours a week".
values:
  2026-01-01: 35

