description: Georgia limits the Childcare and Parent Services program to children with a disability or under court-ordered supervision up through this age.
values:
  # Policy Manual §6.4.1 and §6.4.3 set the age at 17 for a child with a
  # disability or developmental delay or under court-ordered supervision; the
  # CCDF State Plan §2.2.1(b)(i) and (c) elect 18.00. We follow the more
  # recent, more restrictive Policy Manual value of 17.
  2026-03-02: 17

metadata:
  unit: year
