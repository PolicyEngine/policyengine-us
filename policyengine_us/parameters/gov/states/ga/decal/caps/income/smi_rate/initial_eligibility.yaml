description: Georgia limits the Childcare and Parent Services program to new applicants with income at or below this share of state median income.

# DECAL's letters date every change. An emergency waiver raised the limit to 85%
# from November 1, 2021, through December 15, 2022. The 2024 spending plan's
# "November 2021 - September 2024" and the governor's "through October 1, 2024"
# describe the funding window, and DECAL's December 2022 letter and emergency
# memorandum end the income waiver earlier. DECAL applies each limit by application
# received date. The model carries no application date, so it moves every new
# applicant at the first month that starts on or after the effective date.
values:
  2016-10-01: 0.5
  2021-11-01: 0.85
  2022-12-16: 0.5
  2024-09-01: 0.3
  2025-10-06: 0.4
  2026-03-02: 0.5

