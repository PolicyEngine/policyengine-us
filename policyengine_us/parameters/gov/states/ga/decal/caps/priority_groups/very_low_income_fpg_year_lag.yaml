description: Georgia uses the federal poverty guideline from this many years before the current date for the very low income priority group under the Childcare and Parent Services program.

# Each Appendix A chart prints the date CAPS took up that year's guideline: March 1
# in 2020 through 2025 and March 2 in 2026. The prior year's guideline holds until
# then. The model applies each date at the first month that starts on or after it,
# so the 2026 guideline takes effect in April 2026. No chart before 2020 survives, so
# earlier years read the current year's guideline.
values:
  2015-01-01: 0
  2020-01-01: 1
  2020-03-01: 0
  2021-01-01: 1
  2021-03-01: 0
  2022-01-01: 1
  2022-03-01: 0
  2023-01-01: 1
  2023-03-01: 0
  2024-01-01: 1
  2024-03-01: 0
  2025-01-01: 1
  2025-03-01: 0
  2026-01-01: 1
  2026-03-02: 0

