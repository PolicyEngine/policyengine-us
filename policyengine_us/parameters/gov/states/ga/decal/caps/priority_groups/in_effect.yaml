description: Georgia uses this indicator to determine whether the Childcare and Parent Services program requires new applicants to belong to a priority group.

# DECAL restricted funding to priority groups for new applicants from August 1,
# 2016. The funding Q&A adds the homeless, domestic violence and very low income
# groups on October 1, 2016, and the model counts them from August 1.
values:
  2015-01-01: false
  2016-08-01: true

metadata:
  unit: bool
  period: month
  label: Georgia CAPS priority group requirement in effect
  reference:
    - title: Georgia DECAL, Questions about CAPS Funding Restrictions (2016)
      href: https://www.decal.ga.gov/documents/attachments/fundingrestrictionsqa.pdf#page=1
    - title: Georgia CAPS Policy CAPS/00-7, Section 7.3.1 (revised October 5, 2026)
      href: https://caps.decal.ga.gov/assets/downloads/CAPS/07-CAPS_Policy-Priority%20Groups.pdf#page=1
    - title: Georgia CCDF Plan FFY 2025-2027, Section 2.2.7
      href: https://www.decal.ga.gov/documents/attachments/CCDFStatePlan25-27.pdf#page=25
