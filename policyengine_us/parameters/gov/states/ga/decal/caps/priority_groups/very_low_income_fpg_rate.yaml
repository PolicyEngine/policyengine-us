description: Georgia limits the very low income priority group to families with income at or below this share of the federal poverty guideline under the Childcare and Parent Services program.

# DECAL's letters date every change. DECAL applies each rate by application received
# date. The model carries no application date, so it moves every new applicant at
# the first month that starts on or after the effective date. The 50% back to
# October 2016 rests on the June 2018 letter's "previously".
values:
  2016-10-01: 0.5
  2018-05-30: 1
  2019-07-01: 0.5
  2021-11-01: 1.5
  2022-12-16: 0.5
  2024-07-01: 0.1
  2025-10-06: 0.3
  2026-03-02: 0.5

