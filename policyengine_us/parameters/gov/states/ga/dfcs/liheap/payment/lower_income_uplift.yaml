description: Georgia provides this additional heating payment to households in income Level I under the Low Income Home Energy Assistance Program.
# Inferred: every printed Level I heating amount is the Level II amount plus
# $100 on the FY2025 and FY2026 matrices; the matrices print both columns,
# not this rule. Encode the printed Level I column if a matrix breaks the pattern.
values:
  2025-10-01: 100
