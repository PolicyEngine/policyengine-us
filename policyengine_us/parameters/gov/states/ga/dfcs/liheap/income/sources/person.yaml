description: Georgia counts these income sources of adult household members under the Low Income Home Energy Assistance Program.
# Interest is calculated separately after its disregard. State TANF is counted
# once at SPM-unit level. Signed net business inputs have no extra deduction.
values:
  2025-10-01:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    - partnership_s_corp_income
    - unemployment_compensation
    - social_security
    - ssi
    - pension_income
    - survivor_benefits
    - veterans_benefits
    - disability_benefits
    - workers_compensation
    - strike_benefits
    - general_assistance
    - rental_income
    - farm_rent_income
    - ordinary_dividend_income
    - capital_gains
    - alimony_income
    - child_support_received
metadata:
  unit: list
  period: year
  label: Georgia LIHEAP adult person income sources
  reference:
