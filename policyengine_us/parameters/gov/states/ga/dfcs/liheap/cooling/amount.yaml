description: Georgia provides this cooling payment by income level under the Low Income Home Energy Assistance Program.
# The matrices print one cooling amount per income level for every main heating
# fuel. FY2027 has no posted matrix, so the FY2026 amounts carry forward.
lower_income:
  2024-10-01: 500
higher_income:
  2024-10-01: 400
