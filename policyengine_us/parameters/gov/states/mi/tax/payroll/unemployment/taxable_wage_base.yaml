description: Michigan limits employer unemployment insurance taxes to this amount of each worker's annual wages.
values:
  # Michigan Compiled Laws Section 421.44(4) sets a $9,500 taxable wage limit
  # and cuts it to $9,000 for the year for each employer not delinquent in its
  # contributions when the trust fund holds at least $2.5 billion on the
  # preceding June 30 and the agency projects it will stay there for the next
  # quarter. PE-US uses the limit for a nondelinquent employer, which the
  # Unemployment Insurance Agency says most employers qualify for.
  2018-01-01: 9_000
  # The trust fund fell below $2.5 billion in 2020, which raised the limit to
  # $9,500 for 2021 through 2024.
  2021-01-01: 9_500
  # The $9,000 limit returned for 2025 and 2026.
  2025-01-01: 9_000

