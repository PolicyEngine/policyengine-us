description: Michigan counts these sources as qualifying retirement and pension benefits under MCL 206.30 and Form 4884. Under Michigan RAB 2023-22, distributions from defined contribution plans are deductible only to the extent attributable to employer or mandatory contributions; all distributions from such plans are modeled as eligible.
