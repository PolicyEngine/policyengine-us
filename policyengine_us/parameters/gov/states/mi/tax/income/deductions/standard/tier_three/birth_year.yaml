  - threshold:
      2017-01-01: 1953
    amount:
      2017-01-01: true
  - threshold:
      2020-01-01: 1954
      2021-01-01: 1955
      2022-01-01: 1956
      2023-01-01: 1957
      2024-01-01: 1958
      2025-01-01: 1959
