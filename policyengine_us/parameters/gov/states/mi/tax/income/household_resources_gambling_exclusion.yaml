description: Michigan excludes this amount of awards, prizes, lottery, bingo and other gambling winnings from household resources.
values:
  # MCL 206.510(1)(b): a fixed amount in the statute, not indexed. The
  # MI-1040CR counts winnings "over $300" on line 20, one amount for the
  # claimant and spouse. The model applies it to gambling_winnings; it has no
  # separate input for awards and prizes, and one entered as
  # miscellaneous_income counts in full on line 20.
  2021-01-01: 300
metadata:
