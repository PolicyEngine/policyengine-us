description: Michigan counts these household resources sources for every tax unit member, not only the claimant and spouse, as amounts the claimant receives for others in the household.
values:
  2021-01-01:
    # MI-1040CR line 21: Social Security, SSI and railroad retirement
    # benefits, including "amounts received for minor children or other
    # dependent adults who live with you".
    - social_security
    - ssi
    - railroad_benefits
    # MI-1040CR line 22: "child support and all payments received as a foster
    # parent".
    - child_support_received
    # MI-1040CR line 27: "the total payments made to your household by MDHHS
    # and all other public assistance payments". A Family Independence
    # Program grant covers the children in the case.
    - tanf
    - general_assistance
metadata:
  unit: list
  period: year
  label: Michigan household resources sources counted for every member
