  2018-01-01: 4_050
  2019-01-01: 4_400
  2020-01-01: 4_750
  2021-01-01: 4_900
  2022-01-01: 5_000
  2023-01-01: 5_400
  2024-01-01: 5_600
  2025-01-01: 5_800
  2026-01-01: 5_900

