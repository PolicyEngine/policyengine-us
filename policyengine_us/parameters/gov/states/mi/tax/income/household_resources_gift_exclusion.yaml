description: Michigan excludes this amount of gifts in cash or kind from nongovernmental sources from household resources.
values:
  # MCL 206.510(1)(a): a fixed amount in the statute, not indexed. The
  # MI-1040CR counts "the value over $300 in gifts" on line 24, one amount
  # for the claimant and spouse.
  2021-01-01: 300
