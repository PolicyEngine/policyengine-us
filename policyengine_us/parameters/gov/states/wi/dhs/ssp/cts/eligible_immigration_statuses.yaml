  # presence grounds that Handbook 3.1.4 item 2 lists.
  2026-01-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - CUBAN_HAITIAN_ENTRANT
    - DEPORTATION_WITHHELD
    - CONDITIONAL_ENTRANT
    - PAROLED_ONE_YEAR

