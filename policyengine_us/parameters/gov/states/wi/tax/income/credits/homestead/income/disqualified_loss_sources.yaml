description: Wisconsin adds back the losses from these person-level income sources to household income for the homestead credit.
values:
  2021-01-01:
    # Schedule 4, line 2: net business loss from a sole proprietorship
    # (Schedule C). SSTB and non-SSTB income are combined, as loss_ald
    # deducts the loss of their total.
    - total_self_employment_income
    - rental_income # line 4: net rental real estate and royalty loss
    # Form 4835 farm rental loss: rental real estate (71.52(1e)(d)) or net
    # farm loss (71.52(1e)(e)).
    - farm_rent_income
    - estate_income # line 7: net loss from a trust or estate
    - farm_operations_income # line 10: net farm loss (Schedule F)
