description: Colorado provides this family affordability tax credit base amount for each younger child.
values:
  2024-01-01: 3_200
  2025-01-01: 3_273
  # C.R.S. 39-22-130(6)(f): no credit is allowed below the 3% adjustment factor.
  # LCS R26-322 confirms the credit is unavailable for 2026 and projects
  # adjustment factors of 2.78% for 2027 and 2.71% for 2028, also below 3%.
  # The amount stays at zero from 2026 pending a later determination.
  2026-01-01: 0
