description: Colorado provides the following Taxpayer's Bill of Rights cash back amount for joint filers.
values:
  # SB 22-233 was a one-time refund of the state fiscal year 2021-22 TABOR
  # surplus, based on the 2021 return and paid in 2022, so it is booked to
  # 2021. The explicit zeros keep it out of other years. Without the 2020 zero,
  # backdating would copy the 2021 value into 2015-2020, where the backdated
  # 2021 refundable credits list would pay it.
  2020-01-01: 0
  2021-01-01: 1_500
  2022-01-01: 0
metadata:
  unit: currency-USD
  period: year
  label: Colorado TABOR cash back joint amount
  reference:
    # The act sets $800 plus a mandatory increase toward 85% of excess state
    # revenues, rounded to the nearest $50 per individual and doubled for joint
    # filers; DOR set the joint amount at $1,500 (2 x $750).
    - title: Colorado Senate Bill 22-233 (signed), Section 2, C.R.S. 39-22-2004(1)(c)(I)
      href: https://leg.colorado.gov/sites/default/files/2022a_233_signed.pdf#page=3
    - title: Colorado Senate Bill 22-233 (signed), Section 2, C.R.S. 39-22-2004(2)(d)(I)
      href: https://leg.colorado.gov/sites/default/files/2022a_233_signed.pdf#page=4
    - title: Colorado Senate Bill 22-233 (signed), Section 2, C.R.S. 39-22-2004(2)(d)(III)
      href: https://leg.colorado.gov/sites/default/files/2022a_233_signed.pdf#page=5
    - title: Colorado Legislative Council Staff, SB 22-233 Final Fiscal Note, Summary of Legislation
      href: https://leg.colorado.gov/sites/default/files/documents/2022A/bills/fn/2022a_sb233_f1.pdf#page=2
