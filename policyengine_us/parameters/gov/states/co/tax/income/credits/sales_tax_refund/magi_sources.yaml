description: >-
  Colorado accounts for these income sources for the modified adjusted gross income. The
  refund is attributed to the modeled eligibility tax year, even when the return and
  payment occur later. This is the residual sales tax refund mechanism, separate from
  Colorado Cash Back; in_effect controls whether the refund is available.
values:
  1999-01-01:
    - adjusted_gross_income
    # "Social security benefits excluded from federal adjusted gross income":
    # the filers' own, Form 1040 line 6a less line 6b (DR 0104 line 35). A tax
    # unit dependent's benefits are the dependent's own.
    - filer_tax_exempt_social_security
#    - non_taxable_interest_income_from_state_and_local_bonds
