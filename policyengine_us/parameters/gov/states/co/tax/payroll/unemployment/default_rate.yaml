description: Colorado assigns this combined premium rate, including any support and solvency surcharges, to each new employer outside the construction industry.
values:
  # No solvency surcharge applied from 2018 to 2023.
  2018-01-01: 0.017
  # The 1.53% beginning rate and 0.17% support surcharge, which Senate Bill
  # 23-232 split from the former 1.70% rate, plus the 1.35% solvency
  # surcharge.
  2024-01-01: 0.0305

