description: Colorado adds this amount to the parent fee for each child in care after the first when gross countable income exceeds the federal poverty guideline under the Child Care Assistance Program.
values:
  2021-07-01: 15
  # Section 3.124(P), which holds this fee, runs through July 31, 2028; the
  # section 3.124(Q) formula that follows has no fee for additional children.
  2028-08-01: 0
metadata:
