description: Colorado multiplies the parent fee by this factor, by the highest quality rating among the household's child care providers, under the Child Care Assistance Program.
metadata:
  type: single_amount
  threshold_unit: Child care facility quality rating
  amount_unit: /1
  label: Colorado Child Care Assistance Program parent fee factor by provider quality rating
  reference:
    - title: 8 CCR 1403-1 Section 3.124(H), Parent fees (effective 2026-08-14)
      href: https://www.sos.state.co.us/CCR/GenerateRulePdf.do?ruleVersionId=12658&fileName=8%20CCR%201403-1#page=81
# Levels 3 to 5 are the top three levels of Colorado Shines, the Department's
# quality rating system, and cut the fee by 20%.
brackets:
  - threshold:
      2022-10-01: 0
    amount:
      2022-10-01: 1
  - threshold:
      2022-10-01: 3
    amount:
      2022-10-01: 0.8
