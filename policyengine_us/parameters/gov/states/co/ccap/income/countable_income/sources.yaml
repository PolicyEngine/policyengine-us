description: Colorado counts these income sources as countable income under the Child Care Assistance Program.
values:
  2020-01-01:
    # Earned income
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    # Unearned income
    - social_security
    - pension_income
    - retirement_distributions
    - military_retirement_income
    - total_unemployment_compensation
    - workers_compensation
    - child_support_received
    - alimony_income
    - interest_income
    - dividend_income
    - rental_income
    - veterans_benefits
    - disability_benefits
    - capital_gains
    - gi_cash_assistance

metadata:
  unit: list
  period: year
  label: Colorado CCAP countable income sources
  reference:
