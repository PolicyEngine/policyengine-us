description: Colorado uses federal poverty guidelines from this many years before the calendar year in which the heating season ends under the Low-income Energy Assistance Program.
# FY2026 uses the 2025 FPG and FY2027 the 2026 FPG (the rules incorporate
# LIHEAP IM 2026-01); earlier backfilled years are unverified.
values:
