description: Colorado counts these earned income sources under the Low-income Energy Assistance Program.
# Existing net business income is used without another expense deduction.
# partnership_s_corp_income nets the two business types before the source floor.
# Enter basic pay in military_basic_pay or employment_income, not both.
values:
  2025-11-01: ["employment_income", "military_basic_pay", "self_employment_income", "sstb_self_employment_income", "farm_operations_income", "partnership_s_corp_income"]

