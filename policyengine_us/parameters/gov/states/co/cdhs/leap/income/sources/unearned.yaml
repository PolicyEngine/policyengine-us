description: Colorado counts these unearned income sources before separately rounding Social Security and SSI under the Low-income Energy Assistance Program.
# Social Security and SSI are separately truncated per recipient monthly.
# Take-up-gated TANF is added once at SPM-unit level. Survivor benefits exclude
# SSA survivors; pension totals already include their public/private parts.
# Military retirement includes Survivor Benefit Plan annuities.
# Retirement distributions aggregate IRA, 401(k), SEP, 403(b), and Keogh.
# OAP and the AND state supplement are public assistance income (3.752.21 L).
# Railroad retirement and trust payments are periodic payments (3.752.211 G, K).
# miscellaneous_income and gi_cash_assistance fall under the catch-all for
# payments from any other source (3.752.21). Generic gifts are limited to
# financial_assistance. GI educational benefits and source-specific exclusions
# lack exact inputs.
values:
  2025-11-01: ["rental_income", "farm_rent_income", "interest_income", "ordinary_dividend_income", "total_unemployment_compensation", "strike_benefits", "pension_income", "military_retirement_income", "railroad_benefits", "retirement_distributions", "survivor_benefits", "disability_benefits", "workers_compensation", "veterans_benefits", "general_assistance", "co_oap", "co_state_supplement", "estate_income", "alimony_income", "child_support_received", "financial_assistance", "gambling_winnings", "miscellaneous_income", "gi_cash_assistance"]

