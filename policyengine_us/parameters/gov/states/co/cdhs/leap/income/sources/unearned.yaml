description: Colorado counts these unearned income sources before separately rounding Social Security and SSI under the Low-income Energy Assistance Program.
# Social Security and SSI are separately truncated per recipient monthly.
# Take-up-gated TANF is added once at SPM-unit level. Survivor benefits exclude
# SSA survivors; pension totals already include their public/private parts.
# Retirement distributions aggregate IRA, 401(k), SEP, 403(b), and Keogh.
# Generic gifts are limited to financial_assistance; irregular receipts,
# GI educational benefits and source-specific exclusions lack exact inputs.
values:
  2025-11-01: ["rental_income", "farm_rent_income", "interest_income", "dividend_income", "total_unemployment_compensation", "strike_benefits", "pension_income", "military_retirement_pay", "retirement_distributions", "survivor_benefits", "disability_benefits", "workers_compensation", "veterans_benefits", "general_assistance", "co_oap", "alimony_income", "child_support_received", "financial_assistance", "gambling_winnings"]

metadata:
  unit: list
