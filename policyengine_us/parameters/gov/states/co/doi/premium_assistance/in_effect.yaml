description: Colorado provides state premium assistance when this is true under the Colorado Premium Assistance program.
values:
  # HB25B-1006 (2025 First Extraordinary Session) authorized CPA only if Congress
  # did not extend the enhanced federal Premium Tax Credit by 2025-12-31; that
  # trigger condition occurred, so the program went live for plan year 2026.
  # The 2028-01-01 end date is VERIFIED, not a carry-forward assumption: SB26-178
  # (enacted July 2026) extends CPA "at its current levels" through plan year
  # 2027, so PY2026 and PY2027 are in effect and PY2028+ is unfunded/unknown.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

metadata:
