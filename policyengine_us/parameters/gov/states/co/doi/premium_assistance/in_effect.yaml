description: Colorado provides state premium assistance when this is true under the Colorado Premium Assistance program.
values:
  # HB25B-1006 (2025 First Extraordinary Session, enrolled act) authorized CPA
  # only if Congress did not extend the enhanced federal Premium Tax Credit by
  # 2025-12-31; that trigger condition occurred, so the program went live for
  # plan year 2026. DOI Amended Regulation 4-2-78 (3 CCR 702-4, eff.
  # 2025-11-30) sections 3 and 5 implement the program for 2026.
  # From 2027 the program continues with no end date:
  # - SB26-178 (signed 2026-06-03), C.R.S. 10-16-1205(2)(f)(I), allocates
  #   revenues "ASSESSED FOR THE 2027 CALENDAR YEAR AND FOR EACH CALENDAR YEAR
  #   THEREAFTER", including at least 25% "TO REDUCE THE COSTS OF INDIVIDUAL
  #   HEALTH BENEFIT PLANS FOR INDIVIDUALS WHO PURCHASE AN INDIVIDUAL HEALTH
  #   BENEFIT PLAN ON THE EXCHANGE" ((2)(f)(I)(C)).
  # - DOI Amended Regulation 4-2-78 (adopted 2026-08-11, effective 2026-09-30)
  #   applies "starting in benefit year 2027 and annually thereafter" (section
  #   3) and provides the subsidy "For the 2027 benefit year, and annually
  #   thereafter" (section 5).
  # Neither source repeals the program or sets different amounts for 2028 or
  # later, so the program stays in effect and the 2027 amounts carry forward
  # under section 5's "annually thereafter". What is specific to 2027 is the
  # financing: section 6 of the rule provides carrier payments "for the 2027
  # benefit year", and the only 2028 date in part 12, section 10-16-1212(3),
  # repeals a feasibility study, not the program.
  # Doc note: the Colorado Premium Assistance rulemaking authority is
  # section 10-16-1207(5); section 10-16-1215 is the OmniSalud rulemaking
  # authority, a separate program, and does not govern CPA.
  0000-01-01: false
  2026-01-01: true

