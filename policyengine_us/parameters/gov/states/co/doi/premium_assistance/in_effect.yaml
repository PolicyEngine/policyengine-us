description: Colorado provides state premium assistance when this is true under the Colorado Premium Assistance program.
values:
  # HB25B-1006 (2025 First Extraordinary Session, enrolled act) authorized CPA
  # only if Congress did not extend the enhanced federal Premium Tax Credit by
  # 2025-12-31; that trigger condition occurred, so the program went live for
  # plan year 2026. DOI Amended Regulation 4-2-78 (3 CCR 702-4) sections 3 and 5
  # implement the program for 2026 and each plan year thereafter.
  # SB26-178 (signed 2026-06-03) funds Colorado Premium Assistance for plan year
  # 2027 (SB26-178 section 10-16-1205(2)(f), "each calendar year thereafter").
  # 2028-01-01: false is a conservative carry-forward, not a repealer: no repealer
  # touches CPA; the only 2028 date, section 10-16-1212(3), repeals a feasibility
  # study, not the program itself.
  # TODO re-verify against the DOI fall-2026 Reg 4-2-78 amendment cycle, which may
  # extend funded plan years beyond 2027.
  # Doc note: the Colorado Premium Assistance rulemaking authority is
  # section 10-16-1207(5); section 10-16-1215 is the OmniSalud rulemaking
  # authority, a separate program, and does not govern CPA.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

