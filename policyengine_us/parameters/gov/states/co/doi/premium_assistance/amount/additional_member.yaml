description: Colorado provides this amount for each additional household member under the Colorado Premium Assistance program.
values:
  # The $80/$29/5-member/100-400% FPL design is administrative (HIAE board /
  # Connect for Health Colorado), not verbatim in HB25B-1006 or the DOI
  # regulations. The Connect for Health Colorado page 403's to bots, so its
  # values are corroborated by Boulder County (gov), healthinsurance.org, ACA
  # Signups, and the Spanish-language mirror of the same site.
  # Do NOT use the $18 additional-member figure from DOI Emergency Regulation
  # 25-E-03: that was a superseded pre-launch rate-filing contingency.
  2026-01-01: 29

