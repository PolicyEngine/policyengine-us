description: Colorado provides this amount for each additional household member under the Colorado Premium Assistance program.
values:
  # $29 per-member-per-month (PMPM) for each additional enrolled member, per DOI
  # Amended Regulation 4-2-78 (3 CCR 702-4, eff. 2025-11-30) section 5.B.2, which
  # also limits the enhanced subsidy to no more than three dependents under age 21
  # (subsequent $0-premium dependents receive no enhanced subsidy).
  # Do NOT use the $18 additional-member figure from DOI Emergency Regulation
  # 25-E-03: that was a superseded pre-launch rate-filing contingency.
  # Doc note: the reg establishes a $0 floor (subsidy cannot exceed the member's
  # premium); the Connect for Health Colorado FAQ phrases this as premiums "as
  # low as $1", which conflicts with the section 5.B $0-floor and is not modeled.
  # Doc note: payments are subject to unmodeled budget/enrollment-slot caps.
  2026-01-01: 29

metadata:
  unit: currency-USD
