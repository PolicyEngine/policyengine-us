description: Colorado provides this amount for the first household member under the Colorado Premium Assistance program.
values:
  # $80 per-member-per-month (PMPM) for the first enrolled member, per DOI
  # Amended Regulation 4-2-78 (3 CCR 702-4, eff. 2025-11-30) section 5.B.1.
  # Do NOT use the $50 first-member figure from DOI Emergency Regulation 25-E-03:
  # that was a superseded pre-launch rate-filing contingency (<=200% FPL).
  # Doc note: the reg establishes a $0 floor (subsidy cannot exceed the member's
  # premium); the Connect for Health Colorado FAQ phrases this as premiums "as
  # low as $1", which conflicts with the section 5.B $0-floor and is not modeled.
  # Doc note: the reg subjects payments to unmodeled budget/enrollment-slot caps
  # (the act appropriates up to $50M; the HIAE board sets a slot input).
  2026-01-01: 80

metadata:
  unit: currency-USD
