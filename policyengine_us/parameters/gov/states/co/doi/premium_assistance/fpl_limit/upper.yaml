description: Colorado limits eligibility to this share of the federal poverty line as an upper bound under the Colorado Premium Assistance program.
values:
  # 400% FPL upper bound, inclusive, per DOI Amended Regulation 4-2-78
  # (3 CCR 702-4, eff. 2025-11-30) section 4.C. The amended regulation
  # effective 2026-09-30 (2027 benefit year onward) keeps the same section 4.C
  # definition: household income "no greater than 400% of the Federal Poverty
  # Level".
  2026-01-01: 4

