description: Colorado does not deem income to an Aid to the Needy Disabled-Colorado Supplement client from a spouse or parent who receives Adult Financial grant payments or Medicaid with income no greater than the SSI limit, if this is true.

values:
  # Before March 2020, 3.545(F) excluded only the income from those benefits,
  # not the recipient's other income.
  2002-01-01: false
  2020-03-01: true

metadata:
  unit: bool
  label: Colorado AND-CS deeming exemption for Adult Financial and Medicaid recipients
