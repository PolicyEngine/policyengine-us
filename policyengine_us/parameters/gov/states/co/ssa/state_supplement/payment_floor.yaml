description: Colorado raises an Aid to the Needy Disabled-Colorado Supplement grant below this amount to it with a state supplementary payment.

values:
  # Before 2026 Colorado met the SSI pass-along requirement by maintaining
  # total expenditures, with irregular lump-sum payments and no payment floor.
  2002-01-01: 0
  2026-01-01: 13

