description: Colorado counts these income sources as gross unearned income for the Old Age Pension, before disregards.

values:
  # 3.520.785(B) lists countable unearned income. 3.520.786 exempts the
  # unearned income SSA excludes (K), which includes interest and dividends
  # on countable resources (20 CFR 416.1124(c)(22)), and child support
  # received for another person (N) or arrears received for the client (P).
  2014-03-02:
    - pension_income
    - social_security
    - disability_benefits
    - veterans_benefits
    - survivor_benefits
    - workers_compensation
    - unemployment_compensation
    - retirement_distributions
    - gi_cash_assistance
    - alimony_income
    - financial_assistance
    - rental_income

metadata:
  unit: list
