description: Colorado deducts this share of the SSI benefit standard for an individual, less the child's own income, for each dependent child in the household when deeming a spouse's unearned income to an Old Age Pension client.

values:
  # OAP rules moved from 9 CCR 2503-3 to 9 CCR 2503-5 on March 2, 2014.
  2014-03-02: 0.5

