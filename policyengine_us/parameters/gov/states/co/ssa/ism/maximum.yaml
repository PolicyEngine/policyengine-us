description: Colorado counts up to this amount of in-kind support and maintenance for shelter as unearned income of an Old Age Pension or Aid to the Needy Disabled-Colorado Supplement client.

values:
  # 9 CCR 2503-5 3.520.79(E): one-third of the SSI benefit standard plus a
  # $20 disregard, rounded to the nearest dollar. The rule publishes $284 for
  # 2021, a dollar below that formula's $285; the published amounts are used.
  2014-01-01: 260
  2015-01-01: 264
  2017-01-01: 265
  2018-01-01: 270
  2019-01-01: 277
  2020-01-01: 281
  2021-01-01: 284
  2022-01-01: 300
  2023-01-01: 325
  2024-01-01: 334
  2025-01-01: 342
  2026-01-01: 351

