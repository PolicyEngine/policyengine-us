description: Before 2014 Colorado counted this share of the Aid to the Needy Disabled-Colorado Supplement grant standard as unearned income when food was supplied in full at no cost.

values:
  # The earliest rule text on the Secretary of State's site is the table
  # effective January 1, 2004; it is applied from 2002, the first year of the
  # grant standard. The table effective January 1, 2014 dropped the food
  # component.
  2002-01-01: 0.205
  2014-01-01: 0

