description: Before 2014 Colorado counted up to this share of the Aid to the Needy Disabled-Colorado Supplement grant standard as in-kind support and maintenance for shelter and utilities.

values:
  # The earliest rule text on the Secretary of State's site is the table
  # effective January 1, 2004; it is applied from 2002, the first year of the
  # grant standard. From 2014 the cap is a dollar amount (ism/maximum.yaml).
  2002-01-01: 0.37
  2007-01-01: 0.366

