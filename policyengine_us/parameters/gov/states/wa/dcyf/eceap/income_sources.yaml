description: Washington counts these income sources when determining family income for the Early Childhood Education and Assistance Program.

values:
  2021-07-25:
    - market_income
    - tanf
    - ssi
    - social_security
    # DCYF 05-006 Section 9 lists "Social Security or other retirement
    # benefits" and "Retirement or pension plans".
    - railroad_benefits
    - child_support_received
    - total_unemployment_compensation
    - veterans_benefits
    - workers_compensation

metadata:
  unit: list
  period: year
  label: Washington ECEAP family income sources
  reference:
    - title: DCYF 05-006 ECEAP Prescreen and Application (Combined Form, revised 04/2025), Section 9 - Income Received by Child's Parent(s) or Guardian(s)
      href: https://www.dcyf.wa.gov/sites/default/files/forms/05-006.pdf#page=7
    - title: RCW 43.216.505 Eligible children
      href: https://app.leg.wa.gov/RCW/default.aspx?cite=43.216.505
