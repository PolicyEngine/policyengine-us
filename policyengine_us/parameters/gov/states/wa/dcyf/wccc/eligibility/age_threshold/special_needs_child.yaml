description: Washington limits eligibility for children with a verified special need or under court supervision to under this age under the Working Connections Child Care program.
# RCW 43.216.802(2)(a)(ii) and WAC 110-15-0005(3)(b)(ii)(A)-(B) set the same
# under-19 limit for both routes, matching the CCDF Plan's upper age of 18.00.
values:
  2019-04-26: 19

