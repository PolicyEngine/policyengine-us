description: Washington limits eligibility for children with a verified special need to under this age under the Working Connections Child Care program.
# RCW 43.216.802(2)(a)(ii) and WAC 110-15-0005(3)(b)(ii)(B) apply the same
# under-19 limit to a child under court supervision, so the court-supervision
# route shares this ceiling (CCDF Plan FFY 2025-2027 section 2.2.1(c), upper
# age 18.00).
values:
  2019-04-26: 19

