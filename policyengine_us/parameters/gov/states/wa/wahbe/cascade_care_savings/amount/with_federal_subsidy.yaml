description: Washington provides this monthly amount per member with federal subsidies under the Cascade Care Savings program.
values:
  # Group 1: enrollees receiving federal subsidies (Advance Premium Tax Credit).
  # PY2026 maximum per-member per-month (PMPM) assistance is $55 (down from $155
  # in PY2025). There is NO age split; the survey figure of "$30 per child" was
  # incorrect. Amount set annually by the WAHBE Board within the appropriation.
  2026-01-01: 55

metadata:
  unit: currency-USD
  period: month
  label: Washington Cascade Care Savings monthly amount per member with federal subsidies
