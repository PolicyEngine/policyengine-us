description: Washington provides this monthly amount per member without federal subsidies under the Cascade Care Savings program.
values:
  # Groups 2 and 3: enrollees without federal subsidies (including the Section 1332
  # waiver population without a federally recognized immigration status). PY2026
  # maximum per-member per-month (PMPM) assistance is $250 (unchanged from PY2025).
  # Group 2 (lawfully present but Advance-Premium-Tax-Credit-ineligible) is not
  # separately identifiable in the model; the modeled without-subsidy population is
  # Group 3, which uses this same amount. Amount set annually by the WAHBE Board.
  2026-01-01: 250

metadata:
  unit: currency-USD
  period: month
  label: Washington Cascade Care Savings monthly amount per member without federal subsidies
