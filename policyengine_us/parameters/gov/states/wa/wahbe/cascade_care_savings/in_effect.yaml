description: Washington provides premium assistance when this is true under the Cascade Care Savings program.
values:
  # RCW 43.71.110 (established by SB 5377, 2021) is permanent law; the program is
  # funded through each state Operating Budget ($55M appropriated for PY2026;
  # the final PY2026 policy's Section 5 footnote 1 says only that "any funding
  # contingent on continued waiver approval" is reserved for the non-federally-
  # subsidized population — the $5M figure appears in the PY2025 policy and the
  # PY2026 draft, not the adopted PY2026 text). PY2026 coverage runs Jan 1 -
  # Dec 31, 2026.
  # No end date: the program has no statutory sunset, so PY2027+ carries the PY2026
  # design forward as a current-law assumption (WAHBE Board sets amounts annually
  # within the appropriation).
  0000-01-01: false
  2026-01-01: true

