description: Washington qualifies a veteran entitled to and receiving VA compensation for the senior citizens and disabled persons property tax exemption at a combined service-connected evaluation rating of at least this share.
values:
  # 2015 3rd sp.s. c 30 s 2: only a total disability rating qualifies.
  2016-01-01: .inf
  # 2019 c 453 s 1, for taxes levied for collection in 2020 and after (s 9).
  2020-01-01: 0.8
  # 2025 c 200 s 1, for taxes levied for collection in 2027 and after (s 3).
  2027-01-01: 0.4
metadata:
  unit: /1
  period: year
  label: Washington senior and disabled property tax exemption veteran combined rating threshold
