description: Washington qualifies senior claimants for its senior citizens and disabled persons property tax exemption at this minimum age at collection-year end.
values:
  # RCW 84.36.381 requires age 61 by December 31 of the filing year.
  # Taxes come due in the following year: 61 + 1 = 62 at collection-year end.
  2008-01-01: 62

