description: Washington requires a veteran claiming the senior citizens and disabled persons property tax exemption to be entitled to and receiving VA compensation at a qualifying service-connected disability rating, if this is true.
values:
  # 2008 c 6 s 706, RCW 84.36.381(3)(b): a veteran "with one hundred percent
  # service-connected disability as provided in 42 U.S.C. Sec. 423(d)(1)(A)".
  2008-01-01: false
  # 2015 3rd sp.s. c 30 s 2, for taxes levied for collection in 2016 and after.
  2016-01-01: true
metadata:
