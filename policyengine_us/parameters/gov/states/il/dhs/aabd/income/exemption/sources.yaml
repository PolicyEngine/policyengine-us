description: Illinois counts the following expense sources as exempted from earned income under the Aid to the Aged, Blind or Disabled program.
values:
  2021-01-01:
    # Each source must be a Person-level amount for the person's own
    # employment. A tax-unit variable here would give every member the
    # whole unit's amount. il_withheld_income_tax is the person's own
    # Illinois withholding estimate, computed on their own AGI.
    - il_withheld_income_tax
    - employee_social_security_tax
    - il_aabd_child_care_expense_exemption
    # Federal and city withholding taxes
    # transportation cost
    # lunch supplementation
    # Special tools and uniforms required by employment
    # Union dues
    # Group life insurance premiums
    # Group health insurance premiums
    # Retirement plan withholdings
    # The reasonable cost of items and services which are needed and used to enable a disabled person to work

metadata:
  unit: list
  period: year
  label: Illinois AABD expenses exemption sources
  reference:
    - title: Ill. Admin. Code tit. 89, § 113.125 - Recognized Employment Expenses
      href: https://www.law.cornell.edu/regulations/illinois/Ill-Admin-Code-tit-89-SS-113.125
    # Health Benefits for Workers with Disabilities deducts these expenses
    # through 89 Ill. Adm. Code 120.510(i).
    - title: Ill. Admin. Code tit. 89, § 120.370(a) - Recognized Employment Expenses
      href: https://www.law.cornell.edu/regulations/illinois/Ill-Admin-Code-tit-89-SS-120.370
