description: Illinois sets this premium component for the Health Benefits for Workers with Disabilities program based on unearned income bracket.
metadata:
  type: single_amount
  threshold_unit: currency-USD
  amount_unit: currency-USD
  period: month
  label: Illinois HBWD unearned income premium component
  reference:
    # Summing the first column (earned) and first row (unearned) reproduces 434 of the 441
    # cells in 120.510(n)(3); see issue 10471 for the others.
    # Thresholds are the chart's band starts (0-250, 251-500, ..., 4751-5000, 5000+), so income of
    # exactly $250 stays in the first band; $5,000 falls in the 4751-5000 band.
    - title: 89 Ill. Admin. Code § 120.510 (n)
      href: https://www.law.cornell.edu/regulations/illinois/Ill-Admin-Code-tit-89-SS-120.510
