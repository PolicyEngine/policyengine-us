description: >-
  Illinois provides this income tax rebate amount for joint filers, based on federal
  adjusted gross income. PolicyEngine attributes this one-time rebate to eligibility tax
  year 2021, determined from that year's return, although it was paid in 2022.
  Later-year standalone calculations do not establish inclusion in credit totals.
