description: >-
  Illinois provides an income tax rebate amount for up to this number of dependents.
  PolicyEngine attributes this one-time rebate to eligibility tax year 2021, determined
  from that year's return, although it was paid in 2022. Later-year standalone
  calculations do not establish inclusion in credit totals.
values:
  2021-01-01: 3
metadata:
  unit: int
  period: year
  label: Illinois income tax rebate max dependents
  reference:
    - title: Illinois Statutes Chapter 35. Revenue § 5/212.1. Individual income tax rebates (a)
      href: https://www.ilga.gov/Documents/legislation/publicacts/102/PDF/102-0700.pdf#page=131
