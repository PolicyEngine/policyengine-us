      href: https://gov.illinois.gov/newsroom/press-release.25425.html
    - title: Public Act 102-0700, Section 40-10 (35 ILCS 5/208.5, one-time property tax rebate)
      href: https://ilga.gov/documents/legislation/publicacts/102/102-0700.htm
    - title: 35 ILCS 5/208 (property tax credit and its AGI limits)
      href: https://www.ilga.gov/documents/legislation/ilcs/documents/003500050K208.htm
