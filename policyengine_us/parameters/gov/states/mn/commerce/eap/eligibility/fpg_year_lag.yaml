description: Minnesota uses the poverty guidelines from this many years before the model year for the federal income floor under the Energy Assistance Program.
# HHS makes each January's guidelines mandatory for LIHEAP from the next
# October 1. The FFY2026 table prints 110% of the 2025 guidelines for sizes 19
# and 20 ($10,509 and $11,013 a month), and the FFY2027 table prints 110% of
# the 2026 guidelines ($10,835 and $11,355).
values:
  2025-10-01: 1
metadata:
  unit: year
  period: year
  label: Minnesota EAP poverty guideline year lag
