description: Minnesota limits the Paid Leave small employer premium rate to employers whose average quarterly wage is at most this amount, 150 percent of the state's average wage in covered employment for the basis period.
values:
  0000-01-01: 0
  # Basis period October 2024 to September 2025, for 2026 premiums.
  2026-01-01: 27_745.88

