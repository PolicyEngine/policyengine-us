description: Minnesota uses this statewide average annual wage in covered employment for the small employer wage test under the Paid Leave program.
values:
  # Earlier years read the 2026 value; the zero rate keeps every amount at 0
  # before 2026 unless a reform sets an earlier rate.
  0000-01-01: 73_989
  # Statewide average annual wage for 2025 ("$73,989 per year"), applied to
  # 2026 premiums, whose basis period is October 2024 to September 2025.
  2026-01-01: 73_989
  # No Department of Employment and Economic Development figure for 2027
  # premiums as of 2026-10-20, so the 2026 value carries forward; update it
  # when the department issues 2027 small employer designations.

metadata:
  period: year
  unit: currency-USD
  label: Minnesota Paid Leave state average annual wage
  reference:
