description: Minnesota requires employers to pay at least this share of the Paid Leave premium; employees pay the remaining portion, if any, through a wage deduction.
values:
  # Earlier years read the 2026 value; the zero rate keeps every amount at 0
  # before 2026 unless a reform sets an earlier rate.
  0000-01-01: 0.5
  2026-01-01: 0.5

metadata:
  period: year
  unit: /1
  label: Minnesota Paid Leave employer minimum premium share
