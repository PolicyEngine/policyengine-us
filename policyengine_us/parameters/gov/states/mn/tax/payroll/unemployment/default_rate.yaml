description: Minnesota assigns each new employer a rate based on its industry, so this parameter uses the average employer contribution rate on taxable wages.
values:
  # The Department of Labor's average employer contribution rates on taxable
  # wages; the Department of Employment and Economic Development publishes no
  # comparable series. Leaves out the 0.1% workforce development fee.
  2018-01-01: 0.0116
  2019-01-01: 0.0111
  2020-01-01: 0.0107
  2021-01-01: 0.0109
  2022-01-01: 0.0097
  2023-01-01: 0.0091
  2024-01-01: 0.009
  2025-01-01: 0.0092
  # Department of Labor estimate.
  2026-01-01: 0.0153

metadata:
