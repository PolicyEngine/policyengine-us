description: Minnesota provides the full public pension income subtraction for filers with adjusted gross income below this amount, based on filing status.
metadata:
  label: Minnesota public pension income subtraction agi threshold
  period: year
  unit: currency-USD
  uprating:
    parameter: gov.irs.uprating
    rounding:
      type: nearest
      interval: 10
  propagate_metadata_to_children: true 
  breakdown:
  - filing_status
  reference:
  - title: Minnesota Statutes 290.0132 Subd. 26.Social Security benefits. (f)(g)(h)(j)
    href: https://www.revisor.mn.gov/statutes/cite/290.0132#stat.290.0132.26
  - title: 2023 M1M, Income Additions and Subtractions
    href: https://www.revenue.state.mn.us/sites/default/files/2024-04/m1m-23_0.pdf#page=7
  - title: 2024 M1QPEN, Qualified Public Pension Subtraction
    href: https://www.revenue.state.mn.us/sites/default/files/2024-12/m1qpen-24.pdf#page=1
  - title: 2025 M1QPEN, Qualified Public Pension Subtraction
    href: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1qpen-25.pdf#page=1
  - title: Minnesota Department of Revenue, Tax Year 2026 Inflation-Adjusted Amounts, 290.0132 Subd. 34 Public Pension Subtraction Phase-out Threshold
    href: https://www.revenue.state.mn.us/sites/default/files/2025-12/inflation-adjusted-amounts-2026.pdf#page=2

