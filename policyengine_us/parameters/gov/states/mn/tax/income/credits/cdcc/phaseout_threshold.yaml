description: Minnesota has a child/dependent care credit which begins to be phased out when federal AGI exceeds this threshold.
values:
  # SOFTWARE COMPATIBILITY ONLY: preserve the old pre-2017 fallback.
  # Do not treat $53,630 as a sourced legal threshold for 2015 or 2016.
  2015-01-01: 53_630
  2017-01-01: 50_000
  2018-01-01: 50_990
  2019-01-01: 52_230
  2020-01-01: 53_100
  2021-01-01: 53_630
  2022-01-01: 55_300
  2023-01-01: 59_210
  2024-01-01: 62_410
  2025-01-01: 64_150
  2026-01-01: 65_610

