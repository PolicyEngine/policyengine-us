description: Minnesota counts these Retirement, Survivors, and Disability Insurance sources under the Child Care Assistance Program, to the extent they exceed the federal maximum Supplemental Security Income payment.
values:
  2025-01-01:
    # Listed as components rather than the social_security umbrella, which also
    # adds social_security_dependents.
    - social_security_retirement
    - social_security_survivors
    - social_security_disability

