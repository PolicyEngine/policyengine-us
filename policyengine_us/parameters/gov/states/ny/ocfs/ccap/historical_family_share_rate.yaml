description: New York applied this family share rate to income above the federal poverty guideline under the Child Care Assistance Program before the statewide rate took effect.
# SSL 410-x(6), as amended effective April 16, 2021, caps the income-based
# family share at 10% of income exceeding the federal poverty level. Districts
# elect a whole percentage of at least 1% but no more than 10% under
# 18 NYCRR 415.3(e)(3), and OCFS automatically amended the Child and Family
# Services Plan of every district electing above 10% down to 10%, retroactive
# to April 16, 2021. The statutory 10% cap is modeled statewide; district
# elections below 10% are not modeled.
values:
  2021-04-16: 0.1

