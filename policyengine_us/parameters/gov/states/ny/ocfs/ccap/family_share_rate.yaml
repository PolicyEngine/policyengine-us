description: New York applies this rate to income above the state income standard under the Child Care Assistance Program.
# The 10% figure is the statutory ceiling, applied statewide because districts
# electing above it were amended down to exactly 10%. It therefore overstates
# the share for any district that elected lower, by at most nine points of
# income above the standard.
values:
  2021-04-16: 0.1
  2023-10-01: 0.01

