description: New York classifies children into these age bands for Child Care Assistance Program market rates.
# 24-OCFS-LCM-22 §III.3 and 19-OCFS-LCM-23 §III.2 give the same four bands
# across every modeled era. Center-based providers — day care centers,
# school-age child care programs, and legally exempt group programs — use a
# lower infant ceiling than home-based providers.
# age is a float in PolicyEngine, so 1.5 encodes eighteen months exactly.
center_infant_upper_bound:
  2019-05-01: 1.5
home_infant_upper_bound:
  2019-05-01: 2
toddler_upper_bound:
  2019-05-01: 3
preschool_upper_bound:
  2019-05-01: 6

