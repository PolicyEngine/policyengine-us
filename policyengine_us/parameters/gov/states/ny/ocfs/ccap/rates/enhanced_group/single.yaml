description: New York districts pay this fraction of the day care center market rate to legally exempt group child care programs meeting either the enhanced health requirement or the enhanced training requirement.
# New York City publishes enhanced rates in FS-023. Outside New York City,
# use the standard group rates because no district enhancement was confirmed.
# A zero fraction preserves the standard rate rather than creating an enhancement.
GROUP_1:
  2024-10-01: 0
GROUP_2:
  2024-10-01: 0
GROUP_3:
  2024-10-01: 0
GROUP_4:
  2024-10-01: 0.81

metadata:
