description: New York caps Child Care Assistance Program income eligibility at a multiple of the federal poverty guideline when this is in effect.
# The state income standard limit — 200% through July 31, 2022 and 300% from
# August 1, 2022 — lapsed when the statutory revisions to Social Services Law
# 410-u and 410-w took effect on October 1, 2023 and replaced it with the
# state median income ceiling alone.
values:
  2021-10-01: true
  2023-10-01: false

metadata:
  unit: bool
  period: year
  label: New York CCAP federal poverty guideline limit in effect
  reference:
    - title: NYS Register, May 1, 2024, Rule Making Activities (OCFS), expansion of income eligibility from 300% of the state income standard to 85% of the state median income effective October 1, 2023 (file page 12 = printed page 6)
      href: https://dos.ny.gov/system/files/documents/2024/05/050124.pdf#page=12
