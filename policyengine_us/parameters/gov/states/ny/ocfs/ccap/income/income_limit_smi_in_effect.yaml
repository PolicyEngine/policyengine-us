description: New York caps Child Care Assistance Program income eligibility at a share of the state median income when this is in effect.
# The state median income ceiling binds alongside the state income standard
# limit from 2022-08-01, and alone once that limit lapses. Before 2022-08-01
# it applied only to mid-period changes, not initial eligibility.
values:
  2021-10-01: false
  2022-08-01: true

metadata:
  unit: bool
  period: year
  label: New York CCAP state median income limit in effect
  reference:
    - title: 22-OCFS-ADM-18, Increase in Income Eligibility Levels for Child Care Assistance, sec. V Program Implications (300% state income standard and 85% state median income both apply; 85% SMI is the lower of the two at family size eight or more)
      href: https://ocfs.ny.gov/main/policies/external/2022/adm/22-OCFS-ADM-18.pdf#page=6
    - title: NYS Register, May 1, 2024, Rule Making Activities (OCFS), compliance schedule for the October 1, 2023 statutory revisions to Social Services Law 410-u, 410-w and 410-x (file page 13 = printed page 7)
      href: https://dos.ny.gov/system/files/documents/2024/05/050124.pdf#page=13
