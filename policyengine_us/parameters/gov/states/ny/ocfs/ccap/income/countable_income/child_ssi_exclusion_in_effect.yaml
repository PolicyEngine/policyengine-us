description: New York excludes the SSI and state supplemental payments of children in the child care services unit from Child Care Assistance Program income if this is true.
# Before October 1, 2023, OCFS counted SSI, including State supplemental
# payments, for every member of the unit under 404.5(b)(5)(vi). OCFS added
# the child exclusion from October 1, 2023 through emergency rule
# CFS-42-23-00002-EP and adopted it permanently on June 12, 2024.
values:
  2021-10-01: false
  2023-10-01: true

metadata:
  unit: bool
  period: month
  label: New York CCAP child SSI exclusion in effect
