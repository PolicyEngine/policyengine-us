description: New York excludes the Supplemental Security Income of children in the child care services unit from Child Care Assistance Program countable income when this is in effect.
# An adult's SSI stays countable in both eras; only a child's is excluded, and
# only from the October 2023 rule.
values:
  2021-10-01: false
  2023-10-01: true

metadata:
  unit: bool
  period: year
  label: New York CCAP child SSI exclusion in effect
  reference:
    - title: 18 NYCRR 404.5(b)(5)(vi), SSI counted as public assistance income with the child exclusion
      href: https://ocfs.ny.gov/programs/childcare/regulations/404-Eligibility.pdf#page=10
    - title: 23-OCFS-ADM-18, 2023 Changes to Child Care Assistance Regulations, exclusion of the SSI of minor children regardless of designated payee
      href: https://ocfs.ny.gov/main/policies/external/2023/adm/23-OCFS-ADM-18.pdf#page=4
