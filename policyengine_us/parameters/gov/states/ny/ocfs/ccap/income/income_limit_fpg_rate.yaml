description: New York limits income to this multiple of the federal poverty guideline under the Child Care Assistance Program when the state median income limit is not in effect.
# The multiple applies to spm_unit_fpg because 18 NYCRR 415.1(k) defines the
# state income standard as the federal poverty guideline. 22-OCFS-ADM-18's
# table is headed "200% SIS (Through 7/31/22)" and "300% SIS (Effective
# 8/1/22)".
values:
  2021-10-01: 2
  2022-08-01: 3

metadata:
  unit: /1
  period: year
  label: New York CCAP income limit multiple of the federal poverty guideline
