description: New York counts these income sources under the Child Care Assistance Program.
values:
  2021-10-01:
    # market_income covers the non-government sources: wages, self-employment,
    # farm, rental, interest, dividends, pensions and alimony.
    - market_income
    # 18 NYCRR 404.5(b)(5)(iv): social security pensions and survivor benefits,
    # and permanent disability insurance payments made by the Social Security
    # Administration. PolicyEngine's social_security is OASDI only and already
    # includes the dependents, disability, retirement and survivors components,
    # so the component variables are not listed separately.
    - social_security
    - child_support_received
    - unemployment_compensation
    - workers_compensation
    # 18 NYCRR 404.5(b)(5): veterans' pensions are countable, and NY's CCDF
    # plan enumerates them explicitly.
    - veterans_benefits
    #
    # Counted but not listed here because the amount depends on who receives
    # it — see ny_ccap_countable_income:
    # - ssi, countable in full under 404.5(b)(5)(vi) until the October 2023
    #   rule excluded the SSI of any child in the child care services unit.
    #
    # Excluded sources, so simply not listed:
    # - tanf and other public assistance. These are countable under
    #   404.5(b)(5)(vi), but counting them closes a circular dependency:
    #   ny_ccap_countable_income -> tanf -> childcare_expenses ->
    #   child_care_subsidies -> ny_ccap -> ny_ccap_countable_income. The same
    #   hazard is documented on the federal ccdf_income variable and in
    #   gov/states/in/fssa/ccdf/income/sources.yaml. Omitting them understates
    #   countable income for public-assistance households, which is partly
    #   offset because 415.3(e)(1) exempts those households from the family
    #   share entirely.
    # - inheritance, which New York affirmatively declines to count.
metadata:
  unit: list
  label: New York CCAP countable income sources
  reference:
    - title: 18 NYCRR 404.5(b)(5), income to be counted in determining ability to pay
      href: https://ocfs.ny.gov/programs/childcare/regulations/404-Eligibility.pdf#page=10
    - title: New York FFY 2022-2024 CCDF State Plan, Q3.1.3(a), sources of income counted
      href: https://ocfs.ny.gov/programs/childcare/stateplan/assets/2022-plan/FFY2022-2024-CCDF-Plan.pdf#page=64
