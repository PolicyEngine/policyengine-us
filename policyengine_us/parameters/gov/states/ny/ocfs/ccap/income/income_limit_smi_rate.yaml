description: New York limits income to this share of the state median income under the Child Care Assistance Program.
# 22-OCFS-ADM-18 applied the 85% state median income ceiling to initial
# eligibility and redetermination from August 1, 2022, alongside the 300%
# state income standard limit. The revisions to Social Services Law 410-u(2),
# 410-w(1) and 410-w(3) effective October 1, 2023 then made it the sole
# limit. 85% of the state median income is the federal CCDF maximum at
# 45 CFR 98.20(a)(2).
values:
  2022-08-01: 0.85

