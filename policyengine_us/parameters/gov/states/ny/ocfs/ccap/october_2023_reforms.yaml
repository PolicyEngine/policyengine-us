description: New York's October 1, 2023 Child Care Assistance Program reforms are in effect.
# One instrument changed several rules at once, so a single switch gates the
# categorical eligibility routes and the protective-services family share
# exception. The income limit and family share rate changed on the same date
# but carry their own dated values.
values:
  2019-05-01: false
  2023-10-01: true

