description: New York applies these care-schedule thresholds when selecting a Child Care Assistance Program rate unit.
# Units differ by child: weekly_maximum_days counts days per week,
# weekly_minimum_hours is hours per week, the rest are hours per day.
# part_day_minimum_hours drops to zero when hourly rates end, which makes the
# hourly branch unreachable from that date.
weekly_minimum_hours:
  2019-05-01: 30
weekly_maximum_days:
  2019-05-01: 5
daily_minimum_hours:
  2019-05-01: 6
daily_maximum_hours:
  2019-05-01: 12
part_day_minimum_hours:
  2019-05-01: 3
  2022-06-01: 0

metadata:
  period: year
