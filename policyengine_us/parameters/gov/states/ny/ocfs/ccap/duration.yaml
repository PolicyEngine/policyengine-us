description: New York applies these care-schedule thresholds when selecting a Child Care Assistance Program rate unit.
# weekly_maximum_days counts days per week, weekly_minimum_hours is hours per
# week, and the daily bounds are hours per day.
weekly_minimum_hours:
  2019-05-01: 30
weekly_maximum_days:
  2019-05-01: 5
daily_minimum_hours:
  2019-05-01: 6
daily_maximum_hours:
  2019-05-01: 12

metadata:
  period: year
  label: New York CCAP rate-unit thresholds
  reference:
