      href: https://ocfs.ny.gov/programs/childcare/regulations/415-Child-Care-Services.pdf#page=44
    - title: 24-OCFS-LCM-22, weekly, daily and part-day market rate units
      href: https://ocfs.ny.gov/main/policies/external/2024/lcm/24-OCFS-LCM-22.pdf#page=5
