description: New York limits combined differentials to this fraction of the lesser of actual cost and the applicable market rate unless OCFS grants a waiver.
# OCFS raised the limit from 25% to 35% in a rule effective December 24,
# 2025. The monthly model first reads the higher limit in January 2026.
values:
  2024-10-01: 0.25
  2025-12-24: 0.35
