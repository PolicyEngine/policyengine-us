description: New York sets this minimum weekly benefit rate under the Unemployment Insurance program.

# The 2020-2023 minimum WBR values are corroborated against the archived
# USDOL ETA "Significant Provisions of State Unemployment Insurance Laws"
# January editions (NY row min WBA column): 2020 = $104, 2021 = $108,
# 2022 = $116, 2023 = $124. Values from 2024 onward are documented by the
# NYS-50 editions and NYSDOL P832. The rolling nys50.htm reference is pinned
# to a Wayback Machine capture below.
values:
  2020-01-01: 104
  2021-01-01: 108
  2022-01-01: 116
  2023-01-01: 124
  2024-01-01: 132
  2025-01-01: 136
  2026-01-01: 140

