description: New York limits the duration of benefits to this many weeks within a benefit year under the Unemployment Insurance program.

# The standard 26-week cap has duration exceptions not modeled here: § 601
# (extended-benefit periods) and § 599(2) (approved-training benefits) can
# extend entitlement beyond 26 weeks.
values:
  2020-01-01: 26

metadata:
  unit: week
  period: year
  label: New York UI maximum benefit weeks
  reference:
    - title: NY Labor Law § 590(4) — Rights to benefits
      href: https://www.nysenate.gov/legislation/laws/LAB/590
