description: New York requires this minimum amount of wages paid in the high quarter of the base period under the Unemployment Insurance program.

# Pre-2025 values are backfilled from official sources: the 2023 and 2024 high
# quarter minimums are published directly (USDOL Significant Provisions Jan 2023;
# NYSDOL P832 Jan 2025), and 2020-2022 are cross-checked via the statutory
# derivation high_quarter_minimum = 221 x the applicable minimum wage, floored to
# the next $100 (NY Lab. Law § 527(1)(d)) = min_amount x 25.
values:
  2020-01-01: 2_600
  2021-01-01: 2_700
  2022-01-01: 2_900
  2023-01-01: 3_100
  2024-01-01: 3_300
  2025-01-01: 3_400
  2026-01-01: 3_500

metadata:
  unit: currency-USD
  period: year
