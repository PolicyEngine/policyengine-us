description: New York pays this share of the weekly benefit rate based on hours worked in a week under the Unemployment Insurance program.

# The hours-based partial-benefit tier system took effect 2021-08-16 (Ch. 305
# of the Laws of 2021 § 31); bracket start dates reflect that. Values verified
# for 2025-2026.
brackets:
  - threshold:
      2021-08-16: 0
    amount:
      2021-08-16: 1.0
  - threshold:
      2021-08-16: 11
    amount:
      2021-08-16: 0.75
  - threshold:
      2021-08-16: 17
    amount:
      2021-08-16: 0.5
  - threshold:
      2021-08-16: 22
    amount:
      2021-08-16: 0.25
  - threshold:
      2021-08-16: 31
    amount:
      2021-08-16: 0

metadata:
  type: single_amount
  threshold_unit: hour
  amount_unit: /1
  threshold_period: week
  period: week
