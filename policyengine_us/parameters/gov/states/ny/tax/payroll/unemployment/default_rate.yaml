description: New York assigns this unemployment insurance contribution rate, the normal rate plus the subsidiary rate, to each new employer.
values:
  # These rates leave out the 0.075% Re-employment Services Fund contribution,
  # which New York lists on a separate line.
  2018-01-01: 0.03525
  2019-01-01: 0.03125
  2021-01-01: 0.04025

metadata:
  period: year
  unit: /1
  label: New York default unemployment tax rate
  reference:
