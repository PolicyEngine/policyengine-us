description: New York allows an itemized deduction for medical and dental expenses exceeding this share of federal adjusted gross income.
values:
  2018-01-01: 0.1
metadata:
  unit: /1
  period: year
  label: New York itemized medical expense deduction floor
  reference:
    # NY Tax Law § 615(a) computes NY itemized deductions as federal
    # deductions existed immediately prior to Public Law 115-97 (TCJA).
    # Pre-TCJA 26 U.S.C. 213(a) set a 10% floor; TCJA § 11027 lowered the
    # federal floor to 7.5%, which NY does not follow.
    - title: NY Tax Law § 615(a)
      href: https://www.nysenate.gov/legislation/laws/TAX/615
    - title: 26 U.S. Code § 213(a) (2016 edition, before Public Law 115-97)
      href: https://www.govinfo.gov/content/pkg/USCODE-2016-title26/html/USCODE-2016-title26-subtitleA-chap1-subchapB-partVII-sec213.htm
    - title: 2018 NY Form IT-196, line 3 (multiply line 2 by 10%)
      href: https://www.tax.ny.gov/pdf/2018/inc/it196_2018_fill_in.pdf#page=1
    - title: 2025 NY Form IT-196, line 3 (multiply line 2 by 10%)
      href: https://www.tax.ny.gov/pdf/2025/inc/it196_2025_fill_in.pdf#page=1
