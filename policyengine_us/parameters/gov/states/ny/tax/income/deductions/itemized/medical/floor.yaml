description: New York allows an itemized deduction for medical and dental expenses exceeding this share of federal adjusted gross income.
values:
  # Through 2017, Form IT-201-D line 1 took the medical deduction from federal
  # Schedule A line 4, after the federal floor: 10% from 2013 (7.5% for filers
  # 65 and over through 2016, not modeled), then 7.5% for 2017 under Public
  # Law 115-97 § 11027.
  2013-01-01: 0.1
  2017-01-01: 0.075
  # From 2018, NY Tax Law § 615(a) computes NY itemized deductions as federal
  # deductions existed immediately prior to Public Law 115-97, so NY keeps the
  # pre-TCJA 26 U.S.C. 213(a) 10% floor (Form IT-196 line 3).
  2018-01-01: 0.1
