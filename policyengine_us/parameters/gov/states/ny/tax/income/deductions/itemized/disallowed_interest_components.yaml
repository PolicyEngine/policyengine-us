description: >-
  New York excludes these federal interest components from its itemized deduction.
  The 2026 premium exclusion is an inference from New York's pre-TCJA computation
  and P.L. 119-21 section 70108 placing the restoration in IRC 163(h)(3)(F).
  New York has not yet published 2026 forms.
