description: New York subtracts the following sources from federal adjusted gross income.
values:
  2020-01-01:
    - taxable_social_security
    - us_govt_interest
    - investment_in_529_plan
    - ny_pension_exclusion
    - salt_refund_income
    # N.Y. Tax Law § 612(c)(3) / Form IT-201 Line 26: subtracts pensions paid by NY state,
    # local governments, or the federal government. Pensions from other states are not exempt.
    # PolicyEngine subtracts taxable_public_pension_income as an in-state/federal proxy.
    - taxable_public_pension_income
