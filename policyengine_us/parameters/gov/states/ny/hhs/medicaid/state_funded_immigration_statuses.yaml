description: New York covers these immigration statuses under the Medicaid program with state funds.
# Undocumented residents follow the parameters under
# gov.hhs.medicaid.eligibility, not this list.
values:
  # New York treats Deferred Action for Childhood Arrivals recipients as
  # permanently residing under color of law (PRUCOL) and gives them
  # state-funded Medicaid. GIS 18 MA/005, effective April 2, 2018, keeps
  # them eligible after the federal plan to end DACA. The Department of
  # Health's client notice of October 10, 2014 lists deferred action among
  # the PRUCOL statuses.
  2015-01-01:
    - DACA
  # The Essential Plan covers DACA recipients aged 19 to 64 with income up
  # to 250% of the poverty level from August 1, 2024. YEAR-defined formulas
  # read January 1, so this value first applies in 2025. The list empties
  # for every age, though the Essential Plan covers ages 19 to 64 only.
  2024-08-01:
    []
  # NY State of Health ends Essential Plan coverage for DACA recipients on
  # June 30, 2026, and those in Essential Plan 3 or 4 become eligible for
  # Medicaid on July 1, 2026. YEAR-defined formulas read January 1, so this
  # value first applies in 2027.
  2026-07-01:
    - DACA

