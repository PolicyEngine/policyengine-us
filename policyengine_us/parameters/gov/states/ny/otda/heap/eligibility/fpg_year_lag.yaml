description: New York uses the poverty guidelines from this many years before the model year under the Home Energy Assistance Program.
# Model period Y uses the FFY Y matrix, whose Tier I lines are 130% of the
# guidelines published in January of Y-1: floor(1.3 x 15,650 / 12) = 1,695 for
# one person in FY2026. The FY2025 and FY2024 lines reproduce the same way.
values:
  2025-10-01: 1
metadata:
