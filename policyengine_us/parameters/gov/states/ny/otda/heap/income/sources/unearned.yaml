    href: https://otda.ny.gov/programs/heap/HEAP-manual.pdf#page=37
  - title: FY2026 LIHEAP State Plan, section 1.9 countable income, PDF pages 6, 7
    href: https://liheapch.acf.gov/docs/2026/state-plans/NY_Plan_2026.pdf#page=6
