description: New York provides this base annual direct heating payment by primary heating fuel under the Home Energy Assistance Program.
# Dates identify FFY schedules under the annual model convention.
# The December 2022 revision changes the base; earlier-award supplements are
# not added again to the revised regular benefit.
ELECTRICITY:
  2016-10-01: 350
  2022-10-01: 400
  2022-12-11: 500
  2023-10-01: 400
NATURAL_GAS:
  2016-10-01: 350
  2022-10-01: 400
  2022-12-11: 500
  2023-10-01: 400
FUEL_OIL:
  2016-10-01: 575
  2017-10-01: 675
  2022-10-01: 900
  2022-12-11: 1050
  2023-10-01: 900
KEROSENE:
  2016-10-01: 575
  2017-10-01: 675
  2022-10-01: 900
  2022-12-11: 1050
  2023-10-01: 900
PROPANE:
  2016-10-01: 575
  2017-10-01: 675
  2022-10-01: 900
  2022-12-11: 1050
  2023-10-01: 900
WOOD:
  2016-10-01: 525
  2022-10-01: 635
  2022-12-11: 685
  2023-10-01: 635
COAL:
  2016-10-01: 525
  2022-10-01: 635
  2022-12-11: 685
  2023-10-01: 635
# The matrix's "other fuels" row covers fuels outside the named utility and
# delivered-fuel groups; the model places solar there.
OTHER:
  2016-10-01: 525
  2022-10-01: 635
  2022-12-11: 685
  2023-10-01: 635
SOLAR:
  2016-10-01: 525
  2022-10-01: 635
  2022-12-11: 685
  2023-10-01: 635
# No matrix row: an unknown fuel pays nothing. See #9754 for the default fuel.
UNSPECIFIED:
  2023-10-01: 0
NONE:
  2023-10-01: 0
