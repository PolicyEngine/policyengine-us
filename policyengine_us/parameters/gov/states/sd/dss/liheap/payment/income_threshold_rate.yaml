description: South Dakota uses this federal poverty guideline rate for the first income tier under the Low Income Energy Assistance Program. Rounding its three-month equivalent half up reproduces all published FY2022 and FY2024 first-tier thresholds; this inferred rule carries forward to the FY2026 Mid tier. The date is the latest explicit FY2024 annual-model observation, not policy commencement.
values:
  2024-01-01: 1.25
metadata:
