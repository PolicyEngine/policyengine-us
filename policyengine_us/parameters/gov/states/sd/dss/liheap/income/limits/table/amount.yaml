description: South Dakota limits three-month household income to this amount under the Low Income Energy Assistance Program.
# The FY2025 plan, section 2.1 (SD_Plan_2025.pdf#page=8), lists 60% of state
# median income for sizes 1-9 and 150% of the poverty guideline for size 10;
# the published limits for sizes 1-3 equal 200% of the 2024 guideline instead.
# The table stops at size 10; larger households use the income limit rule.
metadata:
  type: single_amount
  threshold_unit: person
  amount_unit: currency-USD
  unit: currency-USD
  # Amounts are three-month totals; sd_liheap_income_limit multiplies them by
  # four. No quarter period exists, so this follows the year convention of
  # other quarterly dollar amounts (Pennsylvania minimum_high_quarter_wages, New
  # York high_quarter_minimum).
  period: year
  label: South Dakota LIEAP published three-month income limit
  reference:
    - title: South Dakota DSS, 2024-2025 Heating Season Income Limits (archived January 14, 2025)
      href: https://web.archive.org/web/20250114001211/https://dss.sd.gov/economicassistance/energy_weatherization_assistance.aspx

