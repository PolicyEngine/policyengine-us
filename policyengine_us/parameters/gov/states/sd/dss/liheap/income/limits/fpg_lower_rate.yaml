description: South Dakota uses this federal poverty guideline rate as the lower bound of its income limit under the Low Income Energy Assistance Program. This numerical rule reproduces the FY2024 schedule and carries forward to FY2026; the date is an annual-model observation, not policy commencement.
values:
  2024-01-01: 1.5
