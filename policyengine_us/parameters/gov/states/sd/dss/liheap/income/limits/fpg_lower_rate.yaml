description: South Dakota uses this poverty guideline rate as the lower bound of its income limit under the Low Income Energy Assistance Program.
# This numerical rule reproduces the FY2024 schedule and carries forward to FY2026;
# the date is an annual-model observation, not policy commencement. Plan section
# 2.1 prints 150% of the poverty guideline for size 10 in FY2025 and FY2026.
values:
  2024-01-01: 1.5
