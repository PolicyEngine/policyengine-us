description: South Dakota limits household income to this share of state median income, within the poverty guideline bounds, under the Low Income Energy Assistance Program.
# The rate applies to the four-person state median income before the household
# size adjustment. Flooring before the size adjustment and flooring each quarter
# reproduce the FY2024 and FY2026 tables, a reconciled numerical pattern. The date
# is an FY2024 annual-model observation, not policy commencement.
values:
  2024-01-01: 0.6
