description: South Dakota applies this rate to four-person state median income before household-size adjustment, subject to poverty guideline bounds, under the Low Income Energy Assistance Program. Flooring before size adjustment and quarterly flooring reproduce the FY2024 and FY2026 tables; this is a reconciled numerical pattern. The date is an FY2024 annual-model observation, not policy commencement.
values:
  2024-01-01: 0.6
