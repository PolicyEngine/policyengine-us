description: South Dakota counts these unearned income sources for members of all ages under the Low Income Energy Assistance Program.
values:
  2025-10-01:
    # Social Security is counted in the formula, net of the Medicare Part B
    # premium (rule 67:15:01:18(12)), and TANF through the take-up-gated tanf.
    - ssi
    - pension_income
    # Military retirement pay is a separate input from the pension inputs that
    # pension_income adds, so both are listed; a household reports the amount
    # in one or the other.
    - military_retirement_pay
    - railroad_benefits
    - survivor_benefits
    - unemployment_compensation
    # The application (page 5) lists "Worker's Compensation" as gross income,
    # rule 67:15:01:01(4) counts unearned income before deductions, and rule
    # 67:15:01:18 does not exclude it.
    - workers_compensation
    - veterans_benefits
    - child_support_received
    - alimony_income
    - rental_income
    - farm_rent_income
    - strike_benefits
    - general_assistance
    # The manual (page 25) counts trust income ("Trusts", Y).
    - estate_income
    # The manual (page 27) counts "Lottery or gaming winnings" in full: "If
    # received in the 3 month LIEAP time frame count entire amount." The FY2026
    # plan, section 1.9 (page 6), leaves "One-time lump-sum payments, such as
    # rebates/credits, winnings from lotteries" unchecked. The manual is followed.
    - gambling_winnings
# Pension and Social Security subcomponents are not added again. Interest,
# dividends, capital gains and cash gifts are excluded.
