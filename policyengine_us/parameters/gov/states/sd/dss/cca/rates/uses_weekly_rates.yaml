description: South Dakota uses this indicator to determine whether the weekly reimbursement rate schedule applies under the Child Care Assistance program.

# DSS replaced hourly county rates with weekly region rates on August 3,
# 2026. The monthly model starts the weekly schedule on August 1. The false
# entry starts with the sourced July 1, 2024 hourly sheets; hourly.available
# keeps benefits at zero before that schedule because earlier rates remain
# unsourced.
values:
  2024-07-01: false
  2026-08-01: true

metadata:
  unit: bool
  period: year
  label: South Dakota CCA weekly rate schedule in effect
  reference:
    - title: South Dakota Child Care Assistance Rates, effective 8/3/2026
      href: https://dss.sd.gov/docs/childcare/assistance/CCA_Weekly_Reimbursement_Rates.pdf
