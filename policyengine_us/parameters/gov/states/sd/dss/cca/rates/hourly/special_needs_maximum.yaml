description: South Dakota reimburses approved special-needs child care at up to this hourly maximum under the Child Care Assistance program.
# The charts and plans specify standard ceilings. The informal provider
# guides describe DSS approval for enhanced reimbursement.
values:
  2016-06-01: 4.75
  # Candidate: us-sd:cca-hourly-special-needs-2018
  2018-06-16: 5
  2020-07-01: 5.15
  2022-07-01: 5.8
  2024-07-01: 6.8

