description: South Dakota reimburses approved special-needs child care at up to this hourly maximum under the Child Care Assistance program.
# The state plans specify the ceiling and the informal provider guides
# describe applying for enhanced reimbursement.
values:
  2020-07-01: 5.15
  2022-07-01: 5.8
  2024-07-01: 6.8

