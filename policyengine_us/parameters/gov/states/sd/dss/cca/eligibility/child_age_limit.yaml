description: South Dakota limits eligibility to children below this age under the Child Care Assistance program.

# A child is eligible if under age 13; a child who turns 13 during the
# eligibility period keeps care through the end of that period or until they
# turn 14, whichever occurs first (Manual Section 4.3), which the flat cutoff
# does not model. Dated to the modeled program start month (2026-08-01; the
# weekly rate era takes effect 8/3/2026).
values:
  2026-08-01: 13

metadata:
  unit: year
  period: year
  label: South Dakota CCA child age limit
  reference:
    - title: South Dakota Child Care Assistance Policy Manual (Aug. 2026), Section 4.3 Age of Child
      href: https://dss.sd.gov/docs/childcare/assistance/BEES_CCA_Policy_Manual.pdf#page=18
