description: South Dakota limits eligibility to school-enrolled children incapable of self-care or under court supervision below this age under the Child Care Assistance program.

# A child incapable of self-care or under court supervision who is enrolled in
# school and expected to graduate is eligible through age 18 (under 19) rather
# than the standard limit of under 18 (ARSD 67:47:01:03(3)-(4); Manual Section
# 4.3). School enrollment proxies the graduation expectation.
values:
  2026-08-01: 19

