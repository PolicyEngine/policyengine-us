description: South Dakota limits eligibility to school-enrolled children with incapacity or court supervision below this age under the Child Care Assistance program.

# A child incapable of self-care who is enrolled in school and expected to
# graduate is eligible through age 18 (under 19) rather than the standard
# special-needs limit of under 18 (ARSD 67:47:01:03).
values:
  2026-08-01: 19

