description: South Dakota limits eligibility to children incapable of self-care or under court supervision below this age under the Child Care Assistance program.

# A child physically or mentally incapable of self-care, or under court
# supervision, is eligible if under age 18; the limit extends to the
# school-enrolled age limit when the child is enrolled in school and expected
# to graduate (ARSD 67:47:01:03(2), (4); Manual Section 4.3).
values:
  2026-08-01: 18

