description: Kentucky provides this amount as a daily special-care supplement for children with special needs or under court supervision under the Child Care Assistance Program.
# Section 10(3)(b) covers a child age 13 but under 19 who is incapable of
# self-care or under court supervision. ky_ccap_daily_benefit applies that band
# with the Section 3(1)(b) eligibility age parameters, which set the same ages.
values:
  2019-05-31: 1
  2022-08-01: 5

