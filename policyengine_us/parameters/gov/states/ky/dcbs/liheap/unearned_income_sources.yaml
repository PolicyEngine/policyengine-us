description: Kentucky counts these available person-level unearned income sources under the Low Income Home Energy Assistance Program.
values:
  2025-10-01:
    - unemployment_compensation
    - strike_benefits
    - ssi
    # Plan Section 17.4 lists the DCBS State Supplementation award letter as
    # income documentation.
    - ky_ssp
    - pension_income
    - retirement_distributions
    - financial_assistance
    - gambling_winnings
    - rental_income
    # Plan Section 17.4 lists records of farm or rental income.
    - farm_rent_income
    - alimony_income
    - child_support_received
    - interest_income
    - ordinary_dividend_income
    # The plan has no dedicated row for workers' compensation or employer
    # disability pay. Section 1.9 counts insurance payments made directly to
    # the insured, and 921 KAR 4:116 Section 1(8) counts all unearned income.
    - workers_compensation
    - disability_benefits
    - veterans_benefits
    - salt_refund_income
metadata:
  unit: list
  period: year
  label: Kentucky LIHEAP unearned income sources
  reference:
    - title: Kentucky FY2026 state plan, Sections 1.9 and 17.4
      href: https://liheapch.acf.gov/docs/2026/state-plans/KY_Plan_2026.pdf#page=5,6,7,34
    - title: 921 KAR 4:116 Section 1(8)
      href: https://apps.legislature.ky.gov/law/kar/titles/921/004/116/
