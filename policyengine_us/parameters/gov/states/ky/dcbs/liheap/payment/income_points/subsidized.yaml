description: Kentucky provides these income points by monthly income band to households in subsidized housing under the Low Income Home Energy Assistance Program.
# These values reproduce the published workbooks. Their subsidized rows
# reference the unsubsidized rows in reverse order (the lowest-income
# subsidized row takes 30% of the highest-income unsubsidized row, and so on),
# so the published subsidized payment rises with income. 921 KAR 4:116 Section
# 4(1)(c) says the household with the lowest income receives the highest
# benefit. The FY2025 and FY2026 workbooks both use the reversed ordering;
# which ordering agencies pay is unconfirmed.
brackets:
  - threshold:
      2024-10-01: 0
    amount:
      2024-10-01: 1
  - threshold:
      2024-10-01: 1
    amount:
      2024-10-01: 2
  - threshold:
      2024-10-01: 2
    amount:
      2024-10-01: 3
  - threshold:
      2024-10-01: 3
    amount:
      2024-10-01: 4
metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: /1
  period: year
  label: Kentucky LIHEAP subsidized housing income points
  reference:
    - title: Kentucky FY2026 benefit workbook, rev benefit income range worksheet, cells E52-E55 (30 percent of the unsubsidized rows in reverse order)
      href: https://liheapch.acf.gov/docs/2026/benefits-matricies/KY_BenefitMatrix_Heat-Cool_2026.xlsx
    - title: Kentucky FY2025 benefit workbook, subsidy benefits worksheet, cells E45-E48 (same reversed ordering)
      href: https://liheapch.acf.gov/docs/2025/benefits-matricies/KY_BenefitMatrix_2025.xlsx
    - title: 921 KAR 4:116 Section 4(1)(c) (lowest income receives the highest benefit; conflicts with the workbook ordering)
      href: https://apps.legislature.ky.gov/law/kar/titles/921/004/116/
