description: Kentucky uses the federal poverty guidelines from this many years before the heating season ending year under the Low Income Home Energy Assistance Program.
# The fact sheet publishes the limits without naming the guideline year. The
# lag is inferred from the amounts (1,957 = 150% of the 2025 one-person
# guideline / 12, rounded up); each workbook's poverty table shows the same
# one-year lag.
values:
  2024-10-01: 1
metadata:
  unit: year
  period: year
  label: Kentucky LIHEAP federal poverty guideline year lag
