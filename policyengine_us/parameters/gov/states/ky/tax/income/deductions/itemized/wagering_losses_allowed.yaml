description: Kentucky allows the federal wagering losses deduction as an itemized deduction if this is true.
values:
  2000-01-01: true
  # For 2018 Kentucky disallowed every section 165 loss.
  2018-01-01: false
  # 2019 Ky. Acts ch. 151, sec. 37 restored wagering losses allowed under
  # section 165(d), for taxable years beginning on or after January 1, 2019
  # (sec. 83).
  2019-01-01: true
