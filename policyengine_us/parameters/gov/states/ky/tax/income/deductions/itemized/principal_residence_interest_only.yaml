description: Kentucky limits the qualified residence interest deduction to the principal residence if this is true.
values:
  # Before HB 757, KRS 141.019(2) ended at paragraph (i) and had no qualified residence interest limit.
  2018-01-01: false
  # HB 757 (2026 Ky. Acts ch. 161) sec. 7, as amended by HB 869 (ch. 198) sec. 48, adds KRS 141.019(2)(j) for taxable years beginning on or after January 1, 2026.
  2026-01-01: true
metadata:
  unit: bool
  period: year
  label: Kentucky qualified residence interest limited to the principal residence
