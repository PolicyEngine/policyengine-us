description: Kentucky limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  2018-01-01: 10_200
  2019-01-01: 10_500
  # 2021 Kentucky Acts chapter 177 and 2022 Kentucky Acts chapter 29 held the
  # 2021 and 2022 wage bases at the 2020 amount.
  2020-01-01: 10_800
  2023-01-01: 11_100
  2024-01-01: 11_400
  2025-01-01: 11_700
  2026-01-01: 12_000

