description: Delaware extends Purchase of Care age eligibility to children under court supervision.
values:
  # The FFY 2019-2021, FFY 2022-2024 and FFY 2025-2027 plans each elect the
  # 45 CFR 98.20(a)(1)(ii) court-supervision extension with an upper age of
  # 18 (under 19). Earlier plans were not reviewed.
  2018-10-01: true
