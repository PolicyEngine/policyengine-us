description: Delaware extends Purchase of Care age eligibility to children under court supervision up to the disabled child age threshold if this is true.
values:
  # The approved FFY 2016-2018 plan (effective June 1, 2016) answers No to the
  # 45 CFR 98.20(a)(1)(ii) court-supervision option; earlier periods follow it.
  2016-06-01: false
  # The FFY 2019-2021, FFY 2022-2024 and FFY 2025-2027 plans each elect the
  # option with an upper age of 18 (under 19).
  2018-10-01: true
