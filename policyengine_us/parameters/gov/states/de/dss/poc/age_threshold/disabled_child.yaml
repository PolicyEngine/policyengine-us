description: Delaware limits the Purchase of Care program to children younger than this age who are disabled or, where the court-supervision extension applies, under court supervision.
# The FFY 2025-2027 CCDF Plan enters 19.00 for the incapable-of-self-care
# route (2.2.1(b)) and 18.00 for the court-supervision route (2.2.1(c)); earlier
# plans enter 18 for both. Either way, eligibility ends at 19.
values:
  2024-01-01: 19

