description: Delaware sets this amount as the estimated minimum summer cooling assistance benefit under the Low Income Home Energy Assistance Program.
# Plan section 3.6 prints one estimated benefit range for the whole cooling
# component, the Summer Cooling Assistance Program, which has an electric
# benefit and an air-conditioner component (section 3.3). The plan does not
# split the range between the two components.
values:
  2025-10-01: 1
  2026-10-01: 1
metadata:
  unit: currency-USD
  period: year
  label: Delaware LIHEAP cooling estimated minimum benefit
  reference:
