description: Delaware counts these unearned income sources of household members younger than the earned income age under the Low Income Home Energy Assistance Program.
# Manual 418 excludes minors' income except child support and Social Security;
# 419.1 includes SSI and railroad retirement among Social Security benefits.
values:
  2025-10-01:
    - child_support_received
    - social_security
    - ssi
    - railroad_benefits
