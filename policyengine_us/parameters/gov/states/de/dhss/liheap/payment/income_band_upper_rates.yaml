description: Delaware sets these income-band upper bounds as shares of the income limit under the Low Income Home Energy Assistance Program.
# The matrix IPI upper bounds (25.4999 through 200 percent) are divided by
# 200: IPI is household income divided by half the 60% SMI income limit.
# Floor the product of these rates and the whole-dollar income limit.
values:
