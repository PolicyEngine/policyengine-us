description: Delaware limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  2018-01-01: 16_500
  2022-01-01: 14_500
  2023-01-01: 10_500
  2025-01-01: 12_500
  2026-01-01: 14_500

