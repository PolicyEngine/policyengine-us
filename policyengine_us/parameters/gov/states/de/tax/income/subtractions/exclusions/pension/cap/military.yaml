description: Delaware caps the military pension income exclusion at this amount.
values:
  # 30 Del. C. 1106(b)(3)b, for 2022 through 2026.
  2022-01-01: 12_500
  # 1106(b)(3)c, d and e.
  2027-01-01: 15_000
  2028-01-01: 20_000
  2029-01-01: 25_000
