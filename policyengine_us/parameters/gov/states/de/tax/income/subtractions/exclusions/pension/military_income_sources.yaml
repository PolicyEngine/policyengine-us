description: Delaware counts these income sources as a United States military pension under the pension exclusion.
values:
  # 83 Del. Laws c. 352 added the military pension exclusion at
  # 30 Del. C. 1106(b)(3)b.1.B without defining the term. For those years the
  # Division of Revenue's Line 6 instructions give it to a filer who retired
  # from the United States military.
  2022-01-01:
    - military_retirement_pay
  # 84 Del. Laws c. 437, approved September 26, 2024, defined the term as "a
  # pension received as a result of an individual's service" (now
  # 1106(b)(3)f.2), which reaches an annuity paid to a member's survivor.
  2024-01-01:
    - military_retirement_pay
    - military_retirement_pay_survivors
