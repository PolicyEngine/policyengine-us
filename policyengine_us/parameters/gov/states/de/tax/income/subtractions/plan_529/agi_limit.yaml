description: Delaware allows the 529 plan subtraction only to filers whose federal adjusted gross income does not exceed this amount, by filing status.
metadata:
  propagate_metadata_to_children: true
  label: Delaware 529 plan contribution subtraction AGI limit
  period: year
  unit: currency-USD
  breakdown:
  - filing_status
  reference:
  # The statute bars the subtraction when federal AGI is "greater than" the
  # limit; only joint filers get the higher limit. Delaware has no surviving
  # spouse status: a widow(er) files as Filing Status 1.
  - title: 30 Del. C. § 1106(b)(11)
    href: https://delcode.delaware.gov/title30/c011/sc02/index.html
  - title: 2023 Delaware PIT-RES Instructions, Line 8b
    href: https://revenuefiles.delaware.gov/2023/PIT-RES_TY23_2023-01_Instructions.pdf#page=7
  - title: 2024 Delaware PIT-RES Instructions, Line 8b
    href: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf#page=7
  - title: 2024 Delaware PIT-RES, Filing Status
    href: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT-RES_2024-01_PaperInteractive.pdf#page=1

JOINT:
  2022-01-01: 200_000
SURVIVING_SPOUSE:
  2022-01-01: 100_000
SINGLE:
  2022-01-01: 100_000
HEAD_OF_HOUSEHOLD:
  2022-01-01: 100_000
SEPARATE:
  2022-01-01: 100_000
