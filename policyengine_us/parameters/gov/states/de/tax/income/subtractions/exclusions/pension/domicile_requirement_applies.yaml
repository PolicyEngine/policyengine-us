description: Delaware limits the pension exclusion for filers at or above the age threshold to those who meet its domicile requirement, if this is true.
values:
  2007-01-01: false
  # 30 Del. C. 1106(b)(3)f.4, added by 85 Del. Laws c. 426 (Senate Bill 219
  # with Senate Amendment 1). The act took effect when the Governor signed it
  # on August 17, 2026 and names no first tax year for this rule; its fiscal
  # note applies the act from tax year 2027.
  2027-01-01: true
