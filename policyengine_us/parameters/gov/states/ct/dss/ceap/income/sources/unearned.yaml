description: Connecticut counts these unearned income sources under the Connecticut Energy Assistance Program.
values:
  2025-10-01:
    # Social Security is counted separately after its Medicare deduction.
    - total_unemployment_compensation
    - strike_benefits
    - pension_income
    - military_retirement_pay
    # Ongoing IRA/401k distributions are separate from pension_income.
    # Include taxable and exempt account distributions once.
    - retirement_distributions
    - survivor_benefits
    - workers_compensation
    - disability_benefits
    - rental_income
    - farm_rent_income
    - estate_income
    - interest_income
    - ordinary_dividend_income
    - alimony_income
    - child_support_received
    - financial_assistance
    - gambling_winnings
    - veterans_benefits

metadata:
  unit: list
  period: year
  label: Connecticut CEAP countable unearned income sources
  reference:
    - title: "Connecticut FY2026 LIHEAP State Plan, Section 1.8-1.9 #page 6-7"
      href: https://liheapch.acf.gov/docs/2026/state-plans/CT_Plan_2026.pdf#page=6
    - title: "Connecticut approved FY2027 LIHEAP Allocation Plan, Sections III-V #page 5-9"
      href: https://portal.ct.gov/dss/-/media/departments-and-agencies/dss/winter-heating-assistance/09012026/ffy-27-liheap-allocation-plan.pdf#page=5
