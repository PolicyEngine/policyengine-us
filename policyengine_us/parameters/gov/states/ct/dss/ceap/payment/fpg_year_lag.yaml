description: Connecticut uses federal poverty guidelines from this many years before the benefit fiscal year for payment bands and the federal income floor under the Connecticut Energy Assistance Program.
# The FY2026 matrix uses 2025 guidelines and FY2027 uses 2026 guidelines,
# matching HHS's mandatory fiscal-year timing for both bands and the floor.
values:
  2025-10-01: 1

