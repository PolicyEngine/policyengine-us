description: Connecticut limits income eligibility to this share of the federal poverty line under the Covered Connecticut Program.
values:
  # Public Act 26-68, Sec. 462 (effective from passage), repeals and re-enacts
  # C.G.S. 19a-754c and keeps the limit at "household income up to one hundred
  # seventy-five per cent of the federal poverty level" for 2027 and later.
  2026-01-01: 1.75

