description: Connecticut provides Temporary Premium Assistance to Access Health CT enrollees when this is true.
values:
  # Plan year 2026: the Governor's December 18, 2025 plan under November
  # Special Session Special Act 25-1, Section 2, funds the replacement of the
  # lost enhanced federal credits "during calendar year 2026".
  # Plan year 2027: Public Act 26-68, Section 453(e), directs OPM to design a
  # premium subsidy for Access Health CT enrollees "until December 31, 2027",
  # and the Governor's November 5, 2026 release says "The state is continuing
  # this assistance for eligible residents in 2027." OPM has not published
  # the 2027 design, so the 2027 tiers (income bands and replacement rates)
  # are assumed unchanged from 2026.
  # 2028 onward: no act authorizes it. Section 453(e) stops at December 31,
  # 2027, and Special Act 26-1, Section 1(b), closes the Federal Cuts Response
  # Fund after the fiscal year ending June 30, 2027.
  0000-01-01: false
  2026-01-01: true
  2028-01-01: false

