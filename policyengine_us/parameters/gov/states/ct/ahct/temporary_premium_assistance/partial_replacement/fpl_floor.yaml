description: Connecticut replaces part of the lost enhanced premium tax credit under Temporary Premium Assistance for households with income above this share of the federal poverty line.
values:
  # Applied exclusively: Access Health CT's one-person range starts at
  # "$62,600.01", one cent above four times the plan year 2026 guideline.
  # Plan year 2027 assumes the 2026 band (see in_effect.yaml): the cited
  # band figures are plan year 2026 figures, the November 5, 2026 release
  # confirms 2027 assistance but gives no bands, and the 2027 design that
  # Public Act 26-68, Section 453(e), leaves to OPM is unpublished.
  2026-01-01: 4

