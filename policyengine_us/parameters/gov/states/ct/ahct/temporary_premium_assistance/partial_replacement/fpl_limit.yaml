description: Connecticut replaces part of the lost enhanced premium tax credit under Temporary Premium Assistance for households with income at or below this share of the federal poverty line.
values:
  # Applied inclusively: Access Health CT's one-person range ends at five
  # times the guideline ($78,250 for plan year 2026). The 2027 pages repeat
  # the 2026 bands.
  2026-01-01: 5

