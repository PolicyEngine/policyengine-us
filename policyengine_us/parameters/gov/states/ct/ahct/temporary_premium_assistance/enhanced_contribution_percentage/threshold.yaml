description: Connecticut uses these federal poverty line thresholds for the expired enhanced premium tax credit's applicable percentage brackets when computing Temporary Premium Assistance.
values:
  # The table of 26 U.S.C. 36B(b)(3)(A)(iii) for taxable years 2021 through
  # 2025, which Temporary Premium Assistance replaces. Its last row, "400.0
  # percent and higher", is the end of the 300-400% bracket held flat; the
  # table has no income cap.
  2026-01-01:
    - 0
    - 1.5
    - 2
    - 2.5
    - 3
    - 4

