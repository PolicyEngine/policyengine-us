description: Ohio assigns this standard unemployment contribution rate, plus from 2026 the technology and customer service fee, to each new employer outside the construction industry.
values:
  2018-01-01: 0.027
  # PE-US adds the 0.15% technology and customer service fee that House Bill 96
  # (2025) levies for 2026 and 2027 and the Department of Job and Family
  # Services includes in the new employer rate.
  2026-01-01: 0.0285

