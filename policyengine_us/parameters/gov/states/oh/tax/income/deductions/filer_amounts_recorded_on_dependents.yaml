description: Ohio deducts these per-person amounts from the filer's federal adjusted gross income even when they are recorded on a tax unit dependent. Other deductions on a dependent are the dependent's own and belong on their own return.
values:
  2021-01-01:
    # A modelling convention: oh_529_plan_deduction caps the contributions
    # recorded on every tax unit member at $4,000 per beneficiary, as the
    # other states' 529 deductions pool them, and each member's share of
    # that tax-unit deduction follows their contributions. Masking a
    # dependent's share would leave the shares short of the tax-unit amount.
    # investment_in_529_plan_indv is documented per contributor, so what an
    # amount on a dependent means is an open question across states.
    - oh_529_plan_deduction_person
    # Premiums and medical care the taxpayer paid "for the taxpayer, the
    # taxpayer's spouse, and dependents" (R.C. 5747.01(A)(10)), recorded on
    # the person they covered.
    - oh_unreimbursed_medical_care_expense_deduction_person
metadata:
  unit: list
  period: year
  label: Ohio deductions summed over dependents
  reference:
    - title: Ohio Revised Code 5747.01(A)(9) and (A)(10)
      href: https://codes.ohio.gov/ohio-revised-code/section-5747.01
