description: Ohio deducts these per-person amounts from the filer's federal adjusted gross income even when they are recorded on a tax unit dependent, as they are the filer's amounts. Other deductions on a dependent are the dependent's own and belong on their own return.
values:
  2021-01-01:
    # Not 529 contributions: investment_in_529_plan_indv records the
    # contributor, and Ohio allows the deduction only "to a taxpayer who
    # contributes" (R.C. 5747.70(A)), so oh_529_plan_deduction_person gives a
    # dependent nothing. A parent's contributions for a child are recorded on
    # the parent.
    # Premiums and medical care the taxpayer paid "for the taxpayer, the
    # taxpayer's spouse, and dependents" (R.C. 5747.01(A)(10)), recorded on
    # the person they covered.
    - oh_unreimbursed_medical_care_expense_deduction_person
metadata:
  unit: list
  period: year
  label: Ohio deductions summed over dependents
