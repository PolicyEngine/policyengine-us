description: Ohio applies this multiplier to the payment standard amounts under the Ohio Works First program.

values:
  2017-01-01: 1
  2018-01-01: 1.02
  2019-01-01: 1.0486
  2020-01-01: 1.0653
  2021-01-01: 1.0792
  2022-01-01: 1.1429
  2023-01-01: 1.2423
  2024-01-01: 1.2821
  2025-01-01: 1.3141
  2026-01-01: 1

# Earlier schedules apply cumulative COLAs to 2017 base amounts.
# The 2026 published amounts already include the COLA, so use a multiplier of 1.

