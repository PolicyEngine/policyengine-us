description: Ohio uses this fuel cost ratio for propane, fuel oil, and kerosene under the Home Energy Assistance Program.
# The 2024 and 2025 draft workbooks' equal propane and oil/kerosene maximums
# ($811 and $441) are consistent with the 2023 ratio carrying forward.
values:
  2021-01-01: 0.852
  2023-01-01: 1
metadata:
