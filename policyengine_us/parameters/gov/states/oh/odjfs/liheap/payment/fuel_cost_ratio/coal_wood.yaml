description: Ohio uses this fuel cost ratio for coal and wood under the Home Energy Assistance Program.
# The 2024 and 2025 draft workbooks' coal/wood maximums and minimums
# ($486/$41 and $264/$24) are consistent with the 2023 ratio carrying forward.
values:
  2021-01-01: 0.5325
  2023-01-01: 0.6
metadata:
  unit: /1
  period: year
  label: Ohio HEAP coal and wood fuel cost ratio
