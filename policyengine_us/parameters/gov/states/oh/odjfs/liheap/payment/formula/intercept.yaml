description: Ohio sets this payment formula intercept under the Home Energy Assistance Program.
# The 2021 values carry through 2022; no final 2022 workbook was found.
# The 2024 and 2025 covers give credit percentages, but no formula sheet.
# These estimated intercepts apply the final 2023 workbook's $950 winter
# cost and page 11 method to the cover percentages: 0.50 x 950 = 475 and
# 0.265 x 950 = 251.75. Matching cover maxima does not verify interior awards.
# Ohio's January 16, 2025 notice confirms the operative 2025 range $24-$441
# and prior-year range $41-$811; it does not supply current coefficients.
# The minimum awards include PIPP treatment, which remains unmodeled.
# The 2026 estimate fits the FY2026 matrix range in FY2027 draft plan items
# 2.5-2.6 ($31 minimum, $546 maximum); the matrix itself is not public. A 31%
# credit at 50% of poverty reproduces the maximum (0.31 x 950 x 1.06 x 1.75 =
# 546.30), and 28.5% at 150% is one of the credits (28.2%-29.1%) whose coal
# PIPP minimum, 0.19 of the regular award as in every published workbook,
# rounds to $31 (0.285 x 950 x 0.6 x 0.19 = 30.87): 0.31 x 950 + 50 x 0.2375 =
# 306.375. The draft estimates FY2027 at the same range, so the 2026 estimate
# carries forward.
values:
  2021-01-01: 593.2133
  2023-01-01: 731.5
  2024-01-01: 475
  2025-01-01: 251.75
  2026-01-01: 306.375
