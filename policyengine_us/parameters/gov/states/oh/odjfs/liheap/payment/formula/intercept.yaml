description: Ohio starts the payment formula with this intercept under the Home Energy Assistance Program.
# The 2021 values carry through 2022; no final 2022 workbook was found.
# The 2024 and 2025 draft workbooks print only their maximum and minimum
# credit percentages (46%/38% and 25%/22%). Applying the 2023 workbook's
# page 11 method with its $950 high winter cost gives 0.50 x 950 = 475 and
# 0.265 x 950 = 251.75. These reproduce the printed credit percentages and
# every printed fuel maximum, including the $811 and $441 maximums in the
# FY2025 and FY2026 plans. The printed minimum dollar amounts ($41 and $24)
# include a further factor of about 0.2 that the model does not apply.
# The 2025 draft values carry into 2026 and later. The FY2027 draft plan's
# section 2.6 reports the unpublished 2026 matrix at a $31 minimum and $546
# maximum, so 2026 and later payments are unverified estimates.
values:
  2021-01-01: 593.2133
  2023-01-01: 731.5
  2024-01-01: 475
  2025-01-01: 251.75
