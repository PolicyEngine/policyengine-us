description: Ohio starts the payment formula with this intercept under the Home Energy Assistance Program.
# The 2021 values carry through 2022; no final 2022 workbook was found.
# The 2024 and 2025 covers give credit percentages, but no formula sheet.
# These estimated intercepts apply the final 2023 workbook's $950 winter
# cost and page 11 method to the cover percentages: 0.50 x 950 = 475 and
# 0.265 x 950 = 251.75. Matching cover maxima does not verify interior awards.
# Ohio's January 16, 2025 notice confirms the operative 2025 range $24-$441
# and prior-year range $41-$811; it does not supply current coefficients.
# The minimum awards include PIPP treatment, which remains unmodeled.
# The 2025 estimates carry into 2026 and later. The FY2027 draft plan's
# section 2.6 describes an unpublished 2026 matrix with a $31 minimum and
# $546 maximum; no current formula or complete payment table was found.
values:
  2021-01-01: 593.2133
  2023-01-01: 731.5
  2024-01-01: 475
  2025-01-01: 251.75
