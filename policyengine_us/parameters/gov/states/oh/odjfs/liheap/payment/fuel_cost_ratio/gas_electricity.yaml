description: Ohio uses this fuel cost ratio for natural gas and electricity under the Home Energy Assistance Program.
# Uses the published four-decimal ratios. Some printed 2023 gas/electric
# dollar cells differ by $1 from this formula; unprinted precision is not
# inferred. The 2024 and 2025 draft workbooks do not print the ratio: any
# ratio from 0.7236 to 0.7247 reproduces their gas/electric maximums
# ($587 and $319) against the propane maximums ($811 and $441), so the
# shortest value in that range is used and carried forward.
values:
  2021-01-01: 0.5882
  2023-01-01: 0.5523
  2024-01-01: 0.724
metadata:
  unit: /1
  period: year
  label: Ohio HEAP gas and electricity fuel cost ratio
  reference:
    - title: "Ohio 2021 FINAL HEAP Benefit Matrix, #page 9"
      href: https://liheapch.acf.gov/sites/default/files/webfiles/docs/OH_BenefitMatrix_2022.pdf#page=9
    - title: "Ohio 2023 FINAL LIHEAP Benefit Matrix, #page 9"
      href: https://liheapch.acf.gov/docs/2024/benefits-matricies/OH_BenefitMatrix_2024.pdf#page=9
    - title: "Ohio 2024 DRAFT LIHEAP Benefit Matrix, #page 1"
      href: https://liheapch.acf.gov/docs/2025/benefits-matricies/OH_BenefitMatrix_2025.pdf#page=1
