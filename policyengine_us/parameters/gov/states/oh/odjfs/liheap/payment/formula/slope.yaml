description: Ohio sets this payment reduction per federal poverty percentage point under the Home Energy Assistance Program.
# The 2021 values carry through 2022; no final 2022 workbook was found.
# For 2024 and 2025, these estimates use (46% - 38%) / 100 x $950 = 0.76
# and (25% - 22%) / 100 x $950 = 0.285, applying the final 2023 workbook's
# method and winter cost to draft cover percentages. No current formula
# sheet or interior award table verifies those assumptions. For 2026,
# (31% - 28.5%) / 100 x $950 = 0.2375, fitted to the FY2026 matrix range (see
# the intercept). Any minimum credit from about 28.2% to 29.1% fits that range,
# so the fitted slope could lie anywhere from about 0.18 to 0.27. The 2026
# value carries into 2027 and later without extending verified coverage.
values:
  2021-01-01: 0.9813
  2023-01-01: 1.33
  2024-01-01: 0.76
  2025-01-01: 0.285
  2026-01-01: 0.2375
