description: Ohio reduces the payment formula by this amount per federal poverty percentage point under the Home Energy Assistance Program.
# The 2021 values carry through 2022; no final 2022 workbook was found.
# For the 2024 and 2025 draft workbooks, (46% - 38%) / 100 x $950 = 0.76 and
# (25% - 22%) / 100 x $950 = 0.285, using the 2023 workbook's page 11 method
# and high winter cost. The 2025 draft value carries into 2026 and later,
# which are unverified estimates.
values:
  2021-01-01: 0.9813
  2023-01-01: 1.33
  2024-01-01: 0.76
  2025-01-01: 0.285
metadata:
  unit: currency-USD
  period: year
  label: Ohio HEAP payment reduction per poverty percentage point
