description: Ohio counts these unearned income sources, except for dependent minors, under the Home Energy Assistance Program.
values:
  2025-07-01:
    - unemployment_compensation
    - strike_benefits
    # Social Security is counted in the formula, including a dependent
    # minor's benefit paid to an adult payee (Guidelines section E-2.2).
    - ssi
    - pension_income
    # Military retirement pay is a separate input from the pension inputs that
    # pension_income adds, so both are listed; a household reports the amount
    # in one or the other. Appendix XXIII lists military pensions.
    - military_retirement_pay
    # Railroad Retirement is a retirement benefit that is not on the excluded
    # income list; section E-2.3 counts any income not listed elsewhere.
    - railroad_benefits
    # The FY2026 plan, section 1.9 (page 6), leaves "General Assistance
    # benefits" unchecked. The Guidelines list it as neither countable nor
    # excluded (pages 73-76), and E-2.3 (page 8) states "Other Countable Income
    # includes any income not listed above." The Guidelines govern.
    - general_assistance
    - survivor_benefits
    # The current application excludes VA disabilities, but this aggregate
    # cannot separate them from other VA receipts. Its inclusion is provisional
    # and does not accurately apply the documented VA subtype distinction.
    - veterans_benefits
    - workers_compensation
    - disability_benefits
    - alimony_income
    - rental_income
    - farm_rent_income
    - interest_income
    - ordinary_dividend_income
    - retirement_distributions
    - estate_income
    - capital_gains
    - gambling_winnings
# Retirement account withdrawals are distinct from pension income in the model.
# The manual explicitly counts capital gains and estate/trust settlements, not
# merely asset sale proceeds. Those inputs do not capture every principal payout.
# TANF, child support received and gifts are excluded (Guidelines pages 75-76;
# unchecked in the FY2026 plan).
metadata:
  unit: list
  period: year
  label: Ohio HEAP unearned income sources
