description: Ohio deducts these expenses from countable income under the Home Energy Assistance Program.
# The premium inputs are disjoint (payroll premiums are only in the pretax
# input), so each premium is deducted once. Non-taxable Health Care Spending
# Accounts (Guidelines Appendix XI) use the HSA payroll input, which holds
# employee deferrals only: a partial proxy, since no input holds health
# flexible spending account deferrals.
values:
  2025-07-01:
    - child_support_expense
    - health_insurance_premiums_without_medicare_part_b
    - pre_tax_health_insurance_premiums
    - health_savings_account_payroll_contributions
    - medicare_part_b_premium
