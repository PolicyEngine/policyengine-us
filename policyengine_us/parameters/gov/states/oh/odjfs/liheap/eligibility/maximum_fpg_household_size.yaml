description: Ohio uses the federal poverty guideline income limit through this household size before switching to state median income under the Home Energy Assistance Program.
# The 2022-2023 Guidelines apply 175% FPG to every household size; the FY2023
# plan's section 2.1 lists 60% SMI for all sizes, but the Guidelines govern.
# The July 2023-May 2024 application prints 175% FPG limits through size eight
# and adds $8,995 per added member, so that season keeps the all-sizes rule.
# From size 8, those 2022-2023 and 2023-2024 limits exceed the 42 U.S.C.
# 8624(b)(2)(B) ceiling, the greater of 150% FPG and 60% SMI (size 8: $81,602.50
# against $77,540 and $88,480 against $82,886); these unclaimed years keep the
# printed limits.
# The 2024-2025 application prints FPG limits through size seven, and the
# FY2025 plan's section 2.1 puts size eight on 60% SMI. The 2025-2026
# application applies 175% FPG to households up to eight members.
# For 2026-2027, JFS 00330 (page 1) applies 175% FPG to "households up to seven
# members" and 60% SMI to "households over seven members", as does the
# Consumers' Counsel sheet; the accepted FY2027 plan's item 2.1 (page 9) lists
# household size 9 for 60% SMI (its July 2026 draft listed 8). The application
# governs.
values:
  2022-07-01: .inf
  2024-07-01: 7
  2025-07-01: 8
  2026-07-01: 7
