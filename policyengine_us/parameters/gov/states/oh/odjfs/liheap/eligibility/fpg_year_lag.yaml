description: Ohio uses federal poverty guidelines from this many years before the modeled benefit year under the Home Energy Assistance Program.
# Model year 2026 represents the July 2025-May 2026 program season. The
# 2022-2023 Guidelines print 175% of the 2022 guidelines ($8,260 per added
# member), and the 2024-2025 application prints 175% of the 2024 guidelines.
values:
  2022-07-01: 1
