description: Ohio limits child eligibility to under this age under the Child Care Choice Voucher Program.

# The voucher's school-age row runs to age 15, two years past the Publicly
# Funded Child Care limit of 13. Its special-needs limit of 18 matches that
# program, so eligibility/special_needs_child_age_limit.yaml serves both.
values:
  2025-11-01: 15

