description: Massachusetts counts these sources as unearned income under the Child Care Financial Assistance program.
values:
  2020-01-01:
    - farm_rent_income
    - estate_income
    - dividend_income
    - interest_income
    - rental_income
    - pension_income
    - veterans_benefits
    - military_retirement_pay
    - alimony_income
    - child_support_received
    - social_security
    - ssi
    - total_unemployment_compensation
    - workers_compensation
  # Effective October 1, 2023, the interim policies exclude Social Security
  # (all types), SSI, child support, and veterans disability benefits, and
  # the countable list becomes exclusive; interest income is not on it.
  # CCFA mapping assumption: veterans_benefits contains disability payments.
  2023-10-01:
    - farm_rent_income
    - estate_income
    - dividend_income
    - rental_income
    - pension_income
    - military_retirement_pay
    - alimony_income
    - total_unemployment_compensation
    - workers_compensation
  2025-04-01:
    - farm_rent_income
    - estate_income
    - dividend_income
    - rental_income
    - pension_income
    - military_retirement_pay
    - alimony_income
    - total_unemployment_compensation
    - workers_compensation
    - pfml_benefits
