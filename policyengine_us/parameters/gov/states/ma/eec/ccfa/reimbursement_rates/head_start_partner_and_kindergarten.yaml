# 2025-07-01 values are FY2026 rates per advisory CCFA-26-02. EEC
# implemented the increase on April 1, 2026, retroactive to July 1,
# 2025. The full-day rate equals the region's center-based preschool
# rate, so it carries that rate's targeted increases in the Northeast
# and Western, Central & Southeast regions.
