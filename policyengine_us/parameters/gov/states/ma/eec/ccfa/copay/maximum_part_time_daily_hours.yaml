description: Massachusetts charges the half-day parent fee for care of at most this many hours per day under the Child Care Financial Assistance program.

# The 2022 guide sets the half-day parent fee at 6 or fewer hours per day. No
# fee-side source restates an hour boundary after that. The 2024-07-01 value is
# an assumption: it follows the FY2025 rate sheet's part-time definition for
# reimbursement, so that a child is not part time for payment and full time
# for the fee. The May 2026 consolidated policies tie the half fee to a
# part-time authorization instead, which the model does not track:
# https://www.mass.gov/doc/eec-ccfa-2026-04-income-eligible-consolidated-policies-may-6-2026/download#page=46
# Keep these values in step with the second threshold of
# reimbursement_rates/amount_ratio.yaml.
values:
  2020-01-01: 6
  2024-07-01: 5

metadata:
  unit: hour
  period: day
  label: Massachusetts CCFA maximum part-time daily care hours
  reference:
    - title: Financial Assistance Policy Guide, Chapter 11.2(A)(3)
      href: https://www.mass.gov/doc/eecs-financial-assistance-policy-guide-february-1-2022/download#page=76
    - title: FY 2024 Child Care Financial Assistance Daily Reimbursement Rates (revised July 1, 2024)
      href: https://www.mass.gov/doc/fiscal-year-2024-child-care-financial-assistance-daily-reimbursement-rates/download#page=2
    - title: FY 2025 Child Care Financial Assistance Daily Reimbursement Rates
      href: https://www.mass.gov/doc/fiscal-year-2025-child-care-financial-assistance-daily-reimbursement-rates/download#page=2
