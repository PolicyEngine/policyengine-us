description: Massachusetts assigns this unemployment insurance contribution rate to each new employer.
values:
  # New employers pay the rate on the 10.5 to 11.0 positive reserve line of
  # the schedule in force. Chapter 63 of the Acts of 2017 set schedule D for
  # 2018 and schedule E for 2019, the trust fund triggered schedule E for
  # 2020, Chapter 9 of the Acts of 2021 kept schedule E for 2021 and 2022, and
  # the Department of Unemployment Assistance applied schedules A, C and D in
  # 2023, 2024 and 2025. These rates leave out the workforce training fund
  # contribution, and new employers do not pay the COVID-19 recovery
  # assessment.
  2018-01-01: 0.0213
  2019-01-01: 0.0242
  2023-01-01: 0.0145
  2024-01-01: 0.0187
  2025-01-01: 0.0213
  2026-01-01: 0.0242

