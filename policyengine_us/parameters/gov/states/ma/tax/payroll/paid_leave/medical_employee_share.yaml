description: Massachusetts limits an employer's deduction from wages to this share of the medical leave contribution under the Paid Family and Medical Leave program.
values:
  0000-01-01: 0
  2024-01-01: 0.4
  # Acts 2026 c. 101 s. 25 strikes "40" in s. 6(c)(1), (d) and (e)(1) and inserts "100".
  # Dated 2027-01-01 to match the rates the Department of Family and Medical Leave published. Section 45 applies ss. 25-26 to taxable years from 2026, and s. 43(a) directs guidance for calendar year 2027.
  2027-01-01: 1

