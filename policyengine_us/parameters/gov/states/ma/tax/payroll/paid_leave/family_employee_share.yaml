description: Massachusetts limits an employer's deduction from wages to this share of the family leave contribution under the Paid Family and Medical Leave program.
values:
  0000-01-01: 0
  # Contributions began October 1, 2019, after legislation delayed the start by
  # three months from July 1, 2019. From the start the employer could withhold
  # the whole family leave contribution.
  2019-10-01: 1
  # Acts 2026 c. 101 s. 26 strikes "100" in s. 6(c)(2), (d) and (e)(2) and inserts "40".
  # Dated 2027-01-01 to match the rates the Department of Family and Medical Leave published. Section 45 applies ss. 25-26 to taxable years from 2026, and s. 43(a) directs guidance for calendar year 2027.
  2027-01-01: 0.4

