description: Massachusetts adds the excess business loss back to 5.0% income if this is true.

values:
  2018-01-01: false
  # Massachusetts conforms to the Code as amended on January 1, 2022 for tax
  # years beginning on or after January 1, 2022 (St. 2022, c. 126, ss. 30 and
  # 189), including Section 461(l) (TIR 23-5), and to the Code as amended on
  # January 1, 2024 from tax year 2024 (St. 2024, c. 140, ss. 100 and 251).
  2022-01-01: true
  # The Code as amended on January 1, 2024 limits excess business losses
  # through the 2028 taxable year (TIR 24-14). Massachusetts does not conform
  # to the OBBBA extension of the limitation (TIR 26-4).
  2029-01-01: false

