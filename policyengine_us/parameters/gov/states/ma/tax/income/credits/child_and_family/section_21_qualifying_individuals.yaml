description: Massachusetts counts qualifying individuals under IRC Section 21 in its child and family tax credit if this is true; a dependent incapable of self-care is one even when the taxpayer can be claimed as a dependent, since Section 21(b)(1)(B) determines dependency without regard to Section 152(b)(1).
values:
  # The predecessor household credit for 2021 and 2022 covered only IRC
  # Section 152 dependents; Chapter 50 of the Acts of 2023 added Section 21
  # qualifying individuals from 2023.
  2021-01-01: false
  2023-01-01: true
metadata:
  unit: bool
  period: year
  label: Massachusetts child and family tax credit counts Section 21 qualifying individuals
  reference:
