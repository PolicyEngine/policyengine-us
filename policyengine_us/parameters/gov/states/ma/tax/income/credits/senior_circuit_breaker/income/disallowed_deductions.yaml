description: Income sources re-added to total income for the Massachusetts Senior Circuit Breaker credit.
# M.G.L. c.62 § 6(k)(1) re-adds "cash, but not in-kind, public assistance", so
# in-kind nutrition assistance such as SNAP and WIC is excluded.
values:
  2001-01-01:
    - social_security
    - tax_exempt_unemployment_compensation
    - tax_exempt_pension_income
    - tax_exempt_interest_income
    - ssi
    - ma_state_supplement
    - tanf
metadata:
