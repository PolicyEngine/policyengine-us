description: Income sources re-added to total income for the Massachusetts Senior Circuit Breaker credit.
# M.G.L. c.62 § 6(k)(1) re-adds "cash, but not in-kind, public assistance", so
# in-kind nutrition assistance is excluded. SNAP and WIC are commented out below
# rather than deleted, because the statute and DOR guidance point opposite ways.
#
# Statute § 6(k)(1) enumerates eight add-backs. Item 2 is "cash, but not in-kind,
# public assistance", which excludes SNAP and WIC. Item 8 is the catch-all "gross
# receipts from any other source", which is broad enough to reach them.
#
# DOR resolves that tension in favor of inclusion for SNAP: "Cash public
# assistance (Schedule CB, Line 6) - Includes food stamps and welfare", repeated
# as "Food stamps - See cash public assistance above". DOR's exclusion list
# exempts "in-kind payments ... otherwise not defined as ... Gross receipts",
# so DOR is relying on item 8, not item 2. DOR never mentions WIC.
#
# We follow the statute's item 2 here: reading item 8 to sweep in in-kind aid
# would make the words "but not in-kind" surplusage. Revisit if DOR clarifies.
#
# The item 8 catch-all is re-added through the sources Schedule CB line 6 names
# that have a variable: workers' compensation and disability pay outside federal
# gross income. Capital losses and the collectibles deduction taken in reaching
# Part A and Part C AGI are re-added in ma_scb_total_income.
#
# Not re-added, for lack of a corresponding variable: tax-exempt dividends
# (§ 6(k)(1) item 3 covers "tax-exempt interest and dividends"), gifts and
# return of capital.
values:
  2001-01-01:
    - social_security
    - tax_exempt_unemployment_compensation
    - tax_exempt_pension_income
    - taxable_public_pension_income
    # Schedule CB line 5: "Pensions/annuities/IRA/Keogh distributions not taxed
    # on your Massachusetts tax return".
    - tax_exempt_retirement_distributions
    - tax_exempt_interest_income
    # Interest on U.S. obligations, subtracted in ma_part_b_agi. Schedule CB
    # line 3 worksheet, line 8 adds back Schedule B line 6a.
    - us_govt_interest
    - ssi
    - ma_state_supplement
    - tanf
    # Massachusetts cash assistance (EAEDC), counted for the SPM unit like TANF.
    - ma_eaedc
    - military_retirement_income
    # Schedule CB line 6: "disability income, gifts, sick pay, worker's
    # compensation and return of capital".
    - workers_compensation
    - tax_exempt_disability_benefits
    # Unemployment compensation excluded from Massachusetts gross income by
    # St. 2021, c. 9, § 26(b) (Schedule Y line 9c, 2021 only). The 2021
    # Schedule CB line 3 worksheet: "do not exclude any amount on Schedule Y,
    # line 9 that represents a deduction for unemployment compensation".
    - ma_qualified_unemployment_deduction
    # In-kind under § 6(k)(1) item 2; see the note above before re-enabling.
    # - snap
    # - wic
