description: Massachusetts calculates benefit level by comparing household's income and federal poverty guideline ratio with these thresholds under the Low Income Home Energy Assistance Program.
metadata:
  type: single_amount
  threshold_unit: /1
  amount_unit: int
  period: year
  label: Massachusetts benefit level based on income and FPG ratio 
  reference:
    - title: Fiscal Year 2022 Home Energy Assistance Program (HEAP) Income Eligibility and Benefit Levels 
      href: https://www.masslegalservices.org/system/files/blog/FY_2022_LIHEAP_Income_Eligibility_and_Benefit_Chart_APRIL_2022_UTILITY_Increase.pdf 
    - title: Fiscal Year 2023 Home Energy Assistance Program (HEAP) Income Eligibility and Benefit Levels 
      href: https://web.archive.org/web/20221024195401/https://www.mass.gov/doc/fy-2023-liheap-income-eligibility-and-benefit-level-chart-october-2022/download 
    - title: Fiscal Year 2024 Home Energy Assistance Program (HEAP) Income Eligibility and Benefit Levels 
      href: https://www.commteam.org/wp-content/uploads/2024/03/FY-2024-LIHEAP-Income-Eligibility-and-Benefit-Chart_Incomes-March-2024-Increase.pdf
    - title: Fiscal Year 2025 Home Energy Assistance Program (HEAP) Income Eligibility and Benefit Levels
      href: https://web.archive.org/web/20250720165524/https://www.mass.gov/doc/fy-2025-heap-income-eligibility-benefit-chart-may-8-2025/download
    - title: Massachusetts Department of Public Utilities, Energy Burden Inquiry, six tiers matching the HEAP definitions
      href: https://www.mass.gov/info-details/energy-burden-inquiry

# Each threshold is the top of the level before it. Level 1 is income at or
# below 100% of the poverty level, level 2 is above 100% and at or below 125%,
# and level 6 is above 200%. The formula looks the ratio up with right=True,
# which needs a first threshold below zero for zero income to reach level 1.
brackets:
  - threshold:
      2021-01-01: -.inf
    amount:
      2021-01-01: 1
  - threshold:
      2021-01-01: 1
    amount:
      2021-01-01: 2
  - threshold:
      2021-01-01: 1.25
    amount:
      2021-01-01: 3
  - threshold:
      2021-01-01: 1.5 
    amount:
      2021-01-01: 4
  - threshold:
      2021-01-01: 1.75
    amount:
      2021-01-01: 5
  - threshold:
      2021-01-01: 2
    amount:
      2021-01-01: 6
