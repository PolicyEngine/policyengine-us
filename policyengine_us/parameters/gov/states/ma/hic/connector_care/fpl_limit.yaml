description: Massachusetts limits income to this share of the federal poverty line under the ConnectorCare program.
values:
  # For PY2026 the operational program caps household income at 400% FPL (Plan Type
  # 3C ceiling), applied as a "<=" comparison. The 500% pilot has lapsed
  # operationally: the 2026 ConnectorCare Overview states households above 400% FPL
  # do not qualify and omits Plan Type 3D (400.1-500% FPL) from its band table. The
  # amended 956 CMR 12.04(3)(a)1 still reads "at or below 500 percent of the FPL"
  # and still defines Plan Type 3D, but that superseded pilot text is not modeled.
  # Incomes over 300% FPL qualify only under the ConnectorCare Expansion Pilot,
  # St. 2023 c.28 s.81, which applies "notwithstanding" the 300% limit in
  # M.G.L. c.176Q s.3(b) and began by January 1, 2024. St. 2025 c.9 s.96 made
  # it a 3-year pilot, and the FY2027 budget (St. 2026 c.137) s.92 makes it a
  # 4-year pilot, so it covers plan years 2024 to 2027; s.102 funds "the fourth
  # year of the pilot program". The 2027 Guide to Subsidies keeps Plan Type 3C
  # (300% to 400% FPL) for plan year 2027.
  2026-01-01: 4
  # From PY2028 the pilot has ended, so the limit returns to the statutory
  # "at or below 300 per cent of the federal poverty guidelines" of M.G.L.
  # c.176Q s.3(b), applied as "<=". Plan Type 3C ends with it.
  2028-01-01: 3

