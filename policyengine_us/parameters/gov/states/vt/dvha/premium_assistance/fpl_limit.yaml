description: Vermont limits income eligibility to this share of the federal poverty line under the Vermont Premium Assistance program.
values:
  # Vermont Health Connect's 2027 income thresholds put VPA at 300% of the
  # 2026 guideline ($47,880 for one person), and the 2027 APTC worksheet,
  # Section VII, computes VPA "ONLY if HH income is at or below 300% FPL".
  2026-01-01: 3

# 205APTC-EW-2027 is a dynamic (XFA) form that only Adobe Reader renders; its
# page anchor refers to that rendering, where Section VII is on page 2.
