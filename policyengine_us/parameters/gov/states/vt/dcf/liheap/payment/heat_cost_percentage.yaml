description: Vermont pays this percentage of the standard heating cost, based on gross income as a share of the federal poverty guideline, under the Low Income Home Energy Assistance Program.
# Rule 2915(b) delegates the percentage of poverty to the P-2914A table of
# monthly dollar bands. Each threshold after -.inf tops the band below it: the
# band's monthly dollar top is the threshold times the whole-dollar monthly
# guideline (vt_liheap_fpg / 12), rounded up to the dollar, and monthly income at
# or below a top stays in that band (right-closed). This reproduces all 165
# printed 2025-26 tops for sizes 1-15 (size 1: 0.74 x 1,304 = 964.96, top $965;
# size 2: 0.74 x 1,763 = 1,304.62, top $1,305). No 2026-27 P-2914A is published;
# 2027 applies the same construction to the 2026 guideline. Income above the
# income limit is excluded by eligibility, not here.
