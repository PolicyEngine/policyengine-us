# 2026-2027 Benefits Matrix prints the same cells for the 2026-27 season.
# The wood_and_coal row is the "Firewood, Wood Pellets and Coal" row; the
# formula maps both WOOD and COAL heating types to it, and SOLAR to the
# electricity row. The 4 column is the "4+ Bedrooms" column. Earlier years are
# unverified backfill.

