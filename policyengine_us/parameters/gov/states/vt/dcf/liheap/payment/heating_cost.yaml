metadata:
  unit: currency-USD
  period: year
  label: Vermont LIHEAP standard heating cost
  breakdown:
    - vt_liheap_dwelling_type
    - [natural_gas, propane, oil, kerosene, electricity, wood_and_coal]
    - range(1, 5)
  breakdown_labels:
