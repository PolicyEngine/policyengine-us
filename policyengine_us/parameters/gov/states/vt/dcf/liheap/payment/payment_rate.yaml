description: Vermont pays this share of the base benefit as the ratable benefit under the Low Income Home Energy Assistance Program.
# ESTIMATE. DCF sets the payment rate by procedure each season (33 V.S.A.
# 2605(c); rule 2914(a)(8)) and does not publish it: P-2914B sends staff to the
# ACCESS system for the current rate. 0.51 is inferred from the FFY2026 plan's
# $2,089 maximum benefit, which equals floor(4,552 x 0.90 x 0.51), the largest
# standard heating cost times the top heat cost percentage; 51% is the only
# whole percent that reproduces it. P-2914D's worked example uses 29% for
# training only. DCF had not set the 2026-27 rate by September 16, 2026, and on
# October 23, 2026 the Emergency Board funded a larger 2026-27 benefit for oil
# and kerosene households (about 62 percent of estimated heating need, against
# about 45 percent in 2025-26) without publishing a rate, so 0.51 carries
# forward as an unverified estimate.
values:
  2025-10-01: 0.51

