description: Vermont rounds the monthly poverty guideline of each household size up to this size, and adds the rounded monthly additional-person amount for each person above it, under the Low Income Home Energy Assistance Program.
# HHS lists the guideline for households of up to eight people, plus an amount for
# each additional person. P-2913 and P-2914A print monthly dollars for sizes 1-15
# without stating their derivation. Dividing each listed guideline by 12 and rounding
# half up to the dollar, then adding the additional-person amount divided by 12 and
# rounded the same way for each person above eight, reproduces all 165 P-2914A band
# tops, all 15 P-2913 limits and the 15 DCF 2026-27 limits; this is a numerical
# inference. Rounding each size's own guideline divided by 12 reproduces only 2 of
# the 55 band tops for sizes 11-15 (the other 53 by $1-$4).
values:
  2025-03-01: 8

