description: Vermont uses these sources as earned income under the Low Income Home Energy Assistance Program.
# Rule 2911.3 counts self-employment income, including rent from property a
# member manages and roomer or boarder payments, under the 3SquaresVT method.
# The model has only net business income, so each listed source is floored at
# zero and counted in full; a loss in one source cannot offset another.
# Under 7 CFR 273.11(a)(2)(ii) a farmer with $1,000 or more of annual gross
# proceeds offsets a farm loss against other income; with no gross-proceeds
# input, farm_operations_income is floored like the other sources.
values:
  2024-06-22:
    - employment_income
    - self_employment_income
    - sstb_self_employment_income
    - farm_operations_income
    # Partnership and S corporation income from a member's own business.
    - partnership_s_corp_income

