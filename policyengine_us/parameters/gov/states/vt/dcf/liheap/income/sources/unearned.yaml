description: Vermont uses these sources as unearned income under the Low Income Home Energy Assistance Program.
# Rule 2911.2(b) items: public assistance (SSI and General Assistance; Reach Up
# is added once through the SPM-unit tanf aggregate), annuities, pensions and
# retirement benefits, veterans' and disability benefits, workers' and
# unemployment compensation, survivors or social security benefits (Social
# Security counted gross), strike benefits, rental income, child support and
# alimony, dividends and interest, trust withdrawals and other direct money
# payments. Each listed source is floored at zero. Royalties, non-excluded scholarships and foster care or
# difficulty of care payments have no specific inputs.
values:
  2024-06-22:
    - ssi
    # The state AABD supplement to SSI is public assistance under rule
    # 2911.2(b)(1).
    - vt_aabd
    - general_assistance
    - pension_income
    # Military retired pay and Survivor Benefit Plan annuities are separate
    # inputs from the pension inputs that pension_income adds.
    - military_retirement_income
    # Retirement account distributions are retirement benefits under rule
    # 2911.2(b)(4) and a separate input from pension_income.
    - retirement_distributions
    - veterans_benefits
    - disability_benefits
    - workers_compensation
    - total_unemployment_compensation
    - social_security
    # Survivor benefits other than Social Security survivor benefits.
    - survivor_benefits
    - strike_benefits
    # Rent from property a member manages is self-employment income under rule
    # 2911.3(a)(1); either way it counts, so it is listed once here.
    - rental_income
    - farm_rent_income
    - child_support_received
    - alimony_income
    - interest_income
    - ordinary_dividend_income
    - estate_income
    # Rule 2911.2(b)(16) also counts "all other direct money payments from any
    # source that can be construed to be a gain or benefit".
    - miscellaneous_income

