description: Vermont limits the Child Care Financial Assistance Program to children younger than this age if they are physically or mentally incapable of self-care or are under court supervision.
# Regulation I.B.6 sets the same under-19 limit for both routes, matching the
# CCDF Plan's upper age of 18.00; the June 2024 rule revision restates I.B.6.
values:
  2009-02-09: 19

