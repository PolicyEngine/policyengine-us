description: Vermont limits the Child Care Financial Assistance Program to children with special needs younger than this age.
# Regulation I.B.6 defines a child as under 19 if incapable of self-care "or
# under court supervision", so the court-supervision route shares this ceiling
# (CCDF Plan FFY 2025-2027 section 2.2.1(c), upper age 18.00).
values:
  2009-02-09: 19

