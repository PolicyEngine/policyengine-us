description: Vermont applies a child citizenship or qualified-immigrant test if this is true, under the Child Care Financial Assistance Program.
# As part of the Act 76 (2023) rollout, the requirement that participating
# children have an eligible citizenship status ended June 30, 2024:
# "Citizenship status of participating children will no longer be a factor
# for CCFAP eligibility." DCF covers federally ineligible children with
# state funds.
values:
  2009-02-09: true
  2024-07-01: false

