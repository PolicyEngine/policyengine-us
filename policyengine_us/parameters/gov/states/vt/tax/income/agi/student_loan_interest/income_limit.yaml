description: Vermont allows the student loan interest subtraction only to filers with federal adjusted gross income at or below this amount, by filing status; no surviving spouse qualifies.
metadata:
  propagate_metadata_to_children: true
  unit: currency-USD
  period: year
  label: Vermont student loan interest subtraction income limit
  breakdown:
    - filing_status
  reference:
    - title: 32 V.S.A. 5811(29)(B)
      href: https://legislature.vermont.gov/statutes/section/32/151/05811
    - title: "2021, No. 138 (Adj. Sess.), §§ 5, 13(b) #page 5,15"
      href: https://legislature.vermont.gov/Documents/2022/Docs/ACTS/ACT138/ACT138%20As%20Enacted.pdf#page=5
    - title: 2025 Vermont income tax booklet, Schedule IN-112 line 16c
      href: https://tax.vermont.gov/sites/tax/files/documents/Income-Booklet-2025.pdf#page=33
SINGLE:
  2022-01-01: 120_000
HEAD_OF_HOUSEHOLD:
  2022-01-01: 120_000
SEPARATE:
  2022-01-01: 120_000
SURVIVING_SPOUSE:
  # The 2025 IN-112 line 16c instructions say "All other filers" get $120,000,
  # but § 5811(29)(B) names no limit for a qualifying surviving spouse, so a
  # surviving spouse never qualifies.
  2022-01-01: -.inf
JOINT:
  2022-01-01: 200_000
