description: Vermont applies the renter credit income limits and fair market rents for this household size to larger households.
# The income limit and fair market rent tables run through family size 8. The
# Department of Taxes' renter credit calculators (Calculator sheet, cells
# G11-G12) look up IF(Household_Size>8,8,Household_Size) in the income limit
# tables and accept family sizes 1 through 10. Their credit amount lookup (cell
# G13) caps the size at 4, which the fair market rent table already reflects by
# repeating the 4-person value through size 8.
values:
  2021-01-01: 8
metadata:
  unit: person
  period: year
  label: Vermont renter credit maximum household size
