description: Vermont applies the renter credit income limits and fair market rents for this household size to larger households.
# The income limit and fair market rent tables run through family size 8. The
# Department of Taxes' renter credit calculators use Calculator sheet cells
# G10-G12 in 2021-2022 and G11-G13 in 2023-2025. The income limit lookups use
# IF(Household_Size>8,8,Household_Size), and the calculators accept family sizes
# 1 through 10. Their credit amount lookup caps the size at 4, which the fair
# market rent table already reflects by repeating the 4-person value through
# size 8.
values:
  2021-01-01: 8
metadata:
  unit: person
  period: year
  label: Vermont renter credit maximum household size
