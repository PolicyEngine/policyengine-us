  2019-01-01: 15_600
  2020-01-01: 16_100
  2021-01-01: 14_100
  2022-01-01: 15_500
  2023-01-01: 13_500
  2024-01-01: 14_300
  2025-01-01: 14_800
  2026-01-01: 15_400

