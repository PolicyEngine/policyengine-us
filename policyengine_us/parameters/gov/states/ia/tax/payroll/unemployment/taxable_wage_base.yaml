description: Iowa limits employer unemployment insurance contributions to this amount of each worker's annual wages.
values:
  2018-01-01: 29_900
  2019-01-01: 30_600
  2020-01-01: 31_600
  2021-01-01: 32_400
  2022-01-01: 34_800
  2023-01-01: 36_100
  2024-01-01: 38_200
  2025-01-01: 39_500
  # Senate File 607 (2025) cut the base to one-third of the statewide average
  # annual wage from 2026.
  2026-01-01: 20_400

