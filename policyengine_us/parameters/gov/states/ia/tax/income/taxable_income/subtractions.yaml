    # Line 1B
    - us_govt_interest
    # Dividends from federal securities
    # Line 4B
    - military_retirement_income
    # Line 5B 
    - taxable_social_security
    # Line 6B
    - military_service_income
    # Line 7B
    - ia_pension_exclusion
    # Railroad unemployment income
    # Bonus Depreciation
    # Iowa Health Insurance Deduction
    # Iowa capital gains deduction
    - ia_529_plan_subtraction
    # Schedule 1 line 19b, code h (IA 2440)
    - ia_disability_income_exclusion
    # Schedule 1, line 11, column B, and line 19
    - ia_other_subtractions

