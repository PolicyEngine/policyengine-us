description: Iowa gross income sources.
values:
  2021-01-01:
    - irs_employment_income
    - taxable_interest_income
    - dividend_income
    - alimony_income
    - self_employment_income
    - sstb_self_employment_income
    - capital_gains
    - taxable_pension_income
    - taxable_retirement_distributions
    - taxable_roth_conversions
    - partnership_s_corp_income
    - rental_income
    # Line 10: rents, royalties, partnerships, estates, etc. (federal Schedule E)
    - estate_income
    - farm_operations_income
    - taxable_unemployment_compensation
    - miscellaneous_income
    # Line 14 takes "taxable income not reported on lines 1-13"; line 1 is
    # W-2 income only. Strike benefits are federal Schedule 1 line 8 income
    # in 2021 and Form 1040 line 1h income from 2022.
    - taxable_strike_benefits
    - ia_other_additions

