description: Iowa limits the residential care facility daily rate to this amount under the State Supplementary Assistance program.
values:
  2026-01-01: 38.47

metadata:
  unit: currency-USD
  period: day
  label: Iowa SSA maximum residential care daily rate
  # NOTE: 441 IAC 52.1 adjusts assistance standards each January 1 for the SSA
  # cost-of-living adjustment but publishes no method, so this value stays at
  # its 2026 level until a later schedule is added.
  reference:
