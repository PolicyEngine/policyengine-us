description: Iowa pays at most this Regular Assistance benefit under the Low Income Home Energy Assistance Program.
# With FY26 values the matrix cannot reach this cap: the largest total is
# 8 poverty + 5 targeting + 5 fuel = 18 points, or $720. The cap is kept as the
# published rule; only the flat deliverable fuel amount equals it.
values:
  2025-10-01: 800

