description: Iowa applies the savings points adjustment to households whose savings exceed this amount under the Low Income Home Energy Assistance Program.
# Section 4.40 item 4 describes the savings test as "Interest and dividend-
# bearing accounts (this includes high-interest bank accounts, cash on hand,
# CDs, and other investments that can be accessed without penalty to the
# household)". Appendix C excludes IAble accounts, trusts and penalty-locked
# retirement accounts from savings. The model maps savings to
# spm_unit_cash_assets (bank, stock and bond assets).
values:
  2025-10-01: 50_000

metadata:
  unit: currency-USD
  period: year
  label: Iowa LIHEAP savings threshold
