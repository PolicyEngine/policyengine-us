description: Iowa counts the income of household members at or above this age under the Low Income Home Energy Assistance Program.
# Section 6.20 counts "the gross income of all household members aged 18 and
# over"; Appendix C records Social Security paid to members under 18 at $0.00
# and leaves full-time earnings of under-18 members "NOT included as income".
# Section 6.00 (page 24) states an exception for minors "working full-time";
# that conflict is resolved in favor of Sections 6.20 and Appendix C and the
# FFY2026 plan, which leaves "Earned income of a child under the age of 18"
# unchecked.
values:
  2025-10-01: 18

metadata:
  unit: year
  period: year
  label: Iowa LIHEAP minimum age for countable income
  reference:
    - title: Iowa LIHEAP FY26 Policy and Procedures Manual, Section 6.20 Calculating Income (members aged 18 and over), Section 6.00 Income, Appendix C Income Earned by HH Members under the age of 18 and Social Security Benefits (only count for members 18 and older), pages 26, 24, 102 and 114
      href: https://hhs.iowa.gov/media/17262/download?inline#page=26
    - title: Iowa LIHEAP FFY2026 Detailed Model Plan, Section 1.9 (earned income of a child under the age of 18 not counted), page 6
      href: https://liheapch.acf.gov/docs/2026/state-plans/IA_Plan_2026.pdf#page=6
