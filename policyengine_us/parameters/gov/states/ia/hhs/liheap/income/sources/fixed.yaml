description: Iowa treats these income sources as fixed income for the fixed-income-only targeting factor under the Low Income Home Energy Assistance Program.
# Definitions, Fixed Income Household: "A household that receives only one or
# more of the following income types ... Social Security Administration (SSA)
# Benefits, Supplemental Security Income (SSI), Social Security Disability
# Insurance (SSDI), Veterans' Assistance, VA Service-Connected Disability
# Pension, VA Non-Service-Connected Disability Pension, and pensions. Only mark
# 'fixed income' when that is the ONLY source(s) of income." Appendix C notes
# that child support, alimony and variable annuities are not fixed income.
# Keep this list in the same relative order as sources/unearned.yaml: the
# fixed-income-only test compares two sums, and the same order keeps them
# bit-identical when every other source is zero.
values:
  2025-10-01:
    - social_security
    - ssi
    - pension_income
    - veterans_benefits

metadata:
  unit: list
  period: year
  label: Iowa LIHEAP fixed income sources
  reference:
    - title: Iowa LIHEAP FY26 Policy and Procedures Manual, Definitions, Fixed Income Household, page 81, and Appendix I Payment Matrix, Fixed Income Only targeting factor, page 137
      href: https://hhs.iowa.gov/media/17262/download?inline#page=81
