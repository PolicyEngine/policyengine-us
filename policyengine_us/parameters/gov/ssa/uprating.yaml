description: The US indexes Social Security benefits (OASDI and SSI) according to this schedule, annually updating based on CPI-W in the third quarter of the prior year.
values:
  # Actuals.
  2022-01-01: 268.421 # 2021Q3: (267.789 + 268.387 + 269.086) / 3
  2023-01-01: 291.901 # 2022Q3: (292.219 + 291.629 + 291.854) / 3
  2024-01-01: 301.236 # 2023Q3: (299.899 + 301.551 + 302.257) / 3
  2025-01-01: 308.729 # 2024Q3: (308.501 + 308.640 + 309.046) / 3
  2026-01-01: 317.265 # 2025Q3: (316.349 + 317.306 + 318.139) / 3
  2027-01-01: 328.746 # 2026Q3: (327.104 + 328.481 + 330.654) / 3
  # Forecasts carry the 2026Q3 CPI-W actual forward at CBO's February 2026
  # quarterly CPI-U growth: 2026Q3 actual * CBO CPI-U (Q3) / CBO CPI-U (2026Q3).
  2028-01-01: 336.945 # 2027Q3: 328.746 * 341.281 / 332.976
  2029-01-01: 344.854 # 2028Q3: 328.746 * 349.291 / 332.976
  2030-01-01: 352.722 # 2029Q3: 328.746 * 357.260 / 332.976
  2031-01-01: 360.699 # 2030Q3: 328.746 * 365.340 / 332.976
  2032-01-01: 368.845 # 2031Q3: 328.746 * 373.591 / 332.976
  2033-01-01: 377.171 # 2032Q3: 328.746 * 382.024 / 332.976
  2034-01-01: 385.681 # 2033Q3: 328.746 * 390.644 / 332.976
  2035-01-01: 394.385 # 2034Q3: 328.746 * 399.460 / 332.976
  2036-01-01: 403.287 # 2035Q3: 328.746 * 408.476 / 332.976
