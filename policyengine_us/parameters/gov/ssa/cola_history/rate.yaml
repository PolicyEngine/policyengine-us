documentation: |
  Dates are effective benefit months, not payment months. The June 1975-1982
  adjustments were first paid in July of the same year; adjustments from
  December 1983 were first paid the following January. There was no December
  1982 or June 1983 adjustment. Explicit zero entries retain the 2009, 2010,
  and 2015 determinations. December 1999 includes the statutory correction to
  2.5 percent. This audited series ends with December 2025, first paid January
  2026; later payment-year rates use the existing gov.ssa.uprating schedule.
