description: SSA uses this indicator to determine whether food counts in SSI in-kind support and maintenance calculations.

# The final rule removing food from in-kind support and maintenance took
# effect September 30, 2024 (89 FR 21199, DATES). The consuming variables
# are MONTH-defined and read this value at the start of each month;
# ssi_pmv_applies also reads it at the end of the month to find the month in
# which food stops counting.
values:
  1975-01-01: true
  2024-09-30: false

metadata:
  unit: bool
  period: month
  label: SSI ISM food counts
  reference:
    - title: 20 CFR § 416.1130 - Introduction to in-kind support and maintenance (as amended)
      href: https://www.law.cornell.edu/cfr/text/20/416.1130
    - title: "89 FR 21199, Omitting Food from In-Kind Support and Maintenance Calculations #page 1,11"
      href: https://www.govinfo.gov/content/pkg/FR-2024-03-27/pdf/2024-06464.pdf#page=1
