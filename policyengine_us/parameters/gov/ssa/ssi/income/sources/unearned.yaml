description: The US counts these income sources as unearned income for Supplemental Security Income.
values:
  1975-01-01:
    # (a) Annuities, pensions, and other periodic payments.
    - pension_income
    - social_security
    # NOTE: Household net income, SNAP, HUD annual income and other program
    # income lists count social_security and ssi but not railroad_benefits, so
    # an SSI recipient's railroad annuity drops out of them.
    # https://github.com/PolicyEngine/policyengine-us/issues/10551
    - railroad_benefits
    - disability_benefits
    - veterans_benefits
    - survivor_benefits
    - workers_compensation
    - total_unemployment_compensation
    - retirement_distributions
    - military_retirement_income
    - gi_cash_assistance
    # (b) Alimony and support payments.
    - alimony_income
    - child_support_received
    - financial_assistance
    # (c) Dividends, interest, and certain royalties.
    - dividend_income
    - interest_income
    # (d) Rents.
    - rental_income
    # (e) Death benefits.
    # (f) Prizes and awards.
    # (g) Gifts and inheritances.
    # (h) Support and maintenance in kind.
  # The exclusion took effect July 1, 2004. Annual simulations select this
  # source list beginning in 2005 because SSI unearned income is annual.
  2004-07-01:
    # (a) Annuities, pensions, and other periodic payments.
    - pension_income
    - social_security
    - railroad_benefits
    - disability_benefits
    - veterans_benefits
    - survivor_benefits
    - workers_compensation
    - total_unemployment_compensation
    - retirement_distributions
    - military_retirement_income
    - gi_cash_assistance
    # (b) Alimony and support payments.
    - alimony_income
    - child_support_received
    - financial_assistance
    # (d) Rents.
    - rental_income
    # (e) Death benefits.
    # (f) Prizes and awards.
    # (g) Gifts and inheritances.
    # (h) Support and maintenance in kind.
