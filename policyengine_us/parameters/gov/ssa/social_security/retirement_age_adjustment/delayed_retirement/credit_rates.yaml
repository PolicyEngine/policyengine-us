description: The US delayed retirement credit rates by birth year.
metadata:
  type: single_amount
  threshold_unit: year
  amount_unit: /1
  label: Delayed retirement credit rates by birth year
  reference:
    - title: 42 U.S. Code § 402(w)(6)
      href: https://www.law.cornell.edu/uscode/text/42/402#w_6
    - title: SSA POMS RS 00615.692D - Chart for Delayed Retirement Credits
      href: https://secure.ssa.gov/poms.nsf/lnx/0300615692
    - title: SSA Delayed Retirement Credits
      href: https://www.ssa.gov/OACT/quickcalc/early_late.html

# 402(w)(6) keys the rate to the year of first eligibility (age 62); POMS
# RS 00615.692D gives the equivalent birth-date ranges, each starting on
# January 2.
brackets:
  - threshold:
      1900-01-01: 1900
    amount:
      1900-01-01: 0.01      # Before 1917: 402(w)(6)(A), eligible before 1979
  - threshold:
      1900-01-01: 1917
    amount:
      1900-01-01: 0.03      # 1917-1924: 402(w)(6)(B), eligible 1979-1986
  - threshold:
      1900-01-01: 1925
    amount:
      1900-01-01: 0.035     # 1925-1926
  - threshold:
      1900-01-01: 1927
    amount:
      1900-01-01: 0.04      # 1927-1928
  - threshold:
      1900-01-01: 1929
    amount:
      1900-01-01: 0.045     # 1929-1930
  - threshold:
      1900-01-01: 1931
    amount:
      1900-01-01: 0.05      # 1931-1932
  - threshold:
      1900-01-01: 1933
    amount:
      1900-01-01: 0.055     # 1933-1934
  - threshold:
      1900-01-01: 1935
    amount:
      1900-01-01: 0.06      # 1935-1936
  - threshold:
      1900-01-01: 1937
    amount:
      1900-01-01: 0.065     # 1937-1938
  - threshold:
      1900-01-01: 1939
    amount:
      1900-01-01: 0.07      # 1939-1940
  - threshold:
      1900-01-01: 1941
    amount:
      1900-01-01: 0.075     # 1941-1942
  - threshold:
      1900-01-01: 1943
    amount:
      1900-01-01: 0.08      # 1943 and later
