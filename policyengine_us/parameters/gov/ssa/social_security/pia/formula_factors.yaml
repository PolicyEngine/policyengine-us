description: The US applies these factors to Average Indexed Monthly Earnings in each bracket when calculating Social Security Primary Insurance Amount.
metadata:
  type: marginal_rate
  threshold_unit: currency-USD
  rate_unit: /1
  label: Social Security PIA formula factors
  reference:
    - title: 42 USC 415(a)(1)(A)
      href: https://www.law.cornell.edu/uscode/text/42/415#a_1_A
    - title: PIA Formula
      href: https://www.ssa.gov/OACT/COLA/piaformula.html
    - title: Social Security benefit formula bend point history
      href: https://www.ssa.gov/OACT/COLA/bendpoints.html
documentation: |
  Each dated bend point is the amount for that initial eligibility year.
  Historical values begin in 1979, when this wage-indexed formula began.
  Their presence does not make
  older computation methods supported. Calculated routes using modern initial
  PIA truncation must reject benchmark years before 1983.
