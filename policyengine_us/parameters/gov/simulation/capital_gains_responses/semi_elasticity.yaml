description: Semi-elasticity of long-term capital gains realizations with respect to the capital gains marginal tax rate, about the percent fall in realizations per percentage-point rise in the rate.
documentation: >-
  Selects the semi-elasticity form, under which realizations scale by
  exp(-semi_elasticity * (reform rate - baseline rate)). Values must be
  positive, the sign under which realizations fall as the rate rises (unlike
  the negative log-rate elasticity), and at most 50. In a single-rate model,
  revenue peaks at a rate of 1 / semi_elasticity when that is below 100%, so
  3.33 to 3.51 puts the peak at 30% to 28.5%; a progressive schedule and other
  taxes move the model's peak statutory rate away from that. The Joint
  Committee on Taxation staff's 1990 equation, ln(realizations) = a - 0.0351 *
  rate in percentage points, is this form with 3.51 and a 28.5% peak. The
  Congressional Research Service reported in 2021 that JCT used 3.1 (a 32.3%
  peak) and in 2025 that JCT has used 3.1. Because the response depends only
  on the change in the rate, the form is defined when the baseline rate is
  0%, and a fixed state rate that adds to the federal rate scales realizations
  by a constant, so in a single-rate model federal revenue still peaks at a
  federal rate of 1 / semi_elasticity. Both rates are clipped to between 0 and
  1 first, because the household marginal rate can fall outside that range
  where the extra gain crosses a benefit cliff; this keeps the realization
  multiplier between exp(-semi_elasticity) and exp(semi_elasticity). At most
  one of elasticity, semi_elasticity and net_of_tax_elasticity can be
  nonzero.
values:
  2000-01-01: 0
