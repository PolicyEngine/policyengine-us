description: HUD counts these income sources as unearned income under its assisted housing programs.
values:
  2024-01-01:
    - pension_income
    # - retirement_distributions: 24 CFR 5.609(b)(26) excludes retirement-account
    #   income except periodic distributions, which count. PolicyEngine's
    #   retirement_distributions variable doesn't distinguish periodic from
    #   lump-sum withdrawals, so it is left out entirely rather than overcounting
    #   lump-sum distributions that should be excluded.
    - dividend_income
    - interest_income
    - gi_cash_assistance
    - rental_income
    - farm_rent_income
    - partnership_s_corp_income
    - illicit_income
    - miscellaneous_income
    - alimony_income
    - strike_benefits
    - social_security
    - ssi
    # Exclude only SSI-E meeting the assisted-home care conditions.
    - wi_ssp_countable_for_hud
    - general_assistance
    - unemployment_compensation
    - child_support_received
    - veterans_benefits
    # - workers_compensation: excluded per 24 CFR 5.609(b)(5) — insurance
    #   payments and settlements for personal or property losses, including
    #   workers' compensation, do not count as income under HOTMA.
    - disability_benefits
    - survivor_benefits
    - financial_assistance
metadata:
  unit: list
  period: year
  label: HUD unearned income sources
  reference:
    - title: 24 CFR § 5.609(a)(1), (a)(2), (b)(6), (b)(19)
      href: https://www.law.cornell.edu/cfr/text/24/5.609
    - title: Wisconsin SSI-E Handbook, 4.1.1 Subsidized Housing
      href: https://www.dhs.wisconsin.gov/publications/p20679-26-01.pdf#page=24
    - title: HUD Notice PIH 2023-27, Attachment G.11, Income Received for the Care of Family Members with Disabilities
      href: https://www.hud.gov/sites/dfiles/OCHCO/documents/2023-27pihn.pdf#page=81
    - title: 'HUD Notice PIH 2024-38, IV.B.1, Mandatory Deductions and Exclusions #page 3-4'
      href: https://www.hud.gov/sites/dfiles/OCHCO/documents/2024-38pihn.pdf#page=3
