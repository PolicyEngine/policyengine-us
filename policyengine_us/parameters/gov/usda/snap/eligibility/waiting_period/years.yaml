description: The Department of Agriculture sets this threshold of years for the qualified alien waiting period under the Supplemental Nutrition Assistance Program.

# 8 USC 1612(a)(2)(L), added by P.L. 107-171 sec. 4401(c)(1), effective
# 2003-04-01 (sec. 4401(c)(2)). The count is years in qualified alien status
# since the person first obtained that status (7 CFR 273.4(a)(6)(iii); FNS
# Question and Answer #1 REVISED, Question 4). 7 CFR 273.4(a)(6)(iii) sets no
# entry-date limit, so the "on or after August 22, 1996" entry condition in
# 8 USC 1613(a) does not narrow this SNAP rule.
values:
  2003-04-01: 5

