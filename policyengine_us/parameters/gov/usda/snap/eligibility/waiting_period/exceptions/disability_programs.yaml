description: The Department of Agriculture excludes qualified aliens receiving these disability benefits from the waiting period under the Supplemental Nutrition Assistance Program.

# 8 USC 1612(a)(2)(F)(ii), added by P.L. 105-185 sec. 504, effective 1998-11-01
# (sec. 510(b)), covers only benefits received for blindness or disability, as
# specified in 7 CFR 271.2 paragraphs (2)-(11). Age-based qualification does not
# count (75 FR 4915), so this list holds the gov.usda.disabled_programs entries
# other than Supplemental Security Income, which can be paid on the basis of
# age; the formula counts SSI only when it is paid for blindness or disability.
# The two survivor entries follow the survivor-prong convention of
# gov.usda.disabled_programs: they stand for 7 CFR 271.2 paragraphs (8)-(9) and
# should be true only when the surviving spouse or child personally meets one
# of those conditions, not merely because the veteran was disabled. Amount
# entries count when positive.
values:
  1998-11-01:
    - social_security_disability
    - is_permanently_disabled_veteran
    - is_surviving_spouse_of_disabled_veteran
    - is_surviving_child_of_disabled_veteran

