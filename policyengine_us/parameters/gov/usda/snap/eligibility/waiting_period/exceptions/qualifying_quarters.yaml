description: The Department of Agriculture excludes lawful permanent residents with this threshold of qualifying quarters from the waiting period under the Supplemental Nutrition Assistance Program.

# Applies only to lawful permanent residents (7 CFR 273.4(a)(6)(ii)(A)). The
# count includes the alien's own quarters, a parent's quarters before the alien
# turned 18, and a spouse's quarters during the marriage if the couple is still
# married or the spouse is deceased (8 USC 1645; 7 CFR 273.4(a)(6)(ii)(A)).
# Quarters after December 31, 1996, in which the alien, parent or spouse actually
# received any Federal means-tested public benefit or SNAP do not count
# (7 CFR 273.4(a)(6)(ii)(A)(2)).
values:
  1996-08-22: 40

