description: The Department of Agriculture excludes military-connected dependent children below this age threshold from the waiting period under the Supplemental Nutrition Assistance Program.

# Covers the unmarried dependent child of a veteran or active duty member. The
# statute (8 USC 1612(a)(2)(C)(iii)) sets no ages; they come from the
# regulation, first adopted as 7 CFR 273.4(a)(5)(ii)(G)(3) by the final rule at
# 65 FR 70134 (November 21, 2000), effective January 20, 2001, and now at
# 7 CFR 273.4(a)(6)(ii)(G)(3). Children under this age are also exempt under
# 7 CFR 273.4(a)(6)(ii)(J).
values:
  2001-01-20: 18

