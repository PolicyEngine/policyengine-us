description: The Department of Agriculture excludes qualified aliens below this age threshold from the waiting period under the Supplemental Nutrition Assistance Program.

# 8 USC 1612(a)(2)(J), added by P.L. 105-185 sec. 507, effective 1998-11-01
# (sec. 510(b)). Its condition that the child was lawfully residing in the
# United States on August 22, 1996, was struck by P.L. 107-171 sec. 4401(b)(1),
# effective 2003-10-01 (sec. 4401(b)(3)); that condition is not modeled.
values:
  1998-11-01: 18

