description: SPM unit-level income sources that count as unearned income for SNAP

values:
  2009-01-01:
    # (i) Unit-level assistance payments are counted in full since they
    # cannot be attributed to an individual ineligible member.
    - tanf
    # Other recurring cash assistance under 7 CFR 273.9(b)(2)(i).
    - dc_gac
    - dc_power
    - ma_eaedc
    - ny_safety_net_assistance
    - wa_sfa
    - snap_reported_unit_cash_assistance
    # Ordinary California county GA/GR cash grants.
    - ca_ala_general_assistance
    - ca_cc_general_assistance
    - ca_marin_general_relief
    - ca_oc_general_relief
    - ca_riv_general_relief
    - ca_sbd_general_relief
    - ca_scc_general_assistance
    - ca_sf_caap
    - ca_smc_general_assistance_countable_for_snap
    # Count the regular LA grant, including any part sent to the landlord.
    # CalFresh MPP 63-502.2(b)(2) excludes the separate county subsidy.
    - la_general_relief
    - la_general_relief_rent_contribution

