description: Person-level income sources that count as unearned income for SNAP

values:
  2009-01-01:
    # (i)
    - ssi
    - general_assistance
    # (i) State SSI supplements. 273.9(b)(2)(i) counts "assistance payments
    # from Federal or federally aided public assistance programs, such as
    # supplemental security income (SSI) ... or other assistance programs
    # based on need", and adds that "such assistance is considered to be
    # unearned income even if provided in the form of a vendor payment
    # (provided to a third party on behalf of the household), unless the
    # vendor payment is specifically exempt from consideration as countable
    # income under the provisions of paragraph (c)(1)". 273.9(c)(1)(i)
    # exempts public assistance vendor payments only for medical assistance,
    # child care, energy assistance, migrant emergency assistance, housing
    # authority housing assistance, and emergency or special assistance that
    # is not the normal grant. None of the supplements below fall in those
    # categories, so each counts, whether paid to the recipient or to a
    # facility on the recipient's behalf.
    - ak_ssp
    - al_ssp
    # co_oap has an annual definition period; policyengine-core's
    # calculate_divide converts it to a monthly amount here.
    - co_oap
    - co_state_supplement
    # ct_ssp, ga_ssp, mi_ssp and mn_msa are SPM unit variables that only add
    # up these person-level components, so the person-level variable is used
    # here and the household total is unchanged.
    - ct_ssp_person
    - dc_ossp
    - de_ssp
    - fl_oss
    - ga_ssp_person
    - hi_oss
    - id_aabd
    - in_ssp
    - ks_sspp
    - ky_ssp
    - la_oss
    - ma_state_supplement
    - md_paa
    - me_ssp
    - mi_ssp_person
    - mn_msa_person
    - mo_ssp
    - ne_aabd
    - nm_ssi_state_supplement
    - sc_ssi_state_supplement
    - tx_ssi_state_supplement
    - wa_ssp
    # Listed elsewhere: ca_state_supplement is an SPM unit variable with no
    # person-level counterpart. policyengine-core projects a group value onto
    # every member, so listing it here would count it once per person in the
    # SPM unit. It is listed in unearned_spm_unit.yaml instead.
    # (ii)
    - pension_income # Includes annuities.
    - veterans_benefits
    - total_unemployment_compensation
    - disability_benefits
    - workers_compensation
    - social_security
    - survivor_benefits
    - retirement_distributions
    # Assume all rental income meets this criteria (rest is earned):
    # "gross income minus the cost of doing business derived from rental
    #  property in which a household member is not actively engaged in the
    #  management of the property at least 20 hours a week."
    # snap_rental_income floors rental_income at zero because a rental loss
    # does not offset other income.
    - snap_rental_income
    # Farm rent (Form 4835 crop or livestock share rent of a landowner who
    # does not materially participate) is income from rental property too,
    # under the same assumption; flat cash farm rent is in rental_income.
    # A landowner who instead shares the farm's expenses and profit or loss
    # can have earned self-employment income (e.g. Kansas EES memo
    # 99-10-05); the inputs do not identify cost sharing, so all farm rent
    # is treated as rent here (see issue #9673).
    # Nothing in 7 U.S.C. 2014(d) or 273.9(c) excludes rent. The inputs are
    # tax figures, which deduct depreciation (disallowed by
    # 273.11(b)(2)(iii)) but not principal payments on income-producing
    # real estate (allowed by 273.11(b)(1)).
    - snap_farm_rent_income
    # (iii)
    - child_support_received
    - alimony_income
    # (iv) educational assistance is countable only after educational
    # exclusions. Keep it out until the excluded share is modeled.
    # (v)
    - dividend_income
    - interest_income
    - financial_assistance
    - miscellaneous_income

metadata:
  reference:
