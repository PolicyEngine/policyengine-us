      href: https://www.law.cornell.edu/cfr/text/7/273.9#b_2
    - title: 7 CFR 273.9(c)(1)
      href: https://www.law.cornell.edu/cfr/text/7/273.9#c_1
    - title: POMS SI 01401.001 General Information about State Supplementation
      href: https://secure.ssa.gov/poms.nsf/lnx/0501401001
