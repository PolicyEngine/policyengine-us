description: Person-level income sources that count as unearned income for SNAP

values:
  2009-01-01:
    # (i)
    - ssi
    - general_assistance
    # (i) State SSI supplements. 273.9(b)(2)(i) counts "assistance payments
    # from Federal or federally aided public assistance programs, such as
    # supplemental security income (SSI)". Per POMS SI 01401.001B.1 a state
    # supplementary payment is "paid either in cash or other negotiable
    # instrument easily convertible to cash" to the individual, and SI
    # 01401.001B.2 states that "third party vendor payments" are not state
    # supplementary payments, so the 273.9(c)(1) exclusion for benefits not
    # payable directly to the household does not reach the programs below.
    - ak_ssp
    - al_ssp
    # co_oap has an annual definition period; policyengine-core's
    # calculate_divide converts it to a monthly amount here.
    - co_oap
    - co_state_supplement
    # ct_ssp, ga_ssp, mi_ssp and mn_msa are SPM unit variables that only add
    # up these person-level components, so the person-level variable is used
    # here and the household total is unchanged.
    - ct_ssp_person
    - dc_ossp
    - de_ssp
    - fl_oss
    - ga_ssp_person
    - hi_oss
    - id_aabd
    # in_ssp adds in_ssp_sapn and in_ssp_rcap. Only SAPN is counted: see the
    # exclusions below.
    - in_ssp_sapn
    - ks_sspp
    - ky_ssp
    - la_oss
    - ma_state_supplement
    - md_paa
    - me_ssp
    - mi_ssp_person
    - mn_msa_person
    - mo_ssp
    - ne_aabd
    - nm_ssi_state_supplement
    - sc_ssi_state_supplement
    - tx_ssi_state_supplement
    - wa_ssp
    # Excluded state SSI supplements, with reasons:
    # - in_ssp_rcap (Indiana Residential Care Assistance Program): 455 IAC
    #   1-3-3 pays the facility a per diem directly ("the facility shall
    #   receive per diem reimbursement from the division"), reduced by what
    #   the recipient contributes. That is a vendor payment excluded by
    #   273.9(c)(1), so in_ssp itself is not listed.
    # - ca_state_supplement: an SPM unit variable with no person-level
    #   counterpart. policyengine-core projects a group value onto every
    #   member, so listing it here would count it once per person in the SPM
    #   unit. It is listed in unearned_spm_unit.yaml instead.
    # (ii)
    - pension_income # Includes annuities.
    - veterans_benefits
    - unemployment_compensation
    - disability_benefits
    - workers_compensation
    - social_security
    - survivor_benefits
    - retirement_distributions
    # Assume all rental income meets this criteria (rest is earned):
    # "gross income minus the cost of doing business derived from rental
    #  property in which a household member is not actively engaged in the
    #  management of the property at least 20 hours a week."
    - rental_income
    # (iii)
    - child_support_received
    - alimony_income
    # (iv) educational assistance is countable only after educational
    # exclusions. Keep it out until the excluded share is modeled.
    # (v)
    - dividend_income
    - interest_income
    - financial_assistance
    - miscellaneous_income

metadata:
  reference:
    - title: 7 CFR 273.9(b)(2)
      href: https://www.law.cornell.edu/cfr/text/7/273.9#b_2
    - title: 7 CFR 273.9(c)(1)
      href: https://www.law.cornell.edu/cfr/text/7/273.9#c_1
    - title: POMS SI 01401.001 General Information about State Supplementation
      href: https://secure.ssa.gov/poms.nsf/lnx/0501401001
