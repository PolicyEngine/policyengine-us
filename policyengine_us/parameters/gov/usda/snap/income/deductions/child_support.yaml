description: Whether the state excludes legally obligated child support payments to nonhousehold members from gross income under the Supplemental Nutrition Assistance Program, rather than deducting them when computing net income.
# true: the state takes the 7 CFR 273.9(c)(17) option and excludes the
# payments from gross income, which lowers the income compared against the
# gross income limit.
# false: the state deducts the payments when computing net income under
# 7 CFR 273.9(d)(5).
# Each state's value on these dates comes from one edition of the USDA SNAP
# State Options Report:
#   2017-10-01: 14th edition (options as of October 1, 2017)
#   2022-10-01: 15th edition (options chosen in fiscal year 2023)
#   2023-10-01: 16th edition (current as of October 1, 2023)
#   2024-10-01: 17th edition (data reference period October 2024)
# Where a state's own rules contradict an edition, the state's rules govern
# and the comment on that value names them. Where one edition disagrees with
# the editions before and after it, the comment on that value says which
# source the value follows.
# Before 2017-10-01: the 9th to 13th editions (as of November 2010, August
# 2012, September 2013, October 1, 2015 and October 1, 2016) list IA, ME, NY
# and SD as exclusion states in every edition, as the 14th does, so they are
# true from 2010-01-01; other pre-2017 values come from the state rules the
# comments cite. For AZ, CT, HI, ID, MD, MI, MS, NM, PA, TN, UT, VT and WI the
# 9th to 13th editions disagree with one another, and their 2010-01-01
# deduction values are placeholders until the state rules are checked.
