  # 11/29/22-09/30/23 introduces the LUA with the note "LUA is effective
  # the benefit month of 01/2023. Budgetary units eligible for LUA for
  # benefit months prior to 01/2023 receive SUA instead of LUA" (that
  # three-month SUA fallback is not modeled). The FY2023-FY2026 FNS SUA
  # tables carry the matching by-household-size values maintained in
  # by_household_size/amount.yaml.
  2023-01-01: true
