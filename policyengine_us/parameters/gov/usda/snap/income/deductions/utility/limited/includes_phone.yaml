description: Whether the limited utility allowance includes telephone costs in this utility region under the Supplemental Nutrition Assistance Program.
# Under 7 CFR 273.9(d)(6)(iii)(A)(3), including telephone (and/or internet)
# costs in the limited utility allowance is a state option. Where a state
# excludes telephone (false), a phone bill does not count toward the
# two-utility LUA qualification and the state's separate telephone standard
# is added on top of the LUA for households with phone costs.
# A false value therefore bundles two state choices: dropping the phone bill
# from the two-utility count AND stacking the telephone standard on the LUA,
# as Missouri does. A state that excluded telephone but barred stacking would
# need a separate switch; no such state has been found.
# Researched against state manuals (cited in PR #9357): AL, AR, AZ, DE, FL,
# GA, IA, ID, IL, IN, KS, KY, LA, MO, MS, NC, ND, NE, NH, NJ, NM, NV, OH, OK,
# SC, SD, TN, TX, UT, WI, WV, WY. All other regions keep the federal default
# (true) pending research.
