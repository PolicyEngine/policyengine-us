description: Counties in Arizona with an approved USDA FNS waiver of the SNAP ABAWD time limit.

values:
  2018-01-01: []
  # FY2025 waiver: 14 counties plus 16 reservation areas (sub-county, not
  # modeled), 2024-10-01 through 2025-09-30 (the letter prints
  # "September 31, 2025"). The FY2024 waiver covered the same 14 counties
  # from 2023-10-01 through 2024-09-30; it ended before the waiver
  # parameters' 2024-11-01 modeling start and is not modeled.
  2024-10-01:
    - APACHE_COUNTY_AZ # FIPS 04001
    - COCHISE_COUNTY_AZ # FIPS 04003
    - COCONINO_COUNTY_AZ # FIPS 04005
    - GILA_COUNTY_AZ # FIPS 04007
    - GRAHAM_COUNTY_AZ # FIPS 04009
    - GREENLEE_COUNTY_AZ # FIPS 04011
    - LA_PAZ_COUNTY_AZ # FIPS 04012
    - MOHAVE_COUNTY_AZ # FIPS 04015
    - NAVAJO_COUNTY_AZ # FIPS 04017
    - PIMA_COUNTY_AZ # FIPS 04019
    - PINAL_COUNTY_AZ # FIPS 04021
    - SANTA_CRUZ_COUNTY_AZ # FIPS 04023
    - YAVAPAI_COUNTY_AZ # FIPS 04025
    - YUMA_COUNTY_AZ # FIPS 04027
  2025-10-01: []
  # FY2026 waiver (unemployment over 10 percent): Yuma County plus six
  # reservation areas (sub-county, not modeled), 2026-03-01 through
  # 2027-02-28 (FNS response, March 12, 2026). Arizona requested
  # 2025-10-01; FNS set the implementation date to 2026-03-01. The FY 2026
  # Quarter 1 and Quarter 2 status reports list Arizona as a partial-waiver
  # state before that date, but no approval covers 2025-10 through 2026-02;
  # the approval letter governs.
  2026-03-01:
    - YUMA_COUNTY_AZ # FIPS 04027
  2027-03-01: []

