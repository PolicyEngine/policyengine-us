description: Counties in Alaska with an approved USDA FNS waiver of the SNAP ABAWD time limit.

values:
  2018-01-01: []
  # FY2025 waiver (lack of sufficient jobs criterion): all 29 boroughs and
  # census areas except the Municipality of Anchorage, plus the Eklutna
  # ANVSA (sub-county, not modeled), 2024-11-01 through 2025-10-31.
