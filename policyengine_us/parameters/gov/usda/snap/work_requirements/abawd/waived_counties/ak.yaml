  # From 2025-11-01 through 2026-10-31 two approvals overlap:
  # - FNS approved a waiver for 20 boroughs and census areas under the
  #   noncontiguous-State criterion (unemployment at least 1.5 times the
  #   national rate; FNS response, October 23, 2025).
  # - FNS approved Alaska's good-faith exemption under 7 U.S.C. 2015(o)(7),
  #   which per the Alaska Division of Public Assistance "exempts all Alaska
  #   census areas and boroughs from the ABAWD time-limit criteria, except
  #   the Municipality of Anchorage". It covers the nine areas marked below.
  # Limitation: no FNS approval letter states the good-faith exemption's
  # geographic scope, so the nine marked entries follow the Alaska Division
  # of Public Assistance FAQ (all areas except Anchorage). FNS Q&A #1
  # (June 11, 2026, question 17) describes (o)(7) exemptions as applying to
  # individuals rather than to areas. If FNS terminates the exemption early
  # (7 U.S.C. 2015(o)(7)(D)(ii)), remove the nine marked entries from that
  # date.
  2025-11-01:
    - ALEUTIANS_EAST_BOROUGH_AK # FIPS 02013; good-faith exemption only
    - ALEUTIANS_WEST_CENSUS_AREA_AK # FIPS 02016; good-faith exemption only
    - BETHEL_CENSUS_AREA_AK # FIPS 02050
