# Counties with an approved USDA FNS waiver of the SNAP ABAWD time limit
# under 7 U.S.C. 2015(o)(4) and 7 CFR 273.24(f).
#
# Counties are stored as County enum names (the values produced by
# county_str), with the county FIPS code in a comment for cross-reference.
# The source documents (FNS waiver response letters, the FNS quarterly ABAWD
# waiver status reports, and CDSS All County Letters) identify waived areas by
# county name, and household inputs may supply either county_fips (from which
# county_str derives) or a county name directly, so name matching covers both
# input forms.
#
# Alaska. From 2024-11-01 through 2025-10-31, FNS approved Alaska's request to
# waive the ABAWD time limit in 29 boroughs and census areas - every Alaska
# county-equivalent except the Municipality of Anchorage (FIPS 02020) - plus
# the Eklutna Alaska Native Village Statistical Area, which lies within the
# Anchorage municipality and is below county-level geography, so it is not
# represented here. From 2025-11-01 through 2026-10-31, FNS approved Alaska's
# good faith exemption waiver under P.L. 119-21 (OBBBA) section 10102,
# covering the same 29 boroughs and census areas.
#
# California. From 2025-11-01 through 2026-10-31, FNS approved California's
# request to waive the time limit in seven counties under the post-OBBBA
# over-10-percent unemployment criterion of 7 U.S.C. 2015(o)(4)(A)(i) and
# 7 CFR 273.24(f): Colusa, Imperial, and Tulare (approved October 23, 2025,
# CDSS ACL 25-79), and Alpine, Merced, Monterey, and Plumas (modification
# approved February 10, 2026, retroactively effective November 1, 2025,
# CDSS ACL 26-15).
#
# FY2025 partial-state waivers (16 states beyond Alaska). FNS approved
# partial ABAWD time limit waivers in 16 additional states during the FY2025
# cycle, at county grain: Arizona (14), Colorado (18), Hawaii (2),
# Kentucky (117), Massachusetts (5), Maryland (5), Michigan (80),
# Minnesota (15), New Jersey (20), North Dakota (3), Oregon (30),
# Pennsylvania (60), South Dakota (7), Virginia (12), Washington (38), and
# Wisconsin (8). Effective dates follow each state's FNS approval letter
# (Kentucky 2024-12-01, Oregon 2025-01-01, New Jersey and Washington
# 2025-02-01, Michigan 2025-03-01, the rest 2024-11-01).
#
# Known limitations of the county-grain encoding:
# - Sub-county waivers are NOT represented - Connecticut's 68 towns, Maine's
#   towns, Rhode Island's and New Hampshire's towns, Montana's reservation-only
#   waiver, and the reservation and civil-subdivision areas that accompany
#   several state approvals - because county-grain inclusion would overstate
#   them. Their omission UNDERSTATES pre-OBBBA waiver coverage.
# - Pennsylvania: FNS waived 58 whole counties plus the "balance of" Cumberland
#   County (excluding Hampden Township) and the "balance of" Butler County
#   (excluding Cranberry Township). This parameter models both balance-of-county
#   areas as whole counties (Cumberland, FIPS 42041; Butler, FIPS 42019),
#   slightly OVERSTATING Pennsylvania coverage in those two townships.
# - Michigan: FNS waived 80 counties (plus 3 cities and 10 reservations). The
#   two county-equivalents FNS did not waive at county grain (Kent, FIPS 26081;
#   Livingston, FIPS 26093) and Oakland County (FIPS 26125, never requested)
#   are excluded.
# - Minnesota and North Dakota counts reflect the FY2025 Q1 snapshot; both
#   states received later mid-2025 re-approvals (Minnesota 17 counties, North
#   Dakota Rolette County) that are not separately modeled.
#
# Terminations. From 2025-11-01, USDA terminated waivers approved under the
# "lack of sufficient jobs" criterion that P.L. 119-21 (OBBBA) section 10102
# repealed. After Rhode Island State Council of Churches v. Rollins (D.R.I.,
# No. 1:25-cv-00569), USDA's February 26, 2026 status update memorandum kept
# the terminated waivers in effect through their original expirations. Per
# Appendix A of that memorandum, the reinstated partial-state waivers modeled
# here end: Kentucky 2025-11-30; Oregon 2025-12-31; New Jersey and Washington
# 2026-01-31; Michigan 2026-02-28; Minnesota and North Dakota 2026-06-30. The
# non-reinstated FY2025 partial waivers (Arizona, Colorado, Massachusetts,
# Maryland, Pennsylvania, South Dakota, Virginia, Wisconsin) end 2025-11-01
# (earlier of their own expiration or the FNS administrative termination), and
# Hawaii's waiver ends 2025-07-01. Statewide waivers are modeled separately in
# waived_states.
description: The Department of Agriculture waives the Able-Bodied Adult Without Dependents (ABAWD) time limit under the Supplemental Nutrition Assistance Program for residents of these counties.

