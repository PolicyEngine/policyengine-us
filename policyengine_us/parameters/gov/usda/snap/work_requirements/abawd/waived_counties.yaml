# Counties with an approved USDA FNS waiver of the SNAP ABAWD time limit
# under 7 U.S.C. 2015(o)(4) and 7 CFR 273.24(f).
#
# Counties are stored as County enum names (the values produced by
# county_str), with the county FIPS code in a comment for cross-reference.
# The source documents (FNS waiver response letters and CDSS All County
# Letters) identify waived areas by county name, and household inputs may
# supply either county_fips (from which county_str derives) or a county
# name directly, so name matching covers both input forms.
#
# From 2024-11-01 through 2025-10-31, FNS approved Alaska's request to waive
# the ABAWD time limit in 29 boroughs and census areas — every Alaska
# county-equivalent except the Municipality of Anchorage (FIPS 02020) — plus
# the Eklutna Alaska Native Village Statistical Area, which lies within the
# Anchorage municipality and is below county-level geography, so it is not
# represented here.
# From 2025-11-01 through 2026-10-31, FNS approved Alaska's good faith
# exemption waiver under P.L. 119-21 (OBBBA) section 10102, covering the same
# 29 boroughs and census areas (all except the Municipality of Anchorage).
# From 2025-11-01 through 2026-10-31, FNS approved California's request to
# waive the time limit in seven counties under the post-OBBBA over-10-percent
# unemployment criterion of 7 U.S.C. 2015(o)(4)(A)(i) and 7 CFR 273.24(f):
# Colusa, Imperial, and Tulare (approved October 23, 2025, announced in CDSS
# ACL 25-79), and Alpine, Merced, Monterey, and Plumas (modification approved
# February 10, 2026, retroactively effective November 1, 2025, announced in
# CDSS ACL 26-15).
# Waivers in effect before 2024-11-01 (in Alaska and elsewhere), and after
# the documented 2026-10-31 Alaska and California approval end dates, are
# not modeled. Statewide waivers are modeled separately in waived_states.
description: The Department of Agriculture waives the Able-Bodied Adult Without Dependents (ABAWD) time limit under the Supplemental Nutrition Assistance Program for residents of these counties.

