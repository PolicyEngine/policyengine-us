description: Before HR1 applies, PolicyEngine uses the dated FRA age thresholds and allows the homelessness, veteran, and former foster youth exemptions when this parameter is true. When it is false, PolicyEngine uses the pre-FRA age thresholds and disallows those three exemptions.
values:
  2017-01-01: false
  2023-09-01: true
