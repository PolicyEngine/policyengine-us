# State codes of states with an approved USDA FNS statewide waiver of the
# SNAP ABAWD time limit under 7 U.S.C. 2015(o)(4) and 7 CFR 273.24(f).
#
# Only waivers verified as STATEWIDE from FNS waiver response letters are
# encoded here:
# - CA: statewide, 2024-11-01 through 2025-10-31 (FNS response,
#   Aug 12, 2024), replaced by a statewide waiver effective 2025-02-01
#   (FNS response, Jan 15, 2025), which the May 21, 2025
#   rescission-and-reissue letter shortened to 2026-01-31.
# - IL: statewide, 2024-11-01 through 2025-10-31 (FNS response,
#   Aug 19, 2024), replaced by a statewide waiver effective 2025-02-01
#   through 2026-01-31 (FNS response, partially approving 12 of the
#   requested 24 months).
# - NV: statewide since 2024-07-01; the FNS response of Mar 14, 2025,
#   effective 2025-02-01 through 2026-01-31, replaced the prior statewide
#   waiver (partially approving 12 of the requested 24 months). Modeled from
#   2024-11-01, in line with this parameter's overall modeling start date.
# - NY: statewide, 2024-03-01 through 2025-02-28 (FNS FY2024 response).
#   Modeled from 2024-11-01, in line with this parameter's overall modeling
#   start date. The replacement FY2025 waiver (FNS response, Oct 2, 2024)
#   covers 61 of 62 counties from 2025-03-01, so New York is a
#   partial-waiver state from that date (encoded in
#   waived_counties/ny.yaml).
# - NM: statewide, 2024-01-01 through 2024-12-31 (FNS FY2024 response,
#   Sep 27, 2023). Modeled from 2024-11-01, in line with this parameter's
#   overall modeling start date. The replacement FY2025 waiver (FNS
#   response, Sep 18, 2024) covers 29 of 33 counties plus reservation areas
#   from 2025-01-01, so New Mexico is a partial-waiver state from that date
#   (encoded in waived_counties/nm.yaml).
# - DC: initial districtwide waiver effective 2024-12-01 (FNS response,
#   Apr 26, 2024, originally through 2025-11-30); a superseding districtwide
#   waiver approved Jan 13, 2025 took effect 2025-01-01, originally through
#   2026-12-31. The May 21, 2025 rescission-and-reissue letter set its
#   expiration to 2025-12-31, and Appendix A of the memorandum matches it.
#
# In November 2025, USDA terminated waivers approved under the
# "lack of sufficient jobs" criterion, which P.L. 119-21 (OBBBA)
# section 10102 repealed (October 3, 2025 memorandum, effective
# November 2, 2025). After Rhode Island State Council of Churches v.
# Rollins (D.R.I., No. 1:25-cv-00569, TRO issued 2025-10-31), USDA's
# February 26, 2026 status update memorandum ("Waiver of the Time Limit -
# Status Update," published on the USDA guidance portal and linked from the
# FNA SNAP waiver reinstatement page) kept the terminated waivers in effect
# through their original expiration dates. Per Appendix A of that
# memorandum: CT and KY through 2025-11-30; DC, NM, OR, and the U.S. Virgin
# Islands through 2025-12-31; CA, IL, NV, NJ, WA, and Guam through
# 2026-01-31; MI, NY, and RI through 2026-02-28; MN, MT, and ND through
# 2026-06-30.
#
# Known limitations:
# - Twelve of the eighteen jurisdictions in Appendix A held PARTIAL-state
#   waivers per the FNS FY2025 response letters (CT: 68 towns; KY: 117
#   counties; MI: 80 counties, 3 cities, 10 reservations; MN: 17 counties,
#   9 reservations; MT: 6 reservation areas; NJ: 20 counties; NM: 29
#   counties and reservation areas (the letter text says 18 reservations;
#   its Table 2 lists 14); NY: 61 counties; OR: 30 counties, 7 reservation
#   areas; RI: 9 towns; WA: 38 counties, 1 reservation area; ND: Rolette
#   County plus the Turtle Mountain reservation). The other six (CA, DC,
#   IL, NV, Guam, and the U.S. Virgin Islands) were statewide or
#   territory-wide. The KY, MI, MN, ND, NJ, NM, NY, OR, and WA partial
#   waivers are modeled at county grain in waived_counties/ (their
#   sub-county parts are omitted); CT and RI (towns) and MT (reservations)
#   are sub-county and not modeled.
# - New York's classification changed mid-window: the FY 2025 Q2 status
#   report (waivers as of 2025-01-01) lists NY among the seven STATEWIDE
#   jurisdictions because its FY2024 statewide waiver (encoded above) ran
#   through 2025-02-28, while the FY 2025 Q4 status report (waivers as of
#   2025-07-01) lists NY as PARTIAL under its 61-county FY2025 waiver
#   (effective 2025-03-01 through 2026-02-28). The waiver USDA terminated
#   and litigation reinstated through 2026-02-28 was therefore the partial
#   61-county waiver, which is modeled in waived_counties/ny.yaml.
# - The January 2025 CA and DC approval letters ran through 2027-01-31 and
#   2026-12-31, respectively, but FNS replaced them before P.L. 119-21 was
#   enacted: its May 21, 2025 rescission-and-reissue letters reissued them
#   as one-year waivers ending 2026-01-31 (CA) and 2025-12-31 (DC).
#   Appendix A of the USDA February 26, 2026 memorandum lists the same
#   dates, so they hold for both current law and the pre-P.L. 119-21
#   counterfactual (hr1_waiver_criteria.in_effect). CDSS implemented the
#   time limit statewide on 2026-06-01 per ACL 25-93. The DC date of
#   2025-12-31 also differs from the Apr 26, 2024 letter's original
#   2025-11-30 expiration, which the January 2025 approval superseded.
# - Statewide waivers in effect before 2024-11-01 are not modeled. The NY
#   and NM FY2024 statewide waivers are encoded only from 2024-11-01, and
#   Delaware's FY2024 statewide waiver, which ended 2024-09-30, is omitted.
# - Guam and the U.S. Virgin Islands held territory-wide waivers but are not
#   modeled by PolicyEngine US.
description: The Department of Agriculture waives the Able-Bodied Adult Without Dependents (ABAWD) time limit under the Supplemental Nutrition Assistance Program statewide in these states.

values:
  2018-01-01:
    []
  2024-11-01:
    - CA
    - IL
    - NM
    - NV
    - NY
  2024-12-01:
    - CA
    - DC
    - IL
    - NM
    - NV
    - NY
  # NM statewide waiver expired 2024-12-31; from 2025-01-01 New Mexico held
  # a 29-county partial waiver, encoded in waived_counties/nm.yaml.
  2025-01-01:
    - CA
    - DC
    - IL
    - NV
    - NY
  # NY statewide waiver expired 2025-02-28; from 2025-03-01 New York held
  # a 61-county partial waiver, encoded in waived_counties/ny.yaml.
  2025-03-01:
    - CA
    - DC
    - IL
    - NV
  # DC districtwide waiver expired 2025-12-31.
  2026-01-01:
    - CA
    - IL
    - NV
  # CA, IL, and NV statewide waivers expired 2026-01-31.
  2026-02-01:
    []

