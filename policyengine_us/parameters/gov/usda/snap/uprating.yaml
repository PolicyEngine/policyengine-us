description: The US sets SNAP benefits at the Thrifty Food Plan each year, updating in October. This approximates that uprating via CPI-U.
values:
  # Actuals from June of each year.
  2020-10-01: 257.797 # 2020-06.
  2021-10-01: 271.696 # 2021-06.
  2022-10-01: 296.311 # 2022-06.
  2023-10-01: 305.109 # 2023-06.
  2024-10-01: 314.175 # 2024-06.
  2025-10-01: 322.561 # 2025-06.
  2026-10-01: 333.952 # 2026-06.
  # Forecasts carry the June 2026 actual forward at CBO's February 2026
  # quarterly CPI-U growth: June 2026 actual * CBO CPI-U (Q2) / CBO CPI-U (2026Q2).
  2027-10-01: 342.578 # 2027Q2: 333.952 * 339.250 / 330.708
  2028-10-01: 350.710 # 2028Q2: 333.952 * 347.303 / 330.708
  2029-10-01: 358.747 # 2029Q2: 333.952 * 355.262 / 330.708
  2030-10-01: 366.868 # 2030Q2: 333.952 * 363.304 / 330.708
  2031-10-01: 375.156 # 2031Q2: 333.952 * 371.512 / 330.708
  2032-10-01: 383.625 # 2032Q2: 333.952 * 379.898 / 330.708
  2033-10-01: 392.282 # 2033Q2: 333.952 * 388.471 / 330.708
  2034-10-01: 401.134 # 2034Q2: 333.952 * 397.237 / 330.708
  2035-10-01: 410.188 # 2035Q2: 333.952 * 406.203 / 330.708
  2036-10-01: 419.448 # 2036Q2: 333.952 * 415.373 / 330.708
  # Values for 2037-2100 are set programmatically in uprating_extensions.py
metadata:
  unit: currency-USD
  label: SNAP uprating
  economy: false
  reference:
