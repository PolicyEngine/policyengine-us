description: The USDA adds this amount to the minimum allotment rate times the rounded-down one-person maximum SNAP allotment to reach its published minimum allotment, by SNAP region.
# USDA computes the minimum from the unrounded one-person thrifty food plan
# cost. For FY2027 that rounds to $25 in the 48 States and D.C., while 8% of
# the published $306 one-person maximum rounds to $24. The adjustment returns
# to zero from FY2028, so projections use the statutory formula until the next
# COLA memo is encoded.
