description: Only one adult in the household may claim the student exemption for caring for a dependent child under age six in these states under the Supplemental Nutrition Assistance Program.
metadata:
  unit: bool
  period: year
  label: SNAP student child care exception one-adult limit
  breakdown:
    - state_code
  reference:
    - title: Missouri DSS SNAP Manual § 1135.025.00 - Students ("only one adult in the household may claim this responsibility")
      href: https://dssmanuals.mo.gov/food-stamps/1135-000-00/1135-025-00/
    - title: 7 CFR 273.5(b)(8) - Students, care of a dependent household member under the age of 6
      href: https://www.law.cornell.edu/cfr/text/7/273.5
# Federal rule 7 CFR 273.5(b)(8) carries no such cap; Missouri's manual
# adds it. The manual gives no effective date, so the value starts with
# the sibling student parameters. Other states are unverified defaults.
