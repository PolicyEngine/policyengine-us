# Federal rule 7 CFR 273.5(b)(8) is silent on shared care. These states
# give each child under six to one adult, usually the one providing most
# of the care, so two young children can free two claims:
#   TX: "Both parents or caretakers cannot get student eligibility by
#       caring for the same child."
#   NC: "If there is only one child in the home, then only one parent can
#       claim this exemption."
#   CA: county handbook, not statewide guidance: "Only one parent can
#       claim the exemption as the primary person responsible for the
#       care of a dependent child under the age of six"; multiple
#       children decided case by case, modeled as one claim per child.
#   KS: "only one person may claim this eligibility criteria as the
#       primary person responsible for the care of the dependent child."
#   CO, WA, AK: "more than half of the care" of the child; WA adds "One
#       child can't make more than one student eligible."
#   CT: "limited to one adult per child if 2 adults are responsible."
#   GA: "Only one parent in the AU can claim the status of a caretaker
#       responsible for a dependent child"; could also be read as one
#       adult per assistance unit, modeled per child.
# Missouri and Illinois cap the claim per household (per_household.yaml).
# DC, MA, NY, and OH restate the federal text with no cap and stay false;
# states not listed are unverified and keep the uncapped reading. The
# manuals give no effective date, so values start with the sibling
# student parameters.
