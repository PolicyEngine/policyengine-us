description: The Department of Agriculture lets only one adult claim the Supplemental Nutrition Assistance Program student exemption for caring for each dependent child under age six in these states.
metadata:
  unit: bool
  period: year
  label: SNAP student child care exception one-adult-per-child cap
  propagate_metadata_to_children: true
  breakdown:
