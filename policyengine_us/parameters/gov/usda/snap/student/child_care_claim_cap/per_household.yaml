description: Whether the state limits the Supplemental Nutrition Assistance Program student exemption for caring for a dependent child under age six to one adult per household.
metadata:
  unit: bool
  period: year
  label: SNAP student child care exception one-adult-per-household cap
  propagate_metadata_to_children: true
  breakdown:
    - state_code
  reference:
    - title: Missouri DSS SNAP Manual § 1135.025.00 - Students
      href: https://dssmanuals.mo.gov/food-stamps/1135-000-00/1135-025-00/
    - title: 7 CFR 273.5(b)(8) - Students, care of a dependent household member under the age of 6
      href: https://www.law.cornell.edu/cfr/text/7/273.5
# Federal rule 7 CFR 273.5(b)(8) is silent on shared care. Only Missouri's
# cap is modeled; false entries keep the uncapped federal reading and do
# not assert that other states allow unlimited claims. Missouri's cap is
# modeled from 2025: the manual gives no effective date, so the start is a
# modeling choice, not a finding that the policy differed before 2025.
