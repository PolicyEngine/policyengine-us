description: Benefit receipt that qualifies individuals as elderly or disabled members under the Supplemental Nutrition Assistance Program.

values:
  2021-01-01:
    # 7 CFR 271.2 defines "elderly or disabled member" by benefit receipt
    # ("receives supplemental security income benefits ... or disability or
    # blindness payments"), not by meeting the disability criteria alone.
    # Amount entries (ssi, social_security_disability) count when positive.
    - receives_ssi
    - ssi
    - social_security_disability
    # Clause (6) of the definition covers "a veteran with a service-connected
    # or non-service-connected disability rated by the Veteran's
    # Administration (VA) as total or paid as total".
    # is_fully_disabled_service_connected_veteran covers a service-connected
    # rating, temporary or permanent; is_permanently_disabled_veteran covers a
    # permanent and total rating, which a non-service-connected (pension)
    # rating requires. Clause (7), aid-and-attendance or housebound status
    # alone, has no input; a total rating the veteran also holds is entered
    # with these flags.
    - is_fully_disabled_service_connected_veteran
    - is_permanently_disabled_veteran
    - is_surviving_spouse_of_disabled_veteran
    - is_surviving_child_of_disabled_veteran

