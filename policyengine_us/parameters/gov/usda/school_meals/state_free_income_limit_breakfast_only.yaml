description: States provide free breakfast, but not free lunch, to students with household income at or below this percentage of the federal poverty guideline under the School Breakfast Program.
# 0 means no breakfast-only limit. A state has a value here only while its
# free-breakfast income limit is above its limit for both meals
# (state_free_income_limit); the two are never both above zero for the same
# state and date. school_meal_breakfast_tier gives free breakfast at or below
# this limit wherever it is above 0.
# Assume enrollment at a covered school; each state's conditions are noted
# beside its entry. Budget-funded limits end at their enacted funding end;
# standing statutes carry forward.
metadata:
  propagate_metadata_to_children: true
  label: State free school breakfast income limit (breakfast only) as a share of the poverty guideline
  period: year
  unit: /1
  breakdown:
    - state_code
  reference:
    - title: 42 U.S. Code § 1773(e)(1)(A) - School breakfast program
      href: https://www.law.cornell.edu/uscode/text/42/1773#e_1_A
