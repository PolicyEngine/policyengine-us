  # N.J.S.A. 18A:33-14a(a)(3), as amended by P.L.2023, c.336, requires free
  # breakfast up to 224 percent of the federal poverty level with no end date.
  # Until June 30, 2027 both meals are free up to that limit
  # (state_free_income_limit); no enacted appropriation funds free lunch above
  # the federal reduced-price limit after FY2027. Not modeled: CEP sites are
  # excluded (their meals are already free).
