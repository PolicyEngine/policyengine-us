CT:
  0000-01-01: false
  # SMART funds (SY 2022-23): school food authorities that opted in had to
  # serve breakfast and lunch at no cost to all students at their non-CEP
  # sites, first until each authority's allocation ran out, which happened
  # between November 2022 and February 2023 (P.A. 22-118), and then from
  # March 1, 2023 to the end of the school year (SMART 2.0, P.A. 23-1). The
  # Connecticut State Department of Education called the funds transitional,
  # not "universal free meals". Not modeled: opt-in; authorities whose first
  # allocation ran out before March 1, 2023 could charge households again
  # until then; new sponsors and authorities that ran the regular NSLP in
  # SY 2021-22 were ineligible. Universal breakfast in SY 2023-24 and
  # SY 2026-27 is in state_universal_free_breakfast.
  2022-07-01:
    value: true
    metadata:
      reference:
        - title: "Connecticut CSDE Operational Memorandum 14-22 (P.A. 22-118, SMART funds, SY 2022-23) #page 1-2,4,7,9,12"
          href: https://portal.ct.gov/-/media/sde/nutrition/nslp/memos/om2022/om14-22.pdf#page=1
        - title: "Connecticut CSDE Operational Memorandum 06-23 (P.A. 23-1, SMART funds 2.0, March 1 to June 30, 2023) #page 1,6,8"
          href: https://portal.ct.gov/-/media/sde/nutrition/nslp/memos/om2023/om06-23.pdf#page=1
        - title: "Connecticut Public Act 22-118 (HB 5506), § 10 (Free Meals for Students, FY 2023) #page 31,37-38"
          href: https://www.cga.ct.gov/2022/ACT/PA/PDF/2022PA-00118-R00HB-05506-PA.PDF#page=31
        - title: "Connecticut Public Act 23-1 (HB 6671), § 1 (Free Meals for Students, FY 2023) #page 1,6,8"
          href: https://www.cga.ct.gov/2023/ACT/PA/PDF/2023PA-00001-R00HB-06671-PA.PDF#page=1
  # SMART funds were one-time ARPA allocations for SY 2022-23 only.
  2023-07-01:
    value: false
    metadata:
      reference:
        - title: "Connecticut CSDE Operational Memorandum 06-23 (P.A. 23-1, SMART funds 2.0, March 1 to June 30, 2023) #page 6,8"
          href: https://portal.ct.gov/-/media/sde/nutrition/nslp/memos/om2023/om06-23.pdf#page=6
