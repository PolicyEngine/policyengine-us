ME:
  0000-01-01: false
  # P.L. 2021, c. 398, Part OOOO (LD 221), an emergency act approved July 1,
  # 2021, enacted 20-A M.R.S. § 6602(1)(H)-(I) with no later start date.
  # Federal waivers already made SY 2021-22 meals free, so the act funded the
  # state share from SY 2022-23. Reduced-price students were covered earlier
  # (state_covers_reduced_price_copay and
  # state_covers_reduced_price_copay_breakfast_only). Not modeled: private
  # schools approved for tuition are covered only when at least 60% of their
  # students are publicly funded (P.L. 2021, c. 759, Part D), and since
  # P.L. 2025, c. 388, Part C only publicly funded students are covered and
  # state funding requires a school to maximize federal reimbursement,
  # including the community eligibility provision if eligible (§ 6602-A).
  2021-07-01:
    value: true
    metadata:
      reference:
        - title: "Maine P.L. 2021, c. 398 (LD 221), Part OOOO and Meals for Students Fund allocation #page 1,58,259-260,268"
          href: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP0156&item=7&snum=130#page=1
        - title: 20-A M.R.S. § 6602(1)(H)-(I) — School food service programs
          href: https://legislature.maine.gov/statutes/20-A/title20-Asec6602.html
