description: States provide breakfast and lunch at no cost to all students regardless of household income under the National School Lunch Program and School Breakfast Program if this is true.
# Universal free breakfast alone is in state_universal_free_breakfast.
# Federal nationwide waivers made all school meals free through June 30, 2022.
# The model does not represent them.
# Budget-funded programs end at their enacted funding end; standing statutes
# carry forward.
metadata:
  propagate_metadata_to_children: true
  label: State universal free school meals
  period: year
  unit: bool
  breakdown:
    - state_code
  reference:
