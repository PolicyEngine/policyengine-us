  # The FY2023 budget made breakfast and lunch free to all students in
  # SY 2022-23; M.G.L. c. 69, § 1C(a)(1) made it permanent from July 1, 2023.
  # Not modeled: in SY 2022-23 the state's universal free school meals
  # regulation required eligible schools to adopt the community eligibility
  # provision; from FY2024 the statute requires schools to maximize federal
  # funds through the community eligibility provision, Provision 2 or another
  # federal provision. Nonpublic schools are included.
