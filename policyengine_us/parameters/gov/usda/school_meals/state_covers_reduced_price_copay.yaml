NC:
  0000-01-01: false
  # North Carolina has covered the reduced-price breakfast copay since
  # July 1, 2011 (S.L. 2011-342 § 1), subject to sufficient appropriations.
  # This parameter is true only while the state also covers the lunch copay.
  2020-07-01:
    value: true
    metadata:
      reference:
        - title: North Carolina S.L. 2020-80 § 2.3.(b) (lunch, 2020-2021 school year)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2019-2020/SL2020-80.pdf#page=14
        - title: North Carolina S.L. 2011-342 § 1 (breakfast)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/HTML/2011-2012/SL2011-342.html
  # No state law covered the lunch copay for the 2021-2022 school year.
  2021-07-01: false
  2022-07-01:
    value: true
    metadata:
      reference:
        - title: North Carolina S.L. 2022-74 § 7.3 (lunch, 2022-2023 school year)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2021-2022/SL2022-74.pdf#page=28
        - title: North Carolina S.L. 2011-342 § 1 (breakfast)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/HTML/2011-2012/SL2011-342.html
  2023-07-01:
    value: true
    metadata:
      reference:
        - title: North Carolina S.L. 2023-134 § 7.58 (breakfast and lunch, 2023-2025 biennium)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2023-2024/SL2023-134.pdf#page=119
        - title: North Carolina S.L. 2023-134 § 43.8 (effective date)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2023-2024/SL2023-134.pdf#page=625
  # S.L. 2025-89 § 2A.8, effective retroactively to July 1, 2025, repealed
  # S.L. 2023-134 § 7.58 and added the standing requirement to G.S. 115C-264(a1).
  # The mandate binds local boards of education operating school nutrition
  # programs. The model assumes a covered public school; it does not distinguish
  # charter/nonpublic sponsors or school participation (follow-up issue #9789).
  2025-07-01:
    value: true
    metadata:
      reference:
        - title: N.C. Gen. Stat. § 115C-264(a1)
          href: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_115C/GS_115C-264.html
        - title: North Carolina S.L. 2025-89 § 2A.8.(a) (adds G.S. 115C-264(a1))
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2025-2026/SL2025-89.pdf#page=5
        - title: North Carolina S.L. 2025-89 § 2A.8.(b) (repeals S.L. 2023-134 § 7.58)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2025-2026/SL2025-89.pdf#page=6
        - title: North Carolina S.L. 2025-89 § 7.1 (effective retroactively to July 1, 2025)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2025-2026/SL2025-89.pdf#page=32
