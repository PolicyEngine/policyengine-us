  # North Carolina has covered the reduced-price breakfast copay since
  # July 1, 2011 (S.L. 2011-342 § 1). This parameter is true only while the
  # state also covers the reduced-price lunch copay.
  2020-07-01:
    value: true
    metadata:
      reference:
        - title: North Carolina S.L. 2020-80 § 2.3.(b), page 14 (lunch, 2020-2021 school year)
          href: https://www.ncleg.gov/EnactedLegislation/SessionLaws/PDF/2019-2020/SL2020-80.pdf#page=14
