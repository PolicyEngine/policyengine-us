ME:
  0000-01-01: false
  # 20-A M.R.S. § 6602(1)(B) and (D): a public school must serve breakfast and
  # lunch at no cost to students eligible for free or reduced-price meals, and
  # the State pays the reduced-price difference. Lunch was added by P.L. 2019,
  # c. 343, an emergency act effective June 17, 2019 and first funded for
  # FY2020; breakfast alone was covered from SY 2008-09
  # (state_covers_reduced_price_copay_breakfast_only). Standing statute; moot
  # once meals became universal (state_universal_free_meals). Not modeled:
  # public schools only until 2022 (see the breakfast entry); secondary
  # schools limited to grades 9 to 12 are exempt from the breakfast rule but
  # not the lunch rule (20-A M.R.S. § 6602(2)(A)).
  2019-07-01:
    value: true
