  # students, so reduced-price students pay for neither meal. Not modeled:
  # STABLE and RISE were school food authority opt-in programs (RISE all sites
  # or none); STABLE excluded new sponsors and new breakfast sites; every
  # program excluded CEP sites. STAR (SY 2024-25) required eligible public,
  # charter, residential child care institution (day program) and endowed
