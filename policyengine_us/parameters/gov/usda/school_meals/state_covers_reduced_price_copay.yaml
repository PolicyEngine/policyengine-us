description: States provide breakfast and lunch at no cost to students eligible for reduced-price meals under the National School Lunch Program and School Breakfast Program if this is true.
# Every jurisdiction with a true entry below is verified against the cited law.
# Virginia is intentionally false (see its entry). North Dakota students in the
# reduced-price band are covered through state_free_income_limit from July 1,
# 2023 to June 30, 2027, and Oregon students in that band are also covered
# through it from July 1, 2021. Coverage of only one meal is in
# state_covers_reduced_price_copay_breakfast_only and
# state_covers_reduced_price_copay_lunch_only; this parameter is never true for
# a state and date where either of those is. Other false entries do not
# establish that a state has no coverage.
# Assume enrollment at a covered school participating in both meal programs.
# Not modeled: opt-in, proration and appropriation limits, public-only
# coverage, grade limits, community eligibility provision (CEP) exclusions,
# partial-year starts, and household inputs for school participation or CEP
# status; each state's conditions are noted beside its entry.
# Budget-funded coverage ends at its enacted funding end; standing statutes
# carry forward.
# Federal nationwide waivers made all school meals free through June 30, 2022.
# The model does not represent them, so values dated before July 1, 2022 show
# state effects in calendar 2021 and 2022 that families did not see.
metadata:
  propagate_metadata_to_children: true
  label: State covers reduced-price school meal copays
  period: year
  unit: bool
  breakdown:
    - state_code
  reference:
    - title: 7 CFR 245.2 - Definitions (reduced price meal)
      href: https://www.law.cornell.edu/cfr/text/7/245.2
