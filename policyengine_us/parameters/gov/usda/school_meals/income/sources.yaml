description: Income sources that count as income for school meal subsidies.

values:
  2009-01-01:
    - employment_income
    - dividend_income
    - interest_income
    - gi_cash_assistance
    - child_support_received
    - social_security
    - ssi
    - tanf
    # 7 CFR 245.6(a)(5)(ii) lists welfare among the sources of cash income.
    - general_assistance
    - pension_income
    - survivor_benefits
    - financial_assistance
    - miscellaneous_income
    - veterans_benefits
    - total_unemployment_compensation
    - strike_benefits
    - retirement_distributions
    - alimony_income
    - workers_compensation
    - disability_benefits
    - military_retirement_income

