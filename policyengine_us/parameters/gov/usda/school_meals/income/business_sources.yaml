description: >-
  USDA counts these business, rental and pass-through income sources for school
  meals after treating each person's losses as zero. PolicyEngine retains
  component netting within each person's partnership/S-corporation and
  estate/trust aggregate.
values:
  2009-01-01:
    - self_employment_income
    - sstb_self_employment_income
    - rental_income
    - farm_operations_income
    - farm_rent_income
    - partnership_s_corp_income
    - estate_income
