description: States provide free breakfast and lunch to students with household income at or below this percentage of the federal poverty guideline under the National School Lunch Program and School Breakfast Program.
# 0 means no state limit above the federal free-meal limit; school_meal_tier
# applies the higher of this value and gov.usda.school_meals.income.limit.FREE.
# A limit that applies only to breakfast is in
# state_free_income_limit_breakfast_only.
# Every limit here is defined in law as a percentage of the federal poverty
# guideline or level. The model uses each calendar year's guideline, dated
# January 1 (Alaska and Hawaii use their own), while schools apply the
# guideline for each July-to-June school year.
# Assume enrollment at a covered school; each state's conditions are noted
# beside its entry. Budget-funded limits end at their enacted funding end;
# standing statutes carry forward.
metadata:
  propagate_metadata_to_children: true
  label: State free school meal income limit as a share of the poverty guideline
  period: year
  unit: /1
  breakdown:
    - state_code
  reference:
    - title: 42 U.S. Code § 1758(b)(1)(A) - Program requirements
      href: https://www.law.cornell.edu/uscode/text/42/1758#b_1_A
