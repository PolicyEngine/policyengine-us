  # HB 2536 (2021 c. 119) requires each school that does not serve free meals
  # to all students to offer lunch, and breakfast where it is offered, at no
  # charge up to 300 percent of the federal poverty guidelines from July 1,
  # 2021. The Student Success Act reimbursed schools that chose to do so from
  # July 1, 2020; that voluntary period is not encoded. Not modeled: public
  # schools outside the community eligibility provision only; ORS 327.531(3)
  # suspends the requirement if the Department of Education lacks
  # reimbursement funds; private schools are not covered; ORS
  # 327.535(8)(b)(B) makes breakfast free to all students at sites where at
  # least 70 percent of students are eligible.
