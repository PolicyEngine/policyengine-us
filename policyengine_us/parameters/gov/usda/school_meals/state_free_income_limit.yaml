  # P.L.2022, c.104 provides free breakfast and lunch from September 1, 2023
  # for students from households with income not less than 186 percent and not
  # more than 199 percent of the federal poverty level. P.L.2023, c.336
  # (January 16, 2024) raised the breakfast limit to 224 percent with no end
  # date, but its lunch schedule names only SY 2023-24 (199 percent) and
  # SY 2024-25 (224 percent), and no later law amends either section. Free
  # lunch up to 224 percent continued in SY 2025-26 and SY 2026-27 through the
  # annual Working Class Families State Supplement appropriation, so this
  # limit for both meals ends after FY2027, the last enacted appropriation;
  # breakfast continues in state_free_income_limit_breakfast_only.
  # The breakfast limit was legally 224 percent from January 16, 2024, but
  # calendar 2024 reads 199 percent for both meals.
  # Taking the higher of this and the federal limit covers all income above
  # the federal reduced-price limit, as the Department of Agriculture's income
  # table (Form 427) does. Not modeled: CEP sites are excluded (their meals
  # are already free); schools where fewer than 5 percent of enrolled students
  # are federally eligible for free or reduced-price lunch are exempt
  # (N.J.S.A. 18A:33-5).
  2023-09-01:
    value: 1.99
    metadata:
      reference:
        - title: New Jersey P.L.2022, c.104 (Working-Class Families' Anti-Hunger Act), N.J.S.A. 18A:33-4(a)(3), 18A:33-14a(a)(2)
          href: https://pub.njleg.gov/Bills/2022/PL22/104_.HTM
  2024-07-01:
    value: 2.24
    metadata:
      reference:
        - title: New Jersey P.L.2023, c.336, N.J.S.A. 18A:33-4(a)(4), 18A:33-14a(a)(3)
          href: https://pub.njleg.state.nj.us/Bills/2022/AL23/336_.HTM
