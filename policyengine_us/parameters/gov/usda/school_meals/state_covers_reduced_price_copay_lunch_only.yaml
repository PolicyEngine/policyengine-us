  # Local education agencies (LEAs) in the National School Lunch Program must
  # serve lunch at no charge to K-12 students eligible for reduced-price meals;
  # breakfast is not covered. H.B. 100 appropriated no money. The 2026 General
  # Session appropriated $2,500,000 one-time to reimburse LEAs "for three
  # years". Which fiscal years is unverified (FY2026-28 or FY2027-29), so
  # coverage ends after FY2028, the last year covered under either reading.
  # Not modeled: if appropriations fall short, LEAs are reimbursed pro rata
  # and may ask parents to cover the remaining cost.
  2025-07-01:
    value: true
    metadata:
      reference:
        - title: "Utah H.B. 100 (2025), Utah Code § 53F-2-423 #page 2-3"
          href: https://le.utah.gov/Session/2025/bills/enrolled/HB0100.pdf#page=2
        - title: Utah Code § 53F-2-423
          href: https://le.utah.gov/xcode/Title53F/Chapter2/C53F-2-S423_2025070120250507.html
  2028-07-01:
    value: false
    metadata:
      reference:
        - title: Utah Office of the Legislative Fiscal Analyst, 2026 General Session Budget Summary (Reduced-Price School Lunch)
          href: https://le.utah.gov/interim/2026/pdf/00002079.pdf#page=9
