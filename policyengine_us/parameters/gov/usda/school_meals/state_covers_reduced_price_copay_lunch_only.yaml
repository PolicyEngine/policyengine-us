description: States provide lunch, but not breakfast, at no cost to students eligible for reduced-price meals under the National School Lunch Program if this is true.
# True only while a state covers the reduced-price lunch copay but not the
# breakfast copay. Coverage of both meals is in state_covers_reduced_price_copay,
# and the two parameters are never true for the same state and date.
# Assume enrollment at a covered school; each state's conditions are noted
# beside its entry. Budget-funded coverage ends at its enacted funding end;
# standing statutes carry forward.
metadata:
  propagate_metadata_to_children: true
  label: State covers reduced-price school lunch copays only
  period: year
  unit: bool
  breakdown:
    - state_code
  reference:
    - title: 7 CFR 245.2 - Definitions (reduced price meal)
      href: https://www.law.cornell.edu/cfr/text/7/245.2
