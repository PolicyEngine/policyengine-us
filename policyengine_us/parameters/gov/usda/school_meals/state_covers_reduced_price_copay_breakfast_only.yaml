description: States provide breakfast, but not lunch, at no cost to students eligible for reduced-price meals under the School Breakfast Program if this is true.
# True only while a state covers the reduced-price breakfast copay but not the
# lunch copay. Coverage of both meals is in state_covers_reduced_price_copay,
# and the two parameters are never true for the same state and date.
# Assume enrollment at a covered school; each state's conditions are noted
# beside its entry. Budget-funded coverage ends at its enacted funding end;
# standing statutes carry forward.
# Federal nationwide waivers made all school meals free through June 30, 2022.
# The model does not represent them, so values dated before July 1, 2022 show
# state effects that families did not see.
metadata:
  propagate_metadata_to_children: true
  label: State covers reduced-price school breakfast copays only
  period: year
  unit: bool
  breakdown:
    - state_code
  reference:
    - title: 7 CFR 245.2 - Definitions (reduced price meal)
      href: https://www.law.cornell.edu/cfr/text/7/245.2
