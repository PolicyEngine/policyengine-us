  # 20-A M.R.S. § 6602(1)(B): a public school that serves breakfast must serve
  # it at no cost to students eligible for free or reduced-price meals, and the
  # State pays the reduced-price difference. P.L. 2007, c. 539 is not an
  # emergency act and took effect June 30, 2008; it was first funded for
  # FY2009. Lunch was added from SY 2019-20, when both meals are in
  # state_covers_reduced_price_copay. Not modeled: public schools only until
  # 2022, when private schools approved for tuition with at least 60 percent
  # publicly funded students were added; secondary schools limited to grades
  # 9 to 12 are exempt (20-A M.R.S. § 6602(2)(A)).
  2008-06-30:
    value: true
    metadata:
      reference:
