description: States provide breakfast at no cost to all students regardless of household income under the School Breakfast Program if this is true.
# Breakfast only; universal free breakfast and lunch is in
# state_universal_free_meals. Assume enrollment at a covered school; each
# state's conditions are noted beside its entry.
# Budget-funded programs end at their enacted funding end; standing statutes
# carry forward.
# Federal nationwide waivers made all school meals free through June 30, 2022.
# The model does not represent them.
metadata:
  propagate_metadata_to_children: true
  label: State universal free school breakfast
  period: year
  unit: bool
  breakdown:
    - state_code
  reference:
    - title: 42 U.S. Code § 1773 - School breakfast program
      href: https://www.law.cornell.edu/uscode/text/42/1773
