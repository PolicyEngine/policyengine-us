description: USDA extends free school meals to every child in a family that receives one of these benefits or whose household lacks a fixed nighttime residence.

values:
  2009-09-01:
    - snap # Supplemental Nutrition Assistance Program.
    - receives_snap # Reported SNAP receipt, for households the model gives a $0 allotment.
    - tanf # Temporary Assistance to Needy Families. Currently only available in CA and IL.
    - receives_tanf # Reported TANF receipt, for households the model gives a $0 benefit.
    - fdpir # Food Distribution Program on Indian Reservations.
    # Congress defines a homeless child as one who lacks a fixed, regular and
    # adequate nighttime residence (42 U.S.C. 11434a(2)(A)), so each child in
    # a household that lacks one qualifies under 42 U.S.C. 1758(b)(12)(A)(iv).
    - is_homeless

