description: Yonkers taxes the Yonkers-source wages of nonresidents at this rate.
values:
  2021-01-01: 0.005
  # Tax Law § 1340 and § 3 of its model local law authorize the earnings tax
  # only for taxable years beginning before 2028 (as last extended by Chapter
  # 159 of 2025), so it lapses in 2028 absent a further extension.
  2028-01-01: 0
