description: Yonkers levies a resident income tax surcharge at this fraction of New York State net tax liability.
values:
  2021-01-01: 0.1675
  # Tax Law § 1321 authorizes the surcharge only for taxable years beginning
  # before 2028 (as last extended by Chapter 159 of 2025), so it lapses in
  # 2028 absent a further extension.
  2028-01-01: 0
