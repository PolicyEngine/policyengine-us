description: New York City allows the income tax elimination credit to married filing separately filers with federal adjusted gross income up to this threshold, based on the number of dependents.
metadata:
  type: single_amount
  threshold_unit: dependent
  amount_unit: currency-USD
  period: year
  label: NYC income tax elimination credit income threshold for married filing separately filers
  # The last bracket applies to 8 or more dependents. From tax year 2026,
  # Tax Law § 1310(h)(1)(B)(iii) multiplies these amounts by one plus
  # the percentage by which the CPI-U for the preceding calendar year exceeds
  # the CPI-U for 2024, each year's CPI-U being the average for the 12 months
  # ending August 31 (§ 1310(h)(3)(A)). The statute sets no rounding.
  # `floor` holds the factor at one or above, since a CPI-U below its 2024
  # level exceeds it by no percentage. Base mode projects each bracket's
  # amount from its 2025 value; the thresholds count dependents and stay.
  # Each amount carries its own uprating: gov/local propagates metadata to
  # children, so a scale-level uprating would reach the thresholds too.
  reference:
    - title: NY Tax Law § 1310(h)(1)(B)(ii)
      href: https://www.nysenate.gov/legislation/laws/TAX/1310
    - title: 2025 Form IT-270-I, Part 2, line 2 income thresholds table
      href: https://www.tax.ny.gov/pdf/2025/inc/it270i_2025.pdf#page=1
