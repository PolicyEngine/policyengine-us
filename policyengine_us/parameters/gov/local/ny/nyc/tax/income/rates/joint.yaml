description: Progressive rate schedule for a joint filer in NYC.
metadata:
  type: marginal_rate
  threshold_unit: currency-USD
  rate_unit: /1
  label: NYC income tax rates for joint filers
  reference:
    - title: NY Form IT-201 Instructions, 2023
      href: https://www.tax.ny.gov/forms/html-instructions/2023/it/it201i-2023.htm#nyc-tax-rate-schedule
    - title: NY Form IT-201 Instructions, 2024
      href: https://www.tax.ny.gov/pdf/2024/inc/it201i_2024.pdf#page=40
    - title: NY Form IT-201 Instructions, 2025
      href: https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf#page=40
    # Tax forms combine the tax rates provided in 11-1701 with those in 11-1704.1,
    # a 14% additional tax. We cite the combined rates in the tax forms.
    # Chapter 127 of 2026 extended both the 11-1701(a) rates and the additional
    # tax through taxable years beginning before 2030. From 2030, only the
    # 11-1701(b) rates apply, without the additional tax.
    - title: The New York City Administrative Code § 11-1701 Imposition of tax.
      href: https://codelibrary.amlegal.com/codes/newyorkcity/latest/NYCadmin/0-0-0-13463
    - title: The New York City Administrative Code § 11-1704.1 Additional tax
      href: https://codelibrary.amlegal.com/codes/newyorkcity/latest/NYCadmin/0-0-0-13565
    - title: NY Tax Law § 1304(a)(1)(A), (b)(1) Rate of tax
      href: https://www.nysenate.gov/legislation/laws/TAX/1304
    - title: NY Tax Law § 1304-B(a)(1) Additional tax
      href: https://www.nysenate.gov/legislation/laws/TAX/1304-B
    - title: Chapter 127 of 2026 (A.11561), Part D § 2, amending Tax Law § 1301(a)(1)
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=5
    - title: Chapter 127 of 2026 (A.11561), Part D § 3, amending Tax Law § 1304(b)(1)
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=6
    - title: Chapter 127 of 2026 (A.11561), Part D § 4, amending Tax Law § 1304-B(a)(1)
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=7
    - title: Chapter 127 of 2026 (A.11561), Part D § 6, amending NYC Administrative Code § 11-1701
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=8
    - title: Chapter 127 of 2026 (A.11561), Part D § 7, amending NYC Administrative Code § 11-1701(b)(1)
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=9
    - title: Chapter 127 of 2026 (A.11561), Part D § 8, amending NYC Administrative Code § 11-1704.1(a)(1)
      href: https://legislation.nysenate.gov/pdf/bills/2025/A11561#page=10
brackets:
  - threshold:
      2017-01-01: 0
    rate:
      2017-01-01: 0.03078 # 2.7% * 114% = 3.078%
      2030-01-01: 0.0118 # 1.18%, no additional tax
  - threshold:
      2017-01-01: 21_600
    rate:
      2017-01-01: 0.03762 # 3.3% * 114% = 3.762%
      2030-01-01: 0.01435 # 1.435%, no additional tax
  - threshold:
      2017-01-01: 45_000
    rate:
      2017-01-01: 0.03819 # 3.35% * 114% = 3.819%
      2030-01-01: 0.01455 # 1.455%, no additional tax
  - threshold:
      2017-01-01: 90_000
    rate:
      2017-01-01: 0.03876 # 3.4% * 114% = 3.876%
      2030-01-01: 0.0148 # 1.48%, no additional tax
