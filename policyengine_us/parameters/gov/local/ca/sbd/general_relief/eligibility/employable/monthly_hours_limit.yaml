description: San Bernardino County considers a General Relief applicant employable if currently unemployed or employed fewer than this number of hours per month.
# Adopted by GRPHB Handbook Letter #7356 (Board approved January 29, 2021);
# dated June 1, 2021 to align with the modeled flat-grant era.
values:
  2021-06-01: 100

