description: San Bernardino County children at or below this age meet the General Relief linkage criteria if verified to be enrolled in and attending high school full time.
# "Children aged 16 to 18 who are verified to be enrolled and attending high
# school full-time and earning passing grades" — inclusive upper bound: a
# child is "aged 18" until their 19th birthday.
# Adopted by GRPHB Handbook Letter #7356 (Board approved January 29, 2021);
# dated June 1, 2021 to align with the modeled flat-grant era.
values:
  2021-06-01: 18

