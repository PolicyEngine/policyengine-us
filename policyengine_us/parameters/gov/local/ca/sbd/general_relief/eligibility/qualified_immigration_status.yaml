description: San Bernardino County considers people with these immigration statuses as qualified for the General Relief program.
values:
  # GRPHB Handbook Letter #7358 (May 2021), Citizenship/Alienage: only
  # U.S. citizens and legal permanent residents qualify.
  2021-06-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
  # The GR 101 brochure broadens the rule to "other non-citizen authorized
  # to live in the United States" without enumerating statuses; this is
  # mapped to the same noncitizen statuses the model applies for CalWORKs
  # (gov.states.ca.cdss.tanf.cash.immigration_status.eligible_statuses), a
  # conservative reading that keeps the two county-administered programs
  # consistent and excludes lawfully present but non-qualified statuses
  # such as DACA and TPS. The county does not publish the exact transition
  # date; the May 2022 brochure is the earliest evidence of the broader
  # wording.
  2022-05-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    - REFUGEE
    - ASYLEE
    - PAROLED_ONE_YEAR

