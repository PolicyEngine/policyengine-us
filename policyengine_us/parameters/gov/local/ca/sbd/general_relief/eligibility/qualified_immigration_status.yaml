description: San Bernardino County considers people with these immigration statuses as qualified for the General Relief program.
values:
  2021-06-01:
    - CITIZEN
    - LEGAL_PERMANENT_RESIDENT
    # The brochure's "other non-citizen authorized to live in the United
    # States" category is mapped to all lawfully present immigration statuses.
    - REFUGEE
    - ASYLEE
    - CUBAN_HAITIAN_ENTRANT
    - DEPORTATION_WITHHELD
    - CONDITIONAL_ENTRANT
    - PAROLED_ONE_YEAR
    - DACA
    - TPS

