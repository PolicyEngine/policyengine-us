description: San Bernardino County counts these unearned income sources in full under the General Relief program.
values:
  2021-06-01:
    # In-kind and vendor payments are not counted as income since 6/1/2021
    # (GRPHB HL #7358, Chapter A p. A-1), hence their absence from this list.
    # Social Security retirement, survivors, and disability benefits.
    - social_security
    # Unemployment Insurance Benefits.
    - unemployment_compensation
    # State Disability Insurance.
    - ca_state_disability_insurance
    # Disability and workers' compensation benefits.
    - disability_benefits
    - workers_compensation
    # Veterans benefits.
    - veterans_benefits
    # Retirement and pension income.
    - pension_income
    - retirement_distributions
    - railroad_benefits
    # Support payments and other cash assistance.
    - alimony_income
    - child_support_received
    - financial_assistance
    - gi_cash_assistance
    - strike_benefits
    # Non-Social-Security survivor and life insurance benefits.
    - survivor_benefits
    - life_insurance_benefits
    # Interest, dividends, capital gains, estates, and trusts.
    - interest_income
    - dividend_income
    - capital_gains
    - estate_income
    # Net income from any kind of property is counted as unearned income.
    - rental_income
    # Grants and scholarships count as unearned income; the education-expense
    # carve-out (tuition, books, supplies, transportation) is not modeled.
    - educational_assistance
    # SSI recipients are barred from the assistance unit at the person level,
    # but "all income in the AU must be taken into consideration", so an
    # excluded member's SSI counts toward the unit's pooled income.
    - ssi

metadata:
  unit: list
  period: year
  label: San Bernardino County General Relief unearned income sources
