description: San Bernardino County exempts this amount of each vehicle's net market value from countable personal property under the General Relief program.
# Applies to each vehicle; the balance counts toward the $500 personal
# property limit (the county's rule evaluating a vehicle used as the
# principal residence under the real property limit instead is not
# modeled). Adopted by GRPHB Handbook
# Letter #7356 (Board approved January 29, 2021). HL #7358's reissued
# property table omits the Vehicles row without listing a repeal, so the
# exemption is carried forward.
values:
  2021-06-01: 3_000

