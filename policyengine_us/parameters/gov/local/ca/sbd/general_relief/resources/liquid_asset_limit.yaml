description: San Bernardino County limits liquid assets to this amount per assistance unit under the General Relief program.
# The handbook limits liquid assets (cash, bank accounts, stocks, and bonds)
# to "$50 per person or per GR AU"; modeled as a flat per-assistance-unit
# limit, the strictest literal reading. Liquid assets also count within the
# $500 personal property limit.
values:
  2021-06-01: 50

