description: Los Angeles county accounts for these income sources after state and federal deductions under the general relief program.
values:
  2021-07-01:
    # Veterans benefits.
    - veterans_benefits
    # Unemployment Insurance Benefits (UIB) : 
    - total_unemployment_compensation # match?
    - ca_state_disability_insurance
    # Income from a job of any type.
    - irs_employment_income
    - self_employment_income
    - sstb_self_employment_income
    - ssi
    - social_security
    # GR policy 44-101 deducts "all net income to the General Relief (GR)
    # household" from the grant, and its current income takes in "the cash
    # (including loans), food, housing, and other items that are received by
    # and available to the GR household", so railroad benefits count.
    - railroad_benefits
    - tanf
