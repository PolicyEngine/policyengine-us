description: Income sources counted as net investment income.
# net_investment_income sums person-level sources over the head and spouse
# only. Section 1411(a)(1) taxes each individual's own net investment income,
# so a tax unit dependent's amounts go on the dependent's own Form 8960. A
# parent's Form 8960 includes a child's interest, dividends and capital gain
# distributions only under a Form 8814 election (Form 8960 line 7), which is
# not modeled. A tax-unit-level source must already leave dependents out.
values:
  2013-01-01:
    - taxable_interest_income
    - dividend_income
    - rental_income
    - passive_partnership_s_corp_income
    # Income from estates and trusts (Schedule E Part III) keeps its character
    # in the beneficiary's hands (§§ 652(b), 662(b)). Form 8960 line 4a
    # includes all of it with the rest of Schedule 1 line 5; the fiduciary's
    # Schedule K-1 (Form 1041) box 14 code H adjustment is then entered on
    # line 7, for example to remove income that is not net investment income.
    # The model follows that structure: all estate_income counts unless the
    # code H input says otherwise, and a dependent's amounts stay out of the
    # filer's net investment income.
    - estate_net_investment_income
    # Form 1040 line 7 of the head and spouse (Form 8960 line 5a).
    - filer_loss_limited_net_capital_gains
    - non_sch_d_capital_gains
    # Capital gain distributions received without filing Schedule D (Form 1040 line 7).
