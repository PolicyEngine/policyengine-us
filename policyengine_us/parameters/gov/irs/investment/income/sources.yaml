description: Income sources counted as net investment income.
values:
  2013-01-01:
    - taxable_interest_income
    - dividend_income
    - rental_income
    - passive_partnership_s_corp_income
    # Income from estates and trusts (Schedule E Part III) keeps its character
    # in the beneficiary's hands (§§ 652(b), 662(b)) and enters Form 8960
    # line 4a with the rest of Schedule 1 line 5. The model has no
    # passive/non-passive split for estate_income, so all of it is treated as
    # net investment income under § 1411(c)(1)(A)(ii) with no line 4b
    # adjustment. This overstates the base for the rare beneficiary who
    # materially participates in a trade or business held by the trust.
    - estate_income
    - loss_limited_net_capital_gains
    - non_sch_d_capital_gains
    # Capital gain distributions received without filing Schedule D (Form 1040 line 7).
