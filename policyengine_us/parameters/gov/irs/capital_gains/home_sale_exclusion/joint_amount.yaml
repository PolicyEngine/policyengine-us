description: The IRS excludes up to this amount of gain on the sale of a main home on a joint return when either spouse meets the ownership test, both meet the use test and neither excluded gain on another home in the prior two years.
values:
  1997-05-07: 500_000
metadata:
  unit: currency-USD
  period: year
  label: Home sale gain exclusion, joint return
  reference:
