description: Above-the-line amounts that belong to the filer even when they are recorded on a tax unit dependent, so they are summed over every tax unit member rather than over the head and spouse only.
values:
  2010-01-01:
    # Employer adoption assistance is excluded for the adopting employee
    # (26 USC 137(a)); households record it on the adopted child, as the Ohio
    # adoption credit reads it.
    - qualified_adoption_assistance_expense
    # Savings bond interest used for education is excluded for the bond's
    # owner, who must have been at least 24 when the bond was issued, and the
    # expenses may be a dependent's. "A bond bought by a parent and issued in
    # the name of his or her child under age 24 does not qualify for the
    # exclusion by the parent or child" (Form 8815). By convention, an amount
    # recorded on a dependent is the parent-owned bond's exclusion recorded on
    # the student whose expenses it paid.
    - us_bonds_for_higher_ed
metadata:
  unit: list
  period: year
  label: Above-the-line amounts summed over dependents
  reference:
    - title: 26 U.S. Code § 137 - Adoption assistance programs
