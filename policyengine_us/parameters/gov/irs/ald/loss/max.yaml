description: Business losses exceeding business income plus this threshold are disallowed; only joint returns receive twice the nonjoint threshold.
metadata:
  propagate_metadata_to_children: true
  label: Business loss limitation
  breakdown:
    - filing_status
  unit: currency-USD
  period: year
  uprating:
    parameter: gov.irs.uprating
    rounding:
      type: nearest
      interval: 1_000
  reference:
    - title: CARES Act section 2304(a), retroactive suspension through 2020
      href: https://www.congress.gov/116/plaws/publ136/PLAW-116publ136.pdf
    - title: 26 U.S. Code § 461 - General rule for taxable year of deduction (l)(3)(A)(ii)(II)
      href: https://www.law.cornell.edu/uscode/text/26/461#l_3_A_ii_II
    - title: OBBBA § 70601 - Permanent extension of limitation on excess business losses of noncorporate taxpayers
      href: https://www.congress.gov/bill/119th-congress/house-bill/1/text
    - title: 2025 Form 461, line 15
      href: https://www.irs.gov/pub/irs-prior/f461--2025.pdf
    - title: Revenue Procedure 2025-32, section 4.31 (2026 threshold)
      href: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=23
    - title: 2024 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-23-34.pdf#page=17
    - title: 2023 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-22-38.pdf#page=13
    - title: 2022 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-21-45.pdf#page=13
    - title: 2021 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-20-45.pdf#page=13
    - title: 2020 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-19-44.pdf#page=18
HEAD_OF_HOUSEHOLD:
  values:
    2013-01-01: .inf
    # CARES Act section 2304 suspends the limitation through 2020.
    2018-01-01: .inf
    2021-01-01: 262_000
    2022-01-01: 270_000
    2023-01-01: 289_000
    2024-01-01: 305_000
    2025-01-01: 313_000
    2026-01-01: 256_000
