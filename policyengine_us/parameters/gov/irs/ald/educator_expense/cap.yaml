description: The IRS caps the educator expense deduction at this amount for each eligible educator.
values:
  # 26 USC 62(a)(2)(D), added for 2002 by Pub. L. 107-147 and extended
  # retroactively through 2015, when Pub. L. 114-113 made it permanent and
  # indexed it from 2016 (26 USC 62(d)(3)).
  2002-01-01: 250
  2016-01-01: 250
  2017-01-01: 250
  2018-01-01: 250
  2019-01-01: 250
  2020-01-01: 250
  2021-01-01: 250
  2022-01-01: 300
  2023-01-01: 300
  2024-01-01: 300
  2025-01-01: 300
  2026-01-01: 350
metadata:
  unit: currency-USD
  period: year
  label: Educator expense deduction cap
  # Values after the last IRS publication are computed in
  # parameters/uprating_extensions.py per 26 U.S.C. 62(d)(3): the statutory
  # $250 increased by the 1(f)(3) cost-of-living adjustment with calendar
  # year 2014 as the base year, each increase rounded to the nearest multiple
  # of $50. Computing from the $250 base rather than chaining from the
  # rounded $350 puts each projected $50 step in the year the statute does on
  # the model's CPI projection; those values supersede this uprating rule,
  # which describes the index and rounding.
  uprating:
    parameter: gov.irs.uprating
    rounding:
      type: nearest
      interval: 50
