description: Taxpayers leave Alaska's energy relief payment out of federal gross income, if this is true.

values:
  2022-01-01: true
  # Alaska paid no energy relief with the 2023 dividend. It paid the relief that
  # the Legislature added in 2023 with the 2024 dividend, so any payment that a
  # recipient got in 2023 came from the 2022 program. Alaska paid that program's
  # relief as part of one disbursement per eligible Alaskan, so a recipient who
  # got it in 2023 got nothing under the program in 2022. In section 4.03 of
  # Notice 2023-56, the IRS lets that taxpayer exclude the payment.
  2024-01-01: false

metadata:
  unit: bool
  period: year
  label: Alaska energy relief payment excluded from gross income
  reference:
