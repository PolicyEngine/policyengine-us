    - title: IRS News Release IR-2023-23, IRS issues guidance on state tax payments to help taxpayers
      href: https://www.irs.gov/newsroom/irs-issues-guidance-on-state-tax-payments-to-help-taxpayers
    # Alaska paid the 2022 program's relief as part of one disbursement per
    # eligible Alaskan.
    - title: Alaska Department of Revenue, DOR Response to IRS Guidance on 2022 PFD
      href: https://dor.alaska.gov/docs/default-source/press-releases/2023_02_17-dor-response-to-irs-guidance-on-2022-pfd.pdf#page=1
    # Section 2: the news release applied only to payments that states made in
