    - title: IRS Notice 2023-56, Federal Income Tax Consequences of Certain State Payments, section 2
      href: https://www.irs.gov/pub/irs-drop/n-23-56.pdf#page=2
    # Section 4.03: a taxpayer who got no payment under a 2022 program that the
