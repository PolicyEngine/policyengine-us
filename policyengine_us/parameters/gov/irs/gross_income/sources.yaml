description: Income sources counted as gross income for tax purposes.
values:
  2010-01-01:
    - irs_employment_income
    - self_employment_income
    - sstb_self_employment_income
    - partnership_s_corp_income
    - farm_operations_income
    - farm_rent_income
    - other_net_gain_gross_income
    - capital_gains
    - non_sch_d_capital_gains
    # Capital gain distributions received without filing Schedule D (Form 1040 line 7).
    - taxable_interest_income
    - rental_income
    # Royalties included in rental income
    - dividend_income
    - taxable_pension_income 
    # Pension income includes annuities and endowment contracts
    - debt_relief
    # Income in respect of a decedent (§ 61(a)(13)) is not modeled.
    # Income from an interest in an estate or trust (§ 61(a)(14), numbered
    # (15) before Pub. L. 115-97 § 11051): Schedule E Part III, carried to
    # Schedule 1 line 5. Losses are deducted in loss_ald.
    - estate_income
    - taxable_unemployment_compensation
    - taxable_social_security
    - illicit_income
    - taxable_retirement_distributions
    - taxable_roth_conversions
    - miscellaneous_income
    # Listed separately on 1040 line 8g.
    - ak_permanent_fund_dividend
    # Alimony from divorces executed before the TCJA cutoff (Schedule 1 line 2a).
    - taxable_alimony_income
    # Taxable state and local income tax refunds (Schedule 1 line 1 / IRC § 111).
    - salt_refund_income

