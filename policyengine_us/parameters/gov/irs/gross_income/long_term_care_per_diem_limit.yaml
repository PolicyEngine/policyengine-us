description: The IRS excludes per diem payments under qualified long-term care insurance contracts and accelerated death benefits up to this amount per day, or actual long-term care costs if greater.
# Years before 2022 are not entered; earlier years use the 2022 amount.
values:
  1997-01-01: 390
  2023-01-01: 420
  2024-01-01: 410
  2025-01-01: 420
  2026-01-01: 430
