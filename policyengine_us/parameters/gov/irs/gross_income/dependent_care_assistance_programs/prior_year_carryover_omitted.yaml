description: PolicyEngine leaves dependent care benefits carried over from the prior plan year (Form 2441 line 13) out of the benefits counted toward the federal dependent care assistance exclusion and taxable dependent care benefits, if this is true.
values:
  2017-01-01: false
  # Section 214 of the Taxpayer Certainty and Disaster Tax Relief Act of
  # 2020 let plans carry over unused benefits from plan years ending in 2020
  # and 2021; Notice 2021-26 disregards them for the section 129 limits of
  # 2021 and 2022, and the 2021 and 2022 Forms 2441 add line 13 to the line
  # 21 cap. The model does not apply that relief, so in these years it leaves
  # line 13 out of both line 15 and the cap.
  2021-01-01: true
  2023-01-01: false
metadata:
  unit: bool
  period: year
  label: Dependent care assistance prior-year carryover omitted
  reference:
    - title: 2021 Form 2441, Part III, line 21
      href: https://www.irs.gov/pub/irs-prior/f2441--2021.pdf#page=2
    - title: 2022 Form 2441, Part III, line 21
      href: https://www.irs.gov/pub/irs-prior/f2441--2022.pdf#page=2
    - title: 2023 Form 2441, Part III, line 21
      href: https://www.irs.gov/pub/irs-prior/f2441--2023.pdf#page=2
    - title: IRS Notice 2021-26
      href: https://www.irs.gov/pub/irs-drop/n-21-26.pdf#page=3
