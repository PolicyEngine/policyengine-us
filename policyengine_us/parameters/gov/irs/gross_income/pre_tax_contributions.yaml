description: The US subtracts these payroll deductions from wages and salaries when determining the taxable amount.
values:
  2010-01-01:
    # Only the traditional (pre-tax) variants reduce taxable wages.
    # Roth 401(k)/403(b) contributions are designated Roth contributions
    # under IRC §402A and are includible in gross income.
    - traditional_401k_contributions
    - traditional_403b_contributions
    # Only explicit pre-tax payroll health premiums reduce taxable wages.
    - pre_tax_health_insurance_premiums
    # HSA contributions can be either through pre-tax.
    - health_savings_account_payroll_contributions
    # Dependent care assistance (W-2 box 10, Form 2441 line 12) is excluded
    # from gross income under IRC 129(a) and left out of box 1. Any part
    # above the filer's own exclusion returns as taxable_dependent_care_benefits.
    - dependent_care_employer_benefits
metadata:
  label: Pre-tax contributions
  unit: list
  period: year
