description: Personal exemption phase-out starting income
metadata:
  label: Personal exemption phase-out start
  breakdown:
    - filing_status
  unit: currency-USD
  # Keep CBO's legacy forecasts for counterfactual reforms; personal exemptions
  # remain suspended under current law. Project from the final forecast year.
  # Historical section 68(b) rounds down to $50, then halves the joint amount
  # for separate filers. Set rounding on each child to preserve that order.
  uprating: gov.irs.uprating
  reference:
    - title: 26 U.S. Code § 151 - Allowance of deductions for personal exemptions (d)(3)(B)
      href: https://www.law.cornell.edu/uscode/text/26/151#d_3_B
    - title: 26 U.S. Code § 68 - Overall limitation on itemized deductions (b)(1)
      href: https://www.law.cornell.edu/uscode/text/26/68#b_1
    - title: CBO Tax Parameters and Effective Marginal Tax Rates | Jan 2025
      # 1. Tax Parameters.
      href: https://www.cbo.gov/data/budget-economic-data
    - title: 26 U.S.C. 68(b) (2024 edition), applicable amount and inflation adjustment
      href: https://www.govinfo.gov/content/pkg/USCODE-2024-title26/html/USCODE-2024-title26-subtitleA-chap1-subchapB-partI-sec68.htm
    - title: CBO January 2025 tax parameter forecasts
      href: https://raw.githubusercontent.com/US-CBO/cbo-data/main/data/budget/tax_parameters/annual_cy_2025-01.csv

