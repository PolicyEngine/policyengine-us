description: The US adds these deductions from taxable income back when calculating alternative minimum taxable income, whether or not the filer itemizes.
values:
  2018-01-01: []
  # 2025 Form 6251 line 1a subtracts the enhanced deduction for seniors
  # (Schedule 1-A, line 37) from Form 1040 line 14, so the deduction is
  # not taken for the AMT. Tips, overtime and car loan interest stay deducted.
  2025-01-01:
    - additional_senior_deduction
  # The enhanced deduction for seniors applies to tax years 2025 through 2028.
  2029-01-01: []
