description: The IRS subtracts these non-refundable credits, which are ordered after the Child Tax Credit, from the tax liability that limits the non-refundable Child Tax Credit when the filer completes Credit Limit Worksheet B.
values:
  # The adoption credit (Schedule 3, line 6c), mortgage interest credit
  # (line 6g) and District of Columbia first-time homebuyer credit (line 6h)
  # also belong here but are not modeled.
  2013-01-01:
    - residential_clean_energy_credit # Form 5695, line 15 (Schedule 3, line 5a from 2023)

