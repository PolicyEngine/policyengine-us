description: Non-refundable tax credits which precede the Energy Efficient Home Improvement Credit.
values:
  # Form 5695's Energy Efficient Home Improvement Credit Limit Worksheet (the
  # Nonbusiness Energy Property Credit Limit Worksheet before 2022) subtracts
  # the foreign tax, child and dependent care, elderly or disabled, education
  # and retirement savings credits, and Schedule 3 line 6l (Form 8978, not
  # modeled). Section 25D(c) orders the residential clean energy credit after
  # this credit.
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit

