description: The US sums these capped credits before applying the annual limit of the energy efficient home improvement tax credit.
values:
  # Before the Inflation Reduction Act, heat pumps are energy property inside
  # the overall limit.
  2006-01-01:
    - capped_energy_efficient_door_credit
    - capped_energy_efficient_insulation_credit
    - capped_energy_efficient_window_credit
    - capped_energy_efficient_roof_credit
    - capped_advanced_main_air_circulating_fan_credit
    - capped_qualified_furnace_or_hot_water_boiler_credit
    - capped_energy_efficient_central_air_conditioner_credit
    - capped_heat_pump_heat_pump_water_heater_biomass_stove_boiler_credit
  # Inflation Reduction Act removed roof and advanced main air circulating fan
  # credits and added audit credits. Heat pumps, heat pump water heaters, and
  # biomass stoves and boilers have their own $2,000 limit and are added after
  # the $1,200 limit (Form 5695 lines 27 to 30).
  2023-01-01:
    - capped_energy_efficient_door_credit
    - capped_energy_efficient_insulation_credit
    - capped_energy_efficient_window_credit
    - capped_qualified_furnace_or_hot_water_boiler_credit
    - capped_energy_efficient_central_air_conditioner_credit
    - capped_home_energy_audit_credit
