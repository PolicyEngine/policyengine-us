description: Non-refundable tax credits which precede the Used Clean Vehicle Credit.
values:
  # Form 8936 line 16 subtracts Schedule 3 lines 1 through 4 (foreign tax,
  # child and dependent care, education and retirement savings credits), 5b
  # (energy efficient home improvement credit), 6d (elderly or disabled
  # credit) and 6l (Form 8978, not modeled). It does not subtract line 6f, so
  # this credit precedes the new clean vehicle credit. Section 25D(c) orders
  # the residential clean energy credit after this credit.
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit

