description: Non-refundable tax credits which precede the New Clean Vehicle Credit.
values:
  # Form 8936 line 11 (line 21 before 2023) subtracts the foreign tax, child
  # and dependent care, education, retirement savings, energy efficient home
  # improvement and elderly or disabled credits, Schedule 3 line 6l (Form
  # 8978, not modeled) and, from 2023, the previously owned clean vehicle
  # credit (Schedule 3, line 6m). Section 25D(c) orders the residential clean
  # energy credit after this credit.
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
    - savers_credit
    - energy_efficient_home_improvement_credit
    - used_clean_vehicle_credit

