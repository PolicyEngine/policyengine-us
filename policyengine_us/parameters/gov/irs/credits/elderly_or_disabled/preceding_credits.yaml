description: Non-refundable tax credits which precede the Elderly or Disabled Credit.
values:
  # Schedule R's Credit Limit Worksheet subtracts only Schedule 3 lines 1
  # (foreign tax credit), 2 (child and dependent care credit) and 6l (Form
  # 8978, not modeled). The education, retirement savings, energy and clean
  # vehicle credits come after this credit.
  2013-01-01:
    - foreign_tax_credit
    - cdcc
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc

