description: Non-refundable tax credits which precede the Retirement Savings Credit.
values:
  # Form 8880's Credit Limit Worksheet subtracts Schedule 3 lines 1 through 3
  # (foreign tax, child and dependent care, and education credits), 6d
  # (elderly or disabled credit) and 6l (Form 8978, not modeled).
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
    - lifetime_learning_credit

