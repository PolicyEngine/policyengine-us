description: The IRA sums the following elements as qualified retirement savings contributions when computing the saver's credit.  
values:
  2018-01-01:
    - traditional_ira_contributions
    - roth_ira_contributions
    - traditional_401k_contributions
    - traditional_403b_contributions
    - roth_401k_contributions
    - roth_403b_contributions
    - self_employed_pension_contributions
    - able_contributions_person

  # Pub. L. 119-21 keeps ABLE contributions by the designated beneficiary
  # after 2025.
  2026-01-01:
    - traditional_ira_contributions
    - roth_ira_contributions
    - traditional_401k_contributions
    - traditional_403b_contributions
    - roth_401k_contributions
    - roth_403b_contributions
    - self_employed_pension_contributions
    - able_contributions_person
  # From 2027 the section 25B credit covers ABLE contributions only.
  2027-01-01:
    - able_contributions_person

metadata:
  unit: list
  period: year 
  label: Saver's Credit qualified retirement savings contributions
  reference:
