description: The IRS sums the following elements as qualified retirement savings contributions when computing the saver's credit.
values:
  2018-01-01:
    - traditional_ira_contributions
    - roth_ira_contributions
    - traditional_401k_contributions
    - traditional_403b_contributions
    - roth_401k_contributions
    - roth_403b_contributions
    - self_employed_pension_elective_deferrals
    - able_contributions_person

  2026-01-01:
    - traditional_ira_contributions
    - roth_ira_contributions
    - traditional_401k_contributions
    - traditional_403b_contributions
    - roth_401k_contributions
    - roth_403b_contributions
    - self_employed_pension_elective_deferrals

