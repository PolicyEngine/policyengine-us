description: IRS multiplies the qualified contributions by the following rate for joint filers under the Saver's Credit, based on adjusted gross income.
metadata:
  type: single_amount
  threshold_unit: currency-USD
  amount_unit: /1
  period: year
  label: Saver's Credit joint rate
  reference:
    - title: 2017 Form 8880
      href: https://www.irs.gov/pub/irs-prior/f8880--2017.pdf#page=1
    - title: "IRS Notice 2016-62 #page 2-3"
      href: https://www.irs.gov/pub/irs-drop/n-16-62.pdf#page=2
    - title: 26 U.S. Code § 25B(b)(1)
      href: https://www.law.cornell.edu/uscode/text/26/25B#b
    - title: IRS | Retirement Savings Contributions Credit (Saver's Credit)
      href: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-savings-contributions-savers-credit
    - title: Form 8880 - 2023 Credit for Qualified Retirement Savings Contributions
      href: https://www.irs.gov/pub/irs-pdf/f8880.pdf#page=1
    - title: 2018 Form 8880
      href: https://www.irs.gov/pub/irs-prior/f8880--2018.pdf#page=1
    - title: "IRS Notice 2018-83, 2019 retirement amounts #page 2-3"
      href: https://www.irs.gov/pub/irs-drop/n-18-83.pdf#page=2
    - title: "IRS Notice 2019-59, 2020 retirement amounts #page 2-3"
      href: https://www.irs.gov/pub/irs-drop/n-19-59.pdf#page=2
    - title: "IRS Notice 2020-79, 2021 retirement amounts #page 2-3"
      href: https://www.irs.gov/pub/irs-drop/n-20-79.pdf#page=2
    - title: IRS Notice 2021-61, 2022 retirement amounts
      href: https://www.irs.gov/pub/irs-drop/n-21-61.pdf#page=3
    - title: IRS Notice 2022-55, 2023 retirement amounts
      href: https://www.irs.gov/pub/irs-drop/n-22-55.pdf#page=3
    - title: IRS Notice 2023-75, 2024 Amounts Relating to Retirement Plans and IRAs (25B(b)(1)(A)-(D) joint amounts $46,000/$50,000/$76,500)
      href: https://www.irs.gov/pub/irs-drop/n-23-75.pdf#page=3
    - title: IRS Notice 2024-80, 2025 Amounts Relating to Retirement Plans and IRAs (25B(b)(1)(A)-(D) joint amounts $47,500/$51,000/$79,000)
      href: https://www.irs.gov/pub/irs-drop/n-24-80.pdf#page=3
    - title: IRS Notice 2025-67, 2026 Amounts Relating to Retirement Plans and IRAs (25B(b)(1)(A)-(D) joint amounts $48,500/$52,500/$80,500)
      href: https://www.irs.gov/pub/irs-drop/n-25-67.pdf#page=3

brackets:
  # Thresholds below are the published inclusive band tops; the formula uses
  # right=True so each reduced rate applies only above the preceding ceiling.
  # The first row of the Form 8880 line 9 table has no lower bound ("---"), so
  # a negative adjusted gross income takes the highest rate.
  - threshold:
      2017-01-01: -.inf
      2018-01-01: -.inf
    amount:
      2017-01-01: 0.5
      2018-01-01: 0.5
  - threshold:
      values:
        2017-01-01: 37_000
        2018-01-01: 38_000
        2019-01-01: 38_500
        2020-01-01: 39_000
        2021-01-01: 39_500
        2022-01-01: 41_000
        2023-01-01: 43_500
        2024-01-01: 46_000
        2025-01-01: 47_500
        2026-01-01: 48_500
    amount:
      2017-01-01: 0.2
      2018-01-01: 0.2
  - threshold:
      values:
        2017-01-01: 40_000
        2018-01-01: 41_000
        2019-01-01: 41_500
        2020-01-01: 42_500
        2021-01-01: 43_000
        2022-01-01: 44_000
        2023-01-01: 47_500
        2024-01-01: 50_000
        2025-01-01: 51_000
        2026-01-01: 52_500
    amount:
      2017-01-01: 0.1
      2018-01-01: 0.1
  - threshold:
      values:
        2017-01-01: 62_000
        2018-01-01: 63_000
        2019-01-01: 64_000
        2020-01-01: 65_000
        2021-01-01: 66_000
        2022-01-01: 68_000
        2023-01-01: 73_000
        2024-01-01: 76_500
        2025-01-01: 79_000
        2026-01-01: 80_500
    amount:
      2017-01-01: 0
      2018-01-01: 0
