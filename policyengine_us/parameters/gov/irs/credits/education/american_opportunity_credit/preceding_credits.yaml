description: Non-refundable tax credits which precede the American Opportunity Credit.
values:
  # Form 8863's Credit Limit Worksheet subtracts Schedule 3 lines 1 (foreign
  # tax credit), 2 (child and dependent care credit), 6d (elderly or disabled
  # credit) and 6l (Form 8978, not modeled).
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit

