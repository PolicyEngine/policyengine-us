description: Non-refundable tax credits which precede the Lifetime Learning Credit.
values:
  # Form 8863's Credit Limit Worksheet limits the non-refundable American
  # opportunity and lifetime learning credits together (lines 1 to 3) to tax
  # less Schedule 3 lines 1, 2, 6d and 6l. Applying the American opportunity
  # credit first gives the same total.
  2013-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
  # The Child and Dependent Care Credit was refundable for 2021 only.
  2021-01-01:
    - foreign_tax_credit
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit
  2022-01-01:
    - foreign_tax_credit
    - cdcc
    - elderly_disabled_credit
    - non_refundable_american_opportunity_credit

