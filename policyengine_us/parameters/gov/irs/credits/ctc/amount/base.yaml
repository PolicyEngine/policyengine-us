description: The IRS provides a maximum Child Tax Credit of this amount, depending on the child's age.

brackets:
  - threshold:
      values:
        2013-01-01: 0
    amount:
      values:
        2013-01-01: 1_000
        2018-01-01: 2_000
        2025-01-01: 2_200
        2027-01-01: 2_300
        2029-01-01: 2_400
        2031-01-01: 2_500
        2033-01-01: 2_600
        2035-01-01: 2_700
        # Rose to $3,000/$3,600 in 2021. See arpa.yaml.
      metadata:
        uprating:
          parameter: gov.irs.uprating
          # 26 U.S.C. 24(i)(2) and (3): the $2,200 in 24(h)(2), plus its 1(f)(3)
          # cost-of-living increase with calendar year 2024 as the base year,
          # rounded down to a multiple of $100. The index's 2025 value covers
          # calendar year 2024. Base mode adds values only after the last
          # value above. Like the standard deduction, this stays on
          # gov.irs.uprating, whose window ends in July (#9105; open #9621
          # moves it), not gov.irs.indexing.c_cpi_u, which the dependent
          # amounts and educator cap use. gov.irs.uprating runs 0.6% to 1.0%
          # below that index in 2028-2030 and about 1.0% below through 2037;
          # gov/irs/deductions/standard/amount.yaml explains the split.
          base:
            period: 2025
            value: 2_200
            floor: true
          rounding:
            type: downwards
            interval: 100
        reference:
          - title: 26 U.S. Code § 24(h)(2) - Child tax credit amount
            href: https://www.law.cornell.edu/uscode/text/26/24#h_2
          - title: 26 U.S. Code § 24(i)(2) - Inflation adjustment for credit amount
            href: https://www.law.cornell.edu/uscode/text/26/24#i_2
          - title: 2027 IRS data release
            href: https://www.irs.gov/pub/irs-drop/rp-26-35.pdf#page=8
          - title: 2026 IRS data release
            href: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=14
  - threshold:
      values:
        2013-01-01: 17
        2021-01-01: 18
        2022-01-01: 17
      metadata:
        reference:
        - title: 26 U.S. Code § 24(c)(1)
          href: https://www.law.cornell.edu/uscode/text/26/24#c_1
    amount:
      values:
        2013-01-01: 0
metadata:
  type: single_amount
  threshold_unit: year
  amount_unit: currency-USD
  amount_period: year
  label: Child Tax Credit amount
