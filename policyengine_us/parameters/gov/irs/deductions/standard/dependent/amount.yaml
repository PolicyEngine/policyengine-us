metadata:
  unit: currency-USD
  period: year
  label: Dependent standard deduction floor
  # Values after the CBO horizon are computed in
  # parameters/uprating_extensions.py per 26 U.S.C. 63(c)(4)(B)(i): the
  # statutory $500 increased by the 1(f)(3) cost-of-living adjustment with
  # calendar year 1987 as the base year, each increase rounded down to the
  # next lowest multiple of $50 under 1(f)(7)(A). Those values supersede
  # this uprating rule, which describes the index and rounding.
  uprating:
    parameter: gov.irs.uprating
    rounding:
      type: downwards
      interval: 50
  reference:
