description: The basic standard deduction of a filer who can be claimed as a dependent is limited to the greater of the floor or earned income plus this amount.
values:
  # 63(c)(5)(B)'s $250, indexed from its 1997 base year (63(c)(4)(B)(ii)).
  # The IRS printed $250 for 1998 (Rev. Proc. 97-57) and for each year from
  # 2000 to 2005 (Rev. Procs. 99-42 to 2004-71), and $300 for each year from
  # 2006 to 2012 (Rev. Procs. 2005-70 to 2011-52). The 1999 amount is
  # unchecked: Rev. Proc. 98-61's bulletin on irs.gov is a scanned image.
  1998-01-01: 250
  2006-01-01: 300
  2013-01-01: 350
  2022-01-01: 400
  2024-01-01: 450
  2025-01-01: 450
  2026-01-01: 450
  2027-01-01: 500
metadata:
  unit: currency-USD
  period: year
  label: Dependent standard deduction earned income addition
  uprating:
    # 26 U.S.C. 63(c)(4)(B)(ii): the statutory $250 plus its 1(f)(3)
    # cost-of-living increase with calendar year 1997 as the base year,
    # rounded down to a multiple of $50 under 1(f)(7)(A). The index's 1998
    # value covers calendar year 1997. Projecting from the $250 base rather
    # than chaining from a rounded published value keeps the projection
    # from lagging the statute by a $50 step.
    parameter: gov.irs.indexing.c_cpi_u
    base:
      period: 1998
      value: 250
      floor: true
    rounding:
      type: downwards
      interval: 50
