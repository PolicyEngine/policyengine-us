description: Threshold of taxable income (excluding QBID) after which the QBI deduction is phased out; only joint returns receive twice the amount for other filers.
metadata:
  unit: currency-USD
  period: year
  label: Qualified business income deduction phase-out start
  breakdown:
    - filing_status
  reference:
    - title: 26 U.S.C. § 199A(e)(2)
      href: https://www.law.cornell.edu/uscode/text/26/199A#e_2
      # Defines threshold amount for QBI deduction phase-out
    - title: 26 U.S.C. § 1(f)(7)
      href: https://www.law.cornell.edu/uscode/text/26/1#f_7
      # Rounding rules: $50 for general filers, $25 for married filing separately
    - title: 26 CFR § 1.199A-1(b)(12)
      href: https://www.ecfr.gov/current/title-26/part-1/section-1.199A-1#p-1.199A-1(b)(12)
    - title: 2026 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=22
    - title: 2025 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-24-40.pdf#page=15
    - title: 2024 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-23-34.pdf#page=15
    - title: 2023 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-22-38.pdf#page=17
    - title: 2022 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-21-45.pdf#page=17
    - title: 2021 IRS data releases
      href: https://www.irs.gov/pub/irs-drop/rp-20-45.pdf#page=16
    - title: 2020 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-19-44.pdf#page=16
    - title: 2019 IRS data release
      href: https://www.irs.gov/pub/irs-drop/rp-18-57.pdf#page=19
    - title: 2018 IRS Publication 535, Qualified Business Income Deduction
      href: https://www.irs.gov/pub/irs-prior/p535--2018.pdf#page=50
    - title: 2023 Instructions for Form 8995 (qualifying surviving spouse uses the single threshold)
      href: https://www.irs.gov/pub/irs-prior/i8995--2023.pdf#page=1
    - title: 2025 Instructions for Form 8995
      href: https://www.irs.gov/pub/irs-prior/i8995--2025.pdf#page=1
  propagate_metadata_to_children: true

HEAD_OF_HOUSEHOLD:
  metadata:
    uprating:
      parameter: gov.irs.uprating
      rounding:
        type: downwards
        interval: 50
  values:
    2013-01-01: 0
    2018-01-01: 157_500
    2019-01-01: 160_700
    2020-01-01: 163_300
    2021-01-01: 164_900
    2022-01-01: 170_050
    2023-01-01: 182_100
    2024-01-01: 191_950
    2025-01-01: 197_300
    2026-01-01: 201_750
