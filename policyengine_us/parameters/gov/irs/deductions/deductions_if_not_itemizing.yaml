description: Deductions from taxable income if not itemizing.
values:
  # The tips and overtime deductions (26 U.S.C. 224 and 225) are listed in every
  # year. Their own in_effect parameters zero them outside 2025-2028, so a reform
  # that switches them on in another year also reaches taxable income.
  # Tuition and fees are deducted above AGI, not again with the standard
  # deduction (2017 Form 1040 lines 34 and 40; 2018 Schedule 1 line 34).
  2017-01-01:
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction
  2018-01-01:
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction
  # The 2020 charitable deduction for non-itemizers is above the line
  # (charitable_contributions_ald). From 2021 it is taken from adjusted gross
  # income under 26 U.S.C. 170(p) and 63(b)(4).
  2020-01-01:
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction
  2021-01-01:
    - charitable_deduction_for_non_itemizers
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction
  2025-01-01:
    - charitable_deduction_for_non_itemizers
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction
    - additional_senior_deduction
    - auto_loan_interest_deduction
  2029-01-01:
    - charitable_deduction_for_non_itemizers
    - standard_deduction
    - qualified_business_income_deduction
    - tip_income_deduction
    - overtime_income_deduction

