metadata:
  type: single_amount
  threshold_unit: year
  amount_unit: currency-USD
  period: year
  label: Eligible long-term care premium limit
  # 26 U.S.C. 213(d)(10)(B) indexes these amounts by the medical care
  # component of the chained CPI-U for August of the preceding year,
  # rounding each increase to the nearest $10. Neither CBO nor CMS projects
  # that index, so years after the last published values use CBO's
  # projection of the CPI-U medical care component, by calendar year, as a
  # proxy (as long_term_health_insurance_premiums does).
  reference:
    - title: 26 U.S. Code § 213(d)(10) - Eligible long-term care premiums
      href: https://www.law.cornell.edu/uscode/text/26/213#d_10
    - title: Rev. Proc. 2012-41, section 3.11 (2013)
      href: https://www.irs.gov/irb/2012-45_IRB#RP-2012-41
    - title: Rev. Proc. 2013-35, section 3.24 (2014)
      href: https://www.irs.gov/pub/irs-drop/rp-13-35.pdf#page=16
    - title: Rev. Proc. 2014-61, section 3.25 (2015)
      href: https://www.irs.gov/pub/irs-drop/rp-14-61.pdf#page=16
    - title: Rev. Proc. 2015-53, section 3.25 (2016)
      href: https://www.irs.gov/pub/irs-drop/rp-15-53.pdf#page=17
    - title: Rev. Proc. 2016-55, section 3.26 (2017)
      href: https://www.irs.gov/pub/irs-drop/rp-16-55.pdf#page=19
    - title: Rev. Proc. 2017-58, section 3.26 (2018)
      href: https://www.irs.gov/pub/irs-drop/rp-17-58.pdf#page=17
    - title: Publication 502 (2018), Long-Term Care (2018 amounts after Rev. Proc. 2018-18)
      href: https://www.irs.gov/pub/irs-prior/p502--2018.pdf#page=11
    - title: Rev. Proc. 2018-57, section 3.28 (2019)
      href: https://www.irs.gov/pub/irs-drop/rp-18-57.pdf#page=19
    - title: Rev. Proc. 2019-44, section 3.28 (2020)
      href: https://www.irs.gov/pub/irs-drop/rp-19-44.pdf#page=16
    - title: Rev. Proc. 2020-45, section 3.28 (2021)
      href: https://www.irs.gov/pub/irs-drop/rp-20-45.pdf#page=17
    - title: Rev. Proc. 2021-45, section 3.28 (2022)
      href: https://www.irs.gov/pub/irs-drop/rp-21-45.pdf#page=17
    - title: Rev. Proc. 2022-38, section 3.28 (2023)
      href: https://www.irs.gov/pub/irs-drop/rp-22-38.pdf#page=17
    - title: Rev. Proc. 2023-34, section 3.28 (2024)
      href: https://www.irs.gov/pub/irs-drop/rp-23-34.pdf#page=16
