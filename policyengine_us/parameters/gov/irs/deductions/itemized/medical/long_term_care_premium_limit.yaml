description: The IRS limits the long-term care insurance premiums counted as medical care to this amount per insured person, based on the person's age at the close of the taxable year.
metadata:
  type: single_amount
  period: year
  threshold_unit: year
  amount_unit: currency-USD
  label: Eligible long-term care premium limit
  reference:
    - title: 26 U.S. Code § 213(d)(10)
      href: https://www.law.cornell.edu/uscode/text/26/213#d_10
    - title: Rev. Proc. 2020-45, eligible long-term care premiums (2021)
      href: https://www.irs.gov/pub/irs-drop/rp-20-45.pdf#page=17
    - title: "Rev. Proc. 2021-45, eligible long-term care premiums (2022) #page 17-18"
      href: https://www.irs.gov/pub/irs-drop/rp-21-45.pdf#page=17
    - title: Rev. Proc. 2022-38, eligible long-term care premiums (2023)
      href: https://www.irs.gov/pub/irs-drop/rp-22-38.pdf#page=17
    - title: Rev. Proc. 2023-34, eligible long-term care premiums (2024)
      href: https://www.irs.gov/pub/irs-drop/rp-23-34.pdf#page=16
    - title: "Rev. Proc. 2024-40, eligible long-term care premiums (2025) #page 15-16"
      href: https://www.irs.gov/pub/irs-drop/rp-24-40.pdf#page=15
    - title: Rev. Proc. 2025-32, eligible long-term care premiums (2026)
      href: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf#page=22
# The tables read "40 or less", "more than 40 but not more than 50", and so on,
# so thresholds are band tops: look the scale up with right=True.
brackets:
  - threshold:
      2021-01-01: -.inf
    amount:
      2021-01-01: 450
      2023-01-01: 480
      2024-01-01: 470
      2025-01-01: 480
      2026-01-01: 500
  - threshold:
      2021-01-01: 40
    amount:
      2021-01-01: 850
      2023-01-01: 890
      2024-01-01: 880
      2025-01-01: 900
      2026-01-01: 930
  - threshold:
      2021-01-01: 50
    amount:
      2021-01-01: 1_690
      2023-01-01: 1_790
      2024-01-01: 1_760
      2025-01-01: 1_800
      2026-01-01: 1_860
  - threshold:
