description: The IRS counts premiums for a qualified long-term care insurance contract as medical care up to this amount for each insured person, based on that person's age at the end of the year.
# Each threshold is the top of an age band: "40 or less", "more than 40 but
# not more than 50", and so on. Look ages up with right=True so an age equal
# to a threshold stays in the lower band.
