description: The IRS lists these base local general sales taxes, for a 1% local general sales tax rate, in its Optional Local Sales Tax Tables.
metadata:
  unit: currency-USD
  period: year
  breakdown:
  - local_sales_tax_table
  - range(1,7)
  - range(1,20)
  breakdown_labels:
  - Local table
  - Family size
  - Income bracket
  label: Optional local sales tax table
  # IRS values through 2025; later years are uprated from 2025, as for the
  # state table. The IRS built the 2025 tables from the 2024 tables by
  # adjusting "all values in every table using the rate of growth of total
  # state general sales and gross receipts tax revenues from 2024 to 2025
  # (adjusted for changes in population)" (2025 Optional State Sales Tax
  # Tables).
  uprating: gov.irs.uprating
  propagate_metadata_to_children: true
  reference:
    - title: 2022 Optional Local Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2022.pdf#page=17
    - title: 2023 Optional Local Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2023.pdf#page=17
    - title: 2024 Optional Local Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2024.pdf#page=17
    - title: 2025 Optional Local Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2025.pdf#page=18
# The 2024 and 2025 tables are captioned "(Based on a local sales tax rate of 1%)".
# The 2022 and 2023 tables carry no caption; there the per-1% basis follows
# from the worksheet, which multiplies these "base local general sales
# taxes" (line 2) by the local rate entered as a percentage number (line 3).
# Table D is transcribed as printed. The selector page notes "Local Table D
# is just 25% of the NY State table", but 27 of the printed 2025 Table D
# cells differ from 25% of the printed New York table, rounded half up, by
# up to 1.
