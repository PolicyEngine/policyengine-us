values:
  # 2015 worksheet, line 2: "Did you live in Alaska, Arizona, Arkansas,
  # Colorado, Georgia, Illinois, Louisiana, Mississippi, Missouri, New York,
  # North Carolina, South Carolina, Tennessee, Utah, or Virginia in 2015?"
  # The 2016 through 2022 worksheets list the same states, with only the year
  # changed. These are the states whose tables carry footnote 2, "Follow the
  # instructions on the next page to determine your local sales tax
  # deduction", plus Alaska, which has no state table.
  2015-01-01:
    - AK
    - AR
    - AZ
    - CO
    - GA
    - IL
    - LA
    - MO
    - MS
    - NC
    - NY
    - SC
    - TN
    - UT
    - VA
  # 2023 worksheet, line 2: "Did you live in Alabama, Alaska, Arizona,
  # Arkansas, Colorado, Georgia, Illinois, Kansas, Louisiana, Mississippi,
  # Missouri, New York, North Carolina, South Carolina, Tennessee, Utah, or
  # Virginia in 2023?" The 2024 and 2025 worksheets list the same states.
  2023-01-01:
    - AK
    - AL
    - AR
    - AZ
    - CO
    - GA
    - IL
    - KS
    - LA
    - MO
    - MS
    - NC
    - NY
    - SC
    - TN
    - UT
    - VA
