# Cities that the IRS selector names for this table, by 2020 Census place
# GEOID (state FIPS code and place code). The 2025 selector names the same
# localities with the same tables as the 2024 selector, so the 2024 value
# applies to 2025. A place's row takes precedence over its county's row.
# The 2017 lists are from the February 2018 revision at irs-prior; the
# original January 2018 printing has the same selector.
# Readings of the 2015-2021 selectors:
# - Bare city names that are also county names in the same state (Yuma,
#   Arizona; Boulder, Colorado; Champaign and Peoria, Illinois) are the
#   cities, as in 2022-2025: their rows list cities, and the selector names
#   counties as "... County" (it names "Boulder County" separately).
# - 2015, New York: "New York City or Norwich City" follows the "Counties:"
#   label of the Table A row; both are the cities.
# - 2015 and 2016, Colorado: "Denver City/Denver County" names both, so
#   Denver city is listed here and Denver County in county/a.yaml.
