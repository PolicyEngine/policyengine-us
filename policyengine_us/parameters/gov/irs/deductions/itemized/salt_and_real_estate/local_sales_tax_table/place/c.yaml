# Cities that the IRS selector names for this table, by 2020 Census place
# GEOID (state FIPS code and place code). The 2025 selector names the same
# localities with the same tables as the 2024 selector, so the 2024 value
# applies to 2025. A place's row takes precedence over its county's row.
# The 2017 lists are from the February 2018 revision at irs-prior; the
# original January 2018 printing has the same selector.
# Georgia: the selector's "Dekalb County (excluding Atlanta)" row (2021-2025)
# leaves Atlanta with the table of the state's other localities ("Any
# locality that imposes a local sales tax" in 2021, "Any other locality that
# imposes a local sales tax" in 2022), listed here for 2021-2023 and in
# place/b.yaml for 2024 and 2025.
