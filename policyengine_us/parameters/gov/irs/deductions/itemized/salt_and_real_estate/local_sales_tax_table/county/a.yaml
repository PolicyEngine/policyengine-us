# Counties (and Louisiana parishes and Alaska boroughs) that the IRS selector
# names for this table, by 2020 Census county FIPS code. The 2025 selector
# names the same localities with the same tables as the 2024 selector, so
# the 2024 value applies to 2025. A place named in another row takes
# precedence (place lists), as in "Dekalb County (excluding Atlanta)".
# New York City's five counties (Bronx, Kings, New York, Queens and
# Richmond) lie wholly within the city, which the selector names
# ("Cities: New York"), so they are listed as Table A counties.
