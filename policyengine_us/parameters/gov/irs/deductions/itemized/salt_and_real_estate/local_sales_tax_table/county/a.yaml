# Counties (and Louisiana parishes and Alaska boroughs) that the IRS selector
# names for this table, by 2020 Census county FIPS code. The 2025 selector
# names the same localities with the same tables as the 2024 selector, so
# the 2024 value applies to 2025. A place named in another row takes
# precedence (place lists), as in "Dekalb County (excluding Atlanta)".
# New York City's five counties (Bronx, Kings, New York, Queens and
# Richmond) lie wholly within the city, which the selector names
# ("Cities: New York"; in 2015 "New York City"), so they are listed as
# Table A counties.
# The 2017 lists are from the February 2018 revision at irs-prior; the
# original January 2018 printing has the same selector.
# Readings of the 2015-2021 selectors:
# - 2015 and 2016, Colorado: "Denver City/Denver County" names both, so
#   Denver County is listed here and Denver city in place/a.yaml.
# - 2018, New York: the Table A "Counties:" row names all 57 counties outside
#   New York City, and its "Cities:" row (place/a.yaml) New York City.
# - 2018, South Carolina: the Table A row prints a bare "Allendale" among
#   "Aiken County, ..., Andersonn County, Bamberg County, ..."; 28 of the
#   row's 29 other entries are counties, and 2017 and 2019-2022 print
#   "Allendale County". It is read as Allendale County, not the town.
# - Misprints are read as the evident county: "Andersonn County" (South
#   Carolina, 2017 and 2018) as Anderson County, "Yatess" (New York, 2018) as
#   Yates County, and the repeated "Columbia, Columbia" (New York, 2016) as
#   Columbia County once.
