values:
  # 2023 worksheet, the instruction after line 1; the 2018 through 2022, 2024,
  # and 2025 worksheets carry the same sentence with only the year changed:
  # "Next. If, for all of 2023, you lived only in Connecticut, the District of
  # Columbia, Indiana, Kentucky, Maine, Maryland, Massachusetts, Michigan, New
  # Jersey, or Rhode Island, skip lines 2 through 5, enter -0- on line 6, and
  # go to line 7. Otherwise, go to line 2."
  # Table footnote 4, carried by these ten jurisdictions and no others in 2018
  # through 2025:
  # "This state does not have a local general sales tax, so the amount in the
  # state table is the only amount to be deducted."
  2018-01-01:
    - CT
    - DC
    - IN
    - KY
    - MA
    - MD
    - ME
    - MI
    - NJ
    - RI
