description: The IRS has full-year residents of these jurisdictions enter no local general sales tax on the optional sales tax deduction worksheet.
metadata:
  unit: list
  period: year
  label: Jurisdictions without a local general sales tax for the optional sales tax deduction
  reference:
    - title: 2018 Instructions for Schedule A (Form 1040), State and Local General Sales Tax Deduction Worksheet, instruction after line 1
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2018.pdf#page=5
    - title: 2019 Instructions for Schedule A (Form 1040), State and Local General Sales Tax Deduction Worksheet, instruction after line 1
