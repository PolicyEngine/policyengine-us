# Worksheet line 4: "Enter your state general sales tax rate (shown in the
# table heading for your state), but omit the percentage sign." Table
# footnote 1: "Your state sales tax rate is provided next to the state name."
# Values are the printed heading rates (four decimals in 2015-2023, two in
# 2024 and 2025) divided by 100.
# The California and Nevada headings include uniform local rates, and their
# ratio denominators are the heading rates:
# - Footnote 3: "The California table includes the 1.25% uniform local sales
#   tax rate in addition to the 6.00% state sales tax rate for a total of
#   7.25%" (2017-2025). In 2015 and 2016 it reads "6.25%" and "7.50%", and
#   the line 3 instructions count only "the part of the combined rate that
#   is more than 7.5000%".
# - Footnote 5: "The Nevada table includes the 2.25% uniform local sales tax
#   rate in addition to the 4.6000% state sales tax rate for a total of
#   6.85%" (2015-2025; 2019-2021 print "4.60%").
# Averages for the year:
# - 2018 footnote 7 (District of Columbia): "The rate increased during 2018
#   so the given rate is an average for the year."
# - 2018 footnote 8 (Louisiana): "The rate decreased during 2018 so the given
#   rate is an average for the year."
# - 2019 footnote 7 (Utah): "The rate increased during 2019 so the given rate
#   is an average for the year."
# - 2023 footnote 7 (New Mexico, South Dakota): "The rate decreased during
#   2023 so the given rate is an average for the year."
# Some other headings are not round rates and carry no such footnote, for
# example Kansas 6.3264% (2015), Louisiana 4.7514% (2016), South Dakota
# 4.2923% (2016) and Utah 4.8130% (2020); they are transcribed as printed.
# The 2017 rates are from the February 2018 revision at irs-prior; the
# original January 2018 printing prints the same headings.
# Delaware, Montana, New Hampshire, Oregon, and the territories have no IRS
# state table and are left out, so they default to 0.
