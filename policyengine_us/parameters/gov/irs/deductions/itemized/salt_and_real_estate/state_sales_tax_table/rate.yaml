# Worksheet line 4: "Enter your state general sales tax rate (shown in the
# table heading for your state), but omit the percentage sign." Table
# footnote 1: "Your state sales tax rate is provided next to the state name."
# Values are the printed heading rates (four decimals in 2022 and 2023, two
# in 2024 and 2025) divided by 100.
# The California and Nevada headings (7.25% and 6.85%) include uniform local
# rates: "The California table includes the 1.25% uniform local sales tax
# rate in addition to the 6.00% state sales tax rate for a total of 7.25%"
# and "The Nevada table includes the 2.25% uniform local sales tax rate in
# addition to the 4.6000% state sales tax rate for a total of 6.85%" (table
# footnotes 3 and 5, 2022-2025); their ratio denominators are 7.25% and 6.85%.
# 2023 footnote 7 (New Mexico, South Dakota): "The rate decreased during
# 2023 so the given rate is an average for the year."
# Delaware, Montana, New Hampshire, Oregon, and the territories have no IRS
# state table and are left out, so they default to 0.
