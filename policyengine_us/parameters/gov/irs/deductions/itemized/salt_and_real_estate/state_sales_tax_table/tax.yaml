description: The IRS allows filers who do not log their state sales tax to enter these values instead for the state and local tax deduction.
metadata:
  unit: currency-USD
  period: year
  breakdown:
  - state_code
  - range(1,7)
  - range(1,20)
  breakdown_labels:
  - State
  - Family size
  - Income bracket
  label: Optional state sales tax table
  # IRS values through 2025; later years are uprated from 2025.
  uprating: gov.irs.uprating
  propagate_metadata_to_children: true
  # The IRS prints three states side by side, six family-size columns
  # each; values are transcribed per state from the IRS PDFs for each year.
  reference:
    - title: 2022 Optional State Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2022.pdf#page=13
    - title: 2023 Optional State Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2023.pdf#page=13
    - title: 2024 Optional State Sales Tax Tables, Instructions for Schedule A (Form 1040)
      href: https://www.irs.gov/pub/irs-prior/i1040sca--2024.pdf#page=12
