description: The IRS treats qualified mortgage insurance premiums as deductible qualified residence interest if this is true.
values:
  1900-01-01: false
  # Premiums paid or accrued after December 31, 2006, under contracts issued
  # after that date (P.L. 109-432, sec. 419).
  2007-01-01: true
  # 163(h)(3)(E)(iv): no deduction for amounts paid or accrued after
  # December 31, 2021.
  2022-01-01: false
  # P.L. 119-21, sec. 70108: 163(h)(3)(F)(i)(III) turns off clause (iv) for
  # taxable years beginning after December 31, 2025.
  2026-01-01: true
metadata:
  unit: bool
