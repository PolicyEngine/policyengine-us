description: The US excludes these deductions from the itemized deductions that the 80 percent ceiling on the itemized deductions limitation applies to, under the section 68 structure in effect before the One Big Beautiful Bill Act.
values:
  # Section 68(c) excludes the medical expense deduction (section 213), any
  # deduction for investment interest (section 163(d)), and casualty, theft
  # and wagering losses (section 165(c)(2), (c)(3) and (d)).
  # investment_interest_expense is the investment interest that
  # interest_deduction includes through non_mortgage_interest.
  # wagering_losses_deduction is deducted outside
  # total_itemized_taxable_income_deductions, so it never enters the base.
  # The 2017 worksheet also removes qualified disaster-relief contributions
  # (P.L. 115-63 sec. 504(a)(3), P.L. 115-123 sec. 20104(a)(3)), which are
  # not modeled.
  2009-01-01:
    - medical_expense_deduction
    - investment_interest_expense
    - casualty_loss_deduction
