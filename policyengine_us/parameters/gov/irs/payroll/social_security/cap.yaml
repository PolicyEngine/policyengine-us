  # Forecasts apply 42 U.S.C. 430(b) to the projected NAWI in
  # parameters/gov/ssa/nawi.yaml, which follows CBO's February 2026 CBB
  # growth from the published 2025 NAWI:
  # CBB(Y) = 60_600 * NAWI(Y-2) / 22_935.42, rounded to the nearest $300.
  # The levels sit above CBO's tp_ss_max_earnings (2036: 260_400 against
  # 258_600), because NAWI grows from SSA's published 2025 value; only CBO's
  # growth is used.
  2028-01-01: 199_200 # 60_600 * 75_428.91 / 22_935.42 = 199_298.38
