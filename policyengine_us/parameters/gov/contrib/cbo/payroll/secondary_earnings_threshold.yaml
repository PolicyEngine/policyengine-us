description: The US levies payroll taxes on earnings greater than this amount, in addition to earnings below the maximum taxable amount under current law. With a fixed $250,000 threshold, the model's current-law cap of $254,400 closes the donut in 2035, one year before the 2036 date projected in CBO's 2024 option.
