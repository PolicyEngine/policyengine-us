description: The premium tax credit cannot cover this much of a tax unit's enrolled marketplace premiums per month under this reform. It applies once per tax unit, so the credit is at most the enrolled premiums less this amount. The January 2026 CARE Act draft sets $5 for plan years 2026 through 2028; in_effect sets the years here.

values:
  0000-01-01: 5

