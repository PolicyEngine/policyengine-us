description: Additional income sources for CRFB surtax expanded base beyond IRS gross income.
values:
  2010-01-01:
    # CRFB's Break Glass plan (footnote 2) applies the surtax to "a broad
    # definition of income that includes Adjusted Gross Income (AGI) plus"
    # retirement contributions, HSA/MSA contributions, deductible student
    # loan interest, Social Security not counted toward AGI, tax-free bond
    # interest and employer-provided health insurance. It does not address
    # dependents. The base starts from the return's AGI, so person-level
    # sources are summed over the head and spouse only, the people whose AGI
    # it is; that attribution is inferred. Tax-unit-level sources describe
    # the head's and spouse's own return.
    # Retirement contributions (IRA, 401k, 403b)
    - traditional_ira_contributions
    - traditional_401k_contributions
    - traditional_403b_contributions
    # HSA contributions (no Archer MSA variable exists)
    - health_savings_account_ald
    # Deductible student loan interest
    - student_loan_interest_ald
    # Social Security not counted toward AGI
    - filer_tax_exempt_social_security
    # Foreign earnings exclusion (tax unit level, may need special handling)
    - foreign_earned_income_exclusion
    # Tax-free bond interest
    - tax_exempt_interest_income
    # Employer-provided health insurance (premiums)
    - health_insurance_premiums

metadata:
  unit: list
  period: year
  label: CRFB surtax expanded base additional sources
  reference:
    - title: "Committee for a Responsible Federal Budget, Break Glass: A Plan for the Next Economic Shock, footnote 2"
      href: https://www.crfb.org/papers/break-glass-plan-next-economic-shock
