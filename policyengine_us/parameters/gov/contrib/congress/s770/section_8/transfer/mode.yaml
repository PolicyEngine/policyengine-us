description: 'OASDI transfer convention: 0=custom, 1=combined_rate_share, 2=all_addon, 3=bill. Custom uses each incremental part share; combined_rate_share
  allocates the OASDI rate over each combined rate; all_addon sends every NII add-on point
  to OASDI and uses the active share; bill sends the bill share of the entire resulting
  section 1411 tax, including existing NIIT. This selects transfers, not full statutory
  category coverage.'
values:
  '0000-01-01': 0
