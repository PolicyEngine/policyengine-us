description: Lowest Cost Bronze Plan (LCBP) premiums by rating area, normalized to age 0.
metadata:

  period: month
  unit: currency-USD
  breakdown:
     - state_code
     - range(1, 68) #max rating areas +1
  breakdown_labels:
     - State
     - Rating area
  documentation: >-
    Values are derived from KFF ZIP and county premiums using representative ZIPs by rating
    area, normalized to age 0 with the state's gov.aca.age_curves curve. The 2026 values first
    published here held the age-21 premium; DC's and Massachusetts's matched no ZIP premium on
    that basis, so theirs are rebuilt from KFF's ZIP premiums. For NY and VT below is base adult
    premium. Rating areas and the choice of ZIPs follow the benchmark (second-lowest silver)
    table. Values start in 2026, and earlier years use the 2026 premium. Before 2026 the model
    places households by the earlier county map, so Idaho's and Washington's areas (renumbered in
    2026) and Massachusetts area 3 (no county from 2026) have a 2018 row with the 2026 premium of
    the earlier map's area.
  label: Lowest Cost Bronze Plan premiums by rating area
  propagate_metadata_to_children: true
  reference:
    - title: Subsidy Calculator archive - KFF
      href: https://www.kff.org/interactive/subsidy-calculator/
    - title: 2026 Calculator - ACA Enhanced Premium Tax Credit - KFF
      href: https://www.kff.org/interactive/calculator-aca-enhanced-premium-tax-credit/
    - title: Health Insurance Marketplace Calculator, 2027 premiums - KFF
      href: https://www.kff.org/interactive/subsidy-calculator/
    - title: CMS State Specific Geographic Rating Areas
      href: https://www.cms.gov/cciio/programs-and-initiatives/health-insurance-market-reforms/state-gra
    - title: CMS Market Rating Reforms State Specific Age Curve Variations
      href: https://www.cms.gov/cciio/programs-and-initiatives/health-insurance-market-reforms/downloads/statespecagecrv053117.pdf
