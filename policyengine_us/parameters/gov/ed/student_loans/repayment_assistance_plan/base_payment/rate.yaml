description: The Department of Education sets the base payment to this share of adjusted gross income under the Repayment Assistance Plan.
# The rate applies to the whole adjusted gross income, not the amount above the
# threshold. Each bracket covers income "more than" its threshold and "not more
# than" the next one, so the scale is evaluated with right=True. Income not more
# than the second threshold receives the flat low-income base payment instead.
# The brackets are fixed in statute and not indexed to inflation (91 FR 23860).
