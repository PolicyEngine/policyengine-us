description: The Department of Education amortizes loans over this number of years under the tiered standard repayment plan, based on the total outstanding principal of the borrower's Direct Loans, Parent PLUS loans included, when entering repayment.
# A balance "less than" a threshold falls in the tier below it; a balance
# "equal to or greater than" a threshold falls in the tier that starts there,
# which matches the default right=False evaluation of the scale.
brackets:
  - threshold:
      2026-07-01: 0
    amount:
      2026-07-01: 10
  - threshold:
      2026-07-01: 25_000
    amount:
      2026-07-01: 15
  - threshold:
      2026-07-01: 50_000
    amount:
      2026-07-01: 20
  - threshold:
      2026-07-01: 100_000
    amount:
      2026-07-01: 25

metadata:
