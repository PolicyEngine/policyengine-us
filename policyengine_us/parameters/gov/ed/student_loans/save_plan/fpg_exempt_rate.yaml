description: The Department of Education exempts income up to this multiple of the federal poverty guideline from discretionary income under the Saving on a Valuable Education plan.
# The Revised Pay As You Earn (REPAYE) plan exempted 150 percent. The 2023 rule
# renamed it the Saving on a Valuable Education (SAVE) plan and raised the
# exemption to 225 percent, which the Department implemented early on July 30,
# 2023 (88 FR 43821). Courts have blocked the SAVE plan; this parameter records
# the codified rule for counterfactual analysis.
values:
  2016-07-01: 1.5
  2023-07-30: 2.25

