description: The Department of Education limits annual payments to this share of discretionary income under the Saving on a Valuable Education plan, weighted by the share of the borrower's original loan balance received for undergraduate study.
# The 5 percent rate took effect July 1, 2024 (88 FR 43820); before that, all
# loans were charged the REPAYE plan's 10 percent.
values:
  2016-07-01: 0.1
  2024-07-01: 0.05

