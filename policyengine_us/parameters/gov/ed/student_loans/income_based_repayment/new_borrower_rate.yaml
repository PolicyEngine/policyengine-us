description: The Department of Education limits annual payments to this share of discretionary income under the Income-Based Repayment plan, for new borrowers.
# A new borrower had no outstanding Direct Loan or FFEL balance when they
# borrowed on or after July 1, 2014, and has no loan made on or after July 1,
# 2026 (34 CFR 685.209(b)(13)(ii)).
values:
  2014-07-01: 0.1

