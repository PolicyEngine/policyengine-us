description: The Department of Education multiplies the 12-year fixed payment by this income percentage factor, by adjusted gross income, for single borrowers under the Income-Contingent Repayment plan.
# Attachment 1 of the Department's annual notice lists each factor at an
# adjusted gross income. The notice applies from July 1 to June 30 of the
# following year. Incomes between two rows are linearly interpolated, and the
# factor is rounded to the nearest hundredth of a percent (Interpolation
# section of the notice). The formula reads these rows as points, not as a step
# function, and holds the first and last factors flat outside the table.
