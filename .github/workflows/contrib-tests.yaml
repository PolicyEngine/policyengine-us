name: Contrib tests
on:
  workflow_call:
# Group the existing matrix in the Actions view without adding runners.
# The guarded PR workflow is the only caller.
jobs:
  Contrib:
    name: Full Suite - Contrib (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Two or three groups in sequence: historical medians 47-74 minutes per
    # runner.
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four runners, grouped by name, run their groups one after another.
          - group: states-shard-1 + states-shard-2
            group1: states-shard-1
            target1: test-yaml-structural-heavy-shard-1
            group2: states-shard-2
            target2: test-yaml-structural-heavy-shard-2
          - group: states-shard-3 + states-shard-4
            group1: states-shard-3
            target1: test-yaml-structural-heavy-shard-3
            group2: states-shard-4
            target2: test-yaml-structural-heavy-shard-4
          - group: other-shard-1 + other-shard-2a
            group1: other-shard-1
            target1: test-yaml-structural-other
            group2: other-shard-2a
            target2: test-yaml-structural-other-shard-2a
          - group: other-shard-2b + other-shard-3 + congress
            group1: other-shard-2b
            target1: test-yaml-structural-other-shard-2b
            group2: other-shard-3
            target2: test-yaml-structural-other-shard-3
            group3: congress
            target3: test-yaml-structural-congress
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Contrib YAML tests (${{ matrix.group1 }})
        run: uv run --no-sync make ${{ matrix.target1 }}
      - name: Run Contrib Python tests
        if: ${{ matrix.group1 == 'other-shard-1' }}
        run: uv run --no-sync make test-policy-contrib-python
      # Later groups still run after an earlier group fails, but not after
      # the run is cancelled.
      - name: Run Contrib YAML tests (${{ matrix.group2 }})
        if: ${{ !cancelled() && matrix.target2 }}
        run: uv run --no-sync make ${{ matrix.target2 }}
      - name: Run Contrib YAML tests (${{ matrix.group3 }})
        if: ${{ !cancelled() && matrix.target3 }}
        run: uv run --no-sync make ${{ matrix.target3 }}
