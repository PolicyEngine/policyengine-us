name: Python tests
on:
  workflow_call:
# Two sequential Rest runners keep each shard below its timeout.
# Shard 1 includes variables; shard 2 also supplies the legacy summary check.
# Only the guarded PR workflow calls this file; it has no automatic triggers.
jobs:
  RestPython:
    name: Full Suite - Rest (Python, shard-1 + variables)
    runs-on: ubuntu-latest
    # Historical group times, including variables: 33-46 minutes plus setup.
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: 1
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      VECLIB_MAXIMUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each group remains a separate, sequential process on its runner.
      # SPM simulation/API contracts stay in the Microsimulation job.
      - name: Run remaining Python tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
        run: uv run --no-sync make test-other-python-rest REST_PYTHON_SHARD=1 REST_REPORT_DIR=.
      - name: Upload Rest Python timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-python-test-timings-shard-1
          path: |
            rest-python-*.xml
            rest-python-*-resources.txt
      - name: Run tests/variables YAML tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 --junitxml=rest-variables.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o rest-variables-resources.txt uv run --no-sync make test-yaml-variables
      - name: Upload Rest variables timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-variables-test-timings
          path: |
            rest-variables.xml
            rest-variables-resources.txt
  Rest:
    needs: [RestPython]
    # Runs after a shard-1 failure but stops when the run is cancelled.
    # always() kept this runner alive after cancellation.
    if: ${{ !cancelled() }}
    name: Full Suite - Rest (Python + variables)
    runs-on: ubuntu-latest
    # Historical group times: 32-46 minutes plus setup.
    # This runner also retains the legacy summary check, keeping PRs at 27 runners.
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: 1
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      VECLIB_MAXIMUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each group remains a separate, sequential process on its runner.
      # SPM simulation/API contracts stay in the Microsimulation job.
      - name: Run remaining Python tests
        id: python_tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
        run: uv run --no-sync make test-other-python-rest REST_PYTHON_SHARD=2 REST_REPORT_DIR=.
      - name: Upload Rest Python timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-python-test-timings-shard-2
          path: |
            rest-python-*.xml
            rest-python-*-resources.txt
      - name: Check all Rest jobs succeeded
        if: always()
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.RestPython.result }}
          SHARD_RESULT: ${{ steps.python_tests.outcome }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Rest shards did not all succeed: shard-1=$PYTHON_RESULT, shard-2=$SHARD_RESULT"
            exit 1
          fi
  Microsimulation:
    name: Full Suite - Microsimulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Keep simulation/API and dataset compatibility on this existing runner.
      # Use separate, sequential processes: combining these suites in one
      # pytest process previously accumulated enough memory to kill the runner.
      - name: Run SPM Python tests
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-spm.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-spm-resources.txt uv run --no-sync make test-other-python-spm
      - name: Run microsimulation tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-microsimulation.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-microsimulation-resources.txt uv run --no-sync make test-microsimulation
      - name: Upload simulation timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-timings
          path: |
            simulation-*.xml
            simulation-*-resources.txt
