name: Pull request
on:
  pull_request:
    branches: [main]
    # Draft PRs skip CI; marking a PR ready runs the full suite. Converting a
    # PR back to draft starts a run whose jobs all skip, which cancels any
    # in-progress run through the concurrency group below.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
# Concurrency: auto-cancels previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ReleaseLock:
    name: PR validation (lock, guard tests, lint, changelog)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      # Keep collecting independent results after a failure; failed steps
      # still fail the job, and cancellation stops the remaining checks.
      - name: Check committed registry lock
        run: python .github/release_lock.py --committed
      - name: Rehearse the release version refresh
        if: ${{ !cancelled() }}
        run: python .github/release_lock.py --rehearse
      - name: Test guard without importing the country model
        if: ${{ !cancelled() }}
        env:
          RELEASE_LOCK_REAL_UV: "1"
        run: python -m unittest discover -s .github/tests -p 'test_release_*.py' -v
      - name: Install lint dependencies
        if: ${{ !cancelled() }}
        id: lint-install
        run: uv sync --locked --extra dev
      - name: Check formatting
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .
      - name: Check changed changelog fragments
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          valid_count=0
          invalid=0

          while IFS= read -r fragment; do
            if [ "$fragment" = "changelog.d/.gitkeep" ]; then
              continue
            fi

            if [[ "$fragment" =~ ^changelog\.d/[^/]+\.(breaking|added|changed|fixed|removed)\.md$ ]]; then
              valid_count=$((valid_count + 1))
            else
              echo "::error file=${fragment}::Invalid changelog fragment path. Use changelog.d/<name>.<type>.md, where <type> is one of: breaking, added, changed, fixed, removed."
              invalid=1
            fi
          done < <(
            git diff --name-only --diff-filter=ACMR \
              HEAD^1 \
              HEAD \
              -- changelog.d
          )

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

          if [ "$valid_count" -eq 0 ]; then
            echo "::error::No valid changelog fragment found. Add one like: changelog.d/${PR_HEAD_REF}.fixed.md"
            exit 1
          fi
      - name: Validate changelog.d tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          # Tree-state guard: fragments at invalid paths (type subdirectories,
          # missing .<type>. suffix) are silently ignored by towncrier and
          # bump_version.py, so their entries never reach CHANGELOG.md (#9149).
          # The changed-files check above only sees files touched by the PR;
          # this step keeps the whole tree clean so strays cannot accumulate.
          invalid=0
          while IFS= read -r f; do
            if [ "$f" = "changelog.d/.gitkeep" ]; then
              continue
            fi
            if [[ ! "$f" =~ ^changelog\.d/[^/]+\.(breaking|added|changed|fixed|removed)\.md$ ]]; then
              echo "::error file=${f}::Fragment at an invalid path (towncrier will ignore it). Use changelog.d/<name>.<type>.md at the top level; no type subdirectories."
              invalid=1
            fi
          done < <(git ls-files -- changelog.d)

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi
  PackageCompatibility:
    name: Package and compatibility
    needs: ReleaseLock
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      # Load actions from the tested merge commit. Each area uses its own
      # checkout and environment; wheels still build the reviewed PR head.
      - uses: actions/checkout@v6
      - name: Set up wheel Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Build and retain rc1 wheel
        uses: ./.github/actions/candidate-wheel
        with:
          kind: rc1
      - name: Build and retain final wheel
        if: ${{ !cancelled() }}
        uses: ./.github/actions/candidate-wheel
        with:
          kind: final
      - name: Validate bundle metadata contract
        if: ${{ !cancelled() }}
        uses: ./.github/actions/bundle-metadata
      # Keep running independent checks after a failure, and stop on cancel.
      # Each version resolves its own lock and installs into its own .venv.
      - name: Python 3.11
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-compat
        with:
          python-version: "3.11"
      - name: Python 3.12
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-compat
        with:
          python-version: "3.12"
      - name: Python 3.13
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-compat
        with:
          python-version: "3.13"
      - name: Python 3.14
        if: ${{ !cancelled() }}
        uses: ./.github/actions/python-compat
        with:
          python-version: "3.14"
  Quick-Feedback:
    needs: ReleaseLock
    name: Quick Feedback (Selective Tests + Coverage)
    runs-on: ubuntu-latest
    env:
      SELECTIVE_TEST_MAX_TARGETS: 25
      # 100 (was 250): selective runs pack every matched yaml into ONE
      # policyengine-core subprocess, and ~250 yaml files retained ~15 GB
      # and OOM'd the 16 GB runner on run 28698452678. When the limit is
      # exceeded run_selective_tests.py safely narrows to directly changed
      # test files (or skips, deferring to the full suite jobs).
      SELECTIVE_TEST_MAX_FILES: 100
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1000
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: ./update_itemization.sh
      - name: Run selective tests based on changed files
        env:
          PYTHONUNBUFFERED: 1
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Running selective tests based on changed files..."
          uv run --no-sync python policyengine_us/tests/run_selective_tests.py --base-branch ${{ github.base_ref }} --coverage
      - name: Generate coverage report
        id: coverage
        if: always()
        run: |
          echo "📊 Coverage Report"
          echo "=================="
          # Show files below 100% coverage (won't fail CI)
          uv run --no-sync coverage report --fail-under=0 --skip-covered --skip-empty || echo "No coverage data available."

          # Count files below 100%
          TOTAL_FILES=$(uv run --no-sync coverage report --skip-covered --skip-empty 2>/dev/null | grep -E "^[a-zA-Z].*\.py " | wc -l || echo "0")

          if [ "$TOTAL_FILES" -gt "0" ]; then
            echo ""
            echo "⚠️  $TOTAL_FILES file(s) have less than 100% coverage"
            echo "Consider adding tests to improve coverage."
          else
            echo ""
            echo "✅ All files have 100% coverage!"
          fi

          # Generate XML for Codecov
          uv run --no-sync coverage xml || echo "No coverage data to generate XML report."
          # Expose whether we have coverage for later steps
          if [ -f coverage.xml ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload coverage to Codecov
        if: ${{ always() && steps.coverage.outputs.has_coverage == 'true' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
  Baseline:
    name: Baseline tests
    needs: ReleaseLock
    uses: ./.github/workflows/baseline-tests.yaml
  HouseholdAPIPartners:
    needs: ReleaseLock
    name: Household API Partners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Household API Partners YAML tests
        run: uv run --no-sync make test-yaml-no-structural-other-partners
  Contrib:
    name: Contrib tests
    needs: ReleaseLock
    uses: ./.github/workflows/contrib-tests.yaml
  PythonTests:
    name: Python tests
    needs: ReleaseLock
    uses: ./.github/workflows/python-tests.yaml
