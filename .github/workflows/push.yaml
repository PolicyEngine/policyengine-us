name: Push
on:
  push:
    branches: [main]

jobs:
  ReleaseLock:
    name: Check committed registry lock
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock
        run: python .github/release_lock.py --committed
  ReleaseLockTests:
    name: Release lock guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Test guard without importing the country model
        env:
          RELEASE_LOCK_REAL_UV: "1"
        run: python -m unittest discover -s .github/tests -p test_release_lock.py -v
  Lint:
    needs: ReleaseLock
    runs-on: ubuntu-latest
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
  versioning:
    needs: ReleaseLockTests
    name: Update versioning
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && !(github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Check committed registry lock before bump
        run: python .github/release_lock.py --committed
      - name: Bump version once
        run: python .github/bump_version.py
      - name: Build changelog with isolated registry tooling
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          env = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith(("UV_", "PIP_"))
          }
          subprocess.run(
              [
                  "uv", "--no-config", "tool", "run", "--isolated",
                  "--no-env-file", "--no-sources",
                  "--default-index", "https://pypi.org/simple",
                  "--python", sys.executable,
                  "towncrier", "build", "--yes", "--version", version,
              ],
              env=env,
              check=True,
          )
          PYTHON
      - name: Refresh and check release version in registry lock
        run: python .github/release_lock.py --refresh
      - name: Update changelog
        uses: EndBug/add-and-commit@v10
        with:
          add: "pyproject.toml uv.lock CHANGELOG.md changelog.d"
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine US
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false
  Baseline:
    needs: ReleaseLock
    name: Full Suite - Baseline (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 16 batches / 4 shards / --workers 1: the 8-batch 2-wide shards
          # OOM'd on run 28698452678; see the Makefile memory-layout notes.
          - group: states-shard-1
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --batches 16 --workers 1 --shard 1/4
          - group: states-shard-2
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --batches 16 --workers 1 --shard 2/4
          - group: states-shard-3
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --batches 16 --workers 1 --shard 3/4
          - group: states-shard-4
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --batches 16 --workers 1 --shard 4/4
          - group: irs
            cmd: make test-yaml-no-structural-other-irs
          - group: household
            cmd: make test-yaml-no-structural-other-household
          - group: ssa-usda
            cmd: make test-yaml-no-structural-other-ssa-usda
          - group: rest-a
            cmd: make test-yaml-no-structural-other-rest-a
          - group: rest-b
            cmd: make test-yaml-no-structural-other-rest-b
          - group: contrib-hhs
            cmd: make test-yaml-contrib-hhs
          - group: reform
            cmd: make test-yaml-reform
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Baseline YAML tests (${{ matrix.group }})
        run: uv run --no-sync ${{ matrix.cmd }}
  HouseholdAPIPartners:
    needs: ReleaseLock
    name: Household API Partners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Household API Partners YAML tests
        run: uv run --no-sync make test-yaml-no-structural-other-partners
  Contrib:
    needs: ReleaseLock
    name: Full Suite - Contrib (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: states-shard-1
            target: test-yaml-structural-heavy-shard-1
          - group: states-shard-2
            target: test-yaml-structural-heavy-shard-2
          - group: states-shard-3
            target: test-yaml-structural-heavy-shard-3
          - group: states-shard-4
            target: test-yaml-structural-heavy-shard-4
          - group: other-shard-1
            target: test-yaml-structural-other
          - group: other-shard-2a
            target: test-yaml-structural-other-shard-2a
          - group: other-shard-2b
            target: test-yaml-structural-other-shard-2b
          - group: other-shard-3
            target: test-yaml-structural-other-shard-3
          - group: congress
            target: test-yaml-structural-congress
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Contrib YAML tests (${{ matrix.group }})
        run: uv run --no-sync make ${{ matrix.target }}
      - name: Run Contrib Python tests
        if: ${{ matrix.group == 'other-shard-1' }}
        run: uv run --no-sync make test-policy-contrib-python
  Rest:
    needs: ReleaseLock
    name: Full Suite - Rest (Python + variables)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Python tests (code_health, core, utilities, top-level)
        run: uv run --no-sync make test-other-python
      - name: Run tests/variables YAML tests
        if: always()
        run: uv run --no-sync make test-yaml-variables
  Microsimulation:
    needs: ReleaseLock
    name: Full Suite - Microsimulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Split out of the Rest job: the combined single-process pytest run
      # was OOM-killed at ~94% on run 28698452678 once microsimulation
      # peaks stacked on the accumulated python-test RSS.
      - name: Run microsimulation tests
        run: uv run --no-sync make test-microsimulation
  Publish:
    runs-on: ubuntu-latest
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    needs: [ReleaseLock, ReleaseLockTests, Baseline, HouseholdAPIPartners, Contrib, Rest, Microsimulation]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock before publication
        run: python .github/release_lock.py --committed
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Build package
        run: uv run --no-sync make
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
          skip-existing: true
