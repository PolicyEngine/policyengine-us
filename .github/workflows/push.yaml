name: Push
on:
  push:
    branches: [main]

jobs:
  ReleaseLock:
    name: Check committed registry lock
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: 29 runs, max 0.4 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock
        run: python .github/release_lock.py --committed
  ReleaseLockTests:
    name: Release lock guard tests
    runs-on: ubuntu-latest
    # Oct 6-8: 104 successful runs, max 1.4 min; one hung run failed at 45 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Test guard without importing the country model
        env:
          RELEASE_LOCK_REAL_UV: "1"
        run: python -m unittest discover -s .github/tests -p 'test_release_*.py' -v
  Lint:
    needs: ReleaseLock
    runs-on: ubuntu-latest
    # Oct 6-8: 28 runs, max 0.7 min.
    timeout-minutes: 10
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
  versioning:
    needs: ReleaseLockTests
    name: Update versioning
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && !(github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: successful runs max 4.5 min, any run max 12 min.
    timeout-minutes: 20
    steps:
      # When several PRs merge before this job gets a runner, only the newest
      # merge can push a version bump: the others would commit on a stale
      # parent and fail on push. The newest merge's job consumes every pending
      # changelog fragment (towncrier builds all of changelog.d), so an older
      # job has nothing left to do. It skips only when GitHub's compare API
      # says main is strictly ahead of this commit (status "ahead": this
      # commit is an ancestor of main and main has more). Any other answer
      # (identical, behind, diverged) or a failed lookup runs versioning as
      # before, so a stale read can never suppress the newest merge's bump.
      - name: Skip if main already contains this commit and more
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status); then
            echo "::warning::Could not compare this commit with main; running versioning anyway."
            status=unknown
          fi
          if [ "$status" = "ahead" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versioning superseded::main already contains ${GITHUB_SHA} and newer commits. The versioning job for main's newest merge bumps the version once with every pending changelog fragment, including this commit's. If that job fails, re-run it."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub App token
        if: steps.head.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        if: steps.head.outputs.current == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install uv
        if: steps.head.outputs.current == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Check committed registry lock before bump
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --committed
      - name: Bump version once
        if: steps.head.outputs.current == 'true'
        run: python .github/bump_version.py
      - name: Build changelog with isolated registry tooling
        if: steps.head.outputs.current == 'true'
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          env = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith(("UV_", "PIP_"))
          }
          subprocess.run(
              [
                  "uv", "--no-config", "tool", "run", "--isolated",
                  "--no-env-file", "--no-sources",
                  "--default-index", "https://pypi.org/simple",
                  "--python", sys.executable,
                  "towncrier", "build", "--yes", "--version", version,
              ],
              env=env,
              check=True,
          )
          PYTHON
      - name: Refresh and check release version in registry lock
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --refresh
      - name: Update changelog
        if: steps.head.outputs.current == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: "pyproject.toml uv.lock CHANGELOG.md changelog.d"
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine US
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false
  Baseline:
    needs: ReleaseLock
    name: Full Suite - Baseline (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          # One state per subprocess; retain four runners and one worker each.
          # The former NY/OH/OK process peaked at 15.1 GB (run 36930199045).
          - group: states-shard-1
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 1/4
          - group: states-shard-2
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 2/4
          - group: states-shard-3
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 3/4
          - group: states-shard-4
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 4/4
          - group: irs
            cmd: make test-yaml-no-structural-other-irs
          - group: household
            cmd: make test-yaml-no-structural-other-household
          - group: ssa-usda
            cmd: make test-yaml-no-structural-other-ssa-usda
          - group: rest-a
            cmd: make test-yaml-no-structural-other-rest-a
          - group: rest-b
            cmd: make test-yaml-no-structural-other-rest-b
          - group: contrib-hhs
            cmd: make test-yaml-contrib-hhs
          - group: reform
            cmd: make test-yaml-reform
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Baseline YAML tests (${{ matrix.group }})
        run: uv run --no-sync ${{ matrix.cmd }}
  HouseholdAPIPartners:
    needs: ReleaseLock
    name: Household API Partners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Household API Partners YAML tests
        run: uv run --no-sync make test-yaml-no-structural-other-partners
  Contrib:
    needs: ReleaseLock
    name: Full Suite - Contrib (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: states-shard-1
            target: test-yaml-structural-heavy-shard-1
          - group: states-shard-2
            target: test-yaml-structural-heavy-shard-2
          - group: states-shard-3
            target: test-yaml-structural-heavy-shard-3
          - group: states-shard-4
            target: test-yaml-structural-heavy-shard-4
          - group: other-shard-1
            target: test-yaml-structural-other
          - group: other-shard-2a
            target: test-yaml-structural-other-shard-2a
          - group: other-shard-2b
            target: test-yaml-structural-other-shard-2b
          - group: other-shard-3
            target: test-yaml-structural-other-shard-3
          - group: congress
            target: test-yaml-structural-congress
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Contrib YAML tests (${{ matrix.group }})
        run: uv run --no-sync make ${{ matrix.target }}
      - name: Run Contrib Python tests
        if: ${{ matrix.group == 'other-shard-1' }}
        run: uv run --no-sync make test-policy-contrib-python
  Rest:
    needs: ReleaseLock
    name: Full Suite - Rest (Python + variables)
    runs-on: ubuntu-latest
    # Matches the PR Rest job (python-tests.yaml, raised to 90 in #9785).
    # Oct 6-8 on push: p50 51 min, max success 58.8 min, and one run hit the
    # old 60-minute limit (37719726248), which skipped that version's Publish.
    timeout-minutes: 90
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each Rest group runs in a separate process to release its heap.
      # SPM simulation/API contracts run in the Microsimulation job instead.
      - name: Run remaining Python tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
        run: uv run --no-sync make test-other-python-rest REST_REPORT_DIR=.
      - name: Run tests/variables YAML tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 --junitxml=rest-variables.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o rest-variables-resources.txt uv run --no-sync make test-yaml-variables
      - name: Upload Rest timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-test-timings
          path: |
            rest-python-*.xml
            rest-variables.xml
            rest-python-*-resources.txt
            rest-variables-resources.txt
  Microsimulation:
    needs: ReleaseLock
    name: Full Suite - Microsimulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Keep simulation/API and dataset compatibility on this existing runner.
      # Use separate, sequential processes: combining these suites in one
      # pytest process previously accumulated enough memory to kill the runner.
      - name: Run SPM Python tests
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-spm.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-spm-resources.txt uv run --no-sync make test-other-python-spm
      - name: Run microsimulation tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-microsimulation.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-microsimulation-resources.txt uv run --no-sync make test-microsimulation
      - name: Upload simulation timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-timings
          path: |
            simulation-*.xml
            simulation-*-resources.txt
  Publish:
    runs-on: ubuntu-24.04
    # Oct 6-8: 25 runs, max 1.3 min.
    timeout-minutes: 20
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    needs: [ReleaseLock, ReleaseLockTests, Baseline, HouseholdAPIPartners, Contrib, Rest, Microsimulation]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock before publication
        run: python .github/release_lock.py --committed
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Build package
        run: uv run --no-sync make
      - name: Record and verify release build
        run: uv run --no-sync python .github/release_build.py
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
          skip-existing: true
