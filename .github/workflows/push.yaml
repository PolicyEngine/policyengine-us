name: Push
on:
  push:
    branches: [main]

jobs:
  ReleaseLock:
    name: Check committed registry lock
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: 29 runs, max 0.4 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Check committed registry lock
        run: python .github/release_lock.py --committed
  ReleaseLockTests:
    name: Release lock guard tests
    runs-on: ubuntu-latest
    # Oct 6-8: 104 successful runs, max 1.4 min; one hung run failed at 45 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Test guard without importing the country model
        env:
          RELEASE_LOCK_REAL_UV: "1"
        run: python -m unittest discover -s .github/tests -p 'test_release_*.py' -v
  Lint:
    needs: ReleaseLock
    runs-on: ubuntu-latest
    # Oct 6-8: 28 runs, max 0.7 min.
    timeout-minutes: 10
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Test system certificate trust guard
        run: uv run --no-sync python -m unittest discover -s .github/tests -p test_system_ca.py -v
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
  versioning:
    needs: ReleaseLockTests
    name: Update versioning
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && !(github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: successful runs max 4.5 min, any run max 12 min.
    timeout-minutes: 20
    steps:
      # When several PRs merge before this job gets a runner, only the newest
      # merge can push a version bump: the others would commit on a stale
      # parent and fail on push. The newest merge's job consumes every pending
      # changelog fragment (towncrier builds all of changelog.d), so an older
      # job has nothing left to do. It skips only when GitHub's compare API
      # says main is strictly ahead of this commit (status "ahead": this
      # commit is an ancestor of main and main has more). Any other answer
      # (identical, behind, diverged) or a failed lookup runs versioning as
      # before, so a stale read can never suppress the newest merge's bump.
      - name: Skip if main already contains this commit and more
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status); then
            echo "::warning::Could not compare this commit with main; running versioning anyway."
            status=unknown
          fi
          if [ "$status" = "ahead" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versioning superseded::main already contains ${GITHUB_SHA} and newer commits. The versioning job for main's newest merge bumps the version once with every pending changelog fragment, including this commit's. If that job fails, re-run it."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub App token
        if: steps.head.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        if: steps.head.outputs.current == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install uv
        if: steps.head.outputs.current == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Set up Python
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Check committed registry lock before bump
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --committed
      - name: Bump version once
        if: steps.head.outputs.current == 'true'
        run: python .github/bump_version.py
      - name: Build changelog with isolated registry tooling
        if: steps.head.outputs.current == 'true'
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          env = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith(("UV_", "PIP_"))
          }
          subprocess.run(
              [
                  "uv", "--no-config", "tool", "run", "--isolated",
                  "--no-env-file", "--no-sources",
                  "--default-index", "https://pypi.org/simple",
                  "--python", sys.executable,
                  "towncrier", "build", "--yes", "--version", version,
              ],
              env=env,
              check=True,
          )
          PYTHON
      - name: Refresh and check release version in registry lock
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --refresh
      - name: Update changelog
        if: steps.head.outputs.current == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: "pyproject.toml uv.lock CHANGELOG.md changelog.d"
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine US
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false
  Baseline:
    needs: ReleaseLock
    name: Full Suite - Baseline (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
      # Two batch subprocesses per runner while its memory allows (see
      # test_batched.py): 32% fewer runner-minutes, same cases, no shutdowns.
      POLICYENGINE_BATCH_WORKERS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          # One state per batch subprocess, over four runners. The job's
          # POLICYENGINE_BATCH_WORKERS overrides --workers 1, and runner memory
          # decides whether two run at once. The former NY/OH/OK process peaked
          # at 15.1 GB (run 36930199045).
          - group: states-shard-1
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 1/4
          - group: states-shard-2
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 2/4
          - group: states-shard-3
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 3/4
          - group: states-shard-4
            cmd: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 4/4
          - group: irs
            cmd: make test-yaml-no-structural-other-irs
          - group: household
            cmd: make test-yaml-no-structural-other-household
          - group: ssa-usda
            cmd: make test-yaml-no-structural-other-ssa-usda
          - group: rest-a
            cmd: make test-yaml-no-structural-other-rest-a
          - group: rest-b
            cmd: make test-yaml-no-structural-other-rest-b
          - group: contrib-hhs
            cmd: make test-yaml-contrib-hhs
          - group: reform
            cmd: make test-yaml-reform
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Baseline YAML tests (${{ matrix.group }})
        run: uv run --no-sync ${{ matrix.cmd }}
  HouseholdAPIPartners:
    needs: ReleaseLock
    name: Household API Partners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Household API Partners YAML tests
        run: uv run --no-sync make test-yaml-no-structural-other-partners
  Contrib:
    # Waits for Baseline and skips if it fails, as in pr.yaml.
    needs: [ReleaseLock, Baseline]
    name: Full Suite - Contrib (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
      # Two batch subprocesses per runner while its memory allows (see
      # test_batched.py): 32% fewer runner-minutes, same cases, no shutdowns.
      POLICYENGINE_BATCH_WORKERS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: states-shard-1
            target: test-yaml-structural-heavy-shard-1
          - group: states-shard-2
            target: test-yaml-structural-heavy-shard-2
          - group: states-shard-3
            target: test-yaml-structural-heavy-shard-3
          - group: states-shard-4
            target: test-yaml-structural-heavy-shard-4
          - group: other-shard-1
            target: test-yaml-structural-other
          - group: other-shard-2a
            target: test-yaml-structural-other-shard-2a
          - group: other-shard-2b
            target: test-yaml-structural-other-shard-2b
          - group: other-shard-3
            target: test-yaml-structural-other-shard-3
          - group: congress
            target: test-yaml-structural-congress
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Contrib YAML tests (${{ matrix.group }})
        run: uv run --no-sync make ${{ matrix.target }}
      - name: Run Contrib Python tests
        if: ${{ matrix.group == 'other-shard-1' }}
        run: uv run --no-sync make test-policy-contrib-python
  RestPlan:
    needs: ReleaseLock
    name: Plan Rest Python shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      # A successful release run on main has every shard's JUnit and GNU time
      # reports; a failed one can lack a lost runner's, which would skew the
      # estimates. Without any, the plan counts each file the same.
      - name: Download recent Rest Python timings
        id: timings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow push.yaml \
            --branch main --status success --limit 40 \
            --json databaseId,displayTitle \
            --jq '.[] | select(.displayTitle == "Update PolicyEngine US") | .databaseId') || runs=""
          for run in $(echo "$runs" | head -n 3); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --dir "rest-timings/$run" \
              --pattern 'rest-python-test-timings-*' \
              --pattern rest-variables-test-timings; then
              echo "source=release run $run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf "rest-timings/$run"
          done
          echo "::warning::No Rest Python timing reports found; the plan counts every file the same."
      - name: Plan shards
        id: plan
        env:
          TIMINGS_SOURCE: ${{ steps.timings.outputs.source }}
        run: uv run --no-sync python policyengine_us/tests/rest_python_shards.py plan --timings rest-timings --source "$TIMINGS_SOURCE" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
  RestPython:
    needs: [RestPlan]
    name: Full Suite - Rest (Python shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Plans aim at 25 minutes a shard (26-30 from the October 2026 reports);
    # one made without reports can run longer.
    timeout-minutes: 90
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.RestPlan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: 1
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      VECLIB_MAXIMUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each planned process runs files of one group, one process at a time.
      # SPM simulation/API contracts stay in the Microsimulation job.
      - name: Run remaining Python tests
        if: ${{ !cancelled() && steps.system-ca.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
          REST_PYTHON_PROCESSES: ${{ matrix.processes }}
        run: uv run --no-sync python policyengine_us/tests/rest_python_shards.py run --report-dir .
      - name: Upload Rest Python timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-python-test-timings-shard-${{ matrix.shard }}
          path: |
            rest-python-*.xml
            rest-python-*-resources.txt
      - name: Run tests/variables YAML tests
        if: ${{ !cancelled() && steps.system-ca.outcome == 'success' && matrix.variables }}
        env:
          PYTEST_ADDOPTS: "--durations=0 --junitxml=rest-variables.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o rest-variables-resources.txt uv run --no-sync make test-yaml-variables
      - name: Upload Rest variables timing and memory reports
        if: ${{ always() && matrix.variables }}
        uses: actions/upload-artifact@v4
        with:
          name: rest-variables-test-timings
          path: |
            rest-variables.xml
            rest-variables-resources.txt
  Rest:
    needs: [RestPlan, RestPython]
    # Runs after a failed plan or shard, but not when the plan was skipped (a
    # failed release lock) or the run is cancelled. always() kept this runner
    # alive after cancellation.
    if: |
      !cancelled()
      && (needs.RestPlan.result != 'skipped')
      && (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    name: Full Suite - Rest (Python + variables)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all Rest jobs succeeded
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.RestPlan.result }}
          PYTHON_RESULT: ${{ needs.RestPython.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$PYTHON_RESULT" != "success" ]]; then
            echo "::error::Rest jobs did not all succeed: plan=$PLAN_RESULT, shards=$PYTHON_RESULT"
            exit 1
          fi
  Microsimulation:
    needs: ReleaseLock
    name: Full Suite - Microsimulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Keep simulation/API and dataset compatibility on this existing runner.
      # Use separate, sequential processes: combining these suites in one
      # pytest process previously accumulated enough memory to kill the runner.
      - name: Run SPM Python tests
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-spm.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-spm-resources.txt uv run --no-sync make test-other-python-spm
      - name: Run microsimulation tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() && steps.system-ca.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-microsimulation.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-microsimulation-resources.txt uv run --no-sync make test-microsimulation
      - name: Upload simulation timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-timings
          path: |
            simulation-*.xml
            simulation-*-resources.txt
  Publish:
    runs-on: ubuntu-24.04
    # Oct 6-8: 25 runs, max 1.3 min.
    timeout-minutes: 20
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    needs: [ReleaseLock, ReleaseLockTests, Baseline, HouseholdAPIPartners, Contrib, RestPlan, RestPython, Rest, Microsimulation]
    # PyPI trusted publishing: PyPI accepts uploads only from this workflow in
    # the pypi environment, which is limited to main. No stored PyPI token.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Update system certificate authorities
        id: system-ca
        uses: ./.github/actions/setup-system-ca
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - name: Check committed registry lock before publication
        run: python .github/release_lock.py --committed
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Build package
        run: uv run --no-sync make
      - name: Record and verify release build
        run: uv run --no-sync python .github/release_build.py
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
