name: Push
on:
  push:
    branches: [main]

jobs:
  ReleaseLock:
    name: Check committed registry lock
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: 29 runs, max 0.4 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock
        run: python .github/release_lock.py --committed
  ReleaseLockTests:
    name: Release lock guard tests
    runs-on: ubuntu-latest
    # Oct 6-8: 104 successful runs, max 1.4 min; one hung run failed at 45 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Test guard without importing the country model
        env:
          RELEASE_LOCK_REAL_UV: "1"
        run: python -m unittest discover -s .github/tests -p 'test_release_*.py' -v
  Lint:
    needs: ReleaseLock
    runs-on: ubuntu-latest
    # Oct 6-8: 28 runs, max 0.7 min.
    timeout-minutes: 10
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
  versioning:
    needs: ReleaseLockTests
    name: Update versioning
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && !(github.event.head_commit.message == 'Update PolicyEngine US')
    runs-on: ubuntu-latest
    # Oct 6-8: successful runs max 4.5 min, any run max 12 min.
    timeout-minutes: 20
    steps:
      # When several PRs merge before this job gets a runner, only the newest
      # merge can push a version bump: the others would commit on a stale
      # parent and fail on push. The newest merge's job consumes every pending
      # changelog fragment (towncrier builds all of changelog.d), so an older
      # job has nothing left to do. It skips only when GitHub's compare API
      # says main is strictly ahead of this commit (status "ahead": this
      # commit is an ancestor of main and main has more). Any other answer
      # (identical, behind, diverged) or a failed lookup runs versioning as
      # before, so a stale read can never suppress the newest merge's bump.
      - name: Skip if main already contains this commit and more
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status); then
            echo "::warning::Could not compare this commit with main; running versioning anyway."
            status=unknown
          fi
          if [ "$status" = "ahead" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versioning superseded::main already contains ${GITHUB_SHA} and newer commits. The versioning job for main's newest merge bumps the version once with every pending changelog fragment, including this commit's. If that job fails, re-run it."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub App token
        if: steps.head.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        if: steps.head.outputs.current == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install uv
        if: steps.head.outputs.current == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Check committed registry lock before bump
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --committed
      - name: Bump version once
        if: steps.head.outputs.current == 'true'
        run: python .github/bump_version.py
      - name: Build changelog with isolated registry tooling
        if: steps.head.outputs.current == 'true'
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          env = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith(("UV_", "PIP_"))
          }
          subprocess.run(
              [
                  "uv", "--no-config", "tool", "run", "--isolated",
                  "--no-env-file", "--no-sources",
                  "--default-index", "https://pypi.org/simple",
                  "--python", sys.executable,
                  "towncrier", "build", "--yes", "--version", version,
              ],
              env=env,
              check=True,
          )
          PYTHON
      - name: Refresh and check release version in registry lock
        if: steps.head.outputs.current == 'true'
        run: python .github/release_lock.py --refresh
      - name: Update changelog
        if: steps.head.outputs.current == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: "pyproject.toml uv.lock CHANGELOG.md changelog.d"
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine US
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false
  Baseline:
    needs: ReleaseLock
    name: Full Suite - Baseline (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Two or three groups in sequence: historical medians about 54-66
    # minutes per runner (household + ssa-usda projected at about 60 after
    # the household split; about 22 for rest-a + rest-b).
    timeout-minutes: 120
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five runners, grouped by name, run their groups one after another
          # with one worker each. The states shards still run one state per
          # subprocess: the former NY/OH/OK process peaked at 15.1 GB (run
          # 36930199045).
          - group: states-shard-1 + states-shard-2
            group1: states-shard-1
            cmd1: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 1/4
            group2: states-shard-2
            cmd2: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 2/4
          - group: states-shard-3 + states-shard-4
            group1: states-shard-3
            cmd1: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 3/4
            group2: states-shard-4
            cmd2: python policyengine_us/tests/test_batched.py policyengine_us/tests/policy/baseline/gov/states --mode per-subdir --workers 1 --shard 4/4
          - group: household + ssa-usda
            group1: household
            cmd1: make test-yaml-no-structural-other-household
            group2: ssa-usda
            cmd2: make test-yaml-no-structural-other-ssa-usda
          - group: contrib-hhs + irs + reform
            group1: contrib-hhs
            cmd1: make test-yaml-contrib-hhs
            group2: irs
            cmd2: make test-yaml-no-structural-other-irs
            group3: reform
            cmd3: make test-yaml-reform
          - group: rest-a + rest-b
            group1: rest-a
            cmd1: make test-yaml-no-structural-other-rest-a
            group2: rest-b
            cmd2: make test-yaml-no-structural-other-rest-b
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Baseline YAML tests (${{ matrix.group1 }})
        run: uv run --no-sync ${{ matrix.cmd1 }}
      # Later groups still run after an earlier group fails, but not after
      # the run is cancelled.
      - name: Run Baseline YAML tests (${{ matrix.group2 }})
        if: ${{ !cancelled() && matrix.cmd2 }}
        run: uv run --no-sync ${{ matrix.cmd2 }}
      - name: Run Baseline YAML tests (${{ matrix.group3 }})
        if: ${{ !cancelled() && matrix.cmd3 }}
        run: uv run --no-sync ${{ matrix.cmd3 }}
  HouseholdAPIPartners:
    needs: ReleaseLock
    name: Household API Partners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Household API Partners YAML tests
        run: uv run --no-sync make test-yaml-no-structural-other-partners
  Contrib:
    needs: ReleaseLock
    name: Full Suite - Contrib (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Two or three groups in sequence: historical medians 47-74 minutes per
    # runner.
    timeout-minutes: 120
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four runners, grouped by name, run their groups one after another.
          - group: states-shard-1 + states-shard-2
            group1: states-shard-1
            target1: test-yaml-structural-heavy-shard-1
            group2: states-shard-2
            target2: test-yaml-structural-heavy-shard-2
          - group: states-shard-3 + states-shard-4
            group1: states-shard-3
            target1: test-yaml-structural-heavy-shard-3
            group2: states-shard-4
            target2: test-yaml-structural-heavy-shard-4
          - group: other-shard-1 + other-shard-2a
            group1: other-shard-1
            target1: test-yaml-structural-other
            group2: other-shard-2a
            target2: test-yaml-structural-other-shard-2a
          - group: other-shard-2b + other-shard-3 + congress
            group1: other-shard-2b
            target1: test-yaml-structural-other-shard-2b
            group2: other-shard-3
            target2: test-yaml-structural-other-shard-3
            group3: congress
            target3: test-yaml-structural-congress
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      - name: Run Contrib YAML tests (${{ matrix.group1 }})
        run: uv run --no-sync make ${{ matrix.target1 }}
      - name: Run Contrib Python tests
        if: ${{ matrix.group1 == 'other-shard-1' }}
        run: uv run --no-sync make test-policy-contrib-python
      # Later groups still run after an earlier group fails, but not after
      # the run is cancelled.
      - name: Run Contrib YAML tests (${{ matrix.group2 }})
        if: ${{ !cancelled() && matrix.target2 }}
        run: uv run --no-sync make ${{ matrix.target2 }}
      - name: Run Contrib YAML tests (${{ matrix.group3 }})
        if: ${{ !cancelled() && matrix.target3 }}
        run: uv run --no-sync make ${{ matrix.target3 }}
  RestPython:
    needs: ReleaseLock
    name: Full Suite - Rest (Python, shard-1 + variables)
    runs-on: ubuntu-latest
    # Historical group times, including variables: 33-46 minutes plus setup.
    timeout-minutes: 90
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      VECLIB_MAXIMUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each group remains a separate, sequential process on its runner.
      # SPM simulation/API contracts stay in the Microsimulation job.
      - name: Run remaining Python tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
        run: uv run --no-sync make test-other-python-rest REST_PYTHON_SHARD=1 REST_REPORT_DIR=.
      - name: Upload Rest Python timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-python-test-timings-shard-1
          path: |
            rest-python-*.xml
            rest-python-*-resources.txt
      - name: Run tests/variables YAML tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 --junitxml=rest-variables.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o rest-variables-resources.txt uv run --no-sync make test-yaml-variables
      - name: Upload Rest variables timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-variables-test-timings
          path: |
            rest-variables.xml
            rest-variables-resources.txt
  Rest:
    needs: [RestPython]
    name: Full Suite - Rest (Python + variables)
    runs-on: ubuntu-latest
    # Historical group times: 32-46 minutes plus setup.
    # This runner also retains the legacy summary check, keeping PRs at 16 runners.
    timeout-minutes: 90
    # Runs after a shard-1 failure but stops when the run is cancelled.
    # always() kept this runner alive after cancellation.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      VECLIB_MAXIMUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Each group remains a separate, sequential process on its runner.
      # SPM simulation/API contracts stay in the Microsimulation job.
      - name: Run remaining Python tests
        id: python_tests
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v -p no:unraisableexception -p no:threadexception"
        run: uv run --no-sync make test-other-python-rest REST_PYTHON_SHARD=2 REST_REPORT_DIR=.
      - name: Upload Rest Python timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-python-test-timings-shard-2
          path: |
            rest-python-*.xml
            rest-python-*-resources.txt
      - name: Check all Rest jobs succeeded
        if: always()
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.RestPython.result }}
          SHARD_RESULT: ${{ steps.python_tests.outcome }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Rest shards did not all succeed: shard-1=$PYTHON_RESULT, shard-2=$SHARD_RESULT"
            exit 1
          fi
  Microsimulation:
    needs: ReleaseLock
    name: Full Suite - Microsimulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    env:
      PYTHONUNBUFFERED: 1
      PYTEST_ADDOPTS: "--durations=25 -p no:unraisableexception -p no:threadexception"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Resolve latest compatible PolicyEngine Core
        run: uv lock --upgrade-package policyengine-core
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Turn off default branching
        shell: bash
        run: bash ./update_itemization.sh
      # Keep simulation/API and dataset compatibility on this existing runner.
      # Use separate, sequential processes: combining these suites in one
      # pytest process previously accumulated enough memory to kill the runner.
      - name: Run SPM Python tests
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-spm.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-spm-resources.txt uv run --no-sync make test-other-python-spm
      - name: Run microsimulation tests
        # Continue after failures, but stop when the workflow is cancelled.
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "--durations=0 -v --junitxml=simulation-microsimulation.xml -p no:unraisableexception -p no:threadexception"
        run: /usr/bin/time -v -o simulation-microsimulation-resources.txt uv run --no-sync make test-microsimulation
      - name: Upload simulation timing and memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-timings
          path: |
            simulation-*.xml
            simulation-*-resources.txt
  Publish:
    runs-on: ubuntu-24.04
    # Oct 6-8: 25 runs, max 1.3 min.
    timeout-minutes: 20
    if: |
      (github.repository == 'PolicyEngine/policyengine-us')
      && (github.event.head_commit.message == 'Update PolicyEngine US')
    needs: [ReleaseLock, ReleaseLockTests, Baseline, HouseholdAPIPartners, Contrib, RestPython, Rest, Microsimulation]
    # PyPI trusted publishing: PyPI accepts uploads only from this workflow in
    # the pypi environment, which is limited to main. No stored PyPI token.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Check committed registry lock before publication
        run: python .github/release_lock.py --committed
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Build package
        run: uv run --no-sync make
      - name: Record and verify release build
        run: uv run --no-sync python .github/release_build.py
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
