name: US10783 parameter validation
run-name: US10783 Core 3.36.0 validation at 561afc5
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    if: >-
      github.repository == 'PolicyEngine/policyengine-us' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/us10783-core336-validation-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: us10783-parameter-validation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Reserve the artifact window
        run: echo "US10783_STOP_AT=$(( $(date +%s) + 1020 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the bootstrap interpreter
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"
      - name: Qualify one image and export parameters serially
        timeout-minutes: 17
        run: >-
          "${{ steps.python.outputs.python-path }}" -B -S
          .github/us10783-validation/remote.py run
          --repo "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/us10783-validation"
      - name: Preserve complete or failed validation evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: us10783-core336-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/us10783-validation/artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
