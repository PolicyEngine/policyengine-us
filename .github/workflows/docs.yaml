name: Round 4 individual Python checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Round4Python:
    name: Round 4 individual Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTEST_ADDOPTS: "--durations=25"
    steps:
      - name: Checkout assigned branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.13"
      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked --extra dev
      - name: Record Python and dependency versions
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata
          import json
          import platform

          print(json.dumps({
              "python": platform.python_version(),
              "core": importlib.metadata.version("policyengine-core"),
              "filelock": importlib.metadata.version("filelock"),
          }))
          PY
      - name: Run medical premium conservation tests
        run: uv run --no-sync python -m pytest -q policyengine_us/tests/core/test_medical_expense_premium_conservation.py
      - name: Run Idaho health insurance premium tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --no-sync python -m pytest -q policyengine_us/tests/core/test_id_health_insurance_premiums.py
